# 세렌 계약민 출신 (seren_bonded)의 물건. 값은 동화 (은화 1 = 동화 12, 금화 1 = 동화 240). ration은 정의하지 않는다.
# read.D는 읽고쓰기 문턱이다: 숫자만 읽는 눈(8)에는 숫자만 보이고, 잔향의 각성 뒤 첫 밤(20)부터 계약서의 낱말이 읽힌다.
# {read|…}로 감싼 낱말은 읽고쓰기 30 아래에서 가려진다 — 계산지는 숫자로만 말한다.
goods:
  o5_contract:
    name: 계약서 사본
    desc: "카셀론 해운과 아버지 펠의 계약서 사본. 바닷물에 몇 번 젖었다 말랐다. 맨 아래에 엄지 자국 둘 — 아버지 것과 네 것"
    price: 0
    tags: [문서, 증서]
    read:
      D: 20
      facts: [fact_o5_succession_early]
      text: "카셀론 해운 계약 — 갑판 노동. 계약민 펠, 빚 31. 노임은 노임 패에 새긴다. 계약 외 시간의 숙식비는 빚에 더한다. 승계: AS 308 긴밤월 11일, 승계자 펠의 자식. 등록: 마르셀. 맨 아래 엄지 둘."
  o5_levy_sheet:
    name: 분담금 계산지
    desc: "장부에 끼우지 않고 따로 쓴 종이 한 장. 줄마다 같은 숫자가 있고, 맨 아래에 숫자가 셋"
    price: 0
    tags: [문서, 숨길수있음]
    illegal: true
    visibility: 숨김
    read:
      D: 8
      facts: [fact_o5_levy_double]
      text: "{read|줄} 112. {read|줄마다} 7. {read|합계} 784. {read|카셀론} 392. {read|이름 없는 줄} 392."
