# 회색여울의 물건과 값 (WORLD_BIBLE §7.1 기준, 값은 동화 단위: 은화 1닢 = 동화 12닢). 28 진행 루프의 '사기·먹기·쓰기'.
# 굶주림월(12월)에는 먹을 것 값이 세 배 (§7.2 흉년). 인간이 은화(동화 12닢 이상)를 지니면 절도 의심 — 점호 몸수색에 걸린다.
# 인간 농노가 가질 수 있는 돈은 거의 없다 — 부츠 속 동화 3닢이 시작이다. 값은 흥정(호감·신뢰)과 평판(그 사람 집단의 시선)으로 ±20%.
# illegal: 인간이 지니면 죄 (§7.1 단검 = 사형감). 장물아비(fence)만 판다 — 값은 두 배, 그리고 그는 당신이 무엇을 샀는지 안다.
goods:
  bread:        {name: 보리빵 한 덩이, desc: "보리 겨가 반은 섞인 빵. 굶는 곳에서는 말보다 크다", price: 1, tags: [음식], eat: {hunger: -1}}
  porridge:     {name: 귀리죽 한 그릇, desc: "묽은 귀리죽. 그릇째 들고 마신다", price: 1, tags: [음식], eat: {hunger: -1}}
  eel:          {name: 훈제 장어 한 토막, desc: "여울강 장어를 연기에 그을렸다. 짜고 기름지다 — 이틀은 버틴다", price: 6, tags: [음식], eat: {hunger: -2}}
  beer:         {name: 묽은 맥주 한 잔, desc: "물보다 조금 나은 맥주. 아픔이 조금 무뎌진다", price: 1, tags: [술], eat: {pain: -5}}
  poultice:     {name: 쑥 찜질약, desc: "쑥을 찧어 천에 싼 것. 채찍 자국에 얹는다", price: 4, tags: [치료], use: {pain: -20}}
  willow_bark:  {name: 버드나무 껍질 달인 물, desc: "쓰다. 열과 욱신거림이 가라앉는다", price: 3, tags: [치료], use: {pain: -10}}
  rope:         {name: 삼 밧줄 열 걸음, desc: "삼으로 꼰 밧줄, 열 걸음 길이. 갈고리와 함께면 담을 넘는다", price: 6, tags: [밧줄, 도구]}
  hook:         {name: 쇠갈고리, desc: "대장간에서 두드린 세 갈래 쇠갈고리. 밧줄 끝에 맨다", price: 12, tags: [도구, 갈고리]}
  candle:       {name: 수지 양초, desc: "짐승 기름으로 만든 양초. 그을음이 많고 금방 탄다", price: 2, tags: [광원]}
  knife:        {name: 녹슨 접이칼, desc: "날이 이 빠지고 녹슬었다. 인간이 지니면 사형감 — 그래도 칼이다", price: 72, tags: [무기, 날붙이, 숨길수있음], illegal: true, visibility: 숨김}
  light_letter: {name: 빛의 서신 조각, desc: "불에 그을린 서신 한 귀퉁이. 글씨가 촘촘하다", price: 0, tags: [문서, 금서, 숨길수있음], illegal: true, visibility: 숨김, read: {D: 30, facts: [fact_gf_osric_broken_ring], text: "'빛은 사슬을 녹이지 않는다. 사슬을 찬 손을 비출 뿐이다.' 맨 아래, 안식일 밤 열 시. 납골실."}}
  henrik_ledger: {name: 헨릭의 진짜 장부, desc: "셈집 서랍 깊숙이 있던 얇은 장부. 숫자가 두 줄씩 적혔다", price: 0, tags: [문서, 숨길수있음], illegal: true, read: {D: 25, facts: [fact_gf_henrik_skims_baron, fact_gf_henrik_seren_account], text: "숫자 두 줄. 남작에게 올린 것과 실제로 거둔 것. 차액 옆에 같은 이름이 매달 — 세베로. 세렌."}}
  sale_list:    {name: 2차 매각 명단 초안, desc: "이름이 줄줄이 적힌 종이. 군데군데 칼로 긁은 자국", price: 0, tags: [문서, 숨길수있음], illegal: true, read: {D: 20, facts: [fact_gf_sara_on_sale_list, fact_gf_martha_swapped_list], text: "서른한 줄. 열일곱째 줄에 사라. 마지막 줄은 칼로 긁어낸 자국 — 긁힌 자리 밑에 희미하게 '리즈'."}}
  tribute_copy: {name: 공물 명단 사본, desc: "공물 명단을 베낀 종이. 줄 그은 이름이 많다", price: 0, tags: [문서, 숨길수있음], illegal: true, read: {D: 10, facts: [fact_lu_alberic_cell9], text: "마흔 줄. 줄 그은 이름 열둘. 맨 아래 지워지지 않은 이름 하나 — 알베릭, 침묵의 우물 9번 독방. 자정 기도 사십 분."}}
  lea_report:   {name: 레아의 방관 보고서, desc: "용언으로 쓴 보고서. 봉인이 뜯겼다", price: 0, tags: [문서, 숨길수있음], illegal: true, read: {D: 10, lang: 용언, langD: 30, facts: [fact_gf_lea_report_route], text: "용언 보고서. '사령관은 10월 3일 밤 북문 망루를 비웠다.' 맨 아래 — 매달 25일, 역참 우편함. 전서구는 열흘에 한 번."}}
  forged_pass:  {name: 위조 통행증, desc: "통행증. 인장이 조금 번졌다 — 눈 밝은 경비에게는 들킨다", price: 120, tags: [문서, 통행증, 위조], illegal: true, visibility: 숨김}
shops:
  npc_bram:  {sells: [porridge, bread, beer], note: "죽은 배급이지만 한 그릇 더는 값을 받는다 — 지하실 손님들 몫이 모자라서"}
  npc_elsa:  {sells: [poultice, willow_bark], note: "약을 살 돈이 없는 사람에게는 외상 — 게르다처럼"}
  npc_bran:  {sells: [hook, rope, candle], note: "칼은 팔지 않는다. 인간에게 칼을 팔면 그도 교수대다"}
  npc_hagen: {sells: [rope, eel, knife], fence: true, note: "웃으며 판다 — 그리고 누구에게 무엇을 팔았는지 볼크에게 판다"}
  npc_henrik: {sells: [forged_pass], fence: true, note: "통행증은 셈집 서랍에서 나온다"}
ration:
  at: gf_rooster
  from: "18:00"
  to: "20:30"
  food: {hunger: -1}
  note: "하루 한 번 저녁 배급 (굶주림월부터는 아침 죽이 끊긴다 — REGIONS 12.1)"
