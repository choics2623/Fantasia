# 잿불 광산 노예 (SCENARIOS O-02)의 장면이 가르치는 사실 (22 §1.2, 08 §3.3). id 규칙: fact_o2_<주제>.
# text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사. 기존 사실(fact_eh_*, fact_em_*)은 고치지 않고 쓴다.
# ── 흑점과 공급 ──
- id: fact_o2_black_marks
  text: "잿불 본갱의 흑점: 할당을 못 채우거나 새벽 점호에 빠진 날마다 점호 마당 번호판의 번호 옆에 숯 점이 하나 찍힌다. 숯 점이 넷이 된 번호는 그락스가 새벽 점호에서 공급 명단에 올린다 — 광부들이 하층 공방이라 부르는 은비늘 요람으로"
  truth: true
  danger: 2
  names: [그락스, 은비늘 요람, 하층 공방]
- id: fact_o2_supply_night
  text: "공급 명단에 오른 번호는 그날 밤 쇠눈 크롬과 요람의 경비가 굴에서 데려간다. 하층 공방에서 올라온 번호는 없다"
  truth: true
  danger: 2
  names: [크롬, 하층 공방]
# ── 다라의 매듭끈 ──
- id: fact_o2_dara_cord
  text: "숯막의 어미들은 다라의 매듭끈을 손목에서 손목으로 넘긴다. 매듭 하나가 다라의 노래 한 줄이다. 글이 아니어서 재의 법에 걸리지 않는다. 끈의 마지막 매듭은 아무도 풀지 못했다"
  truth: true
  danger: 2
  names: [다라, 숯막]
- id: fact_o2_dara_hands
  text: "다라의 매듭끈 첫 매듭들은 AS 100 무렵 붉은 손 다라가 붉은 흙을 바른 손으로 직접 묶었다. 그 손은 왼손 엄지에 굳은살이 두 겹이었다 — 곡괭이 자루를 거꾸로 쥐는 버릇 때문에"
  truth: true
  danger: 3
  names: [다라]
- id: fact_o2_cord_lines
  text: "다라의 매듭끈 첫 세 매듭은 다라의 노래 첫 절이다 — '붉은 흙을 손에 바르고, 벽에 손을 두고, 다 셀 때까지 떼지 마라'"
  truth: true
  danger: 2
  names: [다라]
- id: fact_o2_last_knot
  text: "숯막에 전하는 말: 다라의 매듭끈 마지막 매듭은 다라가 붉은 길에 서기 전날 밤 '다음 사람에게' 묶었다. 그래서 아무도 풀지 못한다"
  truth: true
  danger: 3
  names: [다라, 붉은 길]
# ── 낙반과 요람 ──
- id: fact_o2_west_drift
  text: "낙엽월 첫날 교대 종 직전, 본갱 중층 4번 막장 서쪽 갱도가 무너진다. 셋째 갱목 기둥이 속부터 썩어 있었다. 무너진 자리에서 붉은 철 광맥이 드러난다"
  truth: true
  danger: 1
  names: [중층 4번 막장]
- id: fact_o2_vessel_lives
  text: "은비늘 요람의 이식대에서 용의 심장 조각을 받고 살아난 광부가 있다. 요람의 장부에는 '종료'로 적혔으나 시체는 소각로에 닿지 않았다"
  truth: true
  danger: 5
  names: [은비늘 요람]
