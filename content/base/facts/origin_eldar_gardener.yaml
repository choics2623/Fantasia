# 엘다르 정원지기 (O-03, creation/origins_eldar_gardener.yaml)의 장면이 가르치는 사실. id 규칙: fact_o3_<주제>.
# text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사.
# 주의: learn()은 사실 글에 숨은 장소 이름의 첫 낱말이 나오면 그 장소를 알게 한다 — 그래서 '이슬'(이슬 복원실)·'침묵의'(그루터기)를 일부러 쓰지 않는다.
- id: fact_o3_bells
  text: "테라스 위 단에서 일하는 정원지기는 발목에 금방울을 단다 — 엘다르는 인간을 보기 전에 듣고 싶어 한다. 고리는 은못으로 박혀 있어 정원지기 손으로는 떼지 못한다"
  truth: true
  danger: 0
  names: [금방울]
- id: fact_o3_inner_garden
  text: "'안쪽 정원'(정원지기 숙소의 어른들은 '아픈 곳'이라 부른다)으로 불려 간 정원지기는 돌아와도 무언가를 두고 오거나, 돌아오지 않는다"
  truth: true
  danger: 2
  names: [안쪽 정원]
- id: fact_o3_offbeat_rule
  text: "정원의 법: 움직임이 세 번 어긋나면 수호자가 '정지'를 건다. 정지가 두 번이면 관리장의 장부에서 번호가 '이송' 칸으로 옮겨진다 — 안쪽 정원으로 가는 줄이다"
  truth: true
  danger: 2
  names: [정지, 이송]
- id: fact_o3_first_verse
  text: "새벽마다 엘다르가 부르는 '첫 아침의 노래'에는 '…마지막 말이 모든 이름을 말하는 날…'이라는 구절이 있다 — 엘다르의 예언이 노래 속에 들어 있다. 정원지기는 그 뜻을 알아서는 안 된다"
  truth: true
  danger: 4
  names: [첫 아침의 노래]
- id: fact_o3_measure_day
  text: "낙엽월 4일 아침, 영혼 정원의 수정 기둥 사이에서 '무게를 재는 날'이 있다 — 정원지기를 물 없는 은 수반 앞에 세워 '잔향의 무게'를 잰다. 평범한 사람은 무게가 없어 바늘이 움직이지 않는다"
  truth: true
  danger: 4
  names: [영혼 정원, 은 수반]
- id: fact_o3_unending
  text: "존속파 엘다르가 정원지기의 무게를 재는 것은 '끝나지 않는 것'을 찾아 옮기기 위해서다 — 그들이 찾는 것은 사람 하나가 아니라 사람 안의 무언가 하나다"
  truth: true
  danger: 4
  names: [존속파]
- id: fact_o3_measure_takes
  text: "은 수반은 무게 없는 영혼을 그냥 지나보내지 않는다 — 가장 늦게 쥐여 준 이름부터 한 줌을 쥐고 놓는다. 말린 기억꽃을 혀 밑에 물고 서면 바늘이 흐려지고, 이름이 덜 빠진다"
  truth: true
  danger: 3
  names: [은 수반, 기억꽃]
- id: fact_o3_returned_no_pitch
  text: "안쪽 정원에서 돌아온 정원지기는 정원지기들이 몰래 부르는 노래에서 제 음을 잃고 돌아온다. 반장 로렌은 사람을 음으로 세기에 누가 비어서 왔는지 안다"
  truth: true
  danger: 3
  names: [로렌]
- id: fact_o3_needle_turns
  text: "은 수반의 바늘은 방울(은방울 뜰의 정원지기)이 앞에 서거나 손을 대면 그쪽으로 돈다 — 평범한 정원지기에게는 없는 무게다. 정원사는 그것을 여든일곱 번의 실패 뒤의 여든여덟째라 부를 것이다"
  truth: true
  danger: 5
  names: [은 수반]
- id: fact_o3_fold_path
  text: "영혼 정원으로 가는 안개 숲길은 존속파의 각인으로 접혀 있다 — 엘다르 곁에서 걸으면 반 시진, 혼자 걸으면 하루가 걸린다. 엘다르가 지나간 뒤 한동안은 접힌 채로 남는다"
  truth: true
  danger: 2
  names: [영혼 정원]
