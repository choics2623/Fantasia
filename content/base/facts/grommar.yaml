# 그롬마르 붉은 황야의 사실 (22_NPC_PERSONA.md §1.2, 08 §3.3)
# id 규칙: fact_gm_<주제>. text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사.
- id: fact_gm_red_milk_ritual
  text: "그롬의 '혈명 없는 혈명'은 해방이 아니다. 100승을 거둔 인간 투사에게 그롬 분노샘에서 짠 '붉은 젖'을 먹여 중독시키는 의식이다. 인간 몸은 그 피를 품지 못해, 끊으면 금단으로 무너지고 싸워야만 다음 잔을 받는다. 우르가쉬는 이것이 명예라고 진심으로 믿는다"
  truth: true
  danger: 5
  names: [붉은 젖]
- id: fact_gm_tal_alive_chained
  text: "백승의 탈은 황무지로 걸어 들어가지 않았다. 눈이 멀고 쇠사슬에 묶인 채 뼈의 전당 지하에서 살아 있으며, 우르가쉬와 매일 밤 대련한다. 원형장 옆의 탈의 무덤은 비어 있다"
  truth: true
  danger: 5
  names: [탈]
- id: fact_gm_urgash_loves_tal
  text: "우르가쉬는 탈을 피의 형제로 사랑한다(그롬식으로). 탈과의 밤 대련이 그의 유일한 '진짜 싸움'이며, 붉은 젖이 끊기면 탈이 무너지므로 그는 하루도 대련을 거르지 않는다"
  truth: true
  danger: 3
  names: [탈]
- id: fact_gm_tal_told_gunnar_run
  text: "AS 273 뼈의 전당 지하에 숨어든 군나르는 사슬에 묶인 탈을 보았다. 탈은 그에게 '도망쳐라, 99에서 멈춰라'고 말했고, 군나르는 이듬해 100승 직전에 탈주했다"
  truth: true
  danger: 3
  names: [군나르, 탈]
- id: fact_gm_tal_true_name_under_altar
  text: "탈의 진짜 이름(인간의 이름)은 빈 무덤의 봉헌대 밑돌에 새겨져 있다. 탈은 그 이름을 입에 올리지 않는다"
  truth: true
  danger: 2
  names: [탈]
- id: fact_gm_mara_three_names
  text: "마라의 87승 중 3승은 같은 막사 동료를 상대로 한 것이었다. 마라는 그들의 이름을 왼팔 안쪽에 새겼다"
  truth: true
  danger: 2
  names: [마라]
- id: fact_gm_gorba_seeks_gunnar_disciple
  text: "고르바는 마라의 100승 시합 상대로 '도망친 99승(군나르)의 제자'를 찾고 있다. 그 소식이 군나르에게 닿으면 회색여울에 그롬 추적대가 온다"
  truth: true
  danger: 4
  names: [고르바, 군나르]
- id: fact_gm_gorba_rigged_bouts
  text: "고르바는 마라의 87승 중 열한 경기에서 상대를 미리 약하게 만들었다(상처 방치, 먹이에 독). 마라는 모른다"
  truth: true
  danger: 3
  names: [고르바, 마라]
- id: fact_gm_gorba_buys_relics
  text: "고르바는 마지막 등불의 고물상 튀크에게서 황무지 유물을 사들인다. 그롬이 경멸하는 돈 대신 이빨과 투사 몇 명으로 값을 치른다"
  truth: true
  danger: 1
  names: [튀크]
- id: fact_gm_murk_toy_horse
  text: "무르크는 AS 280 인간 마을 습격에서 아이를 죽이기 직전, 아이가 내민 나무 장난감 말을 받아 들고 돌아섰다. 그 뒤 한 번도 싸우지 않았고, 그 장난감 말을 목에 걸고 있다. 아이의 생사는 모른다"
  truth: true
  danger: 2
  names: [무르크]
- id: fact_gm_murk_urgash_brothers
  text: "무르크와 우르가쉬는 같은 어미에게서 난 형제다(형이 우르가쉬). 우르가쉬가 무르크를 죽이지 않고 바닥 청소부로 강등한 까닭이 이것이다. 원형장은 이 혈연을 모른다"
  truth: true
  danger: 4
  names: [우르가쉬, 무르크]
- id: fact_gm_murk_hears_chains
  text: "원형장 지하 배수로 한 곳이 뼈의 전당 지하 감방 벽과 맞닿아 있어, 무르크는 밤마다 쇠사슬 소리와 대련 소리를 듣는다"
  truth: true
  danger: 3
  names: [무르크]
- id: fact_gm_ulb_holds_cell_key
  text: "탈이 갇힌 뼈의 전당 지하 감방의 열쇠는 오그림 경비 울브의 목에 걸려 있다. 우둔하다고 믿어져 열쇠를 맡았다. 그는 마라의 경기를 좋아한다"
  truth: true
  danger: 4
  names: [울브]
- id: fact_gm_urgash_red_glass_eye
  text: "우르가쉬의 왼눈 자리의 붉은 유리구슬은 AS 285 말뼈 여울에서 하르칸 화살에 눈을 잃은 뒤 박은 것이다. 구슬은 그의 쇠약이 시작되면 가장 먼저 흐려질 것이라고 그롬 사제들이 말한다"
  truth: true
  danger: 1
  names: []
- id: fact_gm_urgash_first_hit_taken
  text: "AS 309 아침 대련에서 우르가쉬는 처음으로 한 방을 맞고 무릎을 꿇었다. 아는 이는 상대 투사(죽었다)와 탈뿐이다. 그는 쇠약을 숨기고 있다"
  truth: true
  danger: 4
  names: [우르가쉬]
