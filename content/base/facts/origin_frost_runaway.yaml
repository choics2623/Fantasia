  names: []
- id: fact_o7_smuggler_cairns
  text: "물빼기 굴 입구 위 바위 선반에서 남쪽으로 사람이 쌓은 돌무더기가 이어진다 — 요새를 돌아가는 밀수꾼 길이다. 끝은 굶주린 언덕의 세 소나무라고 한다"
  truth: true
  danger: 3
  names: [세 소나무]
- id: fact_o7_fangs_come
  text: "간수가 판 쪽지의 이름과 골짜기를 들고, 송곳니 초소의 사냥꾼들이 밤에 문 앞 무리로 온다. 성벽 그늘 밖은 용좌의 땅이 아니라서 병사들은 보지 않는다. 칸이 비어 있는 노예는 북쪽에 되팔린다"
