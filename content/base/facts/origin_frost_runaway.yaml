  text: "문 닫는 나팔이 울리면 성벽 위에서 겨죽 한 동이가 밧줄에 매달려 문 밖 무리에게 내려온다. 사령관의 명이다 — 장부에는 말먹이로 적힌다"
  truth: true
  danger: 2
  names: []
