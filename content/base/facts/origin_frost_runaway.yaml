  text: "의무실의 마그다는 낙엽월 2일부터 사흘, 문 닫는 나팔 무렵 쪽문으로 나와 문 밖 무리의 언 발을 본다. 사령관이 그 한 시간을 눈감았다"
  truth: true
  danger: 2
  names: [마그다]
- id: fact_o7_drain_breath
  text: "북문 서쪽, 성벽이 바위에 박히는 틈에 성벽 밑으로 들어가는 돌 굴 입구가 있다. 녹슨 쇠창살 안에서 따뜻한 잿물 냄새가 난다 — 안쪽 빨래터로 이어지는 듯하다"
  truth: true
