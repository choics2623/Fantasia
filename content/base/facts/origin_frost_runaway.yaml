  danger: 4
  names: [송곳니]
- id: fact_o7_bonefence_rumor
  text: "문 밖 무리의 뼈울타리 출신 사내가, 돌팔 씨족이 장원에 돌 망치를 모은다고 말했다 — 푸른월에 남쪽으로 내려간다는 말과 함께"
  truth: true
  danger: 4
  names: [돌팔, 뼈울타리]
- id: fact_o7_kaspar_three
  text: "카스파르는 문 밖 무리에게 늘 같은 세 가지를 묻는다 — 어디서 왔나, 누가 길을 열었나, 몇이나 더 오나. 레아가 왼손으로 받아 적는다"
  truth: true
  danger: 2
  names: [카스파르, 레아]
