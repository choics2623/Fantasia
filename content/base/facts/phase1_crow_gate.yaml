# 까마귀 문·용주 역참의 사실 (22_NPC_PERSONA.md §1.2). id 접두사 fact_cg_ (용주 역참 포함).
# text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사.
# ── 까마귀 문: 물빼기 굴과 서리월 ──
- id: fact_cg_drain_lock_loose
  text: "물빼기 굴 철창은 녹슬어 안쪽 고리만 풀면 열린다. 카스파르가 대장간에 수리를 계속 미루게 했다"
  truth: true
  danger: 4
  names: [물빼기 굴]
- id: fact_cg_drain_laundry_exit
  text: "물빼기 굴의 남쪽 출구는 빨래터 구석 수챗구멍이다. 빨래터 여인들이 밤에 철창 소리를 들어도 입을 다문다"
  truth: true
  danger: 3
  names: [빨래터]
- id: fact_cg_drain_report_drawer
  text: "물빼기 굴을 막으라는 서기의 보고서가 사령관실 책상 셋째 서랍에 결재 없이 들어 있다. 서기 슈릭이 사본을 이중바닥에 숨겼다"
  truth: true
  danger: 4
  names: [슈릭]
- id: fact_cg_oct1_closure_order
  text: "서리월 1일의 북문 봉쇄는 용좌의 칙령이 아니라 카스파르의 판단이다. 눈이 오기 전 마지막 정리이며, 봉쇄 뒤에는 물빼기 굴이 유일한 길이 된다"
  truth: true
  danger: 3
  names: [카스파르]
- id: fact_cg_oct3_twelve
  text: "서리월 3일 밤 탈주자 열둘이 물빼기 굴로 들어온다. 넷은 굴 안과 북쪽 입구에서 얼어 죽는다. 카스파르는 그 밤 북문 망루를 비운다"
  truth: true
  danger: 5
  names: [카스파르]
- id: fact_cg_balder_looks_away
  text: "발데르는 서리월 3일 밤 북문 근무자로 서고, 굴 쪽으로 눈을 돌리지 않으라는 말을 받지 않고도 그렇게 한다 — 인간 유모의 젖으로 컸기 때문이다"
  truth: true
  danger: 3
  names: [발데르]
- id: fact_cg_reopen_jan10
  text: "해빙월 10일 북문 재개방은 서리 길이 열리는 날이며, 그날 새벽 카스파르는 이정표까지 혼자 말을 달려 갔다 온다"
  truth: true
  danger: 2
  names: []
# ── 까마귀 문: 군 안 ──
- id: fact_cg_oats_short
  text: "남작령에서 들어오는 귀리는 장부 600섬이 아니라 올해 실제 420섬이다. 보급관 에르빈은 그 차이가 헨릭과 도르반의 장사임을 의심하지만 증거가 없다"
  truth: true
  danger: 3
  names: [에르빈, 헨릭, 도르반]
- id: fact_cg_unpaid_soldiers
  text: "312년분 귀리 대금과 병사 급료가 석 달 밀렸다. 용인 병사 여섯이 탈영을 입에 올렸고, 수비대장 지그문트의 가문이 그 불만을 먹이 삼는다"
  truth: true
  danger: 3
  names: [지그문트]
- id: fact_cg_kaspar_buys_oats
  text: "카스파르는 병사들을 먹이려 사비로 도르반에게서 귀리를 되산다. 값은 장부 값의 세 배이고, 그 돈은 어머니의 유품이 아닌 자기 갑옷의 은 장식을 팔아 만들었다"
  truth: true
  danger: 3
  names: [도르반]
- id: fact_cg_jailer_sells_list
  text: "간수 베른은 수용자의 이름·고향·수를 적은 쪽지를 매 열흘 송곳니 초소의 그로드에게 판다. 바르그가 탈주자의 길을 아는 이유 중 하나다"
  truth: true
  danger: 5
  names: [베른, 그로드]
- id: fact_cg_yost_saw_hagen
  text: "요스트는 포도월 말 회색여울에서 도망쳐 가다 세 소나무에서 하겐이 매듭 끈을 그루터기에 넣는 것을 보았다. 잡힌 뒤 그것을 간수에게 불었다"
  truth: true
  danger: 4
  names: [하겐, 요스트]
- id: fact_cg_ole_pass_route
  text: "올레는 울음 고개 서쪽 비탈로 국경군 망루를 피하는 길을 안다. 눈이 오기 전 한 달만 쓸 수 있다"
  truth: true
  danger: 3
  names: [올레, 울음 고개]
- id: fact_cg_frost_marker_tokens
  text: "서리 길 초입 이정표 밑 돌무더기 속 잿빛 표 여섯 개는 죽은 안내인 프로드의 것이다. 올레의 형이다"
  truth: true
  danger: 3
  names: [프로드, 올레]
- id: fact_cg_sunna_heard_march
  text: "순나는 돌팔 씨족 장원에서 일하며 푸른월에 까마귀 문으로 내려가겠다는 거인들의 이야기를 들었다. 순나의 딸 일다가 열병으로 의무실에 누워 있다"
  truth: true
  danger: 4
  names: [일다, 돌팔]
- id: fact_cg_medic_hidden_boy
  text: "의무실의 마그다가 서리 길에서 동사 직전에 온 소년 토르비(9)를 짐꾼 조카라 속여 짐꾼 막사에 숨겼다. 건초월부터다"
  truth: true
  danger: 3
  names: [토르비]
- id: fact_cg_edda_buries_dead
  text: "에다는 서리 길 초입에서 까마귀가 파먹는 시체를 가을마다 밤에 수레로 끌어와 국경 묘역에 이름 없는 돌무더기로 묻는다. 올해 일곱째다"
  truth: true
  danger: 2
  names: []
- id: fact_cg_raven_loft_pigeons
  text: "까마귀 사육장 밑 비둘기장의 전서구 여섯 마리는 잿불 언덕 쪽 다리끈을 달았다. 레아가 열흘에 한 번 날린다. 에다는 모이 값이 새는 것으로 알아챘다"
  truth: true
  danger: 4
  names: [레아]
- id: fact_cg_drill_saw_fire
  text: "교관 라오그는 AS 309 짐꾼 막사 화재 때 첫 번째로 달려가 카스파르의 왼팔에서 불이 번지는 것을 보았고, '등잔 사고' 보고서에 서명했다"
  truth: true
  danger: 5
  names: [라오그]
- id: fact_cg_crick_network_znik
  text: "까마귀 문 크릭 보조병들이 회색여울 크릭 감독들과 소문을 바꾼다. 카스파르가 매달 15일 혼자 말을 몰고 돌 고리 쪽으로 간다는 이야기가 즈닉에게 새고 있다"
  truth: true
  danger: 4
  names: [즈닉, 카스파르]
- id: fact_cg_porter_april_list
  text: "푸른월 짐꾼 징발 30명의 명단은 짐꾼 반장 군터가 쓴다. 그는 아이 딸린 아비를 빼고 독신과 밀고자 의심자를 넣는다"
  truth: true
  danger: 3
  names: [군터]
- id: fact_cg_porter_phalanx_poles
  text: "AS 306 인간 짐꾼들로 짠 밀집 창진은 아직 살아 있다. 짐꾼 막사 지붕 밑에 병사 창이 아닌 긴 목봉 열두 자루가 감춰져 있다"
  truth: true
  danger: 4
  names: []
- id: fact_cg_brynja_sells_failed_payers
  text: "브린야는 서리 길 안내 값을 내지 못한 탈주자를 북쪽 요툰 노예상에게 되판다. 딸 하나가 요툰 땅에 볼모로 잡혀 있다"
  truth: true
  danger: 4
  names: [브린야]
- id: fact_cg_april_conscription
  text: "푸른월 짐꾼 30명 징발 칙령은 카이도르가 쓴 것이며 레아가 사본을 멜리산드에게 보낸다. 서리왕 남침 소식이 먼저 닿으면 징발은 출병이 된다"
  truth: true
  danger: 4
  names: [카이도르, 레아, 멜리산드]
# ── 용주 역참 ──
- id: fact_cg_seraph_wax_count
  text: "역참장 세라프는 우편함의 봉인을 열지 않는다. 대신 월말에 봉인의 수와 밀랍 색만 장부에 적어 재상 세베린에게 올린다 — 열어서 알게 되는 것이 두렵고, 장부는 변명이 된다"
  truth: true
  danger: 4
  names: [세라프, 세베린]
- id: fact_cg_seraph_debt_dorvan
  text: "세라프는 도르반에게 말 열두 마리 값 빚이 있다. 도르반의 곡물이 역참 창고에 묵는 것을 눈감는 이유다"
  truth: true
  danger: 3
  names: [도르반]
- id: fact_cg_dorvan_oat_receipts
  text: "도르반은 헨릭에게서 국경군 납품 귀리를 사 바알카르 시장에 되판다. 헨릭의 인장이 찍힌 영수 여섯 장이 도르반의 침대 밑 상자에 있다"
  truth: true
  danger: 4
  names: [헨릭]
- id: fact_cg_paul_ledger_copy
  text: "도르반의 계산 노예 파울은 이중 장부 사본을 마차 바닥 판 밑에 숨겨 두었다. 언젠가 자기 값을 치르는 데 쓸 생각이다"
  truth: true
  danger: 3
  names: [파울]
- id: fact_cg_brick_copies_for_fizik
  text: "우편 서기 브릭은 봉인 밑을 증기로 데워 열고 용언 문장을 베껴 바알카르 정보상 피직에게 판다. 뜻은 모르고 글자 모양만 안다"
  truth: true
  danger: 4
  names: [브릭, 피직]
- id: fact_cg_courier_schedule
  text: "멜리산드의 전령 이스멜은 매달 26일 해 뜰 무렵 우편함을 비워 용좌 대로를 따라 바알카르로 간다. 25일 낮 2시부터 26일 새벽까지가 우편함이 열려 있는 틈이다"
  truth: true
  danger: 3
  names: [이스멜, 멜리산드]
- id: fact_cg_post_stable_hideout
  text: "마구간 건초 다락에는 두 사람이 누울 칸이 있다. 마구간 노예 얀이 남쪽으로 가는 사람들을 하룻밤 재운다. 잿빛 실의 한 마디다"
  truth: true
  danger: 4
  names: [얀]
- id: fact_cg_checkpoint_forged_passes
  text: "검문 하사 오르벡은 바알카르에서 흘러온 위조 통행증을 한 장에 은화 2닢에 되판다. 찍는 인장 틀은 바알카르 근위대 쪽에서 나왔다"
  truth: true
  danger: 3
  names: [오르벡]
- id: fact_cg_cook_hears_caravans
  text: "취사장 베타는 호송대와 상인의 말을 다 듣는다. 회색여울 1차 매각 호송 사십 명 가운데 열 살 아래 아이가 둘이라는 것을 호송병에게서 들었다"
  truth: true
  danger: 3
  names: [베타]
