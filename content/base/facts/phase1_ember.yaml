- id: fact_em_sorga_blind_eye
  text: "술집 '숯불' 주인 소르가는 뒷마당 물탱크에 담기는 매듭 끈을 알면서 보지 않는다. 몇 해 전 그 끈의 경고 덕에 그녀의 술집 지하 가스 누출을 피했기 때문이다"
  truth: true
  danger: 3
  names: [소르가, 숯불]
- id: fact_em_nils_courier
  text: "술집 심부름꾼 닐스는 뒷마당 물탱크의 매듭 끈을 수레 바퀴 속에 숨겨 갱 마을로 나른다. 그는 끈 안의 뜻은 모르고 매듭의 수만 센다. 열네 살이다"
  truth: true
  danger: 3
  names: [닐스, 숯불]
# ── 황무지 경계와 두르강 ──
- id: fact_em_evan_true_rate
  text: "재 경계 망루의 측량 말뚝은 최근 석 달 동안 31, 44, 58미터씩 안쪽으로 옮겨졌다. 평균 40미터가 아니라 가속 중이다. 하드리안이 보고를 낮추라고 압박하고 있다"
  truth: true
  danger: 4
  names: [에반 펠, 하드리안, 재 경계 망루]
- id: fact_em_evan_double_book
  text: "에반 펠은 진짜 수치를 방패 속 두꺼운 가죽 아래에 따로 적어 둔다. 공식 기록은 낮춰 쓰되 탑에 가는 사본에는 진짜를 넣는다"
  truth: true
  danger: 3
  names: [에반 펠, 잿빛 탑]
- id: fact_em_orin_loophole
  text: "두르강 오린 쇳줄의 계약에는 '인간 노동에 대한 지원 금지'가 있으나 '지도 분실'은 금지하지 않는다. 그는 해마다 환기 지도 한 장을 '분실'하며, 분실물은 늘 갱 마을 쪽 쓰레기 더미에서 나온다"
  truth: true
  danger: 3
  names: [오린, 쇳줄]
- id: fact_em_orin_ventilation_map
  text: "환기 지도는 독가스 장치가 묻힌 환기 갱 여섯 곳을 직접 가리키지 않는다. 그러나 오린은 지도의 공기 흐름이 어디서 한곳으로 모이는지로 장치의 위치를 짐작해 왔다"
  truth: true
  danger: 4
  names: [오린, 독가스 장치]
# ── 멜리산드와 베르미온 ──
- id: fact_em_mel_burrow_walk
  text: "멜리산드는 체류하는 날 밤 한 번은 인간 형상으로 굴 마을의 점호 마당을 걷는다. 누구에게도 말을 걸지 않고 사람들의 걸음걸이를 본다. 그날 밤 갱도 감독들은 마당에 나오지 않는다"
  truth: true
  danger: 3
  names: [멜리산드, 굴 마을]
- id: fact_em_mel_ash_stakes
  text: "멜리산드는 재 경계 망루 기록을 에반 펠이 아니라 자신의 서신으로도 따로 받는다. 황무지가 잿불석 광맥에 닿으면 가장 먼저 그것을 잃는다는 것을 알기 때문이다"
  truth: true
  danger: 2
  names: [멜리산드, 에반 펠]
