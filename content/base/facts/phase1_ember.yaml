# 잿불 언덕 1차 확장 사실 (22_NPC_PERSONA.md §1.2, 08 §3.3). 기존 emberhills.yaml(fact_eh_*)은 고치지 않는다.
# id 규칙: fact_em_<주제>. text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사.
