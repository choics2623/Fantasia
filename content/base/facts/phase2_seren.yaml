  truth: true
  danger: 2
  names: [스크레]
- id: fact_p2sr_lucio_mortality_books
  text: "루치오 카셀론은 노예선 사망률 기록을 조작해 보험금을 받는다. '소금 바늘'호의 이번 항해 기록에는 사망자가 열둘 이하로 적히도록 미리 정해져 있다"
  truth: true
  danger: 4
  names: [루치오 카셀론, 소금 바늘]
- id: fact_p2sr_lucio_needle_route
