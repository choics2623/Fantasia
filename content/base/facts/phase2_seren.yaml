  names: [룬, 아마란트]
- id: fact_p2sr_skre_off_book_23
  text: "스크레의 하역 장부에는 미코가 센 1,140명보다 스물셋이 더 적혀 있다. 그 스물셋은 밤에 등록 없이 내려 산호 채석장으로 곧장 갔다. 빚 장부가 없으므로 상환도 없다"
