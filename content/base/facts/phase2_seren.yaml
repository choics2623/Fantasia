- id: fact_p2sr_norval_citizenship_swap
  text: "노르발 세스는 맹약회의 313에서 세렌의 표를 '계약민 시민권' 의제와 맞바꿀 준비가 되어 있다. 열쇠는 과반 11표 가운데 아직 모자란 네 표다"
