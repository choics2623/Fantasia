- id: fact_p2sr_dominic_manifest_gap
  text: "갈림목 항만관 도미닉 베스페린은 노예선 입항 장부와 소금 나루 도착 장부의 숫자를 대조해 선박마다 사망 보고를 줄여 준다. 대가는 카셀론 상가에서 받는다"
