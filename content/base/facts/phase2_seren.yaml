  truth: true
  danger: 3
  names: [소금 바늘, 사라]
- id: fact_p2sr_olaf_cloth_codes
  text: "눈먼 등대 꼭대기 창의 천 색은 신호다 — 흰색은 안전, 붉은색은 물비늘대 순찰, 푸른색은 소금배 도착, 검은색은 위험. 모르바 밀수선은 색을 보고 물때를 정한다"
  truth: true
  danger: 3
  names: [올라프, 눈먼 등대]
- id: fact_p2sr_olaf_297_runner
  text: "올라프는 AS 297 밤 아르카스에서 탈출해 세렌까지 헤엄쳐 온 피험자를 등대 계단에 하룻밤 숨겼다. 그 사람이 뒷날 그롬마르 원형장의 투사가 되었다는 소문의 당사자다"
  truth: true
  danger: 3
  names: [올라프, 아르카스]
- id: fact_p2sr_olaf_no_heir
  text: "눈먼 등대의 계약민 등대지기는 셋이었으나 둘이 빚으로 채석장에 넘겨졌다. 올라프가 죽으면 천 신호가 끊긴다"
  truth: true
  danger: 2
  names: [올라프]
