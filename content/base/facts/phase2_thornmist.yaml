# 가시안개 숲 2차 확장의 사실 (22_NPC_PERSONA.md §1.2, 08 §3.3). 인물: docs/world/people/thornmist.md (P2T-)
# id 규칙: fact_p2tm_<주제>. 기존 fact_tm_*(facts/thornmist.yaml)는 고치지 않는다. text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사.
# 페이는 진실을 말하면 그 말에 묶이므로 카드의 hides/cover 는 '반대말·반쯤의 진실'로 쓴다. 웃음 조각과 떨어진 자만 곧게 말한다.
# truth: false는 세계에 퍼진 거짓 소문이다.
# ── 여왕과 궁정 ──
- id: fact_p2tm_queen_box_nightly
  text: "여왕은 방이 바뀌는 자정마다 웃음의 상자 앞에 한 시간 선다. 열지도 부수지도 않는다. 거울 시녀 '어제'만 그 한 시간을 안다"
  truth: true
  danger: 4
  names: [웃음의 상자, 어제]
- id: fact_p2tm_mirror_perhaps_reverses
  text: "거울 시녀 '혹시'는 여왕의 말을 거꾸로 전하도록 만들어졌다. 그래서 그녀가 전하는 말은 여왕이 한 말의 반대이고, 여왕이 진실을 말하지 못한다면 그 반대는 진실일 수 있다"
  truth: true
  danger: 4
  names: [혹시, 여왕]
- id: fact_p2tm_mirror_no_double_no
  text: "거울 시녀 '아니'는 모든 질문에 '아니'로 답하지만 같은 질문을 두 번 받으면 두 번째 '아니'는 '예'다. 궁정에서 이것을 아는 인간은 엘린뿐이다"
  truth: true
  danger: 2
  names: [아니, 엘린]
- id: fact_p2tm_mirror_yesterday_only
  text: "거울 시녀 '어제'는 어제의 일만 말하지만 여왕이 어제 한 말을 한 글자도 놓치지 않는다. 그녀가 '어제는…'이라고 시작하면 그 말은 사실이다"
  truth: true
  danger: 3
  names: [어제, 여왕]
- id: fact_p2tm_whistle_stone_verdict
  text: "휘파람 판사는 AS 150에 '아이 잃은 돌 앞에 신발을 놓고 아이를 부르는 부모의 약속은 지켜지지 않아도 위반이 아니다'라고 판결했다. 웃음이 아니라 휘파람으로 끝낸 유일한 판결이다. 그래서 돌은 이름에 대답한다"
  truth: true
  danger: 3
  names: [휘파람, 아이 잃은 돌]
- id: fact_p2tm_whistle_never_laughed
  text: "휘파람 판사는 웃음 재판을 수천 번 열었지만 스스로 웃은 적이 없다. 판결은 궁정이 세 번 웃을 때 법이 되고, 판사는 휘파람만 분다"
  truth: true
  danger: 2
  names: [휘파람]
# ── 경계·기사·사냥 ──
- id: fact_p2tm_three_laugh_rule
  text: "세 번 웃는 기사는 초대 없는 자에게 웃음을 세 번 건넨다. 세 번째 웃음을 웃어 주면 장난감이 되지만, 웃어 주지 않고 지나가면 법에 걸리지 않는다. 그는 그 '틈'을 일부러 남긴다"
  truth: true
  danger: 3
  names: [세 번 웃는 기사]
- id: fact_p2tm_rustrose_shard
  text: "가시 기사 '녹슨 장미'는 웃음 조각이다. 웃지 못하는 기사이며 철이 아니라 녹이 몸에서 난다. 그는 일곱 조각이 새벽 사냥이 끝날 때 만나는 울지 않는 나무 자리를 안다"
  truth: true
  danger: 4
  names: [녹슨 장미, 울지 않는 나무]
- id: fact_p2tm_dew_hunter_south
  text: "새벽 사냥꾼 '이른 이슬'은 숲에 든 인간을 놀이로 쫓되 죽이지 않는다. 숲 남쪽 경계에서는 그릭이 같은 인간을 죽이므로, 이슬은 인간을 그릭의 사냥터 쪽으로 쫓지 않는다"
  truth: true
  danger: 3
  names: [이른 이슬, 그릭]
# ── 바꿔치기·아이 ──
- id: fact_p2tm_glass_fingers_ledger
  text: "유리 손가락 부인은 바꿔치기한 아이와 대체품을 놓은 집을 적은 장부를 가진다. 장부에는 엘린의 자리도 있으나 그녀는 그 줄을 열어 보여 주지 않는다. 장부는 이름 무덤 아래에서만 읽힌다"
  truth: true
  danger: 4
  names: [유리 손가락 부인, 엘린]
- id: fact_p2tm_threadplay_threads
  text: "실뜨기는 바꿔치기 대체품에 실을 한 올 걸어 둔다. 그 실을 쥐고 당기면 대체품이 어디 있는지 알 수 있다. 엘린의 대체품에 걸린 실은 지금 회색여울 근처 어딘가에서 팽팽하다"
  truth: true
  danger: 4
  names: [실뜨기, 엘린]
- id: fact_p2tm_silverbell_greyford_two
  text: "회색여울 강변 움막 7호의 '사라진 아이 둘'은 여름 궁정 은방울 부인의 방에 있다. 둘은 이름 없이 머물며 아이 잃은 돌에서 이름이 불리면 대답한다"
  truth: true
  danger: 4
  names: [은방울 부인, 회색여울, 움막 7호]
- id: fact_p2tm_silverbell_returns
  text: "은방울 부인은 아이를 평생 데려가지 않는다. 열여섯 해가 차면 돌려보낸다 — 그 열여섯 해가 인간에게는 한 해일 수도 서른 해일 수도 있다"
  truth: true
  danger: 3
  names: [은방울 부인]
# ── 겨울 궁정·기억 ──
- id: fact_p2tm_thistle_white_city
  text: "엉겅퀴 공이 지닌 대붕괴 당시 아스테리아 인간의 기억 한 해 속에는 '불타는 하얀 도시'의 한 장면이 있다. 그 도시의 이름이 여왕이 이름 무덤에 묻은 이름과 같다"
  truth: true
  danger: 5
  names: [엉겅퀴 공, 아스테리아]
- id: fact_p2tm_thistle_shard
  text: "엉겅퀴 공은 웃음 조각이다. 기억을 모으는 일은 여왕이 시킨 일이지만, 그가 모은 인간의 기억은 대부분 '웃었던 날'뿐이다 — 웃음을 돌려줄 날을 위해"
  truth: true
  danger: 4
  names: [엉겅퀴 공]
# ── 안개 장터·이름 ──
- id: fact_p2tm_sneeze_true_stall
  text: "재채기 공작이 관장하는 안개 장터에는 진명 한 조각을 파는 노점이 있다. 값은 '네가 가장 사랑하는 사람의 얼굴'이다. 노점은 매번 다른 자리에서 열리고 공작의 재채기가 신호다"
  truth: true
  danger: 4
  names: [재채기 공작, 진명 노점]
- id: fact_p2tm_sneeze_scale
  text: "안개 장터의 저울은 무게가 아니라 아픔을 잰다. 같은 기억이라도 잃은 지 오래된 것은 가볍게 달린다 — 그래서 공작은 새로 잃은 기억을 가장 비싸게 산다"
  truth: true
  danger: 2
  names: [재채기 공작]
- id: fact_p2tm_name_collector_nine_bottles
  text: "이름 수집가의 움막 선반에는 이름이 붙지 않은 빈 병 아홉 개가 있다. 다음에 올 이름 아홉을 위한 것이다. 수집가는 그 아홉 이름이 누구의 것인지 모르고, 하나가 '잔향의 이름'이라는 소문을 듣는다"
  truth: true
  danger: 4
  names: [이름 수집가, 빈 병]
- id: fact_p2tm_name_page_shard
  text: "이름 수집가의 시동은 웃음 조각이다. 이름 무덤 병 가운데 하나의 위치를 안다 — 아스테리온이라는 이름이 붙었다는 전설의 병. 그것을 열면 어떻게 되는지는 시동도 모른다"
  truth: true
  danger: 5
  names: [시동, 아스테리온]
# ── 인간의 자리 ──
- id: fact_p2tm_nina_stones
  text: "할멈 니나의 조약돌 달력은 정확하다. 숲 안 인간들이 잃은 세월은 사람마다 다르며, 숲에 든 날부터 바깥보다 몇 해를 잃었는지는 사람마다 다르고, 평균은 열네 해다"
  truth: true
  danger: 3
  names: [니나]
- id: fact_p2tm_nina_twenty_three
  text: "돌 세는 자들 스물셋은 서로의 이름을 부르지 않는다. 니나가 돌 하나로 이름 하나를 대신하는 규칙을 만들었다 — 돌에는 이름이 아니라 번호만 있다"
  truth: true
  danger: 2
  names: [니나]
- id: fact_p2tm_eleanor_last_pitch
  text: "두번째 엄마들의 마을 어른 엘레노르는 실바렌 이슬 우리에서 잊혀 나온 정원지기다. 이슬 노래를 부르다 잊힌 사람이라 마지막 음을 알고 있다 — 그 음은 정원 안에서는 부를 수 없었으나 숲에서 처음 소리 내어 보았다. 그녀는 그것이 '빈 음'인 줄 몰랐다"
  truth: true
  danger: 5
  names: [엘레노르, 이슬 노래]
- id: fact_p2tm_eleanor_iron_village
  text: "두번째 엄마들의 마을의 철 울타리는 엘레노르가 정원에서 나올 때 숨겨 가져온 은목 못 열두 개와 가시안개 숲의 철이 섞여 세워진 것이다. 그래서 울타리 안은 엘다르의 시간도 페이의 약속도 약하다"
  truth: true
  danger: 3
  names: [엘레노르, 철 울타리]
- id: fact_p2tm_toby_fae_tongue
  text: "다섯째 토비(17)는 페이어를 알아듣지만 말하지는 못한다. 그가 번역한 약속의 문구는 페이도 인간도 듣고서야 '아, 이런 약속이었구나'라고 한다. 그러나 번역할 때마다 자기 이름의 글자 하나가 흐려진다"
  truth: true
  danger: 4
  names: [토비]
- id: fact_p2tm_toby_name
  text: "토비의 진짜 이름은 '틸'이다. 엘레노르만 안다. 이름 무덤의 병에는 이미 두 번째 글자가 없다"
  truth: true
  danger: 3
  names: [토비, 틸]
# ── 바깥으로 나온 사자 ──
- id: fact_p2tm_backwards_walker_waits
  text: "'거꾸로 걷는 이'는 AS 311부터 회색여울 옛 돌 고리에서 플레이어를 기다린다. 여왕의 초대장(가시 한 가닥)은 그가 짐 속에 넣어 두는 것이다. 초대의 대가는 그가 말하지 않는다"
  truth: true
  danger: 4
  names: [거꾸로 걷는 이, 옛 돌 고리]
- id: fact_p2tm_backwards_walker_cannot_enter_iron
  text: "거꾸로 걷는 이는 철이 닿으면 걷는 방향이 바뀐다 — 그가 앞으로 걸으면 숲 안으로 끌려간다. 그래서 그는 뒤로만 걸어 철을 피한다"
  truth: true
  danger: 2
  names: [거꾸로 걷는 이]
- id: fact_p2tm_thorn_ball_invites
  text: "긴밤월 가시 무도회의 초대장은 여왕이 직접 가시 한 가닥을 고르는 것이 아니라 여름 궁정과 겨울 궁정이 번갈아 한 가닥씩 뽑는다. 올해는 겨울 궁정 차례이고, 엉겅퀴 공은 웃은 기억이 많은 사람을 고른다"
  truth: true
  danger: 3
  names: [가시 무도회, 엉겅퀴 공]
