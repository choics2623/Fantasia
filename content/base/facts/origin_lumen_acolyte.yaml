# O-08 순종의 빛 견습 사제 (origins_lumen_acolyte.yaml)의 장면이 가르치는 사실. id 규칙: fact_o8_<주제>.
# text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사. truth: false는 신학원이 퍼뜨린 말이다.
# ── 서약과 우물 ──
- id: fact_o8_oath
  text: "서원 견습은 성표를 받을 때 '본 것을 보고하리라'고 맹세한다. 침묵의 우물 빵 당번은 돌아와 원장에게 본 것을 아뢴다. 아뢰지 않는 것은 서약을 깨는 일이다"
  truth: true
  danger: 1
  names: [서원 견습, 침묵의 우물]
- id: fact_o8_bread_rule
  text: "침묵의 우물 아홉 층에는 층마다 맨 끝에 독방이 하나씩 있다. 아홉 독방의 저녁 빵은 서원 견습이 나른다 — 간수는 독방의 이단과 말을 섞으면 안 되고, 견습은 본 것을 보고하기 때문이다. 우물은 바닥부터 먹인다"
  truth: true
  danger: 1
  names: [침묵의 우물]
- id: fact_o8_cell9
  text: "침묵의 우물 맨 밑 9번 독방에는 파문된 사제 알베릭이 아홉 해째 있다. 하루 한 끼, 저녁 빵이 그의 전부다"
  truth: true
  danger: 1
  names: [알베릭, 침묵의 우물]
# ── 벤노 (앞의 빵 당번) ──
- id: fact_o8_benno_ill
  text: "앞의 빵 당번 벤노는 병이 나서 바뀌었다"
  truth: false
  danger: 1
  names: [벤노]
- id: fact_o8_benno_reported
  text: "앞의 빵 당번 벤노는 병이 나지 않았다. 9번 독방 앞에서 오래 머물며 글자를 짚었다고 견습 루카가 밀고 함 홀에 고했고, 루카는 동판 쪽지를 받았다. 벤노는 침묵의 우물 첫째 층 맨 끝 독방에 있다"
  truth: true
  danger: 3
  names: [벤노, 루카, 침묵의 우물]
- id: fact_o8_benno_list
  text: "낙엽월 17일 정화의 뜰 첫 장작의 화형 승인서는 열두 줄이다. 일곱째 줄이 서원 견습 벤노 — 사유는 이단과의 대화. 승인서는 대사제의 서명을 기다린다"
  truth: true
  danger: 3
  names: [벤노, 정화의 뜰, 그레고르 7세]
# ── 루카 ──
- id: fact_o8_luca_on_stair
  text: "낙엽월 1일 저녁 새 빵 당번이 9번 독방 앞에 있을 때, 견습 루카가 침묵의 우물 계단 몇 층 위에서 엿듣고 있었다. 빵 당번 말고는 내려가면 안 되는 계단이다"
  truth: true
  danger: 2
  names: [루카, 침묵의 우물]
# ── 글자 ──
- id: fact_o8_same_letters
  text: "교단이 허락한 마흔두 글자로 경전의 문장만이 아니라 다른 문장도 쓸 수 있다. 알베릭은 '빛은 순종하는 자를 기억한다'를 같은 글자로 '빛은 기억하는 자를 따른다'로 바꿔 보였다"
  truth: true
  danger: 3
  names: [알베릭, 마흔두 글자]
- id: fact_o8_any_sentence
  text: "마흔두 글자를 경전의 순서가 아니라 소리대로 늘어놓으면 무슨 말이든 쓸 수 있다. 재의 법은 인간의 문해를 사형으로 다스린다"
  truth: true
  danger: 4
  names: [마흔두 글자, 재의 법]
- id: fact_o8_fourteen_letters
  text: "아스테리아의 글자는 원래 쉰여섯이었다. 열네 글자는 아스테리아가 불탄 뒤 사라졌다. 교단이 허락한 마흔두 글자는 남은 것이다 — 잔향은 사라진 열네 글자를 기억한다"
  truth: true
  danger: 5
  names: [아스테리아, 열네 글자, 마흔두 글자]
- id: fact_o8_letter_first_line
  text: "'빛의 서신'의 첫 줄은 '에오르는 우리를 노예로 만들지 않았다'이다. 알베릭이 9번 독방에서 빵 당번에게 들려주었다. 누가 처음 한 말인지는 말하지 않았다"
  truth: true
  danger: 4
  names: [빛의 서신, 에오르, 알베릭]
# ── 끊어진 고리 ──
- id: fact_o8_hymnal_road
  text: "신학원의 '성 마렌 축일 성가집'은 성가 막사의 라우렌츠를 거쳐 찬송 순례자의 짐에 섞여 북쪽 예배당들로 간다. 꿰맨 책등 안에 빛의 서신 모사가 들어 있다. 신학원장 안셀름이 그것을 견습 손에 들려 보낸다"
  truth: true
  danger: 4
  names: [성가집, 라우렌츠, 빛의 서신, 안셀름]
# ── 감사 ──
- id: fact_o8_audit_niklas
  text: "낙엽월 5일 아침 감독관 세레니엘이 신학원 견습들의 문자판을 본다. 아무도 끼어들지 않으면 그녀의 손수건은 니클라스의 판 앞에서 오래 멈추고, 그 아이는 '틀리는 법을 아는 아이'로 기억된다"
  truth: true
  danger: 3
  names: [세레니엘, 니클라스]
