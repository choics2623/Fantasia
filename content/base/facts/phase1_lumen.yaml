# 루멘(순종의 빛 성지) 1차 확장의 사실 (22_NPC_PERSONA.md §1.2, 08 §3.3). 인물: docs/world/people/lumen.md
# id 규칙: fact_lm_<주제>. 기존 fact_lu_*(facts/lumen.yaml)는 고치지 않는다. text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사.
# truth: false는 세계에 퍼진 거짓 소문이다.
# ── 승계 경쟁과 회의 ──
- id: fact_lm_council_votes
  text: "일곱 등불 회의는 북부 등불관이 3년째 비어 여섯 표다. 마테우스는 루멘·바알카르·서부 평원 세 표를, 마티아스는 은빛 강·세렌 두 표를 쥐고, 잿불 언덕 한 표가 흔들린다. 북부가 채워지면 표가 일곱이 되어 동수가 날 수 있다"
  truth: true
  danger: 4
  names: [마테우스, 마티아스, 일곱 등불, 북부 등불관, 잿불 언덕]
