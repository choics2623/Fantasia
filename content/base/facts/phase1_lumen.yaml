  truth: true
  danger: 3
  names: [아델, 그레고르 7세, 마테우스, 북부 등불관]
- id: fact_lm_gregor_asks_matthias
  text: "그레고르 7세는 마티아스에게 '내가 낭독하지 못하게 되면 네가 읽어라'고 청했다. 마티아스는 대답하지 못했다"
  truth: true
  danger: 4
  names: [그레고르 7세, 마티아스]
