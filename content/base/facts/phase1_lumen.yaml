  text: "대사제가 마렌의 옛 설교를 '낭독'이 아니라 '기억의 낭송'으로 읽는다면 교리 변경이 아니므로 금실이 필요 없다. 그렇게 판정할 수 있는 사람은 교리 감수관 레아넬 하나이고, 아무도 그에게 묻지 않았다"
