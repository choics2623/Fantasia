# 재의 황무지 2차 확장의 사실 (22_NPC_PERSONA.md §1.2). 인물: docs/world/people/ashwaste.md (P2W-). id 접두사 fact_p2aw_. 기존 fact_aw_*(facts/ashwaste.yaml)는 고치지 않는다.
# text는 엔진이 진위를 판단하는 기준 문장. names는 누설 검사용 고유명사. truth: false는 세계에 퍼진 거짓 소문이다.
# 황무지 안에서의 죽음은 회귀하지 않는다(시간의 상처 안) — 카드는 이 사실을 '말하지 못하는 것'으로 다룬다.
# ── 마지막 등불: 등불지기와 길잡이 ──
- id: fact_p2aw_halgrim_stone_progress
  text: "할그림의 왼팔과 왼쪽 얼굴의 돌은 이미 가슴 아래 손바닥 하나까지 왔다. 두르강의 돌화 속도로 보아 해빙월 안에 심장에 닿는다. 그는 지팡이 없이 서 있는 시간을 하루 한 번씩 늘려 가며 시험한다"
  truth: true
  danger: 4
  names: [할그림, 돌]
- id: fact_p2aw_halgrim_door_leaf
  text: "할그림의 창고 가장 깊은 상자에는 아스테리아 서고의 문짝 한 장이 있다. 열쇠 구멍에 여덟 갈래 별이 새겨져 있다 — 별의 집 청동 열쇠가 맞는 문이다. 그는 그것을 값으로 매기지 않고 상자째 잠가 두었다"
  truth: true
  danger: 5
  names: [할그림, 아스테리아 서고, 청동 열쇠]
- id: fact_p2aw_halgrim_told_mog
  text: "할그림이 '깊은 문 아래의 것을 말하지 않겠다'는 맹세를 깬 상대는 단 한 사람, 모그였다. 그는 깊은 문 아래서 인간의 노래에 맞춰 뛰는 박동을 들었다. 모그는 그 말을 아무에게도 옮기지 않았다"
  truth: true
  danger: 5
  names: [할그림, 모그, 깊은 문]
- id: fact_p2aw_halgrim_wrong_about_returner
  text: "할그림은 '돌아오는 놈이라면 황무지에서 죽어도 다시 온다'고 믿는다. 시간의 상처 안에서는 잔향자도 돌아오지 못한다는 것을 그는 모른다. 알려 주면 그는 짐꾼 계획을 접거나 더 위험한 길을 찾는다"
  truth: true
  danger: 4
  names: [할그림, 시간의 상처]
- id: fact_p2aw_mog_shadow_voice
  text: "모그는 황무지에서 바엘리스 흑요비늘의 굳은 그림자 곁을 지나다 '너는 또 왔구나'라는 목소리를 들었다. 그 목소리가 자기 얼굴이 아니라 자기 뒤의 누군가에게 한 말이라고 믿는다"
  truth: true
  danger: 5
  names: [모그, 바엘리스 흑요비늘]
- id: fact_p2aw_mog_route_rules
  text: "모그는 황무지에서 살아 나온 23번의 규칙을 셋으로 줄여 외운다 — 해 지기 전에 돌아온다, 잔상 주기 아홉 분을 세지 않는다, 붉은 말뚝을 눈에 담지 않는다. 길잡이 계약은 이 셋을 지키는 사람에게만 한다"
  truth: true
  danger: 3
  names: [모그]
- id: fact_p2aw_mog_24th_entry
  text: "모그는 스물네 번째 황무지행을 하지 않으려고 석 달째 다른 길잡이 일을 맡아 왔다. 스물세 번째에 본 것이 스물네 번째에서 말을 걸어올 거라고 느낀다"
  truth: true
  danger: 4
  names: [모그]
- id: fact_p2aw_des_knows_faces
  text: "'유리눈' 데스의 의안에는 두 번째 등불의 밤 잔상 속 주민 80명의 얼굴이 하나하나 남아 있다. 그는 매일 해 질 녘 그 얼굴들을 한 번씩 센다 — 잔상 속에서 몇 사람은 그에게 손을 흔든다"
  truth: true
  danger: 3
  names: [데스, 두 번째 등불]
- id: fact_p2aw_des_eye_cost
  text: "데스의 의안은 잿빛 탑 장인이 만든 시간 렌즈다. 그것을 달아 주면서 탑은 그가 본 것을 분기마다 한 번 듣는 조건을 걸었다. 그는 그 약속을 아직 한 번도 지키지 않았다"
  truth: true
  danger: 4
  names: [데스, 잿빛 탑]
- id: fact_p2aw_chirk_smell_echo
  text: "재굴 크릭 치륵은 잔상을 냄새로 맡는다. 잔상이 다가오기 아홉 분 전 재 냄새 속에 젖은 빵 냄새가 섞인다. 그는 그것이 두 번째 등불의 마지막 저녁 식사 냄새라고 짐작한다"
  truth: true
  danger: 3
  names: [치륵, 두 번째 등불]
- id: fact_p2aw_chirk_ash_tribe_slow_aging
  text: "재굴 크릭은 재를 마시고도 오래 산다. 재오염이 뼈를 굳히며 천천히 늙게 한다. 치륵은 서른일곱이지만 몸은 열아홉 같고, 같은 무리의 노인은 쉰이 넘어도 살아 있다"
  truth: true
  danger: 2
  names: [치륵]
# ── 재눈 초소와 경계 ──
- id: fact_p2aw_serena_acceleration
  text: "재눈 초소의 기록함에는 경계 확장이 맹약회의 날짜에 맞춰 가속된다는 계산이 있다. 세레나는 그 곡선이 회색 순례자들이 잿불석을 말뚝 곁에 묻는 날과 겹치는 것을 알지만 탑에 보내는 보고서에는 '원인 미상'으로 적었다"
  truth: true
  danger: 5
  names: [세레나 펠, 맹약회의, 회색 순례자]
- id: fact_p2aw_serena_rail_visit
  text: "시간 측정관 라일이 분기마다 재눈 초소를 들러 말뚝 기록을 가져간다. 세레나는 그가 측정 바늘 이야기를 할 때마다 '오차'라고만 대답한다 — 같은 대화를 석 달 간격으로 세 번 반복했다는 것을 그녀만 안다"
  truth: true
  danger: 4
  names: [세레나 펠, 라일]
- id: fact_p2aw_serena_stake_jump
  text: "AS 311 동쪽 경계가 2리 넓어진 날 붉은 말뚝 열두 개 가운데 셋이 하룻밤에 사라졌다. 세레나는 그 셋의 위치를 지도에 점선으로만 그렸다. 말뚝이 사라진 방향이 두 번째 등불 쪽이다"
  truth: true
  danger: 3
  names: [세레나 펠, 두 번째 등불]
# ── 회색 순례자 ──
- id: fact_p2aw_hael_not_aging
  text: "재의 목소리 하엘은 시간 잔상에 노출되어 30년째 늙지 않는다. 겉보기는 마흔이지만 AS 242에 태어난 일흔이다. 그는 자기 나이를 아이들에게 말하지 않는다"
  truth: true
  danger: 3
  names: [하엘]
- id: fact_p2aw_hael_ash_rebirth
  text: "하엘은 '에오르의 마지막 말이 재의 중심으로 돌아가 거기서 죽으면 신이 다시 말한다'고 믿는다. 그 말이 곧 시간의 상처 안에서의 진짜 죽음이라는 것을 그는 알고도 부르지 않는다 — 믿음과 연민 사이에서 석 달째 같은 설교만 한다"
  truth: true
  danger: 5
  names: [하엘, 에오르, 시간의 상처]
- id: fact_p2aw_hael_children_fed
  text: "재 성소는 탈주한 인간 아이들이 처음으로 배불리 먹는 곳이다. 하엘은 아이들이 먹는 동안만 설교를 멈춘다. 교리가 거짓인지 확인할 방법이 없다는 것을 그는 가장 잘 안다"
  truth: true
  danger: 2
  names: [하엘, 재 성소]
- id: fact_p2aw_gret_exile
  text: "'두 손톱' 그렛은 전쟁 그롬 숙영지에서 반역으로 오해받아 손톱 둘이 뽑히고 쫓겨났다. 반역한 것이 아니라 포로로 잡힌 인간 아이 둘을 풀어 준 것이다. 그것을 말하지 않고 재먹이가 되었다"
  truth: true
  danger: 3
  names: [그렛]
- id: fact_p2aw_gret_guard_rule
  text: "그렛은 성소 수호를 맡으면서도 재를 혀에 올리지 않는다. 한 번도 올리지 않았다는 것을 하엘만 안다. 그가 성소 문 앞에서 서 있는 이유는 교리가 아니라 아이들이 문 밖으로 나가지 못하게 하기 위해서다"
  truth: true
  danger: 3
  names: [그렛, 하엘]
- id: fact_p2aw_silene_stole_embers
  text: "재먹이 실레네는 베르미온 가문 하녀장 시절 열쇠 본을 떠 잿불석 일부를 빼내 순례자에게 건넸다. AS 311 경계 확장을 가속시킨 잿불석 매장의 출처가 그녀다. 그녀는 그것이 균열을 먹여 키우는 일인 줄 알고도 계속했다"
  truth: true
  danger: 5
  names: [실레네, 베르미온, 잿불석]
- id: fact_p2aw_silene_motive
  text: "실레네가 잿불석을 훔친 이유는 신앙이 아니다. 하녀장 시절 베르미온 가문이 아이 둘을 광산에 판 날 그녀는 열쇠 본을 쥐고 있었다. 이후 그 열쇠로 열 수 있는 모든 문을 열기로 결심했다"
  truth: true
  danger: 4
  names: [실레네, 베르미온]
- id: fact_p2aw_bes_hidden_children
  text: "성소 아이 열둘 가운데 셋은 잿빛 탑 목록에서 지워진 아이들이다. 베스가 매 분기 아이들 이름을 바꿔 부르는 법을 가르친다. 탑 밀정이 와도 열둘은 '재의 아이들'로만 불린다"
  truth: true
  danger: 4
  names: [베스, 재의 아이들]
- id: fact_p2aw_receiver_ash_source
  text: "새로 온 사람의 혀에 올리는 재는 시간의 상처 가장자리에서 퍼 온 것이다. 받아들임지기만 그 재를 퍼 오는 길을 안다. 재를 혀에 올린 자는 석 달 안에 잔상이 보이기 시작한다"
  truth: true
  danger: 4
  names: [받아들임지기, 시간의 상처]
- id: fact_p2aw_receiver_former_servant
  text: "받아들임지기 오렐은 몰락한 용인 가문의 하인이었다. 가문이 사라진 날 마지막으로 남은 불을 껐다. 그는 새 사람의 혀에 재를 올릴 때마다 그 불을 떠올린다"
  truth: true
  danger: 2
  names: [오렐]
# ── 등불 아래의 숨은 줄 ──
- id: fact_p2aw_merita_tablets_nine
  text: "주춧돌의 등잔 메리타는 아스테리아 글자 석판 조각 14개 가운데 아홉을 모았다. 다섯이 남았다. 모은 아홉은 마지막 등불 밖 세 곳에 나눠 묻혀 있고 위치는 메리타 혼자 안다"
  truth: true
  danger: 5
  names: [메리타, 주춧돌, 아스테리아]
- id: fact_p2aw_merita_lamp_ash
  text: "메리타는 이름 없는 자들의 재의 황무지 등잔이다. 주춧돌 사냥꾼 14명은 그녀의 손가락 열넷이고 서로를 모른다. 사냥꾼 하나가 잡히면 그녀는 그 석판 조각을 버린다"
  truth: true
  danger: 5
  names: [메리타, 주춧돌, 등잔]
- id: fact_p2aw_til_square_end
  text: "멈춘 광장의 끝지기 틸은 광장 원 가장자리에 하루 한 번 앉는다. 원 안에 들어가지 않는다. 안에서 불이 멈춘 이유를 자기 눈으로 본 적이 없다고 주장하지만 사실은 두 번 들어갔다 나왔다"
  truth: true
  danger: 4
  names: [틸, 멈춘 광장]
- id: fact_p2aw_dagan_reports
  text: "모래눈 패의 패원 다간은 잿빛 눈 열둘 가운데 하나다. 분기마다 카르바에게 서면 보고를 보낸다. 교본 상자의 위치를 카일보다 먼저 알았지만 보고하지 않았다"
  truth: true
  danger: 4
  names: [다간, 카르바, 카일, 교본 상자]
- id: fact_p2aw_dagan_wavers
  text: "다간은 교본 상자 근처 잔상 속에서 아이들이 글자를 따라 읽는 장면을 본 뒤 보고서의 한 줄을 지웠다. 그 한 줄이 상자의 정확한 위치였다. 그가 열두 번째로 보낼 보고서는 아직 쓰이지 않았다"
  truth: true
  danger: 5
  names: [다간, 교본 상자]
- id: fact_p2aw_ott_water_tithe
  text: "물 한 통 동화 3닢 가운데 동화 한 닢은 할그림의 돌 약 값으로 돌아간다. 물지기 오트는 그 돈을 장부에 적지 않고 매달 약 상자째 할그림의 집 앞에 둔다"
  truth: true
  danger: 2
  names: [오트, 할그림]
- id: fact_p2aw_kora_ledger
  text: "여관 주인 코라는 숙박부를 막대기 눈금으로만 쓴다. 눈금 위에 손가락 지문 대신 손바닥 흉터 모양으로 손님을 기억한다. 탑 밀정이 숙박한 날은 막대 끝을 한 번 꺾어 놓는다"
  truth: true
  danger: 3
  names: [코라]
- id: fact_p2aw_jena_second_lantern_survivor
  text: "제나는 두 번째 등불의 마지막 밤 마을 밖 바위에서 별을 보고 있던 열두 살 소녀로, 주민 80명 가운데 유일한 생존자다. 잔상 속에서 매일 해 질 녘 자기 이름이 불리는 소리를 듣는다"
  truth: true
  danger: 4
  names: [제나, 두 번째 등불]
- id: fact_p2aw_jena_counts_steps
  text: "제나는 해 질 녘 잔상이 시작되면 마을 쪽으로 여든 걸음을 걷는다. 여든이 되면 걸음을 멈추고 돌아선다. 그 여든 걸음을 넘으면 잔상 속에서 어머니 목소리가 가장 가깝다"
  truth: true
  danger: 3
  names: [제나]
- id: fact_p2aw_uma_war_camp_message
  text: "그롬 낙오자의 우두머리 우마는 해골이빨 전쟁 숙영지의 소식을 가끔 받는다. 숙영지는 탈영한 고즈를 돌려 달라는 전언을 석 달에 한 번 보낸다. 우마는 고즈에게 그것을 전하지 않았다"
  truth: true
  danger: 4
  names: [우마, 고즈, 해골이빨]
- id: fact_p2aw_uma_stragglers_30
  text: "그롬 낙오자 30은 전쟁에서 진 자가 아니라 전쟁이 끝난 뒤 갈 곳이 없던 자들이다. 우마는 그들을 짐꾼으로 팔지 않고 마지막 등불 경비의 보조로 둔다. 고즈의 쇠약이 시작되면 그들이 방벽이 된다"
  truth: true
  danger: 3
  names: [우마, 고즈]
# ── 거짓 소문 ──
- id: fact_p2aw_rumor_names_follow_home
  text: "아스테리아 집터의 문패를 가져가면 그 이름의 혼이 따라온다"
  truth: false
  danger: 2
  names: [문패]
