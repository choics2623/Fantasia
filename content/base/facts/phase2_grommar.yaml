  danger: 3
  names: [세이라, 베아트릭스]
# ── 쇠턱 보르그 ──
- id: fact_p2gm_borg_melisande_letter
  text: "보르그 쇠턱이 서약섬으로 가져가는 서신은 멜리산드의 것이다. 안건은 잔향 징후자를 처형하지 말고 개량 실험에 보내자는 것이다. 보르그는 서신의 뜻을 모르는 척한다"
