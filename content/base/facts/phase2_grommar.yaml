  truth: true
  danger: 4
  names: [에이다, 군나르]
# ── 어린 탈 ──
- id: fact_p2gm_ytal_hears_name
  text: "아홉 살 탈이 배수로 벽에 대고 자기 이름을 부르면 벽 너머에서 눈먼 노인이 '탈?' 하고 대답한다. 아이는 누구에게도 말하지 않았다. 무르크가 그 소리를 듣는다"
  truth: true
  danger: 4
  names: [탈, 무르크]
# ── 나가 세이라 ──
- id: fact_p2gm_seira_tersa_contract
  text: "세렌 테르사 상가는 쇠턱 씨족과 용병 계약을 맺고 있다 — 대가는 그롬마르 항 노예 하선장 우선권. 계약에는 '대전쟁군주 교체 시 재협상' 조항이 있다"
