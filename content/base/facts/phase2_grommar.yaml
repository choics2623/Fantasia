  danger: 4
  names: [보르그, 멜리산드]
- id: fact_p2gm_borg_counts_coin
  text: "보르그 쇠턱은 돈을 센다. 그롬 전사들이 그것을 알고도 도전하지 않는 이유는 쇠턱이 항구와 노예선과 이빨을 쥐고 있어서다. 우르가쉬가 그를 맹약회의 대표로 지명한 것도 돈을 세는 자라야 돌 방에 앉아 있기 때문이다"
  truth: true
  danger: 3
  names: [보르그, 우르가쉬]
