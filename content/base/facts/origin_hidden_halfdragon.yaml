# 숨겨진 반용 (O-11 origin.hidden_halfdragon)의 사실 — 화염문 저택 부엌의 비밀과 아나의 등잔.
# id 규칙: fact_o11_<주제>. text는 엔진이 진위를 판단하는 기준 문장, names는 누설 검사용 고유명사.
# 주의: 엔진은 사실의 글에 숨은 장소의 첫 낱말이 있으면 그 장소를 알게 한다 — '바알카르'(하수도)·'재받이'(하수 분기점)는
#   일부러 쓴 곳에만 쓴다. '셋째'(불꽃 홀 셋째 서랍)·'왕관'·'분류실'은 쓰지 않는다.
- id: fact_o11_sire
  text: "화염문 가주 발레리우스는 부엌 노예 아나가 낳은 아이 — 부엌에서 부지깽이라 부르는 열일곱 살 — 의 아비다. 그는 그 아이가 반용이라는 것을 안다. 아는 사람은 그와 늙은 요리장 헤름뿐이다"
  truth: true
  danger: 5
  names: [발레리우스, 아나, 헤름]
- id: fact_o11_ana_burned
  text: "아나 — 화염문 저택의 부엌 노예, 부지깽이의 어미 — 는 AS 307 겨울 재송곳 기사단의 징후자 명단에 올라 재 마당에서 탔다"
  truth: true
  danger: 2
  names: [아나, 재송곳 기사단]
- id: fact_o11_ana_words
  text: "아나의 마지막 말 (헤름이 다섯 해 동안 지녔다): '그 애 등에 불이 오거든 재받이 아궁이의 이 빠진 베노에게 보내요. 아나의 아이라고 하면 등잔이 켜진다.' 아나는 이름 없는 자들의 등잔이었다"
  truth: true
  danger: 4
  names: [아나, 베노, 등잔, 이름 없는 자들]
- id: fact_o11_kitchen_line
  text: "아이가 태어난 밤, 발레리우스는 단 한 번 부엌 바닥을 밟고 아이를 본 뒤 집사에게 말했다 — '장부에 적어라. 부엌, 하나.' 법이 정한 출생일의 처분 대신 장부의 한 줄이었다"
  truth: true
  danger: 4
  names: [발레리우스]
- id: fact_o11_sire_insurance
  text: "루칸 화염문은 순혈 아내 둘을 맞고도 여든 해 동안 아이가 없다. 화염문의 대가 그에게서 끊길 수 있어서, 발레리우스는 부엌의 반용 한 줄을 지우지 않고 남겨 두었다"
  truth: true
  danger: 5
  names: [루칸, 발레리우스]
- id: fact_o11_lucan_quarry
  text: "루칸 화염문은 사냥 연회 이틀 뒤 밤 '놀이'를 연다 — 통금 뒤 부엌에서 사냥감 하나를 골라 비늘 언덕 하인 통로에 풀고, 손님 여섯이 횃불을 들고 불꽃 홀의 자정 북까지 쫓는다. 낙엽월에는 3일 밤이다"
  truth: true
  danger: 3
  names: [루칸]
- id: fact_o11_ana_lamp
  text: "아나는 등잔의 물통 길이었다 — 비늘 언덕 저택들의 빨래 바구니에 재송곳 명단에 오른 아이들의 이름을 숨겨 날랐다. 붙잡혀 재 마당에서 탈 때까지 등잔의 이름을 하나도 말하지 않았다"
  truth: true
  danger: 4
  names: [아나, 등잔]
- id: fact_o11_lamp_hides
  text: "등잔은 비늘이 돋은 아이를 바알카르 하수도로 빼낸다 — 재받이 하수 분기점에서 달마다 3·13·23일 밤 열한 시에 회합하고, 그 자리에서 길을 정한다"
  truth: true
  danger: 5
  names: [등잔]
- id: fact_o11_ash_gutter
  text: "재 마당의 재를 아래층으로 흘려보내는 돌 홈통은 비늘 언덕 하인 통로 뒤에서 시작해 바알카르 하수도로 떨어진다. 사람 하나가 미끄러져 내려갈 수 있고, 재받이 하수 분기점까지 이어진다"
  truth: true
  danger: 3
  names: []
- id: fact_o11_varskar_fire
  text: "잔향의 첫 기억: 하늘을 메운 불이 목소리를 한가운데서 찢었다. 그 불을 뿜은 용은 바르스카르 — 지금 용좌봉 재의 둥지에서 죽어 가는 용황이다"
  truth: true
  danger: 4
  names: [바르스카르]
