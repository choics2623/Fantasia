# 세렌 계약민 출신 (creation/origins_seren_bonded.yaml · SCENARIOS O-05)의 장면이 가르치는 사실. id 접두사 fact_o5_.
# 금액은 금화로 적는다 — SCENARIOS의 '두카트'를 금화로 읽는다 (엔진의 돈은 동화, 금화 1 = 240).
# 글에 숨은 곳의 이름 첫 낱말이 들어가면 엔진이 그곳을 안다고 친다 (learn) — '지붕'은 지붕 다리를 가르치려고 일부러 넣었다. '의장'은 넣지 않는다 (의장 금고).
- id: fact_o5_levy
  text: "AS 312 낙엽월 1일 급여일, 카셀론 해운은 계약민 백열두 명 모두의 줄에 선박 손실 분담금 일곱 금화씩을 올렸다. 그 7만 그날 아침 잉크로 적혔다"
  truth: true
  danger: 1
  names: [카셀론]
- id: fact_o5_levy_decree
  text: "낙엽월 1일 의회 정기 회기는 '선박 손실 분담에 관한 계약안'을 통과시켰다 — 보험이 받아 주지 않은 항해 손실을 선주가 계약 선원에게 나눠 지울 수 있다. 한 사람 몫은 셋 반 금화다. 마르셀은 '다음 항해 몫을 미리 걷는다'며 그 두 배인 7을 매겼다"
  truth: true
  danger: 2
  names: [마르셀]
- id: fact_o5_levy_double
  text: "장부꾼 마르셀의 분담금 계산지: 백열두 명에게 일곱씩 784 금화를 매겼고, 카셀론에 올린 것은 의회 문서대로 392다. 나머지 392는 카셀론의 장부에도 의회의 장부에도 없다 — 마르셀의 몫이다"
  truth: true
  danger: 4
  names: [마르셀, 카셀론]
- id: fact_o5_loss_is_dead
  text: "카셀론의 '선박 손실'은 지난 항해에서 보험 한도 열둘을 넘어 죽은 짐 — 사람 — 의 값이다. 소금 바늘호 짐칸 벽에는 금 열넷이 그어져 있었다. 계약민들은 죽은 노예의 값을 나눠 갚는다"
  truth: true
  danger: 3
  names: [카셀론, 소금 바늘]
- id: fact_o5_miko_side_job
  text: "미코는 눈먼 등대에서 상자 하나를 받아 갈림목에 내려놓는 밤일로 한 번에 두 금화를 번다. 계약 밖의 짐이다 — 걸리면 계약 위반, 빚 두 배"
  truth: true
  danger: 3
  names: [미코]
- id: fact_o5_hold_people
  text: "소금 나루 뒤편의 밤 하역에서 등 없는 배가 내리는 '짐'은 등록되지 않은 사람들이다. 스크레의 장부 상자에만 적히고, 빚 장부가 없어 갚을 길도 없이 절벽 길 수레로 산호 채석장에 간다"
  truth: true
  danger: 4
  names: [스크레]
- id: fact_o5_succession_early
  text: "펠의 계약 승계는 AS 308 긴밤월 11일에 등록되었다. 펠이 소금 바늘호 갑판에서 떨어진 것은 긴밤월 14일 — 승계가 죽음보다 사흘 먼저다. 승계를 올린 이는 장부꾼 마르셀이다"
  truth: true
  danger: 3
  names: [펠, 마르셀, 소금 바늘]
- id: fact_o5_roof_bridge
  text: "셈 모임은 매달 열흘 밤 열 시, 빚 골목 숙소 지붕을 잇는 지붕 다리에서 모인다. 숫자는 합법이다 — 그 밤에는 누구의 이자든 백 사람이 함께 센다"
  truth: true
  danger: 2
  names: [셈 모임]
- id: fact_o5_bulk_redemption
  text: "굽은 닻에서 도는 말: 베아트릭스 몬달리가 용제국 내전에 댈 돈을 마련하려고, 한 상가의 계약민 빚을 통째로 묶은 '일괄 상환권'을 팔 수 있다. 그 증서를 사는 자가 그들의 빚을 — 곧 그들을 — 가진다. 태울 수도 있다"
  truth: true
  danger: 2
  names: [베아트릭스, 몬달리]
