# 그롬마르 붉은 황야 NPC 일과 (24 §3). 원천: REGIONS §16, docs/world/people/grommar.md, 카드 schedule. 장소 id는 settlements/blood_arena.yaml (ba_*, blood_arena__*, war_camp__*, grommar_port__*).
# 원형장의 하루: 04:00 새벽 훈련 북(쇠우리 4시간) · 05:00 그롬 대련 북 · 09:00·13:00 경기 뿔 · 18:00 저녁 경기(이름 연호) · 22:00 쇠우리 닫힘. 안식일(6일째)은 경기가 없고 밤에 흉터 회의.
# 그롬은 대련을 하루도 거르지 않는다(30일 싸움이 없으면 쇠약). 경기는 태양월 대축제(313년 1일 개막, 30일 마지막 날 100승 도전과 대전쟁군주 도전)에 모인다.
# 맹약회의 313(서약섬, 태양월 1~11일): 쇠턱 보르그와 세이라는 events/grommar_312.yaml의 사건(313-04-29 출발 의식 → 05-01 서약섬 도착 → 05-12 귀로)으로 움직인다.
