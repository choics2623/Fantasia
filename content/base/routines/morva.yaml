# 모르바 늪 NPC 일과 (24 §3). 원천: REGIONS §8, docs/world/people/morva.md, 카드 schedule. 장소 id는 settlements/root_village.yaml(rv_*, rv__*), seven_hags_circle.yaml(sh_*), morva_mouth.yaml(mm_*).
