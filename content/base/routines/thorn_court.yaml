  blocks:
    - {days: all, from: "04:00", to: "12:00", at: thornmist__south_tower, doing: "폐탑에서 모자를 말리지 않는다 — 문턱 안으로 탈주자를 부른다", outdoor: true, rain: {at: thornmist__south_tower, doing: "폐탑 문턱에서 비를 피하라며 사람을 부른다"}}
    - {days: all, from: "12:00", to: "18:00", at: thornmist__south_tower, doing: "남쪽 경계에서 탈주자를 쫓는다 — 피가 모자를 적신다", alt: {p: 0.3, at: thornmist__south_tower, doing: "폐탑 위에서 길을 본다"}}
    - {days: all, from: "18:00", to: "23:00", at: thornmist__south_tower, doing: "피 마르기 전에 사냥한다", outdoor: true}
    - {days: all, from: "23:00", to: "04:00", at: thornmist__south_tower, doing: "폐탑에서 쉰다 — 모자가 마르지 않았는지 만진다"}
npc_mirror_yesterday:
  home: tc_mirror_chamber
  blocks:
    - {days: all, from: "00:00", to: "01:00", at: tc_laugh_box_hollow, doing: "자정 — 여왕이 상자 앞에 서는 한 시간을 곁에서 본다", fixed: true}
