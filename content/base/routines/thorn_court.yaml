# 가시안개 숲 NPC 일과 (24 §3). 원천: 각 카드의 schedule, docs/world/people/thornmist.md, REGIONS §6.5.
# 장소 id는 settlements/thorn_court.yaml 의 tc_* 와 outer(thornmist__*), 아이 잃은 돌(lost_child_stone — eternal_garden 정착지 outer), 회색여울 옛 돌 고리(old_stone_ring — greyford 정착지 outer).
# 페이는 같은 하루를 두 번 같게 보내지 않는다 — alt 확률을 크게 두었다. 자정 00:00-01:00 여왕이 웃음의 상자 앞에 서는 한 시간이 정본 고정이다 (fixed).
# 쉼표가 든 값은 큰따옴표로. days: all | workday | sabbath | odd | even | weekday:[1..6] | monthday:[..]

npc_thorn_queen:
  home: tc_throne_room
  blocks:
    - {days: all, from: "00:00", to: "01:00", at: tc_laugh_box_hollow, doing: "방이 바뀌는 자정 — 웃음의 상자 앞에 한 시간 선다. 열지도 부수지도 않는다", fixed: true}
    - {days: all, from: "01:00", to: "10:00", at: tc_throne_room, doing: "왕좌의 방에서 쉰다 — 방이 바뀐다"}
    - {days: all, from: "12:00", to: "14:00", at: tc_throne_room, doing: "접견 — 거래만 한다. 이름을 부르면 주의가 닿는다", fixed: true}
    - {days: all, from: "14:00", to: "16:00", at: tc_judge_hall, doing: "웃음 재판을 구경한다", alt: {p: 0.6, at: tc_toy_garden, doing: "장난감 정원에서 춤을 구경한다"}}
    - {days: all, from: "18:00", to: "23:00", at: tc_ballroom, doing: "무도회장 — 인간 장난감의 춤을 본다", alt: {p: 0.4, at: tc_throne_room, doing: "왕좌에서 꼼짝 않고 거래만 한다"}}
npc_nibble:
  home: tc_mushroom_ring
  blocks:
    - {days: all, from: "06:00", to: "11:00", at: tc_maze, doing: "길 잃은 인간을 찾아 속인다", outdoor: true, rain: {at: tc_mushroom_ring, doing: "버섯 고리 곁 쓰러진 나무 밑에서 비를 피한다"}}
    - {days: all, from: "11:00", to: "16:00", at: tc_mushroom_ring, doing: "장난 — 지나가는 인간의 소지품 하나를 훔친다"}
    - {days: all, from: "16:00", to: "19:00", at: tc_court_hall, doing: "여왕 궁정에 보고한다 — 보고는 전부 반대말이다"}
    - {days: all, from: "19:00", to: "23:00", at: tc_mushroom_ring, doing: "버섯 고리에서 춤 — 끼어들면 7년이 지난다는 전설"}
    - {days: all, from: "23:00", to: "06:00", at: tc_mushroom_ring, doing: "쓰러진 나무 속에서 존다"}
npc_elin:
  home: tc_servants_room
  blocks:
    - {days: all, from: "05:00", to: "09:00", at: tc_servants_room, doing: "거울과 접시를 닦는다 — 밤마다 손바닥에 쓴 낱말을 확인한다"}
    - {days: all, from: "09:00", to: "13:00", at: tc_ballroom, doing: "여왕 연회 준비와 시중 (여름 반나절)", alt: {p: 0.5, at: tc_toy_garden, doing: "장난감 정원을 돌본다 (겨울 반나절)"}}
    - {days: all, from: "13:00", to: "18:00", at: tc_toy_garden, doing: "장난감 정원의 인간 일흔에게 바깥 시간이 얼마나 흘렀는지 알린다 (겨울 반나절)", alt: {p: 0.4, at: tc_ballroom, doing: "연회 시중 (여름 반나절)"}}
    - {days: all, from: "18:00", to: "22:00", at: tc_court_hall, doing: "궁정 시중 — 눈을 들지 않고 이름을 입에 올리지 않는다", alt: {p: 0.2, at: tc_mirror_chamber, doing: "거울 시녀 곁에서 같은 질문을 두 번 한다"}}
    - {days: all, from: "22:00", to: "05:00", at: tc_servants_room, doing: "잔다 — 손톱으로 손바닥에 낱말을 쓴다"}
npc_odo:
  home: tc_toy_dance_spot
  blocks:
    - {days: all, from: "05:00", to: "23:00", at: tc_toy_dance_spot, doing: "같은 춤을 춘다 — 71년째, 몸이 서른에서 늙지 않는다", alt: {p: 0.1, at: tc_toy_garden, doing: "정원 가장자리에서 한 박자 쉰다"}, fixed: true}
    - {days: all, from: "23:00", to: "05:00", at: tc_servants_room, doing: "잔다 — 꿈에서도 같은 춤"}
npc_grik:
