# 세렌 계약민 출신 (seren_bonded)이 들인 사람의 하루 — 장부꾼 마르셀. 세렌의 종: 06 부두 · 12 정오 · 18 저녁 · 22 의회 수조.
# 05:30 새벽 줄(출신의 점호)은 소금계단(sr_kassalon_dock)에서 그가 부른다. 급여일(낙엽월 1일 17시)의 낭독은 장면의 stage가 세운다.
npc_o5_marcel:
  home: sr_kassalon_dock
  blocks:
    - {days: all, from: "00:00", to: "05:00", at: sr_kassalon_dock, doing: 장부방 옆 쪽방에서 잔다}
    - {days: all, from: "05:00", to: "12:00", at: sr_kassalon_dock, doing: 소금계단 위에서 새벽 줄에 점을 찍고 오늘의 일감을 읽는다}
    - {days: all, from: "12:00", to: "13:00", at: sr_kassalon_dock, doing: 정오 생선죽 그릇을 장부 옆에 놓고 먹는다, fixed: true}
    - {days: all, from: "13:00", to: "17:00", at: sr_blue_ledger, doing: 푸른 장부관 창구에서 승계와 공제를 등록한다}
    - {days: all, from: "17:00", to: "22:00", at: sr_kassalon_dock, doing: 장부방에서 노임과 공제를 맞춘다 — 계산지는 따로 쓴다}
    - {days: all, from: "22:00", to: "24:00", at: sr_crooked_anchor, doing: 굽은 닻 구석에서 혼자 마신다 — 입술로 숫자를 센다}
