# 하르칸 초원 NPC 일과 (24 §3). 원천: REGIONS §15, docs/world/people/harkan.md, 카드 schedule. 장소 id는 settlements/khan_ordu.yaml (hk_*, khan_ordu__*).
# 오르두의 하루: 04:30 짐꾼 점호(채찍 기수 호각) · 05:00 이동일 짐 싸기 북 · 12:00 정오 말젖 죽 · 18:00 부족장 연회 개막 · 22:00 짐꾼 막사 닫힘. 이동일은 아흐레마다(9·18·27일).
# 겨울 (서리월 2일 ~ 해빙월 11일): 오르두가 바람 우물에 같은 모양으로 선다. 오르두 거주자는 presence/away 로 그 기간 'khan_ordu__winter_camp'에 있다 (엔진이 계절 이동을 위치로 옮기지 않아서 — 24 §3.7 계절).
# 맹약회의 313: 바투와 에젤의 사절단은 events/harkan_312.yaml의 사건(313-05-16 출발 의식 → 05-19 도착 → 05-20 회의 → 05-22 귀로)으로 움직인다. 사절단 짐꾼 40(이름 없음)은 4월 말 걸어서 먼저 떠난다.
# days: all | workday | sabbath | weekday:[1..6] | monthday:[..] — 쉼표가 든 값은 큰따옴표로.
npc_temur:
  home: hk_khan_stall
  presence: &ordu_present
    - {from: "312-09-01", to: "312-10-01"}
    - {from: "313-01-12", to: "313-07-31"}
  away: &ordu_winter {at: khan_ordu__winter_camp, doing: "겨울 진영 — 바람 우물에 오르두가 같은 모양으로 서 있다. 같은 천막, 같은 자리"}
  blocks:
    - {days: all, from: "22:00", to: "04:00", at: hk_khan_stall, doing: 말처럼 서서 존다 — 왼쪽 뒷발이 한 번 떤다}
    - {days: all, from: "04:00", to: "05:30", at: hk_council_track, doing: 혼자 질주한다 — 오르두를 한 바퀴 돌고 한 번도 멈추지 않는다, outdoor: true, rain: {at: hk_khan_tent, doing: 천막 안에서 제자리걸음으로 몸을 푼다}}
    - {days: all, from: "05:30", to: "07:00", at: hk_khan_tent, doing: 밤사이 온 전령의 첫 묶음을 듣는다 — 하루 스무 기의 첫째, fixed: true}
    - {days: workday, from: "07:00", to: "12:00", at: hk_council_track, doing: 벡들과 나란히 달리며 방향을 짧게 정한다 — 뒤에서 달리는 수를 센다, outdoor: true, rain: {at: hk_feast_tent, doing: 연회 천막에서 서서 전령 보고를 듣는다}}
    - {days: all, from: "12:00", to: "13:00", at: hk_feast_tent, doing: 서서 말젖과 말린 고기를 먹는다, fixed: true}
