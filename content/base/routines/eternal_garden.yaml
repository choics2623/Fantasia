# 실바렌 영원 정원 NPC 일과 (24 §3). 원천: 각 카드의 schedule, docs/world/people/silvaren.md, REGIONS §5.5.
# 장소 id는 settlements/eternal_garden.yaml 의 eg_* 와 outer(silver_leaf_gate*, soul_garden*, eternal_garden__silver_forest).
# 새벽 05:00-05:50 '첫 아침의 노래'는 모든 엘다르·정원지기가 멈추는 정본 시각이다 (fixed). 쉼표가 든 값은 큰따옴표로.
# presence/away: 나엘리스는 서리월 말까지 정원, 긴밤월부터는 잿빛 탑(원로 겸임).
# days: all | workday | sabbath | odd | even | weekday:[1..6] | monthday:[..]

