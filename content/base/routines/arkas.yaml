# 아르카스 탑섬 NPC 일과 (24 §3). 원천: REGIONS §10, docs/world/people/arkas.md, 카드 schedule. 장소 id는 settlements/grey_tower.yaml(gt_*), arkas_harbor.yaml(ar_*).
