# 까마귀 문·용주 역참 NPC 일과 (24 §3). 원천: 카스파르·레아·지그문트·고름 카드, docs/world/people/crow_gate.md.
# 장소 id는 settlements/crow_gate.yaml (cg_*, crow_gate__*)과 settlements/dragon_pillar_post.yaml (dp_*).
# 주의: greyford.yaml에도 npc_kaspar·npc_lea 한 줄짜리 항목이 있다. build_content.py는 파일 이름순으로 합치므로 greyford.yaml이 이 파일의 두 항목을 덮어쓴다.
#       greyford.yaml의 npc_kaspar, npc_lea 항목을 지우면 아래 정본 일과가 살아난다.
# days: all | workday | sabbath | odd | even | weekday:[1..6] | monthday:[..] — 쉼표가 든 값은 큰따옴표로.
