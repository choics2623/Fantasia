# 재의 황무지 NPC 일과 (24 §3). 원천: REGIONS §11, docs/world/people/ashwaste.md, 카드 schedule. 장소 id는 settlements/last_lantern.yaml(ll_*·ll__*), asteria_ruins.yaml(ast_*).
# 하루: 06:00 등불 기름 · 12:00 물 저장고 정오 되질 · 17:30 해 지기 전 호각 (고즈가 마지막 사냥꾼을 들인다) — 해 진 뒤 밖에 있는 자는 구조하지 않는다. 안식일도 쉬지 않는다.
# 마지막 등불에서 재 성소 5.5시간, 재눈 초소 3시간, 재의 암자 3.5시간, 붉은 말뚝 선 6.5시간. 아스테리아 폐허는 56시간 — 끝지기 틸과 성벽 위 잔상만 매일 그곳에 있다.
# 재의 날·맹약회의 313·석판 모으는 날·잿불석 매장일·상자 원정은 events/ashwaste_312.yaml. 쉼표나 따옴표가 든 값은 큰따옴표로.
npc_aw_halgrim:
  home: ll_halgrim_house
  blocks:
    - {days: all, from: "06:00", to: "08:00", at: ll_lantern, doing: "등불 기름을 채운다 — 왼손은 호주머니에 넣은 채", outdoor: true}
    - {days: all, from: "08:00", to: "17:00", at: ll_halgrim_house, doing: "사냥꾼 허가 인장을 찍는다 — 문턱 서랍에서 인장을 꺼낸다"}
    - {days: all, from: "17:00", to: "22:00", at: ll_lantern, doing: "등불 아래 앉아 돌의 진행을 손가락 마디로 가늠한다"}
    - {days: all, from: "22:00", to: "06:00", at: ll_oath_cellar, doing: "집 아래 깨진 맹세 석판 곁에서 창대를 짚고 선다"}
npc_aw_mog:
