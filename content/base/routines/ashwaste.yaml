    - {days: all, from: "16:30", to: "18:30", at: ll_edge, doing: "해 질 녘 잔상 지대 가장자리에서 유리눈으로 여든 얼굴을 센다 — 손 흔드는 얼굴 앞에서 멈춘다", outdoor: true}
    - {days: all, from: "18:30", to: "22:00", at: ll_lantern, doing: "등불 아래서 술 한 잔 — 센 얼굴의 수를 속으로 되짚는다"}
    - {days: all, from: "22:00", to: "06:00", at: ll_hunters_yard, doing: "마당 곁 천막에서 잔다 — 흉갑을 벗지 않는다"}
