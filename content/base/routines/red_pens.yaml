# 녹테른 밤의 영지 NPC 일과 (24 §3). 원천: 각 카드의 schedule, docs/world/people/nocturne.md, REGIONS §7.5, kits/nocturne_estate.yaml.
# 장소 id는 settlements/red_pens.yaml 의 rp_*, red_pens__*, outer(first_thirst_castle__*, rose_manor*, nocturne__*). 해 질 녘 18:00~19:00 은 인간 귀환과 녹테른 기상이 겹치는 정본 시각이다 (fixed).
# 녹테른은 낮에 잔다 — 맑은 날은 저택 밖에 나오지 않는다. 인간은 해 뜰 때 시작하고 21:30 에 촛불을 끈다.
# 로잘리는 공물 호송 기간(긴밤월 12~15일)에만 영지에 있다 (presence/away). 발타사르는 잿빛 탑 원로 일로 오간다.
# 쉼표가 든 값은 큰따옴표로. days: all | workday | sabbath | odd | even | weekday:[1..6] | monthday:[..]

npc_mordecai:
  home: first_thirst_castle__throne
  blocks:
    - {days: all, from: "05:00", to: "17:00", at: first_thirst_castle__well, doing: "성 지하 우물 곁 — 빛을 피해 우물에 비친 것을 본다"}
