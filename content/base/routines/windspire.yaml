# 바람첨탑 NPC 일과 (24 §3). 원천: REGIONS §14, RACES §14, docs/world/people/windspire.md, 카드 schedule. 장소 id는 settlements/windspire.yaml (ws_*, sky_market__*, wind_well__*).
# 아에리의 하루: 05:00 바람 종(첫 비행) · 12:00 정오 종 · 18:00 저녁 줄 거둠 점검. 건물에 지붕이 없으니 비는 깃털로 막고(rain 블록은 '둥지에서 쉰다'), 겨울엔 기둥 위가 얼어 땅손의 이동이 닫힌다.
# 깃털 의회는 6일 주의 2·5일째에 연다. 안식일(6일째)은 아에리에게 의미 없고 땅손에게는 쉬는 날일 뿐이다.
