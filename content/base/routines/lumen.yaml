# 루멘·세 번째 고리 쉼터·성 마렌의 우물 NPC 일과 (24 §3). 원천: 카드의 schedule, REGIONS §4.5, fac_light 관습.
# days: all | workday | sabbath | odd | even | weekday:[1..6] | monthday:[..]   (안식일 = 6일째)
# 시간 구간은 [from, to). to가 from보다 작으면 자정을 넘는다. 쉼표가 든 값은 큰따옴표로 감싼다.
# 루멘의 시계는 일곱 번의 기도다: 04·07·10·13·16·19·22시. 기도 블록은 기도하는 사람에게 fixed로 박혀 있다.
# 장소 id: lm_* (루멘 lumen.yaml) · ps_* (쉼터 pilgrim_shelter.yaml) · mw_* (성 마렌의 우물 marens_well.yaml).
