# 카즈둠 산맥 NPC 일과 (24 §3). 원천: REGIONS §12, docs/world/people/kazdum.md, 카드 schedule. 장소 id는 settlements/deephammer_hall.yaml (dh_*, hammer_gate__*, contract_camp__*, deep_gate__*).
# 두르강의 하루는 '두드림'으로 열고 닫는다: 새벽 05:00 신전 세 번 두드림 · 06:00 작업 시작 · 16:30 작업 끝 · 22:00 돌 침상. 계약 광부는 계약서에 적힌 10시간(06:00-16:00)만 일한다.
# 판결일은 6일 주의 2·5일째(돌 법정 개정). 안식일(6일째)은 두르강에게도 '계약서에 적힌 하루'다.
# days: all | workday | sabbath | weekday:[1..6] | monthday:[..] — 쉼표가 든 값은 큰따옴표로.
npc_bror:
  home: dh_king_chamber
  presence:   # 맹약회의 313 길 — 4월 15일 서명 대행 조항을 발동하고 떠나 6월 19일 돌아온다
    - {from: "312-09-01", to: "313-04-14"}
    - {from: "313-06-20", to: "313-07-30"}
  away: {at: baalkar, doing: "맹약회의 313 길 — 서약섬으로 가는 사절단과 함께, 왕의 서명 대행은 하그린이 맡는다"}
  blocks:
    - {days: all, from: "00:30", to: "04:30", at: dh_king_chamber, doing: 잔다 — 베개 맡 돌벽에 오늘의 금을 새기고 눕는다}
    - {days: all, from: "04:30", to: "06:00", at: dh_ancestor_shrine, doing: 조상의 망치 앞에서 기도 — 오른쪽 귀를 손으로 가린다, fixed: true}
    - {days: all, from: "06:00", to: "07:30", at: dh_hall_canteen, doing: 왕도 같은 줄에 서서 귀리죽을 받는다}
    - {days: "weekday:[2,5]", from: "08:00", to: "14:00", at: dh_judge_bench, doing: "룬 법정 판결 — 인간 계약 분쟁도 같은 쇠판에 새긴다", fixed: true}
    - {days: workday, from: "08:00", to: "12:00", at: dh_signing_desk, doing: 서명 책상에서 올라온 쇠판에 피 한 방울을 찍는다}
    - {days: workday, from: "12:00", to: "13:00", at: dh_king_hall, doing: 점심을 들며 문지기 대장의 보고를 듣는다}
    - {days: workday, from: "14:00", to: "18:00", at: dh_king_hall, doing: 족장과 서기를 접견하고 계약 문구를 대조한다}
    - {days: all, from: "18:00", to: "20:00", at: dh_king_hall, doing: 깊은 문 경비 보고를 듣는다 — 마흔한 명의 계약이 깨졌는지 매번 묻는다, fixed: true}
    - {days: all, from: "20:00", to: "00:30", at: dh_king_forge, doing: 대장간에서 철판 하나에 사흘을 쏟는다 — 왕의 망치질, fixed: true}
    - {days: sabbath, from: "08:00", to: "12:00", at: dh_oath_gallery, doing: 맹세 회랑을 한 바퀴 돈다 — 413번 좌대 앞은 지나간다}
