# 숨겨진 반용 (O-11)의 새 사람 셋의 일과 — 모두 비늘 언덕 화염문 저택 (bk_sh_flamegate). 회귀점의 무대(stage)는 대본 장면이 덧씌운다.
npc_o11_lucan:
  home: bk_sh_flamegate
  blocks:
    - {days: all, from: "01:00", to: "10:00", at: bk_sh_flamegate, doing: 늦잠을 잔다 — 사냥 가죽옷을 벗지 않은 채}
    - {days: workday, from: "10:00", to: "17:00", at: bk_hall_red_hall, doing: "붉은 홀 — 아우락스 전하의 젊은 불의 손들과 노예 경기를 본다", alt: {p: 0.4, at: bk_sh_flamegate, doing: 저택 마당에서 사냥매와 드레이크를 손본다}}
    - {days: sabbath, from: "10:00", to: "17:00", at: bk_sh_flamegate, doing: 저택 마당 — 사냥매에게 생고기를 먹인다}
    - {days: all, from: "17:00", to: "01:00", at: bk_sh_flamegate, doing: 연회 — 젊은 순혈들과 잔을 돌린다}
npc_o11_herm:
  home: bk_sh_flamegate
  blocks:
    - {days: all, from: "04:00", to: "18:00", at: bk_sh_flamegate, doing: 부엌 — 화덕 넷을 지피고 고기를 재운다}
    - {days: all, from: "18:00", to: "21:00", at: bk_sh_flamegate, doing: 연회 요리 — 접시를 위층으로 올려 보낸다}
    - {days: all, from: "21:00", to: "23:00", at: bk_sh_flamegate, doing: 꺼져 가는 화덕 앞에 앉아 칼을 간다}
    - {days: all, from: "23:00", to: "04:00", at: bk_sh_flamegate, doing: 화덕 곁 짚더미에서 잔다}
npc_o11_kruk:
  home: bk_sh_flamegate
  blocks:
    - {days: all, from: "04:30", to: "20:30", at: bk_sh_flamegate, doing: 막대를 들고 부엌과 하인 계단을 돈다, alt: {p: 0.3, at: bk_sh_flamegate_laundry, doing: 세탁장 — 잿물 통의 수를 센다}}
    - {days: all, from: "20:30", to: "04:30", at: bk_sh_flamegate, doing: 하인 숙소 문 앞 의자에서 존다}
