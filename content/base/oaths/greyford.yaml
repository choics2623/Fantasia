# 맹세 최소판 (16 §5.2·§5.3·§5.8). 계기가 오면 선택지 하나로 제안된다. 고르면 그 자리 사람들이 증인이 된다.
# fulfill / broken: 목표 행동 조건 문법. deadline이 지나는 순간 판정한다.
# 회귀하면 증인은 잊는다. 맹세는 주인공의 기억 속에만 남는다 — 다음 회차에 같은 조건이 참이면 "지켜졌다. 아무도 모른다."
oaths:
  - id: oath_kit
    line: 키트는 팔리지 않는다.
    offer_when: ["var goal_kit_known == true"]
    deadline: "312-10-09 07:00"
    broken: ["var kit_sold == true"]
  - id: oath_sara
    line: 사라는 둘째 호송에 오르지 않는다.
    offer_when: ["var goal_sara_known == true"]
    deadline: "312-12-03 07:00"
    broken: ["var sara_sold == true"]
  - id: oath_fayne
    line: 페인은 하겐의 배에 오르지 않는다.
    offer_when: ["pknows fact_gf_hagen_sells_runaways"]
    deadline: "312-09-22 06:00"
    broken: ["var fayne_saved != true", "var hagen_offer_accepted == true"]
