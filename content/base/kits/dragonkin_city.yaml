# 지역 생성 키트 — 용인 도시 (25_REGION_KITS.md). 바알카르와 용인 성읍의 이름 없는 사람들이 이것으로 태어난다.
# 원천: REGIONS §1 (바알카르), HOUSES §1.7·§2, fac_drakmar_empire(관습·법·말투), fac_krik, fac_collar, fac_barg.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_drakmar_empire.customs / law, fac_krik, fac_collar 를 본다.
# 인간 노예의 이름·말투는 kit_human_serf를 재사용하고, 여기에는 도시 노예에만 있는 것(사슬 표찰, 하역 수신호, 재 글씨)만 더한다.
id: kit_dragonkin_city
applies_to: [드라크마르 용좌령, 바알카르, 용인 성읍, 붉은 첨탑 성하, 하스트 요새 성하, 오르셀 나루]
reuses: [kit_human_serf]          # 인간 노예의 이름 목록·말투 원형은 그쪽에서 뽑는다
faction_refs: [fac_drakmar_empire, fac_scale_council, fac_krik, fac_collar, fac_barg, fac_rat_crown]
names:
  용인:
    # 용인은 '이름 + 가문명'. 가문이 없는 비늘혈은 '○○의 비늘'(섬기는 가문·용) 또는 별칭.
    # 순혈은 고어풍 긴 이름, 비늘혈은 짧고 단단한 이름을 즐긴다.
    pure_male: [세베로, 아우렐, 카시우스, 마르셀, 테오도르, 라디슬라프, 오렐리안, 율리안, 데키무스, 플라비안, 코르넬, 세라핀]
    pure_female: [오렐리아, 리비아, 로잘린드, 세실리아, 비비안, 클라우디아, 이레나, 마리엘, 코델리아, 아스트리드]
    scale_male: [드레크, 바렌, 카델, 토르, 헤른, 그라임, 오스크, 브란트, 렘, 시그바르트, 볼코, 하크]
    scale_female: [에다, 마르가, 테아, 빌마, 린데, 스벤야, 오다르, 헤사, 이르마, 브루나]
    houses_minor: [하스크, 쇠목, 재손톱, 붉은띠, 굽은창, 놋비늘, 검은홰, 다섯줄, 반칼, 숯턱]
    epithet_rule: "순혈: 이름 + 대가문명. 비늘혈: 이름 + 소가문명 또는 '○○의 비늘'. 공적인 자리에서 가문명을 먼저 말한다 (칼다란의 세베리안)"
  와이번:
    # 왕관 와이번은 '이름 + 둥지 가문'. 기사·잿빛 와이번은 번호와 날개대 이름.
    crown: [볼가스, 테사르, 이르마스, 모르나, 엘렌드, 카이도르, 사르밧, 헤렌, 오르크, 비스카]
    nests: [높은홰, 청동발, 긴그림자, 재날개, 흰목, 녹청관]
    knight: ["{n}번 깃", "테사르의 깃", "검은 깃 {n}", "쌍발톱 {n}"]
    grey: ["잿빛 {n}", "짐날개 {n}", "회색 {n}"]
  크릭:
    # 크릭은 이름이 짧고 된소리·혀차는 소리가 많다. 길드 서열이 오르면 꼬리 수(별명)가 붙는다.
    male: [스킥, 즈닉, 빅스, 틱, 핍, 그림, 고르, 렉, 칙, 뷕, 짝, 스낙, 크락, 피프]
    female: [숨, 니브, 시스, 치크, 마브, 우그, 찍, 삐야, 쓰릭, 키타]
    given_by_master: ["셋꼬리", "여섯꼬리", "놋귀", "굽은등", "그을음", "{n}번 손"]
  바르그:
    male: [볼크, 그로드, 하르크, 테쉬, 우르, 갈름]
    female: [이르가, 루가, 세타, 브렌, 오샤]
    epithet_rule: "이름 + 털빛·흉터 별명 (회색송곳니, 붉은귀, 이빨잡이)"
  나가:
    any: [지올, 모스, 사스리, 엘루, 니에바, 시렌, 카사]
  인간:
    # 인간 이름은 kit_human_serf.names.인간 을 쓴다. 도시 노예에게만 붙는 부름:
    given_by_master: ["{소유 가문} {n}호", "표찰 {n}", "물통", "짐", "열둘째", "갈고리", "목청", "숯손"]
    epithet_rule: "주인이 부르는 표찰 번호(사슬 표찰의 숫자) + 동료가 부르는 별명(일·생김새) + 진짜 이름(어머니만). 바알카르 태생은 진짜 이름이 없는 경우가 많다"
classes:            # 바알카르 인구 약 13만에서의 비율 (REGIONS §1.4)
  인간 국유 노예: 0.38
  인간 사유 노예: 0.31
