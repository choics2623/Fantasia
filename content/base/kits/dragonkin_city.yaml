voices:             # 말투 원형 — kit_human_serf.voices 에 더해 도시에서만 나는 목소리
  - {id: v_ledger, name: 장부의 용인, register: "하십시오체, 끝을 한 박자 낮춘다. 인간에게는 직접 말하지 않고 집사에게 묻는다", tics: ["'값으로 말하자면'"], use: [장부, 값, 머릿수, 낙인, 기한], avoid: [잃었다, 도둑], sample: "저것의 값으로 말하자면 금화 두 닢이 넘지 않소. 집사, 저것을 치우게."}
  - {id: v_pure_disdain, name: 오만한 순혈, register: "느린 하오체, 비늘혈에게도 반말에 가깝다", tics: ["'피가 묽군.'"], use: [피, 비늘, 서약, 가문], avoid: [섭정, 이후], sample: "피가 묽군. 비늘 수를 세어 보았나? 세지 마라. 부끄러운 숫자일 테니."}
  - {id: v_krik_cringe, name: 엎드리는 크릭, register: "강한 자에겐 끝없는 존대, 약한 자에겐 혀 차는 반말", tics: ["'흐흥.'", "'강하신 분께서…'"], use: [강한, 주인, 채찍, 목록], avoid: [자유], sample: "흐흥, 강하신 분께서 물으시니 답합죠. 저 인간은 어제도 늦었습죠."}
  - {id: v_wyvern_record, name: 대독되는 와이번, register: "크릭 서기가 대신 읽는다. '기록에 의하면'으로 시작", tics: ["'기록에 의하면'"], use: [기록, 홰, 배당, 원로], avoid: [도마뱀], sample: "(서기가 읽는다) '기록에 의하면 너는 장부 밖이다. 장부 밖은 없다.'"}
  - {id: v_dock_signs, name: 수신호 하역꾼, register: "말이 거의 없다. 손이 대신 말한다 (노예말 수신호)", tics: ["손가락 두 개로 어깨를 두드린다 — '새벽'"], use: [짐칸, 밧줄, 물때, 새벽], avoid: [이름], sample: "(입은 다물고 손가락이 움직인다) …짐칸. 둘째 종. 물 없음."}
  - {id: v_collar_city, name: 수도의 목줄, register: "인간에게 반말, 용인에게 바닥까지 존대. 남의 이름을 일부러 크게 부른다", tics: ["'표찰 보여.'"], use: [표찰, 장부, 밀고, 배급 가산], avoid: [동족], sample: "표찰 보여. 번호 없는 목은 내가 먼저 적는다."}
  - {id: v_ash_slum, name: 재받이 사람, register: "반말, 기침 섞인 짧은 말. 그림자가 길 때 목소리를 더 낮춘다", tics: ["'그림자 밟지 마.'"], use: [재, 기침, 하수구, 그림자], avoid: [용의 이름], sample: "그림자 밟지 마. 해 질 때는 고개 숙이고 걸어. 그래야 재가 안 돼."}
  - {id: v_naga_lender, name: 나가 대금업자, register: "부드러운 하게체, 숫자를 노래처럼", tics: ["'이자는 기다려 주지 않지요.'"], use: [두카트, 담보, 기한, 서명], avoid: [], sample: "서명만 하시면 됩니다. 이자는 기다려 주지 않지요. 기다리는 건 저 하나뿐이고요."}
temperaments: [오만, 계산, 아첨, 무심, 의심, 체념, 잔혹, 비굴, 겁, 영리, 다정, 앙심, 탐욕, 결벽, 냉정]
city_customs:       # 도시에서만 있는 것 — 법·관습 본문은 fac_drakmar_empire.law/customs
  - "바알카르 시내 인간은 목에 '사슬 표찰'(소유주 각인 쇠판)을 단다. 표찰 없는 인간은 층계 검문에서 태형 20"
  - "층계구역 일곱 — 위로 갈수록 용인. 인간은 소유주의 일 없이는 자기 층 위로 오르지 못한다 (층계 검문소)"
  - "해 질 녘 그림자가 길 때 노예는 고개를 숙이고 걷는다 ('용의 그림자를 밟으면 다음 생에 재가 된다')"
  - "용좌봉 증기 재가 내리는 여름엔 '재 쓸이' 노예가 층계를 쓴다. 재 빵(동화 5닢)은 용인 귀족의 사치"
  - "사슬 부두 하역 노예의 노예말 수신호 — 출항 시각·짐칸 수·물 유무 (지식:노예말_수신호)"
  - "재 글씨 — 아궁이 재 위에 손가락으로 쓰고 바로 지운다 ('등잔' 세포)"
