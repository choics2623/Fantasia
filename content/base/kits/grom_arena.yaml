# 지역 생성 키트 — 그롬마르 붉은 황야 (25_REGION_KITS.md). 피의 원형장 도시, 쇠우리(백 개의 문), 해골이빨 전쟁 숙영지와 뼈 행렬 막사, 그롬마르 항과 쇠 시장.
# 원천: REGIONS §16, RACES §13, SUBRACES(그롬), HOUSES §3.7(그롬 전쟁무리)·§4.4(백승가)·§5.7(투사 조합), fac_grom·fac_arena_guild·fac_hundred_wins(힘의 서열·도전제·승수 사다리·붉은 젖).
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_grom.customs / law / decision, fac_arena_guild.customs 를 본다.
# 핵심: 그롬에게 서열은 결투가 정하고 도전은 거절할 수 없다. 싸움이 30일 없으면 쇠약해지므로 대련은 하루도 거르지 않는다. 인간은 투사 아니면 소모품이다 —
#       투사는 승수가 계급이고(10승 이름·25승 천막·50승 제자·100승 '혈명 없는 혈명'), 그롬마르에서만 인간이 합법적으로 무기를 든다. 100승의 보상은 붉은 젖의 목줄이다.
id: kit_grom_arena
applies_to: [피의 원형장, 뼈의 전당, 쇠우리(백 개의 문), 피의 샘, 해골이빨 전쟁 숙영지, 뼈 행렬 막사, 그롬마르 항, 쇠 시장, 그롬 씨족 요새]
reuses: [kit_human_serf]       # 소모품의 노동 틀은 농노 키트를 쓰되 '원정 첫 열'과 '귀리죽 2'로 바꾼다
faction_refs: [fac_grom, fac_arena_guild, fac_hundred_wins, fac_seren, fac_krik]
seasonal_calendar:   # REGIONS §16.2
  봄 (해빙월~꽃월): "원형장 예선 — 투사 후보 선발. 푸른월 전 '피의 소집'(전쟁군주 회합)"
  여름 (푸른월~건초월): "전쟁 시즌. 태양월 피의 원형장 대축제 — 한 달 경기, 마지막 날 100승 도전 경기와 대전쟁군주 도전. 대륙 최대 군중"
  가을 (수확월~낙엽월): "원정(하르칸 분쟁) — 소모품 병사 징발, 해골이빨 전쟁 숙영지 출정"
  겨울 (서리월~굶주림월): "항구 폭풍철 — 굶주림월 바닷길 단절"
names:
  그롬:
    # 짧고 거센 음절. 씨족명은 문장(해골이빨·피도끼·쇠턱·재울음). 별칭은 흉터·무기·몸이다. 이름이 곧 서열이 아니다 — 서열은 흉터 수와 눈의 높이다.
    male: [우르가쉬, 크로그, 크롤, 보르그, 고르바, 울브, 무르크, 바그, 도라크, 슈카, 흐락, 모르그, 투그, 카자크, 레그]
    female: [얄라, 쉬라, 그라샤, 우르크, 도카, 크레샤, 샤르카, 막, 브라나]
    clans: [해골이빨, 피도끼, 쇠턱, 재울음]
    epithet_rule: "이름 + 몸·무기·흉터 별칭(붉은손톱·백상처·쇳주먹·피웃음·일곱흉터) + 씨족명. 흉터는 앞은 자랑이고 등은 덮지 않는다. 이름을 불러 주는 것이 최고의 인정이다"
    size_note: "전쟁 그롬 2.5~3m, 붉은 그롬은 단명(대개 25~30에 광란), 오그림은 3m 넘는 거구 공성 계급, 잿빛 그롬은 변방. 평균 수명 40~55 (전사하지 않으면 70~80)"
  인간:
    # 투사는 승수로 불린다 ('일흔여덟', '아흔넷'). 10승부터 투사명이 허락된다. 그 전에는 번호나 몸의 별명이다. 소모품은 이름이 없고 '뼈 행렬 N번'이다.
    male: [오그, 하르트, 쿠르트, 카렐, 브로, 에르크, 얀, 마르텐, 도리안, 레프, 브란, 올레]
    female: [마라, 미아, 이레나, 에이다, 노라베, 헬가, 리사, 세냐, 우나, 이바]
    given_by_wins: ["{n}번 새끼", "일곱째 문", "외팔", "철턱", "아직", "문턱", "이빨 없는", "아흔아홉"]
    epithet_rule: "투사 후보는 번호나 몸의 별명 → 10승에 투사명(철턱·외팔·아흔둘) → 승수가 이름 뒤에 붙는다. 소모품은 이름이 없고 뼈 행렬 번호로 불린다. 전투어 섞인 짧은 노예말을 쓴다"
  크릭:
    male: [틱틱, 딸깍, 슬릭, 브릭, 핍, 스니]
    female: [찍, 삐야, 치크]
    note: "그롬마르 크릭 약 4,000 — 관중 노점, 내기장 장부, 무기 수리, 항구 하역. 그롬은 돈을 경멸하므로 크릭이 내기를 대신 센다"
  나가:
    male: [케스, 오스모]
    female: [세이라, 이르사]
    note: "그롬마르 항 나가 약 300 — 상관, 노예 중개, 쇠 시장. 세렌 테르사 상가가 쇠턱 씨족과 용병 계약을 맺는다"
classes:            # 피의 원형장 도시 기준 (그롬 약 30,000 가운데 도시 인구, 인간 투사 약 2,400, 소모품·노역 일부)
