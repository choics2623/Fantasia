voices:             # 말투 원형 — 그롬은 짧고 거친 전투어, 서열은 호칭이 아니라 흉터 수와 눈의 높이
  - {id: v_grom_warrior, name: 그롬 전사, register: "짧은 명령형. 존칭이 없다. 완곡어는 약함이다 — 거절은 '싸우자', 동의는 '받는다'. 인간 투사에게도 같은 전투어로 말한다", tics: ["'몇 개냐?' (흉터)", "'받는다.'"], use: [피, 흉터, 받는다, 싸우자, 이름, 모래], avoid: [미안, 제발, 늙었다(스스로), 도망], sample: "몇 개냐. 앞의 흉터는 인정한다. 등의 흉터는 묻지 않겠다. 싸울 거면 받는다 — 아니면 비켜라."}
  - {id: v_grom_elder, name: 늙은 그롬 (심판·사제), register: "느리고 낮은 전투어. 한 문장마다 피를 말한다. 인간을 '승수'로 부른다. 과거를 말하는 것이 그롬에게는 치욕이라 선례로 돌려 말한다", tics: ["'피가 말한다.'"], use: [피, 선례, 모래, 도전, 판정, 숫자(승수)], avoid: [미래(내일), 자비], sample: "피가 말한다. 모래에 쓰러진 자가 일어나면 이름을 부른다. 일어나지 못하면 숫자로 남는다."}
  - {id: v_human_fighter, name: 인간 투사, register: "그롬 전투어가 섞인 짧은 노예말. 숫자(승수)로 사람을 부른다. 미래형을 쓰지 않는다 — '내일 이긴다'가 아니라 '내일 싸운다'. 감정은 새김과 칼로 말한다", tics: ["'아직?' — '아직.'", "'몇 승?'"], use: [아직, 승수, 숙소, 칼, 이름, 흉터], avoid: [자유, 해방(경기 전날 밤), 미래형, 100승(문턱 앞에서)], sample: "몇 승. 나는 일흔여덟. 내일은 싸운다. 이긴다는 말은 하지 않는다 — 이름은 이긴 뒤에 부른다."}
  - {id: v_expendable, name: 소모품 병사, register: "낮고 짧은 평어. 번호와 갑옷 조각으로 서로를 안다. 무기를 버리지 않는 것이 유일한 자존이다", tics: ["'버리지 마.'", "'번호 몇이야.'"], use: [번호, 갑옷 조각, 첫 열, 귀리죽, 녹, 버린], avoid: [투사(부러움), 원정(두려움)], sample: "번호 몇이야. 갑옷 조각은 한 번 입으면 벗지 마 — 벗기면 그롬이 가져가. 무기는 버리지 마. 녹슬어도 쥐고 있어."}
  - {id: v_krik_bettor, name: 크릭 내기꾼, register: "혀 차는 소리와 빠른 존대. 그롬 앞에서는 낮은 평어까지 낮춘다. 내기 비율을 숨 쉬듯 말한다", tics: ["'값은 한 번 오릅니다요.'", "'이빨 하나에 사람 하나.'"], use: [내기, 값, 승수, 이빨, 비율, 모래], avoid: [패배(투사 앞에서), 조작], sample: "값은 한 번 오릅니다요. 승수 일흔여덟에 한 모금, 아흔넷에 두 모금입죠. 이빨 하나에 사람 하나."}
  - {id: v_naga_trader, name: 나가 상인, register: "부드럽고 느린 상인어. 그롬에게는 거래의 형식을 지키는 척한다. 값은 이빨과 쇠로만 말한다", tics: ["'표식을 보여 주시지요.'"], use: [표식, 쇠, 이빨, 값, 계약, 허락], avoid: [그롬 경멸(드러내지 않는다)], sample: "표식을 보여 주시지요. 투사 표식이 있으면 칼을 팔고, 없으면 쇠 부스러기를 팝니다. 값은 이빨 한 개부터."}
temperaments: [용맹, 과묵, 자존, 완고, 계산, 겸손, 의심, 체념, 반골, 광기, 다정, 경건, 앙심, 영리, 냉정]
grom_customs:       # 그롬마르에서만 있는 것 — 법·관습 본문은 fac_grom.law/customs, fac_arena_guild.customs
  - "인사는 '몇 개냐?' — 흉터 수와 위치로 서열을 읽는다. 앞의 상처는 인정하고 등의 상처는 말하지 않는다. 도전의 말('받는다')이 가장 정중하다"
  - "투사끼리는 오른 주먹으로 상대 가슴의 승수 흉터를 한 번 친다. 낮은 쪽이 먼저. '아직?' — '아직.'"
  - "승수 긋기 — 이긴 밤 동료가 가슴에 칼자국 하나를 긋는다. 같은 막사 동료를 이기면 이름을 팔 안쪽에 새긴다 (마라의 87승 가운데 셋)"
  - "침대에서 죽는 것, 늙어 죽는 것은 수치다. 늙은 그롬은 도전에 나서 죽는다"
  - "경기 전날 밤 상대의 이름을 부르지 않는다 (투사 조합). 백승가만 이름 부르기로 서로를 베어도 된다고 한다"
  - "원형장 밖에서 투사를 해치면 모든 씨족의 사냥감이 된다. 투사는 원형장의 것이다"
  - "붉은 젖 — 100승 인간에게 그롬 분노샘의 짠 즙을 먹이는 '혈명 없는 혈명'. 그롬은 그것을 명예라 믿는다. 끊으면 인간 몸은 금단으로 무너진다"
