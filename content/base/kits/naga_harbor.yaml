# 지역 생성 키트 — 나가 항구 (25_REGION_KITS.md). 세렌 항구·갈림목·산호 채석장·아르카스 부두, 그리고 나가 상선이 닿는 모든 항구.
# 원천: REGIONS §9(9.5 인간의 삶·9.6 경제·9.7 법·9.8 문화), HOUSES §3.4(열두 의석)·§5.10(먹물비늘 조합), fac_seren, fac_inkscale, fac_salt_tongue, docs/world/people/seren.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_seren.law / customs / decision 을 본다. 여기에는 '나가 항구에만 있는 재료'(계약민의 하루, 빚 문서, 물속 장부, 상가 문장, 그믐의 대가)를 더한다.
# 핵심: '공짜'는 모욕이다. 나가는 대가 없이 아무것도 줄 수 없고 인간 계약민은 시간을 이자로 낸다. 인간 농노 키트의 반대: 매질이 아니라 계산이 가둔다.
id: kit_naga_harbor
applies_to: [세렌, 갈림목, 산호 채석장, 아르카스 부두, 그롬마르 항 세렌 상관, 소금 나루]
reuses: []
faction_refs: [fac_seren, fac_inkscale, fac_salt_tongue, fac_krik, fac_beastkin]
names:
  나가:
    # 왕관 나가: 이름 + 상가 이름. 이름은 부드러운 ㅅ·ㄹ·ㅁ이 많고 두세 음절. 상가 문장이 곧 성이다.
    male: [루치오, 졸라크, 노르발, 페스카르, 고르도, 세보, 룬, 시르, 도나, 오필, 세베로, 테르사]
    female: [베아트릭스, 오필리아, 시렌나, 마르디, 아다, 아마란트, 도나, 시르]
    house: [몬달리, 카셀론, 루첸티, 바드라, 오필, 테르사, 시렌나, 마르디, 졸라크, 페스카르, 아마란트, 노르발, 오랄, 카이르, 세파, 벨렌, 리크, 칼레스]
    epithet_rule: "이름 + 상가 이름(베아트릭스 몬달리). 의석주는 '의석주 ○○', 중개인은 '인장 중개인 ○○'. 나이가 곧 신용이라 나이를 묻는 것은 예의다(몇 탈피냐)"
    age_rule: "왕관 나가는 600~900세, 탈피 1회 약 30~40년. 세렌 의석주는 200~540. 탈피가 늦어지는 것은 노화의 징후 — 말하지 않는다"
  라미아:
    male: [루포, 쉬렐, 미끌, 탄]
    female: [사바, 이나]
    note: "하위 나가. 상반신 인간형, 하반신 짧은 뱀 꼬리. 의회 변론권이 없고 하인·중개인·밀수꾼으로 산다. 별명은 몸에서 온다('미끄럼' '빈 장부')"
  인간:
    # 계약민은 이름 대신 번호와 빚으로 소개한다. 번호는 계약 시장이 매긴다 — 이름은 마음속에만. 자유민은 이름 + 성 한 글자.
    male: [미코, 얀, 오스카, 올라프, 스튜, 하비, 도르, 칼, 니크, 보르, 렌]
    female: [카타리나, 리스, 아냐, 마야, 에리카, 로사, 테티, 올가]
    contract_id: "S-{번호} (예: S-11847). 소개는 '서른하나, 스물두 해 남았지' — 빚 두카트와 남은 상환 해로"
    epithet_rule: "하는 일 + 빚 숫자(스물두 해 미코). 자유민은 '셈손' '장부'처럼 하는 일에서 성을 짓는다"
  크릭:
    male: [스크레, 쏙, 핍, 틱틱, 찍]
    female: [치크, 삐야]
    note: "세렌 크릭 약 5,000 — 하역·장부 보조. 하역꾼 우두머리가 열둘을 쥔다. 크릭도 빚이 있다"
  용인:
    male: [도미닉, 마틴, 베르톨드]
    note: "세렌 용인 약 1,200 — 상관·용병·재무청 파견. 나가는 용인을 '불꽃의 하인'이라 부르고 용인은 나가를 '비늘 빌려 쓰는 상인'이라 부른다"
  수인족:
    note: "타이란(범) 사하르 등 소수 — 의회 경호. 바울피(여우) 레니 같은 정보상"
