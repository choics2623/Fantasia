voices:             # 말투 원형 — 나가는 값을 먼저 말하고 계약민은 숫자로 말한다
  - {id: v_naga_merchant, name: 나가 상인, register: "정중한 존대. 문장 끝에 값이 붙는다. '무엇을 가져오셨나요?'로 시작한다. 공짜라는 말을 쓰지 않는다. 인간은 '손님' 또는 '번호'로 부른다", tics: ["'값은 먼저.'", "'대가가 없다면.'"], use: [값, 대가, 계약, 서명, 정산, 이자, 장부], avoid: [공짜, 선물(대가 없는), 깎다], sample: "서명하지 않으셨군요. 그렇다면 아직 우리 사이에는 말이 있을 뿐이에요."}
  - {id: v_contractee, name: 계약민, register: "숫자로 소개한다 — 빚 몇 두카트, 몇 해 남았다. 짧은 평어, 나가에게는 낮은 존대. 이름은 마음속에만", tics: ["'몇 해 남았지.'", "'얼마야?'"], use: [빚, 두카트, 이자, 숙식비, 번호, 해], avoid: [자유(먼저), 이름(먼저), 주인], sample: "나는 서른하나. 스물두 해 남았지. 여기선 그게 이름 대신이거든."}
  - {id: v_lamia, name: 하위 라미아, register: "느리고 조용한 존대. 대가를 입 밖에 먼저 낸다. 꼬리가 짧다는 말에 민감하다", tics: ["'숫자 하나만.'"], use: [숫자, 대가, 상담, 물때], avoid: [꼬리, 하인, 공짜], sample: "상담은 무료입니다. 아, 아니요, 정정하죠. 나가는 무료를 못 해요. 대신 하나만 말해 주세요."}
  - {id: v_krik_hauler, name: 크릭 하역꾼, register: "빠르고 작은 말. 나가에게는 굽신한 존대, 인간에게는 은근한 반말. 장부 이야기에 눈이 커진다", tics: ["'하역표 보여 주세요.'"], use: [하역표, 번호, 장부, 열둘, 밤], avoid: [스물셋, 밤 하역], sample: "하역표 보여 주세요. 표 없으면 하역 못 해요. 표 없으면 사람이 없는 거예요."}
  - {id: v_broker, name: 중개인, register: "서류를 먼저 내민다. 서명은 엄지로도. 값은 부르지 않고 서류의 줄로 보인다", tics: ["'서명은 엄지로도.'"], use: [서류, 인수, 정산, 줄, 인장], avoid: [지운 줄, 서른일곱], sample: "서명은 엄지로도 됩니다. 어느 쪽이 편하십니까?"}
  - {id: v_auctioneer, name: 경매관, register: "크고 노래처럼 이어지는 호가. 사람을 로트 번호로 부른다", tics: ["'열 발톱 하나, 열 발톱 둘!'"], use: [로트, 호가, 낙찰, 이빨, 발톱], avoid: [담합, 이름], sample: "오늘의 로트, 서른둘! 이빨 보여 주고!"}
temperaments: [계산, 겸손, 탐욕, 인내, 겁, 영리, 냉정, 다정, 비굴, 집요, 체념, 눈치, 속정, 자존, 은밀]
naga_customs:       # 나가 항구에서만 있는 것 — 법·관습 본문은 fac_seren.law / customs, REGIONS §9.7·§9.8
  - "'공짜'는 모욕이다. 나가는 대가 없이 아무것도 줄 수 없다 — 대가가 없으면 빚으로 적힌다. 인사는 '무엇을 가져오셨나요?'"
  - "계약서를 찢으면 신성모독이다. 서명은 엄지로도 유효하다 — 글을 모르는 계약민 때문"
  - "그믐 밤 신전 앞바다에 '대가'(값비싼 물건)를 던진다. 던진 물건이 곧 그달의 빚 정산이다. 그믐 밤 바다에 침 뱉기는 금기"
  - "계약민은 빚을 다 갚으면 자유민이 된다 — 실제로 갚은 자는 1.8%. 소개는 번호와 남은 해로 한다"
  - "계약민은 판관에게 '청원'할 권리가 있다 (대륙에서 유일). 승소율 4%"
  - "숫자는 합법이다 — 글자(숫자 외)는 벌금 5 두카트. 그래서 숫자로 사기를 증명하는 것은 '합법적 반란'이다"
  - "의석은 사고판다 (최근 거래 AS 266, 9만 두카트). 표의 값은 의회 기록 수조 — 물속 장부에 적힌다"
