# 지역 생성 키트 — 광산 노예 숙영지 (25_REGION_KITS.md). 잿불 언덕의 갱 마을·제련 노예 우리, 두르강 계약 광산 바깥 갱에도 쓴다.
# 12시간 2교대: 검은 교대(06~18시, 점호 05:30) / 붉은 교대(18~06시, 점호 17:30). 갱 안에는 낮이 없다 — 교대 사이 1시간이 배급과 점호다.
# 법·처벌·관습은 키트에 다시 쓰지 않고 세력 데이터를 가리킨다: fac_vermion(갱조, 연좌, 낙반 보고), fac_krik(감독, 목록), fac_darason(손 벽), fac_collar(목줄장).
id: kit_mine_slave
applies_to: [잿불 언덕 본갱·굴 마을, 잿문 제련 노예 우리, 두르강 계약 광산 바깥 갱]
names:
  인간:
    # 인간은 성이 없다. 갱에서는 갱조 번호(구리 목걸이)와 갱이 붙인 별명, 어머니만 아는 진짜 이름이 따로 있다.
    male: [칼렙, 하로, 레오닉, 로크, 얀, 마테, 쿠르트, 베른, 오토, 도넬, 헤르만, 타이스, 에드, 브란, 닐스, 울리, 라스, 아르네, 볼프, 하인]
    female: [도르테, 야나, 웨나, 이다, 한나, 마리, 에다, 일제, 그레테, 루트, 베타, 클라라, 헬가, 우테, 프리다, 엘케, 잉에, 소피, 안나, 리스베트]
    given_by_mine: ["{갱}번 {조}조", "코", "절름", "곰보", "숯", "벙어리", "외귀", "먼지", "여덟째", "꼬마", "휘파람(금기 별명 — 벌 받은 자)", "손바닥"]
    epithet_rule: "갱조 번호(감독이 부르는 이름) + 갱 별명(몸의 흉터·냄새·버릇) + 진짜 이름(어머니와 벽의 손자국만)"
  크릭:
    # 크릭은 수명이 40년 안팎이다. 이름은 짧고 소리 나는 것이며, 감독관은 몸의 특징을 붙인다.
    male: [닛, 볼트, 크라즈, 그락스, 퀴프, 쥐, 틱, 소르크, 핀, 짹, 드릭, 쿠즈]
    female: [치르, 핍, 소프, 니아, 미크, 제카]
    epithet: [셋꼬리, 외눈, 마른이빨, 빨강귀, 넷째, 긴코, 절름, 잿손]
  용인:
    male: [하드리안, 티베리온, 바르토, 드루스, 카시안, 에반, 소렐, 카셀, 로엔, 가르스, 오르딘, 마르쿠스]
    female: [오렐리아, 아멜리, 소르가, 이르샤, 베라, 카트라, 엘로이]
    surname_rule: "순혈과 비늘혈은 성(가문 이름)을 가진다. 광산 직위의 용인은 가문 이름 뒤에 몸의 별명(숯턱·연기쇠·잉크)이 붙는다"
  두르강:
    male: [오린, 발람, 토르크, 케른, 도린]
    female: [브룬, 헬가, 오달]
    surname_rule: "별명은 쇠붙이 이름 — 쇳줄, 재송곳, 깨진모루. 계약 기술자는 계약석의 번호를 가슴에 새긴다"
classes:            # 광산 인구의 신분 비율 (잿불 본갱 기준)
  갱 노예: 0.72
  제련·운반 노예: 0.12
  숙련 노예: 0.05     # 지지대 목수, 대장간, 병동, 취사
  목줄단: 0.02
  크릭 감독: 0.04
  용인 관리·경비: 0.04
  두르강 기술자: 0.001
