  sch_ward:        [{days: all, from: "06:00", to: "20:00", at: infirmary, doing: 검은 폐 환자를 돌본다}, {days: all, from: "20:00", to: "06:00", at: infirmary, doing: 야간 기침 소리를 센다}]
  sch_collar:      [{days: all, from: "05:30", to: "06:30", at: roll_yard, doing: 점호 곁에서 이름을 센다}, {days: workday, from: "07:00", to: "17:00", at: burrow_black, doing: 굴을 돌며 귀를 연다}, {days: all, from: "19:00", to: "21:00", at: post, doing: 감독에게 보고}, {days: all, from: "22:00", to: "05:00", at: barracks_staff, doing: 막사 문 옆 침상}]
  sch_overseer_black: [{days: all, from: "05:30", to: "06:00", at: roll_yard, doing: 점호 — 번호를 못 대면 입갱 지연, fixed: true}, {days: workday, from: "06:00", to: "17:30", at: drift, doing: 채찍을 쥐고 갱을 돈다}, {days: all, from: "17:30", to: "18:30", at: roll_yard, doing: 저녁 점호, fixed: true}, {days: all, from: "19:00", to: "23:00", at: post, doing: 초소 — 명단과 맥주}, {days: all, from: "23:00", to: "05:00", at: barracks_staff, doing: 잔다}]
  sch_overseer_red:   [{days: all, from: "17:30", to: "18:00", at: roll_yard, doing: 점호, fixed: true}, {days: workday, from: "18:00", to: "05:30", at: drift, doing: 채찍을 쥐고 야간 갱을 돈다}, {days: all, from: "05:30", to: "06:30", at: roll_yard, doing: 아침 점호, fixed: true}, {days: all, from: "07:00", to: "16:00", at: barracks_staff, doing: 잔다}]
  sch_guard:       [{days: all, from: "06:00", to: "18:00", at: post, doing: 초소·갱 어귀 경비}, {days: all, from: "18:00", to: "22:00", at: barracks_staff, doing: 막사}, {days: all, from: "22:00", to: "06:00", at: barracks_staff, doing: 잔다}]
  sch_clerk:       [{days: workday, from: "07:00", to: "17:00", at: office, doing: 장부 — 낙반 3, 열병 7}, {days: all, from: "18:00", to: "22:00", at: barracks_staff, doing: 숙소}]
  sch_engineer:    [{days: workday, from: "07:00", to: "18:00", at: works, doing: 지지대·환기 설계와 지도 정리}, {days: all, from: "19:00", to: "22:00", at: works, doing: 맹세의 문구를 다시 읽는다}]
voices:             # 말투 원형 — 즉석 생성 인물이 하나를 받아 변주한다 (22 §1.1)
  - {id: v_tapper, name: 벽을 두드리는 자, register: "반말, 입을 거의 열지 않는다. 손가락으로 벽이나 허벅지를 두드려 말을 대신한다", tics: ["'…(두 번 두드린다)'"], use: [갱, 소리, 버팀목, 둘, 셋], avoid: [이름, 노래], sample: "(손가락 두 번) …여긴 귀가 있어. 입 닫아."}
  - {id: v_counter, name: 숫자로 말하는 자, register: "반말, 모든 것을 수로 말한다", tics: ["'…몇 수레야?'"], use: [수레, 바가지, 번, 조, 교대], avoid: [내일], sample: "물 두 바가지에 빵 반 덩이. 어제 셈이 틀렸으면 오늘 두 번째야."}
  - {id: v_cough, name: 기침 섞인 자, register: "존댓말과 반말이 섞인다. 말끝마다 기침", tics: ["'콜록… 괜찮아.'"], use: [검은 폐, 숨, 먼지, 물], avoid: [오래], sample: "콜록… 괜찮아요. 남들 숨보다 반 걸음 늦을 뿐이지."}
  - {id: v_hum, name: 흥얼거리는 자, register: "반말, 숨으로 장단을 맞춘다. 갱 안에서는 휘파람 대신 숨", tics: ["'(숨으로 박자)'"], use: [여덟 해, 손바닥, 벽], avoid: [휘파람], sample: "(숨으로 박자) 여덟 해야… 나는 일곱 해째고."}
  - {id: v_haggler, name: 물을 흥정하는 자, register: "반말, 은근히 낮다. 값부터 말한다", tics: ["'값은 알지?'"], use: [바가지, 빵, 값, 하나], avoid: [공짜], sample: "값은 알지? 물 한 바가지에 빵 한 덩이. 오늘은 더 올랐어."}
  - {id: v_bitter_mine, name: 앙심 품은 자, register: "반말, 비꼼", tics: ["'언젠가.'"], use: [위에 있는 것, 숯, 언젠가], avoid: [희망], sample: "위에 있는 것들은 숨 쉴 때마다 우리 이름을 센대. 언젠가."}
  - {id: v_numbers_dragonkin, name: 숫자 보고체 (용인 관리), register: "높임과 평어가 섞인 보고체. 죽음을 건조하게 낭독", tics: ["'깊이는?'"], use: [낙반, 열병, 갱, 번호], avoid: [죽음, 이름], sample: "낙반 3, 열병 7. 갱 번호와 갱조 번호로 보고합니다."}
  - {id: v_krik_list, name: 목록을 외는 크릭, register: "짧은 반말. 주인 이름을 먼저 대고 말한다", tics: ["'목록이 그렇다.'"], use: [목록, 위, 아래, 무릎], avoid: [우리가 정했다], sample: "목록이 그렇다. 위에 용, 아래에 너. 나는 중간이다."}
  - {id: v_pious_mine, name: 기도하는 자, register: "공손, 말끝마다 빛", tics: ["'빛이 보시기를.'"], use: [빛, 순종, 은혜, 교대], avoid: [주인 욕], sample: "빛이 보시기를. 오늘도 입갱했으니 은혜지요."}
  - {id: v_mother_mine, name: 어머니 같은 자, register: "반말, 다정하고 명령형", tics: ["'먹어.'"], use: [먹어, 아가, 따뜻하게, 빵], avoid: [], sample: "먹어. 오늘은 반 덩이가 아니라 반 덩이와 한 조각이다."}
  - {id: v_stone_oath, name: 맹세 문구를 따지는 두르강, register: "존댓말과 평어가 섞인 느린 말. 문구를 인용한다", tics: ["'계약서에는…'"], use: [문구, 맹세, 계약, 돌], avoid: [동정], sample: "계약서에는 '지원 금지'라 적혀 있지요. '분실'은 적혀 있지 않고요."}
