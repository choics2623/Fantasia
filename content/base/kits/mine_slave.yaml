  sch_miner_red:   [{days: all, from: "17:30", to: "18:00", at: roll_yard, doing: 갱조 점호 — 번호를 대고 입갱, fixed: true}, {days: workday, from: "18:00", to: "05:30", at: drift, doing: 채굴 — 갱 안엔 낮이 없다}, {days: all, from: "05:30", to: "06:30", at: canteen, doing: 점호와 배급, fixed: true}, {days: all, from: "07:00", to: "16:30", at: burrow_red, doing: 굴에서 잔다}]
  sch_hauler:      [{days: all, from: "05:30", to: "06:00", at: roll_yard, doing: 점호, fixed: true}, {days: workday, from: "06:00", to: "17:30", at: ore_yard, doing: 수레로 광석을 계량소에 나른다}, {days: all, from: "17:30", to: "18:30", at: canteen, doing: 배급}, {days: all, from: "19:00", to: "05:00", at: burrow_black, doing: 잔다}]
  sch_prop:        [{days: workday, from: "06:00", to: "17:30", at: drift, doing: 지지대를 세우고 썩은 버팀목을 간다}, {days: all, from: "17:30", to: "18:30", at: canteen, doing: 배급}, {days: all, from: "19:00", to: "05:00", at: burrow_black, doing: 잔다}]
  sch_water:       [{days: all, from: "04:30", to: "06:00", at: water_tank, doing: 물탱크에서 양동이를 채운다}, {days: workday, from: "06:00", to: "17:00", at: drift, doing: 갱 안에 물 바가지를 나른다}, {days: all, from: "17:30", to: "18:30", at: canteen, doing: 배급}, {days: all, from: "19:00", to: "04:00", at: burrow_black, doing: 잔다}]
  sch_nose:        [{days: workday, from: "06:00", to: "17:30", at: drift, doing: 막장 앞에서 가스 냄새를 맡는다 — 코가 곧 경보}, {days: all, from: "17:30", to: "18:30", at: canteen, doing: 배급}, {days: all, from: "19:00", to: "05:00", at: burrow_black, doing: 잔다}]
  sch_pit:         [{days: all, from: "05:30", to: "06:00", at: roll_yard, doing: 점호}, {days: workday, from: "06:00", to: "17:30", at: open_pit, doing: 노천 계단을 곡괭이로 깎는다, outdoor: true, rain: {at: drift, doing: 잿비를 피해 얕은 갱으로 들어간다}}, {days: all, from: "17:30", to: "18:30", at: canteen, doing: 배급}, {days: all, from: "19:00", to: "05:00", at: burrow_black, doing: 잔다}]
  sch_smelter:     [{days: workday, from: "06:00", to: "18:00", at: smelter, doing: 용광로 풀무질과 주형, outdoor: false}, {days: all, from: "18:30", to: "19:30", at: canteen, doing: 배급}, {days: all, from: "20:00", to: "05:00", at: burrow_black, doing: 잔다}]
  sch_burrow:      [{days: all, from: "05:00", to: "07:00", at: canteen, doing: 교대 배급을 거든다}, {days: workday, from: "08:00", to: "16:00", at: burrow_black, doing: 굴 마을 살림 — 빨래와 아이들}, {days: all, from: "17:00", to: "19:00", at: canteen, doing: 저녁 배급 줄}, {days: all, from: "19:00", to: "04:30", at: burrow_black, doing: 굴}]
