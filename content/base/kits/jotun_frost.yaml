  - {id: frost_guide, name: 얼음 실 안내인, class: 인간 자유 안내인 (얼음 실), race: 인간, weight: 1, schedule: sch_guide}
  - {id: jotun_hunter, name: 사냥 거인, class: 요툰 사냥·돌 거인, race: 요툰, weight: 4, schedule: sch_hunter}
  - {id: jotun_warrior, name: 전사단원 (스카디르), class: 요툰 씨족장·전사, race: 요툰, weight: 3, schedule: sch_warband}
  - {id: song_apprentice, name: 노래 거인의 제자 (인간 소녀 포함), class: 인간 노예 (전당 시중·솥), race: 인간, weight: 1, schedule: sch_song}
  - {id: krik_broker, name: 크릭 곡물·모피 거간, class: 크릭 거간, race: 크릭, weight: 2, schedule: sch_broker_frost}
  - {id: shrine_helper, name: 서리 어머니 사당 시중, class: 기타 (수인·사당 사제), race: 요툰, weight: 1, schedule: sch_shrine_frost}
