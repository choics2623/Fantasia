# 지역 생성 키트 — 요툰 서리땅 (25_REGION_KITS.md). 흐로스가르드: 얼음턱 전당, 뼈울타리 노예 수용지, 울음 고개와 마지막 불, 돌무릎 골짜기.
# 원천: REGIONS §13, HOUSES §3.5(요툰 씨족)·§4.8(서리손), fac_jotun(얼음 탁자·나눔 식사·덜어냄·노래 한 달), fac_frosthand(자장가), fac_grey_thread(얼음 실).
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_jotun.customs / decision, fac_frosthand 를 본다.
# 핵심: 요툰은 느리고 먼저 굶는 왕을 세우며, 인간은 씨족 재산이다 — 노예 감독은 다른 인간('서리 목줄')이 한다. 요툰은 인간을 먹지 않는다 (소문은 거짓). 먹을 것을 주지 않을 뿐이다.
id: kit_jotun_frost
applies_to: [얼음턱 전당, 뼈울타리, 울음 고개, 마지막 불, 돌무릎 골짜기, 서리 어머니 사당, 깊은우물 온천 지대]
reuses: [kit_human_serf]       # 인간 노예의 노동 틀은 농노 키트를 쓰되 18시간 경작기와 겨울 얼음 깨기로 바꾼다
faction_refs: [fac_jotun, fac_frosthand, fac_grey_thread]
names:
  요툰:
    # 요툰은 '이름 + 아비의 이름 + 업적'을 길게 부른다. 짧게 줄이는 것은 모욕. 공적으로는 씨족 별칭('돌무릎', '얼음턱')이 앞선다.
    # 이름은 느린 모음(ㅜ·ㅡ·ㅗ)과 받침 ㄹ·ㅁ·ㄱ이 많다. 여자 이름은 끝이 '라·다·미'로 열린다.
    male: [흐림니르, 우트가, 브라기, 오르, 보른, 고르, 흐룸, 스루드, 야른, 베르가, 토르그, 스카디르, 바우그]
    female: [스칼라, 헬다, 헤임라, 브리미르, 할그리드, 우그라, 길라, 로그미, 요룬]
    clans: [흐림, 돌팔, 서리눈, 잿턱, 돌무릎, 바위배, 눈늑대가죽, 깊은우물]
    epithet_rule: "이름 + '○○의 아들/딸 ○○' + 업적. 인간이 줄여 부르면 모욕이다. 별칭은 씨족명(돌무릎 바우그)이며 굶주림을 견딘 해가 늘면 이름이 길어진다"
    size_note: "서리 요툰 4~5m(언덕 요툰), 돌 요툰은 더 크고 느리다 — 키가 아니라 '굶은 해'가 존칭의 단위"
  인간:
    # 서리 인간(서리손)은 서리말을 모국어로 쓴다. 이름은 짧고 북쪽 소리. 씨족의 표식(뼈 구슬·매듭)이 이름 뒤에 붙는다.
    male: [에이나르, 스벤, 토르, 토르발트, 울프, 올레, 군나르, 라르스, 비욘, 하프단, 시구르, 할르]
    female: [시그리드, 잉에, 아스타, 호르디스, 라그나, 헤르야, 군데, 아스트리드, 소냐, 순나, 브린야, 토라]
    given_by_clan: ["{씨족} 뼈 구슬 {n}호", "얼음손", "발가락 없는", "절름", "불 든 이", "솥 맡은 이", "셋째 매듭", "잿귀"]
    epithet_rule: "씨족이 붙인 표식(뼈 구슬·매듭의 수) + 동료가 부르는 몸의 별명 + 서리말 진짜 이름(어머니의 자장가에만). 서리 목줄은 요툰 씨족 이름을 앞세워 부른다"
  크릭:
    male: [빅스, 즈닉, 틱, 핍, 쏙, 삑]
    female: [찍, 삐야, 치크]
    note: "서리땅 크릭 약 1,000 — 곡물·모피 거간. 용제국 교역이 끊긴 뒤 곡물값 10배의 장부를 쥔다. 요툰은 크릭을 '작은 계산'이라 부른다"
  수인족:
    note: "산장지기 곰 수인 마투쉬 등 소수 — 꿀과 가죽을 받고 서리 길 첫 밤을 재운다"
  와이번:
    note: "서리 와이번 흐로아 아래 구역장들 — 짐삯을 받고 산을 넘긴다 (하르바)"
