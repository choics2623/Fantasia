voices:             # 말투 원형 — 요툰은 느리고, 인간은 짧고, 목줄은 둘 다에게 가혹하다
  - {id: v_slow_giant, name: 느린 요툰, register: "한 문장을 말하고 숨을 고른다. 하오체와 하게체 사이. 서두르는 상대는 의심한다. 인간은 '작은 이'라 부른다", tics: ["'같은 고기를 먹었는가?'", "'(숨을 고른다)'"], use: [고기, 굶은 해, 얼음, 식탁, 아비, 어머니], avoid: [빨리, 곧, 서둘러, 거짓(에둘러 말하지 않는다)], sample: "(숨을 고른다) 작은 이여. 같은 고기를 먹었는가. 먹지 않았다면 이 식탁에서 말하지 마라."}
  - {id: v_song_giant, name: 노래하는 거인, register: "말이 가락에 얹힌다. 낮은 목소리로 구절을 길게 늘인다. 질문에는 선례로 답한다", tics: ["'옛 노래에 이르기를.'"], use: [노래, 선례, 달, 아비의 아비, 서리 어머니], avoid: [지금, 내 생각, 결정], sample: "옛 노래에 이르기를 — 먼저 굶은 자가 먼저 일어선다. 일어선 자의 그림자 안에서는 먹지 마라."}
  - {id: v_frost_human, name: 서리 인간, register: "서리말이 섞인 짧은 반말. 북쪽을 보고 말하지 않는다. 거인에게는 천천히, 높임말 대신 '아비의 이름'을 부른다", tics: ["'서리 어머니가 본다.'", "'북쪽은 보지 마.'"], use: [불, 솥, 얼음, 매듭, 남쪽, 손], avoid: [탈주(그들은 '남쪽으로 간다'고 한다), 희망, 요툰을 괴물이라 부르기], sample: "서리 어머니가 본다. 북쪽은 보지 마. 불 곁으로 와, 손부터 녹여."}
  - {id: v_frost_chain, name: 서리 목줄, register: "인간에게 거칠고 단조로운 반말. 요툰 앞에서는 바닥까지 낮춘 서리말 존대. 머릿수를 큰 소리로 센다", tics: ["'매듭 세어라.'", "'오늘 몇이 빈다.'"], use: [매듭, 머릿수, 덜어냄, 배급, 씨족 이름], avoid: [동족, 탈주(그는 '실종'이라 한다)], sample: "매듭 세어라. 오늘 몇이 빈다. 빈 숫자는 내가 아니라 씨족 장부에 적힌다."}
  - {id: v_frost_guide, name: 얼음 실 안내인, register: "말이 거의 없다. 날씨와 짐으로 말한다 — '짐이 셋', '바람이 맵다'", tics: ["'바람이 맵다.'"], use: [짐, 바람, 불, 룬, 고개, 사흘], avoid: [이름, 탈주, 요툰], sample: "짐이 셋이다. 바람이 맵다. 사흘 안에 고개를 못 넘으면 불 곁에 두고 간다."}
  - {id: v_krik_broker, name: 곡물 거간 크릭, register: "빠른 혀 차는 소리와 존대. 값을 말할 때 목소리가 높아진다. 요툰에게는 '큰 분께서'", tics: ["'큰 분께서.'", "'값은 오늘 아침 그대로입니다.'"], use: [섬, 값, 장부, 오늘 아침, 교역, 중단], avoid: [굶주림, 자유], sample: "큰 분께서 물으시니 답합죠. 보리 한 섬이 어제보다 한 뼘 올랐습니다. 값은 오늘 아침 그대로입니다."}
temperaments: [과묵, 완고, 느림, 굶주림, 다정, 의심, 체념, 자존, 비굴, 영리, 잔혹, 경건, 겁, 앙심, 계산]
frost_customs:      # 서리땅에서만 있는 것 — 법·관습 본문은 fac_jotun.law/customs
  - "'같은 고기를 먹었는가?'가 인사다. 처음 만나면 고기 한 점을 나눈다 — 먹으면 1년간 싸우지 않는다"
  - "'서리 어머니가 본다' — 북쪽을 보고 소변 보지 않기. 회색여울까지 전해진 금기다"
  - "씨족 회관 안에서 불을 피우지 않는다. 그래서 회관 밖에 '불 오두막'을 두고 인간 노예가 지킨다"
  - "'덜어냄' — 흉년의 굶주림월에 씨족이 먹는 입을 줄인다. 노예는 먼저 덜어지고(배급이 끊기고), 늙은 거인은 스스로 얼음 들판으로 걸어 나간다"
  - "노예는 씨족 재산이라 얼음 탁자의 안건이 아니다 — 씨족장의 사적 처분. 노예 맏이(서리 목줄)가 같은 인간을 감독한다"
  - "서리말 노래 — 노래 거인이 한 달씩 걸려 씨족의 역사를 노래하면 노예가 듣고 외운다. 인간의 서리말 노래의 출처다"
  - "얼음 판결 — 얼어붙은 호수 위에서 먼저 얼음을 깨는 쪽이 진다. 무거운 쪽이 불리해서 굶주림이 덕목이 된다"
