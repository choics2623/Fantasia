# 지역 생성 키트 — 재의 황무지 전초 (25_REGION_KITS.md). 마지막 등불·재눈 초소·재 성소·두 번째 등불의 흔적, 그리고 재 평원 가장자리에 서는 모든 사냥꾼 마을.
# 원천: REGIONS §11(11.5 삶·11.7 등불 규칙·11.8 문화), HOUSES §5.12·§5.13, fac_last_lantern, fac_grey_pilgrims, fac_ashen_tower, fac_nameless, fac_trace_keepers, docs/world/people/ashwaste.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_last_lantern.law / customs 를 본다. 여기에는 '재 평원 가장자리에만 있는 재료'(해 지기 전 귀환, 시간 잔상, 물값, 등불 규칙, 막대 눈금 장부, 재를 혀에 올리는 받아들임)를 더한다.
# 핵심: 지배자가 없다 — 법은 등불 규칙 다섯뿐이고 그 아래 세 개의 다른 줄(탑의 눈·순례자의 재·주춧돌의 글자)이 흐른다. 여기서는 노예도 '사냥꾼'이다. 가장 비싼 것은 물이다(한 통 3못).
id: kit_ash_outpost
applies_to: [마지막 등불, 재눈 초소, 재 성소, 두 번째 등불(소멸), 재의 암자, 낙오자 숙영지, 재 평원 가장자리 사냥꾼 마을]
reuses: []
faction_refs: [fac_last_lantern, fac_grey_pilgrims, fac_ashen_tower, fac_nameless, fac_trace_keepers, fac_krik, fac_durgan]
names:
  인간:
    # 탈주자는 노예 이름·번호를 버리고 마지막 등불에서 이름 하나로 산다. 성은 묻지 않는다 — 손바닥 흉터가 이름 대신이다.
    male: [모그, 다간, 틸, 오트, 하엘, 카일, 알렉, 베른, 브론, 하겐, 나크, 로브, 칼, 우란]
    female: [메리타, 코라, 베스, 제나, 힐다, 사라, 아냐, 테아, 로타, 이다, 요나, 마리카]
    surname_rule: "성을 묻지 않는 것이 마을 규칙이다 (종족을 묻지 않는다). 성이 있는 사람은 아스테리아 폐허 문패에서 찾은 성을 쓰는 이들뿐이다"
    epithet_rule: "이름 + 하는 일 또는 몸의 표지(물지기 오트, 길잡이 모그, 유리눈 데스, 두 손톱 그렛). 순례자는 '재의 아이'가 앞에 붙는다"
  크릭:
    male: [튀크, 치륵, 쏙, 핍, 구르]
    female: [찍, 삐야]
    note: "마지막 등불 크릭 약 250 — 굴종 본능을 벗은 자들. 재굴 크릭은 재를 마시고도 오래 살아 다른 굴 크릭의 곱절을 산다 (느리게 늙는다)"
  용인:
    male: [오렐, 데스, 아론]
    female: [세레나, 실레네, 아델]
    note: "몰락 용인 60 — 용제국이 사라진 뒤 갈 곳을 잃은 기사·하인·학자. 비늘이 닳았고 자기 가문 이름을 말하지 않는다"
  그롬:
    male: [고즈, 브락, 두르]
    female: [그렛, 우마]
    note: "그롬 낙오자 30과 추방자 — 전쟁이 끝난 뒤 갈 곳이 없던 자들. 이름은 투사 이름이 아니라 짧은 한 음절"
  두르강:
    note: "두르강 추방자 40 — 맹세를 깬 자(돌피). 돌이 되는 몸을 가진 자가 많다. 이름 앞에 '반돌'이 붙는다"
classes:            # 마지막 등불 기준 (인구 600). 신분이 아니라 하는 일의 비율
  허가 사냥꾼: 0.18
  짐꾼: 0.26
  판잣집 장사(물·죽·유물): 0.14
  길잡이·정찰: 0.04
  경비·낙오자: 0.12
  순례자·재먹이: 0.06
  학자·관측자: 0.02
  아이·심부름꾼: 0.10
  병자·노인: 0.08
jobs:
  - {id: relic_hunter, name: 허가 사냥꾼, class: 허가 사냥꾼, race: 인간, weight: 18, schedule: sch_relic_hunter}
  - {id: porter, name: 짐꾼, class: 짐꾼, race: 인간, weight: 26, schedule: sch_porter}
  - {id: water_seller, name: 물 되는 사람, class: 판잣집 장사(물·죽·유물), race: 인간, weight: 3, schedule: sch_water_seller}
  - {id: stall_keeper, name: 가판 상인, class: 판잣집 장사(물·죽·유물), race: 크릭, weight: 8, schedule: sch_stall}
  - {id: inn_hand, name: 죽 솥 일손, class: 판잣집 장사(물·죽·유물), race: 인간, weight: 3, schedule: sch_inn_hand}
  - {id: ash_guide, name: 길잡이, class: 길잡이·정찰, race: 인간, weight: 4, schedule: sch_ash_guide}
  - {id: wall_guard, name: 방벽 경비, class: 경비·낙오자, race: 그롬, weight: 12, schedule: sch_wall_guard}
  - {id: pilgrim, name: 순례자, class: 순례자·재먹이, race: 인간, weight: 5, schedule: sch_pilgrim}
  - {id: ash_eater, name: 재먹이, class: 순례자·재먹이, race: 용인, weight: 1, schedule: sch_ash_eater}
  - {id: tower_observer, name: 재눈 초소 관측자, class: 학자·관측자, race: 용인, weight: 2, schedule: sch_observer}
  - {id: waif, name: 아이(물 나르기·죽 심부름), class: 아이·심부름꾼, race: 인간, weight: 10, schedule: sch_waif}
  - {id: sick_old, name: 병자·노인, class: 병자·노인, race: 인간, weight: 8, schedule: sch_sick_old}
schedules:          # at = 정착지 틀의 역할(role). 황무지는 새벽에 시작해 해 지기 전에 접는다 — 해 진 뒤 밖에 있는 자는 구조하지 않는다.
  sch_relic_hunter: [{days: all, from: "06:00", to: "09:00", at: hunters_yard, doing: 원정 장비를 꾸린다}, {days: all, from: "09:00", to: "17:00", at: ash_edge, doing: 재 평원 가장자리에서 유물을 줍는다 — 해 지기 전에 돌아올 길을 눈으로 잰다, outdoor: true}, {days: all, from: "17:00", to: "19:00", at: market, doing: 해 지기 전 호각에 맞춰 돌아와 유물을 판다}, {days: all, from: "19:00", to: "24:00", at: inn, doing: 죽과 술 — 오늘 본 잔상 이야기를 낮게 한다}, {days: all, from: "24:00", to: "06:00", at: shacks, doing: 판잣집에서 잔다}]
  sch_porter:       [{days: all, from: "06:00", to: "17:00", at: hunters_yard, doing: 사냥꾼 곁에서 짐을 진다 — 몫은 십분의 일}, {days: all, from: "17:00", to: "21:00", at: water_store, doing: 물 한 통을 몫으로 받으러 줄을 선다}, {days: all, from: "21:00", to: "06:00", at: shacks, doing: 판잣집 골목에서 잔다}]
  sch_water_seller: [{days: all, from: "06:00", to: "12:00", at: water_store, doing: 물 통을 센다 — 구리 말로 되어 준다}, {days: all, from: "12:00", to: "19:00", at: water_store, doing: "물을 판다 — 한 통에 3못"}, {days: all, from: "19:00", to: "06:00", at: water_store, doing: 저장고 곁 방에서 잔다}]
  sch_stall:        [{days: all, from: "06:00", to: "12:00", at: market, doing: 가판을 펴고 유물을 감정한다}, {days: all, from: "12:00", to: "18:00", at: market, doing: 장사 — 값은 흥정이다}, {days: all, from: "18:00", to: "22:00", at: market, doing: 가판 밑 마른 구멍에서 장부 매듭을 맞춘다}, {days: all, from: "22:00", to: "06:00", at: shacks, doing: 잔다}]
  sch_inn_hand:     [{days: all, from: "05:00", to: "12:00", at: inn, doing: 죽 솥에 불을 올린다}, {days: all, from: "12:00", to: "23:00", at: inn, doing: 사냥꾼에게 죽을 푼다 — 손바닥을 본다}, {days: all, from: "23:00", to: "05:00", at: shacks, doing: 잔다}]
  sch_ash_guide:    [{days: all, from: "06:00", to: "09:00", at: guide_hut, doing: 길 지도를 펼친다}, {days: all, from: "09:00", to: "17:00", at: ash_edge, doing: 신입을 이끌고 가장자리 길을 잰다, outdoor: true}, {days: all, from: "17:00", to: "22:00", at: lantern, doing: 등불 아래서 규칙 셋을 외운다}, {days: all, from: "22:00", to: "06:00", at: guide_hut, doing: 지도의 점을 하나 지운다}]
  sch_wall_guard:   [{days: all, from: "06:00", to: "17:30", at: barrier, doing: 방벽 말뚝선에 선다 — 마물과 잔상의 경계를 본다, outdoor: true}, {days: all, from: "17:30", to: "22:00", at: square, doing: 해 지기 전 호각에 사냥꾼을 들인다}, {days: all, from: "22:00", to: "06:00", at: guard_post, doing: 보초막에서 선 채로 쉰다}]
  sch_pilgrim:      [{days: all, from: "05:00", to: "08:00", at: sanct_yard, doing: 성소 마당에서 재를 한 줌 쥔다}, {days: all, from: "08:00", to: "16:00", at: sanct_circle, doing: 재의 원 곁에서 설교를 듣는다}, {days: all, from: "16:00", to: "20:00", at: sanct_hearth, doing: 화덕 곁에서 죽을 얻어먹고 아이들을 본다 — 배불리 먹는 것이 신의 선물이다}, {days: all, from: "20:00", to: "05:00", at: sanct_yard, doing: 마당에서 잔다}]
  sch_ash_eater:    [{days: all, from: "06:00", to: "12:00", at: sanct_receiving, doing: 새 사람의 혀에 재를 올린다}, {days: all, from: "12:00", to: "20:00", at: sanct_ember_room, doing: 잿불석을 센다}, {days: all, from: "20:00", to: "06:00", at: sanct_yard, doing: 마당을 돈다 — 하루의 마지막 불을 끈다}]
  sch_observer:     [{days: all, from: "06:00", to: "12:00", at: ash_eye_stakes, doing: 측정 말뚝을 잰다, outdoor: true}, {days: all, from: "12:00", to: "20:00", at: ash_eye, doing: 망원경으로 경계를 본다 — 기록함에 숫자를 쓴다}, {days: all, from: "20:00", to: "06:00", at: ash_eye, doing: 교대로 야간 관측을 한다}]
  sch_waif:         [{days: all, from: "06:00", to: "12:00", at: water_store, doing: 물 저장고에서 물을 나른다}, {days: all, from: "12:00", to: "17:00", at: inn, doing: 죽 솥 곁 심부름}, {days: all, from: "17:00", to: "21:00", at: shacks, doing: 판잣집 골목에서 논다 — 해 지기 전 호각이 불면 제일 먼저 뛴다}, {days: all, from: "21:00", to: "06:00", at: shacks, doing: 잔다}]
  sch_sick_old:     [{days: all, from: "06:00", to: "18:00", at: shacks, doing: 판잣집 문턱에서 해를 쬔다}, {days: all, from: "18:00", to: "06:00", at: shacks, doing: 잔다}]
voices:             # 말투 원형 — 짧고 물처럼 아낀다. 말을 헤프게 쓰면 '물을 흘린다'고 한다
  - {id: v_ash_hunter, name: 사냥꾼, register: "짧은 평어. 인사 대신 '돌 뭐야?' 또는 '해 몇 시야?'. 유물과 물과 해 지는 시각으로 말한다. 높임말은 등불지기에게만", tics: ["'해 지기 전에.'", "'돌부터 알려 줘.'"], use: [해, 돌, 물, 못, 말뚝, 잔상, 등불], avoid: [종족, 신분, 도덕]}
  - {id: v_ash_guide, name: 길잡이, register: "규칙부터 말한다. 대답은 길로 한다. 잔상 이야기는 눈을 옆으로 돌리고", tics: ["'규칙 셋.'"], use: [길, 점, 규칙, 그림자, 아홉 분, 냄새], avoid: [재촉, 서두름]}
  - {id: v_ash_pilgrim, name: 순례자·재먹이, register: "부드러운 존댓말. 먼저 먹었느냐고 묻는다. 신 이야기는 나중이고 중심 이야기는 하지 않는다", tics: ["'먹었어요?'", "재를 흘린다"], use: [재, 신, 먹다, 아이, 몸, 원], avoid: [중심에서 죽다, 진짜 죽음]}
  - {id: v_ash_scholar, name: 탑의 관측자, register: "정확한 존댓말. 측정 이야기부터. 숫자 앞에서만 약간 빨라진다", tics: ["'두께는 어땠나요?'"], use: [곡선, 말뚝, 경계, 측정, 원인 미상, 뼘], avoid: [순례자 매장, 정치]}
  - {id: v_ash_waif, name: 황무지 아이, register: "작고 또렷한 존댓말. 걸음을 센다. 모르는 말은 '모르겠어요'", tics: ["숫자를 센다"], use: [걸음, 신발, 이름, 해 질 녘], avoid: [어머니 얼굴(먼저)]}
temperaments: [과묵, 계산, 다정, 의심, 끈기, 겁, 완고, 쓸쓸함, 경계, 체념, 정, 눈치, 책임, 속죄, 헌신]
ash_customs:        # 재 평원 가장자리에만 있는 것 — 법·관습 본문은 fac_last_lantern.law / customs, REGIONS §11.7·§11.8
  - "해 지기 전 귀환이 첫 규칙이다. 해 진 뒤 밖에 있는 자는 구조하지 않는다 — 17시 반 호각이 불면 모든 일을 멈추고 문 안으로 든다"
  - "물 한 통 3못 — 3못에 물과 이름이 같이 들어 있다. 이름은 묻지 않고 손바닥을 본다. 숙박부는 막대 눈금이다"
  - "등불 아래서는 거짓말을 하지 않는다 (금기). 등불을 끄는 자는 추방한다. 길 잃은 자는 꺼지지 않는 등불을 향해 걸으라고 한다"
  - "잔상 속 사람에게 말을 걸지 않는다. 잔상이 사람이라고 믿는 순간 거기 서 있게 된다 — 길잡이의 규칙: 해 지기 전에 돌아온다, 아홉 분을 세지 않는다, 붉은 말뚝을 눈에 담지 않는다"
  - "재를 맨손으로 먹지 않는다 (굶주린 자들의 전설) — 재 성소에서는 받아들임지기가 혀에 재를 올린다. 올린 자는 석 달 안에 잔상이 보이기 시작한다"
  - "재의 날에는 마을 전원이 등불 아래 모여 밤새 잔상을 지켜본다. 시간당 서너 번 잔상이 일어나고 인간 사냥꾼들은 아스테리아의 하늘에 떠오르는 '말하는 자'의 그림자를 본다고 한다"
  - "시간의 상처 안의 죽음은 회귀하지 않는다 — 잔향자에게도 진짜 죽음이다. 붉은 말뚝을 넘는 것은 추방이다"
