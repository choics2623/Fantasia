voices:             # 말투 원형 — 즉석 생성 인물이 하나를 받아 변주한다 (22 §1.1). kit_human_serf.voices 에 더해 성지에서만 나는 목소리
  - {id: v_reciter, name: 낭독문 말씨의 사제, register: "높은 말씨 '~하리라'를 일상에 섞는다. 신도에게 단정한 반말, 윗사람에게 극존칭", tics: ["'견디어라.'"], use: [빛, 사슬, 정화, 견디다, 낭독문], avoid: [죽음, 노예, 신(대신 빛)], sample: "견디어라. 오늘의 낭독은 이러하리라 — 사슬은 등불을 지킬지니."}
  - {id: v_ring_keeper_nervous, name: 고리지기, register: "손님에게 과하게 공손, 사제 앞에서 목소리가 반 음 올라간다. 성표 고리를 만지작거린다", tics: ["'제 소관은 아니오나'"], use: [성표, 쪽지, 접수, 사제님], avoid: [밀고 숫자], sample: "제 소관은 아니오나, 성표 값은 주인이 내시는 것이라… 접수는 해 드립니다."}
  - {id: v_next_life, name: 다음 생을 믿는 신도, register: "단정한 반말, 위로처럼 '다음 생에는'을 단다", tics: ["'다음 생에는.'"], use: [견디다, 다음 생, 빛, 고리], avoid: [끝, 돌아오지 않는다], sample: "다음 생에는 배곯지 않겠지. 견디면 되는 거야. 다음 생에는."}
  - {id: v_triple_inquisitor, name: 세 질문의 심문관, register: "정중한 하십시오체. 질문을 반드시 셋으로 묶는다. 대답을 끝까지 기다린다", tics: ["질문이 셋이다"], use: [확인, 징후, 당신, 고발, 확률], avoid: [무고, 불쌍], sample: "세 가지만 묻겠습니다. 어디서 왔고, 누구에게 배웠고, 꿈을 꿉니까."}
  - {id: v_copyist_mute, name: 읽지 못하는 필사 수사, register: "말수가 적고 '모양'으로 말한다. 글자를 '그림'이라 부른다", tics: ["'이 모양은…'"], use: [모양, 획, 먹, 줄, 그림], avoid: [읽다, 뜻], sample: "이 모양은 갈고리가 둘, 아래에 점. 뜻은 몰라요. 모양만 같으면 돼요."}
  - {id: v_hymn_road, name: 길 위의 찬송 순례자, register: "붙임성 있는 해요체, 길 이름과 날짜로 말한다. 소문을 노래 사이에 끼운다", tics: ["'길에서 들은 건데요'"], use: [길, 쉼터, 고리, 찬송, 소문], avoid: [서신], sample: "길에서 들은 건데요, 세 번째 고리 쉼터 화덕이 며칠째 꺼지질 않는대요."}
  - {id: v_confessor_soft, name: 부드러운 고해 사제, register: "속삭이는 하오체, 상대의 말을 한 번 되풀이한다. 끝에 '그리고?'를 붙인다", tics: ["'…그리고?'"], use: [영혼, 덜다, 말해 보라, 어둠], avoid: [장부, 보고], sample: "무거운 것은 말하면 가벼워지는 법이오. 말해 보시오. …그리고?"}
  - {id: v_elf_overseer, name: 감독관 엘다르, register: "느린 해체. 인간의 이름을 부르지 않고 '그대'. 문장이 완결되어 있고 서두름이 없다", tics: ["'기억하겠소.'"], use: [기억, 그대, 한 걸음, 절차, 금실], avoid: [미안, 화], sample: "그대의 말은 기억하겠소. 다만 낭독문에 없는 말이라 금실이 오지 않을 뿐이오."}
  - {id: v_garrison_dragonkin, name: 수비대 용인, register: "짧은 명령조 하오체. 인간에게 이름을 묻지 않고 '신도'라 부른다", tics: ["'표찰.'"], use: [성문, 통행, 허가증, 무기], avoid: [빛(믿는 척 아님)], sample: "허가증. 무기는 성문 앞 궤에. 신도, 줄을 막지 마라."}
  - {id: v_pilgrim_crowd, name: 군중 속 순례자, register: "사투리 섞인 반말, 큰 소리로 기도하고 작은 소리로 소문을 낸다", tics: ["'빛이 사슬을 비추기를'"], use: [성지, 순례, 허가증, 등불], avoid: [], sample: "빛이 사슬을 비추기를. 나는 북쪽서 열흘 걸었어. 허가증은 품 안에 있으니 걱정 마."}
temperaments: [경건, 의심, 순종, 결벽, 겁, 고집, 체념, 다정, 영리, 앙심, 과묵, 수다, 냉정, 죄책, 속삭임, 열심]
city_customs:       # 법·관습 본문은 fac_light.law/customs
  - "하루는 일곱 번의 기도로 나뉜다 — 4시(새벽)·7시(아침)·10시(3시경)·13시(정오)·16시(오후)·19시(저녁)·22시(밤). 대성당 종탑이 매번 일곱 번을 친다"
  - "성표 고리 수가 신분이다 — 신도 1, 고리지기 2, 사슬사제는 사슬과 등불, 등불관 흰 사슬 세 겹, 대사제 일곱 겹, 정화청은 검은 사슬·검은 끈"
  - "성표의 고리를 일부러 벌려 두기는 끊어진 고리의 표식이다. 정화청이 눈여겨본다"
  - "공개 고해 — 기도 불참 3회 누적이면 고해 광장에서 죄를 외친다. 줄 서는 사람들이 '견디어라'를 세 번 따라 한다"
  - "헌금 쪽지(교단 발행 동판, 1못 상당) — 루멘에서 인간이 쥘 수 있는 유일한 합법 돈. 순례 허가증은 1발톱"
  - "인간 필사실의 필사 수사는 글을 읽지 못한다 — 승인된 낭독문을 '모양'으로만 베낀다. 읽는 자는 사제 한 줄로 충분하다는 공식 해석"
  - "순례 숙소는 빵 한 덩이와 짚 침상, 그리고 이름 장부. 성 마렌 축일에는 순례자 3만이 몰려 숙소 지붕까지 찬다"
  - "재의 날(연말 5일)에는 모든 불을 끄고 영원등만 탄다"
