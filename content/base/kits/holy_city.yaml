# 지역 생성 키트 — 성지 도시 (25_REGION_KITS.md). 루멘과 일곱 대교구의 성당 도시, 순례 쉼터, 성소가 이것으로 태어난다.
# 원천: REGIONS §4 (루멘), fac_light(관습·법·말투·계급), fac_broken_ring, fac_lampkeepers, fac_grey_pilgrims, docs/world/people/lumen.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_light.customs / law / ranks 를 본다. 여기에는 '성지 도시에만 있는 재료'(일곱 번의 기도, 성표 고리 수, 필사실, 순례 숙소)를 더한다.
# 인간 평신도의 이름·말투 원형은 kit_human_serf 를 재사용한다 (루멘 신도도 성(姓)이 없다).
id: kit_holy_city
applies_to: [루멘, 세 번째 고리 쉼터, 성 마렌의 우물, 일곱 대교구의 성당 도시, 순례길의 쉼터]
reuses: [kit_human_serf]
faction_refs: [fac_light, fac_broken_ring, fac_lampkeepers, fac_eldar, fac_collar, fac_grey_pilgrims]
names:
  인간:
    # 성직자는 서품 때 '서품명'을 받는다. 서품명 + 출신(마을·별명). 평신도는 kit_human_serf 이름 + 일·생김새 별명.
    # 대사제는 '이름 + 숫자'(그레고르 7세). 고리지기·수도자는 이름 하나, 사슬사제 이상은 별명이 따라붙는다.
    ordained_male: [그레고르, 마티아스, 안셀름, 요나스, 에기디우스, 하르트문트, 라우렌츠, 볼프람, 베르나르트, 암브로스, 클레멘스, 도미니쿠스, 게르하르트, 레오폴트, 시몬, 바실리우스]
    ordained_female: [아델, 아그네스, 베아테, 헬레나, 클라라, 오틸리에, 미카엘라, 루치아, 에르멘가르트, 발부르가, 수잔나, 이레네]
    lay_male: [군터, 칼레, 오토, 베른, 하인, 루츠, 페터, 울리, 디터, 얀, 볼프, 토비아스, 엘리, 야코프, 베노, 코라드, 니클라스, 한스]
    lay_female: [한나, 게르트, 마리, 안나, 베르타, 그레테, 일제, 마리아, 우테, 에다, 마를렌, 유타, 리스베트]
    epithet_rule: "사슬사제 이상: 서품명 + 별명(마티아스 회색손, 라우렌츠 곧은목). 수도자·고리지기: 이름 + 하는 일(양초 안나, 종지기 얀). 평신도: 이름 + 마을이 부르는 별명. 성(姓)은 없다 — 인간은 성을 가질 수 없다(사슬의 맹약 1조)"
    given_by_church: ["{n}번째 서원", "빛의 {n}째", "견습 {n}"]
  엘다르:
    # 엘다르는 '이름 + 가지 이름 또는 한 줄 별칭'. 루멘의 12명은 별빛·빛실 가지. 인간에게는 이름만 허락한다.
    male: [레아넬, 이살리온, 에룬딜, 아엘리온, 시리엘, 오리엘]
    female: [세레니엘, 모리엘, 아에린, 엘레스, 이렐리아]
    epithet_rule: "이름 + 가지(맑은잎·빛실·금실). 인간은 엘다르를 이름으로 부르지 않고 '감독관님' 또는 침묵으로 부른다"
  용인:
    # 루멘 수비대의 용인은 바알카르 용좌령의 비늘혈이다. 이름·가문은 kit_dragonkin_city.names.용인 을 쓴다.
    garrison_rule: "수비대는 이름 + 소가문 (이반 타르굴). 인간에게는 이름을 밝히지 않고 직책으로 불린다"
  크릭:
    # 수비대 잡역 약 400. 이름은 kit_dragonkin_city.names.크릭 을 쓴다. 루멘 크릭은 재·장작·공물 수레를 만진다.
    nickname_rule: "하는 일 + 크릭 이름 (재삽 뷕, 장작 칙)"
