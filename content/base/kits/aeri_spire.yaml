  sch_ground_smith: [{days: workday, from: "06:00", to: "17:00", at: ground_forge, doing: 바닥 마을 대장일 — 줄 고리와 바늘, 은근히 가벼운 쇠로}, {days: all, from: "19:00", to: "05:00", at: ground_village, doing: 움막}]
  sch_trader:    [{days: workday, from: "08:00", to: "17:00", at: depot, doing: 두르강 창고 — 금속과 깃털 맞교환}, {days: all, from: "17:00", to: "08:00", at: depot, doing: 창고 곁방}]
  sch_porter:    [{days: workday, from: "06:00", to: "18:00", at: market, doing: 두르강 상인의 짐 나르기}, {days: all, from: "18:00", to: "06:00", at: porter_shed, doing: 짐꾼 막사}]
  sch_courier:   [{days: workday, from: "09:00", to: "17:00", at: market, doing: 전갈을 줄지기에게 건넬 기회를 기다린다}, {days: all, from: "17:00", to: "09:00", at: market, doing: 천막 곁 말 곁에서 잔다}]
  sch_bandit:    [{days: all, from: "05:00", to: "17:00", at: bandit_den, doing: 은신처 곁 순찰과 새장 점검}, {days: all, from: "17:00", to: "05:00", at: bandit_den, doing: 은신처}]
voices:             # 말투 원형 — 아에리는 높이로 말하고, 땅손은 아래에서 올려다보고, 두르강은 조항으로 말한다
  - {id: v_swan_noble, name: 높은 백조, register: "느린 하오체와 하게체. 문장 끝이 위로 올라간다. 땅 이야기를 하면 한 박자 늦게 대답한다", tics: ["'위에서 보면.'", "'아래 이야기는 아래에서.'"], use: [고도, 바람, 높이, 둥지, 위, 아래], avoid: [땅(그들은 '아래'라 한다), 가두다, 묶다], sample: "위에서 보면 다 작다. 작은 것을 두고 말하는 것은 높은 이의 일이 아니다. 그러나 오늘은 본다."}
  - {id: v_hawk_hunter, name: 매 사냥꾼, register: "짧고 빠르다. 시선을 상대 어깨 너머 먼 곳에 둔다. 칭호를 강조한다", tics: ["'먼저 본 쪽이 안다.'"], use: [화살, 급강하, 바람, 사냥감, 시야], avoid: [안, 지붕, 닫다], sample: "먼저 본 쪽이 안다. 너는 걷는 놈이라 한 박자 늦다. 괜찮다. 땅은 느린 곳이다."}
  - {id: v_crow_recorder, name: 까마귀 기록자, register: "'기록에 따르면'으로 말을 연다. 값을 부르기 전에 눈을 가늘게 뜬다. 인간에게 호기심을 숨기지 못한다", tics: ["'기록에 따르면.'", "'값은 말씀하시는 만큼.'"], use: [기록, 매듭, 깃털, 연대기, 값, 본 것], avoid: [모른다(그들은 '아직 적지 않았다'고 한다)], sample: "기록에 따르면 그 해 여름 불이 의식보다 먼저 떨어졌다. 값은 말씀하시는 만큼. 팔지 못하는 줄은 없으니까."}
  - {id: v_ground_hand, name: 땅손, register: "목소리가 낮고 눈을 위로 들지 않는다. 아에리말(하늘말)을 섞는다. 존대와 반말이 마음대로 섞인다", tics: ["'위에서 보시기엔.'", "'줄이 허락하면.'"], use: [줄, 항아리, 계단밭, 바람, 위, 항상], avoid: [내려가다(그들은 '줄을 탄다'고 한다), 도망, 자유], sample: "위에서 보시기엔 작은 밭이죠. 줄이 허락하면 물은 오늘도 올라옵니다."}
  - {id: v_rope_keeper, name: 줄지기, register: "말이 거의 없다. 매듭을 만지며 대답한다. 허락이냐 거둠이냐로 말한다", tics: ["'줄이 허락한다.'", "'줄을 거둔다.'"], use: [줄, 매듭, 허락, 거둠, 바구니, 무게], avoid: [미안, 잘못], sample: "줄이 허락한다. 허락은 한 번이다. 두 번째는 거둠이다."}
  - {id: v_durgan_trader_valley, name: 장터의 두르강 상인, register: "조항으로 말한다. 서명 없는 거래는 거래가 아니라는 말이 입에 붙었다. 아에리에게는 깃털값으로, 인간에게는 계약서 번호로 말한다", tics: ["'서명 먼저.'", "'깃털은 근으로.'"], use: [서명, 깃털, 근, 창고, 바구니, 값], avoid: [외상, 구두 약속], sample: "서명 먼저. 깃털은 근으로 달고 금속은 근으로 받는다. 위에서 내려온 약속이든 아래서 올라간 약속이든 돌에 새긴다."}
temperaments: [고고, 호기심, 침묵, 계산, 의심, 겁, 영리, 다정, 고독, 완고, 체념, 앙심, 경건, 성급, 무관심]
sky_customs:        # 바람첨탑에서만 있는 것 — 법·관습 본문은 fac_aeri.law/customs
  - "건물에는 지붕과 문이 없다. 비는 깃털로 막는다. 아에리를 가두거나 묶는 것은 죽음이다 (갇히면 사흘에 숨이 막히고 열흘에 심장이 멎는다)"
  - "하늘 장례 — 죽은 아에리는 가장 높은 봉우리에서 바람에 놓아 준다. 깃뼈는 바람에 준 시신을 주워야만 나온다 (가장 큰 모독)"
  - "바람 축제(해빙월) — 아에리 전원이 하늘을 난다. 기둥 위에 아무도 없는 하루가 인간에게 유일한 '혼자인 날'이다"
  - "줄을 거두는 것이 인간에게 가장 무서운 처벌이다 — 그 기둥의 인간은 고립되고, 아에리는 줄을 거둔 인간을 잊는다"
  - "금속은 무겁다 — 아에리는 금속을 싫어해 장터에서 금속은 계곡에서만 거래된다. 길들인 매 한 마리는 금화 3닢이다"
  - "날개를 만지는 것은 금기다. 깃털을 뽑는 것과 같다"
  - "날지 못하는 아에리는 부양하지 않는다 — 스스로 뛰어내리는 것이 관습이다 (미르 찢긴깃은 그 관습을 따르지 않았다)"
