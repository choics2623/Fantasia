# 지역 생성 키트 — 아에리 첨탑 (25_REGION_KITS.md). 바람첨탑 기둥 도시(정상·깃털 의회·일곱 손가락·바람 정원)와 줄내림 장터(계곡 교역지).
# 원천: REGIONS §14, RACES §14, SUBRACES §12, HOUSES §3.8, fac_aeri(깃털 의회·땅손·줄), kit_durgan_delve(장터 두르강 상인).
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_aeri.law / customs / decision 을 본다.
# 핵심: 아에리의 서열은 고도다. 건물에는 지붕과 문이 없다(갇히면 죽는다). 인간 땅손 약 140은 기둥 하나에서 평생을 살고, 가장 무서운 처벌은 '줄을 거두는 것'이다.
id: kit_aeri_spire
applies_to: [바람첨탑, 흰 깃 첨탑, 깃털 의회, 일곱 손가락, 바람 정원, 바닥 마을, 폭풍깃 절벽, 깃 서고, 줄내림 장터]
reuses: [kit_durgan_delve]      # 줄내림 장터의 두르강 상인·하르칸 전령은 그쪽에서 이름과 말투를 뽑는다
faction_refs: [fac_aeri]
names:
  아에리:
    # 이름 = 개인명 + 최고 비행 고도 칭호. 칭호가 곧 서열이다. 땅에서의 일을 하는 이는 칭호가 짧다.
    male: [카이르, 레이, 셀레스, 에이로스, 투르, 오르비, 라이, 시엘, 페르, 코라크, 소엘, 할시]
    female: [키리에, 시룬, 세라, 미르, 오리아, 페리스, 라우나, 아엘라, 타일라, 엘루, 아스크]
    height_titles: [긴목, 매눈, 흰날개, 구름위, 폭풍넘은, 바람끝, 새벽칼, 높은둥지, 찢긴깃, 별아래, 셋째깃, 재깃]
    epithet_rule: "개인명 + 고도 칭호(공적인 자리에서는 칭호까지 부른다). 백조는 칭호가 높고 길다, 까마귀는 낮은 칭호('셋째깃', '재깃'). 땅을 걷는 일을 맡으면 칭호가 줄어든다"
    voice_note: "하늘말은 휘파람과 노래에 가깝다. 인간에게 말할 때는 공용어를 한 박자 늦게 고른다"
  인간:
    # 땅손(납치된 인간과 후손 약 140). 이름은 아에리가 붙인 짧은 부름('아래', '줄') + 납치 전의 진짜 이름. 마르코처럼 아홉 살에 납치된 이는 고향을 기억하지 못한다.
    male: [마르코, 오른, 안스가르, 안톤, 울프, 요스트, 한스, 라르스, 올레, 토르]
    female: [울라, 브란카, 에다, 헬가, 이다, 한나, 순나, 리스베트, 클라라, 마리]
    given_by_aeri: ["아래", "줄", "잔", "바닥", "무거운 손", "작은 불", "{n}번 항아리", "땋는 이"]
    epithet_rule: "아에리가 부르는 짧은 부름('줄', '아래') + 동료가 부르는 일 별명 + 진짜 이름(기억하는 이만). 기둥 하나에서 평생을 사니 사는 기둥 이름이 성처럼 붙는다 ('여섯째 기둥 한스')"
  두르강:
    note: "장터 상인 약 200. 이름·말투는 kit_durgan_delve를 쓴다. 금속은 계곡에서만 거래된다 — 아에리가 무거워하기 때문"
  하르칸:
    note: "전령 수시. 이름·말투는 kit_durgan_delve.names.하르칸"
classes:            # 바람첨탑 + 줄내림 장터 인구 (아에리 6,500 / 인간 140 / 두르강 200)
  아에리 백조·귀족: 0.12
  아에리 매 (전사·사냥꾼·줄지기): 0.40
  아에리 까마귀 (기록·점술): 0.30
  아에리 기타·장례·사육: 0.03
  땅손 (인간): 0.02
  두르강 상인·짐꾼: 0.03
  외국 전령: 0.01
  계곡 도적·떠돌이: 0.09
jobs:
  - {id: wind_hunter, name: 바람 가문 사냥꾼 (활), class: 아에리 매 (전사·사냥꾼·줄지기), race: 아에리, weight: 12, schedule: sch_hunter_aeri}
  - {id: rope_keeper, name: 줄지기 (줄내림 장터), class: 아에리 매 (전사·사냥꾼·줄지기), race: 아에리, weight: 3, schedule: sch_rope_keeper}
  - {id: scout_ring, name: 정찰 고리·땅 관찰자, class: 아에리 매 (전사·사냥꾼·줄지기), race: 아에리, weight: 4, schedule: sch_scout}
  - {id: feather_recorder, name: 까마귀 기록 학자 (깃 서고), class: 아에리 까마귀 (기록·점술), race: 아에리, weight: 8, schedule: sch_recorder}
  - {id: hawk_breeder, name: 매 사육사 (일곱 손가락), class: 아에리 기타·장례·사육, race: 아에리, weight: 1, schedule: sch_breeder}
  - {id: sky_funeral, name: 하늘 장례 집전자, class: 아에리 기타·장례·사육, race: 아에리, weight: 1, schedule: sch_funeral}
  - {id: swan_noble, name: 백조 귀족 (의회 가주·시종), class: 아에리 백조·귀족, race: 아에리, weight: 3, schedule: sch_noble_aeri}
  - {id: ground_gardener, name: 바람 정원 계단밭 일손, class: 땅손 (인간), race: 인간, weight: 8, schedule: sch_ground_garden}
  - {id: rope_mender, name: 줄다리 수리·땋기, class: 땅손 (인간), race: 인간, weight: 4, schedule: sch_rope_mend}
  - {id: cage_cleaner, name: 새장·사육장 청소, class: 땅손 (인간), race: 인간, weight: 3, schedule: sch_cage}
  - {id: ground_smith, name: 바닥 마을 대장일·바느질, class: 땅손 (인간), race: 인간, weight: 2, schedule: sch_ground_smith}
  - {id: durgan_trader, name: 두르강 장터 상인, class: 두르강 상인·짐꾼, race: 두르강, weight: 5, schedule: sch_trader}
  - {id: valley_porter, name: 두르강 상인의 짐꾼 (인간), class: 두르강 상인·짐꾼, race: 인간, weight: 4, schedule: sch_porter}
  - {id: harkan_courier, name: 하르칸 전령, class: 외국 전령, race: 하르칸, weight: 2, schedule: sch_courier}
  - {id: valley_bandit, name: 계곡 도적, class: 계곡 도적·떠돌이, race: 인간, weight: 4, schedule: sch_bandit}
schedules:          # at = 정착지 틀의 역할(role). 아에리는 지붕이 없는 곳에서 일한다. 기둥 사이 이동은 날개나 줄다리다.
