  sch_rope_keeper: [{days: all, from: "05:00", to: "06:00", at: lift_post, doing: 새벽 줄 점검 — 매듭을 하나씩 만져 본다, fixed: true}, {days: workday, from: "06:00", to: "18:00", at: lift_post, doing: 바구니 승강 줄 지킴 — 오르내리는 짐의 무게를 눈으로 잰다}, {days: all, from: "18:00", to: "20:00", at: lift_post, doing: 저녁 줄 거둠 점검}, {days: all, from: "20:00", to: "05:00", at: nest, doing: 기둥 위 둥지}]
  sch_scout:     [{days: all, from: "05:00", to: "17:00", at: scout_ledge, doing: 하늘 순찰과 땅 관찰 — 보고 마을의 불빛을 센다, outdoor: true}, {days: all, from: "17:00", to: "20:00", at: council, doing: 보고서를 깃에 매듭으로 적는다}, {days: all, from: "20:00", to: "05:00", at: nest, doing: 열린 둥지}]
  sch_recorder:  [{days: workday, from: "06:00", to: "18:00", at: library, doing: 깃 서고에서 깃털 매듭을 읽고 묶는다}, {days: all, from: "18:00", to: "21:00", at: scout_ledge, doing: 저녁 비행 — 낮게 날며 땅을 본다, outdoor: true}, {days: all, from: "21:00", to: "05:00", at: nest, doing: 낮은 둥지}]
  sch_breeder:   [{days: all, from: "05:00", to: "19:00", at: mews, doing: 매 사육장 — 먹이와 발끈 점검}, {days: all, from: "19:00", to: "05:00", at: mews, doing: 사육장 곁 둥지}]
  sch_funeral:   [{days: all, from: "06:00", to: "18:00", at: funeral_peak, doing: 가장 높은 봉우리에서 장례 준비 — 바람 방향을 읽고 시신을 놓는다, outdoor: true}, {days: all, from: "18:00", to: "06:00", at: nest, doing: 높은 둥지}]
  sch_noble_aeri: [{days: all, from: "08:00", to: "12:00", at: high_nest, doing: 높은둥지에서 가문 일을 본다}, {days: workday, from: "12:00", to: "17:00", at: council, doing: 깃털 의회 방청이나 주재}, {days: all, from: "17:00", to: "22:00", at: high_nest, doing: 저녁 비행과 만찬}, {days: all, from: "22:00", to: "08:00", at: high_nest, doing: 높은 둥지에서 잔다}]
  sch_ground_garden: [{days: all, from: "05:00", to: "06:00", at: garden, doing: 새벽 물 항아리 점검, fixed: true}, {days: workday, from: "06:00", to: "17:00", at: garden, doing: 계단밭 손질 — 물 항아리를 줄로 올린다, outdoor: true, rain: {at: ground_village, doing: 비 오는 날은 바닥 마을에서 줄을 땋는다}}, {days: all, from: "17:00", to: "20:00", at: ground_village, doing: 마을 식탁 — 말린 생선과 열매}, {days: all, from: "20:00", to: "05:00", at: ground_village, doing: 움막}]
  sch_rope_mend: [{days: all, from: "06:00", to: "18:00", at: rope_bridge, doing: 줄다리 수리 — 매달린 채 매듭을 다시 묶는다, outdoor: true, rain: {at: ground_village, doing: 마을에서 줄을 땋는다}}, {days: all, from: "20:00", to: "23:00", at: ground_village, doing: 밤 땋기 — 항아리 밑에 숨긴 줄에 한 뼘씩 더한다}, {days: all, from: "23:00", to: "05:00", at: ground_village, doing: 움막}]
