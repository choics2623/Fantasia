# 지역 생성 키트 — 모르바 자유 늪 마을 (25_REGION_KITS.md). 뿌리마을·진흙등불·물안개 둑·노란 둑 같은 불법 자유 인간 마을과 일곱 노파의 둥지.
# 원천: REGIONS §8(8.5 인간의 삶·8.7 법·8.8 문화), HOUSES §4.3(늪 마녀 일곱 계보)·§5.6, fac_swamp_hags, fac_hag_lineages, docs/world/people/morva.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_swamp_hags.law / customs 를 본다. 여기에는 '자유 마을에만 있는 재료'(성을 짓는 첫 이름 날, 공동 솥 몫, 망꾼 호루라기, 진흙판, 늪의 계절)를 더한다.
# 핵심: 감독이 없고 배급이 없고 법이 없다 — 그래서 굶주림이 법이다. 인간 농노 키트(kit_human_serf)와 정반대의 결: 점호가 없고 '먹여 주는 사람'도 없다. 서로의 몫을 서로 센다.
id: kit_swamp_free
applies_to: [뿌리마을, 진흙등불, 물안개 둑, 늪 어귀, 섬 마을 31곳, 일곱 노파의 둥지(견습 숙소), 노란 둑(불탄 마을의 흔적)]
