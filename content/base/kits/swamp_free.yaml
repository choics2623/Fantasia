names:
  인간:
    # 탈주자는 노예 이름·번호를 버리고 '일 년 뒤' 성을 짓는다. 그 전에는 이름 하나와 어디서 왔는지로 부른다. 아이는 어머니의 이름 + 태어난 섬.
    male: [알렉, 토르, 베니, 마레크, 브렌, 베른, 가르, 리프, 쥬드, 니크, 우란, 하겐스, 오토, 헬름, 칼, 듀크, 사무, 올프]
    female: [힐케, 난네, 레나, 나디아, 순니, 헤드비가, 엘사, 아냐, 베트, 이다, 요나, 마리카, 테아, 올가, 로타]
    surname_new: ["갈대", "뿌리", "장어", "안개", "둑", "진흙", "물때", "반딧불", "솥", "매듭", "여울", "버들", "쑥", "새벽", "이끼"]
    surname_rule: "성은 일 년을 산 첫 이름 날에 스스로 짓는다. 옛 주인의 이름은 쓰지 않는 것이 관습이지만 셋은 그대로 썼다(난네만 안다). 성이 없는 사람은 '일 년 전'이다"
    epithet_rule: "이름 + 하는 일 또는 몸의 표지(외팔 베니, 솥지기 힐케, 망꾼 쥬드). 노파는 별명이 먼저(눈먼 오다·쇠손 브리타·재혀 요르다)"
    mud_lamp: "섬 마을 사람은 '○○ 둑 사람'으로 소개한다 (진흙등불 둑 사람, 물안개 둑 사람)"
  크릭:
    male: [구르, 티프, 핍, 쏙, 틱틱, 쉬]
    female: [찍, 삐야, 치크]
    note: "늪 크릭 약 30 — 굴종 본능을 이긴 자들. 일곱 노파의 심부름꾼 무리(우두머리 구르 17세). 이 가운데 열은 아직 밤마다 주인의 호루라기를 꿈에서 듣는다"
  나가:
    note: "라미아 밀수꾼(쉬렐)만 출입 — 세렌 뱀장어 길. '미끄럼' '소금 사공' 같은 별명으로 불린다"
  와이번:
    note: "독꼬리 와이번(사스카) 약 60마리 — 쉿소리 늪. 공물 인간 26명을 갈대 우리에서 부린다. 이름은 쉿소리를 닮은 두 음절(사스카·시라·투르)"
