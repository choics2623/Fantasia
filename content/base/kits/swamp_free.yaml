voices:             # 말투 원형 — 짧고 마르고 숫자가 많다. 말을 헤프게 쓰면 '헤프다'고 한다
  - {id: v_swamp_free, name: 늪 자유민, register: "짧은 평어. 인사 대신 '먹었어?'. 숫자와 몫으로 말한다. 높임말은 노파에게만", tics: ["'먹었어?'", "'몫이야.'"], use: [솥, 몫, 덫, 물때, 안개, 호루라기, 둑], avoid: [주인, 허락, 배급, 죄], sample: "솥이 식었어. 먹었어? 안 먹었으면 앉아. 말은 먹고 나서 해."}
  - {id: v_swamp_spotter, name: 늪 어귀 망꾼, register: "숫자부터 묻는다. 이름은 나중. 대답은 호루라기로도 한다", tics: ["'몇이야?'"], use: [몇, 배, 호루라기, 불, 아이], avoid: [이름(먼저), 의심], sample: "배는 몇 척이야? 사람은 몇이고? 숫자부터 말해."}
  - {id: v_swamp_hag_daughter, name: 노파의 딸, register: "낮은 존대와 비유. 낱말 하나에 수명이 드니 말을 아낀다. 외부인에게는 질문으로 시험한다", tics: ["'말해 봐요, 아무 말이나.'"], use: [피 병, 낱말, 쑥, 바위, 그릇, 한 해], avoid: [시간(낱말), 마녀(스스로), 공짜], sample: "병 하나가 한 해예요. 마흔 하나를 내가 센다고 생각해 봐요."}
  - {id: v_swamp_student, name: 진흙판 학생, register: "빠른 반말. 글자를 입 모양으로 되뇌며 걷는다. 모르는 낱말은 '선생님이 아직 이르대'", tics: ["'나 열여덟 자 알아.'"], use: [판, 막대, 글자, 열여덟, 선생님], avoid: [아직 모르는 글자의 이름], sample: "나 열여덟 자 다 알아. 열아홉째는 선생님이 아직 이르대."}
  - {id: v_swamp_tribute, name: 갈대 우리 사람, register: "느리고 낮은 평어. 숫자를 센 뒤에 말한다. 와이번에게는 공용어 한 낱말씩", tics: ["'하나도 빼지 않고.'"], use: [스물여섯, 짚, 알, 활줄], avoid: [혼자, 공물], sample: "스물여섯. 나까지 스물여섯. 하나라도 빼고 나가는 이야기면 안 들어."}
  - {id: v_swamp_krik, name: 늪 크릭, register: "가늘고 빠른 말. 호루라기 소리를 싫어한다. 고개를 숙였다가 억지로 든다", tics: ["'주인 없어.'"], use: [쑥 즙, 굴, 밤, 이름], avoid: [호루라기, 주인], sample: "구르야. 주인 없어. 호루라기도 없어. 늪에는."}
