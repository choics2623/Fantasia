swamp_customs:      # 늪에서만 있는 것 — 법·관습 본문은 fac_swamp_hags.law / customs, REGIONS §8.7·§8.8
  - "'먹었어?'가 인사다. 대답이 '아니'면 앉혀서 먹인다 — 솥은 몫이지 배급이 아니다. 굶주림월에는 하루 한 끼, 솥지기가 정한다"
  - "첫 이름 날 — 탈주자가 뿌리마을에서 일 년을 살면 스스로 성을 짓는다. 매듭 끈 하나가 한 사람. 지금까지 412. 이름 없는 끈은 일 년을 못 채우고 죽은 사람의 몫이다"
  - "재의 날에는 불 대신 반딧불 병을 든다 — 대륙에서 유일하게 아스테리온을 공개적으로 기린다"
  - "밀고자는 익사한다 (뿌리마을 유일한 사형). 뿌리 모임 판결에 노파 한 사람의 동의가 있어야 한다"
  - "붉은 갈대 선을 넘으면 처벌은 없다 — 돌아오지 못할 뿐이다. 말하는 이끼 바위에 이름을 새기지 않고, 노파의 그림자에 침을 뱉지 않는다"
  - "호루라기 일곱: 상인·탈주자·안내인·목줄단·녹테른 순찰·불·아이. 아이 호루라기가 불면 모든 일을 멈춘다"
