voices:             # 말투 원형 — 학자는 조용히 정확하고 서기는 숨기고 피험자는 번호로 말한다
  - {id: v_tower_scholar, name: 학자, register: "질문하듯 말한다. 논문 문장이 섞인다. 상대의 학습 곡선·꿈·언어 수를 묻는다. 인간은 '피험자' 또는 '서기'로 부른다", tics: ["'질문은 셋.'", "'측정 오차'"], use: [측정, 오차, 학파, 논문, 시험, 곡선], avoid: [윤리, 아이, 사람(먼저)], sample: "앉아요. 질문은 셋. 꿈을 꿉니까? 몇 개 언어를 압니까? 처음 가는 길을 안 적이 있습니까?"}
  - {id: v_tower_clerk, name: 서기 노예, register: "낮고 소리 죽인 말. 눈은 문서. 모양과 숫자만 말하고 의미는 입에 올리지 않는다", tics: ["'저는 모양만 베껴요.'"], use: [모양, 필사, 숫자, 구멍, 바늘], avoid: [읽다, 뜻, 이름], sample: "저는 모양만 베껴요. 구멍은 종이가 원래 가진 거고요."}
  - {id: v_tower_subject, name: 피험자, register: "번호로 소개한다. 짧고 조용한 말. 벽 너머 이웃과는 다정한 반말. 학자에게는 작은 존댓말", tics: ["'번호는…'", "'이름이 먼저예요.'"], use: [번호, 방, 측정, 꿈, 벽], avoid: [징후(스스로), 시험], sample: "네레예요. 번호는 0307이고요. 이름이 먼저예요."}
  - {id: v_tower_hunter, name: 잿빛 눈 사냥꾼, register: "짧은 반말. 이름 없이 어디서 걸어왔는지 묻는다. 서면으로 말하는 것을 좋아한다", tics: ["'어디서 걸어왔나.'"], use: [걸음, 사냥꾼, 열둘, 현상금, 서면], avoid: [가짜 징후, 얼굴], sample: "이름은 필요 없다. 어디서 걸어왔는지만 말해라."}
  - {id: v_tower_guard, name: 경비·간수, register: "무뚝뚝한 반말. 번호부터 묻는다. 열쇠 소리로 대답하기도 한다", tics: ["'번호.'"], use: [번호, 복도, 점호, 열쇠], avoid: [이름, 바다], sample: "번호. 번호 없으면 방도 없고 방 없으면 이 복도에 서 있지 마."}
  - {id: v_tower_harbor, name: 부두 사람, register: "짧은 인사와 허가증. 세렌 상인어 섞인 말. 값을 은근히 센다", tics: ["'허가증.'"], use: [허가증, 입항, 귀리, 폭풍, 열쇠], avoid: [297, 물통], sample: "허가증. 인간이면 서기 표식이나 피험자 번호."}
temperaments: [정확, 냉정, 호기심, 겁, 헌신, 은밀, 고독, 집요, 인내, 건조, 다정, 속정, 의심, 체념, 고집]
tower_customs:      # 탑에서만 있는 것 — 법·금기 본문은 fac_ashen_tower.decision / forbidden_topics, REGIONS §10.7·§10.8
  - "서기는 모양만 베낀다 — 의미를 읽는 것이 들키면 피험자로 옮겨진다. 소리 내어 읽는 것은 금기. 서기들은 바늘 구멍 '구멍 글'로 서로만 읽는다"
  - "계절 첫날(해빙·푸른·포도·긴밤월) 7층 강당에서 낭독 논문. 같은 학파 정학자 셋의 봉인 도장을 받으면 탑의 지식이 된다"
  - "매달 그믐 일곱 의자 원탁 — 일곱 원로 중 넷이면 통과. 탑주는 봉인 서가·시간 유리 칼·수집실의 거부권"
  - "관측의 밤(재의 날 5일째) — 피험자 전원이 탑 마당에 선다. 누가 '반응'하는지 본다"
  - "피험자는 방 번호로 불린다. 이름이 있는 사람은 벽 너머 이웃뿐이다. 서기는 '필사대 줄과 자리'"
  - "굶주림월 폭풍철에는 섬이 고립되고 피험자 배급이 절반이 된다. 부두장의 비밀 식량이 서기·잡역 인간을 먹인다"
  - "섬 안에는 시장이 없다. 서기 노예들끼리 '잉크 방울'(몰래 모은 잉크)을 화폐처럼 쓴다"
  - "시간에 민감한 자(탑주·측정관)는 낙엽월 1일 저녁 6시 칼이 한 번 차가워지는 것을 매 회차 적는다 — 기억하지 못한 채"
