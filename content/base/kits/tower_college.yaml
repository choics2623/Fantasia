# 지역 생성 키트 — 학회 탑섬 (25_REGION_KITS.md). 아르카스 잿빛 탑과 그 부두, 재눈 초소, 그리고 학회가 사냥꾼·서기를 풀어 놓는 곳.
# 원천: REGIONS §10(10.3 지배 구조·10.5 인간의 삶·10.7 법·10.8 문화), HOUSES §5.8(학파·일곱 원로), fac_ashen_tower, docs/world/people/arkas.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_ashen_tower.decision / forbidden_topics / law 를 본다. 여기에는 '탑에만 있는 재료'(번호 회랑, 구멍 글, 낭독 논문, 시간 민감한 자의 같은 줄, 관측의 밤)를 더한다.
# 핵심: 가장 친절한 감옥이다. 학자는 이해하려 하고 사냥꾼은 잡아 오고 서기는 모양을 베낀다 — 인간은 피험자이거나 서기이거나 잡역이다. 시간에 민감한 자(탑주·측정관)는 회차가 쌓일수록 같은 줄을 장부에 쓴다.
