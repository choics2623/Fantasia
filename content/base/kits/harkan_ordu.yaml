  - {id: whip_rider, name: 채찍 기수, class: 채찍 기수, race: 하르칸, age: [25, 50], weight: 4, schedule: sch_whip}
  - {id: horse_keeper, name: 가축 말 돌보는 이 (인간), class: 인간 솥·젖·펠트·매듭 일손, race: 인간, weight: 4, schedule: sch_horse_keeper}
  - {id: tent_bearer, name: 천막 짐꾼, class: 인간 짐꾼 (칸 직속·부족 소유), race: 인간, weight: 16, schedule: sch_porter}
