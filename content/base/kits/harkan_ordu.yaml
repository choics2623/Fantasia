# 지역 생성 키트 — 하르칸 초원 (25_REGION_KITS.md). 칸의 오르두(이동 수도), 겨울 진영 바람 우물, 말뼈 샘, 소금 호수, 버려진 자들의 마을.
# 원천: REGIONS §15, RACES §11, SUBRACES §9, HOUSES §3.6, fac_harkan(달리는 합의·바람 맹세·경주 재판·발굽 아래 법), CONTINUITY_LOG(부족 19중 17 복속).
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_harkan.customs / law / decision 을 본다.
# 핵심: 하르칸은 한곳에 오래 머물면 병든다(10일 열병·30일 쇠약·90일 죽음). 그래서 정착지가 '틀'이다 — 칸의 오르두는 아흐레마다 같은 모양으로 다시 선다.
#       인간은 짐꾼이고, 초원에 버려진 인간은 누구의 것도 아니다. 하르칸은 땅에 묻지 않고, 늙으면 스스로 떠나고, 약속은 바람에게 한다.
id: kit_harkan_ordu
applies_to: [칸의 오르두, 바람 우물 겨울 진영, 말뼈 샘, 무거운발굽 짐 야영지, 소금 호수, 꺾인 깃발 진영, 버려진 자들의 마을, 하르칸 부족 천막 고리]
reuses: [kit_human_serf]       # 인간 짐꾼의 이름 붙이기·말투 원형 일부를 쓰되 '하루 12시간 행군'과 '낙오 = 버림'의 틀로 바꾼다
faction_refs: [fac_harkan, fac_krik, fac_beastkin, fac_durgan]
seasonal_route:    # 오르두는 열흘을 넘겨 한곳에 서지 않는다. 계절 길은 REGIONS §15.2 — 정착지 배치도는 같은 모양으로 매번 다시 선다
  봄 (해빙월~꽃월): "겨울 진영(바람 우물)에서 북상 — 짐꾼 행군 하루 12시간. 북부 여름 초원으로"
  여름 (푸른월~건초월): "우기·말뼈 여울 범람·전쟁 시즌 — 통일 전쟁에서 짐꾼이 가장 많이 쓰러진다"
  가을 (수확월~낙엽월): "남하와 사냥 축제. 남쪽 사냥 초지에서 말뼈 샘 곁에 선다"
  겨울 (서리월~굶주림월): "바람 우물 겨울 진영 — 4만이 모인다. 동사와 짐꾼 사망이 늘어난다"
  이동일: "아흐레마다 (열흘 규칙보다 하루 짧게 — 보르테의 매듭). 이동일 05:00 짐 싸기 북, 같은 날 해 지기 전에 다시 선다"
names:
  하르칸:
    # 이름 = 개인명 + 별칭(털색·업적·몸) + 부족명 (RACES §11). 짧은 두 음절이 많고 거센소리가 많다. 땋은 갈기 수가 승리 수라 별칭에 수를 쓰기도 한다.
    male: [테무르, 바타르, 옥타이, 바투, 에젤, 카사르, 보로, 알탄, 투멘, 사이칸, 델게르, 아르군, 수베데이, 쿠추, 차간, 투그릴, 오르두, 무칼리, 하단]
    female: [소란, 보르테, 일라, 아일라, 홀룬, 일레, 올룬, 체첵, 나랑, 수흐, 알탄이, 예수이]
    clans: [아르슬란, 붉은갈기, 일곱샘, 검은바람, 마지막발굽, 붉은발굽, 무거운발굽, 숲발굽, 꺾인 깃발]
    epithet_rule: "개인명 + 털색·몸의 별칭(흰갈기·잿빛꼬리·바람귀·늙은굽·얼룩) + 부족명. 승리 수만큼 땋은 갈기로 존대가 정해진다. 늙은이는 '늙은굽'을 붙여 스스로 떠날 날을 알린다"
    size_note: "서 있는 키 2.2~2.6m, 체중 500~800kg. 무거운발굽은 2.6~2.9m·1톤 안팎. 갈·흑·회·얼룩 털. 하루 200km"
  인간:
    # 짐꾼은 부족 이름이 아니라 '짐'으로 불린다. 낙오하면 이름 없는 자가 되고, 버려진 자들의 마을에서 다시 이름을 얻는다.
    male: [보리스, 두아르, 닐스, 얀, 오토, 하노, 마르텐, 요나스, 토비, 코른, 로만, 빌, 에고르]
    female: [두아, 이다, 네스타, 올가, 리나, 멜라, 소냐, 바샤, 우나, 헬가]
    given_by_load: ["{n}번 짐", "물통", "솥뚜껑", "한 짝", "넷째 줄", "절름", "갈기 실", "젖소리", "말뼈", "쉰 번째 줄"]
    epithet_rule: "하르칸이 부르는 짐 이름(물통·한 짝) + 동료가 부르는 몸의 별명 + 진짜 이름(밤 불가에서만). 칸 직속 짐꾼은 머리를 한 줄만 남기고 민다 — 영예이자 표식. 버려진 자들의 마을 사람은 이름을 새로 짓는다 (돌무더기 이름)"
  크릭:
    male: [쏙, 잭스, 딸깍, 틱, 핍, 삑, 스니]
    female: [찍, 삐야, 치크]
    note: "초원 크릭 약 3,000 — 소금 호수 감독, 말·곡물·소금 거간, 오르두 장부. 하르칸은 크릭을 '숫자 세는 작은 발'이라 부르며 장부는 무시하되 값은 믿는다"
  수인족:
    note: "그나르(하이에나) 시체 청소부 — 모두가 경멸하나 쓸모가 있다 (히악). 줄무늬 왕좌와 초원 남부 경계 분쟁"
  두르강:
    note: "카즈둠 무기상 — 철 무기·창날을 대는 수입 길. 추방 씨족 돌피 출신이 섞여 있다 (검은바람과 비밀 동맹)"
classes:            # 칸의 오르두 기준 (하르칸 약 20,000, 인간 약 10,000, 크릭·기타 약 300)
  하르칸 질주자 (전사): 0.28
  하르칸 어린 말 (15세 미만·훈련): 0.12
  하르칸 늙은 말 (스스로 떠날 날을 기다림): 0.04
  하르칸 가축·말 돌보는 이: 0.05
  하르칸 벡·반려·전령·바람 읽는 자: 0.04
  인간 짐꾼 (칸 직속·부족 소유): 0.22
  인간 등짐 행렬: 0.17
  인간 솥·젖·펠트·매듭 일손: 0.05
  채찍 기수: 0.02
  크릭·그나르·무기상: 0.01
