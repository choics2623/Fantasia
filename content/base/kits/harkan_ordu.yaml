  sch_whip:        [{days: all, from: "04:30", to: "05:30", at: whip_post, doing: 짐꾼 점호 — 줄 수를 센다, fixed: true}, {days: workday, from: "05:30", to: "18:00", at: porter_camp, doing: 짐꾼 감독 — 채찍은 쥐고만 있다가 낙오자 앞에서 든다, outdoor: true}, {days: all, from: "18:00", to: "21:00", at: whip_post, doing: 낙오와 짐 분실 보고를 칸의 장부에 올린다}, {days: "monthday:[9,18,27]", from: "05:00", to: "19:00", at: burden, doing: "이동일 행렬 뒤를 달린다 — 낙오를 센다", outdoor: true, fixed: true}]
