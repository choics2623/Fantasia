  sch_arms:        [{days: workday, from: "07:00", to: "17:00", at: trade, doing: 철 창날·화살촉을 늘어놓고 값을 센다 — 두르강 법에 서명하지 않은 칼만 판다}, {days: all, from: "17:00", to: "07:00", at: trade, doing: 천막 뒤 수레}]
voices:             # 말투 원형 — 하르칸은 '오늘'을 사는 빠르고 짧은 말, 인간은 낮추고 걸으며 말한다
  - {id: v_wind_rider, name: 질주자, register: "빠르고 짧은 평어. 인간에겐 '느린 발'과 명령형. 같은 질주자끼리는 갈기 수와 속도로 존대가 정해진다. 약속은 '바람이 들었다'로 끝낸다", tics: ["'어느 쪽 바람이오?'", "'바람이 들었다.'"], use: [오늘, 바람, 갈기, 달린다, 먼저, 느린 발], avoid: [내일(먼 미래), 머물다, 정착, 지붕, 늙었다], sample: "어느 쪽 바람이오. 다리부터 보이겠소. 짧게 말하시오 — 오르두는 아흐레 뒤면 여기 없소. 바람이 들었다."}
  - {id: v_bek, name: 벡 (부족장), register: "느리게 걸으며 말한다. 한 문장마다 갈기 한 가닥을 만진다. 이탈할 때는 말이 아니라 가닥을 자른다", tics: ["갈기 가닥을 만지작거린다", "'뒤에서 달리는 수가 내 말이오.'"], use: [가닥, 맹세, 부족, 뒤에서, 옆으로, 물, 샘], avoid: [투표, 결정(결정은 달리기가 한다), 사과], sample: "내 뒤에서 달리는 이가 몇인지 세어 보시오. 그 수가 내 말이오. 옆으로 비껴 달리는 이가 생기면 그때 말이 바뀌오."}
  - {id: v_elder_horse, name: 늙은 말, register: "느린 평어에 과거형이 많다 — 하르칸답지 않은 말. 젊은 질주자에게 '달리지 못하는 자의 말도 바람이 듣는다'고 한다", tics: ["'내가 달릴 때는.'", "'바람이 아직 이름을 부르지 않았다.'"], use: [옛 법, 서풍, 언덕, 늙은굽, 떠남, 마지막], avoid: [오늘 중심 말투, 부양, 정착(수치)], sample: "내가 달릴 때는 서풍 날 서쪽으로 가는 자가 없었다. 달리지 못하게 된 뒤에야 법이 무엇을 막았는지 보인다."}
  - {id: v_porter, name: 짐꾼, register: "하르칸에게는 눈을 낮춘 짧은 존대('예, 달리시는 분'). 같은 짐꾼에겐 걸으며 낮게 반말. 사람 수와 짐 수를 입에 단다", tics: ["'넷째 줄은 아직 있어.'", "'걸으면서 말해.'"], use: [줄, 짐, 쓰러진, 줍는, 돌무더기, 걸음, 물통], avoid: [탈주(그들은 '줍힌다'고 한다), 자유, 하르칸을 말이라 부르기], sample: "걸으면서 말해. 넷째 줄은 아직 있어. 쓰러진 척은 해가 지면 줍힌다 — 돌무더기가 서 있는 자리에서."}
  - {id: v_load_elder, name: 짐 맏이, register: "하르칸에게 초원어로 짧고 정확한 존대, 짐꾼에게는 반말인데 이름을 불러 준다. 낙오 수를 빼고는 숫자를 말하지 않는다", tics: ["'줄 센다.'", "'짐부터 들어.'"], use: [짐, 줄, 사람이 먼저, 걸음, 물], avoid: [탈주, 해방, 칸의 계획 비평], sample: "짐부터 들어. 이야기는 걸으면서. 줄 센다 — 어제보다 하나 빈다."}
  - {id: v_krik_ledger, name: 크릭 거간, register: "혀 차는 소리와 빠른 존대. 하르칸 앞에서는 값만 말한다. 장부를 읽어 주지 않는다", tics: ["'값은 오늘 아침 그대로입니다.'", "'말 한 마리에 사람 열.'"], use: [값, 말, 소금, 곡물, 마리, 섬], avoid: [노예(물건이라 부른다), 자유], sample: "말 한 마리에 사람 열입니다요. 안장 하나에 사람 하나. 값은 오늘 아침 그대로입니다."}
  - {id: v_gnar, name: 그나르 청소부, register: "웃음이 섞인 느린 평어. 모두에게 같은 높이로 말하는 유일한 사람 — 아무도 그를 높이지 않으므로", tics: ["'(웃는다)'", "'죽은 사람은 말이 많소.'"], use: [유품, 주머니, 어디서 죽었나, 돌무더기, 장부], avoid: [이름(죽은 자의 이름은 밤에만)], sample: "(웃는다) 죽은 사람은 말이 많소. 주머니가 말하오. 이 신발 주인은 사흘 전 넷째 줄에서 쓰러졌소."}
temperaments: [성급, 과묵, 자존, 겸손, 영리, 완고, 다정, 의심, 체념, 반골, 계산, 경건, 용맹, 앙심, 느림]
harkan_customs:     # 하르칸에서만 있는 것 — 법·관습 본문은 fac_harkan.law/customs
  - "인사는 '어느 쪽 바람이오?' — 서로 등 뒤 바람을 말하고 상대의 다리부터 본다. 갈기 한 가닥을 건네 보이는 것이 신뢰의 시작"
  - "정착 권유('여기 머물라')는 결투 사유 — 인간이 하면 역린이다"
  - "죽은 자는 땅에 묻지 않고 높은 언덕에 둔다. 인간 짐꾼의 시신을 묻는 것도 부족 전체의 사냥감이 되는 일이었으나 쓰러진 짐꾼을 돌무더기로 덮는 것은 눈감아 왔다"
  - "늙은 하르칸은 달리지 못하게 되면 스스로 무리를 떠난다. 부양하는 쪽이 치욕이다 — 바타르·예순 늙은굽은 예외"
  - "경주 재판 — 길이 다툼의 무게. 먼저 닿은 자의 말을 듣는다. 인간이 이긴 적은 법이 한 번 헤아려 보았을 뿐이다"
  - "바람 맹세 — 갈기를 한 가닥씩 바꿔 땋는다. 깨면 가닥을 잘라 바람에 날린다. 부족이 칸의 수에서 빠진다"
  - "'이삭 줍기' — 행렬 뒤에 쓰러진 척으로 남긴 동료를 다음 행렬이 줍는다. 초원의 돌무더기가 그 표식이고 하르칸은 못 본 척한다"
