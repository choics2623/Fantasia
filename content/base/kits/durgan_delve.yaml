  - {id: armor_smith, name: 갑옷 장인 (잿모루 거리), class: 두르강 장인, race: 두르강, weight: 8, schedule: sch_armor}
  - {id: stone_cutter, name: 석공·기둥 다듬이, class: 두르강 광부·석공, race: 두르강, weight: 10, schedule: sch_stone}
  - {id: pit_foreman, name: 갱 맏이 (인간 감독), class: 두르강 광부·석공, race: 두르강, weight: 5, schedule: sch_foreman}
  - {id: royal_guard, name: 왕실 경비 (중갑), class: 두르강 경비, race: 두르강, weight: 8, schedule: sch_guard_delve}
  - {id: rune_scribe, name: 룬 서기 (계약의 전당), class: 두르강 서기·판관, race: 두르강, weight: 5, schedule: sch_scribe}
  - {id: shrine_acolyte, name: 조상의 망치 신전 사제·수습, class: 두르강 사제, race: 두르강, weight: 2, schedule: sch_shrine}
