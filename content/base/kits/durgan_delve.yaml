  - {id: direct_miner, name: 왕실 직할 계약 광부, class: 계약 광부 (인간), race: 인간, weight: 3, schedule: sch_contract_miner}
  - {id: camp_cook, name: 숙영지 식당 요리사, class: 계약 광부 (인간), race: 인간, sex: female, weight: 3, schedule: sch_camp_cook}
  - {id: expired_trader, name: 만료장 상인 (만료 자유민), class: 만료 자유민 (인간), race: 인간, weight: 4, schedule: sch_expired_trader}
  - {id: expired_reader, name: 만료장의 '읽어 주는 이' (두 번째 서명), class: 만료 자유민 (인간), race: 인간, weight: 1, schedule: sch_reader}
  - {id: naga_broker, name: 나가 곡물 중개인, class: 외국 상인·사절, race: 나가, weight: 2, schedule: sch_broker}
  - {id: harkan_envoy, name: 하르칸 사절·말 장수, class: 외국 상인·사절, race: 하르칸, weight: 2, schedule: sch_envoy}
schedules:          # at = 정착지 틀의 역할(role) 이름. 모든 두르강 일은 '종소리'가 아니라 '계약서의 시각'으로 열고 닫힌다.
  sch_forge:     [{days: all, from: "05:30", to: "06:00", at: shrine_hall, doing: 조상의 망치에 인사 — 세 번 두드린다, fixed: true}, {days: workday, from: "06:00", to: "12:00", at: forge, doing: 단조}, {days: all, from: "12:00", to: "12:40", at: canteen, doing: 귀리죽과 버섯빵}, {days: workday, from: "12:40", to: "16:30", at: forge, doing: 단조·담금질}, {days: all, from: "18:00", to: "22:00", at: tavern, doing: 맥주통 곁에서 계약 이야기}, {days: all, from: "22:00", to: "05:30", at: lodging, doing: 돌 침상}, {days: sabbath, from: "08:00", to: "10:00", at: shrine_hall, doing: 조상의 망치 앞에서 맹세 점검}]
