  sch_stone:     [{days: workday, from: "06:00", to: "16:00", at: quarry, doing: 기둥 다듬기·조상 무덤 보수}, {days: all, from: "12:00", to: "12:40", at: canteen, doing: 점심}, {days: all, from: "17:00", to: "22:00", at: tavern, doing: 저녁}, {days: all, from: "22:00", to: "06:00", at: lodging, doing: 잠}]
  sch_foreman:   [{days: workday, from: "05:30", to: "06:00", at: pit_gate, doing: 계약 광부 점호 — 계약서 번호를 부른다, fixed: true}, {days: workday, from: "06:00", to: "16:00", at: pit, doing: 갱 순시}, {days: workday, from: "16:00", to: "17:00", at: contract_desk, doing: 초과 노동 철괴 조각 정산}, {days: all, from: "19:00", to: "22:00", at: tavern, doing: 맏이들의 저녁}, {days: all, from: "22:00", to: "05:30", at: lodging, doing: 잠}]
  sch_guard_delve: [{days: all, from: "06:00", to: "14:00", at: checkpoint, doing: 층계 검문 — 계약 증표를 본다}, {days: all, from: "14:00", to: "18:00", at: guard_barracks, doing: 무장 점검}, {days: all, from: "22:00", to: "06:00", at: streets, doing: 야간 순찰 (깊은 문 쪽은 가지 않는다)}]
  sch_scribe:    [{days: workday, from: "07:00", to: "17:00", at: contract_hall, doing: 돌판 새김·조항 대조}, {days: all, from: "18:00", to: "22:00", at: lodging, doing: 방에서 룬 연습}, {days: sabbath, from: "08:00", to: "12:00", at: oath_court, doing: 돌 법정 방청}]
  sch_shrine:    [{days: all, from: "05:00", to: "06:00", at: shrine_hall, doing: 새벽 세 번 두드림, fixed: true}, {days: all, from: "06:00", to: "18:00", at: shrine_hall, doing: 신전 시중}, {days: all, from: "20:00", to: "05:00", at: lodging, doing: 사제 숙소}]
  sch_contract_miner: [{days: workday, from: "05:30", to: "06:00", at: pit_gate, doing: 점호 — 계약서 번호, fixed: true}, {days: workday, from: "06:00", to: "16:00", at: pit, doing: 채굴 (계약에 적힌 10시간)}, {days: all, from: "16:00", to: "17:00", at: canteen, doing: 귀리죽 둘과 버섯빵, fixed: true}, {days: all, from: "17:00", to: "21:00", at: camp_square, doing: 철괴 조각을 세고 계약 게시판 앞에서 이야기}, {days: all, from: "21:00", to: "05:30", at: dorm, doing: 숙소}, {days: sabbath, from: "08:00", to: "11:00", at: camp_chapel, doing: 안식일 — 두르강은 쉬는 날을 따로 두지 않으나 계약서에 적힌 하루다}]
