# 지역 생성 키트 — 두르강 굴과 계약 광부촌 (25_REGION_KITS.md). 카즈둠 산맥: 깊은망치 왕궁(지하 9층), 망치문, 굴뚝 숙영지(만료장 포함).
# 원천: REGIONS §12, HOUSES §3.3, fac_durgan(계약·서명 회기·돌피병), fac_beat_ledger(고동 장부 — 키트에는 쓰지 않는다), kit_mine_slave(바깥 갱의 인간 광부).
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_durgan.law / customs / decision 을 본다.
# 두르강의 핵심: 모든 일이 '서명'이고, 시간은 계약서에 적힌 대로 흐른다. 하루는 10시간 노동 — 초과는 각인 철괴 조각으로 값을 친다. 크릭은 쓰지 않는다.
id: kit_durgan_delve
applies_to: [깊은망치 왕궁, 망치문, 굴뚝 숙영지, 만료장, 바깥 갱, 회색 갱, 깊은 문 탐사 진지, 바르둠 요새]
reuses: [kit_mine_slave]      # 바깥 갱의 인간 계약 광부 일과는 광산 노예 키트의 2교대 틀을 쓰되 '계약서에 적힌 10시간'으로 줄인다
faction_refs: [fac_durgan, fac_beat_ledger]
names:
  두르강:
    # 두르강은 '이름 + 씨족명'. 씨족명은 가문 문장(룬)의 뜻이다. 맹세를 깬 이는 씨족명을 잃고 '이름 없는 자'가 된다.
    # 이름은 두 음절 단단한 소리(ㅋ·ㄱ·ㄷ·ㅌ·ㄹ). 여자 이름은 끝이 'ㅏ·ㅎ·ㄹ'로 닫힌다. 나이는 숫자가 아니라 '맹세의 수'로 센다.
    male: [브로르, 하그린, 크라그, 타른, 둔, 케른, 그로딘, 도린, 발람, 토르크, 오드, 해그, 시그룬, 라그, 보르크, 군트, 데르크, 마크]
    female: [힐다, 우를라, 시그나, 타르나, 마그나, 군힐드, 브룬, 헬가, 오달, 하랄다, 베라, 스바]
    clans: [깊은망치, 룬새김, 무쇠문, 잿모루, 회색광맥, 맹세지기, 돌바닥, 쇳줄, 잿수염, 석회손]
    epithet_rule: "이름 + 씨족명. 공적인 자리에서는 씨족명을 먼저 부르고 계약 번호(가슴 룬)를 뒤에 붙인다. 별명은 쇠붙이·돌 이름(반석, 재송곳)이며 맹세를 깬 뒤에만 생긴다"
    oath_count: "나이 대신 '맹세 n개'로 신분을 말한다. 어린 두르강은 맹세가 둘, 왕은 천이백열둘 (브로르 수염 구슬)"
  인간:
    # 계약 광부는 계약서에 이름(서명용 룬 글자)이 적힌다 — 인간이 법적으로 '이름'을 갖는 드문 곳. 별명은 갱에서 붙는다.
    male: [페타르, 베른트, 얀, 울리, 마테, 하인, 브란, 한스, 에릭, 라스, 로타르, 오토, 쿠르트, 헤르만, 닐스]
    female: [로타, 마리, 한나, 이다, 에다, 일제, 그레테, 루트, 헬가, 우테, 클라라, 프리다, 리스베트, 야나, 엘케]
    given_by_mine: ["{n}년 차", "만료 앞", "서명손", "굳은무릎", "읽는 눈(금기 별명 — 룬을 읽는다는 소문)", "마흔 해", "계약 사본", "숫자"]
    epithet_rule: "계약서의 서명 룬 이름(공식) + 갱 별명(몸·버릇·남은 계약 햇수) + 진짜 이름(집에서 부르던 것). 만료자는 만료일을 별명 대신 단다 ('서리월 만료 로타')"
  나가:
    any: [지올, 모스, 사스리, 엘루, 니에바, 시렌, 카사]
    note: "나가 상인 60 — 곡물·소금 수입 중개. 계약서를 가장 빨리 읽는 손님이고, 두르강은 그들의 서명을 믿되 문구를 의심한다"
  하르칸:
    any: [바타르, 에르덴, 소론, 투멘, 사이한, 올치]
    note: "하르칸 사절 20 — 동문 쪽 사절관. 말(馬)과 무기를 맞바꾸는 말 계약"
classes:            # 깊은망치 왕궁 기준 (REGIONS §12.4 — 두르강 약 46,000 중 3만이 왕도)
  두르강 장인: 0.34
  두르강 광부·석공: 0.24
  두르강 경비: 0.10
  두르강 서기·판관: 0.06
  두르강 사제: 0.02
  계약 광부 (인간): 0.14
  만료 자유민 (인간): 0.06
  외국 상인·사절: 0.04
