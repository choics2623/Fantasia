  sch_broker:    [{days: workday, from: "08:00", to: "17:00", at: market, doing: 곡물 계약 — 문구를 소리 내어 읽는다}, {days: all, from: "17:00", to: "08:00", at: guest_lodge, doing: 객실}]
  sch_envoy:     [{days: workday, from: "09:00", to: "16:00", at: market, doing: 말 계약 흥정}, {days: all, from: "16:00", to: "09:00", at: guest_lodge, doing: 사절관}]
voices:             # 말투 원형 — 두르강은 '조항'으로 말하고 거짓을 말하지 않는다 (침묵은 한다)
  - {id: v_clause, name: 조항으로 말하는 두르강, register: "하게체와 하오체를 섞는다. 문장이 '~하는 한', '~하지 아니하면'으로 닫힌다. 비교 대신 조건을 쓴다", tics: ["'돌이 듣는다.'", "'그 조항이 그렇다.'"], use: [계약, 서명, 조항, 맹세, 돌, 값], avoid: [아마, 어쩌면, 약속하지, 믿는다(그들은 '서명했다'고 한다)], sample: "서명했다면 지킨다. 서명하지 않았다면 나는 아무것도 아니다. 그 사이는 없다."}
  - {id: v_oathbreaker, name: 돌이 되어 가는 자, register: "말이 짧고 낮다. 굳은 팔 쪽을 감추며 '맹세 없는 자'라 스스로를 부른다", tics: ["'굳은 쪽은 묻지 마라.'"], use: [맹세, 팔, 돌, 값, 남은 조항], avoid: [용서, 명예], sample: "굳은 쪽은 묻지 마라. 물어도 팔이 대답하지 않는다. 심장에 닿으면 알려 주마."}
  - {id: v_gang_elder, name: 갱 맏이, register: "인간에게도 반말이 아니라 '번호'로 부르며 높임말과 반말 사이의 하게체. 틀린 조항 앞에서만 목소리가 높아진다", tics: ["'번호 대.'", "'계약에 적힌 만큼만.'"], use: [번호, 철괴 조각, 점호, 교대, 갱도], avoid: [채찍, 벌(그들은 '조항'이라 한다)], sample: "번호 대. 사백이십일. 오늘 십 시간 채웠다. 초과 한 시간은 철괴 조각 하나로 적는다."}
  - {id: v_contract_miner, name: 계약 광부, register: "조항 이름을 외워서 말한다. 두르강에게는 존대, 같은 광부에게는 반말. 만료가 가까울수록 말수가 줄고 날짜를 센다", tics: ["'계약서에 있는 대로.'", "'만료까지 사십 일.'"], use: [만료, 조항, 철괴, 점호, 연장], avoid: [탈주, 자유(만료 전에는 입에 올리지 않는다)], sample: "계약서에 있는 대로 합니다. 만료까지 사십 일. 그 전에는 아무것도 묻지 마세요."}
  - {id: v_expired_free, name: 만료장 자유민, register: "어색한 반말과 존댓말이 섞인다. 처음 가져 본 자기 이름을 자주 말한다. 새 광부 앞에서는 낮은 목소리", tics: ["'내 계약서는 내가 찢었다.'"], use: [찢다, 적립, 이름, 임차, 읽다], avoid: [주인], sample: "내 계약서는 내가 찢었다. 그날 이름을 불러 줬어. 아무도 번호로 부르지 않더라."}
  - {id: v_rune_scribe, name: 룬 서기, register: "속삭임에 가까운 존대. 글자를 입으로 읽지 않고 손가락으로 허공에 새기며 말한다", tics: ["'(허공에 새기며) 이 줄은.'"], use: [줄, 돌판, 새김, 서명 룬, 대조], avoid: [읽다(인간 앞에서는 '본다'고 한다)], sample: "(허공에 새기며) 이 줄은 서명하신 분만 읽는 줄입니다. 저는 그저 새깁니다."}
temperaments: [엄격, 고지식, 침묵, 계산, 의심, 체념, 자존, 완고, 정직, 은밀, 다정, 앙심, 겁, 영리, 호기심, 집착]
camp_customs:       # 숙영지·왕도에만 있는 것 — 법·관습 본문은 fac_durgan.law/customs
  - "갱을 새로 열 때 망치로 벽을 세 번 두드려 조상의 허락을 구한다. 두드림 없이 파면 계약 위반이 아니라 '불경'이다"
  - "계약서는 쇠판에 새긴 원본이 계약의 돌 전당에, 사본이 광부 가슴 주머니에 있다. 사본을 잃으면 기간이 하루 늘어난다"
  - "인간 광부는 서명용 룬 몇 개만 읽을 수 있다. 소리 내어 읽지 않는 한 무해한 표식이다 — 읽기 연습은 법의 회색지대"
  - "만료일에 광부는 계약의 돌 전당에서 자기 계약서를 받아 직접 부순다. 두르강 증인 하나와 돌 법정 서기가 서 있다"
  - "굴뚝 숙영지의 굴뚝은 갱도 환기구다. 굴뚝 연기가 곧게 오르면 갱이 건강하고, 휘면 가스가 샌다는 뜻이다"
  - "깊은 문 쪽을 향해 망치질하지 않는다. 문 쪽 벽은 두드림 없이 파지도 않는다"
