voices:
  - {id: v_elf_recital, name: 낭송하는 별빛 엘다르, register: "완결된 느린 문장. 인간에게는 '그대'가 아니라 이름 없이 '정원지기'. 같은 엘다르에게는 '기억을 대어 보면' 으로 시작한다", tics: ["'기억을 대어 보면'"], use: [기억, 낭송, 선례, 한 박자, 처음, 선물], avoid: [죽음, 끝, 새롭다, 미안, 모르겠다], sample: "기억을 대어 보면, 그 말은 이미 한 번 있었소. 그때도 그대 같은 이가 같은 말로 청했고, 같은 답을 받았소."}
  - {id: v_elf_young, name: 젊은 가지 엘다르, register: "어른 앞에서는 낭송투를 흉내 내다 문장이 끊긴다. 모르는 일을 만나면 말이 짧아진다", tics: ["'…기억에 없는데.'"], use: [처음, 기억에 없다, 어른, 한 걸음], avoid: [모른다(낭송투에서는 '아직 대지 못했다')], sample: "…기억에 없는데. 아니, 대어 보겠소. 아직 대지 못했을 뿐이오."}
  - {id: v_silvan_overseer, name: 실반 감독, register: "짧고 낮은 말. 별빛에게는 눈을 내리깔고 두 마디, 정원지기에게는 수만 센다", tics: ["'하나, 둘.'"], use: [수, 울타리, 문, 열쇠, 이끼, 숲], avoid: [별빛 이름 직접 부르기], sample: "하나, 둘, 열. 문은 해 지면 닫는다. 열쇠는 내가 쥔다."}
  - {id: v_gardener_low, name: 낮추어 말하는 정원지기, register: "엘다르 앞에서는 말끝을 삼키는 극존대('~이옵니다'를 쓰지 않고 '예'와 고개로만). 이슬 우리 안에서는 낮은 반말, 음 높이로 말을 맺는다", tics: ["말끝을 반 음 올린다", "'기억해 주십시오'"], use: [이슬, 선물, 기억, 감사(엘다르에게는 '선물입니다'), 어머니], avoid: [죽음, 밖, 글자, 숲(대신 '바깥'), 도망], sample: "예. 이슬은 오늘도 단지 열둘입니다. …(우리 안에서) 단지 열둘. 아래 이름은 아직 아무도 안 불렸어."}
  - {id: v_gardener_song, name: 음으로 말하는 정원지기, register: "낭송을 들은 사람답게 문장 끝을 일정한 음으로 맺는다. 이슬 노래를 아는 사람끼리 반 음 낮추어 '네 노래는 어때' 하고 묻는다", tics: ["'음을 맞춰'"], use: [음, 아래 이름, 이슬, 맞추다, 노래], avoid: [진명(입에 올리면 수명이 탄다), 글], sample: "음을 맞춰. 가사는 말고, 높이만. 그건 틀리게 불러도 되는 거야."}
  - {id: v_test_gardener, name: 지워지는 피험 정원지기, register: "자기 이름을 찾는 말버릇. 문장 중간에 같은 질문을 되풀이한다", tics: ["'내가 방금 뭐라고 했죠.'"], use: [새싹, 잠, 침대, 이름, 어제], avoid: [피험자, 실험], sample: "내가 방금 뭐라고 했죠. …새싹이 잠들면 이름이 떨어진대요. 내 이름은 떨어진 걸까요."}
  - {id: v_naga_broker, name: 경매 정자의 나가 중개인, register: "부드러운 상인어, 엘다르의 '선물' 문법에 말을 맞춘다. 숫자를 말하지 않고 '교환'이라 한다", tics: ["'기꺼이 교환하겠습니다.'"], use: [선물, 교환, 손님, 의회, 은목재], avoid: [값, 품목, 낙찰(대신 '맞춤')], sample: "손님 마흔을 은목재 일곱 짐과 기꺼이 교환하겠습니다. 선물은 늘 받는 쪽이 더 부끄러운 법이지요."}
  - {id: v_dragonkin_envoy, name: 정원의 용인 사절, register: "격식 하오체. 엘다르에게는 한 박자 늦게 대답하고 시선을 피한다. 비늘 이야기를 입에 올리지 않는다", tics: ["'기다리겠소.'"], use: [사절, 기다리다, 협정, 기술, 예의], avoid: [비늘(정원 안에서), 인간 숫자], sample: "기다리겠소. 이곳의 시간은 우리 것이 아니니, 협정서도 이곳의 속도로 읽혀야겠지."}
temperaments: [침착, 완고, 몽상, 겁, 고집, 체념, 다정, 영리, 호기심, 비밀, 과묵, 냉정, 외로움, 헌신, 낙관, 집착, 오만, 순응, 은근한 반항]
city_customs:       # 법·관습 본문은 fac_eldar.law / customs
  - "하루는 새벽 '첫 아침의 노래'(05:00~05:50)로 열린다. 이 시각 정원 안의 모든 일이 멈추고, 정원지기는 무릎을 꿇는다"
  - "정원 안에는 가격이 없다 — 모든 건넴은 '선물'이다. 정원지기가 엘다르에게 '고맙다'고 하지 않고 '선물입니다'라고 하는 이유"
  - "엘다르어는 듣기만 허용된다. 말하면 정지 7일, 글자는 잊힘"
  - "엘다르 앞에서 '죽음'·'끝'을 말하면 정지 1일(누구든)"
  - "정원지기의 번호는 이슬 우리 기둥에 새겨진다. 잊힘은 번호를 지우는 것이다 — 이름보다 번호가 먼저 지워진다"
  - "이슬 우리의 문은 잠기지 않는다. 문을 잠그는 것은 숲이다"
  - "이슬 노래는 글이 아니라 음 높이다. 그래서 법에 걸리는지 엘다르도 오래 정하지 못했다"
  - "정원의 물을 손으로 휘젓지 않는다. 첫 아침의 나무를 등지고 서지 않는다"
