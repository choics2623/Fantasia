# 지역 생성 키트 — 엘다르 정원 (25_REGION_KITS.md). 실바렌 영원 정원, 은잎문, 루멘 감독관의 '후견인의 정원', 아르카스 객원 거처가 이것으로 태어난다.
# 원천: REGIONS §5 (실바렌), fac_eldar(관습·법·결정), fac_seril_silence, docs/world/people/silvaren.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_eldar.law / customs / ranks 를 본다. 여기에는 '정원에만 있는 재료'(시간이 느린 구역, 이슬 우리의 하루, 정원지기의 번호와 꽃 이름, 첫 아침의 노래)를 더한다.
# 정원지기(인간)의 일과·말투는 kit_human_serf 와 닮은 데가 하나도 없다 — 배고픔이 없고, 갇혀 있다. 그 반대 결을 여기서 새로 만든다.
id: kit_elf_garden
applies_to: [실바렌 영원 정원, 은잎문과 경매 정자, 흰 울타리(이슬 우리), 루멘 후견인의 정원, 아르카스 엘다르 객원 거처]
reuses: []
faction_refs: [fac_eldar, fac_seril_silence, fac_light, fac_ashen_tower, fac_seren]
time_zones:           # 시간이 느린 구역 — 정원 안에서도 결계의 농도가 다르다. 위치 엔진은 이것을 쓰지 않는다(분위기·판정용: 시간 감각, 의지)
  - {id: tz_first_tree, name: 첫 아침의 나무 둘레 80걸음, ratio: "바깥의 1/9", note: "뿌리에 앉아 있으면 한 시간이 아홉 시간 어치로 몸에 쌓이지 않는다 — 대신 나올 때 하루가 지나 있다. 여왕이 이 안에 산다"}
  - {id: tz_terraces, name: 테라스 41단 (위 20단), ratio: "바깥의 1/3", note: "엘다르 거처. 정원지기들은 이 단에서 일하고 나오면 '아직 오전'이라고 느낀다"}
  - {id: tz_dew_pens, name: 이슬 우리와 아래 테라스, ratio: "바깥과 같다(거의)", note: "정원지기가 하루를 세는 단 한 곳. 그래서 늙는 속도가 바깥의 2/3일 뿐이다 — 평균 수명 61세"}
  - {id: tz_dawn_lake, name: 첫 아침 호수, ratio: "멈춤", note: "물이 거울처럼 정지한다. 비추면 기억이 보인다"}
  - {id: tz_boundary, name: 정원 경계 (시간 단층), ratio: "한 걸음에 계절이 바뀜", note: "체질 판정. 수로 배수구로 나가는 순간 의지 판정"}
names:
  엘다르:
    # 별빛 엘다르: 이름 + 가지 이름. 가지는 새벽가지·고목·이슬지기·은이슬·빛실·별무게·금실·맑은잎·마지막빛(추방). 이름은 두세 음절, 'ㄹ'과 모음이 길다.
    male_starlight: [아에릭, 실바누스, 이살리온, 바렌딜, 에를란, 탈렌디르, 오르넨, 엘로리온, 카엘론, 세로윈, 이리엘, 테오리엘]
    female_starlight: [미리엘, 이실레아, 나엘리스, 이벨린, 피오나엘, 세레니엘, 모리엘, 아에린, 엘레스, 이렐리아, 라엘리스, 엘베리스]
    branch: [새벽가지, 고목, 이슬지기, 은이슬, 빛실, 별무게, 금실, 맑은잎, 마지막빛, 첫목소리, 흰그늘]
    epithet_rule: "이름 + 가지(미리엘 이슬지기). 같은 가지에 같은 이름이 두 명 있으면 '앞의 / 뒤의'를 붙이지 않고 기억을 한 줄 덧붙인다(탈렌디르 별무게 '호수를 마신')"
    age_rule: "별빛 엘다르는 약 500~3,600세. 나이 = 기억의 양이므로 의회 발언권과 직결된다. 44세 리안델이 최연소"
  실반:
    # 숲 엘프. 짧은 이름 + 몸에서 따온 별명(이끼손·마른가지·새벽발). 별빛에게는 하인, 정원지기에게는 감독. 600세 안팎, 아이가 연 3~5명 태어난다(숨겨진 사실).
    male: [페른, 헤니, 오스크, 뮈르, 탄, 리크, 바에]
    female: [세나, 이니, 올루, 베이, 뮈아, 다니]
    epithet: [이끼손, 마른가지, 새벽발, 물냄새, 돌귀, 가는눈]
  인간:
    # 정원지기. 성은 없다. 엘다르가 부르는 '정원 이름'(꽃·풀·이슬 이름)과 정원 번호(이슬 우리 동-호), 그리고 어머니가 지어 준 '아래 이름'(이슬 우리 안에서만 부른다)이 따로 있다.
    male_garden_name: [로렌, 데인, 이슬, 클로버, 쑥, 오리나무, 박하, 느릅, 보리, 담쟁이]
    female_garden_name: [이세, 미라, 로즈비타, 에이다, 수련, 버들, 아네모네, 제비꽃, 백리향, 라일락]
    under_name_rule: "이슬 우리 안에서는 엘다르가 붙인 꽃 이름 대신 어머니가 부르던 이름을 쓴다. 번호를 지우면(잊힘) 그 이름도 함께 지운다"
    number_rule: "정원 번호는 동·호·순번(14동 3호 9번). 경매 정자 대기 우리에서 처음 붙고, 이슬 우리 기둥에 새겨진다"
  나가:
    # 세렌 사절·경매 중개인. 상인어 이름 + 의회 번호.
    broker_rule: "중개인은 이름 + 의회 소속 번호 (시스라 일곱째표). 인간 정원지기 후보를 '품목'이라 부르지 않고 '손님'이라 부른다 — 엘다르가 '선물'이라 부르므로 말을 맞춰 준다"
  용인:
    garrison_rule: "멜리산드 측 사절 2명. 이름 + 소가문(카르벤 잿송곳). 정원 안에서는 비늘 모양 장식을 가리고 다닌다 — 엘다르가 비늘을 불쾌히 여긴다"
classes:            # 정원 인구 약 3만 (엘다르 24,600 + 정원지기 3,100 + 실반·기타). 정원 안 지역별 비율은 아래
  별빛 엘다르 (의회·가지): 0.60
  실반 (감독·사냥꾼·하인): 0.20
  정원지기 (인간, 계급 밖): 0.115
  기억지기 (가문 전문직): 0.04
  객원·사절: 0.005
  피험 정원지기 (영혼 정원): 0.005
