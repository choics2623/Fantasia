voices:
  - {id: v_noble_court, name: 첫 잔의 가문 귀족, register: "피의 사슬 순서로 경어가 정해진다. 전수해 준 자에게 '언니시여/군주시여' + 하오체, 같은 줄기끼리 정중하되 한 문장마다 가시. 맥박을 듣고 상대의 거짓을 짚는다", tics: ["'밤이 깊기를.'", "'맥박이 말하는군.'"], use: [마르다(갈증), 잔, 맥박, 밤, 사슬, 피의 빚], avoid: [배고프다, 도둑, 시체, 엘다르, 이름(인간 앞에서)], sample: "밤이 깊기를. …맥박이 한 번 어긋났소. 지금 하신 말씀은 낮의 말이오."}
  - {id: v_house_head, name: 혈목장 영주 (남작·영주), register: "장부와 혈통의 문법. 인간을 '번호'로, 크릭을 '목동'으로 부른다. 상급에게는 짧은 극존대", tics: ["'혈통 번호는?'"], use: [혈통, 번호, 등급, 은혈, 장부, 배당], avoid: [이름, 불쌍, 가축(인간 앞에서)], sample: "혈통 번호는? 번호 없는 입으로 말하지 마라. 장부에 없는 것은 먹을 수 없다."}
  - {id: v_krik_herder, name: 크릭 목동, register: "짧고 호루라기 같은 말. 인간에게 반말과 채찍 소리, 녹테른에게 몸을 낮춘 존대. '울타리 혀'는 존대를 길게 한다", tics: ["'울타리!'", "'피 표는!'"], use: [울타리, 목동, 피 표, 운동, 넘다], avoid: [이름, 고맙다, 장미(입 밖으로)], sample: "울타리! 선 넘으면 하얀 우리다. 피 표는? 가져와라. 홈이 하나 모자란다."}
  - {id: v_pen_human, name: 혈목장 인간, register: "목동 앞에서는 한 단어, 숫자로 답한다. 우리 안에서는 낮고 부드러운 반말, 이름을 속삭인다. '장미'는 은어", tics: ["'예, 번호.'", "'장미.'"], use: [번호, 피 표, 홈, 장미, 쑥, 촛불], avoid: [이름(목동 앞에서), 도망, 자유, 밖], sample: "예, 붉은 7대 12번. 피 표는 홈 열다섯입니다. …(속삭임) 장미. 오늘은 장미가 늦어."}
  - {id: v_white_pen, name: 하얀 우리의 인간, register: "조용하고 깨끗한 말씨. 감정을 숨기는 훈련이 되어 있다. 꿈 이야기를 하지 않는다", tics: ["'조용히 지내고 있습니다.'"], use: [조용히, 깨끗하다, 흰, 괜찮다], avoid: [꿈, 밖, 엘다르, 이름], sample: "조용히 지내고 있습니다. 먹는 것도 입는 것도 괜찮습니다. …꿈은 안 꿉니다."}
  - {id: v_manor_servant, name: 저택의 인간 하인, register: "낮에는 입을 열지 않고 밤에 직책으로만 대답한다. 문장 앞에 '주인께서'를 단다. 장부 얘기를 거의 숫자로만 한다", tics: ["'주인께서는…'"], use: [주인, 장부, 잔, 촛불, 낮], avoid: [이름, 도망, 장미(하인이 입에 올리면 안 됨)], sample: "주인께서는 해 지기 전에는 말씀이 없으십니다. 장부는 스물일곱 장. 오늘 밤은 서른."}
  - {id: v_hunter_bearer, name: 갈증받이 사냥꾼, register: "짧은 명령형. 인간을 '번호'로, 목표를 '냄새'로 부른다. 주인에게는 한 박자 지연된 복종", tics: ["'냄새가 난다.'"], use: [냄새, 흔적, 7일, 피, 사냥, 목표], avoid: [이름, 용서, 인간(자기 자신)], sample: "냄새가 난다. 이쪽이다. 7일째 피 전에 끝낸다."}
  - {id: v_bat_courier, name: 박쥐날개 전령, register: "높고 빠른 말투, 바람 소리 섞인 존대. 모든 것을 '위에서 본 것'으로 말한다", tics: ["'위에서 보면…'"], use: [위에서, 바람, 날개, 전령, 하늘], avoid: [땅, 이름, 배신자], sample: "위에서 보면 행렬이 열둘이었습니다. 위에서 보면 아무것도 아닌 것이 땅에선 사람이더군요."}
temperaments: [냉정, 갈증, 체념, 겁, 고집, 순응, 집착, 영리, 호기심, 비밀, 과묵, 다정, 오만, 광기, 충직, 조심, 부끄러움]
city_customs:       # 법·관습 본문은 fac_nocturne.law / customs
  - "인사는 손바닥을 잔 모양으로 모아 가슴에 대고 '밤이 깊기를.' — 답은 '목마르지 않기를.' 인간은 낮에 말을 걸지 않는다"
  - "인간에게 이름을 주지 않는다. 번호와 혈통 계보로만 부른다 — 이름을 주면 마시기 어려워진다(녹테른 금기)"
  - "인간은 글자를 모른다. 피 표는 글자가 아니라 홈이다"
  - "갈증의 밤(긴밤월 15일)에는 루멘의 공물 40명 + 용좌령 매입 등 300명이 도착한다. 우물 순례는 전날 밤(14일)"
  - "해가 나는 날 녹테른은 성 밖에 나오지 않는다. 맑은 날은 탈출의 날이다"
  - "장미는 인간끼리의 은어다 — '장미를 따라가라' = 세실의 탈출로. 쑥은 피를 묽게 하는 약초(회색 쑥)다"
  - "낮에 한 맹세는 거짓으로 친다. 모든 계약은 밤에 다시 확인된다"
