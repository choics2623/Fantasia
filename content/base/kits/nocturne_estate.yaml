# 지역 생성 키트 — 녹테른 저택·혈목장 (25_REGION_KITS.md). 첫 갈증 성, 그림자장미 저택, 일곱 우리(붉은·하얀·장미·검은성배·흑수정·침묵종·고요물), 밤 부두가 이것으로 태어난다.
# 원천: REGIONS §7 (녹테른 밤의 영지), fac_nocturne(관습·법·위계), fac_scale_council 참조, docs/world/people/nocturne.md.
# 관습·법·말투의 결은 다시 쓰지 않는다 → fac_nocturne.law / customs / ranks 를 본다. 여기에는 '녹테른 영지에만 있는 재료'(밤의 일과, 피 표, 번호와 혈통 계보, 크릭 목동의 울타리, 갈증의 밤, 맑은 날)를 더한다.
# 인간은 이곳에서 굶지 않는다 — 굶주림이 없다는 것이 이 키트의 공포다. 일과는 해 뜰 때 시작하고 녹테른은 해 지고 일어난다. 두 일과가 해 질 녘 한 시간 겹친다.
id: kit_nocturne_estate
applies_to: [녹테른 밤의 영지, 첫 갈증 성(흑성 아르네스), 혈목장 일곱 우리, 그림자장미 저택, 세렌 밤 부두, 공물 길]
reuses: []
faction_refs: [fac_nocturne, fac_nameless, fac_swamp_hags, fac_light, fac_scale_council, fac_eldar]
day_rules:
  - {id: dr_sun, rule: "해가 나는 날 녹테른은 성 밖으로 나오지 않는다 — 맑은 날은 탈출의 날(순찰 없음, 크릭 목동만). 연 흐림 280일"}
  - {id: dr_dusk, rule: "해 질 녘 한 시간(18:00~19:00)은 인간이 우리로 돌아오고 녹테른이 깨어나는 겹침. 이 시각 우리 입구에 목동이 선다"}
  - {id: dr_bleed, rule: "채혈은 밤. 주 1회 순번(붉은 우리는 10일에 1회, 문서마다 6주에 1회). 피 표(나무패)로 횟수를 센다"}
  - {id: dr_thirst_night, rule: "긴밤월 15일 갈증의 밤 — 모든 녹테른이 깨어 있고 경비 최고. 인간은 우리 안에서 촛불을 끄고 숨을 죽인다"}
names:
  녹테른:
    # 가문 이름 + 가문 별칭(붉은달, 핏빛유리, 그림자장미, 검은성배, 재의 잔, 흑수정, 침묵종, 고요물). 엘다르의 이름 소리가 남아 있으나 'ㄹ' 받침과 모음이 짧게 닫힌다. 엘다르였음을 상기시키는 말은 금기다.
    male: [모르데카이, 알라리크, 카르논, 카시미르, 발타사르, 사일라스, 마렌디스, 마르시우스, 아드리엘, 세오도르, 에두아르트, 라자르]
    female: [세실, 엘로이즈, 바실리사, 이세르다, 오렐리아, 알렉시아, 카트린, 이졸레, 미네르바]
    house_epithets: [붉은달, 핏빛유리, 그림자장미, 검은성배, 재의 잔, 흑수정, 침묵종, 고요물, 붉은잔, 열한째밤]
    epithet_rule: "이름 + 가문 별칭(카시미르 재의 잔). 갈증 칭호('열한째밤', '붉은잔')는 굶주림에서 돌아온 자나 첫 잔의 원로만 쓴다. 인간 앞에서 이름은 밝히지 않고 직위로 불린다"
    age_rule: "녹테른은 수명이 길고(1,000~3,500세) 갈증이 지나치면 나이보다 몸이 먼저 무너진다. 30일 굶주리면 이성이 흐려지고 90일이면 짐승이 된다"
  인간:
    # 혈목장 인간에게는 이름이 없다. 번호와 혈통 계보('붉은 혈통 7대 12번')로만 불린다. 이름은 인간끼리 속삭이는 것이 전부이며 이름을 주면 마시기 어려워진다(녹테른 금기).
    number_rule: "혈통 계보(색) + 대수 + 번호 (붉은 혈통 7대 12번, C-17은 검은성배 17번). 하얀 우리는 흰 혈통 + 열두 번째 아이 같은 서수"
    whisper_name_male: [하인, 얀, 벤, 루드, 에곤, 팀, 니클, 이르, 오토, 칼]
    whisper_name_female: [그레타, 마리안, 헤트, 우르술라, 로자, 안나, 클라라, 일제, 베아, 리나]
    blood_ticket_rule: "피 표(나무패)는 채혈 횟수의 기록이다. 많을수록 서열이 높고 특식을 받는다. 글자가 아니라 홈의 수라 글자 금지에 걸리지 않는다"
    nickname_rule: "인간끼리는 몸의 특징·일·꿈 이야기로 별명을 만든다 (흉터목, 쑥 노파, 열둘째). 진짜 이름은 우리 안에서도 속삭임으로만"
    servant_rule: "저택·성의 인간 하인은 이름 대신 일(집사·시종)로 불리고 가문 이름이 아닌 저택 이름을 쓴다 (장미 저택의 오르페)"
  크릭:
    # 목동·하인. 이름은 짧고 소리 나며 하는 일이 붙는다. 울타리 혀(목동장), 열쇠꾼, 울타리 지기, 정원지기.
    male: [즈라그, 핍스, 칙, 딱, 쥐, 삑, 소크, 드릭, 쿠즈, 틱]
    female: [미크, 핍, 니아, 소프, 제카, 치르]
    epithet: [울타리 혀, 열쇠꾼, 나무패 지기, 빗물, 쑥 곁, 횃불, 끈, 딱지]
  아에리:
    # 박쥐날개 아에리. 전령·공중 감시. 이름은 바람 소리를 닮는다.
    male: [베스퍼, 노크티스, 바일, 세로]
    female: [타일라, 녹타, 에오라]
    epithet: [밤날개, 천장지기, 매달린]
classes:            # 영지 인구 (REGIONS §7.4): 녹테른 약 1,100 · 크릭 약 2,500 · 인간 약 25,000
