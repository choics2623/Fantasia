# 시작 신분 — 셋째의 다섯 갈래 (SCENARIOS §1.0 "다른 갈래의 셋째", 2026-10 결정: 첫 시대에도 고른다)
# 잔향은 한 시대에 단 한 사람에게 깃든다. 첫 시대의 그 사람은 언제나 게르다의 셋째 — 진짜 이름, 어머니, 열 살 동생 키트는 어느 갈래에서나 같다.
# 갈래가 바꾸는 것: 열일곱 해를 어디서 어떻게 살았나 — 저녁 6시의 자리(회귀점), 잠자리, 몸과 손, 아는 사람과 아는 것, 낮의 의무.
# 회귀하면 같은 갈래, 같은 저녁, 같은 자리로 돌아온다.
#
#   stats: 인간 기본 9에서 이 삶이 남긴 것 (생성 화면에서 자유 4점을 더한다)
#   skills: 엔진의 아홉 스킬 · status: 배고픔 0~4, 아픔·지침·마음의 짐 0~100, 두려움 0~5
#   items: 경제 물건 id(gid) 또는 그 자리에서 정의한 물건 · rel: npc → [호감, 신뢰]
#   knows: 처음부터 아는 사실 · places: 처음부터 아는 숨은 곳 · vars: 세계 변수 · wanted: 처음부터의 수배
#   duty.rollcall: 새벽 다섯 시 채찍 기둥 광장 점호 (감독관이 센다)
#   duty.meal: ration(수탉의 저녁 배급) 또는 {at, from, to, label, hunger, thin(묽을 확률), with(있어야 하는 사람), text}
#   duty.work: 낮일 {at, label, done, fail, train(단련), pain(일의 아픔), fail_pain·fail_meal·fail_fear(못 채웠을 때), story(첫날 대본 장면), food(성공하면 얻는 물건), outlaw(탈주 노예도)}
#   duty.count: 저녁 점고 {time, at[], by, miss} — 성채 하인
#   access: 이 갈래에게는 드나들 수 있는 곳 (몰래 들 필요가 없다)
#   opening: 회귀점의 대본 장면 · sense: 돌아올 때 맡는 냄새 (죽음의 화면 끝) · prompt: 서술자에게 주는 주인공 줄
