    map: {knowledge: {ember_mines: 3, ember_gate: 2, red_road: 2, silver_cradle: 1, baalkar: 1}, sketch: [ember_gate, red_road]}
    world: "주인공이 매인 곳은 잿불 언덕 — 용황의 차녀 멜리산드 은비늘의 광산 영지, 잿불 본갱의 인간 광산 노예 굴 마을 '숯막'."
    people: "주인공은 숯막에서 나고 자랐다 — 갱의 사람은 번호와 이름으로 안다. 크릭 감독과 용인은 광부를 번호로만 부른다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"하로 — 갱조 반장, 손목에 매듭끈을 감은 노인 — 가\"). 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'숯막'은 슬래그 비탈에 판 광산 노예 굴 마을의 이름이다(숯 굽는 막이 아니다). '붉은 목구멍'은 광부들이 제1수직갱을 부르는 말이다. '하층 공방'은 광부들이 은비늘 요람(용심 이식 실험장)을 부르는 말이다. '흑점'은 할당을 못 채운 날 점호 마당 번호판에 찍히는 숯 점 — 넷이면 공급 명단이다."
    prompt: "주인공: 이백열둘이라 불리는 열아홉 살 인간 광산 노예 (진짜 이름은 단짝 에디크만 소리 내어 부른다). 잿불 본갱 숯막 검은 교대 구역의 굴에서 자고, 하로의 갱조에서 중층 4번 막장을 판다 — 넓은 어깨, 갈라진 손, 발목에 노예 쇠고리 자국. 허리춤 안쪽에 죽은 어미의 다라의 매듭끈, 소매에 흑요석 조각. 번호판에 할당 미달의 숯 점(흑점)이 쌓인다 — 넷이면 하층 공방이다."
    awakening: "다만 무너진 갱도에서 에디크의 손을 보는 순간 다른 손이 겹쳐 보였다 — 이백열두 해 전 이 매듭을 처음 묶던 여자의 손. 배운 적 없는 매듭이 읽히고, 허리춤의 끈이 뜨겁다."
    exclude: []
    perks: ["힘과 몸 — 싸움이 처음부터 쓸 만하고, 막장이 몸을 단련해 두었다", "하로의 갱조 서른이 너를 안다 — 이름을 부르는 사람들", "다라의 매듭끈 — 글이 아닌 기록, 배운 적 없는 매듭이 읽힌다"]
    burdens: ["흑점 셋 — 하나 더면 하층 공방(은비늘 요람)", "새벽 점호와 열두 시간의 막장 — 낮이 땅 밑에 매여 있다", "말과 글에 서툴다 — 크릭과 용인은 너를 번호로 부른다"]
    presets:
      - {name: 갱의 짐승, talents: {command: 2, engineer: 2, beast_friend: 1, iron_gut: 1, famine: 1}, stats: {근력: 2, 체질: 2}}
      - {name: 돌의 사람, traits: [durgan_heart], talents: {smith: 2, iron_gut: 1, strong_bones: 1}, stats: {근력: 2, 의지: 2}}
