    epilogue:
      - {when: ["var o2_edik_dead == true"], text: "에디크는 낙엽월 첫날 서쪽 갱도에 묻혔다. 하로의 끈에서 그의 매듭은 마흔둘째였다. 이름은 하로가 외웠다."}
      - {when: ["var o2_edik_taken == true"], text: "에디크의 번호는 하층 공방에서 올라오지 않았다. 아드리안의 기록부에 그 번호 옆으로 생존 일수가 적혔다. 이름은 적히지 않았다."}
      - {when: ["var o2_edik_out == true"], text: "슬래그 비탈 아래 어딘가에서 다리를 저는 사내가 하늘을 보며 일했다. 장부에는 열병으로 죽었다고 적혀 있었다."}
      - {when: ["var o2_edik_dead != true", "var o2_edik_taken != true", "var o2_edik_out != true"], text: "에디크는 다리를 절며 갱으로 내려갔다. 교대 종 직전이면 서쪽 갱도 끝에서 누군가의 이름을 불렀다. 대답하는 사람이 없어도."}
      - {when: ["var o2_vessel == true"], text: "하층에서 올라온 광부의 이야기는 숯막에서 숯막으로 건너갔다. 은비늘의 사람들은 그 겨울 내내 굴 문을 열었다. 그릇은 하나라고, 그녀는 기록했다."}
      - {when: ["var em_signs >= 6"], text: "그해 겨울, 9번 갱 막장의 손바닥 자국이 늘었다. 셋꼬리 닛은 첫 갱 앞에 물을 두 그릇 놓았다."}
      - {when: ["var em_signs < 6"], text: "잿불 언덕의 광부들은 그 뒤로도 교대 종 직전에 천장 소리를 들었다. 아무도 먼저 외치지 않았다."}
    texts:
      count_before_sleep: |
        숯막의 굴. 슬래그 비탈에 판 구멍 하나, 짚 한 단. 발목의 쇠고리 자국이 바닥 돌에 닿는다. 멀리서 권양탑의 쇠줄이 운다.

        잠들기 전, 너는 센다.
      wanted_hook: "감독 초소의 등잔이 늦게까지 꺼지지 않는다. 번호판 앞에서 크릭 둘이 네 번호를 손가락으로 짚는다."
