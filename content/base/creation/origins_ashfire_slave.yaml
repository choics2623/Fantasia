# 잿불 광산 노예 (SCENARIOS O-02 `origin.ashfire_slave`) — 첫 시대부터 고를 수 있는 출신 (2026-10 결정).
# 이 사람이 그 시대의 잔향자다. 회귀점: AS 312 낙엽월 1일 17:40, 잿불 본갱 중층 4번 막장 — 교대 종 직전, 천장이 숨을 쉬는 순간.
# 필드의 뜻은 creation/origins.yaml 머리말. 장면은 storylets/origin_ashfire_slave.yaml, 사람은 npcs/extra_ashfire_slave.yaml.
#
# SCENARIOS → 지역 자료 (지역 자료가 이긴다 — settlements/ember_mines.yaml · npcs/cards/emberhills · routines/ember_hills.yaml)
#   '붉은 목구멍' 지하 4층       → 본갱 중층 수평갱 4번 막장 (em_lvl_mid, 깊이 250m — 하로의 갱조 서른이 파는 막장). 갱에 '4층'은 없다.
#                                 '붉은 목구멍'은 광부들이 제1수직갱(em_main_shaft)을 부르는 말로 남겼다 (nouns).
#                                 요람의 '그릇의 방(지하 4층)'은 정착지 자료 그대로 — 갱에는 없는 층이라고 장면이 말한다.
#   18시 교대 직전              → 17:40. 검은 교대(06~18시)는 17:30 올림 종에 바구니로 오르고, 하로의 갱조는 늘 마지막 바구니다 — 18시 붉은 교대 입갱 종 직전.
#   크릭 감독 스크릿            → 그락스 (npc_grax) — 붉은 계단 총감독관. 평일 중층을 돌며 할당량을 보고, 점호 뒤 공급 명단을 고른다.
#   갱 반장 하로 (54, 매듭끈)    → 하로 (npc_haro) — 30명 갱조 반장, 중층 4번 막장. 신뢰 40.
#   단짝 에디크 (20)            → 새 사람 npc_o2_edik (B등급). 이 갱에서 주인공의 진짜 이름을 소리 내어 부르는 유일한 사람.
#   용인 의사 실렌 바스크        → 아드리안 코르벨 (npc_adrian_corvel) — 은비늘 요람 수석 시술의, '아직 번호가 없으시네요'.
#   하층 공방                   → 은비늘 요람 (em_cradle — 대기 감방 em_cradle_ward, 그릇의 방 em_cradle_vessel). 광부들의 말이 '하층 공방'.
#   흑점 셋, 넷이면 하층 공방    → 세계 변수 o2_black_marks (시작 3). 낮일 실패(fail_var)·새벽 점호 결석(miss_effects)·장면마다 +1.
#                                 넷이면 새벽 점호에서 그락스의 공급 명단(o2_lower_call) → 그날 밤 쇠눈 크롬(o2_cradle_take) → 감방 → 이식대.
#   "용인 의사가 번호 셋을 불렀다" → 그락스의 주간 공급 명단 (fact_eh_grax_supply_list).
#   ashfire.suspicion           → 봉기 조짐 em_signs (agendas/ember_hills.yaml) — 넷이 넘으면 셋꼬리 닛의 코(em_nit_nose)가 온다.
#   flag.ashfire_first_solidarity → o2_solidarity · haro.suspects_returner → o2_haro_watching · memory.dara_hands → fact_o2_dara_hands
#   hunt.melisande              → o2_cradle_escaped / o2_vessel — 요람에서 빠진 번호를 쇠눈 크롬이 찾는다 (o2_krom_hunt).
#   다라의 노래                 → 다라의 매듭끈에 엮인 노래 (로크 갱반의 '다라의 노래'). 마테의 「붉은 길」과는 다른 노래로 두었다.
#   흑요석 조각                 → 변수 o2_shard (소매 속). 장면이 물건을 빼앗는 효과가 엔진에 없어 소지품으로 두지 않았다.
#   두르강 행상인(검은 할당) · 붉은 길의 돌무덤 → 이번에는 쓰지 않았다 (첫 열흘 밖).
#   요람 감방 14번의 한나는 다른 피험자다 — 그 사람의 별칭은 이 출신의 이름·번호·굴에 쓰지 않는다 (장면에서도 '저쪽 벽 언니'로 부른다).
# 기존 장면과의 이음: 9번 갱 손바닥 벽(em_handprint)은 둘째 날 아침에 열린다 — 하로가 첫 밤에 "칼렙이 벽 앞에서 손을 보자더라"고 미리 말한다.
#   셋꼬리 닛의 코(em_nit_nose)는 이 출신의 노래·갱조의 연대가 쌓은 조짐(em_signs)으로 온다.
