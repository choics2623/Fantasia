        when: ["var o3_transfer_due == true"]
        states:
          - {when: ["var o3_escaped == true"], what: 아래 문을 지났다 — 정원에서는 사라진 번호}
          - {what: 네 번호가 '이송' 칸에 있다 — 저녁 점호에서 실반이 쪽지를 읽는다}
      - who: 미라
        when: ["pknows fact_sv_mira_fifth_ritual"]
        states:
          - {what: 피험자 정자 — 다섯 번째 옮김 의식, until: "312-10-09 09:00"}
    losses:
      - {id: o3_nina_forgot, when: ["var o3_nina_lost == true"], text: "니나가 네 아래 이름을 잊었다. 그 이름을 아는 사람이 이 정원에 하나도 없다.", weight: 6}
    achievements:
      - {id: nina_remembers, tp: 2, text: 니나가 네 아래 이름을 쥔 채 안쪽 정원에서 돌아왔다, when: ["var o3_nina_kept == true", "date >= 312-09-05"]}
