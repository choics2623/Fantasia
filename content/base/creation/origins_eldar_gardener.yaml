    scenario: O-03
    region: 실바렌
    name: 엘다르 정원지기
    title: 은방울 뜰의 정원지기
    call: 방울
    age: 18
    difficulty: 3
    family: false
    settlement: eternal_garden
    time: "06:00"
    place: 영원 정원, 첫 아침의 나무 아래 — 새벽 노래가 끝난 자리
    start: eg_first_tree
    home: eg_dew_pens
    blurb: >-
      여섯 살에 은잎문 경매에서 금화 백마흔 닢에 팔려 와 엘다르의 정원에서 자랐다. 흰 빵과 꿀 — 대륙에서 가장 좋은 배급,
      그리고 듣기만 허락된 노래. 발목의 금방울이 걸을 때마다 네가 어디 있는지 알린다. 회귀점은 첫 아침의 노래가 끝난 자리,
      정원사가 네 옆의 니나를 부른다.
    stats: {근력: 8, 민첩: 10, 체질: 9, 지능: 10, 감각: 12, 의지: 11}
    skills: {화술: 24, 기만: 14, 위압: 4, 통찰: 22, 손재주: 22, 은신: 12, 싸움: 6, 읽고쓰기: 0, 용언: 0}
    status: {hunger: 0, pain: 0, fatigue: 15, fear: 0, stress: 25}
    train: 4
    coin: 0
    items:
      - {id: o3_gold_bell, name: 금방울 발찌, tags: [신분, 위치알림], slot: 발, quality: 좋음, condition: 100, illegal: false, value: 0, desc: "왼쪽 발목의 금방울. 걸을 때마다 운다 — 엘다르는 인간을 보기 전에 듣고 싶어 한다. 고리는 은못으로 박혀 있다. 여섯 살의 너는 그 소리가 좋아서 발을 굴렀다. 그래서 방울이다"}
      - {id: o3_shears, name: 은 전지가위, tags: [도구, 날붙이], slot: 허리, quality: 좋음, condition: 90, illegal: false, value: 0, desc: "정원의 것이다. 은목 가지는 이 가위가 아니면 상처가 아물지 않는다고 한다"}
      - {id: o3_robe, name: 은실 정원복, tags: [의복, 정원지기복, 눈에띔], slot: 몸, quality: 좋음, condition: 90, illegal: false, value: 0, desc: "가장자리를 은실로 두른 흰 옷. 정원 밖에서는 백 걸음 밖에서도 보인다. 소매 단 안쪽에 말린 기억꽃 한 송이를 꿰매 숨겼다"}
    rel: {npc_o3_nina: [70, 60], npc_loren: [10, 30], npc_ada: [25, 20], npc_wren: [15, 10], npc_dane: [5, 10], npc_erlan: [0, -5], npc_fern: [0, 5]}
    knows: [fact_o3_bells, fact_o3_inner_garden, fact_o3_offbeat_rule]
    places: []
    vars: {o3_offbeat: 0, o3_stops: 0, o3_flower: 1, o3_elvish: 25}
    wanted: null
    flaws: []
    traits: []
    free: false
    access: {eg_terraces_upper: serf}      # 은방울 뜰은 낮의 일터다 — 밤의 테라스 위 단은 통금 순찰(정지)이 지킨다
    duty:
      rollcall: {at: eg_first_tree, time: "05:00", by: npc_miriel, frisk: false, miss: "첫 아침의 노래에 무릎 꿇는 자리 하나가 비었다. 관리장 미리엘이 번호를 부르다 반 박자를 쉰다 — 장부에 한 줄. 어긋남이다.", miss_effects: ["var o3_offbeat += 1"], wake_text: "등 끄기 종 이후 처음 울리는 것은 종이 아니라 노래다. 이슬 우리의 문이 열리고, 정원지기들이 첫 아침의 나무 아래로 줄지어 오른다 — 방울 소리가 앞뒤로 흔들린다"}
      meal: {at: eg_dew_mess, from: "18:30", to: "20:30", label: 공동 식당에서 저녁을 받는다 — 흰 빵과 꿀, hunger: -2, text: "흰 빵, 꿀, 우유 한 사발. 대륙 어디에도 없는 배급이다. 아무도 맛있다고 말하지 않는다 — 말하면 무언가를 갚아야 할 것 같아서"}
      work:
