# O-03 엘다르 정원지기 (docs/world/SCENARIOS.md O-03) — 첫 시대에도 고를 수 있는 출신. 고른 사람이 그 시대의 잔향자이고,
# 낙엽월 1일 06:00 첫 아침의 노래가 끝난 자리가 회귀점이다. 필드의 뜻은 origins.yaml 머리말.
#
# ── SCENARIOS → 정원 데이터 (정본 우선: 카드·정착지·사실이 SCENARIOS를 이긴다) ──
#   세르빌 은잎 (주인, 존속파, 아에린의 수하)  → npc_aerin 아에린 새벽가지 — 존속파 수장이 직접 '새싹'을 고른다. 정원지기는 정원의 것이지
#                                               엘다르 개인의 것이 아니라서 '주인'이 없다 (번호는 관리장 미리엘의 장부). 소유욕 = 화초를 보는 다정함
#   (니나를 데려가며 낮게 말하는 엘다르)       → npc_fionael 피오나엘 — 영혼 정원 연구자, 새벽가지 태생. 은 수반으로 무게를 잰다
#   니나 (19, 같은 화단)                      → 새 사람 npc_o3_nina (npcs/extra_eldar_gardener.yaml) — 정원 데이터에 없다. 주인공의 아래 이름을 아는 단 한 사람
#   바로 (70, 늙은 정원지기, 세 손가락)        → 둘로 나눔: npc_loren 로렌 반장 ('돌아온 아이들은 노래를 잊었다' — 그는 사람을 음으로 센다)
#                                               + npc_ada 에이다 할멈 ('아래 문' — 41단 수로를 아는 어른 셋 가운데 하나). 세 손가락은 근거가 없어 뺐다
#   에스텔 서리이슬 (순혈파, 인간 혐오, 방울 두 개 벌) → 정원의 순혈파(실바누스)는 인간을 '짧은 것'이라 부르며 미워하지 않는다 — 카드와 어긋나 쓰지 않는다.
#                                               붙잡고 벌주는 몫은 npc_erlan 에를란(정지를 거는 수호자), '오염된 정원지기를 내보내는' 몫은
#                                               npc_miriel 미리엘의 서명 없는 '이송' 장부. 벌은 방울 두 개가 아니라 정본의 '정지'
#   실반 감독 (18:00 점호)                    → npc_fern '이끼손' 페른 (엔진의 저녁 점고는 18:30 — 낮일이 18:00에 끝나기 때문)
#   '은방울 뜰'(셋째 테라스)                   → eg_terraces_upper의 셋째 단 화단 (낮에만 올라간다). 새벽 노래는 정본대로 첫 아침의 나무 뿌리 아래 무릎 꿇는 자리 (eg_first_tree)
#   '안쪽 정원'                              → 영혼 정원 (outer soul_garden*) — 안개 계곡의 유리 온실들. 지도로는 17시간, 엘다르 곁에서는 접힌 길(fact_o3_fold_path)
#   엘다르어 (듣기 전용 25)                    → 엔진에 스킬이 없다: 세계 변수 o3_elvish + 사실(fact_o3_first_verse 등) + 프롬프트. 장면 글은 반쯤 알아들은 대로 쓴다
#   말린 기억꽃 [약초, 소모품]                 → 물건이 아니라 변수 o3_flower (엔진에 물건을 빼는 효과가 없어서 — 쓰면 0). 금방울 발찌는 진짜 물건(태그 신분·위치알림)
origins:
  - id: eldar_gardener
