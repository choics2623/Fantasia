        states:
          - {when: ["var o3_nina_lost == true"], what: 돌아왔다 — 네 아래 이름을 잊었다. 다른 것은 다 기억한다}
          - {when: ["var o3_nina_kept == true", "var o3_nina_back == true"], what: 돌아왔다 — 네 아래 이름을 아직 안다}
          - {when: ["var o3_nina_kept == true", "date >= 312-09-05"], what: 돌아왔다 — 네 아래 이름을 아직 안다}
          - {when: ["var o3_nina_kept == true"], what: 안쪽 정원에 있다 — 무게를 재는 날에도 네 이름을 쥐고 있을 것이다, until: "312-09-04 17:00"}
          - {when: ["date >= 312-09-05"], what: 이슬 우리로 돌아왔다 — 무엇을 두고 왔는지는 그녀를 봐야 안다}
          - {what: 안쪽 정원에 있다 — 무게를 재는 날까지, until: "312-09-04 09:00"}
      - who: 네 무게
        when: ["var o3_measure_me == true"]
        states:
          - {when: ["var o3_carrier_known == true"], what: 바늘이 네 앞에서 움직였다 — 정원사가 너를 안다}
          - {when: ["var o3_weightless == true"], what: 무게 없음 — 기억꽃이 바늘을 흐렸다}
          - {when: ["var o3_aerin_shaken == true"], what: 정원사가 바늘을 보지 않았다 — 노래의 다음 구절 때문에}
          - {when: ["date >= 312-09-05"], what: 무게를 재는 날이 지나갔다}
          - {what: 무게를 재는 날 — 네가 먼저 선다, until: "312-09-04 08:00"}
