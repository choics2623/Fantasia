        until: "09:00"
        label: 은방울 뜰로 올라간다 (해 질 때까지)
        done: "은목 가지를 닦고 화단의 이슬을 거뒀다. 방울이 하루 종일 네가 어디 있는지 알렸다 — 아무도 돌아보지 않았다. 그게 잘한 날이다"
        fail: "가지 하나를 잘못 쳤다. 창가의 엘다르가 손가락 하나를 들었다 — 어긋남. 오늘 저녁 식당의 몫은 없다"
        train: 0.2
        pain: 0
        fail_pain: 0
        fail_meal: true
        fail_var: o3_offbeat
      count: {time: "18:30", at: [eg_dew_pens, eg_dew_mess, eg_dew_hearth, eg_dew_bath], by: npc_fern, miss: "저녁 점호에 없었다. 흰 울타리의 실반이 머릿수를 두 번 센다 — 그래도 하나가 모자란다. 어긋남이다.", reason: 저녁 점호에 빠진 정원지기, miss_effects: ["var o3_offbeat += 1"]}
      safe: [eg_dew_pens]
      curfew: {caught: "흰 등 하나가 다가온다. 수호자의 손가락 하나가 올라간다 — \"움직임이 어긋났소.\" 차가운 손바닥이 이마에 닿고, 세상이 멎는다. 풀려났을 때 너는 이슬 우리 문턱에 앉아 있다. 밤이 한참 지나 있다.", fugitive: "흰 등이 얼굴에 멈춘다. 수호자의 손가락이 올라간다. 이번에는 어긋남이 아니다 — 은잎문 아치 앞에서 낭송될 이름이다.", fugitive_why: "통금 순찰에 붙잡혔다 — 달아난 정원지기로, 잊힘을 기다린다", pain: 5, effects: ["var o3_offbeat += 1"], patrols: ["22:00", "02:00"], D: 6}
      desert: "허락 없이 흰 울타리를 넘으면 숲이 죽인다 — 정원 길은 엘다르 동행 없이는 이어지지 않는다"
      routine: 새벽 노래 → 은방울 뜰 → 저녁 점호
    opening: o3_dawn_open
    sense: 은목 이슬 냄새
    rescue: "눈앞이 하얘진다. 누군가 너를 이슬 우리 침상으로 끌어다 눕힌다. 입에 꿀물이 흘러든다 — 에이다 할멈의 국자다."
    quiet:
      - "등 끄기 종. 이슬 우리의 흰 등이 하나씩 꺼진다. 은목은 밤에도 희미하게 빛난다 — 그래서 여기의 어둠은 얕다."
      - "목욕 연못 쪽에서 웃음소리가 났다가 그친다. 정원지기가 소리 내어 웃는 시각은 하루에 한 번이다."
      - "식당 아궁이 곁에서 누군가 아주 낮게 음 하나를 맞춘다. 마지막 음 앞에서 숨이 멎는다. 아무도 마저 부르지 않는다."
      - "발목의 방울을 손바닥으로 감싸고 눕는다. 자는 동안에는 울지 않게."
    beats:
