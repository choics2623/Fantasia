    world: "주인공이 매인 곳은 실바렌의 영원 정원 — 엘다르의 마지막 도시. 인간 정원지기 삼천이 흰 석조 숙소 '이슬 우리'에 살고, 흰 울타리 안에서 아침저녁 수로 세어진다. 정원 안은 늘 늦봄이고, 이슬은 늘 같은 잎에 맺힌다. 비는 시간의 경계를 넘지 못한다 — 장면 자료가 '비'라고 하면 그것은 경계 밖의 비다(안개 길과 은목 숲, 영혼 정원의 유리 지붕 위에는 내린다)."
    people: "주인공은 이슬 우리에서 자랐다 — 정원지기끼리는 정원 이름으로 부르고, 엘다르는 정원지기를 번호로 부른다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"로렌 — 이슬 우리 반장, 노래 마지막 음 앞에서 숨을 멈추는 사내 — 이\"). 이름을 모르는 엘다르는 겉모습으로만 부른다."
    nouns: "'이슬 우리'는 정원지기 숙소(흰 석조 30동)다 — 짐승 우리가 아니다. '정지'는 수호자의 시간 마법 — 몸이 멎고 의식은 깨어 있는 벌이다. '아래 이름'은 어머니가 지어 준 진짜 이름으로, 정원지기는 한 사람에게만 준다. '안쪽 정원'(어른들은 '아픈 곳')은 영혼 정원 — 안개 계곡의 유리 온실들이다. '은방울 뜰'은 테라스 위 셋째 단의 화단이다. '정원사'는 존속파 엘다르 아에린을 정원지기들이 부르는 말이다."
    prompt: "주인공: 이슬 우리에서 '방울'이라 불리는 열여덟 살 인간 정원지기 (엘다르의 장부에는 번호, 아래 이름 — 진짜 이름 — 은 같은 화단의 니나만 안다). 여섯 살에 은잎문 경매에서 금화 백마흔 닢에 팔려 와 정원지기 숙소 이슬 우리에서 잔다. 테라스 위 셋째 단 '은방울 뜰'을 맡고, 왼쪽 발목의 금방울이 걸을 때마다 운다. 잘 먹어서 굶어 본 적이 없고, 몸은 가늘다. 엘다르어를 듣기만 허락받아 반쯤 알아듣는다 — 뜻을 아는 것은 금지다. 글은 모른다. 정원 밖으로 나가 본 적이 없다. 소매 단에 말린 기억꽃 한 송이를 숨겼다."
    awakening: "다만 새벽마다 뜻도 모르고 따라 하던 첫 아침의 노래 한 구절이 갑자기 뜻으로 들렸다 — 반쯤만 알던 엘다르어가, 그 구절만은 다 들렸다. 그리고 들릴 리 없는 먼 안개 쪽에서 은 수반 하나가 한 번 울었다."
