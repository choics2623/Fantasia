      - {id: o3_measure, at: "312-09-04 09:00", danger: 4, when: ["pknows fact_o3_measure_day", "not var o3_measure_me == true"], near: "내일 아침, 안개 계곡의 수정 기둥 사이에서 무게를 잰다. 니나가 은 수반 앞에 선다.", far: "낙엽월 4일 — 무게를 재는 날."}
      - {id: o3_nina_home, at: "312-09-04 17:00", danger: 2, when: ["var o3_nina_known == true", "not var o3_escaped == true"], near: "내일 저녁, 니나가 이슬 우리로 돌아온다. 무엇을 두고 오는지는 모른다.", far: null}
      - {id: o3_first_leaf, at: "312-09-03 15:00", danger: 1, when: ["loop >= 2"], near: "내일 오후, 과수원에서 잎 하나가 진다. 경계 안에서는 처음이다.", far: null}
      - {id: o3_mira, at: "312-10-09 09:00", danger: 4, when: ["pknows fact_sv_mira_fifth_ritual"], near: "내일, 미라가 다섯 번째로 접목 침대에 눕는다.", far: "서리월 9일 — 미라의 다섯 번째 옮김 의식."}
      - {id: o3_auction, at: "312-10-24 09:00", danger: 2, when: ["pknows fact_p2sv_autumn_auction_greyford"], near: "내일, 은잎문에서 서리월 경매가 열린다. 새 방울들이 온다.", far: null}
