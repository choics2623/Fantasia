      - {when: ["not var o3_nina_kept == true"], text: "니나는 같은 화단에서 새 정원지기들에게 방울 소리 죽이는 법을 가르쳤다. 누구에게 배웠는지는 기억하지 못했다."}
      - {when: ["var o3_escaped == true"], text: "41단 맨 아래 수로의 쇠창살 고리는 그 겨울 안쪽에서도 풀리지 않게 바뀌었다. 이슬 우리의 어른들은 그 일을 노래의 음 하나로만 기억한다."}
      - {when: ["var o3_carrier_known == true"], text: "온실 7동의 빈 요람 백마흔 개 가운데 하나에, 아에린은 오래 손을 얹고 있었다. 요람은 그 뒤로도 비어 있었다."}
      - {when: [], text: "영원 정원의 이슬은 그 뒤로도 같은 잎에 맺혔다. 낙엽월마다 한 장씩, 경계 안쪽에서 잎이 졌다."}
    texts:
      count_before_sleep: |
        이슬 우리의 흰 석조 숙소. 등 끄기 종 뒤의 어둠은 바깥의 어둠보다 얕다 — 은목이 밤에도 희미하게 빛나서. 옆자리가 비어 있다. 니나의 자리다. 발목의 방울을 손바닥으로 감싼다.

        잠들기 전, 너는 센다.
      wanted_hook: "수호자 초소의 흰 등이 늦게까지 꺼지지 않는다. 관리장의 장부에 한 줄이 더 적혔다."
      nem_door: "이슬 우리 침상 기둥"
      gossip_where: "식당 아궁이 곁에서, 목욕 연못에서."
    public:
      npc_o3_nina: 같은 화단의 정원지기 — 네 아래 이름을 아는 사람
