      열네 살에 세렌 노예선 짐칸에서 내려 이빨장수 고르바에게 팔렸다. 원형장 밑 쇠우리 7번 숙소에서 일곱 해 —
      늙은 투사 벡에게 창을 배웠고, 정식 대진에서 열한 번 이겼다. 쇠우리는 너를 승수로 부른다. 진짜 이름은 벡만 안다.
      회귀점은 가을 피의 날 오후 세 시, 입장문 쇠살대 앞. 오늘의 상대는 무릎이 나간 벡이다.
    stats: {근력: 13, 민첩: 12, 체질: 10, 지능: 8, 감각: 8, 의지: 9}
    skills: {화술: 12, 기만: 14, 위압: 18, 통찰: 20, 손재주: 10, 은신: 6, 싸움: 30, 읽고쓰기: 0, 용언: 0}
    status: {hunger: 1, pain: 15, fatigue: 20, fear: 1, stress: 45}
    train: 24
    coin: 2
    items:
      - {id: o6_spear, name: 투사 창, tags: [무기, 장병기, 양손], slot: 손, quality: 보통, condition: 85, illegal: false, value: 30, desc: "물푸레 자루에 쇠 시장 나가의 날을 단 창. 손잡이 홈은 벡이 깎았다 — 그롬마르에서만 인간이 쥘 수 있는 날"}
      - {id: o6_teeth, name: 이빨 목걸이 (승리 표식 열하나), tags: [신분, 승리표식], slot: 품, quality: 보통, illegal: false, value: 0, desc: "이긴 밤마다 고르바가 던져 준 그롬 이빨을 가죽끈에 꿴 것. 열하나. 투사의 값은 이빨로 센다"}
      - {id: o6_collar, name: 쇠 목고리, tags: [신분, 투사], slot: 품, quality: 조악, illegal: false, value: 0, desc: "원형장의 소유물이라는 표식. 열네 살에 채워졌다 — 쓸린 자리가 굳은살이 됐다. 백 승에야 풀린다고들 한다"}
    rel: {npc_o6_vek: [60, 50], npc_gm_mia: [40, 25], npc_gorba: [10, 20], npc_gm_shira: [25, 20], npc_gm_og: [20, 30], npc_gm_ytal: [30, 25], npc_mara: [10, 15], npc_gm_eida: [20, 15], npc_gm_norabe: [15, 20], npc_murk: [10, 15], npc_gm_tick: [5, 5], npc_gm_kroll: [0, 10]}
    knows: [fact_o6_battle_tongue, fact_o6_vek_knee, fact_o6_vek_named, fact_o6_hundred_freedom, fact_o6_gunnar_postponed, fact_o6_spear_rack]
    places: [ba_drain]          # 투사 시체를 옮기는 배수로 — 신참 때 무르크에게 그 입구에서 낙법을 배웠다
    vars: {o6_wins: 11, o6_marks: 0}
