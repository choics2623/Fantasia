          - {when: ["var o6_wins >= 25"], what: "스물다섯을 넘었다 — 개인 천막이 허락된다"}
          - {when: ["var o6_wins >= 20"], what: "스물을 넘었다 — 백까지는 아직 멀다"}
          - {when: ["var o6_wins == 19"], what: "열아홉 — 백까지 여든하나"}
          - {when: ["var o6_wins == 18"], what: "열여덟 — 백까지 여든둘"}
          - {when: ["var o6_wins == 17"], what: "열일곱 — 백까지 여든셋"}
          - {when: ["var o6_wins == 16"], what: "열여섯 — 백까지 여든넷"}
          - {when: ["var o6_wins == 15"], what: "열다섯 — 백까지 여든다섯"}
          - {when: ["var o6_wins == 14"], what: "열넷 — 백까지 여든여섯"}
          - {when: ["var o6_wins == 13"], what: "열셋 — 백까지 여든일곱"}
          - {when: ["var o6_wins == 12"], what: "열둘 — 백까지 여든여덟. 쇠우리가 새 승수로 부른다"}
