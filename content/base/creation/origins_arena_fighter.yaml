    map: {knowledge: {blood_arena: 3, grommar_port: 1, war_camp: 1}, sketch: [grommar_port, war_camp]}
    world: "주인공이 매인 곳은 그롬마르 붉은 황야의 피의 원형장 — 대전쟁군주 우르가쉬의 3만 석 원형장 도시. 주인공은 원형장 밑 투사 숙소 '쇠우리'(백 개의 문, 22시에 닫힌다)의 인간 투사다 — 그롬의 소유물이고, 그롬마르에서만 인간이 무기를 든다."
    people: "주인공은 쇠우리에서 일곱 해를 살았다 — 투사끼리는 이름과 승수로 부른다(미아 마흔하나, 오그 일흔여덟). 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"벡 — 당신에게 창을 가르친 예순네 승의 늙은 투사 — 이\"). 그롬은 인간 투사를 이름이 아니라 승수로 부른다. 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'쇠우리'는 원형장 밑의 인간 투사 숙소다(문이 백 개, 22시에 닫힌다). '모래'는 원형장의 싸움 바닥. '승수'는 정식 대진에서 이긴 수 — 투사는 이긴 수만큼 가슴에 칼자국을 긋는다(새끼 0~9, 칼 10~49, 흉터 50~89, 문턱 90~99). '혈명 없는 혈명'은 그롬이 백 승 인간에게 준다는 인정이다. '그롬 전투어'는 그롬의 말 — 주인공은 반쯤 알아듣고 몇 마디 한다. '뼈 행렬'은 전쟁 숙영지의 인간 소모품 막사다. 주인공을 부르는 '열하나'는 회귀점의 승수다 — 이긴 밤부터 쇠우리는 새 승수로 부른다([이야기의 줄기]의 '승수')."
    prompt: "주인공: 열하나라 불리는 스물한 살 인간 투사 (진짜 이름은 창을 가르친 벡만 안다 — 쇠우리에서 아무도 부르지 않는다). 열네 살에 세렌 노예선에서 내려 이빨장수 고르바에게 팔렸고, 원형장 밑 쇠우리 7번 숙소에서 일곱 해를 살았다. 정식 대진 열한 승 — 가슴에 칼자국 열하나, 목에 쇠 목고리 자국. 창을 쓰고, 그롬 전투어를 반쯤 알아듣는다. 쇠우리는 백 승이 자유라고 말한다."
    awakening: "다만 가을 피의 날 모래 위에서, 함성이 한순간 다른 시대의 함성으로 들렸고 — 손이 이 몸이 배운 적 없는 각도로 창을 고쳐 잡았다. 주인공은 그것을 설명하지 못한다."
    exclude: []
    perks: [싸움이 처음부터 쓸 만하다 — 창과 단련된 몸, 투사는 잘 먹는다 — 저녁마다 고기와 빵, 그롬 전투어를 반쯤 알아듣는다 — 그롬 앞에서 말이 닿는다]
    burdens: [새벽 북과 훈련장 — 22시에 닫히는 쇠우리, 목고리 자국 — 그롬마르 밖에서는 도망친 투사다, 모래가 정한 상대를 고를 수 없다 — 오늘은 벡이다]
