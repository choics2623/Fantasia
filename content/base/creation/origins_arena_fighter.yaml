      - {id: o6_scar_council, at: "312-09-06 21:00", danger: 1, near: "내일은 안식일 — 경기가 없다. 밤에는 1번 숙소 바닥에서 흉터 회의가 열린다. 쉰 승이 안 되는 자는 문간에서 듣는다."}
      - {id: o6_column_vek, at: "312-09-20 05:00", danger: 4, when: ["alive npc_o6_vek", "var o6_vek_crippled == true", "var o6_vek_kept != true", "var o6_you_column != true"], near: "내일 새벽, 북문에 뼈 행렬의 수레가 온다. 피의 감독의 서기가 승수를 읽는다 — 예순넷도.", far: "스무날 새벽 — 고르바가 쓸모없는 것들을 북문의 수레로 넘기는 날. 벡의 무릎은 아직 서지 않는다."}
      - {id: o6_column_you, at: "312-09-20 05:00", danger: 5, when: ["var o6_you_column == true"], near: "내일 새벽 북문. 소모품 명단에 네 승수가 있다.", far: "소모품 명단에 네 승수가 올랐다. 스무날 새벽, 북문의 수레."}
      - {id: o6_formal_sep, at: "312-09-20 13:00", danger: 3, when: ["var o6_you_column != true"], near: "내일 오후 뿔이 울리면 정식 대진이다. 승수는 정식 대진만 센다.", far: "스무날 정식 대진 — 대진표 돌판에 네 승수가 새겨졌다. 상대는 아직 새겨지지 않았다."}
      - {id: o6_formal_oct, at: "312-10-20 13:00", danger: 3, near: "내일은 서리월 스무날 — 정식 대진. 상대가 9번 숙소 사람이라는 말이 돈다.", far: "서리월 스무날 정식 대진. 대진표 돌판의 네 줄 옆에 9번 숙소의 승수가 새겨졌다."}
    goals:
      - who: 벡
        states:
