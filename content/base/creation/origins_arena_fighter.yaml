    losses:
      - {id: vek_lost, when: ["dead npc_o6_vek"], text: "7번 숙소 창걸이에 창 한 자루가 주인 없이 걸려 있다. 아무도 그것을 내리지 않는다.", weight: 7}
      - {id: vek_column, when: ["var o6_vek_taken == true"], text: "북문 쪽으로 수레 바퀴 소리가 멀어진다. 벡은 돌아보지 않았다.", weight: 6}
    achievements:
      - {id: vek_lives, tp: 2, text: 벡이 모래에서도 북문의 수레에서도 살아남았다, when: ["alive npc_o6_vek", "var o6_vek_taken != true", "date >= 312-09-21"]}
      - {id: blow_refused, tp: 2, text: 엄지가 내려갔을 때 창을 모래에 꽂았다, when: ["var o6_refused_blow == true"]}
      - {id: grom_felled, tp: 3, text: 피의 맹세 결투에서 그롬을 무릎 꿇렸다, when: ["var o6_grom_felled == true"]}
      - {id: hundred_road, tp: 1, text: 열넷 — 백으로 가는 길에 세 걸음, when: ["var o6_wins >= 14"]}
    epilogue:
      - {when: ["dead npc_o6_vek"], text: "벡의 창은 7번 숙소 창걸이에 걸린 채 녹슬었다. 아무도 그것을 내리지 않았다. 그 이름을 아는 사람은 이제 없다."}
      - {when: ["not dead npc_o6_vek", "var o6_vek_taken == true"], text: "벡은 가을 원정의 첫 열에 섰다. 말뼈 여울의 기록에는 번호만 남았다."}
      - {when: ["not dead npc_o6_vek", "var o6_vek_taken != true"], text: "벡은 쇠우리에서 늙었다. 훈련장 가장자리에서 창 자루로 바닥을 두드려 신참들의 발을 셌다. 아무도 없을 때면 이름 하나를 입 속으로 굴렸다."}
      - {when: ["var o6_wins >= 14"], text: "대진표 돌판에 네 승수가 새겨진 줄은 거기서 멈췄다. 다음 칸은 비어 있다 — 고르바가 손톱으로 긁는다."}
      - {when: ["var o6_wins < 14"], text: "쇠우리는 그 뒤로도 승수로 사람을 불렀다. 열하나라는 수는 이듬해 다른 신참의 것이 되었다."}
      - {when: ["alive npc_gm_hart"], text: "태양월 마지막 날, 외팔 하르트가 백에 닿았다. 그날 밤 그가 무슨 잔을 받았는지 쇠우리는 묻지 않았다."}
