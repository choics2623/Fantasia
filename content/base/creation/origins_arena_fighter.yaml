          - {when: ["var o6_vek_taken == true"], what: "북문의 수레에 올라 뼈 행렬로 갔다 — 가을 원정의 첫 열"}
          - {when: ["var o6_vek_kept == true"], what: "쇠우리에 남았다 — 훈련장 가장자리에서 신참들의 발을 센다"}
          - {when: ["var o6_vek_crippled == true"], what: "살았다. 무릎이 나갔다 — 스무날 새벽, 고르바가 쓸모없는 것들을 북문의 수레에 올린다", until: "312-09-20 05:00"}
