# O-06 피의 원형장 투사 (docs/world/SCENARIOS.md O-06 — 2026-10: 첫 시대부터 고를 수 있다). 필드의 뜻은 origins.yaml 머리말.
# 잔향이 고른 사람: '열하나'라 불리는 스물한 살 인간 투사. 열네 살에 세렌 노예선에서 내려 이빨장수 고르바에게 팔렸고,
# 원형장 밑 쇠우리 7번 숙소에서 늙은 투사 벡에게 창을 배웠다. 회귀점은 AS 312 낙엽월 1일 15시, 가을 피의 날의 투사 입장 터널.
#
# SCENARIOS → 데이터 (지역 카드·고장 자료가 이긴다):
#   '쇠이빨 막사'              → 쇠우리 (ba_gates · 백 개의 문, 22시에 닫힌다) — 잠자리는 7번 숙소 (ba_dorm7: 마라·미아·어린 탈과 같은 숙소)
#   조련사 고르즈 반쪽귀       → 이빨장수 고르바 (npc_gorba) — 조련·매매·대진. '존중'은 그의 셈법대로 '값'(이빨). 새벽 점호를 센다
#   동료 투사 레나 (24, 37승)  → 미아 마흔하나 (npc_gm_mia, 22, 41승) — 7번 숙소의 목소리. 경쟁과 연대
#   노장 투사 벡 (40, 64승)    → 벡 예순넷 (npc_o6_vek, 새 카드 — extra_arena_fighter.yaml)
#   크릭 도박꾼 치틱           → 내기 장부지기 틱틱 (npc_gm_tick)
#   두개골쪼개기 하그          → 장면 안의 이름뿐 (관중석 맨 앞의 그롬 흉터 전사 — 카드 없음)
#   우르가쉬                   → npc_urgash — 카드대로 앉지 않는다 (앉은 군주는 쇠약한 군주). 서서 하품한다
#   '짐승 우리' 형벌           → 소모품 강등 (REGIONS §16.7 '경기 거부 → 소모품 강등', 스무날 북문의 수레)
#   군나르의 99승              → 대진표 돌판의 '미룸', 오그의 이야기로만 (회색여울과는 닿지 않는다)
# 스킬 접기: 창·장병기 30 · 맨손 22 → 싸움 30 · 지구력 25 → 단련 24 · 위압 15 → 18 · 방패술·응급처치 → 손재주 10 ·
#   그롬 전투어 25 → 엔진 스킬이 없다 — 사실(fact_o6_battle_tongue)·서술 줄(prompt·nouns)·장면의 판정(위압)으로.
# 승수: 세계 변수 o6_wins (회귀점 11). 정식 대진이 올린다 — 가을 피의 날(장면), 낙엽월 스무날, 서리월 스무날. 백 승은 먼 길이다.
# 고르바의 이빨: o6_marks — 새벽 북(점호)에 빠지거나 통금에 걸리면 하나씩. 셋이면 뼈 행렬 수레에 팔린다 (o6_marks_sold).
origins:
  - id: arena_fighter
    order: 16
    scenario: O-06
    region: 그롬마르 붉은 황야
    name: 피의 원형장 투사
    title: 쇠우리 7번 숙소의 창
    call: 열하나
