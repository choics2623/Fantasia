    # 투사가 드나드는 곳: 쇠우리(백 개의 문)와 그 방들, 입장 터널 — 고장 자료에는 staff
    access: {ba_gate_tunnel: public, ba_gates: public, ba_training: public, ba_dorm7: public, ba_dorm1: public, ba_dorm9: public, ba_cookhouse: public, ba_infirmary: public}
    duty:
      rollcall:
        at: ba_training
        time: "05:00"
        by: npc_gorba
        frisk: false            # 투사의 몸은 뒤지지 않는다 — 날은 그롬마르에서 합법이다 (REGIONS §16.7)
        miss: "다섯 시 북에 훈련장에 없었다. 고르바가 이빨 꿰미에서 이빨 하나를 빼 손바닥에 굴린다 — 네 값이 하나 내렸다."
        miss_effects: ["var o6_marks += 1"]
        wake_text: "새벽 훈련 북. 7번 숙소 철창이 열리고 투사들이 훈련장으로 밀려 나간다. 다섯 시 대련 북에 맞춰 고르바가 무릎 보조대를 철컥이며 들어와 머릿수를 센다 — 이빨 꿰미를 짤랑이며."
      wake: "03:40"
      meal: {at: ba_cookhouse, from: "18:00", to: "20:30", label: 취사장에서 고기와 빵을 받는다, hunger: -2, thin: 0.15, with: npc_gm_eida, cost: 0, text: "에이다가 국자를 두 번 두드리고 승수를 묻는다. 고기 한 덩이, 빵 한 덩이. 투사는 잘 먹는다 — 모래에 세우려고."}
      work:
        at: ba_training
        from: "04:00"
        until: "09:00"
        label: 훈련장에 선다 (새벽 북부터 저녁 경기 뿔까지)
        done: "새벽 네 시간은 창, 낮에는 모래 삽과 대련. 고르바의 눈이 네 팔뚝에서 오래 머물지 않았다 — 좋은 날이다."
        fail: "셋째 합마다 반 박자씩 늦었다. 고르바가 손가락 마디의 매듭 하나를 푼다 — 오늘 저녁 네 고기는 그롬 대련 마당으로 간다."
        train: 0.7
        pain: 5
        fail_pain: 12
        fail_meal: true
        fail_fear: 0
        coin: 0
        outlaw: false
        sabbath: false
      count: null
      safe: [ba_gates]          # 쇠우리 안 어디든 (숙소·훈련장·취사장·치료소) — 22시에 문이 닫힌다
      curfew:
        caught: "쇠우리 문이 닫힌 뒤의 길. 그롬 순찰의 횃불이 네 목고리에 멈춘다. 무릎 뒤를 걷어차이고, 목고리째 끌려 7번 숙소 철창 안으로 던져진다. 아침이면 고르바가 이빨 하나를 뺄 것이다."
        fugitive: "횃불이 목고리에 멈춘다. \"등을 보인 투사다.\" 그롬의 손이 목고리를 잡아 올린다 — 발이 땅에서 뜬다."
        fugitive_why: "통금 순찰에 붙잡혔다 — 등을 보인 투사로 뼈의 전당 앞에 끌려갔다"
        pain: 20
        effects: ["var o6_marks += 1"]
        D: 4
      desert: "허락 없이 원형장 도시를 떠나면 그롬 누구나 사냥한다 — 등을 보인 투사"
      routine: 새벽 북 → 훈련장 → 취사장 → 쇠우리
    opening: o6_gate_open
    sense: 붉은 모래 냄새
    when_word: 오후
    rescue: "눈앞이 하얘진다. 누군가 너를 7번 숙소 짚더미로 끌고 간다. 입에 고깃국이 흘러든다 — 에이다의 국자다. \"이름부터.\" 그녀가 국자를 두 번 두드린다."
    quiet:
