# O-04 녹테른 혈목장 탈주자 (SCENARIOS §1, O-04) — 첫 시대부터 고를 수 있는 출신. 그 판의 잔향자는 이 사람이다.
# 회귀점: AS 312 낙엽월 1일 새벽 두 시, 붉은 우리 흰 울타리 바깥 포도밭 배수로 — 달아나는 중. 첫 1분부터 탈주자다.
#
# SCENARIOS → 지역 자료 (regional data wins — 카드·고장·사실이 이긴다)
#   장미울타리 목장(셋째 혈목장)     → 붉은 우리 (settlements/red_pens.yaml). 철문 = 흰 울타리(rp_fence)의 문, 수로 = 검은 포도밭(rp_vineyard) 배수로.
#                                     세실의 '병사' 위장은 붉은 우리 기록판에서도 일어난다 (오르페가 3년에 서른여덟 번 — fact_p2nc_orphe_thirty_eight).
#   버드나무 세 그루(잿빛 실 첫 거점) → 검은 장미 봉투의 그림 속 표지. 실제 숨을 곳은 검은 장미 둔덕(nocturne__nameless_mound, 첫날 낮)과
#                                     늪 경계 은신처 = 붉은 갈대 선(nocturne__marsh_edge, 잠자리). 테사의 은신처이고, 밤마다 사냥꾼이 그 선을 훑는다.
#   쇠오리(잿빛 실 안내인)           → '흉터목' 테사 npc_tessa (잿빛 실 남쪽 안내인 — 붉은 갈대 선에서 모르바까지).
#   목줄단 목장지기 그렐(인간, 46)   → 크릭 목동장 '울타리 혀' 즈라그 npc_zrag (열쇠꾼 출신, 우리의 숫자를 세는 자 — 셋이 비면 그의 숫자가 무너진다).
#   사냥귀족 오렐리안 핏빛서리       → 둘로 나눈다: 사냥을 맡긴 자는 붉은 우리 영주 아드리엘 핏빛유리 npc_adriel (갈증의 밤 공물 수 — fact_o4_bounty),
#                                     사냥하는 자는 침묵종 집의 갈증받이 사냥꾼 '아홉째' npc_ninth_hunter (밤마다 붉은 갈대 선을 훑는다 — 숙적).
#                                     녹테른은 바르그 조합에 맡기지 않는다 — 제 집의 갈증받이로 직접 사냥한다.
#   문을 열어 준 누군가              → 레이디 세실 그림자장미 npc_cecile (플레이어는 모른다 — 검은 장미 꽃잎만 본다).
#   마르틴(30)·리나(8)               → 새 카드 npc_o4_martin · npc_o4_lina (npcs/extra_bloodfarm_runaway.yaml). 마르틴의 딸은 카드 없이 이름만 — 아다(9, 3동).
#   창백한 사냥개                    → 사냥꾼의 개 (카드 없음 — 장면 안의 것).
#   모르바의 첫 마을(O-10 회의)      → 이 고장 밖이다. 대신 스무날 밤 테사의 호송(정본 ev_rp_rose_escape)이 첫 고비의 끝 — 리나와 마르틴이 갈대 선을 넘고,
#                                     냄새가 묻은 주인공은 이쪽에 남는다 (fact_o4_scent_convoy).
#   시작 상태 빈혈(체질 판정 −5, 7일) → 상태로: 지침 55·아픔 25. 자정 채혈 줄에서 막 돌아온 몸이다.
#   스킬: 운동 20·지구력 15 → 싸움 18·단련 12 / 은신 18 → 20 / 응급처치(지혈) 12 → 손재주 14 / 예법(식탁 시중) 10 → 화술 14 / 노예말 20 → 말(용언 0).
#         피 표의 홈과 번호는 읽는다 → 읽고쓰기 2 ("숫자만 읽는다").
#   추천 조합: 「늪길의 안내자」의 '활의 재능' → 사냥꾼(hunter) 소질 2. 나머지는 06 그대로 (12 / 12).
# 내용 규칙: 혈목장은 몸을 가축으로 쓰는 공포다 — 피, 홈, 번호, 잘 먹이는 손. 성적인 것은 없다.
