    map: {knowledge: {red_pens: 3, rose_manor: 1, first_thirst_castle: 1, lumen: 1}, sketch: [rose_manor]}
    world: "주인공이 매인 곳은 녹테른 밤의 영지 — 붉은 우리. 녹테른이 인간 6,800을 번호로 길러 이레마다 피를 뽑는 혈목장이다. 주인공은 그 흰 울타리를 넘어 달아난 가축이고, 영지 안 어디에서나 사냥감이다."
    people: "주인공은 우리에서 나고 자랐다 — 우리 사람은 번호로, 크릭 목동은 직함으로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"마르틴 — 열네 해 동안 피를 바친 서른 살 사내 — 이\"). 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'붉은 우리'는 녹테른의 혈목장(인간을 가축처럼 길러 피를 뽑는 곳)이다. '흰 옷'은 우리 사람이 입는 옷, '피 표'는 채혈 때마다 홈을 새기는 나무패, '병사'는 장부에서 사라진 사람을 지우는 말(병으로 죽음). '갈증받이'는 녹테른의 피를 이레마다 받는 인간 사냥꾼, '창백한 개'는 짖지 않고 냄새로 쫓는 사냥개, '붉은 갈대 선'은 녹테른 땅과 늪의 경계다."
    prompt: "주인공: 예순셋이라 불리는 열일곱 살 인간 — 녹테른의 혈목장 '붉은 우리' 7동에서 태어나 일곱 살부터 이레마다 피를 뽑힌 아이 (진짜 이름은 어머니가 지어 마르틴에게 맡겼다가, 탈주하는 밤에 돌려받았다). 손목 안쪽에 목장 표식, 팔 안쪽에 채혈 자국, 빈혈로 몸이 무겁다. 맨발에 젖은 흰 옷, 손에는 채혈 헛간의 철 촛대. 여덟 살 리나를 업고 열네 해 피를 바친 마르틴과 함께 붉은 갈대 선 쪽으로 달아났다 — 처음부터 쫓기는 탈주자다."
    awakening: "다만 수로의 검은 물에 비친 얼굴이 잠깐 자기 것이 아니었다 — 불붙은 하늘 아래 성벽 위의 남자. 수만 명이 한꺼번에 숨을 들이켜는 소리를 들었고, 등에 업힌 리나가 '눈이 회색이야'라고 속삭였다."
    exclude: []
    perks:
      - 우리는 가축을 잘 먹였다 — 체질이 좋고 아침마다 달린 다리가 있다
      - 마르틴과 리나 — 너를 믿는 둘이 곁에 있다
      - 우리의 길과 크릭의 순찰을 몸이 안다
    burdens:
      - 빈혈 — 오늘 밤에도 피를 뽑혔다
      - 처음부터 쫓긴다 — 짖지 않는 개와 갈증받이 사냥꾼
      - 손목 안쪽의 목장 표식 — 어디서나 가축임이 드러난다
