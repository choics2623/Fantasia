      - {when: ["var o4_lina_crossed == true"], text: "리나는 늪에서 자랐다. 진흙등불 회관에서 매듭으로 글자를 배웠고, 맨 처음 묶은 낱말은 자기 이름이었다. 그 이름을 누가 지어 주었는지는 끝까지 말하지 않았다."}
      - {when: ["var o4_lina_taken == true"], text: "리나는 그해 긴밤월, 갈증의 밤 공물 행렬의 '공물 아님' 줄에 섰다. 집행인이 열두 살 아래를 세워 두는 줄이다. 그 뒤의 일은 아무도 적지 않았다."}
      - {when: ["dead npc_o4_lina"], text: "갈대 속 작은 무덤에는 표식이 없다. 표식은 우리에서 쓰는 것이다."}
      - {when: ["var o4_lina_crossed != true", "var o4_lina_taken != true", "alive npc_o4_lina"], text: "리나는 테사의 줄에 섞여 갈대를 넘었다. 늪 사람들이 이름을 묻자 아이는 숫자를 세다가, 다섯에서 멈추고 이름을 말했다."}
      - {when: ["var o4_ada_out == true"], text: "아다는 아버지 팔의 홈을 하나씩 세는 버릇이 있었다. 칠백스물여덟에서 늘 멈췄다."}
