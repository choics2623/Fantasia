      - {when: ["var o7_inga_lost != true", "var o7_inga_taken != true", "alive npc_o7_inga"], text: "잉가는 서리월 1일 문 밖에 남았다. 그 뒤의 일은 아무도 적지 않았다."}
      - {when: ["var o7_fifty == true"], text: "그해 낙엽월, 까마귀 문은 서른이 아니라 쉰을 받았다. 레아의 보고서에는 그 줄이 있었다. 사령관의 이름 옆에."}
      - {when: ["var o7_massacre == true"], text: "북문 앞 진흙은 오래 붉었다. 이듬해 봄에도 까마귀들은 그 자리를 먼저 찾았다."}
      - {when: ["not var o7_fifty == true", "not var o7_massacre == true"], text: "서리월 1일, 북문의 권양기 열쇠가 걸렸다. 문 밖에 남은 사람들의 수는 아무도 세지 않았다."}
