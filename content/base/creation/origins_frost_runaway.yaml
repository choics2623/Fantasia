    world: "주인공이 매인 곳은 까마귀 문 — 용제국 북방 국경 요새의 북문 앞. 서리 길을 넘어온 북방 탈주자 이백이 진눈깨비 속 진흙에 앉아 있고, 요새는 쓸모 있는 서른만 받는다. 받은 서른은 바깥문과 쇠창살 사이 돌 통로에서 잔다."
    people: "주인공은 서리 길을 넘어 막 닿았다 — 요새 사람의 이름은 모르고, 같이 넘어온 사람은 이름(또는 거인이 붙인 칸 이름)으로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"울릭 — 같은 골짜기에서 온 늙은 덫꾼, 양발이 언 — 이\"). 이름을 모르는 요새 사람은 겉모습으로만 부른다."
    nouns: "'까마귀 문'은 요새의 이름이다(새가 아니다). '서리 길'은 흐로스가르드에서 내려오는 산길, '마지막 이정표'는 그 초입의 돌기둥. '서리말'은 북방 인간과 거인의 말 — 주인공의 모어다. 공용어는 서툴다. '칸'은 거인의 장부에서 노예 한 사람의 자리. '일곱'은 장부의 '가죽 일곱'에서 온 부름이다."
    prompt: "주인공: '일곱'이라 불리는 스무 살 인간 — 흐로스가르드 돌무릎 골짜기에서 거인의 가죽을 무두질하던 노예였고(장부의 '가죽 일곱', 진짜 이름은 늙은 덫꾼 울릭만 안다), 서리 길을 열아흐레 걸어 달아났다. 주인도 문서도 없다. 까마귀 문 북문 앞 진흙에서 동상 든 울릭과 열두 살 잉가를 데리고 이백의 탈주자 사이에 있다. 서리말이 모어, 공용어는 서툴다. 거인 털가죽 조각을 두르고 부츠에 뼈 칼을 숨겼다. 늘 배가 고프다."
    awakening: "다만 까마귀 떼가 날아오를 때 이 땅을 본 적이 있다는 감각 — 성벽이 서기 전의 들판, 방패 대신 세워진 인간들의 줄, 군데라는 이름 — 이 막 깨어났다. 배운 적 없는 요툰의 옛말 몇 마디가 혀끝에 걸린다."
    exclude: [cg_laundry_word]
    perks: [주인도 문서도 없다 — 떠나는 것은 탈주가 아니다, 서리말과 서리 길 — 북쪽에서 온 사람들이 너를 믿는다, 추위와 짐에 단련된 몸 — 체질과 의지가 처음부터 단단하다]
    burdens: [문서 없는 인간 — 성벽 안은 어디든 몰래 들어야 하고 남쪽 길목은 탈주 노예로 붙잡는다, 공용어가 서툴다 — 용인과 크릭 앞에서 말이 넘어진다, 언 발의 울릭과 열두 살 잉가 — 둘을 데리고는 어디로도 빨리 못 간다]
