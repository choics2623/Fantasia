# O-07 북방 거인 노예 탈주자 (SCENARIOS §1 O-07) — 첫 시대에도 고를 수 있는 출신 (2026-10).
# 회귀점: AS 312 낙엽월 1일 아침 8시, 진눈깨비. 까마귀 문 북문 앞 진흙 — 서리 길을 넘어온 이백 가운데.
#
# SCENARIOS → 지역 자료 (지역 자료가 이긴다):
#   성문 위의 용인 장교(목덜미에 은빛 비늘) → 레아 npc_lea (머리선을 따라 은빛 비늘, 손가락 둘이 없는 오른손을 허리 뒤에). 손과 신발을 먼저 본다(카드 습관)
#   "옆의 누군가가 서리말로 옮긴다"      → 브린야 npc_cg_brynja (서리 길 밀수꾼 — 무리 가장자리에서 옮기며 되돌아갈 사람의 값을 센다)
#   카스파르 반비늘                      → npc_kaspar (북문 순시 — 첫 사흘은 비라 일과는 작전실이지만, 이 출신의 회귀점에서는 문 위에 선다: stage)
#   거인 주인 '할보르 서리턱'(없는 이름) → '돌무릎' 바우그 npc_baug. 시그리드·아스타와 같은 노예촌(돌무릎 골짜기)이라야 SCENARIOS의 "같은 노예촌"이 맞는다.
#                                          바우그는 발목을 부러뜨리지 않는다(다리 부러진 노예는 짐을 못 진다) — 장부의 칸을 비워 두고 돌아오면 다시 쓴다(카드 그대로).
#                                          '짐승 반환 청원'은 사실(fact_o7_baug_empty_slot)의 '칸 하나에 붙은 값'으로만 남겼다 — 얼음 탁자의 일정은 흐로스가르드 목표 행동의 것.
#   시그리드(같은 노예촌, 아기 때 안아 본) → npc_sigrid — 회색여울 굶주린 언덕. 이름만 (잉에가 울음 고개 '마지막 불'에서 일러 주었다: fact_o7_inge_last_fire)
#   울릭(66, 양발 동상) · 잉가(12)       → 새 사람 npc_o7_ulric · npc_o7_inga (npcs/extra_frost_runaway.yaml)
#   동생이 깎은 나무 인형                 → 죽은 동생 케틸(울음 고개에서 얼어 죽음)이 깎은 인형 — 지금은 잉가가 안고 있다 (물건이 아니라 사실·글로)
#   엘사·브람(울릭의 발가락)             → 의무실 마그다 npc_cg_magda (동상 침상 열둘의 '손난로'), 혹은 네 뼈 칼
#   굶주린 언덕 우회로(8시간)            → 지도에서 까마귀 문↔굶주린 언덕은 밀수꾼 길 25시간. 우회로는 물빼기 굴 입구 위 돌무더기 길로 '찾는다'(사실)까지만.
#   "시그리드를 안다"(브람의 술꾼)       → 레아가 그 이름을 적는다 — '누가 길을 열었나'는 카스파르의 질문이다. 성벽 위 크릭이 따라 웃는다
#   서른 명을 '받는다'                   → 감옥 수용 30칸은 이미 찼다(올레·순나·요스트…). 받은 서른은 북문 바깥문과 쇠창살 사이 돌 통로에서 잔다 —
#                                          그래서 이 출신의 잠자리는 받든 못 받든 '북문'(cg_north_gate) 하나다. 문 안인지 밖인지는 깃발(o7_inside …)이 서술에 알린다.
# 문서 없는 인간: 자유민(free — 떠나는 것은 탈주가 아니다)이지만 성벽 안은 어디든 몰래(access: 우물 마당·남문·짐꾼 막사·빨래터·협곡 대로를 staff로),
#   통금 순찰에 걸리면 매와 수배 하나, 남쪽 용의 대로는 통행증 + 국경군 문서 — 검문에서 탈주 노예로 붙잡힌다.
