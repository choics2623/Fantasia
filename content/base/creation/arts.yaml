# 비기·오의 (06 §3.1): 재능 등급과 스킬이 함께 열어 준다. 수재 비기(스킬 30) · 천재 비기(50) · 신재 비기(70) · 오의(신재 + 90)
#
# 값의 뜻
#   tier: 2 = 수재 비기 · 3 = 천재 비기 · 4 = 신재 비기 · 5 = 오의
#   skill: 비기가 걸리는 스킬 — 그 스킬이 위의 수치에 닿아야 열린다
#   effect
#     edge   — 조건(when)이 맞는 동안 그 스킬의 판정 +n
#     second — 하루 한 번, 실패한 그 스킬의 판정을 다시 굴린다 (when이 있으면 그 조건에서만)
#     crit   — 그 스킬의 판정이 성공하면 n% 확률로 대성공
#     act    — 하루 한 번 쓰는 새 선택지 (n: 그 선택지의 판정 보너스)
#   when: any · fight · fight_first · after_guard · unarmed · armed · talk · story(장면) · night · sneak(숨기·빠져나가기·통금·달아나기) · authority(감독·주인·경비·사냥꾼)
#   큰 재능은 넷(수재·천재·신재·오의), 작은 재능은 둘(수재·천재). 스킬이 없는 재능 가운데 싸우고 숨고 말하는 여섯(질주·암기·반사신경·결투·심문·사냥꾼)도 받는다.
