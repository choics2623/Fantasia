    world: "주인공이 매인 곳은 바알카르 — 드라크마르 용제국의 수도, 일곱 층으로 오르는 산의 도시. 6층 비늘 언덕의 순혈 대가문 화염문 저택, 노예 210 가운데 부엌의 하나다. 통금(19:30) 뒤 저택 밖의 인간은 태형과 사슬 기둥이다."
    people: "주인공은 화염문 저택의 부엌에서 나고 자랐다 — 저택 사람은 이름이나 별명으로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"헤름 — 화염문 부엌의 늙은 요리장, 손등이 불티 자국투성이인 노인 — 이\"). 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'화염문'은 순혈 대가문의 이름이다(문이 아니다). '비늘 언덕'은 바알카르 6층의 순혈 저택가, '재받이'는 맨 아래 강가의 인간 빈민가다. '등잔'은 이름 없는 자들의 바알카르 조직을 부르는 말이다. '부지깽이'는 주인공의 부엌 별명이다 — 화덕에 손을 넣어도 데지 않아서. 순혈 용인은 거의 인간처럼 보인다(목덜미에 비늘 몇 장, 금빛 눈, 뜨거운 손)."
    prompt: "주인공: 부지깽이라 불리는 열일곱 살 반용 — 화염문 가주 발레리우스와 인간 노예 아나(다섯 해 전 재 마당에서 탔다) 사이에서 난, 아무도 인정하지 않는 아이 (진짜 이름은 늙은 요리장 헤름만 안다). 바알카르 비늘 언덕 화염문 저택 부엌 뒤 하인 숙소에서 잔다. 사흘째 열이 내리지 않고, 낙엽월 1일 밤 등뼈를 따라 비늘 세 개가 살을 찢고 나왔다 — 드러나면 처단이다. 손은 불에 데지 않고, 품에 어머니가 남긴 비늘 펜던트를 숨겼다."
    awakening: "다만 등의 비늘이 달아오를 때마다 배운 적 없는 불이 기억난다 — 하늘을 메운 불이 자기 목소리를 한가운데서 찢던 순간과, 그 불을 뿜은 용의 이름. 그 용은 지금 용좌봉에서 죽어 가고 있다."
    exclude: [kaspar_warning]
    perks: ["아비의 저택 안을 드나든다 — 순혈들의 말이 가장 가까이에서 들린다", "늙은 요리장 헤름이 네 이름과 네 등을 지킨다", "반용의 피 — 불에 데지 않고, 용심이 4점 싸다"]
    burdens: ["비늘이 드러나면 그 자리에서 처단이다", "이복형 루칸이 같은 저택에서 처음부터 냄새를 쫓는다 (원수의 피)", "통금이 가혹하다 — 저택 밖의 밤은 태형과 사슬 기둥"]
