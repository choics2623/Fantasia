      - {id: o11_house_tag, name: 화염문가 사슬 표찰, tags: [신분], slot: 허리, value: 0, desc: "불꽃 문 문장이 찍힌 쇠 표찰. 화염문 저택의 하인이라는 뜻 — 심부름이면 층계 검문을 지난다. 통행증은 아니다"}
    rel: {npc_o11_herm: [70, 60], npc_o11_lucan: [-20, -30], npc_valerius: [-10, 0], npc_greta: [15, 10], npc_o11_kruk: [-5, -10]}
