    access: {bk_sh_flamegate: public, bk_sh_flamegate_laundry: public, bk_sh_servant_passage: public, bk_scale_hill: public}
    duty:
      rollcall: false
      wake: "04:30"
      meal: {at: bk_sh_flamegate, from: "18:30", to: "19:30", label: 부엌 뒤에서 연회의 남은 것을 받는다, hunger: -1, thin: 0.15, cost: 0, text: "식은 기름, 뼈에 붙은 고기, 빵 귀퉁이. 위층 식탁에서 내려온 것을 부엌 사람들이 고루 나눈다 — 배는 찬다. 등은 벽 쪽으로"}
      work:
        at: bk_sh_flamegate
        from: "05:00"
        until: "09:00"
        label: 부엌일을 한다 (불 지피기부터 연회 설거지까지)
        done: 화덕 넷, 고기 꼬챙이, 물동이, 위층 계단. 몇 번 오르내렸는지 세다가 그만둔다. 접시 하나 깨지지 않았다 — 등은 늘 벽 쪽으로
        fail: 소스가 눌어붙었다. 크룩의 막대가 손등에 떨어진다 — 오늘 저녁 부엌의 몫은 없다
        train: 0.3
        pain: 2
        fail_pain: 8
        fail_meal: true
        outlaw: false
        sabbath: true
      count: {time: "20:00", at: [bk_sh_flamegate, bk_sh_flamegate_laundry], by: npc_o11_kruk, miss: "통금 종 뒤 반 시간, 크룩이 하인 숙소 문 앞에서 머릿수를 셌다. 한 자리가 비었다 — 크룩의 혀가 이빨에 부딪혀 딱 소리를 낸다", reason: 화염문 저택의 저녁 점고에 빠졌다}
      safe: [bk_sh_flamegate_laundry, bk_sewer]
      curfew:
        caught: "통금 순찰의 등불이 얼굴에 멈춘다. 비늘 근위 둘. 사슬 표찰을 보고도 몽둥이가 먼저다 — 태형 열. 하인복 등판이 찢어지기 전에 크룩이 표찰 값을 치르고 너를 끌고 간다. 화염문의 물건은 남의 기둥에 오래 두지 않는다. 아침이면 그 이야기가 위층까지 올라간다"
        fugitive: "등불이 얼굴에 멈춘다. \"화염문에서 도망친 부엌것이다.\" 사슬 기둥으로 끌려가며 하인복이 찢어진다. 등불이 등에 닿는다."
        fugitive_why: "통금 순찰에 붙잡혔다 — 도망친 하인으로 사슬 기둥에 묶였고, 등불 빛에 등의 비늘이 드러났다"
        pain: 20
        effects: ["var o11_lucan_eye += 1", "stress 6"]
        D: 4
      desert: "허락 없이 바알카르를 떠나면 크룩이 송곳니 회관에 이름을 넘긴다 — 가주의 통행증이 있으면 심부름이다"
      routine: 부엌 → 연회 시중 → 하인 숙소
    opening: o11_stairs_open
    sense: 사슴 기름 타는 냄새
    rescue: "눈앞이 하얘진다. 누군가 너를 하인 숙소 짚더미로 끌고 간다. 입에 식은 국물이 흘러든다. 잿물 냄새 나는 손 — 세탁장의 그레타다."
    rescue_out: "눈앞이 하얘진다. 재 냄새 나는 손이 너를 어딘가 따뜻한 데로 끌어다 놓는다. 이 없는 입이 무어라 웅얼거리고, 묽은 죽이 입에 흘러든다."
    quiet:
      - "위층에서 마지막 잔이 부딪힌다. 접시가 내려오고, 기름이 하얗게 굳는다. 하인 숙소에는 등잔이 없다 — 화덕의 남은 불이 벽을 붉게 한다."
      - "새벽종이 일곱 층을 내려간다. 비늘 언덕에서 맨 아래 재받이까지. 화덕에 첫 장작을 넣는 손은 언제나 부엌의 맨 아래 손이다."
      - "세탁장 쪽에서 방망이 소리가 늦게까지 난다. 누군가의 피 묻은 비단을 빤다. 너는 등을 벽에 붙이고 잔다. 벽이 시원하다."
      - "용좌봉 쪽 하늘이 붉다. 재의 둥지에서 늙은 용이 숨을 쉰다고, 하인들은 그렇게만 말한다. 누구도 그쪽을 오래 보지 않는다."
    beats:
      - {id: o11_hunt_beat, at: "312-09-03 21:00", danger: 4, when: ["var o11_hunt_heard == true"], near: "내일 밤, 루칸의 놀이. 횃불 여섯, 하인 통로, 불꽃 홀의 자정 북.", far: "루칸의 손님들이 '놀이'를 말한다. 사냥감은 부엌에서 고른다고."}
      - {id: o11_north_gate, at: "312-09-02 05:00", danger: 2, when: ["var o11_cast_out == true"], near: "새벽 다섯 시, 북문이 열린다. 가주의 통행증이 품 안에서 무겁다."}
      - {id: o11_lamp_night, at: "312-09-13 23:00", danger: 2, when: ["var o11_lamp_knows_blood == true"], near: "내일 밤 열한 시, 재받이 하수 분기점에 등잔이 켜진다.", far: "열사흘 밤 열한 시 — 재받이 하수 분기점의 등잔 회합."}
      - {id: o11_varskar_fit, at: "312-09-08 06:00", danger: 2, when: ["loop >= 2"], near: "내일 새벽, 재의 둥지 병상 문이 사흘 닫힌다. 위층의 잔들이 그 소식에 오래 부딪힐 것이다.", far: "용좌봉의 늙은 용이 곧 한 번 더 무너진다. 너는 그 날을 안다."}
    goals:
      - who: 헤름
        states:
          - {when: ["var o11_herm_dead == true"], what: 루칸의 놀이에서 돌아오지 못했다}
          - {when: ["var o11_herm_saved == true"], what: 놀이에서 살아남았다 — 루칸은 그 밤을 잊지 않는다}
          - {when: ["var o11_hunt_heard == true"], what: 루칸이 놀이의 사냥감으로 눈여겨보았다 — 낙엽월 3일 밤, until: "312-09-03 21:00"}
          - {what: 부엌 화덕 곁 — 네 이름과 네 등을 아는 단 한 사람}
      - who: 네 등의 비늘
        states:
          - {when: ["var o11_scales_bleached == true"], what: 잿물에 바래 살갗과 같은 빛 — 사흘은 쓰라리다}
          - {when: ["var o11_lucan_eye >= 2"], what: 루칸이 눈치챘다 — 하인복 속의 비늘 셋}
          - {what: 하인복 속의 비늘 셋 — 드러나면 그 자리에서 처단이다}
      - who: 카스파르 반비늘
        when: ["pknows fact_dk_aurax_kaspar_contract"]
        states:
          - {when: ["dead npc_kaspar"], what: 죽었다}
          - {when: ["var kaspar_warned == true"], what: 경고가 닿았다}
          - {what: 아우락스가 송곳니 회관의 볼크에게 목값을 냈다 — 용황이 숨을 거두는 밤. 까마귀 문은 용의 대로 북쪽 끝이다}
    losses:
      - {id: herm_lost, when: ["var o11_herm_dead == true"], text: "헤름의 화덕이 식었다. 다음 날 아침 첫 장작을 넣은 것은 너다. 아무도 그 자리를 묻지 않는다.", weight: 7}
      - {id: greta_lost, when: ["var o11_greta_dead == true"], text: "세탁장의 방망이 소리가 하나 줄었다. 허리끈의 매듭이 무엇이었는지 아는 사람은 이제 회색여울에 하나뿐이다.", weight: 5}
    achievements:
      - {id: herm_lives, tp: 2, text: 헤름을 루칸의 놀이에서 지켜냈다, when: ["var o11_herm_saved == true", "alive npc_o11_herm", "date >= 312-09-15"]}
      - {id: hunt_survived, tp: 2, text: 루칸의 놀이에서 자정 북까지 살아남았다, when: ["var o11_survived_hunt == true"]}
      - {id: two_halfscales, tp: 3, text: 두 반비늘 — 카스파르에게 같은 피를 보였다, when: ["var o11_kaspar_blood == true"]}
      - {id: lamp_child, tp: 1, text: 아나의 등잔 — 재받이의 베노가 네 등을 보았다, when: ["var o11_lamp_knows_blood == true"]}
    epilogue:
      - {when: ["var o11_herm_dead == true"], text: "화염문 부엌의 화덕은 그 겨울 다른 손이 지폈다. 연회마다 사슴은 구워졌고, 아무도 늙은 요리장의 간을 기억하지 못했다."}
      - {when: ["not var o11_herm_dead == true"], text: "헤름은 그 겨울을 넘겼다. 봄에 화덕 재를 치우다가 검게 그을린 비늘 하나를 주워 오래 들여다보았다. 그리고 다시 재 속에 묻었다."}
      - {when: ["var kaspar_warned == true"], text: "용황이 숨을 거둔 밤, 까마귀 문 사령관실 창 밖에 그림자가 섰다. 사령관은 깨어 있었다."}
      - {when: ["not var kaspar_warned == true"], text: "용황이 죽은 해 봄, 까마귀 문의 반비늘이 죽었다. 쇠 송곳니 자국이 남았다. 누구의 금이었는지는 화염문의 장부에만 적혔다."}
      - {when: ["alive npc_o11_lucan"], text: "루칸 화염문은 사냥 연회를 그만두지 않았다. 부엌에서 사냥감을 고르는 놀이도. 화염문의 대는 그에게서 끊겼다."}
      - {when: ["dead npc_o11_lucan"], text: "루칸 화염문이 죽은 뒤, 발레리우스는 장부를 처음부터 다시 셌다. 부엌, 하나 — 그 줄은 이미 지워져 있었다."}
    texts:
      count_before_sleep: |
        부엌 뒤 하인 숙소. 짚더미가 화덕 벽에 붙어 있어 등이 따뜻하다 — 등뼈의 세 자리만 더 뜨겁다. 위층에서 마지막 잔이 부딪히는 소리가 내려온다. 너는 등을 벽에 붙인다.

        잠들기 전, 너는 센다.
