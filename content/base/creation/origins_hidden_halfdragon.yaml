# O-11 반용 — 용인 귀족가의 숨겨진 아이 (docs/world/SCENARIOS.md O-11 → 바알카르 지역 자료에 맞춘 각색. 지역 자료가 이긴다)
#
# 사람 (SCENARIOS → 자료)
#   벨라스 가문              → 화염문 가. 칼다란·하스트란·타르굴·베스페린 가운데 발레리우스 화염문(npc_valerius)의 카드만 맞는다:
#                               아우락스파 자금줄, 저녁마다 연회(일과 18~23시), 밤마다 장부, 기질 '불임의 공포', 두려움 '인간의 얼굴이 자기 얼굴과 닮았다는 사실'.
#                               하스트란 저택은 해가 지면 불을 모두 끄고(연회가 없다), 칼다란은 S급 집사가(대공) 얽히고, 베스페린은 멜리산드파다
#   생부 세바르 벨라스(210)   → 발레리우스 화염문 (310) — 카드 그대로. 인간과 말하지 않는다. 값이 걸린 밤에만 처음으로 직접 말한다
#   이복형 루칸 벨라스(80)    → 새 인물 npc_o11_lucan 루칸 화염문 (80, 발레리우스의 외아들, 아이가 없다) — 원수의 피의 원수(enemy)
#   요리장 테오(인간, 72)     → 새 인물 npc_o11_herm 헤름. npc_theo_bold(테오 볼드)는 잉크 거리의 용인 관리라 맞지 않고, 같은 도시에 같은 이름을 두지 않으려 이름을 바꿨다
#   어머니 아나              → 이름만. AS 307 재 마당에서 징후자로 탔다 — 등잔(바알카르의 이름 없는 자들)의 물통 길
#   '세 번째 우물' 접선 장소  → 재받이 하수 분기점(bk_sewer_third, 등잔 회합)과 베노의 아궁이(npc_benno)
#   저택의 감독              → 새 인물 npc_o11_kruk 크룩 — 그레타(npc_greta)의 카드에 나오는 '감독 크릭'. 저녁 점고를 부른다
#   같은 저택의 사람          → 그레타(npc_greta, 세탁 노예 — 브란의 아내). 아나와 두 해를 같은 저택에서 살았다
# 그 밖의 각색
#   하인복(제복:벨라스)       → 화염문가 사슬 표찰 (바알카르의 '사슬 표찰'). 부엌칼은 '근무 중에만'이라 소지품에서 뺐다
#   잠든 비늘 (0 TP)         → traits: [sleeping_scale] + trait_discount {dragon_heart: 4}. 비늘이 드러나면 처단 — 대본 장면의 die/위험으로
#   선택 3 {요구: 용기 30+}   → 엔진에 성향 조건이 없다: 화술 판정(장부 방 문 앞의 집사)으로 바꿨다
#   선택 6 [의지 D45]        → 통찰 D32 + 잠든 비늘이 돕는다(+8). 펜던트는 녹지 않고 검게 그을린다 (물건을 없애는 효과가 없다)
#   카스파르에게 알리는 길    → kaspar_warning(인간 짐꾼의 글) 대신 이 출신의 o11_kaspar_blood (같은 효과 + '두 반비늘')
#   하인의 하루              → 점호 없음, 통금 종 뒤 20:00 크룩의 저녁 점고 · 05:00부터 부엌일 · 18:30 연회의 남은 것 · 바알카르 통금 19:30
