      화염문 저택 부엌에서 자란 열일곱 살. 어머니는 인간 노예였고 다섯 해 전 재 마당에서 탔다. 아비는 위층에서
      장부를 센다 — 그는 너를 알고, 인정하지 않는다. 사흘째 열이 내리지 않는다. 회귀점은 사냥 연회의 밤,
      구운 사슴 쟁반을 들고 오르는 하인 계단 — 등뼈를 따라 비늘 세 개가 살을 찢고 나온다.
