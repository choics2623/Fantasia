      - {id: ferns_breathe, tp: 2, text: 고사리 밑의 숨을 지켰다, when: ["var o12_ferns_saved == true", "date >= 312-09-14"]}
      - {id: first_name, tp: 2, text: 다섯 살 이전의 이름을 들었다, when: ["var o12_name_heard == true"]}
      - {id: two_packs, tp: 3, text: 두 무리의 개 — 열나흘을 넘기고도 굴을 지켰다, when: ["var o12_reckoning_done == true", "not var o12_volk_has_den == true", "not var o12_volk_prey == true", "date >= 312-09-20"]}
      - {id: collar_teeth, tp: 2, text: 목줄을 끊은 이빨 — 아비의 사냥에서 살아남았다, when: ["var o12_escaped_volk == true"]}
    epilogue:
      - {when: ["var o12_volk_has_den == true"], text: "스무닷새, 늑대굴 입구에 연기가 들어갔다. 열아홉이 끌려 나왔다. 그 냄새를 아비에게 준 것은 인간의 코였다."}
      - {when: ["not var o12_volk_has_den == true"], text: "늑대굴의 무리는 서리월이 오기 전에 언덕을 떠났다. 그 굴의 냄새를 아는 코 하나는 끝내 입을 열지 않았다."}
      - {when: ["var o12_ferns_saved == true"], text: "고사리 밑에서 숨을 참던 아이는 그 겨울을 넘겼다. 누가 바람을 돌렸는지 아이는 몰랐다."}
      - {when: ["var o12_ferns_caged == true", "not var o12_ferns_saved == true", "not var o12_child_missed == true"], text: "우리 수레의 아이는 바알카르 사슬 부두까지 갔다. 그 뒤의 일은 아무도 적지 않았다."}
      - {when: ["var o12_child_missed == true"], text: "그해의 놓친 아이는 리브라는 이름이었다. 볼크의 장부에는 이름이 없다."}
      - {when: ["var o12_name_heard == true"], text: "엘사는 그 이름을 한 번 더 불렀다. 솥에 대고, 불탄 아이 셋의 이름 다음에."}
      - {when: ["not var o12_name_heard == true"], text: "그는 끝까지 코였다. 이름을 아는 노파는 그를 찾지 못했다."}
      - {when: ["alive npc_o12_skali", "var o12_volk_prey == true"], text: "스칼리는 보름마다 송곳니 불가에서 목을 길게 늘였다. 이번에는 소리가 났다."}
      - {when: ["alive npc_o12_skali", "not var o12_volk_prey == true"], text: "스칼리는 보름마다 송곳니 불가에서 목을 길게 늘였다. 소리는 내지 않았다."}
    texts:
      count_before_sleep: |
        송곳니 불의 재가 아직 따뜻하다. 스칼리가 네 등에 등을 붙이고 잔다. 우리 수레의 사슬이 바람에 한 번 운다.

        잠들기 전, 너는 센다.
      wanted_hook: "송곳니 불 쪽에서 루그가 밤새 코를 땅에 대고 있다. 네 냄새가 어디서 끝나는지 재고 있다."
      nem_door: "송곳니 불가의 소나무"
      gossip_where: "송곳니 불가에서, 수탉 처마 밑에서."
    public:
      npc_volk: 아비 — 사냥대장
      npc_o12_skali: 형제 — 같은 불가에서 자란 바르그
      npc_o12_rug: 털 없는 것을 싫어하는 늙은 코
      npc_sigrid: "? 언덕의 북쪽 여자 — 냄새를 아는 얼굴"
      npc_kit: "? 강변 움막의 아이"
      npc_gerda: "? 강변 움막의 기침하는 여자"
      npc_bram: 수탉의 외다리 — 너를 보면 침을 뱉는다
      npc_hagen: 나룻배 사내 — 아비에게 고기를 파는 목줄꾼
      npc_grod: 반귀 그로드 — 회색여울의 송곳니
      npc_elsa: "? 늪가의 약초 노파"
      npc_znik: 마을의 크릭 감독관
      npc_irma: 언덕 남사면의 양치기 과부
      npc_fayne: "? 지붕을 타는 마을 아이"
      npc_sara: "? 성채의 젊은 하녀"
      npc_godric_raven: 남작 — 아비에게 값을 치르는 용인
      npc_henrik: 징세관 (용인)
      npc_osric: 사슬등불 예배당의 사제
      npc_egil: "? 수탉 마루 밑의 기침 냄새"
      npc_gorm: "? 언덕 위를 도는 잿빛 와이번"
      npc_isol: "? 회색 망토의 낯선 여자"
    map: {knowledge: {hungry_hill: 3, greyford_village: 2, crow_gate: 2, weeping_pass: 2, baalkar: 1, filth_marsh: 1, old_stone_ring: 1, dragon_pillar_post: 1}, sketch: [crow_gate, weeping_pass]}
    world: "주인공이 매인 곳은 굶주린 언덕 — 바르그 노예사냥 조합 사냥대장 볼크의 송곳니 불 야영지. 회색여울 마을은 여섯 시간 아래에 있다."
    people: "주인공은 바르그 사이에서 자랐다 — 무리와 사냥감은 냄새로, 마을 사람은 겉모습과 몇몇 이름으로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"스칼리 — 같은 불가에서 자란 바르그 청년 — 가\"). 이름을 모르는 사람은 겉모습이나 냄새로만 부른다."
    nouns: "'송곳니 불'은 바르그 사냥대의 야영지 이름이다(불 이름이 아니다). '코'는 조합에서 냄새를 쫓는 자를 부르는 말이자 주인공을 부르는 이름이다. '절름발이 수탉'은 마을 배급 막사의 이름이다."
    prompt: "주인공: 코라 불리는 열아홉 살 인간 — 바르그 노예사냥 조합 사냥대장 볼크 회색송곳니의 '코'(인간 사냥개). 다섯 살에 굶주린 언덕의 고사리 밑에서 거두어져 바르그 무리말로 자랐고, 인간의 말은 서툴다. 송곳니 불 야영지에서 형제처럼 자란 바르그 청년 스칼리, 그를 '털 없는 것'이라 부르는 루그와 잔다. 목에 조합 목줄, 소매에 가죽 벗기는 칼, 품에 뼈 호루라기. 지금까지 탈주자 스물셋을 찾아냈고, 마을 인간들은 그를 '언덕의 개'라 부르며 침을 뱉는다. 다섯 살 이전의 이름은 기억하지 못한다."
    awakening: "다만 고사리 밑으로 삐져나온 작은 맨발을 본 뒤로, 냄새가 처음으로 '고기'가 아니라 '사람'으로 맡아진다 — 숨을 참는 쪽이 어떤지를, 이 몸은 기억하지 못하는데 목구멍이 기억한다. 눈가로 잿빛 고리가 스치는 것을 그는 모른다."
    exclude:
      - serf_mother_memory      # 움막 12호의 어머니 게르다 — 셋째의 재능 장면
      - first_night_letter      # 움막 12호, 키트 곁의 첫 밤
      - doorpost_circle         # 움막 12호 문설주의 숯 원
      - martha_price_night      # 키트의 명단을 두고 셋째에게 하는 마르타의 거래
      - hagen_northern_road     # 탈주를 꿈꾸는 농노에게 하는 하겐의 '북쪽 길' — 코는 하겐이 무엇을 파는지 안다
      - death_c_northern_road
      - volk_sniff              # 볼크가 낯선 농노의 냄새를 맡는 장면 — 코는 그의 코다 (주인공 = 볼크의 사냥감)
      - death_b1_lure           # 대수색 날 언덕에 숨은 주인공을 볼크가 잡는 장면 (주인공 = 사냥감) — 코는 사냥대에 있다
      - death_b2_guide          # 즈닉이 '언덕 길을 아는 농노'를 사냥대에 목줄로 붙이는 장면
    perks:
      - 냄새로 사람을 찾는다 — 통찰과 은신이 처음부터 날카롭다
      - 바르그 곁에서는 조합 목줄이 길을 연다 — 언덕은 네 땅이다
      - 볼크의 셈을 가장 먼저 안다 — 하겐의 매듭, 열나흘, 대수색
    burdens:
      - 이름이 없다 — 인간은 처음부터 너를 꺼린다
      - 마을에서는 '언덕의 개' — 침을 맞고, 수탉 문턱을 넘지 못한다
      - 혼자 다니는 목줄은 도망친 개의 표다 — 아비는 거짓말 냄새를 맡는다
    presets:
      - {name: 무리의 코, talents: {shadow_step: 2, beast_friend: 1, tongue: 1, dog_nose: 1}, traits: [varg_blood], stats: {감각: 1, 민첩: 3}}
      - {name: 이중의 개, talents: {shadow_step: 2, tongue: 2, memory_palace: 2, false_face: 2, iron_gut: 1}, stats: {지능: 2, 의지: 2}}
      - {name: 목줄을 끊는 이빨, talents: {knife_hand: 2, command: 2, shadow_step: 2, evade_track: 2, iron_gut: 1}, stats: {근력: 2, 체질: 2}}
