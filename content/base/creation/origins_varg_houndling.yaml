# 출신 — 바르그의 인간 사냥개 '코' (SCENARIOS O-12 origin.varg_houndling). 첫 시대부터 고를 수 있다 (2026-10 결정):
# 고르면 이 사람이 그 시대의 잔향자다 — 회귀점은 AS 312 낙엽월 1일 10시, 굶주린 언덕의 바위틈, 고사리 밑의 맨발.
# 셋째는 이 시대에도 회색여울 강변 움막에 잔향 없이 산다 (게르다·키트는 코의 식구가 아니다).
#
# SCENARIOS → 데이터 (사람)
#   볼크 회색송곳니 ('아비')      → npc_volk (기존). 정본은 낙엽월 14일 '도착'(REGIONS 9.14 확정, 일과의 presence 9/14~). 이 시대에는
#                                  1일 아침 언덕을 지나며 코를 앞세우고(stage), 1일 저녁 송곳니 불에서 '열나흘'을 소나무에 새긴 뒤
#                                  2일 새벽 북쪽(까마귀 문 — 일과의 away)으로 간다. 14일 아침 바르그 넷과 돌아온다 — 정본 그대로.
#   스칼리 (사냥 형제)             → npc_o12_skali (새 B등급, npcs/extra_varg_houndling.yaml)
#   루그 (적대하는 조합 바르그)     → npc_o12_rug (새 B등급). 바알카르의 루가(npc_luga)와 다른 늑대
#   브람 (침)                      → npc_bram — 수탉 문턱을 개에게 닫는다 (access gf_rooster: staff = '몰래'만)
#   시그리드 (언덕의 개를 증오)     → npc_sigrid — AS 309 서리 길 바위틈의 여자 (fact_o12_crevice_309: 그때 코가 호루라기를 불지 않았다)
#   잿빛 실 ('언덕의 개'를 증오)    → 엘사(심지)·브람 — 회색여울 매듭의 첫 길손이 AS 298 코의 부모였다 (fact_o12_first_knot)
#   엘사 (첫 이름을 안다)           → npc_elsa — 강변 움막에서 코를 받아낸 산파. 「첫 이름」에서 input: true_name
#   고사리 밑의 여자와 아이         → 카드 없음. 늑대굴(시그리드) 무리의 사람 — sigrid_group·fugitives_caught 변수로 센다. 아이 이름 리브
#   그로드 (회색여울의 송곳니)      → npc_grod — 회귀점에는 세 소나무에 세워 둔다 (stage)
# 고친 것 (엔진·데이터가 정한 것)
#   냄새 천: 물건으로 두지 않는다 (효과 문법에 물건을 빼앗는 줄이 없다) — 장면의 사물, '잃어버림'은 var o12_cloth_lost
#   '현상금 몫 은화 4닢': 주지 않는다 — 몫은 볼크가 계약을 맺는 열나흘 뒤의 일 (돈 0으로 시작)
#   knowledge.grey_thread_cache_hungry_hill → fact_gf_wolf_den (늑대굴 = 엘사가 아이들을 남쪽으로 보낼 언덕 끝)
#   flag.skali_secret → var o12_skali_secret · memory.hunted_child → var o12_foot_dream
#   스킬: 추적·사냥 38 → 통찰 30, 야외생존·은신 → 은신 22, 운동·맨손격투 → 싸움 20·단련 16, 무리말 30·노예말 5 → 화술 8 + 프롬프트
#   조합 목줄: 통행증이 아니다 (혼자면 '도망친 개' — 회색여울 밖 검문은 통행증 없는 인간으로 본다). 바르그 곁에서의 통행증 효과는
#             장면의 with 조건(스칼리·볼크)과 크릭·통금의 글로, 목줄을 벗어 숨기면(stash) 「브람의 침」이 열리지 않는다 (has 조합목줄)
#   점호 = 아비의 아침 (05:00 송곳니 불, by npc_volk — 볼크가 북쪽에 간 동안에는 루그가 대신 맡는다). 몸수색은 없다 (frisk: false)
#   exclude: 셋째·게르다·키트를 가정하는 회색여울 장면, 그리고 주인공을 볼크의 사냥감으로 보는 장면 (volk_sniff, death_b1_lure, death_b2_guide)
