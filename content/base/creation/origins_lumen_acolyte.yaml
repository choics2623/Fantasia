# O-08 순종의 빛 견습 사제 (SCENARIOS O-08) — 첫 시대에도 고른다 (2026-10 결정: 고른 사람이 그 시대의 잔향자)
# 회귀점: AS 312 낙엽월 1일 19시, 사슬등불 대성당 지하 '침묵의 우물' 맨 밑 — 9번 독방의 쇠창살 앞. 저녁 기도 종이 돌을 타고 내려온다.
#
# SCENARIOS → 루멘 자료 (지역 자료가 이긴다 — 카드·고장·사실이 정본)
#   베른하르트 사제 (55, 비밀리에 끊어진 고리, 스승 신뢰 40) → 신학원장 안셀름 (npc_lm_anselm — 끊어진 고리 신학원 고리의 걸쇠, 견습 일곱을 고리로 기른다)
#   견습 루카 (17, 광신, 밀고자 기질)        → 새 카드 npc_o8_luca (지역 자료에 견습 밀고자가 없다. 견습 니클라스는 겁 많은 '모양 기억'의 아이라
#                                            루카가 아니라 루카의 눈이 갈 수 있는 곳으로 썼다)
#   엘다르 감독관 시엘 고요잎 (세레니엘 휘하) → 수석 감독관 세레니엘 맑은잎 (npc_serenielle — '설명되지 않는 학습 속도' 보고를 모은다. 감사는 그녀의 수집이다)
#   수감자 알베릭                            → npc_alberic (9번 독방). 말투는 카드대로 따뜻한 해라체 — 각성의 "…자네."는 "…너는."
#   대사제 그레고르 7세                       → npc_gregor7 (대사제의 기침 — 종탑 밑 기도실)
#   '병이 나서' 바뀐 앞의 빵 당번 (이름 없음)  → 벤노 (카드 없음 — 사실 fact_o8_benno_*와 장면 안에만. 우물 첫째 층 독방, 낙엽월 17일 첫 장작의 승인서 일곱째 줄)
#   간수                                     → 야코프(우물 문, 바구니) · 오토(간수장, 매달 닷새 회칠) · 정화청 → 접수관 토비아스 · 성가 막사 → 라우렌츠 · 필사 → 오틸리에
#   침묵의 우물 (SCENARIOS: 층마다 감방 하나) → 고장 자료(수감 80, 상층 감방들 + 8번 베라 + 9번 알베릭)에 맞춰: 아홉 층마다 맨 끝에 독방이 하나씩 — 상층의 수십 명은 간수가
#                                            솥으로 먹이고, 아홉 독방의 빵은 서원 견습이 나른다 (간수는 독방의 이단과 말을 섞지 않는다). 가운데는 도르래 밧줄이 늘어진 구멍.
#   스킬: 예법 25·화술 15 → 화술 24 · 학식 20·통찰 12 → 통찰 20 · 응급처치 10 → 손재주 14 · 읽고쓰기 12 (전례 문자 전용 — '이름과 짧은 말')
#   서약 "본 것을 보고하리라" → 변수 o8_oath_kept(아뢴 수)·o8_oath_broken(본 것이 없다고 한 수) + 우물 당번의 저녁 보고(o8_well_report) + 감독관 앞의 서약(감사)
#   추천 조합: 혀의 재능·기억의 궁전·군중의 목소리 / 진명의 귀·잔향의 눈·기억의 궁전 / 혀의 재능·그림자 걸음·거짓 얼굴·박쥐 귀 (모두 있는 id, 10점씩)
