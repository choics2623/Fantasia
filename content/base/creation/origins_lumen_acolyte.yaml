    world: "주인공이 매인 곳은 루멘 성지 — 은빛 강 하중도 위 순종의 빛의 대성당 섬. 엘다르가 교리를 쓰고 인간 사제가 낭독하는 도시이며, 인간의 문해는 재의 법상 사형이다."
    people: "주인공은 신학원에서 열 해를 살았다 — 사제와 견습과 간수는 이름으로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"안셀름 — 신학원장, 문장 끝을 길게 끄는 노인 — 이\"). 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'침묵의 우물'은 우물이 아니라 사슬등불 대성당 지하 아홉 층의 감옥이다(나선 계단, 가운데 도르래 밧줄이 늘어진 구멍, 층마다 맨 끝에 독방). '사슬등불'은 대성당의 이름이다. '서원 마흔셋'은 주인공의 서원 번호이자 신학원에서 부르는 이름이다. 경전 문자판의 '마흔두 글자'는 교단이 허락한 전례 문자다."
    prompt: "주인공: 서원 견습 '마흔셋'이라 불리는 열일곱 살 인간 (진짜 이름은 일곱 살에 신학원 쪽문에서 떠난 어머니만 알았다). 순종의 빛 신학원 견습 기숙사에서 자고, 교단이 허락한 마흔두 전례 글자를 낭독 사제 곁에서 짚는다 — 이름과 짧은 말만 읽고, 그 밖의 글은 재의 법상 죄다. 오늘 저녁부터 침묵의 우물 아홉 독방에 검은 빵을 나른다. 몸이 약하고, 서원했다 — 본 것을 보고하리라."
    awakening: "다만 교단이 허락한 마흔두 글자가 원래 쉰여섯이었다는 것을 — 사라진 열네 글자를 쓸 줄 안다는 것을 — 막 알아 버렸다. 알 리 없는 앎이다."
    exclude: []
    perks: [마흔두 글자를 읽는다 — 이름과 짧은 말, "신학원·대성당·우물 문을 드나든다 (견습의 자리)", 안셀름 원장이 처음부터 스승이다]
    burdens: [서약 — 본 것을 보고하지 않으면 서약을 깬다, 몸이 약하다 — 싸움은 거의 못 한다, 같은 기숙사의 루카가 너를 지켜본다]
