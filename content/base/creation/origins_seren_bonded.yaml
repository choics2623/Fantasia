          - {when: ["var o5_lupo_case == true"], what: "증인이 되어 줄까 — 아직 너를 그만큼 믿지 않는다", until: "312-09-22 13:00"}
          - {what: 같은 서른하나였다 — 밤마다 배 밑창에서 빚을 다시 센다}
    losses:
      - {id: miko_sold, when: ["var o5_miko_sold == true"], text: "갑판에서 미코의 자리가 비었다. 오늘 소금계단에는 휘파람 소리가 없다.", weight: 7}
      - {id: lamp_sold, when: ["var o5_sold_lamp == true"], text: "빚 골목 3층 창에 불이 켜지지 않는다. 숫자를 입으로만 외우던 사람의 창이다.", weight: 6}
