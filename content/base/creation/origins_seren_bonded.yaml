    map: {knowledge: {seren: 3, seren_estuary: 2, coral_quarry: 2, arkas_harbor: 1, grommar_port: 1, oath_isle: 1, lumen: 1, morva_mouth: 1, baalkar: 1}, sketch: [seren_estuary, coral_quarry]}
    world: "주인공이 매인 곳은 세렌 — 나가 상인 의회의 항구 도시. 인간은 '계약민'이다: 빚을 갚으면 자유민이 된다는 약속 아래 상가의 숙소에서 빚으로 먹고 자며 계약 노동을 한다. 돈과 숫자는 합법이고, 숫자 밖의 글자는 벌금이다."
    people: "주인공은 세렌 빚 골목에서 자랐다 — 소금계단과 빚 골목의 사람은 이름이나 빚의 숫자로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"마르셀 — 카셀론 해운의 장부꾼, 빚을 다 갚고도 계단을 떠나지 않은 사내 — 이\"). 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'소금계단'은 카셀론 해운 선착장의 돌계단이다 — 마른 바닷물이 하얗게 피어 계약민들이 그렇게 부른다(소금 나루와는 다른 곳). '빚 골목'은 계약민 숙소 구역, '굽은 닻'은 선술집, '물비늘대'는 나가 경비대다. 세렌 상인들은 금화를 '두카트'라고도 부른다 — 빚은 금화로 센다. 나가는 대가 없이 아무것도 주지 못한다('공짜'는 모욕이다)."
    prompt: "주인공: 펠네라 불리는 스물두 살 인간 계약민 (진짜 이름은 죽은 아버지 펠이 숫자로 새겨 남겼다) — 빚 골목 6층 숙소에서 자고 카셀론 선착장 '소금계단'에서 그물과 갑판 일을 하며, 숫자는 읽지만 글자는 모르고 나가 상인어를 하고 헤엄을 잘 친다. 아버지에게서 물려받은 빚 서른한 금화와 계약서 사본·한 뼘 칼·동전 지갑을 지녔고, 빚 없는 이름을 원한다."
    awakening: "다만 숫자만 읽던 눈에 장부의 낱말이 뜻을 갖기 시작했다 — '분담금'이 읽혔다. 오래된 곡물 창고의 냄새, 남의 손이 쓴 숫자를 기억하는 이상한 감각이 막 깨어났다."
    exclude: []
    perks: [돈을 지녀도 죄가 아니다 — 세렌 안에서는, 숫자를 읽는다 — 장부가 거짓말하는 자리를 안다, 헤엄과 나가 상인어 — 물과 뱀의 도시가 낯설지 않다]
    burdens: [아버지의 빚 서른한 금화 — 오늘 저녁 서른여덟, 열한 시 넘어 숙소 밖이면 벌금이 빚에 붙는다 — 마흔둘이면 산호 채석장, 새벽 줄과 계약 노동 — 낮이 매여 있다]
    presets:
