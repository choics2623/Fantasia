# 세렌 계약민 — SCENARIOS O-05 `origin.seren_bonded`. 2026-10 결정으로 첫 시대부터 고를 수 있다: 고르면 이 사람이 그 시대의 잔향자다.
# 회귀점: AS 312 낙엽월 1일 17:00, 카셀론 해운 선착장 '소금계단' — 급여일 장부 낭독. 장면: storylets/origin_seren_bonded.yaml
# 필드의 뜻은 creation/origins.yaml 머리말과 같다.
#
# ── SCENARIOS의 사람 → 세렌 자료의 사람 ──
#   장부꾼 마르셀 (인간, 목줄단 계약 감독)   → npc_o5_marcel (새 카드, B) — 카셀론 해운의 장부꾼. 세렌 자료에 그 자리의 사람이 없다
#                                               (지휘선의 '계약민 감독(나가·크릭·인간)', REGIONS §9.11 인간 목줄단 '빚 거간꾼')
#   계약민 동료 토비아 (25, 친구 30·경쟁)      → npc_miko ('스물두 해' 미코) — 카셀론 선착장의 갑판꾼. 카드의 빚도 서른하나다
#   채권자 나가 오르셀라 깊은비늘 (이자 상인)  → npc_sr_lucio (루치오 카셀론) — 선주이자 펠의 계약을 쥔 제2의석. '선박 손실'은 그의 보험 장부
#                                               (fact_p2sr_lucio_mortality_books: 사망 보고는 열둘까지)에서 계단으로 내려온다
#   하역 감독 로칸 (인간 밀수꾼, '밤일')        → npc_sr_skre (스크레) — 소금 나루 하역꾼 우두머리, 등록 없는 밤 하역 (fact_p2sr_skre_off_book_23)
#   아버지 펠 (사망)                           → 이름만 — AS 308 긴밤월 14일, 소금 바늘호 갑판에서 떨어졌다
#   그 밖에: 카타리나 셈손 (셈 모임 — 집단 이의) · '반쪽 혀' 오스카 (곱셈, 그리고 '잿빛 실의 남쪽 끝' = 세렌 등잔) ·
#            '빈 장부' 루포 (승계 조항의 날짜 오류 → 정본 9.22의 213번째 무효) · 얀 (지붕 다리) · 레니 (굽은 닻의 소문 '일괄 상환권')
#   모라나 일곱허물은 쓰지 않았다 — 바깥 섬 허물 바위의 은자(일과는 그믐에만 열리는 고인 피의 문)이고 채권자가 아니다.
#
# ── 각색 (지역 자료가 SCENARIOS를 이긴다) ──
#   - '소금계단'은 세렌 배치도에 없다 → 카셀론 해운 선착장(sr_kassalon_dock)의 돌계단을 계약민들이 그렇게 부른다. 잠자리는 빚 골목(sr_debt_alley)
#   - 두카트 = 금화. 빚은 세계 변수 o5_debt (금화 단위): 31 → 급여일 장면에서 38. '지킬 것'이 숫자를 보이고, 업적·맺음이 읽는다
#   - 노임은 손에 쥐는 돈 (duty.work.coin 6동화 — 한 달 은화 열두 닢), 저녁은 매점에서 사 먹는다 (duty.meal.cost 2).
#     빚 쪽 숫자는 노임으로 줄지 않는다 — 상환 공식의 이자가 노동 가치보다 0.3% 높다 (fact_p2sr_dona_formula_03)
#   - 세렌에는 통금이 없다. 계약민이 열한 시 넘어 숙소 밖에 있으면 숙식비 두 배와 벌금 → duty.curfew effects가 빚에 한 닢.
#     새벽 줄(05:30)에 빠지면 계약 노동 불이행 → 한 닢. 마흔둘이 되면 산호 채석장 줄 (o5_quarry_list — 붙잡힘으로 끝난다)
#   - 읽고쓰기 8 (숫자만). 잔향의 각성 뒤 첫 밤에 +12 (o5_letters_stay) — 첫 회차에만: 영혼이 스킬을 기억하므로 겹쳐 쌓이지 않게
#   - 세렌 계약민은 돈을 지녀도 된다 → 새벽 줄에 몸수색이 없다 (frisk: false). 동전 지갑 1두카트 은화 4닢 = 288동화
#   - 빚이 0이 되어도 엔진은 매인 출신을 풀지 못한다 (free는 고정) — 새벽 줄·통금의 빚은 o5_free로 막지만, 세렌을 떠나면 여전히 도주로 센다
