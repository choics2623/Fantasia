      - {id: levy_struck, tp: 2, text: 소금계단의 백열두 줄에서 분담금 일곱이 정지됐다 — 피 한 방울 없이 숫자로, when: ["var o5_levy == off"]}
      - {id: debt_free_name, tp: 3, text: 빚 없는 이름 — 카셀론 장부의 펠의 줄이 비었다, when: ["var o5_debt <= 0"]}
      - {id: one_into_water, tp: 1, text: 등 없는 배의 짐칸에서 한 사람을 검은 물로 내려 보냈다, when: ["var o5_freed_one == true"]}
      - {id: kept_miko, tp: 1, text: 미코를 팔지 않았다 — 서리월이 오도록 같은 계단에서, when: ["date >= 312-10-01", "not var o5_miko_sold == true", "alive npc_miko", "rel_trust npc_miko >= 30"]}
    epilogue:
      - {when: ["var o5_debt <= 0"], text: "카셀론 장부의 펠의 줄은 비었다. 마르셀은 그 줄을 다시 채우지 못했다. 펠네는 그해 겨울에도 소금계단에 앉았다 — 이번에는 제 노임을 세려고."}
      - {when: ["var o5_debt >= 1", "var o5_debt < 42"], text: "펠네의 빚은 그 뒤로도 장부에 있었다. 급여일마다 마르셀이 숨도 쉬지 않고 숫자를 읽었고, 줄은 줄지 않았다."}
      - {when: ["var o5_debt >= 42"], text: "펠네는 절벽 길 수레에 올랐다. 마흔 넘는 짐은 갑판에 두지 않는다 — 카셀론의 규칙이었다. 산호 채석장에서 갚고 나온 사람은 없었다."}
      - {when: ["var o5_levy == off"], text: "그해 가을, 지붕 다리에 백 명이 넘게 올라갔다. 숫자는 합법이었다. 그래서 무서웠다 — 장부를 쥔 쪽에게."}
      - {when: ["var o5_miko_sold == true"], text: "미코는 산호 채석장에서 1,140을 마저 세지 못했다. 등록소 벽의 숫자는 거기서 멈췄다."}
      - {when: ["not var o5_miko_sold == true", "alive npc_miko"], text: "미코는 밤마다 배 밑창에서 빚을 다시 셌다. 어느 날부터 세는 숫자가 둘이 되었다 — 제 것과, 펠네의 것."}
      - {when: ["var o5_freed_one == true"], text: "검은 물로 내려간 아이의 이름은 아무도 몰랐다. 스크레의 장부 상자에는 한 줄이 지워져 있었다."}
    texts:
      count_before_sleep: |
        빚 골목 6층, 넷이 쓰는 방. 같은 방의 셋이 각자의 숫자를 중얼거리다 잠든다. 운하 물이 숙소 기둥을 핥는 소리가 바닥 틈으로 올라온다.

        잠들기 전, 너는 센다.
      wanted_hook: "물비늘대 본부의 등불이 늦게까지 꺼지지 않는다. 계약민 명부의 네 줄 옆에 붉은 점이 하나 더 찍혔다."
      nem_door: "빚 골목 6층 방문"
      gossip_where: "소금계단 줄에서, 매점 창구 앞에서, 굽은 닻에서."
    public:
      npc_o5_marcel: 카셀론의 장부꾼 마르셀
