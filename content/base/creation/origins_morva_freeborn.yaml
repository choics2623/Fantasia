# O-10 모르바 늪 자유민 (docs/world/SCENARIOS.md O-10) — 첫 시대에도 고르는 출신. 이 사람이 그 시대의 잔향자다.
# 회귀점: AS 312 낙엽월 1일 21:00, 뿌리마을 회의 섬 '투표의 원' — 열여섯 살의 첫 뿌리 모임. 장면은 storylets/origin_morva_freeborn.yaml.
#
# SCENARIOS → 지역 자료 (지역 카드·배치도가 이긴다)
#   '버들뿌리 마을'(인구 140, 3대째)   → 뿌리마을 root_village (뿌리나무 아홉 섬, 회의 섬·투표의 원·이름 바구니). '버들'은 마을이 주인공을 부르는 이름으로
#                                       남겼다 — 버들 계보의 딸이 기른 아이라서 (늪에서 아이는 기른 사람의 것으로 불린다)
#   뗏목 열한 개 위의 회의            → 회의 섬은 작아서 뿌리 모임(초하루·보름 밤)에는 섬 둘레에 뗏목 열한 개를 묶는다. 발로 투표한다 — 오른발 찬성, 왼발 반대
#   할머니 헤드비가(35, 겉보기 일흔)   → npc_mv_hedwiga (29, 이른 흰 머리 — 버들 계보의 딸, '물거울' 하나의 정식 제자). AS 302 늪열로 부모를 잃은 여섯 살을 거두었다.
#                                       둥지(26시간)에 산다 — 첫 회의를 보러 물길을 저어 왔다가 새벽 배로 돌아간다. 회귀점의 stage에 세우지만 둥지 사람이라
#                                       엔진의 '이 자리 사람' 목록에는 잡히지 않는다(일과가 둥지에만 있다): 그 밤의 장면 글로 선다. 다른 날은 일곱 노파의 둥지 버들 오두막.
#   셋째 노파 '물거울'                 → npc_hag_hana
#   마을장 몰리(50)                    → npc_mv_alek (뿌리 모임 대표, 47 — "천천히". 노란 둑이 불탄 뒤로 숨는 쪽에 선다)
#   친구 토른(17, 다혈질)              → 새 사람 npc_o10_torn — 대장장이 토르(npc_mv_torr, 쉰의 과묵한 탈주 대장장이)의 풀무를 밟는 열일곱. AS 303 바르그가 늪길로 든 해에 아버지를 잃었다
#   잿빛 실의 뱃사공                   → 장면 글에만 선다 (붉은 갈대 선에서 사람을 받아 오고 그 밤으로 돌아간다)
#   녹테른에서 온 다섯과 아이           → 새 사람 npc_o10_kong '콩'(아홉 살, 다섯 가운데 막내). 어른 넷은 장면 글. 진흙등불(베른)은 겨울 장부가 모자라 받지 못했다
#   바르그 셋 + 인간 사냥개(O-12)       → 바르그 코 셋은 장면 글. 인간은 새 사람 npc_o10_leash '맨발' — 조합 목줄꾼 가운데 하나. O-12의 '코'는 같은 날 아침
#                                       굶주린 언덕에서 볼크의 사냥대 선두에 있다 — 이 세계에서 그는 만난 적 없는 남이고, 맨발은 그가 아니다
#   '늪 입구'                          → 붉은 갈대 선 rv__red_reed_line (녹테른 쪽 늪 가장자리, 뿌리마을에서 7시간). 늪 어귀 morva_mouth(루멘 쪽, 44시간)는 루멘 길의 입구다
#   가라앉은 종탑                      → rv__sunken_belfry (5시간). 떨어진 페이 잿가루(npc_ashdust)가 산다
#   회색여울의 엘사                    → npc_elsa (이름만 안다 — 할머니와 매듭을 주고받는 늙은 약초꾼)
#   마법:물 3                         → 엔진의 진명 '물' (truenames/greyford.yaml, var true_name_water). 할머니의 매듭 장면에서 깨친다 — 영혼에 남는다
#   스킬                              → 야외생존·추적 25 → 통찰·은신 / 궁술 20 → 싸움 / 약학 18 → 통찰·손재주 / 읽고쓰기 15 그대로 / 노예말 20 → 서술(prompt)
#   추천 조합                          → 활의 재능 → 사냥꾼(hunter), 협상 → 흥정(haggle). 나머지는 같은 이름의 재능
