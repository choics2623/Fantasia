      - {when: ["not var o10_retaliation >= 1"], text: "뿌리마을은 그 겨울에도 불 대신 반딧불 병을 들었다. 숨는 것이, 그들이 아는 방법이었다."}
    texts:
      count_before_sleep: |
        건조대 아래 짚자리. 머리 위에서 마른 쑥이 바스락거린다. 문 대신 걸린 가죽 너머, 줄다리 위에서 반딧불 병 하나가 흔들린다.

