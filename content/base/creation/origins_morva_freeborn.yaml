    opening: o10_council_open
    sense: 젖은 뿌리 냄새
    when_word: 밤
    rescue: "눈앞이 하얘진다. 누군가 너를 약초 오두막 침상으로 끌고 간다. 입에 뿌리죽이 흘러든다 — 힐케의 국자다. \"먹었어? 안 먹었잖아.\""
    quiet:
      - 줄다리마다 반딧불 병이 하나씩 꺼진다. 마지막 불 덮기. 솥 쪽에서 힐케가 국자를 한 번 핥는 소리가 난다.
      - 물 위로 장어가 한 번 뒤집힌다. 건조대의 쑥이 바스락거린다. 늪은 오늘 아무도 데려가지 않았다.
      - 북쪽 뿌리나무 위 집에서 누가 노래를 부르다 멈춘다. 가사 없는 노래. 아무도 그만하라고 하지 않는다.
      - 망루에서 호루라기가 짧게 한 번 — 상인. 그다음엔 아무 소리도 없다. 장어 기름 냄새가 오두막 가죽 문 안까지 들어온다.
