    world: "주인공이 사는 곳은 모르바 늪 — 용제국의 법이 닿지 않는 숨은 자유 마을 뿌리마을. 주인 없는 인간들이 뿌리나무 위와 아래, 줄다리로 이은 아홉 섬에 산다. 점호도 배급도 없다 — 공동 솥의 몫과 뿌리 모임의 발이 있을 뿐이다."
    people: "주인공은 뿌리마을에서 나고 자랐다 — 마을 사람은 이름이나 하는 일로 안다(솥지기 힐케, 바구니지기 난네, 대장장이 토르, 알렉 선생). 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"힐케 — 공동 솥의 솥지기, 국자로 사람을 가리키는 노파 — 가\"). 이름을 모르는 사람은 겉모습으로만 부른다. 늪 사람은 높임말을 노파에게만 쓴다."
    nouns: "'뿌리마을'은 모르바 늪의 숨은 자유 마을이다. '뿌리 모임'은 마을 회의 — 초하루와 보름 밤 회의 섬에 서서 발로 투표한다(오른발 찬성, 왼발 반대). '붉은 갈대 선'은 늪이 녹테른 쪽에서 끝나는 경계다. '코'는 바르그 조합의 추적꾼, '목줄꾼'은 조합에 딸린 인간이다. '검은 턱'은 늪의 악어, '잿빛 표'는 늪의 셈 표다."
    prompt: "주인공: 버들이라 불리는 열여섯 살 늪 자유민 (진짜 이름은 할머니 헤드비가만 안다 — 버들 계보의 딸, 스물아홉에 머리가 하얀 양할머니). 뿌리마을 약초 오두막 건조대 아래에서 자랐고, 갈대 활과 뼈 화살, 늪 약초 주머니, 할머니의 매듭 부적을 지닌다. 노예말과 공용어를 하고, 진흙판 학교에서 글자를 이름과 짧은 말만큼 배웠다 — 늪에서는 죄가 아니다. 태어나서 한 번도 주인을 가져 본 적 없다: 늪 밖의 법(인간이 글을 읽거나 활을 들면 죽는다)을 이야기로만 들었고, 고개를 숙이는 법을 모른다."
    awakening: "다만 할머니가 매듭을 풀 때 물의 이름 첫 음절이 들렸고, 입술이 그 소리를 이미 알았다 — 늪물이 한 번 주인공 쪽으로 기울었다. 다 배우지 않은 글자가 읽히는 이상한 감각도 막 깨어났다."
    exclude: []
    perks: [주인이 없다 — 점호도 통금도 없고 늪을 떠나도 탈주가 아니다, 글자를 이름과 짧은 말만큼 안다 — 늪에서는 죄가 아니다, 할머니의 매듭 — 물의 이름이 입술에 걸려 있다]
    burdens: [늪 밖의 법을 모른다 — 활을 멘 채 고개를 들고 다닌다, 늪은 숨는 법만 안다 — 바르그 사냥대가 갈대 선에 왔다, 할머니는 스물여섯 시간 물길 너머 둥지에 산다]
