      - {id: o9_last_ship, at: "312-12-01 05:00", danger: 3, when: ["var o9_list_known == true"], near: "내일 아침 마지막 배가 떠난다. 그 뒤로 섬은 봄까지 닫힌다.", far: "굶주림월 1일, 마지막 배. 그 뒤로 바다는 닫힌다."}
