        coin: 0
        food: null
        story: o9_corridor_errand
        outlaw: false
        sabbath: true
      count: {time: "22:00", at: [gt_scribe_dorm, gt_hole_hidden], by: npc_ar_karba, miss: "소등 종. 경비가 서기 숙소 문에 빗장을 지르며 머릿수를 센다. 하나가 모자란다 — 칠번의 침상.", reason: 소등 점고에 빠졌다, miss_effects: ["var o9_suspicion += 1"]}
      safe: [gt_scribe_dorm, gt_hole_hidden]
      curfew: {caught: "번호 회랑의 경비 등불이 얼굴에서 멈춘다. 목걸이를 뒤집어 번호를 읽는다 — 칠. 창 자루가 정강이를 친다. 서기 숙소 문까지 끌려간다. 경비 장부에 칠번이 한 줄 더 적힌다.", fugitive: "경비 등불이 얼굴에서 멈춘다. \"칠.\" 목걸이를 쥐는 손이 무겁다. 이관을 피한 번호는 경비 장부 맨 위에 있다.", fugitive_why: "통금 순찰에 붙잡혔다 — 달아난 서기로 지하 수집실에 끌려갔다", pain: 12, effects: ["var o9_suspicion += 1"], D: 0}
      desert: "허락 없이 탑을 떠나는 서기는 피험자보다 먼저 찾는다 — 섬에서 나가는 길은 바다뿐이다"
      routine: 귀리죽 → 서기 숙소 → 새벽 측정 종
    opening: o9_ink_open
