      npc_o9_dov: 백열둘 — 칠번 아래 칸의 아이
      npc_ottilie: 기록 보관소장 — 손이 돌이 되어 가는 두르강 학자
      npc_ar_mathis: 귀의 부서장 — 왼쪽 귀가 접힌 용인 학자
      npc_ar_tik: 매듭을 감은 크릭 원로
      npc_irene_bold: 탑주 — 왼눈에 렌즈를 박은 용인
      npc_ar_karba: 잿빛 눈의 대장 — 경비를 부리는 외눈 용인
