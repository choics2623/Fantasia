    epilogue:
      - {when: ["var o9_sold_holes == true"], text: "서른한 권은 탑 마당에서 탔다. 일흔은 그 뒤로 서로의 문장을 다시 쓰지 못했다. 서기실장 자리에는 읽지 못하는 서기가 앉았다."}
      - {when: ["not var o9_sold_holes == true"], text: "구멍 글은 서른한 권에서 서른두 권이 되었다. 마지막 권의 첫 장에 바늘구멍 몇 개 — 서기들은 손가락으로 그것을 이름이라고 읽었다."}
      - {when: ["var o9_dov_taken == true"], text: "백열둘은 수집실에서 질문 셋에 대답하지 못했다. 그 애는 정말로 읽지 못했다. 그것이 대답이었다."}
      - {when: ["var o9_mathis_reader == true"], text: "마티스 그레이브는 끝내 두 목록을 나란히 놓으라고 지시하지 않았다. 그 일은 서기 하나가 했고, 그 서기의 이름은 어느 장부에도 없다."}
      - {when: [], text: "잿빛 탑의 기록에는 한 줄이 남았다. '서기 칠번 — 수면 중 고대 진명어 잠꼬대.' 그 줄 아래, 누군가 서기의 필체로 아주 작게 덧붙였다. '그는 돌아온다.'"}
    texts:
      count_before_sleep: |
        서기 숙소의 층층 침상. 네 아래 칸에서 백열둘이 무릎을 끌어안고 잔다. 판자 벽 안쪽에서 쥐가 종이를 갉는 소리 — 서른한 권 쪽이다.

        잠들기 전, 너는 센다.
      wanted_hook: "잿빛 눈 사무실의 등잔이 늦게까지 꺼지지 않는다. 경비 장부의 칠번 옆에 점이 하나 더 찍혔다."
      nem_door: "서기 숙소 판자 문"
      gossip_where: "필사대의 바늘 구멍으로, 식당의 그릇 줄에서."
    public:
      npc_ar_hester: 서기실장, 먹물 할멈 — 칠번에게 글을 가르쳤다
      npc_milo: 두 자리 건너의 서기 — 입술로 숫자를 센다
