    map: {knowledge: {grey_tower: 3, arkas_harbor: 2, seren: 1, grommar_port: 1, oath_isle: 1, asteria_ruins: 1, lumen: 1, greyford_village: 1}, sketch: [arkas_harbor, seren]}
    world: "주인공이 매인 곳은 아르카스 탑섬 — 잔향 징후자를 모아 연구하는 다종족 학회 '잿빛 탑'의 기록 보관소(재의 서고). 서기 노예는 글을 읽지 못한다고 장부에 적혀 있다."
    people: "주인공은 잿빛 탑의 서기 숙소에서 열두 해를 살았다 — 서고와 회랑의 사람은 번호나 별명으로 안다. 그러나 독자는 모른다: 사람이 **서술에 처음 나올 때** 이름과 함께 누구인지 한 구절로 밝힌다 (예: \"헤스터 — 서기실장, 허리에 바늘 쌈을 찬 노파 — 가\"). 이름을 모르는 사람은 겉모습으로만 부른다."
    nouns: "'재의 서고'는 탑의 기록 보관소이자 서기들의 필사실이다(먼지 서고라고도 한다). '번호 회랑'은 피험자의 방 사백 개가 늘어선 곳. '구멍 글'은 서기들이 바늘 구멍으로 남기는 글이다 — 탑은 '종이 벌레'라 부른다. '칠번'은 주인공의 목걸이 번호이자 부르는 이름이다."
    prompt: "주인공: 칠번이라 불리는 스물네 살 서기 노예 (진짜 이름은 서기실장 헤스터만 안다). 열두 살에 잿빛 탑으로 팔려 와 서기 숙소의 층층 침상에서 자고, 재의 서고에서 학자들의 원고를 모양대로 베낀다 — 서기는 글을 읽지 못한다고 되어 있지만 칠번은 읽는다(드러나면 피험자로 옮겨지고, 탑의 기록을 고치면 처형이다). 손가락 끝이 먹물로 검고, 목에 목걸이 자국, 왼손목 안쪽에 탑 번호 문신이 있으며, 소매에 펜촉 하나를 숨겼다. 용언은 글자로만 조금 알고, 고대 진명어 몇 자를 모양으로 안다. 노예말을 쓴다."
    awakening: "다만 펜촉이 저절로 다른 획을 그으려 한다 — 이 탑이 찾는 '찢어진 시간의 이름'의 첫 획을 손이 안다. 누구의 기억인지 모른다."
    exclude: []
    perks: [글을 읽는다 — 탑의 원고·목록·장부가 열린다, 학자들이 서기 앞에서 무엇이든 쓴다 — 탑의 비밀이 손 아래로 지나간다, 서기 일흔의 구멍 글과 헤스터의 바늘]
    burdens: [읽는다는 것이 드러나면 피험자 — 기록을 고치면 처형, 수집 후보 목록에 네 번호가 있다 — 긴밤월 10일 새벽, 섬이다 — 나가는 길은 바다뿐이다]
    presets:
      - {name: 훔친 글, talents: {memory_palace: 2, forgery: 2}, traits: [echo_eye], stats: {지능: 2, 감각: 2}}
      - {name: 탑의 진명사, talents: {truename_ear: 2, memory_palace: 2, tongue: 2}, stats: {지능: 2, 의지: 2}}
