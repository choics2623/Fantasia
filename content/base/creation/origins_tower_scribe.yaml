    duty:
      rollcall: {at: gt_dust_desk, time: "06:00", by: npc_ar_karba, miss: "새벽 측정 종에 필사대 자리가 비었다. 헤스터가 번호를 부르다 한 번 멈추고, 경비 장부의 칠번 옆에 점 하나가 찍힌다.", miss_effects: ["var o9_suspicion += 1"], frisk: true, frisk_text: "필사대 문가에서 용인 경비가 서기들의 소매와 품을 턴다 — 종이 한 장, 펜촉 하나도 서고를 드나들지 못한다.", wake_text: "소등 빗장이 풀린다. 서기들이 층층 침상에서 내려와 줄을 지어 서고로 간다 — 새벽 측정 종 전에 필사대에 앉아야 한다."}
      wake: "05:00"
      meal: {at: gt_mess, from: "18:30", to: "19:30", label: 피험자 식당 구석에서 서기 몫의 귀리죽을 받는다, hunger: -1, thin: 0.25, with: npc_ar_marga, cost: 0, text: "마르가가 국자를 눈높이로 든다. \"번호? 먼저 먹고 말해.\" 귀리죽에 생선 기름이 한 방울 떠 있다. 서기 몫은 피험자 몫보다 반 국자 많다 — 손이 일을 하니까."}
      work:
        at: gt_dust_desk
        from: "06:00"
        until: "09:00"
        label: 필사대에 앉는다 (저녁 종까지)
        done: "열 시간 필사. 학자의 원고 스무 장이 네 손을 지나 사본이 되었다 — 읽지 않은 것처럼, 모양만."
        fail: "먹이 번졌다. 사본 석 장이 화로로 들어가고, 경비의 자가 손등을 친다. 할당을 못 채운 서기에게 저녁 귀리죽은 없다."
