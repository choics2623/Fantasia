      장부에 적혀 있다 — 그래서 학자들은 서기 앞에서 무엇이든 쓴다. 너는 읽는다. 먹물 할멈 헤스터가 바늘 구멍으로 가르쳤다.
      회귀점은 오후 필사, 네 손이 베끼는 수집 후보 목록의 셋째 줄에 네 번호가 있다.
