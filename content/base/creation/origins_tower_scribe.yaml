# 잿빛 탑 서기 노예 — SCENARIOS O-09 `origin.tower_scribe` (첫 시대부터 고를 수 있다 — 2026-10 결정). 필드의 뜻은 origins.yaml 머리말.
# 이 시대의 잔향자는 서기 칠번이다. 회귀점은 AS 312 낙엽월 1일 14시, 재의 서고 필사대 — 마티스가 내려놓은 수집 후보 목록의 셋째 줄에 칠번의 번호가 있다.
# 셋째는 잔향 없이 회색여울에 있다 (SCENARIOS §1.13) — 이 사람과 아무 사이도 아니다.
#
# SCENARIOS → 자료 (지역 자료가 이긴다 — 장면 파일 storylets/origin_tower_scribe.yaml 머리말에 같은 표):
#   '셋째 필사실' → 재의 서고 필사대 gt_dust_desk · 펠릭 회색혀 → 마티스 그레이브 npc_ar_mathis · 노파 테클라 → '먹물 할멈' 헤스터 npc_ar_hester
#   말 없는 요나스 → 0307호 네레 npc_ar_nere + 0213호의 노인 npc_ar_old0213 · 동료 서기 → '잉크' 마일로 npc_milo, 서기 요나 npc_ar_yona, 새 사람 도브 npc_o9_dov
#   탑주 이레네 볼드 npc_irene_bold (칠번을 모른다) · 관찰실 → 지하 수집실 gt_collection_room · 즉결 처형(재의 법) → 탑 안에서는 '읽음 = 피험자 전환', '기록 고침 = 처형' (REGIONS 10.7)
#   스킬: 읽고쓰기 35(비밀) · 학식 25 + 통찰 15 → 통찰 22 · 손재주 20 · 용언 10(글자로만) · 고대 진명어 6과 노예말은 prompt 줄로
#   소지품: 숨긴 깃펜 촉 → o9_nib(소매) · 서기 목걸이 '7번'과 먹물 손가락 → 몸의 것(결점 '노예 낙인'과 flaw_note) · 상선 시간표(머릿속) → fact_o9_salt_ledger
#   추천 조합: 「훔친 글」 기억의 궁전 수재 4 + 위조 수재 4 + 잔향의 눈 4 / 「탑의 진명사」 진명의 귀·기억의 궁전·혀의 재능 수재 / 「도망치는 서기」 그림자 걸음 수재 4 + 혀의 재능 수재 4 + 서기 수재 2 + 무쇠 위장 소질 1 + 거짓 얼굴 소질 1 — 모두 10 + 낙인 2 = 12
