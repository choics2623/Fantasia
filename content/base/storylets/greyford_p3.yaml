# 큰 시스템의 가장 작은 판 (P3) — 작전 하나, 연애 하나, 진명 하나.
storylets:
  # ── 연애·가족의 가장 작은 판 (12 §2): 사라 — 가까워지면, 고백, 그리고 끈혼례 ──
  - id: sara_confession
    trigger: {window: {from: "312-09-05 06:00", to: "313-12-30 00:00"}, with: npc_sara, when: ["romance npc_sara >= 2", "var sara_lover != true"]}
    text: |
      사라가 우물 두레박줄을 감다 말고 멈춘다. 손등에 물이 흐른다. 그녀가 너를 보지 않고 말한다.

      "너는 왜 자꾸 내 쪽으로 오니." 묻는 말이 아니다.
    choices:
      - id: hold
        label: 젖은 손을 잡는다
        text: |
          그녀의 손이 차다. 빼지 않는다. 한참 뒤에 그녀가 말한다. "바보." 그리고 처음으로, 그녀가 웃는다.
        effects: ["var sara_lover = true", "rel npc_sara like 15", "rel npc_sara trust 10", "bond npc_sara 10", "note 사라 — 우물가에서, 젖은 손"]
      - id: not_yet
        label: '"…물이 차가워서."'
        text: |
          사라가 두레박줄을 마저 감는다. "그래. 물이 차가워서." 그녀는 물동이를 들고 간다. 한 번도 돌아보지 않는다. 그래도 걸음이 느리다.
        effects: ["rel npc_sara like 3"]
  - id: sara_ribbon
    trigger: {window: {from: "312-09-12 18:00", to: "313-12-30 00:00"}, at: gf_chapel, with: npc_sara, night: true, when: ["var sara_lover == true", "var sara_bound != true"]}
    text: |
      예배당 뒤, 납골실로 내려가는 계단 옆. 사라가 앞치마 끈 하나를 풀어 손에 든다. "노예는 혼인을 못 해. 그러니까 이건 혼인이 아니야."

      그녀가 끈의 한쪽 끝을 내민다.
    choices:
      - id: tie
        label: 끈을 손목에 감는다
        text: |
          끈이 두 손목을 한 번 돈다. 매듭은 사라가 묶는다. 서리말 매듭이다 — 그녀는 그것을 어디서 배웠을까. 오스릭 사제가 계단 위에서 그것을 보고, 못 본 척 등불을 끈다.

          끈혼례. 증인은 꺼진 등불 하나.
        effects: ["family bound npc_sara", "var sara_bound = true", "bond npc_sara 15", "rel npc_sara trust 15", "temper 충성 5", "note 끈혼례 — 사라와. 증인은 꺼진 등불 하나"]
      - id: refuse
        label: '"둘째 명단이 지나면."'
        text: |
          사라가 끈을 다시 앞치마에 묶는다. "그래. 둘째 명단이 지나면." 그 말을 그녀는 믿지 않는다. 너도.
        effects: ["rel npc_sara trust -5"]

  # ── 진명의 가장 작은 판 (GAME_DESIGN §5, 01 §3.5): 엘사가 가르치는 낱말 하나 ──
  - id: elsa_word
    trigger: {window: {from: "312-09-02 06:00", to: "313-12-30 00:00"}, at: gf_elsa_hut, with: npc_elsa, when: ["rel_trust npc_elsa >= 40"]}
    text: |
      엘사가 솥을 들어 올린다. 솥 밑 흙 속에서 뼈판 하나. 긁힌 금이 셋.

      "이건 글자가 아니다. 이름이다. 불의 이름. 불은 자기 이름을 부르는 자를 태우지 않는다 — 대신 다른 것을 태우지. 네 체온이라든가."
    choices:
      - id: learn
        label: 그 이름을 따라 한다
        text: |
          혀끝이 뜨겁다. 엘사가 네 입을 손으로 막는다. "소리 내지 마라. 속으로. 이 이름을 아는 인간은 재의 법으로 탄다."

          그 금 셋이 눈 안쪽에 남는다. 회귀해도 지워지지 않을 것 같다.
        effects: ["var true_name_fire = true", "note 진명 — 불. 불의 근원. 엘사의 뼈판. 소리 내지 말 것", "rel npc_elsa trust 5"]
      - id: refuse
        label: 고개를 젓는다
        text: |
          "현명하구나." 엘사가 뼈판을 다시 묻는다. "아니면 겁쟁이거나. 둘은 자주 같은 얼굴이지."
        effects: []

  # ── 진명 — 더 많은 낱말 (각기 다른 근원) ──
  - id: elsa_word_see
    trigger: {window: {from: "312-09-03 06:00", to: "313-12-30 00:00"}, at: gf_elsa_hut, with: npc_elsa, when: ["var true_name_fire == true", "rel_trust npc_elsa >= 60", "var echo_named == true"]}
    text: |
      엘사가 뼈판을 다시 꺼낸다. 이번엔 두 번째 금. "불을 아는 자는 빛도 알아야 한다. 안 그러면 불만 보고 산다."
    choices:
      - id: learn
        label: 두 번째 이름을 받는다
        text: "눈 안쪽이 시리다. 그 금이 눈꺼풀 뒤에 붙는다."
        effects: ["var true_name_see = true", "note 진명 — 보다. 빛의 근원. 엘사의 두 번째 금"]
  - id: sigrid_word_water
    trigger: {window: {from: "312-09-03 06:00", to: "313-12-30 00:00"}, at: hungry_hill__wolf_den, with: npc_sigrid, when: ["domain_has memory_wall"]}
    text: |
      기억의 벽 앞. 시그리드가 죽은 이들의 룬 사이에서 하나를 가리킨다. 이름이 아니다. "서리 길에서 우리를 살린 말이다. 물이 얼지 않게 하는 말."
    choices:
      - id: learn
        label: 그 룬을 손가락으로 따라 긋는다
        text: "손가락 끝이 젖는다. 바위가 마른데도."
        effects: ["var true_name_water = true", "note 진명 — 물. 물의 근원. 시그리드의 룬 벽"]
  - id: ossuary_word_close
    trigger: {window: {from: "312-09-02 06:00", to: "313-12-30 00:00"}, at: gf_chapel_ossuary, when: ["pknows fact_gf_osric_letter_copies"]}
    text: |
      납골실 벽감. 빛의 서신 필사본의 귀퉁이에, 오스릭의 글씨가 아닌 금 셋이 있다. 오래된 것이다. 서신보다 오래된.
    choices:
      - id: learn
        label: 그 금을 외운다
        text: "외우는 순간 등 뒤의 철문이 덜컹 흔들린다. 바람은 없다."
        effects: ["var true_name_close = true", "note 진명 — 닫다. 돌의 근원. 납골실 필사본의 귀퉁이"]

  # ── 가족 (12 §6~8) — 출산, 인질 ──
  - id: family_birth
    dynamic: true
    severity: 4
    input: child_name
    text: |
      강변 움막 12호. 새벽. 사라의 손톱이 네 손등에 박힌다. {birth_helper}

      울음소리. 작고, 화가 나 있다. 살아 있다.
    after_input: |
      "{child}." 사라가 그 이름을 소리 없이 따라 한다.

      이 아이는 이 회차에만 있다. 너는 그것을 안다. 사라는 모른다.
    effects: []
  - id: family_hostage
    dynamic: true
    severity: 4
    text: |
      감독관 초소 앞에 사람들이 모여 있다. 채찍 기둥에 묶인 것은 {hostage}이다. 즈닉이 군중을 향해 말한다 — 너를 보지 않고, 너에게. "셋째. 해가 지기 전에 와라. 아니면 이 아이가 네 대신 선다."
    choices:
      - id: surrender
        label: 걸어 나간다
        text: "군중이 갈라진다. 즈닉이 웃는다. 밧줄이 손목에서 {hostage}의 손목으로가 아니라, 네 손목으로 옮겨 간다."
        effects: ["captured 가족 대신 걸어 나갔다 — 채찍 기둥"]
      - id: ransom
        label: 두 발톱을 들고 초소 뒷문으로 간다
        needs: "coin >= 24"
        text: "즈닉은 동전을 세지 않는다. 받기만 한다. 해 질 녘, {hostage}이(가) 풀려난다. 즈닉의 장부에 네 이름 옆 숫자가 하나 는다."
        effects: ["coin -24", "family ransom"]
      - id: turn_away
        label: 외면한다
        text: "해가 진다. 너는 초소 쪽을 보지 않는다. 채찍 소리는 강변 움막까지 들린다."
        effects: ["family abandon", "stress 20", "temper 충성 -8"]
  # 양육 (12 §7.2): 다섯 살 — 아이는 묻지 않는 법을 배웠다가, 한 번은 묻는다
  - id: child_question
    dynamic: true
    severity: 2
    text: |
      강변 움막 12호. 등잔 심지가 짧다. {child}이(가) 네 소매를 당긴다.

      "왜 우리는 주인이 있어?"

      사라가 바느질을 멈춘다. 벽이 얇다. 옆 움막에 누가 사는지 너는 안다.
    choices:
      - id: truth
        label: 사실대로 말한다 — 낮은 목소리로
        text: '너는 붉은 길 이야기를 한다. 오백 명. 다라라는 이름. {child}은(는) 끝까지 듣고, 아무 말도 하지 않고, 네 손을 꼭 쥔다. 다음 날 아침 아이는 채찍 기둥 앞을 지나며 고개를 숙이지 않는다. 사라가 아이의 머리를 눌러 숙이게 한다.'
        effects: ["family child_temper 용기:15", "family child_temper 정직:10", "var child_told_truth = true", "temper 정직 3"]
      - id: lie
        label: '"원래 그런 거야."'
        text: '{child}이(가) 고개를 끄덕인다. 믿는다. 너는 그 끄덕임이 언젠가 이 아이를 살릴 거라고 생각한다. 아니면 이 아이를 영영 노예로 만들 거라고.'
        effects: ["family child_temper 용기:-10", "family child_temper 충성:5", "temper 정직 -2"]
      - id: question
        label: '"넌 왜 그렇다고 생각해?"'
        text: '{child}이(가) 한참 생각한다. "…주인이 더 크니까?" 그리고 다시 생각한다. "근데 브란 아저씨가 더 커." 사라가 웃음을 터뜨린다. 처음 듣는 소리다.'
        effects: ["family child_temper 정직:5", "family child_temper 용기:5"]
  # 즈닉을 앤의 무덤으로 (fact_gf_znik_anne의 공개 조건 — "데려갔을 때만, 그 자리에서 무너진다")
  - id: znik_to_grave
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: gf_whip_square, with: npc_znik, night: true, when: ["pknows fact_hi_anne_grave", "not pknows fact_gf_znik_anne", "alive npc_znik"]}
    severity: 2
    text: |
      즈닉이 초소 문턱에 앉아 있다. 혼자다. 너는 그 옆에 선다. 말 대신 손을 내민다 — 오물 습지 쪽으로.

      "뭐." 노란 눈이 습지 쪽을 본다. 오래 본다.
    choices:
      - id: lead
        label: '"앤이 거기 있어."'
        minutes: 240
        check: {skill: 화술, D: 45, warn: ["pknows fact_gf_znik_wet_himself"]}
        success:
          text: |
            처형터 가장자리, 낮은 말뚝. 즈닉이 그 앞에 쪼그려 앉는다. 채찍이 손에서 미끄러진다. 한참 뒤에 그가 말한다. 너에게가 아니라 말뚝에게.

            "빵을 어디서 났냐고 물었어. 주인이. 나는 — 나는 말했어. 앤이 줬다고. 그게 다야. 그게 다였어."
          effects: ["learn fact_gf_znik_anne", "rel npc_znik trust 10", "memory npc_znik 이상함 셋째는 앤의 무덤을 안다"]
        failure:
          text: '"꺼져." 채찍 끝이 네 발치를 친다. 그러나 그날 밤 초소의 등불은 늦게까지 습지 쪽을 향해 있다.'
          effects: ["rel npc_znik like -5"]
      - id: withdraw
        label: 손을 거둔다
        text: '즈닉이 침을 뱉는다. 습지 쪽은 다시 보지 않는다.'
        effects: []
  # 마르타가 스스로 꺼내는 말 (fact_gf_martha_confession — "마르타 스스로 말한 뒤에도 그는 확인해 주지 않는다")
  - id: martha_counts
    trigger: {window: {from: "312-09-05 06:00", to: "330-12-30 00:00"}, at: "@greyford", with: npc_martha, night: true, when: ["rel_trust npc_martha >= 60", "not pknows fact_gf_martha_confession"]}
    severity: 2
    text: |
      마르타가 등불 심지를 낮춘다. 리즈가 잠든 쪽을 한 번 본다.

      "나는 죽인 사람을 셀 수 있다. 오스릭에게 그렇게 말했지. 성 마렌 축일에." 그녀가 웃는다. 웃음이 아니다. "그 사제는 아무에게도 말하지 않을 거다. 너도."
    choices:
      - id: listen
        label: 아무 말도 하지 않는다
        text: '마르타가 숫자를 하나씩 센다. 손가락으로. 열을 넘기고, 다시 처음부터. 이름은 하나도 말하지 않는다.'
        effects: ["learn fact_gf_martha_confession", "rel npc_martha trust 5"]
  # 엘사가 먼저 다가온다 (14 §3.4 — 굶주림월 10일, 마르타가 수탉 지하의 냄새를 알아채는 날)
  - id: elsa_dream_question
    trigger: {window: {from: "312-12-10 06:00", to: "312-12-11 06:00"}, at: "@greyford", with: npc_elsa}
    severity: 2
    text: |
      엘사가 네 소매를 잡는다. 늙은 손이 차다. 사람들 사이에서, 아무도 보지 않는 틈에.

      "너는 꿈을 꾸지? 같은 아침을 아홉 번 사는 여자 꿈."
    choices:
      - id: admit
        label: 고개를 끄덕인다
        text: '엘사가 숨을 길게 내쉰다. "그 여자는 아홉 번째에 하늘을 봤다. 너는 몇 번째냐." 대답을 기다리지 않는다. "세지 마라. 세는 순간 무거워진다."'
        effects: ["rel npc_elsa trust 15", "memory npc_elsa 이상함 셋째는 다라의 꿈을 꾼다", "var elsa_knows_dreams = true", "note 엘사 — 다라의 꿈을 안다"]
      - id: deny
        label: '"무슨 꿈이요."'
        text: '엘사가 손을 놓는다. "그래. 나도 그렇게 말했지. 처음에는."'
        effects: ["rel npc_elsa trust 3"]
  # 옛 돌 고리 잔상 (14 §3.4 — 재의 날 3일 밤): 붉은 길의 처형 잔상. 다라의 얼굴이 한순간 너의 얼굴이 된다
  - id: stone_ring_afterimage
    trigger: {window: {from: "312-13-03 20:00", to: "312-13-04 04:00"}, at: old_stone_ring, night: true}
    severity: 3
    text: |
      옛 돌 고리. 서리가 돌 위에서 빛난다. 돌 사이에 사람들이 서 있다 — 아니, 서 있었다. 오백. 목에 밧줄 자국. 맨 앞의 여자.

      여자의 얼굴이 한순간 네 얼굴이 된다. 그리고 다시 여자의 얼굴. 여자가 입 모양으로 말한다.

      "또 와."
    choices:
      - id: stay
        label: 돌 사이에 선다 — 끝까지 본다
        text: '잔상이 하나씩 꺼진다. 맨 끝까지 너를 보던 것은 여자였다. 마지막 하나가 꺼질 때 너는 그 이름을 소리 내어 부른다. 다라.'
        effects: ["stress 10", "var dara_seen = true", "note 옛 돌 고리 — 다라가 '또 와'라고 했다"]
      - id: flee
        label: 뒷걸음질 친다
        text: '돌 고리를 벗어나자 서리가 다시 서리가 된다. 등 뒤에서 아무 소리도 나지 않는다. 그게 더 무섭다.'
        effects: ["fear 1"]
