# 다른 거점들의 대본 장면 (회색여울 밖) — 각 거점의 목표 행동(정본 사건)에 손을 댈 수 있는 자리.
# 장소는 거점 단위(@거점)로 건다. 시각과 세계 변수가 맞을 때만 열린다.
storylets:
  # ── 까마귀 문: 물빼기 굴의 밤 (정본 10.3) → 레아의 보고서 (10.25) ──
  - id: cg_drain_night
    trigger: {window: {from: "312-10-03 20:00", to: "312-10-04 05:00"}, at: "@crow_gate", night: true, when: ["var cg_looked_away == true"]}
    severity: 3
    text: |
      북문 망루에 불이 없다. 처음 보는 일이다. 물빼기 굴 쇠창살 아래에서 무언가가 기어 나온다 — 사람이다. 하나, 둘. 얼음이 수염에 붙어 있다. 열둘.

      마지막 둘은 기어 나오지 못한다. 앞사람이 발목을 잡아끈다. 움직이지 않는다.
    choices:
      - id: carry
        label: 얼어붙은 사람을 업는다 — 세탁장 화덕 쪽으로
        check: {skill: 은신, D: 45}
        success:
          text: '등이 얼음처럼 차다. 세탁장 문이 안에서 열린다. 마그다라는 늙은 여자가 아무것도 묻지 않고 화덕 앞을 비운다. 새벽에 업고 온 사내의 손가락이 움직인다.'
          effects: ["var cg_twelve_alive += 1", "temper 자비 4", "note 까마귀 문 — 물빼기 굴에서 나온 열둘. 하나를 세탁장 화덕으로 옮겼다", "var cg_drain_seen = true"]
        failure:
          text: '순찰 횃불이 모퉁이를 돈다. 너는 사내를 눈 속에 내려놓고 짐꾼 막사로 뛴다. 아침에 이름 없는 돌무더기가 하나 늘었다.'
          effects: ["var cg_buried += 1", "fear 2", "var cg_drain_seen = true"]
      - id: watch
        label: 그늘에서 본다 — 끝까지
        text: '열둘 가운데 열이 담장 그늘로 사라진다. 망루의 어둠 속에서 누군가도 보고 있었다. 반쪽 얼굴의 비늘이 달빛에 젖는다. 카스파르는 너를 보았다. 아무 말도 하지 않는다.'
        effects: ["var cg_drain_seen = true", "note 까마귀 문 — 카스파르가 굴 쪽을 보지 않았다. 일부러"]
  - id: cg_lea_desk
    trigger: {window: {from: "312-10-23 06:00", to: "312-10-25 11:00"}, at: "@crow_gate", when: ["alive npc_lea", "var cg_looked_away == true", "var cg_report_filed != true", "var cg_report_stopped != true"]}
    severity: 3
    text: |
      부관실 문틈. 레아가 은밀랍을 녹이고 있다. 책상 위에 양피지 한 장 — 맨 윗줄에 「사령관 카스파르는 10월 3일 밤」.

      레아가 고개를 든다. 너를 본다. 펜을 내려놓지 않는다.
    choices:
      - id: talk
        label: '"그걸 보내면 이 성문은 아우락스 사람 손에 갑니다."'
        check: {skill: 화술, D: 55, warn: ["var cg_drain_seen == true"]}
        success:
          text: '레아가 오래 너를 본다. "…짐꾼이 그걸 어떻게 알지." 대답을 기다리지 않는다. 양피지가 등잔 불에 말린다. "넌 여기 온 적 없다."'
          effects: ["var cg_report_stopped = true", "rel npc_lea trust 10", "note 레아의 방관 보고서 — 불탔다"]
        failure:
          text: '"짐꾼 반장에게 네 이름을 물어보마." 문이 닫힌다. 그날 저녁 군터가 너를 노려본다.'
          effects: ["wanted 1 부관실을 엿봤다"]
      - id: steal
        label: 밤에 다시 온다 — 봉인 전에
        check: {skill: 손재주, D: 60}
        success:
          text: '양피지는 네 소매 안에서 바스락거린다. 다음 날 레아는 책상 서랍을 세 번 연다. 다시 쓰기에는 날짜가 늦었다.'
          effects: ["var cg_report_stopped = true", "item lea_report", "note 레아의 방관 보고서를 훔쳤다 — 용언으로 쓰여 있다"]
        failure:
          text: '서랍이 끽 소리를 낸다. 부관실 문 밖에서 군화 소리.'
          effects: ["wanted 2 부관실 서랍", "pain 15"]
      - id: leave
        label: 물러난다
        text: '레아의 펜 소리가 등 뒤에서 이어진다.'
        effects: []
  # ── 용주 역참: 우편함 (정본 10.26) ──
  - id: dp_report_swap
    trigger: {window: {from: "312-10-25 14:00", to: "312-10-26 04:30"}, at: "@dragon_pillar_post", when: ["var cg_report_filed == true", "var cg_report_collected != true"]}
    severity: 2
    text: |
      역참 우편함. 은밀랍 봉인이 하나 — 까마귀 문 부관의 문장이다. 내일 새벽이면 이스멜이 가져간다.
    choices:
      - id: swap
        label: 봉인을 따고 속을 바꾼다
        check: {skill: 손재주, D: 55}
        success:
          text: '양피지 대신 짐꾼 할당표 한 장. 봉인은 손톱 끝으로 다시 붙는다. 바알카르의 책상에 오르는 것은 숫자뿐일 것이다.'
          effects: ["var cg_report_filed = false", "var cg_report_stopped = true", "item lea_report", "learn fact_gf_lea_report_route", "note 역참 우편함 — 방관 보고서를 바꿔치기했다. 매달 25일, 이 우편함"]
        failure:
          text: '봉인이 쪼개진다. 다시 붙지 않는다. 너는 우편함을 닫고 떠난다. 이스멜은 쪼개진 봉인을 볼 것이다.'
          effects: ["wanted 2 역참 우편함"]
      - id: leave
        label: 손대지 않는다
        text: '우편함 뚜껑이 바람에 덜컹인다.'
        effects: []
  # ── 바알카르: 계단의 아이 (REGIONS §1.13 씨앗 1) → 등잔 회합 ──
  - id: bk_noeul_stairs
    trigger: {window: {from: "312-10-15 06:00", to: "312-11-01 00:00"}, at: "@baalkar", when: ["alive npc_noeul", "var bk_noeul_protected != true"]}
    severity: 3
    text: |
      궁 뒤편 공물 계단. 인간 아이 하나가 빈 바구니를 안고 앉아 떨고 있다. 공물 운반자 표식. 노을이라고 한다.

      "알이 갈라지는 소리를 들었어요. 흰 알. 말하면 안 되는 거죠?" 아이가 네 소매를 잡는다. "말 안 했어요. 아무한테도. 근데 다들 나를 봐요."
    choices:
      - id: hide
        label: 아이를 짐 속에 숨겨 데리고 나간다
        check: {skill: 은신, D: 55}
        success:
          text: '바구니가 하나 더 무거워진다. 쇠다리 검문소에서 경비가 바구니를 찌른다. 짚이다. 아이는 그 밑에서 숨도 쉬지 않았다.'
          effects: ["var bk_noeul_protected = true", "var bk_noeul_seen = true", "temper 자비 5", "note 바알카르 — 노을을 숨겨 데리고 나왔다 (흰 알의 균열을 들은 아이)"]
        failure:
          text: '검문소. 경비가 바구니를 뒤집는다. 아이가 굴러 나온다. 너는 달린다. 아이는 달리지 못한다.'
          effects: ["var bk_noeul_seen = true", "wanted 3 궁 노예를 빼돌리려 했다", "stress 15"]
      - id: tell
        label: '"아무 말도 하지 마. 아무것도 모르는 얼굴로."'
        text: '아이가 고개를 끄덕인다. 너는 그 얼굴이 그 연습을 할 시간이 있기를 바란다.'
        effects: ["var bk_noeul_seen = true"]
  - id: bk_lamp_carry
    trigger: {window: {from: "312-11-21 06:00", to: "312-11-23 20:00"}, at: "@baalkar", when: ["var bk_tilde_heard == true", "var bk_lamps_warned != true"]}
    severity: 3
    text: |
      시종 노예 하나가 네 옆을 스치며 등잔 심지 하나를 떨어뜨린다. 심지에 실이 감겨 있다. 풀면 글자다 — 「대숙청. 하수도 셋째 갈래. 오늘 밤.」
    choices:
      - id: carry
        label: 하수도로 내려간다
        check: {skill: 은신, D: 50}
        success:
          text: '셋째 갈래. 등잔 일곱. 얼굴은 없다. 네가 실을 내밀자 등잔 하나가 꺼진다 — 들었다는 뜻이다. 맹약회의 안건은 이제 그들도 안다.'
          effects: ["var bk_lamps_warned = true", "note 바알카르 — 등잔 회합에 '잔향 대숙청' 안건을 넘겼다"]
        failure:
          text: '셋째 갈래 입구에 비늘 경비가 있다. 너는 실을 삼킨다.'
          effects: ["fear 2"]
      - id: drop
        label: 심지를 하수구에 버린다
        text: '실은 물살에 풀린다. 글자도.'
        effects: []
  # ── 잿불 언덕: 손바닥 자국 → 셋꼬리 닛의 코 ──
  - id: em_handprint
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: "@ember_mines", when: ["var em_crackdown != true", "var em_handprint_done != true", "alive npc_caleb_dara"]}
    severity: 2
    text: |
      9번 갱 막장. 칼렙이 등잔을 벽에 댄다. 손바닥 자국. 수십, 수백. 숯과 피로 찍은 것. 가장 오래된 것은 손가락이 넷이다.

      "붉은 길. 다라 아버지의 손이다." 칼렙이 숯 그릇을 내민다. "찍으면 이름이 남는 게 아냐. 손이 남지."
    choices:
      - id: press
        label: 손바닥을 찍는다
        text: '숯이 차다. 벽은 따뜻하다. 네 손자국이 다른 손자국들 사이에 끼어든다. 크기가 거의 같다.'
        effects: ["var em_handprint_done = true", "var em_signs += 1", "temper 용기 3", "rel npc_caleb_dara trust 15", "note 잿불 언덕 — 9번 갱 막장에 손바닥을 찍었다"]
      - id: withdraw
        label: 손을 거둔다
        text: '칼렙은 실망하지 않는다. "다음에." 다음이 있다는 듯이.'
        effects: ["var em_handprint_done = true"]
  - id: em_nit_nose
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: "@ember_mines", with: npc_nit_threetail, when: ["var em_signs >= 4", "var em_crackdown != true", "var em_nit_bought != true"]}
    severity: 3
    text: |
      셋꼬리 닛이 배급소 줄을 따라 걷는다. 코를 벌름거린다. 네 앞에서 멈춘다. "숯 냄새. 9번 갱 막장 냄새." 세 꼬리 중 하나가 바닥을 친다. "누가 벽에 손을 찍지. 이름 하나만 주면 넌 위층 갱으로 옮겨 주마."
    choices:
      - id: bribe
        label: 발톱을 쥐여 준다 — 입을 다물라고
        needs: "coin >= 18"
        text: '닛이 동전을 이로 깨문다. "숯 냄새는 원래 나는 거지." 그는 승진을 한 철 미룬다. 한 철만.'
        effects: ["coin -18", "var em_nit_bought = true"]
      - id: threat
        label: '"반장이 오물 갱에서 뭘 파는지 하드리안이 알면?"'
        check: {skill: 위압, D: 60}
        success:
          text: '세 꼬리가 동시에 굳는다. 닛이 웃는다 — 너무 크게. "농담도 못 하냐." 그날부터 그는 9번 갱 앞을 돌아서 간다.'
          effects: ["var em_nit_bought = true"]
        failure:
          text: '"하드리안?" 닛이 웃는다. 진짜로. 그날 밤 네 이름이 감독 막사 판에 분필로 적힌다.'
          effects: ["wanted 2 셋꼬리 닛의 판", "var em_signs += 2"]
      - id: name
        label: 이름 하나를 준다
        text: '네 입에서 나온 이름이 공기 중에 오래 남는다. 닛이 고개를 끄덕인다. 위층 갱은 덜 덥다. 그것뿐이다.'
        effects: ["var em_crackdown = true", "temper 충성 -8", "deed inform"]
  # ── 루멘: 요나스의 사본 (정본 11.11) → 침묵의 우물 ──
  - id: lm_jonas_copy
    trigger: {window: {from: "312-11-11 18:00", to: "312-11-12 06:00"}, at: "@lumen", when: ["alive npc_lm_jonas", "var lm_list_copy != true"]}
    severity: 2
    text: |
      대성당 서고 뒤 골목. 공물 서기 요나스가 너를 불러 세운다. 처음 보는 사람이다. 그런데 너를 고른 것 같다.

      그가 접힌 양피지를 내민다. 공물 명단 사본. 이름 위에 줄이 그어진 자국 — 지우다 만 자국이 일부러 남아 있다.

      {read|마흔 줄. 줄 그은 이름 열둘. 맨 아래 지워지지 않은 이름 하나 — 알베릭, 9번 독방.} "원본에서는 지웠소. 사본에는 남겼소. 누군가는 알아야 하니까."
    choices:
      - id: take
        label: 사본을 받는다
        text: '양피지가 따뜻하다. 요나스는 벌써 골목 끝에 있다. 돌아보지 않는다.'
        effects: ["var lm_list_copy = true", "item tribute_copy", "note 루멘 — 요나스의 공물 명단 사본. 지운 자국이 남아 있다"]
      - id: strike
        label: 사본으로 정화청 목록의 이름을 지운다 — 원본에 손을 댄다
        check: {skill: 손재주, D: 60}
        success:
          text: '정화청 서기실, 촛불 하나. 너는 요나스의 글씨를 흉내 낸다. 열두 이름 위에 줄. 내일 장작은 모자랄 것이다.'
          effects: ["var lm_list_copy = true", "var lm_impure -= 12", "note 루멘 — 정화청 목록에서 열둘을 지웠다"]
        failure:
          text: '서기실 문이 열린다. 수도사의 등잔이 네 얼굴을 비춘다.'
          effects: ["var lm_list_copy = true", "wanted 3 정화청 서기실", "var lm_impure += 1"]
  - id: lm_silent_well
    trigger: {window: {from: "312-09-10 06:00", to: "330-12-30 00:00"}, at: "@lumen", night: true, when: ["alive npc_alberic", "var lm_alberic_escaped != true", "pknows fact_lu_alberic_cell9"]}
    severity: 4
    text: |
      침묵의 우물. 아홉 층 아래에 9번 독방. 요나스의 사본 맨 아래, 지워지지 않은 이름 하나 — 알베릭. 아홉 해째.

      우물 밧줄이 바람에 흔들린다. 지키는 수도사는 자정 기도에 간다. 사십 분.
    choices:
      - id: down
        label: 내려간다
        check: {skill: 은신, D: 65}
        success:
          text: '9번 독방의 남자는 빛을 보고 눈을 감는다. 아홉 해. 일어서지 못한다. 너는 그를 업는다. 가볍다. 우물 위로 올라왔을 때 자정 종이 울린다.

            다음 주, 루멘의 공물 명단이 두 배가 된다. 본보기다. 너는 그것을 알고 있었다.'
          effects: ["var lm_alberic_escaped = true", "temper 용기 5", "note 루멘 — 알베릭을 침묵의 우물에서 꺼냈다. 공물 명단이 두 배가 된다"]
        failure:
          text: '일곱째 층에서 밧줄이 끊긴다. 아니 — 끊어 놓았다.'
          effects: ["die_if 0.5 fall 침묵의 우물 일곱째 층에서 떨어졌다", "pain 40", "wanted 3 침묵의 우물"]
      - id: not
        label: 내려가지 않는다
        text: '이름 하나가 양피지 맨 아래에 그대로 있다.'
        effects: []
