# O-10 모르바 늪 자유민 — 회귀점의 대본 장면과 첫 열흘 (creation/origins_morva_freeborn.yaml). 문법은 greyford_opening.yaml 머리말과 같다.
# 회귀점: 낙엽월 1일 21:00, 뿌리마을 회의 섬 투표의 원 — 열여섯 살의 첫 뿌리 모임 (SCENARIOS O-10 「버들뿌리의 회의」).
#   o10_council_open (이름: 할머니 헤드비가) → o10_council_word (회의의 말 + 잔향의 각성, 선택 일곱) → o10_knots (할머니의 매듭 — 물의 이름)
# 첫 열흘:
#   o10_dawn_boat      9.2 새벽 — 왼발이 이겼으면 다섯이 배에 오른다 (놓치면 o10_five_gone)
#   o10_reed_dawn      9.2~9.4 붉은 갈대 선 — 사냥대의 둔덕: 발자국을 읽는다 / 쏜다 / 맨발에게 말을 건다 (SCENARIOS 2·5)
#   o10_barefoot       9.3 새벽 장어 덫 물길 — 냄새의 주인: 맨발이 덫 줄을 읽는다. 죽이거나, 붙잡거나, 말을 건다 (SCENARIOS varg_scent)
#   o10_barefoot_fog   9.3 새벽 — 할머니의 안개 속에서 물에 빠진 맨발 (안개 매듭의 값)
#   o10_belfry         가라앉은 종탑 — 아스테리아의 종, 웃지 않는 페이, 냄새를 끝내는 자리 (SCENARIOS sunken_bell)
#   o10_second_council 9.4 밤 — 두 번째 뿌리 모임: 다섯의 사흘이 끝난다 (놓치면 o10_council_absent)
#   o10_feathers       9.7~ — 피를 흘렸으면 장어 덫 줄에 바르그의 피 깃털
#   o10_first_outside  늪 어귀에 처음 닿는 날 — 늪 밖의 사람들 (SCENARIOS first_outside — 활을 내리는 법)
# 뿌리마을의 소품 (연출가, 어느 출신이든): o10_dir_pot · o10_dir_black_jaw (밤 물길 — 늪 자체가 밤의 위험이다) · o10_dir_basket
# 다섯의 갈래: 남는다(o10_five_safe) / 붙잡혀 간다(o10_five_taken — 콩은 세계에서 지운다: agenda kill, 갈증의 밤 명단으로 끌려간 것이다)
village: &village [rv_council_island, rv_mud_school, rv_rope_bridges, rv_pot, rv_smokehouse, rv_eel_traps, rv_reed_works, rv_forge, rv_herb_hut, rv_stilt_homes_n, rv_stilt_homes_s, rv_arrival_hut, rv_glow_field, rv_watch_post, rv_black_pool]
storylets:
  # ───────────────────────── 회귀점 ─────────────────────────
  - id: o10_council_open
    origin: morva_freeborn
    trigger: {start: true}
    stage:   # 헤드비가는 둥지 사람이라 엔진의 '이 자리 사람'에는 잡히지 않는다 — 장면 글로 선다 (stage는 그 밤의 자리를 적어 둔다)
      - {npc: npc_mv_alek, at: rv_vote_circle, from: "20:30", to: "22:40", doing: "투표의 원 한가운데 — 귀 뒤의 막대를 꺼냈다가 도로 꽂는다"}
      - {npc: npc_mv_torr, at: rv_vote_circle, from: "20:30", to: "22:40", doing: "원 가장자리에서 팔짱을 끼고 선다 — 망치 자루가 허리에 있다"}
      - {npc: npc_mv_nanne, at: rv_vote_circle, from: "20:30", to: "22:40", doing: "원 곁에 앉아 끈을 꼰다 — 다섯에게 첫 질문을 했다"}
      - {npc: npc_o10_torn, at: rv_vote_circle, from: "20:30", to: "22:40", doing: "뗏목 끝에 걸터앉아 다섯 쪽을 노려본다"}
      - {npc: npc_o10_kong, at: rv_vote_circle, from: "20:30", to: "22:40", doing: "다섯 사이에서 소매 밖으로 나온 손목을 감추지 않고 너를 본다"}
      - {npc: npc_mv_hedwiga, at: rv_vote_circle, from: "20:30", to: "22:30", doing: "네 등 뒤에서 자기 손목의 매듭 끈을 풀었다 다시 묶는다"}
      - {npc: npc_mv_hedwiga, at: rv_herb_hut, from: "22:30", to: "312-09-02 04:30", doing: "약초 오두막 문가에 앉아 매듭을 꼰다 — 새벽 배로 둥지에 돌아간다"}
    text: |
      젖은 뿌리 냄새. 갈대 연기, 장어 기름.

      회의 섬은 작다. 뿌리나무 아홉 그루가 둘러싼 둥근 땅에 어른이 다 서기엔 모자라서, 뿌리 모임의 밤이면 섬 둘레에 뗏목 열한 개를 묶는다. 오늘은 달 없는 초하루. 횃불은 없다. 줄마다 반딧불 병이 걸려 있다 — 불은 연기를 내고, 연기는 냄새를 멀리 데려간다.

      너는 투표의 원 가장자리에 서 있다. 열여섯. 오늘부터 발을 내밀 수 있다. 찬성은 오른발, 반대는 왼발. 그리고 처음으로, 말할 수 있다.

      원 안에 다섯이 서 있다. 어른 넷, 아이 하나. 손목마다 지져 넣은 숫자. 녹테른의 혈목장에서 왔다. 어른 하나가 아이의 어깨를 잡는다. "콩아." 작아서 붙은 이름이다. 손목에는 다른 이름이 있다.

      잿빛 실의 뱃사공이 붉은 갈대 선에서 그들을 받아 왔다. 진흙등불은 올겨울 장부가 이미 모자라서. 뱃사공은 다른 것도 데려왔다. 그가 삿대에 기대어 말한다. "바르그 냄새가 갈대 선까지 따라왔소. 셋. 어쩌면 넷."

      뗏목이 물에 닿는 소리만 남는다.

      등 뒤에서 누가 부른다. 낮게. 아무도 못 듣게.
    input: true_name
    input_label: 할머니만 아는 이름
    input_button: 그 이름을 듣는다
    input_say: 할머니가 귓가에 낮게 부르는 이름
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "젖은 뿌리 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 젖은 뿌리 냄새."}
    trace_lines:
      water: 뗏목 아래 늪물이 목까지 차오른다. 아니다. 물은 발목에 있다. 목 안에 물이 있다. 없다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 진흙뿐이다. 갈대 선은 일곱 시간 밖이다.
      spear: 옆구리가 시리다. 활시위가 닿던 자리다.
      blade: 목이 뜨겁다. 손을 대 보면 아무것도 없다. 반딧불 빛뿐이다.
      rope: 손목이 쓸린다. 부적 끈 자국이다. 부적 끈 자국일 것이다.
      hunger: 배가 꼬인다. 아니다 — 저녁 솥에서 장어 토막을 받았다.
      fall: 발밑이 꺼진다. 뗏목이다. 뗏목이 물을 한 번 밀어낼 뿐이다.
    return_ink: |
      ┊ 그 다음엔 알렉 선생이 말했다. "숨는 것이 우리가 아는 유일한 방법이다." 토른이 일어섰다.
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 늪에 하나뿐이다. 할머니다. 헤드비가 — 버들 계보의 딸, 스물아홉. 머리는 벌써 하얗다. 늪 마녀는 마흔 전에 늙는다. 여섯 살의 네가 할머니라고 불렀고, 그 뒤로 아무도 고쳐 부르지 않았다.

      "부적 맨 안쪽 매듭이 그 이름이야. 처음 말하는 날이니까, 한 번은 들려줘야지." 할머니의 손가락이 네 목의 부적 끈을 한 번 쓸고 지나간다. "이름을 아는 자가 너를 가진다. 그러니 아무한테도 주지 마라. 나한테도 다시는."

      할머니는 일곱 노파의 둥지에서 스물여섯 시간 물길을 저어 왔다. 네 첫 회의를 보려고.

      원 한가운데로 알렉 선생이 나선다.
    effects: ["var o10_five_known = true", "learn fact_o10_five_from_farm", "learn fact_o10_varg_at_reed_line", "note 할머니만 아는 이름 — {name}. 마을은 너를 버들이라 부른다", "note 녹테른에서 온 다섯 — 아이 콩과 어른 넷. 바르그 냄새가 붉은 갈대 선까지 따라왔다"]
    next: o10_council_word

  - id: o10_council_word
    origin: morva_freeborn
    text: |
      알렉 선생 — 뿌리 모임의 입, 진흙판 학교의 선생 — 이 귀 뒤의 막대를 꺼냈다가 도로 꽂는다. 대답하기 전의 버릇이다.

      "우리는 숨어서 살아남았다." 그는 다섯을 보지 않는다. 발밑 진흙을 본다. "숨는 것이 우리가 아는 유일한 방법이다. 다섯은 갈대 선 너머에서 왔고, 냄새도 같이 왔다."

      뗏목 하나가 출렁인다. 토른이 일어선다 — 열일곱, 대장장이 토르의 풀무를 밟는 손. 아홉 해 전 바르그가 늪길로 들어온 해에 아버지를 잃었다. "숨는 거라면 저 다섯을 늪 밖에 내다 놓는 게 제일 잘 숨는 거겠지." 웃는 목소리가 아니다. 누구 편인지도 모를 목소리다.

      할머니는 아무 말 없이 자기 손목의 매듭 끈을 풀었다 다시 묶는다.

      반딧불 병 그늘 속에서 콩이 너를 보고 있다. 손목의 숫자가 소매 밖으로 나와 있다. 아이는 그것을 감추지 않는다. 감추는 법을 모른다.

      모두가 네 첫마디를 기다린다.

      할머니의 손끝에서 매듭이 풀리는 순간, 그 안에 묶여 있던 소리가 들린다. 물의 이름, 그 첫 음절. 노파들은 나가의 피 한 방울과 몇 해의 목숨을 태워야 그것을 겨우 입에 올린다. 네 입술은 그 소리를 이미 안다. 뗏목 아래의 늪물이 한 번, 네 쪽으로 기운다. 눈가로 잿빛 고리가 스치고 사라진다.

      할머니의 손이 멈춘다. 그녀는 늪물을 보고, 너를 본다.
    effects: ["var o10_hedwiga_saw = true", "note 할머니의 매듭이 풀릴 때 — 물의 이름, 그 첫 음절. 입술이 그 소리를 안다. 늪물이 기울었다"]
    next: o10_knots
    choices:
      - id: hide_five
        label: '"갈대 선이 냄새를 데려왔으면, 늪이 지우면 돼." — 다섯을 숨기자고 말한다'
        minutes: 40
        check: {skill: 화술, D: 27, helps: [crowd_voice, tongue, charm], warn: ["pknows fact_o10_party_size", "pknows fact_p2mv_torr_gas_traps"]}
        success:
          text: |
            네 목소리가 물 위로 건너간다. 처음 듣는 네 목소리다. "다섯은 배로 왔어. 물은 냄새를 안 남겨. 갈대 선까지는 냄새가 와도, 갈대 선부터는 늪이야."

            뗏목 하나에서 누가 웃는다. 비웃음이 아니다.

            알렉이 막대를 귀 뒤에 꽂는다. "발."

            오른발이 나온다. 하나, 둘 — 난네가 센다. 매듭을 짚는 손가락의 속도로. 왼발보다 여섯이 많다. 토른은 발을 내밀지 않는다.

            "사흘." 알렉이 말한다. "다섯은 사흘 동안 초막에서 먹고 잔다. 사흘 뒤에도 냄새가 갈대 선에 있으면, 다시 선다."

            콩이 너를 본다. 이번에는 손목을 감춘다. 누가 가르쳐 준 것도 아닌데.
          effects: ["var o10_five_stay = true", "rel npc_mv_alek trust 3", "memory npc_mv_alek 용감함 버들이 첫 뿌리 모임에서 다섯을 숨기자고 말했다", "bond npc_o10_kong 6", "rel npc_o10_kong like 10", "temper 자비 4", "temper 용기 3", "note 첫 뿌리 모임 — 오른발이 여섯 많았다. 다섯은 사흘 초막에. 초나흘 밤 다시 선다"]
        failure:
          text: |
            네 목소리가 나온다. 생각보다 작다. 물 위로 건너가기 전에 반딧불 병 사이에서 흩어진다.

            알렉이 막대를 귀 뒤에 꽂는다. "발."

            왼발이 나온다. 하나, 둘 — 난네가 센다. 오른발보다 둘이 많다. 둘. 토른의 왼발이 그 둘 가운데 하나다.

            "새벽에 뱃사공이 다시 온다." 알렉은 다섯을 보지 않는다. "갈대 선까지 데려다준다. 거기서부터는 — 우리가 정할 일이 아니다."

            콩은 손목을 감추지 않는다. 감출 이유가 없어졌다.
          effects: ["var o10_five_out = true", "stress 10", "memory npc_o10_kong 정직함 그 사람은 우리 쪽으로 말했다. 발이 모자랐다", "note 첫 뿌리 모임 — 왼발이 둘 많았다. 다섯은 새벽 배로 갈대 선까지"]
      - id: reed_line
        label: '"내가 갈대 선에 가 볼게. 몇인지, 어디 있는지." — 사냥대의 냄새를 보고 오겠다고 한다'
        minutes: 30
        risk: 밤의 늪길 일곱 시간 — 갈대 선에는 사냥대가 있다
        text: |
          뗏목 위가 다시 조용해진다. 이번에는 다른 조용함이다.

          "열여섯이." 누가 말한다. 알렉은 대답하지 않고 너를 본다. 먼 데 글자를 읽듯이, 눈을 가늘게 하고.

          "…다녀와라. 숫자를 가져와." 막대가 귀 뒤로 돌아간다. "발은 사흘 뒤에 내민다. 그동안 다섯은 초막에서 먹고 잔다."

          토른이 뗏목에서 일어선다. "나도 —" 토르의 손이 토른의 목덜미를 잡는다. 말 한 마디. "풀무." 토른은 다시 앉는다. 너를 노려본다. 부러운 얼굴로.
        effects: ["var o10_five_stay = true", "var o10_plan = reed", "rel npc_mv_alek trust 4", "rel npc_o10_torn like 3", "memory npc_mv_alek 용감함 버들이 갈대 선의 숫자를 가져오겠다고 했다", "note 갈대 선까지 일곱 시간 — 사냥대의 숫자를 가져오기로 했다. 초나흘 밤 뿌리 모임"]
      - id: fog_knot
        label: 할머니에게 — "안개 매듭을 풀어 줘."
        minutes: 40
        text: |
          할머니의 손가락이 매듭 위에서 멈춘다. 오래.

          "그건 값이 달라." 그녀가 말한다. 늘 하던 말이다. 이번에는 웃지 않는다.

          그녀가 품에서 뼈 병 하나를 꺼낸다. 엄지손가락만 하다. 바닥에 검푸른 것이 한 방울 — 나가 허물에서 짜낸 피. 노파들에게서 받아 아껴 둔 마지막 것이다. 그녀가 병을 혀에 기울이고, 매듭 하나를 푼다. 입술이 움직인다. 소리는 너만 듣는다.

          늪이 숨을 내쉰다. 물 위로 하얀 것이 일어나 남쪽으로, 갈대 선 쪽으로 기어간다. 사흘은 걷히지 않을 안개다.

          할머니의 귀밑머리 몇 가닥이 반딧불 빛 아래에서 하얗게 바랜다. 원래도 하얗던 머리가, 더.

          알렉이 안개를 보고 막대를 귀 뒤에 꽂는다. "안개가 있는 사흘. 다섯은 초막에 둔다. 걷히면, 다시 선다."
        effects: ["var o10_five_stay = true", "var o10_fog = true", "var o10_hedwiga_years += 2", "learn fact_o10_fog_knot", "rel npc_mv_hedwiga like 5", "memory npc_mv_hedwiga 다정함 버들이 다섯을 위해 안개를 청했다 — 두 해가 갔다", "stress 8", "temper 자비 3", "note 할머니의 안개 매듭 — 갈대 선에 사흘 안개. 값은 나가의 피 한 방울과 할머니의 두 해"]
      - id: false_trail
        label: '"다섯의 헌 옷을 줘. 냄새는 내가 가라앉은 종탑으로 끌고 갈게."'
        minutes: 30
        risk: 밤의 늪길 다섯 시간 — 거머리 물길을 지난다
        text: |
          다섯 가운데 여자 하나가 너를 본다. 말을 알아듣지 못한 얼굴이다. 난네가 노예말로 옮겨 준다. 여자가 천천히 겉옷을 벗는다. 다른 셋도. 콩은 마지막까지 소매를 놓지 않다가, 놓는다.

          젖은 천 다섯. 녹테른의 냄새 — 쇠와 장미, 그 밑의 겁.

          알렉이 너를 오래 본다. "종탑은 마을 밖이다. 마을이 정할 일이 아니다." 막대가 귀 뒤로 돌아간다. "다섯은 사흘 초막에. 그 뒤에 다시 선다."

          토르가 토른의 어깨를 잡고 있다. 토른은 너를 보며 입 모양으로만 말한다. 미쳤어.
        effects: ["var o10_five_stay = true", "var o10_plan = trail", "var o10_scent_rags = true", "bond npc_o10_kong 3", "note 다섯의 헌 옷 — 냄새를 가라앉은 종탑으로 끌고 간다 (다섯 시간 물길)"]
      - id: give_up
