          갈대 선이 비어 있었으니까. 난네가 콩의 손목에 이름 없는 끈을 감아 주었다고 한다. 네가 없는 자리에서.
        effects: ["var o10_five_stay = false", "var o10_five_safe = true", "note 네가 없는 사이 두 번째 뿌리 모임 — 다섯은 남았다"]
      - id: fog_kept
        when: ["var o10_hunters_near == 1", "var o10_fog == true"]
