        effects: ["var o10_five_stay = false", "var o10_five_safe = true", "var o10_hunters_near = 0", "var o10_hunt_end = fog", "note 네가 없는 사이 — 안개가 걷히고 사냥대는 남쪽으로 갔다. 다섯은 남았다"]
      - id: lost
