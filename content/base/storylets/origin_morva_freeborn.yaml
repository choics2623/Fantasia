        minutes: 40
        text: |
          알렉은 깃털을 오래 본다. 진흙판의 글자를 읽듯이. "천천히." 그 말이 다다.

          그날 밤부터 안쪽 망루의 밤 망이 둘이 된다. 줄다리의 반딧불 병은 한 줄 걸러 하나씩만 건다.
        effects: ["learn fact_o10_feather_marks", "var o10_watch_doubled = true", "rel npc_mv_alek trust 4", "note 피 깃털 — 알렉 선생이 안쪽 망루의 밤 망을 둘로 늘렸다"]
