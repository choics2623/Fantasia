            넷의 자국이 모두 물가에서 멈춘다. 배가 떠난 자리에서. 물은 냄새를 남기지 않는다. 그들은 여기서 물을 노려보고 있다.

            너는 올 때보다 더 천천히 물러난다. 바람은 네 쪽에서 둔덕 쪽으로 불지 않았다.
          effects: ["learn fact_o10_party_size", "var o10_knows_camp = true", "skill_gain 통찰 1", "note 갈대 선 서쪽 둔덕 — 바르그 코 셋(하나는 왼 뒷발을 끈다)과 맨발의 인간 하나. 물가에서 멈췄다"]
