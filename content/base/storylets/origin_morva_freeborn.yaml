  # 할머니의 안개 속에서 (안개 매듭의 값)
  - id: o10_barefoot_fog
    origin: morva_freeborn
    trigger: {window: {from: "312-09-03 04:00", to: "312-09-03 09:00"}, at: [rv_eel_traps], when: ["var o10_fog == true", "var o10_tracker == free"]}
    severity: 3
    text: |
      안개. 할머니의 안개가 갈대 선에서 여기까지 흘러왔다. 통발 줄이 셋째 매듭에서 하얗게 지워진다.

      물이 첨벙거린다. 장어가 아니다. 장어는 그렇게 오래 허우적거리지 않는다.

      깊은 물길 한가운데에서 사람 하나가 가라앉았다 떠오른다. 목에 가죽 줄. 줄 끝이 아무것에도 묶여 있지 않다. 안개 속에서 길을 잃고, 냄새를 잃고, 발 디딜 땅을 잃은 맨발.

      그의 손이 물 위로 올라온다. 너를 향해서가 아니다. 그냥 위로.

      토른이 네 옆에서 숨을 멈춘다. 아무 말도 하지 않는다. 늪이 정하게 두자는 얼굴로.
    choices:
      - id: pull
        label: 물에 들어가 그를 끌어낸다
        minutes: 30
        check: {skill: 싸움, D: 18, helps: [swimmer, iron_body]}
        success:
          text: |
            물은 가슴까지 온다. 그가 너를 붙잡는다 — 물에 빠진 사람이 붙잡는 힘으로. 둘이 같이 가라앉았다가, 토른의 삿대가 물을 친다.

            진흙 위에서 그가 물을 토한다. 한참. 그리고 코로 숨을 들이쉰다. "…냄새가 달라." 노예말이다. "너는 목줄 냄새가 안 나."

            너는 그의 목줄 끝을 그의 손에 쥐여 준다. "갈대 선은 남쪽이야. 안개가 걷히기 전에 가. 늪엔 아무것도 없다고 해." 그가 오래 너를 본다. 그리고 안개 속으로, 남쪽으로.
          effects: ["var o10_tracker = turned", "var o10_tracker_turned = true", "var o10_hunters_near = 0", "var o10_hunt_end = fog", "rel npc_o10_leash trust 30", "rel npc_o10_leash like 25", "memory npc_o10_leash 다정함 주인 없는 인간이 물에서 끌어냈다", "temper 자비 6", "fatigue 10", "rel npc_o10_torn like -3", "note 안개 속에서 맨발을 끌어냈다 — 늪엔 아무것도 없다고 하라 했다"]
        failure:
