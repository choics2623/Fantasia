  # ───────────────────────── 피 깃털 (피를 흘렸으면) ─────────────────────────
  - id: o10_feathers
    origin: morva_freeborn
    trigger: {window: {from: "312-09-07 04:00", to: "312-09-14 20:00"}, at: [rv_eel_traps], when: ["var o10_retaliation >= 1"]}
    severity: 2
    text: |
      통발 줄 끝에 깃털 하나가 꽂혀 있다. 물새 깃털이 아니다. 끝을 피에 담갔다가 말렸다.

      늪 아이들도 안다. 바르그가 꽂는 깃털은 말이다. 하나면 '본다'. 셋이면 '온다'.

      하나다. 아직은.
    choices:
      - id: pull
        label: 깃털을 뽑아 물에 던진다
        minutes: 5
        text: |
          물이 깃털을 데려간다. 내일 아침 같은 자리에 둘이 꽂혀 있을지도 모른다. 아니면 셋이.
        effects: ["learn fact_o10_feather_marks", "var o10_retaliation += 1", "stress 4", "temper 용기 2", "note 장어 덫 줄의 피 깃털 — 뽑아 물에 던졌다"]
      - id: alek
