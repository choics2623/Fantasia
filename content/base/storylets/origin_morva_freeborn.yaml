  # ───────────────────────── 늪 밖의 사람들 (늪 어귀에 처음 닿는 날) ─────────────────────────
  - id: o10_first_outside
    origin: morva_freeborn
    trigger: {window: {from: "312-09-02 06:00", to: "313-08-30 23:00"}, at: "@morva_mouth"}
    severity: 1
    text: |
      늪 어귀. 썩은 나루 기둥을 따라 가판 열두 곳. 훈제 장어 냄새 위로 처음 맡는 냄새가 섞여 있다 — 기름 먹인 가죽, 쇠, 그리고 루멘에서 온 사람들의 몸 냄새.

      장어 장수들이 값을 부른다. 그 뒤에서 짐을 진 사람 하나가 고개를 숙이고 서 있다. 목에 쇠고리. 고리에 새겨진 글자를 너는 읽는다 — 사람의 이름이다. 그 사람의 이름이 아니다. 그 사람은 한 번도 고개를 들지 않는다.

      외팔의 사내가 너를 보더니 곧장 걸어온다. 베니다 — 늪 어귀의 망꾼장, 목에 호루라기 일곱. 그의 눈이 네 등의 활에 멈춘다.

      "활 내려." 숫자를 대듯 짧다. "여기서부터는 늪이 아니야."
    choices:
      - id: lower
        label: 활을 내려 자루에 넣는다
        minutes: 10
        text: |
          베니가 고개를 한 번 끄덕인다. "눈도." 그가 말한다. "루멘 사람 앞에서는 발을 봐. 글자가 보여도 읽은 얼굴을 하지 말고."

          쇠고리를 찬 사람이 짐을 고쳐 진다. 너는 처음으로 고개를 숙여 본다. 목이 낯설게 접힌다.
        effects: ["var o10_naive = false", "learn fact_o10_outside_rule", "rel npc_mv_beni like 4", "note 늪 어귀 — 늪 밖에서는 활을 감춘다. 글자도, 눈도"]
      - id: ask_serf
        label: 쇠고리를 찬 사람에게 말을 건다 — "어디서 왔어?"
        minutes: 10
        text: |
          그 사람이 움찔한다. 대답하지 않는다. 대신 장어 장수의 막대가 그 사람의 등을 친다. 한 번. 너 때문에.

          베니가 네 팔을 잡아 끈다. 나루 기둥 뒤까지. "주인 있는 사람한테 주인 없는 말을 걸면, 맞는 건 그 사람이야." 그가 네 활을 자루에 쑤셔 넣는다. "늪 사람은 늪 밖에서 아무한테도 말을 걸지 않아."
        effects: ["var o10_naive = false", "learn fact_o10_outside_rule", "stress 6", "temper 자비 1", "rel npc_mv_beni trust -2", "note 늪 어귀 — 주인 있는 사람한테 주인 없는 말을 걸면 맞는 건 그 사람이다"]
      - id: keep
        label: 활을 멘 채 고개를 든다 — 늪 사람은 그렇게 산다
        minutes: 10
        risk: 루멘에서 온 눈들이 본다
        text: |
          베니가 너를 본다. 오래. 그리고 숫자를 대듯 말한다. "그럼 네 얼굴이 루멘에 간다. 장수 셋이 봤어. 셋이면 소문이다."

          장어 장수 하나가 너를 보며 무언가를 혀 위에서 굴린다. 값을 매기는 얼굴이다.
        effects: ["wanted 1 늪 어귀에서 활을 멘 인간이 보였다", "rel npc_mv_beni trust -4", "note 늪 어귀 — 활을 멘 채 섰다. 루멘 장수 셋이 보았다"]

  # ───────────────────────── 뿌리마을의 소품 (연출가 — 어느 출신이든) ─────────────────────────
  - id: o10_dir_pot
    trigger: {director: true, category: calm, at: [rv_pot], hours: ["17:30", "20:00"], chance: 0.3}
    text: |
      솥 셋에서 김이 오른다. 힐케가 국자로 사람을 하나씩 가리킨다. "먹었어?" 대답이 '응'이어도 국자는 한 번 더 들어간다.

      솥 가장자리에 국자 자국이 줄지어 있다. 자국 하나가 하루다. 굶주림월이 오면 자국이 반으로 준다고, 힐케는 말하지 않는다.
    choices:
      - id: ask
        label: '힐케에게 — "겨울엔 하루에 몇 자국이야?"'
        text: |
          힐케는 대답 대신 국자로 네 그릇 가장자리를 한 번 친다. 그리고 한 국자를 더 붓는다. "먹었어? 그럼 됐어."
        effects: ["rel npc_mv_hilke like 2", "note 공동 솥 — 굶주림월에는 국자 자국이 반으로 준다"]
      - id: count
        label: 국자 자국을 센다
        text: |
          스물아홉에서 손가락이 멈춘다. 그 뒤로는 자국이 겹쳐서 셀 수가 없다. 김이 얼굴을 덮는다. 따뜻하다.
        effects: ["stress -3"]
  - id: o10_dir_black_jaw
    trigger: {director: true, category: threat, at: [rv_eel_traps, rv_rope_bridges, rv_glow_field, rv_smokehouse], hours: ["00:00", "24:00"], night: true, chance: 0.25}
    text: |
      물이 한 번 갈라진다. 반딧불 병 빛이 닿지 않는 데서.

      검은 턱이다. 길이는 줄다리 널 넷. 눈 두 개가 물 위에 떠 있고, 그 사이가 너무 멀다.

      밤 물길은 혼자 다니지 않는다. 규칙이 아니라, 살아남은 사람들의 버릇이다.
    choices:
      - id: still
        label: 숨을 죽이고 엎드린다 — 지나갈 때까지
        minutes: 20
        check: {skill: 은신, D: 18, helps: [beast_friend, shadow_step]}
        success:
          text: |
            눈 두 개가 가라앉는다. 물이 닫힌다. 한참 뒤에야 개구리가 다시 운다.
          effects: ["stress 2"]
        failure:
          text: |
            발밑의 널이 기운다. 발목이 물에 잠긴다 — 무언가가 스치고 지나간다. 이빨이 아니었다. 이번에는.
          effects: ["pain 12", "fear 1"]
      - id: light
        label: 반딧불 병을 흔들어 망루 쪽으로 빛을 낸다
        minutes: 10
        text: |
          망루에서 호루라기가 짧게 두 번 — 불. 누가 삿대로 물을 친다. 두 번, 세 번. 눈 두 개가 물러난다. 아주 천천히, 서두를 것 없다는 듯이.
        effects: ["stress 4"]
  - id: o10_dir_basket
    trigger: {director: true, category: omen, at: [rv_council_island], hours: ["20:00", "23:00"], chance: 0.25}
    text: |
      이름 바구니가 물 위에서 흔들린다. 난네가 바구니 밑 물을 손바닥으로 떠낸다. 한 번, 두 번.

      그녀의 손가락이 매듭 끈 사이를 지나간다. 사백열둘. 그 사이사이에 매듭만 있고 이름이 없는 끈들.
    choices:
      - id: ask
        label: '"이름 없는 끈은 누구 거야?"'
        minutes: 15
        text: |
          난네는 손을 멈추지 않는다. "일 년을 못 채운 사람들." 끈 하나를 꼰다. "이름은 없어도 매듭은 맸어. 끈 하나가 한 사람이야."
        effects: ["learn fact_p2mv_nanne_twelve_blank_cords", "rel npc_mv_nanne like 3"]
      - id: leave
        label: 바구니에서 눈을 뗀다
        text: |
          물이 바구니 밑을 핥는다. 난네의 손이 그 물을 다시 떠낸다. 한 번, 두 번.
        effects: ["stress -1"]
