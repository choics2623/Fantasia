        text: |
          말이 끝나기 전에 토른이 손바닥으로 뗏목을 친다. 한 번. 찬성이다.

          알렉은 막대를 꺼내지 않는다. 꺼낼 필요가 없다. "발."

          왼발이 나온다. 많이. 난네는 세다가 그만둔다.

          "새벽에 뱃사공이 다시 온다. 갈대 선까지." 알렉의 목소리가 처음으로 빨라진다. 숫자를 셀 때처럼.

          콩이 너를 본다. 계속 본다. 반딧불 병이 하나씩 꺼질 때까지. 마지막 병이 꺼져도, 어둠 속에서 너는 그 눈이 어디 있는지 안다.
        effects: ["var o10_five_out = true", "temper 자비 -10", "rel npc_o10_torn like 5", "rel npc_tessa trust -20", "rel npc_mv_rena trust -10", "deed betray", "stress 12", "memory npc_o10_kong 위험함 우리를 내보내자고 한 사람", "note 다섯을 내주자고 했다. 새벽 배로 갈대 선까지 — 잿빛 실은 이 일을 잊지 않는다"]
      - id: silent
