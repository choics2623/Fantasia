          알렉이 기다리다가, 막대를 귀 뒤에 꽂는다. "발."

          발들이 나온다. 네 발은 그 자리에 있다. 난네가 센다. 왼발이 둘 많다.

          "새벽에 뱃사공이 다시 온다." 알렉이 말한다. "갈대 선까지."

          할머니가 네 옆에서 매듭을 묶는다. 아주 세게.
        effects: ["var o10_five_out = true", "stress 8", "rel npc_mv_hedwiga trust -3", "note 첫 뿌리 모임 — 말하지 않았다. 왼발이 둘 많았다. 다섯은 새벽 배로 갈대 선까지"]
      # ── ◈ 기억 선택지 ──
      - id: mem_party_size
