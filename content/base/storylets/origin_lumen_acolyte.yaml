# O-08 순종의 빛 견습 사제 — 회귀점의 대본 장면과 첫 열흘 (creation/origins_lumen_acolyte.yaml의 opening).
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 진짜 이름. origin: lumen_acolyte — 이 출신의 판에서만 열리고, stage도 이 판에서만 걸린다.
#
# 회귀점 (낙엽월 1일 19:00, 9번 독방의 쇠창살 앞):
#   o8_well_open (이름) → o8_well_letters (알베릭의 글자 · 잔향의 각성 · 선택) → o8_well_report (우물 당번의 저녁 보고 — 서약)
# 첫 열흘:
#   o8_luca_eyes        1일 밤 기숙사 — 루카가 침상 발치에 앉는다 (SCENARIOS luca_eyes)
#   o8_descent_hungry / o8_descent   2일 저녁 우물 — 첫째 층의 벤노, 둘째 수업 (아홉째 빵의 값 · seed.ninth_bread)
#   o8_first_ring       2일 정오~4일 — 원장의 성가집 (원장에게 아뢰었을 때 · broken_ring_trial_1)
#   o8_gregor_cough     3일 아침 — 대사제의 탕약, "알베릭은 아직 먹고 있느냐" (gregor_cough)
#   o8_audit_accused / o8_audit_niklas / o8_eldar_audit   5일 새벽 기도 뒤 — 감독관의 감사와 서약 (eldar_audit · bt_luca_report)
#   o8_board_turned     감사에서 판이 뒤집힐 때 (뒷면에 손톱자국이 있으면 붙잡힌다)
#   o8_pyre_benno / o8_pyre_other    17일 정화의 뜰 첫 장작 (정본 9.17) — 견습들은 줄지어 외운다
# 같은 창에 열리는 변형은 파일 순서가 우선이다 (먼저 적은 것이 맞으면 먼저 열린다). 열린 변형은 *_done 변수로 나머지를 닫는다.
storylets:
  # ───────────────────────── 회귀점: 침묵의 우물 ─────────────────────────
  - id: o8_well_open
    origin: lumen_acolyte
    trigger: {start: true}
    stage:
      - {npc: npc_alberic, at: lm_uc_cell_9, from: "19:00", to: "19:50", doing: "쇠창살 안 — 손톱 없는 손끝으로 창살 밖 흙바닥에 글자를 짚는다"}
      - {npc: npc_o8_luca, at: lm_undercroft, from: "19:00", to: "19:25", doing: "침묵의 우물 나선 계단 — 몇 층 위에서 발소리를 죽이고 서 있다"}
      - {npc: npc_o8_luca, at: lm_sem_hall, from: "19:25", to: "20:40", doing: "낭독실 구석 긴 의자 — 구절을 외우는 척한다. 신발 밑창에 흰 돌가루"}
      - {npc: npc_lm_anselm, at: lm_sem_hall, from: "19:00", to: "20:40", doing: "낭독실 등잔 아래 — 책상 모서리를 두드리며 우물 당번의 보고를 기다린다"}
      - {npc: npc_lm_tobias, at: lm_inquisition, from: "19:40", to: "21:00", doing: "접수관 처소의 등잔 아래 — 동기 장부를 쓰다가 문 두드리는 소리에 깃펜부터 든다"}
    text: |
      젖은 돌 냄새. 그 위에 촛농, 오래 갇힌 몸의 냄새.

      침묵의 우물은 우물이 아니다. 사슬등불 대성당 밑으로 아홉 층을 감아 내려가는 나선 계단이다. 가운데는 바닥이 보이지 않는 구멍이고, 도르래 밧줄 하나가 그 어둠 속으로 늘어져 있다. 층마다 계단이 끝나는 자리에 독방이 하나씩. 너는 버들 바구니를 안고 내려간다. 검은 빵 아홉 덩이. 우물은 바닥부터 먹인다 — 간수들의 규칙이다.

      머리 위 돌 속에서 저녁 기도 종이 울린다. 일곱 번. 지금 위에서는 천이백 명이 한꺼번에 무릎을 꿇는다. 여기서는 종소리가 돌을 타고 내려와 발바닥으로 온다.

      어제까지 이 바구니는 벤노의 것이었다. 기숙사, 네 옆 침상의 벤노. '병이 나서' 바뀌었다고, 안셀름 원장은 그렇게만 말했다. 그 뒤로 아무도 벤노의 이름을 입에 올리지 않는다.

      아홉째 층. 계단이 끝나는 곳에 문 대신 쇠창살이 있다. 아홉 해째 같은 사람이 그 안에 있다. 너는 등잔을 바닥에 내려놓고 무릎을 꿇는다. 첫 빵을 쥔다.

      종소리가 잦아드는 사이, 이름 하나가 들린다. 이 우물에서 들릴 리 없는 목소리로.
    input: true_name
    input_label: 어머니가 남긴 이름
    input_button: 그 이름을 속으로 부른다
    input_say: 종소리 사이로, 열 해 전의 목소리가 부르는 이름
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "젖은 돌 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 젖은 돌 냄새."}
    trace_lines:
      water: 바구니 손잡이가 젖어 있다. 아니다. 손바닥이 젖었다. 목 안에 물이 있다. 없다. 이 우물은 이름뿐이다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 돌가루뿐이다.
      spear: 옆구리가 시리다. 계단 벽에 기댄 쪽이다.
      blade: 목이 뜨겁다. 손을 대 보면 성표 고리가 있다. 쇠가 차다.
      rope: 손목이 쓸린다. 바구니 끈 자국이다. 바구니 끈 자국일 것이다.
      hunger: 배가 꼬인다. 바구니에 빵이 아홉 덩이 있다. 하나도 네 것이 아니다.
      fall: 발밑이 꺼진다. 아니다 — 아홉째 층, 마지막 계단이다. 발바닥이 돌을 찾는다. 가운데 구멍에서 밧줄이 흔들린다.
    return_ink: |
      ┊ 그 다음엔 손톱 없는 손이 네 문자판을 가리켰다. "그거, 읽을 줄 아느냐." 그리고 계단 위에서 발소리가 멈췄다.
    after_input: |
      "{name}."

      열 해 전, 신학원 쪽문. 같은 종이 울리고 있었다. 어머니는 네 목에 쇠고리 성표를 걸어 주고, 귀에 입을 대고 그 이름을 한 번 불렀다. "사제님들한테도 말하지 마라. 이름을 아는 자가 너를 가진다." 그 겨울, 어머니의 성표 번호는 부두 계수소의 장부로 들어갔다. 세렌행.

      이름을 대지 않은 아이는 번호로 적는다. 그날부터 너는 서원 마흔셋이다.

      종이 그친다. 쇠창살 사이로 손이 나온다. 앙상하고, 손톱이 하나도 없다.
    effects: ["var o8_goal_alberic = true", "note 어머니만 알던 이름 — {name}. 신학원에서는 서원 마흔셋이라 부른다"]
    next: o8_well_letters

  - id: o8_well_letters
    origin: lumen_acolyte
    text: |
      빵을 쇠창살 안으로 민다. 손이 빵을 받지 않는다. 손가락 하나가 네 허리를 가리킨다 — 끈에 매달린 나무판. 경전 문자판. 교단이 허락한 마흔두 글자가 새겨진 판.

      (똑, 똑똑, 똑.) 손톱 없는 손끝이 돌을 두드린다. 그리고 쉰 목소리가 천천히 온다. "…그거, 읽을 줄 아느냐." 등잔 불빛에 그의 눈에서 물이 흐른다. 우는 것이 아니다. 아홉 해 동안 빛을 보지 못한 눈이다. 너는 고개를 끄덕인다. 견습은 마흔두 글자를 배운다. 낭독하는 사제 곁에서 줄을 짚어 주려고. 그뿐이다.

      "셋째 줄을 읽어 봐라."

      너는 읽는다. '빛은 순종하는 자를 기억한다.' 쇠창살 안에서 낮은 웃음. 이가 몇 남지 않은 소리다. "같은 글자로 이렇게도 쓴다." 손끝이 창살 밖 흙바닥에 글자를 하나씩 짚는다. 같은 글자들이다. 다른 문장이다. '빛은 기억하는 자를 따른다.'

      계단 위에서 발소리가 멈춘다. 몇 층 위. 내려오지도, 올라가지도 않는다.

      흙바닥의 글자들이 떠오르는 것처럼 보인다. 너는 문득 안다. 이 글자는 마흔두 개가 아니었다. 쉰여섯 개였다. 열네 개는 아스테리아가 불탄 뒤 사라졌다. 너는 그 열네 개를 쓸 줄 안다. 손끝이 멈춘다. 쇠창살 너머에서 젖은 눈이 너를 찾는다. "…너는."
    effects: ["learn fact_o8_same_letters", "learn fact_o8_fourteen_letters", "rel npc_alberic trust 15", "rel npc_alberic like 10", "var o8_alberic_suspects = true", "memory npc_alberic 이상함 새 빵 당번의 눈이 사라진 글자를 아는 눈이었다", "note 9번 독방 — 같은 마흔두 글자로 다른 문장. 그리고 너는 사라진 열네 글자를 안다"]
    next: o8_well_report
    choices:
      - id: listen
        label: 쇠창살 앞에 앉는다 — 그의 말을 끝까지 듣는다
        minutes: 45
        text: |
          그는 서두르지 않는다. 한 문장씩, 접속사 없이. "에오르는 우리를 노예로 만들지 않았다." 그게 첫 줄이라고 한다. 무엇의 첫 줄인지는 말하지 않는다. 너는 안다 — 기숙사에서 이불 밑으로만 오가는 이름. 빛의 서신.

          "누가 처음 한 말인지는 묻지 마라. 예의다." 손끝이 흙바닥의 글자를 하나씩 지운다. 지우는 데 오래 걸린다.

          남은 빵 여덟 덩이를 안고 올라가는 동안, 계단 위의 발소리는 내내 너보다 몇 층 앞에 있다.
        effects: ["learn fact_o8_letter_first_line", "stress 10", "rel npc_alberic trust 6", "rel npc_alberic like 4", "var o8_luca_heard = true", "var o8_luca_doubt += 1", "memory npc_alberic 정직함 새 빵 당번은 끝까지 들었다", "note 빛의 서신의 첫 줄 — 에오르는 우리를 노예로 만들지 않았다"]
      - id: memorize
        label: 그가 짚는 순서를 외운다 — 손끝이 멈춘 자리마다
        minutes: 35
        check: {skill: 읽고쓰기, D: 26, helps: [memory_palace, scribe, photo_memory]}
        success:
          text: |
            경전에서 글자는 늘 같은 자리에 선다. 그의 손끝은 그 자리를 무시한다. 소리를 따라간다. 네 머릿속에서 마흔두 개의 글자가 처음으로 줄을 벗어난다.

            너는 흙바닥에 손가락을 댄다. 그가 쓰지 않은 말을 쓴다. 네 이름의 첫 글자. 손톱 없는 손이 그 글자를 덮는다. 빨리. "여기서는 아니다." 그런데 그 손이 떨린다. 웃음 때문에.

            재의 법은 그것을 한 줄로 적는다. 글을 아는 인간은 교수대.
          effects: ["skill_gain 읽고쓰기 6", "var o8_letters_free = true", "var o8_lessons += 1", "learn fact_o8_any_sentence", "rel npc_alberic trust 8", "temper 용기 2", "memory npc_alberic 영리함 빵 당번이 한 번에 배열을 외웠다", "note 마흔두 글자를 경전의 순서가 아니라 소리대로 — 무슨 말이든 쓸 수 있다"]
        failure:
          text: |
            그의 손끝을 따라가다 글자들이 서로 자리를 바꾼다. '기억'이 '순종'으로 돌아가고, 문장은 다시 경전이 된다. 마흔두 글자는 열 해 동안 같은 자리에 서 있었다. 하룻저녁에 비켜서지 않는다.

            "괜찮다." 쇠창살 안에서 쉰 목소리. "빵은 내일도 온다. 가르쳐 주마."
          effects: ["skill_gain 읽고쓰기 2", "var o8_lessons += 1", "rel npc_alberic like 3"]
      - id: footsteps
        label: 등잔을 들어 계단 위를 비춘다 — 누가 서 있는가
        minutes: 30
        check: {skill: 통찰, D: 24, helps: [bat_ear, night_eyes, hawk_eye]}
        success:
          text: |
            불빛이 세 바퀴 위의 난간에 닿는다. 회색 법의 자락. 성표를 쥔 하얀 손. 루카다 — 같은 해에 서원한 견습. 빵 당번은 그가 원장에게 청했던 자리다.

            불빛을 받자 그가 한 걸음 물러선다. 아직 아무것도 모르는 얼굴이다. 글자를 본 얼굴이 아니라 — 목소리만 들은 얼굴.

            발소리가 올라가 사라진다. 빵 당번 말고는 아무도 내려오면 안 되는 계단이다. 그도 그것을 안다.
          effects: ["var o8_luca_seen = true", "learn fact_o8_luca_on_stair", "memory npc_o8_luca 위험함 마흔셋이 우물 계단 위의 나를 등잔으로 비췄다", "note 루카가 우물 계단에 있었다 — 빵 당번 말고는 내려오면 안 되는 계단"]
        failure:
          text: |
            등잔을 드는 사이 발소리가 먼저 움직인다. 빠르게, 위로. 불빛이 닿은 난간에는 아무도 없다. 돌가루가 조금 떨어져 내린다.

            누구였는지 모른다. 무엇을 들었는지도.
          effects: ["var o8_luca_heard = true", "var o8_luca_doubt += 1"]
      - id: wrist
        label: 쇠창살 사이로 그의 손목을 잡는다 — 더러운 헝겊 밑을 본다
        minutes: 30
        check: {skill: 손재주, D: 20, helps: [medic, herbalist]}
        success:
          text: |
            헝겊 밑에서 쇠고랑 자국이 곪아 있다. 너는 물그릇의 물로 그것을 씻는다. 그가 숨을 들이켠다. 소리는 내지 않는다. 법의 자락 끝을 이로 찢어 손목에 감는다. 낭독실에서 늙은 사제들의 손을 싸매던 손이다.

            "…가르쳐 주마." 그가 말한다. 무엇을 가르쳐 주겠다는지는 말하지 않는다. 고맙다는 말 대신인 것 같다.
          effects: ["var o8_wrist_tended = true", "rel npc_alberic trust 8", "rel npc_alberic like 6", "temper 자비 3", "memory npc_alberic 다정함 빵 당번이 곪은 손목을 씻고 싸매 주었다", "note 9번의 손목 — 쇠고랑 자국이 곪아 있었다. 법의 자락으로 싸맸다"]
        failure:
          text: |
            헝겊 밑에서 쇠고랑 자국이 곪아 있다. 뜨겁고, 단내가 난다. 물그릇은 비어 있다. 손에는 아무것도 없다 — 약도, 깨끗한 천도.

            "괜찮다." 그가 손을 거둔다. "아홉 해 동안 이보다 나빴던 날이 많았다."
          effects: ["var o8_wrist_bad = true", "rel npc_alberic like 3", "stress 4"]
      - id: ninth_bread
        label: 바구니에서 빵 하나를 더 꺼내 쇠창살 안으로 민다
        minutes: 30
        text: |
          둘째 빵이 흙바닥을 미끄러져 들어간다. 손이 그것을 오래 쥐고 있다. "이건 누구 몫이냐."

          너는 대답하지 못한다. 그는 빵을 돌려주지 않는다. 아홉 해 동안 빵을 거절한 적이 없다고 한다. 거절은 배부른 자의 예의라고.

          올라가는 길, 일곱 덩이로 여덟 문을 지난다. 첫째 층 맨 끝 문 앞에서 바구니가 빈다. 문 아래 틈 너머에서 아무 소리도 나지 않는다. 너는 빈 바구니를 들고 지나간다.
        effects: ["var o8_ninth_bread = true", "deed share_food npc_alberic unseen", "rel npc_alberic like 6", "temper 자비 2", "note 아홉째 빵을 9번에게 — 첫째 층 맨 끝 독방이 오늘 빈손이다. 누구의 문인지 모른다"]
      - id: obey
        label: 빵만 넣고 일어선다 — 독방의 이단과는 말을 섞지 않는다, 규칙대로
        minutes: 30
        text: |
          너는 흙바닥의 글자를 보지 않는다. 보지 않은 것은 아뢰지 않아도 된다 — 그렇게 생각하기로 한다.

