  # ───────────────────────── 3일 아침: 대사제의 기침 ─────────────────────────
  - id: o8_gregor_cough
    origin: lumen_acolyte
    trigger: {window: {from: "312-09-03 09:30", to: "312-09-03 13:00"}, at: "@lumen", when: ["alive npc_gregor7"]}
    stage:
      - {npc: npc_gregor7, at: lm_cath_prayer_room, from: "312-09-03 09:30", to: "312-09-03 12:30", doing: "침상에 비스듬히 누워 기침한다 — 탕약 그릇을 기다린다"}
    text: |
      아침 암송이 끝나 갈 무렵, 안셀름 원장이 너를 부른다. "대사제께서 탕약을 들고 올 견습을 찾으셨네. 우물 당번으로." 그는 이유를 말하지 않는다. 모르는 얼굴은 아니다.

      종탑 밑 기도실. 쑥과 향유와 오래된 양피지 냄새. 빛의 대사제 그레고르 7세 — 여든둘, 삼십만 신도의 아버지 — 가 침상에 비스듬히 누워 있다. 목에 성표 고리 일곱 겹, 그 무게에 목이 앞으로 굽었다. 기침이 그치면 손이 떤다.

      탁자 위에 종이 한 장. 아주 작은 글씨가 빽빽하다. 그 곁에 접힌 양피지 하나 — 붉은 밀랍, 비어 있는 서명란.

      탕약 그릇을 받아 든 두 손이 흔들린다. 김이 오른다. 그가 너를 보지 않고 묻는다. "…알베릭은 아직 먹고 있느냐."
    effects: ["goto lm_cath_prayer_room"]
    choices:
      - id: eats
        label: '"드십니다. 하루 한 덩이를 — 남김없이."'
        minutes: 20
        text: |
          그릇이 입술에 닿았다가 떨어진다. "…그래. 먹는구나." 떨리는 손바닥이 이불 위에서 펴진다. 펜을 내려놓을 때처럼.

          "투옥에는 내가 서명했다. 그다음 것은 — 절차의 일이다. 절차는 느리다." 그는 탕약을 다 마시지 않는다. 남은 것을 네가 들고 나간다.
        effects: ["rel npc_gregor7 trust 8", "rel npc_gregor7 like 4", "memory npc_gregor7 정직함 우물 당번이 9번이 먹는다고 전했다", "goto lm_cath_nave"]
      - id: first_line
        when: ["pknows fact_o8_letter_first_line"]
        label: '"그분이 첫 줄을 가르치셨습니다. 에오르는 우리를 노예로 만들지 않았다."'
        minutes: 30
        text: |
          그릇이 이불 위에 엎어진다. 탕약이 번진다. 대사제는 그것을 보지 않는다. "그 문장은…" 성표 고리 하나를 쥔다. "…내가 한 말이다. 마흔 살에, 열여섯 살 아이들 앞에서. 한 아이가 받아 적었지."

          한참 뒤에 그가 덧붙인다. 너에게가 아니라. "나는 그 아이를 가르친 게 아니라, 그 아이 입에 말을 넣었던 거야."

          젖은 이불을 갈아 끼우는 동안 그는 아무 말도 하지 않는다.
        effects: ["learn fact_lu_gregor_teacher", "var o8_gregor_trusts = true", "rel npc_gregor7 trust 15", "stress 4", "memory npc_gregor7 이상함 우물 당번이 빛의 서신 첫 줄을 그 입으로 외웠다", "goto lm_cath_nave"]
      - id: read_warrant
        label: 그가 눈을 감은 사이 — 접힌 양피지의 이름들을 읽는다
        minutes: 20
        check: {skill: 읽고쓰기, D: 16, helps: [memory_palace, hawk_eye, scribe]}
        success:
          text: |
            열두 줄. 이름과 짧은 말 — 네가 읽을 수 있는 것은 딱 그만큼이고, 그 양피지에 적힌 것도 딱 그만큼이다.

            일곱째 줄. 벤노. 서원 견습. 이단과의 대화. 맨 위에 날짜 — 낙엽월 열이렛날, 정화의 뜰. 서명란은 비어 있다.

            대사제가 눈을 뜨기 전에 너는 그릇을 고쳐 든다.
          effects: ["learn fact_o8_benno_list", "var o8_benno_known = true", "note 첫 장작 승인서 — 낙엽월 17일, 열두 줄. 일곱째 줄 벤노. 서명란은 비어 있다", "goto lm_cath_nave"]
        failure:
          text: |
            글자에 눈이 닿기도 전에 젖은 눈이 떠진다. "그대여." 목소리가 얇다. "그것은 기도문이 아니다."

            그가 양피지를 이불 밑으로 끌어당긴다. 손이 떨려서 두 번 만에.
          effects: ["rel npc_gregor7 trust -5", "memory npc_gregor7 위험함 우물 당번이 탁자의 양피지를 읽으려 했다", "goto lm_cath_nave"]
      - id: spare_benno
        when: ["var o8_benno_known == true"]
        label: '"첫 장작의 일곱째 줄 — 벤노는 9번 독방 앞에 오래 있었던 죄뿐입니다."'
        minutes: 30
        check: {skill: 화술, D: 30, helps: [tongue, etiquette, crowd_voice], warn: ["var o8_gregor_trusts == true"]}
        success:
          text: |
            대사제가 펜을 든다. 펜을 내려놓는다. 떨리는 손바닥을 편다. 한 호흡. 다시 든다. 일곱째 줄에 줄을 긋지 않는다. 대신 그 이름 옆에 아주 작은 점 하나.

            "서명이 느려질 것이다. 그뿐이다." 그가 눈을 감는다. "마테우스는 열둘을 채울 것이다. 그는 늘 채운다."

            점 하나가 누구의 이름을 부를지, 너도 그도 묻지 않는다.
          effects: ["var o8_benno_saved = true", "temper 자비 4", "stress 8", "rel npc_gregor7 trust 6", "memory npc_gregor7 용감함 우물 당번이 승인서의 이름 하나를 두고 빌었다", "note 벤노의 이름 옆에 점 하나 — 서명이 늦어진다. 마테우스는 열둘을 채운다", "goto lm_cath_nave"]
        failure:
          text: |
            젖은 눈이 처음으로 너를 똑바로 본다. "…그대는 다음 줄이 되고 싶으냐." 질문이 아니다.

            그는 양피지를 덮고 눈을 감는다. 탕약 그릇을 받는 손이 문까지 너를 밀어낸다.
          effects: ["fear 1", "rel npc_gregor7 trust -3", "goto lm_cath_nave"]
      - id: silent
        label: 탕약 그릇을 받쳐 들고 — 아무 말 없이 기다린다
        minutes: 20
        text: |
          대답이 없자 그가 고개를 끄덕인다. 대답을 들은 것처럼. "고난은 정화이니, 견디라." 입버릇이다. 그 말을 하는 동안 그의 눈은 탁자 위의 종이에 가 있다.

          너는 빈 그릇을 들고 나온다.
        effects: ["stress 2", "goto lm_cath_nave"]
      # ── ◈ 기억 선택지: 돌아온 눈 ──
      - id: mem_eyes
        needs_memory: loop
        label: 젖은 눈을 마주 본다 — 피하지 않고
        minutes: 20
        text: |
          그릇을 든 손이 멈춘다. 김만 오른다. "…그대의 눈." 목소리가 처음으로 또렷하다. 낭독할 때의 목소리다. "어디서 보았더라. 서품 날, 엘다르가 말한 '단 하나'의 —"

          그는 말을 끊는다. "…아니다. 늙으면 모든 눈이 낯익다."

          그러나 네가 문을 나설 때 그가 부른다. 낮게. "알베릭의 서명은 하지 않았다. 내가 숨 쉬는 동안은."
        effects: ["var o8_gregor_sensed = true", "learn fact_lu_gregor_delays_signature", "rel npc_gregor7 trust 12", "memory npc_gregor7 이상함 우물 당번의 눈이 서품 날 들은 '단 하나'의 눈 같았다", "goto lm_cath_nave"]

  # ───────────────────────── 5일 새벽 기도 뒤: 감독관의 감사 ─────────────────────────
  # 변형 셋 (먼저 맞는 것이 열린다): 루카가 너를 아뢴다 / 루카가 니클라스를 아뢴다 (네가 준 이름) / 감사만.
  - id: o8_audit_accused
    origin: lumen_acolyte
    trigger: {window: {from: "312-09-05 06:00", to: "312-09-05 11:00"}, at: "@lumen", when: ["var o8_audit_done != true", "var o8_luca_doubt >= 2", "var o8_luca_quiet != true", "alive npc_o8_luca"]}
    stage:
      - {npc: npc_serenielle, at: lm_sem_hall, from: "312-09-05 05:30", to: "312-09-05 08:30", doing: "낭독실 문지방 너머 — 백합 향 손수건으로 코를 가리고 견습들의 문자판을 본다"}
    text: |
      새벽 기도가 끝나도 낭독실 문이 닫히지 않는다. 문간에 엘다르가 서 있다. 세레니엘 맑은잎 — 맑은물 정자의 수석 감독관. 피부 밑으로 핏줄이 은빛으로 비친다. 그녀는 문지방을 넘지 않는다. 백합 향 손수건이 코를 가린다. 인간 시종 하나가 세 걸음 뒤에 서 있다.

      견습 마흔이 긴 탁자에 문자판을 펴 놓는다. 같은 시각, 아홉 층 아래에서는 간수장이 9번 독방의 벽에 회칠을 하고 있을 것이다.

      "서약을." 손수건 너머의 목소리는 모음이 길다. 견습들이 한목소리로 외운다 — 본 것을 보고하리라. 그리고 하나씩, 본 것을 아뢴다. 대개는 아무것도 없다.

      루카의 차례. 그가 일어선다. 성표를 쥔 손이 하얗다. "서원 마흔셋은 9번 독방 앞에서 오래 머뭅니다. 저는 계단에서 들었습니다 — 글자를."

      낭독실이 조용해진다. 손수건이 너를 향해 아주 조금 돈다. "거기서 말하라."
    effects: ["var o8_audit_done = true", "goto lm_sem_hall"]
    choices:
      - id: deny
        label: '"빵을 넣고 ''빛이 너를 기억한다''고 말했을 뿐입니다."'
        minutes: 30
        check: {skill: 기만, D: 26, helps: [actor, false_face, deceit], D_per_loop: 3}
        success:
          text: |
            손수건이 한 박자 머문다. "…기억에 있는 거짓이었다. 인간의 거짓은 대개 그렇다."

            그녀의 눈이 루카에게 간다. "계단에 있었다고 했다. 빵 당번 말고는 내려갈 수 없는 계단에." 루카의 얼굴에서 피가 빠진다. 그날 저녁 기숙사에서 그는 등을 돌리고 눕는다. 손바닥에 회초리 자국 다섯.
          effects: ["var o8_audit_passed = true", "var o8_luca_quiet = true", "var o8_luca_shamed = true", "var o8_oath_broken += 1", "rel npc_o8_luca like -10", "temper 정직 -3", "memory npc_o8_luca 거짓말쟁이 마흔셋이 감독관 앞에서 거짓말을 했고 내가 매를 맞았다", "note 감독관 앞에서 부인했다 — 루카가 매를 맞았다"]
        failure:
          text: |
            손수건이 내려가지 않는다. "…그 문장은 기억에 없다. 참도 거짓도 아닌 문장이다." 그녀가 시종에게 손짓한다. 네 판을.
          effects: ["var o8_in_report = true", "var o8_oath_broken += 1", "then o8_board_turned"]
      - id: confess_part
        label: '"그분이 제 판을 읽어 보라 하셨습니다. 저는 셋째 줄을 읽었습니다 — 경전의 순서대로."'
        minutes: 30
        check: {skill: 화술, D: 24, helps: [tongue, etiquette]}
