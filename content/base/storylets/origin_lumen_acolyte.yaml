        minutes: 10
        text: |
          벽의 돌이 차다. 등 뒤에서 루카의 숨이 한참 그대로 있다. "그래." 마침내 그가 일어선다. "그럼 내가 알아서 아뢸게. 서약대로."

          그의 발소리가 자기 침상으로 간다. 성표 고리가 침상 기둥에 한 번 부딪힌다.
        effects: ["agenda if var o8_luca_quiet != true: var o8_luca_doubt += 1", "stress 4"]
      # ── ◈ 기억 선택지: 지난 회차에 벤노에게서 들었다 ──
      - id: mem_benno
        needs_memory: fact:fact_o8_benno_reported
        label: '"벤노한테도 이렇게 물었어? 열흘 전에, 이렇게 침상 발치에 앉아서."'
        minutes: 10
        text: |
          성표가 그의 손에서 미끄러진다. 쇠고리가 침상 기둥에 부딪힌다. 소리가 크다. 마흔 개의 숨 가운데 몇이 멈춘다.

          "…벤노는 아팠어." 그의 목소리가 갈라진다. "병이 났다고 했잖아. 원장님이 그랬잖아." 그는 일어선다. 자기 침상으로 가지 않는다. 문 쪽으로 간다. 밤 기도는 끝났는데.
        effects: ["var o8_luca_shaken = true", "var o8_luca_quiet = true", "rel npc_o8_luca like -4", "memory npc_o8_luca 이상함 마흔셋이 벤노의 일을 안다 — 누가 말했나"]

  # ───────────────────────── 2일 저녁: 다시 우물로 (아홉째 빵의 값) ─────────────────────────
  # 변형 둘 — 아홉째 빵을 9번에게 더 넣었으면 첫째 층의 벤노가 빈손으로 밤을 났다. 선택지는 같다 (&o8_descent_choices).
  - id: o8_descent_hungry
    origin: lumen_acolyte
    trigger: {window: {from: "312-09-02 18:55", to: "312-09-02 21:00"}, at: "@lumen", when: ["var o8_ninth_bread == true", "var o8_descent_done != true", "alive npc_alberic"]}
    stage:
      - {npc: npc_lm_jakob, at: lm_uc_gate, from: "312-09-02 18:50", to: "312-09-02 19:20", doing: "우물 문 — 빵 바구니를 건넨다. 묻지 않는다"}
    text: |
      저녁 기도 종. 우물 문에서 간수 야코프 — 숨죽인 목소리, 소매 안에 열쇠 꾸러미 — 가 바구니를 건넨다. 검은 빵 아홉. 그는 아무것도 묻지 않는다. 묻지 않는 것이 그의 대답이다.

      첫째 층. 맨 끝 독방의 문 아래 틈에서 목소리가 너를 부른다. 이름이 아니라 번호로. "마흔셋."

      너는 그 목소리를 안다. 기숙사, 네 옆 침상. 벤노다.

      "어제 빵이 안 왔어." 웃음 같은 숨이 틈으로 새어 나온다. "그래서 알았지. 새 당번이 아래에서 누구한테 하나를 더 줬구나. 나도 그랬어. 그래서 여기 있는 거야."

      바닥부터 먹인다. 그의 빵은 오늘도 마지막이다.

      아홉째 층. (똑, 똑똑, 똑.) 쇠창살 안에서 손끝이 돌을 두드리고, 옆 감방에서 가늘게 대답이 온다. 똑똑. 어제의 흙바닥 글자는 지워져 있다.
    effects: ["var o8_descent_done = true", "var o8_benno_known = true", "goto lm_uc_cell_9", "note 벤노는 병이 나지 않았다 — 우물 첫째 층 맨 끝 독방. 어제 빵을 받지 못한 문이 그의 문이었다"]
    choices: &o8_descent_choices
      - id: lesson
        label: 쇠창살 앞에 앉는다 — 그가 짚는 글자를 따라 짚는다
        minutes: 45
        risk: 계단 위의 귀
        check: {skill: 읽고쓰기, D: 24, helps: [memory_palace, scribe, photo_memory]}
        success:
          text: |
            오늘은 문장이 아니라 소리다. 그는 글자 하나를 짚고 소리를 낸다. 낮게. 너는 따라 짚는다. 같은 소리가 경전의 다른 자리에도 있다는 것을, 그 소리들을 이으면 아무 말이나 된다는 것을 — 손끝이 먼저 안다.

            "써 봐라." 너는 흙바닥에 쓴다. 벤노. 첫째 층의 그 이름을. 그가 손끝으로 그 글자들을 더듬는다. 오래. "…좋은 이름이다. 지워라."

            네가 지우는 동안 계단 어딘가에서 돌가루가 떨어진다.
          effects: ["skill_gain 읽고쓰기 5", "var o8_letters_free = true", "var o8_lessons += 1", "learn fact_o8_any_sentence", "rel npc_alberic trust 6", "agenda if var o8_luca_quiet != true: var o8_luca_doubt += 1", "note 9번에게 소리를 배웠다 — 마흔두 글자로 무슨 말이든"]
        failure:
          text: |
            그의 소리를 따라가다 손끝이 엉킨다. 열 해 동안 같은 자리에 서 있던 글자들이 비켜서지 않는다.

            그가 손을 거둔다. "괜찮다. 손이 먼저 겁을 낸다. 내일도 빵은 온다."
          effects: ["skill_gain 읽고쓰기 2", "var o8_lessons += 1", "rel npc_alberic like 3", "agenda if var o8_luca_quiet != true: var o8_luca_doubt += 1"]
      - id: wrist_again
        when: ["var o8_wrist_tended != true"]
        label: 그의 손목 — 곪은 자리를 물로 씻고 법의 자락으로 싸맨다
        minutes: 30
        check: {skill: 손재주, D: 18, helps: [medic, herbalist]}
        success:
          text: |
            물그릇의 물을 다 쓴다. 법의 자락은 이제 무릎 아래가 들쭉날쭉하다. 원장이 그것을 볼 것이다.

            그는 손을 거두지 않는다. 다 감을 때까지. 다 감고 나서야 두드림이 다시 시작된다. 옆 감방에 무언가를 전하는 박자다. 너에 대한 것인지는 모른다.
          effects: ["var o8_wrist_tended = true", "var o8_alberic_fever = false", "rel npc_alberic trust 6", "temper 자비 3", "memory npc_alberic 다정함 빵 당번이 곪은 손목을 씻고 싸매 주었다"]
        failure:
          text: |
            헝겊을 벗기자 단내가 올라온다. 손목이 뜨겁다. 손목만이 아니다. 이마도.

            너는 물을 붓고, 감고, 다시 감는다. 그가 웃는다. 이가 몇 남지 않은 웃음. "열이 나는 건 몸이 아직 싸운다는 뜻이다."
          effects: ["var o8_alberic_fever = true", "stress 6", "rel npc_alberic like 3"]
      - id: scratch_board
        when: ["var o8_letters_free == true", "var o8_board_marked != true"]
        label: 배운 순서를 잊지 않으려고 — 문자판 뒷면에 손톱으로 새긴다
        minutes: 20
        risk: 판을 뒤집는 사람은 안다
        text: |
          등잔을 계단에 내려놓고, 판을 뒤집는다. 손톱이 나무를 판다. 경전의 순서가 아니라 소리의 순서. 마흔두 개의 홈 뒤에 마흔두 개의 긁힌 자국.

          쇠창살 안에서 두드림이 멎는다. "…그 판은 너보다 오래 산다." 그는 그 말만 한다.
        effects: ["skill_gain 읽고쓰기 3", "var o8_board_marked = true", "note 문자판 뒷면에 소리의 순서를 새겼다 — 판을 뒤집는 사람은 안다"]
      - id: talk_benno
        label: 올라가는 길 — 첫째 층의 문 앞에 무릎을 꿇고 벤노에게 묻는다
        minutes: 30
        risk: 독방과 말을 섞는 것 — 벤노가 여기 온 까닭
        text: |
          빵을 문 아래로 밀어 넣으며 너는 일어서지 않는다. 틈 너머의 숨이 멈춘다. 그러다 빠르게 말한다. 들킬 시간이 없다는 듯이.

          "루카야. 내가 9번 앞에 오래 있었다고, 글자를 짚었다고. 동판 쪽지 하나 받았대." 웃음 같은 숨. "열이렛날. 장작 열둘. 간수가 세는 걸 들었어. 나는 일곱째래."

          그가 틈에 대고 마지막으로 말한다. "너도 루카한테는 말하지 마. 아무것도."
        effects: ["learn fact_o8_benno_reported", "learn fact_o8_benno_list", "var o8_benno_known = true", "stress 8", "temper 용기 2", "note 벤노 — 루카가 고했다. 낙엽월 17일 첫 장작, 일곱째"]
      - id: confess_alberic
        when: ["var o8_reported_inq == true"]
        label: '"제가 아뢰었습니다. 어젯밤, 정화청에."'
        minutes: 15
        text: |
          두드림이 멎는다. 쇠창살 안의 그는 등을 돌리고 앉아 있다. 오늘 그의 몫은 반 덩이였다. 바구니에서 그것을 꺼낸 것이 네 손이었다.

          "…알고 있다." 쉰 목소리. "서약을 지키는 아이를 미워한 적은 없다. 아홉 해 동안 한 번도." 그는 돌아보지 않는다. "다만 오늘은 가르치지 않겠다."
        effects: ["rel npc_alberic trust 4", "rel npc_alberic like -5", "stress 10", "temper 정직 2"]
      - id: climb
        label: 빵을 넣고 — 여덟 문을 거쳐 올라간다
        minutes: 30
        text: |
          바닥에서 꼭대기까지. 문마다 '빛이 너를 기억한다.' 첫째 층 맨 끝 문 아래로 마지막 빵이 들어간다. 틈 너머에서 아무 말도 없다. 빵을 받는 소리만.
        effects: ["stress 3", "goto lm_uc_gate"]
      # ── ◈ 기억 선택지: 지난 회차에 그가 머릿속에만 둔 문장을 들었다 ──
      - id: mem_second_letter
        needs_memory: fact:fact_lu_alberic_second_letter
        label: '쇠창살에 이마를 대고: "우리는 돌아오지 않는다. 그러니 무릎 꿇은 채 이번 생을 낭비하지 마라."'
        minutes: 20
        text: |
          두드림이 멎는다. 아주 오래. 옆 감방에서 대답을 기다리는 두드림이 한 번 오고, 그친다.

          "…그 문장을 어디서 들었느냐." 그의 목소리에 처음으로 박자가 없다. "아직 아무 데도 쓰지 않았다. 벽에도. 머릿속에만 있다." 손톱 없는 손이 쇠창살 사이로 나와 네 손등을 찾는다. 차다. "돌아오는 이는 — 노래 속에만 있는 줄 알았다."
        effects: ["var o8_alberic_knows = true", "rel npc_alberic trust 20", "echo_sign 1 아직 쓰이지 않은 서신의 첫 문장을 안다", "stress 4", "memory npc_alberic 이상함 빵 당번이 아직 쓰지 않은 두 번째 서신의 첫 문장을 말했다"]

  - id: o8_descent
    origin: lumen_acolyte
    trigger: {window: {from: "312-09-02 18:55", to: "312-09-02 21:00"}, at: "@lumen", when: ["var o8_descent_done != true", "alive npc_alberic"]}
    text: |
      저녁 기도 종. 우물 문에서 간수 야코프 — 숨죽인 목소리, 소매 안에 열쇠 꾸러미 — 가 바구니를 건넨다. 검은 빵 아홉. 그는 아무것도 묻지 않는다. 묻지 않는 것이 그의 대답이다.

      첫째 층. 맨 끝 독방의 문 아래 틈에서 목소리가 너를 부른다. 이름이 아니라 번호로. "마흔셋."

      너는 그 목소리를 안다. 기숙사, 네 옆 침상. 벤노다. 어제 너는 이 문 앞에 빵을 놓고 지나갔다. 누구의 문인지 모른 채.

      "아래에 가지 마." 틈 너머에서 숨이 빠르다. "아니 — 가. 빵은 줘야지. 말만 하지 마. 아무 말도. 나는 그 말 때문에 여기 있어."

      아홉째 층. (똑, 똑똑, 똑.) 쇠창살 안에서 손끝이 돌을 두드리고, 옆 감방에서 가늘게 대답이 온다. 똑똑. 어제의 흙바닥 글자는 지워져 있다.
    effects: ["var o8_descent_done = true", "var o8_benno_known = true", "goto lm_uc_cell_9", "note 벤노는 병이 나지 않았다 — 우물 첫째 층 맨 끝 독방"]
    choices: *o8_descent_choices

  # ───────────────────────── 2일 정오~4일: 첫 번째 고리 (원장에게 아뢰었을 때) ─────────────────────────
  - id: o8_first_ring
    origin: lumen_acolyte
    trigger: {window: {from: "312-09-02 12:00", to: "312-09-04 18:00"}, at: "@lumen", when: ["var o8_told_anselm == true", "alive npc_lm_anselm", "var o8_betrayed_anselm != true"]}
    text: |
      정오 기도 종이 그치자 심부름 견습 하나가 너를 찾는다. 원장실.

      안셀름 원장은 책상 모서리를 두드리지 않는다. 손이 책상 위의 얇은 책을 덮고 있다. 가죽 표지, 성 마렌 축일 성가집. 책등을 한 번 뜯었다가 다시 꿰맨 자리가 보인다. 꿰맨 실이 새것이다.

      "구절 하나 외워 보게." 너는 외운다. 그는 뜻을 묻지 않는다. "어젯밤 자네가 아뢴 사람은 글은 그릇이라고 했네. 그릇은 무언가를 나르는 거야."

      그가 성가집을 네 쪽으로 민다. "성가 막사의 라우렌츠 사제에게. 오후 연습 전에. 아무것도 묻지 말고 — 아무것도 보고하지 말고."
    effects: ["goto lm_seminary"]
    choices:
      - id: carry
        label: 성가집을 법의 안에 품고 회랑을 지난다 — 정화청 창 아래로
        minutes: 40
        check: {skill: 기만, D: 22, helps: [actor, false_face, etiquette]}
        success:
          text: |
            회랑의 그림자가 짧다. 정오다. 심문소 창 아래를 지날 때 너는 걸음을 늦추지도 서두르지도 않는다. 성가집을 든 견습은 성가 막사로 간다. 그뿐이다.

            성가 막사. 라우렌츠 사제 — 귀에 밀랍 마개를 한 지휘 사제 — 가 성가집을 받아 책등을 엄지로 한 번 쓴다. "한 줄 불러 보게." 너는 부른다. 그가 고개를 끄덕인다. "자네 목소리는 거짓말을 못 하는군. 다행이야. 거짓말은 손이 하면 되니까."

            그가 성가집을 악보 더미 맨 아래에 끼운다. "걸쇠가 고리를 하나 더 걸었군."
          effects: ["var o8_ring_trial = true", "learn fact_o8_hymnal_road", "learn fact_lm_anselm_clasp", "rel npc_lm_anselm trust 10", "rel npc_lm_laurenz trust 10", "temper 용기 3", "goto lm_sem_chant", "note 성가집을 라우렌츠에게 — 끊어진 고리의 첫 시험. 원장은 걸쇠다"]
        failure:
          text: |
            회랑 모퉁이에서 누군가와 어깨가 부딪친다. 성가집이 돌바닥에 떨어진다. 맑은 눈의 젊은 사제가 그것을 집어 든다 — 심문 사제 에기디우스. 그는 성가 한 장을 넘겨 본다. 둘째 장. 꿰맨 책등에는 손이 가지 않는다.

            "무겁군요, 성가집이." 그가 돌려준다. "서원 번호는?" "마흔셋." "마흔셋." 두 번. 그는 웃는다. 고해실의 사제처럼.

            성가 막사에서 라우렌츠는 아무것도 묻지 않는다. 네 손이 떨리는 것을 보았기 때문이다.
          effects: ["var o8_ring_trial = true", "var o8_aegidius_eye = true", "learn fact_o8_hymnal_road", "fear 1", "stress 8", "rel npc_lm_laurenz trust 4", "memory npc_lm_aegidius 이상함 서원 마흔셋이 성가집을 떨어뜨리고 손을 떨었다", "goto lm_sem_chant", "note 에기디우스가 내 번호를 두 번 물었다"]
      - id: read_seam
        when: ["var o8_letters_free == true"]
        label: 건네기 전에 — 꿰맨 책등을 손톱으로 열고 접힌 종이를 읽는다
        minutes: 50
        check: {skill: 읽고쓰기, D: 22, helps: [memory_palace, scribe]}
        success:
          text: |
            책등 안에 접힌 종이 두 장. 글자들이 경전의 순서를 버리고 소리대로 서 있다. 빛의 서신. 첫 줄 — 에오르는 너희를 노예로 만들지 않았다.

            너희. 9번 독방의 손끝은 '우리'라고 짚었다. 모양 하나가 뒤집혀 있다. 이 종이를 베낀 손은 글을 읽지 못하는 손이다. 그래서 틀린 줄도 모른다.

            너는 손톱으로 그 모양 하나를 긁어 바로 세운다. 책등을 다시 여민다. 라우렌츠는 꿰맨 실을 엄지로 쓸어 보고, 아무것도 묻지 않는다.
          effects: ["var o8_ring_trial = true", "var o8_copy_fixed = true", "learn fact_lm_otilie_copies", "learn fact_lm_otilie_flawed_first_line", "learn fact_o8_hymnal_road", "skill_gain 읽고쓰기 2", "rel npc_lm_anselm trust 6", "goto lm_sem_chant", "note 성가집 속 서신의 첫 줄 — '우리'가 '너희'로 뒤집혀 있었다. 바로잡았다"]
        failure:
