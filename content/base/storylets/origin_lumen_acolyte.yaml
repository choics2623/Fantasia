          너는 우물에서 본 것을 아뢴다. 다. 그는 끝까지 듣고, 고개를 한 번 끄덕인다. 귀리죽 그릇이 네 쪽으로 온다. "내일 정오, 원장실로 오게."
        effects: ["var o8_told_anselm = true", "var o8_oath_kept += 1", "var o8_ring_known = true", "hunger -1", "rel npc_lm_anselm trust 15", "memory npc_lm_anselm 이상함 마흔셋이 걸쇠라는 낱말을 안다 — 누가 가르쳤나", "note 원장은 끊어진 고리의 걸쇠다 — 카타콤에 빈 못 하나"]

