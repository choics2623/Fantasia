      견습 마흔이 긴 탁자에 문자판을 펴 놓는다. "서약을." 손수건 너머의 목소리는 모음이 길다. 견습들이 한목소리로 외운다 — 본 것을 보고하리라. 그리고 하나씩, 본 것을 아뢴다.

      루카의 차례. 그가 일어선다. 성표를 쥔 손이 하얗다. "견습 니클라스는 밤마다 허공에 글자를 그립니다. 저는 보았습니다." 그는 너를 보지 않는다. 그 말은 네 입에서 나간 말이다.

      마지막 침상의 니클라스가 고개를 든다. 손가락이 허공에서 멈춘 채로. 손수건이 그쪽으로 돈다 — 기억에 이미 있는 이름이라는 듯이, 쉽게. "그 아이."
    effects: ["var o8_audit_done = true", "var o8_niklas_watch = true", "goto lm_sem_hall"]
    choices:
