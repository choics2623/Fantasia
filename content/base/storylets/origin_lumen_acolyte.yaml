        minutes: 15
        text: |
          "그뿐인가." 원장이 눈을 뜬다. 오래 너를 본다. 구석에서 루카의 입술이 멈춘다.

          "…그래. 먹고 자게." 손가락이 다시 책상 모서리로 간다. 아까보다 느리다.

          귀리죽은 식었다. 너는 그것을 다 먹는다. 서원한 입으로.
        effects: ["var o8_oath_broken += 1", "hunger -1", "temper 정직 -3", "temper 신앙 -2", "stress 6", "agenda if var o8_luca_heard == true: var o8_luca_doubt += 1", "memory npc_lm_anselm 이상함 마흔셋이 우물에서 아무것도 보지 못했다고 했다"]
      # ── ◈ 기억 선택지: 지난 회차에 원장이 무엇인지 알았다 ──
      - id: mem_clasp
        needs_memory: fact:fact_lm_anselm_clasp
        label: '원장에게만 들리게: "걸쇠께서는 오늘 고리 하나를 더 거시렵니까."'
