            그녀는 한참 너를 본다. 니클라스를 데려가라는 손짓은 오지 않는다. 대신 그녀의 눈이 감긴다. 기억에 무언가를 새기는 동안. 네 번호다.
          effects: ["var o8_niklas_safe = true", "var o8_in_report = true", "var o8_audit_passed = true", "rel npc_lm_niklas trust 20", "temper 정직 4", "temper 용기 4", "rel npc_o8_luca like -10", "memory npc_lm_niklas 용감함 마흔셋이 감독관 앞에서 내 이름을 거두어 갔다", "note 니클라스의 이름을 거두었다 — 대신 내 번호가 새겨졌다"]
        failure:
