            손수건이 너를 본다. 그리고 니클라스를 본다. "둘 다였다." 과거형.

            니클라스가 일어선다. 문간에서 한 번 돌아본다. 너를. 그리고 네 번호가 기억 수정에 새겨진다. 그를 구하지 못한 채로.
