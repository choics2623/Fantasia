            라우렌츠는 책등을 엄지로 쓸어 보고 오래 너를 본다. "누가 열었나." 대답을 기다리지 않는다. "다음에는 열지 말게. 여는 손은 읽는 손보다 먼저 들키네."
          effects: ["var o8_ring_trial = true", "learn fact_o8_hymnal_road", "rel npc_lm_laurenz trust -5", "goto lm_sem_chant"]
      - id: to_tobias
        label: 성가집을 받아 든다 — 그리고 성가 막사가 아니라 밀고 함 홀로 간다
        minutes: 60
        risk: 원장이 끌려간다
        text: |
          밀고 함 홀. 열두 개의 나무 함. 토비아스가 고개를 든다. "이름은." "서원 마흔셋." "이름은?" "마흔셋."

          그가 성가집의 책등을 칼끝으로 연다. 접힌 종이. 그는 그것을 읽지 않는다. 읽지 않아도 무엇인지 안다. "누구에게서." 너는 원장의 이름을 댄다. 그는 받아 적고, 다른 장부에 한 줄을 더 쓴다. 동기.

          그날 오후, 원장실 문 앞에 검은 끈의 사제 둘이 선다. 안셀름은 책상 모서리를 두드리지 않는다. 낭독실의 견습들이 구절을 소리 내 외운다 — 큰 소리로, 아주 큰 소리로.
        effects: ["var o8_betrayed_anselm = true", "var o8_oath_kept += 1", "agenda capture npc_lm_anselm at lm_inq_interrogation", "var lm_impure += 1", "deed inform npc_lm_anselm", "item o8_reward_note", "temper 신앙 6", "temper 자비 -10", "temper 충성 -8", "stress 15", "goto lm_inq_hall", "note 원장의 성가집을 정화청에 — 검은 끈의 사제 둘이 원장실 문 앞에 섰다"]
      - id: refuse
        label: '성가집에 손대지 않는다 — "저는 본 것을 보고하겠다고 서원했습니다."'
        minutes: 15
        text: |
          원장이 성가집을 거둔다. 천천히. "그렇지. 그렇게 서원했지. 나도 했네. 마흔 해 전에." 손가락이 책상 모서리로 돌아간다. "그럼 오늘 본 것도 보고하게. 누구에게 할지는 — 자네가 고르게."

          그는 다시 눈을 감는다. 구절을 외우는 입술이 움직인다. 너는 원장실 문을 닫고 나온다. 등 뒤에서 두드리는 소리가 계속된다. 박자가 흐트러지지 않는다.
        effects: ["var o8_ring_refused = true", "learn fact_lm_anselm_clasp", "rel npc_lm_anselm trust -5", "temper 신앙 3", "stress 6", "note 원장은 고리의 사람이다 — 그리고 그것을 내게 보였다. 누구에게 아뢸지는 내가 고른다"]
      # ── ◈ 기억 선택지: 지난 회차에 책등 속 첫 줄을 읽었다 ──
      - id: mem_copy_flaw
        needs_memory: fact:fact_lm_otilie_flawed_first_line
        label: '"원장님, 그 안의 첫 줄 — 모양 하나가 뒤집혀 있습니다. 읽지 못하는 손이 베꼈으니까요."'
        minutes: 40
        text: |
          원장의 손이 성가집 위에서 굳는다. "…열지도 않고 그걸 아는가." 그는 책등을 연다. 직접. 종이를 펴고, 오래 본다. 그는 읽을 줄 안다. 사슬사제니까.

          "우리가… 너희로." 그가 칼끝으로 그 모양 하나를 바로 세운다. 손이 떨리지 않는다. "누가 자네를 가르쳤는지 묻지 않겠네. 뜻을 묻지 않는 것이 이 낭독실의 규칙이니까." 성가집이 다시 네 쪽으로 온다. "라우렌츠에게."
