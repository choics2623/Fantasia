# 셋째의 다른 갈래 — 회귀점의 대본 장면 (origins.yaml의 opening). 배급 줄(greyford_opening.yaml)과 같은 저녁 6시, 다른 자리.
# origin: 이 갈래로 시작한 판에서만 열리고, 그 판에서만 stage(사람 세우기)가 걸린다.
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 진짜 이름, {sibling} = 키트가 부르는 말.
storylets:
  # ───────────────────────── 성채 하인 ─────────────────────────
  - id: keep_supper_open
    origin: keep_servant
    trigger: {start: true}
    stage:
      - {npc: npc_kit, at: gf_keep_yard, from: "18:00", to: "18:20", doing: 물통을 내려놓고 성채 마당을 나서려다 너를 본다}
      - {npc: npc_gerda, at: gf_keep_yard, from: "18:00", to: "18:12", doing: 직조 헛간의 천 꾸러미를 안고 부엌 뒷문에 서 있다}
      - {npc: npc_godric_raven, at: gf_keep_hall, from: "18:00", to: "19:30", doing: 식탁 머리에서 고기를 썬다}
      - {npc: npc_henrik, at: gf_keep_hall, from: "18:00", to: "19:10", doing: 장부를 펴 놓고 명단을 읽어 올린다}
      - {npc: npc_martha, at: gf_keep_hall, from: "18:00", to: "19:30", doing: 문가에 서서 접시 수를 눈으로 센다}
      - {npc: npc_sara, at: gf_keep_hall, from: "18:00", to: "19:30", doing: 술병을 들고 남작의 잔을 채운다}
    text: |
      구운 고기 냄새. 기름이 숯에 떨어져 타는 냄새.

      부엌 뒷마당 우물. 두레박 줄이 손바닥을 긁는다. 연회실 쪽에서 칼이 접시를 긁는 소리, 낮은 웃음. 오늘 저녁 남작의 식탁엔 손님이 하나 더 있다 — 징세관 헨릭.

      마당 끝에서 키트가 물통을 내려놓는다. 열 살, 네 동생. 오후 내내 성채 마당을 쓸고 이제 움막으로 돌아가는 길이다. 키트가 너를 보고 손을 든다.

      부엌 뒷문 그늘에서 누가 부른다. 낮게. 아무도 못 듣게.
    input: true_name
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "구운 고기 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 구운 고기 냄새."}
    trace_lines:
      water: 두레박 줄이 손에서 미끄러진다. 목 안에 물이 있다. 없다. 우물은 저 아래에 있다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 아무것도 없다.
      spear: 옆구리가 시리다. 앞치마 끈을 쥔 손이 거기로 간다.
      blade: 목이 뜨겁다. 손을 대 보면 아무것도 없다. 부엌칼은 제자리에 있다.
      rope: 손목이 쓸린다. 두레박 줄 자국뿐이다.
      hunger: 배가 꼬인다. 아니다 — 이 저녁엔 남작의 식탁에서 남은 것이 내려온다.
    return_ink: |
      ┊ 그 다음엔 연회실에서 헨릭이 명단을 읽어 올렸다. 스물여섯째 줄, 키트.
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 성채 담 안팎을 통틀어 하나뿐이다. 어머니다. 게르다가 직조 헛간의 천 꾸러미를 안고 부엌 뒷문에 서 있다. 기침을 손등으로 막는다.

      "명단 얘기 들었다. 그래서 부르는 거야. 아무한테도 말하지 마라. 이름을 아는 자가 너를 가진다." 어머니의 눈이 마당 끝의 키트에게 간다. "성채 안에서 뭘 듣거든 — 너는 듣는 자리에 있잖니."

      안에서 마르타가 손뼉을 한 번 친다. 하인을 부르는 소리. 어머니는 천 꾸러미를 문간에 내려놓고 돌아선다.
    effects: ["var mother_called = true", "note 어머니만 아는 이름 — {name}. 성채에서는 너를 셋째라 부른다"]
    next: keep_supper_list

  - id: keep_supper_list
    origin: keep_servant
    text: |
      연회실. 너는 포도주 병을 들고 벽 쪽 그늘에 선다. 고드릭 레이번 — 이 성채의 주인, 빚진 남작 — 은 고기를 썰고 고개를 들지 않는다. 사라가 그의 잔을 채운다. 술병 주둥이가 잔 가장자리에 두 번 부딪힌다.

      식탁 끝에서 헨릭이 장부를 편다. "1차분, 마흔. 서리월 아흐레." 그가 이름을 읽어 내려간다. 숫자처럼. "…스물다섯, 토마스네 둘째. 스물여섯, 키트. 게르다 가구." 손가락이 그 줄에서 멈춘다. 쇳소리 같은 말 하나. "하르벡."

      그 말을 너는 반쯤 안다. 식탁에서 열 해 동안 주워들은 주인들의 말. 담보.

      문가에서 마르타가 너를 본다. 접시를 세던 눈이다. 너는 병을 고쳐 쥔다.

      헨릭의 장부가 촛불 쪽으로 기울어 있다. 너는 글을 모른다. 그런데 줄 하나가 읽힌다 — 키트. 그 아래, 낯선 글자들이 제자리를 찾아 들어간다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["goto gf_keep_hall", "learn fact_op_kit_line_keep", "var goal_kit_known = true", "note 남작의 식탁 — 키트가 첫 매각 명단 스물여섯째 줄에 있다. 헨릭이 '하르벡'이라 했다"]
    choices:
      - id: peek_ledger
        label: 헨릭의 잔을 채우며 장부 너머를 훔쳐본다
        minutes: 5
        check: {skill: 통찰, D: 26}
        success:
          text: |
            장부에는 명단이 둘이다. 하나는 방금 읽은 마흔. 다른 하나는 더 짧고, 맨 위에 '겨울 끝'이라는 낱말이 있다. 열일곱째 줄의 글자들이 너를 향해 돌아앉는다 — 사라.

            헨릭이 장부를 덮는다. 네 손의 병은 흔들리지 않았다. 사라는 아무것도 모른 채 남작의 잔을 채우고 있다.
          effects: ["learn fact_gf_sara_on_sale_list", "var goal_sara_known = true", "note 둘째 명단(겨울 끝) 열일곱째 줄 — 사라. 사라는 아직 모른다"]
        failure:
          text: |
            헨릭이 장부를 덮는다. 손바닥으로, 천천히. "하인이 글자 구경을 하나." 그가 마르타를 돌아본다. 마르타의 고개가 아주 조금 숙여진다. 대답이다.
          effects: ["rel npc_henrik trust -5", "rel npc_martha trust -5", "memory npc_martha 위험함 셋째가 헨릭의 장부를 들여다보았다"]
      - id: debt_whisper
        label: '헨릭의 잔을 채우며 낮게: "담보라면, 값은 나리께서 정하시겠지요."'
        minutes: 5
        check: {skill: 화술, D: 30}
        success:
          text: |
            헨릭의 손가락이 키트의 줄에서 떨어진다. 처음으로 그가 너를 숫자 이외의 것으로 본다. "…부엌에서 별 말을 다 배우는군."

            그는 남작이 고기를 씹는 동안 펜을 든다. 스물여섯째 줄에 줄을 긋고, 그 아래에 다른 이름을 쓴다. 토비. 강변 움막 아홉 호의 아이. 사라가 술병을 내려놓는 소리가 조금 크다.
          effects: ["var kit_on_list = false", "var toby_on_list = true", "note 키트 대신 토비 — 헨릭이 남작의 식탁에서 명단을 고쳤다", "memory npc_henrik 쓸모 있음 셋째가 남작의 빚을 안다", "temper 자비 -2"]
        failure:
          text: |
            헨릭은 웃지 않는다. "담보." 그 말을 혀 위에서 굴린다. "하인이 그 말을 어디서 들었을까." 그의 눈이 술병을 든 사라에게 간다 — 남작의 서재를 치우는 하녀는 하나뿐이다.
          effects: ["rel npc_henrik trust -15", "var henrik_suspects_sara = true", "note 헨릭이 사라를 의심한다 — 내 입 때문에"]
      - id: steady_sara
        label: '사라에게서 술병을 받아 든다 — "내가 따를게."'
        minutes: 2
        text: |
          사라의 손가락이 병목에서 떨어지지 않으려 한다. 그러다 놓는다. 너는 남작의 잔을 채우고, 한 방울도 흘리지 않는다.

          부엌으로 물러나는 길에 사라가 네 소매를 스친다. "고마워." 입술만 움직인다. "내일 정오, 우물. 할 말이 있어."
        effects: ["rel npc_sara trust 6", "rel npc_sara like 6", "var sara_well_noon = true", "note 사라 — 내일 정오, 우물"]
      - id: chase_kit
        label: 마르타에게 고개를 숙이고 물러난다 — 마당의 키트에게
        minutes: 10
        text: |
          "물이 모자랍니다." 마르타는 대답하지 않는다. 그건 허락이 아니다. 그래도 너는 나간다.

          키트는 마당 끝 담 그늘에 아직 있다. 네가 다가가자 웃는다. "{sibling}, 오늘 고기 냄새 났어." 너는 앞치마 주머니의 빵 귀퉁이를 그 손에 쥐여 준다. 키트가 그걸 품에 넣는다 — 엄마 몫이다.

          연회실 창 안에서 마르타의 그림자가 한 번 움직인다.
        effects: ["goto gf_keep_yard", "bond npc_kit 6", "rel npc_kit like 5", "memory npc_martha 이상함 셋째가 시중을 버리고 마당으로 나갔다"]
      - id: serve_on
        label: 그대로 서서 시중을 든다
        minutes: 30
        text: |
          남작의 잔, 헨릭의 잔, 남작의 잔. 명단은 헨릭의 장부 속으로 들어가고, 식탁의 이야기는 사냥으로, 빚으로, 날씨로 옮겨 간다. 아무도 하인을 보지 않는다. 그게 하인의 일이다.

          접시를 물리며 마르타가 네 옆을 지나간다. "잘했다." 그 말이 칭찬인지 다른 것인지, 너는 모른다.
        effects: ["rel npc_martha trust 3", "stress 4"]
      # ── ◈ 기억 선택지 ──
      - id: mem_sara_second
        needs_memory: fact:fact_gf_sara_on_sale_list
        label: '사라의 귀에: "겨울 끝 명단. 열일곱째 줄."'
        minutes: 2
        text: |
          사라의 손에서 술병이 멎는다. 남작의 잔이 반만 찬다. 그녀는 너를 보지 않고, 아주 오래 잔만 본다.

          "…부엌에서 기다려." 목소리가 처음 듣는 목소리다.
        effects: ["rel npc_sara trust 8", "var goal_sara_known = true", "memory npc_sara 이상함 부엌데기가 내 이름이 적힌 줄을 안다", "var sara_knows_list = true"]

  # ───────────────────────── 대장간 풀무꾼 ─────────────────────────
  - id: forge_chains_open
    origin: smith_hand
    trigger: {start: true}
    stage:
      - {npc: npc_bran, at: gf_smithy, from: "18:00", to: "19:40", doing: 모루에서 족쇄를 두드린다}
      - {npc: npc_gerda, at: gf_smithy, from: "18:00", to: "18:12", doing: 직조 헛간에서 돌아가는 길에 대장간 문턱에 멈춰 선다}
      - {npc: npc_znik, at: gf_smithy, from: "18:12", to: "18:45", doing: 등불을 들고 족쇄를 센다}
    text: |
      식는 쇠 냄새. 숯 연기, 그리고 담금질 통의 시큼한 김.

      너는 풀무를 밟는다. 한 번, 두 번. 화덕이 숨을 쉴 때마다 브란의 얼굴이 붉어졌다 꺼진다. 브란 — 이 대장간의 주인이 아니라 이 대장간에 딸린 노예, 쉰을 앞둔 대장장이 — 은 오늘 저녁 낫을 두드리지 않는다.

      모루 위에 족쇄가 있다. 벽에 걸린 것까지 서른아홉. 브란이 마흔째의 고리를 집게로 집어 든다. "서리월 아흐레까지." 그가 말한다. 누구에게도 아니게.

      문턱에서 누가 부른다. 망치 소리 사이로. 낮게. 아무도 못 듣게.
    input: true_name
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "식는 쇠 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 식는 쇠 냄새."}
    trace_lines:
      water: 담금질 통의 김이 목으로 들어온다. 목 안에 물이 있다. 없다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 숯가루뿐이다.
      spear: 옆구리가 시리다. 화덕이 바로 옆인데.
      blade: 목이 뜨겁다. 불티다. 불티일 것이다.
      rope: 손목이 쓸린다. 모루 위의 족쇄가 거기 있다.
      hunger: 배가 꼬인다. 아니다 — 이 저녁엔 배급 줄에서 빵이 나온다.
    return_ink: |
      ┊ 그 다음엔 즈닉이 등불을 들고 와 족쇄를 셌다. "스물여섯째는 작은 놈이다."
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 마을에 하나뿐이다. 어머니다. 게르다가 직조 헛간에서 돌아가는 길에 대장간 문턱에 서 있다. 기침을 손등으로 막는다. 어머니의 눈이 모루 위의 쇠고리에 머문다.

      "명단 얘기 들었다. 그래서 부르는 거야. 아무한테도 말하지 마라. 이름을 아는 자가 너를 가진다." 어머니가 족쇄에서 눈을 뗀다. "배급 줄에 키트가 서 있다. 늦지 마라."
    effects: ["var mother_called = true", "note 어머니만 아는 이름 — {name}. 대장간에서는 너를 셋째라 부른다"]
    next: forge_chains_count

  - id: forge_chains_count
    origin: smith_hand
    text: |
      어머니가 가고 나서 등불이 온다. 즈닉 — 농노 감독관, 채찍을 쥔 늙은 크릭 — 이 문턱을 넘어 족쇄를 하나씩 손가락으로 튕긴다. 쇠가 울 때마다 그의 입술이 숫자를 센다.

      "서른아홉, 마흔." 그가 마지막 고리를 집어 들고 웃는다. "스물여섯째는 작은 놈이다. 게르다네 막내. 하르벡이랬지. 손목이 가늘어서 빠질라 — 작은 걸로 하나 더."

      브란의 망치가 공중에서 멈춘다. 한 박자. 그리고 내려온다.

      족쇄 안쪽에 성채의 낙인이 찍혀 있다. 글자다. 너는 글을 모른다. 그런데 읽었다. 레이번. 셋째 해. 눈가로 잿빛 고리가 스치고 사라진다. 머릿속에 낯선 거리가 떠오른다. 문마다 글자가 새겨진 도시.
    effects: ["learn fact_op_kit_line_forge", "var goal_kit_known = true", "note 대장간 — 키트가 첫 매각 명단 스물여섯째 줄에 있다. 즈닉이 작은 족쇄를 하나 더 시켰다"]
    choices:
      - id: bran_spears_now
        label: '즈닉이 가고 나서, 브란에게: "슬래그 더미 밑의 창날 — 이제 쓸 때예요."'
        minutes: 20
        check: {skill: 화술, D: 26}
        success:
          text: |
            브란은 한참 화덕만 본다. 그러다 집게를 내려놓고 슬래그 더미 쪽으로 턱짓을 한다. "스물셋. 그리고 단검 넷. 마흔은 돼야 한다." 그가 네 손바닥에 쇠 부스러기 반 돈을 쏟아 준다. 낫 한 자루에서 깎아 낸 것. "낫마다 반 돈씩. 서리월까진 모자라. 그래도 센다."

            그의 손이 네 어깨를 한 번 쥔다. 아프다.
          effects: ["var bran_spears = true", "rel npc_bran trust 8", "note 봉기 — 브란의 창날, 낫마다 쇠 반 돈씩 모은다 (슬래그 더미 밑)"]
        failure:
          text: |
            "닥쳐." 브란의 목소리는 크지 않다. 그래서 더 무섭다. "그 말을 문턱 밖에서 한 번이라도 해 봐라. 그러면 마흔 벌로는 모자라게 된다." 그는 다시 망치를 든다. 오늘 밤 너와 눈을 맞추지 않는다.
          effects: ["rel npc_bran trust -6"]
      - id: crack_shackle
        label: 작은 족쇄를 받아 들고 — 고리를 일부러 무르게 담금질한다
        minutes: 30
        check: {skill: 손재주, D: 28}
        success:
          text: |
            쇠가 너무 오래 물에 잠기면 무르다. 너는 그걸 안다. 작은 족쇄는 겉보기에 다른 서른아홉과 같다. 돌로 세 번 내리치면 벌어질 것이다 — 그걸 아는 사람이 이 마을에 둘 된다.

            브란은 보았다. 아무 말도 하지 않는다. 화덕에 숯을 한 삽 더 넣을 뿐이다.
          effects: ["var kit_shackle_soft = true", "rel npc_bran trust 4", "note 스물여섯째 족쇄는 무르다 — 돌로 세 번 치면 벌어진다"]
        failure:
          text: |
            쇠가 물속에서 비명을 지르며 금이 간다. 즈닉의 등불이 돌아온다. "쇠를 버렸구나." 막대가 네 손등을 내리친다. "브란, 네 놈의 풀무꾼이 남작님의 쇠를 버렸다."

            브란이 대답한다. "제 손이 미끄러졌습니다." 즈닉은 둘 다 본다. 그리고 침을 뱉는다.
          effects: ["pain 10", "rel npc_bran trust 3", "memory npc_znik 위험함 셋째가 족쇄를 망쳤다"]
      - id: znik_list
        label: 즈닉의 등불을 받아 들며 그가 쥔 명단 사본을 들여다본다
        minutes: 5
        check: {skill: 통찰, D: 24}
        success:
          text: |
            즈닉은 글을 모른다. 그래서 사본에는 줄마다 손톱자국이 있다 — 그가 세는 방법이다. 맨 아래 붉은 밀랍 인장, 그리고 낯선 이름 하나. 세베로 칼레스. 나루에서 사흘 뒤 머릿수를 확인한다는 줄.
          effects: ["learn fact_gf_serf_sale_contract", "note 즈닉의 사본 — 사흘 뒤 나루에서 머릿수 확인, 세베로 칼레스의 인장"]
        failure:
          text: |
            즈닉이 사본을 품에 넣는다. "등불이나 들어." 그는 너에게서 등불을 낚아채 간다.
          effects: ["memory npc_znik 이상함 풀무꾼이 명단을 들여다보았다"]
      - id: to_ration
        label: 쇠갈고리를 품에 넣고 대장간을 나선다 — 배급 줄의 키트에게
        minutes: 10
        text: |
          "가 봐라." 브란이 등을 돌린 채 말한다. 너는 풀무에서 발을 뗀다.

          수탉 앞의 줄은 벌써 반쯤 줄었다. 키트가 줄 끝에서 너를 보고 손을 흔든다. 그 손목이 가늘다. 너는 오늘 저녁 처음으로 그 가는 손목을 본다.
        effects: ["goto gf_rooster", "bond npc_kit 4"]
      - id: keep_bellows
        label: 그대로 풀무를 밟는다
        minutes: 40
        text: |
          쉬익, 쉬익. 화덕이 숨을 쉰다. 브란은 마흔째 고리를 닫고, 작은 족쇄를 하나 더 두드리기 시작한다. 너는 끝날 때까지 밟는다. 아무도 말하지 않는다.

          일이 끝나자 브란이 네 손에 누룽지 한 조각을 쥐여 준다. 대장간에 딸린 몫이다. "먹어. 배급 줄은 이미 끝났을 거다."
        effects: ["fatigue 10", "hunger -1", "rel npc_bran like 4"]
      - id: mem_bran_greta
        needs_memory: loop
        label: '브란에게: "이번 쇠는 마차 바퀴가 되지 않을 거예요."'
        minutes: 5
        text: |
          브란의 망치가 멈춘다. 그레타를 실어 간 마차 — 그 바퀴 테를 두드린 게 이 대장간이었다는 걸, 이 마을에서 아는 사람은 브란 하나다. 그리고 이제 너.

          "…누가 그 말을 했냐." 대답을 기다리지 않는다. 그는 슬래그 더미를 한 번 보고, 다시 망치를 든다. 망치 소리가 아까보다 느리다.
        effects: ["rel npc_bran trust 10", "memory npc_bran 이상함 풀무꾼이 그레타의 마차를 안다"]

  # ───────────────────────── 예배당 종지기 ─────────────────────────
  - id: bell_rope_open
    origin: chapel_ringer
    trigger: {start: true}
    stage:
      - {npc: npc_osric, at: gf_chapel, from: "18:00", to: "21:30", doing: 제단의 등잔을 닦는다}
      - {npc: npc_gerda, at: gf_chapel, from: "18:00", to: "18:12", doing: 종 줄 아래 문간에서 무릎을 꿇고 있다}
    text: |
      꺼진 밀랍 냄새. 축축한 돌, 오래된 기름.

      종 줄이 손바닥을 감고 올라간다. 너는 체중을 싣고 당긴다. 사슬등불 예배당의 종이 저녁을 친다 — 한 번, 두 번, 세 번. 아래 마을의 배급 줄이 그 소리에 움직이기 시작할 것이다.

      제단 앞에서 오스릭 사제가 등잔을 닦는다. 예순일곱, 이 마을에서 글을 읽어도 되는 유일한 인간. 그의 손이 떨린다. 오늘은 더.

      종소리가 잦아드는 사이, 문간에서 누가 부른다. 낮게. 아무도 못 듣게.
    input: true_name
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "꺼진 밀랍 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 꺼진 밀랍 냄새."}
    trace_lines:
      water: 종 줄이 젖어 있다. 아니다. 손바닥이 젖었다. 목 안에 물이 있다. 없다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 밀랍뿐이다.
      spear: 옆구리가 시리다. 돌벽에 기댄 쪽이다.
      blade: 목이 뜨겁다. 손을 대 보면 아무것도 없다.
      rope: 손목이 쓸린다. 종 줄 자국이다. 종 줄 자국일 것이다.
      hunger: 배가 꼬인다. 아니다 — 이 저녁엔 배급 줄에서 빵이 나온다.
    return_ink: |
      ┊ 그 다음엔 오스릭이 제단 먼지 위에 이름 하나를 썼다가 지웠다. 키트.
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 예배당에도, 이 마을에도 하나뿐이다. 어머니다. 게르다가 직조 헛간에서 오는 길에 문간에 무릎을 꿇고 있다. 기도하는 척. 기침을 손등으로 막는다.

      "명단 얘기 들었다. 그래서 부르는 거야. 아무한테도 말하지 마라. 이름을 아는 자가 너를 가진다." 어머니가 제단 쪽을 본다. 오스릭의 등을. "사제님은 아실 거다. 글을 아시니까."
    effects: ["var mother_called = true", "note 어머니만 아는 이름 — {name}. 예배당에서는 너를 셋째라 부른다"]
    next: bell_rope_list

  - id: bell_rope_list
    origin: chapel_ringer
    text: |
      어머니가 가자 오스릭이 너를 제단 뒤로 부른다. 그의 숨에서 쓴 약초 냄새가 난다. "사라가 왔었다. 서재에서 들었다더구나." 그는 말 대신 손가락을 쓴다. 제단 위 먼지에, 천천히.

      키트.

      그리고 그 옆에 숫자. 스물여섯. 오스릭은 그것을 손바닥으로 지운다. 지우는 데 오래 걸린다. "서리월 아흐레. 마흔이다."

      손바닥이 지나간 자리에 먼지가 다시 가라앉는다. 너는 지워진 글자를 읽는다 — 오스릭이 쓰지 않은 글자까지. 레이번. 셋째 해. 너는 이름과 짧은 말밖에 못 읽는다. 그런데 읽었다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["learn fact_op_kit_line_chapel", "var goal_kit_known = true", "note 예배당 — 키트가 첫 매각 명단 스물여섯째 줄에 있다. 오스릭이 먼지에 썼다가 지웠다"]
    choices:
      - id: plead_osric
        label: '오스릭의 소매를 붙잡는다: "명단도 글이잖아요. 글은 고칠 수 있잖아요."'
        minutes: 10
        check: {skill: 화술, D: 28}
        success:
          text: |
            오스릭이 오래 너를 본다. 세례를 줄 때 너를 안았던 손이 네 손을 덮는다. 차다.

            "명단은 서재 금고에 있다. 열쇠는 남작의 목걸이에. 빚 증서와 세베로의 계약서도 같이." 그는 말을 멈춘다. "태워도 세렌에 사본이 있다. 그러니 — 고치는 게 아니라, 시간을 버는 거다."
          effects: ["learn fact_gf_keep_strongbox", "rel npc_osric trust 4", "note 오스릭 — 명단은 성채 서재 금고. 열쇠는 남작의 목걸이. 세렌에 사본"]
        failure:
          text: |
            오스릭이 손을 뺀다. "글은 사람을 살리지 않는다, 아이야. 숨길 뿐이다." 그는 등잔을 다시 닦기 시작한다. 아까보다 세게.
          effects: ["rel npc_osric trust -3"]
      - id: ossuary_copies
        label: 오스릭이 기도를 준비하는 사이 납골실로 내려간다 — 양초를 켜고
        minutes: 20
        check: {skill: 은신, D: 20}
        success:
          text: |
            계단 열두 칸. 해골들이 벽감마다 줄지어 있다. 그 사이, 해골 하나가 없는 벽감에 기름종이 뭉치. 오스릭의 글씨다. 빛의 서신 — 같은 구절이 세 번, 세 장에.

            너는 첫 줄만 읽는다. 읽을 수 있는 만큼만. '빛은 사슬을 녹이지 않는다.' 종이를 제자리에 두고 올라온다. 오스릭은 등을 돌리고 있다.
          effects: ["learn fact_gf_osric_letter_copies", "note 납골실 벽감 — 오스릭의 빛의 서신 필사본 세 부"]
        failure:
          text: |
            계단 넷째 칸이 운다. 위에서 오스릭의 걸레질이 멈춘다. 그는 내려오지 않는다. 네가 올라왔을 때 그는 등잔만 보고 있다. 아무 말도 하지 않는다. 그게 더 무섭다.
          effects: ["rel npc_osric trust -6", "memory npc_osric 위험함 종지기가 허락 없이 납골실에 내려갔다"]
      - id: take_letter
        label: 오스릭이 내미는 기름종이 조각을 받는다
        minutes: 5
        text: |
          그는 아무 말 없이 기름종이에 싼 작은 조각을 네 손에 쥐여 준다. "읽지 마라. 지니고만 있어라." 그리고 덧붙인다. 너만 들으라고. "너는 읽을 수 있지. 그러니 더 읽지 마라."
        effects: ["item light_letter", "memory npc_osric 쓸모 있음 셋째에게 빛의 서신 조각을 맡겼다", "rel npc_osric trust 6"]
      - id: run_to_line
        label: 종 줄을 감아 두고 배급 줄로 달려간다 — 어머니와 키트에게
        minutes: 10
        text: |
          오스릭은 붙잡지 않는다. "저녁 기도 전에 돌아오너라."

          수탉 앞의 줄. 어머니가 벌써 줄 뒤에 서 있고, 키트가 네 쪽으로 손을 흔든다. 처마에서 페인이 너를 보고 이를 드러낸다. 종지기가 왜 종을 버리고 왔느냐는 얼굴이다.
        effects: ["goto gf_rooster", "bond npc_kit 4", "rel npc_osric like -2"]
      - id: prepare_prayer
        label: 그대로 종 줄을 감고 저녁 기도를 준비한다
        minutes: 40
        text: |
          등잔 열둘에 기름을 붓고 심지를 자른다. 오스릭은 제단 앞에 오래 무릎을 꿇고 있다. 기도인지, 셈인지.

          기도가 끝나 갈 무렵 그가 말한다. 돌아보지 않고. "오늘 밤 글자 셋을 더 가르쳐 주마. 바닥에." 그의 손이 떨리지 않는다. 처음으로.
        effects: ["rel npc_osric like 4", "rel npc_osric trust 2", "stress -5"]
      - id: mem_broken_ring
        needs_memory: fact:fact_gf_osric_broken_ring
        label: '오스릭에게 낮게: "안식일 밤 열 시, 납골실. 열한 명."'
        minutes: 5
        check: {skill: 화술, D: 30}
        success:
          text: |
            오스릭의 손에서 걸레가 떨어진다. 그는 그것을 줍지 않는다. "…누가 말했느냐." 대답을 기다리지 않는다. "열두 명이 되겠구나." 그 말이 질문인지, 너는 모른다.
          effects: ["rel npc_osric trust 10", "memory npc_osric 이상함 종지기가 끊어진 고리를 안다", "var osric_invites = true"]
        failure:
          text: |
            오스릭이 너를 본다. 처음 보는 사람을 보듯이. "루멘에서 온 귀가 이 예배당에 있었구나." 그는 걸레를 줍는다. 그날 밤 납골실 문에 새 자물쇠가 걸린다.
          effects: ["rel npc_osric trust -12", "memory npc_osric 위험함 종지기가 납골실 모임을 안다 — 누가 보냈는가"]

  # ───────────────────────── 탈주 노예 ─────────────────────────
  - id: den_smoke_open
    origin: hill_runaway
    trigger: {start: true}
    stage:
      - {npc: npc_sigrid, at: hungry_hill__wolf_den, from: "18:00", to: "23:00", doing: 굴 안쪽에서 아이들의 이마를 짚는다}
      - {npc: npc_fayne, at: hungry_hill__wolf_den, from: "18:15", to: "18:50", doing: 굴 입구 가시덤불 아래 쪼그려 앉아 숨을 고른다}
    text: |
      젖은 이끼 냄새. 그 위로, 아래에서 올라오는 연기 — 탄 보리 껍질. 배급 줄의 빵 냄새가 언덕까지 올라온다.

      늑대굴 입구. 가시덤불 사이로 회색여울이 내려다보인다. 수탉 앞에 줄이 서 있다. 저 줄 어딘가에 어머니가, 키트가 있다. 열 달 전, 너도 저 줄에 서 있었다.

      굴 안쪽에서 아이 하나가 기침을 한다. 서리 길을 넘어온 마흔일곱 — 시그리드의 무리. 열이틀 전 이 굴로 그들을 이끈 게 너다.

      언덕 동쪽 비탈에서 다른 연기가 오른다. 가늘고 곧은 연기. 송곳니 불. 바르그의 사냥꾼들이 피우는 불이다.

      아무도 너를 이름으로 부르지 않는다. 마을에서 너는 셋째였고, 이제는 '도망친 셋째'다. 그 이름 말고, 어머니가 지어 준 이름. 너는 아직 그것을 기억한다.
    input: true_name
    input_label: 어머니가 지어 준 이름
    input_button: 그 이름을 속으로 부른다
    input_say: 아무도 부르지 않는 이름을 속으로 부른다
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "젖은 이끼 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 젖은 이끼 냄새."}
    trace_lines:
      water: 이끼의 물기가 목으로 들어온다. 목 안에 물이 있다. 없다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 흙뿐이다. 송곳니 불은 아직 멀다.
      spear: 옆구리가 시리다. 가시덤불이다. 가시덤불일 것이다.
      blade: 목이 뜨겁다. 소매 속의 부싯돌 칼은 제자리에 있다.
      rope: 손목이 쓸린다. 밧줄 자국은 없다. 아직은.
      hunger: 배가 꼬인다. 이건 진짜다. 이 언덕엔 늘 먹을 것이 모자라다.
    return_ink: |
      ┊ 그 다음엔 페인이 가시덤불 밑으로 기어 올라왔다. "키트가 명단에 있어."
    after_input: |
      {name}.

      입 밖으로 내지 않는다. 열 달 동안 아무도 그 이름을 부르지 않았다. 어머니만 알던 이름 — 이제 그 이름을 아는 사람은 저 아래 줄에 하나, 이 언덕에 하나.

      굴 안에서 시그리드가 나온다. 북방 탈주자들의 우두머리, 거인의 짐을 열다섯 해 진 어깨. 그녀가 네 옆에 쪼그려 앉아 송곳니 불 쪽을 본다. "오늘 밤은 불을 피우지 않는다."
    effects: ["var mother_called = true", "note 어머니만 아는 이름 — {name}. 마을에서는 '도망친 셋째'다"]
    next: den_smoke_news

  - id: den_smoke_news
    origin: hill_runaway
    text: |
      가시덤불이 흔들린다. 시그리드의 손이 허리의 돌칼로 간다. 그러다 멈춘다. 페인이다 — 지붕을 타고 다니는 마을의 고아, 이 굴 입구를 아는 마을 사람은 그 아이 하나다. 숨이 차서 말을 못 한다.

      "{sibling}." 겨우 나온 첫마디. "키트가 명단에 있어. 첫 명단. 스물여섯째 줄. 사라 누나가 그랬어." 그는 숨을 고른다. "서리월 아흐레래."

      페인이 굴 벽을 본다. 거기 시그리드가 새긴 금들이 있다 — 서리말 룬, 서리 길에서 죽은 사람들의 이름. 너는 글을 모른다. 그런데 읽었다. 서른일곱 개의 이름을, 하나도 빼놓지 않고. 눈가로 잿빛 고리가 스치고 사라진다.

      송곳니 불 쪽에서 개 한 마리가 짖는다. 한 번.
    effects: ["learn fact_op_kit_line_den", "var goal_kit_known = true", "note 늑대굴 — 키트가 첫 매각 명단 스물여섯째 줄에 있다. 페인이 전했다"]
    choices:
      - id: message_mother
        label: 페인에게 쥐뿌리를 쥐여 주며 어머니에게 전할 말을 맡긴다
        minutes: 10
        text: |
          페인은 쥐뿌리를 받지 않는다. "이건 {sibling}이 먹어. 대신 —" 그가 손바닥을 내민다. 위로. "다음엔 동화로."

          너는 말을 맡긴다. 살아 있다고. 키트를 혼자 두지 말라고. 페인은 그 말을 입속으로 두 번 따라 하고, 가시덤불 밑으로 사라진다.
        effects: ["rel npc_fayne trust 6", "rel npc_fayne like 4", "var gerda_knows_alive = true", "note 페인 편에 어머니에게 — 살아 있다"]
      - id: descend_huts
        label: 해가 지면 언덕을 내려간다 — 강변 움막으로, 키트에게
        minutes: 90
        check: {skill: 은신, D: 26}
        risk: 탈주 노예 — 들키면 끝이다
        success:
          text: |
            버드나무 둑을 따라, 통금 종이 울리기 전에. 움막 12호의 문은 그대로다. 문틈으로 키트의 숨소리가 들린다. 그리고 어머니의 기침.

            너는 문을 두드리지 않는다. 아직은. 문설주에 손을 대고 한참 서 있다.
          effects: ["goto gf_river_huts", "bond npc_kit 4", "temper 용기 2"]
        failure:
          text: |
            둑 위에서 등불이 멈춘다. 크릭 감독의 순찰. "거기 누구냐." 너는 갈대숲으로 몸을 던진다. 등불은 오래 갈대를 훑다가 지나간다. 그러나 그는 무언가를 보았다 — 언덕에서 내려온 그림자 하나를.

            너는 늑대굴로 돌아온다. 무릎이 찢어져 있다.
          effects: ["pain 10", "wanted 1 탈주 노예가 마을 근처에서 보였다", "goto hungry_hill__wolf_den"]
      - id: warn_sigrid
        label: '시그리드에게: "송곳니 불이 사흘째예요. 굴 입구를 바꿔야 해요."'
        minutes: 10
        check: {skill: 화술, D: 22}
        success:
          text: |
            시그리드는 대답 대신 굴 안으로 들어가 사내 셋을 깨운다. 서리말로 짧게. 그들이 가시덤불을 더 끌어다 입구를 덮는다. 그녀가 돌아와 네 옆에 앉는다. "서리 길에서 그 불을 봤다. 쇠송곳니를 단 놈이었지." 그 이름을 말하지 않는다. 너도 묻지 않는다.
          effects: ["rel npc_sigrid trust 6", "var den_hidden_better = true", "note 늑대굴 입구를 가시덤불로 더 덮었다"]
        failure:
          text: |
            "나는 서리 길을 넘어왔다, 아이야." 시그리드가 말한다. 화난 목소리가 아니다. 지친 목소리다. "불은 내가 본다."
          effects: ["rel npc_sigrid like -2"]
      - id: crawl_fangfire
        label: 송곳니 불 쪽으로 기어가 사냥꾼들의 말을 엿듣는다
        minutes: 60
        check: {skill: 은신, D: 30}
        risk: 볼크의 개들이 있다
        success:
          text: |
            불가에 송곳니 둘. 고기를 굽는다. 그들의 말은 반쯤 공용어다. "…남작이 한 머리에 금화 하나. 예순이면 예순 닢." "늑대굴이라던가. 나룻배 영감이 입구만 찾으면." 웃음.

            너는 올 때보다 더 천천히 물러난다. 개는 바람 아래에 있었다.
          effects: ["learn fact_gf_volk_sweep_contract", "note 송곳니들 — 남작과 한 머리에 금화 하나. '나룻배 영감'이 늑대굴 입구를 찾는다"]
        failure:
          text: |
            개가 짖는다. 두 번, 세 번. 불가의 그림자가 일어선다. 너는 엎드린 채 비탈을 굴러 내려간다. 뒤에서 누가 웃는다 — 쫓아오지 않는 웃음이다. 냄새를 맡았으니 쫓을 필요가 없다는 웃음.
          effects: ["nemesis npc_volk 1", "fear 1", "pain 5"]
      - id: rest_den
        label: 굴 안 불씨 곁에 몸을 누인다
        minutes: 60
        text: |
          불은 없다. 불씨만 재 밑에 있다. 서리 길을 넘어온 아이들이 그 둘레에 엉켜 잔다. 시그리드가 나무 숟가락으로 쥐뿌리 죽을 떠 준다. 묽다.

          동쪽 비탈에서 개가 한 번 더 짖는다. 아무도 일어나지 않는다. 너도.
        effects: ["fatigue -15", "hunger -1", "rel npc_sigrid like 3"]
      - id: mem_hagen_price
        needs_memory: fact:fact_gf_hagen_sigrid_price
        label: '시그리드에게: "나룻배의 하겐이 이 굴을 판다. 금화 열다섯."'
        minutes: 5
        text: |
          시그리드의 얼굴이 굳는다. 오래. "하겐." 그 이름을 처음 듣는 얼굴이 아니다 — 그녀는 그의 배를 타려 했었다. "너는 그걸 어떻게 아느냐."

          대답을 기다리지 않는다. 그녀는 굴 안으로 들어가 사내 하나를 깨운다. 그날 밤부터 나루 쪽 길목에 사람이 선다.
        effects: ["rel npc_sigrid trust 10", "memory npc_sigrid 이상함 아이가 하겐의 값을 안다", "var sigrid_warned_hagen = true"]

  # 두 번째 회차의 첫 잠자리 — 갈래마다 다른 잠자리 (count_before_sleep의 글을 바꾼다: greyford_opening.yaml)
