# 세렌 계약민 (SCENARIOS O-05) — 회귀점의 대본 장면과 첫 열흘. 출신: creation/origins_seren_bonded.yaml (사람의 짝은 그 머리말).
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 아버지가 숫자로 남긴 진짜 이름. 모든 장면은 origin: seren_bonded (연출가 소품만 이 고장의 것).
#
# 빚(o5_debt, 금화)이 줄기다: 31 → 급여일 38. 오르는 길 — 새벽 줄·통금(출신의 duty), 항의·흥정의 실패, 장부방에서 걸리기, 거짓이 들키기.
#   내리는 길 — 집단 이의(o5_roof_bridge), 루치오의 값(미코 또는 등잔), 마르셀·루치오의 '착오'(◈), 루포의 213번째 무효(o5_lupo_verdict).
#   마흔둘 = 산호 채석장 줄(o5_quarry_list). 분담금의 상태 o5_levy: none → on → suspended / waived / off.
#
# SCENARIOS의 첫 1~3시간 → 장면:
#   seren_opening_ledger 「늘어난 숫자」 → o5_ledger_open + o5_ledger_count (각성은 둘째 화면 끝)
#   salt_stairs_night 「소금계단의 밤」  → o5_stairs_night (미코 · 루치오에게 팔 숫자) · o5_ledger_room (장부방)
#   smuggle_hold 「밀수선의 짐칸」       → o5_night_hold (스크레의 등 없는 배 — 짐은 사람이다)
#   orsella_price 「나가의 저울」        → o5_lucio_scale (루치오: 미코의 밤, 또는 잿빛 실의 남쪽 끝)
#   ducat_citizenship_rumor              → o5_well_count (카타리나의 우물 — '일괄 상환권'의 소문) · o5_roof_bridge (셈 모임, 정본 매달 10일)
#   그리고 루포 (o5_empty_ledger → 정본 9.22 무효 213번째 → o5_lupo_verdict), 마흔둘의 문턱 (o5_quarry_list)
storylets:
  # ───────────────────────── 회귀점: 급여일의 소금계단 ─────────────────────────
  - id: o5_ledger_open
    origin: seren_bonded
    trigger: {start: true}
    stage:
      - {npc: npc_o5_marcel, at: sr_kassalon_dock, from: "17:00", to: "18:30", doing: 그물 창고 문 앞 상자 위에 장부를 펴고 한 사람씩 이름과 숫자를 읽는다}
      - {npc: npc_miko, at: sr_kassalon_dock, from: "17:00", to: "18:00", doing: 급여일 줄에서 허벅지에 손가락으로 숫자를 쓴다 — 앞니 사이로 짧은 휘파람}
      - {npc: npc_sr_lucio, at: sr_kassalon_dock, from: "17:00", to: "18:00", doing: 선착장 위층 난간에서 줄을 내려다본다 — 눈이 천천히 위아래로 움직인다}
      - {npc: npc_sr_skre, at: sr_kassalon_dock, from: "17:00", to: "18:00", doing: 줄 끝에서 허리의 장부 상자를 두 번 두드린다 — 밤일 할 사람을 고른다}
    text: |
      생선 비늘 냄새. 젖은 밧줄, 그리고 위층 난간에서 흘러내리는 단향 — 나가들이 피우는 향.

      카셀론 해운 선착장의 돌계단. 마른 바닷물이 계단마다 하얗게 피어 있어서 계약민들은 여기를 소금계단이라 부른다. 급여일이다. 그물 창고 앞에 계약민 백여 명이 줄을 선다. 줄은 계단을 세 번 꺾어 물가까지 내려간다.

      창고 문 앞 상자 위에 장부가 펴져 있다. 마르셀 — 카셀론의 장부꾼, 빚을 다 갚고도 이 계단을 떠나지 않은 인간 계약 감독 — 이 한 사람씩 부른다. 이름, 그리고 숫자. 받은 노임, 깎인 식비, 남은 빚.

      너는 숫자를 읽을 수 있다. 세렌은 계약민에게 숫자만은 허락한다 — 계약을 이해했다는 엄지를 받아야 하니까.

      품 안의 계약서 사본은 아버지 것이다. 펠. 네 해 전 긴밤월, 소금 바늘호 갑판에서 미끄러져 다시 올라오지 않았다. 그 뒤로 장부의 그 줄에는 아버지 이름 옆에 '승계'라는 낱말이 하나 붙었고, 서른한 금화가 네 것이 되었다.

      사본 뒷면, 접힌 자리 안쪽에 숫자가 줄지어 새겨져 있다. 아버지의 손톱자국이다.
    input: true_name
    input_label: 아버지가 숫자로 새겨 남긴 이름
    input_button: 숫자를 이름으로 읽는다
    input_say: 아무도 부르지 않는 이름을 속으로 읽는다
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "생선 비늘 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 생선 비늘 냄새."}
    trace_lines:
      water: 짠물이 목으로 올라온다. 목 안에 바닷물이 있다. 없다. 소금계단은 말라 있다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 마른 소금뿐이다.
      spear: 옆구리가 시리다. 그물 창고 문짝에 기댄 쪽이다.
      blade: 목이 뜨겁다. 손을 대 보면 아무것도 없다. 허리의 한 뼘 칼은 칼집에 그대로 있다.
      rope: 손목이 쓸린다. 그물 줄 자국이다. 그물 줄 자국일 것이다.
      hunger: 배가 꼬인다. 아니다 — 오늘 저녁엔 매점에서 생선죽을 살 돈이 있다.
      fall: 발밑이 꺼진다. 아니다 — 돌계단이다. 갑판이 아니다.
    return_ink: |
      ┊ 그 다음엔 마르셀이 숨도 쉬지 않고 읽었다. "선박 손실 분담금, 일곱. 남은 빚, 서른여덟."
    after_input: |
      {name}.

      글자를 모르는 사람이 이름을 남기는 법. 아버지는 나가 상인어 소리의 차례를 손가락으로 셌다 — 첫 소리는 몇째, 다음 소리는 몇째. 숫자는 합법이다. 그 숫자들이 네 이름이라는 걸 아는 사람은 이 계단에, 이 도시에 너 하나다.

      계단에서 너를 부르는 이름은 따로 있다. 펠네. 펠의 줄을 이어받은 아이.

      줄 앞에서 마르셀이 장부를 넘긴다. 다음 줄, 다음 숫자. 너는 사본을 접어 품에 넣는다.
    effects: ["note 아버지가 손톱으로 새긴 숫자 — 네 이름, {name}. 소금계단에서는 너를 펠네라 부른다"]
    next: o5_ledger_count

  - id: o5_ledger_count
    origin: seren_bonded
    text: |
      네 차례다.

      마르셀은 장부에서 눈을 들지 않는다. "펠, 승계분. 노임 은화 열두 닢, 식비 넷 공제." 숨도 쉬지 않고 덧붙인다. "선박 손실 분담금, 일곱. 남은 빚, 서른여덟."

      줄 뒤에서 누가 숨을 들이켠다.

      마르셀이 장부를 돌려 네 앞에 내민다. 엄지를 찍을 자리. 아버지 이름 옆의 7은 잉크 색이 다르다. 다른 숫자들은 바랜 갈색인데 그것만 검고 번들거린다. 오늘 아침에 쓴 것이다 — 의회 정기 회기는 아침에 열려 방금 끝났는데. 바로 위 줄, 미코 — 같은 선착장의 갑판꾼, 너와 똑같이 서른한 금화를 지고 있던 사내 — 의 줄에도 같은 검은 7이 있다. 그 아래 줄에도. 그 아래에도.

      위층 난간에서 루치오 카셀론 — 이 선착장과 그 배들의 주인, 늙은 나가 의석주 — 이 줄을 내려다본다. 눈이 천천히 위아래로 움직인다. 짐의 무게를 가늠하는 눈이다. 줄 끝에서는 스크레 — 소금 나루의 하역꾼 우두머리, 졸린 눈의 크릭 — 가 허리의 장부 상자를 두 번 두드린다. 분담금이 붙는 날이면 그는 늘 여기 온다. 밤일 할 사람을 고르러.

      장부를 내려다보는 순간, 숫자 사이의 글자들이 일제히 뜻을 갖는다. '분담금'. '선주 의회'. '공제'. 너는 숫자만 배웠다. 그런데 읽힌다. 장부의 잉크에서 잠깐 오래된 곡물 창고 냄새가 난다. 수백 년 전, 굶주리는 도시에서 누군가 곡물 장부를 직접 썼다. 그 손이 쓴 숫자를 너는 기억한다. 네 손이 아니었는데. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["var o5_debt = 38", "var o5_levy = on", "var o5_awake = true", "var o5_miko_known = true", "learn fact_o5_levy", "note 미코 — 밤 열 시 넘으면 소금계단 맨 아래 칸에서 빚을 다시 센다. 계단 사람은 다 안다"]
    choices:
      - id: protest
        label: '마르셀에게 항의한다 — "그 7은 오늘 아침 잉크입니다."'
        minutes: 5
        check: {skill: 화술, D: 28, helps: [tongue, haggle]}
        success:
          text: |
            마르셀이 처음으로 눈을 든다. 숫자를 보는 눈으로 너를 본다.

            "선주 의회의 결정이다. 오늘 회기, '선박 손실 분담에 관한 계약안'. 한 사람 몫 셋 반." 그가 펜 끝으로 장부를 두 번 친다. "셋 반은 지난 항해 몫, 셋 반은 다음 항해 몫. 미리 걷는다. 숫자는 숫자다."

            다음 항해는 아직 떠나지 않았다. 아직 아무도 죽지 않은 항해다.

            "다음." 마르셀의 눈이 장부로 돌아간다. 줄 뒤에서 누가 낮게 웃는다. 웃음이 아니다.
          effects: ["learn fact_o5_levy_decree", "rel npc_o5_marcel trust -5", "memory npc_o5_marcel 위험함 펠네가 줄 앞에서 잉크 색을 따졌다", "note 의회 문서의 분담금은 한 사람 셋 반 — 마르셀은 '다음 항해 몫'을 미리 걷는다며 7을 매겼다"]
        failure:
          text: |
            "다음." 마르셀은 눈을 들지 않는다. 대신 펜 끝이 네 줄 옆 여백에 낱말 하나를 긋는다. 불온. 너는 그 낱말을 읽는다 — 방금 전까지는 읽지 못했을 낱말을.

            "펠, 승계분. 다음 달 일감 셋에 하나를 뺀다. 엄지."

            네 엄지가 장부 위에 있다. 언제 올라갔는지 모른다.
          effects: ["var o5_unruly = true", "var o5_debt += 1", "memory npc_o5_marcel 위험함 펠네가 줄 앞에서 대들었다", "note 마르셀이 네 줄 옆에 '불온'이라 적었다 — 일감 셋에 하나가 빠진다. 빠진 노임만큼 빚에 한 닢"]
      - id: show_ink
        label: '줄을 돌아보며 장부의 검은 7을 손가락으로 짚는다 — "오늘 아침 잉크다. 다들 봐."'
        minutes: 15
        check: {skill: 화술, D: 36, helps: [crowd_voice, storyteller, tongue], warn: ["pknows fact_o5_levy_decree"]}
        success:
          text: |
            앞줄의 늙은 갑판꾼이 고개를 뺀다. 그다음 그 뒷사람. 검은 7이 줄을 따라 손에서 손으로, 눈에서 눈으로 내려간다. 숫자는 누구나 읽는다.

            미코가 장부 위에 엄지를 올리려다 멈춘다. 휘파람이 뚝 끊긴다. 그가 엄지를 거둔다. 그 뒤로 하나, 둘 — 서른이 엄지를 거둔다.

            마르셀의 펜이 멈춘다. 세렌의 법은 그도 안다. 이의가 걸린 계약안은 정산이 끝날 때까지 정지한다. 그가 이를 악물고 서른 줄 옆에 같은 낱말을 쓴다. 이의.

            위층 난간에서 루치오 카셀론의 눈이 내려오다 멈춘다. 네 얼굴에서.
          effects: ["var o5_levy = suspended", "var o5_debt = 31", "var o5_collective = true", "temper 용기 4", "rel npc_miko trust 6", "rel npc_miko like 4", "rel npc_sr_catarina trust 5", "memory npc_o5_marcel 위험함 펠네가 줄을 세웠다 — 서른이 엄지를 거뒀다", "memory npc_sr_lucio 위험함 줄을 세운 짐", "note 급여일 — 서른이 엄지를 거뒀다. 분담금은 정산까지 정지. 정산을 버틸 숫자가 필요하다"]
        failure:
          text: |
            줄은 너를 보지 않는다. 보지 않는 것이 이 계단의 일이다. 앞사람의 엄지가 장부에 내려간다. 그다음 사람도.

            마르셀이 손을 든다. 선착장 입구의 물비늘대 — 비늘 갑옷을 두른 나가 경비 — 하나가 느리게 다가와 네 목의 표찰을 뒤집는다. 숫자를 읽고 장부에 무언가를 적는다. 벌금.

            미코가 입술만 움직인다. 바보.
          effects: ["var o5_unruly = true", "var o5_debt += 1", "wanted 1 급여일 줄을 선동했다", "rel npc_miko like -2", "memory npc_o5_marcel 위험함 펠네가 줄을 선동하려 했다", "note 줄 앞에서 소란 — 물비늘대 벌금 한 닢, 그리고 '불온'"]
      - id: lucio
        label: 줄을 벗어나 위층 난간의 루치오 카셀론에게 직접 흥정을 청한다
        minutes: 15
        check: {skill: 화술, D: 32, helps: [haggle, merchant, etiquette]}
        success:
          text: |
            너는 계단 위로 올라가 난간 아래 무릎을 꿇는다. 나가의 큰 몸이 느리게 너를 향해 돈다. 푸른 비늘에 소금 얼룩. 반지의 닻 셋.

            "값부터." 루치오의 목소리는 둥글다. "짐이 값을 묻는 건 드문 일이에요. 드문 건 비싸고요." 그의 눈이 너를 위아래로 잰다. 몸무게. 나이. "당신 줄의 일곱을 빼 드리죠. 당신 줄만. 값은 숫자 하나 — 내 계약민 가운데 누가 밤에 남의 짐을 나르는지. 이름 하나와 밤 하나."

            그가 꼬리 끝으로 난간을 한 번 친다. 거래가 적혔다는 소리다. 계단 아래에서 미코가 너를 올려다본다.
          effects: ["var o5_lucio_deal = true", "rel npc_sr_lucio trust 5", "memory npc_sr_lucio 쓸모 있음 값을 물을 줄 아는 짐 — 펠의 승계분", "rel npc_miko trust -3", "note 루치오 카셀론 — 밤에 남의 짐을 나르는 계약민의 이름 하나와 밤 하나를 가져오면 네 줄의 분담금 일곱을 뺀다"]
        failure:
          text: |
            계단 셋째 칸에서 물비늘대의 창 자루가 네 가슴을 막는다. 난간 위에서 루치오가 너를 내려다본다. 오래가 아니다.

            "짐이 값을 묻네요." 그가 마르셀 쪽으로 말한다. 너에게가 아니다. "펠의 승계분 이자에 한 닢. 오늘은 바다가 높아요."

            마르셀의 펜이 움직인다. 네 줄의 서른여덟이 서른아홉이 된다.
          effects: ["var o5_debt += 1", "memory npc_sr_lucio 위험함 값을 묻는 짐", "note 루치오에게 흥정을 청했다가 — 이자 한 닢"]
      - id: office_plan
        label: 엄지를 찍으며 위층 장부방의 창을 눈에 담는다 — 밤에 올라가 보기로 한다
        minutes: 10
        risk: 밤 열한 시 넘어 숙소 밖이면 벌금이 빚에 붙는다
        text: |
          엄지가 장부 위에 내려간다. 그사이 네 눈은 위층으로 간다. 장부방 창은 계단 쪽으로 하나, 바다 쪽으로 하나. 바다 쪽 창의 걸쇠가 녹슬었다.

          마르셀은 의회 수조 종이 울리는 밤 열 시에 장부방을 잠그고 굽은 닻으로 간다. 이 계단 사람은 다 안다. 그는 계산지를 장부에 끼우지 않는다. 따로 쓴다. 그것도 다 안다.

          미코가 네 엄지를 본다. "너도냐." 휘파람이 짧다.
        effects: ["var o5_office_plan = true", "temper 용기 2", "rel npc_miko like -2", "note 오늘 밤 열 시 넘어 — 소금계단 위층 장부방. 바다 쪽 창의 걸쇠가 녹슬었다. 마르셀은 계산지를 따로 쓴다"]
      - id: skre
        label: 엄지를 찍고, 줄 끝의 스크레에게 간다 — 밤일을 받는다
        minutes: 10
        risk: 밤 하역 — 걸리면 계약 위반, 탑 인계나 노예선
        text: |
          스크레가 장부 상자를 두 번 두드린다. 금니가 한 번 보인다.

          "하역표는 없어요. 표가 없으면 사람도 없는 거고요." 그가 손가락 둘을 편다. "한 번에 두 닢. 금화로. 사흘째 밤 열한 시, 소금 나루 뒤편. 등 없는 배가 닿으면 짐을 내려요. 짐은 세지 마세요. 세는 건 내가 해요."

          두 금화. 노임으로는 석 달이 넘는다.
        effects: ["var o5_night_work = true", "rel npc_sr_skre trust 5", "memory npc_sr_skre 쓸모 있음 펠네가 밤일을 받았다", "note 스크레의 밤일 — 낙엽월 3일 밤 열한 시, 소금 나루 뒤편. 한 번에 두 금화. 짐은 세지 말 것"]
      # ── ◈ 기억 선택지 ──
      - id: mem_double
        needs_memory: fact:fact_o5_levy_double
        label: '마르셀의 귀에 낮게: "계산지의 392 — 카셀론에 가지 않은 반."'
        minutes: 5
        text: |
          마르셀의 펜이 멎는다. 잉크 한 방울이 장부에 떨어져 번진다. 그는 그것을 닦지 않는다.

          그가 고개를 들지 않은 채 네 줄의 7 위에 가로줄을 긋는다. 한 번. 그 옆에 서른하나를 다시 쓴다. "펠, 승계분. 분담 면제. 착오." 목소리가 장부 소리다. 다음 줄로 넘어가는 손이 아주 조금 빠르다.

          네 줄만이다. 위 줄의 미코에게도, 아래 줄에도 검은 7이 그대로 있다.
        effects: ["var o5_levy = waived", "var o5_debt = 31", "var o5_marcel_grudge = true", "rel npc_o5_marcel trust -20", "memory npc_o5_marcel 위험함 펠네가 계산지를 안다", "temper 정직 -2", "note 마르셀이 네 줄의 7만 지웠다 — 백열한 줄에는 그대로다. 그는 네가 계산지를 안다는 것을 안다"]
      - id: mem_dead
        needs_memory: fact:fact_o5_loss_is_dead
        label: '난간을 올려다보며: "손실이 짐이라면 — 열둘 넘게 죽은 짐이겠지요."'
        minutes: 10
        text: |
          루치오의 눈이 위아래로 움직이다 멈춘다. 처음으로 너를 짐이 아닌 무언가로 잰다.

          "짐은 짐이고요." 둥근 목소리가 아주 조금 낮아진다. 그가 마르셀을 내려다본다. "펠의 승계분은 분담에서 빼지요. 착오로." 그리고 너에게만. "그 숫자는 바다에 던지세요. 바다는 받은 것을 돌려주지 않아요."

          그의 꼬리 끝이 난간을 두 번 친다. 인장을 두 번 찍는 사람의 버릇이다.
        effects: ["var o5_levy = waived", "var o5_debt = 31", "var o5_lucio_watch = true", "memory npc_sr_lucio 위험함 펠네가 열둘 넘는 숫자를 안다", "note 루치오가 네 줄의 분담금을 '착오'로 뺐다 — 그 숫자를 바다에 던지라 했다. 그는 너를 지켜볼 것이다"]
      - id: sign
        label: 엄지를 찍고 넘어간다
        minutes: 5
        text: |
          엄지가 장부 위에 내려간다. 서른여덟 옆에. 마르셀이 숨도 쉬지 않고 다음 이름을 부른다.

          계단을 내려가는데 미코가 네 옆에 선다. 같은 서른하나였다가 오늘 같은 서른여덟이 된 사내. 그가 앞니 사이로 짧게 휘파람을 분다.

          "너도냐."

          대답을 기다리지 않는다. 그는 허벅지 위에 손가락으로 숫자를 쓰며 굽은 닻 쪽으로 간다. 스물두 해가 몇 해가 되는지, 그도 아직 세는 중이다.
        effects: ["temper 정직 2", "temper 용기 -3", "rel npc_miko like -2", "var o5_signed = true", "note 서른여덟에 엄지를 찍었다. 미코 — '너도냐'"]

  # ───────────────────────── 첫 밤: 글자가 닫히지 않는다 (첫 회차에만 — 영혼이 기억한다) ─────────────────────────
  - id: o5_letters_stay
    origin: seren_bonded
    trigger: {window: {from: "312-09-01 21:00", to: "312-09-05 04:00"}, at: sr_debt_alley, night: true, when: ["loop == 1", "var o5_awake == true"]}
    text: |
      빚 골목 6층, 넷이 쓰는 방. 같은 방의 셋은 벌써 숨이 고르다. 운하 물이 숙소 기둥을 핥는 소리가 바닥 틈으로 올라온다.

      너는 등잔 심지를 손톱으로 눌러 낮추고 아버지의 계약서 사본을 편다. 네 해 동안 숫자만 읽던 종이다.

      글자가 그대로 거기 있다. 지워지지 않는다. '갑판 노동'. '노임'. '승계'. 장부 앞에서 한 번 열린 것이 닫히지 않았다.

      세렌에서 계약민이 숫자 밖의 글자를 읽으면 벌금 다섯 금화. 그리고 탑 인계 검토.
    effects: ["skill_gain 읽고쓰기 12", "var o5_reads = true"]
    choices:
      - id: read_all
        label: 사본을 끝까지 읽는다 — 맨 아래 승계 조항까지
        minutes: 20
        text: |
          맨 아래 줄. 승계. 그 옆에 숫자 — 308, 11, 11. 긴밤월 열하루.

          아버지가 갑판에서 떨어진 날은 긴밤월 열나흘이다. 그 날짜를 너는 숫자로 기억한다. 그날 아침 소금 바늘호는 바람이 셌고, 저녁에 마르셀이 숙소 문을 두드렸다.

          승계가 죽음보다 사흘 먼저다. 등록한 이의 이름이 그 옆에 있다. 마르셀.

          너는 사본을 접는다. 손톱이 접힌 자리를 두 번 누른다.
        effects: ["learn fact_o5_succession_early", "note 사본의 승계 조항 — 긴밤월 열하루 등록. 아버지가 떨어진 건 열나흘. 등록한 이: 마르셀"]
      - id: fold
        label: 사본을 접는다 — 글자는 벌금이다
        minutes: 5
        text: |
          너는 사본을 접어 짚 밑에 넣고 등잔을 끈다. 어둠 속에서도 낱말들이 눈꺼풀 안쪽에 남아 있다. 승계. 승계.
        effects: ["stress -3", "note 글자가 읽힌다. 아무에게도 말하지 않는다"]

  # ───────────────────────── 첫 일감: 손실이 난 그 배의 짐칸 (duty.work.story) ─────────────────────────
  - id: o5_first_shift
    origin: seren_bonded
    text: |
      부두 종. 소금계단 아래 물이 회색이다.

      마르셀이 계단 위에서 오늘의 일감을 읽는다. 소금 바늘호 — 지난 항해에서 돌아온 배. 짐칸을 비우고 씻는다. 손실이 난 바로 그 항해다.

      짐칸 뚜껑을 열자 냄새가 먼저 올라온다. 바닷물로는 지워지지 않는 냄새. 미코가 솔을 들고 먼저 내려간다. 휘파람이 짧다.

      짐칸 벽 널빤지에 금이 그어져 있다. 넷을 세우고 다섯째로 가로지른 금. 누군가 날을 셌다. 아니면 사람을.
    choices:
      - id: show_miko
        label: 미코를 불러 벽의 금을 보인다
        minutes: 600
        text: |
          미코의 솔이 멈춘다. 그는 금 앞에 쪼그려 앉아 손가락으로 하나씩 짚는다. 입술이 움직인다. 소리는 없다.

          "열넷." 휘파람이 나오지 않는다. "보험은 열둘까지야. 루치오 나리 배는 늘 열둘까지야. 열둘을 넘으면 — 그게 손실이지."

          그가 일어나 솔을 다시 든다. 금 위는 닦지 않는다. 너도. 둘은 그 벽 한 장만 남기고 짐칸을 씻는다. 하루가 길다.

          계단을 올라오는데 미코가 말한다. 혼잣말처럼. "센 사람은 잊지 않아."
        effects: ["learn fact_o5_loss_is_dead", "rel npc_miko trust 5", "rel npc_miko like 3", "coin 6", "note 소금 바늘호 짐칸 벽 — 금 열넷. 보험은 열둘까지. 분담금은 그 둘의 값이다"]
      - id: count_alone
        label: 혼자 금을 센다 — 손가락으로, 소리 없이
        minutes: 600
        check: {skill: 통찰, D: 20, helps: [photo_memory, memory_palace]}
        success:
          text: |
            …열넷. 마지막 둘은 손톱으로 그은 금이다. 다른 금보다 얕다. 힘이 모자랐던 손.

            너는 금 위를 닦지 않는다. 그 벽 한 장만 남기고 짐칸을 씻는다. 마르셀은 위에서 내려오지 않는다. 짐칸에는 내려오지 않는 사람이다.
          effects: ["learn fact_o5_loss_is_dead", "coin 6", "stress 4", "note 소금 바늘호 짐칸 벽 — 금 열넷, 마지막 둘은 손톱 자국"]
        failure:
          text: |
            일곱에서 숫자가 엉킨다. 다시 처음부터. 아홉에서 위에서 마르셀의 목소리가 떨어진다. "펠, 승계분. 손이 놀고 있다."

            그날 네 줄 옆에 짧은 금이 하나 그어진다. 모자란 날. 금은 금을 부른다.
          effects: ["var o5_short += 1", "stress 6", "note 첫 일감 — 모자란 날 하나. 노임 없음"]
      - id: scrub
        label: 시킨 대로 벽까지 닦는다
        minutes: 600
        text: |
          솔이 금 위를 지나간다. 한 번, 두 번. 나무가 젖어 금이 흐려진다. 다섯 번째에 금은 나뭇결이 된다.

          미코는 다른 벽에 있다. 보지 못했다. 혹은 보지 않았다.

          저녁 종이 울릴 때 마르셀이 짐칸을 내려다보고 고개를 한 번 끄덕인다. 노임 패에 한 줄. 빚 쪽 숫자는 줄지 않는다 — 이자가 먼저 먹는다.
        effects: ["coin 6", "stress 6", "temper 자비 -2", "rel npc_o5_marcel trust 3", "memory npc_o5_marcel 쓸모 있음 펠네는 시킨 대로 한다", "note 소금 바늘호 짐칸 — 벽까지 닦았다"]

  # ───────────────────────── 장부방 (SCENARIOS 2번 선택지의 밤) ─────────────────────────
  - id: o5_ledger_room
    origin: seren_bonded
    trigger: {window: {from: "312-09-01 22:00", to: "312-09-05 04:00"}, at: sr_kassalon_dock, night: true, when: ["var o5_office_plan == true"]}
    text: |
      의회 수조 종이 울리고 한참이다. 소금계단에 사람이 없다. 바다 쪽 창의 녹슨 걸쇠는 손톱 하나로 들린다.

      장부방. 먹물 냄새, 생선 아교 냄새. 장부는 선반에 꽂혀 있고 책상 서랍은 잠겨 있지 않다. 잠글 필요가 없는 방이다 — 계약민은 글자를 읽지 못하니까.

      얇은 벽 너머 옆방에 불이 켜져 있다. 루치오 카셀론의 방. 인장 찍는 소리가 난다. 한 번, 두 번. 쉬었다가, 한 번, 두 번.
    choices:
      - id: sheet
        label: 서랍에서 분담금 계산지를 찾는다 — 숫자만 센다
        minutes: 40
        check: {skill: 통찰, D: 24, helps: [photo_memory, memory_palace, lock_hands]}
        success:
          text: |
            장부에 끼우지 않은 종이 한 장. 백열두 줄. 줄마다 7. 맨 아래 784. 그 옆에 작게 392 — 카셀론. 그 아래, 아무 이름도 붙지 않은 392.

            의회 문서대로 걷은 반은 카셀론으로 간다. 나머지 반은 어디로도 가지 않는다. 숫자는 거짓말을 못 한다. 거짓말은 숫자를 읽는 사람이 한다.

            너는 종이를 접어 품에 넣는다. 옆방에서 인장 소리가 이어진다. 한 번, 두 번.
          effects: ["learn fact_o5_levy_double", "item o5_levy_sheet", "var o5_has_sheet = true", "goto sr_debt_alley", "note 마르셀의 분담금 계산지를 가져왔다 — 784 가운데 392는 어디로도 가지 않는다"]
        failure:
          text: |
            서랍이 운다. 바닷물에 부푼 나무다. 옆방의 인장 소리가 멎는다.

            "짐이 밤에 걸어 다니네요." 벽 너머에서 둥근 목소리. 서두르지 않는다. 문이 열리고 등불이 네 얼굴에 멎는다. 푸른 비늘, 소금 얼룩, 닻 셋의 반지.

            루치오는 경비를 부르지 않는다. 값을 매긴다. "장부방 무단 출입은 계약 위반이에요. 빚 두 배 — 는 너무 비싸고. 셋만 얹지요. 짐은 짐이고요." 그가 꼬리 끝으로 문을 가리킨다.
          effects: ["var o5_debt += 3", "fear 1", "rel npc_sr_lucio trust -10", "memory npc_sr_lucio 위험함 펠네가 밤에 장부방에 들어왔다", "goto sr_debt_alley", "note 장부방에서 루치오에게 걸렸다 — 빚에 셋"]
      - id: succession
        label: 승계 서류철을 찾는다 — 아버지의 줄
        minutes: 40
        check: {skill: 통찰, D: 26, helps: [photo_memory, memory_palace, scribe]}
        success:
          text: |
            서류철 아홉째 묶음. 펠. 승계 등록 — 308, 11, 11. 긴밤월 열하루.

            아버지가 소금 바늘호에서 떨어진 날은 열나흘이다. 승계가 죽음보다 사흘 먼저다. 등록 칸의 인장은 카셀론, 그 아래 손글씨는 마르셀.

            옆방의 인장 소리가 이어진다. 너는 서류철을 제자리에 꽂는다. 숫자 셋은 꽂아 두지 않는다.
          effects: ["learn fact_o5_succession_early", "goto sr_debt_alley", "note 장부방의 승계 서류 — 긴밤월 열하루 등록. 아버지는 열나흘에 떨어졌다. 등록: 마르셀"]
        failure:
          text: |
            서류철 하나가 선반에서 미끄러진다. 바닥에 닿는 소리가 크다. 옆방의 인장 소리가 멎는다.

            문이 열린다. 등불, 푸른 비늘, 느린 눈. "아버님 서류를 찾나요? 서류는 낮에 찾는 거예요. 밤에 찾으면 — 값이 붙고요." 루치오가 손가락 셋을 편다. "셋. 짐은 짐이고요."
          effects: ["var o5_debt += 3", "fear 1", "rel npc_sr_lucio trust -10", "memory npc_sr_lucio 위험함 펠네가 밤에 장부방의 서류를 뒤졌다", "goto sr_debt_alley", "note 장부방에서 루치오에게 걸렸다 — 빚에 셋"]
      - id: lucio_wall
        label: 얇은 벽에 귀를 댄다 — 루치오가 무엇에 인장을 찍는지
        minutes: 30
        check: {skill: 은신, D: 22, helps: [shadow_step, bat_ear]}
        success:
          text: |
            벽 너머에서 루치오가 혼잣말을 한다. 숫자로. "열둘. 열둘. 소금 바늘은 열둘." 종이 넘기는 소리. "열넷은 열둘이고, 둘은 손실이고." 인장 두 번.

            보험 서류다. 죽은 사람이 열넷이면 서류에는 열둘. 나머지 둘의 값은 손실이 되어 계단으로 내려온다. 너희 줄로.
          effects: ["learn fact_p2sr_lucio_mortality_books", "learn fact_o5_loss_is_dead", "goto sr_debt_alley", "note 루치오의 보험 서류 — 소금 바늘은 언제나 열둘. 넘는 수는 '손실'이 되어 계약민 줄로 온다"]
        failure:
          text: |
            귀를 대는 순간 벽이 삐걱인다. 인장 소리가 멎는다. 너는 걸쇠 쪽으로 몸을 던진다. 등 뒤에서 문이 열리는 소리, 그리고 웃음 비슷한 숨.

            계단을 세 칸씩 내려간다. 아무도 쫓아오지 않는다. 나가는 서두르지 않는다. 내일 아침이면 줄에 서 있을 짐이니까.
          effects: ["fear 1", "var o5_lucio_watch = true", "memory npc_sr_lucio 위험함 밤에 장부방 벽에 귀를 댄 그림자 — 계약민 중 하나", "goto sr_debt_alley", "note 장부방에서 루치오에게 들킬 뻔했다 — 얼굴은 보지 못했을 것이다"]
      - id: down
        label: 내려간다 — 열한 시 전에 숙소로
        minutes: 20
        text: |
          걸쇠를 원래대로 걸어 둔다. 계단을 내려가는 동안 옆방의 인장 소리가 따라온다. 한 번, 두 번.

          빚 골목 6층 계단에서 숨을 고른다. 아무것도 손에 쥐지 않았다. 손바닥이 젖어 있다.
        effects: ["goto sr_debt_alley", "var o5_office_plan = false", "stress 3"]

  # ───────────────────────── 소금계단의 밤 (미코) ─────────────────────────
  - id: o5_stairs_night
    origin: seren_bonded
    trigger: {window: {from: "312-09-01 21:30", to: "312-09-04 01:00"}, at: sr_kassalon_dock, with: npc_miko, night: true}
    text: |
      소금계단 맨 아래 칸. 물이 계단을 핥았다 물러난다. 미코가 거기 앉아 있다. 허벅지 위에서 손가락이 움직인다. 일곱을 더하고, 지우고, 다시 더한다.

      "스물두 해가 몇 해가 됐는지 아직 못 셌어." 그가 너를 보지 않고 말한다. "이자가 이자를 낳거든." 앞니 사이로 휘파람이 샌다. 길지 않다.

      위층 장부방 창은 어둡다. 그 옆방 창에만 불이 있다.
    choices:
      - id: sit_count
        label: 미코 옆에 앉아 같이 센다
        minutes: 40
        text: |
          너는 그 옆에 앉는다. 둘의 손가락이 각자의 허벅지 위에서 움직인다. 같은 숫자를 센다. 한참 뒤 미코가 웃는다. 앞니 사이로 바람이 샌다.

          "열흘 밤에 지붕 다리로 와. 빚 골목 지붕을 잇는 판자. 카타리나 아줌마가 숫자를 맞춰 줘. 너처럼 숫자 읽는 사람이 백 명쯤 와." 그가 일어선다. "숫자는 합법이야. 그게 웃기지."
        effects: ["learn fact_o5_roof_bridge", "rel npc_miko like 5", "rel npc_miko trust 4", "bond npc_miko 4", "note 미코 — 열흘 밤 열 시, 지붕 다리. 셈 모임"]
      - id: ask_side
        label: '"밤에 눈먼 등대 쪽에서 뭘 나른다며."'
        minutes: 20
        check: {skill: 화술, D: 26, helps: [tongue, liar_nose]}
        success:
          text: |
            휘파람이 멎는다. 미코가 처음으로 너를 똑바로 본다. 그러다 웃는다.

            "상자 하나. 눈먼 등대에서 받아서 갈림목에 내려놓으면 끝. 두 닢. 금화로." 그가 손가락 둘을 편다. "다음은 엿새 밤이야. 반은 네 몫으로 해 줄 수도 있고." 손가락이 다시 접힌다. "숫자는 틀리면 안 돼. 입도."
          effects: ["learn fact_o5_miko_side_job", "var o5_knows_miko_smuggle = true", "rel npc_miko trust 4", "note 미코의 밤일 — 눈먼 등대의 상자를 갈림목까지. 두 금화. 다음은 엿새 밤"]
        failure:
          text: |
            "등대? 거긴 불도 안 켜는 등대야." 휘파람이 길어진다. "갑판꾼이 밤에 뭘 나르겠어. 빚이나 나르지."
          effects: ["rel npc_miko trust -2"]
      - id: dig_for_lucio
        when: ["var o5_lucio_deal == true"]
        label: 루치오에게 팔 숫자를 캔다 — 웃으며, 그의 밤일을
        minutes: 20
        check: {skill: 기만, D: 28, helps: [deceit, actor, false_face]}
        success:
          text: |
            너는 네 밤 이야기를 먼저 꺼낸다. 스크레, 소금 나루 뒤편, 두 닢. 미코가 웃는다. 숫자에 약한 사내다.

            "두 닢은 나도 벌어. 등대 쪽에서." 그가 손가락 둘을 편다. "엿새 밤. 상자 하나. 갈림목까지." 그는 네 얼굴을 본다. 친구의 얼굴을 보는 눈이다.

            너는 숫자 하나를 얻었다. 이름 하나와 밤 하나.
          effects: ["learn fact_o5_miko_side_job", "var o5_knows_miko_smuggle = true", "temper 충성 -4", "note 미코의 밤일 — 엿새 밤, 눈먼 등대의 상자. 루치오가 원하는 숫자다"]
        failure:
          text: |
            미코의 휘파람이 뚝 끊긴다. "너 아까 난간에 올라갔지." 숫자를 세던 손가락이 멈춰 있다. "루치오 나리가 너한테 뭘 물었어?"

            그는 대답을 기다리지 않는다. 계단을 올라가 굽은 닻 쪽 어둠으로 간다. 한 번도 돌아보지 않는다.
          effects: ["rel npc_miko trust -15", "rel npc_miko like -10", "var o5_miko_wary = true", "memory npc_miko 거짓말쟁이 펠네가 루치오에게 팔 숫자를 캐려 했다"]
      - id: mem_roster
        needs_memory: fact:fact_sr_miko_duty_roster
        label: '"굶주림월 사흘, 소금 바늘호 당번표. 네 이름이 끝에 있어."'
        minutes: 15
        text: |
          휘파람이 멎는다. 미코의 손가락이 허벅지 위에서 멈춘다. 일곱에서.

          "…그건 나도 오늘 아침에 봤어." 처음 듣는 목소리다. 느리고 조용하다. "회색여울 서른하나. 내가 갑판 당번이야." 그가 너를 본다. 오래. "너 그걸 어떻게 알아? 등록소 벽 봤어?"

          대답을 기다리지 않는다. 그가 다시 센다. 이번에는 다른 숫자를.
        effects: ["rel npc_miko trust 10", "memory npc_miko 이상함 펠네가 내 당번표를 안다", "var o5_miko_roster = true"]
      - id: go_home
        label: 열한 시 전에 숙소로 올라간다
        minutes: 20
        text: |
          "가." 미코가 손을 흔든다. "열한 시 넘으면 물비늘대가 숙식비를 두 배로 매겨. 나는 배 밑창에 있을 거야. 물비늘대는 배 밑창까지는 안 내려와."

          빚 골목으로 올라가는 계단에서 뒤를 본다. 미코의 손가락이 아직 움직인다.
        effects: ["goto sr_debt_alley", "rel npc_miko like 2", "stress -3"]

  # ───────────────────────── 등 없는 배 (스크레의 밤 하역) ─────────────────────────
  - id: o5_night_hold
    origin: seren_bonded
    trigger: {window: {from: "312-09-03 22:30", to: "312-09-04 03:00"}, at: sr_salt_quay, night: true, when: ["var o5_night_work == true"]}
    stage:
      - {npc: npc_sr_skre, at: sr_salt_quay, from: "312-09-03 22:00", to: "312-09-04 02:30", doing: 부두 뒤편 등 없는 배 곁에서 장부 상자를 두 번 두드린다}
    severity: 3
    text: |
      소금 나루 뒤편. 등이 하나도 없다. 눈먼 등대 꼭대기 창에 천이 걸려 있다 — 어두워서 색은 보이지 않는다.

      배가 닿는다. 강을 내려온 낮은 배, 돛을 내린 채. 스크레가 장부 상자를 두 번 두드린다. 크릭 하역꾼들이 밧줄을 받는다. 짐칸 뚜껑이 열린다.

      짐이 일어선다.

      사슬에 묶인 사람들이 한 줄로 올라온다. 아무도 소리를 내지 않는다. 소리를 내지 않는 법을 배운 얼굴들이다. 스크레가 손가락으로 센다. 장부 상자에만 적는다. 하역표는 없다. 표가 없으면 사람도 없다.

      절벽 길 쪽에 수레가 기다린다. 산호 채석장으로 가는 길이다.
    choices:
      - id: carry
        label: 짐을 나른다 — 세지 않는다
        minutes: 150
        text: |
          사슬 끝을 쥐고 절벽 길 수레까지. 다시 배로. 다시 수레로. 얼굴은 보지 않는다. 보지 않는 것이 이 일의 반이다.

          새벽 두 시, 스크레가 네 손바닥에 금화 두 닢을 올린다. 차갑다. "다음에도요. 세지 말고요."

          빚 골목 계단을 오르는 동안 금화가 품 안에서 서로 부딪힌다. 소리가 난다. 아주 작은 소리.
        effects: ["coin 480", "var o5_night_jobs += 1", "temper 자비 -4", "stress 8", "fatigue 20", "rel npc_sr_skre trust 5", "goto sr_debt_alley", "note 밤 하역 — 금화 두 닢. 세지 않았다"]
      - id: count
        label: 나르면서 센다 — 얼굴 하나에 숫자 하나
        minutes: 150
        text: |
          하나. 턱에 흉터가 있는 사내. 둘. 맨발의 여자. 셋, 넷 — 쌍둥이일지도 모르는 두 아이. 너는 사슬 끝을 쥐고 걸으며 센다. 입술은 움직이지 않는다.

          열하나. 마지막은 너보다 어린 여자애다. 수레에 오르기 전에 한 번 바다를 본다. 그 줄에서 바다를 본 사람은 그 애 하나다.

          스크레가 네 손바닥에 금화 두 닢을 올린다. "다음에도요." 그가 장부 상자를 두 번 두드린다. 열하나는 거기에만 있다. 이제 네 머릿속에도.
        effects: ["coin 480", "var o5_night_jobs += 1", "learn fact_o5_hold_people", "var o5_counted_hold = true", "temper 자비 -2", "stress 10", "fatigue 20", "goto sr_debt_alley", "note 밤 하역 — 열하나. 등록 없는 사람들이 산호 채석장으로. 마지막 아이는 바다를 봤다"]
      - id: free_one
        label: 마지막 아이의 사슬을 풀어 검은 물에 내려 준다
        minutes: 150
        risk: 스크레의 크릭들은 밤에 본 것을 물에 버린다
        check: {skill: 손재주, D: 24, helps: [lock_hands, swimmer, smuggler, naga_scale]}
        success:
          text: |
            사슬 고리는 하역 크릭의 것이라 헐겁다. 늘 헐겁다 — 크릭은 사람이 도망칠 줄 모른다고 믿는다. 고리가 손가락 사이에서 벌어진다.

            "물." 너는 그 애의 귀에 대고 말한다. "왼쪽으로. 등대 쪽." 그 애는 소리 없이 미끄러진다. 물이 한 번 닫힌다.

            수레 앞에서 스크레가 센다. 열. 다시 센다. 열. 그가 장부 상자를 두 번 두드리고 한 줄을 지운다. 그의 장부는 늘 그렇게 맞춘다. 네 손바닥에 금화 한 닢. "반이에요. 숫자가 반이니까."

            그 졸린 눈이 네 얼굴에 조금 오래 머문다.
          effects: ["coin 240", "var o5_freed_one = true", "var o5_night_jobs += 1", "learn fact_o5_hold_people", "temper 자비 5", "temper 용기 3", "rel npc_sr_skre trust -5", "memory npc_sr_skre 이상함 펠네의 줄에서 하나가 모자랐다", "goto sr_debt_alley", "note 밤 하역 — 하나를 검은 물로 내려 보냈다. 스크레가 한 줄을 지웠다"]
        failure:
          text: |
            고리가 벌어지지 않는다. 쇠가 쇠를 긁는 소리. 크릭 하나가 고개를 돌린다. 둘, 셋.

            스크레는 소리치지 않는다. 장부 상자를 두 번 두드릴 뿐이다. 크릭들이 너를 부두 끝으로 민다. 등 뒤가 물이다. 검고, 차고, 깊다.
          effects: ["die_if 0.35 water npc_sr_skre 소금 나루 뒤편의 검은 물 — 스크레의 크릭들이 밤에 본 것을 물에 버렸다", "pain 15", "rel npc_sr_skre trust -25", "memory npc_sr_skre 위험함 펠네가 밤 하역의 짐을 풀려 했다", "var o5_skre_burned = true", "goto sr_debt_alley", "note 밤 하역 — 들켰다. 크릭들에게 맞고 물에 떨어졌다가 기둥을 잡고 기어 올라왔다"]
      - id: refuse
        label: 사슬을 내려놓고 돌아선다 — 이건 짐이 아니다
        minutes: 40
        text: |
          사슬 끝이 부두 널빤지에 떨어진다. 소리가 크다. 크릭들이 일제히 너를 본다. 스크레만 보지 않는다. 그는 장부 상자를 두 번 두드린다.

          "밤 하역은 없어요." 졸린 목소리. "그러니까 당신도 오늘 밤 여기 없었던 거고요. 그렇죠?"

          너는 대답하지 않는다. 등 뒤에서 사슬 소리가 다시 움직이기 시작한다. 너 없이도.
        effects: ["rel npc_sr_skre trust -10", "var o5_skre_scared = true", "memory npc_sr_skre 위험함 펠네가 밤 하역을 보고 돌아섰다", "temper 정직 3", "temper 자비 2", "goto sr_debt_alley", "note 밤 하역 — 짐을 내려놓고 왔다. 스크레는 네가 입을 열까 두려워한다"]

  # ───────────────────────── 나가의 저울 (루치오 카셀론의 값) ─────────────────────────
  - id: o5_lucio_scale
    origin: seren_bonded
    trigger: {window: {from: "312-09-02 07:00", to: "312-09-12 18:00"}, at: sr_kassalon_dock, with: npc_sr_lucio, when: ["var o5_lucio_deal == true"]}
    text: |
      위층 난간에서 꼬리 끝이 한 번 난간을 친다. 너를 부르는 소리다. 마르셀이 계단 위에서 비켜선다.

      루치오 카셀론의 방은 넓고 젖어 있다. 바닥에 얕게 바닷물이 고였다. 책상 위에 보험 서류가 쌓였고, 인장이 둘이다. 그가 느리게 몸을 돌린다.

      "숫자 하나는 가져왔나요?" 둥근 목소리. "아니면 — 더 큰 저울에 올라 보든가요." 그가 꼬리 끝으로 장부를 민다. 펠의 줄. "일곱은 작은 값이에요. 서른하나 — 아버님 몫 전부 — 도 지울 수 있어요. 그 값은 더 크고요."

      그는 서두르지 않는다. 나가는 서두르지 않는다. "잿빛 실이라는 말을 들어 봤나요? 남쪽 끝에 등잔이 하나 있대요. 표식 받은 아이들을 숨기는 등잔. 그 등잔 하나의 이름이면 — 서른하나를 바다에 던지지요."
    choices:
      - id: sell_miko
        when: ["var o5_knows_miko_smuggle == true", "not var o5_miko_wary == true"]
        label: 숫자 하나를 판다 — 미코, 엿새 밤, 눈먼 등대의 상자
        minutes: 30
        text: |
          루치오의 눈이 천천히 위아래로 움직인다. 숫자를 받는 눈이다. "미코. S-11847. 서른하나." 그는 장부를 보지도 않고 외운다. "숫자는 정직하네요."

          그가 마르셀을 부른다. 펠, 승계분. 분담 면제. 착오. 그리고 한 줄 더 — 물비늘대 앞으로.

