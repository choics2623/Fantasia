  # ───────────────────────── 우물가의 셈 (카타리나 · '일괄 상환권'의 소문) ─────────────────────────
  - id: o5_well_count
    origin: seren_bonded
    trigger: {window: {from: "312-09-02 21:00", to: "312-09-09 22:00"}, at: sr_debt_alley, with: npc_sr_catarina, night: true}
    text: |
      빚 골목 공동 우물. 밤 아홉 시인데도 줄이 서 있다. 계약 외 시간은 이 시간뿐이다. 두레박 줄 곁에서 머리에 흰 천을 두른 여자가 누군가의 숫자를 큰 소리로 되풀이한다. 카타리나 셈손 — 셈 모임의 목소리, 빚을 다 갚은 1,900 가운데 하나.

      "이자 얼마야? 월? 연? 둘 다 말해! 둘이 안 맞으면 누가 훔친 거야!" 그녀가 너를 본다. 줄의 맨 뒤를. "펠네. 소금계단 일곱 얘기 들었다. 너는 몇이야?"
    choices:
      - id: show_sheet
        when: ["var o5_has_sheet == true"]
        label: 품에서 분담금 계산지를 꺼내 보인다 — 784, 392
        minutes: 30
        text: |
          카타리나의 손이 무릎을 문지르다 멈춘다. 그녀는 종이를 받지 않는다. 눈으로만 읽는다. 숫자를 셀 때 입이 빨라진다.

          "반이 어디로도 안 가네." 목소리가 낮아진다. 처음 듣는 크기다. "나는 증언 못 해. 서명했거든. 그건 묻지 마." 그녀가 우물 쪽으로 고개를 돌린다. "근데 숫자는 합법이야. 열흘 밤 열 시, 지붕 다리로 그걸 가져와. 백 명이 같이 세면 — 판관도 센다."
        effects: ["var o5_cell_case = true", "learn fact_o5_roof_bridge", "rel npc_sr_catarina trust 10", "rel npc_sr_catarina like 5", "note 카타리나 — 계산지를 열흘 밤 지붕 다리로. 백 명이 같이 센다"]
      - id: hold_line
        when: ["var o5_levy == suspended"]
        label: '"서른이 엄지를 거뒀어요. 정산까지 버틸 숫자가 필요해요."'
        minutes: 30
        text: |
          카타리나가 크게 웃는다. 우물 줄이 돌아본다. "서른! 소금계단에서 서른!" 그러다 웃음이 뚝 그친다. "이의는 걸기는 쉬워. 버티는 게 어렵지. 숫자를 가져와. 마르셀 계산지든, 장부 사본이든."

          그녀가 네 귀에 대고 말한다. 크지 않게. "열흘 밤 열 시, 지붕 다리."
        effects: ["learn fact_o5_roof_bridge", "var o5_cell_lead = true", "rel npc_sr_catarina trust 8", "note 카타리나 — 이의를 버틸 숫자가 필요하다. 열흘 밤 지붕 다리"]
      - id: compute
        label: '"몇 해예요?" — 카타리나와 같이 센다'
        minutes: 30
        text: |
          카타리나가 손가락을 편다. 접는다. 다시 편다. 입이 빨라진다. 월 이자, 연 이자, 노임, 매점 값. 우물 줄의 사람들이 따라서 입술을 움직인다.

          "공식대로면 스물두 해. 실제로는 — 마흔." 그녀가 무릎을 문지른다. "갚아서 나간 사람? 백에 둘이 안 돼. 판관 청원은 백에 넷 이기고. 근데 그 넷은 다 숫자로 이긴 거야."
        effects: ["learn fact_sr_repay_rate_true", "learn fact_p2sr_catarina_win_four_pct", "rel npc_sr_catarina like 4", "stress 4", "note 카타리나의 셈 — 공식은 스물두 해, 실제는 마흔. 갚고 나간 이는 백에 둘이 안 된다. 청원은 숫자로만 이긴다"]
      - id: rumor
        label: 굽은 닻에서 도는 말을 묻는다 — '일괄 상환권'
        minutes: 20
        text: |
          "아, 그거." 카타리나가 두레박을 내려놓는다. "몬달리 의장이 전쟁 돈이 필요하대. 그래서 상가 하나의 계약민 빚을 통째로 묶어서 판다는 말이 있어. 한 장짜리 증서로." 그녀는 침을 뱉지 않는다. 우물가니까.

          "누가 사든 우리가 한 장이 되는 거지. 한 장이면 — " 그녀가 손바닥으로 무릎을 문지른다. "태울 수도 있고."
        effects: ["learn fact_o5_bulk_redemption", "rel npc_sr_catarina trust 3", "note 소문 — 한 상가의 계약민 빚을 통째로 묶은 '일괄 상환권'. 사는 자가 그들을 가진다. 태울 수도 있다"]
      - id: lupo_lead
        label: 아버지의 계약서 사본을 보인다 — 틈이 있느냐
        minutes: 15
        text: |
          카타리나는 사본을 받지 않는다. 승계 도장 아래 엄지 자국만 본다. "그건 내 일 아니야. 루포한테 가져가 — '빈 장부'. 이 골목 지하. 아침이나 밤에 있어." 그녀가 덧붙인다. "공짜라고 할 거야. 그다음에 정정할 거고. 숫자 하나를 가져가."
        effects: ["var o5_lupo_lead = true", "rel npc_sr_catarina trust 2", "note 카타리나 — 루포의 '빈 장부' 사무실, 빚 골목 지하. 아침이나 밤. 숫자 하나를 가져갈 것"]
      - id: walk_past
        label: 물만 긷고 지나간다
        minutes: 10
        text: |
          두레박이 올라온다. 물이 짜다. 카타리나는 벌써 다음 사람의 이자를 큰 소리로 되풀이하고 있다. 너는 네 숫자를 말하지 않는다.
        effects: ["rel npc_sr_catarina like -2", "stress 2"]

  # ───────────────────────── 빈 장부 (루포) ─────────────────────────
  - id: o5_empty_ledger
    origin: seren_bonded
    trigger: {window: {from: "312-09-02 06:00", to: "312-09-16 21:00"}, at: sr_lupo_office, with: npc_lupo}
    text: |
      '빈 장부' 사무실. 빚 골목 지하, 방수 칠을 한 서가가 벽을 두른 방. 젖은 종이 냄새와 먹물 냄새. 둥근 안경을 쓴 라미아가 짧은 회색 꼬리를 의자 밑에 감고 앉아 있다. 루포 — 빚을 지우는 무면허 변호인.

      "상담은 무료입니다. 아, 아니요 — 정정하죠." 그가 짧게 숨을 들이쉰다. "나가는 무료를 못 해요. 숫자 하나만 주세요. 오늘 무엇을 봤나요?"

      그가 네 사본을 받아 맨 아래 줄부터 읽는다. 안경을 코 위로 밀어 올린다. 손가락이 승계 조항에서 멈춘다. "승계 등록, 긴밤월 열하루. 아버님은 — 언제 돌아가셨죠?"

      "열나흘."

      "…정정하죠. 그럼 이건 오류예요." 그가 처음으로 웃는다. "오류는 정직하거든요."
    effects: ["learn fact_o5_succession_early"]
    choices:
      - id: pay_sheet
        when: ["pknows fact_o5_levy_double"]
        label: '숫자 하나 — "784 가운데 392는 어디로도 가지 않아요."'
        minutes: 30
        text: |
          루포가 그 숫자를 손바닥에 먼저 쓴다. 그다음 방수 장부에 옮긴다. "그건 숫자 두 개예요. 아니, 정정하죠 — 그건 한 사람의 이름이에요."

          그가 사본을 돌려준다. "승계 조항의 날짜 오류. 판관 청원에 올리죠. 그런데 숫자 하나로는 모자라요. 증인 한 명 — 아버님이 떨어진 날 그 갑판에 있던 사람. 판관 앞에서 날짜 하나만 말하면 돼요. 스무이틀에 서가에 갑니다."
        effects: ["var o5_lupo_case = true", "rel npc_lupo trust 10", "memory npc_lupo 쓸모 있음 펠네가 숫자 하나를 가져왔다 — 분담금의 반", "note 루포 — 승계 날짜 오류를 판관 청원에. 증인이 필요하다: 아버지가 떨어진 날 갑판에 있던 사람. 낙엽월 스무이틀"]
      - id: pay_hold
        when: ["pknows fact_o5_hold_people"]
        label: 숫자 하나 — 소금 나루 뒤편, 등 없는 배의 열하나
        minutes: 30
        text: |
          루포의 손이 멈춘다. 손바닥에 쓰던 숫자가 반쯤에서. "등록 없는 사람." 그가 안경을 벗는다. 흉터 많은 손이 렌즈를 닦는다. 오래. "그 숫자는 비싸요. 너무 비싸서 — 정정하죠, 받아야겠네요."

          그가 사본을 돌려준다. "승계 날짜 오류. 판관 청원에 올리죠. 증인 한 명이 필요해요 — 아버님이 떨어진 날 갑판에 있던 사람. 스무이틀에 서가에 갑니다."
        effects: ["var o5_lupo_case = true", "rel npc_lupo trust 12", "temper 정직 2", "memory npc_lupo 쓸모 있음 펠네가 등록 없는 사람의 숫자를 가져왔다", "note 루포 — 승계 날짜 오류를 판관 청원에. 증인이 필요하다. 낙엽월 스무이틀"]
      - id: pay_self
        label: '숫자 하나 — 네 숫자. "서른여덟, 그리고 열나흘."'
        minutes: 30
        text: |
          "당신 숫자네요." 루포가 그래도 손바닥에 쓴다. 그다음 방수 장부에 옮긴다. 네 숫자가 남의 숫자 사천 개 사이로 들어간다. "제 장부에는 남의 숫자만 있어요. 정정하죠 — 이제 당신 숫자도 남의 숫자예요."

          그가 사본을 돌려준다. "승계 날짜 오류. 청원에 올리죠. 증인 한 명 — 아버님이 떨어진 날 갑판에 있던 사람. 스무이틀."
        effects: ["var o5_lupo_case = true", "var o5_in_lupo_ledger = true", "rel npc_lupo trust 4", "note 루포 — 승계 날짜 오류를 판관 청원에. 증인이 필요하다. 낙엽월 스무이틀. 네 숫자가 그의 방수 장부에 들어갔다"]
      - id: leave_copy
        label: 사본을 거둔다 — 숫자를 팔지 않는다
        minutes: 10
        text: |
          루포는 사본을 돌려준다. 붙잡지 않는다. "숫자를 아끼는 사람은 오래 살아요. 정정하죠 — 오래 빚을 지죠."
        effects: ["stress 2", "note 루포의 사무실 — 숫자를 팔지 않았다. 승계 조항의 오류는 그대로 거기 있다"]

  # ───────────────────────── 지붕 다리의 셈 모임 (정본: 매달 10일 22시) ─────────────────────────
  - id: o5_roof_bridge
    origin: seren_bonded
    trigger: {window: {from: "312-09-10 21:30", to: "312-09-11 01:00"}, at: sr_roof_bridge}
    text: |
      지붕 다리. 빚 골목 6층 숙소 지붕들을 잇는 판자. 발밑으로 운하가 검다. 판자 위에 사람들이 앉아 있다. 백은 넘는다. 등은 없다. 숫자를 셀 때는 손가락이면 된다.

      카타리나가 맨 앞에 앉아 있다. 그 옆에 키가 작고 어깨가 둥근 사내 — '반쪽 혀' 오스카, 금 간 안경의 계약 감정사 — 가 입술만 움직이며 누군가의 이자를 계산한다. 목수 얀이 판자 끝에서 삐걱거리는 널을 발로 눌러 본다.

      "다음 숫자." 카타리나가 말한다. 오늘 밤 그녀의 목소리는 크지 않다.
    choices:
      - id: lay_sheet
        when: ["var o5_has_sheet == true"]
        label: 분담금 계산지를 판자 위에 펼친다 — 784, 392
        minutes: 60
        check: {skill: 화술, D: 28, helps: [crowd_voice, storyteller, tongue], warn: ["var o5_collective == true"]}
        success:
          text: |
            종이가 손에서 손으로 간다. 등이 없어서 사람들은 숫자를 손가락으로 더듬어 읽는다. 784. 392. 392.

            오스카가 안경을 코끝으로 밀어 올린다. "의회 문서의 셋 반, 곱하기 백열둘. 392." 그의 목소리는 낮고 정확하다. "나머지 392는 카셀론의 장부에도, 의회의 장부에도 없어요. 숫자는 거짓말을 못 해요."

            카타리나가 무릎을 문지른다. "루포가 계약안 양식으로 쓴다. 서리월 첫날 정산에 백열두 줄을 다 가져간다. 증언은 — " 그녀가 너를 본다. "숫자가 한다."

            일은 서리월 첫날 의회에서 끝나겠지만, 지붕 다리의 백 명은 오늘 밤 이미 안다. 소금계단의 분담금은 계약 사기로 정지된다. 숫자는 먼저 안다.
          effects: ["agenda if var o5_levy == on: var o5_debt -= 7", "var o5_levy = off", "var o5_marcel_exposed = true", "temper 용기 4", "rel npc_sr_catarina trust 10", "rel npc_sr_oscar trust 8", "rel npc_jan like 4", "memory npc_o5_marcel 위험함 펠네가 계산지를 지붕 다리에 내놓았다", "note 지붕 다리 — 백 명이 계산지를 셌다. 분담금은 계약 사기로 정지된다 (서리월 첫날 정산)"]
        failure:
          text: |
            종이는 손에서 손으로 가다가 멈춘다. 누군가 아래 운하를 본다. 물비늘대의 등불 하나가 다리 밑을 지나간다. 사람들이 숨을 죽인다. 등불이 지나간 뒤에도 아무도 종이를 다시 집지 않는다.

            "숫자는 맞아." 카타리나가 종이를 접어 네 손에 돌려준다. "사람이 모자라. 오늘은."
          effects: ["stress 6", "rel npc_sr_catarina trust 3", "note 지붕 다리 — 숫자는 맞았지만 사람이 모자랐다"]
      - id: hold_objection
        when: ["var o5_levy == suspended", "not var o5_has_sheet == true"]
        label: '"서른의 이의를 지켜 주세요 — 계산지 없이라도."'
        minutes: 60
        check: {skill: 화술, D: 34, helps: [crowd_voice, storyteller, tongue], warn: ["pknows fact_o5_levy_decree"]}
        success:
          text: |
            판자 위가 조용하다. 그러다 오스카가 입을 연다. 숫자로. "의회 문서가 셋 반이면, 일곱은 두 배예요. 계산지가 없어도 곱셈은 있어요." 그가 안경을 밀어 올린다. "곱셈은 합법이고요."

            카타리나가 웃는다. 이번에는 크게. 백 명의 손가락이 판자 위에서 같은 곱셈을 한다. 셋 반, 곱하기 둘.

            서리월 첫날 정산에서 분담금은 셋 반으로 깎이지 않는다 — 통째로 정지된다. 일곱을 두 배로 매긴 계산은 판관에게 사기다.
          effects: ["var o5_levy = off", "temper 용기 3", "rel npc_sr_catarina trust 8", "rel npc_sr_oscar trust 6", "note 지붕 다리 — 오스카의 곱셈. 서른의 이의가 버텼다. 분담금은 정지된다 (서리월 첫날 정산)"]
        failure:
          text: |
            "숫자가 없으면 이의는 무게가 없어." 카타리나의 목소리가 크지 않다. "서른이 버티다가 열이 되고, 열이 셋이 되는 걸 나는 봤어."

            서리월 첫날 정산까지 갈 것도 없다. 다음 날 아침 마르셀이 이의 줄을 하나씩 지운다. 네 줄에 일곱이 다시 붙고, 이의 비용 한 닢이 더 붙는다.
          effects: ["var o5_levy = on", "var o5_debt += 8", "stress 8", "note 지붕 다리 — 이의를 지킬 숫자가 없었다. 분담금 일곱이 다시 붙고 이의 비용 한 닢"]
      - id: mem_formula
        needs_memory: fact:fact_p2sr_oscar_proof_formula
        label: '오스카에게 낮게: "0.3이 스물두 해를 마흔 해로 만들죠. 열두 쪽."'
        minutes: 30
        text: |
          오스카의 입술이 멈춘다. 계산하던 숫자가 반쯤에서. 그가 안경을 벗는다. 금 간 알을 손톱으로 한 번 튕긴다.

          "…누가 쪽지를 봤어요? 쪽지는 없어요. 저는 쪽지를 안 써요." 목소리가 떨린다. 그러다 멎는다. 그가 카타리나 쪽을 본다. 오래. "다섯 쪽이 남았어요. 입으로만." 그가 숨을 고른다. "서명한 적 없는 증인과 증언할 수 없는 증인. 한 줄로 앉으면 되겠네요."
        effects: ["var sr_oscar_shared = true", "rel npc_sr_oscar trust 10", "memory npc_sr_oscar 이상함 펠네가 열두 쪽을 안다", "note 오스카 — 상환 공식 증명의 나머지 다섯 쪽을 카타리나 앞에서 입으로 읽기로 했다"]
      - id: listen
        label: 남의 이자를 같이 센다 — 숫자만 듣는다
        minutes: 60
        text: |
          너는 판자 끝에 앉아 다른 사람의 숫자를 같이 센다. 염전에서 눈이 상한 늙은이의 마흔하나. 조선소 목수의 열아홉. 아이를 안은 여자의 스물여섯 — 아이 몫까지.

          자정 가까이 사람들이 하나둘 지붕을 내려간다. 얀이 마지막으로 삐걱거리는 널을 한 번 밟고 간다. 아무것도 정해지지 않았다. 숫자만 맞춰졌다. 이의가 걸린 숫자는 아무도 꺼내지 않았다.
        effects: ["agenda if var o5_levy == suspended: var o5_levy = on ; var o5_debt += 7", "rel npc_sr_catarina like 3", "rel npc_sr_oscar like 2", "stress -4", "note 지붕 다리 — 남의 숫자를 셌다"]

  # ───────────────────────── 마흔둘: 산호 채석장 줄 (빚의 문턱) ─────────────────────────
  - id: o5_quarry_list
    origin: seren_bonded
    trigger: {window: {from: "312-09-02 05:00", to: "312-12-30 00:00"}, at: sr_kassalon_dock, with: npc_o5_marcel, when: ["var o5_debt >= 42"]}
    severity: 4
    text: |
      새벽 줄. 마르셀이 장부에서 네 줄을 찾는다. 손가락이 멈춘다. 오래.

      "펠, 승계분. 마흔둘." 그가 숫자를 끝까지 읽는다. 처음으로 숨을 쉬며. "카셀론은 마흔 넘는 짐을 갑판에 두지 않는다. 갚을 수 없는 짐은 배를 무겁게 하거든. 산호 채석장 줄 — 내일 아침 소금 나루, 절벽 길 수레."

      줄이 조용하다. 산호 채석장에서 갚고 나온 사람은 이 계단에 하나도 없다.
    choices:
      - id: pay_two
        needs: "coin >= 480"
        label: 금화 두 닢을 장부 위에 올려놓는다
        minutes: 10
        text: |
          금화 두 닢이 장부 위에서 소리를 낸다. 마르셀이 그것을 집어 손바닥 저울에 올린다. 진짜다. 그가 네 줄의 숫자를 고친다. 마흔.

          "갑판에 남는다. 이번 달은." 그는 금화의 출처를 묻지 않는다. 금화는 출처를 말하지 않는다. "다음 급여일에 다시 센다."
        effects: ["coin -480", "var o5_debt -= 2", "var o5_quarry_spared = true", "note 금화 두 닢을 장부에 — 마흔. 갑판에 남는다, 이번 달은"]
      - id: bribe
        needs: "coin >= 48"
        label: '은화 넷을 장부 밑으로 민다 — "숫자를 한 번만 다시 세 보시죠."'
        minutes: 10
        check: {skill: 화술, D: 30, helps: [merchant, haggle, deceit]}
        success:
          text: |
            마르셀의 손이 장부 밑으로 간다. 은화가 사라진다. 그는 네 줄을 다시 센다. 소리 내어. "마흔…하나. 착오." 펜이 움직인다.

            "다음 급여일까지." 그가 너를 보지 않고 말한다. "숫자는 숫자다. 다음에는 안 틀린다."
          effects: ["coin -48", "var o5_debt = 41", "var o5_quarry_spared = true", "var o5_marcel_bribed = true", "note 마르셀에게 은화 넷 — 마흔하나로 '착오'. 다음 급여일까지"]
        failure:
          text: |
            마르셀이 은화를 집는다. 그리고 장부를 덮는다. "뇌물은 계약 위반이다. 숫자는 그대로고." 은화는 돌아오지 않는다.

            다음 날 아침, 소금 나루의 절벽 길 수레. 물비늘대 둘이 양옆에 선다.
          effects: ["coin -48", "captured 산호 채석장 줄 — 빚 마흔둘의 계약민은 갑판에 남지 못했다"]
      - id: accept
        label: 채석장 줄에 선다
        minutes: 10
        text: |
          너는 고개를 끄덕인다. 마르셀은 이미 다음 줄을 읽고 있다.

          다음 날 아침, 소금 나루의 절벽 길 수레. 사슬은 없다. 계약민에게는 사슬이 필요 없다 — 숫자가 있으니까.
        effects: ["captured 산호 채석장 줄 — 빚 마흔둘의 계약민은 갑판에 남지 못했다"]

  # ───────────────────────── 213번째 (정본 9.22: 루포가 서가에서 무효를 찾는다) ─────────────────────────
  - id: o5_lupo_verdict
    origin: seren_bonded
    trigger: {window: {from: "312-09-22 13:00", to: "312-09-30 22:00"}, at: "@seren", when: ["var o5_lupo_case == true", "alive npc_lupo"]}
    severity: 3
    text: |
      스무이틀. 루포의 심부름 아이 — 숫자 하나를 받고 말을 나르는 빚 골목 아이 — 가 너를 찾아온다. "판관 앞. 지금."

      푸른 장부관 서가 아래, 계약 판관 하나가 물 담긴 그릇에 손을 담그고 앉아 있다. 루포가 그 앞에 서류를 편다. 아래 줄부터. 등록관 시르 오랄이 번호표를 쥐고 못 본 척한다. 213번째.

      "승계 등록이 사망보다 사흘 앞섭니다." 루포가 안경을 밀어 올린다. "죽지 않은 사람의 빚을 산 사람에게 옮긴 오류예요. 정정하죠 — 오류가 아니라 날짜의 거짓이에요. 증인을 부르겠습니다."
    choices:
      - id: miko_swears
        when: ["alive npc_miko", "not var o5_miko_sold == true", "rel_trust npc_miko >= 20"]
        label: 미코를 증인으로 세운다 — 그 갑판에 있던 사람
        minutes: 120
        text: |
          미코가 판관 앞에 선다. 휘파람이 없다. 팔뚝의 S-11847을 내보인다. "긴밤월 열나흘. 소금 바늘호. 펠이 떨어질 때 나는 등불을 들고 있었어요." 그가 숫자처럼 말한다. "열나흘이에요. 열하루가 아니라."

          판관의 손이 물에서 나온다. 젖은 손가락이 서류의 승계 조항을 짚는다. 한 번. 줄이 그어진다.

          213번째. 펠의 승계분 서른한 금화 — 물에 잠긴 장부. 루포가 손바닥에 숫자를 쓴다. 이번에는 장부에 옮기지 않는다. 그 숫자는 그의 것이 아니다.

          계단을 나오며 미코가 휘파람을 분다. 길게. 겁이 나서가 아니다.
        effects: ["var o5_debt -= 31", "agenda if var o5_debt <= 0: var o5_debt = 0 ; var o5_free = true", "var o5_succession_void = true", "var o5_marcel_exposed = true", "rel npc_miko trust 10", "rel npc_miko like 10", "rel npc_lupo trust 10", "bond npc_miko 8", "memory npc_o5_marcel 위험함 펠네의 승계 조항이 판관 앞에서 지워졌다", "note 213번째 — 펠의 승계분 서른한 금화가 지워졌다. 미코가 날짜를 말했다"]
      - id: alone
        label: 증인 없이 — 네가 직접 날짜를 말한다
        minutes: 120
        check: {skill: 화술, D: 36, helps: [tongue, crowd_voice, etiquette]}
        success:
          text: |
            "열나흘입니다." 너는 판관의 그릇을 본다. 물이 흔들리지 않는다. "그날 저녁 장부꾼이 숙소 문을 두드렸습니다. 승계 서류는 사흘 전에 이미 등록돼 있었고요." 숫자를 말한다. 날짜를, 시각을, 그날 소금 바늘호의 바람을.

            판관의 젖은 손가락이 승계 조항을 짚는다. 오래. 그리고 줄을 긋는다. 213번째.

            루포가 안경을 벗는다. "승계자 본인의 말은 증언이 아니에요. 정정하죠 — 오늘은 증언이었네요."
          effects: ["var o5_debt -= 31", "agenda if var o5_debt <= 0: var o5_debt = 0 ; var o5_free = true", "var o5_succession_void = true", "var o5_marcel_exposed = true", "rel npc_lupo trust 10", "temper 용기 4", "memory npc_o5_marcel 위험함 펠네의 승계 조항이 판관 앞에서 지워졌다", "note 213번째 — 펠의 승계분 서른한 금화가 지워졌다. 증인 없이, 네 숫자로"]
        failure:
          text: |
            판관이 너를 보지 않는다. "승계자 본인의 말은 증언이 아니다." 젖은 손이 서류를 덮는다. 기각.

            루포가 안경을 벗는다. "정정하죠 — 오늘은 기각이에요." 청원 비용 한 닢이 네 줄에 붙는다. 오류는 그대로 거기 있다. 다음 회기까지.
          effects: ["var o5_debt += 1", "var o5_lupo_case = false", "note 판관 청원 기각 — 증인이 없었다. 청원 비용 한 닢"]
      - id: withdraw
        label: 청원을 거둔다 — 마르셀의 이름이 판관 앞에 나오는 것이 두렵다
        minutes: 30
        text: |
          루포가 오래 너를 본다. 그리고 서류를 접는다. 아래 줄부터. "의뢰인의 뜻이 먼저예요." 그가 손바닥을 편다. 비어 있다. "정정하죠 — 의뢰인의 두려움이 먼저죠. 오늘은."
        effects: ["var o5_lupo_case = false", "temper 용기 -3", "note 루포의 청원을 거뒀다"]

  # ───────────────────────── 세렌의 소품 (연출가 장면 — 출신과 무관하게 이 고장의 것) ─────────────────────────
  - id: o5_dir_canal_plate
    trigger: {director: true, category: omen, at: [sr_debt_alley], hours: ["19:00", "22:00"], chance: 0.25}
    text: |
      해 진 운하. 숙소 기둥 사이에 무언가 걸려 있다. 물비늘대의 나가 하나가 장대 갈고리로 그것을 끌어당긴다. 사람이다. 손목에 노임 패가 끈으로 묶여 있다 — 빚 차감을 새기는 손바닥만 한 동판.

      나가가 패를 뜯어 등잔에 비춘다. "열아홉." 그리고 장부에 적는다. "승계자 있음."
    choices:
      - id: read_plate
        label: 동판의 숫자를 읽는다
        text: "열아홉. 그 아래 작은 숫자 둘 — 승계자 둘. 동판은 물비늘대의 장부 상자로 들어간다. 빚은 물에 빠지지 않는다."
        effects: ["stress 4", "note 저녁 운하 — 노임 패의 열아홉. 승계자 둘. 빚은 물에 빠지지 않는다"]
      - id: walk_on
        label: 우물 줄로 간다
        text: "우물 줄의 아무도 운하를 보지 않는다. 두레박이 올라온다. 물이 짜다."
        effects: ["stress 2"]
  - id: o5_dir_store_child
    trigger: {director: true, category: lack, at: sr_debt_store, hours: ["18:00", "21:30"], chance: 0.3}
    text: |
      매점 창구. 생선죽 두 그릇에 동화 두 닢 — 노임 패에 새기면 셋. 창구 옆에 아이 하나가 서 있다. 노임 패가 아직 없는 나이. 아이는 솥을 본다. 손에 동전이 없다.

      매점의 나가는 아이를 보지 않는다. 숫자가 없는 사람은 보이지 않는다.
    choices:
      - id: buy_bowl
        needs: "coin >= 2"
        label: 동화 두 닢을 창구에 놓는다 — 아이 몫
        text: "나가가 동화를 세고 그릇을 내민다. 아이는 그릇을 받아 들고 뛰지 않는다. 걷는다. 흘리지 않으려고."
        effects: ["coin -2", "temper 자비 2"]
      - id: teach_two
        label: 아이 손바닥에 손가락으로 숫자를 쓴다 — 둘
        text: "아이가 손바닥을 오래 본다. 둘. 그 애는 그것을 쥐고 간다. 숫자는 합법이다. 배는 부르지 않다."
        effects: ["temper 자비 1", "stress -1"]
      - id: own_bowl
        label: 제 그릇만 받는다
        text: "그릇이 따뜻하다. 등 뒤에서 아이의 발소리가 멀어진다."
        effects: ["stress 2"]
  - id: o5_dir_reni_rumor
    trigger: {director: true, category: opportunity, at: sr_crooked_anchor, hours: ["12:00", "23:00"], chance: 0.3, when: ["alive npc_reni"]}
    text: |
      굽은 닻. 기름 냄새, 싸구려 맥주. 한쪽 탁자에서 여우 귀 하나가 선다. 레니 — 소문을 파는 바울피 수인 — 가 꼬리를 탁자 다리에 감고 너를 본다.

      "돈을 들고 다녀도 되는 도시. 좋은 도시지." 그가 손바닥을 편다. "은화 한 닢에 소문 하나. 반은 참말이야. 어느 반인지는 덤이고."
    choices:
      - id: buy_bulk
        needs: "coin >= 12"
        label: 은화 한 닢 — 의회 쪽 소문
        text: |
          레니가 은화를 깨물어 본다. "몬달리가 전쟁 돈이 필요해. 상가 하나의 계약민 빚을 통째로 묶은 증서를 판다더군. 일괄 상환권. 사는 놈이 백 명을 한 장으로 가져." 귀가 한쪽만 선다. "태우는 놈도 있겠지. 그건 내가 덤으로 지어낸 말이고."
        effects: ["coin -12", "learn fact_o5_bulk_redemption"]
      - id: buy_light
        needs: "coin >= 24"
        label: 은화 두 닢 — 바다 쪽 소문
        text: |
          "눈먼 등대 꼭대기 창." 레니가 은화 두 닢을 겹쳐 쥔다. "천이 걸리면 늪 쪽 배가 들어와. 등대지기는 늙은 계약민 올라프. 색이 무슨 뜻인지는 — 은화 셋이야." 그가 웃는다.
        effects: ["coin -24", "learn fact_sr_blind_lighthouse_signal"]
      - id: no_buy
        label: 사지 않는다
        text: "\"숫자 읽는 사람들은 짜다니까.\" 레니의 귀가 내려간다. 그는 다른 탁자로 간다."
        effects: ["rel npc_reni like -2"]
