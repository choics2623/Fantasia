# 회색여울 밖 — 처음 닿을 때의 장면과 연출가의 소품. at: "@고장" = 그 고장 어디든.
storylets:
  # ── 까마귀 문 요새 ──
  - id: arrive_crow_gate
    trigger: {window: {from: "312-09-01 00:00", to: "330-12-30 00:00"}, at: "@crow_gate"}
    text: |
      까마귀 문. 돌보다 까마귀가 많다. 성벽 위 장대마다 검은 새가 앉아 있고, 장대 끝에는 새가 아닌 것도 걸려 있다.

      남문 보초가 네 손목부터 본다. 목줄 자국. 그다음에 얼굴. 순서가 그렇다.
    choices:
      - id: in
        label: 고개를 숙이고 짐꾼들 사이로 들어간다
        text: "짐꾼 하나가 네 어깨에 자루를 얹는다. \"들어. 들고 있으면 아무도 안 묻는다.\""
        effects: ["note 까마귀 문 — 짐을 들고 있으면 아무도 묻지 않는다"]
  - id: cg_raven_count
    trigger: {director: true, category: omen, at: [cg_well_yard, cg_south_gate], hours: ["06:00", "19:00"], chance: 0.3}
    text: |
      까마귀 사육장에서 전령새 하나가 날아오른다. 북쪽으로. 우물가의 짐꾼들이 동시에 고개를 든다. "또 하나." 누군가 센다. 아무도 무엇을 세는지 말하지 않는다.
    choices:
      - id: ask
        label: '"뭘 세는 겁니까?"'
        text: "늙은 짐꾼이 침을 뱉는다. \"북문이 닫힐 날까지. 새가 열둘 날면 닫힌다.\""
        effects: ["note 까마귀 문 — 전령새가 열둘 날면 북문이 닫힌다는 말"]
  - id: cg_laundry_word
    trigger: {director: true, category: opportunity, at: cg_laundry, hours: ["07:00", "17:00"], chance: 0.35}
    text: |
      빨래터. 용인 병사의 옷에서 피를 빼는 여자들. 하나가 너를 보고 손을 멈춘다. "남쪽에서 왔지. 냄새가 달라."
    choices:
      - id: talk
        label: 빨래를 같이 비빈다
        text: "한동안 말없이 비빈다. 여자가 말한다. \"물빼기 굴. 북문 옆. 비 오는 밤엔 보초가 안 본다.\" 그리고 다시 아무 말도 하지 않는다."
        effects: ["note 까마귀 문 — 북문 옆 물빼기 굴, 비 오는 밤엔 보초가 안 본다", "temper 자비 1"]
  - id: cg_drill_lash
    trigger: {director: true, category: threat, at: [cg_drill_yard, cg_porter_barracks], hours: ["05:00", "12:00"], chance: 0.25}
    text: |
      훈련 마당에서 용인 교관이 짐꾼 하나를 세워 놓고 창 자루로 무릎을 친다. "다시." 짐꾼이 일어선다. "다시." 다른 짐꾼들은 보지 않는다. 너도.
    choices:
      - id: look
        label: 보지 않는다
        text: "다섯 번째 '다시'에서 소리가 그친다."
        effects: ["stress 4"]

  # ── 용주 역참 ──
  - id: arrive_dragon_pillar
    trigger: {window: {from: "312-09-01 00:00", to: "330-12-30 00:00"}, at: "@dragon_pillar_post"}
    text: |
      세 번째 용주. 길가에 박힌 돌기둥이 하늘을 찌른다. 기둥에 새겨진 것은 글자가 아니라 발톱 자국이다. 용의 대로는 여기서부터 용의 것이다.

      역참 마당에 사슬로 묶인 사람들이 앉아 있다. 남쪽으로 가는 줄. 서리월이면 키트도 이 마당에 앉을 것이다.
    choices:
      - id: look
        label: 사슬의 얼굴들을 본다
        text: "아무도 너를 보지 않는다. 한 아이만 본다. 그 아이는 웃지도 울지도 않는다."
        effects: ["stress 5", "note 용주 역참 — 남쪽으로 가는 사슬 줄이 쉬는 곳"]
  - id: dp_mailbox
    trigger: {director: true, category: opportunity, at: [dp_post_hall, dp_mailbox], hours: ["20:00", "23:59"], chance: 0.3}
    text: |
      전령 우편함의 자물쇠가 헐겁다. 안에서 밀랍 냄새. 봉인된 편지들 — 바알카르로, 세렌으로.
    choices:
      - id: peek
        label: 손가락을 넣어 본다
        check: {skill: 손재주, D: 38}
        success: {text: "봉투 하나의 귀퉁이. 세렌의 몬달리 은행 문장. 받는 이: 레이번.", effects: ["learn fact_gf_godric_debt"]}
        failure: {text: "자물쇠가 덜컥 소리를 낸다. 역참장 방의 불이 켜진다. 너는 마구간 쪽으로 걷는다 — 뛰지 않는다.", effects: ["wanted 1 역참 우편함에 손을 댔다"]}
      - id: leave
        label: 그냥 둔다
        text: ""
        effects: []
  - id: dp_caravan
    trigger: {director: true, category: calm, at: [dp_caravan_yard, dp_cookhouse], hours: ["16:00", "21:00"], chance: 0.35}
    text: |
      짐마차 마당에서 나가 상인 하나가 장부를 읽는다. 소리 내어. 숫자를 셀 때마다 혀가 갈라진다. 마부들이 그 소리에 맞춰 말 등을 빗긴다.
    choices:
      - id: listen
        label: 숫자를 따라 센다
        text: "보리 마흔 섬. 소금 열두 포. 사람 — 숫자 뒤의 말을 너는 알아듣는다. 사람 서른하나."
        effects: ["temper 신앙 -1"]

  # ── 바알카르 ──
  - id: arrive_baalkar
    trigger: {window: {from: "312-09-01 00:00", to: "330-12-30 00:00"}, at: "@baalkar"}
    text: |
      바알카르. 산 하나가 통째로 도시다. 일곱 층. 위로 갈수록 비늘이 많아지고, 아래로 갈수록 사람이 많아진다. 너는 맨 아래, 재받이에 있다.

      위에서 무언가가 떨어진다. 재다. 화형장의 재가 아래층으로 내려온다. 아이들이 그것을 손바닥으로 받는다 — 따뜻해서.
    choices:
      - id: on
        label: 재를 털고 걷는다
        text: "재는 털리지 않는다. 옷감에 배어 있다. 여기 사람들의 옷은 모두 회색이다."
        effects: ["note 바알카르 — 재받이. 화형장의 재가 아래층으로 내려온다"]
  - id: bk_pyre
    trigger: {director: true, category: threat, at: [bk_pyre_yard, bk_ashcatch], hours: ["10:00", "18:00"], chance: 0.25}
    text: |
      재 마당에서 장작이 쌓인다. 누가 탈지는 아직 정해지지 않았다는 듯이, 기둥은 비어 있다. 순종의 빛 사제가 군중을 훑는다. 아이들의 얼굴을 오래 본다.
    choices:
      - id: hide
        label: 군중 뒤로 물러난다
        check: {skill: 은신, D: 30}
        success: {text: "사제의 눈이 네가 있던 자리를 지나간다.", effects: []}
        failure: {text: "사제의 눈이 너에게서 멈춘다. 반 박자. 그리고 지나간다. 등이 젖는다.", effects: ["fear 2", "stress 4"]}
  - id: bk_market_boy
    trigger: {director: true, category: bond, at: [baalkar__scale_market, bk_chain_square], hours: ["08:00", "17:00"], chance: 0.25}
    text: |
      비늘 시장. 경매대 아래 우리에서 소년 하나가 철창 사이로 손을 내민다. 먹을 것을 달라는 손이 아니다. 잡아 달라는 손이다.
    choices:
      - id: hold
        label: 잠깐 잡는다
        text: "손이 차다. 경매인이 막대로 철창을 친다. 손이 빠진다. 소년의 번호는 사백십칠."
        effects: ["stress 3", "temper 자비 2", "note 바알카르 비늘 시장 — 사백십칠"]
      - id: go
        label: 지나간다
        text: "등 뒤에서 철창이 한 번 울린다."
        effects: ["stress 2"]

  # ── 잿불 본갱 ──
  - id: arrive_ember_mines
    trigger: {window: {from: "312-09-01 00:00", to: "330-12-30 00:00"}, at: "@ember_mines"}
    text: |
      잿불 언덕. 땅이 숨을 쉰다 — 환기탑이 기침을 할 때마다. 굴 마을 '숯막'의 사람들은 모두 같은 색이다. 검은 폐의 색.

      점호 마당의 감독이 네 이빨을 본다. 말을 사듯이. "새 거군. 하층."
    choices:
      - id: down
        label: 아무 말도 하지 않는다
        text: "하층. 거기서는 아무도 오래 말하지 않는다."
        effects: ["note 잿불 본갱 — 새로 온 자는 하층으로"]
  - id: em_dara_cave
    trigger: {director: true, category: omen, at: [em_lvl_lower, em_old_cave, em_burrow_red], hours: ["00:00", "23:59"], chance: 0.2}
    text: |
      폐갱 쪽 벽에 손바닥 자국이 있다. 붉은 흙으로 찍은. 아홉 개. 누가 찍었는지 아무도 말하지 않지만, 모두 그 앞에서 고개를 숙인다.
    choices:
      - id: touch
        label: 열 번째 자리에 손바닥을 대 본다
        text: "흙이 따뜻하다. 머릿속 어딘가에서 누가 웃는다 — 웃음이라기보다 쇠 긁는 소리다."
        effects: ["stress 3", "temper 용기 2"]
  - id: em_black_bread
    trigger: {director: true, category: lack, at: em_ration, hours: ["05:00", "21:00"], chance: 0.35}
    text: |
      검은 빵 창구. 빵이 정말 검다. 톱밥이 섞여 있다. 그래도 줄은 길다.
    choices:
      - id: eat
        label: 먹는다
        text: "목구멍을 긁고 내려간다. 배는 찬다. 잠깐."
        effects: ["hunger -1", "pain 3"]

  # ── 루멘 ──
  - id: arrive_lumen
    trigger: {window: {from: "312-09-01 00:00", to: "330-12-30 00:00"}, at: "@lumen"}
    text: |
      루멘. 사슬등불이 낮에도 켜져 있다. 대성당의 종이 울릴 때마다 순례자들이 무릎을 꿇는다 — 엘다르가 아니라 등불에게.

      순례자 거리의 게시 기둥에 종이가 붙어 있다. 글자다. 너는 읽을 수 있다. 읽을 수 있다는 것을 아무도 몰라야 한다.
    choices:
      - id: read
        label: 읽는다 — 눈만 움직여서
        text: "\"잔향의 징후를 가진 자를 고하는 자에게 은 세 닢.\" 아래에 징후의 목록. 네 것과 맞는 줄이 둘."
        effects: ["stress 5", "note 루멘 게시 기둥 — 잔향의 징후를 고하면 은 세 닢"]
      - id: not
        label: 보지 않는다
        text: "종이가 바람에 펄럭인다. 너는 그 소리만 듣는다."
        effects: []
  - id: lm_candle_works
    trigger: {director: true, category: opportunity, at: [lm_candle_works, lm_token_stalls], hours: ["08:00", "18:00"], chance: 0.3}
    text: |
      양초 공방 뒤에 부러진 양초가 바구니째 버려져 있다. 성표가 찍히지 않은 것들 — 팔 수 없는 불.
    choices:
      - id: take
        label: 하나 집는다
        text: "성표 없는 양초. 들키면 도둑이다. 들키지 않으면 불이다."
        effects: ["item candle"]
  - id: lm_confession
    trigger: {director: true, category: threat, at: [lm_confession_square, lm_pyre_court], hours: ["09:00", "18:00"], chance: 0.25}
    text: |
      고해 광장. 한 여자가 무릎 꿇고 이웃의 이름을 대고 있다. 사제가 받아 적는다. 이름 하나에 등불 하나가 더 켜진다.
    choices:
      - id: away
        label: 걸음을 돌린다
        text: "등불이 하나 더 켜지는 소리. 등불에는 소리가 없는데."
        effects: ["stress 3", "fear 1"]
