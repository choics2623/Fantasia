          스칼리의 꼬리가 풀린다. "…그럼 됐어." 그가 다시 달을 본다. 기도의 목이 아까보다 낮다.

          "아이들이 많던데." 그것으로 끝이다. 스칼리는 그 말을 다시 하지 않는다.
        effects: ["bond npc_o12_skali 3", "stress 8", "note 스칼리에게 — 아비는 이미 안다. '아이들이 많던데.'"]
      - id: moon_oath
        when: ["not var o12_volk_has_den == true"]
        label: '"달 앞에서 — 아비에게도 말하지 말자."'
        minutes: 15
        check: {skill: 화술, D: 18, helps: [tongue, beast_friend], warn: ["var o12_skali_secret == true"]}
        success:
          text: |
            스칼리가 한참 대답하지 않는다. 달이 구름에 한 번 들어갔다 나온다.

            "달 앞에서 한 말은 무리의 말이야." 그가 네 손등을 핥는다. 늑대가 맹세하는 방식이다. "아비가 물으면 — 나는 아무것도 못 맡았어. 거짓말이 아니게, 아무 말도 안 할게."
          effects: ["var o12_skali_oath = true", "bond npc_o12_skali 10", "rel npc_o12_skali trust 8", "temper 자비 5", "note 스칼리와 달 앞의 맹세 — 가시덤불을 아비에게도 말하지 않는다"]
        failure:
          text: |
            스칼리가 귀를 접는다. "아비한테는 거짓말 못 해. 아비는 냄새로 알아. 말 안 하는 것도 냄새가 나." 그가 고개를 젓는다. "열나흘에 아비가 물으면, 나는 말할 거야. 미안해, 코."

            그는 그 밤 네 등에 등을 붙이지 않는다.
          effects: ["var o12_skali_will_tell = true", "bond npc_o12_skali -3", "note 스칼리 — 아비가 물으면 말할 것이다. '미안해, 코'"]
      - id: to_den
        label: 오늘 밤 혼자 가시덤불로 간다
        minutes: 60
        risk: 창끝이 먼저 나온다
        text: |
          "잠깐 오줌." 스칼리는 고개를 들지 않는다. 그는 알고, 모른 척한다. 그게 형제다.

          너는 동쪽 비탈을 탄다. 달빛이 바위를 희게 칠한다. 네 냄새가 바위에 남는다 — 루그가 내일 맡을 것이다.
        effects: ["goto hungry_hill__wolf_den", "var o12_rug_marks += 1", "then o12_den_spear"]
      - id: run_together
        label: '"같이 가자. 무리 없이, 아비 없이."'
        minutes: 15
        check: {skill: 화술, D: 34, helps: [tongue, charm]}
        success:
          text: |
            스칼리의 털이 곤두선다. 오래. 그리고 천천히 가라앉는다.

            "…달이 질 때까지 생각할게." 그가 달을 본다. 처음으로, 기도 없이. "무리 없는 늑대는 미친대. 그런데 너 없는 무리도 — 무리야?"
          effects: ["var o12_skali_wavers = true", "bond npc_o12_skali 6", "note 스칼리에게 같이 떠나자고 했다 — '너 없는 무리도 무리야?'"]
        failure:
          text: |
            스칼리가 벌떡 일어선다. "무리를 버리면 달이 우리를 미치게 해!" 목소리가 커서 루그가 뒤척인다. 스칼리는 숨을 고른다. 낮게. "그 말은 안 들은 걸로 할게."

            그는 루그에게 말하지 않는다. 그러나 그 밤 너와 같은 바위에 앉지 않는다.
          effects: ["bond npc_o12_skali -5", "rel npc_o12_skali trust -6", "var o12_asked_skali_run = true", "note 스칼리에게 같이 떠나자고 했다 — 그는 귀를 접었다"]
      # ── ◈ 기억 선택지 ──
      - id: mem_fourteenth
        needs_memory: loop
        label: ◈ 스칼리에게 — 열나흘 아침에 아비가 무엇을 묻는지, 루그가 무엇을 짖는지 미리 말해 준다
        minutes: 10
        text: |
          스칼리의 귀가 앞으로 선다. 네 말이 끝날 때까지 꼬리가 움직이지 않는다.

          "너… 아비 냄새를 미리 맡았구나." 그가 네 얼굴을 맡는다. 젖은 재 냄새 — 그는 그게 무엇인지 모른다. "무섭다, 코. 그래도 — 그날 아침엔 네 옆에 설게."
        effects: ["var o12_skali_prepared = true", "bond npc_o12_skali 8", "echo_sign 1 열나흘 아침의 일을 미리 말했다", "note ◈ 스칼리에게 열나흘 아침을 미리 말했다 — '네 옆에 설게'"]
      - id: moon_watch
        label: 스칼리 곁에 앉아 같이 달을 본다 — 아무것도 정하지 않는다
        minutes: 60
        text: |
          너는 아무 말도 하지 않는다. 스칼리도 더 묻지 않는다. 둘이 같이 달을 본다. 바르그의 목은 길게, 인간의 목은 짧게.

          달이 바위 뒤로 넘어갈 무렵 스칼리가 말한다. 거의 잠꼬대처럼. "네가 안 하면, 아비가 물을 때 내가 해야 해." 그리고 네 등에 등을 붙이고 잠든다.
        effects: ["bond npc_o12_skali 6", "stress -6", "var o12_skali_will_tell = true", "note 스칼리와 달을 보았다. 아무것도 정하지 않았다 — 아비가 물으면 스칼리가 말할 것이다"]

  - id: o12_den_spear
    origin: varg_houndling
    text: |
      가시덤불. 그 뒤에 마흔 몇의 냄새가 고여 있다 — 연기, 쥐뿌리 죽, 언 가죽, 열이 오른 아이의 단내.

      덤불이 갈라진다. 창끝이 먼저 나온다. 그다음이 얼굴 — 오른쪽 절반이 동상으로 검게 죽은 얼굴. 창끝이 네 목줄의 놋쇠 패에 닿는다. 쇠와 쇠가 한 번 운다.

      "멈춰. 세 가지만 묻는다." 쉰 목소리, 북쪽 억양. "누구 거냐. 누굴 달고 왔냐. 뭘 가져왔냐."

      너는 이 냄새를 안다. 삼 년 전, 서리 길 마지막 이정표. 바위틈에서 숨을 참던 여자의 냄새다.
    effects: ["learn fact_gf_wolf_den", "var o12_met_sigrid = true"]
    choices:
      - id: three_truths
        label: '"볼크의 코다. 아무도 안 달고 왔다. 열나흘을 가져왔다 — 아비가 돌아오는 날."'
        minutes: 15
        text: |
          창끝이 손가락 한 마디만큼 내려간다. 더는 아니다.

          "열나흘." 그녀가 그 말을 서리말로 한 번 되뇐다. 굴 안쪽에서 누가 아이의 입을 막는 소리가 난다 — 막지 마라, 숨을 못 쉰다, 하는 누군가의 속삭임.

          "개가 주인의 날짜를 들고 왔다." 그녀는 고맙다고 하지 않는다. "돌아가. 오늘 밤 네 냄새는 내 사람들이 지운다." 그날 밤부터 가시덤불 앞에 그림자가 둘 선다.
        effects: ["var o12_sigrid_warned = true", "var den_hidden_better = true", "var o12_elsa_heard = true", "goto hungry_hill__fang_fire", "rel npc_sigrid trust 15", "rel npc_sigrid like 5", "temper 정직 3", "deed rescue unseen", "note 늑대굴의 북쪽 여자에게 — 열나흘. 그녀는 가시덤불 앞에 사람을 더 세웠다"]
      - id: crevice
        when: ["pknows fact_o12_crevice_309"]
        label: '"삼 년 전, 서리 길 마지막 이정표. 바위틈. 나는 호루라기를 불지 않았다."'
        minutes: 15
        check: {skill: 화술, D: 20, helps: [tongue]}
        success:
          text: |
            창끝이 멈춘다. 그녀의 검은 쪽 얼굴이 달빛을 받는다. 그녀는 오래 네 눈을 본다 — 바위틈의 어둠 속에서 한 번 마주쳤던 눈을 찾는 것처럼.

            "…그 개가 너였나." 창이 내려간다. 끝까지는 아니다. "서리 길에서 일곱을 잃었다. 하나는 남았다. 남은 하나가 이 굴에 마흔일곱을 데려왔다." 그녀가 뼈 구슬을 손가락으로 굴린다. "그 셈에 네가 있는 줄은 몰랐다."
          effects: ["var o12_sigrid_crevice = true", "var o12_elsa_heard = true", "goto hungry_hill__fang_fire", "rel npc_sigrid trust 25", "rel npc_sigrid like 10", "note 늑대굴의 북쪽 여자 — 서리 길 바위틈의 그 여자다. 그녀는 내가 그 개였다는 것을 안다"]
        failure:
          text: |
            "거짓말하는 개가 많다." 창끝이 네 쇄골 위 살을 가른다. 얕게. 피가 목줄의 놋쇠 패로 흘러내린다.

            "서리 길의 개들은 모두 같은 냄새가 났다. 돌아가라. 다음엔 묻지 않는다."
          effects: ["pain 10", "goto hungry_hill__fang_fire", "rel npc_sigrid trust -5", "note 늑대굴의 북쪽 여자 — 바위틈 이야기를 믿지 않았다. 창끝이 쇄골을 그었다"]
      - id: hagen_sells
        when: ["pknows fact_gf_hagen_sells_runaways"]
        label: '"나룻배의 하겐 — 북쪽 사람들 냄새를 아비에게 판다. 열아홉이 그렇게 갔다."'
        minutes: 10
        text: |
          그녀의 얼굴이 굳는다. 하겐 — 빵을 들고 웃는 나룻배 사내. 그녀는 그의 배를 타려 했었다.

          "개가 개 장사꾼을 판다." 창이 조금 내려간다. "왜." 너는 대답하지 못한다. 그녀도 대답을 기다리지 않는다. 그날부터 나루 쪽 길목에 사람이 선다.
        effects: ["var sigrid_warned_hagen = true", "var o12_elsa_heard = true", "goto hungry_hill__fang_fire", "rel npc_sigrid trust 12", "note 늑대굴의 북쪽 여자에게 하겐을 말했다 — 나루 길목에 사람이 섰다"]
      - id: threaten
        label: '"아이들을 내놓으면 — 나머지는 아비에게서 숨겨 주겠다."'
        minutes: 5
        risk: 창끝이 먼저 나온다
        text: |
          그녀는 대답하지 않는다. 창이 대답한다.

          가시덤불 뒤에서 사내 둘이 일어선다. 서리 길을 넘어온 어깨들. 무엇이 먼저 네게 닿는지, 너는 보지 못한다 — 달빛이 갑자기 너무 밝다.
        effects: ["die_if 0.45 spear npc_sigrid 늑대굴 가시덤불 앞에서 — 북쪽 여자의 창에", "pain 25", "goto hungry_hill__fang_fire", "rel npc_sigrid trust -30", "rel npc_sigrid like -20", "var o12_sigrid_enemy = true", "note 늑대굴에서 아이들을 내놓으라 했다 — 창이 대답했다"]
      - id: turn_back
        label: 말없이 돌아선다
        minutes: 60
        text: |
          너는 대답하지 않는다. 등을 돌린다. 창끝이 내려가지 않는 것을 등으로 안다.

          송곳니 불로 돌아왔을 때, 루그가 깨어 있다. 그가 네 발목의 흙을 맡는다. 동쪽 비탈의 흙이다.
        effects: ["goto hungry_hill__fang_fire", "var o12_rug_marks += 1", "rel npc_sigrid trust -3", "note 늑대굴 앞에서 말없이 돌아섰다. 루그가 내 발목의 흙을 맡았다"]

  # ───────────────────────── 브람의 침 (목줄을 차고 처음 마을에 들어설 때) ─────────────────────────
  - id: o12_bram_spits
    origin: varg_houndling
    trigger: {window: {from: "312-09-01 12:00", to: "312-09-30 22:00"}, at: [gf_keep, gf_stable, gf_tollhouse, gf_rooster, gf_smithy, gf_mill, gf_chapel, gf_whip_square, gf_north_barracks, gf_south_barracks, gf_river_huts, gf_elsa_hut, gf_irma_hut, gf_pilgrim_barn, gf_hagen_shed, gf_well_square, gf_graveyard, gf_tannery, gf_iron_bridge, gf_guard_barracks, gf_weaving_shed, gf_kennel, gf_willow_bank], when: ["has 조합목줄"]}
    stage:   # 볼크의 뼈패 심부름 (낙엽월 2일): 스칼리가 먼저 내려와 우물가에서 코를 기다린다 — 바르그 곁의 목줄은 통행증이다
      - {npc: npc_o12_skali, kind: walking, at: gf_well_square, from: "312-09-02 05:30", to: "312-09-02 12:00", doing: 뼈패 심부름 — 마을로 내려간다}
      - {npc: npc_o12_skali, at: gf_well_square, from: "312-09-02 12:00", to: "312-09-02 15:30", doing: 우물가 돌턱에 앉아 코를 기다린다 — 혼자서는 성채 문에 들지 못한다}
      - {npc: npc_o12_skali, kind: walking, at: hungry_hill__fang_fire, from: "312-09-02 15:30", to: "312-09-02 22:00", doing: 언덕으로 돌아간다}
    text: |
      마을로 내려오는 길은 비탈 하나, 개울 하나, 그리고 흙길이다. 흙길에서 사람들이 너를 먼저 본다 — 네 목의 놋쇠 패를.

      물동이를 인 여자가 길을 비킨다. 그리고 네 발치에 침을 뱉는다. 아이 하나가 어미의 치마 뒤로 숨는다. 숨는 법을 아는 아이다. 너는 그 아이가 다음에 어디에 숨을지 안다. 그게 더 나쁘다.

      배급 막사 '절름발이 수탉'의 처마 밑에서 외다리 사내가 국자로 솥 가장자리를 한 번 친다. 브람이다. "개는 문턱 밖이다." 그가 침을 뱉는다. 이번엔 네 얼굴에. "언덕의 개. 냄새 맡으러 왔냐."

      길 건너에서 크릭 감독 하나가 네 목줄을 보고, 네 뒤를 본다 — 바르그가 따라오는지. 늪가의 약초 노파 하나가 손바닥을 눈썹 위에 얹고 너를 오래 본다.

      그리고 수탉 마루 밑에서, 아주 희미하게, 기침 냄새가 올라온다.
    effects: ["var o12_elsa_heard = true", "var o12_village_spits += 1", "note 회색여울 — 브람이 얼굴에 침을 뱉었다. 수탉 문턱은 개에게 닫혀 있다"]
    choices:
      - id: bone_to_keep
        when: ["var o12_errand == true", "not var o12_bone_delivered == true"]
        label: 침을 닦고 성채로 간다 — 볼크의 뼈패를 전한다
        minutes: 20
        text: |
          너는 소매로 얼굴을 닦는다. 침은 빗물과 섞여 금방 지워진다. 지워지지 않는 것도 있다.

          성채 마당. 문지기 용인이 뼈패를 손가락 끝으로 받는다. 금 열넷, 그리고 예순. 그는 글을 읽듯 그것을 읽는다. "열나흘. 남작께 아뢰마." 그가 뼈패를 허리춤에 넣으며 네 목줄을 본다. "개가 심부름은 하는군."
        effects: ["goto gf_keep_yard", "var o12_bone_delivered = true", "stress 4", "note 뼈패를 성채에 전했다 — 열나흘에 볼크가 온다, 예순"]
      - id: with_skali
        when: ["with npc_o12_skali"]
        label: 우물가의 스칼리 곁으로 간다 — 바르그 곁의 목줄
        minutes: 10
        text: |
          스칼리가 우물 돌턱에서 일어선다. 크릭 감독이 바르그를 보자 몽둥이를 등 뒤로 감춘다. 목줄 찬 인간 곁에 늑대가 서면, 그 목줄은 통행증이다.

          물동이를 인 여자들이 길을 비킨다. 이번엔 침을 뱉지 않는다. 대신 아이들을 집 안으로 들인다. 스칼리가 코를 킁킁거리며 웃는다. "인간들은 너를 무서워해, 코." 무서워하는 게 아니다. 그걸 스칼리에게 설명할 무리말은 없다.
        effects: ["goto gf_well_square", "bond npc_o12_skali 3", "stress 3", "memory npc_bram 위험함 언덕의 개가 바르그를 달고 왔다", "note 스칼리와 함께면 크릭이 길을 비킨다 — 목줄이 통행증이 된다"]
      - id: collar_alone
        when: ["not with npc_o12_skali"]
        label: 다가오는 크릭에게 목줄의 놋쇠 패를 들이민다 — "볼크의 코다."
        minutes: 10
        check: {skill: 위압, D: 26, helps: [menace, command]}
        success:
          text: |
            크릭이 놋쇠 패를 들여다본다. 그리고 너를 본다. 바르그가 없는 목줄을. "볼크의 코라." 그가 이를 드러낸다. 크릭의 웃음이다. "열나흘에 늑대가 오면, 개가 혼자 마을을 돌아다녔다고 말해 주마."

            그래도 몽둥이는 내려온다. 길을 비킨다.
          effects: ["var o12_rug_marks += 1", "note 크릭에게 볼크의 이름을 댔다 — 길은 텄다. 혼자 다니는 개라는 말이 아비에게 갈 것이다"]
        failure:
          text: |
