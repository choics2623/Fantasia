            지나가는 농노들이 너를 본다. 침을 뱉는 사람은 없다. 개에게는 침도 아깝다는 얼굴이다.
          effects: ["pain 12", "goto gf_whip_square", "wanted 1 혼자 다니는 조합의 개", "var o12_rug_marks += 1", "note 혼자 마을에 내려갔다가 크릭에게 — 채찍 기둥에 목줄이 걸렸다"]
      - id: growl
        label: 이빨을 드러낸다 — 무리에게 배운 대로, 목 깊은 데서
        minutes: 5
        check: {skill: 위압, D: 22, helps: [menace, varg_blood]}
        success:
          text: |
            사람의 목에서 나면 안 되는 소리가 난다. 물동이가 흙탕에 떨어진다. 여자가 아이를 낚아채 달아난다. 흙길이 빈다.

            브람만 그대로 서 있다. 국자를 쥔 손의 마디가 하얗다. "…그래. 그게 너다." 그가 문턱 안으로 들어가 문을 닫는다. 빗장 소리.
          effects: ["var o12_village_fear += 1", "rel npc_bram like -6", "temper 용기 2", "temper 자비 -2", "note 마을에서 으르렁거렸다 — 흙길이 비었다. 브람이 빗장을 질렀다"]
        failure:
          text: |
            목에서 나오는 것은 쉰 기침 같은 소리다. 누가 웃는다. 그리고 돌이 날아온다. 관자놀이.

            "개가 짖네." 크릭 감독이 길 건너에서 손뼉을 친다. 너는 피를 손바닥으로 누르며 걷는다. 뒤에서 웃음소리가 따라온다.
          effects: ["pain 8", "rel npc_bram like -2", "note 마을에서 으르렁거리려다 돌을 맞았다"]
      - id: bram_bowl
        label: '브람에게 — "개도 배는 고프다."'
        minutes: 15
        check: {skill: 화술, D: 20, helps: [tongue, charm]}
        success:
          text: |
            브람이 오래 너를 본다. 네 얼굴이 아니라, 광대뼈 밑의 움푹한 데를. 그는 굶은 얼굴에 약하다. 그게 그의 약점이라는 걸 그도 안다.

            "빌어먹을." 그가 그릇에 죽을 퍼서 — 문턱 밖 흙바닥에 놓는다. 개에게 주듯이. "먹었으면 가. 질문은 하지 말고."
          effects: ["hunger -1", "rel npc_bram like 8", "var o12_bram_bowl = true", "note 브람이 문턱 밖에 죽 한 그릇을 놓아 주었다 — 개에게 주듯이"]
        failure:
