          effects: ["pain 5", "rel npc_bram like -3", "note 브람의 국자 — '개는 언덕에서 먹어'"]
      - id: smell_cellar
        label: 수탉 마루 밑의 기침 냄새를 맡는다 — 코가 하는 일을
        minutes: 5
        check: {skill: 통찰, D: 24, helps: [dog_nose, tracker, liar_nose]}
        success:
          text: |
            콧구멍이 저절로 벌름거린다. 기침. 피가 섞인 가래. 아이 오줌, 젖은 짚, 북쪽 사람들의 기름 냄새. 마루 밑에 사람이 있다. 다섯. 하나는 아프다.
          effects: ["learn fact_gf_egil_family_in_cellar", "then o12_cellar"]
        failure:
