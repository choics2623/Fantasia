            "냄새 맡으러 왔냐고 물었다." 그가 문을 닫는다. 빗장 소리가 두 번 난다.
          effects: ["rel npc_bram trust -10", "memory npc_bram 위험함 언덕의 개가 수탉 바닥을 맡았다", "note 수탉 마루 밑을 맡으려 했다 — 연기가 덮었다. 브람이 보았다"]
      # ── ◈ 기억 선택지 ──
      - id: mem_cough
        needs_memory: fact:fact_gf_egil_family_in_cellar
        label: '◈ 브람의 귀에 대고 — "기침이 마루까지 샌다. 아이 오줌 냄새도."'
        minutes: 5
        text: |
          브람의 국자가 멈춘다. 그는 너를 보지 않는다. 문턱 안 솥만 본다. 오래.

          "…누가." 그 말이 질문인지 너는 모른다. "언덕의 개가 그걸 왜 나한테 말하지." 대답을 기다리지 않는다. 그날 밤 수탉의 지하 벽에 짚과 진흙이 한 겹 더 발린다.
        effects: ["var o12_bram_warned = true", "learn fact_gf_egil_family_in_cellar", "rel npc_bram trust 15", "echo_sign 1 수탉 지하의 손님들을 알았다", "note ◈ 브람에게 — 기침이 마루까지 샌다. 그가 벽을 다시 발랐다"]
      - id: wipe_spit
        label: 침을 닦는다 — 아무것도 하지 않는다
        minutes: 10
        text: |
          너는 소매로 얼굴을 닦는다. 브람은 문턱에 선 채 움직이지 않는다. 너도 움직이지 않는다. 한참 뒤, 그가 먼저 눈을 돌린다. 솥이 끓는다.

          침을 닦는 개를, 그는 처음 본다는 얼굴이다.
        effects: ["stress 5", "rel npc_bram like 2", "memory npc_bram 이상함 언덕의 개가 침을 닦고 그냥 갔다", "note 브람의 침을 닦았다. 아무것도 하지 않았다"]

  - id: o12_cellar
    origin: varg_houndling
    text: |
      브람이 네 코를 본다. 네 콧구멍이 벌름거리는 것을. 국자를 쥔 손의 마디가 하얘진다. 그는 아무 말도 하지 않는다. 대답 대신 그릇을 닦는다. 닦는 손이 떨린다.

      이 냄새 하나로 볼크는 머릿수를 다섯 더 센다. 즈닉은 은화 두 닢을 던질 것이다. 브람은 채찍 기둥에 묶일 것이다.
    choices:
      - id: shake_head
        label: 브람에게 고개를 젓는다 — 아무 냄새도 안 났다
        minutes: 5
        text: |
          너는 고개를 젓는다. 한 번. 브람의 손이 그릇을 닦다 멈춘다.

          "…질문은 하지 말고." 그의 목소리가 갈라져 있다. "먹었으면 가." 너는 먹은 것이 없다. 그래도 간다.
        effects: ["var o12_cellar_kept = true", "rel npc_bram trust 12", "temper 자비 4", "memory npc_bram 이상함 언덕의 개가 지하실 냄새를 맡고도 고개를 저었다", "note 수탉 마루 밑 — 다섯. 브람에게 고개를 저었다"]
      - id: warn_bram
        label: '브람의 귀에 — "기침을 막아라. 코는 나만이 아니다."'
        minutes: 5
        text: |
          브람의 얼굴이 하얘졌다가, 붉어진다. 그는 오래 너를 본다 — 처음으로 개가 아니라 다른 무언가를.

          "…빌어먹을." 그가 국자를 내려놓는다. "빚지는 건 싫은데." 그날 밤 자정, 그는 남은 죽을 들고 지하로 내려가기 전에 문 쪽을 네 번 본다. 세 번이 아니라.
        effects: ["var o12_bram_warned = true", "rel npc_bram trust 18", "rel npc_bram like 5", "temper 자비 6", "note 브람에게 — 기침을 막아라. '빌어먹을. 빚지는 건 싫은데.'"]
      - id: sell_znik
        label: 감독관 초소로 간다 — 냄새를 판다
        minutes: 20
        text: |
          감독관 초소. 즈닉이 노란 눈으로 네 목줄을 본다. 너는 무리말 대신 서툰 인간 말로 말한다. 마루 밑. 다섯. 기침.

          즈닉의 꼬리가 바닥을 한 번 친다. 은화 두 닢이 흙바닥에 떨어진다. 개에게 던지듯이. 너는 줍는다. 줍는 손이 이상하게 무겁다 — 가슴 안쪽에서 무언가가 그 은화를 받지 않는다.
        effects: ["agenda learn npc_znik fact_gf_egil_family_in_cellar", "var o12_cellar_sold = true", "goto gf_whip_square", "coin 24", "deed inform npc_bram", "temper 자비 -12", "stress 25", "note 즈닉에게 수탉 지하의 냄새를 팔았다 — 은화 두 닢. 내일 새벽, 지하실"]
      - id: keep_for_volk
        label: 아비를 위해 남겨 둔다 — 열나흘에 바칠 냄새
        minutes: 5
        text: |
          너는 아무 말도 하지 않는다. 브람에게도, 크릭에게도. 냄새는 코 안에 둔다. 아비가 오면 꺼낼 수 있도록.

          브람의 떨리는 손이 그릇을 다 닦는다. 그는 네가 무엇을 정했는지 모른다. 그래서 더 떤다.
        effects: ["var o12_cellar_for_volk = true", "stress 6", "note 수탉 마루 밑 — 다섯. 아비를 위해 남겨 두었다"]

  # ───────────────────────── 첫 이름 (엘사 — 다섯 살 이전의 이름) ─────────────────────────
  - id: o12_first_name
    origin: varg_houndling
    trigger: {window: {from: "312-09-02 08:00", to: "312-09-30 22:00"}, with: npc_elsa, when: ["var o12_elsa_heard == true"]}
    stage:   # 엘사가 늑대굴 아이들의 열을 보러 언덕에 오른다 (5일) — 코의 사냥 길 위에서
      - {npc: npc_elsa, at: hungry_hill, from: "312-09-05 11:00", to: "312-09-05 17:00", doing: 남사면 바위틈에서 이끼를 뜯는다 — 늑대굴 아이들의 열을 보러 올라왔다}
    text: |
      쑥 냄새. 늪물, 말린 개구리, 끓인 버드나무 껍질.

      그리고 그 밑에 — 네가 모르는 냄새가 하나 있다. 아니다. 아는 냄새다. 어디서 맡았는지 모를 뿐이다. 연기에 그을린 움막의 짚, 젖, 그리고 쑥.

      노파 하나가 네 앞을 막아선다. 손톱 밑이 초록색이다. 목줄 찬 개 앞에 혼자 선 인간. 그녀가 손바닥을 눈썹 위에 얹고 네 눈을 들여다본다. 오래. 네 목줄의 놋쇠 패가 아니라, 눈을.

      "얘야." 갈라진 혀끝에서 'ㅅ' 소리가 바람처럼 샌다. "너는 개가 아니다. 개는 그렇게 숨을 참지 않아."

      그녀가 무언가를 부른다. 이름이다. 아주 낮게. 아무도 못 듣게.
    input: true_name
    input_label: 엘사가 부른 이름
    input_button: 그 이름을 받는다
    input_say: 다섯 살 이전의 이름 — 아무도 부르지 않던 이름이 들린다
    input_sibling: false
    after_input: |
      "{name}."

      네가 아는 소리가 아니다. 그런데 목덜미가 먼저 안다. 고사리 밑에서 누가 그 소리로 너를 불렀다. 숨 참아, {name}. 숨 참아.

      "내가 받아낸 아이다." 노파가 말한다. 엘사 — 강변 움막의 아이들을 받아낸 늪가의 산파. "열아홉 해 전, 강변 움막. 네 어미가 첫 울음 뒤에 그 이름을 네 귀에 속삭이는 걸 내가 들었지. 이름을 아는 자가 너를 가진다 — 그래서 아무도 몰랐다. 나 말고는."

      "다섯 살 가을이었다. 네 어미와 아비가 너를 업고 언덕으로 갔다. 늪을 건너 남쪽으로 가는 길의, 첫 매듭이었지." 그녀가 쓴 잎을 씹는다. "매듭은 언덕에서 끊겼다. 아이는 놓쳤다고 적혔다. 나는 열네 해 동안 놓친 줄 알았다."
    effects: ["var o12_name_heard = true", "learn fact_o12_first_knot", "rel npc_elsa trust 15", "rel npc_elsa like 10", "note 엘사가 부른 이름 — {name}. 다섯 살 이전의 이름. 무리는 너를 코라 부른다"]
    choices:
      - id: mother
        label: '"어미는."'
        minutes: 10
        text: |
          엘사가 잎을 뱉는다. "사슬 부두로 갔다는 말까지만 들었다. 바알카르. 그다음은 아무도 적지 않았다." 그녀가 손가락으로 땅에 금을 하나 긋는다. 그리고 지운다.

          "네 아비는 언덕에 남았다. 이름은 내가 솥에 대고 부른다. 해마다."
        effects: ["learn fact_o12_mother_sold", "stress 8", "note 엘사 — 어미는 바알카르 사슬 부두로. 아비는 그날 언덕에서"]
      - id: who_took
        label: '"그날 고사리를 걷은 게 — 아비였소."'
        minutes: 10
        text: |
          엘사가 대답하지 않는다. 대답하지 않는 것이 대답이다. 한참 뒤에야 말한다. "그 가을, 쇠송곳니를 박은 늑대가 언덕에 왔다. 남쪽에서 무리를 다 잃고 돌아온 늑대였다지."

          "놓쳤다고 적은 아이를, 그는 놓지 않았구나." 그녀가 네 목줄을 본다. 처음으로.
        effects: ["learn fact_o12_volk_kept_you", "var o12_knows_taken = true", "temper 충성 -6", "stress 10", "note 엘사 — 그날 고사리를 걷은 것은 볼크였다. 놓쳤다고 적고, 놓지 않았다"]
      # ── ◈ 기억 선택지 ──
      - id: mem_twice
        needs_memory: loop
        label: '◈ "알아요. 전에도 — 이렇게 불렀어요."'
        minutes: 5
        text: |
          엘사의 손이 멈춘다. 그녀가 네 턱을 들어 올린다. 늙은 손이 차다.

          "…같은 날을 두 번 산 얼굴이구나." 그녀는 놀라지 않는다. "돌아오는 이. 옛날엔 그렇게 불렀지." 그리고 아주 작게 웃는다. "그래서 개가 숨을 참았구나."
        effects: ["var echo_named = true", "rel npc_elsa trust 20", "note ◈ 엘사 — '같은 날을 두 번 산 얼굴'. 돌아오는 이"]
      - id: refuse_name
        label: '"그 이름은 버렸다. 나는 코다."'
        minutes: 5
        text: |
          "버려도 이름은 너를 안 버린다." 엘사가 일어선다. 무릎이 소리를 낸다. "개로 살든, 사람으로 죽든. 그 이름은 거기 있다. 네 어미가 거기 두었다."

          그녀는 돌아보지 않고 간다. 쑥 냄새가 오래 남는다.
        effects: ["var o12_name_refused = true", "temper 충성 3", "rel npc_elsa like -3", "note 엘사가 부른 이름을 버렸다 — '버려도 이름은 너를 안 버린다'"]
      - id: hold_name
        label: 그 이름을 입속으로 한 번 굴려 본다 — 아무 말도 하지 않는다
        minutes: 10
        text: |
          소리 내지 않는다. 혀끝으로만. {name}. 무리말에는 없는 소리다.

          엘사는 기다린다. 그러다 고개를 끄덕인다. "그래. 그렇게 갖고 있어라. 아무한테도 주지 말고." 그녀가 네 손바닥에 쓴 잎을 하나 쥐여 준다. "씹어라. 쓴 건 산 거다."
        effects: ["var o12_name_kept = true", "stress -6", "rel npc_elsa like 4", "note 이름을 아무에게도 주지 않았다 — 엘사의 쓴 잎"]

  # ───────────────────────── 열나흘째 아침 (볼크가 돌아온다) ─────────────────────────
  - id: o12_volk_morning
