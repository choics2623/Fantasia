    text: |
      나흘째 아침. 바람이 바뀐다.

      젖은 털, 오래된 피, 쇠송곳니의 녹. 냄새가 먼저 온다. 늘 그랬다. 너는 그 냄새를 다섯 살 때부터 맡았다.

      볼크가 거기 서 있다. 네 냄새가 끝나는 곳에. 약속한 날, 약속한 자리. 그는 서두르지 않는다. 한 걸음, 또 한 걸음, 네 쪽으로.

      "코." 그가 너를 마지막으로 그렇게 부른다. "도망쳐라. 도망치는 고기가 더 맛있다."
    choices:
      - id: into_water
        label: 물로 뛰어든다 — 물을 따라, 냄새가 끊기는 곳까지
        minutes: 30
        check: {skill: 은신, D: 50, helps: [swimmer, evade_track, shadow_step], warn: ["var o12_ran_marsh == true", "var o12_wounded_volk == true"]}
        success:
          text: |
            물이 목까지 차오른다. 너는 숨을 참는다. 아주 잘 참는다. 다섯 살 때처럼, 고사리 밑에서처럼.

            물가에서 볼크가 멈춘다. 오래 맡는다. 물은 냄새를 지운다 — 그가 가르친 것이다. "…킁." 그것이 다다. 서리 길의 여자 다음으로, 그가 놓친 두 번째다.
          effects: ["var o12_escaped_volk = true", "var o12_volk_prey = false", "var player_fugitive = true", "goto filth_marsh", "wanted 2 볼크의 목줄을 찬 채 달아난 코", "note 아비의 사냥에서 살아남았다 — 물이 냄새를 끊었다. 이제 도망친 개다"]
        failure:
          text: |
            물이 생각보다 얕다. 무릎, 허벅지 — 그리고 바닥. 등 뒤에서 물을 가르는 소리가 서두르지 않는다.

            쇠송곳니의 녹 냄새가 목덜미에 닿는다. 마지막으로 맡는 냄새가, 처음 맡았던 냄새와 같다.
          effects: ["die teeth npc_volk 냄새가 끝나는 곳에서 — 아비의 쇠송곳니에"]
      - id: beg_missed
        when: ["not var o12_child_missed == true"]
        label: '"놓친 아이 — 올해 것을 나에게 써 주시오."'
        minutes: 10
        check: {skill: 화술, D: 40, helps: [tongue, charm], warn: ["var o12_volk_respect == true", "var o12_volk_softened == true", "var o12_knows_taken == true"]}
        success:
          text: |
            볼크가 멈춘다. 쇠송곳니가 네 목에서 한 뼘. 그가 오래 너를 본다 — 고사리 밑에서 꺼낸 다섯 살짜리를 보는 것처럼.

            "…올해의 놓친 아이는 너다." 그가 돌아선다. "장부에 그렇게 적겠다. 다시 네 냄새를 맡으면, 그때는 놓치지 않는다. 나는 거짓말 안 한다."
          effects: ["var o12_missed_by_volk = true", "var o12_escaped_volk = true", "var o12_volk_prey = false", "var player_fugitive = true", "rel npc_volk like 10", "note 올해의 놓친 아이는 나다 — 다시 맡으면, 그때는 놓치지 않는다"]
        failure:
          text: |
            "올해 것은 이미 정했다." 볼크가 말한다. 거짓말이 아니다. 그는 거짓말을 하지 않는다.

            쇠송곳니가 내려온다. 고사리 줄기 사이로 보던 그 하늘이, 마지막으로 보인다.
          effects: ["die teeth npc_volk 냄새가 끝나는 곳에서 — 아비의 쇠송곳니에"]
      - id: blade
        label: 소매의 칼을 뽑는다 — 아비에게
        minutes: 10
        risk: 죽을 수 있다
        check: {skill: 싸움, D: 56, helps: [knife_hand, brawler, assassin, hidden_blade], warn: ["var o12_wounded_volk == true"]}
        success:
          text: |
            칼이 그의 목 밑에 들어간다 — 열네 해 동안 그가 가르친 자리에. 볼크가 무릎을 꿇는다. 쇠송곳니가 흙에 닿는다.

            "…좋은 코다." 그것이 마지막 말이다. 그의 코가 네 손목에 닿아 있다. 마지막까지, 냄새를 맡으면서.
          effects: ["slay npc_volk 20", "var o12_killed_volk = true", "var o12_escaped_volk = true", "var o12_volk_prey = false", "var player_fugitive = true", "temper 용기 10", "stress 20", "note 아비를 죽였다. 냄새가 끝나는 곳에서 — '좋은 코다'"]
        failure:
          text: |
            칼이 털에 미끄러진다. 열네 해 동안 그가 가르친 자리를, 그도 안다.

            쇠송곳니가 네 어깨를 문다. 놓지 않는다.
          effects: ["die teeth npc_volk 냄새가 끝나는 곳에서 — 아비의 쇠송곳니에"]
      - id: kneel_end
        label: 무릎을 꿇는다
        minutes: 5
        risk: 목줄로 돌아가는 길은 우리 수레다
        text: |
          너는 무릎을 꿇는다. 볼크가 네 목줄을 쥔다. 놋쇠 패가 그의 손바닥에서 운다.

          "꿇는 고기는 고기다." 그가 너를 끌고 송곳니 불로 간다. 우리 수레의 판자에는 새 못이 박혀 있다.
        effects: ["captured 냄새가 끝나는 곳에서 무릎을 꿇었다 — 코는 우리 수레에 들어갔다"]

  # ───────────────────────── 송곳니 불·언덕의 하루 (연출가 장면 — 이 출신에게만) ─────────────────────────
  - id: o12_dir_rug_share
    origin: varg_houndling
    trigger: {director: true, category: lack, at: hungry_hill__fang_fire, hours: ["19:00", "21:00"], chance: 0.3, when: ["var o12_hound == true", "alive npc_o12_rug", "not var player_fugitive == true"]}
    text: |
      고기가 불에서 내려온다. 산토끼 두 마리. 루그가 먼저 뜯는다 — 아비가 없는 불가에서 첫 이빨은 그의 것이다. 아비가 있는 밤에도, 아비 다음은 그의 것이다.

      그가 네 몫으로 남긴 것은 뼈 하나다. 살점이 없다. 루그가 그것을 네 발치에 던진다. "털 없는 건 이로 먹는 게 아니지. 손으로 먹지."
    choices:
      - id: take_meat
        label: 루그의 고기에 손을 뻗는다 — 무리의 순서를 깬다
        minutes: 10
        risk: 루그의 이빨
        check: {skill: 싸움, D: 26, helps: [brawler, menace, reflexes]}
        success:
          text: |
            네 손이 그의 고기를 낚아챈다. 루그의 이빨이 허공을 문다. 불가가 조용해진다. 너는 고기를 뜯는다 — 손으로, 그가 보는 앞에서.

            루그는 덤비지 않는다. 대신 무언가를 센다.
          effects: ["hunger -1", "rel npc_o12_rug trust -6", "rel npc_o12_rug like -6", "var o12_rug_marks += 1", "temper 용기 3"]
        failure:
          text: |
            루그의 이빨이 네 팔뚝에 박힌다. 놓지 않는다. 한참 뒤에야 놓는다 — 피를 핥으며. "순서는 순서다, 털 없는 거."
          effects: ["pain 15", "rel npc_o12_rug like 3"]
      - id: skali_half
        when: ["with npc_o12_skali"]
        label: 스칼리가 제 몫을 반으로 찢어 민다 — 받는다
        minutes: 10
        text: |
          스칼리가 루그를 보지 않고 제 고기를 반으로 찢는다. 네 쪽으로 민다. 루그가 으르렁거린다. 스칼리는 귀를 눕히지만, 고기는 거두지 않는다.
        effects: ["hunger -1", "bond npc_o12_skali 4", "rel npc_o12_rug like -3"]
      - id: take_bone
        label: 뼈를 줍는다
        minutes: 10
        text: |
          너는 뼈를 줍는다. 손으로. 바위에 쳐서 쪼갠다. 골수는 쓰고 비리다. 배는 차지 않는다. 루그가 웃는다.
        effects: ["hunger 1", "stress 4", "rel npc_o12_rug like 2"]

  - id: o12_dir_wyvern
    origin: varg_houndling
    trigger: {director: true, category: omen, at: hungry_hill, hours: ["07:00", "08:30"], chance: 0.3, when: ["var o12_hound == true", "with npc_gorm"]}
    text: |
      그림자가 먼저 온다. 비탈의 풀이 한쪽으로 눕고, 그 위로 잿빛 날개가 지나간다. 와이번 — 용의 대로를 지키는 늙은 짐승. 북사면을 한 바퀴 돌고, 남사면은 건너뛴다.

      바르그들이 바위 그늘에 엎드린다. 늑대도 하늘의 것은 무서워한다.
    choices:
      - id: read_sky
        label: 와이번이 왜 남사면을 건너뛰는지 맡는다
        minutes: 20
        check: {skill: 통찰, D: 22, helps: [hawk_eye, tracker, dog_nose]}
        success:
          text: |
            남사면 양 우리 쪽에 빈자리 하나. 양 한 마리가 없다. 피 냄새는 없다 — 와이번은 굶지 않았다. 양 한 마리면 다음 순찰 한 번, 남사면이 빈다. 바람이 그 셈을 네 코에 실어 온다.
          effects: ["learn fact_gb_gorm_patrol", "note 잿빛 와이번 — 양 한 마리면 다음 순찰 한 번 남사면이 빈다"]
        failure:
          text: |
            날개 바람이 냄새를 다 쓸어 간다. 남은 것은 젖은 풀 냄새뿐이다.
          effects: ["fear 1"]
      - id: lie_low
        label: 엎드린다 — 바르그에게 배운 대로, 그림자가 지나갈 때까지
        minutes: 20
        text: |
          너는 바위 그늘에 배를 붙인다. 그림자가 네 등을 지나간다. 차갑다. 그림자에도 온도가 있다는 걸, 너는 이 언덕에서 배웠다.
        effects: ["fear 1", "stress 2"]
