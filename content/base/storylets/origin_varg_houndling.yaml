# 바르그의 인간 사냥개 '코' (SCENARIOS O-12 · creation/origins_varg_houndling.yaml) — 회귀점의 대본 장면과 첫 열흘의 장면.
# origin: varg_houndling — 이 출신의 판에서만 열리고, 그 판에서만 stage(사람 세우기)가 걸린다. 문법은 greyford_opening.yaml 머리말과 같다.
#
#   o12_scent_open → o12_scent_ferns   회귀점 (낙엽월 1일 10시, 굶주린 언덕): 냄새 천 → 고사리 밑의 맨발 + 잔향의 각성
#   o12_volk_fire      「볼크의 불」    1일 저녁 송곳니 불 — 소나무의 금 열넷, 굴을 찾아라, 뼈패 심부름 (SCENARIOS volk_den)
#   o12_skali_moon     「스칼리의 달」  사냥이 두 번 냄새를 끝까지 따라간 밤 (o12_trail >= 2) — 가시덤불의 냄새, 무리 없는 늑대는 달에 미친다
#     └ o12_den_spear   늑대굴 가시덤불 앞 — 세 가지 질문 (시그리드)
#   o12_bram_spits     「브람의 침」    목줄을 차고 처음 마을에 들어설 때 — 수탉 문턱, 크릭, 마루 밑의 기침 냄새
#     └ o12_cellar      수탉 지하의 다섯 — 지킨다 / 판다 / 아비에게 남긴다
#   o12_first_name     「첫 이름」      엘사가 다섯 살 이전의 이름을 부른다 (input: true_name) — 5일 언덕, 또는 마을에서
#   o12_volk_morning   「열나흘째 아침」 볼크가 돌아와 '굴'을 묻는다 (낙엽월 14일)
#     └ o12_three_days  거짓말·정직한 거절 — "사흘이다"
#   o12_scent_ends     「냄새가 끝나는 곳」 나흘째 아침 (18일~), 사흘을 받은 코가 아직 회색여울에 있으면
#   o12_dir_*          송곳니 불·언덕의 하루 (연출가 장면 — 이 출신에게만: var o12_hound)
storylets:
  # ───────────────────────── 회귀점: 냄새 ─────────────────────────
  - id: o12_scent_open
    origin: varg_houndling
    trigger: {start: true}
    stage:   # 볼크는 정본대로 14일에 '도착'한다 — 이 시대에는 1일 아침 언덕을 지나며 코를 앞세우고, 2일 새벽 북쪽(까마귀 문)으로 떠난다
      - {npc: npc_volk, at: hungry_hill, from: "10:00", to: "13:00", doing: 사냥대 맨 뒤에서 바람을 맡는다 — 쇠송곳니에 빗물이 맺힌다}
      - {npc: npc_volk, at: hungry_hill__fang_fire, from: "13:00", to: "312-09-02 05:30", doing: 송곳니 불가에 앉아 있다 — 새벽이면 북쪽으로 떠난다}
      - {npc: npc_o12_skali, at: hungry_hill, from: "10:00", to: "12:30", doing: 사냥대 가운데서 코를 땅에 박는다}
      - {npc: npc_o12_rug, at: hungry_hill, from: "10:00", to: "12:30", doing: 털 없는 코의 백 걸음 뒤에서 킁킁거린다}
      - {npc: npc_grod, at: hungry_hill__three_pines, from: "09:00", to: "12:00", doing: 세 소나무 그루터기 속 매듭 끈을 뒤진다}
      - {npc: npc_sigrid, at: hungry_hill__wolf_den, from: "09:00", to: "16:00", doing: 개 짖는 소리에 창을 쥐고 굴 입구 가시덤불 뒤에 엎드려 있다}
    text: |
      젖은 양털 냄새. 그 밑에 식은 쥐뿌리 죽, 연기, 그리고 겁.

      냄새 천은 손바닥만 한 누더기다. 송곳니 회관의 냄새 단지에서 꺼내 온, 북쪽 사람들의 옷 조각. 너는 그것을 코에 한 번, 바람에 한 번 댄다. 겁은 냄새가 있다. 너는 그걸 다섯 살 때부터 배웠다.

      굶주린 언덕. 비가 사흘째다. 바위가 검게 젖었고, 냄새는 땅에 낮게 깔린다. 너는 맨 앞에서 걷는다. 볼크는 그것을 "인간이 인간을 찾는 법"이라고 불렀다. 인간의 코는 바르그의 코만 못하다. 그러나 인간은 인간이 어디에 숨는지 안다. 그래서 네가 선두다.

      백 걸음 뒤에 스칼리와 루그. 그 뒤에 볼크 — 네가 아비라 부르는, 왼쪽 송곳니가 쇠인 늙은 늑대. 목의 조합 목줄이 빗물을 먹어 무겁다. 입에 문 뼈 호루라기를 한 번 불면, 이 일은 끝난다.
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "젖은 양털 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 젖은 양털 냄새."}
    trace_lines:
      water: 빗물이 목으로 들어온다. 목 안에 물이 있다. 없다. 개울은 비탈 아래에 있다.
      teeth: 목덜미가 가렵다. 쇠 냄새가 난다 — 백 걸음 뒤에서.
      spear: 옆구리가 시리다. 가시덤불이다. 가시덤불일 것이다.
      blade: 목이 뜨겁다. 소매 속의 칼은 제자리에 있다.
      rope: 목줄이 조인다. 놋쇠 패가 쇄골에 닿는다. 원래 그 자리다.
      hunger: 배가 꼬인다. 아니다 — 송곳니 불에는 고기가 있다.
      fall: 발밑의 바위가 기운다. 기울지 않는다. 비에 젖었을 뿐이다.
    return_ink: |
      ┊ 그 다음엔 고사리 밑으로 작은 맨발이 삐져나왔다. 그리고 루그가 물었다. "코, 뭐 있냐?"
    next: o12_scent_ferns

  - id: o12_scent_ferns
    origin: varg_houndling
    text: |
      바위 틈을 지나며 냄새가 짙어진다. 여자 하나, 아이 하나. 오래 걷지 않았다 — 발 냄새가 아직 따뜻하다.

      바위 아래 움푹한 곳. 마른 고사리 더미가 빗물에 눌려 있다. 그 밑으로 삐져나온 작은 맨발 하나. 발가락이 꼼지락거린다. 그리고 멈춘다. 아이는 숨을 참고 있다. 아주 잘 참고 있다.

      너도 어릴 때 그렇게 숨을 참았다. 그 기억이 어디서 왔는지, 너는 모른다.

      등 뒤에서 루그가 코를 킁킁거린다. 젖은 털 냄새가 가까워진다. "코, 뭐 있냐?"

      숨을 참는 작은 발. 너도 그렇게 숨을 참았다 — 이 몸이 다섯 살이던 때. 그리고 그보다 훨씬 전, 다른 아이가 다른 고사리 밑에서. 돌아오는 법을 알기도 전에 사냥에 끊긴, 이름 없는 아이. 그때 그 아이를 찾아낸 것도 바르그였다.

      고사리 줄기 사이로 잿빛 하늘이 보인다. 그 하늘을 가리는 늑대의 턱이 — 아래에서 위로. 너는 그쪽에 누워 본 적이 없다. 그런데 보인다. 네 안의 무언가는 사냥당하는 쪽이 무엇인지 아주 오래 배웠다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["var o12_ferns_known = true", "note 고사리 밑의 맨발 — 여자 하나, 아이 하나. 비. 루그가 백 걸음 뒤에 있다"]
    choices:
      - id: whistle
        label: 호루라기를 분다
        minutes: 30
        text: |
          뼈 호루라기가 빗소리를 찢는다. 루그가 먼저 온다. 고사리가 걷히고, 여자가 아이를 끌어안은 채 일어선다 — 북쪽 말로 무언가를 외친다. 루그의 이빨이 그녀의 팔뚝을 문다. 놓지 않는다.

          볼크가 서두르지 않고 걸어와 네 목덜미에 코를 댄다. "킁. 좋은 코다." 그가 아이를 내려다본다. 진흙 속에서 작은 맨발이 오므라든다.

          스물넷, 스물다섯. 너는 센다. 세는 것도 일이다. 그런데 가슴 안쪽에서 무언가가 그 수를 받지 않는다. 뱉어 낸다. 이빨이 박힌 자리처럼 오래 욱신거린다.
        effects: ["var o12_ferns_caged = true", "var o12_caught += 2", "var fugitives_caught += 2", "var sigrid_group -= 2", "var o12_foot_dream = true", "temper 충성 10", "temper 자비 -10", "stress 30", "rel npc_volk trust 8", "rel npc_o12_rug like 4", "memory npc_volk 쓸모 있음 코가 고사리 밑의 둘을 찾았다", "deed betray", "note 고사리 밑의 여자와 아이 — 스물넷째, 스물다섯째. 송곳니 불의 우리 수레로"]
      - id: misdirect
        label: '"아무것도 없다." — 냄새를 다른 바위로 끌고 간다'
        minutes: 40
        check: {skill: 기만, D: 26, helps: [deceit, actor, false_face]}
        success:
          text: |
            너는 고개를 젓는다. "아무것도 없다." 그리고 동쪽 바위로 코를 돌린다. 젖은 이끼에 무릎을 대고 오래 맡는 시늉을 한다. 루그가 따라온다. 의심하는 걸음이지만, 따라온다.

            사냥대가 동쪽 비탈로 내려간다. 고사리 밑의 둘은 살아 있다 — 아직은. 맨 뒤의 볼크가 한 번 고사리 쪽을 돌아본다. 아무 말도 하지 않는다.
          effects: ["var o12_ferns_saved = true", "var o12_elsa_heard = true", "var o12_rug_marks += 1", "temper 자비 5", "deed rescue unseen", "note 고사리 밑의 둘 — 냄새를 동쪽으로 돌렸다. 루그의 걸음이 의심했다"]
        failure:
          text: |
            네 목소리가 반 박자 늦다. 루그의 코가 너를 지나쳐 고사리 더미로 간다. 그가 앞발로 고사리를 걷는다. 여자가 아이를 끌어안고 일어선다.

            루그가 너를 돌아본다. 이빨이 다 보이게 웃는다. "털 없는 코가 냄새를 놓쳤네. 아니면 — 안 놓쳤나?" 뒤에서 볼크의 코가 킁, 한 번 운다.
          effects: ["var o12_ferns_caged = true", "var o12_caught += 2", "var fugitives_caught += 2", "var sigrid_group -= 2", "var o12_rug_marks += 2", "rel npc_o12_rug trust -10", "rel npc_volk trust -5", "memory npc_o12_rug 거짓말쟁이 털 없는 코가 고사리 더미를 지나치려 했다", "note 고사리 밑의 둘 — 루그가 찾았다. 루그는 내가 지나치려 한 것을 안다"]
      - id: whisper
        label: 루그를 서쪽 능선으로 보내고 — 혼자 남아 고사리 더미에 속삭인다
        minutes: 15
        check: {skill: 은신, D: 30, helps: [shadow_step, beast_friend]}
        success:
          text: |
            너는 루그에게 서쪽 능선을 턱짓한다 — 냄새가 그쪽이라고. 루그가 간다. 너는 고사리 앞에 쪼그려 앉는다. 인간의 말은 입에 잘 붙지 않는다. "해… 지면. 서쪽. 습지."

            고사리가 아주 조금 갈라진다. 여자의 눈. 그 눈이 네 목줄의 놋쇠 패에 멈춘다. 조합의 표. 얼굴이 하얘진다 — 늑대를 봤을 때보다 더. 그녀가 아이의 귀에 대고 숨처럼 말한다. "리브. 숨 쉬어. 천천히."
          effects: ["var o12_ferns_saved = true", "var o12_ferns_warned = true", "var o12_elsa_heard = true", "learn fact_o12_child_name", "temper 자비 6", "temper 용기 3", "deed rescue unseen", "note 고사리 밑의 여자에게 — 해 지면 서쪽 습지로. 아이 이름은 리브. 여자는 내 목줄을 보았다"]
        failure:
          text: |
            고사리 앞에 쪼그려 앉는 순간 아이가 숨을 터뜨린다 — 짧은 딸꾹질 같은 소리. 서쪽 능선에서 루그의 귀가 돌아선다.

            루그가 돌아왔을 때, 너는 아직 고사리 앞에 있다. 입을 반쯤 벌린 채. 루그가 천천히 고사리를 걷는다. 그리고 너를 본다. 오래.
          effects: ["var o12_ferns_caged = true", "var o12_caught += 2", "var fugitives_caught += 2", "var sigrid_group -= 2", "var o12_rug_marks += 2", "rel npc_volk trust -8", "memory npc_o12_rug 위험함 털 없는 코가 고사리 더미에 대고 사람 말을 했다", "note 고사리 앞에서 루그에게 들켰다. 둘은 우리 수레로 — 루그는 내가 사람 말을 한 것을 들었다"]
      - id: tell_skali
        label: 스칼리에게만 — 무리말로 털어놓는다
        minutes: 10
        check: {skill: 화술, D: 12, helps: [tongue, beast_friend]}
        success:
          text: |
            너는 스칼리의 귀에 무리말로 짧게 짖는다. 아이. 고사리. 숨.

            스칼리가 한참 너를 본다. 젖은 털 끝에서 빗물이 떨어진다. 그리고 고개를 돌려, 루그가 들으라고 말한다. "나는 아무것도 못 맡았어. 비 때문이야." 그가 앞장서 북쪽 바위로 간다. 루그가 투덜거리며 따라간다.

            형제의 비밀이다. 무리말에는 '숨겨 준다'는 낱말이 없다. 스칼리는 그 낱말 없이 그것을 했다.
          effects: ["var o12_ferns_saved = true", "var o12_skali_secret = true", "bond npc_o12_skali 10", "rel npc_o12_skali trust 10", "temper 자비 4", "deed rescue unseen", "note 스칼리와의 비밀 — 고사리 밑의 둘. 스칼리가 '아무것도 못 맡았다'고 했다"]
        failure:
          text: |
            스칼리의 귀가 뒤로 젖혀진다. 그가 너와 고사리 더미를 번갈아 본다. 무리말에는 '숨겨 준다'는 낱말이 없다. 그 낱말이 없으면, 그것은 생각나지 않는다.

            "아비." 스칼리가 뒤를 돌아본다. "코가 이상해." 볼크가 걸어온다. 그의 코가 고사리 더미에 닿는다. 그리고 너에게 닿는다. 오래.
          effects: ["var o12_ferns_caged = true", "var o12_caught += 2", "var fugitives_caught += 2", "var sigrid_group -= 2", "var o12_volk_doubt = true", "rel npc_volk trust -10", "rel npc_o12_skali trust -4", "memory npc_volk 위험함 코가 고사리 밑의 고기를 감추려 했다", "note 스칼리가 아비를 불렀다. 볼크가 고사리 밑의 둘을 찾았다 — 그리고 내 냄새를 오래 맡았다"]
      - id: lose_cloth
        label: 냄새 천을 바람에 '잃어버린다'
        minutes: 20
        check: {skill: 손재주, D: 15, helps: [pickpocket, lock_hands]}
        success:
          text: |
            손가락을 아주 조금 편다. 바람이 냄새 천을 채 간다 — 비탈 아래, 가시나무 너머, 개울 쪽으로. 너는 소리를 지르며 그쪽으로 뛴다. 사냥대가 너를 따라 개울로 내려간다. 천은 물에 젖어, 이제 아무 냄새도 나지 않는다.

            볼크의 손등이 네 뺨을 친다. 한 번. "코가 손을 놓치면, 코가 아니다." 루그는 말이 없다. 네 손을 오래 본다.
          effects: ["var o12_ferns_saved = true", "var o12_cloth_lost = true", "pain 6", "rel npc_volk trust -6", "var o12_rug_marks += 1", "deed rescue unseen", "note 냄새 천을 바람에 놓쳤다 — 볼크의 손등. 루그가 내 손을 보았다"]
        failure:
          text: |
            천이 손가락 사이에서 미끄러진다 — 그런데 루그가 공중에서 그것을 이빨로 낚아챈다. 웃으며 네 코앞에 흔든다. "놓쳤네, 코."

            루그는 천을 제 코에 대고 곧장 고사리 더미로 간다. 바람은 그의 편이다.
          effects: ["var o12_ferns_caged = true", "var o12_caught += 2", "var fugitives_caught += 2", "var sigrid_group -= 2", "var o12_rug_marks += 1", "rel npc_o12_rug like 3", "note 냄새 천을 놓치려다 루그에게 빼앗겼다. 루그가 고사리 밑의 둘을 찾았다"]
      - id: trace_back
        label: 고사리 밑의 발자국이 어디서 왔는지 — 냄새의 길을 외우고, 사냥대는 북쪽으로 돌린다
        minutes: 45
        check: {skill: 통찰, D: 30, helps: [tracker, memory_palace, dog_nose]}
        success:
          text: |
