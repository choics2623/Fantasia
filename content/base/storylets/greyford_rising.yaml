# 찬가 4단계 「여울강이 붉어지는 날」 (SCENARIOS §3.4) — 준비 지표 여섯 중 넷 이상이면 봉기를 일으킬 수 있다.
# 지표: 브란의 창(창날 마흔) · 군나르의 훈련 · 시그리드의 북방인(영역) · 성채 안의 손(사라·오웬) · 마르타의 전향 · 즈닉의 처리
storylets:
  - id: bran_spears
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: gf_smithy, with: npc_bran, when: ["pknows fact_gf_bran_spearheads", "rel_trust npc_bran >= 30", "var bran_spears != true"]}
    text: |
      브란이 풀무질을 멈춘다. 숯 더미 밑에서 기름천에 싼 묶음을 꺼낸다. 창날. 자루 없는 창날이 흙빛으로 녹슬어 있다 — 녹슨 척하고 있다.

      "마흔. 자루는 숲에 있다. 쓸 사람이 있으면 쓰고, 없으면 녹는다."
    choices:
      - id: take
        label: '"쓸 사람을 데려오겠습니다."'
        text: "브란이 묶음을 다시 숯 밑에 넣는다. \"데려와. 그 전엔 여기 없는 거다.\""
        effects: ["var bran_spears = true", "note 봉기 — 브란의 창날 마흔 (숯 더미 밑)", "rel npc_bran trust 5"]
  - id: gunnar_trains
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: gf_stable, with: npc_gunnar, when: ["rel_trust npc_gunnar >= 30", "var gunnar_trains != true"]}
    text: |
      군나르가 말 등을 빗기다 말고 빗을 네게 던진다. 받는다. "손은 빠르군. 다리는?"

      "아흔아홉 번 이겼다. 백 번째는 안 했다. 왜 안 했는지 아나?" 대답을 기다리지 않는다. "이기는 법을 가르치는 건 쉽다. 오래 서 있는 법이 어렵지."
    choices:
      - id: ask
        label: '"사람들을 가르쳐 주십시오. 밤에, 숲에서."'
        text: "군나르가 한참 빗질만 한다. \"서른 명. 그 이상은 안 된다. 그 이상이면 냄새가 난다.\""
        effects: ["var gunnar_trains = true", "note 봉기 — 군나르가 밤 숲에서 서른을 가르친다", "skill_gain 싸움 2"]
  - id: znik_leash
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: gf_whip_square, with: npc_znik, night: true, when: ["var znik_submitted != true", "alive npc_znik"]}
    text: |
      즈닉이 초소 그늘에서 채찍 끝을 손가락에 감고 있다. 혼자다. 네가 다가오자 노란 눈이 가늘어진다.
    choices:
      - id: anne
        label: '"앤. 오물 습지에 묻힌 여자 이름이 앤이었지."'
        needs_fact: fact_gf_znik_anne
        check: {skill: 위압, D: 40, warn: ["pknows fact_gf_znik_wet_himself"]}
        success:
          text: '채찍이 손가락에서 풀린다. 즈닉이 한참 아무 말도 하지 않는다. "…원하는 게 뭐야." 그날부터 점호 때 즈닉의 눈은 몇몇 얼굴을 건너뛴다.'
          effects: ["var znik_submitted = true", "note 봉기 — 즈닉이 고개를 숙였다 (앤의 이름)"]
        failure:
          text: '채찍이 네 얼굴을 친다. "그 이름을 또 입에 올리면 혀를 뽑는다."'
          effects: ["pain 15", "rel npc_znik like -20"]
      - id: hagen
        label: '"하겐에게 사람을 팔지. 한 명에 은화 두 닢. 고드릭이 알면?"'
        needs_fact: fact_gf_znik_sells_to_hagen
        check: {skill: 화술, D: 45}
        success:
          text: '즈닉의 꼬리가 굳는다. "…증거는." 너는 대답하지 않는다. 대답하지 않는 게 대답이다.'
          effects: ["var znik_submitted = true", "note 봉기 — 즈닉이 고개를 숙였다 (하겐과의 거래)"]
        failure:
          text: '즈닉이 웃는다. "고드릭은 내 말을 믿어. 네 말은 아니지." 그날 밤 네 이름이 하겐에게 팔린다.'
          effects: ["wanted 2 즈닉이 하겐에게 네 이름을 팔았다", "rel npc_znik like -15"]
      - id: leave
        label: 지나간다
        text: "즈닉의 시선이 네 등에 오래 붙어 있다."
        effects: []
  - id: rising_call
    dynamic: true
    severity: 5
    text: |
      채찍 기둥 광장. 자정. 횃불 대신 숯불 한 줌. 얼굴들이 모인다 — {rising_who}.

      준비된 것: {rising_ready}.

      누군가 네 이름을 묻는다. 셋째 말고.
    choices:
      - id: rise
        label: '"오늘 밤이다."'
        check: {skill: 위압, D: 62, per_ready: 11}
        success:
          text: |
            성채 문이 안에서 열린다. 사라가 빗장을 들고 서 있다. 숲에서 창 자루를 든 서른이 내려온다. 즈닉의 초소에 불이 붙는다.

            새벽이 올 때 레이번 성채의 깃발은 내려가 있다. 아무도 다음 깃발을 가져오지 않았다. 마을 사람들이 광장에 서서 그 빈 장대를 본다. 누군가 울기 시작한다. 웃는 것인지도 모른다.
          effects: ["rising success"]
        failure:
          text: |
            성채 문은 열리지 않는다. 누군가 먼저 말했다. 용인 경비가 광장 네 귀퉁이에서 동시에 횃불을 든다.

            그 뒤의 일은 길게 쓰지 않는다. 붉은 길 옆에 새 길이 났다.
          effects: ["rising fail"]
      - id: wait
        label: '"아직이다."'
        text: "숯불이 꺼진다. 얼굴들이 흩어진다. 몇은 다시 오지 않을 것이다."
        effects: []
  - id: rising_siege
    dynamic: true
    severity: 5
    text: |
      {rising_siege_text}
    choices:
      - id: hold
        label: 성벽에 선다 — 창을 든 사람들과
        check: {skill: 싸움, D: 60, per_ready: 4}
        success:
          text: "진압군이 물러난다. 이번에는. 성벽 아래에 창 자루가 쌓인다. 내일 다시 깎아야 한다."
          effects: ["rising held"]
        failure:
          text: "성벽이 무너진 곳으로 비늘이 들어온다."
          effects: ["rising fall"]
      - id: parley
        label: 백기를 들고 협상하러 나간다
        check: {skill: 화술, D: 55}
        success:
          text: "진압군 장교가 웃는다. 그러나 열흘을 준다. 열흘이면 아이들을 언덕으로 보낼 수 있다."
          effects: ["rising truce"]
        failure:
          text: "백기는 창끝에서 찢어진다."
          effects: ["rising fall"]
  - id: kaspar_warning
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: "@crow_gate", with: npc_kaspar, when: ["pknows fact_dk_aurax_kaspar_contract", "alive npc_kaspar", "var kaspar_warned != true"]}
    text: |
      사령관 카스파르 반비늘. 반쪽 얼굴의 비늘이 등잔 빛에 젖어 있다. 인간 짐꾼이 사령관 앞에 선 것을 보고 부관이 칼자루에 손을 얹는다.

      카스파르가 손을 든다. "말해 봐라. 짐꾼이 사령관 앞에 설 때는 목숨보다 무거운 말을 들고 온다."
    choices:
      - id: warn
        label: '"아우락스가 볼크에게 당신을 사겠다고 했습니다."'
        check: {skill: 화술, D: 45}
        success:
          text: "카스파르의 눈이 반쪽만 웃는다. \"알고 있었다. 짐꾼이 아는 줄은 몰랐지.\" 그는 부관에게 이름 하나를 받아 적게 한다 — 네 진짜 이름은 아니다. \"이 이름을 기억하마.\""
          effects: ["var kaspar_warned = true", "var faction_kaspar += 15", "rel npc_kaspar trust 20", "note 카스파르에게 아우락스의 암살 의뢰를 알렸다"]
        failure:
          text: "부관이 너를 끌어낸다. 카스파르는 말리지 않는다. 그래도 그날 밤 사령관실의 불은 늦게까지 켜져 있다."
          effects: ["var kaspar_warned = true", "var faction_kaspar += 5", "pain 10"]
      - id: offer
        label: '"인간 의용군이 있습니다. 언덕에."'
        when: ["domain_any"]
        text: "카스파르가 처음으로 의자에서 몸을 일으킨다. \"몇이냐.\" 숫자를 말하자 그는 지도 위에 손가락을 올린다. 굶주린 언덕."
        effects: ["var faction_kaspar += 20", "rel npc_kaspar trust 15", "var kaspar_volunteers = true"]
  - id: kaspar_charter
    trigger: {window: {from: "313-04-01 06:00", to: "330-12-30 00:00"}, at: "@crow_gate", when: ["var kaspar_throne == true", "rel_trust npc_kaspar >= 30", "var kaspar_charter != true"]}
    severity: 3
    text: |
      반쪽 비늘의 인장. 카스파르가 양피지 한 장을 네 앞에 민다. 용언과 인간의 글자가 나란히 적혀 있다 — 인간의 글자로 적힌 칙허는 이 대륙에서 처음이다.

      {read|인간 자치령. 굶주린 언덕 남사면에서 여울강까지. 이 땅의 인간은 이 땅의 법으로 산다.}

      "인간 자치령. 땅은 작다. 지킬 병력은 너희가 대라. 내가 지는 날, 이건 휴지다."
    choices:
      - id: accept
        label: 칙허를 받는다
        text: "양피지가 따뜻하다. 인장의 밀랍이 아직 마르지 않았다. 네가 사는 땅에 처음으로 이름이 붙는다 — 주인의 이름이 아니라."
        effects: ["var kaspar_charter = true", "rising charter", "note 카스파르의 칙허 — 인간 자치령. 그가 지는 날 휴지가 된다"]
