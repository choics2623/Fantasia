  # ───────────────────────── 정지 (어긋남이 셋) ─────────────────────────
  - id: o3_stopped
    origin: eldar_gardener
    trigger: {window: {from: "312-09-01 06:00", to: "312-09-30 23:00"}, at: "@eternal_garden", when: ["var o3_offbeat >= 3", "var o3_stops == 0", "not var o3_escaped == true", "alive npc_erlan"]}
    text: |
      수호자 에를란이 네 앞에 선다. 손가락 하나를 든다 — 시간을 가늠하듯. "움직임이 세 번 어긋났소." 평탄한 목소리. 판결이 아니라 셈이다.

      차가운 손바닥이 네 이마에 닿는다.

      세상이 멎는다. 숨이 멎은 것이 아니다 — 숨과 숨 사이가 끝없이 길어진다. 눈을 감을 수 없다. 깜박일 수도 없다. 너는 이슬 우리 마당 기둥 곁에 세워진다. 본보기로. 정원지기들이 너를 보지 않으려고 고개를 돌리며 지나간다.

      그리고 위쪽 테라스에서 낭송이 흘러내려 온다. 엘다르의 낭송. 멎은 몸 안에서, 깨어 있는 귀가 그것을 한 글자도 놓치지 않는다. 놓칠 수가 없다. 시간이 너에게만 느리다.
    effects: ["goto eg_dew_pens"]
    choices:
      - id: endure
        label: 멎은 채로 — 낭송을 듣는다 ▸
        minutes: 360
        text: |
          수호자의 손가락이 내려온 것은 한참 뒤다. 무릎이 꺾이고, 이슬 우리의 흙바닥이 뺨에 닿는다. 숨이 한꺼번에 몰려온다.

          머릿속에 엘다르의 낭송이 한 줄도 빠짐없이 남아 있다. 반쯤만 알던 말인데 — 멎어 있던 동안 몇 번이고 되풀이해서, 이제 그 줄들의 모양을 안다. 에를란이 너를 내려다본다. 오래. 정지를 건 뒤에 늘 그러듯이. 그리고 아무 말 없이 돌아선다.
        effects: ["var o3_offbeat = 0", "var o3_stops += 1", "var o3_elvish += 5", "learn fact_p2sv_stopped_memorize", "stress 12", "fatigue 20", "memory npc_erlan 이상함 정지된 정원지기의 눈이 낭송을 따라 움직였다", "note 정지 — 한 번. 두 번이면 장부의 '이송' 칸이다"]

  - id: o3_stopped_ledger
    origin: eldar_gardener
    trigger: {window: {from: "312-09-01 06:00", to: "312-09-30 23:00"}, at: "@eternal_garden", when: ["var o3_offbeat >= 3", "var o3_stops >= 1", "not var o3_escaped == true", "alive npc_erlan"]}
    text: |
      에를란의 손가락. 이번에는 시간을 가늠하지 않는다 — 이미 셈이 끝났다는 듯이. "두 번째요."

      차가운 손바닥. 세상이 멎는다. 이슬 우리 마당 기둥 곁.

      멎은 눈앞으로 관리장 미리엘이 지나간다. 장부를 펼친 채로. 그녀는 너를 보지 않는다 — 네 어깨 너머의 한 점을 본다. 장부를 넘기는 데 소리가 나지 않는다. 그녀의 손가락이 한 줄 위에서 멈추고, 종이 모서리를 한 번 접는다. 서명할 자리에서 그녀가 늘 하는 일이다.
    effects: ["goto eg_dew_pens"]
    choices:
      - id: endure
        label: 멎은 채로 — 소리 없는 장부를 듣는다 ▸
        minutes: 360
        text: |
          풀려났을 때, 마당의 그림자가 반대쪽으로 누워 있다. 기둥에 기댄 채 숨을 고른다. 옆을 지나던 로렌이 걸음을 늦추지 않고 말한다. 입술만으로.

          "옮겨졌다. 네 번호."

          관리장의 장부에서 네 번호가 다른 칸으로 옮겨졌다. 서명은 없다. 서명이 없어도 장부는 한 번도 틀린 적이 없다.
        effects: ["var o3_offbeat = 0", "var o3_stops += 1", "var o3_elvish += 3", "var o3_transfer_due = true", "learn fact_p2sv_stopped_memorize", "stress 18", "fatigue 20", "note 정지 — 두 번. 미리엘의 장부, '이송' 칸"]

  # ───────────────────────── 이송 (장부에 오르면) ─────────────────────────
  - id: o3_transfer
    origin: eldar_gardener
    trigger: {window: {from: "312-09-02 18:00", to: "312-09-30 21:00"}, at: eg_dew_pens, with: npc_fern, when: ["var o3_transfer_due == true", "not var o3_escaped == true"]}
    text: |
      저녁 점호. 흰 울타리의 실반 — 이끼손 페른 — 이 이슬 우리 마당에서 머릿수를 센다. 입술 안에서. 오늘은 한 번 더 센다.

      그가 소매에서 쪽지를 꺼낸다. 글이 아니라 홈이다 — 손톱으로 낸 홈 몇 개. 관리장의 장부에서 옮겨 온 번호다. 그가 네 앞에서 멈춘다. 다섯 걸음이 아니라 한 걸음 앞에서.

      "다시 말해 봐." 대답할 사람이 없는데 그가 말한다. 그리고 스스로 대답한다. 네 번호를. 두 번.

      "새벽 노래 뒤. 안개 길." 페른이 쪽지를 접는다. "이송이다."

      그는 다음 사람에게 간다. 문을 닫을 때처럼, 소리 없이.
    choices:
      - id: low_door
        needs_fact: fact_p2sv_waterway_three_elders
        when: ["has 은핀"]
        label: 등 끄기 종 뒤 — 41단 맨 아래, 아래 문으로 간다
        minutes: 240
        risk: 들키면 이송이 아니라 잊힘이다
        check: {skill: 손재주, D: 32, helps: [lock_hands, shadow_step, swimmer], warn: ["var o3_bell_muffled == true", "var o3_nina_helps == true"]}
        success:
          text: |
            등 끄기 종. 흰 등이 하나씩 꺼진다. 너는 테라스 아래 단을 맨발로 내려간다. 마흔한 단. 맨 아래, 물소리.

            쇠창살 앞에서 — 니나의 은 핀을 발목 고리의 은못 밑에 넣는다. 아래에서 위로. 못이 한 번, 비명 같은 소리를 내고 빠진다. 방울을 품에 넣는다. 버리면 누가 줍고, 주우면 센다.

            쇠창살 고리는 안쪽에서 풀린다. 물이 차다. 어둠을 기어간다. 그리고 — 경계. 등 뒤의 무언가가 너를 붙잡는다. 돌아서고 싶다. 흰 빵이, 꿀이, 늘 같은 잎의 이슬이 등 뒤에서 너를 부른다. 너는 기어간다.

            배수구 끝에서 바람이 분다. 차다. 처음 맡는 냄새 — 젖은 낙엽. 머리 위에서 잎 하나가 진다. 붉다. 열두 해 만에, 처음으로 계절이 바뀐다.
          effects: ["var o3_escaped = true", "var player_fugitive = true", "var o3_bell_cut = true", "var o3_bell_muffled = false", "wanted 2 이송을 앞둔 정원지기가 사라졌다", "temper 용기 8", "goto eternal_garden__silver_forest", "note 아래 문을 지났다 — 은목 숲, 정원 경계 밖. 방울은 끊어 품에 넣었다", "note 정원 길은 엘다르 동행 없이는 이어지지 않는다 — 은잎문까지 마흔여섯 시간"]
        failure:
          text: |
            은못이 빠지지 않는다. 핀이 미끄러지고, 방울이 운다 — 수로 안에서. 물 위에서 소리는 열 배가 된다.

            쇠창살 너머에서 흰 등이 다가온다. 수호자의 손가락이 올라간다. 이번에는 "어긋났소"라고 말하지 않는다. 이것은 어긋남이 아니다.

            은잎문 아치 앞에서, 언젠가 누군가 네 아래 이름을 낭송할 것이다. 네가 그것을 마지막에 속삭인다면.
          effects: ["captured 아래 문의 쇠창살 앞에서 붙잡혔다 — 달아나려던 정원지기로, 잊힘을 기다린다"]
      - id: fern_gate
        label: '페른을 따라가 낮게 — "북문. 소리 없이 닫히는 문."'
        minutes: 180
        risk: 실반이 고하면 끝이다
        check: {skill: 화술, D: 36, helps: [tongue, charm], warn: ["pknows fact_sv_fern_north_gate_key", "pknows fact_sv_fern_seed_bribe"]}
        success:
          text: |
            페른이 멈춘다. 돌아보지 않는다. "…다시 말해 봐."

            너는 다시 말한다. 그는 그것을 두 번 외운다 — 입술 안에서. 그리고 허리춤을 한 번 친다. 열쇠가 있는 자리다.

            그날 밤, 흰 울타리 북문이 열리는 소리는 나지 않는다. 문 밖은 마른 숲이다. 페른이 문짝을 한 손으로 받쳐 소리 없이 닫는다. 문틈으로 그의 목소리. "두 번 외울 사람이 하나 줄었다고 치겠다."

            숲의 바람이 차다. 젖은 낙엽 냄새. 처음 맡는 냄새다. 발목에서 방울이 운다. 이제 그 소리를 세는 사람이 없다.
          effects: ["var o3_escaped = true", "var player_fugitive = true", "wanted 2 이송을 앞둔 정원지기가 사라졌다", "rel npc_fern trust 10", "memory npc_fern 다정함 방울을 단 정원지기를 북문으로 내보냈다 — 두 번 외운다", "goto eternal_garden__silver_forest", "note 북문 — 페른이 소리 없이 열었다. 방울은 아직 발목에 있다", "temper 용기 5"]
        failure:
          text: |
            페른이 다섯 걸음을 정확히 재고 선다. "다섯 걸음." 그가 말한다. "한 걸음 더 오면 — 네 손이다."

            그는 고하지 않는다. 고할 필요가 없다. 쪽지는 이미 장부에서 왔다. 새벽 노래가 끝나자 안개 길이 너를 기다리고 있다.
          effects: ["captured 이송 — 북문은 열리지 않았다. 새벽 노래 뒤 안개 길로 끌려갔다"]
      - id: go_quiet
        label: 고개를 숙인다 — 정원지기는 묻지 않는다
        text: |
          그날 밤 너는 방울을 손바닥으로 감싸지 않는다. 울게 둔다. 니나의 자리 쪽에서 누군가 몸을 뒤척인다.

          새벽 노래가 끝나자 안개 길. 젊은 엘다르와 함께 걸으면 짧다. 유리 온실들. 흰 침상. 정원사가 네 어깨의 먼지를 털고, 햇빛 쪽으로 눕힌다.

          "여섯 번이에요." 그가 말한다. 다정하게. "아프지 않아요. 자라는 건 원래 조금 아프지만."

          수정 기둥들이 낮게 운다. 그물은 아직 성기다 — 너는 그것을 모르고, 그도 모른다.
        effects: ["captured 이송 — 안쪽 정원의 흰 침상에 눕혀졌다. 정원사의 '여섯 번의 수업'이 시작되었다"]

  # ───────────────────────── 영원 정원의 소품 (연출가 — 이 고장에 있는 누구에게나) ─────────────────────────
  - id: o3_dir_wrong_note
    trigger: {director: true, category: bond, at: [eg_dew_hearth, eg_dew_mess], hours: ["19:00", "21:00"], chance: 0.3, when: ["alive npc_loren", "alive npc_ada"]}
    text: |
      식당 아궁이 곁. 에이다 할멈이 국자로 솥 가장자리를 두 번 친다. 아무 일도 아닌 소리다. 아무 일도 아닌 것처럼, 로렌이 음 하나를 낮게 낸다. 가사는 없다. 높이만.

      아이 둘이 그 음을 따라 한다. 일부러 조금 틀리게. 다음 음. 그 다음 음. 마지막 음 앞에서 — 로렌의 숨이 멎는다. 아궁이의 불만 소리를 낸다. 아무도 마저 부르지 않는다.
    choices:
      - id: hum
        label: 그 음을 따라 낸다 — 일부러 반 음 틀리게
        text: |
          로렌이 너를 본다. 엘다르가 없는 자리에서, 처음으로 오래. 그리고 아주 작게 고개를 끄덕인다. 틀리게 부르는 법을 아는 사람에게 하는 인사다.
        effects: ["rel npc_loren like 4", "rel npc_loren trust 4", "rel npc_ada like 2", "stress -4"]
      - id: listen
        label: 아궁이 불만 본다
        text: |
          불이 솥 바닥을 핥는다. 멎은 숨이 다시 돌아오기까지, 아무도 움직이지 않는다.
        effects: ["stress -2"]

  - id: o3_dir_pavilion_clap
    trigger: {director: true, category: omen, at: eg_terraces_upper, hours: ["13:30", "17:30"], chance: 0.25, when: ["alive npc_liandel"]}
    text: |
      위쪽 단, 아이의 정자 쪽에서 손뼉 소리가 난다. 작은 손. 박자가 있다 — 엘다르의 박자가 아니다. 이슬 우리 아이들이 빨래를 두드리며 부르는 노래의 박자다.

      어른 엘다르의 목소리 하나가 그 소리를 덮는다. 손뼉이 멎는다. 정자 기둥 그늘에서 은빛 머리 하나가 잠깐 내다보고, 사라진다.
    choices:
      - id: answer
        label: 가지를 치는 척 — 전지가위로 다음 박자를 두 번 맞춘다
        risk: 엘다르가 들으면
        text: |
          딸깍, 딸깍. 가윗날이 박자를 맞춘다. 정자 그늘이 조용하다. 그리고 — 아주 작게, 손뼉 두 번. 대답이다.

          아래 단으로 수호자의 흰 옷이 지나간다. 걸음이 멈추지 않는다. 이번에는.
        effects: ["learn fact_sv_liandel_learned_songs", "temper 용기 2", "stress -2"]
      - id: work
        label: 못 들은 척 가지를 닦는다
        text: |
          은목 가지는 매끈하다. 상처가 나지 않게 닦는 것이 네 일이다. 손뼉 소리는 다시 나지 않는다.
        effects: ["stress 1"]
