# O-03 엘다르 정원지기 — 회귀점의 대본 장면과 첫 열흘 (SCENARIOS O-03, creation/origins_eldar_gardener.yaml).
# origin: 이 출신으로 시작한 판에서만 열리고, 그 판에서만 stage(사람 세우기)가 걸린다. 문법은 greyford_opening.yaml 머리말과 같다.
#   {name} = 아래 이름 (니나만 안다). 엘다르어는 반쯤 알아들은 대로 쓴다 — 끊긴 자리는 '…'.
#
# 흐름
#   o3_dawn_open (06:00 첫 아침의 나무 아래, 아래 이름) → o3_dawn_verse (잔향의 각성 · 일곱 선택)
#   o3_pavilion        안쪽 정원(영혼 정원)의 피험자 정자 — 니나를 따라가거나 걸어서 닿으면 (1일~4일 아침)
#   o3_measure_day     낙엽월 4일 무게를 재는 날 — 은 수반 앞에 네가 먼저 서기로 했다면 (o3_measure_me)
#   o3_nina_back_*     4일 저녁 니나가 돌아온다 — 네 아래 이름을 쥐고 왔는가 (o3_nina_kept) / 잃고 왔는가
#   o3_stopped(_ledger) 어긋남이 셋이면 수호자 에를란의 정지 — 두 번째 정지면 미리엘의 장부에 '이송'
#   o3_transfer        '이송'이 장부에 오르면 저녁 점호에서 페른이 쪽지를 읽는다 — 아래 문, 북문, 또는 흰 침상
# 장부의 셈: o3_offbeat (점호·저녁 점호·통금·낮일을 어기면 +1 — duty가 센다), 셋이면 정지.
# 니나의 사흘 (낙엽월 1일 06:12 ~ 4일 저녁)은 모든 판에서 같다 (stage). 플레이어가 바꾸는 것은 그녀가 무엇을 쥐고 돌아오는가다.
storylets:
  # ───────────────────────── 회귀점 ─────────────────────────
  - id: o3_dawn_open
    origin: eldar_gardener
    trigger: {start: true}
    stage:
      - {npc: npc_aerin, at: eg_first_tree, from: "06:00", to: "06:20", doing: 무릎 꿇은 줄을 따라 걷다가 멈춘다 — 손톱 밑이 흙으로 검다}
      - {npc: npc_fionael, at: eg_first_tree, from: "06:00", to: "06:20", doing: 정원사 뒤에 서서 공기의 냄새를 맡는다}
      - {npc: npc_o3_nina, at: eg_first_tree, from: "06:00", to: "06:12", doing: 무릎을 펴고 일어선다 — 머리에서 은 핀을 뽑는다}
      - {npc: npc_o3_nina, at: soul_garden__patient_pavilion, from: "06:12", to: "312-09-04 08:00", doing: 흰 침상에 앉아 있다 — 맑은 아이들 사이에서 무게를 재는 날을 기다린다}
      - {npc: npc_loren, at: eg_first_tree, from: "06:00", to: "06:25", doing: 무릎을 펴며 입술만 움직여 아이들의 수를 센다}
      - {npc: npc_wren, at: eg_first_tree, from: "06:00", to: "06:15", doing: 어른 곁에 무릎 꿇은 채 위를 올려다본다}
      - {npc: npc_erlan, at: eg_first_tree, from: "06:00", to: "06:30", doing: 뿌리 곁에 서서 내려가는 정원지기들의 걸음을 본다}
    text: |
      은목 이슬 냄새. 노래의 마지막 음이 아직 가지 사이에 걸려 있다.

      첫 아침의 나무 뿌리 아래, 무릎 꿇는 자리. 이슬 우리의 정원지기들이 줄지어 엎드려 있다. 엘다르의 노래는 끝나도 한참 끝나지 않는다 — 음 하나가 은목 꼭대기까지 올라가 오래 맴돌다가, 이슬이 되어 떨어진다. 이슬은 어제와 같은 잎에 맺힌다. 그제와도. 열두 해 동안 한 번도 다른 잎에 맺힌 적이 없다. 경계 밖은 사흘째 비라고 했다. 비는 여기까지 오지 않는다.

      너는 입술만 움직여 노래를 따라 했다. 소리는 내지 않는다. 뜻은 모른다. 뜻을 아는 것은 금지다 — 정원지기는 듣기만 한다. 왼쪽 발목에서 금방울이 한 번, 바람에 운다.

      마지막 음이 떨어지자 테라스 쪽에서 엘다르 하나가 내려온다. 손톱 밑이 흙으로 검은 엘다르. 이슬 우리 사람들은 그를 정원사라 부른다. 그가 무릎 꿇은 줄을 따라 걷다가, 네 옆에서 멈춘다. 네 어깨에서 먼지를 턴다. 먼지는 없었다.

      "셋째 단, 일곱째 새싹." 다정한 목소리다. 숫자가 정확하다. "이리 와요. 햇빛 쪽으로."

      네 옆에서 — 일곱째 자리에서 — 니나가 일어선다. 일어서며 머리에서 은 핀을 뽑는다. 틀어 올린 머리가 등으로 쏟아진다. 핀이 네 손바닥에 들어온다. 차갑다. 그녀가 허리를 굽히는 척, 네 귀에 숨을 댄다. 아무도 못 듣게.
    input: true_name
    input_label: 니나만 아는 아래 이름
    input_button: 그 이름을 듣는다
    input_say: 니나가 숨으로만 부르는 이름
    input_sibling: false
    return_text: "나는 — 이 음을 안다."
    return_heavy: {4: "은목 이슬 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 은목 이슬 냄새."}
    trace_lines:
      water: 무릎 밑의 이슬이 목으로 차오른다. 목 안에 물이 있다. 없다. 이슬은 무릎 밑에만 있다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 은목 이끼뿐이다.
      spear: 옆구리가 시리다. 뿌리에 기댄 쪽이다. 뿌리에 기댄 쪽일 것이다.
      blade: 목이 뜨겁다. 허리의 전지가위는 제자리에 있다.
      rope: 손목이 쓸린다. 발목도. 방울 고리 자국이다.
      hunger: 배가 꼬인다. 아니다 — 이 정원에서는 아무도 굶지 않는다.
      fall: 발밑이 꺼지는 것 같다. 마흔한 단의 테라스가 그대로 아래로 흘러내린다. 너는 무릎을 꿇고 있다.
    return_ink: |
      ┊ 그 다음엔 니나가 은 핀을 네 손에 쥐여 주고, 정원사를 따라 안개 쪽으로 갔다. 나흘째 저녁에 돌아왔다.
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 정원에 하나뿐이다. 열한 살 여름 — 정원에는 여름이 없으니 이름만 여름인 어느 저녁 — 목욕 연못에서 둘은 아래 이름을 바꿔 말했다. 정원지기는 아래 이름을 한 사람에게만 준다. 이름을 아는 자가 너를 가진다.

      니나가 몸을 편다. 손톱으로 네 손등을 두 번 두드린다. 괜찮아. 그리고 정원사 쪽으로 걸어간다. 정원사가 그녀의 어깨를 털고, 햇빛 쪽으로 돌려세운다. 화분을 옮기듯이.
    effects: ["item o3_silver_pin", "var o3_nina_known = true", "note 아래 이름 — {name}. 정원에서 그 이름을 아는 사람은 니나 하나다. 엘다르의 장부에는 번호, 이슬 우리에서는 '방울'", "note 소매 단에 말린 기억꽃 한 송이 — 은방울 뜰 구석에서 몰래 말린 것"]
    next: o3_dawn_verse

  - id: o3_dawn_verse
    origin: eldar_gardener
    text: |
      니나의 방울 소리가 멀어진다. 테라스로 내려가지 않는다 — 북서쪽, 은목 숲에 안개가 고인 쪽으로. 이슬 우리 어른들이 '아픈 곳'이라 부르는 쪽. 안쪽 정원.

      정원사 뒤에 섰던 젊은 엘다르가 돌아서서 그와 낮게 말한다. 눈 밑이 푸르다. 엘다르어다. 너는 그 말의 절반을 알아듣는다 — 열두 해 동안 듣기만 한 귀가 주워 모은 절반.

      "…수반이… 셋째 단 쪽으로… 또 울었어요…"

      "그래서 맑은 아이부터… 잔향의 무게를… 다시 재야지요. 사흘 뒤…"

      "…이 아이는 꿈이 젖지 않았어요."

      "재 보면 알아요." 정원사의 목소리는 여전히 다정하다. "재 보면 다 알아요."

      로렌이 무릎을 편다. 이슬 우리 반장은 네 쪽을 보지 않는다. 엘다르가 곁에 있을 때 그는 아무도 보지 않는다. 입술만 움직여 센다. 열둘. 하나가 빈 열둘. 뿌리 곁에서는 수호자 에를란이 손가락 하나를 반쯤 든 채, 내려가는 정원지기들의 걸음을 본다.

      니나가 안개 쪽으로 멀어지는 동안, 방금 끝난 노래의 한 구절이 갑자기 뜻으로 바뀐다. '…마지막 말이 모든 이름을 말하는 날…' 반쯤만 알던 말이 그 구절만은 다 들린다. 너는 이 노래를 엘다르보다 먼저 들었다. 그들이 그것을 처음 부른 밤, 너는 죽어 가는 목소리 속에 있었다. 눈가로 잿빛 고리가 스치고 사라진다. 안개 쪽 아주 먼 데서 — 들릴 리 없는 거리에서 — 은 수반 하나가, 아무도 건드리지 않았는데, 한 번 운다.
    effects: ["learn fact_o3_first_verse", "var o3_elvish += 5", "note 니나 — 정원사가 안쪽 정원으로 데려갔다. '사흘 뒤, 잔향의 무게를 다시 잰다'", "note 첫 아침의 노래 — '…마지막 말이 모든 이름을 말하는 날…' 그 구절만은 다 들렸다"]
    choices:
      - id: follow
        label: 방울을 손으로 감싸 쥐고 — 니나를 따라 안개 길로 들어간다
        minutes: 90
        risk: 금방울이 운다
        check: {skill: 은신, D: 30, D_per_loop: 2, helps: [shadow_step, fleet], warn: ["var o3_bell_muffled == true"]}
        success:
          text: |
            엘다르 둘의 등 뒤 열 걸음. 방울은 손바닥 안에서 땀에 젖어 운다 — 아주 작게. 숲길에 들어서자 은목들이 접힌 천처럼 겹쳐 지나간다. 몇 걸음에 한 마장이 접힌다. 엘다르가 지나간 자리라서. 그 자리를 놓치지 않으려고 너는 그들의 발자국만 밟는다.

            안개가 걷히자 유리 지붕들이 나타난다.
          effects: ["learn fact_o3_fold_path", "var o3_followed = true", "goto soul_garden__patient_pavilion"]
        failure:
          text: |
            숲길 초입에서 방울이 운다. 한 번. 손바닥 안에서였는데도.

            정원사가 돌아본다. 놀라지 않는다. 화단에서 늘 보던 새싹을 보는 얼굴이다. "따라오고 싶었어요?" 그가 네 어깨의 먼지를 턴다. 이번에도 먼지는 없다. "좋아요. 무게를 재는 날 — 당신도 와요. 나흘째 아침에. 둘이 서면 바늘이 덜 외롭겠지요."

            젊은 엘다르가 너를 숲 가장자리까지 데려다 놓는다. 한마디도 하지 않는다. 다만 돌아서기 전에, 네 머리카락 냄새를 한 번 맡는다.
          effects: ["var o3_measure_me = true", "var o3_aerin_noticed = true", "learn fact_o3_measure_day", "memory npc_aerin 이상함 셋째 단의 여덟째 새싹이 안개 길을 따라왔다 — 잘 자랄 것 같다", "memory npc_fionael 이상함 방울을 단 정원지기가 안개 길을 따라왔다", "goto eg_white_fence", "stress 8"]
      - id: ask_instead
        label: '정원사 앞에 엎드린다 — "일곱째 대신 여덟째를 데려가십시오."'
        minutes: 10
        check: {skill: 화술, D: 30, helps: [etiquette, tongue, charm]}
        success:
          text: |
            정원사가 너를 내려다본다. 오래. 엘다르의 '오래'다 — 이슬 하나가 잎 끝에서 떨어질 만큼.

            "새싹이 스스로 오겠다고 한 건 처음이군요." 그의 손가락이 네 턱을 들어 햇빛 쪽으로 돌린다. 흙 냄새가 난다. "그 아이는 벌써 화분을 옮겼어요. 대신 이렇게 하지요 — 나흘째 아침, 무게를 재는 날, 당신이 먼저 서요. 당신에게 무게가 있으면 그 아이는 잴 필요가 없지요. 없으면…" 말끝이 다정하게 내려간다. "둘 다 재고요."

            니나가 안개 쪽에서 한 번 돌아본다. 고개를 젓는다. 아주 천천히.
          effects: ["var o3_measure_me = true", "learn fact_o3_measure_day", "rel npc_aerin like 10", "memory npc_aerin 이상함 셋째 단의 여덟째 새싹이 스스로 오겠다고 했다 — 처음 있는 일", "rel npc_o3_nina trust 5", "note 정원사와 정했다 — 낙엽월 4일 무게를 재는 날, 내가 먼저 은 수반 앞에 선다. 무게가 있으면 니나는 재지 않는다", "temper 용기 4", "temper 자비 3"]
        failure:
          text: |
            정원사는 대답하지 않는다. 대신 뿌리 곁의 수호자를 본다. 에를란의 손가락이 반쯤 올라간다.

            "정원지기는 묻지 않아요." 정원사가 말한다. 다정하게. "묻는 건 자라는 게 아니라 — 웃자라는 거지요." 그는 니나를 데리고 간다. 돌아보지 않는다.

            무례는 굶주림으로 갚는다 — 엘다르는 그렇게 가르친다. 오늘 아침 네 몫의 흰 빵은 식당 선반에 놓이지 않는다.
          effects: ["hunger 1", "var o3_offbeat += 1", "memory npc_aerin 이상함 여덟째 새싹이 엘다르에게 먼저 말을 걸었다", "memory npc_erlan 위험함 방울을 단 정원지기가 정원사에게 청을 넣었다", "stress 6"]
      - id: ask_loren
        label: 무릎을 펴는 로렌 곁으로 — 안쪽 정원을 낮게 묻는다
        minutes: 20
        check: {skill: 통찰, D: 18, helps: [liar_nose, people_memory]}
        success:
          text: |
            로렌은 대답하지 않는다. 엘다르가 아직 뿌리 곁에 있다. 그는 이슬 단지를 들고 테라스로 내려가다가, 네가 따라오는 걸음에 맞춰 걸음을 늦춘다. 아래 단에 닿아서야 입을 연다. 단지만 보면서.

            "돌아온 아이들은 음이 비어서 와." 숨을 한 번 멈춘다. "얼굴도 손도 그대로야. 밥도 먹고 웃기도 하고. 그런데 노래를 맞춰 보면 — 제 음 자리가 비어 있어. 나는 사람을 음으로 세니까 알지."

            그가 단지를 내려놓는다. "온실에 네 번 눕고도 아직 거기 있는 여자가 있다지. 미라. 들은 얘기다." 그리고 아주 낮게 덧붙인다. "세 번 어긋나지 마라. 정지 두 번이면 장부의 다른 칸이다."
          effects: ["learn fact_o3_returned_no_pitch", "rel npc_loren trust 6", "rel npc_loren like 3", "goto eg_terraces_lower", "note 로렌 — 안쪽 정원에서 돌아온 아이들은 음이 비어서 온다. 온실에 네 번 누운 여자, 미라"]
        failure:
          text: |
            로렌은 이슬 단지를 들어 올린다. "예. 이슬은 오늘도 단지 열둘입니다." 엘다르 쪽을 향해 하는 말이다. 너에게가 아니라.

            그는 네 얼굴을 한 번도 보지 않고 테라스로 내려간다. 걸음이 평소보다 빠르다.
          effects: ["rel npc_loren trust -2", "goto eg_terraces_lower"]
      - id: eavesdrop
        label: 고개를 숙인 채 — 엘다르의 말을 끝까지 듣는다
        minutes: 15
        check: {skill: 통찰, D: 30, helps: [bat_ear, memory_palace, tongues], warn: ["var o3_elvish >= 35"]}
        success:
          text: |
            너는 이슬 맺힌 뿌리만 본다. 귀는 두 엘다르 쪽에 둔다. 말이 끊긴 자리를, 끊긴 자리 그대로 외운다.

            "…낙엽월 나흘째 아침… 수정 기둥 사이에서… 맑은 아이들을 차례로…"

            "…평범한 아이는 무게가 없어요. 바늘이 움직이지 않으면… 그냥 돌려보내요. 조금 덜어 낸 채로."

            "우리가 찾는 건 사람이 아니에요." 정원사의 목소리. "사람 안에서… 끝나지 않는 것. 그것만 옮기면 돼요."

            옮긴다. 그 낱말을 너는 안다. 화분을 옮길 때 엘다르가 쓰는 말이다.
          effects: ["learn fact_o3_measure_day", "learn fact_o3_unending", "var o3_elvish += 3", "note 엿들은 말 — 낙엽월 4일 아침, 수정 기둥 사이에서 맑은 아이들을 잰다. 무게 없는 아이는 '조금 덜어 낸 채로' 돌려보낸다"]
        failure:
          text: |
            젊은 엘다르의 말이 뚝 멎는다. 그녀가 너를 본다. 고개 숙인 정원지기들 가운데서, 정확히 너를.

            "정원지기는 듣기만 하지요." 그녀가 공용어로 말한다. 부드럽게. "그런데 — 듣고 있었군요."

            뿌리 곁에서 에를란의 손가락이 끝까지 올라간다. "움직임이 어긋났소."
          effects: ["var o3_offbeat = 3", "memory npc_fionael 이상함 방울을 단 정원지기가 엘다르어를 알아듣는 얼굴로 들었다", "memory npc_erlan 위험함 방울을 단 정원지기가 엘다르의 말을 엿들었다"]
      - id: muffle
        label: 무릎 밑의 젖은 흙을 떠 — 금방울 속을 몰래 메운다
        minutes: 20
        check: {skill: 손재주, D: 26, helps: [lock_hands, smuggler]}
        success:
          text: |
            엎드린 채 손가락으로 흙을 뭉친다. 은목 뿌리 밑의 흙은 끈기가 있다. 방울 구멍에 조금씩 밀어 넣는다. 방울의 혀가 흙에 묻힌다.

            일어서서 한 걸음. 소리가 없다. 두 걸음. 없다. 열두 해 만에 처음으로, 네 발목이 조용하다.

            흙은 마르면 갈라진다. 밤마다 다시 메워야 한다. 그리고 수호자는 소리를 세는 귀를 가졌다 — 들리던 것이 안 들리는 것도 소리다.
          effects: ["var o3_bell_muffled = true", "note 금방울을 흙으로 메웠다 — 울지 않는다. 마르기 전에 밤마다 다시 메운다", "temper 용기 2"]
        failure:
          text: |
            흙덩이 속의 돌이 방울 안에서 구른다. 방울이 깨진 소리로 운다 — 평소보다 크게, 평소보다 오래. 무릎 꿇은 줄 전체가 그 소리에 굳는다.

            에를란이 너를 본다. 손가락 하나가 올라간다. 내려오지 않는다. "방울은 우는 물건이오." 그가 말한다. 그 말을 기억해 두라는 듯이.
          effects: ["var o3_offbeat += 1", "memory npc_erlan 위험함 방울을 단 정원지기가 방울을 흙으로 막으려 했다", "stress 5"]
      - id: kneel
        label: 그대로 무릎을 꿇고 — 노래의 남은 음이 다 떨어질 때까지 입술만 움직인다
        minutes: 30
        text: |
          정원지기는 묻지 않는다. 정원지기는 따라가지 않는다. 너는 이슬이 마지막 잎 끝에서 떨어질 때까지 무릎을 꿇고 있다. 니나의 방울 소리가 안개 속으로 줄어든다. 하나. 하나. 그리고 없다.

          로렌이 지나가며 네 어깨를 아주 잠깐 짚는다. 잘했다는 뜻인지, 그렇게 하라는 뜻인지, 너는 모른다. 손바닥 안에서 은 핀이 체온만큼 데워진다.
        effects: ["temper 신앙 5", "temper 충성 5", "stress 8", "rel npc_loren trust 3", "var o3_obeyed = true"]
      # ── ◈ 기억 선택지: 지난 회차에 은 수반이 무엇을 가져가는지 알았다면 ──
      - id: mem_flower
        needs_memory: fact:fact_o3_measure_takes
        label: '일어선다 — 소매 단을 이로 뜯어, 니나의 손에 말린 기억꽃을 쥐여 준다. "바늘 앞에서, 혀 밑에."'
        minutes: 3
        text: |
          너는 일어선다. 세 걸음. 엘다르 앞에서 정원지기가 일어서는 것은 어긋남이다 — 그래도. 소매 단의 실을 이로 끊는다. 니나의 손을 잡는 척, 말린 꽃 한 송이가 그녀의 손바닥으로 옮겨 간다. 그녀의 손가락이 그것을 감싼다. 묻지 않는다.

          "바늘 앞에서. 혀 밑에." 입술만 움직인다. 니나의 눈이 한 번 커졌다가 — 네 얼굴에서 무언가를 읽는다. 무엇을 읽었는지 너는 모른다. 그녀는 고개를 아주 작게 끄덕이고, 안개 쪽으로 걸어간다.

          정원사 뒤의 젊은 엘다르가 공기의 냄새를 맡는다. 한 번. 비 냄새를 맡은 사람처럼. 뿌리 곁에서 에를란의 손가락이 반쯤 올라간다.
        effects: ["var o3_flower = 0", "var o3_nina_kept = true", "var o3_nina_flower = true", "var o3_offbeat += 1", "var o3_fionael_knows = true", "bond npc_o3_nina 6", "rel npc_o3_nina trust 8", "memory npc_o3_nina 다정함 방울이 말린 기억꽃을 쥐여 주었다 — 바늘 앞에서 혀 밑에 물라고", "memory npc_fionael 이상함 방울을 단 정원지기에게서 비에 젖은 재 냄새가 났다", "note 기억꽃은 니나에게 — 나에게는 이제 없다"]

  # ───────────────────────── 안쪽 정원 (1일 ~ 4일 아침) ─────────────────────────
  - id: o3_pavilion
    origin: eldar_gardener
    trigger: {window: {from: "312-09-01 06:00", to: "312-09-04 07:30"}, at: [soul_garden, soul_garden__patient_pavilion, soul_garden__graft_beds, soul_garden__crystal_columns, soul_garden__greenhouse_2, soul_garden__greenhouse_3, soul_garden__greenhouse_7], when: ["not var o3_escaped == true"]}
    text: |
      유리 온실들. 안개가 유리에 맺혀 흘러내리고, 그 안에서 무언가가 자란다. 꽃이 아니다.

      온실 사이 빈터에 수정 기둥이 둥글게 서 있다. 가운데에 은 수반 하나. 물이 담겨 있지 않다. 바닥 위에 바늘 하나가 떠 있다 — 아무것도 받치지 않는데. 기둥들이 아주 낮게, 귀가 아닌 데로 운다.

      그 곁의 정자. 흰 침상들이 줄지어 있고, 누운 사람들의 얼굴이 평온하다. 너무 평온하다. 감은 눈꺼풀 밑에서 눈동자가 빠르게 움직인다. 꿈을 꾸는 것처럼. 아니면 무언가가 꿈을 꺼내 가는 것처럼.

      입구 쪽 침상에 니나가 앉아 있다. 머리에 핀이 없다. 너를 본다. 놀라지 않는다. 고개를 아주 천천히 젓는다 — 돌아가.
    effects: ["goto soul_garden__patient_pavilion"]
    choices:
      - id: flower
        when: ["var o3_flower >= 1"]
        label: 소매 단을 이로 뜯어 — 말린 기억꽃을 니나의 손바닥에 옮긴다
        minutes: 150
        text: |
          니나 곁에 무릎을 꿇는다. 소매 단의 실을 이로 끊는다. 말린 꽃 한 송이 — 은방울 뜰 구석에서 너 혼자 말린 것, 네가 불려 가는 날을 위해 말린 것. 그것이 니나의 손바닥으로 옮겨 간다.

          "바늘 앞에서. 혀 밑에." 니나가 꽃을 쥔다. 입술만 움직여 대답한다. 나흘째. 수반. 그리고 네 손등을 두 번 두드린다. 괜찮아. 이번에는 네가 그 말을 믿지 않는다는 것을 그녀도 안다.

          정원 쪽으로 돌아가는 엘다르의 발소리. 너는 그 뒤에 바짝 붙는다. 접힌 길이 닫히기 전에.
        effects: ["var o3_flower = 0", "var o3_nina_kept = true", "var o3_nina_flower = true", "bond npc_o3_nina 8", "rel npc_o3_nina trust 8", "memory npc_o3_nina 다정함 방울이 흰 방까지 와서 기억꽃을 쥐여 주었다", "learn fact_o3_measure_day", "goto eg_white_fence", "note 기억꽃은 니나에게 — 나에게는 이제 없다. 니나 — '나흘째, 수반'"]
      - id: mira
        when: ["with npc_mira"]
        label: 손가락 마디를 하나씩 누르며 무언가를 세는 여자 곁으로 간다
        minutes: 150
        check: {skill: 화술, D: 22, helps: [tongue, charm]}
        success:
          text: |
            왼눈이 흐린 여자다. 손바닥으로 그 눈을 반쯤 가리고 너를 본다. "…새 얼굴이네요. 온실은 처음이죠?" 그녀가 손가락 마디를 누른다. 하나, 둘, 셋. "잊기 전에 말할게요. 다섯 번째가 돌아와요. 서리월 구 일이요. 그 날짜를 아직 안 잊었는데 — 그게 제일 무서워요."

            그녀가 네 소매를 잡는다. "당신도 하나만 외워 줄래요? 제 이름 정도만. 미라예요." 그리고 같은 말을 한 번 더 한다. 처음 하는 말처럼.

            정원 쪽으로 돌아가는 엘다르의 발소리. 너는 접힌 길 뒤에 바짝 붙는다. 미라의 이름을 입속으로 두 번 외우면서.
          effects: ["learn fact_sv_mira_fifth_ritual", "var o3_mira_known = true", "rel npc_mira trust 10", "rel npc_mira like 6", "memory npc_mira 다정함 방울을 단 정원지기가 내 이름을 외워 주겠다고 했다", "goto eg_white_fence", "note 미라 — 온실의 정원지기. 서리월 9일, 다섯 번째 옮김 의식. 이름을 외워 달라고 했다"]
        failure:
          text: |
            여자가 너를 본다. 손가락 마디를 누른다. "…제가 뭘 말하려 했죠?" 그리고 처음부터 다시 센다. 하나, 둘. 너는 거기 없는 사람이 된다.

            정원 쪽으로 돌아가는 엘다르의 발소리. 너는 접힌 길 뒤에 바짝 붙는다.
          effects: ["stress 5", "goto eg_white_fence"]
      - id: basin
        label: 수정 기둥 사이로 — 물 없는 은 수반 가장자리에 손끝을 댄다
        minutes: 150
        risk: 기둥이 운다
        text: |
          은이 차다. 손끝이 닿자 — 바늘이 돈다. 천천히, 네 쪽으로. 수면도 없는 수반 위에서, 별을 찾는 바늘처럼.

          수정 기둥들이 한꺼번에 낮게 운다. 귀가 아닌 데로. 온실 하나의 유리문이 열리는 소리.

          너는 손을 뗀다. 바늘이 제자리로 돌아오기 전에 빈터를 빠져나온다. 정원 쪽으로 돌아가는 엘다르의 발소리 — 그 접힌 길 뒤에 바짝 붙는다. 등 뒤에서 누군가 공기의 냄새를 맡는 숨소리가 들린다. 비 냄새를 맡은 사람처럼.
        effects: ["learn fact_o3_needle_turns", "memory npc_fionael 이상함 한낮에 수정 기둥이 혼자 울었다 — 젖은 재 냄새가 났다", "stress 8", "goto eg_white_fence", "note 은 수반 — 내가 손을 대자 바늘이 내 쪽으로 돌았다"]
      - id: stay
        label: 빈 침상 그늘에 숨어 — 해 질 녘까지 지켜본다
        minutes: 600
        risk: 접힌 길이 닫힌다 — 돌아가는 길이 하루가 된다
        check: {skill: 은신, D: 28, helps: [shadow_step], warn: ["var o3_bell_muffled == true"]}
        success:
          text: |
            빈 침상 밑. 방울을 손바닥으로 감싸고, 숨을 셋으로 나눠 쉰다.

            한낮에 정원사가 침상들을 돈다. 한 사람 한 사람의 어깨를 털고, 햇빛 쪽으로 얼굴을 돌린다. 말을 건다. 다정하게. 니나의 침상에서 그는 오래 멈춘다. "잘 자랄 것 같군요."

            해 질 녘, 그가 젊은 엘다르에게 엘다르어로 말한다. 너는 그 절반을 알아듣는다. "…여든일곱… 전부 방법의 실패였어요… 여든여덟째는…" 젊은 엘다르는 대답하지 않는다. 손톱으로 소매 안의 종이에 무언가를 적는다.

            엘다르들이 떠난 뒤 안개 길로 나서자, 길이 펴져 있다. 접힌 자리가 없다. 은목이 끝없이 이어진다.

            은방울 뜰에서는 오늘 하루 네 방울이 울지 않았다. 창가의 엘다르 누군가가 빈 화단을 세었을 것이다.
          effects: ["learn fact_sv_aerin_87_failures", "learn fact_o3_measure_day", "learn fact_o3_fold_path", "var o3_offbeat += 1", "stress 10", "note 정원사 — '여든일곱, 전부 방법의 실패.' 니나의 침상 앞에서 '잘 자랄 것 같군요'", "note 안개 길이 펴졌다 — 혼자서는 하루 길이다. 은방울 뜰의 내 화단은 하루 비었다"]
        failure:
          text: |
            침상 밑으로 들어가는 순간 방울이 운다. 정자 안의 누구도 깨지 않는다. 깨어 있는 사람만 고개를 든다.

            젊은 엘다르가 침상 앞에 쪼그려 앉는다. 눈 밑이 푸르다. 그녀가 네 냄새를 맡는다. 오래. 그러고는 아무에게도 아무 말 없이, 너를 안개 길 입구까지 데려다 놓는다. 돌아서기 전에 한 마디. "나흘째 아침에 — 당신도 오게 될 거예요."

            너는 해가 기울 때까지 숲 가장자리에 앉아 있다. 다리가 움직이지 않아서.
          effects: ["var o3_measure_me = true", "learn fact_o3_measure_day", "memory npc_fionael 이상함 피험자 정자에 숨어든 정원지기 — 걸음이 꿈속의 사람과 같다", "goto eg_white_fence", "stress 8"]
      - id: back
        label: 니나의 눈을 따른다 — 접힌 길이 닫히기 전에 돌아간다
        minutes: 120
        text: |
          니나의 입술이 움직인다. 소리 없이. 나흘째. 수반. 그리고 — 가.

          너는 간다. 정원 쪽으로 돌아가는 엘다르의 발소리 뒤에 바짝 붙어서. 은목이 접힌 천처럼 겹쳐 지나간다. 방울이 손바닥 안에서 한 번도 울지 않는다. 울면 안 된다는 것을 방울도 아는 것처럼.
        effects: ["learn fact_o3_measure_day", "rel npc_o3_nina trust 4", "goto eg_white_fence", "note 니나 — 피험자 정자의 흰 침상. '나흘째, 수반'"]

  # ───────────────────────── 무게를 재는 날 (4일 아침) ─────────────────────────
  - id: o3_measure_day
    origin: eldar_gardener
    trigger: {window: {from: "312-09-04 08:00", to: "312-09-04 11:30"}, at: "@eternal_garden", when: ["var o3_measure_me == true", "not var o3_escaped == true"]}
    stage:
      - {npc: npc_aerin, at: soul_garden__crystal_columns, from: "312-09-04 08:00", to: "312-09-04 12:00", doing: 은 수반 곁에서 바늘을 들여다본다 — 다정하게}
      - {npc: npc_fionael, at: soul_garden__crystal_columns, from: "312-09-04 08:00", to: "312-09-04 12:00", doing: 수정 기둥 사이에 서서 숨을 참는다}
      - {npc: npc_o3_nina, at: soul_garden__crystal_columns, from: "312-09-04 08:00", to: "312-09-04 12:00", doing: "은 수반 곁에 선다 — 흰 옷, 핀 없는 머리"}
    text: |
      정원사 곁에 서던 젊은 엘다르가 너를 찾아왔다. 눈 밑이 푸르다. 그녀가 네 냄새를 맡는다. 아주 잠깐. "오늘이에요, 새싹."

