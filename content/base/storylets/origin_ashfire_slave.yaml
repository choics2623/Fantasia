          effects: ["learn fact_em_haro_knotcords", "learn fact_em_cassian_monthly_numbers", "rel npc_haro trust 5", "note 하로의 끈 — 올해 낙반 매듭 마흔하나. 백작이 읽는 숫자는 셋"]
