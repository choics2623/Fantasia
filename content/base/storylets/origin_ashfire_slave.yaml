  # ───────────────────────── 그날 밤 — 쇠눈 크롬 ─────────────────────────
  - id: o2_cradle_take
    origin: ashfire_slave
    trigger: {window: {from: "312-09-02 21:00", to: "312-10-31 04:00"}, at: "@ember_mines", night: true, when: ["var o2_listed == true", "var o2_taken != true", "var o2_cradle_escaped != true"]}
    severity: 4
    text: |
      쇠문의 빗장이 밤에 열린다. 숯막의 모두가 그 소리를 안다. 아무도 일어나지 않는다.

      등불 둘, 그리고 쇠 눈 하나. 목줄장 크롬이 네 앞에서 침을 삼킨다. 그 뒤에 용인 경비 둘과 요람의 운반 노예 하나. 운반 노예의 팔에 회색 담요가 걸려 있다.

      "이백열둘." 쇠 눈이 네 얼굴에서 멈춘다. "얼굴은 외웠어."

      옆 굴들이 숨을 멈춘다.
    choices:
      - id: fight
        label: 곡괭이 자루를 쥔다
        minutes: 20
        risk: 용인 경비가 둘이다
        check: {skill: 싸움, D: 22, helps: [brawler, improvised, blunt]}
        success:
          text: |
            자루 끝이 등불을 친다. 기름이 쏟아지고 불이 바닥을 핥는다. 용인 경비 하나가 불을 밟아 끄는 사이, 너는 어둠 속으로 — 슬래그 비탈로, 폐갱 쪽으로. 등 뒤에서 크롬의 호루라기.

            폐갱의 썩은 지지대 아래에서 너는 숨을 센다. 크롬은 얼굴을 외웠다. 외운 얼굴은 잊지 않는다.
          effects: ["goto em_old_cave", "var o2_listed = false", "var o2_hiding = true", "var o2_cradle_escaped = true", "wanted 2 요람의 사람들에게 곡괭이 자루를 휘둘렀다", "nemesis npc_krom_ironeye 1", "temper 용기 6", "note 쇠눈 크롬을 뿌리치고 폐갱에 숨었다 — 요람의 명단에서 빠진 번호"]
        failure:
          text: |
            용인 경비의 창 자루가 네 무릎을 꺾는다. 둘째는 등을. 크롬이 침을 삼킨다. "얼굴은 외웠다고 했잖아." 운반 노예가 담요를 네 어깨에 얹는다. 젖은 피 위로.
          effects: ["pain 30", "var o2_taken = true", "item o2_cradle_blanket", "goto em_cradle_ward", "then o2_cradle_cell"]
      - id: shard
        when: ["var o2_shard == true"]
        label: 소매의 흑요석을 크롬의 쇠 눈 밑에 댄다
        minutes: 10
        risk: 날을 드러낸다
        check: {skill: 위압, D: 16, helps: [menace, knife_hand]}
        success:
          text: |
            검은 유리의 날이 쇠 눈 밑 살갗에 닿는다. 크롬이 침을 삼킨다. 한 번, 두 번. "…이 굴은 비었다고 적지." 그가 뒷걸음질 친다. "명단은 맞으면 되니까."

            그들은 옆 굴의 문을 연다. 잠든 사람의 번호를 부른다. 그 사람은 아무것도 묻지 않고 담요를 받는다. 크롬은 돌아보며 네 얼굴을 한 번 더 외운다.
          effects: ["var o2_listed = false", "var o2_cradle_escaped = true", "temper 자비 -5", "temper 용기 4", "nemesis npc_krom_ironeye 1", "memory npc_krom_ironeye 위험함 이백열둘이 쇠 눈 밑에 날을 댔다", "note 쇠눈 크롬이 물러났다 — 옆 굴의 잠든 번호가 대신 갔다. 크롬은 얼굴을 외웠다"]
        failure:
          text: |
            용인 경비가 네 손목을 비튼다. 검은 유리가 바닥에서 두 조각이 난다. "날이다." 크롬이 침을 삼킨다. "날까지 숨겼군. 요람이 좋아하겠어."
          effects: ["var o2_shard = false", "var o2_shard_gone = true", "wanted 2 흑요석 날을 목줄장의 눈에 댔다", "pain 15", "var o2_taken = true", "item o2_cradle_blanket", "goto em_cradle_ward", "then o2_cradle_cell"]
      - id: go
        label: 담요를 받는다
        minutes: 0
        text: |
          담요는 마른 약초 냄새가 난다. 네가 쇠문을 지날 때 숯막의 굴들은 여전히 숨을 멈추고 있다. 한 굴만 빼고. 거기서 누군가가 입속으로 네 이름을 부른다. 번호가 아니라.
        effects: ["var o2_taken = true", "item o2_cradle_blanket", "goto em_cradle_ward", "then o2_cradle_cell"]

  # ───────────────────────── 하층 공방 — 대기 감방 ─────────────────────────
  - id: o2_cradle_cell
    origin: ashfire_slave
    severity: 4
    text: |
      요람의 바구니는 둥지 아래 축을 따라 내려간다. 사백 미터. 귀가 먹먹해진다. 갱의 바구니보다 조용하다. 쇠줄에 기름을 먹였다.

      대기 감방. 문패의 번호 자리가 비어 있다 — 아직. 돌벽 너머에서 누가 두 번 두드리고 한 번 쉰다. 다른 벽 너머에서 같은 소리로 대답이 온다. 두 번, 한 번.

      복도를 걷는 발소리. 문패마다 멈추고, 입술만 움직이는 소리. 은빛으로 비늘을 간 용인 귀부인 하나가 번호를 소리 없이 읊으며 지나간다. 네 문 앞에서 멈춘다. "춥지 않으세요?" 대답을 기다리지 않는다.

      얼마나 지났는지 모른다. 문이 다시 열린다. 비늘이 하나도 없는 손이 등잔을 든다. 그가 네 손목을 들어 맥을 짚고, 손을 한 번 쥐었다 편다. "아직 번호가 없으시네요." 정중한 목소리다. "곧 드리겠습니다."
    choices:
      - id: tap
        label: 벽을 두 번 두드리고, 한 번 쉰다
        minutes: 0
        text: |
          두 번, 한 번. 벽 너머가 오래 조용하다. 그리고 속삭임. "…누구야? 저쪽 벽 언니가 아니라."

          "숯막. 하로의 갱조." 너는 그 목소리를 안다. 굴 마을에서 자란 목소리다. "칼렙의 딸이지. 야나."

          벽 너머의 숨이 멈췄다가 돌아온다. "…아버지 손은 — 아직 벽에 있어?" 너는 있다고 말한다. 다른 벽 너머에서 다른 목소리가 숫자를 센다. 낮고 빠르게. "아홉 칸. 연기가 많이 나가는 쪽." 그리고 아무 말도 없다.
        effects: ["learn fact_em_yana_slot_37", "learn fact_eh_flue_exit", "rel npc_yana trust 8", "rel npc_yana like 6", "rel npc_hanne_fourteen trust 4", "memory npc_yana 다정함 벽 너머의 새 번호가 아버지의 손을 전해 주었다", "note 대기 감방 — 벽 너머에 칼렙의 딸 야나. 다른 벽의 목소리: 아홉 칸, 연기 많은 쪽", "then o2_graft_table"]
      - id: edik
        when: ["var o2_edik_taken == true"]
        label: 벽마다 두드린다 — "에디크."
        minutes: 0
        text: |
          두 번, 한 번. 다음 벽. 두 번, 한 번. 셋째 벽에서 기침이 대답한다. 그리고 웃음. 기침과 웃음이 반씩 섞인 목소리.

          "…{name}?" 이 지하에서도 그 이름을 소리 내어 부르는 사람은 그 하나다. "너 여기 왜 왔어. 바보야."

          너는 대답하지 않는다. 벽에 손바닥을 댄다. 벽 너머에서도 손바닥이 닿는 소리가 난다.
        effects: ["bond npc_o2_edik 8", "rel npc_o2_edik like 10", "stress -10", "then o2_graft_table"]
      # ── ◈ ──
      - id: mem_flue
        needs_memory: fact:fact_eh_flue_exit
        label: 벽 너머로 — "아홉 칸. 연기 많은 쪽." 그리고 소각로 쪽 문을 본다
        minutes: 120
        check: {skill: 은신, D: 22, helps: [shadow_step, climber], warn: ["pknows fact_em_fourteen_escape_plan"]}
        success:
          text: |
            벽 너머의 숫자 세는 목소리가 멈춘다. "…누가 가르쳐 줬어. 사다리 칸 수를." 대답할 시간이 없다. 감방의 빗장은 낡았고, 소각로 쪽 복도는 밤에 비어 있다. 연기가 가장 많이 나가는 쪽.

