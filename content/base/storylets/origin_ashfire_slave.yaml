# 잿불 광산 노예 (SCENARIOS O-02) — 회귀점의 대본 장면과 첫 열흘의 장면. 사람의 대응표는 creation/origins_ashfire_slave.yaml 머리말.
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 진짜 이름 (갱에서는 에디크만 소리 내어 부른다). 이 출신에게 {sibling}은 없다.
#
# 흐름
#   o2_cavein_open (17:40, 회귀점) → o2_cavein_hand (낙반 · 잔향의 각성 · 일곱 선택) — 두 번째 회차부터 ◈ 천장보다 먼저 외치면 o2_cavein_early
#   첫 밤 숯막: o2_knot_lesson (에디크가 살았으면 — 매듭 읽기) / o2_knot_for_edik (죽었으면 — 마흔둘째 매듭)
#   둘째 날 새벽 점호: o2_edik_leg (부서진 다리 — 갱조·병동·웨나의 수레) → o2_ward_night (병동의 밤) → o2_edik_taken (요람의 손)
#   흑점 넷: o2_lower_call (새벽 점호, 그락스의 손가락) → o2_cradle_take (그날 밤, 쇠눈 크롬) → o2_cradle_cell (대기 감방)
#            → o2_graft_table (이식대 — 견디면 그릇, 못 견디면 종료) · 한 번 넘긴 뒤 다시 넷이면 o2_lower_again
#   요람에서 빠지면: o2_krom_hunt (쇠눈 크롬이 외운 얼굴)
# 시각: `then`으로 잇는 장면은 시간이 흐르지 않는다 (요람의 밤은 한 밤 안에 끝난다 — 은비늘은 20~23:30 그릇의 방에 있다).
storylets:
  # ───────────────────────── 회귀점 — 붉은 목구멍의 낙반 ─────────────────────────
  - id: o2_cavein_open
    origin: ashfire_slave
    trigger: {start: true}
    stage:
      - {npc: npc_haro, at: em_lvl_mid, from: "17:40", to: "19:40", doing: 갱목 사이를 걸으며 갱조 서른의 이름을 입속으로 센다}
      - {npc: npc_o2_edik, at: em_lvl_mid, from: "17:40", to: "17:58", doing: 서쪽 갱도 끝에서 마지막 수레를 채운다}
      - {npc: npc_grax, at: em_lvl_mid, from: "17:40", to: "18:10", doing: 점호 패를 이빨로 문 채 막장 입구에서 수레를 센다}
      - {npc: npc_yan_nose, at: em_lvl_mid, from: "17:40", to: "19:40", doing: 막장 앞에서 코를 훌쩍이며 먼지 냄새를 맡는다}
    text: |
      붉은 먼지 냄새. 등잔 기름, 젖은 돌, 식은 땀.

      중층 4번 막장. 교대 종까지 손가락 두 마디. 올림 바구니는 한 번에 서른을 태우고, 하로의 갱조는 언제나 마지막 바구니다. 곡괭이들이 하나씩 벽에서 떨어진다.

      하로 — 갱조 반장, 손목에 매듭끈을 감은 노인 — 가 갱목 사이를 걷는다. 입술만 움직인다. 번호가 아니라 이름을 센다. 감독 앞에서는 하지 않는 일이다. 막장 입구에서는 그락스가 점호 패를 이빨로 문 채 수레를 센다.

      서쪽 갱도 끝에서 에디크가 마지막 수레를 채운다. 스물, 같은 슬래그 비탈의 굴에서 자란 네 단짝. 그가 등잔을 들어 너를 비추고 이를 드러낸다.

      그가 부른다. 번호가 아니라. 이 갱에서 그 이름을 소리 내어 부르는 사람은 그 하나다.
    input: true_name
    input_label: 에디크가 부르는 이름
    input_button: 돌아본다
    input_say: 번호가 아니라 이름을 부른다
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "붉은 먼지 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 붉은 먼지 냄새."}
    trace_lines:
      water: 기침이 터진다. 목 안에 물이 있다. 없다. 갱도 바닥의 물웅덩이는 발목 깊이다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 붉은 먼지뿐이다.
      spear: 옆구리가 시리다. 갱목 모서리에 닿은 자리다. 그럴 것이다.
      blade: 가슴뼈 한가운데가 뜨겁다. 손을 대 보면 꿰맨 자리는 없다.
      rope: 손목이 쓸린다. 밧줄 자국은 없다. 발목의 쇠고리 자국뿐이다.
      hunger: 배가 꼬인다. 아니다 — 교대가 끝나면 검은 빵 창구가 열린다.
      fall: 등에 돌의 무게가 있다. 없다. 천장은 아직 숨을 쉬지 않았다.
    return_ink: |
      ┊ 그 다음엔 천장이 숨을 다 쉬었다. 서쪽 갱도가 무너졌고, 에디크가 그 밑에 있었다.
    after_input: |
      "{name}! 종 치기 전에 올라가면 이다 아줌마가 한 조각 더 준대. 어제 그랬어."

      그때 천장이 숨을 쉰다.

      오래된 광부들만 아는 소리다. 갱목 하나가 길게 운다. 머리 위 어딘가에서 모래가 흐른다 — 가늘게, 끊기지 않고. 하로의 입술이 멈춘다. 얀이 코를 훌쩍이다 만다.
    effects: ["var o2_name_called = true", "bond npc_o2_edik 8", "note 진짜 이름 — {name}. 갱에서 그 이름을 소리 내어 부르는 사람은 에디크 하나다. 크릭과 용인은 너를 이백열둘이라 부른다"]
    choices:
      - id: freeze
        label: 숨을 멈추고 천장을 올려다본다
        minutes: 0
        text: ""
        effects: []
      # ── ◈ 두 번째 회차부터: 천장보다 먼저 ──
      - id: mem_shout_first
        needs_memory: loop
        label: '"엎드려!" — 천장이 숨을 다 쉬기 전에, 에디크의 허리띠를 잡아챈다'
        minutes: 0
        text: ""
        effects: ["then o2_cavein_early"]
    next: o2_cavein_hand

  - id: o2_cavein_hand
    origin: ashfire_slave
    text: |
      네가 "엎드려!"라고 외치기도 전에 서쪽 갱도가 무너진다.

      소리는 나중에 온다. 먼저 바람이 — 등잔 불을 모조리 눕히는 바람이 — 오고, 그다음에 돌이 온다. 붉은 먼지가 등잔 빛을 삼킨다. 입 안이 쇳가루다.

      먼지 속에서 하로가 이름을 부른다. 하나씩, 서른. 대답이 하나씩 돌아온다. 하로의 목소리가 한 이름에서 두 번 멈춘다. "에디크." 대답이 없다.

      먼지가 가라앉는다. 돌무더기 위로 셋째 갱목 기둥이 꺾여 있다. 속이 검다. 썩었다. 돌무더기 틈으로 손 하나가 나와 있다. 에디크의 손이다. 손가락이 움직인다.

      등 뒤에서 등잔 하나가 높이 들린다. 그락스 — 붉은 계단의 총감독관, 공급 명단을 고르는 크릭 — 가 무너진 벽 너머를 본다. 에디크가 아니라. 돌이 쏟아진 자리에 녹 빛 줄기가 벽을 타고 내려간다. "광맥! 붉은 철이다!" 그의 목소리가 처음으로 갈라진다. "오늘 할당 못 채운 번호는 흑점이다. 파라. 저기를." 손가락이 광맥을 가리킨다.

      점호 마당 번호판, 네 번호 옆에는 숯 점이 이미 셋이다. 오늘 새벽 그락스는 공급 명단의 번호 셋을 불렀다 — 하층 공방으로 내려간 번호들. 네 번호는 아직 불리지 않았다. 아직은.

      에디크의 손을 보는 순간, 다른 손이 겹쳐 보인다. 붉은 흙을 바른 손. 지금 네 허리춤에 감긴 이 매듭을 처음 묶던 손. 너는 그 손의 굳은살 자리까지 안다 — 왼손 엄지, 두 겹. 네 손이 아니었다. 그런데 네 안에서 그 손이 기억난다. 이백열두 해 전, 이 언덕에서 이 매듭을 처음 묶던 여자의 손. 허리춤의 매듭끈이 뜨겁다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["learn fact_o2_dara_hands", "learn fact_o2_west_drift", "var o2_edik_known = true", "note 낙엽월 첫날 교대 종 직전, 중층 4번 막장 서쪽 갱도 낙반 — 셋째 갱목 기둥이 썩어 있었다. 에디크가 돌 밑에 있다. 그락스는 드러난 붉은 광맥을 파라고 한다"]
    choices:
      - id: dig_hands
        label: 맨손으로 돌을 들어낸다 — 에디크의 손을 향해
        minutes: 120
        check: {skill: 싸움, D: 18, helps: [iron_body, strong_bones, pain_tolerance]}
        success:
          text: |
            돌 하나, 돌 하나. 손톱이 먼저 나가고, 다음에 손바닥이 갈라진다. 뒤에서 그락스가 무언가를 외친다. 너는 듣지 않는다.

            에디크가 나온다. 왼다리가 무릎 아래에서 이상한 쪽을 보고 있다. 그래도 웃는다 — 웃는 얼굴이 하얗다. "늦었잖아."

            그락스가 패에 이빨 자국을 하나 더 낸다. "이백열둘. 흑점." 하로가 아무 말 없이 에디크의 다리에 갱목 쪼가리를 대고 묶는다. 묶으면서 너를 본다. 오래.
          effects: ["var o2_edik_saved = true", "var o2_edik_hurt = true", "var o2_black_marks += 1", "pain 15", "fatigue 15", "rel npc_haro trust 10", "rel npc_o2_edik like 10", "rel npc_o2_edik trust 10", "bond npc_o2_edik 6", "temper 용기 4", "temper 자비 4", "memory npc_grax 위험함 이백열둘이 광맥 대신 돌무더기를 팠다", "note 에디크를 파냈다 — 왼다리가 부서졌다. 숯 점 넷. 새벽 점호에서 그락스의 손가락이 멈출 것이다"]
        failure:
          text: |
            셋째 돌을 들어 올리는 순간 천장이 한 번 더 숨을 쉰다. 이번엔 짧게. 무너진 자리 위로 돌이 다시 쏟아지고, 하나가 네 왼팔을 문다.

            하로의 손이 네 뒷덜미를 잡아 끌어낸다. 먼지가 가라앉았을 때, 돌 틈의 손은 움직이지 않는다. 하로가 거기에 손바닥을 한 번 댄다. 그것이 그의 인사다.

            그락스는 패에 이빨 자국을 낸다. "이백열둘. 흑점." 붉은 교대가 내려와 돌을 치우기 시작한다. 자정은 넘어야 할 것이다.
          effects: ["pain 25", "var o2_black_marks += 1", "var o2_edik_dead = true", "agenda kill npc_o2_edik", "stress 15", "temper 용기 3", "rel npc_haro trust 5", "note 에디크 — 두 번째 낙반. 손이 멈췄다. 숯 점 넷"]
      - id: haro_props
        label: '하로에게 외친다 — "갱목! 같이 받치고 같이 파요!"'
        minutes: 90
        check: {skill: 손재주, D: 16, helps: [engineer, command]}
        success:
          text: |
            하로가 한 번 고개를 끄덕인다. 그것으로 충분하다. 갱조 서른이 곡괭이를 내려놓고 갱목을 든다. 넷째 기둥 자리에 새 갱목이 박히고, 천장이 숨을 고른다. 넷이 돌을 들어내고 넷이 받친다. 얀이 코를 훌쩍이며 먼지 쪽을 가리킨다. 거기는 아니라고.

            에디크가 나온다. 왼다리가 무릎 아래에서 꺾였다. "너희 다 미쳤어." 그가 웃는다.

            그락스가 광맥과 갱조 서른을 번갈아 본다. 서른을 한꺼번에 흑점으로 할 수는 없다. "반장. 흑점." 하로가 대답한다. "예."
          effects: ["var o2_edik_saved = true", "var o2_edik_hurt = true", "var o2_solidarity = true", "var em_signs += 1", "rel npc_haro trust 15", "rel npc_yan_nose like 5", "rel npc_o2_edik like 8", "temper 용기 3", "memory npc_grax 위험함 하로의 갱조가 광맥 앞에서 곡괭이를 내려놓았다", "memory npc_haro 용감함 이백열둘이 갱조를 불러 에디크를 함께 팠다", "note 하로의 갱조가 함께 에디크를 파냈다 — 왼다리가 부서졌다. 그락스는 하로에게 흑점을 줬다"]
        failure:
          text: |
            갱목 하나가 젖은 바닥에서 미끄러진다. 받치던 하로의 어깨로 돌이 내려앉는다. 하로는 소리를 내지 않는다. 갱조가 다시 받친다. 더 느리게.

            에디크가 나온다. 왼다리가 무릎 아래에서 꺾였다. 그락스의 손가락이 너를 가리킨다. "외친 번호. 흑점."
          effects: ["var o2_edik_saved = true", "var o2_edik_hurt = true", "var o2_black_marks += 1", "pain 10", "rel npc_haro trust 5", "note 에디크를 파냈다 — 왼다리가 부서졌다. 외친 값으로 숯 점 넷"]
      - id: bribe_shard
        when: ["var o2_shard == true"]
        label: 소매 속 흑요석을 그락스의 손에 쥐여 준다 — "용의 눈물입니다. 오늘만."
        minutes: 90
        check: {skill: 화술, D: 10, helps: [haggle, merchant]}
        success:
          text: |
            그락스가 검은 유리를 이빨로 깨문다. 크릭들은 그것을 용의 눈물이라 부르고 부적으로 산다. 그의 입가가 씰룩인다. "…오늘만이다." 패를 다시 문다.

            갱조가 돌을 들어낸다. 에디크가 나온다. 왼다리가 무릎 아래에서 꺾였다. 소매가 가볍다.
          effects: ["var o2_shard = false", "var o2_shard_gone = true", "var o2_edik_saved = true", "var o2_edik_hurt = true", "rel npc_grax like 5", "memory npc_grax 영리함 이백열둘이 용의 눈물을 쥐고 있었다", "note 흑요석을 그락스에게 줬다 — 에디크를 파냈다. 왼다리가 부서졌다"]
        failure:
          text: |
            그락스가 유리를 받아 들고 등잔에 비춘다. 날이 선 쪽을. "날을 숨겨 다니는 번호." 유리는 그의 주머니로 들어간다. 돌려주지 않는다. "흑점. 그리고 이건 초소에 말해 두지."

            그락스가 바구니로 올라간 뒤, 하로의 갱조가 남아 돌을 들어낸다. 에디크가 나온다. 왼다리가 무릎 아래에서 꺾였다.
          effects: ["var o2_shard = false", "var o2_shard_gone = true", "wanted 1 흑요석 날을 숨겨 다녔다", "var o2_black_marks += 1", "var o2_edik_saved = true", "var o2_edik_hurt = true", "note 흑요석을 빼앗겼다 — 초소에 날을 숨겼다는 말이 들어갔다. 숯 점 넷"]
      - id: collar_grax
        label: 그락스의 멱살을 잡는다 — "저건 사람이다."
        minutes: 60
        check: {skill: 위압, D: 16, helps: [menace, command]}
        success:
          text: |
            그락스의 패가 이빨에서 떨어진다. 크릭의 몸이 먼저 안다 — 강한 쪽 앞에서는 허리가 꺾인다. 그는 꺾인 허리를 펴지 못한 채 뒷걸음질 친다. "…파 봐라." 목소리가 낮아진다. 강한 상대 앞에서처럼. "번호는 기억해 두지."

            갱조가 돌을 들어낸다. 에디크가 나온다. 왼다리가 무릎 아래에서 꺾였다. 바구니로 올라가는 그락스의 등이 한 번도 돌아보지 않는다.
          effects: ["var o2_edik_saved = true", "var o2_edik_hurt = true", "nemesis npc_grax 1", "memory npc_grax 위험함 이백열둘이 멱살을 잡았다", "rel npc_haro trust 8", "temper 용기 6", "note 그락스의 멱살을 잡았다 — 에디크를 파냈다. 그락스는 잊지 않는다"]
        failure:
          text: |
            그락스가 호루라기를 분다. 크릭 감독 둘이 바구니에서 내려온다. 권양탑 아래 처벌 기둥, 채찍 열. 셋째에서 너는 세기를 그만둔다.

