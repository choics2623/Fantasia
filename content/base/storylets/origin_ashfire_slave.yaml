  # 하로는 저녁마다 굴 입구에서 매듭끈을 묶는다 (routines 18:30~20:00). 첫 밤엔 늦게까지 앉아 있다 (stage).
  - id: o2_knot_lesson
    origin: ashfire_slave
    trigger: {window: {from: "312-09-01 19:30", to: "312-09-01 23:30"}, at: em_burrow_black, with: npc_haro, when: ["var o2_edik_dead != true"]}
    stage:
      - {npc: npc_haro, at: em_burrow_black, from: "20:00", to: "23:30", doing: 굴 입구 등잔 아래 앉아 매듭끈을 엄지로 훑는다}
    text: |
      숯막. 슬래그 비탈에 판 굴들이 층층이 어둡다. 굴 입구마다 구리 목걸이 번호 — 네 굴의 문패는 이백열둘.

      하로가 굴 입구 등잔 아래 앉아 손목의 끈을 푼다. 갱조의 끈. 낙반으로 사라진 사람마다 매듭이 하나다. 그는 그것을 할머니가 감아 준 부적이라고 말한다. 갱조 서른은 모두 그 말을 믿는 척한다.

      그가 네 허리춤을 턱으로 가리킨다. "그거. 네 어미 것이지. 이리 줘 봐."

      다라의 매듭끈. 매듭 하나가 노래 한 줄이라고, 숯막의 어미들은 말했다. 글이 아니어서 재의 법에 걸리지 않는다. 너는 그 끈을 다섯 해 동안 차고 다녔지만 한 줄도 읽어 본 적이 없다.

      하로의 엄지가 첫 매듭을 누른다. "첫 줄. '붉은 흙을 손에 바르고.'" 엄지가 둘째 매듭으로 간다. 그리고 덧붙인다. 지나가는 말처럼. "내일 새벽 칼렙이 너를 보자더라. 9번 갱 벽 앞에서. 손을 보자고."
    choices:
      - id: read_ahead
        label: 하로보다 먼저 둘째 줄을 읊는다
        minutes: 30
        text: |
          "'벽에 손을 두고.'"

          하로의 엄지가 멈춘다. 등잔 심지가 한 번 튄다. 그는 셋째 매듭으로 가지 않는다. 너를 본다.

          "누가 가르쳤냐." 대답을 기다리지 않는다. "네 어미는 첫 줄밖에 몰랐다. 끈을 감아 준 할미도." 그는 끈을 네 손에 돌려준다. 손을 떼지 않는다. 한참. "셋째 줄은 뭐냐."

          너는 안다. '다 셀 때까지 떼지 마라.' 하로의 손이 네 손 위에서 무거워진다.
        effects: ["var o2_knot_read = true", "var o2_haro_watching = true", "learn fact_o2_cord_lines", "rel npc_haro trust 8", "memory npc_haro 이상함 이백열둘이 배운 적 없는 매듭을 읽었다", "note 다라의 매듭끈 — '붉은 흙을 손에 바르고 / 벽에 손을 두고 / 다 셀 때까지 떼지 마라.' 하로보다 먼저 읽었다"]
      - id: ask_count
