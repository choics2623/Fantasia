  - id: o2_krom_hunt
    origin: ashfire_slave
    trigger: {window: {from: "312-09-02 05:00", to: "312-10-30 23:00"}, at: "@ember_mines", with: npc_krom_ironeye, when: ["var o2_cradle_escaped == true", "var o2_hunt_done != true"]}
