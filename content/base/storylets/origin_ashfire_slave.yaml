  # ◈ 두 번째 회차부터 — 천장보다 먼저 외친 저녁 (회귀점 화면 둘의 다른 갈래)
  - id: o2_cavein_early
    origin: ashfire_slave
    text: |
      "엎드려!"

      네 목소리가 천장보다 먼저 나간다. 손이 에디크의 허리띠를 잡아챈다. 둘이 함께 바닥에 구른다 — 그리고 서쪽 갱도가 무너진다. 방금 에디크가 서 있던 자리에.

      붉은 먼지가 등잔 빛을 삼킨다. 먼지 속에서 하로가 이름을 부른다. 하나씩, 서른. 서른 개의 대답이 돌아온다. 에디크의 대답은 네 귀 바로 옆에서, 기침과 웃음이 반씩 섞여서 나온다. "…{name}, 너 방금…"

      먼지가 가라앉는다. 무너진 자리에 셋째 갱목 기둥이 꺾여 있다. 속이 검다. 그 너머로 녹 빛 줄기가 벽을 타고 내려간다. 그락스가 등잔을 높이 든다. "광맥! 붉은 철이다!" 그리고 그는 광맥이 아니라 너를 본다. 천장보다 먼저 외친 번호를.

      하로도 너를 본다. 얀이 코를 훌쩍인다. 갱조 서른이 모두 너를 본다.

      네 손은 아직 에디크의 허리띠를 쥐고 있다. 그 손 위로 다른 손이 겹쳐 보인다. 붉은 흙을 바른 손. 네 허리춤의 이 매듭을 처음 묶던 손 — 왼손 엄지에 굳은살이 두 겹. 이백열두 해 전, 이 언덕에서. 허리춤의 매듭끈이 뜨겁다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["learn fact_o2_dara_hands", "learn fact_o2_west_drift", "var o2_edik_known = true", "var o2_edik_saved = true", "var o2_shouted_first = true", "rel npc_o2_edik like 6", "note 이번엔 천장보다 먼저 외쳤다 — 에디크는 돌 밑에 없다. 갱조 서른이 그것을 보았다"]
    choices:
      - id: lie
        label: '"모래 흐르는 소리를 들었어요. 다들 들었잖아요."'
        minutes: 60
        check: {skill: 기만, D: 14, helps: [actor, deceit]}
        success:
          text: |
            얀이 먼저 고개를 끄덕인다. 훌쩍. "…달았어. 냄새가." 하로가 갱목을 손바닥으로 친다. "그래. 모래 소리. 다들 들었다." 그는 그렇게 말하고 너를 오래 본다. 다들 듣지 못했다는 것을, 하로는 안다.

            그락스는 패를 깨문다. 광맥이 더 급하다. 갱조는 교대 종이 지나도록 붉은 철을 판다.
          effects: ["var o2_haro_watching = true", "rel npc_haro trust 5", "rel npc_yan_nose like 4", "fatigue 15", "note 모래 소리였다고 했다. 얀이 거들었다. 하로는 믿지 않는 얼굴로 믿어 주었다"]
        failure:
          text: |
            아무도 고개를 끄덕이지 않는다. 그락스가 패를 문 채 웃는다. 가늘게. "모래 소리라." 그는 너를 숫자처럼 오래 본다. "하층에서는 그런 귀를 좋아하지. 귀가 좋은 번호는 값이 다르거든."
          effects: ["echo_sign 1 천장보다 먼저 외쳤다", "memory npc_grax 이상함 이백열둘이 천장보다 먼저 알았다", "var o2_grax_eye = true", "fatigue 15", "note 그락스가 천장보다 먼저 외친 번호를 외웠다"]
      - id: blame_yan
        label: '"얀이 먼저 냄새를 맡았어요."'
        minutes: 30
        text: |
          얀의 얼굴이 하얘진다. 훌쩍이다 만다. 그락스의 눈이 너에게서 얀에게로 옮겨 간다. 천천히, 숫자를 옮겨 적듯이.

          그날 밤 숯막 쇠문의 빗장이 열린다. 쇠눈 크롬이 얀의 굴 앞에서 침을 삼킨다. 얀은 코를 훌쩍이며 따라간다. 아무 말도 하지 않는다. 너를 보지도 않는다.
        effects: ["var o2_yan_blamed = true", "agenda capture npc_yan_nose at em_cradle_ward", "deed inform", "temper 정직 -6", "temper 자비 -8", "stress 12", "rel npc_haro trust -10", "note 얀의 이름을 댔다 — 그날 밤 쇠눈 크롬이 얀을 하층 공방으로 데려갔다"]
      - id: dig_vein_now
        label: 아무 말도 하지 않는다 — 광맥 앞에 곡괭이를 든다
        minutes: 120
        text: |
          그락스는 오래 보지 않는다. 광맥이 더 급하다. 그러나 등 뒤에서 갱조의 눈이 떨어지지 않는다. 숨을 고를 때마다, 곡괭이를 고쳐 쥘 때마다.

          교대 종이 지나도록 붉은 철을 판다. 올라오는 바구니 안에서 아무도 네 옆에 서지 않는다. 에디크만 빼고.
        effects: ["echo_sign 1 천장보다 먼저 외쳤다", "fatigue 20", "rel npc_grax like 3", "rel npc_o2_edik trust 6", "note 천장보다 먼저 외친 저녁 — 갱조가 그것을 본 눈이 떨어지지 않는다"]

