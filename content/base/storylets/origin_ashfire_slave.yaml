  - id: o2_knot_for_edik
    origin: ashfire_slave
    trigger: {window: {from: "312-09-01 19:30", to: "312-09-01 23:30"}, at: em_burrow_black, with: npc_haro, when: ["var o2_edik_dead == true"]}
    text: |
      숯막. 굴 입구 등잔 아래 하로가 손목의 끈을 푼다. 갱조의 끈. 낙반으로 사라진 사람마다 매듭이 하나다 — 그는 그것을 할머니가 감아 준 부적이라고 말한다.

      마흔하나. 그가 마흔둘째를 묶는다. 천천히, 이빨로 끝을 당겨서. 매듭에는 이름이 없다. 이름은 하로가 외운다.

      "에디크." 그가 말한다. 끈에게.

      옆 굴, 이백열셋 호의 문이 열려 있다. 짚 한 단이 그대로다. 하로가 너를 본다. "내일 새벽 칼렙한테 가라. 9번 갱 벽 앞. 손을 보자더라."
    choices:
      - id: hold
        label: 끈의 끝을 잡아 준다
        minutes: 20
        text: |
          하로가 끈을 당긴다. 네 손가락이 매듭 안에 한 번 갇혔다가 빠진다. 매듭이 단단해진다. "잘 잡는군." 그가 말한다. 그것이 오늘 그가 너에게 한 가장 긴 말이다.
        effects: ["rel npc_haro like 5", "rel npc_haro trust 3", "stress -5"]
      - id: say_name
        label: '"에디크." — 소리 내어 부른다'
        minutes: 10
        text: |
          네 목소리가 숯막의 층층을 타고 올라간다. 위의 굴에서 누가 따라 부른다. "에디크." 그 위에서 또. 이름이 비탈을 다 올라갈 때까지 하로는 매듭에서 손을 떼지 않는다.

          이제 이 갱에서 네 이름을 소리 내어 부르는 사람은 없다. 너는 그 이름 대신 그의 이름을 부른다.
        effects: ["temper 용기 2", "stress -8", "rel npc_haro trust 4", "memory npc_haro 정직함 이백열둘이 에디크의 이름을 소리 내어 불렀다", "note 숯막이 에디크의 이름을 불렀다"]
      - id: confess
        when: ["var o2_dug_vein == true"]
        label: '"광맥을 팠어요. 손가락이 움직이는 걸 봤는데."'
        minutes: 10
        text: |
          하로가 매듭을 다 묶을 때까지 대답하지 않는다. 그리고 끈을 손목에 감으며 말한다. "알아. 나도 봤다." 한 박자. "나도 광맥 앞에 서 있었다. 서른 해 동안."

          그는 일어나 굴로 들어간다. 등잔은 두고 간다.
        effects: ["temper 정직 5", "rel npc_haro trust 8", "stress 5", "memory npc_haro 정직함 이백열둘이 광맥을 판 것을 제 입으로 말했다"]
      # ── ◈ ──
      - id: mem_next
        needs_memory: fact:fact_o2_west_drift
        label: '"셋째 기둥이었어요. 다음엔 — "'
        minutes: 10
        text: |
          하로의 이빨이 매듭 끝에서 멈춘다. "다음?" 그가 너를 본다. 갱에 다음은 없다. 매듭은 한 사람에 하나다. 그는 그 말을 하지 않는다. 대신 오래 본다. 처음 보는 사람을 보듯이.
        effects: ["var o2_haro_watching = true", "memory npc_haro 이상함 이백열둘이 '다음'을 말했다", "echo_sign 1 다음 낙반을 아는 것처럼 말했다"]
      - id: turn_away
        label: 굴 안으로 들어간다
        minutes: 10
        text: |
          짚 위에 눕는다. 옆 굴에서 코 고는 소리가 나지 않는다. 밖에서 하로가 이빨로 매듭 끝을 당기는 소리가 한 번 더 들린다.
        effects: ["stress 8", "rel npc_haro like -3"]

  # ───────────────────────── 둘째 날 — 에디크의 다리 ─────────────────────────
  - id: o2_edik_leg
    origin: ashfire_slave
    trigger: {window: {from: "312-09-02 05:00", to: "312-09-02 12:00"}, at: em_roll_yard, when: ["var o2_edik_hurt == true", "alive npc_o2_edik", "var o2_edik_taken != true"]}
    severity: 3
    text: |
      새벽 점호. 횃불 둘 아래 번호판. 하로의 갱조가 줄을 선다 — 서른.

      에디크가 한 발로 선다. 왼다리는 무릎 아래가 갱목 쪼가리에 묶였고, 발끝이 이상한 쪽을 본다. 그래도 그는 줄에 있다. 서 있는 동안은 갱조다.

      크라즈 — 검은 손톱 지부장, 앞니 하나가 금인 크릭 — 가 단상에서 내려온다. 채찍 손잡이로 에디크의 무릎을 툭 친다. 에디크가 소리를 삼키고 웃는다. 웃는 얼굴이 하얗다.

      "못 서는 번호는 병동이다." 크라즈의 손가락이 서열을 센다. 위, 위, 아래. "병동은 위에서 고르지. 목록이 그렇다."
    choices:
      - id: carry
        label: '"제가 메고 내려갑니다. 몫도 제가 팝니다."'
        minutes: 10
        text: |
          크라즈의 금니가 횃불에 번쩍인다. "몫을 두 번 판다? 물은 한 번만 마시면서?" 그는 값을 안다. 너도 안다. "네 물 몫, 이레. 그럼 이 번호는 서 있는 걸로 하지."

          에디크가 네 어깨에 팔을 건다. 무겁다. 바구니까지 서른 걸음. 그는 걸음마다 농담을 하나씩 한다. 스물아홉째에서 농담이 끊긴다.
        effects: ["var o2_edik_carried = true", "hunger 1", "fatigue 30", "rel npc_o2_edik trust 10", "bond npc_o2_edik 6", "rel npc_kraz like 3", "temper 자비 4", "note 에디크의 몫까지 판다 — 물 몫 이레가 크라즈에게 간다"]
      - id: haro
        when: ["var o2_solidarity == true"]
        label: 하로를 본다 — 갱조가 나눠 지자고
        minutes: 10
        text: |
          하로가 한 걸음 나선다. "갱조가 몫을 나눕니다." 짧은 존대. 눈은 바닥에.

          "서른이 스물아홉의 몫을?" 크라즈가 웃는다. 그리고 갱조 서른의 얼굴을 하나씩 본다. 아무도 눈을 피하지 않는다. 크라즈의 엄지가 채찍 손잡이를 두 번 문지른다. "…목록이 그렇다면."
        effects: ["var o2_edik_carried = true", "var em_signs += 1", "rel npc_haro trust 5", "rel npc_o2_edik trust 8", "memory npc_kraz 위험함 하로의 갱조가 한 몸으로 섰다", "note 하로의 갱조가 에디크의 몫을 나눠 진다"]
      - id: ward
        label: 에디크를 병동으로 보낸다 — 웨나에게
        minutes: 15
        text: |
          "괜찮아." 에디크가 먼저 말한다. "병동은 따뜻하대. 누워서 하늘 얘기나 하지 뭐."

          검은 폐 막사의 웨나가 그를 받는다. 젖은 손으로 다리를 만져 보고, 숨을 쉬어 보라고 한다. 그리고 너를 본다. 무언가 말하려다 만다.
        effects: ["var o2_edik_ward = true", "rel npc_o2_edik like -2", "note 에디크 — 검은 폐 막사(병동). 요람의 의사가 아침마다 병동의 숨을 고른다"]
      # ── ◈ ──
      - id: mem_wenna_cart
        needs_memory: fact:fact_em_wenna_false_deaths
        label: '병동의 웨나에게 낮게 — "수레 밑판이 두 겹인 거 알아요. 오늘 밤."'
        minutes: 30
        check: {skill: 화술, D: 16, helps: [tongue, liar_nose], warn: ["pknows fact_em_wenna_false_deaths"]}
        success:
          text: |
            웨나의 젖은 손이 멈춘다. 오래. "…누가 말했어." 대답을 기다리지 않는다. "오늘이 둘째 날이니까. 오늘 밤 열병으로 하나가 죽어. 죽었다고 적으면 죽은 거야, 이 병동에선."

            그날 밤 시체 수레가 슬래그 비탈로 나간다. 밑판 아래에서 누가 웃음을 참는다.
          effects: ["var o2_edik_out = true", "agenda kill npc_o2_edik", "rel npc_wenna_ward trust 10", "memory npc_wenna_ward 이상함 처음 보는 광부가 수레 밑판을 안다", "echo_sign 1 수레 밑판을 안다", "note 에디크 — 장부에는 열병 사망. 웨나의 수레 밑판으로 슬래그 비탈에 나갔다. 살아서"]
        failure:
          text: |
            "수레는 비어 있어." 웨나가 말한다. 목소리가 낮고 단단하다. "그리고 너는 여기 온 적 없어." 그녀는 에디크를 침상에 눕힌다. 그것뿐이다.
          effects: ["var o2_edik_ward = true", "note 에디크 — 병동. 웨나는 수레 이야기를 하지 않았다"]
      - id: kraz_water
        needs_fact: fact_em_kraz_water_trade
        label: '크라즈에게 낮게 — "물 장부가 두 권이라는 걸 총감 나리는 모르시죠."'
        minutes: 5
        check: {skill: 위압, D: 16, helps: [menace, interrogator]}
        success:
          text: |
            크라즈의 엄지가 채찍 손잡이 위에서 멈춘다. 금니가 보이지 않는다. "…번호 하나쯤은 서 있는 걸로 하지." 그는 단상으로 돌아간다. 돌아가면서 네 번호를 한 번 더 본다. 외우는 눈이다.
          effects: ["var o2_edik_carried = true", "memory npc_kraz 위험함 이백열둘이 물 장부를 안다", "rel npc_kraz trust -10", "note 크라즈의 물 장부로 에디크를 세웠다. 크라즈가 네 번호를 외웠다"]
        failure:
          text: |
            "물이 필요한가?" 크라즈가 웃는다. 금니. "값은 알지?" 채찍 손잡이가 네 입을 한 번 친다. 에디크는 병동으로 끌려간다.
          effects: ["pain 10", "wanted 1 크라즈의 물 장부를 입에 올렸다", "var o2_edik_ward = true", "note 에디크 — 병동으로 끌려갔다"]

  - id: o2_ward_night
    origin: ashfire_slave
    trigger: {window: {from: "312-09-02 17:00", to: "312-09-02 23:30"}, at: em_infirmary, with: npc_wenna_ward, when: ["var o2_edik_ward == true", "var o2_edik_out != true", "alive npc_o2_edik"]}
    severity: 2
    text: |
      검은 폐 막사. 침상보다 사람이 많다. 기침이 한쪽 끝에서 시작해 다른 끝까지 건너간다.

      에디크는 문가 침상에 누워 있다. 다리 밑에 짚을 괴었다. 너를 보고 웃는다. "왔어? 여기 하늘은 천장에 그려져 있더라. 그을음으로."

      웨나가 침상 사이를 걸으며 숨을 센다. 젖은 손. 에디크의 침상에서 오래 멈춘다. 그리고 낮게, 누구에게도 아니게 말한다. "내일 아침엔 위에서 손이 내려와."
    choices:
      - id: plead
        label: 웨나를 붙잡는다 — "내일 아침 전에. 뭐든."
        minutes: 30
        check: {skill: 화술, D: 18, helps: [tongue, charm], warn: ["var o2_solidarity == true"]}
        success:
          text: |
            웨나가 네 손을 본다. 굳은살. 갈라진 손톱. "…수레는 비어 있어." 그녀가 말한다. "오늘 밤만 빼고. 둘째 날 밤마다 열병으로 하나가 죽지. 밑판이 두 겹이야."

            자정 무렵 시체 수레가 슬래그 비탈로 나간다. 밑판 아래에서 에디크가 웃음을 참는다. 비탈 아래 어둠에서 누가 수레를 받는다.
          effects: ["var o2_edik_out = true", "agenda kill npc_o2_edik", "learn fact_em_wenna_false_deaths", "rel npc_wenna_ward trust 8", "rel npc_o2_edik trust 10", "bond npc_o2_edik 6", "note 에디크 — 장부에는 열병 사망. 웨나의 수레 밑판으로 슬래그 비탈에 나갔다. 살아서"]
        failure:
          text: |
            "죽었다고 적으면 죽은 거야. 이 병동에선." 웨나가 말한다. "살아 있는 사람은 적을 수가 없어." 그녀는 다음 침상으로 간다. 기침 소리를 센다.
          effects: ["stress 6"]
      - id: carry_back
        label: 에디크를 업고 숯막으로 돌아간다 — 내일부터 둘의 몫을 판다
        minutes: 40
        risk: 숯막의 쇠문은 저녁 일곱 시에 잠긴다
        text: |
          에디크가 네 등에서 웃는다. "무거워?" "무거워." 쇠문 앞에서 크릭 하나가 등잔을 든다. 번호 둘. 하나는 업혀 있다. 크릭은 침을 뱉고 등잔을 내린다.
        effects: ["var o2_edik_ward = false", "var o2_edik_carried = true", "goto em_burrow_black", "fatigue 25", "pain 5", "bond npc_o2_edik 6", "note 에디크를 병동에서 데려왔다 — 내일부터 둘의 몫을 판다"]
      - id: sit
        label: 침상 곁에 앉아 하늘 이야기를 듣는다
        minutes: 60
        text: |
          에디크가 노천 붉은 계단 이야기를 한다. 거기서 일하면 하늘이 보인대. 잿비가 오는 날엔 일이 멈춘대. 그가 그락스에게 세 번 빌었던 이야기다.

          웨나가 등잔 심지를 자른다. 기침 소리가 조금 줄어든다. 에디크가 먼저 잠든다.
        effects: ["bond npc_o2_edik 5", "rel npc_o2_edik like 6", "stress -6"]

  - id: o2_edik_taken
    origin: ashfire_slave
    trigger: {window: {from: "312-09-03 08:00", to: "312-09-30 23:00"}, at: "@ember_mines", when: ["var o2_edik_ward == true", "var o2_edik_out != true", "var o2_edik_taken != true", "alive npc_o2_edik"]}
    severity: 4
    text: |
      소문은 승강 바구니를 타고 내려오고, 물탱크 줄을 타고 올라간다.

      오늘 아침 비늘이 하나도 없는 손의 의사가 병동에 내려왔다. 침상 사이를 걸으며 맥을 짚었다. 넷을 골랐다. 넷째는 다리를 절었다고 한다. 끌려가면서 웃었다고 한다.
    effects: ["agenda capture npc_o2_edik at em_cradle_ward", "var o2_edik_taken = true", "note 에디크 — 병동에서 하층 공방(은비늘 요람)으로 끌려갔다"]
    choices:
      - id: to_wenna
        label: 병동으로 간다 — 웨나에게 따진다
        minutes: 30
        text: |
          웨나는 빈 침상의 짚을 갈고 있다. 너를 보지 않는다. "어젯밤이었으면." 그녀가 짚만 보며 말한다. "수레 밑판이 두 겹이야. 둘째 날 밤마다 하나가 열병으로 죽어. 어젯밤이었으면."

          그녀는 그 말을 다시 하지 않는다. 너는 그 말을 잊지 않는다.
        effects: ["learn fact_em_wenna_false_deaths", "stress 10", "goto em_infirmary", "note 웨나 — 시체 수레 밑판이 두 겹. 둘째 날 밤마다. 어젯밤이었으면"]
      - id: follow
        label: 그락스에게 간다 — "같은 감방으로 보내 주십시오."
        minutes: 30
        risk: 하층 공방에서 올라온 번호는 없다
        text: |
          그락스가 점호 패를 이빨에서 뗀다. 처음으로 너를 숫자 이외의 것으로 본다 — 숫자가 하나 더 생긴 것으로. "자원?" 그가 웃는다. "자원은 값이 안 나와. 그래도 명단은 늘 모자라지."

          네 번호 옆에 숯 대신 손톱자국이 하나 난다. 오늘 밤이다.
        effects: ["var o2_listed = true", "temper 용기 5", "temper 충성 6", "stress 8", "note 스스로 공급 명단에 올랐다 — 오늘 밤 쇠눈 크롬이 온다. 에디크가 거기 있다"]
      - id: knot
        label: 하로를 찾아간다 — 끈에 매듭을 묶어 달라고
        minutes: 20
        text: |
          하로는 끈을 풀지 않는다. "하층으로 간 번호는 매듭이 안 된다." 그가 말한다. "죽은 게 아니니까. 아직은." 그는 끈 대신 네 손목을 한 번 쥔다. 세게.
        effects: ["rel npc_haro trust 4", "stress -4"]

  # ───────────────────────── 흑점 넷 — 하층의 호명 ─────────────────────────
  - id: o2_lower_call
    origin: ashfire_slave
    trigger: {window: {from: "312-09-02 05:00", to: "312-10-30 23:00"}, at: em_roll_yard, when: ["var o2_black_marks >= 4", "var o2_listed != true", "var o2_cradle_escaped != true"]}
    severity: 4
    text: |
      새벽 점호. 번호판 앞에 횃불 둘. 크라즈가 단상에서 갱조 번호를 훑고, 그 옆에서 그락스가 점호 패의 모서리를 이빨로 문다.

      번호를 다 부르고 나서 그락스가 손가락을 든다. 허공을 짚는다. 하나, 둘, 셋. 손가락이 번호판의 한 줄에서 멈춘다. 숯 점이 넷.

      "이백열둘." 패를 문 채로. "공급."

      그락스는 그 낱말만 쓴다. 광부들은 하층 공방이라 부르고, 위에서는 은비늘 요람이라 부른다. 명단에 오른 번호는 그날 밤 쇠눈 크롬이 굴에서 데려간다. 올라온 번호는 없다.

      줄 어딘가에서 하로의 입술이 움직인다. 번호가 아니라 이름이다.
    choices:
      - id: other_number
        label: 그락스에게 낮게 — "한 놈 대신 한 놈. 이백아홉 굴의 기침쟁이."
        minutes: 10
        text: |
          그락스의 눈이 가늘어진다. 그는 그 거래를 안다. 자기가 만든 말이다. "명단은 맞으면 되지." 엄지에 침을 묻혀 네 번호 옆 숯 점 하나를 문지른다. 그리고 패에 다른 번호를 새긴다.

          그날 밤 이백아홉 굴의 기침 소리가 멎는다. 하로는 듣지 못했다. 그러나 저녁에 그 굴 앞에서 매듭을 하나 묶는다. 너를 보지 않는다.
        effects: ["var o2_black_marks = 3", "var o2_lower_averted = true", "deed inform", "temper 자비 -8", "temper 충성 -4", "stress 15", "rel npc_haro trust -8", "memory npc_grax 영리함 이백열둘은 번호를 댈 줄 안다", "note 이백아홉 — 네가 댄 번호. 그날 밤 그 굴의 기침이 멎었다"]
      - id: haro_share
        when: ["var o2_solidarity == true"]
        label: 하로를 본다 — 갱조가 숯 점을 나눠 지자고
        minutes: 10
        text: |
          하로가 줄에서 한 걸음 나온다. "갱조가 나눕니다. 숯 넷을 서른이." 짧은 존대. 눈은 바닥에.

          "서른이?" 그락스가 패를 입에서 뗀다. 갱조 서른의 얼굴이 횃불 아래 있다. 아무도 눈을 피하지 않는다. 그락스는 숫자를 안다. 서른이 한꺼번에 흔들리면 할당이 흔들린다. "…이번 주 할당, 서른 몫에 한 수레씩 더."

          그날부터 갱조는 한 수레씩 더 판다. 아무도 네게 그 말을 하지 않는다.
        effects: ["var o2_black_marks = 3", "var o2_lower_averted = true", "var em_signs += 1", "fatigue 20", "rel npc_haro trust 6", "memory npc_grax 위험함 하로의 갱조가 공급을 막았다", "note 하로의 갱조가 흑점을 나눠 졌다 — 이번 주 서른 몫에 한 수레씩 더"]
      - id: supply_pays
        needs_fact: fact_eh_grax_supply_pays
        label: 그락스의 귀에 — "한 머리에 동화 두 닢. 하드리안 나리는 그 값을 아십니까?"
        minutes: 5
        check: {skill: 위압, D: 14, helps: [menace, interrogator]}
        success:
          text: |
            패가 그락스의 이빨에서 떨어진다. 그는 줍지 않는다. 입가가 씰룩인다. 겁이 날 때 더 심해지는 버릇이다. "…숯이 번졌군." 엄지가 네 번호 옆을 문지른다. 점 하나가 회색 얼룩이 된다.

            그는 너를 다시 보지 않는다. 그게 더 나쁘다는 것을 너는 안다.
          effects: ["var o2_black_marks = 3", "var o2_lower_averted = true", "nemesis npc_grax 1", "memory npc_grax 위험함 이백열둘이 공급의 값을 안다", "note 그락스 — 공급 값으로 숯 점을 지웠다. 그는 잊지 않는다"]
        failure:
          text: |
            그락스가 웃는다. 가늘고 날카롭게. "하드리안 나리?" 그가 크라즈를 돌아본다. "이 번호가 나리 이름을 안다는군." 처벌 기둥. 열.

            "이백열둘. 공급. 첫째 줄."
          effects: ["pain 25", "var o2_listed = true", "note 공급 명단 첫째 줄 — 오늘 밤 쇠눈 크롬이 온다"]
      - id: flee
        label: 줄 끝에서 빠져나간다 — 폐갱으로
        minutes: 30
        risk: 점호 마당 한가운데다
        check: {skill: 은신, D: 16, helps: [shadow_step, evade_track]}
        success:
          text: |
            횃불 둘 사이에는 그림자가 셋 있다. 너는 셋째 그림자에 선다. 그리고 거기 없다.

            슬래그 비탈, 썩은 지지대, 묻힌다는 소문이 지키는 폐갱. 다라의 굴. 안쪽 깊은 데서 기름 냄새가 난다. 오늘 밤 그락스의 명단은 다른 번호로 채워질 것이다. 누구의 번호일지, 너는 생각하지 않으려 한다.
          effects: ["goto em_old_cave", "var o2_hiding = true", "var o2_lower_averted = true", "temper 자비 -3", "note 폐갱에 숨었다 — 그락스의 명단은 다른 번호로 채워진다"]
        failure:
          text: |
            횃불이 돈다. 크릭 감독 하나가 네 뒷덜미를 잡는다. 그락스가 패를 문 채 웃는다. "도망치는 숫자는 먼저 센다."
          effects: ["pain 15", "var o2_listed = true", "note 공급 명단 — 도망치다 잡혔다. 오늘 밤이다"]
      - id: step_forward
        label: 앞으로 나선다
        minutes: 10
        text: |
          번호판까지 일곱 걸음. 그락스가 패에 이빨 자국을 하나 더 낸다. 크라즈는 벌써 다음 갱조를 본다.

          돌아서는 너를 하로가 본다. 그의 입술이 한 번 더 움직인다. 이름이다. 오늘 밤까지 남은 시간을 너는 세지 않으려 한다.
        effects: ["var o2_listed = true", "stress 10", "note 공급 명단 — 오늘 밤 쇠눈 크롬이 요람의 경비와 굴에 온다"]

  - id: o2_lower_again
    origin: ashfire_slave
    trigger: {window: {from: "312-09-02 05:00", to: "312-10-30 23:00"}, at: em_roll_yard, when: ["var o2_black_marks >= 4", "var o2_lower_averted == true", "var o2_listed != true", "var o2_cradle_escaped != true"]}
