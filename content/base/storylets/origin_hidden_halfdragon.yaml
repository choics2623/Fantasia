# 숨겨진 반용 (O-11 origin.hidden_halfdragon) — 회귀점의 대본 장면과 첫 열흘. 출신 정의: creation/origins_hidden_halfdragon.yaml
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 진짜 이름 (이 삶에서는 늙은 요리장 헤름만 안다). {lang:용언|…} = 용언 (스킬만큼 보인다).
#
#   o11_stairs_open    회귀점 — 낙엽월 1일 20:00, 화염문 저택 하인 계단. 등뼈를 따라 비늘 셋 (이름 입력)
#   o11_stairs_crisis  둘째 화면 — 루칸의 연회, 헤름의 얼굴, 그리고 잔향의 각성 (SCENARIOS 선택 여섯 + ◈ + 시킨 대로)
#   o11_study          생부의 장부 방 (둘째 화면 '위층으로'의 성공) — 통행증과 금화 두 닢, '장부의 한 줄'
#   o11_cast_out_dawn  9.2 04:30 — 통행증을 받았으면 북문으로 (헤름의 꾸러미 · 그레타의 전갈)
#   o11_spit_dawn      9.2 06:00 — 「부지깽이 손」: 루칸이 부엌에 내려온다
#   o11_ana_words      9.2~ 밤 — 「아나의 마지막 말」 (둘째 화면에서 듣지 못했으면 헤름이)
#   o11_hunt_old · o11_hunt_you · o11_hunt_wash   9.3 21:00 — 「루칸의 사냥」. 사냥감은 헤름, 너(루칸의 눈이 둘 이상), 또는 헤름을 숨겼으면 그레타
#   o11_benno_hearth · o11_ash_refuge → o11_benno_talk   「아나의 등잔」 — 재받이의 베노 (SCENARIOS의 '세 번째 우물' → 재받이 하수 분기점)
#   o11_kaspar_blood   까마귀 문 — 「두 반비늘」 (이 출신에게는 kaspar_warning 대신 열린다)
#   o11_dir_plucked · o11_dir_neckcheck   비늘 언덕·층계 검문소의 소품 (연출가 — 출신을 가리지 않는다)
storylets:
  # ───────────────────────── 회귀점 ─────────────────────────
  - id: o11_stairs_open
    origin: hidden_halfdragon
    trigger: {start: true}
    stage:
      - {npc: npc_o11_herm, at: bk_sh_flamegate, from: "19:30", to: "23:30", doing: 부엌 계단 아래에서 다음 접시를 들고 서 있다}
      - {npc: npc_o11_lucan, at: bk_sh_flamegate, from: "18:00", to: "23:59", doing: 연회장 상석에서 잔을 든다 — 사냥 연회의 주인}
      - {npc: npc_valerius, at: bk_sh_flamegate, from: "18:00", to: "23:59", doing: 위층 장부 방 — 아우락스 쪽 금 송금을 센다}
      - {npc: npc_o11_kruk, at: bk_sh_flamegate, from: "19:30", to: "22:30", doing: 계단 위에서 막대로 난간을 두드린다 — 쟁반을 재촉한다}
    text: |
      사슴 기름 타는 냄새. 정향, 숯, 그리고 그 밑에 쇠 맛 — 네 피.

      하인 계단. 은쟁반 위에서 통째로 구운 사슴 다리가 김을 올린다. 사흘째 열이 내리지 않아서, 계단은 한 칸 오를 때마다 한 칸씩 멀어진다. 위층 연회장 문틈으로 웃음이 쏟아진다. 젊은 순혈 열둘 — 아우락스 전하를 모시는 가문의 아들딸들. 오늘 밤 사냥 연회의 주인은 이 저택의 후계자, 루칸 화염문이다.

      열넷째 계단에서 등뼈가 찢어진다.

      소리는 나지 않는다. 하인복 속에서, 등뼈를 따라, 무언가가 살을 가르고 나온다. 쟁반을 난간에 걸치고 손을 등으로 넣는다. 손끝이 젖는다. 피 아래에 단단한 것이 있다. 손톱만 하고, 매끈하고, 따뜻하다. 하나. 그 아래 하나. 또 하나.

      계단 아래에서 누가 부른다. 낮게. 아무도 못 듣게.
    input: true_name
    input_label: 어머니가 지어 준 이름
    input_button: 그 이름에 고개를 돌린다
    input_say: 계단 아래에서, 그 이름을 아는 마지막 사람이 부른다
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "사슴 기름 타는 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 사슴 기름 타는 냄새."}
    trace_lines:
      water: 목 안에 물이 있다. 없다. 잿물 냄새만 코끝에 남아 있다.
      teeth: 목덜미가 가렵다. 개 이빨일 리 없다. 여기는 계단이다.
      spear: 옆구리가 시리다. 난간에 기댄 쪽이다.
      blade: 등이 뜨겁다. 횃불이 아니다 — 계단참의 등잔이다. 아직은.
      rope: 손목이 쓸린다. 앞치마 끈 자국이다. 앞치마 끈 자국일 것이다.
      hunger: 배가 꼬인다. 아니다 — 부엌 것은 굶지 않는다. 위층에서 남은 것이 내려온다.
      fall: 계단이 기운다. 아니다. 열넷째 계단은 제자리에 있다.
    return_ink: |
      ┊ 그 다음엔 연회장 문이 열렸다. 루칸이 잔을 들었다. "반비늘 그 잡종 말이야 — "
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 저택에 하나뿐이다. 계단 아래에서 헤름 — 화염문 부엌의 늙은 요리장 — 이 기름 묻은 손으로 난간을 쥐고 너를 올려다본다. 다섯 해 전, 어머니가 재 마당으로 끌려가기 전날 밤 그 이름을 그의 귀에 맡기고 갔다.

      헤름의 눈이 네 얼굴에서 내려가 하인복 등판에 멈춘다. 등잔 불빛에 젖은 자국이 번진다. 그의 얼굴이 하얘진다.

      "…올라가지 마라." 입술만 움직인다.
    effects: ["note 헤름만 아는 이름 — {name}. 부엌에서는 너를 부지깽이라 부른다", "note 열넷째 계단 — 등뼈를 따라 비늘 셋이 살을 찢고 나왔다"]
    next: o11_stairs_crisis

  - id: o11_stairs_crisis
    origin: hidden_halfdragon
    text: |
      연회장 문이 열린다. 빛과 열기가 계단참까지 쏟아진다. 문틈에 루칸이 서 있다. 여든, 순혈의 매끈한 얼굴, 목덜미에 분을 바른 자리. 아비를 닮았다. 너도.

      "…반비늘 그 잡종 말이야." 루칸은 계단을 보지 않는다. 손님들 쪽으로 잔을 든다. "용좌가 숨이 넘어가는 날, 첫 번째로 태워야지. 송곳니 영감은 값을 벌써 받았다던데." 웃음. 잔 부딪는 소리. 손님 하나가 용언으로 덧붙인다. "{lang:용언|붉은 홀이 직접 금을 냈다. 용좌의 숨이 끊기는 밤, 까마귀 문 사령관실 창 밖에서.}" 웃음이 한 번 더 터진다.

      계단 위에서 크룩 — 저택의 크릭 감독 — 이 막대로 난간을 두드린다. "사슴! 사슴이 식는다!"

      피가 한 줄, 허리띠까지 흘러내린다. 품 안에서 어머니의 비늘 펜던트가 살갗에 닿아 뜨겁다. 펜던트가 뜨거운지, 네가 뜨거운지 모르겠다.

      등의 비늘이 달아오르는 순간, 다른 불이 기억난다. 하늘을 가득 메운 불. 그 불이 네 목소리를 한가운데서 찢던 순간. 너는 그 불을 뿜은 용의 이름을 안다 — 배운 적 없는 이름을. 그 용은 지금 이 도시 꼭대기, 용좌봉의 재 속에서 죽어 가고 있다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["learn fact_o11_varskar_fire", "var o11_fire_memory = true"]
    choices:
      - id: herm_down
        label: 헤름에게 눈짓하고 부엌으로 내려간다
        minutes: 20
        check: {skill: 화술, D: 14, helps: [tongue, actor]}
        success:
          text: |
            헤름이 설거지 통 곁의 아이에게 턱짓을 한다. 아이가 쟁반을 받아 들고 위로 뛰어오른다. 크룩의 막대 소리가 그 아이를 따라간다.

            헤름은 너를 식료 창고로 밀어 넣고 문을 닫는다. 기름 등잔 하나. 그가 하인복 등판을 걷어 올리고, 오래 본다. 거위 기름에 화덕 재를 개어 비늘 위에 바르고, 아마포를 두 겹 감는다. 손은 떨리지 않는다. 떨리는 것은 목소리다.

            "네 어미가 끌려가기 전날 밤에 그랬다. 그 애 등에 불이 오거든 — 숨기라고만 하지 말고, 숨을 데를 알려 주라고." 그가 아마포 끝을 이빨로 끊는다. "재받이 아궁이. 이 빠진 베노. 아나의 아이라고 하면 등잔이 켜진다고."

            그는 그 말을 다섯 해 동안 혼자 들고 있었다.
          effects: ["learn fact_o11_ana_words", "var o11_back_bound = true", "var o11_scale_craft = true", "rel npc_o11_herm trust 6", "bond npc_o11_herm 5", "note 아나의 말 — 재받이 아궁이의 이 빠진 베노. '아나의 아이라고 하면 등잔이 켜진다'"]
        failure:
          text: |
            헤름이 계단을 오르려는 순간, 크룩의 그림자가 계단 위를 덮는다. "늙은 것이 어딜." 막대가 헤름의 어깨를 짚는다. 헤름은 고개를 숙이고 물러난다. 너를 보지 않는다 — 보면 안 된다는 것을 둘 다 안다.

            너는 쟁반을 들고 올라간다. 연회장 문턱에서 루칸이 코를 든다. "사슴 냄새에 다른 게 섞였군." 손님들이 웃는다. 루칸은 웃지 않는다.
          effects: ["var o11_lucan_eye += 1", "pain 4", "memory npc_o11_lucan 이상함 부엌의 부지깽이에게서 사슴 냄새 말고 다른 것이 났다"]
      - id: serve_bound
        label: 앞치마 끈을 등 위로 두 겹 졸라매고 연회 시중을 든다
        minutes: 120
        check: {skill: 기만, D: 26, helps: [pain_tolerance, actor, iron_body]}
        success:
          text: |
            끈이 비늘을 짓누른다. 숨을 쉴 때마다 등뼈를 따라 불이 지나간다. 너는 웃는 얼굴로 사슴을 썬다. 두 시간. 잔, 접시, 잔.

            아무도 하인을 보지 않는다. 그래서 하인은 다 듣는다. 손님 하나가 루칸에게 묻는다. 모레 밤 놀이는 그대로냐고. 루칸이 잔으로 부엌 쪽을 가리킨다. "사냥감은 부엌에서 고르지. 이번엔 늙은 손이 오래 버티는지 보자."

            연회가 끝날 때까지 피는 하인복을 넘지 않았다. 계단을 다 내려오자 무릎이 꺾인다.
          effects: ["learn fact_o11_lucan_quarry", "var o11_hunt_heard = true", "fatigue 15", "pain 6", "note 루칸의 놀이 — 모레 밤(낙엽월 3일), 부엌에서 사냥감 하나. '늙은 손이 오래 버티는지 보자'"]
        failure:
          text: |
            한 시간째, 루칸의 잔을 채우려고 몸을 숙인 순간 등이 펴지지 않는다. 끈 사이로 배어 나온 피가 하인복 등판에 손바닥만 하게 번진다. 루칸이 그것을 본다. 잔을 내려놓고, 일어나서, 네 뒤로 돈다.

            "사슴 피가 아니군." 그가 손가락 끝으로 젖은 자리를 누른다. 천 한 겹 아래에 비늘 하나. 그는 손가락을 거두어 냄새를 맡는다. 아무 말도 하지 않는다. 그게 더 나쁘다.

            "크룩. 이것, 오늘 밤 부엌에서 내보내지 마라."
          effects: ["var o11_lucan_eye += 2", "nemesis npc_o11_lucan 3", "pain 8", "stress 10", "memory npc_o11_lucan 위험함 부엌의 부지깽이 등에 사슴 피가 아닌 것이 있었다"]
      - id: listen_door
        label: 연회장 문틈에 붙어 선다 — 손님들의 용언을 엿듣는다
        minutes: 20
        check: {skill: 용언, D: 24, helps: [tongues, bat_ear]}
        success:
          text: |
            용언은 쇳소리다. 부엌에서 열일곱 해 동안 그 쇳소리 사이에 끼어 있던 낱말들을 주웠다. 오늘 밤은 낱말들이 서로 손을 잡는다.

            송곳니 회관의 볼크. 붉은 홀 — 아우락스 전하가 직접 값을 냈다. 용황이 숨을 거두는 밤, 까마귀 문 사령관실 창 밖. 반비늘의 목에.

            손님들이 잔을 부딪친다. 반비늘의 목에, 한 번 더.
          effects: ["learn fact_dk_aurax_kaspar_contract", "skill_gain 용언 2", "note 연회장 문틈 — 아우락스가 송곳니 회관의 볼크에게 카스파르 반비늘의 목값을 냈다. 용황이 숨을 거두는 밤, 까마귀 문"]
        failure:
          text: |
            쇳소리. 쇳소리 사이에 아는 낱말 셋 — 금, 창, 반쪽. 웃음이 터지고 문이 열린다. 크룩이 너를 문틈에서 떼어 낸다. "엿듣는 귀는 자른다." 막대가 귓바퀴를 친다.
          effects: ["pain 6", "note 연회장 문틈 — 용언 낱말 셋: 금, 창, 반쪽", "memory npc_o11_kruk 위험함 부지깽이가 연회장 문틈에 귀를 대고 있었다"]
      - id: sire_study
        label: 쟁반을 헤름에게 맡기고 위층 장부 방으로 오른다 — 아비에게
        minutes: 15
        risk: 인간과 말하지 않는 자의 방이다
        check: {skill: 화술, D: 24, helps: [etiquette, tongue]}
        success:
          text: |
            장부 방 문 앞의 용인 집사에게 너는 무릎을 왼쪽부터 꿇는다. "요리장이 가주님께 사슴의 간을 여쭈라 합니다." 거짓말이다. 집사는 거짓말인 줄 안다. 그래도 문을 연다 — 안에서 가주가 손가락을 한 번 들었기 때문이다.
          effects: ["then o11_study"]
        failure:
          text: |
            용인 집사가 문 앞에서 너를 내려다본다. "부엌 것이 위층 계단에." 그가 손짓 하나로 크룩을 부른다. 크룩의 막대가 무릎 뒤를 친다. 계단을 굴러 내려가는 동안 등의 천이 찢어지지 않은 것은 운이다.

            그날 밤 집사는 가주에게 무언가를 보고한다. 가주는 장부에서 눈을 들지 않는다.
          effects: ["pain 10", "var o11_sire_turned_away = true", "memory npc_o11_kruk 위험함 부지깽이가 위층 장부 방 문 앞까지 올라갔다"]
      - id: flee_down
        label: 하인 계단 뒷문으로 — 비늘 언덕을 빠져나가 아래층으로 달아난다
        minutes: 40
        risk: 하인 탈주 — 송곳니 회관에 냄새가 넘어간다
        check: {skill: 은신, D: 26, helps: [shadow_step, fleet, climber, night_eyes], warn: ["pknows fact_o11_ash_gutter"]}
        success:
          text: |
            쟁반을 계단참에 내려놓는다. 사슴이 혼자 김을 올린다.

            뒷문, 하인 통로, 재 홈통. 재 마당의 재를 아래층으로 흘려보내는 돌 홈통에 몸을 넣고 미끄러진다. 층계가 하나씩 등을 긁고 지나간다. 비늘이 돌에 걸릴 때마다 이를 문다.

            홈통 끝은 하수구다. 재 더미 위로 떨어진다. 어둠 속 벽에 누군가 재로 쓴 글자들이 있다 — 지운 자국 위에 또 쓴 자국. 저 위에서는 곧 누군가 계단참의 빈 쟁반을 발견할 것이다. 통금 종은 이미 울렸다. 오늘 밤 순찰은 하수구까지 내려오지 않는다.
          effects: ["goto bk_sewer", "learn fact_o11_ash_gutter", "var player_fugitive = true", "var o11_fled = true", "wanted 1 화염문 저택의 부엌 하인이 사라졌다", "pain 10", "note 화염문 저택을 버렸다 — 재 홈통을 타고 하수구로. 벽에 재로 쓴 글자들"]
        failure:
          text: |
            뒷문 빗장이 운다. 크룩의 등불이 돌아선다. "도망친다! 부엌 것이 — " 너는 재 홈통에 몸을 던진다. 층계가 하나씩 등을 긁고 지나간다. 비늘 하나가 돌에 걸려 반쯤 떨어져 나간다.

            하수구 바닥에 떨어졌을 때, 저 위에서 저택의 종이 울린다. 하인이 달아났을 때 치는 종이다. 내일 아침이면 네 짚더미의 냄새가 송곳니 회관의 단지에 담길 것이다.
          effects: ["goto bk_sewer", "learn fact_o11_ash_gutter", "var player_fugitive = true", "var o11_fled = true", "wanted 3 화염문 저택에서 하인이 달아났다 — 송곳니 회관에 냄새가 넘어갔다", "pain 18", "var o11_lucan_eye += 1"]
      - id: grip_pendant
        label: 품 안의 비늘 펜던트를 움켜쥐고 열을 버틴다
        minutes: 15
        check: {skill: 통찰, D: 32, helps: [pain_tolerance, sleeping_scale, dragon_heart]}
        success:
          text: |
            펜던트를 쥔다. 손바닥 안에서 비늘이 달아오른다. 숯불을 쥔 것처럼 — 아니, 숯불은 너를 데게 한 적이 없다. 부엌 사람들이 너를 부지깽이라 부르는 이유다.

            열이 등뼈를 타고 내려와 팔로, 손목으로, 손바닥으로 몰린다. 비늘이 그것을 마신다. 숨을 한 번 쉴 때마다 사흘 묵은 열이 한 겹씩 빠져나간다.

            손을 펴자 펜던트의 비늘이 숯처럼 검다. 손바닥은 멀쩡하다. 등의 비늘 셋이 가라앉아 살갗에 납작하게 붙는다. 너는 쟁반을 다시 든다. 가볍다.
          effects: ["var o11_scale_woken = true", "fatigue -30", "pain -10", "stress -6", "note 펜던트를 쥐고 열을 넘겼다 — 비늘이 검게 그을렸다. 손은 멀쩡하다. 등의 비늘이 가라앉았다"]
        failure:
          text: |
            펜던트를 쥔 손이 펴지지 않는다. 열이 거꾸로 올라온다 — 손에서 등으로, 등에서 머리로. 계단이 기울고, 쟁반이 기울고, 사슴 다리가 계단을 굴러 내려간다.

            눈을 뜨면 부엌 바닥이다. 헤름이 네 이마에 젖은 행주를 얹고 있다. 그 뒤에서 크룩이 사슴 값을 센다. 그리고 계단 위에서, 굴러떨어진 사슴을 보러 나왔던 손님 하나가 루칸에게 무언가를 속삭이는 소리.
          effects: ["pain 12", "var o11_lucan_eye += 1", "rel npc_o11_herm trust 3", "memory npc_o11_lucan 이상함 부엌 것이 계단에서 쓰러졌다 — 손님이 피를 보았다고 했다"]
      # ── ◈ 기억 선택지: 지난 회차에 루칸의 놀이를 겪었다 ──
      - id: mem_herm_hunt
        needs_memory: fact:fact_o11_lucan_quarry
        label: '헤름의 소매를 붙잡는다: "모레 밤엔 부엌에 계시면 안 돼요."'
        minutes: 5
        text: |
          헤름이 너를 본다. 계단참의 피도, 쟁반도 아니고 — 네 얼굴을. 열일곱 해 동안 한 번도 본 적 없는 얼굴을 보듯이.

          "…모레 밤." 그가 그 말을 입속으로 굴린다. 묻지 않는다. 대신 네 손에서 쟁반을 받아 든다. "올라가는 건 내가 한다. 너는 등을 싸매라. 모레 밤 일은 — 모레 밤에."

          그는 그 밤 자기 자리에 누가 서게 될지 묻지 않는다. 너도 아직 모른다.
        effects: ["var o11_herm_warned = true", "rel npc_o11_herm trust 10", "memory npc_o11_herm 이상함 아이가 모레 밤의 놀이를 이미 안다", "note 헤름에게 — 모레 밤엔 부엌에 있지 말라고 했다"]
      - id: obey
        label: 쟁반을 들고 올라간다 — 시킨 대로
        minutes: 60
        text: |
          열넷째 계단부터 스무째 계단까지. 연회장 문턱에서 너는 고개를 숙이고 사슴을 식탁 한가운데에 내려놓는다. 손님들이 칼을 든다.

          돌아서는 등 뒤로 루칸의 목소리가 따라온다. "잠깐." 너는 멈춘다. 그가 코를 든다 — 사냥꾼의 버릇이다. "사슴 냄새에 다른 게 섞였군." 손님 하나가 웃는다. 루칸은 웃지 않는다. "가 봐라, 부지깽이."

          계단을 내려오는 동안 피가 허리띠를 적신다. 아무도 묻지 않는다. 부엌에서는 아무도 묻지 않는 것이 서로를 지키는 방법이다.
        effects: ["var o11_lucan_eye += 1", "pain 6", "stress 6", "memory npc_o11_lucan 이상함 부엌의 부지깽이에게서 사슴 냄새 말고 다른 것이 났다"]

  # ───────────────────────── 생부의 장부 방 ─────────────────────────
  - id: o11_study
    origin: hidden_halfdragon
    text: |
      장부 방. 등잔 하나. 발레리우스 화염문 — 이 저택의 가주, 아우락스 전하의 금고 — 가 그 아래에서 장부를 센다. 목덜미의 분이 땀 없이 말라 있다. 그의 손은 늘 따뜻하다고, 어머니가 말한 적이 있다. 어떻게 알았는지는 말하지 않았다.

      그는 고개를 들지 않는다. "저것이 왜 내 방에 서 있느냐." 집사에게 하는 말이다. "정확히 말해라."

      집사가 입을 열기 전에 너는 하인복 등판을 걷어 올린다. 등잔 빛이 등뼈를 따라 내려간다. 피, 그리고 비늘 셋.

      펜이 멈춘다. 처음으로 그가 너를 본다. 금빛 눈. 거울에서 눈을 떼지 못하는 사람의 얼굴이다. 그가 손가락 하나로 집사를 내보낸다. 문이 닫힌다.

      "내일 아침, 너는 이 집에 없다." 열일곱 해 만에 처음으로 그가 너에게 직접 말한다. 서랍에서 밀랍 인장이 찍힌 통행증 한 장과 금화 두 닢을 꺼내 장부 위에 놓는다. 손을 내밀지 않는다. 너에게 닿지 않도록, 장부 위에.

      "용의 대로 북쪽, 회색여울 남작에게 가는 심부름이다. 정확히 그렇게 적었다."
    choices:
      - id: take_both
        label: 통행증과 금화를 집는다 — 고개를 숙인다
        minutes: 10
        text: |
          금화가 손바닥에서 차다. 그의 손은 따뜻하다고 했는데, 금은 그 온기를 하나도 옮겨 오지 않았다.

          "정확히." 그가 펜을 다시 든다. 숫자 하나를 고쳐 쓴다. 너는 이미 장부 밖에 있다.
        effects: ["item o11_house_pass", "coin 480", "var o11_cast_out = true", "note 가주의 통행증과 금화 두 닢 — 내일 새벽, 북문. 용의 대로 북쪽, 회색여울 남작에게 가는 심부름"]
      - id: take_pass
        label: 통행증만 집는다 — 금화는 장부 위에 둔다
        minutes: 10
        text: |
          그의 눈이 금화에 머문다. 그리고 너에게. 값을 거절하는 것을 처음 보는 눈이다.

          그는 금화를 서랍에 도로 넣지 않는다. 장부 위에 그대로 둔다. 네가 문을 닫고 나간 뒤에도, 등잔 아래 그대로.
        effects: ["item o11_house_pass", "var o11_cast_out = true", "temper 탐욕 -4", "memory npc_valerius 이상함 저것이 금화를 장부 위에 두고 갔다", "note 가주의 통행증 — 내일 새벽, 북문. 금화는 두고 나왔다"]
      - id: say_ana
        label: '"아나." — 어머니의 이름을 말한다'
        minutes: 15
        check: {skill: 화술, D: 30, helps: [tongue, etiquette]}
        success:
          text: |
            펜 끝에서 잉크가 한 방울 떨어진다. 숫자 하나가 번진다. 그는 그것을 닦지 않는다.

            "루칸에게는 아이가 없다." 장부를 보며 말한다. "아내 둘, 여든 해, 알 하나 없이. 순혈의 불은 그렇게 꺼진다." 그가 번진 숫자를 손톱으로 긁는다. "그래서 부엌에 한 줄을 남겨 두었다. 정확히 한 줄. 그 여자는 그걸 알았다. 그래서 재 마당에서 아무 말도 하지 않았다."

            그가 통행증과 금화를 장부 위에서 네 쪽으로 민다. "가라. 장부의 한 줄이 불타는 것은 보고 싶지 않다. 그것뿐이다."
          effects: ["learn fact_o11_sire_insurance", "item o11_house_pass", "coin 480", "var o11_cast_out = true", "stress 8", "note 가주 — '루칸에게는 아이가 없다. 그래서 부엌에 한 줄을 남겨 두었다'"]
        failure:
          text: |
            "그 이름을, 이 방에서." 그가 펜을 내려놓는다. 문 밖의 집사를 부르는 목소리가 한 박자 낮다. "내려보내라. 그리고 — 정확히, 아무 일도 없었다."

            통행증은 서랍으로 돌아간다. 금화도. 집사가 너를 계단 아래로 밀어 보낸다. 장부 방의 불은 그날 밤 늦게까지 꺼지지 않는다.
          effects: ["var o11_sire_turned_away = true", "pain 6", "memory npc_valerius 위험함 저것이 그 이름을 내 방에서 말했다"]
      - id: refuse
        label: '"저는 이 집 부엌의 손입니다." — 통행증을 받지 않는다'
        minutes: 10
        text: |
          그가 오래 너를 본다. "그럼 너는 아무것도 아니다." 펜이 다시 움직인다. "정확히, 아무것도."

          그가 장부를 한 장 넘긴다. 너는 아직 거기 적혀 있다. 부엌, 하나. 지우는 것은 펜 한 번이다. 그는 아직 펜을 그쪽으로 가져가지 않는다.
        effects: ["var o11_refused_exile = true", "temper 충성 3", "stress 6", "memory npc_valerius 이상함 저것이 장부 밖으로 나가기를 거절했다"]

  # ───────────────────────── 9.2 새벽 — 북문 (통행증을 받았으면) ─────────────────────────
  - id: o11_cast_out_dawn
    origin: hidden_halfdragon
    trigger: {at_time: "312-09-02 04:30", at: [bk_sh_flamegate, bk_sh_flamegate_laundry], when: ["var o11_cast_out == true"]}
    text: |
      새벽종보다 먼저, 크룩의 막대가 짚더미를 긁는다. "가주님 심부름이다. 일어나." 크룩은 그 이상 묻지 않는다. 가주의 심부름은 묻는 것이 아니다.

      하인 숙소의 짚더미에서 다른 하인들이 등을 돌린 채 자는 척한다. 네 자리는 아직 따뜻하다. 오늘 밤이면 다른 누군가가 거기 눕는다.

      북문은 다섯 시에 열린다. 품 안에서 불꽃 인장이 바스락거린다.
    choices:
      - id: herm_bundle
        label: 부엌 화덕에 들른다 — 헤름에게
        when: ["alive npc_o11_herm"]
        minutes: 50
        text: |
          헤름은 벌써 첫 장작을 넣고 있다. 너를 보고도 놀라지 않는다. 기름종이에 싼 꾸러미 둘을 내민다. 식은 사슴고기. 거위 기름 단지.

          "비늘 위에 재를 개어 발라라. 기름이 식으면 살갗 빛이 된다." 그가 화덕을 본다. 너를 보지 않는다. "그리고 — 재받이 아궁이의 베노. 네 어미가 그랬다. 아나의 아이라고 하면 등잔이 켜진다고." 숫돌을 집는다. "가라. 불 봐야 한다."
        effects: ["item o11_cold_venison", "item o11_goose_fat", "learn fact_o11_ana_words", "bond npc_o11_herm 5", "rel npc_o11_herm like 5", "goto bk_north_gate", "note 헤름 — 식은 사슴고기와 거위 기름. '아나의 아이라고 하면 등잔이 켜진다'"]
      - id: greta_word
        label: 세탁장에 들른다 — 그레타에게
        when: ["alive npc_greta"]
        minutes: 50
        text: |
          세탁장의 불은 이미 피어 있다. 그레타가 잿물 통 앞에서 손을 멈춘다. 왼손의 화상 자국. 문 쪽부터 본다 — 늘 그렇듯이.

          "북쪽으로 가요?" 네 손의 인장을 보고 묻는다. 용의 대로, 회색여울. 그녀의 입술이 소리 없이 한 이름을 만든다. "…대장간의 브란. 살아 있으면 — 허리끈의 매듭을 아직 맨다고. 그것만." 그녀가 손을 잿물에 다시 담근다. "아니, 아무 말도 하지 말아요. 들키면 그이가 다쳐요."
        effects: ["learn fact_dk_greta_is_brans_wife", "var o11_greta_message = true", "rel npc_greta trust 15", "rel npc_greta like 10", "goto bk_north_gate", "note 그레타의 전갈 — 회색여울 대장간의 브란에게: '허리끈의 매듭을 아직 맨다'"]
      - id: straight
        label: 곧장 북문으로 내려간다
        minutes: 45
        text: |
          비늘 언덕의 하인 통로는 아직 어둡다. 북문 앞 돌바닥에 아래층에서 올라온 재가 얇게 깔려 있다. 근위가 불꽃 인장을 오래 들여다보다가 돌려준다.

          다섯 시 종이 울린다. 북문의 빗장이 걷힌다. 용의 대로가 북쪽으로 뻗는다 — 용주 역참, 회색여울, 까마귀 문.
        effects: ["goto bk_north_gate", "note 북문 — 용의 대로 북쪽. 용주 역참, 회색여울, 까마귀 문"]

  # ───────────────────────── 9.2 06:00 — 부지깽이 손 ─────────────────────────
  - id: o11_spit_dawn
    origin: hidden_halfdragon
    trigger: {at_time: "312-09-02 06:00", at: [bk_sh_flamegate, bk_sh_flamegate_laundry], when: ["var o11_cast_out != true"]}
    severity: 2
    stage:
      - {npc: npc_o11_lucan, at: bk_sh_flamegate, from: "312-09-02 05:30", to: "312-09-02 07:00", doing: 밤새 마신 얼굴로 손님 둘과 부엌 문턱에 서 있다}
    text: |
      새벽. 연회의 기름이 화덕 둘레에 하얗게 굳어 있다. 헤름이 첫 장작을 넣는다. 너는 등을 벽 쪽에 둔다.

      부엌 문이 열린다. 순혈은 부엌에 내려오지 않는다 — 그런데 루칸이 문턱에 서 있다. 사냥 가죽옷 그대로, 밤새 마신 얼굴로. 손님 둘이 따라 들어와 코를 막고 웃는다.

      "부지깽이." 루칸이 화덕을 턱으로 가리킨다. 아침 고기를 굽는 쇠꼬챙이가 숯 속에서 벌겋다. "부엌 것들이 그러더군. 네 손은 불에 안 덴다고." 손님들이 동전을 꺼낸다. 내기다. "꺼내 봐라. 맨손으로."

      헤름의 칼질이 멈춘다.
    choices:
      - id: bare_hand
