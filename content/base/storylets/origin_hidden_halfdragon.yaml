          effects: ["var o11_herm_saved = true", "var o11_survived_hunt = true", "var o11_lucan_eye += 1", "nemesis npc_o11_lucan 3", "pain 12", "fatigue 20", "temper 용기 5", "bond npc_o11_herm 6", "rel npc_o11_herm trust 10", "note 루칸의 놀이 — 하스트란 저택의 어둠 아래에서 자정 북까지 버텼다. 헤름은 살았다"]
