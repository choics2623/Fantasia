    trigger: {at_time: "312-09-02 05:00", late: "312-09-06 22:00", at: [bk_sewer, bk_sewer_third], when: ["var o11_fled == true", "var o11_lamp_met != true"]}
    text: |
      쇠창살이 들리는 소리. 재가 한 바구니 쏟아져 내려온다. 그 뒤로 사다리를 더듬어 내려오는 늙은 발 — 층계의 재를 하수구에 버리러 오는 재 쓸이다. 이 빠진 노인이 등잔을 들어 너를 비춘다. 재를 뒤집어쓴 비늘 언덕의 하인복.

      그는 소리치지 않는다. 등잔을 조금 더 가까이 든다. 네 얼굴을 오래 본다.

      "…아나의 눈이구나." 노인 — 베노 — 이 등잔을 내린다. "그 여자 아이가 재 홈통을 타고 왔어. 그 여자도 그 길을 알았지." 그가 품에서 식은 귀리죽 그릇을 꺼내 네 손에 쥐여 준다. 자기 몫이었을 것이다.
    effects: ["var o11_lamp_met = true", "item porridge", "rel npc_benno trust 12", "rel npc_benno like 10"]
    next: o11_benno_talk

  - id: o11_benno_talk
    origin: hidden_halfdragon
    text: |
      베노가 손바닥으로 재를 고르게 편다. 재 위에는 아무것도 없다. 언제든 아무것도 없게 만들 수 있다 — 그게 재 글씨다.

      "그래서." 그가 손가락 하나를 들어 보인다. "무엇이 알고 싶으냐."
    choices:
      - id: ash_letter
        label: 재 위에 손가락을 댄다
        minutes: 30
        text: |
          베노가 네 손가락을 잡아 재 위로 끈다. 선 하나, 둘, 굽은 선. "물." 그가 손바닥으로 지운다. "이번엔 네가."

          너는 쓴다. 지운다. 다시 쓴다. 손가락 끝이 그 모양을 기억한다 — 지운 뒤에도.
        effects: ["skill_gain 읽고쓰기 2", "rel npc_benno like 6", "note 베노의 재 글씨 — '물'. 쓰고, 지운다. 지워도 손은 기억한다"]
      - id: show_back
        label: 하인복을 걷어 등을 보인다
        minutes: 15
        text: |
          베노는 놀라지 않는다. 손가락으로 비늘 하나의 가장자리를 짚는다. 재를 짚듯이.

          "반달의 피가 여기도 있구나." 그가 하인복을 도로 내려 준다. "등잔은 이런 아이를 아래로 뺀다. 이 아래, 하수 갈래 깊은 데로. 사흘, 열사흘, 스무사흘 — 밤 열한 시에 거기서 등잔이 켜진다. 그날 길을 정한다."

          그가 손바닥으로 재를 쓴다. "네 어미는 그 길로 아이를 셋 뺐다. 넷째 바구니에서 들켰지."
        effects: ["var o11_lamp_knows_blood = true", "learn fact_o11_lamp_hides", "rel npc_benno trust 15", "note 베노 — 등잔은 비늘 돋은 아이를 하수도로 뺀다. 재받이 하수 분기점, 3·13·23일 밤 열한 시"]
      - id: ask_ana
        label: '"어머니는 — 등잔에서 무엇을 했어요?"'
        minutes: 20
        text: |
          "물통 길." 베노가 재 위에 굽은 선 하나를 긋는다. "비늘 언덕 저택들의 빨래 바구니에 이름을 숨겨 날랐지. 재송곳 명단에 오른 아이들 이름. 하룻밤만 먼저 알아도 하나는 숨길 수 있으니까."

          그가 선을 지운다. "그러다 바구니가 한 번 뒤집혔다. 재 마당에서 그 여자는 등잔의 이름을 하나도 말하지 않았다. 네 이름도." 그가 너를 본다. "너는 그때 열두 살이었지. 그 여자가 마지막까지 본 건 군중 속의 너였다고들 한다."
        effects: ["learn fact_o11_ana_lamp", "stress 6", "temper 용기 2"]
      - id: leave
        label: 고개를 숙이고 일어선다
        minutes: 5
        text: |
          베노가 손바닥으로 재를 쓴다. "또 와. 오거든 — 문간에서 그 여자 이름은 말하지 마. 그냥 앉아. 아이들 틈에."
        effects: ["rel npc_benno like 3", "note 베노의 아궁이 — 또 오거든 그냥 앉으라고 했다"]

  # ───────────────────────── 까마귀 문 — 두 반비늘 (kaspar_warning 대신) ─────────────────────────
  - id: o11_kaspar_blood
    origin: hidden_halfdragon
    trigger: {window: {from: "312-09-02 06:00", to: "330-12-30 00:00"}, at: "@crow_gate", with: npc_kaspar, when: ["pknows fact_dk_aurax_kaspar_contract", "alive npc_kaspar", "var kaspar_warned != true"]}
    severity: 3
    text: |
      까마귀 문 사령관실. 등잔 하나, 지도 한 장, 물통 하나. 카스파르 반비늘 — 용황의 서자, 이 국경의 사령관 — 이 지도에서 눈을 든다. 왼쪽 얼굴의 은회색 비늘이 등잔 빛에 젖는다. 오른쪽은 인간의 얼굴이다.

      네 허리의 사슬 표찰을 부관이 먼저 알아본다. 불꽃 문 문장. 부관의 손이 칼자루에 얹힌다.

      "화염문." 카스파르가 그 이름을 천천히 말한다. "아우락스의 금고에서 온 것은 대개 칼이거나 금이다. 너는 어느 쪽이냐."
    choices:
      - id: warn
        label: '"아우락스 전하께서 송곳니 회관의 볼크에게 사령관님의 목값을 내셨습니다. 용황이 숨을 거두는 밤에."'
        minutes: 15
        check: {skill: 화술, D: 36, helps: [tongue, etiquette]}
        success:
          text: |
            카스파르의 눈이 반쪽만 웃는다. "알고 있었다 — 반쯤은. 아우락스의 금고에서 나머지 반쪽이 걸어올 줄은 몰랐지."

            그가 부관에게 이름 하나를 받아 적게 한다. 네 진짜 이름은 아니다. "이 이름을 기억하마."
          effects: ["var kaspar_warned = true", "var faction_kaspar += 15", "rel npc_kaspar trust 20", "note 카스파르에게 아우락스의 암살 의뢰를 알렸다"]
        failure:
          text: |
            "화염문의 개가 사령관을 시험하러 왔군." 부관이 너를 끌어낸다. 카스파르는 말리지 않는다. 그래도 그날 밤 사령관실의 불은 늦게까지 켜져 있다.
          effects: ["var kaspar_warned = true", "var faction_kaspar += 5", "pain 10"]
      - id: show_back
        label: 하인복을 벗는다 — 등을 보이고, 그다음에 말한다
        minutes: 20
        risk: 부관이 본다
        text: |
          등잔 빛이 등뼈를 따라 내려간다. 비늘 셋. 부관이 숨을 들이켠다. 카스파르는 움직이지 않는다. 오래. 그리고 왼손을 물통에 넣는다.

          "세 걸음 물러서라. 아니 — 너 때문이 아니다." 그가 부관을 내보낸다. 문이 닫히자 목소리가 낮아진다. 노예말이 한 마디 섞인다. "…얕아도 차갑다."

          그다음에 네가 말한다. 아우락스의 금, 송곳니 회관의 볼크, 용황이 숨을 거두는 밤. 그는 끝까지 듣는다. "같은 피의 말은 짐꾼의 말보다 무겁다." 그가 물통에서 손을 꺼낸다. 김이 오른다. "무거워서 — 위험하다. 문 밖의 귀도 무겁게 들었을 테니."
        effects: ["var kaspar_warned = true", "var faction_kaspar += 15", "rel npc_kaspar trust 30", "rel npc_kaspar like 15", "var o11_kaspar_blood = true", "var o11_lea_saw = true", "note 카스파르에게 등을 보였다 — 같은 피. 부관 레아가 보았다"]
      - id: leave
        label: 아무 말도 하지 않는다 — 고개를 숙이고 물러난다
        minutes: 5
        text: |
          카스파르가 손을 젓는다. "…아니, 숙여라. 저 망루에서 누가 보고 있다." 너는 숙인다. 그리고 나간다. 등 뒤에서 그가 지도를 접는 소리.
        effects: ["stress 6", "memory npc_kaspar 이상함 화염문 하인이 무언가를 말하려다 삼켰다"]

  # ───────────────────────── 연출가의 소품 (비늘 언덕·층계 검문소 — 출신을 가리지 않는다) ─────────────────────────
  - id: o11_dir_plucked
    trigger: {director: true, category: calm, at: [bk_sh_servant_passage, bk_scale_hill], hours: ["06:00", "18:00"], chance: 0.3}
    text: |
      비늘 언덕의 하인 통로. 은쟁반을 든 하녀 하나가 비켜 간다. 쟁반 위에 피 묻은 비늘 몇 장 — 아침마다 순혈 나리들의 목덜미에서 뽑힌 것이다. 하녀는 그것을 화덕에 넣으러 간다. 비늘은 타지 않는다. 그래도 넣는다. 그게 규칙이다.
    choices:
      - id: look
        label: 쟁반을 오래 본다
        text: "하녀가 쟁반을 품 쪽으로 당긴다. \"보지 마. 보면 센다고 생각해.\" 순혈은 비늘이 적을수록 높다. 그래서 아침마다 센다. 그래서 아침마다 뽑는다."
        effects: ["note 비늘 언덕 — 순혈은 아침마다 목덜미의 비늘을 뽑아 화덕에 넣는다. 비늘은 타지 않는다", "stress 2"]
      - id: pass_by
        label: 눈을 내리깔고 지나간다
        text: "쟁반이 지나간 자리에 정향 냄새와 피 냄새가 반반이다. 담 너머 어느 저택에서 아침 분을 바르는 거울이 해를 한 번 튕긴다."
        effects: ["stress -1"]
  - id: o11_dir_neckcheck
    trigger: {director: true, category: threat, at: [bk_stair_gate], hours: ["06:00", "19:00"], chance: 0.25}
    text: |
      셋째 층계 검문소. 비늘 근위가 줄 선 인간들의 목덜미를 손가락으로 훑는다 — 사슬 표찰이 아니라 살갗을 본다. 앞의 소년 하나가 줄 밖으로 끌려 나간다. 목에 붉은 반점. 반점일 뿐이다. 소년은 그걸 말할 줄 모른다.
    choices:
      - id: bow
        label: 고개를 숙이고 목을 내민다
        check: {skill: 기만, D: 22, hinders: [sleeping_scale]}
        success:
          text: "손가락이 네 목덜미를 지나간다. 지나간다."
          effects: []
        failure:
          text: "손가락이 멈춘다. 근위가 깃을 젖힌다 — 목덜미까지만. 살갗이 뜨겁다. \"열이 있나.\" 그가 손을 털고 다음 사람으로 간다. 등에 식은땀이 흐른다."
          effects: ["fear 1", "stress 6"]
      - id: speak_up
        label: '"열꽃입니다, 나리. 반점일 뿐입니다."'
        check: {skill: 화술, D: 30}
        success:
          text: "근위가 너를 본다. 그리고 소년의 목을 다시 본다. 손톱으로 반점을 긁는다. 피가 난다. 비늘은 없다. 그가 소년을 줄로 밀어 넣는다. 소년은 너를 보지 않는다. 그게 고맙다는 뜻이다."
          effects: ["temper 자비 2", "stress 3"]
        failure:
          text: "\"인간이 근위에게 가르치나.\" 창 자루가 네 정강이를 친다. 소년은 그대로 끌려간다. 근위의 수첩에 네 표찰의 문장이 적힌다."
          effects: ["pain 8", "wanted 1 층계 검문소에서 근위에게 말대꾸했다"]
