  # ───────────────────────── 아나의 마지막 말 (헤름) ─────────────────────────
  - id: o11_ana_words
    origin: hidden_halfdragon
    trigger: {window: {from: "312-09-02 21:00", to: "312-09-08 23:00"}, at: [bk_sh_flamegate], with: npc_o11_herm, when: ["not pknows fact_o11_ana_words", "alive npc_o11_herm", "not date == 312-09-03"]}
    text: |
      연회가 끝난 부엌. 화덕 넷 가운데 하나만 숨을 쉰다. 헤름이 그 앞에 앉아 칼을 간다. 숫돌 소리가 일정하다. 다른 하인들은 짚더미에서 잔다 — 자는 척을 한다.

      "등 돌려라." 그가 칼을 내려놓는다. 거위 기름에 화덕 재를 개어 네 등의 비늘 위에 바른다. 기름이 식으면 재가 살갗 빛이 된다. 아마포 두 겹. "앞치마 끈은 그 위로. 등잔 앞에서는 등을 벽에 붙여라."

      그리고 그가 말한다. 다섯 해 동안 불 꺼진 부엌에서만 꺼내 보던 말을.

      "네 어미가 끌려가기 전날 밤에 그랬다. 그 애 등에 불이 오거든 — 숨기라고만 하지 말고, 숨을 데를 알려 주라고. 재받이 아궁이. 이 빠진 베노. 아나의 아이라고 하면 등잔이 켜진다고."
    effects: ["learn fact_o11_ana_words", "var o11_back_bound = true", "var o11_scale_craft = true", "rel npc_o11_herm trust 5", "note 아나의 말 — 재받이 아궁이의 이 빠진 베노. '아나의 아이라고 하면 등잔이 켜진다'"]
    choices:
      - id: ask_sire
        label: '"위층은 — 알아요?"'
        minutes: 15
        text: |
          헤름이 숫돌을 다시 든다. 한참 칼만 간다.

          "네가 태어난 밤, 가주가 부엌에 내려왔다. 이 저택에서 순혈이 부엌 바닥을 밟은 건 그날 한 번뿐이다. 너를 한 번 보더니 집사에게 그러더구나. 장부에 적어라. 부엌, 하나." 숫돌 소리. "법은 그날 밤 너를 화덕에 넣으라고 했다. 그 사람은 장부에 넣었다. 그게 무슨 뜻인지는 나도 모른다."
        effects: ["learn fact_o11_kitchen_line", "rel npc_o11_herm trust 4"]
      - id: warn_herm
        label: '"내일 밤 루칸의 놀이 — 그가 당신 손을 봤어요."'
        when: ["var o11_hunt_heard == true", "date < 312-09-03"]
        minutes: 10
        text: |
          칼날이 숫돌 위에서 멈춘다. 헤름이 오래 제 손바닥을 본다.

          "늙은 것은 늙은 것의 일을 하는 거다." 그러다 고개를 든다. 네 얼굴을 보고 — 무엇을 보았는지는 말하지 않는다. "…소금 창고 자루 뒤에 사람 하나 들어갈 틈이 있다. 내일 밤 아홉 시엔 내가 거기서 소금을 센다고 해라. 누가 묻거든."

          그는 그 거짓말이 누구를 대신 줄에 세우게 될지 묻지 않는다. 너도 묻지 않는다.
        effects: ["var o11_herm_warned = true", "rel npc_o11_herm trust 6", "note 헤름 — 내일 밤 아홉 시, 소금 창고 자루 뒤"]
      - id: rest
        label: 화덕 곁 짚더미에 눕는다
        minutes: 20
        text: |
          등을 벽에 붙이고 눕는다. 기름 바른 비늘이 식으면서 당긴다. 헤름의 숫돌 소리가 한참 더 이어지다가 멎는다. 그가 화덕에 재를 덮는다. 불은 꺼지지 않는다. 재 밑에서 숨을 쉰다.
        effects: ["fatigue -10", "stress -5", "bond npc_o11_herm 3"]

