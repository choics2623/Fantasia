          effects: ["var o4_lina_taken = true", "var o4_martin_taken = true", "captured 붉은 갈대 은신처에서 사냥꾼에게 붙잡혔다 — 모두, 산 채로. 갈증의 밤 공물 줄의 빈칸이 채워진다"]
