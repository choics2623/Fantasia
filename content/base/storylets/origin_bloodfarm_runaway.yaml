# O-04 녹테른 혈목장 탈주자 (creation/origins_bloodfarm_runaway.yaml) — 회귀점의 대본 장면과 첫 스무 날.
# 문법은 greyford_opening.yaml·greyford_lethal.yaml 머리말과 같다. {name} = 진짜 이름 (마르틴이 맡아 두었던 이름).
# origin: 이 출신으로 시작한 판에서만 열리고, 그 판에서만 stage(사람 세우기)가 걸린다. o4_rd_*는 고장의 소품(연출가)이다.
#
# 흐름 (SCENARIOS O-04 「첫 1~3시간 흐름」을 첫 스무 날로):
#   o4_canal_open      02:00 포도밭 배수로 — 마르틴이 이름을 돌려준다 (회귀점)
#   o4_canal_lights    등불, 짖지 않는 개, 즈라그 + 잔향의 각성 → 새벽까지 검은 장미 둔덕(첫날의 숨을 곳)
#     └ o4_martin_behind · o4_zrag_down · o4_canal_hunter   (선택이 이어 여는 장면)
#   o4_pale_hounds     1일 해 질 녘 — 창백한 사냥개 (촛대·불·물). 밤새 달려 붉은 갈대 선(잠자리)으로   └ o4_mound_hunter
#   o4_reed_line       2일~ 갈대 선의 칼끝 — 테사 (값: 흰 옷을 태운다 = SCENARIOS의 '버드나무 세 그루'·쇠오리)
#   o4_martin_arm      3일~ 마르틴의 팔 — 칠백스물여덟 개의 홈, 3동의 아다
#   o4_hunter_reeds    흔적(o4_trail)이 셋이면 — 사냥꾼 '아홉째'가 은신처 앞에서 멈춘다 (치명적: 붙잡힘·죽음. 박자와 깃발이 미리 알린다)
#   o4_crossing        20일 밤 — 테사의 호송 줄 (정본 ev_rp_rose_escape). 리나는 넘고, 냄새가 묻은 너는 남는다
# 흔적 o4_trail: 시작 1. 물·옷 태우기·기억으로 줄고, 피·불빛·고랑·우리로 되돌아감으로 는다. 둘이면 깃발(o4_hounds_close), 셋이면 사냥꾼.
storylets:
  # ───────────────────────── 회귀점 ─────────────────────────
  - id: o4_canal_open
    origin: bloodfarm_runaway
    trigger: {start: true}
    stage:
      - {npc: npc_o4_martin, at: rp_vineyard, from: "02:00", to: "03:30", doing: 허리까지 차는 수로에서 갈대를 헤치며 숨을 센다}
      - {npc: npc_o4_lina, at: rp_vineyard, from: "02:00", to: "03:30", doing: 네 등에 매달려 떨고 있다}
      - {npc: npc_zrag, at: rp_vineyard, from: "02:05", to: "02:50", doing: 등불을 들고 수로 둑을 따라 내려온다 — 호루라기를 입에 물고}
      - {npc: npc_o4_martin, at: nocturne__nameless_mound, from: "03:30", to: "312-09-02 03:00", doing: 검은 장미 덤불 밑에 엎드려 붉은 우리 쪽을 본다}
      - {npc: npc_o4_lina, at: nocturne__nameless_mound, from: "03:30", to: "312-09-02 03:00", doing: 장미 가시 사이에 웅크려 꽃을 센다}
    text: |
      썩은 포도 냄새. 그 밑에, 쇠 냄새 — 네 팔 안쪽의 것.

      허리까지 차는 수로. 비가 사흘째다. 검은 포도밭에서 쓸려 내려온 물이 흰 옷을 끌어당긴다. 맨발 밑에서 진흙이 빠진다. 자정 채혈 줄에서 나온 지 두 시간 — 팔 안쪽에 감은 솜이 아직 따뜻하다.

      등에 리나가 매달려 있다. 여덟 살. 우리에서는 아이에게 이름을 주지 않는다. 그 이름은 네가 지어 주었다. 네 목에 감긴 팔이 떤다.

      앞에서 마르틴이 갈대를 헤친다. 3동의 공여자, 열네 해 동안 이레마다 피를 바친 사내. 숨소리가 셋까지 세고 끊긴다.

      철문은 잠겨 있지 않았다. 열네 해 동안 매일 밤 잠겨 있던 흰 울타리의 철문이, 오늘 밤에는 검은 장미 한 송이가 꽂힌 채 반쯤 열려 있었다. 누가 열었는지 아무도 모른다. 마르틴은 묻지 말고 달리자고 했다.

      마르틴이 멈춘다. 돌아서서, 빗소리보다 낮게 너를 부른다. 번호가 아니다.
    input: true_name
    input_label: 어머니가 지은 이름 — 마르틴이 맡아 두었던
    input_button: 그 이름을 듣는다
    input_say: 마르틴이 빗소리보다 낮게 부른다
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "썩은 포도 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 썩은 포도 냄새."}
    trace_lines:
      water: 수로의 물이 목까지 찬다. 아니다 — 허리까지다. 목 안에 물이 있다. 없다.
      teeth: 목덜미가 가렵다. 짖지 않는 것의 숨이 거기 닿았었다. 긁으면 빗물뿐이다.
      spear: 옆구리가 시리다. 리나의 무릎이 거기 박혀 있다. 리나의 무릎일 것이다.
      blade: 목이 뜨겁다. 손을 대 보면 아무것도 없다. 바늘 자국은 팔에 있다.
      rope: 손목이 쓸린다. 목장 표식 위로. 밧줄 자국은 없다. 아직은.
      hunger: 배가 꼬인다. 아니다 — 우리는 가축을 굶기지 않는다. 오늘 저녁에도 간을 먹었다.
      fall: 발밑이 꺼진다. 수로 바닥의 진흙이다. 진흙일 것이다.
    return_ink: |
      ┊ 그 다음엔 울타리 쪽에서 등불이 하나, 둘 켜졌다. 호루라기 — 짧게, 세 번.
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 수로에 하나뿐이다. 마르틴이다. 세 해 전 갈증의 밤, 공물 줄에 서기 전에 네 어머니가 그의 귀에 맡기고 간 이름.

      "우리를 나가는 밤에 돌려주라고 했어." 그가 빗물을 뱉는다. "돌려줬다. 이제 네 거야. 아무한테도 주지 마. 이름을 아는 자가 너를 가진다."

      리나가 네 귀에 대고 묻는다. "방금 뭐라고 했어?" 너는 대답하지 않는다. 리나가 대신 숫자를 센다.
    effects: ["learn fact_o4_mother_name", "var o4_lina_known = true", "note 어머니가 지은 이름 — {name}. 마르틴이 세 해 동안 맡아 두었다가 수로에서 돌려주었다. 우리에서는 너를 예순셋이라 부른다"]
    next: o4_canal_lights

  - id: o4_canal_lights
    origin: bloodfarm_runaway
    text: |
      울타리 쪽에서 등불이 하나 켜진다. 둘. 셋. 호루라기 — 짧게, 세 번. 빈 홈을 세는 소리다. 크릭 목동장 즈라그 — 울타리 혀, 붉은 우리의 숫자를 손가락 마디로 세는 자 — 가 등불을 들고 수로 둑을 따라 내려온다. 허리춤에서 열쇠 꾸러미가 운다.

      그리고 소리가 들린다. 개 짖는 소리가 아니다. 개는 짖는다. 저것들은 짖지 않는다. 사냥꾼 초소의 창백한 개들은 냄새를 따라 소리 없이 온다 — 흰 옷을 빤 잿물 냄새, 네 팔에서 아직 배어 나오는 피 냄새.

      품 안에서 봉투가 젖어 간다. 철문의 장미 밑에 끼워져 있던 것. 검은 꽃잎을 붙여 봉했다. 글은 없다. 그림뿐이다 — 수로를 따라 그은 선 하나, 버드나무 세 그루, 장미가 덮인 둔덕, 그리고 붉게 칠한 갈대.

      마르틴이 수로 아래쪽을 가리킨다. 남쪽. 리나의 팔이 네 목을 조인다.

      수로의 검은 물에 비친 얼굴이 잠깐 네 것이 아니다. 성벽 위에서 불붙은 하늘을 올려다보는 남자의 얼굴. 그리고 소리 — 수만 명이 한꺼번에 숨을 들이켜는 소리. 리나가 네 목을 끌어안으며 속삭인다. "눈이 회색이야."
    effects: ["learn fact_o4_rose_gate", "var o4_lina_saw_grey = true", "nemesis npc_ninth_hunter 1", "note 수로의 물 — 불붙은 하늘 아래 성벽 위의 남자, 수만 명이 숨을 들이켜는 소리. 리나가 '눈이 회색이야'라고 했다"]
    choices:
      - id: run_swamp
        label: 남쪽으로 — 리나를 업은 채 수로를 따라 전력으로 달린다
        minutes: 210
        check: {skill: 싸움, D: 28, helps: [fleet, iron_body, long_walk], hinders: [lame, frail], warn: ["pknows fact_o4_willow_knot"]}
        success:
          text: |
            물이 무릎을 잡아당긴다. 너는 끌려가지 않는다. 우리는 아침마다 너희를 달리게 했다 — 피가 좋아지라고. 그 다리가 지금 수로를 거슬러 간다.

            포도밭이 끝나는 곳에 버드나무 셋. 그림 그대로다. 등불은 뒤에서 작아진다. 동이 틀 무렵, 둔덕 하나가 빗속에 검게 솟는다. 둔덕을 덮은 것은 장미다. 검은 장미 — 수백 그루. 마르틴이 덤불 밑으로 기어 들어가 손짓한다.

            리나가 네 등에서 내려와 장미를 센다. 다 세지 못한다.
          effects: ["goto nocturne__nameless_mound", "fatigue 15", "rel npc_o4_martin trust 4", "note 첫날 — 검은 장미 둔덕. 해가 질 때까지 덤불 밑에 숨는다"]
        failure:
          text: |
            셋째 버드나무쯤에서 뒤가 조용해진다. 마르틴의 숨소리가 없다.

            돌아보면 그가 수로 한가운데 무릎을 꿇고 있다. 열네 해 동안 이레마다 피를 바친 다리다. 일어서려다 다시 주저앉는다. 그 너머, 둑 위로 등불 하나가 흔들리며 온다.
          effects: ["then o4_martin_behind"]
      - id: wade_canal
        label: 둑으로 오르지 않는다 — 수로 한가운데를 걸어 냄새를 물에 맡긴다
        minutes: 240
        check: {skill: 통찰, D: 30, helps: [survivor, swimmer, pathfinder, evade_track]}
        success:
          text: |
            물이 가슴까지 찬다. 너는 리나를 어깨 위로 올린다. 아이의 발이 네 귀를 차지 않으려고 애쓴다.

            개들이 둑 위에서 멈추는 소리가 들린다 — 발톱이 젖은 흙을 긁는 소리뿐이다. 냄새는 물이 가져갔다. 개 하나가 수로 쪽을 오래 보다가 돌아선다.

            동이 틀 무렵 수로가 둔덕 밑으로 파고든다. 둔덕을 덮은 것은 검은 장미다. 너희는 덤불 밑으로 기어 들어간다. 리나의 이가 딱딱 부딪친다. 흰 옷이 몸에서 떨어지지 않는다.
          effects: ["goto nocturne__nameless_mound", "var o4_trail = 0", "var o4_lina_cold += 1", "fatigue 15", "learn fact_o4_hounds_scent", "note 첫날 — 검은 장미 둔덕. 물이 냄새를 가져갔다. 리나가 떤다"]
        failure:
          text: |
            수로가 둘로 갈라진다. 그림에는 없던 갈래다. 너는 틀린 쪽을 고른다.

            물이 얕아지고, 끝난다. 갈아엎은 포도밭 한가운데. 하늘이 회색으로 밝아 온다. 너희는 고랑에 엎드려 기어서 — 한참을 기어서 — 장미가 덮인 둔덕에 닿는다. 해가 벌써 떠 있다. 젖은 고랑에 셋의 자국이 길게 남았다.
          effects: ["goto nocturne__nameless_mound", "var o4_trail += 1", "var o4_lina_cold += 1", "fatigue 25", "agenda if var o4_trail >= 2: var o4_hounds_close = true", "note 첫날 — 검은 장미 둔덕. 포도밭 고랑에 자국을 남겼다"]
      - id: follow_map
        label: 봉투를 열어 빗속에서 그림을 다시 본다 — 그림이 가리키는 길로
        minutes: 180
        check: {skill: 통찰, D: 15, helps: [memory_palace, photo_memory, pathfinder]}
        success:
          text: |
            빗물이 숯 선을 번지게 하기 전에 본다. 버드나무 셋 가운데 하나 — 밑동에 아주 작은 것이 그려져 있다. 매듭이다.

            포도밭 끝 셋째 버드나무. 밑동에 잿빛 끈이 감겨 있다. 그 아래, 갈대에 가려진 배수 굴. 허리를 굽히면 들어간다. 굴은 둔덕 밑까지 이어진다. 개들은 굴 입구에서 냄새를 잃는다.

            동이 틀 무렵 너희는 검은 장미 덤불 밑에서 나온다. 마르틴이 버드나무 쪽을 오래 돌아본다. "누가 길을 묶어 놨어." 그 누군가가 누구인지, 그도 모른다.
          effects: ["goto nocturne__nameless_mound", "learn fact_o4_willow_knot", "agenda if var o4_trail > 0: var o4_trail -= 1", "fatigue 10", "rel npc_o4_martin trust 6", "note 셋째 버드나무 밑동의 잿빛 매듭 — 길을 아는 누군가가 묶어 놓았다"]
        failure:
          text: |
            빗물이 그림을 지운다. 숯 선이 번져 손가락에 묻는다. 버드나무가 셋인지 넷인지도 이제는 모른다.

            너희는 둔덕이 보일 때까지 고랑을 따라 걷는다. 등불이 두 번 가까이 왔다가 멀어진다. 동이 틀 무렵 검은 장미 덤불에 닿았을 때, 네 손가락은 아직 검다.
          effects: ["goto nocturne__nameless_mound", "var o4_trail += 1", "fatigue 15", "agenda if var o4_trail >= 2: var o4_hounds_close = true"]
      - id: decoy
        label: 리나를 마르틴에게 넘긴다 — 너는 반대쪽 둑으로 올라가 개들을 끈다
        minutes: 240
        risk: 혼자서 짖지 않는 것들 앞에 선다
        check: {skill: 은신, D: 40, helps: [shadow_step, fleet, evade_track, beast_friend]}
        success:
          text: |
            리나가 네 목을 놓지 않는다. 마르틴이 아이의 손가락을 하나씩 떼어 낸다. "장미 둔덕. 해 질 녘까지." 그가 말한다.

            너는 둑 위로 올라가 흰 옷을 펄럭인다. 일부러. 개들이 돈다 — 소리 없이, 한꺼번에. 너는 포도밭 고랑으로 뛰어든다. 줄기 사이, 배수 굴, 다시 고랑. 우리의 아침 달리기는 원을 그렸다. 너는 그 원을 안다.

            동이 틀 무렵 개들은 포도밭 동쪽 끝에서 제 꼬리를 쫓고 있다. 너는 진흙을 뒤집어쓰고 서쪽으로 돌아 장미 둔덕에 닿는다. 덤불 밑에서 리나가 너를 센다. 하나. 맞다.
          effects: ["goto nocturne__nameless_mound", "temper 용기 8", "rel npc_o4_martin trust 10", "bond npc_o4_lina 6", "nemesis npc_ninth_hunter 2", "fatigue 25", "note 개들을 포도밭 동쪽으로 끌고 갔다 — 사냥꾼은 이제 네 냄새를 안다"]
        failure:
          text: |
            포도밭 동쪽 끝에서 고랑이 끝난다. 앞은 돌담이다.
          effects: ["then o4_canal_hunter"]
      - id: strike_zrag
        label: 수로 둑 그늘에 숨어 기다린다 — 즈라그가 오면 촛대로 친다
        minutes: 20
        risk: 크릭 목동장에게 손을 댄다
        check: {skill: 싸움, D: 30, helps: [blunt, improvised, brawler, reflexes]}
        success:
          text: |
            등불이 둑 위로 온다. 호루라기를 문 입, 손가락 마디로 숫자를 세던 손. 즈라그가 수로를 내려다보는 순간 촛대가 그의 무릎을 친다. 쇠가 뼈에 닿는 소리.

            그가 수로로 굴러떨어진다. 등불이 물에 빠져 꺼진다. 호루라기가 그의 입에서 빠져 끈에 매달린 채 흔들린다. 불지 못한 호루라기다.
          effects: ["then o4_zrag_down"]
        failure:
          text: |
