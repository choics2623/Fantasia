  # ───────────────────────── 붉은 우리의 소품 (연출가) ─────────────────────────
  - id: o4_rd_feed_hall
    trigger: {director: true, category: lack, at: [rp_feed_hall], hours: ["06:30", "20:30"], chance: 0.35}
    text: |
      배급 홀. 김이 오르는 솥에 붉은 고기와 간이 잠겨 있다. 콩, 검은 포도 한 송이. 흰 옷들이 줄을 서서 받아 간다. 아무도 서두르지 않는다 — 여기서 굶어 본 사람은 없다.

      쑥 냄새 나는 노파가 줄 끝의 아이 그릇에 간 한 점을 더 얹는다. "다 먹어. 다 먹어야 피가 좋아진다." 아이가 먹는다. 크릭 목동이 그릇마다 남은 것을 손가락 마디로 센다.
    choices:
      - id: eat
        label: 그릇을 받아 다 먹는다
        text: 맛있다. 그게 제일 무섭다.
        effects: ["hunger -1", "stress 3"]
      - id: refuse
        label: 그릇을 받지 않는다
        text: 크릭 목동이 너를 본다. 홈을 세던 손가락이 멈춘다. 굶는 가축은 눈에 띈다.
        effects: ["stress 2"]
  - id: o4_rd_dusk_whistle
    origin: bloodfarm_runaway
    trigger: {director: true, category: calm, at: [nocturne__marsh_edge], hours: ["17:00", "19:30"], chance: 0.3, when: ["alive npc_o4_lina", "date < 312-09-21", "var o4_lina_taken != true"]}
    text: |
      해 질 녘. 갈대 너머 아주 먼 데서 귀환 호루라기가 운다. 들릴 리 없는 거리다.

      리나가 고개를 든다. 몸이 먼저 일어선다 — 우리로 돌아가는 시각이다. 태어나서 매일. 아이가 일어선 채 어디로 가야 할지 몰라 너를 본다.
    choices:
      - id: sit
        label: 리나의 손을 잡아 다시 앉힌다
        text: 아이의 손이 차다. 앉아서도 한동안 붉은 우리 쪽을 본다. 그러다 갈대를 센다.
        effects: ["bond npc_o4_lina 3", "stress -3"]
      - id: walk
        label: 같이 일어선다 — 갈대 끝까지 걸어갔다가 돌아온다
        text: |
          너희는 갈대 끝까지 걸어간다. 물이 발목까지. 호루라기가 그친다. 돌아오는 길에 리나가 묻는다. "오늘은 안 돌아가도 돼?" 너는 대답한다. 아이가 그 대답을 숫자처럼 외운다.
        effects: ["bond npc_o4_lina 5", "rel npc_o4_lina like 3"]
  - id: o4_rd_valley_song
    trigger: {director: true, category: omen, at: [nocturne__marsh_edge], night: true, chance: 0.25}
    text: |
      바람이 바뀐다. 갈대 너머 남서쪽에서 소리가 실려 온다. 노래다. 아니다 — 노래의 조각이다. 말 같지 않은 말이 같은 곳에서 끊기고, 다시 처음부터.

      그 사이에 숨소리가 섞여 있다. 아주 많은 숨소리.
    choices:
      - id: ask
        label: 갈대 속의 여자에게 낮게 묻는다 — 저게 뭐냐고
        when: ["with npc_tessa"]
        text: |
          칼을 닦던 손이 멈춘다. "이빨 골짜기. 굶주린 자들." 그녀가 목의 천을 만진다. "숨소리를 따라와. 맥박 소리도. 저 노래가 들리면 숨을 줄여. 다섯까지 세고, 내쉬지 마."
        effects: ["learn fact_nc_starved_follow_breath", "rel npc_tessa trust 2"]
      - id: hold
        label: 숨을 줄인다 — 노래가 지나갈 때까지
        text: 노래는 한참 뒤에 그친다. 그친 것인지, 바람이 다시 바뀐 것인지 모른다. 가슴이 아프다. 숨을 너무 오래 참았다.
        effects: ["stress 4"]
