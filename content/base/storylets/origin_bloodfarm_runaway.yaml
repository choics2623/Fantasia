  - id: o4_crossing
    origin: bloodfarm_runaway
    severity: 3
    trigger: {window: {from: "312-09-20 18:00", to: "312-09-20 22:20"}, at: nocturne__marsh_edge, with: npc_tessa, when: ["var o4_tessa_met == true", "var o4_lina_taken != true", "alive npc_o4_lina"]}
