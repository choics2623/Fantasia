          effects: ["var o6_vek_kept = true", "rel npc_gorba trust 3", "rel npc_o6_vek trust 6", "note 스무날 — 고르바가 셈을 바꿨다. 벡은 쇠우리에 남는다 — 발을 세는 동안은"]
        failure:
