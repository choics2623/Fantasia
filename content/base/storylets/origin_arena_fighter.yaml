            애송이가 모래에 쓰러진다. 그가 너를 올려다보며 무언가를 말한다. 그롬의 말이 아니다. 노예말이다. "…아직."

            크롤의 깃발이 오른다. 관중석 맨 앞의 흉터 전사들이 침을 뱉는다. 쓰러진 그롬을 아무도 부축하지 않는다. 쉬라만 문간에서 한 발 나선다 — 그리고 멈춘다.
          effects: ["var o6_wins += 1", "var o6_twentieth_done = true", "learn fact_o6_pup_still", "pain 6", "rel npc_gorba like 4", "note 스무날 정식 대진 — 그롬 애송이를 쓰러뜨렸다. 애송이가 노예말로 '아직'이라 했다", "goto ba_gate_tunnel"]
        failure:
