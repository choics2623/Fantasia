        effects: ["var o6_vek_taken = true", "agenda capture npc_o6_vek at war_camp__bone_column", "stress 10", "temper 용기 -2", "note 스무날 새벽 — 벡이 북문의 수레에 올랐다. '발부터.'"]
      - id: pay
