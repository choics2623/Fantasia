    origin: arena_fighter
    trigger: {window: {from: "312-09-02 05:00", to: "312-09-04 09:00"}, at: ba_training, with: npc_gorba}
    text: |
      다섯 시 북. 훈련장의 모래는 원형장 것보다 거칠다. 고르바가 무릎 보조대를 철컥이며 줄을 따라 걷는다. 그는 투사를 이름으로 세지 않는다. 팔뚝, 손목, 무릎 — 눌러 보고, 값을 센다.

      그의 손이 네 팔뚝을 쥔다. "…일곱. 어제는 여섯 반이었다." 손목. 무릎. 손가락 마디의 매듭끈 하나가 풀린다. "백까지 가면 그롬이 혈명 없는 혈명을 준다. 그 값은 이빨로 못 센다." 그가 웃는다. 처음 보는 웃음이 아니다 — 마라에게도, 하르트에게도 하는 웃음이다.

      훈련장 가장자리에서 쉬라 피웃음 — 인간에게 전투어를 몰래 가르치는 그롬 여전사 — 가 입 모양을 손으로 만져 보이며 신참 셋을 가르친다. 그녀는 고르바 쪽을 보지 않는다.
    choices:
      - id: ask_hundred
        label: '"혈명 없는 혈명이 뭡니까."'
        minutes: 5
        text: |
          고르바의 이빨 꿰미가 멎는다. 아주 잠깐. "형제가 된다." 흥정할 때보다 짧게. "군주와 같은 붉은 잔을 받는다. 인간이." 그가 네 팔뚝을 놓는다. "그날 그롬 삼만이 그 인간 앞에서 고개를 숙인다. 나도."

          그가 다음 투사에게 걸어간다. 꿰미가 다시 짤랑인다. 아까보다 빠르게.
        effects: ["learn fact_o6_bloodless_blood", "note 고르바 — 백 승이면 군주와 같은 붉은 잔. 그 말을 할 때 이빨 꿰미가 멎었다"]
      - id: buy_vek
        when: ["alive npc_o6_vek", "var o6_vek_crippled == true", "var o6_vek_kept != true"]
        label: '"벡의 값은 얼마입니까."'
        minutes: 10
        check: {skill: 화술, D: 24, helps: [haggle, merchant, tongue], hinders: [stutter]}
        success:
          text: |
            고르바가 처음으로 너를 값이 아니라 다른 것으로 본다. 흥정하는 자로. "쓸모없는 것에도 값은 있지." 그가 꿰미를 짤랑인다. "이빨 여섯 — 일곱 해 전에 내가 너를 사 온 값이다. 크릭 셈으로 동화 여덟 닢. 스무날 새벽 수레가 오기 전에 내 손바닥에."

            그가 웃는다. "인간이 동화를? 어디서 구할지는 묻지 않으마. 묻지 않는 것도 값이다."
          effects: ["var o6_vek_price = true", "rel npc_gorba trust 4", "note 고르바 — 벡의 값은 동화 여덟 닢(이빨 여섯 — 너를 사 온 값). 스무날 새벽 수레가 오기 전에"]
        failure:
          text: |
            "값?" 고르바가 웃는다. 이빨이 보이게. "무릎 나간 늙은 것의 값은 수레가 매긴다. 너는 네 값이나 올려라." 그가 네 무릎을 손가락으로 툭 친다. 아직 쓸 만한 무릎을.
          effects: ["rel npc_gorba like -2"]
      - id: offer_arm
        label: 팔을 더 내민다 — 값을 다시 매겨 보라고
        minutes: 5
        text: |
          고르바가 네 팔뚝을 다시 쥔다. 이번엔 오래. "일곱 반으로 쳐 주마." 그가 이빨 하나를 네 손바닥에 올려놓는다. "스무날 정식 대진에 세운다. 오른 값은 모래에서 확인해야지."

          쉬라가 그쪽을 한 번 본다. 그리고 다시 신참의 입 모양을 고친다.
        effects: ["rel npc_gorba like 5", "rel npc_gorba trust 3", "stress 3", "note 고르바 — 일곱 반. 스무날 정식 대진에 세운다"]
      - id: shira_word
        label: 쉬라에게 간다 — 오늘의 전투어 한 마디를 배운다
        minutes: 30
        text: |
          쉬라 피웃음이 입가의 상처를 벌리며 웃는다. "모래에서 살아 돌아온 입이네. 한 마디만." 그녀가 네 턱을 손가락으로 잡고 입 모양을 만든다. "'아직.' 전투어에는 없는 말이야. 노예말에만 있어. 그런데 내 애송이들이 그걸 알아."

          그녀가 손을 뗀다. "한 번 더." 너는 말한다. 노예말과 전투어 사이 어딘가의 소리로.
        effects: ["rel npc_gm_shira like 6", "rel npc_gm_shira trust 4", "skill_gain 위압 1", "note 쉬라 — 그롬 애송이들은 노예말 '아직'을 안다"]
      # ── ◈ 지난 회차의 스무날을 안다 ──
      - id: mem_column
        needs_memory: fact:fact_o6_gorba_column
        when: ["alive npc_o6_vek", "var o6_vek_crippled == true", "var o6_vek_kept != true"]
        label: '"스무날 수레에 벡을 올리면 — 신참 서른의 발은 누가 셉니까."'
        minutes: 5
        check: {skill: 화술, D: 20, helps: [haggle, merchant, tongue], warn: ["pknows fact_o6_gorba_column"]}
        success:
          text: |
            고르바의 손가락이 매듭끈 위에서 멈춘다. 스무날 수레 — 아직 아무도 그 말을 꺼내지 않았다. 그가 너를 본다. 값을 매기는 눈이 아니다.

            "…신참의 발." 그가 혀 위에서 굴린다. 그롬은 셈이 맞으면 피를 흘리지 않는다. "이빨 하나 값이면 창걸이에 걸어 두지. 늙은 것이 발을 세는 동안은." 그리고 덧붙인다. "누가 너한테 스무날을 말했지?" 대답을 기다리지 않는다.
          effects: ["var o6_vek_kept = true", "rel npc_gorba trust -4", "memory npc_gorba 위험함 열하나가 스무날 수레를 미리 안다", "note 고르바 — 벡을 창걸이에 걸어 두겠다. 신참들의 발을 세는 동안은"]
        failure:
          text: |
            "스무날?" 고르바가 웃는다. "누가 너한테 그런 날짜를 줬지?" 그는 대답을 듣지 않는다. 다음 투사의 팔뚝을 쥔다. 그러나 그의 눈이 한 번 더 너에게 돌아온다.
          effects: ["memory npc_gorba 위험함 열하나가 스무날 수레를 미리 안다", "rel npc_gorba trust -6"]

  # ───────────────────────── 백승의 탈 (SCENARIOS tal_legend) — 안식일 저녁의 7번 숙소 ─────────────────────────
  - id: o6_tal_legend
    origin: arena_fighter
    trigger: {window: {from: "312-09-03 17:00", to: "312-09-12 21:00"}, at: ba_dorm7, with: npc_gm_og, when: ["with npc_gm_ytal"]}
    text: |
      안식일 저녁의 7번 숙소. 경기가 없는 날이라 아궁이 앞이 붐빈다. 오그 일흔여덟 — 투사 조합장, 말끝마다 이름을 붙이는 사내 — 가 미아와 어린 탈에게 칼 닦는 법을 가르친다. 칼날을 한 번 닦을 때마다 이름을 하나씩 부른다. 카렐. 브로. 페더.

      어린 탈이 묻는다. "탈은요? 제 이름의 탈."

      오그의 손이 멈춘다. 아주 잠깐. "백승의 탈은 백 번째 상대를 쓰러뜨리고, 그롬에게 혈명 없는 혈명을 받고, 황무지로 걸어갔다." 쇠우리의 누구나 아는 이야기다. 누구나 같은 순서로 한다. "그리고 군나르. 아흔아홉을 이기고, 백 번째 경기 전날 밤 북쪽으로 갔다. 대진표 돌판에 아직 '미룸'이 있다."

      그가 칼을 닦는다. 이번에는 이름을 부르지 않는다.
    choices:
      - id: ask_og
        label: '"백 번째 뒤에 — 탈이 받은 게 뭡니까."'
        minutes: 10
        check: {skill: 통찰, D: 24, helps: [liar_nose, people_memory], hinders: [one_eye]}
        success:
          text: |
            "혈명 없는 혈명." 오그가 칼을 닦으며 말한다. 그런데 칼날은 이미 깨끗하다. 그는 같은 자리를 세 번 닦는다.

            너는 그것을 본다. 이름을 부를 때는 한 번 닦던 손이, '백'이라는 말 앞에서는 세 번 닦는다. 오그는 안다 — 백 번째 뒤에 무엇이 오는지. 그리고 말하지 않기로 정했다.

            "칼 닦을 때는 이름만 묻는 거다." 그가 너를 승수로 부른다. 말을 닫는 소리다.
          effects: ["learn fact_o6_og_flinch", "rel npc_gm_og trust -2", "note 오그는 '백' 앞에서 칼을 세 번 닦는다 — 무언가를 안다"]
        failure:
          text: |
            "이름을 물어라." 오그가 부드럽게 말한다. 그리고 다음 칼을 든다. "백은 숫자다. 숫자는 그롬이 센다."
          effects: ["rel npc_gm_og like -1"]
      - id: stone
        label: 대진표 돌판의 '미룸'을 보러 간다
        minutes: 30
        text: |
          피의 감독 사무소 곁, 대진표 돌판. 해가 진 뒤라 횃불 하나뿐이다. 모서리에 그 줄이 있다 — 군나르, 아흔아홉, 미룸. 서른여덟 해 동안 아무도 지우지 않았다.

          그 옆의 빈칸에 새 자국이 있다. 손톱으로 긁은 자국. 여러 번, 같은 자리를. 무언가를 새기려다 만 손이다 — 아니면 새길 이름을 찾는 손.

          돌판 저편 어둠 속에서 쇠 보조대 소리가 멀어진다. 철컥, 철컥.
        effects: ["learn fact_o6_gorba_scratch", "goto ba_bout_stone", "note 대진표 돌판 — '군나르 — 99승 — 미룸' 옆 빈칸에 손톱자국. 어둠 속에 쇠 보조대 소리"]
      - id: young_tal
        label: 어린 탈에게 — 네 이름은 누가 지어 줬냐고 묻는다
        minutes: 10
        text: |
          아이가 손으로 눈을 가린다. 그 사이로 너를 본다. "누나가요. 증조할아버지 이름이래요." 그리고 목소리를 낮춘다. 이름을 말할 때만 낮아지는 목소리. "…탈이에요."

          미아가 동생의 어깨를 만진다. 아이는 목에 건 나무 말을 쥔다 — 무르크가 준 장난감. 그리고 아무도 듣지 못하게 네 소매를 잡아당긴다. "벽에다 이름을 부르면요." 거기서 멈춘다. "아니에요. 누나가 모르는 거예요."
        effects: ["rel npc_gm_ytal like 8", "rel npc_gm_ytal trust 4", "var o6_ytal_hint = true", "note 어린 탈 — '벽에다 이름을 부르면요.' 거기서 멈췄다. 저녁마다 문 닫기 직전에 돌아온다"]
      - id: wipe_names
        label: 칼 닦는 법을 따라 한다 — 이름을 부르며
        minutes: 30
        text: |
          너는 창날을 내려 아궁이 앞에 앉는다. 한 번 닦고, 이름 하나. 네가 쓰러뜨린 사람들 가운데 이름을 아는 것은 일곱뿐이다. 나머지는 숫자로 부른다.

          오그가 그걸 듣는다. "이름을 외우는 손은 칼을 오래 쥔다." 그가 네 날을 받아 한 번 닦아 준다. 아무 이름도 부르지 않고. 그리고 돌려준다. "7번 숙소에 자리 하나 있다 — 너한테는 이미 있지."
        effects: ["rel npc_gm_og trust 6", "rel npc_gm_og like 4", "rel npc_gm_mia like 3", "stress -5", "note 오그 — '이름을 외우는 손은 칼을 오래 쥔다.'"]
      # ── ◈ 지난 회차에 탈의 일을 알았다 ──
      - id: mem_chained
        needs_memory: fact:fact_gm_tal_alive_chained
        label: '"탈은 걸어가지 않았어요." — 배수로 쪽 벽을 본다'
        minutes: 10
        text: |
          오그의 칼이 멈춘다. 미아의 칼도. 어린 탈이 두 손으로 눈을 가린다 — 이번엔 손가락 사이를 벌리지 않는다.

          오그가 너를 오래 본다. 그리고 칼을 닦는다. 한 번. 이름을 부르지 않고. "그 말은 1번 숙소 바닥에서 해라." 낮게. "안식일 밤. 쉰 승이 안 되는 자는 문간에 서지만 — 문간에서도 들린다."
        effects: ["var o6_og_invites = true", "rel npc_gm_og trust 10", "memory npc_gm_og 이상함 열하나가 탈의 일을 안다 — 누구에게서 들었나", "note 오그 — 안식일 밤 1번 숙소 바닥으로 오라"]

  # ───────────────────────── 틱틱의 배당 (SCENARIOS chitik_odds) — 취사장 문간 ─────────────────────────
  - id: o6_tick_odds
    origin: arena_fighter
    trigger: {window: {from: "312-09-08 18:00", to: "312-09-09 20:00"}, at: ba_cookhouse, with: npc_gm_tick}
    stage:
      - {npc: npc_gm_tick, at: ba_cookhouse, from: "312-09-08 18:00", to: "312-09-08 20:00", doing: 승수 쪽지 묶음을 들고 취사장 문간에 쪼그려 앉아 있다 — 스무날 정식 대진의 쪽지}
      - {npc: npc_gm_tick, at: ba_cookhouse, from: "312-09-09 18:00", to: "312-09-09 20:00", doing: 승수 쪽지 묶음을 들고 취사장 문간에 쪼그려 앉아 있다 — 스무날 정식 대진의 쪽지}
    text: |
      취사장. 솥 열둘에서 김이 오른다. 에이다 — 예순세 승에서 칼을 놓은 취사 일손 — 가 국자를 두 번 두드리고 승수를 묻는다.

      문간에 낯선 것이 쪼그려 앉아 있다. 귀가 긴 크릭, 손가락마다 매듭끈 자국. 내기장의 장부지기 틱틱이다. 쇠우리 안까지 들어오는 크릭은 드물다. 그가 너를 보자 혀를 한 번 찬다.

      "7번 숙소의 창이시죠. 스무날 정식 대진 — 상대는 그롬 애송이." 그가 매듭 하나를 풀어 보인다. "비율이 벌써 움직였습니다요. 셋째 합에 무릎을 꿇으시면 이빨 열 개. 동화로는 열두 닢. 크릭이 대신 셉니다요."

      그가 목소리를 낮춘다. "이빨 삼백이면 고르바 나리가 목고리를 풀어 줍니다요. 투사 해방금. 다들 모으시죠."

      솥 앞에서 에이다의 국자가 멈춰 있다.
    choices:
      - id: take_knot
        label: 매듭을 받는다 — 셋째 합에 무릎을 꿇기로
        minutes: 5
        text: |
          틱틱이 매듭 하나를 네 손바닥에 쥐여 준다. 동화 여섯 닢이 매듭 속에서 짤그랑거린다. "반은 지금, 반은 무릎을 꿇은 뒤에요. 값은 한 번 오릅니다요 — 내리지는 않습죠."

          그가 사라진 뒤, 에이다가 네 그릇에 국을 붓는다. 평소보다 적게. 국자를 두 번 두드리지 않는다.
        effects: ["coin 6", "var o6_tick_deal = true", "learn fact_o6_tick_twentieth", "rel npc_gm_tick like 6", "rel npc_gm_tick trust 6", "rel npc_gm_eida trust -6", "temper 정직 -3", "note 틱틱의 매듭 — 스무날 셋째 합에 무릎. 동화 여섯은 받았고, 여섯은 그 뒤에"]
      - id: refuse
        label: 고개를 젓는다
        minutes: 2
        text: |
          "값은 한 번 오릅니다요." 틱틱이 매듭을 다시 묶는다. 서두르지 않는다. "스무날 아침까지는 이 값입죠." 그는 문간에서 일어나 다음 숙소 쪽으로 간다.

          에이다가 국자를 두 번 두드린다. 네 그릇에 고기가 한 덩이 더 들어간다.
        effects: ["rel npc_gm_tick like -2", "rel npc_gm_eida trust 4", "rel npc_gm_eida like 3", "temper 정직 2"]
      - id: ransom
        label: '"해방금 — 그롬 셈에 그런 값이 있어?"'
        minutes: 5
        check: {skill: 통찰, D: 20, helps: [liar_nose, merchant, haggle], hinders: [one_eye]}
        success:
          text: |
            "있고말고요." 틱틱이 말한다. 그런데 그의 긴 귀 끝이 한 번 접힌다 — 크릭이 거짓말을 할 때 귀가 하는 일. 그리고 그는 '해방금'이라는 말을 다시 하지 않는다.

            그롬은 화폐를 경멸한다. 목고리를 이빨로 사고판 투사를 너는 본 적이 없다. 백 승 말고는.
          effects: ["learn fact_o6_tick_manumission", "rel npc_gm_tick trust -3", "note 틱틱의 '투사 해방금'은 거짓 — 귀 끝이 접혔다"]
        failure:
          text: |
            "있고말고요. 이빨 삼백." 틱틱이 손가락 세 개를 펴 보인다. 매듭끈 자국이 굵다. "모으시는 분이 많습죠. 쇠우리에서 제일 오래 모은 분은 이백쯤 됩니다요."

            삼백. 너는 그 숫자를 머릿속에 넣는다. 백 승보다 가까워 보이는 숫자.
          effects: ["var o6_believes_ransom = true", "note 투사 해방금 — 이빨 삼백이면 목고리가 풀린다 (틱틱의 말)"]
      - id: ledger
        label: '"마라의 경기에서도 비율이 먼저 움직였나?"'
        minutes: 5
        check: {skill: 화술, D: 26, helps: [tongue, liar_nose, haggle], hinders: [stutter]}
        success:
          text: |
            "마라 님의 경기요? 열한…" 틱틱의 혀가 멈춘다. 그는 혀를 차지도 않는다. 매듭끈을 쥔 손가락이 하얘진다.

            "내기는 운입니다요." 그가 일어선다. 너무 빨리. "운." 문간에서 한 번 돌아본다 — 네 얼굴을 매듭처럼 묶어 두려는 눈으로.
          effects: ["learn fact_o6_tick_eleven", "rel npc_gm_tick trust -8", "memory npc_gm_tick 위험함 7번 숙소의 창이 마라의 경기를 물었다"]
        failure:
          text: |
            "마라 님이요? 여든일곱에 한 모금, 백에는 두 모금입죠." 틱틱이 웃는다. 이가 작다. "비율은 언제나 움직입니다요. 바람처럼."
          effects: ["rel npc_gm_tick like -2"]
      # ── ◈ 지난 회차에 장부 벽을 보았다 ──
      - id: mem_ledger
        needs_memory: fact:fact_p2gm_tick_odds_ledger
        label: '틱틱의 귀에만: "장부 벽에 따로 묶인 열한 줄."'
        minutes: 5
        text: |
          틱틱의 귀가 둘 다 접힌다. 그는 한참 아무 말도 하지 않는다. 그다음 매듭 하나를 풀어 네 손바닥에 동화를 쏟는다 — 세지도 않고.

          "그 줄은 장부 밖입니다요." 목소리가 작다. "장부 밖은 비율이 없습죠. 입도 없고요." 그가 네 손을 쥐어 동화를 감싸게 한다. 그리고 문간을 빠져나간다. 뛰지는 않는다.
        effects: ["coin 12", "var o6_tick_scared = true", "rel npc_gm_tick trust -10", "memory npc_gm_tick 위험함 7번 숙소의 창이 장부 벽의 열한 줄을 안다", "note 틱틱이 동화 열두 닢으로 입을 막으려 했다 — 열한 줄"]

  # ───────────────────────── 배수로의 이름 — 어린 탈이 벽에 대고 부른다 (문 닫기 전, 20~22시) ─────────────────────────
  - id: o6_drain_name
    origin: arena_fighter
    trigger: {window: {from: "312-09-02 20:00", to: "313-05-29 22:00"}, at: ba_drain, with: npc_gm_ytal}
    text: |
      배수로. 투사의 시체가 지나가는 길이라 돌이 늘 젖어 있다. 횃불은 입구에만 있다. 그 너머는 물소리와 어둠이다.

      어린 탈이 벽 한 곳에 손바닥을 대고 서 있다. 입 속으로 무언가를 한 번 굴린다. 그리고 벽에 대고 부른다. "탈."

      물소리. 그리고 — 벽 너머에서, 아주 늦게, 쇠사슬이 한 번 끌리는 소리. 늙은 목소리. "…탈?"

      아이가 숨을 멈춘다. 그때 아이가 너를 본다.
    choices:
      - id: listen
        label: 아이 곁에 쪼그려 앉는다 — 같이 듣는다
        minutes: 30
        text: |
          아이는 도망치지 않는다. 나무 말을 쥐고 네 곁에 붙어 앉는다. 둘이서 벽에 귀를 댄다.

          쇠사슬 마디가 하나씩 훑이는 소리. 숨을 고르는 소리. 그리고 노인이 센다 — 하나, 둘, 셋. 아흔아홉에서 멈춘다. 백은 세지 않는다.

          "누나한테는 말하지 마요." 아이가 속삭인다. "누나가 무서워해요."
        effects: ["learn fact_p2gm_ytal_hears_name", "var o6_drain_heard = true", "var o6_ytal_trusts = true", "rel npc_gm_ytal trust 10", "rel npc_gm_ytal like 6", "note 배수로의 벽 — 어린 탈이 이름을 부르면 벽 너머 노인이 '탈?' 하고 대답한다. 노인은 아흔아홉까지만 센다"]
      - id: think
        label: 벽의 방향을 가늠한다 — 이 벽 너머에 무엇이 있나
        minutes: 30
        check: {skill: 통찰, D: 30, helps: [spatial, liar_nose, people_memory], hinders: [one_eye]}
        success:
          text: |
            배수로는 원형장 밑을 북쪽으로 간다. 북쪽에 맞붙은 것은 하나뿐이다 — 뼈의 전당. 매일 밤 쇠사슬과 대련 소리가 난다는 지하.

            그리고 그 노인은 '탈'이라는 이름에 대답했다. 백승의 탈은 황무지로 걸어갔다 — 쇠우리의 누구나 같은 순서로 하는 이야기. 그런데 지금, 벽 너머에서 누군가 아흔아홉까지 세다가 멈춘다.
          effects: ["learn fact_p2gm_ytal_hears_name", "learn fact_gm_tal_alive_chained", "var o6_drain_heard = true", "note 배수로의 벽 너머는 뼈의 전당 지하다 — 백승의 탈은 걸어가지 않았다"]
        failure:
          text: |
            배수로는 굽고 또 굽는다. 어둠 속에서 방향이 흐려진다. 벽 너머의 소리는 다시 오지 않는다. 아이가 네 소매를 당긴다. 문이 닫힐 시각이다.
          effects: ["learn fact_p2gm_ytal_hears_name", "var o6_drain_heard = true"]
      - id: take_back
        label: 아이를 데리고 쇠우리로 돌아간다 — 문이 닫히기 전에
        minutes: 20
        text: |
          아이가 망설인다. 벽을 한 번 더 본다. 그리고 네 손을 잡는다. 젖은 돌 위를 둘이서 걷는다. 쇠우리 문이 닫히기 직전, 7번 숙소 철창 안으로 미끄러져 들어간다.

          미아가 아궁이 앞에서 고개를 든다. 동생과 너를 번갈아 본다. 아무것도 묻지 않는다.
        effects: ["goto ba_dorm7", "rel npc_gm_ytal trust 4", "rel npc_gm_mia trust 4", "note 어린 탈을 데리고 문 닫기 전에 돌아왔다"]
      - id: call
        label: 벽에 대고 직접 부른다 — "탈."
        minutes: 15
        risk: 벽 너머에서 누가 듣는지 모른다
        text: |
          네 목소리는 아이의 것보다 낮다. 벽 너머가 조용해진다. 쇠사슬 소리도, 숨소리도.

          한참 뒤에, 아까와 다른 목소리. "…발소리가 무겁군. 아이가 아니야." 그리고 다시 침묵. 그다음엔 벽 저편 더 먼 곳에서 무언가 무거운 것이 계단을 내려오는 소리 — 일흔 걸음.

          아이가 네 손을 잡아끈다. 둘은 물소리 쪽으로 뛴다.
        effects: ["learn fact_p2gm_ytal_hears_name", "var o6_drain_heard = true", "fear 1", "note 벽 너머의 노인 — '발소리가 무겁군. 아이가 아니야.' 그리고 계단을 내려오는 무거운 발소리, 일흔 걸음"]

  # ───────────────────────── 스무날 새벽, 북문의 수레 — 소모품 강등 (낙엽월 20일 가을 원정 징발) ─────────────────────────
  - id: o6_column_you
    origin: arena_fighter
    trigger: {window: {from: "312-09-20 05:00", to: "312-09-20 10:00"}, at: "@blood_arena", when: ["var o6_you_column == true", "not var player_fugitive == true"]}
    severity: 4
    text: |
      다섯 시 북이 울리지 않는다. 대신 북문 쪽에서 수레 바퀴 소리.

      쇠우리 문 앞에 고르바가 서 있다. 그 곁에서 피의 감독의 서기가 서류를 든다. 이름이 아니라 승수를 읽는다 — 소모품이 될 것들의 승수. 무릎 나간 것, 팔 잘린 것, 경기를 거부한 것.

      네 승수가 불린다. 고르바는 너를 보지 않는다. 값이 없는 것은 보지 않는다. 수레 곁에서 그롬 호송꾼 둘이 쇠사슬을 풀어 늘어뜨린다.
    effects: ["goto ba_gates"]
    choices:
      - id: board
        label: 수레에 오른다
        minutes: 30
        text: |
          쇠사슬이 목고리에 걸린다. 수레가 북문을 지난다. 원형장의 붉은 사암이 등 뒤에서 작아진다. 스무 시간 길 끝에 뼈 행렬 막사가 있다 — 그롬이 쓰다 버린 갑옷 조각과 녹슨 칼, 그리고 번호.
        effects: ["captured 소모품 강등 — 북문의 수레에 올라 뼈 행렬로 갔다. 가을 원정의 첫 열"]
      - id: blood_price
        label: '"모래에 다시 세워라. 값은 피로 다시 매겨라." — 그롬 전투어로'
        minutes: 10
        check: {skill: 위압, D: 28, helps: [menace, command, crowd_voice], hinders: [coward, stutter]}
        success:
          text: |
            고르바가 처음으로 너를 본다. 전투어 — 그롬의 말에는 부탁이 없다. 너는 부탁하지 않았다.

            "…오늘 오후. 정식 대진." 그가 이빨 꿰미를 쥔다. "애송이 말고 흉터 전사 앞에 세운다. 서 있으면 값을 다시 매기지. 쓰러지면 — 수레는 내일도 온다." 서기가 서류에서 네 승수를 긋는다. 아직은.
          effects: ["var o6_you_column = false", "var o6_last_chance = true", "rel npc_gorba trust 4", "temper 용기 4", "note 고르바 — 오늘 오후 정식 대진, 흉터 전사 앞에. 지면 수레"]
        failure:
          text: |
            전투어가 목에서 갈라진다. 고르바가 손을 한 번 젓는다. 호송꾼의 쇠사슬이 목고리에 걸린다. 수레가 북문을 지난다.
          effects: ["captured 소모품 강등 — 피로 값을 다시 매기라 했지만 북문의 수레에 실렸다"]
      - id: run
        label: 북문이 아니라 배수로로 — 달아난다
        minutes: 30
        risk: 등을 보인 투사는 그롬 누구나 사냥한다
        check: {skill: 은신, D: 30, helps: [shadow_step, fleet, reflexes], hinders: [lame, giant_bone]}
        success:
          text: |
            호송꾼이 쇠사슬을 고르는 사이, 너는 쇠우리 안쪽으로 걷는다 — 뛰지 않고. 치료소 뒤, 시체를 내보내는 문. 그 너머가 배수로다. 물소리 속으로 들어간다.

            등 뒤에서 서기가 네 승수를 한 번 더 읽는다. 대답이 없다. 그롬은 등을 보인 자를 잊지 않는다. 이제 그롬 누구나 너를 사냥할 수 있다.
          effects: ["var player_fugitive = true", "var o6_you_column = false", "var o6_runaway = true", "wanted 3 소모품 수레에서 달아난 투사", "goto ba_drain", "note 배수로로 달아났다 — 이제 등을 보인 투사다"]
        failure:
          text: |
            세 걸음. 그롬 호송꾼의 손이 목고리를 잡는다. 발이 땅에서 뜬다. 고르바가 침을 뱉는다. "등까지 보이는구나." 수레가 북문을 지난다.
          effects: ["pain 15", "captured 소모품 강등 — 달아나다 목고리째 붙잡혀 북문의 수레에 실렸다"]

  - id: o6_column_dawn
    origin: arena_fighter
    trigger: {window: {from: "312-09-20 05:00", to: "312-09-20 10:00"}, at: "@blood_arena", when: ["alive npc_o6_vek", "var o6_vek_crippled == true", "var o6_vek_kept != true", "var o6_you_column != true", "not var player_fugitive == true"]}
