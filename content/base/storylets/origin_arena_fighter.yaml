          "창걸이에 걸어 둬라." 그가 벡에게 말한다. "늙은 것도 걸어 두면 녹이 덜 슨다." 그리고 너를 본다. 일곱 해 전 이빨 여섯 개로 산 것을 보는 눈으로. 같은 값이다.
        effects: ["coin -8", "var o6_vek_kept = true", "rel npc_o6_vek trust 10", "rel npc_gorba like 4", "note 스무날 — 동화 여덟 닢으로 벡을 수레에서 뺐다. 나를 사 온 값과 같다"]
      - id: wrap_stand
        when: ["var o6_norabe_wrap == true"]
