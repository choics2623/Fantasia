# O-06 피의 원형장 투사 — 회귀점의 대본 장면과 첫 달의 장면 (creation/origins_arena_fighter.yaml의 opening). origin: arena_fighter.
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 진짜 이름 (벡만 안다). 2인칭 '너', 현재형.
#
# SCENARIOS O-06 → 데이터 (지역 카드·고장 자료가 이긴다):
#   '쇠이빨 막사'             → 쇠우리 (ba_gates · 백 개의 문, 22시에 닫힌다). 주인공의 잠자리는 7번 숙소 (ba_dorm7)
#   조련사 고르즈 반쪽귀      → 이빨장수 고르바 (npc_gorba) — 그의 '존중'은 값(이빨)으로 센다
#   동료 투사 레나            → 미아 마흔하나 (npc_gm_mia) — 7번 숙소의 목소리. '아직?' — '아직.'
#   노장 투사 벡              → 벡 예순넷 (npc_o6_vek, 새 카드) — 열하나의 진짜 이름을 아는 유일한 사람
#   크릭 도박꾼 치틱          → 내기 장부지기 틱틱 (npc_gm_tick)
#   두개골쪼개기 하그         → 장면 안의 이름뿐 — 관중석 맨 앞의 그롬 흉터 전사
#   심판                      → 크롤 백상처 (npc_gm_kroll) · 군주 → 우르가쉬 (서서 하품한다 — 앉은 군주는 쇠약한 군주)
#   '짐승 우리' 형벌          → 소모품 강등 — 스무날 북문의 수레 (REGIONS §16.7 경기 거부 → 소모품)
#   잔향의 각성의 '+10'       → 깃발 o6_awake의 warn (가을 피의 날 모래의 싸움 판정)
# 첫 1~3시간 흐름 → 장면: arena_opening_autumn → o6_gate_open·o6_gate_sand(+o6_thumbs·o6_left_side·o6_haag) ·
#   iron_tooth_night → o6_cage_night_dead/alive · gorz_feeding → o6_gorba_teeth · tal_legend → o6_tal_legend · chitik_odds → o6_tick_odds.
# 이어지는 것: 스무날 새벽 북문의 수레(o6_column_you · o6_column_dawn) → 스무날 정식 대진(o6_formal_sep · o6_formal_last) → 서리월 스무날(o6_formal_oct).
# 승수는 세계 변수 o6_wins (회귀점 11) — 정식 대진만 센다. 고르바의 이빨 o6_marks가 셋이면 수레 (o6_marks_sold).
storylets:
  # ───────────────────────── 회귀점: 가을 피의 날, 투사 입장 터널 ─────────────────────────
  - id: o6_gate_open
    origin: arena_fighter
    trigger: {start: true}
    stage:
      - {npc: npc_o6_vek, at: ba_sand, from: "15:00", to: "15:40", doing: 맞은편 입장문에서 걸어 나온다 — 오른쪽 무릎에 천을 감았다. 절뚝이지 않으려고 애쓴다}
      - {npc: npc_o6_vek, at: ba_infirmary, from: "15:40", to: "21:00", doing: 노라베의 소금물에 오른쪽 무릎을 담그고 누워 있다}
      - {npc: npc_gorba, at: ba_gate_tunnel, from: "15:00", to: "15:40", doing: 입장문 쇠살대에 얼굴을 붙이고 이빨 꿰미를 센다}
      - {npc: npc_murk, at: ba_gate_tunnel, from: "15:00", to: "16:00", doing: 터널 끝에 갈고리를 세워 두고 기다린다 — 진 쪽을 끌어갈 갈고리}
      - {npc: npc_gm_mia, at: ba_gate_tunnel, from: "15:00", to: "15:15", doing: 터널 벽의 손자국 곁에서 네 손바닥에 천을 감아 준다}
    text: |
      붉은 모래 냄새. 쇳내, 마른 피, 기름 먹인 가죽.

      투사 입장 터널. 돌벽에 손자국이 승수만큼 찍혀 있다 — 앞서 지나간 투사들의 것, 그리고 네 것 열하나. 입장문 위에는 누더기 깃발이 걸려 있다. 재와 진흙으로 찍은 손바닥 수천 개. 투사들은 그 아래를 지날 때 손을 들어 제 손바닥을 겹쳐 본다. 너도 든다.

      쇠살대 너머로 모래가 보인다. 붉다. 염료가 아니다. 이 원형장이 문을 연 해부터 일흔한 해 동안 쌓인 것이다. 그롬 관중 삼만이 발을 구르는 소리가 땅을 울리고, 네 가슴뼈가 그 박자에 맞춰 떨린다. 가을 피의 날.

      미아 — 7번 숙소의 '목소리', 마흔한 승 — 가 네 손바닥에 천을 감는다. 창 자루가 미끄러지지 않게. 매듭을 지으며 묻는다. "아직?"

      "아직."

      쇠살대에 얼굴 하나가 붙는다. 이빨장수 고르바 — 일곱 해 전 너를 이빨 여섯 개 값에 사 온 그롬 조련사 — 다. 허리의 이빨 꿰미가 짤랑인다. "상대는 벡이다."

      너는 대답하지 않는다. 벡은 너에게 창 쥐는 법을 가르친 사람이다. 지난주 훈련에서 오른쪽 무릎이 나갔다. 그는 이제 쓸모가 없고, 그롬은 쓸모없는 투사를 먹이지 않는다.

      "죽이면 열둘이다." 고르바가 이빨 하나를 엄지로 굴린다. "살려 두면 — 관중이 정한다. 관중은 피를 좋아하지."

      터널 끝에서 무르크 — 싸우지 않는 회색 그롬, 모래의 피를 닦는 자 — 가 갈고리를 세워 두고 기다린다. 진 쪽을 끌어갈 갈고리다.

      쇠살대가 오른다. 맞은편 입장문에서 벡이 걸어 나온다. 절뚝이지 않으려고 애쓰고 있다. 관람석 꼭대기, 해골로 꾸민 자리 곁에 대전쟁군주 우르가쉬가 서 있다. 그는 앉지 않는다. 오늘은 하품을 한다.

      모래 한가운데, 옛 창이 박힌 자리에서 둘이 마주 선다. 벡이 너를 부른다. 낮게. 함성 속에서 아무도 못 듣게.
    input: true_name
    input_label: 벡만 아는 이름
    input_button: 그 이름으로 선다
    input_say: 함성 속에서 벡이 부르는 이름
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "붉은 모래 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 붉은 모래 냄새."}
    trace_lines:
      water: 기침이 터진다. 목 안에 물이 있다. 없다. 모래가 마른 소리를 낸다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 붉은 모래뿐이다.
      spear: 옆구리가 시리다. 손을 대 보면 따뜻하다. 창은 아직 네 손에 있다.
      blade: 목이 뜨겁다. 손을 대 보면 목고리 자국뿐이다.
      rope: 손목이 쓸린다. 미아가 감아 준 천 자국이다. 천 자국일 것이다.
      hunger: 배가 꼬인다. 아니다 — 투사는 잘 먹는다. 오늘 아침에도 고기를 먹었다.
      fall: 발밑이 꺼지는 것 같다. 모래는 그대로다. 붉다.
    return_ink: |
      ┊ 그 다음엔 모래 위에서 벡의 무릎이 꺾였다. 삼만의 엄지가 아래로 내려갔다.
    after_input: |
      "{name}."

      그 이름을 아는 사람은 이 원형장에, 쇠우리 백 개의 문 안에 하나뿐이다. 일곱 해 전, 세렌 노예선 짐칸에서 내린 열네 살을 7번 숙소 짚더미에 눕힌 밤 — 벡이 물었고, 너는 대답했다. 짐칸에서 죽은 어머니가 마지막으로 부른 이름이었다.

      "여기선 승수로 불린다." 그때 벡이 말했다. "이름은 내가 갖고 있으마." 열 번째 승리에 투사명이 허락되었을 때도 너는 이름을 대지 않았다. 그래서 쇠우리는 너를 승수로 부른다. 열하나.

      벡이 창끝을 낮춘다. 인사다. 오른쪽 무릎에 감은 천이 벌써 젖어 있다. "그 이름으로 서라. 열하나 말고."
    effects: ["note 벡만 아는 이름 — {name}. 쇠우리는 너를 승수로 부른다 — 열하나"]
    next: o6_gate_sand

  # ── 둘째 화면: 모래 위의 첫 합 — 끝에 잔향의 각성 (SCENARIOS echo_wake_arena) ──
  - id: o6_gate_sand
    origin: arena_fighter
    text: |
      심판석의 크롤 백상처 — 흉터가 백 개 넘는 그롬 노인, 은퇴하지 않는 심판 — 가 돌 의자를 한 번 두드리고 깃발을 든다.

      벡이 먼저 돈다. 왼쪽으로. 오른발로 몸을 받쳐야 하는 쪽을 피해서. 일곱 해 동안 새벽마다 '발부터'라고 말하던 사람이 오늘은 제 발을 숨긴다. 창끝은 흔들리지 않는다. 무릎만 흔들린다.

      관중석 맨 앞, 흉터 전사들의 자리에서 그롬들이 발을 구른다. 그 위로 크릭들이 내기를 외치고, 그 위에서 인간 하인들이 입을 다물고 있다. 꼭대기의 우르가쉬가 붉은 유리 왼눈으로 모래를 비추며 하품을 끝낸다.

      그때 — 관중의 함성이 한순간 다른 함성으로 바뀐다. 같은 모래, 다른 시대. 백 번째 상대가 쓰러지고, 그롬 수천이 일제히 침묵하던 날. 그날 모래 위에 서 있던 것이 누구였는지 너는 안다. 창을 쥔 손이, 이 몸이 배운 적 없는 각도로 고쳐 잡힌다.

      그리고 함성은 다시 오늘의 함성이다. 벡이 온다.
    effects: ["goto ba_sand", "var o6_awake = true", "learn fact_o6_hundredth_sand"]
    choices:
      - id: obey
        label: 고르바가 말한 대로 — 관중이 원하는 피를 준다
        minutes: 25
        text: |
          너는 창을 고쳐 쥐고 걸어 들어간다. 벡은 무릎을 버티려고 왼발에 몸을 싣는다 — 일곱 해 동안 너에게 '발부터'를 가르친 사람이. 다섯째 합에서 그 무릎이 꺾인다. 그는 모래에 한 손을 짚는다.

          삼만이 발을 구른다. 엄지들이 아래로 꺾인다. 심판석의 크롤이 깃발을 반쯤 든 채 꼭대기를 본다. 우르가쉬는 엄지를 움직이지도 않는다. 관중이 정한다.

          벡이 고개를 든다. 너를 본다. 너는 찌른다. 그가 가르친 자리, 갈비뼈 사이로.

          모래가 그를 받는다. 크롤의 목이 먼저 열린다. "열둘!" 관중이 받는다 — 열둘, 열둘. 터널 끝에서 무르크가 갈고리를 들고 걸어 나온다. 아무도 부축하지 않는 그롬이, 시체만은 천천히 끈다.
        effects: ["var o6_wins += 1", "var o6_bout_done = true", "agenda kill npc_o6_vek", "stress 15", "temper 자비 -5", "temper 충성 -3", "rel npc_gorba like 5", "rel npc_gorba trust 5", "rel npc_gm_eida trust -6", "rel npc_gm_mia trust -4", "note 가을 피의 날 — 엄지가 내려갔고, 벡을 찔렀다. 열둘", "goto ba_gate_tunnel"]
      - id: fight
        label: 정면으로 싸운다 — 벡이 가르친 대로
        minutes: 20
        check: {skill: 싸움, D: 30, helps: [spear, duelist, reflexes, battle_sense, grom_rage, giant_bone], hinders: [lame], warn: ["var o6_awake == true"]}
        success:
          text: |
            벡의 창이 먼저 온다. 무릎 나간 사람의 창이 아니다 — 일곱 해 동안 새벽마다 네 정강이를 때리던 그 창이다. 너는 비키지 않는다. 자루로 받고, 흘리고, 들어간다. 다섯째 합. 네 창 자루가 그의 오른쪽 무릎을 친다.

            벡이 모래에 무릎을 꿇는다. 관중이 일어선다.
          effects: ["rel npc_o6_vek trust 4", "then o6_thumbs"]
        failure:
          text: |
            벡의 창이 먼저 온다. 무릎 나간 사람의 창이 아니다. 너는 반 박자 늦는다 — 창끝이 옆구리를 가르고 지나간다. 뜨겁다. 그래도 그의 무릎은 거짓말을 하지 못한다. 넷째 합에 그가 넘어지고, 너도 한쪽 무릎을 모래에 박는다. 피는 네 쪽에서 더 많이 흐른다.

            관중이 일어선다. 그들에게는 누구의 피든 같다.
          effects: ["pain 30", "then o6_thumbs"]
      - id: knee
        label: 벡의 무릎을 노려 세 합 안에 끝낸다
        minutes: 10
        check: {skill: 싸움, D: 34, helps: [spear, duelist, reflexes, battle_sense], hinders: [lame], warn: ["var o6_awake == true"]}
        success:
          text: |
            첫 합에 너는 왼쪽으로 돈다 — 벡이 오른발로 몸을 돌려야 하는 쪽으로. 둘째 합, 그의 무릎이 반 박자 늦는다. 셋째 합에 네 창 자루가 그 무릎 뒤를 친다. 벡이 모래에 앉는다. 넘어지는 게 아니라, 앉는다.

            크롤의 깃발이 관중보다 먼저 오른다. 끝났다. 관중석에서 야유가 쏟아진다 — 피가 없는 끝이다. 꼭대기의 우르가쉬는 벌써 다음 판 쪽을 본다.

            벡이 모래에 앉은 채 숨을 고른다. "…세 합. 그건 내가 가르친 거냐." 대답을 기다리지 않는다. 쇠살대 너머에서 고르바가 벡의 무릎을 본다. 값을 매기는 눈으로.
          effects: ["var o6_wins += 1", "var o6_bout_done = true", "var o6_vek_crippled = true", "rel npc_o6_vek trust 6", "rel npc_o6_vek like 4", "rel npc_gorba like -5", "temper 자비 3", "note 가을 피의 날 — 세 합에 끝냈다. 벡은 살았다. 열둘 — 고르바가 벡의 무릎을 보았다", "goto ba_gate_tunnel"]
        failure:
          text: |
            첫 합에 너는 왼쪽으로 돈다. 벡은 그걸 안다 — 그가 가르친 수다. 그의 창 자루가 네 정강이를 후려친다. 너는 무릎을 꿇었다가 일어난다. 관중이 깨어난다. 피 냄새를 맡은 삼만이.

            여섯째 합에 그의 무릎이 마침내 버티지 못한다. 벡이 모래에 쓰러진다. 그리고 발 구르는 소리가 시작된다.
          effects: ["pain 15", "then o6_thumbs"]
      - id: act
        label: 피를 크게 보이되, 아무도 죽지 않게 한다
        minutes: 25
        check: {skill: 기만, D: 22, helps: [actor, deceit, duelist]}
        success:
          text: |
            너는 벡의 왼팔을 노린다 — 살이 두껍고 큰 핏줄이 없는 곳. 창끝이 팔뚝을 길게 긋는다. 피가 모래 위에 선을 그린다. 벡은 알아챈다. 그의 창이 네 어깨를 얕게 찢는다 — 일부러 크게, 일부러 얕게. 관중이 미친 듯이 발을 구른다.

            일곱째 합, 벡이 손목을 베인 채 모래에 눕는다. 숨은 쉰다. 크롤의 깃발이 오른다 — 네 승. 엄지들이 꺾이기 전에 관중은 이미 다음 피를 기다린다.

            터널로 돌아오는 길, 쇠살대 너머에서 고르바가 이빨 꿰미를 짤랑인다. "영리한 짐승." 그가 웃는다. "값이 올랐다. 다음엔 내 앞에서 춤추지 마라."
          effects: ["var o6_wins += 1", "var o6_bout_done = true", "var o6_vek_crippled = true", "var o6_clever_beast = true", "pain 8", "rel npc_gorba like 8", "rel npc_gorba trust 6", "rel npc_o6_vek trust 8", "memory npc_gorba 영리함 열하나가 피를 크게 보이고 벡을 살렸다 — 내 눈은 못 속였다", "note 가을 피의 날 — 피를 보이고 아무도 죽이지 않았다. 열둘. 고르바가 알아챘다 — '영리한 짐승'", "goto ba_gate_tunnel"]
