            깨어났을 때 크롤의 깃발은 이미 내려가 있다. 관중석의 그롬들이 애송이를 연호한다. 너는 무르크의 갈고리가 아니라 제 발로 터널까지 걷는다. 그것이 오늘 네가 가진 전부다.
          effects: ["var o6_twentieth_done = true", "pain 30", "stress 8", "rel npc_gorba like -6", "rel npc_gorba trust -4", "note 스무날 정식 대진 — 졌다. 승수는 그대로", "goto ba_gate_tunnel"]
