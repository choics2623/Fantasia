            너는 창끝을 모래에 내린다. 관중석에서 돌이 날아온다. 크롤의 깃발이 내려간다 — 둘 다 도전 불성립. 거부한 투사 둘.

            그롬 경비가 서른둘을 먼저 끌고 간다. 너는 그다음이다 — 그러나 고르바가 쇠살대를 연다. "이건 내 값이다." 그가 경비를 막는다. 그리고 네 귀에. "한 번만이다." 매가 길다.
          effects: ["var o6_stood_with_99 = true", "var o6_marks += 1", "pain 30", "rel npc_gorba trust -15", "rel npc_gm_irena trust 10", "rel npc_gm_eida trust 10", "temper 용기 3", "temper 자비 4", "note 서리월 스무날 — 창을 내렸다. 서른둘은 끌려갔고, 고르바가 나를 막았다 — '한 번만이다'", "goto ba_gate_tunnel"]
      - id: kick_blade
        label: 그의 칼을 발로 차 올려 쥐여 준다 — 싸우라고
        minutes: 30
        check: {skill: 싸움, D: 30, helps: [spear, duelist, reflexes, battle_sense], hinders: [lame]}
        success:
          text: |
            너는 그의 칼을 발끝으로 차 올린다. 칼자루가 그의 가슴에 부딪힌다. 그가 저도 모르게 쥔다. 쥐고 나서야 자기가 쥐었다는 것을 안다. "싸워." 네가 노예말로 말한다. "싸우면 소모품은 아니야."

            그가 싸운다. 서른두 번 이긴 손이다. 열째 합에 네 창 자루가 그의 무릎을 친다. 크롤의 깃발이 오른다. 그는 끌려가지 않는다 — 진 투사는 숙소로 돌아간다.

            터널 안쪽에서 이레나가 너를 본다. 두 번 숨 쉬고, 고개를 젓는다. 화난 얼굴이 아니다. 무언가를 다시 세는 얼굴이다.
          effects: ["var o6_wins += 1", "pain 10", "temper 자비 3", "rel npc_gm_irena trust -2", "rel npc_gm_eida trust 2", "note 서리월 스무날 — 서른둘의 칼을 차 올려 싸우게 했다. 이겼다. 그는 소모품으로 가지 않았다", "goto ba_gate_tunnel"]
        failure:
          text: |
            너는 그의 칼을 발끝으로 차 올린다. 그가 쥐지 않는다. 칼이 모래에 떨어진다. 관중석의 돌이 먼저 날아온다. 크롤의 깃발이 내려간다 — 도전 불성립. 그는 끌려간다. 너는 아니다. 쇠살대 너머에서 고르바가 네 몫의 셈을 한다. 승수는 그대로다.
          effects: ["pain 8", "rel npc_gm_irena trust 4", "rel npc_gorba trust -4", "note 서리월 스무날 — 서른둘은 칼을 쥐지 않았다. 그는 끌려갔다. 승부 없음", "goto ba_gate_tunnel"]

  # ───────────────────────── 고르바의 이빨 셋 — 새벽 북과 쇠우리 닫힘을 어긴 값 ─────────────────────────
  - id: o6_marks_sold
    origin: arena_fighter
    trigger: {window: {from: "312-09-02 00:00", to: "313-12-30 00:00"}, at: "@blood_arena", when: ["var o6_marks >= 3", "var o6_marks_pardoned != true", "not var player_fugitive == true"]}
    severity: 4
    text: |
      고르바가 너를 찾아온다. 이빨 꿰미를 쥐지 않은 빈손이다. 그 뒤에 그롬 호송꾼 둘.

      "이빨 셋." 그가 손가락 셋을 편다. "새벽 북에 없고, 쇠우리 문이 닫힌 뒤에 밖에 있고. 값이 셋 내린 것은 값이 없는 것이다." 북문 쪽에서 수레 바퀴 소리가 들린다.
    effects: ["goto ba_gates"]
    choices:
      - id: go
        label: 수레에 오른다
        minutes: 30
        text: |
          목고리에 쇠사슬이 걸린다. 수레가 북문을 지난다. 뼈 행렬까지 스무 시간.
        effects: ["captured 고르바의 이빨 셋 — 값이 없는 것으로 쳐져 북문의 수레에 실렸다"]
      - id: plead
        label: '"모래에서 값을 다시 매겨라." — 그롬 전투어로'
        minutes: 10
        check: {skill: 위압, D: 30, helps: [menace, command], hinders: [coward, stutter]}
        success:
          text: |
            고르바가 너를 오래 본다. 그리고 꿰미에서 이빨 셋을 꺼내 네 발 앞에 던진다. "주워라. 한 번이다." 호송꾼이 쇠사슬을 거둔다. 매는 길다. 그것으로 셈이 끝난다 — 한 번은.
          effects: ["var o6_marks = 0", "var o6_marks_pardoned = true", "pain 25", "note 고르바 — 이빨 셋을 돌려줬다. '한 번이다.'"]
        failure:
          text: |
            전투어가 갈라진다. 고르바가 손을 젓는다. 쇠사슬이 목고리에 걸린다. 수레가 북문을 지난다.
          effects: ["captured 고르바의 이빨 셋 — 북문의 수레에 실려 뼈 행렬로 갔다"]

  - id: o6_marks_final
    origin: arena_fighter
    trigger: {window: {from: "312-09-02 00:00", to: "313-12-30 00:00"}, at: "@blood_arena", when: ["var o6_marks >= 3", "var o6_marks_pardoned == true", "not var player_fugitive == true"]}
    severity: 4
    text: |
      고르바는 이번엔 말하지 않는다. 손가락 셋을 펴 보일 뿐이다. 북문 쪽에서 수레 바퀴 소리.
    effects: ["goto ba_gates"]
    choices:
      - id: go
        label: 수레에 오른다
        minutes: 30
        text: |
          한 번이라고 했다. 그롬은 셈을 두 번 하지 않는다.
        effects: ["captured 고르바의 이빨 셋, 두 번째 — 북문의 수레에 실려 뼈 행렬로 갔다"]

  # ───────────────────────── 원형장의 작은 장면 (연출가) — 쇠우리의 하루 ─────────────────────────
  - id: o6_dir_vek_beat
    origin: arena_fighter
    trigger: {director: true, category: bond, at: ba_training, hours: ["13:00", "17:00"], chance: 0.3, when: ["with npc_o6_vek"]}
    text: |
      오후의 훈련장. 벡이 가장자리에 앉아 창 자루로 바닥을 두드린다. 둘, 하나, 둘. 신참들의 발이 그 박자에 맞는다 — 맞지 않는 발은 그가 자루 끝으로 툭 친다.

      그가 너를 보지 않고 말한다. "창. 왼쪽이 늦다. 어제부터."
    choices:
      - id: drill
        label: 그의 박자에 맞춰 아홉 합을 돈다
        minutes: 60
        text: |
          둘, 하나, 둘. 찌르고, 받고, 돌고, 낮추고. 벡은 일어서지 못한다. 대신 그의 자루가 네 정강이를, 옆구리를, 왼쪽을 툭툭 친다 — 늦은 곳마다. 아홉 합이 끝나면 다시 처음부터.

          해가 기울 때 그가 자루를 멈춘다. "…됐다." 칭찬이 아니다. 그는 칭찬을 하지 않는다.
        effects: ["skill_gain 싸움 1", "fatigue 10", "bond npc_o6_vek 4", "rel npc_o6_vek like 3"]
      - id: sit
        label: 그 곁에 앉는다 — 신참들의 발을 같이 센다
        minutes: 30
        text: |
          둘이서 센다. 벡은 무릎을 쭉 뻗고 앉아 있다. 굽히지 못하는 무릎. 한참 뒤에 그가 말한다. "수레 바퀴 소리를 안 들어도 되는 날은 이게 다다." 그리고 다시 바닥을 두드린다.
        effects: ["stress -5", "bond npc_o6_vek 3", "rel npc_o6_vek trust 3"]

  - id: o6_dir_wrist
    origin: arena_fighter
    trigger: {director: true, category: calm, at: ba_dorm7, hours: ["21:00", "23:00"], chance: 0.3, when: ["with npc_mara"]}
    text: |
      철창에 기대 마라가 센다. 쇠판으로 고정한 턱이 거의 움직이지 않아서, 숫자마다 'ㅅ' 소리가 조금 샌다. 여든여섯, 여든일곱. 거기서 한 번 멈춘다.

      그녀가 고개를 돌리지 않고 손을 내민다. "손목 줘 봐."
    choices:
      - id: give
        label: 손목을 내민다
        minutes: 5
        text: |
          마라의 손이 네 손목을 쥔다. 세게. 힘을 잰다. "…아직 아니야." 그녀가 놓는다. "그래도 작년보다는." 그리고 다시 센다. 여든여덟, 여든아홉 — 백에서 멈출 것이다. 오늘도.
        effects: ["rel npc_mara like 5", "rel npc_mara trust 3"]
      - id: ask_after
        label: '"백에서 멈추면 — 그다음엔 뭘 세요?"'
        minutes: 5
        text: |
          마라가 처음으로 고개를 돌린다. 쇠판 턱이 한 번 운다. "그다음은 안 세. 자유니까." 그녀가 다시 철창에 기댄다. "탈처럼. 탈은 황무지로 걸어갔대. 자유롭게." 숫자가 다시 시작된다. 하나부터.
        effects: ["rel npc_mara trust 2", "note 마라 — '그다음은 안 세. 자유니까.'"]

  - id: o6_dir_morning_foe
    origin: arena_fighter
    trigger: {director: true, category: threat, at: ba_training, hours: ["05:10", "07:30"], chance: 0.25, when: ["alive npc_urgash"]}
    text: |
      훈련장 철창이 열리고 뼈의 전당 사환이 들어선다 — 해골 목걸이를 건 그롬 애송이. 그가 투사들의 줄을 따라 걷는다. 군주의 아침 상대를 고르러 왔다. 오늘 군주는 인간을 원한다.

      줄이 조용해진다. 아무도 앞으로 나서지 않는다. 사환의 손가락이 네 옆의 신참 앞에서 멈춘다. 열여섯, 승수 둘. 손이 떨린다.
    choices:
      - id: step_up
        label: 앞으로 나선다 — "나다."
        minutes: 120
        risk: 군주는 아침마다 진짜로 싸운다
        check: {skill: 싸움, D: 48, helps: [spear, duelist, reflexes, battle_sense, grom_rage, giant_bone, pain_tolerance], hinders: [lame, frail]}
        success:
          text: |
            뼈의 마당. 우르가쉬는 무기를 들지 않는다. 맨손이다. 3미터의 몸이 아침 햇빛을 가린다. 첫 합에 너는 날아간다. 둘째 합에도. 셋째 합 — 그의 오른쪽 어깨가 한 박자 늦다. 아주 조금. 너는 그 한 박자 안에서 서 있는다.

            "서라." 그가 말한다. 너는 서 있다. 그가 이빨을 드러낸다. 웃음인지 다른 것인지. "다음엔 오른쪽에 서지 마라." 그것이 그가 숨기는 쪽이다.
          effects: ["var o6_morning_stood = true", "learn fact_o6_urgash_shoulder", "pain 30", "rel npc_urgash like 12", "rel npc_urgash trust 4", "temper 용기 5", "skill_gain 싸움 1", "note 군주의 아침 상대 — 세 합을 서서 버텼다. 그의 오른쪽 어깨가 한 박자 늦다"]
        failure:
          text: |
            뼈의 마당. 우르가쉬는 맨손이다. 첫 합에 너는 날아간다. 둘째 합에 갈비뼈가 운다. 셋째 합은 기억나지 않는다. 깨어났을 때 너는 치료소에 눕혀져 있고, 노라베가 네 옆구리를 소금물로 닦는다. "숨 쉬어. 그거면 돼."
          effects: ["pain 45", "rel npc_urgash like 4", "temper 용기 3", "goto ba_infirmary"]
      - id: push
        label: 신참을 앞으로 민다
        minutes: 5
        text: |
          네 손이 신참의 등을 민다. 아주 조금. 그것으로 충분하다. 사환이 신참의 목고리를 잡고 데려간다. 아이는 돌아보지 않는다.

          점심 무렵 그 아이가 돌아온다. 걸어서는 아니다.
        effects: ["temper 자비 -8", "temper 용기 -3", "stress 12", "note 군주의 아침 상대 — 신참을 밀었다. 그 아이는 걸어서 돌아오지 못했다"]
      - id: still
        label: 줄에 그대로 서 있는다
        minutes: 5
        text: |
          아무도 움직이지 않는다. 사환이 신참의 목고리를 잡는다. 그때 줄 끝에서 외팔이 하나가 앞으로 나선다 — 하르트, 아흔넷. 사환이 망설이다가, 신참을 놓는다.

          하르트는 점심 무렵 돌아온다. 걸어서. 입가에 피를 문 채 웃으며. "아직." 아무도 너를 보지 않는다.
        effects: ["stress 6", "temper 용기 -2", "rel npc_gm_hart like -2", "note 군주의 아침 상대 — 하르트가 대신 나섰다"]
