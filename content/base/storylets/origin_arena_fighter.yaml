            "무릎 나간 것이 걷는다." 너는 그롬 전투어로 말한다. "수레가 실어 갈 것은 걷지 못하는 것이다." 고르바가 벡의 무릎을 오래 본다. 그리고 서기의 서류에서 한 줄을 긋는다. "한 시간짜리 다리다. 나도 안다." 그가 이빨 꿰미를 짤랑인다. "그래도 걸었다. 걸은 것은 값이 있다."
          effects: ["var o6_vek_kept = true", "rel npc_o6_vek trust 10", "rel npc_o6_vek like 6", "rel npc_gm_norabe trust 6", "note 스무날 — 노라베의 붕대로 벡이 서기 앞까지 걸었다. 수레는 그를 두고 갔다"]
        failure:
