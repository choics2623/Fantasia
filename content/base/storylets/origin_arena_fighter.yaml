          그가 서기의 서류에서 한 줄을 긋는다. 손톱이 종이를 찢는다. "늙은 것은 창걸이에 걸어 둬라." 그리고 너에게만. "너는 이제 내 값이 아니다. 내 빚이다. 그롬은 빚을 잊지 않는다."
        effects: ["var o6_vek_kept = true", "rel npc_gorba like -20", "rel npc_gorba trust -20", "memory npc_gorba 위험함 열하나가 마라의 열한 경기를 안다", "note 스무날 — 마라의 열한 경기로 고르바를 눌렀다. 벡은 남는다. 고르바는 잊지 않는다"]

  # ───────────────────────── 스무날 정식 대진 — 승수는 정식 대진만 센다 ─────────────────────────
