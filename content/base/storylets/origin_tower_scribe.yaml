          "긴밤월 아흐레 전에 섬을 떠." 할멈이 네 손바닥에 바늘 하나를 쥐여 준다. "조수 무덤 아래 바다 동굴. 썰물 두 시간. 등대 바위의 조개 — 그 사람도 서기였어. 한 해에 한 번, 하선의 밤에 옛 봉화대에 불을 피워. 그롬마르 쪽 배가 그 불을 봐." 바늘 끝이 네 손바닥을 찌르지 않을 만큼만 누른다. "그날이 긴밤월 아흐레야. 네 이관 전날 밤."

          할멈이 종이를 다시 무릎으로 가져간다. 긴밤월 열흘의 구멍 줄 끝에, 바늘이 구멍 하나를 더 낸다. 물음표다. 구멍 글에서는 그렇게 쓴다.
        effects: ["var o9_hester_ally = true", "learn fact_o9_hester_why", "learn fact_o9_tide_cave", "learn fact_p2ar_fisher_beacon", "item o9_needle", "rel npc_ar_hester trust 15", "rel npc_ar_hester like 10", "bond npc_ar_hester 8", "temper 자비 3", "note 헤스터 — 보고는 할멈이 썼다. 용서했다. 나가는 길: 조수 무덤 아래 동굴(썰물 두 시간), 등대 바위의 조개, 긴밤월 9일 밤의 봉화"]
