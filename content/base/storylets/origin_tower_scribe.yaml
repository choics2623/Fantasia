      - id: turn_in
        label: 아무 대답 없이 돌아선다 — 잿빛 눈 사무실의 등잔이 아직 켜져 있다
        minutes: 40
        risk: 서기 일흔과 판자 틈의 서른한 권
        text: |
          너는 대답하지 않고 돌아선다. 할멈도 붙잡지 않는다. 바늘 소리가 다시 시작된다 — 아까보다 빠르게.

          잿빛 눈 사무실의 등잔은 아직 켜져 있다. 마티스 그레이브는 한 가지만 묻는다. "어디에." 너는 말한다. 판자 틈. 서른한 권. 바늘. 서기실장.

          이튿날 저녁, 필사대 맞은편 자리가 비어 있다. 수집 후보 목록의 셋째 줄에 줄이 그어진다 — 쓸모 있는 서기는 수집하지 않는다. 판자 틈에서 나온 종이는 탑 마당에서 탄다. 서른한 권이 타는 동안 일흔이 서로의 문장을 잃는 소리는 나지 않는다. 종이는 소리 없이 탄다.

          서기실장은 탑 기록 훼손으로 처형되었다. 탑주의 장부에는 한 줄로 적혔다.
        effects: ["var o9_sold_holes = true", "var o9_struck = true", "agenda learn npc_ar_mathis fact_p2ar_hester_hole_script", "agenda learn npc_ar_mathis fact_p2ar_yona_hole_keeper", "agenda kill npc_ar_hester", "rel npc_ar_mathis trust 20", "memory npc_ar_mathis 영리함 서기 칠번이 서기실장과 구멍 글을 넘겼다", "memory npc_ar_yona 위험함 칠번이 판자 틈을 팔았다", "memory npc_milo 위험함 칠번이 서기실장을 팔았다", "deed inform npc_ar_hester", "temper 충성 -15", "temper 자비 -10", "note 헤스터와 구멍 글을 마티스에게 팔았다 — 내 줄에 줄이 그어졌다. 서른한 권이 탔다. 할멈은 처형되었다"]
