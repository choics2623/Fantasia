# 잿빛 탑 서기 노예 (SCENARIOS O-09 `origin.tower_scribe`) — 회귀점의 대본 장면과 첫 열흘의 뒤따름. 수치는 creation/origins_tower_scribe.yaml.
# 문법은 greyford_opening.yaml 머리말과 같다. origin: 이 출신으로 시작한 판에서만 열리고 stage가 걸린다. {name} = 진짜 이름 (헤스터만 안다).
#
# SCENARIOS → 자료 (지역 자료가 이긴다):
#   '셋째 필사실'(등잔 열둘, 서기 열둘)       → 재의 서고의 긴 필사대 gt_dust_desk (서기 일흔이 나란히 앉는다)
#   담당 학자 펠릭 회색혀 (용인, 무심, 신뢰 10) → 마티스 그레이브 npc_ar_mathis — 귀의 부서장, 14~18시 필사대에서 징후자 목록을 '보는 척'
#   노파 테클라 (61, 몰래 글을 가르친 사람)   → '먹물 할멈' 헤스터 npc_ar_hester — 서기실장. 정본에서 '서기가 읽음'은 서기실장이 보고한다(REGIONS 10.7)
#   테클라의 고백 (손자를 내보내는 값)         → 헤스터의 고백: '읽는다'가 아니라 '잠꼬대'로 하나를 먼저 내주어 서기 일흔을 지켰다 (손자는 카드에 없다)
#   '동료 보고'를 처음 한 아이                 → 새 사람 도브 npc_o9_dov (서기 백열둘, 아래 침상) — extra_tower_scribe.yaml
#   말 없는 요나스 (오인된 피험자, 옛 지도)     → 0307호 네레 npc_ar_nere (벽의 숯 그림 길) + 0213호의 노인 npc_ar_old0213 ('같은 꿈')
#   관찰실 이관 (긴밤월)                        → 지하 수집실 gt_collection_room, 긴밤월 10일 새벽 — 11월 9일 피험자 열둘 하선 다음 날(events/arkas_312.yaml)
#   timer.forgery_check (14일)                  → 낙엽월 15일부터 틱 셈쟁이 npc_ar_tik가 사본을 원본과 맞춰 센다 (탑 기록 훼손 = 처형, REGIONS 10.7)
#   truename.fragment.ash                       → 목록 여백의 진명어 받아쓰기 (o9_torn_name_scrap, fact_o9_torn_name_fragment)
#   archive_key (대붕괴 목격자 진술)            → 연출 장면 o9_dir_testimony (fact_o9_collapse_testimony)
#   salt_ship_escape                            → 이 엔진에서는 장면이 고장을 옮기지 못한다: 헤스터가 길(조수 동굴·조개·11월 9일 밤 봉화)을 알려 주고, 바다를 건너는 것은 플레이어의 먼 길이다
#   의지 판정 → 기만(손과 눈을 감추기) · 학식 → 통찰 · 고대 진명어 → 손재주(모양대로 옮기기) + 진명의 귀
# 변수: o9_suspicion(마티스의 의심, 2 이상이면 '한 가지만') · o9_forged · o9_struck(셋째 줄이 지워졌다) · o9_dov_swapped · o9_hester_* · o9_sold_holes
storylets:
  # ───────────────────────── 회귀점: 오후 필사 ─────────────────────────
  - id: o9_ink_open
    origin: tower_scribe
    trigger: {start: true}
    stage:
      - {npc: npc_ar_mathis, at: gt_dust_desk, from: "14:00", to: "15:40", doing: 원고 한 묶음을 서기 칠번 앞에 내려놓고 필사대 끝 의자에서 손끝으로 탁자를 누른다}
      - {npc: npc_ar_hester, at: gt_dust_desk, from: "14:00", to: "18:00", doing: 칠번의 맞은편에서 먹을 간다 — 칠번을 보지 않는다}
      - {npc: npc_o9_dov, at: gt_dust_desk, from: "14:00", to: "18:00", doing: 필사대 끝자리에서 모양만 베낀다 — 가끔 칠번 쪽을 본다}
      - {npc: npc_milo, at: gt_dust_desk, from: "14:00", to: "18:00", doing: 두 자리 건너에서 탑 장부를 베낀다 — 입술이 소리 없이 숫자를 센다}
    text: |
      먹 냄새. 젖은 종이, 식은 밀랍, 오래된 양피지의 단 먼지.

      재의 서고에는 창이 없다. 긴 필사대 하나에 서기 일흔이 어깨를 붙이고 앉는다. 등잔은 학자들의 자리에만 있다 — 서기의 손은 그 불빛이 닿는 데까지만 보인다. 서기는 글을 읽지 못한다고 장부에 적혀 있다. 학자들이 쓴 것을 모양 그대로 옮겨 그리는 손. 그래서 학자들은 서기 앞에서 무엇이든 쓴다.

      정오 귀리죽은 벌써 배 속에서 식었다. 오후 필사. 네 목의 쇠 목걸이에는 숫자 하나가 찍혀 있다 — 칠. 이 서고에서 너는 그 숫자다.

      필사대 끝에서 털옷 자락이 바닥을 쓴다. 마티스 그레이브 — 사냥꾼 부서 '귀'의 부서장, 왼쪽 귀가 반쯤 접힌 용인 학자 — 가 원고 한 묶음을 네 앞에 내려놓는다. "사본 둘. 저녁 종 전까지." 그는 필사대 끝 의자에 앉아 손끝으로 탁자를 누른다. 기다리는 사람의 손이다.

      맞은편에서 먹 가는 소리가 멎는다. 서기실장 헤스터 — 서기들이 먹물 할멈이라 부르는, 허리에 바늘 쌈을 찬 노파 — 가 너를 보지 않은 채 입술을 움직인다. 소리 없이.
    input: true_name
    input_label: 헤스터만 아는 이름
    input_button: 그 입 모양을 읽는다
    input_say: 맞은편의 입술이 소리 없이 움직인다
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "먹 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 먹 냄새."}
    trace_lines:
      water: 목 안에 물이 있다. 없다. 밀물은 저 아래 절벽, 조수 무덤에 있다.
      teeth: 목덜미가 가렵다. 긁으면 손톱 밑에 먹물뿐이다.
      spear: 옆구리가 시리다. 경비의 창 자루가 닿았던 자리다. 아무것도 닿지 않았다.
      blade: 목이 뜨겁다 — 유리처럼 차갑게. 손을 대 보면 쇠 목걸이뿐이다.
      rope: 손목이 쓸린다. 말뚝의 밧줄. 손목 안쪽에는 탑 번호 문신뿐이다.
      hunger: 배가 꼬인다. 정오 귀리죽은 먹었다. 먹었을 것이다.
      fall: 발밑이 꺼진다. 탑의 계단은 열일곱 층이다. 너는 의자에 앉아 있다.
    return_ink: |
      ┊ 그 다음엔 원고의 셋째 줄이었다. 서기 칠번 — 긴밤월 10일 새벽, 지하 수집실.
    after_input: |
      "{name}."

      소리는 나지 않는다. 서고에서 소리는 벽을 넘는다. 열두 해 전, 목걸이가 채워지기 전에 서고 문턱에서 그 이름을 물은 사람이 할멈이다. 할멈은 그 이름을 어느 필사본 여백에 바늘구멍으로 박아 두었다. 여백에 이름을 쓰는 것은 서기들의 금기다 — 할멈은 쓰지 않고 뚫었다.

      할멈이 다시 먹을 간다. 아주 천천히. 할멈이 그 입 모양을 하는 날은 한 해에 한 번, 네가 이 서고에 들어온 날뿐이다. 오늘은 그날이 아니다.
    effects: ["note 헤스터만 아는 이름 — {name}. 서고에서는 너를 칠번이라 부른다"]
    next: o9_list_line

  # ── 둘째 화면: 셋째 줄 + 잔향의 각성 ──
  - id: o9_list_line
    origin: tower_scribe
    text: |
      원고는 열두 줄이다. 맨 위에 학자의 필체로 — 분기 수집 후보. 긴밤월.

      너는 늘 하던 대로 첫 줄부터 베낀다. 모양만. 획만.

      첫째 줄. 루멘 강변, 열한 살 사내아이 — 열병 뒤 남의 꿈을 말함 (이웃 보고). 둘째 줄. 세렌 하층 어촌, 예순 넘은 여자 — 양 눈에 회색 얼룩 (사냥꾼 보고).

      셋째 줄에서 손이 멈출 뻔한다.

      서기 칠번 — 수면 중 고대 진명어 잠꼬대 (동료 보고). 홍채 회색 고리 의심. 긴밤월 10일 새벽, 지하 수집실 이관.

      서기 칠번. 네 목걸이의 숫자다. 동료 보고 — 이 서고의 누군가가 네 잠꼬대를 팔았다. 줄 옆 여백에 낯선 글자 세 개가 받아 적혀 있다. 진명어다. 네 잠든 입이 했다는 말.

      펜촉이 종이 위에서 떨지 않게 숨을 고른다. 학자들은 서기의 손을 본다. 손이 멈추면, 읽었다는 뜻이니까. 필사대 끝에서 마티스의 손끝이 탁자를 누르다 멎는다. 맞은편에서 헤스터가 너를 보지 않은 채 먹을 간다. 아주 천천히.

      펜촉이 저절로 다른 획을 그으려 한다. 학자들이 '찢어진 시간의 이름'이라 부르는, 이 탑이 백열한 해 동안 찾아 온 진명의 첫 획. 여백의 셋째 낱말이 멎은 바로 그 자리에서 이어지는 획. 네 손은 그것을 안다. 그 이름을 마지막으로 소리 내어 말한 입을, 네 안의 누군가가 기억하니까. 아스테리온. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["learn fact_o9_transfer_date", "var o9_list_known = true", "note 수집 후보 목록 셋째 줄 — 서기 칠번. 수면 중 잠꼬대(동료 보고). 긴밤월 10일 새벽, 지하 수집실 이관"]
    choices:
      - id: forge_one
        label: 사본의 '칠'에서 가로획 하나를 뺀다 — 서기 일번은 수확월에 죽었다
        minutes: 40
        risk: 원본과 맞춰 세면 드러난다 — 탑 기록 훼손은 처형
        check: {skill: 손재주, D: 32, helps: [forgery, scribe]}
        success:
          text: |
            가로획 하나. 칠이 일이 된다. 사본 두 장 모두. 네 손은 떨지 않았다 — 떨지 않은 손이 더 무섭다.

            서기 일번은 수확월 열이틀에 회랑 결핵으로 죽었다. 그 번호는 아직 아무에게도 다시 주어지지 않았다. 저녁 종 전에 마티스가 사본을 걷는다. 줄 수만 센다. 열둘. 원본은 그의 품으로, 사본은 하나는 회랑으로, 하나는 잿빛 눈 사무실로.

            보름이 지나면 틱 셈쟁이가 사본을 원본과 맞춰 센다. 틱은 죽은 번호를 다 센다.
          effects: ["var o9_forged = true", "learn fact_o9_tik_counts_copies", "stress 8", "rel npc_ar_mathis trust 2", "note 사본 두 장의 '칠'에서 획 하나를 뺐다 — 사본에는 죽은 일번, 원본(마티스의 품)에는 아직 칠. 낙엽월 15일부터 틱이 사본을 원본과 맞춰 센다"]
        failure:
          text: |
            획을 빼려던 펜촉이 종이에 박힌다. 먹이 번진다. 칠도 일도 아닌 검은 꽃.

            마티스가 일어선다. 사본을 들어 등잔에 비춘다. 번진 자리가 정확히 셋째 줄이다. "한 가지만 물어보지요." 그는 묻지 않는다. 사본을 반으로 접어 화로에 넣고 원고를 다시 네 앞에 민다. "처음부터." 그 뒤로 그는 필사대 끝 의자로 돌아가지 않는다. 네 등 뒤에 선다.
          effects: ["var o9_suspicion += 1", "stress 10", "fatigue 10", "memory npc_ar_mathis 이상함 서기 칠번의 먹이 수집 목록 셋째 줄에서 번졌다"]
      - id: memorize
        label: 펜을 멈추지 않은 채 열두 줄을 통째로 외운다
        minutes: 30
        check: {skill: 통찰, D: 30, helps: [memory_palace, photo_memory, scribe]}
        success:
          text: |
            첫째 줄부터 열두째 줄까지. 루멘 강변의 사내아이. 세렌 어촌의 노파. 숯 굽는 마을의 쌍둥이. 마른 우물에 대고 말을 하는 과부. 아홉째 줄 — 0307호, 네레, 열네 살, 열병 꿈. 줄마다 열병이고, 악몽이고, 재먼지 눈병이다. 진짜 징후는 하나도 없다. 하나를 빼면.

            맨 아래, 학자의 작은 글씨. 셋째 시험 열다섯째 — 후보 둘을 이 목록에서. 긴밤월 20일.

            바깥의 열은 긴밤월 9일 배로 온다. 너는 그들의 얼굴을 모른다. 줄을 안다.
          effects: ["var o9_list_memorized = true", "learn fact_o9_eleven_innocents", "learn fact_o9_list_feeds_third_test", "learn fact_p2ar_nere_third_test_candidate", "temper 자비 2", "note 수집 후보 목록 열두 줄을 외웠다 — 열한 줄은 열병과 악몽. 셋째 시험 열다섯째(긴밤월 20일)의 후보 둘이 이 목록에서: 0307호 네레, 그리고 수집실로 내려가는 하나"]
        failure:
          text: |
            다섯째 줄에서 글자들이 서로의 자리로 미끄러진다. 숫자만 남는다. 열둘. 칠. 긴밤월. 마티스의 손끝이 다시 탁자를 누른다. 너는 눈을 원고에서 떼고 손만 본다. 손은 모양을 안다. 머리는 다섯째 줄에서 멈췄다.
          effects: ["stress 6"]
      - id: margin_word
        label: 여백의 진명어 받아쓰기를 펜촉으로 소매 안감에 옮긴다
        minutes: 10
        risk: 서기가 글을 지니면 끝이다 — 몸수색
        check: {skill: 손재주, D: 28, helps: [truename_ear, tongues, scribe]}
        success:
          text: |
            펜촉 끝으로 소매 안감을 긁는다. 세 낱말. 둘은 끝까지 쓰였다. 셋째는 첫 획에서 멎었다 — 받아 적은 손이 거기서 멈췄거나, 네 입이 거기서 멈췄다.

            받아 적은 글씨를 너는 안다. 학자의 글씨가 아니다. 진명어를 뜻 모르고 모양대로 그린 손, 획을 끝까지 눌러 쓰는 버릇, 맺음마다 바늘을 꽂듯 찍은 점. 서기의 손이다. 이 서고 안의.
          effects: ["item o9_torn_name_scrap", "var o9_has_fragment = true", "learn fact_o9_margin_hand", "note 소매 안감 — 여백의 진명어 받아쓰기. 받아 적은 손은 서기의 손, 맺음마다 바늘을 꽂듯 찍은 점. 몸수색에 걸리면 끝이다"]
        failure:
          text: |
            펜촉이 소매에 걸려 작게 운다. 맞은편에서 헛기침이 먼저 온다. 헤스터다. 마티스의 접힌 귀가 그쪽으로 돈다 — 헤스터 쪽으로, 그리고 너에게로.

            너는 소매를 내리고 원고로 돌아간다. 여백의 세 낱말은 네 것이 되지 못했다. 할멈의 헛기침은 서고의 규칙이다. 소리 내어 읽는 서기가 있을 때 나는 소리. 오늘은 아무도 소리 내어 읽지 않았다.
          effects: ["var o9_suspicion += 1", "rel npc_ar_hester trust 3", "memory npc_ar_mathis 이상함 서기 칠번이 필사 중에 소매를 만졌다 — 서기실장이 헛기침을 했다"]
      - id: ask_mathis
        label: '사본을 건네며 마티스에게 — "회랑 쪽 사본은 어느 문으로 가져갑니까, 나리?"'
        minutes: 5
        check: {skill: 기만, D: 30, helps: [deceit, actor, tongue]}
        success:
          text: |
