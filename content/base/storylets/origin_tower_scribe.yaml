          "…그 길, 이름이 있었구나." 아이의 목소리가 처음으로 또렷하다. "꿈에선 아무도 안 알려 줬어요."

          복도 끝에서 브릭의 열쇠 소리가 멎었다가, 다시 이어진다.
        effects: ["learn fact_o9_streets_names", "learn fact_p2ar_nere_dream_map", "var o9_nere_named = true", "var o9_brick_heard = true", "bond npc_ar_nere 6", "rel npc_ar_nere trust 12", "rel npc_ar_nere like 8", "echo_sign 1 처음 보는 길의 이름을 안다", "memory npc_ar_nere 이상함 서기가 내 꿈의 길 이름을 안다", "memory npc_ar_brick 이상함 서기 칠번이 0307호 앞에서 처음 듣는 이름들을 속삭였다"]
      - id: tell_test
        label: 식사 구멍에 대고 셋째 시험이 무엇인지 말해 준다 — 거짓 없이
        minutes: 15
        check: {skill: 화술, D: 24, helps: [tongue, teacher]}
        success:
