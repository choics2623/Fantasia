  # ───────────────────────── 울릭의 발가락: 의무실 여자가 나오는 해 질 녘 ─────────────────────────
  - id: o7_ulric_toes
    origin: frost_runaway
    trigger: {window: {from: "312-09-02 17:30", to: "312-09-04 18:45"}, at: cg_north_gate, with: npc_cg_magda, when: ["alive npc_o7_ulric", "var o7_ulric_cut != true", "var o7_ulric_dead != true"]}
    severity: 3
    stage:
      - {npc: npc_cg_magda, at: cg_north_gate, from: "312-09-02 17:40", to: "312-09-02 18:40", doing: 쪽문으로 나와 문 앞 무리의 언 발을 본다 — 손바닥을 비벼 데우며}
      - {npc: npc_cg_magda, at: cg_north_gate, from: "312-09-03 17:40", to: "312-09-03 18:40", doing: 쪽문으로 나와 문 앞 무리의 언 발을 본다 — 손바닥을 비벼 데우며}
      - {npc: npc_cg_magda, at: cg_north_gate, from: "312-09-04 17:40", to: "312-09-04 18:40", doing: 쪽문으로 나와 문 앞 무리의 언 발을 본다 — 손바닥을 비벼 데우며}
    text: |
      문 닫는 나팔 직전. 쪽문이 열리고 앞치마를 두른 여자가 진흙 위로 나온다. 앞치마에 마른 약초 잎이 붙었고, 왼손 약지가 굽었다. 손바닥을 비벼 데우며 언 발들 사이를 걷는다. 의무실 사람이다 — 사령관이 해 질 녘 한 시간은 눈감는다고, 문 옆의 크릭이 투덜거린다.

      그녀가 울릭 앞에서 멈춘다. 울릭이 털가죽을 푼다. 단 냄새가 올라온다. 발가락 넷이 검다. 검은 것이 발등으로 번지는 자리에 붉은 띠가 둘렸다.

      "손부터 내놔 봐." 여자가 울릭의 손을 쥐었다 놓는다. 그리고 발을 본다. 오래. "붉은 띠가 무릎에 닿으면 늦어. 잘라야 해. 오늘."

      울릭이 웃는다. 서리말로. "발가락 열 개로 서리 길을 넘었다. 그걸로 됐다."

      여자는 서리말을 모르는 척한다. 알아듣는 얼굴이다.
    effects: ["learn fact_o7_magda_gate"]
    choices:
      - id: magda_cut
        label: '의무실 여자에게 맡긴다 — "자르세요. 제가 붙잡겠습니다."'
        minutes: 40
        text: |
          그녀가 크릭의 화로에 작은 톱날을 넣는다. 너는 울릭의 어깨를 끌어안는다. 잉가가 인형을 두 손으로 들어 제 눈을 가린다.

          울릭은 소리를 지르지 않는다. 서리말로 센다. 하나, 둘 — 넷에서 멈춘다. 발가락이 넷이었다.

          여자가 단 냄새 나는 넝마를 진흙에 버리고 손을 닦는다. "약초가 모자라. 쑥이든 버드나무 껍질이든. 돈은 필요 없어." 그녀가 쪽문으로 돌아간다. 돌아보지 않는다.
        effects: ["var o7_ulric_cut = true", "var o7_owe_magda = true", "rel npc_cg_magda trust 6", "rel npc_cg_magda like 4", "rel npc_o7_ulric like 6", "rel npc_o7_ulric trust 4", "memory npc_cg_magda 다정함 노인을 끌어안고 놓지 않은 북쪽 것", "stress 4", "note 의무실 여자 — 울릭의 발가락 넷을 잘랐다. 약초를 원한다 (쑥, 버드나무 껍질)"]
      - id: knife_cut
        label: 부츠의 뼈 칼을 화로에 달군다 — 네 손으로 자른다
        minutes: 40
        risk: 잘못 자르면 피가 멎지 않는다
        check: {skill: 손재주, D: 12, helps: [medic, herbalist, knife_hand]}
        success:
          text: |
