        minutes: 20
        text: |
          너는 서툰 공용어로, 막히는 데서는 노예말로 말한다. 돌무릎 골짜기. 장로 아스타가 사람을 세어 내보낸다. 서리월 전에 — 이백이 더.

          "이백." 사내가 되뇐다. 장교의 석판 위에서 왼손이 멈췄다가, 적는다. 아스타. 이백.

          사내의 눈이 잠깐 서쪽 바위 쪽으로 간다. 거기 아무것도 없다는 듯이. "서리월 1일, 이 문을 닫는다." 그가 말한다. 무리에게가 아니라 너에게. "그 뒤로 오는 자는 이 문을 지나지 못한다." 그리고 돌아선다.
        effects: ["var o7_told_kaspar = true", "learn fact_cg_oct1_closure_order", "rel npc_kaspar trust 8", "memory npc_kaspar 정직함 아스타와 이백을 말해 준 북쪽 것", "memory npc_lea 영리함 아스타라는 이름을 댄 북쪽 것 — 골짜기의 장로", "note 반쪽 비늘의 사령관 — 서리월 1일 문을 닫는다. 그 뒤로 오는 자는 이 문을 지나지 못한다. 눈이 서쪽 바위로 갔다"]
