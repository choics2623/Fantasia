# O-07 북방 거인 노예 탈주자 — 회귀점의 대본 장면과 첫 열흘 (creation/origins_frost_runaway.yaml).
# 문법은 greyford_opening.yaml 머리말과 같다. {name} = 울릭만 아는 진짜 이름. origin: 이 출신으로 시작한 판에서만 열리고, stage도 그 판에만 걸린다.
#
# SCENARIOS O-07 → 이 파일 (지역 자료가 이긴다 — 사람 대응은 origins_frost_runaway.yaml 머리말)
#   frost_opening_crowgate 「까마귀 문」  → o7_crowgate_open (08:00, 이름) → o7_gate_thirty (레아의 서른 + 잔향의 각성 「군데」)
#   (서른이 문 안으로)                    → o7_noon_door      낙엽월 1일 정오 — 받은 자는 바깥문과 쇠창살 사이 통로로. 울릭·잉가와 갈리는 자리
#   ulric_toes 「울릭의 발가락」          → o7_ulric_toes     2~4일 해 질 녘, 의무실 마그다가 쪽문으로 나온다 (stage) — 자를 것인가
#                                         o7_ulric_last     5일부터 — 자르지 않았으면 붉은 띠가 무릎을 넘는다 (울릭의 죽음)
#   (까마귀 문의 정본: 간수 베른의 쪽지) → o7_tenth_note     2일 밤 11시 — 감옥 뒷문의 열 번째 쪽지가 송곳니 초소로 (베른 일과 monthday 2)
#   (카스파르의 세 질문 — 심문의 정본)   → o7_three_questions 3일 오전 — 비 오는 날, 쪽문 앞에서 문 밖 무리에게 (stage)
#   hungry_hill_camp·halvor_envoy        → 회색여울 쪽 장면이라 쓰지 않았다. 대신 쪽지의 값이 문 앞으로 온다:
#                                         o7_fangs          5~8일 밤 — 송곳니들이 골짜기 이름을 들고 문 밖 무리로 (쪽지를 막지 못했으면)
#   문 앞의 소품 (연출가)                 → o7_gate_frozen · o7_crick_coin (북문 앞에서만, 이 출신의 판에서만 — var o7_ulric_known)
# 정본과의 이음: 서리월 1일 북문 봉쇄(ag_cg_gate_closed) · 3일 밤 물빼기 굴(cg_drain_night)은 이 출신에게도 그대로 온다.
storylets:
  # ───────────────────────── 회귀점: 북문 앞 진흙, 아침 8시 ─────────────────────────
  - id: o7_crowgate_open
    origin: frost_runaway
    trigger: {start: true}
    stage:
      - {npc: npc_lea, at: cg_north_gate, from: "08:00", to: "12:10", doing: 성문 위 성벽에 서서 받을 서른을 고른다 — 이름보다 손과 신발을 본다}
      - {npc: npc_cg_brynja, at: cg_north_gate, from: "08:00", to: "09:40", doing: 무리 가장자리에서 장교의 말을 서리말로 옮긴다 — 돌아갈 사람의 값을 센다}
      - {npc: npc_cg_gunter, at: cg_north_gate, from: "08:30", to: "13:00", doing: 문 앞에서 짐 질 손을 고른다 — 이름보다 손부터 본다}
      - {npc: npc_kaspar, at: cg_north_gate, from: "10:20", to: "11:20", doing: 진눈깨비 속에 북문 위로 올라와 문 앞 진흙을 내려다본다}
      - {npc: npc_cg_bern, at: cg_north_gate, from: "12:00", to: "13:30", doing: 문틈에서 들어오는 자마다 이름과 골짜기를 묻고 적는다}
    text: |
      젖은 털가죽 냄새. 진눈깨비가 털 사이로 스며 살에 닿는다.

      까마귀 문은 이름처럼 검다. 협곡을 막아선 돌벽 위에 정말로 까마귀가 앉아 있고, 장대 끝에는 새가 아닌 것도 걸려 있다. 그 아래 진흙 벌판에 너 같은 사람이 이백쯤 앉아 있다. 털가죽을 뒤집어쓴 등, 등, 등. 아무도 일어서지 않는다. 일어서면 바람이 먼저 온다.

      서리 길을 넘는 데 열아흐레가 걸렸다. 돌무릎 골짜기를 나설 때는 마흔이었다. 아흐레째 밤, 울음 고개에서 케틸이 — 네 동생이 — 웅크린 채 일어나지 않았다. 그 뒤로 너는 세지 않는다.

      잉가가 네 무릎 사이에 앉아 나무 인형을 안고 있다. 열두 살. 케틸이 깎다 만 인형이다. 아이의 입술이 소리 없이 움직인다. 성벽의 까마귀를 세고 있다.

      울릭이 네 팔을 붙든다. 예순여섯의 덫꾼. 털가죽으로 싸맨 그의 발에서 단 냄새가 난다. 썩는 살의 냄새다. 그가 네 귀에 입을 댄다. 서리말로. 낮게. 아무도 못 듣게.
    input: true_name
    input_label: 어머니가 지어 준 이름 — 울릭만 안다
    input_button: 그 이름을 듣는다
    input_say: 울릭이 귀에 대고 부르는 이름
    input_sibling: false
    return_text: "나는 — 이 냄새를 안다."
    return_heavy: {4: "젖은 털가죽 냄새. 그 밑에, 젖은 재.", 12: "젖은 재. 그 위에, 젖은 털가죽 냄새."}
    trace_lines:
      water: 진눈깨비가 목으로 흘러든다. 목 안에 물이 있다. 없다. 털가죽이 젖었을 뿐이다.
      teeth: 목덜미가 가렵다. 개 냄새가 난다 — 아니다, 젖은 털가죽 냄새다.
      spear: 옆구리가 시리다. 성벽 위의 쇠뇌들은 아직 하늘을 보고 있다.
      blade: 목이 뜨겁다. 부츠 속 뼈 칼은 제자리에 있다.
      rope: 손목이 쓸린다. 아무것도 묶여 있지 않다. 아직은.
      hunger: 배가 꼬인다. 이건 진짜다. 서리 길 열아흐레 동안 내내 그랬다.
      fall: 발밑이 꺼지는 것 같다. 진흙은 그대로다.
    return_ink: |
      ┊ 그 다음엔 성문 위에 은빛 머리의 장교가 섰다. "서른." 브린야가 그 말을 서리말로 옮겼다.
    after_input: |
      "{name}."

      거인의 장부에서 너는 '가죽 일곱'이다. 무리는 너를 일곱이라 부른다. 그 이름 말고 — 어머니가 숨을 거두기 전에 울릭의 귀에 남긴 이름. 이 세상에 그것을 아는 입은 이제 이 노인 하나다.

      "발가락이 검다." 울릭이 말한다. 남의 발 이야기처럼. "이름을 아는 사람이 하나는 남아야지. 아무한테도 주지 마라. 큰 것들한테도, 용한테도. 이름을 아는 자가 너를 가진다."

      성벽 위에서 나팔이 짧게 운다. 진흙 위의 머리들이 일제히 든다.
    effects: ["var o7_ulric_known = true", "var o7_inga_known = true", "var o7_inga_out = true", "note 울릭만 아는 이름 — {name}. 무리는 너를 일곱이라 부른다 (거인의 장부에서는 '가죽 일곱')"]
    next: o7_gate_thirty

  # ───────────────────────── 둘째 화면: 서른 — 그리고 잔향의 각성 ─────────────────────────
  - id: o7_gate_thirty
    origin: frost_runaway
    text: |
      성문 위에 용인 장교가 선다. 짧게 자른 은회색 머리, 머리선을 따라 은빛 비늘이 돋은 여자다. 오른손은 허리 뒤에 감추었다. 그녀가 공용어로 짧게 말한다. 너는 절반만 알아듣는다 — 서른. 그리고, 돌아가라.

      무리 가장자리에서 털가죽을 목까지 올린 여자가 서리말로 옮긴다. 눈 아래에 서리 화상, 입김이 한쪽으로만 나온다. 마지막 이정표의 천막에서 너희에게 값을 물었던 그 여자 — 브린야다. "서른. 쓸모 있는 자 서른만 받는다. 나머지는 돌아가라." 그리고 장교에게는 들리지 않게 덧붙인다. "돌아갈 길이 필요하면 해 질 녘, 바위 틈 굴 입구. 값이 있다."

      울릭의 손이 네 팔을 더 세게 쥔다. 잉가는 아직 까마귀를 센다. 돌아가면 서리가 기다린다. 서리 길은 한 달 뒤 닫힌다. 그리고 바우그 — 돌무릎의 주인, 손가락이 가는 거인 — 는 도망친 노예의 발목을 부러뜨리지 않는다. 다리 부러진 노예는 짐을 못 지니까. 장부의 칸을 비워 둘 뿐이다. 돌아오면 다시 쓴다.

      장교의 눈이 무리 위를 지나간다. 얼굴이 아니라 손을 본다. 그리고 발을.

      까마귀 떼가 한꺼번에 날아오른다. 그때 너는 이 땅을 본 적이 있다는 것을 안다. 성벽이 서기 전에. 거인과 그롬이 부딪치던 들판, 방패 대신 세워진 인간들의 줄. 그 줄 한가운데에 누군가 있었다. 네 안에서 그가 방패를 고쳐 쥔다. 같은 들판에서 몇 번이고 다시 선 사람. 이름 하나만 남았다 — 군데.

      혀끝에 배운 적 없는 요툰의 옛말이 걸렸다가 녹는다. 눈가로 잿빛 고리가 스치고 사라진다.
    effects: ["learn fact_hi_gunde_shield_line", "learn fact_o7_lea_hands", "var o7_old_tongue = true", "note 성문 위의 은빛 머리 장교 — 서른만 받는다. 나머지는 돌아가라", "note 브린야 — 해 질 녘 바위 틈 굴 입구. 값이 있다"]
    choices:
      - id: interpret
        label: '앞으로 나선다 — 공용어로: "내가 옮긴다. 서리말, 노예말."'
        minutes: 30
        check: {skill: 화술, D: 18, helps: [tongue, tongues, crowd_voice]}
        success:
          text: |
            장교가 너를 내려다본다. 손을 먼저, 신발을 다음에. "옮겨 봐라. 저 노인에게. '돌아가라.'"

            너는 울릭을 보지 않고 서리말로 옮긴다. 공용어가 네 입에서 서너 번 넘어진다. 그래도 뜻은 간다. 진흙 위의 머리들이 너를 본다 — 처음으로, 문의 말을 하는 입을.

            "통역은 쓸모다." 장교가 왼손 손가락 하나를 든다. 문 옆의 크릭 열쇠지기가 석판에 금 하나를 긋는다. "스물아홉째. 정오에 들어온다. 혼자."

            울릭이 네 팔을 놓는다. 놓았다는 것을 너는 한참 뒤에 안다.
          effects: ["var o7_taken = true", "var o7_interpreter = true", "rel npc_lea trust 6", "memory npc_lea 영리함 서리말과 노예말을 옮기는 북쪽 것 — 스물아홉째로 받았다", "rel npc_o7_ulric trust -4", "stress 6", "note 성문 위의 장교 — 통역으로 받았다. 스물아홉째, 정오에 혼자 들어간다"]
        failure:
          text: |
            네 공용어가 첫 마디에서 넘어진다. 둘째 마디에서 성벽 위의 크릭들이 웃는다. 장교는 웃지 않는다. 그게 더 나쁘다.

            "다음." 그녀의 눈이 네 옆 사람의 손으로 옮겨 간다.
          effects: ["stress 8", "rel npc_lea like -3", "memory npc_lea 짐 공용어 한 마디 못 세우면서 통역을 하겠다고 나선 북쪽 것"]
      - id: bypass
        label: 울릭과 잉가를 데리고 무리를 빠져나온다 — 성벽을 돌아가는 길을 찾는다
        minutes: 240
        risk: 울릭의 발로는 오래 못 걷는다
        check: {skill: 통찰, D: 26, helps: [survivor, pathfinder, long_walk, cold_hardy]}
        success:
          text: |
            북문 서쪽, 성벽이 바위에 박히는 곳. 바위 틈에서 따뜻한 김이 올라온다. 잿물 냄새 — 성벽 밑으로 들어가는 돌 굴이다. 쇠창살이 녹슬어 붉다. 안쪽 어딘가에서 빨래 방망이 소리가 물을 타고 온다.

            그 위 바위 선반에 돌무더기가 있다. 둘, 셋. 남쪽으로 이어진다. 바람이 쌓은 돌이 아니다. 사람이 쌓은 돌이다. 요새를 돌아가는 길 — 밀수꾼의 길.

            울릭이 바위에 등을 대고 앉는다. 숨이 길다. "오늘은 못 간다." 그가 웃는다. "내일도." 잉가가 돌무더기를 센다. 셋, 넷, 다섯.

            너희가 문 앞 진흙으로 돌아왔을 때, 정오의 나팔이 운다.
          effects: ["learn fact_o7_drain_breath", "learn fact_o7_smuggler_cairns", "var o7_path_found = true", "fatigue 15", "rel npc_o7_ulric like 4", "note 북문 서쪽 바위 틈 — 성벽 밑 돌 굴(잿물 냄새, 녹슨 창살). 그 위 바위 선반에서 남쪽으로 돌무더기 길"]
        failure:
          text: |
            비탈의 돌이 울릭의 발밑에서 미끄러진다. 그는 넘어지며 소리를 내지 않는다. 그게 더 무섭다. 털가죽을 벗기자 검은 발가락 하나가 덜렁거린다.

            너는 그를 업고 내려온다. 가볍다. 잉가가 뒤에서 인형과 울릭의 지팡이를 든다. 문 앞 진흙에 닿았을 때 정오의 나팔이 운다.
          effects: ["pain 8", "fatigue 20", "var o7_ulric_worse = true", "rel npc_o7_ulric like 4", "note 성벽을 돌아가는 길은 찾지 못했다 — 울릭의 발로는 비탈을 못 오른다"]
      - id: hunt
        label: 협곡 벽의 산양을 쫓는다 — 고기로 쓸모를 보인다
        minutes: 240
        check: {skill: 은신, D: 20, helps: [hunter, tracker, beast_friend]}
        success:
          text: |
            협곡 동쪽 벽. 진눈깨비가 바람을 감춰 준다. 산양은 너를 보지 못하고, 너는 산양을 본다. 뼈 칼은 돌보다 느리다. 돌이 먼저 간다.

            정오에 너는 산양을 끌고 문 앞에 닿는다. 진흙 위의 머리들이 고기를 본다. 성벽 위의 크릭들도. 절구통 같은 사내 — 짐꾼 반장 — 가 문 앞에서 네 손을 본다. 피 묻은 손.

            "병사 솥에 넣어라." 명령이 아니라 값을 부르는 말투다. 너는 뒷다리 하나를 떼어 털가죽 속에 넣는다 — 울릭과 잉가 몫이다. 나머지는 밧줄에 묶여 성벽 위로 올라간다. 석 달 급료를 못 받은 얼굴들이 성가퀴 너머로 하나씩 내려다본다.
          effects: ["var o7_soldiers_fed = true", "item o7_ibex_haunch", "rel npc_cg_gunter like 8", "rel npc_cg_gunter trust 6", "memory npc_cg_gunter 영리함 산양을 잡아 병사 솥에 넣은 북쪽 것 — 손이 좋다", "memory npc_cg_grik 이상함 병사 솥에 산양을 바친 북쪽 것", "fatigue 15"]
        failure:
          text: |
            산양이 너보다 먼저 바람을 맡는다. 협곡 벽에 흰 엉덩이 하나가 번뜩이고 사라진다. 너는 언 손으로 빈 덫을 거둔다.

            정오에 빈손으로 문 앞에 닿는다. 서른의 줄은 이미 섰다.
          effects: ["fatigue 20", "stress 5"]
      - id: shout_sigrid
        label: '일어서서 외친다 — "시그리드를 안다! 서리손 집안의 시그리드!"'
        minutes: 10
        risk: 산 사람의 이름이다
        text: |
          진흙 위의 머리들이 너를 본다. 울릭의 손이 네 털가죽 자락을 잡아당긴다. 늦었다.

          성문 위의 장교가 처음으로 걸음을 멈춘다. "시그리드." 공용어 사이에 끼인 북쪽 이름을, 그녀가 혀 위에서 굴린다. "봄에 예순을 끌고 길을 연 여자." 그녀가 왼손 손가락 하나를 든다. 문 옆의 크릭이 석판에 금을 긋는다. "길을 연 자를 아는 입은 쓸모가 있다. 정오에 들어온다."

          성벽 위의 크릭 하나가 그 이름을 입속으로 따라 한다. 그리고 웃는다.

          울릭이 서리말로 낮게 말한다. "산 사람 이름을 성문에 대고 부르는 게 아니다."
