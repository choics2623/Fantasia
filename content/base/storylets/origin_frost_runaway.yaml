        minutes: 10
        text: |
          너는 진흙만 본다. 사내의 눈이 네 정수리에 잠깐 머물다 지나간다.

          대답은 무리 속의 다른 입들에서 나온다 — 엉터리 공용어, 거짓 골짜기, 맞지 않는 숫자. 장교가 그것을 모두 적는다. "명분이 없군." 사내가 말한다. 무엇의 명분인지 그는 말하지 않는다. 쪽문이 닫힌다.
        effects: ["stress 4", "var o7_silent_kaspar = true", "memory npc_kaspar 비굴함 알아들은 얼굴로 고개를 숙인 북쪽 것"]

  # ───────────────────────── 송곳니: 쪽지의 값이 문 앞으로 온다 ─────────────────────────
  - id: o7_fangs
    origin: frost_runaway
    trigger: {window: {from: "312-09-05 22:00", to: "312-09-08 04:00"}, at: cg_north_gate, night: true, when: ["var o7_note_stopped != true"]}
    severity: 4
    text: |
      개 냄새에 깬다. 이번엔 가깝다.

      횃불 둘, 개 넷. 털가죽 두건을 쓴 사내들이 무리의 가장자리를 따라 걷는다. 하나가 기름종이를 펴 들고 서툰 서리말로 읽는다. 이름이 아니다 — 골짜기다. "돌무릎. 뼈울타리." 칸에 값이 붙은 골짜기들.

      진흙 위의 털가죽들이 움직이지 않는다. 움직이면 개가 먼저 안다. 성벽 위 횃불은 그대로다. 쇠뇌가 닿는 그늘 밖은 용좌의 땅이 아니다.

      개 한 마리가 네 쪽으로 코를 돌린다.
    effects: ["learn fact_o7_fangs_come"]
    choices:
      - id: hide_inga
        when: ["var o7_inside != true", "var o7_inga_out == true", "alive npc_o7_inga"]
        label: 잉가를 털가죽 밑에 끌어안고 숨을 죽인다
        minutes: 20
        check: {skill: 은신, D: 20, helps: [shadow_step, beast_friend]}
        success:
          text: |
            잉가의 심장이 네 팔 안에서 뛴다. 아이가 입술만 움직인다. 넷, 다섯. 개의 숨이 털가죽 위를 지나간다. 지나간다.

            다섯 걸음 떨어진 곳에서 비명이 난다. 뼈울타리에서 온 사내의 아들이다. 사내가 일어서다 창 자루에 맞고 주저앉는다. 횃불이 멀어진다. 잉가가 셈을 멈추지 않는다.
          effects: ["var o7_fangs_took_other = true", "rel npc_o7_inga trust 6", "bond npc_o7_inga 6", "stress 10", "note 송곳니들이 뼈울타리 사내의 아들을 끌고 갔다. 잉가는 털가죽 밑에 있었다"]
        failure:
          text: |
            개가 털가죽 자락을 문다. 당긴다. 잉가의 발이 드러난다 — 작은 발. 두건 쓴 사내가 웃는다. "돌무릎. 작은 것." 골짜기 이름이다. 그들은 냄새로 골짜기를 안다.

            네가 아이를 붙잡는다. 창 자루가 네 손등을 부순다. 잉가는 인형을 놓지 않는다. 그것이 아이가 놓지 않은 유일한 것이다.
          effects: ["agenda capture npc_o7_inga at crow_gate__frost_road_head", "var o7_inga_lost = true", "var o7_inga_out = false", "pain 20", "stress 25", "note 송곳니들이 잉가를 끌고 갔다 — 서리 길 초입 쪽으로. 북쪽에 되팔린다"]
      - id: run_with_inga
        when: ["var o7_inside != true", "var o7_inga_out == true", "alive npc_o7_inga"]
        label: 잉가를 업고 바위 틈으로 달린다 — 굴 입구 쪽
        minutes: 30
        risk: 개는 사람보다 빠르다 — 업고는 더
        check: {skill: 은신, D: 26, helps: [fleet, shadow_step, climber]}
        success:
          text: |
            아이는 가볍다. 너무 가볍다. 너는 무리 사이를 낮게 빠져 바위 틈까지 달린다. 따뜻한 김이 올라오는 굴 입구 옆, 바위 그늘에 둘이 몸을 박는다. 잉가가 네 목덜미에 대고 센다. 소리 없이.

            횃불이 무리 쪽에서 오래 머문다. 비명이 하나, 둘. 그리고 멀어진다.
          effects: ["goto crow_gate__drain_mouth", "var o7_fangs_took_other = true", "rel npc_o7_inga trust 8", "bond npc_o7_inga 6", "fatigue 15", "stress 10", "learn fact_o7_drain_breath", "note 잉가를 업고 굴 입구 옆 바위 그늘로 — 무리에서 둘이 비었다"]
        failure:
          text: |
            바위 틈 세 걸음 앞에서 그물이 네 발목을 감는다. 잉가가 네 등에서 굴러 떨어진다. 진흙이 입으로 들어온다. 무릎 하나가 네 등을 누른다.

            "돌무릎." 두건 쓴 사내가 네 털가죽 냄새를 맡고 말한다. "거인의 가죽 냄새. 둘 다 빈 칸이로군. 빈 칸은 값을 치르게 되어 있지."
          effects: ["agenda capture npc_o7_inga at crow_gate__frost_road_head", "var o7_inga_lost = true", "var o7_inga_out = false", "captured 송곳니들의 그물에 걸렸다 — 잉가와 함께, 돌무릎의 빈 칸으로 되팔린다"]
      - id: run_rocks
        when: ["var o7_inside != true", "var o7_inga_out != true"]
        label: 북쪽 냄새가 밴 넝마를 던지고 바위 틈으로 달린다 — 굴 입구 쪽
        minutes: 30
        risk: 개는 사람보다 빠르다
        check: {skill: 은신, D: 22, helps: [fleet, shadow_step, climber]}
        success:
          text: |
            넝마를 개들 쪽으로 던진다. 북쪽 냄새가 가득 밴 넝마에 개 둘이 달려든다. 너는 바위 틈까지 달린다. 따뜻한 김이 올라오는 굴 입구 옆, 바위 그늘에 몸을 박는다.

            횃불이 무리 쪽에서 오래 머문다. 비명이 하나, 둘. 그리고 멀어진다. 날이 밝으면 돌아가야 한다. 몇이 비었는지 세러.
          effects: ["goto crow_gate__drain_mouth", "var o7_fangs_took_other = true", "stress 12", "fatigue 15", "learn fact_o7_drain_breath", "note 송곳니들을 피해 굴 입구 옆 바위 그늘로 달렸다"]
        failure:
          text: |
            바위 틈 세 걸음 앞에서 그물이 네 발목을 감는다. 진흙이 입으로 들어온다. 무릎 하나가 네 등을 누른다.

            "돌무릎." 두건 쓴 사내가 네 털가죽 냄새를 맡고 말한다. "거인의 가죽 냄새. 빈 칸은 값을 치르게 되어 있지."
          effects: ["captured 송곳니들의 그물에 걸렸다 — 돌무릎의 빈 칸으로 되팔린다"]
      - id: fight
        when: ["var o7_inside != true"]
        label: 뼈 칼을 뽑는다 — 개의 목부터
        minutes: 10
        risk: 죽을 수 있다
        check: {skill: 싸움, D: 24, helps: [knife_hand, brawler, reflexes]}
        success:
          text: |
            개가 덤벼든다. 너는 피하지 않는다. 뼈 칼이 개의 목 밑으로 들어간다. 따뜻한 것이 손목까지 흐른다.

            두건 쓴 사내들이 멈춘다. 고기가 이빨을 가졌다. 횃불 하나가 성벽 쪽을 본다 — 소리가 커졌다. 그들은 셈을 한다. 그리고 물러선다. 하나가 너를 가리키고, 제 코를 두드린다. 냄새를 기억하겠다는 뜻이다.
          effects: ["nemesis npc_grod 2", "var o7_fangs_turned = true", "temper 용기 5", "pain 8", "memory npc_cg_creak 위험함 문 앞에서 칼로 송곳니의 개를 죽인 북쪽 것", "note 송곳니의 개를 죽였다 — 그들이 냄새를 기억한다"]
        failure:
          text: |
            개가 네 팔을 문다. 뼈 칼이 진흙에 떨어진다. 둘째 개가 목덜미로 온다. 세상이 개 냄새로 가득 찬다.

            성벽 위에서 누군가 횃불을 기울인다. 늦게.
          effects: ["pain 30", "nemesis npc_grod 2", "var o7_fangs_took_other = true", "die_if 0.4 teeth 송곳니의 개가 목덜미를 물었다 — 북문 앞 진흙에서"]
      - id: call_wall
        label: 성벽 위로 외친다 — 공용어로, 밤 보초에게
        minutes: 10
        check: {skill: 화술, D: 20, helps: [crowd_voice, tongue], warn: ["var o7_balder_song == true", "var o7_soldiers_fed == true", "var o7_echo_kaspar == true"]}
        success:
          text: |
            공용어가 네 입에서 넘어진다. 그래도 한 낱말은 선다 — 문. 성벽 위의 흥얼거림이 멈춘다. 횃불 하나가 성가퀴 너머로 기운다. 비늘이 옅은 얼굴.

            "용좌의 문 앞이다." 보초가 말한다. 크지 않은 목소리다. 그 뒤로 쇠뇌 하나가 성가퀴에 얹히는 소리. 두건 쓴 사내들이 서로를 본다. 셈을 한다. 개들을 부른다.

            그날 밤 문 앞에서는 아무도 비지 않는다.
          effects: ["var o7_fangs_turned = true", "rel npc_cg_balder trust 6", "memory npc_cg_balder 용감함 송곳니 앞에서 성벽 위로 외친 북쪽 것", "temper 용기 3", "note 북문 밤 보초가 송곳니들을 돌려보냈다 — '용좌의 문 앞이다'"]
        failure:
          text: |
            네 공용어가 바람에 찢긴다. 성벽 위의 횃불은 움직이지 않는다. 대신 두건 쓴 사내 하나가 네 쪽으로 고개를 돌린다. 웃으면서.

            그들은 너를 데려가지 않는다. 무리 가장자리의 소년을 데려간다. 네 외침에 깨어 고개를 든 소년이다.
          effects: ["var o7_fangs_took_other = true", "nemesis npc_grod 1", "stress 15"]
      - id: still
        label: 눈을 감고 숨을 센다 — 그들이 고르는 대로
        minutes: 20
        text: |
          너는 센다. 하나, 둘. 개들이 진흙 위를 오간다. 셋, 넷. 비명. 다섯. 비명이 멀어진다.

          날이 밝자 무리에서 아이 하나가 비어 있다. 아이의 어미는 울지 않는다. 진흙만 본다. 너도.
        effects: ["var o7_fangs_took_other = true", "stress 12", "temper 용기 -3", "rel npc_o7_inga trust -4"]
      # ── ◈ 기억 선택지: 이 밤을 안다 ──
      - id: mem_shadow
        needs_memory: fact:fact_o7_fangs_come
        label: "해 지기 전에 무리를 성벽 그늘 안쪽으로 옮겨 두었다 — '쇠뇌가 닿는 데까지가 용좌의 땅이다'"
        minutes: 5
        text: |
          해가 지기 전에 너는 무리를 깨웠다. 이유를 묻는 사람에게는 개 냄새라고만 했다. 털가죽들이 투덜거리며 성벽 밑, 쇠뇌가 내려다보는 그늘 안쪽으로 옮겨 앉았다.

          이제 두건 쓴 사내들은 그늘의 가장자리에서 멈춘다. 성벽 위에서 횃불 하나가 기운다. 그들은 셈을 한다. 그늘 안은 셈이 맞지 않는다. 개들이 돌아선다.

          무리의 누군가가 너를 본다. 개 냄새를 미리 맡은 얼굴을.
        effects: ["var o7_fangs_turned = true", "echo_sign 1 송곳니가 올 밤을 미리 알았다", "temper 용기 2", "note 송곳니들이 성벽 그늘 앞에서 돌아섰다"]

  # ───────────────────────── 문 앞의 소품 (연출가 — 이 출신의 판에서만: var o7_ulric_known) ─────────────────────────
  - id: o7_gate_frozen
    trigger: {director: true, category: lack, at: cg_north_gate, hours: ["05:00", "08:00"], chance: 0.3, when: ["var o7_ulric_known == true", "date < 312-10-01"]}
    text: |
      새벽. 무리 가장자리에서 한 사람이 일어나지 않는다. 털가죽 위에 서리가 앉았고, 그 위에 까마귀가 먼저 앉았다. 옆 사람이 그 털가죽을 벗기기 시작한다. 아무도 말리지 않는다.
    choices:
      - id: close_eyes
        label: 다가가 그 눈을 감긴다 — 서리말로 이름을 묻는다
        text: "털가죽을 쥔 옆 사람이 마지못해 이름을 댄다. 너는 그 이름을 한 번 소리 내어 부른다. 까마귀가 날아오른다. 이 문 앞에서 이름이 불린 마지막 사람이다."
        effects: ["temper 자비 2", "stress -3", "note 문 앞에서 얼어 죽은 사람의 이름을 한 번 불렀다"]
      - id: take_fur
        label: 털가죽을 먼저 챙긴다 — 산 사람이 먼저다
        text: "털가죽은 아직 차갑지 않다. 옆 사람이 너를 노려보다가, 소매 하나를 찢어 간다. 너는 나머지를 접어 품에 넣는다. 오늘 밤은 덜 춥다."
        effects: ["temper 자비 -2", "pain -4", "stress 3"]
      - id: look_away_frozen
        label: 보지 않는다
        text: "까마귀가 먼저 안다. 사람은 나중에 안다. 해가 오를 무렵이면 털가죽도, 신발도 없다."
        effects: ["stress 3"]
  - id: o7_crick_coin
    trigger: {director: true, category: threat, at: cg_north_gate, hours: ["09:00", "17:00"], chance: 0.25, when: ["var o7_ulric_known == true", "date < 312-10-01"]}
    text: |
      성벽 위에서 크릭 보조병 하나가 끈에 꿴 동화 한 닢을 늘어뜨린다. 동전이 진흙 위 머리들 앞에서 흔들린다. "춤춰 봐라, 북쪽 것. 거인들 앞에서 추던 대로."
    choices:
      - id: dance
        label: 일어나서 춘다
        text: "진흙이 발목을 잡는다. 성벽 위에서 웃음이 쏟아진다. 끈이 내려온다. 동전이 손바닥에 떨어진다 — 차다. 무리의 누구도 너를 보지 않는다. 그게 예의다."
        effects: ["coin 1", "stress 6", "temper 용기 -2"]
      - id: sit_still
        label: 앉은 채로 성벽을 올려다본다
        text: "크릭이 침을 뱉는다. 침은 진흙에 떨어진다. 동전이 다시 올라간다. 성벽 위에서 누가 혀를 찬다 — 크릭인지 아닌지는 모른다."
        effects: ["temper 용기 1", "stress 2"]
      - id: curse_frost
        label: '서리말로 욕을 한다 — "서리 어머니가 가져가라."'
        text: "크릭들은 알아듣지 못한다. 진흙 위의 몇이 웃는다 — 이 문 앞에 와서 처음 듣는 웃음이다. 북문 위 밤 보초 자리의 누군가만 고개를 돌린다."
        effects: ["stress -4", "temper 용기 2"]
