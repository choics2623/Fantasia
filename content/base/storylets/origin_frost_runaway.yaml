            의무실 여자가 네 손을 본다. 그리고 달군 쇠를 건넨다. 지혈은 그녀가 한다. "손이 좋네." 칭찬인지 다른 것인지, 그녀의 얼굴은 말하지 않는다. 문 옆의 크릭이 네 부츠 쪽을 오래 본다.

            울릭이 진흙 위에 누운 채 웃는다. "내가 가르쳤지."
          effects: ["var o7_ulric_cut = true", "rel npc_cg_magda like 6", "memory npc_cg_magda 영리함 뼈 칼로 동상 발가락을 끊은 북쪽 것", "memory npc_cg_creak 위험함 북쪽 것이 부츠에서 칼을 꺼냈다", "rel npc_o7_ulric like 8", "rel npc_o7_ulric trust 6", "temper 용기 2", "note 울릭의 검은 발가락을 내 손으로 끊었다 — 문 옆의 크릭이 칼을 보았다"]
        failure:
          text: |
            칼이 미끄러진다. 발가락이 아니라 발등의 굵은 줄이 갈라진다. 피가 진흙 위로 검게 번진다.

            의무실 여자가 따뜻한 손바닥으로 누른다. 피가 손가락 사이로 나온다. 그녀가 너를 보지 않고 말한다. "의무실이었으면." 그 뒤는 말하지 않는다.

            울릭은 새벽까지 버티지 못한다. 마지막에 그가 네 귀에 입을 대지만, 숨만 나온다.
          effects: ["agenda kill npc_o7_ulric", "var o7_ulric_dead = true", "stress 25", "memory npc_cg_magda 짐 칼을 함부로 쓴 북쪽 것 — 노인이 죽었다", "memory npc_cg_creak 위험함 북쪽 것이 부츠에서 칼을 꺼냈다", "note 내 칼이 울릭을 죽였다 — 이름을 아는 사람은 이제 나 하나"]
      - id: let_be
        label: 울릭의 뜻대로 둔다 — 발가락 열 개로 서리 길을 넘은 사람이다
        minutes: 20
        text: |
          너는 의무실 여자에게 고개를 젓는다. 그녀가 울릭을 한 번, 너를 한 번 본다. "그럼 사흘이다." 셈하는 목소리다. 그녀는 다음 발로 간다.

          울릭이 털가죽을 다시 싸맨다. 손이 느리다. "고맙다." 그가 말한다. 무엇이 고마운지는 말하지 않는다.
        effects: ["var o7_ulric_rot = true", "rel npc_o7_ulric like 6", "stress 8", "note 울릭은 자르지 않겠다고 했다 — 의무실 여자의 셈으로 사흘"]
      # ── ◈ 기억 선택지: 그녀가 올 것을 안다 ──
      - id: mem_ready
        needs_memory: fact:fact_o7_magda_gate
        label: 그녀가 오기 전에 화로와 끓인 소금물을 준비해 두었다 — 울릭에게도 낮에 말해 두었다
        minutes: 30
