# 잿불 광산 노예 (O-02)의 알려진 사정 (A13): 대본 장면이 세운 깃발 가운데 서술이 알아야 하는 것.
# 서술 프롬프트에 "[알려진 사정]"으로 들어간다 (참일 때만). npc가 있으면 그 사람이 그 자리에 있을 때 먼저. warn은 판정의 근거 한 줄.
flags:
  o2_name_called:    {line: "에디크는 갱에서 이백열둘의 진짜 이름을 소리 내어 부르는 유일한 사람이다. 크릭과 용인 앞에서는 번호로 부른다", npc: npc_o2_edik}
  o2_haro_watching:  {line: "하로는 이백열둘이 배운 적 없는 것을 아는 것을 보았다 — 썩은 기둥을, 혹은 매듭의 다음 줄을. 묻지 않고 지켜본다", npc: npc_haro}
  o2_solidarity:     {line: "낙엽월 첫날 하로의 갱조 서른이 그락스의 광맥 대신 무너진 갱도를 함께 팠다. 갱조가 한 몸으로 선 첫날이다", npc: npc_haro, warn: "갱조가 한 몸으로 선 것을 모두 보았다"}
  o2_song_heard:     {line: "중층 4번 막장에서 갱조가 다라의 노래를 불렀다는 말이 크릭 감독 막사까지 올라갔다", npc: npc_nit_threetail, warn: "갱이 함께 부른 노래를 크릭들도 들었다"}
  o2_dug_vein:       {line: "이백열둘은 돌 틈에서 에디크의 손가락이 움직이는 것을 보고도 광맥을 팠다. 하로가 그것을 보았다", npc: npc_haro}
  o2_edik_dead:      {line: "에디크는 낙엽월 첫날 서쪽 갱도 낙반에 깔려 죽었다. 하로의 끈에 매듭이 하나 늘었다", npc: npc_haro}
  o2_edik_hurt:      {line: "에디크의 왼다리는 낙반에 깔려 무릎 아래가 부서졌다. 절며 걷고, 아프다는 말 대신 웃는다", npc: npc_o2_edik}
  o2_edik_carried:   {line: "에디크는 부서진 다리로 갱조에 남았다. 그의 몫을 이백열둘이, 혹은 갱조가 나눠 판다", npc: npc_o2_edik}
  o2_edik_ward:      {line: "에디크는 검은 폐 막사(병동)에 누워 있다. 요람의 의사가 아침마다 병동의 숨을 고른다", npc: npc_wenna_ward}
  o2_edik_out:       {line: "에디크는 장부에 열병 사망으로 적혔다. 웨나의 시체 수레 밑판에 실려 슬래그 비탈로 나갔다 — 살아서", npc: npc_wenna_ward}
  o2_edik_taken:     {line: "에디크는 병동에서 하층 공방(은비늘 요람)의 대기 감방으로 끌려갔다", npc: npc_haro}
  o2_yan_blamed:     {line: "그락스와 쇠눈 크롬은 코 얀이 천장이 무너지기 전에 먼저 알았다고 믿었다 — 징후로. 이백열둘이 그 이름을 댔고, 얀은 하층 공방으로 갔다", npc: npc_grax}
  o2_grax_eye:       {line: "그락스는 천장보다 먼저 외친 번호(이백열둘)를 외웠다. 귀가 좋은 번호는 하층에서 값이 다르다고 생각한다", npc: npc_grax}
  o2_listed:         {line: "이백열둘의 번호가 그락스의 공급 명단에 올랐다 — 그날 밤 쇠눈 크롬과 요람의 경비가 굴에 온다", npc: npc_grax}
  o2_lower_averted:  {line: "그락스는 이백열둘의 숯 점 넷을 한 번 넘겼다. 다음엔 값이 다르다고 했다", npc: npc_grax}
  o2_hiding:         {line: "이백열둘은 공급 명단을 피해 폐갱 '다라의 굴'에 숨어 지낸다. 그 대신 다른 번호가 명단을 채웠다", npc: npc_grax}
  o2_cradle_escaped: {line: "요람의 명단에서 번호 하나(이백열둘)가 빠졌다. 쇠눈 크롬이 그 얼굴을 외웠다", npc: npc_krom_ironeye, warn: "쇠눈 크롬이 네 얼굴을 외웠다"}
  o2_vessel:         {line: "하층 공방의 이식대에서 살아 나온 광부가 있다 — 요람의 장부에는 종료, 시체는 소각로에 닿지 않았다. 소각로 수레의 이브가 그를 연통으로 내보냈다", npc: npc_eve}
  o2_grafted:        {line: "이백열둘의 가슴뼈 밑에서 용의 심장 조각이 뛴다. 열이 오르고, 두려움이 반만 누른다. 회귀하면 몸과 함께 사라질 것이다", warn: "가슴 속에서 다른 심장이 뛴다"}
  o2_flue_out:       {line: "이백열둘은 요람의 소각로 연통 — 철 사다리 아홉 칸 — 으로 빠져나왔다. 벽 너머의 야나와 한나는 남았다", npc: npc_yana}
  o2_shard_gone:     {line: "이백열둘의 소매에는 이제 흑요석 조각이 없다"}
