# 알려진 사정 — 잿빛 탑 서기 노예 (O-09, storylets/origin_tower_scribe.yaml). 참일 때 서술 프롬프트에 "[알려진 사정]"으로 들어간다.
# npc가 있으면 그 사람이 그 자리에 있을 때 먼저. warn은 판정의 경고(+10)로 쓰일 때 화면에 보이는 한 줄.
flags:
  o9_list_known:       {line: "칠번은 오늘 오후 자기 손으로 베낀 수집 후보 목록 셋째 줄에 자기 번호가 있다는 것을 안다 — 긴밤월 10일 새벽, 지하 수집실. 아무에게도 읽었다고 말하지 않았다"}
  o9_suspicion:        {line: "귀의 부서장 마티스 그레이브는 서기 칠번의 손과 눈을 한 번 더 본다. 무엇을 보았는지는 장부에 쓰지 않았다", npc: npc_ar_mathis, warn: "마티스가 너를 한 번 더 보았다"}
  o9_forged:           {line: "칠번은 수집 후보 목록 사본 두 장의 '칠'에서 가로획 하나를 빼 죽은 서기 '일'로 만들었다. 원본(마티스의 품)에는 아직 칠이다", npc: npc_ar_tik, warn: "사본의 숫자는 네 손이 고쳤다"}
  o9_list_memorized:   {line: "칠번은 수집 후보 목록 열두 줄을 통째로 외웠다 — 열한 줄은 열병과 악몽으로 고발된 사람들이다"}
  o9_has_fragment:     {line: "칠번은 목록 여백의 진명어 받아쓰기를 소매 안감에 긁어 지니고 있다. 몸수색에 걸리면 끝이다"}
  o9_hester_meet:      {line: "헤스터는 칠번에게 소등 종 전에 서고 안쪽 방으로 오라고 했다 — 벼루 가장자리에 손톱으로 두 번", npc: npc_ar_hester}
  o9_hester_confessed: {line: "헤스터는 칠번의 잠꼬대를 보고한 것이 자기라고 털어놓았다. '읽는다'가 아니라 '잠꼬대'라고 썼다고", npc: npc_ar_hester}
  o9_hester_ally:      {line: "헤스터는 칠번을 섬 밖으로 내보낼 길을 찾는다 — 조수 무덤 아래 동굴, 등대 바위의 조개, 긴밤월 9일 밤의 봉화. 칠번에게 바늘 하나를 주었다", npc: npc_ar_hester}
  o9_dov_swapped:      {line: "칠번이 구멍 글을 걸고 헤스터를 협박했다. 헤스터는 목록 사본에서 칠번을 지우고 아래 침상의 백열둘(도브)을 넣었다. 도브는 모른다", npc: npc_ar_hester}
  o9_sold_holes:       {line: "칠번이 서기실장 헤스터와 구멍 글을 마티스에게 팔았다. 판자 틈의 서른한 권이 탑 마당에서 탔다. 서기들은 칠번을 보지 않는다", npc: npc_ar_yona}
  o9_mathis_cleared:   {line: "마티스 그레이브는 서기 칠번의 눈을 시험했고, 장부에 '측정 오차'라고 적었다", npc: npc_ar_mathis}
  o9_mathis_reader:    {line: "칠번은 마티스에게 읽는다고 털어놓았다. 그 값으로 마티스의 두 목록(흔들림 지도와 이졸의 목록)을 몰래 대조한다. 칠번의 줄은 지워졌다", npc: npc_ar_mathis}
  o9_tik_silent:       {line: "틱 셈쟁이는 사본의 칠과 일이 다르다는 것을 알면서 숫자 매듭에만 남겼다. 맞는지 모르는 숫자는 장부에 쓰지 않는다", npc: npc_ar_tik}
  o9_nere_named:       {line: "네레는 서기 칠번이 벽 그림의 길마다 이름을 붙여 준 것을 기억한다. 그 이름들을 숯으로 길 옆에 그려 넣기 시작했다", npc: npc_ar_nere}
  o9_brick_heard:      {line: "간수 브릭은 서기 칠번이 0307호 관찰 창 앞에서 처음 듣는 이름들을 속삭이는 것을 들었다. 아무에게도 말하지 않았다 — 아직은", npc: npc_ar_brick}
  o9_nere_told:        {line: "네레는 서기 칠번에게서 셋째 시험이 무엇인지 들었다. 울지 않았다", npc: npc_ar_nere}
  o9_fled:             {line: "서기 칠번은 긴밤월 10일 새벽 이관을 피해 달아났다. 경비가 섬을 뒤진다"}
  o9_dov_taken:        {line: "서기 백열둘(도브)이 칠번 대신 지하 수집실로 내려갔다. 숙소 아래 칸이 비었다"}
