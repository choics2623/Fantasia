# 알려진 사정 — O-07 북방 거인 노예 탈주자 (storylets/origin_frost_runaway.yaml)가 세운 깃발. 참일 때만 서술 프롬프트에 들어간다.
# 문 안(바깥문과 쇠창살 사이 통로)과 문 밖(진흙)은 같은 자리(북문)다 — 누가 어느 쪽인지는 이 줄들이 알린다.
flags:
  o7_ulric_known:     {line: "울릭(66, 양발 동상)과 잉가(12, 케틸의 인형)는 주인공과 같은 돌무릎 골짜기에서 서리 길을 넘었다. 주인공의 진짜 이름을 아는 사람은 울릭 하나다", npc: npc_o7_ulric}
  o7_taken:           {line: "레아가 주인공을 받을 서른 가운데 넣었다 — 받은 자는 바깥문과 쇠창살 사이 돌 통로에서 잔다", npc: npc_lea}
  o7_inside:          {line: "주인공은 북문 바깥문 안쪽, 쇠창살과의 사이 돌 통로에서 지낸다 (까마귀 문이 받은 서른 가운데 하나). 문 밖 진흙의 사람들과는 참나무 문 하나 사이다"}
  o7_interpreter:     {line: "레아는 주인공을 서리말 통역으로 받았다. 심문 때 불려 간다", npc: npc_lea}
  o7_sigrid_named:    {line: "주인공이 성문 앞에서 시그리드의 이름을 외쳤다. 레아가 그 이름을 적었고, 성벽 위 크릭 하나가 따라 웃었다", npc: npc_lea, warn: "레아가 시그리드의 이름을 적었다"}
  o7_fifty:           {line: "카스파르가 문 앞에서 서른이 아니라 쉰을 받으라 했다 — 노인과 아이를 먼저. 레아는 그것을 장부에 적었다", npc: npc_kaspar}
  o7_pushed:          {line: "주인공이 무리를 일으켜 성문을 밀었다. 그날 요새는 아무도 들이지 않았다. 성벽 위의 쇠뇌가 그 얼굴을 기억한다", warn: "성벽 위 쇠뇌가 네 얼굴을 기억한다"}
  o7_massacre:        {line: "북문 앞 진흙이 쇠뇌에 붉어졌다. 문 앞의 무리는 그날 서른 넘게 죽었다"}
  o7_soldiers_fed:    {line: "주인공이 잡은 산양이 병사 솥에 들어갔다. 짐꾼 반장과 크릭 보조병들이 그 얼굴을 기억한다", npc: npc_cg_gunter, warn: "성벽 위 병사들이 산양을 기억한다"}
  o7_ulric_inside:    {line: "울릭은 바깥문 안쪽 통로에 들었다 — 넝마로 싸맨 발을 아무도 보지 않았다", npc: npc_o7_ulric}
  o7_inga_inside:     {line: "잉가는 바깥문 안쪽 통로에 들었다 — 물동이를 진다", npc: npc_o7_inga}
  o7_gave_place:      {line: "주인공은 받은 자리를 잉가에게 주었다. 잉가는 문 안, 주인공은 문 밖 진흙이다", npc: npc_o7_inga}
  o7_slipped:         {line: "주인공은 크릭의 석판에 금 하나 없이 문 안으로 섞여 들었다 — 셈보다 하나가 많다", warn: "석판의 서른보다 하나가 많다"}
  o7_ulric_cut:       {line: "울릭의 검은 발가락을 잘라 냈다. 그는 걷지 못하지만 산다", npc: npc_o7_ulric}
  o7_ulric_rot:       {line: "울릭은 발가락을 자르지 않겠다고 했다. 붉은 띠가 무릎으로 오른다 — 그는 웃는다", npc: npc_o7_ulric}
  o7_owe_magda:       {line: "의무실의 마그다가 울릭의 발가락을 잘랐다. 그녀는 약초를 원한다 — 쑥이든 버드나무 껍질이든", npc: npc_cg_magda}
  o7_names_sold:      {line: "간수 베른의 열 번째 쪽지가 송곳니 초소로 갔다 — 문 안에 든 서른의 이름과 골짜기, 문 밖의 머릿수", warn: "송곳니들이 쪽지의 이름을 쥐고 있다"}
  o7_note_stopped:    {line: "베른의 열 번째 쪽지는 송곳니 초소에 닿지 않았다. 베른은 누가 그랬는지 모른다", npc: npc_cg_bern}
  o7_balder_song:     {line: "북문 밤 보초 발데르는 주인공이 유모의 서리 자장가 가사를 안다는 것을 안다. 그 곡조를 들으면 고개를 돌린다", npc: npc_cg_balder, warn: "밤 보초가 서리 자장가를 기억한다"}
  o7_told_kaspar:     {line: "카스파르는 주인공에게서 서리월 전에 이백이 더 온다는 것과 '얼음손 아스타'라는 이름을 들었다. 레아도 들었다", npc: npc_kaspar}
  o7_lied_kaspar:     {line: "주인공은 카스파르에게 '더 오는 자는 없다'고 했다. 그는 그 말을 그대로 적게 했다 — 믿어서가 아니다", npc: npc_kaspar}
  o7_warned_march:    {line: "카스파르는 문 밖 무리에게서 돌팔 씨족이 돌 망치를 모은다는 말을 들었다 — 주인공이 옮겼다", npc: npc_kaspar}
  o7_echo_kaspar:     {line: "주인공이 카스파르의 어머니가 그의 귀에만 한 말을 노예말로 했다. 그는 그 문장을 어디서 들었는지 묻고 싶어 한다", npc: npc_kaspar}
  o7_fangs_turned:    {line: "송곳니들이 성벽 그늘 앞에서 돌아섰다. 쇠뇌 그늘 안은 용좌의 땅이다"}
  o7_fangs_took_other: {line: "송곳니들이 문 앞 무리에서 아이 하나를 끌고 갔다. 주인공은 움직이지 않았다"}
  o7_inga_lost:       {line: "잉가는 송곳니들의 사슬에 묶여 서리 길 초입으로 끌려갔다 — 북쪽에 되팔린다", npc: npc_o7_inga}
  o7_ulric_dead:      {line: "울릭이 죽었다. 주인공의 진짜 이름을 아는 사람은 이제 주인공 하나다"}
  o7_old_tongue:      {line: "주인공은 배운 적 없는 요툰의 옛말 몇 마디를 이유 없이 안다 (잔향 — 거인 전쟁의 방패 노예 군데)"}
