# 숨겨진 반용 (O-11)의 알려진 사정 — 이 출신의 대본 장면(storylets/origin_hidden_halfdragon.yaml)이 세우는 깃발.
# 서술 프롬프트의 [알려진 사정]에 들어간다 (참일 때만). npc가 있으면 그 사람이 그 자리에 있을 때 먼저.
flags:
  o11_sire_known:        {line: "주인공은 화염문 가주 발레리우스와 부엌 노예 아나 사이의 반용이다. 아는 사람은 발레리우스와 늙은 요리장 헤름뿐 — 발레리우스는 그 아이에게 말을 건 적이 없다", npc: npc_valerius}
  o11_scales_out:        {line: "낙엽월 1일 밤, 주인공의 등뼈를 따라 비늘 세 개가 살을 찢고 나왔다. 하인복 속에 감추고 있다 — 드러나면 순혈파의 처단 대상이다", npc: npc_o11_lucan}
  o11_fire_memory:       {line: "주인공은 배운 적 없는 불을 기억한다 — 대붕괴의 하늘을 메운 불과 그 불을 뿜은 용의 이름. 그 용, 용황 바르스카르는 시간의 상처로 회귀의 낌새를 가장 강하게 느낀다", npc: npc_varskar}
  o11_lucan_eye:         {line: "루칸은 부엌의 '부지깽이'를 눈여겨본다 — 피 냄새, 불에 데지 않는 손, 아비를 닮은 얼굴", npc: npc_o11_lucan}
  o11_back_bound:        {line: "헤름이 주인공의 등을 거위 기름과 재, 아마포 두 겹으로 싸매 주었다. 피 냄새가 덜 난다", npc: npc_o11_herm}
  o11_scale_craft:       {line: "주인공은 헤름에게 비늘 숨기는 법을 배웠다 — 거위 기름에 화덕 재, 앞치마 끈 두 겹, 등잔 앞에서는 등을 벽에", npc: npc_o11_herm, warn: "헤름에게 비늘 숨기는 법을 배웠다"}
  o11_hunt_heard:        {line: "루칸이 낙엽월 3일 밤 '놀이'를 연다 — 부엌에서 사냥감 하나를 골라 비늘 언덕 하인 통로에 풀고 자정 북까지 쫓는다", npc: npc_o11_lucan, warn: "루칸의 놀이를 미리 알았다 — 길을 생각해 두었다"}
  o11_herm_marked:       {line: "루칸이 늙은 요리장 헤름의 손을 눈여겨보았다 — 놀이의 사냥감으로", npc: npc_o11_herm}
  o11_herm_warned:       {line: "헤름은 주인공에게서 놀이의 밤을 미리 들었다. 왜 아는지 묻지 않았다. 그 밤엔 소금 창고 자루 뒤에 숨는다", npc: npc_o11_herm}
  o11_herm_dead:         {line: "헤름은 루칸의 놀이에서 돌아오지 못했다. 화덕 옆 못에 앞치마가 없다"}
  o11_herm_saved:        {line: "헤름은 루칸의 놀이에서 살아남았다 — 루칸은 그 밤을 부엌의 반용 탓으로 기억한다", npc: npc_o11_herm}
  o11_survived_hunt:     {line: "주인공은 루칸의 놀이에서 자정 북까지 살아남았다. 손님 하나가 '저 부지깽이, 누굴 닮지 않았나'라고 했다", npc: npc_o11_lucan}
  o11_scales_bleached:   {line: "주인공의 등은 잿물에 덴 살갗이다 — 비늘이 바래 살갗과 같은 빛이 되었다. 사흘은 쓰라리다", npc: npc_greta}
  o11_cast_out:          {line: "발레리우스가 주인공에게 처음이자 마지막으로 직접 말했다 — '내일 아침, 너는 이 집에 없다.' 회색여울 남작에게 가는 심부름 통행증을 주었다", npc: npc_valerius}
  o11_refused_exile:     {line: "주인공은 아비의 통행증을 거절했다. 발레리우스는 장부의 '부엌, 하나'를 아직 지우지 않았다", npc: npc_valerius}
  o11_sire_turned_away:  {line: "주인공이 위층 장부 방까지 올라갔다가 쫓겨났다. 집사가 그 일을 가주에게 보고했다", npc: npc_valerius}
  o11_fled:              {line: "주인공은 화염문 저택에서 재 홈통을 타고 달아난 하인이다 — 저택은 송곳니 회관에 냄새를 넘길 수 있다"}
  o11_spit_faked:        {line: "부엌 사람들은 부지깽이가 쇠꼬챙이에 손을 덴 줄 안다. 헤름이 모두 앞에서 거위 기름을 발라 주었다", npc: npc_o11_herm}
  o11_lamp_met:          {line: "재받이의 베노는 주인공을 '아나의 아이'로 알아보았다", npc: npc_benno}
  o11_lamp_knows_blood:  {line: "베노는 주인공의 등의 비늘을 보았다. 등잔은 비늘 돋은 아이를 하수도로 빼낸다 — 3·13·23일 밤 열한 시, 재받이 하수 분기점", npc: npc_benno}
  o11_greta_message:     {line: "그레타가 주인공에게 회색여울 대장간의 브란에게 전할 말을 맡겼다 — '허리끈의 매듭을 아직 맨다'", npc: npc_bran}
  o11_greta_saved:       {line: "그레타는 루칸의 놀이에서 살아남았다. 부지깽이 덕이라는 것을 안다 — 입모양으로만 고맙다고 했다", npc: npc_greta}
  o11_greta_dead:        {line: "세탁장의 그레타는 루칸의 놀이에서 돌아오지 못했다 — 헤름이 숨은 밤, 대신 줄에 섰다"}
  o11_kaspar_blood:      {line: "카스파르는 화염문 저택에서 온 반용 하인의 등을 보았다 — 같은 피. 그는 그 아이의 말을 짐꾼의 말보다 무겁게 듣는다", npc: npc_kaspar}
  o11_lea_saw:           {line: "카스파르의 부관 레아가 반용 하인의 등을 보았다 — 그녀는 멜리산드의 첩자다. 은비늘 둥지에 보고가 갈 수 있다", npc: npc_lea}
