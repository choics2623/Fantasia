# 알려진 사정 — O-10 모르바 늪 자유민 (storylets/origin_morva_freeborn.yaml이 세운 깃발). 참일 때만 서술 프롬프트의 [알려진 사정]에 들어간다.
# warn은 대본 장면의 판정에서 'var …' 경고가 맞을 때 보이는 한 줄.
flags:
  o10_hunters_near:   {line: "붉은 갈대 선 서쪽 마른 둔덕에 바르그 사냥대가 있다 — 바르그 코 셋과 목줄 찬 인간 추적자 하나(맨발). 불을 피우지 않는다. 배가 간 물길에서 냄새가 끊겨 갈대 선에 멈춰 있다", npc: npc_o10_leash}
  o10_five_stay:      {line: "녹테른에서 온 다섯(어른 넷과 아홉 살 콩)은 새 도착자 초막에서 사흘을 먹고 잔다. 초나흘 밤 뿌리 모임이 다시 선다", npc: npc_o10_kong}
  o10_five_out:       {line: "첫 뿌리 모임에서 왼발이 많았다 — 다섯은 새벽 배로 갈대 선까지 내보내진다", npc: npc_mv_alek}
  o10_five_safe:      {line: "녹테른에서 온 다섯은 뿌리마을에 남는다. 난네가 콩의 손목에 이름 없는 끈을 감아 주었다 — 이름은 일 년 뒤 첫 이름 날에", npc: npc_o10_kong}
  o10_five_taken:     {line: "다섯은 갈대 선 너머에서 바르그 사냥대에 붙잡혀 녹테른으로 끌려갔다. 난네가 이름 없는 끈을 하나 더 꼬았다", npc: npc_mv_nanne}
  o10_kong_knot:      {line: "콩의 손목에 버들의 부적 매듭 하나가 묶여 녹테른으로 갔다"}
  o10_fog:            {line: "헤드비가가 나가의 피 한 방울과 수명 두 해로 안개 매듭을 풀었다 — 붉은 갈대 선에 사흘 안개", npc: npc_mv_hedwiga, warn: "할머니의 안개가 갈대 선을 덮었다"}
  o10_hedwiga_saw:    {line: "헤드비가는 버들이 피 없이 물의 이름 첫 소리를 입술에 올리는 것을 보았다. 뿌리 모임의 누구도 그것을 보지 못했다", npc: npc_mv_hedwiga}
  o10_hedwiga_silent: {line: "헤드비가는 버들의 물의 이름을 노파들에게 말하지 않기로 했다 — 둘째 노파 브리타는 그릇이 오면 늪에 가두려 한다", npc: npc_mv_hedwiga}
  o10_hags_told:      {line: "헤드비가가 물거울 하나에게 버들의 일을 전한다 — 보름 회합 전에 버들이 둥지로 오기로 했다", npc: npc_hag_hana}
  o10_tracker_turned: {line: "목줄꾼 맨발은 사냥대에게 늪에 아무것도 없다고 말했다 — 주인 없는 인간 하나 때문이다", npc: npc_o10_leash, warn: "맨발이 사냥대에게 거짓말을 했다"}
  o10_tracker_dead:   {line: "목줄꾼 맨발이 늪에서 죽었다. 바르그 조합은 자기 목줄꾼의 피 냄새를 잊지 않는다", warn: "사냥대에는 이제 인간 코가 없다"}
  o10_tracker_saw:    {line: "목줄꾼 맨발이 장어 덫 물길에서 뿌리마을로 가는 줄을 읽고 갈대 선으로 돌아갔다", warn: "맨발이 덫 줄을 읽고 갔다"}
  o10_torn_killed:    {line: "토른이 장어 덫 물길에서 목줄꾼을 쏘았다. 그 뒤로 토른은 말이 적고, 활을 끌어안고 잔다", npc: npc_o10_torn}
  o10_retaliation:    {line: "바르그 조합이 모르바에서 피를 흘렸다 — 피 값을 받으러 온다는 말이 갈대 선 쪽에서 돈다"}
  o10_watch_doubled:  {line: "뿌리 모임이 안쪽 망루의 밤 망을 둘로 늘렸다 — 깃털 하나가 장어 덫 줄에 꽂혔던 뒤로"}
  o10_bell_read:      {line: "버들은 가라앉은 종탑의 종에 새겨진 아스테리아의 성을 읽었다 — 학교에서 가르치지 않는 글자까지"}
  o10_naive:          {line: "버들은 늪 밖의 법을 모른다 — 활을 드러내고 고개를 들고 다니며, 주인 있는 인간에게도 주인 없는 말을 건다"}
