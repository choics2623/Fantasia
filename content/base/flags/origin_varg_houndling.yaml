# 알려진 사정 — 바르그의 인간 사냥개 '코' (SCENARIOS O-12). 변수가 참일 때만 서술 프롬프트에 들어간다 (npc가 그 자리에 있으면 먼저).
# o12_hound·o12_hill_dog는 이 출신의 vars에서 처음부터 참 — 볼크·브람의 카드는 셋째를 기준으로 쓰였으므로 서술자에게 코와의 사이를 알려 둔다.
# 북쪽 여자 우두머리(시그리드)는 이름을 모를 수 있으므로 줄에 이름을 쓰지 않는다.
flags:
  o12_hound:           {line: "볼크는 코를 다섯 살부터 제 불가에서 길렀다 — 코는 그의 '코'(인간 사냥개)다. 그는 코를 고기라 부르지 않고, 코는 그를 아비라 부른다. 볼크는 코의 목덜미 냄새로 거짓말을 가린다", npc: npc_volk}
  o12_hill_dog:        {line: "회색여울 사람들은 코를 '언덕의 개'라 부른다 — 볼크의 사냥대 선두에 서는 인간. 브람은 그를 보면 침을 뱉고 수탉 문턱에 들이지 않는다. 혼자 다니는 목줄은 크릭에게 '도망친 개'다", npc: npc_bram}
  o12_ferns_caged:     {line: "고사리 밑에서 코가 찾은 북쪽 여자와 여섯 살 아이가 송곳니 불의 우리 수레에 갇혔다", npc: npc_o12_rug}
  o12_ferns_saved:     {line: "고사리 밑의 여자와 아이는 살아 나갔다. 루그는 털 없는 코가 냄새를 돌렸다고 의심한다", npc: npc_o12_rug}
  o12_ferns_warned:    {line: "고사리 밑의 북쪽 여자는 목줄 찬 사내가 서툰 인간 말로 길을 일러 준 것을 기억한다"}
  o12_foot_dream:      {line: "코는 고사리 밑으로 삐져나온 작은 맨발을 잊지 못한다 — 아래에서 위로 본 하늘이 함께 떠오른다"}
  o12_skali_secret:    {line: "스칼리는 고사리 밑의 둘을 '아무것도 못 맡았다'고 했다 — 코와 스칼리만 아는 비밀", npc: npc_o12_skali, warn: "스칼리가 고사리 밑의 둘을 함께 숨겼다"}
  o12_skali_oath:      {line: "스칼리와 코는 달 앞에서 가시덤불의 냄새를 아비에게도 말하지 않기로 했다", npc: npc_o12_skali, warn: "스칼리가 달 앞에서 맹세했다"}
  o12_skali_will_tell: {line: "스칼리는 아비에게 거짓말을 하지 못한다 — 열나흘에 가시덤불을 말할 것이다", npc: npc_o12_skali}
  o12_skali_prepared:  {line: "스칼리는 코가 열나흘 아침의 일을 미리 안다는 것을 안다 — 무섭지만 곁에 서기로 했다", npc: npc_o12_skali, warn: "스칼리가 네 곁에 선다"}
  o12_skali_wavers:    {line: "스칼리는 '너 없는 무리도 무리야?'라고 물었다. 달이 질 때까지 생각하겠다고 했다", npc: npc_o12_skali}
  o12_volk_task:       {line: "볼크는 열나흘째 아침에 코에게 늑대굴 입구를 묻기로 했다 — 송곳니 불가 소나무에 금 열넷", npc: npc_volk}
  o12_volk_has_den:    {line: "볼크는 늑대굴 입구를 안다. 스무닷새 대수색에 개를 다 푼다", npc: npc_volk}
  o12_volk_respect:    {line: "볼크는 코를 '거짓말 안 하는 고기'로 기억한다 — 정직하게 거절했다", npc: npc_volk, warn: "볼크는 네가 거짓말하지 않았음을 안다"}
  o12_volk_softened:   {line: "볼크는 코가 '빵을 씹어 주던 여자'를 안다는 것을 안다. 이유는 묻지 않았다", npc: npc_volk, warn: "볼크의 어린 날을 건드렸다"}
  o12_volk_doubt:      {line: "볼크는 코에게서 처음으로 숨긴 냄새를 맡았다. 아직 사냥 목록에 올리지는 않았다", npc: npc_volk}
  o12_volk_prey:       {line: "볼크는 코에게 사흘을 주었다. 나흘째 아침, 코의 냄새가 끝나는 곳에 선다. 그는 거짓말을 하지 않는다", npc: npc_volk}
  o12_child_missed:    {line: "볼크는 올해의 '놓친 아이'를 고사리 밑의 아이에게 썼다 — 코가 청해서", npc: npc_volk}
  o12_ferns_freed:     {line: "우리 수레 바닥 판자의 헐거운 못이 뽑혔다. 고사리 밑의 둘은 밤에 달아났다. 볼크는 판자에서 코의 손 냄새를 맡았다", npc: npc_volk}
  o12_knows_taken:     {line: "코는 그날 고사리를 걷은 것이 볼크였다는 것을 안다 — 놓쳤다고 적고 놓지 않았다", warn: "볼크가 너를 '놓친 아이'로 적었다는 것을 안다"}
  o12_rug_marks:       {line: "루그는 털 없는 코가 냄새를 놓친 날과 이상한 날을 센다. 아비가 오면 그 수를 말할 것이다", npc: npc_o12_rug}
  o12_sigrid_warned:   {line: "늑대굴의 북쪽 여자 우두머리는 볼크의 코에게서 '열나흘'을 들었다. 가시덤불 앞에 사람을 더 세웠다", npc: npc_sigrid}
  o12_sigrid_crevice:  {line: "늑대굴의 북쪽 여자 우두머리는 서리 길 바위틈 앞에서 호루라기를 불지 않은 코가 이 사내라는 것을 안다", npc: npc_sigrid}
  o12_sigrid_enemy:    {line: "늑대굴의 북쪽 여자 우두머리는 아이들을 내놓으라던 볼크의 코를 창으로 쫓아냈다. 다음엔 묻지 않는다", npc: npc_sigrid}
  o12_cellar_kept:     {line: "브람은 언덕의 개가 수탉 마루 밑의 냄새를 맡고도 고개를 저은 것을 안다", npc: npc_bram}
  o12_bram_warned:     {line: "브람은 언덕의 개에게서 '기침이 마루까지 샌다'는 말을 들었다. 빚진 얼굴을 한다", npc: npc_bram}
  o12_cellar_sold:     {line: "언덕의 개가 수탉 지하의 냄새를 팔았다", npc: npc_bram}
  o12_bram_bowl:       {line: "브람은 언덕의 개에게 문턱 밖 흙바닥에 죽 한 그릇을 놓아 준 적이 있다 — 개에게 주듯이", npc: npc_bram}
  o12_name_heard:      {line: "엘사는 코의 다섯 살 이전 이름을 안다 — 강변 움막에서 받아낸 아이. 남 앞에서는 부르지 않는다", npc: npc_elsa}
  o12_escaped_volk:    {line: "코는 볼크의 사냥에서 살아남았다. 목줄을 찬 채 — 도망친 개다", npc: npc_volk}
  o12_demoted:         {line: "볼크는 코를 사냥대 선두에서 내렸다. 스무닷새엔 루그가 선두다", npc: npc_o12_rug}
