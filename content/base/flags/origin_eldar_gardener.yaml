# 알려진 사정 — 엘다르 정원지기 (O-03)의 장면이 세운 깃발 가운데 서술이 알아야 하는 것 (참일 때만 서술 프롬프트의 [알려진 사정]에 들어간다).
# warn은 판정의 경고(check.warn)가 참일 때 화면에 뜨는 한 줄.
flags:
  o3_elvish:         {line: "방울(주인공)은 엘다르어를 듣기만 허락받았다 — 반쯤 알아듣는다. 뜻을 아는 티를 내면 정원지기의 금기를 어기는 것이다", warn: "엘다르의 말이 반 넘게 들린다"}
  o3_flower:         {line: "방울은 정원지기 옷 소매 단에 말린 기억꽃 한 송이를 숨기고 있다 — 은방울 뜰 구석에서 몰래 말린 것"}
  o3_bell_muffled:   {line: "방울의 금방울은 진흙에 막혀 울지 않는다 — 마르기 전에 몰래 다시 바른다. 수호자는 소리를 세는 귀를 가졌다", warn: "방울이 진흙에 먹혀 울지 않는다"}
  o3_bell_cut:       {line: "방울은 니나의 은 핀으로 금방울 발찌의 은못을 뽑았다 — 발목이 조용하다. 끊은 방울은 품에 넣었다", warn: "발목에 방울이 없다"}
  o3_measure_me:     {line: "정원사 아에린은 방울을 낙엽월 4일 무게를 재는 날 은 수반 앞에 먼저 세우기로 했다", npc: npc_aerin}
  o3_aerin_noticed:  {line: "아에린은 안개 길을 따라온 정원지기 하나를 보았다 — '잘 자랄 것 같은 새싹'이라고 생각한다", npc: npc_aerin}
  o3_carrier_known:  {line: "은 수반의 바늘이 방울 앞에서 움직였다. 아에린은 88번째를 찾았다고 믿는다 — 87번의 실패 뒤에", npc: npc_aerin}
  o3_weightless:     {line: "방울은 은 수반 앞에서 '무게 없음'으로 나왔다 — 기억꽃을 혀 밑에 문 탓에 하루 동안 머릿속이 안개 같았다", npc: npc_aerin}
  o3_aerin_shaken:   {line: "방울이 은 수반 앞에서 첫 아침의 노래의 다음 구절을 엘다르어로 불렀다. 아에린은 그날 바늘을 보지 않았고, 저녁 여왕 접견에서 말이 짧았다", npc: npc_aerin}
  o3_fionael_knows:  {line: "피오나엘은 방울이 자기 꿈속의 사람과 걸음이 같다는 것을 알아챘다. 세 곳 어디에도 아직 말하지 않았다", npc: npc_fionael}
  o3_nina_kept:      {line: "니나는 안쪽 정원에서 돌아왔지만 방울의 아래 이름을 아직 안다", npc: npc_o3_nina}
  o3_nina_lost:      {line: "니나는 안쪽 정원에서 돌아온 뒤 방울의 아래 이름을 기억하지 못한다. 다른 것은 다 기억한다 — 열한 살에 이름을 바꿨다는 것까지", npc: npc_o3_nina}
  o3_name_retold:    {line: "방울은 돌아온 니나에게 아래 이름을 다시 말해 주었다. 니나는 그 이름을 두 번 따라 했다", npc: npc_o3_nina}
  o3_nina_helps:     {line: "니나는 방울의 번호가 '이송' 칸에 오른 것을 안다. 오늘 밤 망을 보겠다고 했다", npc: npc_o3_nina, warn: "니나가 망을 본다"}
  o3_mira_known:     {line: "방울은 피험자 정자에서 미라를 보았다 — 서리월 9일, 다섯 번째 옮김 의식", npc: npc_mira}
  o3_stops:          {line: "방울은 수호자 에를란의 정지를 받은 적이 있다 — 멎은 채로 엘다르의 낭송을 한 글자도 놓치지 않고 외웠다", npc: npc_erlan}
  o3_transfer_due:   {line: "관리장 미리엘의 장부에서 방울의 번호가 '이송' 칸으로 옮겨졌다 — 서명은 없다", npc: npc_miriel}
  o3_escaped:        {line: "방울은 아래 문으로 정원 경계를 넘었다 — 정원에서는 사라진 번호다"}
