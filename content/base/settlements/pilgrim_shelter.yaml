  - {id: ps_oven, name: 빵 굽는 화덕, xy: [180, 130], kind: work, access: public, hours: "04:00-19:00", hidden: "화덕 밑 재 속에 잿빛 표 두 개 — 쉼터지기 헤로는 모른다. 순례 중에 화덕 곁에서 졸다 간 누군가가 넣어 둔 것이다 (fact_lm_hero_oven_ash)"}
  - {id: ps_keeper_house, name: 쉼터지기 집, xy: [120, 190], kind: office, access: staff, rooms: [ps_ledger_room], note: "길 쪽 첫 집. 수도자들이 이름을 적고 빵 표를 나눈다"}
