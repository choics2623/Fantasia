# 세 번째 고리 쉼터 배치 (24_PLACES_AND_WHEREABOUTS.md). 원천: REGIONS §4.9, 4.10, tpl_pilgrim_waystation (kits/holy_city.yaml).
# 바알카르–루멘 순례길의 세 번째 쉼터. 돌집 6동, 우물, 빵 굽는 화덕. 수도자 8, 순례자 평소 20 · 축일 앞뒤 300.
# grid: 쉼터 격자 (m), 원점 = 북서쪽 모서리. 길은 남쪽(바알카르 쪽)에서 올라와 북쪽(루멘 쪽)으로 빠진다. 갈대 나루로 가는 오솔길은 동쪽 끝.
id: pilgrim_shelter
name: 세 번째 고리 쉼터
node: pilgrim_shelter
kind: waystation
grid: {w: 300, h: 240}
curfew: {from: "21:30", to: "04:00", note: "쉼터 문은 잠기지 않지만 순례자는 돌집 안에서만. 수도자가 밤 기도 뒤 명부를 한 번 센다"}
bells:
  - {at: "04:00", name: 새벽 종 (손종)}
  - {at: "13:00", name: 정오 종}
  - {at: "19:00", name: 저녁 종}
  - {at: "21:30", name: 점호 종}
