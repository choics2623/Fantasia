  - {id: ps_house_men, name: 남자 순례자 돌집, xy: [70, 110], kind: lodging, access: public, hours: "숙박 17:00-06:00", note: "짚 침상 스무 개"}
  - {id: ps_house_women, name: 여자·아이 순례자 돌집, xy: [70, 150], kind: lodging, access: public, hours: "숙박 17:00-06:00"}
  - {id: ps_house_sick, name: 병자 돌집, xy: [230, 90], kind: infirmary, access: public, note: "이질과 발 병. 수도자 한 명이 늘 곁에"}
  - {id: ps_house_stores, name: 곡식 창고 돌집, xy: [220, 160], kind: store, access: staff}
  - {id: ps_house_monks, name: 수도자 숙사 돌집, xy: [150, 60], kind: lodging, access: staff, note: "수도자 여덟의 침상"}
  - {id: ps_stable, name: 짐승 매는 곳, xy: [250, 200], kind: stable, access: public}
