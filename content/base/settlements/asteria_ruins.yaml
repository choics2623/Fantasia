# 아스테리아 폐허 — 재에 반쯤 묻힌 인간 도시, 인간이 이름을 가졌던 9년 (24_PLACES_AND_WHEREABOUTS.md). 원천: REGIONS §11.9(asteria_ruins·멈춘 광장·회색 바다), WORLD_BIBLE 대붕괴, fac_trace_keepers, docs/world/people/ashwaste.md, facts/phase2_ashwaste.yaml.
# grid: 폐허 평면 (m), 원점 = 북서쪽 모서리. x 동쪽, y 남쪽. 성벽 일부와 탑 셋이 서 있고 집터 곳곳에 문패(성과 이름)가 있다. 걷는 속도 80m/분이되 재 두께 때문에 실제로는 더 느리다 (엔진은 직선 거리).
# 법이 없다. 마지막 등불에서 56시간 — 이곳에 매일 사는 사람은 끝지기 틸과 성벽 위의 잔상뿐이다. 시간의 상처(time_rift)는 다른 노드(27시간)라 노드 id 그대로 쓴다.
# 멈춘 광장은 재가 쌓이지 않고 아스테리온의 의식 때 불꽃이 공중에 정지해 있다. 원 중앙에 서면 잔향자만 '그날'의 일부를 기억한다 — 광장은 시간의 상처 가장자리라 한 걸음 더 들어가면 돌아오지 못한다.
