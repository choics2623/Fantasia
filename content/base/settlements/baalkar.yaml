# 바알카르 — 드라크마르 용제국의 수도 (24_PLACES_AND_WHEREABOUTS.md). 원천: REGIONS §1.3~§1.9, HOUSES §1.7·§2, fac_drakmar_empire, CHARACTERS 지역 #1.
# grid: 도시 격자 (m), 원점 = 북서쪽 모서리, x 동쪽, y 남쪽. 걷는 속도 80m/분.
# 도시는 북서쪽 용좌봉(12km)을 향해 계단식으로 오른다 — 일곱 층계구역. 북서쪽 꼭대기가 7층 불꽃 홀, 남쪽 은빛 강가가 1층 사슬 부두·재받이.
# 구역(district)이 location이고, 주요 건물은 그 구역의 rooms(parent)다. 구역 안 건물 사이 이동은 같은 건물(2분)로 계산된다 — 구역이 크면 엔진의 근사치.
# 용좌봉 '재의 둥지'·잿날개 둥지·서리 요람은 도시 밖(outer, 노드 dragon_throne_peak). 공물 계단으로 걸어 5시간 안팎 (map.json의 산길 13h는 짐 행렬 기준).
