# 루멘 성지 배치 (24_PLACES_AND_WHEREABOUTS.md). 원천: REGIONS §4, fac_light, fac_broken_ring, fac_lampkeepers, docs/world/people/lumen.md.
# grid: 도시 격자 (m), 원점 = 북서쪽 모서리, x 동쪽, y 남쪽. 은빛 강이 남북으로 굽어 흐르고 한가운데 하중도 '등불섬'(길이 2.4km, 대부분 대성당 구역).
# 서안 언덕(x<800)·동안(x>1400)은 신도 구역. 섬 북쪽 끝이 엘다르 관저, 남쪽 끝이 순례자 거리와 부두. 걷는 속도 80m/분.
# 기도 일곱 번(4·7·10·13·16·19·22시)이 도시의 시계다. 이 종은 일과의 `fixed` 블록으로 박혀 있다.
id: lumen
name: 루멘 성지
node: lumen                       # 지역 지도(map.json)의 노드
kind: holy_city
grid: {w: 2200, h: 2000}
curfew: {from: "22:30", to: "03:30", note: "신도 숙사 잠김. 밤 기도 뒤 거리에 있는 인간은 수비대가 세워 허가증을 본다. 순례자는 숙소 안에서만"}
bells:
  - {at: "04:00", name: 새벽 기도 종 (일곱 번)}
  - {at: "07:00", name: 아침 기도 종}
  - {at: "10:00", name: 3시경 기도 종}
  - {at: "13:00", name: 정오 기도 종}
  - {at: "16:00", name: 오후 기도 종}
  - {at: "19:00", name: 저녁 기도 종}
  - {at: "22:00", name: 밤 기도 종 (등불을 끈다)}
  - {at: "22:30", name: 통금 종}
patrols: ["22:30", "00:30", "02:30"]
locations:
  # ── 섬 북쪽: 엘다르 관저 ──
  - {id: lm_pavilion, name: "맑은물 정자 (엘다르 관저)", xy: [1100, 120], kind: manor, access: owner, hours: "인간은 초대 없이 못 들어간다. 정문 앞 세 걸음 밖에서 무릎", rooms: [lm_pav_garden, lm_pav_pond, lm_pav_memory], note: "은빛 나무 정자. 인간 시종 30. 엘다르의 그림자를 가로지르면 공개 고해"}
  - {id: lm_pav_garden, name: 정원, parent: lm_pavilion, access: owner}
  - {id: lm_pav_pond, name: 연못, parent: lm_pavilion, access: owner, note: "수면에 낮 동안의 일이 한 번 더 비친다는 소문"}
  - {id: lm_pav_memory, name: 기억 수정의 방, parent: lm_pavilion, access: secret, hidden: "정화청 보고서가 이 방의 수정에 '기억'으로 새겨진다. 세레니엘이 마테우스 몫과 존속파 몫 두 벌을 다르게 쓰는 책상이 여기 있다 (fact_lu_sere_double_report)"}
  - {id: lm_sunken_stair, name: 물에 잠긴 옛 계단, xy: [1100, 50], kind: ruin, access: secret, hidden: "섬 북쪽 둑 아래 아스테리아 시대 인간 석공이 쌓은 계단. 수면 아래로 열아홉 단. 강이 낮은 여름에만 일곱 단이 드러난다", note: "인간이 만든 가장 오래된 건물 — 교단은 이 계단을 지도에서 지웠다"}
  # ── 섬 한가운데: 대성당 ──
  - {id: lm_cathedral, name: 사슬등불 대성당, xy: [1100, 620], kind: cathedral, access: public, hours: "04:00-23:00 (기도 시각 외에는 신랑까지만)", rooms: [lm_cath_nave, lm_cath_eternal_lamp, lm_cath_belltower, lm_cath_prayer_room, lm_cath_confessionals, lm_cath_chain_hall, lm_cath_library, lm_cath_library_back, lm_cath_vestry, lm_cath_candle_stair], note: "대륙 최대의 인간 건축물. 흰 석회암. 신도 1,200이 한꺼번에 선다"}
  - {id: lm_cath_nave, name: 신랑 (본당), parent: lm_cathedral, access: public}
  - {id: lm_cath_eternal_lamp, name: 영원등 제단, parent: lm_cathedral, access: public, note: "영원등 쪽으로 등을 돌리거나 숨을 세게 쉬면 금기", hidden: "영원등의 기름은 엘다르가 매년 몰래 새 병을 붙인다 (소문 2 — 사실). 병을 바꾸는 날 새벽 두 시에 제단 뒤 휘장이 열린다"}
  - {id: lm_cath_belltower, name: 종탑, parent: lm_cathedral, access: staff, hours: "기도 시각 직전", note: "종지기가 일곱 번씩 친다. 꼭대기에서 강 양안이 모두 보인다"}
  - {id: lm_cath_prayer_room, name: 대사제의 종탑 밑 기도실, parent: lm_cathedral, access: owner, hours: "대사제가 깨어 있는 날만", hidden: "탁자 위 종이 한 장 — 서명한 화형 승인서 1,107장의 이름이 아주 작은 글씨로 적혀 있다 (fact_lu_gregor_paper). 침상 밑 궤에 알베릭의 처형 서명란이 빈 문서"}
  - {id: lm_cath_confessionals, name: 고해실 (40), parent: lm_cathedral, access: public, hours: "07:00-19:00", note: "순례자 고해실이 열 칸. 나무 격자 건너편 사제의 귀는 정화청으로 이어진다", hidden: "스물일곱 번째 고해실 격자 뒤 서랍 — 펠릭스의 '고해 장부' 사본 (fact_lu_felix_ledger)"}
  - {id: lm_cath_chain_hall, name: 사슬방 (일곱 등불 회의장), parent: lm_cathedral, access: staff, locked: "회의 외 시간", note: "흰 사슬·검은 사슬 그릇이 제단 위에 놓인다. 벽 쪽에 엘다르 참관석 하나 — 말하지 않는다"}
  - {id: lm_cath_library, name: 서고, parent: lm_cathedral, access: staff, hours: "08:00-17:00", note: "승인된 낭독문 사본과 사제만 읽는 '사슬 장부'. 등불관 마티아스가 열쇠를 쥔다"}
  - {id: lm_cath_library_back, name: 서고 뒷방, parent: lm_cathedral, access: secret, hidden: "엘다르가 '삭제'한 성 마렌의 원래 설교 사본 — '고난은 정화가 아니라 기억이다'. 불태우지 않고 봉해 둔 것은 엘다르가 글을 태우지 못해서다 (fact_lm_leanel_sealed_not_burned)"}
  - {id: lm_cath_vestry, name: 성구실, parent: lm_cathedral, access: staff, note: "흰 사슬, 성표 샘플, 금실 표시가 찍힌 낭독문 보관함"}
  - {id: lm_cath_candle_stair, name: 영원등 곁 계단 (감옥 쪽), parent: lm_cathedral, access: staff, note: "촛불지기 한나가 양초 조각을 들고 감옥 층계까지 다닌다", hidden: "계단 아래 세 번째 단 밑 — 양초 심지 매듭에 감춘 쪽지 (fact_lu_alberic_hanna)"}
  - {id: lm_undercroft, name: "빛의 지하 감옥 '침묵의 우물'", xy: [1110, 680], kind: prison, access: locked, hours: "간수 교대 06:00·18:00", rooms: [lm_uc_gate, lm_uc_guardroom, lm_uc_upper_cells, lm_uc_cell_8, lm_uc_cell_9, lm_uc_culvert], note: "대성당 지하 아홉 층, 나선 계단, 수감 80. 이단·잔향 의심자 수용"}
  - {id: lm_uc_gate, name: 간수 초소 (1층), parent: lm_undercroft, access: staff}
  - {id: lm_uc_guardroom, name: 간수 숙소, parent: lm_undercroft, access: staff, hidden: "침상 틀 밑 — 오토의 아내가 먹는 약 처방 쪽지와 약값 영수"}
  - {id: lm_uc_upper_cells, name: 상층 감방들, parent: lm_undercroft, access: locked, note: "징후 의심자·이단 사제 수십 명. 낮에는 물떨어지는 소리"}
  - {id: lm_uc_cell_8, name: 8번 독방 (베라), parent: lm_undercroft, access: locked, hidden: "벽 아래 굳은살로 새긴 글자 서른다섯 개 — 가장 아래 줄 하나는 언니의 이름"}
  - {id: lm_uc_cell_9, name: 9번 독방 (알베릭), parent: lm_undercroft, access: locked, hidden: "벽에 손톱으로 새긴 '빛의 서신' 두 장 — 오토가 회칠로 지울 때마다 다시 자란다 (fact_lu_alberic_wall_writing)"}
  - {id: lm_uc_culvert, name: 지하 수로 쇠창살, parent: lm_undercroft, access: secret, hidden: "아홉 층 아래 강으로 빠지는 수로. 쇠창살 한 짝은 간수 야코프가 기름칠해 두었다 (fact_lm_jakob_culvert_oil)"}
  # ── 섬 서쪽: 정화청 ──
  - {id: lm_inquisition, name: 등불 심문소, xy: [900, 560], kind: office, access: staff, hours: "04:00-24:00", rooms: [lm_inq_hall, lm_inq_interrogation, lm_inq_records, lm_inq_scales, lm_inq_cell], note: "정화청 본거지. 심문 사제 40, 목줄단 정보원 200의 보고가 모인다"}
  - {id: lm_inq_hall, name: 밀고 함 홀, parent: lm_inquisition, access: public, hours: "07:00-19:00", note: "나무 함 열두 개. 밀고 접수관이 앉는다", hidden: "셋째 함 맨 아래 — 회색여울에서 온 오스릭 관련 보고 (발신자 마르타). 접수관이 정화청장 책상으로 올리지 않은 채 쥐고 있다 (fact_lm_tobias_marta_report)"}
