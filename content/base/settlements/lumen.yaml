  - {id: lm_sem_chant, name: 성가 막사, parent: lm_seminary, access: staff, hours: "성가대 연습 15:00-18:00", note: "대성당 뒤. 성가대와 찬송 순례자 후보가 자란다. 요한이 열한 살부터 자란 곳"}
  - {id: lm_scriptorium, name: 필사실, xy: [1270, 700], kind: scriptorium, access: staff, hours: "05:00-18:00", rooms: [lm_scr_hall, lm_scr_master], note: "필사 수사 서른. 모두 글을 읽지 못한다 — 승인된 낭독문을 모양으로만 베낀다"}
  - {id: lm_scr_hall, name: 필사 홀, parent: lm_scriptorium, access: staff, note: "긴 책상 열두 개. 말소리 금지. 창을 북쪽으로 낸 이유는 그림자 때문"}
  - {id: lm_scr_master, name: 필사장실, parent: lm_scriptorium, access: staff, hidden: "문 뒤 못에 걸린 '빛의 서신' 모사 한 장 — 오탈자 있는 열일곱 부 중 하나 (fact_lm_otilie_copies)"}
  - {id: lm_priest_quarters, name: 사제 숙소, xy: [1230, 640], kind: lodging, access: staff, hidden: "펠릭스의 방 침상 밑 — 푸른 천에 싼 고해 장부 원본 한 권"}
  - {id: lm_silver_lamp_house, name: 은빛 강 등불관 처소, xy: [1180, 520], kind: home, access: owner, rooms: [lm_lamp_study], note: "대성당 서고를 맡은 마티아스 회색손의 집"}
  - {id: lm_lamp_study, name: 등불관 서재, parent: lm_silver_lamp_house, access: owner, hidden: "열쇠고리에 서고 뒷방 열쇠 — 한 번도 열지 않은 사람의 손때 없는 쇠 (fact_lm_matthias_key)"}
  - {id: lm_monastery, name: 수도자 숙사, xy: [1000, 760], kind: lodging, access: staff, note: "수도자 2,000 중 남자 몫. 고리지기 숙소 겸"}
  - {id: lm_nunnery, name: 수녀원, xy: [1030, 840], kind: lodging, access: staff, note: "수녀와 여자 수도자의 숙사. 촛불지기 한나의 방이 문 옆"}
  - {id: lm_hospice, name: 병자의 집, xy: [1300, 860], kind: infirmary, access: public, hours: "04:00-22:00", note: "순례자 이질과 강안개 폐렴의 병상. 수도자가 돌본다"}
