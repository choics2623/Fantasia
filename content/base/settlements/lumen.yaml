  - {id: lm_candle_works, name: "양초 공방 '등불지기'", xy: [960, 1100], kind: workshop, access: public, hours: "05:00-19:00", rooms: [lm_candle_floor, lm_candle_cellar, lm_candle_cave], note: "루멘 양초의 3할. 노동자 40. 심지 매듭에 메시지가 숨는다 (소문 5 — 사실)"}
  - {id: lm_candle_floor, name: 공방 작업장, parent: lm_candle_works, access: public}
  - {id: lm_candle_cellar, name: 밀랍 저장고, parent: lm_candle_works, access: staff, hidden: "밀랍 통 뒤 판자 — 강가 동굴로 내려가는 사다리 (잿빛 실 루멘 매듭)"}
  - {id: lm_candle_cave, name: 강가 동굴, parent: lm_candle_works, access: secret, hidden: "잿빛 실 탈주자 대기처(최대 20명). 늪길 출발점. 밀물 때 입구가 잠긴다 (fact_lm_anna_cave_tide)"}
