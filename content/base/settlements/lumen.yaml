  - {id: lm_pilgrim_house, name: "순례자 숙소 '등불 없는 집'", xy: [1060, 1440], kind: lodging, access: public, hours: "숙박 18:00-07:00", rooms: [lm_pilgrim_cellar, lm_dry_well], note: "빵 한 덩이와 짚 침상과 이름 장부. 아그네스 수녀가 관리하고 베르타가 일상을 맡는다"}
  - {id: lm_pilgrim_cellar, name: 지하 저장고, parent: lm_pilgrim_house, access: staff, hidden: "순례 허가증 위조용 동판과 빈 목패 열두 장 — 아델이 발급한 것이라는 뜻"}
  - {id: lm_dry_well, name: 물 없는 우물, parent: lm_pilgrim_house, access: secret, hidden: "저장고 바닥 우물에서 이어지는 지하 수로 → 잿빛 실 입구. 지금까지 214명이 지났다 (fact_lu_agnes_well)"}
  - {id: lm_token_stalls, name: 성표 노점 거리, xy: [1100, 1350], kind: market, access: public, hours: "06:00-19:00", note: "성표 고리, 순례 지팡이, 헌금 쪽지 환전. 목줄단 '혀'가 노점 곁에 선다"}
