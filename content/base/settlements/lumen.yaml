  - {id: lm_inq_records, name: 기록함, parent: lm_inquisition, access: staff, note: "사제만 읽는 곳", hidden: "화형 대기 명단 — 맨 아래 줄 '두 번째 베라, 침묵의 우물'"}
  - {id: lm_inq_scales, name: 잿빛 저울실, parent: lm_inquisition, access: staff, hidden: "저울 셋의 표결 석판 — 베라 건에 '가볍다' 한 표가 새겨져 있다 (fact_lm_hartmund_light_vote)"}
  - {id: lm_inq_cell, name: 정화청장의 독방, parent: lm_inquisition, access: owner, hidden: "침상 밑 채찍과 구부러진 푸른 머리핀의 빈 상자 (fact_lu_mateus_penance)"}
  - {id: lm_pyre_court, name: 정화의 뜰, xy: [980, 600], kind: square, access: public, hours: "화형일 외 낮 동안 개방", note: "이번 가을 장작 네 번. 신도는 참석해 '그의 고난이 그를 정화하기를'을 외친다"}
  - {id: lm_pyre_store, name: 장작 창고·재 항아리 방, xy: [960, 640], kind: store, access: staff, hidden: "선반의 항아리 — 타다 남은 단추·치아·핀 212개가 이름 쪽지 없이 들어 있다 (fact_lm_corad_jar)"}
  - {id: lm_confession_square, name: 고해 광장, xy: [1100, 820], kind: square, access: public, note: "공개 고해가 열리는 대성당 남쪽 문 앞. 줄이 해 뜨기 전부터 선다"}
