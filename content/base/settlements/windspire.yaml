# 바람첨탑 — 아에리 첨탑 도시 (24_PLACES_AND_WHEREABOUTS.md). 원천: REGIONS §14.9, RACES §14, SUBRACES §12, HOUSES §3.8, fac_aeri, 카드(키리에·에이로스·타일라·오른·코라크).
# grid: 기둥 군 평면 (m), 원점 = 북서쪽 모서리. x 동쪽, y 남쪽. 높이는 note에 쓴다(기둥 41개, 300~900m). 가장 높은 기둥(900m)이 중앙 북쪽, 일곱 손가락이 북동, 폭풍깃 절벽이 동쪽, 서쪽에 낮은 깃 서고 탑.
# 인간은 날 수 없으니 같은 노드 안에서도 줄다리를 건너는 시간으로 걷는다 — 줄다리 폭은 한 사람 어깨너비, 80m/분은 평지 기준이라 실제로는 더 오래 걸린다(바람 센 날 낙사 위험).
# 아에리는 날개로 기둥을 잇는다 — 엔진은 걷는 속도로 계산하되 아에리는 실제로 훨씬 빠르다는 점을 note로 남긴다.
# 줄내림 장터(sky_market)는 31시간 거리의 별개 노드라 outer로 두었고, 바람 우물(wind_well)도 outer다.
id: windspire
name: 바람첨탑
node: windspire
kind: spire_city
grid: {w: 760, h: 560}
curfew: {from: "22:00", to: "05:00", note: "아에리에게는 통금이 없다(건물에 문이 없다). 인간 땅손은 바닥 마을과 바람 정원 외의 기둥으로 줄다리를 건널 수 없고, 허락 없이 건너면 줄을 거둔다(고립). 겨울에는 기둥 위가 얼음으로 덮여 계단 이동이 닫힌다"}
bells:
  - {at: "05:00", name: 바람 종 — 새벽 첫 비행}
  - {at: "12:00", name: 바람 종 — 정오 (정상 종 틀의 줄을 코라크가 당긴다)}
  - {at: "18:00", name: 바람 종 — 저녁 줄 거둠 점검}
patrols: ["05:00", "13:00", "21:00"]
locations:
  # ── 정상: 흰 깃 첨탑 ──
  - {id: ws_high_nest, name: 흰 깃 첨탑 정상 둥지, xy: [380, 40], kind: nest, access: owner, hours: "24시 (지붕 없음)", rooms: [ws_queen_perch, ws_wind_bell], note: "가장 높은 기둥(900m). 지붕과 벽이 없다. 키리에의 둥지는 은빛 깃털로 엮은 접시 모양이고, 바람이 센 날은 깃털 한 겹을 더한다"}
  - {id: ws_queen_perch, name: 여왕의 횃대, parent: ws_high_nest, access: owner, hidden: "횃대 아래 깃털 속 — 검게 변한 왼쪽 날개 끝 깃털 셋의 사본(AS 132 땅에 내려간 날의 증거)과 역행하는 별 기록 한 장", note: "밤마다 땅의 불빛을 세는 자리"}
  - {id: ws_wind_bell, name: 바람 종 틀, parent: ws_high_nest, access: staff, hours: "24시", note: "지붕 없는 종 틀. 정오와 새벽에 줄을 당긴다. 코라크가 줄 곁에서 별을 센다", hidden: "종 틀 나무에 코라크가 새긴 별 기록 — 같은 밤이 두 번 적힌 자리"}
  - {id: ws_funeral_peak, name: 하늘 장례 봉우리, xy: [370, 20], kind: peak, access: staff, hours: "해 뜰 때", note: "정상 위 가장 높은 바위. 죽은 아에리를 바람에 놓아 주는 곳. 바위 틈이 깊다", hidden: "남쪽 바위 틈 — 잘린 날개 한 쌍을 기름 가죽에 싸 숨겨 둔 자리 (타일라의 날개)"}
  # ── 깃털 의회와 높은둥지 가문 ──
  - {id: ws_feather_council, name: 깃털 의회, xy: [390, 120], kind: council, access: public, hours: "의회 날 08:00-18:00", rooms: [ws_council_records], note: "지붕 없는 원형 회의장. 의석 일곱 가문. 바람 종 아래라 말이 흩어지지 않게 낮게 말한다"}
  - {id: ws_council_records, name: 의회 기록 (깃털 매듭), parent: ws_feather_council, access: staff, hidden: "'아래 보는 자들'이 용황이 죽은 뒤 카스파르를 지원할지 논의한 매듭 — 표결 없이 닫힘"}
  - {id: ws_high_nest_house, name: 높은둥지 가문 둥지, xy: [340, 90], kind: nest, access: owner, note: "여왕과 백조 귀족의 둥지들이 모인 기둥 군. 인간은 시중이 아니면 오르지 못한다"}
  - {id: ws_prince_nest, name: 왕자의 둥지, xy: [320, 140], kind: nest, access: owner, hidden: "둥지 밑 날개 깃털 — 오른이 숯으로 그린 인간 글자 (에이로스의 날개 아래쪽)"}
  - {id: ws_ground_nest, name: 땅손 둥지 (흰 깃 첨탑 아래쪽), xy: [310, 180], kind: nest, access: serf, note: "오른이 사는 아래쪽 둥지. 땅을 걷는 연습을 하는 왕자의 발자국이 나 있다"}
  - {id: ws_looking_up_nest, name: 올려다보는 자들 둥지, xy: [260, 100], kind: nest, access: owner, note: "셀레스 긴목의 둥지. 하늘만 보는 가문들의 모임 자리. 벽이 없어 말이 바람을 타고 흩어진다"}
  # ── 전쟁·정찰 ──
  - {id: ws_stormfeather_cliff, name: 폭풍깃 절벽 (동쪽), xy: [680, 130], kind: cliff, access: staff, hours: "24시", rooms: [ws_cliff_nests], note: "번개 모양 깃털 가문의 동쪽 절벽. 전쟁장 카이르의 둥지가 맨 위에 있고 인간 7명의 둥지가 절벽 중턱에 있다"}
  - {id: ws_cliff_nests, name: 절벽 중턱 땅손 둥지 (인간 7), parent: ws_stormfeather_cliff, access: serf, hidden: "글을 아는 땅손의 숯 글씨 — 절벽 안쪽 돌판에 지난 칠 년 동안의 날짜와 폭풍깃의 이동이 적혀 있다"}
  - {id: ws_hawkeye_ledge, name: 매눈 서쪽 선반, xy: [90, 130], kind: ledge, access: staff, hours: "24시", rooms: [ws_map_nest], note: "서리 이빨이 보이는 서쪽. 정찰장 레이의 선반. 세렌 오필 상가의 사자가 가끔 줄을 타고 오른다"}
  - {id: ws_map_nest, name: 지도 둥지, parent: ws_hawkeye_ledge, access: owner, hidden: "서리 요람(이졸데의 흰 둥지)의 위치와 경비를 위에서 그린 깃털 지도"}
  - {id: ws_scout_ring, name: 정찰 고리 (서쪽 아래 선반), xy: [130, 260], kind: ledge, access: staff, hours: "24시", note: "까마귀 아에리 정찰 고리 대장 아스크의 선반. 대륙 상공으로 나가는 새들이 모이는 곳"}
  # ── 서고와 사육장 ──
  - {id: ws_feather_library, name: 깃 서고 (서쪽 아래층 탑), xy: [160, 300], kind: library, access: staff, hours: "06:00-18:00", rooms: [ws_knot_room], note: "까마귀 아에리 8,000이 사는 낮은 탑. 3,400년치 하늘 연대기가 깃털 매듭으로 걸려 있다"}
  - {id: ws_knot_room, name: 대붕괴 날의 매듭, parent: ws_feather_library, access: owner, hidden: "맨 안쪽 깃 한 다발 — 대붕괴 날을 묶은 첫 매듭: '불이 의식보다 먼저 떨어졌다'"}
  - {id: ws_seven_fingers, name: 일곱 손가락 (둥지 탑 군), xy: [560, 90], kind: nest, access: staff, hours: "24시", rooms: [ws_hawk_mews], note: "일곱 기둥이 손가락처럼 솟은 둥지 군. 아에리 2,000이 산다"}
  - {id: ws_hawk_mews, name: 매 사육장, parent: ws_seven_fingers, access: staff, hours: "05:00-19:00", note: "길들인 매가 한 마리 금화 3닢. 인간 일손이 새장 청소를 한다 — 새장은 닫지 않는다", hidden: "서쪽 구석 지붕 줄 한 타래 — 땅손의 줄에 이어 붙이려는 사육사의 몫"}
  # ── 땅손의 구역 ──
  - {id: ws_wind_garden, name: 바람 정원 (기둥 꼭대기 계단밭), xy: [500, 260], kind: garden, access: serf, hours: "05:00-19:00", rooms: [ws_water_jars], note: "고산 약초와 열매가 자라는 계단밭. 인간 140의 터전. 계단 가장자리마다 낙사 방지 줄이 쳐졌다"}
  - {id: ws_water_jars, name: 물 항아리 (내려가는 줄 210m), parent: ws_wind_garden, access: secret, hidden: "큰 항아리 밑 — 몰래 땋은 '내려가는 줄' 210m. 필요한 길이는 340m다"}
  - {id: ws_ground_village, name: 바닥 마을 (땅손 움막), xy: [440, 400], kind: village, access: serf, hours: "24시", note: "기둥 아래 평평한 바위 턱의 움막. 인간 약 140. 날개 없는 이들이 한 기둥에서 평생을 산다"}
  - {id: ws_ground_forge, name: 바닥 마을 대장간, xy: [470, 440], kind: work, access: serf, hours: "06:00-17:00", note: "아에리가 무거워하는 금속을 다루는 유일한 화로. 줄 고리와 바늘을 가벼운 쇠로 만든다"}
  - {id: ws_rope_bridge_main, name: 중앙 줄다리 (정상 기둥과 땅손 기둥 사이), xy: [430, 330], kind: bridge, access: public, hours: "해 뜰 때-해 질 때", note: "폭 한 사람. 줄지기의 매듭이 열 걸음마다 걸려 있다. 바람 센 날 민첩 판정 — 줄이 흔들릴 때 줄 거둠이 시작된다"}
  - {id: ws_fallen_slope, name: 떨어진 자의 비탈, xy: [260, 520], kind: slope, access: public, note: "기둥 아래 돌 비탈. 떨어진 인간들의 뼈와 부러진 줄 조각이 있다. 살아서 계곡까지 내려간 한 사람의 흔적이 한 줄 있다"}
  - {id: ws_feather_cliff_cave, name: 깃털 절벽 아래 동굴, xy: [620, 500], kind: cave, access: secret, hours: "24시", note: "날개 잘린 타일라가 사는 동굴. 입구가 넓게 열려 있다 — 갇힌 공간이 아니다"}
# 첨탑 밖 — hours = 중앙 줄다리에서 걷는 시간. 다른 노드의 장소는 node로 구분한다.
outer:
  # 줄내림 장터 (다른 노드)
  - {id: sky_market__basket_lift, name: 바구니 승강 줄 (줄지기 초소), hours: 0, node: sky_market}
  - {id: sky_market__tents, name: 시장 천막, hours: 0, node: sky_market}
  - {id: sky_market__durgan_depot, name: 두르강 창고, hours: 0, node: sky_market}
  - {id: sky_market__porter_shed, name: 짐꾼 막사, hours: 0, node: sky_market}
  - {id: sky_market__bandit_den, name: 계곡 도적 은신처와 철망 새장, hours: 0, node: sky_market}
  - {id: sky_market__cliff_trail, name: 독수리 계단 초입, hours: 0, node: sky_market}
  # 바람 우물 (다른 노드, 하르칸 오아시스)
  - {id: wind_well__oasis, name: 바람 우물 오아시스, hours: 0, node: wind_well}
  - {id: wind_well__seventh_well_cave, name: 7번 우물 아래 동굴 (이삭 줍기 짐꾼의 은신처), hours: 0, node: wind_well}
