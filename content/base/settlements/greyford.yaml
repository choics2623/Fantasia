# 지도 그림 (19 §6): 여울강 — 서쪽 움막 앞에서 쇠다리 밑을 지나 물레방아간과 하겐의 나루로. 그림일 뿐, 길 찾기는 위의 장소 좌표가 한다
features:
  river: [[-40, 452], [30, 446], [90, 414], [150, 430], [210, 448], [300, 456], [400, 440], [470, 424], [525, 408], [575, 438], [645, 446]]
  river_name: 여울강
# 백과의 장소 카드 (19 §5 보강): 농노의 눈으로 본 한 줄. 숨은 사정은 쓰지 않는다 (그건 사실과 장소 공개가 연다)
descs:
  gf_keep: 남작 고드릭 레이번이 사는 돌 성채. 성문은 아침 여섯 시에 열리고 밤 열한 시에 닫힌다. 인간은 부르지 않으면 들어가지 않는다.
  gf_stable: 남작의 말들이 인간보다 잘 먹는 곳. 마구간지기 군나르가 저녁마다 말 이야기를 한다.
  gf_tollhouse: 징세관 헨릭의 셈집. 인두세와 체납이 장부에 적힌다. 숫자가 사람을 판다.
  gf_rooster: 저녁 여섯 시부터 귀리죽을 퍼 주는 배급 막사. 외다리 브람이 솥을 지킨다. 묽은 맥주와 소문이 같이 돈다.
  gf_smithy: 대장장이 브란의 대장간. 쇠는 무게로 검사받는다 — 인간에게 칼을 팔면 그도 교수대다.
  gf_mill: 방앗간지기 토마스의 물레방아간. 맷돌이 쉬지 않고, 밀가루가 눈처럼 쌓인다.
  gf_chapel: 순종의 빛 예배당. 쇠사슬에 감긴 등불이 걸려 있다. 예배당지기 오스릭. 안식일이면 마을 전체가 여기서 무릎을 꿇는다.
  gf_whip_square: 새벽 점호와 태형이 열리는 광장. 감독관 즈닉의 초소가 붙어 있다.
  gf_north_barracks: 농노 막사. 짚과 땀 냄새. 통금 종이 울리면 문이 잠긴다.
  gf_south_barracks: 농노 막사. 아이들이 많다.
  gf_river_huts: 강변의 움막들. 12호가 네 집 — 어머니 게르다, 동생 키트. 비가 오면 지붕이 샌다.
  gf_granary: 남작의 곡창. 늘 잠겨 있다. 굶주림월에도 열리지 않는다.
  gf_elsa_hut: 마을 끝 약초꾼 엘사의 오두막. 돈이 없는 사람에게는 외상으로 약을 준다.
  gf_irma_hut: 양치기 이르마의 오두막과 양 우리. 굶주린 언덕으로 가는 길목.
  gf_pilgrim_barn: 지나가는 순례자들이 묵는 헛간. 낯선 얼굴은 대개 여기 있다.
  gf_hagen_shed: 나룻배를 모는 하겐의 헛간. 여울강 가에 붙어 있다.
  gf_well_square: 물맛이 쓴 우물. 아낙들이 물을 긷고 소문을 긷는다.
  gf_graveyard: 이름 대신 번호 말뚝이 꽂힌 인간 묘지. 이름은 산 사람만 기억한다.
  gf_tannery: 피와 잿물 냄새. 짐승 가죽을 벗기고 무두질한다.
  gf_iron_bridge: 여울강을 건너는 쇠다리와 검문소. 용의 대로로 나가는 길 — 통행증 없이는 못 건넌다.
  gf_guard_barracks: 성채 경비병들의 막사. 인간은 가까이 가지 않는다.
  gf_weaving_shed: 여자들과 아이들이 베를 짜는 헛간. 손가락이 굳을 때까지.
  gf_kennel: 남작의 사냥개 우리. 탈주자를 쫓을 때 풀린다.
  gf_willow_bank: 여울강 버드나무 둑. 사람 눈이 덜 닿는 곳.
