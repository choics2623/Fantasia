# 일곱 노파의 둥지 — 늪 마녀 회합지 (24_PLACES_AND_WHEREABOUTS.md). 원천: REGIONS §8.9(seven_hags_circle·말하는 이끼 바위), HOUSES §4.3·§5.6, fac_swamp_hags, fac_hag_lineages, docs/world/people/morva.md.
