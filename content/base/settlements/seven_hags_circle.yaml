  - {id: sh_hut_bonenedle, name: 뼈바늘 오두막 (브리타), xy: [250, 145], kind: hut, access: owner, hours: "24시", note: "거인 뼈 바늘이 처마에 매달린 오두막. 북방 탈주자 출신 제자가 가장 많다"}
  - {id: sh_hut_willow, name: 버들 오두막 (하나·헤드비가), xy: [105, 135], kind: hut, access: owner, hours: "24시", note: "버들가지 점 막대가 문 곁에 꽂힌 오두막. 하나의 꿈 기록판이 벽에 걸렸다"}
  - {id: sh_hut_leech, name: 거머리 오두막 (요르다), xy: [100, 195], kind: hut, access: owner, hours: "24시", note: "검게 칠한 거머리 단지가 줄지어 선 오두막. 요르다가 저주 의식 재료를 쌓는다"}
  - {id: sh_hut_ash, name: 재 오두막 (마그), xy: [250, 195], kind: hut, access: owner, hours: "24시", note: "잿빛 고리 모양 목걸이가 걸린 오두막. 벽에 매듭 문자가 가득하다"}
  - {id: sh_hut_mist, name: 안개 오두막 (엘스베트), xy: [180, 245], kind: hut, access: owner, hours: "24시", note: "안개 낀 날만 보이는 그림 조각 유리판이 창에 걸린 오두막. 꿈 심문을 하는 방이 안쪽에 있다", hidden: "이끼판 — 꿈 심문으로 처형된 일곱 가운데 의심스러운 둘의 이름"}
