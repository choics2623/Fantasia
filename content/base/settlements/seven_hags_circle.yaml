  - {id: sh_hut_mugwort, name: 쑥 오두막 (순니), xy: [215, 70], kind: hut, access: staff, hours: "24시", note: "저장고 곁 작은 오두막. 쑥 줄기 매듭 300개가 벽에 걸렸다 — 약초 진명 목록"}
  - {id: sh_guest_lodge, name: 손님 거처, xy: [60, 235], kind: lodge, access: staff, hours: "24시", note: "손님 제자와 견습 40이 자는 낮은 움막. 오래 머무는 외부인도 여기서 잔다"}
  - {id: sh_krik_burrows, name: 크릭 굴, xy: [40, 80], kind: burrow, access: public, hours: "24시", note: "섬 가장자리 흙 속 굴. 늪 크릭 서른이 산다 — 열은 밤마다 호루라기 꿈을 꾼다"}
  - {id: sh_eel_dock, name: 뱀장어 길 선착장, xy: [310, 250], kind: dock, access: public, hours: "물때에 따라", note: "세렌 갈림목으로 가는 늪 수로(뱀장어 길)의 출발점. 쉬렐의 배가 닿는다. 갈림목까지 70시간"}
