  - {id: sh_blood_store, name: 빌린 피 저장고, xy: [215, 105], kind: store, access: secret, hours: "딸만 들어간다", locked: "열쇠는 순니와 오다", note: "낮은 흙벽 안 병 선반. 병 마흔한 개 — 우르사 피, 거인 골수, 나가 허물 피, 용인의 피, 녹테른 피, 페이 이슬, 하르칸 피", hidden: "가장 안쪽 이름표 없는 병 하나 (엘사가 AS 270 남긴 인간의 피 — 썩지 않았다)"}
  - {id: sh_herb_racks, name: 약초 건조대, xy: [140, 95], kind: work, access: public, hours: "05:00-19:00", note: "쑥·버들 껍질·늪 약초가 걸린 긴 건조대. 약초 값이 회합의 돈줄 (세렌 마르디 상가). 병자가 찾아오면 여기서 돌본다"}
