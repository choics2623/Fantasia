# 회색여울 NPC의 시뮬레이션 성향 (27_LIVING_WORLD.md §3). 카드(22)가 '어떻게 말하나'라면, 이것은 '무엇을 하나'의 숫자다.
# perception: 눈치 0~100 (보고·듣고·알아보는 힘). nerve: 담력 0~100. talk: 입이 가벼운 정도 0~1. greed: 0~1. duty: 윗선에 알리려는 마음 0~1.
# ties: 그 사람에 대한 마음 −3(증오) ~ +3(목숨). report_to: 보고하러 가는 윗선 (앞에서부터, 없거나 죽었으면 다음).
# searches: 사람이 사라지면 찾아 나서는 자리 (감독관). role: authority(조사·체포), hunter(뒤쫓는다), fence(장물을 사고 입을 다문다).
