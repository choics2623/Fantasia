# ── T13 313년 여름 맹약회의 ──
- {truth: T13, who: npc_kaidor, level: fragment, note: "원로회의 '인간 번식 할당' 상향 제안(노동력 1.4배) 준비 — 의제를 일부 안다"}
- {truth: T13, who: npc_aurax, level: fragment, note: "자기 안건('잔향 대숙청' — 15~25세 인간 남녀 10명 중 1명 처형, fact_dk_aurax_purge_plan)을 통과시킬 계획"}
- {truth: T13, who: fac_granek, office: off_count, level: rumor, note: "오도릭 — 맹약회의 313이 인간 문제로 모인다는 소문 수준"}
- {truth: T13, who: fac_orsel, office: off_advisor, level: rumor, note: "지올 — 몬달리 상가 쪽에서 들은 소문 수준"}
