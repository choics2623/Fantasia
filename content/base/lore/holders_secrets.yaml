# truths.yaml·truths_extra.yaml은 고치지 않는다. 형식: {truth, who, level, note}. who는 npc id 또는 fac id(rank가 있으면 그 계급 이상).
# 은자 id(npc_gromak 등)는 아직 npcs.json에 없다 — SECRETS_AND_HERMITS.md를 추출 대상에 넣어야 한다.
