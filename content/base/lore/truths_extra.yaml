    whole: "그래서 그녀는 열한 종족의 공모가 결국 실패할 것을 알았고, 웃었다. 잔향이 '모든 이름'을 말하는 날 여왕의 진명도 불린다 — 그것이 죽음인지 해방인지는 그녀도 모른다. 그녀가 3,400년 동안 잔향을 사냥하지도 돕지도 않고 '구경'해 온 이유다(아스테리온도 구경했다). 그 웃음은 왕좌 뒤 '웃음의 상자'에 봉인되어 있고, 열면 진실 한 조각을 얻고 웃음을 잃는다"
  holders: []
  danger: 3
  proof: ["웃음의 상자(가시 궁정 왕좌 뒤 가시 속)", "웃음 조각 일곱(fac_laugh_shards)"]
  unlocks: ["페이 궁정과의 거래 분기", "여왕의 진명 규칙 — 시대의 마지막 장에서만", "카스파르 지지('재미있으니까')의 진짜 이유"]
