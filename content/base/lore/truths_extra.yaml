# 정본이 함의하는 것만 T20부터 덧붙인다. 각 항목의 bible 줄에 근거를 적는다. holders는 holders_*.yaml에.
# 게임은 에오르가 완전히 죽었는지 확정하지 않는다(T09) — 아래 어느 진실의 '전모'도 그것을 확정하지 않는다.

- id: T20
  name: 예언의 뒷부분 — 이름을 잃고 얻는 날
  bible: "HOUSES §3.1.1(첫 아침 가지 비밀 — 돌 입술이 반복하는 뒷부분), facts fact_sv_elastriel_name_loss_doubt·fact_sv_prophecy_first_seen·fact_sv_liandel_learned_songs, WORLD_BIBLE §1.2(엘다르의 굴레: 변하지 못함)"
  levels:
    rumor: "엘다르 예언에는 아무도 끝까지 말하지 않는 뒷부분이 있다"
    fragment: "'마지막 말이 모든 이름을 말하는 날, 먼저 태어난 자들은 이름을 잃으리라. 그리고 처음으로 이름을 얻으리라.'"
    whole: "이름을 잃는다는 것은 죽음이 아니라 혈명의 굴레(정해진 본성)에서 풀려나는 것일 수 있다 — 먼저 태어난 자들이 처음으로 변하고 배우는 날. 영원 여왕은 이것을 두려워하고 조금은 바라며, 그래서 신살 뒤 막지도 돕지도 않았다. 리안델이 인간 노래를 '배운' 것은 그날의 첫 징조로 읽힌다. 엘다르가 이 뒷부분을 숨긴 이유: 3,400년의 사냥이 스스로의 해방을 사냥한 것이 되기 때문이다"
  holders: []
  danger: 4
  proof: ["실바렌 첫 아침 뜰 — 돌이 된 첫 예언자 이실도르의 입술", "세릴의 숨 수정(새벽가지 금고 — fac_seril_silence)", "리안델의 노래 셋"]
  unlocks: ["엘다르 존속파와의 협상 분기(그물 대신 '얻는 날')", "맹약회의 313에서 엘다르 표를 흔드는 논거", "찬가 7단계 — '모든 이름'의 뜻"]

- id: T21
  name: 고동의 박자 — 산은 누구에게 맞춰 뛰는가
  bible: "WORLD_BIBLE §1.6·§10(클락 #6), facts fact_kz_seal_reason·fact_kz_pulse_answers_song·fact_kz_pulse_faster_311·fact_kz_nidar_voice_wakes·fact_kz_seln_eor_voice·fact_hg_yorun_pulse_south, HOUSES §3.3(깊은 문 '끝나지 않는 자만 들어온다')"
  levels:
    rumor: "산의 숨이 빨라졌다 — 카즈둠 밑에서 무언가 깨어난다"
    fragment: "고동은 AS 311부터 빨라졌고, 인간의 목소리(노래)에 답한다. 드라우르의 신살 이전 기억 노래와 같은 박자다"
    whole: "두르강 박자지기들의 3,400년 돌판 장부 — 고동은 아스테리온의 아홉 해와 붉은 손 다라의 석 달 동안 빨라졌다가 그들이 끊긴 날 느려졌고, AS 311에 다시 빨라졌다. 고동은 잔향에 맞춰 뛴다. 그것이 신의 심장인지, 뼈에 남은 마지막 말의 메아리인지는 장부도 말하지 않는다(장부지기들도 갈라져 있다). 깊은 문의 룬 '끝나지 않는 자만 들어온다'가 기다리는 것도 잔향이다"
  holders: []
  danger: 4
  proof: ["고동 갱도 아래 박자 방의 돌판 약 1,300장(fac_beat_ledger)", "조상의 망치 신전의 맥박 치는 기둥", "셀른의 기억 노래"]
  unlocks: ["깊은 문 클락(#6) 분기에서 '각성'의 조건이 잔향의 접근임을 안다", "브로르 왕을 움직이는 증거(맹세의 왕은 장부를 무시하지 못한다)", "에오르 생사 논쟁(T09)의 근거 하나 — 확정은 아니다"]

