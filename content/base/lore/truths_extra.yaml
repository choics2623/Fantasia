    fragment: "신의 피는 아직 말한다 — '너희는 끝나지 않을 것이다'"
    whole: "남해 끓는 해구에 고인 피도, 녹테른의 피도, 첫 갈증 성 마른 우물 바닥의 마르지 않은 몇 방울도 같은 말을 한다. 모르데카이는 그 '너희'가 녹테른이기를 3,000년 바랐고, 세실은 그것이 인간임을 받아들였다. 흑수정의 발타사르는 그 말을 진명으로 '읽으면' 녹테른의 저주가 풀린다고 믿고, 심해 나가는 '이름을 말할 수 있는 인간'을 원한다 — 피의 말에 답하거나 닫을 수 있는 목소리는 잔향뿐이다. 그 말이 살아 있는 신의 목소리인지, 죽은 신이 남긴 메아리인지는 확정되지 않는다"
  holders: []
  danger: 5
  proof: ["첫 갈증 성 지하 마른 우물의 핏방울", "끓는 해구(심해 나가)", "진주 잠수 노예의 노래와 코피"]
  unlocks: ["녹테른 저주 해제 분기(발타사르의 초대)", "심해 나가의 거래 — 사라·베아트릭스", "모르데카이가 잔향을 '듣는' 이유"]

