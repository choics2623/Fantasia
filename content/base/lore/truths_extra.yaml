  bible: "WORLD_BIBLE §1.4(나가는 피를 받아 바다에 숨겼다)·§2(SK ~180 녹테른의 탄생), facts fact_nc_gods_last_word·fact_nc_well_blood_remains·fact_nc_mordecai_hears_echo·fact_sr_deep_naga_god_blood·fact_sr_deep_naga_wants_speaker, HOUSES §3.2(흑수정의 비밀)"
  levels:
