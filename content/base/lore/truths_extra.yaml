  name: 페이가 웃은 이유
  bible: "WORLD_BIBLE §1.4('페이는 웃었다')·§4.2, facts fact_tm_queen_laugh_reason·fact_tm_queen_true_name_fate·fact_tm_laugh_box·fact_tm_queen_knows_echo·fact_tm_queen_asterion_spectacle"
