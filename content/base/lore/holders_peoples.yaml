# 진실의 holders — 종족 정치체(HOUSES §3)와 인간 숨은 혈통(HOUSES §4) 작가 몫.
# truths.yaml은 고치지 않는다. 형식: {truth, who, level, note}. who는 npc id 또는 fac id.

# ── 엘다르 (fac_eldar)
- {truth: T01, who: npc_elastriel, level: whole, note: "신살을 계획한 이실도르의 딸. 열한 종족의 몫을 직접 기억한다"}
- {truth: T02, who: npc_elastriel, level: whole, note: "예언을 처음 본 사람. 잔향이 하나의 영혼임을 신살 뒤에 알았고 3,400년 사냥에 가담했다 (fact_sv_prophecy_first_seen)"}
- {truth: T03, who: npc_elastriel, level: whole, note: "첫 불씨의 말투와 손짓을 3,000년 잊지 않았다. 플레이어 안의 잔향을 알아본다"}
- {truth: T04, who: npc_elastriel, level: fragment, note: "회귀는 기억하지 못하나 '한 박자 돌아간' 어긋남으로 감지한다 — 시간 민감"}
- {truth: T05, who: npc_elastriel, level: whole, note: "시간의 그물을 짠 당사자. 네 수단 중 자기 종족의 몫을 안다"}
- {truth: T05, who: npc_aerin, level: fragment, note: "그물을 여왕과 함께 짠다. 다른 세 수단의 소유자는 모른다"}
- {truth: T06, who: npc_elastriel, level: fragment, note: "대붕괴 당일 시간이 한 박자 찢긴 것을 몸으로 안다. 바르스카르의 불이 이유임은 소문 이상으로는 모른다"}
- {truth: T06, who: npc_silvanus, level: fragment, note: "아스테리온이 하려던 일을 끝내게 하는 것이 엘다르의 '존엄한 마지막 일'이라 믿는다 (fact_sv_silvanus_teach_time)"}
- {truth: T10, who: npc_elastriel, level: whole, note: "빛실 가지의 순종의 빛 설계를 안다. 『빛의 말씀』은 관리 지침서다"}
- {truth: T10, who: npc_serenielle, level: whole, note: "루멘 수석 감독관 — 교리의 장치를 운영한다"}
- {truth: T11, who: npc_elastriel, level: fragment, note: "글자가 이름의 그릇임을 안다. 인간에게 글을 금한 맹약 제2조의 기억"}
- {truth: T12, who: npc_elastriel, level: whole, note: "첫 불씨를 정원째 불태우라 명했다 (fact_sv_first_ember_burned)"}
- {truth: T12, who: npc_aerin, level: fragment, note: "첫 불씨와 다라가 그물에 끝났음을 안다"}
- {truth: T13, who: npc_elastriel, level: fragment, note: "맹약회의 313의 시기를 안다. 입장은 정하지 못했다"}

# ── 녹테른 (fac_nocturne)
- {truth: T01, who: npc_mordecai, level: fragment, note: "신살 뒤 SK ~180에 나가의 바다에서 신의 피를 길어 마셨다. 신살 자체의 몫은 엘다르 혈통의 기억으로 안다"}
- {truth: T03, who: npc_mordecai, level: fragment, note: "신의 피 속 목소리 조각으로 잔향이 피 흘릴 때마다 '듣는다' (fact_nc_mordecai_hears_echo). '한 시대에 한 사람'은 몸으로 안다"}
- {truth: T03, who: npc_cecile, level: fragment, note: "신의 마지막 말을 인간에게 남겨진 것으로 받아들인 유일한 녹테른 (fact_nc_cecile_waits_echo)"}
- {truth: T09, who: npc_mordecai, level: fragment, note: "마른 우물 바닥의 신의 피 몇 방울 — 에오르가 완전히 죽지 않았다는 단서 (fact_nc_well_blood_remains)"}
- {truth: T11, who: npc_cecile, level: fragment, note: "신의 피 속 말 '너희는 끝나지 않을 것이다'를 여섯 살에 들었다. 그림자 진명 스승"}
- {truth: T13, who: npc_mordecai, level: rumor, note: "용제국이 약해지기를 기다린다. 맹약회의 313의 시기는 소문으로"}

# ── 두르강 (fac_durgan)
- {truth: T01, who: npc_bror, level: whole, note: "두르강의 몫은 에오르의 뼈를 묻은 것. 룬판 기록으로 열한 종족의 몫을 안다 (계약의 역사)"}
- {truth: T09, who: npc_bror, level: fragment, note: "깊은 문 안쪽의 '고동'. 41개의 계약을 깼는가를 매일 묻는다"}
- {truth: T09, who: npc_hilda, level: fragment, note: "문 개방 기계를 완성했다. 고동이 인간 목소리에 반응함을 안다"}
- {truth: T09, who: npc_deep_nidar, level: fragment, note: "'고동은 신의 마지막 말이 다가오면 인간의 목소리로 깨어난다'고 믿는다"}
- {truth: T09, who: npc_urd, level: rumor, note: "AS 289 문을 열고 인간 아홉을 빼냈다. 안에서 들은 박자를 말하지 않는다"}
- {truth: T11, who: fac_durgan, level: fragment, note: "룬새김 씨족(rank_hammer_house)만 — 서명 룬 하나가 진명의 첫 음절. 해그 룬새김, 시그나가 안다"}

# ── 나가 세렌 (fac_seren)
- {truth: T01, who: npc_beatrix, level: fragment, note: "나가의 몫은 피를 받아 바다에 숨긴 것. 붉은 해구의 신의 피를 아는 상가 기록"}
- {truth: T03, who: npc_beatrix, level: rumor, note: "심해 나가에게 신의 피 한 모금을 청했고 '이름을 말할 수 있는 인간 하나'를 요구받았다 (fact_sr_beatrix_deep_naga_bargain)"}
- {truth: T03, who: npc_lupo, level: fragment, note: "물의 진명을 말하는 인간이 있다면 잔향이라 판단한다 (fact_sr_lupo_knows_water_name)"}
- {truth: T09, who: npc_deep_naga, level: fragment, note: "해구에 고인 신의 피를 지킨다 — 에오르의 죽음이 완전하지 않다는 믿음의 근거"}
- {truth: T13, who: npc_beatrix, level: fragment, note: "맹약회의 313에 세렌의 표를 관리한다. 노르발과 시민권 의제를 맞바꿀 준비"}
- {truth: T13, who: fac_seren, level: fragment, note: "제12의석 노르발 세스 — 각 종족 표의 흐름"}

# ── 요툰 (fac_jotun)
- {truth: T01, who: npc_hrimnir, level: fragment, note: "요툰의 몫은 에오르를 붙잡은 것. 서리 씨족 시조 이미르딘의 검은 팔. 다른 종족의 몫은 거인사 노래로 반쯤 안다"}
- {truth: T01, who: fac_jotun, level: whole, note: "노래 거인 헤임라(npc 없음, rank_song) — 3,000년 거인사 전체를 노래로 기억한다. 각 종족의 몫과 거인 전쟁의 진짜 원인(용의 배신)까지"}
- {truth: T09, who: npc_yorun, level: rumor, note: "남쪽 산 아래에서 무언가 심장처럼 뛰고, 그것이 뛸 때마다 북방 밭이 언다고 대지가 말한다 (fact_hg_yorun_pulse_south)"}
- {truth: T13, who: npc_hrimnir, level: fragment, note: "맹약회의 313의 시기를 안다. 남침 여부를 회의 전에 정해야 한다"}

# ── 하르칸 (fac_harkan)
- {truth: T01, who: npc_temur, level: fragment, note: "신살 때 하르칸이 방관해 공범이 된 이야기 — 초원 구전으로 '엘다르가 계획, 용이 앞장'까지 안다"}
- {truth: T13, who: npc_temur, level: rumor, note: "맹약회의 313이 인간 문제로 열린다는 말을 서진 계획에 넣었다 — 시기는 소문 수준"}

# ── 그롬 (fac_grom)
- {truth: T01, who: npc_urgash, level: fragment, note: "그롬의 몫은 에오르를 찌른 창 '첫 상처'. 전승으로 '엘다르가 계획, 용이 앞장'까지 안다"}
- {truth: T13, who: npc_urgash, level: rumor, note: "태양월 대축제가 313 맹약회의와 같은 달이라는 것은 안다. 안건은 소문"}

# ── 아에리 (fac_aeri)
- {truth: T06, who: npc_kyrie, level: fragment, note: "하늘에서 시간의 균열이 위로도 찢어진 것을 보았다 (HOUSES §3.8 — 210세와 312년 전의 산술 불일치는 보고)"}
- {truth: T03, who: npc_kyrie, level: rumor, note: "역행하는 별이 잔향의 각성과 함께 나타났다는 까마귀 아에리의 해석을 비밀로 한다 (fact_ws_retrograde_star)"}
- {truth: T13, who: npc_kyrie, level: fragment, note: "맹약회의 313에 처음으로 대표를 보낸다. 표를 어느 쪽에 던질지는 정하지 못했다"}
