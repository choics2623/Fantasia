toward_echo: "불명 — 카스파르를 길러 낸 가문이라 잔향의 '왜'보다 사람을 본다. 대모는 엘레나의 마지막 말('너는 끝나지 않을 것이다')을 들었을 수 있다. 잔향 징후 보고를 0건으로 유지하는 이 가문은 잔향 사냥의 가장 조용한 방패이고, 800명 가운데에 잔향의 징후를 보인 아이가 없다고 말할 수 없다."
player_paths:
  - "800명 — 찬가 1단계 '불씨'의 가장 큰 후보지. 은닉 탈주자와 접촉해 무장 준비(창 400)를 돕는다"
  - "게르트루드 — 엘레나의 행방을 증언하게 한다 (카스파르 지지 +3). 노라의 기억과 맞추면 카스파르를 움직이는 열쇠"
  - "탈주자 편입 — 서리 길을 넘어 겨울 약정에 들어간다. 3년의 노역과 장부 밖 사이의 선택"
  - "율리아 — 레아를 의심하는 보급관. 레아의 정체를 증명하는 길에서 동맹이 된다"
  - "공식 중립의 균열 — 에드윈이 결단하도록 만든다 (오웬과 에드윈은 친구 — 오웬 경로)"
regression:
  fixed:
    - "AS 311부터 800명 은닉, 창 400자루, 잔향 보고 '0건'"
    - "AS 284~295 카스파르 피보호, 대모가 엘레나에 대해 무언가 안다"
  flow:
    - "서리 길 재개·폐쇄 일정, 탈주자 도착 인원"
  drift:
    - "그날 탑 문 앞에 닿는 탈주자의 이름과 건강"
    - "대모가 부르는 노래의 소절"
