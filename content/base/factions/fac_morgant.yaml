decision: "백작이 느리게 결정하고 대모가 방향을 정한다. 가문 회의는 겨울 첫 서리 때 한 번 열린다 (탑 대청, 석탄 불 앞). 결정은 합의가 아니라 대모의 침묵이다 — 에드윈은 그 침묵을 오래 보다 따른다. 국경 보급은 율리아가 실무로 움직이고, 800명의 은닉은 대모와 에드윈의 이중 서명 없이 움직이지 않는다."
succession: "장자 상속 — 에드윈 이후는 불명(자녀 기록이 카드에 없다). 대모가 죽으면 엘레나에 대한 앎이 사라진다 — 가문에서 카스파르를 움직일 유일한 열쇠가 함께 묻힌다. 에드윈이 죽으면 율리아의 보급 실무가 가문의 중심으로 옮겨간다."

law:
  crimes:
    - {act: "탈주자를 외부(바르그·국경군)에 넘긴다", punishment: "가문 내 금기 — 은닉 800의 존재를 노출하는 행위. 용인은 가문 퇴출, 인간은 처형", note: "겨울 약정의 핵심: 돌려보내지 않는다"}
    - {act: "은닉 탈주자의 장부 노출 (회색 장부에 올린다)", punishment: "대모·백작의 허락 없이는 불가 — 위반 시 가문 징계", note: "AS 311부터 인두세 탈루. 발각되면 '없는 가문'으로 말소(칼다란의 선례)"}
    - {act: "잔향 징후를 보고한다", punishment: "가문 규칙으로 금지는 아니나 보고 건수는 늘 '0건' — AS 213 이래 모르간트 영지 보고는 0", note: "'징후자'를 만들지 않는 것이 겨울 약정의 연장"}
    - {act: "겨울 약정 노역 3년 미만에 탈주", punishment: "일반 탈주법 — 힘줄 절단은 하지 않고 노역 연장", note: "인간. 잔혹하지는 않지만 자유도 아니다"}
    - {act: "창고의 창을 반출한다", punishment: "무기 소지에 해당 — 용인은 가문 퇴출, 인간은 처형", note: "카스파르의 요청 없이 나가는 창은 없다"}
    - {act: "인간이 글자를 소유·쓴다", punishment: "즉결 처형 (재의 법)", note: "제국법. 가문은 예외를 두지 않는다 — 그 외에는 관대하다"}

customs:
  greeting: "'겨울이 오기 전에.' — '그리고 모두에게.' 가훈의 문답. 용인끼리는 문 안에 들어서며 외투의 눈을 털어 준다. 탈주자에게는 따뜻한 수프 한 그릇을 먼저 내고, 이름을 묻지 않는다."
  taboos:
    - "탈주자를 '도둑'이라 부르는 것"
    - "카스파르를 '잡종'이라 부르는 것 (칼다란이 가장 앞장서는 말이다)"
    - "AS 284~295 카스파르를 길렀다는 사실을 공개석상에서 말하는 것"
    - "800이라는 숫자"
    - "하스트란의 '국경의 겁쟁이들'이라는 말에 대꾸하는 것 (겨울은 모두에게 온다 — 대꾸할 필요가 없다)"
  rites:
    - {name: "서리 길 재개의 식사", when: "해빙월 (북방 탈주 시즌)", what: "서리 길이 열리면 탑 대청에서 모두가 같은 수프를 먹는다 — 새로 오는 사람의 몫을 한 그릇 비워 둔다"}
    - {name: "첫 서리 가문 회의", when: "낙엽월 말~서리월", what: "석탄 불 앞에서 에드윈과 대모와 율리아가 겨울 식량과 은닉 인원을 센다 — 숫자는 입으로만"}
    - {name: "서리 길 폐쇄", when: "서리월", what: "마지막 탈주자의 도착을 기다린 뒤 탑 문의 빗장을 건다. 못 온 사람의 몫을 한 줄 장부 밖에 적는다"}
    - {name: "재의 날의 침묵", when: "연말 5일", what: "불을 피우지 않는 대신 대모가 카스파르가 아이 때 불렀다는 노래를 한 소절 부른다 (이유는 묻지 않는다)"}
  speech: "짧고 담담한 북방 비늘혈의 말씨. 존칭은 정확하나 장식이 없다. 결단을 미루는 에드윈은 '겨울이 오면 보자'로 마무리한다. 대모는 느리고 낮다. 인간 탈주자에게는 가능하면 직접 묻지 않고 '배고프냐'만 묻는다. 금지어: 도둑, 잡종, 800."

membership:
  join: "출생. 탈주자는 영지에 닿아 겨울 약정에 들어가거나 장부 밖에 숨는다. 가신은 비늘혈 하급 용인의 서약."
  leave: "가문 퇴출. 탈주자는 3년 뒤 농노 등록 — 그 이후에도 나가지 못한다."
  signs: ["회청색 바탕 검은 탑 위 날개 편 흰 까마귀 문장", "탑 대청의 석탄 불 — 항상 꺼지지 않게 둔다", "탈주자에게 내주는 '이름 없는 수프 그릇' (이 그릇을 받으면 이름을 묻지 않는 사람이라는 표시)"]

