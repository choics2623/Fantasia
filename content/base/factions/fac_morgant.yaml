# 모르간트 백작가 — "까마귀 문 뒤의 집". 정본: HOUSES §2.9, §6.3 / REGIONS §2.3·§2.10(까마귀 문) / 카드: greyford/npc_kaspar.yaml
# 비늘혈, 서리 길 동편 '모르간트 탑'. 공식 중립, 비밀리에 카스파르 — AS 284~295 소년 카스파르를 피보호자로 맡아 길렀다.
# (해결) 게르트루드는 엘레나의 삶(AS 281 아이를 넘겨받음, 재구덩이 노역)을 알지만 무덤 자리는 모른다 — fact_hi_elena_grave(노라만 앎)와 양립 (HOUSES §2.9).
# 기준: AS 312 낙엽월 1일. 'unnamed:...'는 TODO-NPC.
id: fac_morgant
name: 모르간트 백작가
kind: house
race: [용인(비늘혈), 인간(은닉 탈주자·농노)]
governance: 봉건 위계 — 북방 변경의 후견 가문. '겨울 약정'이 법
governance_note: >
  가문은 겨울을 안다. 노동력이 모자란 북방에서 탈주자를 돌려보내지 않고 농노로 받아들이는 것이 가문의 오랜 관행이고, 그것을 '겨울 약정'이라 부른다 —
  잔혹하지는 않지만 자유도 아니다. AS 311부터는 한 걸음 더 나아가 북방 탈주자 약 800명을 회색 장부에 올리지 않고 숨겼다(인두세 탈루).
  백작 에드윈은 결단이 느리고, 대모 게르트루드가 가문의 비밀 방향을 쥔다.
motto: "겨울은 모두에게 온다."
seat: "모르간트 탑 — 서리 길 동편 (까마귀 문 뒤쪽). 북부 개척지 5곳"
size:
  members: "비늘혈 직계 3 + 용인 관리·수비 수십 + 농노 약 3천 + 은닉 탈주자 약 800"
  territory: "서리 길 동편 '모르간트 탑'과 북부 개척지 5곳. 까마귀 문 국경군 보급 담당"
  wealth: "농노 노동과 국경군 보급 납품. 인두세 탈루분(탈주자 800)이 숨은 자산이자 위험"
  force: "창 400자루를 창고에 비축 — 은닉 탈주자 중 300명을 무장시킬 수 있다. 지지율 2 (카스파르, 비밀)"

