  - {id: rank_kin, title: "직계 (대모·보급관)", duties: "비밀 방향·보급", privileges: "은닉 탈주자 접근", open_to_player: false}
  - {id: rank_retainer, title: "용인 가신 (수비·관리·서기)", duties: "탑 수비, 개척지, 등록", privileges: "읽고 쓸 수 있다", open_to_player: false}
  - {id: rank_winter_laborer, title: "겨울 약정 노역자 (탈주자, 3년)", duties: "3년 무급 노역", privileges: "돌려보내지지 않는다 — 대신 장부 밖에서 보호받는다", open_to_player: true, condition: "서리 길을 넘어 온 탈주자로 잡히지 않고 모르간트 영지에 닿는다. 3년 뒤 농노로 등록"}
