# 드라크마르 용제국 — 정본: WORLD_BIBLE §1.2.1, §4.1, §5 / HOUSES §1·§6 / REGIONS §1.3 / RACES §2~3 / SUBRACES §3.3
# 기준 시점: AS 312 낙엽월 1일. 이름이 있어도 npcs.json에 id가 없는 자리의 holder는 'unnamed:이름 — 설명'이다 (TODO-NPC: 카드 작성 시 id 부여).
# 주의(모순 기록): HOUSES §2.1의 '용좌 집사 세베리안 칼다란'과 REGIONS §1.3의 '재상 세베린 타르굴'은 서로 다른 자리로 병존시켰다 (집사 = 병상 출입·서약 단상, 재상 = 섭정 회의 의장·행정).
id: fac_drakmar_empire
name: 드라크마르 용제국
kind: polity
race: [용족(진룡), 와이번(왕관·기사·잿빛), 용인(순혈·비늘혈), 크릭(감독관), 바르그(공인 조합), 인간(국유·사유 노예, 농노)]
governance: 제국·전제
governance_note: >
  전제는 '한 존재의 뜻'이 결정하는 형태다. 그런데 그 존재가 하루 대부분 의식이 없고 3년째 글을 읽지 못한다.
  그래서 지금의 드라크마르는 전제의 뼈대만 남은 채 '뜻의 해석권'을 누가 쥐느냐를 두고 다투는 궁정이다.
  칙령은 용황의 이름으로 나가지만 쓰는 것은 와이번 서기장이고, 뜻을 증언하는 것은 용인 집사이며, 집행은 후계자 셋이 나눠 쥔 군대가 한다.
motto: "불은 위에서 아래로 흐른다."   # 칼다란 가훈이 제국 공문의 맺음말이 되었다. 용황 자신의 말은 따로 없다 — 용은 가진 것으로 자신을 말한다
seat: baalkar          # 바알카르 불꽃 홀 (REGIONS §1.9). 용황은 용좌봉 '재의 둥지'(dragon_throne_peak), 이졸데는 서리 요람(baalkar__frost_cradle)
size:
  members: "용족 진룡 11(깨어 있는 것은 9에 못 미침) · 와이번 약 6,600(왕관 300·기사 1,500·잿빛 4,000, 독꼬리·서리는 제국 밖 취급) · 용인 약 20,000(순혈 2,000·비늘혈 18,000) · 크릭 감독관·하인 수만 · 드라크마르 용좌령 인간 약 64만(국유 41만·사유 23만)"
  territory: "대륙 중부 평원 — 용좌령(바알카르), 그라넥 평원, 잿불 언덕, 회색여울 변경(북단), 정원 길 관문, 은빛 강 수운. 진룡 11이 영지를 나눠 소유하고 그 안의 모든 것이 그의 보고다"
  wealth: "인두세(수확월, 인간 머릿수), 노예 매매(파종월 대시장), 곡물(제국 40%가 그라넥), 잿불 언덕 광산, 세렌 대출(멜리산드 쪽만 약 2만 두카트). 국고는 세렌 두카트에 점점 기댄다"
  force: "근위대 1,200 · 비늘기사단 600기 + 징집병 8,000(하스트란) · 기사 와이번 1,500 · 북방 국경군 약 2,000(까마귀 문, 용좌 직속) · 드레이크 수만 · 진룡 9(실제 날아오를 수 있는 것)"

offices:
  # ── 정점: 용황과 그 곁 ──
  - id: off_emperor
    title: 용황
    holder: npc_varskar
    reports_to: null
    powers: ["모든 칙령의 원천(실제로 읽지는 못한다)", "진룡 소집", "불의 처형 — 반역 지도자에게만 직접 불을 뿜는 영예", "소유의 낭송 — 제국 전체가 그의 보고 목록이다"]
    chosen_by: "불의 계승 — 전임자의 사망 또는 불로 굴복시킨 자. 가장 많이 가진 자가 용황이 된다. 2대 바르스카르는 형을 죽이고 아버지를 굴복시켰다"
    perks: ["재의 둥지(용좌봉) 전용", "두개골 회랑 — 죽은 용의 두개골이 놓이는 곳", "시중 노예 12명 (대붕괴의 진실을 들은 노예는 전부 처분됐다 — 노라가 12번째)"]
    note: "하루 대부분 무의식, 오후 한 시간쯤 깨어 후계자 셋을 교대로 접견, 밤에만 맑은 정신이 돌아와 시중장 노라에게만 말한다 (fact_dk_varskar_hours)"
  - id: off_consort
    title: 용황의 짝 (알의 어미)
    holder: npc_isolde
    reports_to: off_emperor
    powers: ["알의 법 — 알은 어미만 이름을 부를 수 있다. 흰 알에 관한 어떤 결정도 그녀의 동의 없이 집행되지 않는다", "다섯 불의 의자 중 한 자리 (거의 출석하지 않는다)"]
    chosen_by: "짝지음 — AS 307, 서리비늘 가문이 '바쳤다' (본인의 선택이 아니었다)"
    perks: ["서리 요람의 서리 탑과 경비 용인 80", "알 보관실 시녀들 (그중 크릭 시녀 '숨'은 멜리산드의 첩자 — 본인은 모른다)"]
  - id: off_five_fires
    title: 다섯 불의 의자 (섭정 회의)
    holder: null          # 합의체 — 개인이 아닌 다섯 자리의 합. 의장은 재상
    reports_to: off_emperor
    powers: ["용황이 직접 통치하지 못하는 동안의 상시 행정 합의", "칙령 연서(비상 시 3/5)", "후계자 세 진영의 대리인이 한 방에 앉는 유일한 자리"]
    chosen_by: "용황의 명 — 처음 구성한 때가 기록에 없다. 의자는 다섯, 앉는 사람은 가문이 아니라 후계자 진영이 보낸다"
    perks: ["불꽃 홀 '다섯 의자의 방' — 의자 다섯 중 하나(이졸데의 것)는 늘 비어 있다"]
    seats: [off_chancellor, off_proxy_aurax, off_proxy_melisande, off_guard_captain, off_consort]
  - id: off_chancellor
    title: 재상
    holder: "unnamed:세베린 타르굴 — 용인 410세, 중립을 가장한 아우락스파. 타르굴 가 수장"   # TODO-NPC npc_severin_targul
    reports_to: off_five_fires
    powers: ["섭정 회의 의장", "행정 실무 총괄", "비늘 시장(노예 시장) 운영권을 가문으로 쥔다"]
    chosen_by: "용황의 임명 — 마지막 임명이 AS 280년대. 용황이 직접 임명한 마지막 문관이라는 것이 그의 정당성이다"
    perks: ["비늘 언덕 관사", "용주 역참망(세라프 타르굴 등 방계)에 대한 후견"]
  - id: off_proxy_aurax
    title: 아우락스의 대리
    holder: "unnamed:브라넉 재송곳 — 용인 기사, 붉은 첨탑 소속"   # TODO-NPC
    reports_to: off_five_fires
    powers: ["아우락스의 표 — 서부군과 재송곳 기사단의 이름으로 발언", "잔향 징후자 색출 사무"]
    chosen_by: "후계자 지명 (아우락스)"
    perks: ["재송곳 기사단의 인장"]
  - id: off_proxy_melisande
    title: 멜리산드의 대리
    holder: "unnamed:오렐리아 베스페린 — 용인 학자, 베스페린 가 수장"   # TODO-NPC (HOUSES §2.6 오렐리아 베르미온과 이름이 같다 — 별개 인물로 둔다)
    reports_to: off_five_fires
    powers: ["멜리산드의 표", "재무와 세렌 대출 창구(재무청 겸임)"]
    chosen_by: "후계자 지명 (멜리산드)"
    perks: ["세렌 상관과의 직통 서신 — 제국 국고에 들어가는 두카트는 이 방을 거친다"]
  - id: off_guard_captain
    title: 근위대장
    holder: "unnamed:모르칸 쇠비늘 — 용인, 근위대 1,200 지휘. 카스파르에게 빚이 있다"   # TODO-NPC npc_morkan
    reports_to: off_five_fires
    powers: ["비늘 근위대 1,200", "용언 발음·글자 소지 단속(바알카르 시내)", "용좌봉 출입 통제"]
    chosen_by: "용황의 임명. 표면상 중립 — 근위대가 어느 쪽으로도 움직이지 않는다는 것이 균형이다"
    perks: ["근위 막사", "다섯 불의 의자 한 자리"]
    note: "'모르칸의 빚' — 구해준 사람은 실은 카스파르의 어머니 엘레나였다 (REGIONS §1.12 소문 4: 반쯤 사실)"
  # ── 궁정: 집사·서기·시종 ──
  - id: off_flame_steward
    title: 용좌 집사 (불꽃 홀의 집사)
    holder: "unnamed:세베리안 칼다란 — 대공, 288세"   # TODO-NPC npc_severian_kaldaran. HOUSES §2.1
    reports_to: off_emperor
    powers: ["용황 병상 출입 통제 — 용황의 '뜻을 들었다'고 증언하는 유일한 용인", "불꽃 홀의 확인(§succession)의 단상 개방", "회색 장부와 의전 일체"]
    chosen_by: "칼다란 가문 세습 — SK 1,231 '잿날개의 밤' 이후 2,000년간 집사직 세습. 용황이 새로 임명하지 않는다"
    perks: ["셋째 서랍(원본 족보 금고)", "용황 병세의 비밀 — AS 302부터 알았다"]
  - id: off_grey_ledger
    title: 회색 장부 관리관
    holder: "unnamed:아르덴 칼다란 — 160세, 대공의 장남"   # TODO-NPC
    reports_to: off_flame_steward
    powers: ["제국 국유 노예 약 4만(칼다란 직관) — 번호·낙인·인두세 기준 명부 관리", "장부에서 이름을 지운다(= 그 인간은 '없는 사람'이 되어 누가 죽여도 죄가 아니다)", "'잔향 징후' 항목 집계 — AS 311에 3배, 대공이 절반으로 줄여 올렸다"]
    chosen_by: "칼다란 가문 내 지명"
    perks: ["장부 열람권 — 다른 가문의 노예 수까지 본다"]
  - id: off_flame_marshal
    title: 불꽃 홀 의전관
    holder: "unnamed:리비아 칼다란 — 97세, 대공의 딸"   # TODO-NPC
    reports_to: off_flame_steward
    powers: ["비늘 서약·비늘 의례·불의 잔의 식순", "궁정 좌석과 접견 순서(곧 권력의 지도)"]
    chosen_by: "집사 지명"
    perks: ["카스파르와 같은 해 바알카르 궁정에 있었던 사람 — 그를 동정하는 몇 안 되는 순혈"]
  - id: off_imperial_seal
    title: 용황의 인장 (칙령 인장관)
    holder: npc_kaidor
    reports_to: off_emperor
    powers: ["용황의 인장을 사슬에 걸고 칙령에 찍는다", "칙령 초안 — 최근 140건은 모두 그가 썼다", "서기 크릭 셋을 '손'으로 부린다"]
    chosen_by: "원로회 서기장이 겸한다 (AS 250부터). 인장은 서기장의 이름으로 찍힌다"
    perks: ["칙령이 식기 전에 찍을 수 있는 유일한 손"]
    note: "비늘 원로회 쪽 자리는 fac_scale_council의 off_council_scribe. 같은 사람이 두 모자를 쓴다"
  - id: off_throne_attendant
    title: 용황 병상 시중장
    holder: npc_nora
    reports_to: off_emperor
    powers: ["밤 시간의 유일한 청자 — 용황이 맑은 정신으로 말하는 상대", "시중 노예(크릭 4, 인간 2) 지휘"]
    chosen_by: "용황이 직접 곁에 둔다 — 국유 노예 신분 그대로. 앞의 열한 명은 대붕괴의 진실을 듣고 '처분'됐다"
    perks: ["노예이면서 용황의 침실에 드는 유일한 인간", "이번에는 죽이지 않기로 한 청자"]
  - id: off_nest_seneschal
    title: 재의 둥지 시종장
    holder: "unnamed:에둔 — 용인, 용좌봉 시종 40 지휘"   # TODO-NPC (REGIONS §1.9)
    reports_to: off_emperor
    powers: ["용좌봉 둥지의 살림", "인간 공물 운반자 200과 비늘 더미 관리 — 바닥에 떨어진 비늘은 하루 한 바구니씩 노예가 훔쳐 판다"]
    chosen_by: "집사 추천, 용황 묵인"
    perks: ["증기 독을 견디는 처방"]
  - id: off_palace_servants
    title: 궁정 하인장
    holder: npc_fizik
    reports_to: off_nest_seneschal
    powers: ["굴뚝·배관 담당 크릭 30 — 벽 너머를 엿듣는 귀", "정보를 세 후계자 모두에게 판다"]
    chosen_by: "크릭 길드 '굽은 등' 추천 — 국유 노예 신분이 아니다"
    perks: ["지하 배관층 '소리 방'"]
  # ── 재무·인간 관리 ──
  - id: off_treasury
    title: 재무청장 (세렌 대출 창구)
    holder: "unnamed:오렐리아 베스페린 (겸임)"
    reports_to: off_chancellor
    powers: ["국고 출납", "세렌 몬달리·오랄 상가와의 대출 협상"]
    chosen_by: "재상 임명, 멜리산드 진영의 추천"
    perks: ["세렌 두카트의 '사실상 담보' 목록 열람"]
  - id: off_poll_tax
    title: 인두세 총괄
    holder: "unnamed:볼가스 높은홰 — 왕관 와이번, 410세 (수석 원로가 겸임)"   # TODO-NPC
    reports_to: off_chancellor
    powers: ["수확월 인두세 징수의 세제 설계(인간 1명당 연 2발톱을 영주가 납부)", "원로회 '높은홰' 장부 — 칼다란의 회색 장부와 이중으로 관리, 매년 3,000명이 어긋난다(장부 밖 노예)"]
    chosen_by: "원로회 의장직에 딸린 자리"
    perks: ["장부 밖 노예 3,000을 와이번 둥지 공사에 쓴다"]
  - id: off_state_slave_assign
    title: 국유 노예 배당관
    holder: "unnamed:모르나 재날개 — 왕관 와이번, 280세 (재날개 둥지)"   # TODO-NPC
    reports_to: off_chancellor
    powers: ["국유 노예를 각 영지에 '배당'한다 — 레이번에 배당된 농노 400의 명부도 이 방에서 나온다", "배당 노예의 무단 매각은 영지 몰수 사유 — 고드릭의 37명을 이미 알고 있다"]
    chosen_by: "원로회 배분"
    perks: ["영주들에게 거는 보이지 않는 끈"]
  - id: off_scale_market
    title: 비늘 시장 운영권자
    holder: "unnamed:세베린 타르굴 (타르굴 가 겸임)"
    reports_to: off_chancellor
    powers: ["바알카르 비늘 시장(상시 노예 2,000)과 파종월 대시장", "경매관 크릭 빅스, 세렌 중개인 상주권 허가"]
    chosen_by: "타르굴 가 세습"
    perks: ["거래 장부(용언) — 회색여울 농노 40명의 '선매 기록'(9월)이 올라 있다"]
  - id: off_hound_licensee
    title: 공인 노예사냥 조합장
    holder: npc_volk
    reports_to: off_chancellor
