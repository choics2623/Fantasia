toward_echo: >
  공식: 태우기 — AS 213 이래 잔향 사냥은 법이고, 회색 장부에는 '잔향 징후' 항목이 있다. 실제로는 진영마다 다르다.
  아우락스·드라반: 화형 후 단절(아버지의 불로). 멜리산드: 포획 후 이식. 원로회: 조용히 처리하되 긴그림자는 쓸모를 먼저 계산.
  카스파르: 불명(같은 '잡종'으로서의 동질감, 이용). 용황 바르스카르: 기시감 — 낙엽월마다 '또 그 저녁'이라 중얼거리고 회색여울 쪽 하늘을 오래 본다.
