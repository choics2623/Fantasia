decision: >
  세 층이 겹친다. ① '뜻' — 용황이 오후 한 시간 깨어 후계자 셋을 교대로 접견할 때와 밤에 노라에게 말할 때. 이 시간 밖의 뜻은
  용좌 집사가 '들었다'고 증언하는 것으로만 존재한다. ② '글' — 서기장 카이도르가 초안을 쓰고 인장을 찍는다(크릭 서기 셋이 대독).
  용황이 칙령을 읽지 못한 지 3년, 최근 140건은 전부 서기장의 것이다. ③ '손' — 다섯 불의 의자가 매 주 4일째 정오에 모인다
  (노동 5일·안식일 1일의 6일 주). 3/5 연서로 비상 칙령, 이졸데는 거의 오지 않으므로 사실상 4석 중 3석이 필요하다. 흰 알 관련 사안은
  이졸데의 동의가 없으면 집행되지 않는다(알의 법 — 거부권). 서부군·국경군·근위대는 각자의 지휘선이 따로 있고 의자 합의와 무관하게 움직일 수 있다.
  결국 제국의 결정은 '누가 용황의 병상에 접근하는가'와 '누가 인장을 찍는가'의 두 열쇠로 모인다.
succession: >
  불의 계승: 왕위는 상속이 아니라 차지하는 것 — 전임자의 죽음, 또는 전임자를 불로 굴복시킨 자. 건국 이후 용인 귀족이 질서를 원해
  '불꽃 홀의 확인'이 붙었다. 새 용황은 불꽃 홀에서 용인 대가문 가주들의 비늘 서약(손바닥을 그어 용황의 비늘에 피를 바른다)을 받아야
  제국 행정을 장악한다. 서약 단상은 칼다란 집사가 연다. 지금 판세는 귀족 지지율 아우락스 41 / 멜리산드 32 / 흰 알 18 / 카스파르 9로
  어느 쪽도 과반이 아니다 — 그러므로 확인 전에 용 대 용의 결투와 내전(313 태양월 이후 '세 개의 깃발')이 낀다. 용황 사망 시 공석 동안
  인장은 서기장이, 서약 단상은 집사가 쥔다. 흰 알은 313 꽃월 부화 예정이며 부화하는 순간 흰 알 지지율이 ×1.5가 된다(알이 탈취·파괴되면 분산).
  세벨린(재의 요람)이 날아오면 '가장 오래된 용'으로 지지율 최대 10이 생긴다.

law:
  crimes:
    - {act: "인간의 글자 소지·쓰기 (재의 법)", punishment: "즉결 처형 — 누구든 집행할 수 있다", note: "인간에게만. 용인에게 읽고 쓰기는 귀족의 증표다"}
    - {act: "인간의 진명·마법 발설", punishment: "화형 (잿빛 탑에 먼저 매각 가능)", note: "어긴 인간은 어느 종족이든 죽일 수 있다 (사슬의 맹약 3조)"}
    - {act: "인간의 용언 발음", punishment: "혀 절단", note: "근위대가 집행. 용인이 용언을 틀리게 발음하는 것은 조롱거리(법은 아님)"}
    - {act: "인간이 용의 눈을 똑바로 봄", punishment: "태형 10, 용이 원하면 즉사", note: "현장 판결"}
    - {act: "통행증 없는 이동 / 기한 지난 통행증", punishment: "태형 20, 재범 낙인", note: "쇠 패에 영지 문장과 날짜. 기한 지난 통행증은 탈주 증거"}
    - {act: "인간의 돈 소지", punishment: "절도 의심 — 압수 + 태형 30", note: "세렌 계약민만 예외"}
    - {act: "인간의 탈주", punishment: "1회 태형 40 / 2회 발뒤꿈치 힘줄 절단 / 3회 매각 또는 처형", note: "탈주자 은닉은 은닉자 가족 전원 매각(영지별 가중)"}
    - {act: "잔향 징후 (오지 않은 일을 말함, 배운 적 없는 날짜·이름, 처음 보는 곳을 앎)", punishment: "감금 후 화형 — 잿빛 탑에 먼저 매각될 수 있다", note: "근위대·바르그 집행. 징후자 보고는 회색 장부에 항목이 있다. 대부분 무고한 아이다"}
    - {act: "남의 보고(寶庫)를 만진다", punishment: "용인·인간은 즉결 처단, 용이면 결투", note: "용족 금기 ① — 법과 관습이 같다"}
    - {act: "알을 깨뜨린다", punishment: "용서 없음 — 3,400년간 단 한 번도 용서받지 못했다", note: "금기 ②"}
    - {act: "배당 국유 노예의 무단 매각", punishment: "영지 몰수", note: "용인·와이번에게 적용. 레이번 고드릭이 이미 37명 — 배당관 재날개 둥지가 알고 있다"}
    - {act: "인두세 머릿수 허위 신고·장부 밖 은닉", punishment: "영지 몰수·가문 장부 말소 (가문이 '없는 가문'이 된다)", note: "SK 2,512 하길라 반란 때 가문 셋의 장부를 불태운 선례. 모르간트가 지금 800명을 숨겼다"}
    - {act: "용인-인간의 결합·반용 출산", punishment: "용인은 가문 강등·인간은 죽음, 아이는 출생일에 '처분'", note: "카스파르만 살려진 이유는 기록에 없다"}

customs:
  greeting: >
    진룡의 영공에 들 때 세 번 선회한다(생략하면 선전포고). 용인끼리는 손바닥을 펴 비늘 서약의 상처 자리를 보이며 가문명과
    섬기는 진룡의 이름을 댄다. 와이번은 앉은 높이가 곧 서열이라 낮은 자를 내려다보며 말하고, 인간은 홰 아래 땅에서만 말할 수 있다.
    인간은 눈을 내리깔고, 바알카르의 노예는 해 질 녘 그림자가 길어질 때 고개를 숙이고 걷는다.
  taboos:
    - "용족 앞에서 '잃었다'를 말하지 않는다 (패배는 '양보했다')"
    - "'도둑', '역린', 시간의 상처, 다른 용과의 비교 — 즉시 관계 파탄 또는 공격"
    - "진룡 앞에서 '섭정'·'이후'를 말하지 않는다 (용 이후의 제국은 순혈과 원로의 속삭임으로만 존재한다)"
    - "인간은 용좌봉을 손가락으로 가리키지 않고 바르스카르의 이름을 소리 내어 말하지 않는다"
    - "용인은 인간과 같은 식탁에 앉지 않고, 맨손으로 인간을 때리지 않는다 (채찍·장갑 — '닿으면 피가 옅어진다')"
    - "비늘혈이 순혈에게 비늘 수를 묻지 않는다. 잠든 진룡의 수를 세지 않는다 ('셋이 자고 있다'는 원로회 안에서도 금지)"
    - "용은 자기 노예를 직접 죽이지 않는다 — 용인 집행관이 한다 (자기 소유물을 스스로 파괴하는 것은 금기)"
  rites:
    - {name: "비늘 의례", when: "태양월 1일", what: "용인 귀족이 용좌봉 아래에서 용황의 비늘 조각을 받는다. 312년엔 용황이 나오지 않아 취소될 예정 — 계승 위기의 공개 신호"}
    - {name: "파종월 대시장", when: "파종월", what: "비늘 시장 노예 대시장. 용인 가문이 경매 패를 들고 겨룬다. 성인 농노 시세가 2비늘까지 떨어진다"}
    - {name: "인두세 수납", when: "수확월", what: "영주가 소유한 인간 머릿수만큼 납부한다. 인간을 숨기는 것은 곧 탈세"}
    - {name: "불의 잔", when: "비늘혈 가문의 대(代)마다 — 진룡 앞", what: "진룡의 피 한 잔을 무릎 꿇고 마신다. 피가 옅어짐을 늦춘다. 배정은 원로회와 순혈 대가문이 쥔다 — 레이번은 3대째 못 받았다"}
    - {name: "비늘 서약 (불꽃 홀의 확인)", when: "용황 즉위 때", what: "가주들이 손바닥을 그어 용황의 비늘에 피를 바른다"}
    - {name: "소유의 낭송", when: "용황 즉위 의식", what: "'모든 것의 목록'을 낭송한다. 바르스카르의 정식 이름을 다 읊는 데 사흘이 걸린다"}
    - {name: "재의 날", when: "연말 5일", what: "대붕괴 추모. 불을 피우지 않는다. 시간 잔상이 가장 많이 나타난다. 이름 없는 자들은 몰래 아스테리온을 기린다"}
    - {name: "맹약회의", when: "AS 313 태양월 1~11일", what: "서약섬. 100년에 한 번. 제국은 수석 대표를 아직 못 정했다"}
  speech: >
    용언이 귀족어, 공용어가 모어. 문서는 공용어, 서명은 용언 문자. 존칭은 '각하'(진룡·용황 대리), 하십시오체에 문장 끝을 한 박자 낮춘다.
    와이번은 공식 자리에서 서기의 대독으로 말한다('기록에 의하면'). 용인은 모든 것을 장부의 값으로 환산해 말하고, 인간을 '저것'이라 부르며
    직접 말을 걸지 않고 집사에게 묻는다. 금지어: 잃었다, 도둑, 역린, 비늘 하인, 반쯤 드레이크, (공개석상에서) 도마뱀.

membership:
  join: >
    용족·와이번·용인은 출생이 곧 입적이다(비늘 세기 — 성년식에 몸의 비늘을 세어 족보에 적는다. 비늘이 늘면 서열이 떨어진다). 가문 없는 비늘혈은 '○○의 비늘'로 기사가 된다.
    인간은 입적이 아니라 등재다 — 붙잡히거나 팔려 회색 장부에 번호를 받고 오른쪽 어깨에 낙인.
  leave: >
    용인은 가문에서 쫓겨나거나 장부가 불태워져 '없는 가문'이 된다. 인간은 장부에서 지워지면 '없는 사람'이 되어 법 밖에 놓인다 —
    자유가 아니라 아무도 책임지지 않는 죽음이다. 탈주와 사망 처리(아르덴의 펜 한 번)는 같은 줄에 적힌다.
  signs: ["오른쪽 어깨 — 회색 장부 번호 낙인", "왼쪽 어깨 — 소유 용의 표(문장)", "왼쪽 손등 — 사르코스의 등급 낙인(매매 이력)", "바알카르 시내 인간은 목에 사슬 표찰(소유주 각인 쇠판)", "쇠 패 통행증", "용인의 목덜미·관자놀이 비늘과 가문 문장"]

