  - {name: "국경 (카스파르)", faction_id: fac_kaspar, leader: npc_kaspar, aim: "반용 서자의 즉위가 아니라 해방 칙령을 '할 수 있는 자리'. 까마귀 문 국경군·모르간트·이름 없는 자들(비밀)", strength: 9}
  # strength = HOUSES §6.3 귀족 지지율(%). 엔진의 클락 세력 점수는 SCENARIOS §2.1 (60/45/25/15)이며 같은 순서다.

