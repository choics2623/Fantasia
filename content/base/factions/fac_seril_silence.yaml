infiltration:
  join_real: "들어올 수 있는 것은 빈 음을 듣는 엘다르뿐이다. 후보가 노래에서 같은 빈 음을 사흘 연속 따라 빼면 결사가 그를 본다. 시험: '한 바퀴 빼기' — 9일 동안 정해진 음을 빼고도 첫 낭송관에게 '어긋남'으로 불리지 않아야 한다(정확히 같은 길이로 숨을 쉬어 빈자리를 메운다). 그리고 '배운 것 하나'를 그루터기에 놓아야 한다 — 기억이 아니라 새로 배운 것(인간의 노래 한 줄, 처음 맡은 냄새). 엘다르에게 그것은 이단의 고백이다"
  join_fake: "가짜가 들어오기 어렵다 — 빈 음을 듣는 것 자체가 시간 민감의 증거다. 다만 아에린 자신도 시간 민감하다. 그가 빈 음을 들었다면 결사는 이미 반쯤 드러났다"
  proof_test: "잔향에게: 결사는 인간과 말하지 않는다 — 아에릭은 서약했고, 나머지는 인간과 말하는 것을 들키면 끝이다. 잔향이 그루터기에 앉아 하루를 말없이 기다리면(H-02의 시험), 아에릭이 숨 수정의 기억 한 조각을 손짓으로 건넨다"
  exposure: "첫 낭송관이 '한 박자 어긋남'을 선언하면 고리의 의회가 9일 동안 기억을 대조한다 — 빈 음의 자리가 드러난다. 재의 날 '한 박자 돌아봄' 의례가 가장 위험하다: 시간 잔상이 많아 빈 음이 더 크게 들린다"

