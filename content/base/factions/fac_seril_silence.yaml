# 세릴의 침묵 — 엘다르 안의 비밀 결사. 예언의 '뒷부분'이 위협이 아니라 약속이라고 믿는 자들.
# [신설 결사 — HOUSES에 없음] 세계가 함의하는 것: 새벽가지 시조 세릴이 신살 때 에오르의 마지막 숨을 '기록'했다(HOUSES §3.1.2),
# 아엘베린/이실도르의 예언 뒷부분 "…그리고 처음으로 이름을 얻으리라"(HOUSES §3.1.1), 여왕의 의심(fact_sv_elastriel_name_loss_doubt),
# 침묵의 해(AS 268), 아에릭의 침묵 서약(HOUSES §3.1.2), 피오나엘의 꿈(AS 311~), 리안델의 '배움'(fact_sv_liandel_learned_songs), 드라우르 에뮌(SUBRACES §4.3).
# 왜 지금(AS 312): 아에린이 맹약회의 313 전에 시간의 그물을 다시 짜고 리안델을 '돌아옴의 그릇'으로 보며(fact_sv_aerin_vessel_liandel),
# 잔향이 깨어났다(징후 3배, 피오나엘의 꿈). 그물이 이번 잔향을 붙잡으면 '이름을 얻는 날'은 다시 수백 년 뒤로 간다.
id: fac_seril_silence
name: 세릴의 침묵 (엘다르 비밀 결사)
kind: secret
race: [별빛 엘다르, 실반(심부름), 반엘다르(접촉자)]
governance: 침묵 합의 — '빠진 음'으로 말하는 결사. 결정은 첫 아침의 노래에서 같은 음을 함께 빼는 것으로 난다
motto: "이름을 잃는 날, 처음으로 이름을 얻으리라."
seat: 없음. 실바렌 마른 숲 가장자리의 '침묵의 그루터기'(아에릭의 거처)와 이슬 서고 뒤 복원실
size:
  members: "엘다르 열한 — 모두 시간 민감한 기억을 가진 자들(회차가 쌓일수록 기시감이 짙다). 실반 심부름꾼 셋, 반엘다르 접촉자 하나"
  territory: "실바렌 영원 정원 안 — 새벽가지·은이슬 가지·고목 가지에 흩어져 있다"
  wealth: "세릴의 '숨 수정'(신살 때 에오르의 마지막 숨을 담은 기억 수정 — 새벽가지 금고 안, 아에린이 그 가치를 반만 안다), 이슬 두루마리 복원실 출입"
  force: "없다. 엘다르는 엘다르를 해치지 못한다(첫 아침의 노래가 끊긴다). 그들의 무기는 그물을 짜는 손 중 하나가 매듭을 '느슨하게' 하는 것뿐이다"

reason_now: >
  아에린이 영혼 정원에서 그물을 다시 짜고, 리안델을 그릇으로 점찍었다. 결사는 리안델을 '처음으로 배운 엘다르' — 예언의 뒷부분이 이미 시작되었다는 증거 — 로 본다.
  잔향이 그물에 걸려 진짜로 죽으면 그 증거도 그릇이 되어 사라진다. 그래서 결사는 3,400년 만에 처음으로 침묵을 깰 준비를 한다.

decision: >
  열하나는 서로를 만나지 않는다. 매일 새벽 첫 아침의 노래(3,400년간 한 음도 바뀌지 않은)를 부를 때, 결사원은 정해진 자리에서 음 하나를 '빼고' 부른다.
  어느 음을 빼느냐가 말이다 — 셋째 소절 끝음을 빼면 '모여라', 아홉째 소절 첫음을 빼면 '아니다(거부)', 끝 소절을 통째로 숨 쉬듯 흘리면 '그물이 짜인다'.
  시간 민감한 엘다르만 그 빈 음을 듣는다 — 그래서 결사원이 될 수 있는 것도 그들뿐이다. 결정은 노래 한 바퀴(9일) 동안 같은 음을 뺀 자가 일곱 이상이면 난다.
  누군가 '아니다'를 빼면 그 바퀴의 결정은 없다 — 한 엘다르의 거부권. 아에릭은 서약 이후 노래를 부르지 않는다 — 그의 침묵 자체가 '모든 음을 뺀' 영구한 신호이고, 결사는 그를 머리로 친다.
succession: "머리(아에릭)가 퇴색하면 숨 수정을 만질 수 있는 새벽가지 직계 중 결사원이 잇는다 — 지금은 없다. 아에린만 남는다. 그래서 결사는 아에릭이 살아 있는 동안 끝을 보려 한다."

