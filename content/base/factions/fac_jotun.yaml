  - {id: rank_jarl, title: "씨족장 (욀드)", duties: "씨족 30~400명과 노예 관리, 얼음 탁자 출석", privileges: "씨족 재산 처분권", open_to_player: false}
  - {id: rank_hunter, title: "사냥 거인 / 돌 거인", duties: "사냥·채석", privileges: "씨족 식탁", open_to_player: false}
  - {id: rank_song, title: "노래 거인", duties: "씨족 역사를 한 달씩 걸려 노래", privileges: "구전의 권위", open_to_player: false}
  - {id: rank_warband, title: "전사단원 (스카디르)", duties: "남침 준비", privileges: "같은 고기를 나눈 충성", open_to_player: false}
  - {id: rank_slave_elder, title: "노예 장로 / 서리 목줄 (인간)", duties: "노예 관리·호송", privileges: "씨족이 공인하지 않는 영향력", open_to_player: true, condition: "서리말을 배우고(시그리드·아스타가 스승), 노예로서 씨족 안에서 신뢰를 쌓는다"}
  - {id: rank_slave, title: "인간 노예 (씨족 재산)", duties: "사냥 몰이·운반·땔감·털 손질·아이 돌보기", privileges: "평년에는 맞지 않는다(실수로 죽이기 때문). 흉년에는 먹이지 않는다", open_to_player: true, condition: "북방에서 노예로 팔려 들어오거나 위장 입소. 표식은 씨족별 — 돌무릎은 뼈 구슬"}

law:
  crimes:
    - {act: "음식을 버림", punishment: "그 자리에서 맞아 죽을 수 있다", note: "인간·요툰 모두. 거인 앞에서 빵 한 조각을 버려도"}
    - {act: "회관 안에서 불을 피움", punishment: "노예는 회관 밖 불 오두막에서만 가능. 위반은 중벌", note: "인간 대상 — 거인은 불을 두려워한다"}
    - {act: "서리 어머니의 호수에 침을 뱉음 / 호수의 거인 뼈 도굴", punishment: "도굴은 요툰 전체의 원수 — 씨족이 추적한다. 침은 얼음 판결", note: "인간·요툰 모두"}
    - {act: "거인의 이름을 줄여 부름", punishment: "생명을 깎는 모욕 — 얼음 판결 청구", note: "인간 대상. 거인의 이름은 길다"}
    - {act: "나눔 식사 후의 배신", punishment: "씨족 전체의 영원한 적 — 3,400년 최대의 죄", note: "요툰 대상. 거인 전쟁(SK 2,310~2,390)의 원인"}
    - {act: "인간 노예가 도망 — 먹일 입이 줄어든다", punishment: "방치하는 씨족이 많다. 쫓는 것은 씨족장의 사적 판단", note: "인간 대상 — 그래서 북방 대탈주가 가능했다"}
    - {act: "흉년에 노예를 먼저 '덜어냄'(배급 끊기)", punishment: "처벌 없음 — 의례다", note: "요툰 법에서 죄가 아니다. 결과로만 말해진다(대량 아사)"}
    - {act: "사람고기를 먹음", punishment: "법은 명시적으로 금하지 않는다. '부끄러운 일' — 그 부끄러움을 버린 자는 오우거로 떨어진다고 여긴다", note: "요툰 대상. 스카디르의 전사단이 이 선을 넘었다"}
    - {act: "왕이 먹는 만큼 먹지 않고 더 먹음 (흉년)", punishment: "얼음 탁자에서 고기를 거절당한다 = 불신임", note: "왕 대상"}
    - {act: "얼음 판결 후 결과를 거부", punishment: "씨족에서 '덜어짐' — 얼음 들판으로 걸어 나가야 한다", note: "요툰 대상"}

customs:
  greeting: "'같은 고기를 먹었는가?'가 인사다. 처음 만나면 고기 한 점을 나눈다 — 먹으면 1년간 싸우지 않는다. 이름은 길게, 아비의 이름과 업적까지 부른다. 인간은 거인에게 서리말로 천천히 말해야 한다."
  taboos:
    - "음식을 버리는 것, 거인 앞에서 먹을 것을 낭비하는 것"
    - "씨족 회관 안의 불. 서리 어머니의 호수에 침 뱉기"
    - "거인의 이름을 줄여 부르는 것"
    - "나눔 식사 후의 배신 — 가장 큰 죄"
    - "사람고기 — 법은 침묵하나 부끄러움이다. '오우거' 소리가 오는 것을 두려워한다"
  rites:
    - {name: "나눔 식사", when: "수시, 겨울 얼음 탁자 첫날", what: "같은 고기를 먹는 서약. 거인과 동맹을 맺는 유일한 방법은 식탁이다"}
    - {name: "얼음 판결", when: "다툼이 생길 때(겨울)", what: "얼음 호수 위에서 맞붙어 먼저 얼음을 깨는 자가 진다"}
    - {name: "덜어냄", when: "흉년 — 굶주림월 중심", what: "씨족이 먹는 입을 줄인다. 늙은 거인은 스스로 얼음 들판으로 걸어 나가고, 노예는 먼저 덜어진다(배급을 끊는다)"}
    - {name: "노래 한 달", when: "노래 거인이 정함", what: "씨족의 역사를 한 달씩 걸려 노래한다. 노예가 듣고 외운다 — 서리말 노래의 출처"}
    - {name: "서리 어머니의 품", when: "죽음", what: "거인은 죽으면 북쪽 끝 얼어붙은 바다의 거대한 여인에게 걸어간다. 3년 흉작으로 '어머니가 우리를 버렸다'는 절망이 퍼지고 있다"}
  speech: "느리고 낮다. 한 문장을 말하고 숨을 고른다 — 서둘러 대답하는 요툰은 의심받는다. 존칭은 나이(굶주림을 견딘 해)와 업적이 긴 이름으로 정한다. 인간에게는 짧고 직설적이며 '작은 이', '불 든 이'라 부른다. 약속은 음식으로 한다 — '네 고기를 먹었다'가 맹세다. 서두르는 말, 거짓말을 에둘러 하는 말은 느린 사고에는 들리지 않는다."

membership:
