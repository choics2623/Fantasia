  leave: "요툰은 덜어짐으로 나간다(얼음 들판으로). 노예는 탈주한다 — 서리월 전에 울음 고개를 넘어야 하고, 넘지 못하면 겨울을 서리땅에서 난다."
  signs: ["씨족 문장 — 얼어붙은 손바닥(흐림), 바위를 문 입(바위배), 늑대 가죽을 두른 거인(눈늑대가죽), 우물 안의 눈(깊은우물)", "돌무릎 노예의 뼈 구슬", "서리말 노래 — 서리손은 「서리 어머니의 자장가」"]

