# 요툰 서리 씨족 — 서리와 대지('거대')의 굴레(느린 사고, 굶주림)가 만든 식탁의 씨족 연합.
# 근거: HOUSES §3.5, RACES §8, REGIONS §13, facts/hrosgard.yaml.
# 씨족: HOUSES §3.5(흐림·바위배·눈늑대가죽·깊은우물·돌무릎) + REGIONS §13.3(돌팔·서리눈·잿턱·돌무릎). 시그리드 무리 = 돌무릎 (CONTINUITY_LOG 3.x-3).
id: fac_jotun
name: 요툰 서리 씨족 연합 (얼음 탁자)
kind: polity
race: [서리 요툰, 돌 요툰, 언덕 요툰, 오우거(퇴화), 서리 와이번(교역 외부), 인간 노예(서리손)]
governance: 씨족 연합 — 식탁 합의 (얼음 탁자)  # 결정은 '고기를 받아 먹는 쪽'이 이긴다
motto: "서리 어머니는 배고픈 자를 먼저 안는다."
seat: 흐로스가르드 얼음턱 전당 — 서리왕의 홀
size:
  members: "요툰 약 14,000(AS 300년 17,500에서 감소), 씨족 약 60개. 인간 노예 약 150,000(AS 309년 230,000에서 감소)"
  territory: "흐로스가르드(서리땅) 전역 — 남쪽 경계 울음 고개(서리 길), 돌무릎 골짜기, 남쪽 온천 지대"
  wealth: "곡물 없음(3년 연속 흉작). 털·가죽·꿀, 얼음턱 전당 곡창 바닥의 마지막 보리 300섬"
  force: "돌 던지기(사거리 200m), 통나무 곤봉, 인간 노예 방패벽, 겨울에만 진군(얼어붙은 강). 오우거 무리"

decision: >
  요툰의 결정은 '식탁'에서 나온다. 얼음 탁자는 씨족장(욀드)들이 모이는 겨울 회합으로, 얼어붙은 호수 가장자리의 전당에서 열린다.
  느린 사고 때문에 한 안건은 사흘에 걸친다 — 첫날 제안을 말하고, 둘째 날은 아무도 말하지 않고 먹기만 하며, 셋째 날 답한다.
  표결은 '고기'다. 제안자가 고기를 내놓고, 찬성하는 씨족장은 그 고기를 받아 먹는다. 같은 고기를 먹은 자와는 1년간 싸우지 않으므로 먹는 것이 곧 서약이다.
  고기를 거절하면 반대이고, 거절은 곧 식탁 결렬(전쟁 가능성)이다. 거부권은 따로 없다 — 거절이 거부권이고 그 값은 피다.
  다툼은 얼음 호수 위의 '얼음 판결'(먼저 얼음을 깨는 쪽이 진다 — 무거운 쪽이 불리해 굶주림이 덕목이 된다)로 가른다.
  왕은 '먼저 굶는 자'다. 흉년에는 왕이 씨족장 누구보다 적게 먹어야 하고(흐림니르는 3년째 그렇게 한다), 그렇지 못한 왕은 얼음 탁자에서 고기를 거절당한다.
  인간 노예는 씨족 재산이라 얼음 탁자의 의제가 아니다 — 씨족장의 사적 처분이다. 그래서 왕의 칙령(노예를 남쪽으로 풀어 줌)조차 씨족장들 몰래 아스타를 통해 전해졌다.
succession: >
  서리왕은 씨족장 회의가 추대한다. 선례는 '가장 오래 굶고도 서 있는 자' — 힘이 아니라 인내를 본다. 흐림 씨족이 왕 씨족이지만 세습은 아니다.
  왕이 죽거나 식탁에서 거절당하면 얼음 판결이 열릴 수 있고, 현재 후계 구도는 왕자 스카디르(남침파, 전사단)가 아버지의 노예 칙령을 반역으로 몰아 찬탈하려는 계획이다.
  왕 자리가 비는 겨울은 서리 어머니의 '덜어냄'이 가장 많이 바쳐지는 때다.

