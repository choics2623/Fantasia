# 엘다르 가지 — 시간 혈명('영속')의 굴레(변하지 못함, 완벽한 기억)가 만든 통치 형태.
# 근거: HOUSES §3.1, RACES §5, REGIONS §5, WORLD_BIBLE §1.2/§4.2. 장소 id는 REGIONS §5.9.
id: fac_eldar
name: 엘다르 가지 (첫 아침 나무)
kind: polity
race: [엘다르(별빛), 실반, 정원지기(인간, 계급 밖)]
governance: 기억 합의 (고리의 의회)   # 새 형태 — 표결이 아니라 '기억 대조'로 결정한다
motto: "우리는 처음을 기억한다."
seat: 실바렌 영원 정원 — 첫 아침의 나무 (eternal_garden__first_tree)
size:
  members: "엘다르 약 24,600 (별빛 18,200 + 실반 6,400), 정원지기(인간) 약 3,100 — 최연소 44세, AS 268 이후 별빛 엘다르 출생 0"
  territory: "실바렌 영원 정원(시간 정체 결계), 루멘 감독관 350, 아르카스 잿빛 탑 객원 약 60, 용제국 궁정 사절 약 40"
  wealth: "화폐 없음. 은목재, 약초, 기억 수정 — 모두 '선물'로만 움직인다"
  force: "직접 병력은 적다. 시간 정체 결계, 은목 숲의 '말 없는 사냥꾼'(순혈파 궁수), 예지, 그리고 시간의 그물"

decision: >
  엘다르는 표를 세지 않는다. 안건이 서면 고리의 의회(첫 아침의 가지 140석)가 '노래 한 바퀴'(9일)마다 모여
  선례 낭송으로 결정한다. 제안자는 같은 일이 과거에 있었는지 기억을 낭송하고, 의원들이 차례로 자기 기억을 덧댄다.
  기억이 한 올도 어긋나지 않으면 그것이 결정이다(합의 = 어긋남 없음). 어긋나는 기억을 가진 이가 '한 박자 어긋남'을
  선언하면 안건은 다음 한 바퀴로 넘어가 두 기억을 대조한다 — 이것이 사실상의 거부권이고, 선언은 취소할 수 없다.
  두 기억이 끝까지 맞서면 더 오래 기억하는 쪽(나이 = 기억의 양)이 옳다. 신살 이전 기억을 가진 이의 낭송은 한 마디가
  두 마디의 무게를 가지고, 낭송으로 '받은 기억'(전수)은 절반의 무게를 가진다.
  한번 정해진 결정은 첫 아침의 노래에 붙어 영원이 된다 — 고칠 수 없고 '다시 기억'(해석 변경)할 수만 있다.
  그래서 결정은 대개 수십 년이 걸리고, 새로운 안건(침묵의 해 이후의 모든 것)은 선례가 없어 번번이 보류된다.
  영원 여왕은 의장이 아니다. 그녀는 의회가 '정지'에 빠질 때 오직 한 가지 일을 한다 — 자신의 기억을 낭송한다.
  아무도 그것에 반하는 기억을 가지지 못해 결정이 사실상 끝난다. 그래서 여왕은 거의 낭송하지 않는다.
  인간·외부의 일(경매, 감독관 인사, 영혼 정원)은 의회에 올라가지 않고 가지별 관할로 처리된다 — 그 틈이 존속파의 힘이다.
succession: >
  선출하지 않는다. 퇴색(몸이 나무가 되어 이름만 남는 것)으로 자리가 비면 가장 오래 기억하는 가지의 증인이 낭송으로 '받은 기억'을
  채워 후임을 세운다. 여왕 자리는 비어 본 적이 없다 — 엘라스트리엘이 퇴색하면 이실레아(왕녀)가 잇는 것이 선례이나,
  침묵의 해 이후 '이을 아이'의 부재가 아무도 입에 올리지 못하는 균열이다. 리안델이 유일한 다음 세대다.

