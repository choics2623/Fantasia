law:
  crimes:
    - {act: "정원지기가 엘다르어로 말함 (듣기만 허용)", punishment: "정지 7일 — 시간 마법으로 몸이 굳고 의식은 깨어 있다", note: "인간 대상. 집행 미리엘"}
    - {act: "정원지기가 꽃을 꺾음 / 실바렌의 나무를 베거나 가지를 꺾음", punishment: "꽃은 정지 3일, 나무는 손을 자른다", note: "인간 대상"}
    - {act: "정원 밖으로 나감 / 글자를 씀", punishment: "잊힘 — 번호를 지우고 숲으로 추방한다. 엘다르는 죽이지 않는다, 숲이 죽인다", note: "인간 대상. 집행 카엘론"}
    - {act: "짝짓기 거부", punishment: "정지 30일, 재차 거부 시 경매로 반환", note: "인간 대상"}
    - {act: "엘다르 영역에서 에오르의 이름을 말함", punishment: "혀를 뽑는다", note: "인간 대상. 엘다르끼리는 '그분'이라고만 한다"}
    - {act: "엘다르를 허락 없이 만지거나 세 걸음 안으로 다가섬", punishment: "정지 1~3일", note: "인간 대상 — 세 걸음 규칙"}
    - {act: "엘다르 앞에서 '죽음'·'끝'·'잊었다'를 말함", punishment: "인간은 정지 1일. 엘다르끼리는 처벌이 아니라 침묵으로 대한다", note: "양쪽 모두에 해당. 존속파 앞에서 침묵의 해를 언급하면 분노"}
    - {act: "배움 — 새 노래·새 기술·새 낱말을 '배워' 부름 (기억이 아니라 배움)", punishment: "'고쳐야 할 병'으로 간주, 교사가 붙어 되새김 교정", note: "엘다르 대상. 리안델이 걸려 있다. 들키면 가르친 인간 마을이 처벌"}
    - {act: "엘다르가 엘다르를 해침 (첫 아침의 노래를 끊는 죄)", punishment: "이름 깎기 — 족보에서 이름을 깎고 '잘린 가지'로만 부른다", note: "엘다르 대상. 순혈파가 인간을 실행자로 쓰려는 이유"}
    - {act: "예언을 끝까지 말함", punishment: "의회에서 낭송권 일시 정지", note: "엘다르 대상. 완성된 예언은 이루어진다고 믿는다"}

customs:
  greeting: "마주 서서 한 박자 쉬고, 상대의 기억 칭호를 먼저 부른다('새벽 가지를 처음 기억한 분'). 이어 '처음을 기억하소서' — 답은 '기억하며 있소'. 선물에는 '기억할 의무'가 따르므로 인사 끝에 받은 선물을 하나 헤아린다."
  taboos:
    - "'잊었다', '망각', '새롭다'를 자랑하는 말 — 엘다르 앞에서는 저주에 가깝다"
    - "에오르의 이름. '그분'이라고만 한다"
    - "엘다르 앞에서 '죽음'·'끝', 침묵의 해를 입에 올림 (존속파는 분노, 순혈파는 침묵)"
    - "정원의 물을 손으로 휘젓기, 첫 아침의 나무를 등지고 서기"
    - "정원지기를 '노예'라고 부름 — 엘다르는 '보살핌 받는 자'라 한다"
    - "'지금'을 강조하는 말. 엘다르는 현재를 가리키는 말을 아낀다"
  rites:
    - {name: "첫 아침의 노래", when: "매일 새벽 (한 바퀴 9일)", what: "신살 이전의 첫 아침을 엘다르 전원이 낭송한다. 3,400년간 한 음도 바뀌지 않았다. 의회는 한 바퀴가 끝날 때 모인다"}
    - {name: "빈 요람의 밤", when: "해빙월 (AS 268 마지막 출생 기념 — 날짜는 임시)", what: "빈 요람 전당에 모여 울지 않고 침묵한다. 요람 1,200개"}
    - {name: "한 박자 돌아봄", when: "재의 날 (연말 5일)", what: "고리의 의회가 '노래가 한 박자 되돌아갔다'는 어긋남을 대조한다. 시간 잔상이 가장 많은 날 — 시간 민감 엘다르는 회차가 쌓일수록 같은 저녁을 먼저 짚는다"}
    - {name: "선물 갚기", when: "수시", what: "선물은 받은 쪽이 갚을 때까지 줄 쪽이 기억한다. 갚으면 그 기억은 '닫힌다'"}
    - {name: "잠든 나무 아래 장례", when: "퇴색 시", what: "퇴색한 엘다르는 마른 숲에 서 있고 나무에 이름이 붙는다. 늙은 정원지기는 그 아래 함께 묻힌다(고목 가지)"}
  speech: "현재형을 아껴 과거 어미('~하였소', '~이었던 바')로 말하고, '모른다' 대신 '아직 기억 속에 없다'고 한다. 윗사람(더 오래 기억하는 자)에게는 문장을 끝맺지 않고 낭송조로 낮추며, 아랫사람에게는 단정한다. 예언은 조각으로만 말한다. 인간에게는 반말이 아니라 '의무를 지우는' 정중함 — 따뜻하되 거리가 있다."

membership:
  join: "엘다르는 태어나는 것 외에 길이 없다 — 침묵의 해(AS 268) 이후 출생 0. 실반 아이만 연 3~5명 태어나며 별빛 엘다르는 이를 밖에 알리지 않는다. 인간은 바알카르 파종월 시장이나 은잎문 경매 정자에서 '선물 교환'으로 들어와 정원지기가 된다."
  leave: "퇴색(몸이 나무처럼 굳어 이름만 남음), 이름 깎기(추방, '잘린 가지'), 갈증 망명(녹테른의 피를 택함 — 매년 몇 명이 실바렌에서 사라진다). 정원지기는 나갈 수 없다 — 나가면 '잊힘'이고 숲이 죽인다."
  signs: ["금실 옷의 정원지기, 꽃 이름", "엘다르끼리 기억 칭호로 서로를 부름", "손바닥에 은목 잎 문양(수문장 선물)", "가시안개로 간 '잊힌 자'들의 머리카락 매듭 — 은잎문 아치 기둥"]

