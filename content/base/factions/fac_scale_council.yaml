# 비늘 원로회 — 왕관 와이번 다섯 둥지의 회의체. 정본: HOUSES §1.7, §6.1(행렬 밖 값), §6.3 / SUBRACES §3.3~3.4 / RACES §2~3 / WORLD_BIBLE §1.2.1
# 카드 npc_kaidor(서기장)와 맞춘다. 원로회 회의장은 불꽃 홀 바로 아래층 '홰의 회랑'(칼다란과의 관계를 위치가 말해 준다).
# 기준: AS 312 낙엽월 1일.
id: fac_scale_council
name: 비늘 원로회
kind: org
race: [와이번(왕관·기사·잿빛), 크릭(서기), 비늘혈 용인(후원 관계), 인간(서기 노예·장부 밖 노예)]
governance: 과두 의회 — 둥지 세습 원로석 9
governance_note: >
  의석은 돈으로 사지 못한다. 다섯 둥지 가문이 알로 상속한다(와이번은 40년에 알 하나뿐이라 의석은 늘 모자란다).
  세제·군수·국유 노예 배분·감찰이라는 제국 행정의 실무가 모두 이 회의의 장부에서 나온다 — 그래서 원로회의 힘은 오직 기록이다.
  진룡 앞에서는 목을 땅에 대고 엎드리고 둥지로 돌아오면 진룡을 '보물더미 위에서 잠자는 늙은 짐승'이라 부른다.
motto: "기록되지 않은 것은 날지 못한다."   # 볼드 가훈과 겹치지 않게 와이번식으로 — 원로회의 비공식 격언. TODO: 디자이너 확인
seat: baalkar          # 불꽃 홀 아래층 '홰의 회랑'. 각 진룡 영지에 연락 둥지 약 60 (잿불 언덕 12, 회색여울 감찰 2)
size:
  members: "왕관 와이번 약 300 (바알카르 둥지탑 다섯 약 240) / 기사 와이번 1,500 (가신) / 잿빛 와이번 약 4,000 (육종한 짐승) / 크릭 서기 다수 / 서기 노예·장부 밖 노예"
  territory: "바알카르 '둥지탑' 다섯 + 각 영지 연락 둥지. 영지가 아니라 장부를 소유한다"
  wealth: "인두세 총괄과 이중 장부, 장부 밖 노예 3,000, 세렌과의 자금 협상 창구(섭정 자금은 몬달리 장부를 지난다)"
  force: "기사 와이번 1,500 (공중 전력의 전부 — 청동발 지휘) · 까마귀 문 날개대 60은 카스파르 지휘 아래에 있어 청동발이 못마땅해한다"

