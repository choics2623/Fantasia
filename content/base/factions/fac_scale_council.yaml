decision: >
  정례 회의는 매달 첫 4일째 정오(홰의 회랑), 비상 소집은 서기장이 한다. 발언은 앉은 홰 높이 순. 의사는 9석 5/9 다수결,
  동수는 의장. 높은홰 3 + 청동발 2 = 5로 재무와 군수가 합치면 과반 — 그래서 원로회는 이 둘을 쥐는 자가 움직인다.
  '섭정 선포'는 7/9(높은홰 3 + 청동발 2 + 흰목 1 + 긴그림자 또는 재날개 1)이어야 하므로 청동발이 이탈하면 섭정안이 선다.
  진룡 앞에서는 표결이 없다. 혈명의 명령 — 진룡의 직접 명령은 거역할 수 없다 — 이 모든 표를 무효로 한다.
  모든 결정의 문서는 서기장의 손(크릭 서기 셋)을 거쳐 인장이 찍힌다. 공석인 의석은 같은 둥지의 가신이 이어받아야 하며
  다른 둥지는 가져가지 못한다. 서기장·의장이 죽는 순간 인장과 장부가 한꺼번에 행방불명이 된다.
succession: >
  의석은 둥지 세습 — 알로 상속한다. 와이번은 40년에 알 하나이고 성숙에 80년이 걸리므로 공석이 오래간다. 가주가 죽으면
  같은 둥지에서 가장 높은 홰의 와이번이 이어받는다(둥지 안 서열 싸움이 곧 후계 다툼). 흰목은 최고령 엘렌드 이후 후계자가
  뚜렷하지 않다 — 그것이 흰 알 섭정안의 가장 약한 고리이다. 서기장은 의장이 임명한다(합의가 아니라 사실상 지명).
  '용황의 인장'을 누가 쥐는가는 용황이 죽은 뒤의 첫 쟁점이다.

law:
  crimes:
    - {act: "'섭정'이라는 낱말을 진룡 앞에서 입에 올린다", punishment: "원로회 안의 침묵 처분 — 의석 박탈 투표, 공개적이라면 진룡의 처벌", note: "와이번에게만. 기록은 '사본'이라 표현한다"}
    - {act: "잠든 진룡의 수를 센다 ('셋이 자고 있다')", punishment: "서기 노예라면 즉결 처형, 와이번이면 장부에서 이름이 지워진다", note: "원로회 안에서도 금지. 잠의 향을 가리는 규칙"}
    - {act: "'첫 식은 알' 기록을 외부에 보인다", punishment: "흰목 둥지가 내부 심판 — 둥지 추방", note: "와이번은 진룡의 버려진 자식이라는 사실 — 경멸이 존경의 모양을 하고 있는 이유"}
    - {act: "장부 밖 노예 3,000을 폭로한다", punishment: "폭로자는 반역 — 서기 노예면 가족 전원 장부 밖으로", note: "칼다란이 알면 원로회를 칠 명분이 생긴다. 공사장의 3,000은 증거 인멸 대상이 된다"}
    - {act: "홰의 순서를 어기고 위에 선다", punishment: "해당 회의 퇴장·발언 박탈", note: "인간은 홰 아래 땅에 엎드려서만 말할 수 있다 — 위반하면 서기가 발언을 기록에서 지운다"}
    - {act: "기사 와이번이 명령 없이 움직인다", punishment: "깃 서약 박탈 → 서리 와이번처럼 '미회수 재산' 장부", note: "이슈카의 소환 거부는 반역"}
    - {act: "칙령 날짜를 앞당긴다 ('사본')", punishment: "합법 — 서기장의 권한", note: "'위조'라는 낱말은 쓰지 않는다. 인장이 마르기 전에 찍는다"}
    - {act: "서리 와이번·독꼬리 와이번이 제국 장부에 오른다", punishment: "서리 와이번은 '미회수 재산', 독꼬리는 '늪 도마뱀' — 법적 지위 없음", note: "SUBRACES §3.3 관계"}
    - {act: "인간이 글을 읽고 쓴다", punishment: "즉결 처형 (재의 법)", note: "서기장이 위장 배속한 '손'만 알면서 모른 척한다 — 원로회 내부 암묵 관행"}

customs:
  greeting: "앉은 높이가 서열이다. 서로 홰 높이를 확인하는 짧은 눈짓. 진룡 앞에서는 목을 땅에 댄다. 용인 대가문에게는 '귀하의 비늘 수를 여쭙지는 않겠습니다'라는 얼음처럼 정중한 가시. 인간에게는 직접 말하지 않고 서기가 대독한다."
  taboos:
    - "진룡 앞에서 '섭정'을 말하는 것"
    - "잠든 진룡의 이름을 세는 것 — '셋이 자고 있다'"
    - "족보의 '첫 식은 알' 기록을 외부에 보이는 것"
    - "공개석상에서 '날개 달린 도마뱀'이라 부르는 것 — 기록하지 않되 기억한다"
    - "'위조'라는 낱말 (→ '사본')"
  rites:
    - {name: "홰의 서열 확인", when: "정례 회의 첫머리 (매달 첫 4일째)", what: "원로석 9가 홰의 높이 순서로 앉았는지 확인. 한 칸이라도 어긋나면 그날 회의는 서열 정리로 끝난다"}
    - {name: "깃 서약", when: "기사 와이번 성숙 40세", what: "왕관 둥지 하나에 깃을 바친다. 이름은 '개인명 + ○○의 깃'"}
    - {name: "식은 알의 낭송", when: "흰목 둥지 내부, 해빙월", what: "서른 마리 첫 식은 알이 각각 어느 진룡의 알이었는지 읊는다. 외부 비공개"}
    - {name: "인두세 대조", when: "수확월", what: "높은홰의 장부와 칼다란의 회색 장부를 대조 — 3,000명이 어긋난다"}
  speech: "공문서체와 장부의 말. 공식 자리는 크릭 서기 셋의 합창 대독, '기록에 의하면'으로 시작하고 숫자와 날짜로 끝낸다. 진룡 앞에서는 엎드린 공문서체('폐하께서', '어명을 받들어'), 사적으로는 '진룡은 23마리다. 우리는 300이고 기사 와이번은 1,500이지.' 금지어: 도마뱀, 위조, 믿는다, 약속."

membership:
  join: "와이번 알에서 태어나 둥지 가문에 속한다. 비늘혈 용인은 원로회가 관직을 주는 후원 관계로 묶인다. 인간은 서기 노예('손')나 장부 밖 노예로 쓰인다 — 가입이 아니라 사용이다."
  leave: "둥지 추방(깃 서약 박탈). 서리 와이번이 그 결과다 — 지금도 '미회수 재산'으로 장부에 남는다."
  signs: ["정수리의 뼈 돌기 왕관과 섬기는 진룡 계통의 흐린 색", "녹청색 뿔 다섯(카이도르)", "목에 건 용황의 인장 사슬(서기장)", "각 둥지 문장 — 높은홰(탑 위 왕관 와이번)·청동발(교차한 청동 발톱)·긴그림자(펼친 날개의 긴 그림자)·재날개(잿빛 날개 한 쌍과 쇠사슬)·흰목(흰 목둘레의 옆모습)"]

