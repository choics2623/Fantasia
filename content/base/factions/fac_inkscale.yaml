  - {id: rank_contractee, title: "계약민 (상품)", duties: "노역으로 빚을 갚는다 — 평균 22년", privileges: "세렌 안의 '자유', 칼날 한 뼘 이하, 상거래용 숫자", open_to_player: true}
# 플레이어의 길: 계약민이 된 뒤 현장 심부름꾼. 첫 임무 '회색여울 레이번 성채에서 이번 분기 농노 7명의 인도 서류에 남작의 인장을 받아 와라' — 그 7명 중 하나가 아는 얼굴이다.

law:
  crimes:
    - {act: "계약 파기 도주 (계약민)", punishment: "현상금(나디아 4두카트), 왼팔 낙인, 빚 두 배", note: "인간 대상"}
    - {act: "장부를 찢음 / 빚을 없던 것으로 함", punishment: "살인보다 무겁다 — 인장 몰수와 추방", note: "나가 대상. 나가의 금기"}
    - {act: "계약서 없는 약속", punishment: "효력 없음 — 그리고 수치", note: "모두"}
    - {act: "공짜로 주는 것", punishment: "금기 — 나가는 대가 없이 줄 수 없다", note: "나가 대상(혈명의 굴레)"}
    - {act: "계약민이 칼날 한 뼘 넘는 무기를 지님", punishment: "빚 가산 + 탑 인계", note: "인간 대상 — 세렌 법"}
    - {act: "계약민이 숫자 이상의 글을 앎", punishment: "벌금 후 탑 인계", note: "인간 대상"}

customs:
  greeting: "나가끼리: 상대의 빚과 내 빚을 하나씩 말하고 고개를 숙인다('나는 몬달리에 이천을, 그대는?'). 계약민에게는 이름이 아니라 계약 번호로 부른다."
  taboos: ["공짜", "장부를 찢는 것", "계약서 없는 약속", "붉은 해구 이야기를 계약민 앞에서 하는 것"]
  rites:
    - {name: "인장 회의", when: "분기마다 + 포도월 세렌 대시장 전", what: "원형 계단에 인장을 내려놓고 표를 센다"}
    - {name: "빚 문서 경매", when: "포도월 세렌 대시장 (아마란트 리비아 주관)", what: "계약민 빚 문서를 2차 매매 — 사람은 그 자리에 없다. 숫자만 팔린다"}
  speech: "숫자로 말한다. 모든 문장에 값이 붙는다('그 말은 두 발톱짜리다'). 인간 계약민에게는 정중한 존댓말 — 고객이니까. 그 정중함이 이자율이다."

membership:
  join: "나가 상가의 추천 + 인장 매입(1,200두카트) 또는 현장 중개인 고용. 인간은 계약민 → 심부름꾼"
  leave: "인장을 팔면 나간다. 계약민은 빚을 다 갚으면 — 등록자의 약 1.8%"
  signs: ["먹물 묻은 비늘 인장", "계약민 왼팔 낙인", "푸른 장부관 등록 번호"]

