    chosen_by: "오랄 가 세습"
    perks: ["'숫자의 집'이라는 별칭"]
  - id: off_overseer
    title: 계약민 감독 (집합 자리)
    holder: "unnamed:계약민 감독 — 나가·크릭·라미아"
    reports_to: off_registry
    powers: ["노역 할당", "상환 기록"]
    chosen_by: "인장 중개인의 고용"
    perks: []
  - id: off_errand
    title: 현장 심부름꾼 (계약민 — 빚 상환 1.5배)
    holder: "unnamed:계약민 심부름꾼"
    reports_to: off_field_broker
    powers: ["서류 운반, 인장 받아 오기"]
    chosen_by: "계약민 중 고른다"
    perks: ["상환 속도 1.5배"]

ranks:
  - {id: rank_seal, title: "인장 중개인 (48)", duties: "인장 회의, 큰 거래", privileges: "의석", open_to_player: false}
  - {id: rank_field, title: "현장 중개인 (약 300)", duties: "조달·등록", privileges: "수수료", open_to_player: false}
