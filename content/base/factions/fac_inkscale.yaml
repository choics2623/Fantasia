    reports_to: off_seal_broker_greyford
    powers: ["농노 인도 서류", "남작의 인장 받기"]
    chosen_by: "인장 중개인의 고용"
    perks: []
  - id: off_appraiser
    title: 계약 감정사 ('반쪽 혀')
    holder: "unnamed:'반쪽 혀' 오스카 (인간 계약민, 51) — 계약서의 숫자를 읽는다"
    reports_to: off_guild_head
    powers: ["상환 공식 계산", "계약서 감정"]
    chosen_by: "조합장의 고용 — 숫자를 읽는 인간은 쓸모 있다"
    perks: ["상환 공식의 함정을 숫자로 증명할 수 있다 — 그래서 위험하다"]
  - id: off_registry
    title: 계약 등록소 '푸른 장부관' (오랄 가) — 계약민 전환 등록
    holder: "unnamed:시르 오랄 — 계약민 전환 등록 실무"
    reports_to: off_guild_head
