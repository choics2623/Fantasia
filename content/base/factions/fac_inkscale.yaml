# 세렌 계약 중개인 조합 ('먹물비늘 조합') — 빚진 인간을 '계약민'으로 조달·등록·거래한다. 숫자가 사슬이다.
# 근거: HOUSES §5.10·§3.4, WORLD_BIBLE §2(AS 296)·§5·§7.2, RACES 나가(탐욕과 교환), REGIONS §9, CHARACTERS R09, CONTINUITY_LOG #4·#5·#46·#47, facts/seren.yaml·greyford.yaml.
id: fac_inkscale
name: 세렌 계약 중개인 조합 ('먹물비늘 조합')
kind: org
race: [나가 (약 60%), 용인, 인간 (계약민 감정사·심부름꾼), 크릭, 라미아]
governance: 과두 의회 — 인장 48개가 의석이다. 인장은 사고판다
motto: "모든 빚에는 이름이 있다."
seat: 세렌 항구 '먹물 회관'
size:
  members: "약 350 — 인장 중개인 48, 현장 중개인 약 300, 계약민 감독(나가·크릭·인간)"
  territory: "세렌 동맹 전역, 용제국 영지의 빚 장부(현장 중개인 파견), 노예선 항로(소금 나루)"
  wealth: "계약서 양식 독점, 몬달리 상가의 자금, 용제국 영주들의 빚 장부, 빚 문서 2차 매매 수수료"
  force: "없다 — 세렌 의회 경호대(사하르)와 법정이 대신한다. 무기는 이자율이다"

decision: >
  인장 중개인 48이 먹물 회관 원형 계단에 앉는다(포도월 세렌 대시장 전, 그리고 분기마다). 안건은 인장 수로 정한다 — 인장 하나가 한 표, 한 중개인이 인장을 여러 개 가질 수 있다
  (조합장 도나 벨렌은 인장 9개). 과반 25. 의회(열두 의석)가 내린 계약민법 개정은 조합이 거부하지 못하지만, 계약서 '양식'은 조합이 정한다 — 법보다 양식이 사람을 묶는다.
  인장은 사고판다(최근 거래 인장 하나 1,200두카트). 몬달리 상가가 비밀리에 인장 14개를 쥐고 있다 — 조합의 실제 주인은 의장 베아트릭스다.
succession: "조합장은 인장 과반으로 뽑는다 — 사실상 몬달리가 정한다. 인장 중개인이 죽으면 인장은 상속되거나 경매에 붙는다. 인장이 경매에 붙는 날, 인간 계약민의 돈(셈 모임의 공동 적립)이 대리인을 통해 인장 하나를 사는 꿈을 꾼다."

