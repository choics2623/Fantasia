    reports_to: null
    powers: ["계약서 양식 확정", "인장 회의 주재", "'죽음으로 끝나지 않는 계약서' 양식 연구 지시"]
    chosen_by: "인장 과반 — 몬달리의 뜻"
    perks: ["먹물 회관 꼭대기 방"]
  - id: off_seal_broker_greyford
