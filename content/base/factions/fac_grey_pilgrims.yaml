  - "황무지 길잡이: 재먹이는 잔상 주기를 안다 — 멈춘 광장까지 가는 가장 안전한 길"
  - "확장 막기: 잿불석 매장(클락 #4) — 두 번째 등불 소멸의 원인. 재눈 초소보다 먼저 알아내기"
  - "위험: 정체가 드러나면 2,000명이 따뜻하게 그를 재의 중심으로 데려간다"
