toward_echo: "재의 중심으로 데려가 바친다. 그들에게 잔향은 신을 되살릴 열쇠다 — 친절하고, 따뜻하고, 결코 놓아주지 않는다. (작가 전용: 재의 중심 = 시간의 상처. 거기서의 죽음은 진짜 죽음이다. 순례자들은 그것을 '신이 다시 말하는 날'이라 믿고, 게임은 그 믿음이 틀렸다고 말하지 않는다.)"
player_paths:
