# 회색 순례자 (재 숭배 교단) — "재가 그의 새 몸이다." 주인이 없는 유일한 공동체처럼 보이는, 따뜻하고 결코 놓아주지 않는 신앙.
# 근거: HOUSES §5.12·§6.2, WORLD_BIBLE §1.6·§6.3·§10(클락 #4)·§1.3.1(시간의 상처), REGIONS §11, truths T09.
# 게임은 에오르의 생사를 확정하지 않는다 — 이 교단의 교리는 거짓으로도 참으로도 확인되지 않는다.
id: fac_grey_pilgrims
name: 회색 순례자 (재 숭배 교단)
kind: faith
race: [인간, 크릭, 추방 그롬, 몰락 용인, 늙은 하르칸 — 종족 차별이 없다]
governance: 신정 — 재의 목소리 한 사람이 교리를 말하고, 재먹이들이 '혀의 재'로 그것을 따른다
motto: "나는 재에서 왔다."
seat: 황무지 남쪽 가장자리 '재 성소' — 마지막 등불에서 반나절
size:
  members: "재의 목소리 1, 재먹이(사제) 약 40, 순례자 약 2,000"
  territory: "재 성소와 황무지 남쪽 가장자리. '재의 날' 5일 동안 황무지 안으로 걸어 들어간다"
  wealth: "황무지 안쪽 길에 대한 지식, 재오염 저항 의식(효과 미검증), 베르미온 광산에서 훔친 잿불석"
  force: "없다 — 그러나 2,000명이 한 사람의 말로 재 속을 걷는다"

decision: >
  재의 목소리가 정한다. 그는 매 안식일 성소 한가운데 재 더미 위에 앉아 혀에 재를 올리고, 재가 녹는 동안 '들은 것'을 말한다. 그것이 교리이고 명령이다.
  재먹이 40은 '재의 원'으로 모여 목소리의 말을 실제 일(누가 잿불석을 묻으러 가는가, 누구를 받아들이는가)로 나눈다 — 재의 원은 목소리의 말을 해석할 뿐 거스르지 못한다.
  목소리의 말이 둘로 들리면(재먹이들의 해석이 갈리면) 다음 재의 날 황무지 안에서 '잔상이 답하게' 한다 — 잔상 속 사람이 가리키는 쪽이 답이다.
succession: >
  재의 목소리가 죽거나 '재로 돌아가면'(황무지 안에서 돌아오지 않으면) 재먹이들은 재의 날까지 기다린다. 그해 재의 날 황무지에서 살아 돌아온 자 중
  잔상 속 '성인'(시간 잔상의 사람)이 그를 보고 손짓했다고 증언되는 자가 목소리다. 하엘은 30년 전 그렇게 목소리가 되었고, 그날 이후 늙지 않는다.

offices:
  - id: off_ash_voice
    title: 재의 목소리
    holder: "unnamed:하엘 (인간, 겉보기 40대) — 시간 잔상에 노출되어 30년째 늙지 않는다"
    reports_to: null
    powers: ["교리", "받아들임", "재의 날 행렬 인도"]
    chosen_by: "재의 날 잔상의 손짓"
    perks: ["성소 한가운데 재 더미"]
  - id: off_ash_eater_gret
    title: 재먹이 — 성소 수호 (재의 원)
    holder: "unnamed:두 손톱 그렛 (추방 그롬, 50)"
    reports_to: off_ash_voice
    powers: ["성소 경비", "잿불석 매장 원정 인도"]
    chosen_by: "재의 목소리의 지명"
    perks: []
  - id: off_ash_eater_silene
    title: 재먹이 — 잿불석 담당 (재의 원)
    holder: "unnamed:실레네 (몰락 용인, 130) — 전 베르미온 가문 하녀장"
    reports_to: off_ash_voice
    powers: ["베르미온 광산 잿불석 도둑질 경로", "매장 위치 기록(머릿속)"]
    chosen_by: "재의 목소리의 지명"
    perks: []
  - id: off_ash_circle
    title: 재먹이 (사제 — 집합 자리, 약 40)
    holder: "unnamed:재먹이 약 40"
    reports_to: off_ash_voice
    powers: ["혀의 재 의식", "순례자 돌봄"]
    chosen_by: "재의 날을 세 번 살아 돌아온 순례자"
    perks: []
  - id: off_pilgrim_kitchen
    title: 성소 화덕지기 (아이들을 먹이는 자)
    holder: "unnamed:화덕지기 — 탈주 노예 출신 노파"
    reports_to: off_ash_circle
    powers: ["탈주 아이들의 첫 배부른 밥"]
    chosen_by: "목소리의 받아들임"
    perks: []

  - id: off_ash_road_guide
    title: 재의 날 길잡이 (잔상 주기를 몸으로 아는 순례자)
    holder: "unnamed:길잡이 셋 — 재의 날을 다섯 번 넘게 살아 돌아온 순례자(인간 둘, 크릭 하나)"
    reports_to: off_ash_eater_gret
    powers: ["재의 날 행렬의 길", "멈춘 광장 가장자리까지의 길"]
    chosen_by: "살아 돌아온 횟수"
    perks: []
  - id: off_receiver
    title: 받아들임지기 (새로 온 자에게 재를 올리는 자)
    holder: "unnamed:받아들임지기 — 몰락 용인 하인 출신 노인"
    reports_to: off_ash_voice
    powers: ["새로 온 자의 혀에 재를 올린다", "탈주 아이 명부(머릿속) — 이름 없는 자들에게 몰래 넘긴다는 소문"]
    chosen_by: "재의 목소리의 지명"
    perks: []

ranks:
  - {id: rank_voice, title: "재의 목소리", duties: "듣고 말한다", privileges: "늙지 않는다(잔상)", open_to_player: false}
  - {id: rank_ash_eater, title: "재먹이 (사제)", duties: "재의 원, 의식", privileges: "황무지 안쪽 길", open_to_player: true}
  - {id: rank_pilgrim, title: "순례자", duties: "재의 날 행렬, 잿불석 매장", privileges: "주인이 없다 — 그리고 배부르다", open_to_player: true}

law:
  crimes:
    - {act: "종족을 묻거나 깔봄", punishment: "혀에 재를 한 줌 — 하루 말하지 못한다", note: "모두 — 교단 안에는 종족 서열이 없다"}
    - {act: "재의 날 행렬에서 돌아섬", punishment: "벌은 없다 — '아직 재가 아니다'라고만 한다. 세 번 돌아서면 받아들임을 거둔다", note: "순례자"}
    - {act: "잿불석 매장 위치를 바깥에 말함", punishment: "황무지 안으로 혼자 보낸다", note: "재먹이"}
    - {act: "이단 (순종의 빛의 법)", punishment: "화형", note: "바깥 법 — 인간 대상"}
    - {act: "잿불석 도둑질 (베르미온 가문의 법)", punishment: "광산 매달기", note: "바깥 법"}

customs:
  greeting: "혀를 조금 내밀어 혀끝의 재를 보인다 — 답도 같다. 말로는 '재에서.' — 답 '재로.'"
  taboos: ["재를 털어 내는 것", "시간 잔상 속 사람(성인)에게 등을 돌리는 것", "불을 '끄는' 것 — 불은 스스로 재가 되게 둔다"]
  rites:
    - {name: "혀의 재", when: "매일 아침", what: "혀에 재를 올리고 녹을 때까지 말하지 않는다"}
    - {name: "재의 날 행렬", when: "재의 날 5일", what: "황무지 안으로 걸어 들어간다. 해마다 수십 명이 돌아오지 않는다 — '재로 돌아갔다'"}
    - {name: "받아들임", when: "누구든 찾아오면", what: "재를 혀에 올리고 '나는 재에서 왔다'를 세 번 말한다. 탈주한 아이들은 그날 처음 배불리 먹는다"}
    - {name: "묻기", when: "재의 원이 정한 날", what: "잿불석을 황무지 안쪽 셋째 돌기둥 아래 묻는다 — '신의 몸을 먹인다'"}
  speech: "느리고 따뜻하다. 모두를 '재의 아이'라 부르고 반말과 존댓말을 섞지 않는다. 미래를 '재가 정한다'로 말한다. 잔향을 '길 잃은 말'이라고 부른다."

membership:
  join: "재를 혀에 올리고 '나는 재에서 왔다'를 세 번 말한다. 첫 임무: '이 잿불석을 황무지 안쪽 세 번째 돌기둥 아래 묻어라.'"
  leave: "막지 않는다. 그러나 떠난 자는 '아직 재가 아니다'라는 말을 듣고, 돌아오면 다시 받아들여진다. 아이들은 대개 떠나지 않는다 — 배부르니까"
  signs: ["혀끝의 재", "'재에서.' — '재로.'", "목에 건 작은 잿불석 조각", "잿빛으로 물들인 순례 천"]

internal_factions:
  - {name: "목소리의 원 (바치는 자들)", leader: null, aim: "하엘(unnamed)과 재먹이 다수 — 길 잃은 말(잔향)을 재의 중심으로 데려가 신을 다시 말하게 한다", strength: 60}
  - {name: "화덕의 사람들 (먹이는 자들)", leader: null, aim: "교리보다 밥 — 탈주한 아이와 늙은 자를 먹이는 것이 신앙의 전부라 믿는 순례자 다수", strength: 40}

assets: ["황무지 안쪽 길 — 시간 잔상 주기를 몸으로 안다", "베르미온 광산에서 훔친 잿불석", "순례자 2,000의 손과 발", "종족 차별 없는 공동체 — 탈주자의 피난처"]

