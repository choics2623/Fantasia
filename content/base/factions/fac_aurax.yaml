toward_echo: "화형 → 단절. 평범한 불로는 잔향자가 회귀할 뿐이라는 것을 아우락스는 안다 — 그래서 아버지가 살아 있는 동안 아버지의 불로 끊으려 한다. 드라반은 그것을 모른다. 잔향의 정체가 공개되면 지지 +5(대숙청의 명분). 찬가 단계마다 +1."
player_paths:
  - "손으로 들어가기 — 징후자를 넘겨 재송곳 기사단의 손이 된다 (가장 위험한 위장)"
  - "비밀의 이동 — 칼다란 족보·사르코스 212건·그라넥 문서·볼드 사본이 지지를 3~8점 움직인다"
  - "세베린의 밀약을 다섯 의자에 드러내면 '숨은 표'가 사라진다"
  - "드라반에게 아버지의 숨김을 알리면 진영의 불이 처음으로 질문한다"
