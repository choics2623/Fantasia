# 그라넥 백작가 — "제국의 곳간". 정본: HOUSES §2.4, §6.3 / REGIONS §1.6(곡물 40%) / 흐림니르 사절 거절 → hrosgard 북방 기근
# 기준: AS 312 낙엽월 1일. 'unnamed:...'는 TODO-NPC.
id: fac_granek
name: 그라넥 백작가
kind: house
race: [용인(순혈)]
governance: 봉건 위계 — 곳간이 법인 순혈 백작가
governance_note: >
  이 가문의 통치는 칼이 아니라 곳간 열쇠다. 배급량이 곧 법이고, 할당량이 곧 충성의 척도다. 마을 단위 연좌 책임으로 굶주림을 무기로 쓴다.
  백작 오도릭은 잿빛 겨울(AS 0~38)을 아이 시절 겪은 사람이다 — 배고픔이 무엇인지 안다. 그래서 무기로 쓴다.
motto: "굶주림이 충성을 가르친다."
seat: "그라넥 평원 — 바알카르 서쪽. 곳간 '일곱 탑'(증축 중). 세라크 붉은재가 상공을 난다"
size:
  members: "순혈 직계 4 + 용인 곳간 관리·감사관 수십 + 평원 농노 약 1만 2천"
  territory: "바알카르 서쪽 그라넥 평원 — 제국 곡물의 약 40%. 녹옥 혈통 베릴라(아우락스의 왕비 후보)의 영지와 붙어 있다"
  wealth: "곡물 — 일곱 탑에 3년치. 북부 흉작(AS 309~311)으로 곡물값 3배 인상. 레이번에 곡물 대출 채권(미상환 40비늘)"
  force: "자체 병력은 적다. 하스트란의 군량 공급과 곡물값이 곧 영향력 — 지지율 4 (아우락스). 세라크 붉은재의 총애를 받는 기수 루카스"

