ranks:
  - {id: rank_count, title: "백작", duties: "곳간 열쇠", privileges: "배급과 가격의 결정", open_to_player: false}
  - {id: rank_kin, title: "직계", duties: "곳간 관리·기수·가문 일", privileges: "곳간 출입", open_to_player: false}
  - {id: rank_inspector, title: "곳간 관리관·감사관 (용인)", duties: "입출고, 할당 감사", privileges: "연좌 판정권", open_to_player: false}
  - {id: rank_reeve, title: "마을 할당 책임자 (인간)", duties: "할당량을 채운다", privileges: "배급 소폭 가산", open_to_player: true, condition: "순종적인 농노 중 감사관이 지명"}
  - {id: rank_farm_serf, title: "평원 농노", duties: "개간·수확, 연좌 책임", privileges: "없다 — 미달 시 배급 1/3 삭감", open_to_player: true, condition: "기본 신분 (국유·사유 배당)"}

decision: "백작이 열쇠를 쥐고 백작부인이 계산한다. 할당과 배급은 매 달 초 장부 대조로 정해지고, 미달 마을은 즉시 공고된다. 큰 결정(수출·사절 거절·곳간 개방)은 아우락스의 사자가 오는 저녁에 백작이 한다 — 가문의 정치는 곳간이 아니라 사자의 방문 일정이다."
succession: "장자 상속. 백작이 죽으면 장남 루카스가 아니라 먼저 백작부인 헬가가 '곳간 열쇠 섭정'을 쥔다는 관례가 있다 (숫자가 정확한 쪽이 열쇠를 쥔다). 루카스의 기수 신분은 세라크와의 줄이므로 가문의 외교로 작용한다."

law:
  crimes:
    - {act: "마을 할당량 미달", punishment: "다음 달 배급 1/3 삭감 — 마을 단위 연좌 책임", note: "인간. 개인이 아니라 마을 전체가 벌을 받는다"}
    - {act: "곳간 곡물 절도", punishment: "손가락 절단 또는 매각 (제국법)", note: "인간. 곳간 접근 자체는 사형"}
    - {act: "일곱 탑 접근", punishment: "사형", note: "인간·용인 하급. 증축 인부는 감독 하에서만"}
    - {act: "배당 곡물을 몰래 마을에 흘린다", punishment: "가문 내 훈계 — 외부 발각 시 곡물 절도로 처리", note: "에다의 행위. 가문 규율상 공식 처벌 없음"}
    - {act: "탈주 (평원 농노)", punishment: "마을 연좌 — 같은 마을 배급 1/3 삭감 추가", note: "제국 탈주법에 가산"}
    - {act: "북방 구휼 요청을 받아들인다", punishment: "가문 내 금기 — 백작의 판단", note: "모르간트의 요청은 매번 거절한다"}
    - {act: "사절 거절 문서를 외부에 유출한다", punishment: "용인은 가문 이름 삭제, 인간은 처형", note: "아우락스의 지시가 적힌 문서 — 요툰의 남침 대상을 바꿀 증거"}

customs:
  greeting: "'올해 몇 탑이 찼습니까.' 곳간의 상태가 안부다. 식탁에서는 빵을 남기지 않는다 — 한 알이라도 땅에 버리지 않는 것이 가문의 예의. 인간은 곳간 문 앞에서 모자를 벗고 눈을 내리깐다."
  taboos:
    - "잿빛 겨울(AS 0~38)에 곳간을 잠가 평원 농노 60%가 아사한 일을 '잠갔다'고 말하는 것 — '지켰다'고 말한다"
    - "곳간의 실제 저장량을 공공연히 밝히는 것"
    - "흐림니르 사절 이야기"
    - "빵을 땅에 떨어뜨리는 것"
  rites:
    - {name: "곳간 봉인식", when: "수확월 말", what: "일곱 탑을 한 탑씩 봉인한다. 백작이 열쇠를 돌리고 부인이 숫자를 낭독한다"}
    - {name: "배급 낭독", when: "굶주림월 첫날", what: "마을별 삭감량을 공포한다. 이장들이 광장에 늘어선다"}
    - {name: "종자 분배", when: "파종월", what: "종자를 마을별로 배당. 작년 할당 미달 마을은 종자도 삭감"}
    - {name: "곳간 장부 대조", when: "매달 첫 안식일", what: "헬가가 장부를 소리 내어 읽고 감사관들이 숫자를 맞춘다"}
  speech: "숫자와 무게의 말('섬', '탑'). 인간을 '입'(먹을 것을 나눠야 하는 수)으로 센다. 짧고 단정적. 감정이 섞이면 어릴 적 겨울 이야기가 반 문장 나온다."

