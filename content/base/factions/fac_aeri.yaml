    perks: []

ranks:
  - {id: rank_queen, title: "바람의 여왕", duties: "가장 높은 고도에서 의회를 내려다봄", privileges: "높은둥지", open_to_player: false}
  - {id: rank_wind_house, title: "바람 가문 (날개폭·비행 고도로 서열)", duties: "가문 의회 참석, 둥지", privileges: "고도 투표권", open_to_player: false}
  - {id: rank_messenger, title: "전령·사냥꾼", duties: "정찰, 사냥, 땅 관찰", privileges: "비행 자유", open_to_player: false}
  - {id: rank_bat_wing, title: "박쥐날개 (녹테른 하수인 — 배신자 취급)", duties: "야간 전령, 7일마다 피 한 방울(실은 3대째부터 불필요)", privileges: "없음 — 다른 아에리가 배신자로 본다", open_to_player: false}
  - {id: rank_ground_hand, title: "땅손 (납치된 인간)", duties: "바람 정원 손질, 줄다리 수리, 새장 청소, 대장일·바느질·무거운 운반", privileges: "굶지 않는다 — 말린 생선·열매. 처벌은 없고 줄을 거두면 고립", open_to_player: true, condition: "납치되거나 줄내림 장터 바구니에 몰래 타(손재주·은신) 기둥 위로 오른다. 내려갈 길은 없다"}
  - {id: rank_freed_ground, title: "은인 (갇힌 아에리를 풀어 준 인간)", duties: "없음", privileges: "평생의 은인 — 아에리가 무관심을 접는다", open_to_player: true, condition: "레이번 성채에 그물에 걸린 아에리를 열흘 안에 풀어 준다"}

law:
  crimes:
    - {act: "아에리를 가두거나 묶음(새장·감옥·밧줄·그물)", punishment: "죽음 — 모든 아에리의 적이 된다", note: "인간·타 종족 대상. 집행 깃털 의회. 아에리는 지붕 있는 방에 사흘 갇히면 숨이 막히고 열흘이면 심장이 멎는다"}
    - {act: "아에리의 깃털을 뽑음 / 깃뼈를 시신에서 주움", punishment: "모든 아에리의 사냥감", note: "인간·타 종족 대상. 깃뼈는 하늘 장례에서 바람에 준 시신에서만 나온다 — 가장 큰 모독"}
    - {act: "인간 땅손이 허락 없이 기둥을 이동", punishment: "줄을 거둠(고립)", note: "인간 대상. 집행 줄지기. 아에리는 인간을 처벌하지 않고 무시한다"}
    - {act: "줄을 끊음", punishment: "그 줄에 매달린 자의 운명에 맡긴다", note: "양쪽 모두"}
    - {act: "땅에 오래 서 있음", punishment: "수치 — 서열 하락", note: "아에리 대상 (금기 ③)"}
    - {act: "바람을 거슬러 맹세함", punishment: "맹세 무효 — 바람이 말을 되돌린다", note: "아에리 대상 (금기 ④)"}
    - {act: "날지 못하는 아에리를 부양함", punishment: "치욕 — 날지 못하게 된 아에리는 스스로 뛰어내린다", note: "아에리 대상 (금기 ⑤). 미르 찢긴깃은 법의 예외"}
    - {act: "땅손(수집품 인간)을 땅으로 돌려보내려 함", punishment: "날개 잘림 — 판결은 깃털 의회, 여왕이 승인", note: "아에리 대상. 타일라가 이 판결을 받았다"}
    - {act: "지붕 있는 건물에서 회의·거주를 강요함", punishment: "가두기와 같다 — 사형", note: "인간 대상. 열린 집이 법의 전제다"}
    - {act: "녹테른의 하수인이 됨", punishment: "배신자로 배척 — 다른 아에리가 상대하지 않는다", note: "아에리 대상. 박쥐날개 아에리"}

customs:
  greeting: "휘파람 두 음 — 첫 음은 바람의 방향을, 둘째는 자기 최고 고도를 알린다. '어디까지 올랐소?'가 인사이고 땅에 서 있는 상대에게는 눈을 위로 둔다. 날개를 만지는 것은 가장 큰 무례다. 땅에서의 만남은 짧게 끝낸다."
  taboos:
    - "가두는 것 — 새장·감옥·밧줄·그물·닫힌 문"
    - "깃털을 뽑는 것, 날개를 만지는 것"
    - "땅에 오래 서 있는 것(수치), 바람을 거슬러 맹세하는 것"
    - "날지 못하는 아에리를 부양하는 것"
    - "새장을 닫아 두는 것, 바람을 향해 저주하는 것"
  rites:
    - {name: "바람 축제", when: "해빙월", what: "아에리 전원이 하늘을 난다. 기둥 위에 아무도 없는 하루 — 땅손에게는 유일한 '혼자인 날'. 대회기가 열린다"}
    - {name: "하늘 장례", when: "죽음", what: "죽은 아에리는 가장 높은 봉우리에서 바람에 놓아준다"}
    - {name: "첫 비행", when: "8세", what: "첫 비행. 20세에 성년 비행. 알은 첨탑 꼭대기 둥지에서 부화"}
    - {name: "줄내림", when: "장터 열리는 날", what: "바구니가 줄로 오르내린다. 겨울에는 독수리 계단이 폐쇄되어 교역이 끊긴다"}
    - {name: "바람 종", when: "급한 일", what: "바람 종이 울리면 날개 모임이 열린다"}
  speech: "휘파람과 노래에 가까운 하늘말, 공용어는 짧고 높은 음으로. 서열은 칭호가 아니라 '최고 비행 고도'로 말한다 — '구름위', '폭풍넘은'. 땅의 일에는 무관심해 '그건 아래 일이오'로 맺는다. 인간은 '땅손'이라 부르며 질문에 답하지 않는 것이 보통이다. 높은 곳일수록 말이 짧다."

membership:
  join: "아에리는 태어나 8세에 첫 비행을 한다. 인간은 납치되어 땅손이 되거나 줄내림 장터 바구니에 몰래 올라탄다. 박쥐날개는 녹테른에게 피 한 방울로 묶인다."
  leave: "날지 못하게 되면 스스로 뛰어내린다. 인간은 내려갈 길이 없다 — 땅손들이 '내려가는 줄'(340m 필요, 지금 210m)을 몰래 땋는다."
  signs: ["둥지 문장 — 은빛 날개 한 쌍(높은둥지), 번개 모양 깃털(폭풍깃), 눈이 그려진 깃털(매눈)", "깃털 색 — 백·회·적갈·흑", "땅손의 땋은 줄 매듭"]

internal_factions:
  - {name: "내려다보는 자들 (아래 보는 자들)", leader: npc_kyrie, aim: "땅의 일이 하늘에 닿는다. 맹약회의 313에 처음으로 대표를 보내고 카스파르 지원을 논의한다. 시간의 균열이 위로도 뻗는 것을 보았다", strength: 40}
  - {name: "올려다보는 자들 (높은 바람파)", leader: null, aim: "무관심 유지. 키리에의 하강을 추락이라 부르며 대표 자리를 빼앗으려 한다. 셀레스 긴목", strength: 40}
  - {name: "폭풍깃 (땅의 전쟁 개입 반대)", leader: null, aim: "바람은 싸운다 — 그러나 땅의 전쟁에는 끼지 않는다", strength: 10}
  - {name: "땅손을 돌려보내자 (젊은 아에리)", leader: npc_eiros, aim: "땅손을 땅으로 돌려보낸다. 타일라의 판결에 반대표를 던진 에이로스와 일부 젊은 아에리", strength: 10}

