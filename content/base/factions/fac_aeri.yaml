# 아에리 둥지 — 하늘 혈명('자유')의 굴레(갇히면 죽는다)가 만든 지붕 없는 의회.
# 근거: HOUSES §3.8, RACES §14, REGIONS §14, facts/windspire.yaml.
# 조정: HOUSES(3둥지 — 높은둥지·폭풍깃·매눈) · REGIONS(깃털 의회, 둥지 가문 7)의 수가 다르다 — 7가문 의회 안에 HOUSES 3둥지가 들어 있는 것으로 읽었다 (보고).
id: fac_aeri
name: 아에리 둥지 (바람첨탑 깃털 의회)
kind: polity
race: [백조 아에리, 매 아에리, 까마귀 아에리, 박쥐날개 아에리(배신자 취급), 인간 땅손(납치)]
governance: 고도 합의 (깃털 의회)  # 지붕 없는 회의장. 찬성은 오르고 반대는 내린다
motto: "하늘은 아래를 보지 않는다."
seat: 바람첨탑 정상 — 깃털 의회 (windspire__feather_council, 지붕 없는 원형 회의장)
size:
  members: "아에리 약 6,500(REGIONS)~36,000(RACES), 인간 땅손 약 140~200(납치된 자와 후손)"
  territory: "바람첨탑 — 바위 기둥 41개(300~900m), 줄다리, 줄내림 장터(기둥 아래 계곡)"
  wealth: "빈약 — 말린 생선·열매, 매 사육, 줄내림 장터의 두르강 교역. 화폐에 무관심"
  force: "하늘에서 화살과 돌, 정찰, 고도 4,000m 이상 비행. 직접 전쟁은 거의 없다. 아에리는 용보다 높이 날 수 있다"

decision: >
  의회는 지붕이 없다 — 아에리는 갇히면 죽으므로 가두는 구조는 회의장도 될 수 없다. 깃털 의회는 둥지 가문 7이 원형 회의장 위 하늘에서 모이는 '날개 모임'이다.
  안건은 휘파람과 노래로 말해지고, 표결은 고도다. 찬성하는 가문은 안건 위로 오르고, 반대하는 가문은 내려서며(땅에 오래 서 있는 것은 수치), 중립은 같은 높이에서 선다.
  여왕은 가장 높이 올라 의회 전체를 내려다본다 — 여왕의 높이가 결정의 마침표다. 높이 나는 자가 높은 자라 발언 순서는 날개폭과 최고 비행 고도로 정해진다.
  거부권은 '바람을 거슬러 떠남'이다. 한 가문이 의회에서 바람을 거슬러 날아 떠나면 그 안건은 '바람 없음'으로 보류된다. 이 의회는 만장일치가 아니라 '떠나는 가문이 없는 것'을 합의로 부른다.
  정기 회기는 해빙월 바람 축제 때의 대회기(아에리 전원이 하늘을 나는 날)와, 급할 때 바람 종이 울리면 열리는 임시 모임이다. 아에리는 서로를 붙들지 않으므로 합의 후 이행은 각 가문의 자유 — 이행하지 않은 가문은 다음 모임에서 높이를 잃는다.
  인간(땅손)은 의제가 아니다. 깃털 의회는 땅의 일에 무관심했고, 키리에가 처음으로 '아래 보는 자들'을 만들어 그 무관심을 깨고 있다.
succession: >
  바람의 여왕은 백조 아에리(왕족) 가문에서 나온다. 선출이 아니라 '가장 높이 올라 의회가 모두 아래에 있게 되는 자'다 — 여왕이 쇠하면 후계 후보가 바람 축제에서 높이를 겨룬다.
  키리에는 아들 에이로스를 후계로 키우지만, 올려다보는 자들(셀레스 긴목)이 키리에의 하강을 '추락'이라 부르며 맹약회의 313의 아에리 대표 자리를 빼앗으려 한다.
  날지 못하는 아에리는 부양하지 않는다 — 스스로 뛰어내린다. 그래서 여왕이 날개를 잃는 날이 곧 계승의 날이다.

offices:
  - id: off_queen
    title: 바람의 여왕
    holder: npc_kyrie
    reports_to: null
    powers: ["깃털 의회 주재 — 가장 높은 고도로 결정을 마침", "땅 관찰자 파견", "맹약회의 313 아에리 대표 지명"]
    chosen_by: "백조 아에리 왕족 중 가장 높이 오른 자"
    perks: ["높은둥지 — 바람첨탑 정상", "왼쪽 날개 끝 검은 깃털 셋(땅에 내려간 흔적)"]
  - id: off_prince
    title: 왕자 (후계 후보)
    holder: npc_eiros
    reports_to: off_queen
    powers: ["아래 보는 자들 지지", "타일라의 날개를 자른 판결에 반대표를 던진 유일한 귀족"]
    chosen_by: "혈통 — 높이는 바람 축제에서"
    perks: []
  - id: off_feather_council
    title: 깃털 의회 (둥지 가문 7 — 집합 자리)
    holder: npc_ws_aela
    reports_to: off_queen
    powers: ["고도 투표", "'바람을 거슬러 떠남'으로 거부", "아에리를 가두거나 묶은 자에 대한 사형 판결"]
    chosen_by: "가문 세습 — 날개폭과 비행 고도로 서열"
    perks: []
  - id: off_high_nest_house
    title: 높은둥지 가문 (여왕의 둥지)
    holder: npc_kyrie
    reports_to: off_feather_council
    powers: ["바람첨탑 정상", "맹약회의 313에 처음으로 대표를 보낸다"]
    chosen_by: "여왕 가문"
    perks: ["아래를 처음 내려다본 가문"]
  - id: off_stormfeather_head
    title: 폭풍깃 전쟁장 (바람첨탑 동쪽 절벽)
    holder: npc_ws_kair
    reports_to: off_feather_council
    powers: ["땅의 전쟁 개입 반대", "가끔 인간을 납치해 '땅의 기억'을 이야기하게 한다"]
    chosen_by: "가문 세습"
    perks: ["절벽 둥지의 납치된 인간 7명(내려가는 법을 모른다)"]
  - id: off_hawkeye_head
