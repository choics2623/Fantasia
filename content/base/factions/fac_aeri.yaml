toward_echo: "기다리기. 키리에는 AS 311부터 땅 관찰자를 보내 잔향 징후 마을을 지켜본다 — 이유는 밝히지 않았다. 역행하는 별을 까마귀 아에리에게서 들었다. 아에리에게 인간은 대체로 무관심의 대상이나, 갇힌 아에리를 풀어 준 인간은 평생의 은인이 된다."
player_paths:
  - "은인: 레이번 성채에 그물에 걸린 아에리를 열흘 안에 풀어 준다 — 아에리가 무관심을 접는다"
  - "침투: 줄내림 장터 바구니에 몰래 타 기둥 위로 오른다(손재주·은신). 시룬 매눈이 회색여울 상공에서 플레이어를 본다"
  - "연합: 에이로스와 타일라(날개 없는 활공) — 맹약회의 313에서 키리에의 표가 어느 쪽으로 가는지"
  - "탈출 지원: 땅손의 '내려가는 줄' 210m를 340m로 — 항아리 밑의 줄을 이어 준다"
  - "무너뜨리기: 셀레스 긴목의 대표 자리 탈취를 돕거나 막는다"
