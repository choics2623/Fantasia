    holder: npc_ws_rei
    reports_to: off_feather_council
    powers: ["정보 판매(세렌 오필 상가와 거래)", "서리 요람(이졸데의 흰 둥지) 위치·경비를 그린 지도 보유"]
    chosen_by: "가문 세습"
    perks: []
  - id: off_looking_up_head
    title: 올려다보는 자들 수장
    holder: npc_ws_celes
    reports_to: off_feather_council
    powers: ["하늘만 보는 높은 바람파의 대표", "맹약회의 313 아에리 대표 자리를 노린다"]
    chosen_by: "높은 바람파의 추대"
    perks: []
  - id: off_watcher_chief
