  - {id: rank_first_cup, title: "첫 잔의 가문 (SK 180 생존자와 직계)", duties: "혈목장 소유, 갈증의 밤 협의", privileges: "은혈 독점, 피의 전수권", open_to_player: false}
  - {id: rank_later_cup, title: "나중의 잔", duties: "혈목장 운영, 가문 충성", privileges: "혈목장 지분, 햇빛 없는 영지 거주", open_to_player: false}
  - {id: rank_thirst_bearer, title: "갈증받이 (반쯤 전수된 인간)", duties: "경비·사냥꾼·목장 감독, 7일마다 피", privileges: "주인에게 각인, 근력·민첩 +1, 밤눈 반쪽", open_to_player: true, condition: "피의 전수에서 살아남아야 한다 — 평범한 인간은 99% 죽는다. 잔향(플레이어)만이 대가 없이 견디나 발각되면 순종의 빛이 악마로 취급한다. 충성 성향 +50 고정 옵션은 주인공에게 적용하지 않는다"}
  - {id: rank_herder, title: "크릭 목동", duties: "혈목장 일상 관리, 채찍", privileges: "혈목장 출입", open_to_player: false}
  - {id: rank_pen_human, title: "혈목장 인간 (번호·혈통 계보)", duties: "운동, 가벼운 농사, 채혈(10일에 1회 / 문서마다 6주 1회)", privileges: "대륙에서 가장 잘 먹는 노예, 피 표가 많을수록 특식", open_to_player: true, condition: "공물로 끌려가거나 혈목장에 위장 입소. 올라가는 사다리가 아니라 갇힘이다. 이름을 얻으면 마시기 어려워진다"}

law:
  crimes:
    - {act: "혈목장 인간이 운동 거부 / 울타리를 넘음", punishment: "채혈 +1회 / 하얀 우리 이송", note: "인간 대상. 집행 크릭 목동·즈라그"}
    - {act: "녹테른에게 햇빛을 비춤(거울 등)", punishment: "갈증의 밤 명단 등재", note: "인간 대상 — 사실상 사형"}
    - {act: "탈출 / 글자 / 자해(피를 망침)", punishment: "갈증의 밤 명단 등재 / 구속", note: "인간 대상. 이름 없는 자들 연계는 사냥꾼 파견"}
    - {act: "혈목장 인간에게 이름을 줌", punishment: "녹테른은 가문 내 치욕과 장부 제외. 인간은 채혈 횟수 급증", note: "금기 ⑤ — 이름을 주면 마시기 어려워진다"}
    - {act: "인간을 죽을 때까지 마심", punishment: "품위 실추 — 혈목장 배당 삭감, 첫 잔 회합에서 발언 정지", note: "녹테른 대상. 갈증의 밤만 예외"}
    - {act: "낮에 맹세함 / 낮의 약속을 증거로 삼음", punishment: "맹세 무효 — 거짓으로 친다", note: "녹테른 대상. 모든 계약은 밤에 다시 확인된다"}
    - {act: "나가의 바다에 들어감", punishment: "피의 빚 — 나가가 계약 없이 죽일 권리를 주장, 가문은 구해 주지 않는다", note: "녹테른 대상"}
    - {act: "엘다르의 노래를 부름", punishment: "고향을 부른 자로 배척. 부르다 우는 자는 갈증 광기를 의심해 감시", note: "녹테른 대상 — 금기 ④"}
    - {act: "혈목장 장부 위조(인원·공물)", punishment: "혈목장 몰수, 위조자 사냥꾼에게 인계", note: "녹테른 대상. 세실과 오르페가 정확히 이 죄를 짓고 있다"}
    - {act: "갈증 광기(30일 이상 굶주림)에 든 자를 숨김", punishment: "숨긴 자도 같은 처분 — 굶주린 자는 모두가 사냥한다", note: "녹테른 대상. 90일이면 짐승이 된다"}

customs:
  greeting: "손바닥을 잔 모양으로 모아 가슴에 대고 '밤이 깊기를.' 답은 '목마르지 않기를.' 은잔 앞에서는 직접 무는 짓은 짐승의 짓이므로 먼저 잔을 내보인다. 인간은 낮에는 말을 걸지 않는다 — 낮의 대화는 없던 것으로 친다."
  taboos:
    - "햇빛 아래 이름을 부르거나 서약함. 은그릇과 흐르는 물을 건너는 맹세"
    - "나가의 이름, '도둑', '시체', 그들이 엘다르였음을 상기시키는 말"
    - "혈목장 인간에게 이름을 줌 — 번호와 혈통 계보('붉은 혈통 7대 12번')로만 부른다"
    - "엘다르의 노래, '배고프다'는 직접 표현(갈증은 '마르다'라 한다)"
    - "인간을 죽을 때까지 마시는 것 — 갈증의 밤은 예외, 결과로만 말한다"
  rites:
    - {name: "갈증의 밤", when: "긴밤월 15일", what: "공물 인간 300명(루멘 40명 + 용좌령 매입 등)이 도착하고 녹테른 전원이 첫 갈증 성에 모인다. 이날만은 직접 혈목장에 내려온다. 집전관이 공물 명단을 확정하고 잔을 돌린다. 인간은 우리 안에서 촛불을 끄고 숨을 죽인다"}
    - {name: "첫 잔의 맹세", when: "수시 — 반드시 밤", what: "피를 전수한 자 앞에 손목을 걷고 맹세한다. 낮에 한 맹세는 거짓으로 친다"}
    - {name: "피의 전수", when: "수시 (비공개)", what: "녹테른의 피와 신의 피를 섞어 마신다. 엘다르 약 50% 생존, 인간 약 99% 사망. 갈증받이는 반쯤 전수된 살아남은 극소수"}
    - {name: "우물 순례", when: "갈증의 밤 전날", what: "첫 갈증 성 지하 마른 우물 가장자리에서 한 방울의 신의 피를 '듣는다' — 말하는 것은 모르데카이뿐"}
    - {name: "장미 피 주기", when: "수시", what: "검은 장미 정원에 피를 주어 키운다. 세실은 장미 하나를 빼돌린 인간 열 명으로 센다"}
  speech: "엘다르어 고어에 그림자 은어. 이름 대신 갈증 칭호('열한째밤', '붉은잔')를 쓴다. 경어는 피의 사슬의 순서로 정한다 — 전수해 준 자에게는 '군주시여/언니시여'와 하오체, 같은 사슬 줄기끼리는 정중하되 한 문장마다 가시가 있다. 인간에게는 반말, 짧고 마른 말투. 맥박을 듣고 말하는 습관 — 상대의 거짓을 심장 박자로 지적한다."

membership:
  join: "피의 전수뿐. 엘다르가 마시면 약 50% 생존, 인간은 약 99% 사망(생존자는 갈증받이). 입문은 '잔의 맹세'를 밤에 하는 것으로 닫힌다."
  leave: "나갈 수 없다 — 갈증은 평생이다. 다만 첫 잔의 가문에서 '잘리는' 길(혈목장 몰수, 사슬의 단절)이 있고, 끊긴 자는 굶주린 자가 되어 사냥당한다. 갈증받이는 10~20년 안에 안에서부터 무너진다."
  signs: ["검은 바탕에 붉은 물방울 하나(왕가 문장)", "손목의 채혈 문신·목 양쪽의 채혈 흉터(혈목장 인간)", "은잔과 검은 장미 코르사주", "붉은 동심원 눈, 혀 밑의 가시"]

