# 녹테른 밤의 가문 — 엘다르 시간 혈명 위에 신의 피(첫 갈증)를 덮어쓴 일족. 통치는 '피의 전수 계보'.
# 근거: HOUSES §3.2, RACES §6, REGIONS §7 (장소 id: REGIONS §7.9).
id: fac_nocturne
name: 녹테른 밤의 가문 (첫 갈증의 잔)
kind: polity
race: [녹테른(첫 갈증의 원로, 밤의 귀족), 갈증받이(인간), 크릭(목동), 박쥐날개 아에리(전령)]
governance: 전수 위계 (잔 서약) # 새 형태 — 피를 건넨 자와 받은 자의 사슬이 곧 서열이자 법
motto: "처음 마신 자가 마지막에 잔다."
seat: 흑성 아르네스 — 첫 갈증 성 (밤의 궁정)
size:
  members: "녹테른 약 1,100~2,900 (문서마다 다름 — 보고), 갈증받이 약 110, 크릭 목동 약 2,500"
  territory: "녹테른 밤의 영지 서남부 — 혈목장(일곱 우리 / 31곳 문서마다 다름), 안개 늪 경계"
  wealth: "혈포도주(한 병 금화 2닢, 세렌 경유), 포도, 양모, 인간 공물, 피 교역(고요물 가문 '밤 부두')"
  force: "밤에만 싸운다. 갈증받이 사냥꾼, 침묵종 암살자, 크릭·타이란 용병, 안개 늪. 낮의 공성에 극도로 약하다"

decision: >
  결정은 '피의 사슬'을 따라 내려온다. 모든 녹테른은 자기에게 피를 전수한 자(피의 언니·오라버니)에게 맹세로 묶이고,
  그 사슬의 맨 위가 모르데카이다. 모르데카이는 3,200년 잠든 적이 없고 그만큼 결정이 일정하다 — 그는 묻지 않고 계산한다.
  정기 회합은 하나뿐이다: 긴밤월 15일 '갈증의 밤'. 이날 모든 녹테른이 첫 갈증 성에 모여 공물 명단(혈목장별 배당)을 확정하고
  집전관이 잔을 돌린다. 그 밖의 현안은 첫 잔의 가문들이 밤마다 서신과 사자로 움직이고 모르데카이가 '듣고 나서' 한 마디를 한다.
  거부권은 없다. 대신 '맹세는 반드시 밤에 한다' — 낮에 한 약속은 거짓으로 쳐서, 합의는 밤마다 다시 확인되어야 한다. 이 틈이 정적과 이단의 시간이다.
  모르데카이는 직접 움직이지 않고 사냥꾼을 보낸다. 가문 간 분쟁은 장부(혈통·공물·혈목장 인원)가 증거이고, 위조가 드러나면 혈목장이 몰수된다.
succession: >
  선출도 상속도 없다. 새 첫 잔의 가문은 '피의 전수'로만 생긴다 — 엘다르는 약 50%가 살아남고 인간은 약 99%가 죽는다.
  가주가 죽으면(굶주린 자가 되어 사냥당하거나 햇빛·불에 끝나면) 그에게 피를 받은 사슬이 한 칸씩 올라가 자리를 메우고,
  혈목장은 가문 안 가장 오래된 잔이 잇는다. 모르데카이 자리의 후임은 없다 — 그가 죽는 날 사슬의 꼭대기가 비고,
  모든 맹세가 누구에게 향해야 하는지 모르게 된다. 그날을 가장 두려워하는 자가 세실이고, 가장 바라는 자가 알라리크다.

