toward_echo: "포획 후 이식 — 3,000번 실패한 '견디는 그릇'. 죽이면 회귀할 뿐이라는 것은 모르지만, 죽이는 것은 낭비라고 본다. 잔향의 정체가 공개되면 지지 +3(그릇 확보 경쟁)."
player_paths:
  - "피험자로 잡히기 — 은비늘 요람. 멜리산드가 처음으로 '살아남는 그릇'을 얻는 길이자, 요람 안에서 봉기를 여는 길"
  - "담보 목록 — 공개하면 자금줄이 끊기지만 세렌이 국유 노예 3,000을 받으러 온다"
  - "레아를 카스파르에게 드러내기 (긴그림자 이르마스가 그 값을 정해 두었다)"
  - "이레네를 이탈시키기 — 탑이 잔향을 독점하려는 순간"
regression:
  fixed:
    - "지지율 32 — 회귀점의 값"
    - "레아와 숨이 첩자다"
    - "세렌 대출 2만, 담보 목록에 인장이 없다"
  flow:
    - "굶주림월 20일 상환 연장 협상"
    - "용주 역참 우편함 매월 25~26일"
  drift:
    - "숫자 편지의 숫자"
    - "다섯 의자에서 오렐리아가 먼저 부딪치는 안건"
