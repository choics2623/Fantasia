    - "탈의 진짜 이름을 입에 올리는 것"
    - "'해방'이나 '자유'라는 말을 경기 전날 밤 숙소에서 쓰는 것 — 100승이 그것을 주지 않는다는 것을 집안이 안다"
    - "그롬이 '형제'라 부르는 것을 기뻐하는 것"
  rites:
    - {name: "이름 부르기", when: "경기 전날 밤", what: "숙소의 모두가 내일 상대의 이름을 한 번씩 부른다. 부르지 못한 자는 그 경기에서 '미룸'의 후보가 된다"}
    - {name: "새김", when: "승리 직후", what: "팔 안쪽에 벤 사람의 이름을 새긴다(마라가 같은 숙소 동료 셋을 새겼다). 등의 상처는 덮지 않는다"}
    - {name: "99의 밤", when: "태양월 대축제 전날", what: "군나르의 99승을 기려 숙소에서 칼을 닦으며 이름을 부른다. 이름 없는 자들의 투사 결사 '아흔아홉'과 맞닿는다"}
    - {name: "이빨 세기", when: "칼 제자가 칼을 넘길 때", what: "탈의 이빨 목걸이의 송곳니 일곱을 한 번씩 만지게 한다"}
  speech: "그롬 전투어를 섞은 짧고 거친 말. '이름'과 '승수'가 호칭이다. 존대는 승수의 높이로 정한다. 감정은 새김과 칼로 표현하고 말하지 않는다. 경기 전날의 말은 모두 '이름'으로 끝난다 — '내일, ○○.'"

membership:
  join: "혈통(숙소에서 태어난 아이)과 칼 형제 서약 — 같은 숙소에서 이름을 부르며 벤 뒤 칼 제자가 팔 안쪽에 새김을 그어 준다. 외부인은 칼 제자의 눈에 들어 칼을 배운다."
  leave: "나갈 수 없다 — '칼로 이어진 아궁이'는 피와 같이 친다. 탈주한 군나르도 칼 제자로 남았다. 이름을 먹은 자만 가르침이 끊긴다."
