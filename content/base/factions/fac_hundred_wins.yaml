# 백승가 — 투사 혈통. 인간 숨은 혈통: '칼로 이어진 아궁이'. 피가 아니라 같은 숙소의 칼 형제로 잇는다.
# 운영 조직은 fac_arena_guild(투사 조합, 다른 작가) — 이 파일은 백승가라는 집안의 몸이다.
# 근거: HOUSES §4.4, §3.7, grommar·greyford 카드(npc_tal, npc_gunnar), facts/grommar.yaml.
id: fac_hundred_wins
name: 백승가 (백 개의 아궁이)
kind: house
secret: true
race: [인간(평범, 투사 혈통)]
governance: 칼 계보 — 이름 부르기 (사승 사슬)  # 서열은 승수, 가족은 같은 숙소에서 자란 칼 형제
motto: "벨 사람의 이름을 먼저 부른다."
seat: "그롬마르 피의 원형장 쇠우리 7번 숙소 (인간 투사 숙소) / 회색여울 마구간(군나르)"
size:
  members: "미아(22), 어린 탈(9), 군나르(74 — 칼 제자), 오그(47 — 칼 제자), 그리고 뼈의 전당 지하의 탈. 현역 투사 몇이 같은 아궁이를 쓴다"
  territory: "없음 — 숙소 하나와 마구간 다락"
  wealth: "탈의 잘린 목줄(재울음 무리가 보관), 탈의 이빨 목걸이(그롬 투사 7명의 송곳니 — 군나르가 지닌다), 군나르의 99승 검(마구간 다락 들보 위 기름천 속)"
  force: "투사 몇 명. 그러나 그롬마르에서만 인간이 합법적으로 무기를 든다는 사실이 집안의 유일한 힘이다"

decision: >
  백승가의 모임은 경기 전날 밤 숙소에서 열린다. 칼 제자들과 승수가 높은 순서로 말한다 — 먼저 말하는 이가 승수가 가장 높은 이이고, 마지막에 말하는 이가 가장 어리다.
  안건은 하나뿐이다: 내일 누구를 이기는가, 이긴다면 그 이름을 어떻게 부르는가. 집안 규약은 '칼 형제는 베지 않는다 — 베어야 하면 이름을 먼저 부른다'이다.
  거부권은 없고 '이름 부르기'가 합의다. 모인 사람 모두가 내일의 상대의 이름을 한 번씩 부르고, 한 사람이라도 부르지 못하면 그 경기는 '미룸'(탈주나 부상 핑계)의 후보가 된다.
  군나르가 99승에서 멈춘 이유가 이 합의다 — AS 274, 100번째 상대가 칼 형제 카렐이었다. 군나르는 그를 베는 대신 경기 전날 밤 탈주했고, 카렐은 '공모자'로 처형되었다. 그 일은 백승가의 수치이자 비밀이다.
  가문은 그롬마르 밖의 일(봉기, 탈주, 회색여울의 검술 스승)은 조합이 아닌 칼 제자가 정한다. 정하는 방식은 한 마디 — '내 칼 제자를 보낸다'.
succession: >
  '칼 제자'는 피로 정해지지 않고 칼을 가르친 사람이 정한다. 군나르(74)는 카렐의 칼 형제이고 혈통은 아니지만 백승가는 칼로 이어진 아궁이를 피와 같이 친다.
  미아(카렐의 손녀)와 어린 탈(9, 증조부의 이름을 받았다)이 혈통이고, 오그가 칼 제자다. 백승의 탈이 뼈의 전당 지하에서 죽으면 가문의 시조의 이름은 유품(잘린 목줄·이빨 목걸이)만 남는다.
  100승자가 나오면 그는 '혈명 없는 혈명'을 받아 원형장 밖으로 걸어 나가지만, 붉은 젖에 묶인다 — 승계가 아니라 사라짐이다.

