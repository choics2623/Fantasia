law:
  crimes:
    - {act: "칼 형제를 이름 없이 벰", punishment: "집안에서 '이름 먹은 자' — 칼 제자가 가르침을 거둔다", note: "집안 규약 — 가장 무거운 죄"}
    - {act: "100승 직전 탈주", punishment: "제국·그롬 법으로는 사냥. 그롬은 99승 이상의 탈주를 '마지막 경기의 미룸'으로 본다. 집안은 그를 '문 앞에서 선 자'라 부른다", note: "그롬마르 법 + 집안 규약"}
    - {act: "경기 거부", punishment: "소모품 강등(그롬 법). 집안은 거부한 자의 이름을 칼 형제가 한 번씩 부른다", note: "인간 투사 대상"}
    - {act: "승수 위조 (칼에 새기는 수)", punishment: "칼 제자가 그 칼을 부러뜨린다", note: "집안 규약"}
    - {act: "탈의 본명을 입에 올림 (빈 무덤 봉헌대 밑돌)", punishment: "집안 금기 — 탈이 입에 올리지 않기 때문", note: "집안 규약"}
    - {act: "비밀 이름(백승가)을 낯선 이에게 말함", punishment: "성을 참칭한 죄 — 제국법은 혀를 자르나 그롬마르는 무관심. 집안은 칼 제자를 거두지 않는다", note: "인간법과 집안 규약"}
    - {act: "투사가 그롬 관중 앞에서 비겁을 보임", punishment: "그롬 관중의 연호가 사라지고 소모품 강등", note: "그롬 법"}

customs:
  greeting: "목의 쇠목줄 자국을 서로 보이며 '몇 승?' — 답은 승수와 마지막으로 벤 사람의 이름이다. 칼 형제는 서로의 팔 안쪽 새김(벤 사람들의 이름)을 한 줄씩 읽는다."
  taboos:
