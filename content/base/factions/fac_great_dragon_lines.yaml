    powers: ["서리 이빨 빙봉과 얼음 정원", "흰 알 지지 — 이졸데의 결정을 따른다 (지지율 4)", "북방 국경에서 날아올 수 있는 대룡"]
    chosen_by: "혈통상 가장 오래된 용 — 서리비늘의 장(長)은 연령으로 정해진다"
    perks: ["얼음 속에 AS 0 이전에 얼어붙은 아스테리아 시민 일곱 — 그중 하나는 글이 새겨진 석판을 품고 있다"]
  - id: off_skadia_envoy
