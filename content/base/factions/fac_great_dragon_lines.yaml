    powers: ["혈통을 대표해 용좌에 앉은 짝 — 서리비늘이 용황에게 '바친' 딸", "스카디아의 날개를 부를 수 있는 유일한 목소리"]
    chosen_by: "서리비늘 가문이 용황에게 바침 (AS 307)"
    perks: []
  - id: off_ormegin
    title: 구리뿔 혈통의 가장 오래된 용 — 오르메긴
    holder: "unnamed:오르메긴 구리뿔 — 2,200세"   # TODO-NPC
    reports_to: off_no_assembly
    powers: ["구리 가마와 두르강 왕가와의 불가침 계약 (SK 1,900)", "이긴 쪽에 금속을 판다 — 중립"]
    chosen_by: "혈통상 가장 오래된 용"
    perks: ["금속, 특히 두르강이 만든 물건의 수집", "대장장이 노예 80 + 두르강 계약에 따른 인간 계약 광부"]
  - id: off_salastra
    title: 청동물결 혈통의 가장 오래된 용 — 살라스트라
    holder: "unnamed:살라스트라 청동물결 — 1,900세"   # TODO-NPC
    reports_to: off_no_assembly
    powers: ["진주 무덤과 남해 해군", "세렌 동맹과의 수호 계약", "멜리산드 지지 (지지율 3)"]
    chosen_by: "혈통상 가장 오래된 용"
    perks: ["침몰선과 그 화물의 수집", "진주 잠수 노예 600 — 세렌 계약민 형식"]
    note: "도둑맞은 알 사건이 공개되면 세렌과 반목한다 (HOUSES §6.3)"
  - id: off_gromak
    title: 검댕 혈통의 가장 오래된 용 — 그로마크
    holder: "unnamed:그로마크 검댕 — 2,900세"   # TODO-NPC
    reports_to: off_no_assembly
    powers: ["검은 유리 둥지 — 지금은 같은 하루를 반복해서 산다", "계승 입장 없음"]
    chosen_by: "혈통상 가장 오래된 용 — 그러나 그의 혈통은 사실상 그 혼자다"
    perks: ["아스테리아의 잔해 수집", "대붕괴 전날을 반복해서 사는 증언자 — '내일은 대붕괴의 날'이라고 설득하면 포위 계획을 이야기한다 (바르스카르가 의식 한가운데에 불을 뿜기로 미리 결정했다)"]
    note: "대붕괴 때 포위군에 있었고 시간의 상처를 입었다. 가끔 인간을 '아스테리아 시민'으로 착각해 살려 보낸다"
  - id: off_beryla
    title: 녹옥 혈통의 가장 오래된 용 — 베릴라
    holder: "unnamed:베릴라 녹옥발톱 — 1,600세 (용좌에 서약한 용제국 진룡)"   # TODO-NPC
    reports_to: off_no_assembly
    powers: ["이끼 왕좌와 정원 길 남쪽 숲", "아우락스 지지 (지지율 4) — 즉위 시 왕비 자리를 약속받았다"]
    chosen_by: "혈통상 가장 오래된 용"
    perks: ["살아 있는 것들 — 희귀한 식물, 동물, 노래하는 인간 40", "그라넥 평원과 영지가 붙어 있다"]
    note: "목소리가 쉰 노래꾼을 '내보낸다'고 하지만 실은 이끼 왕좌 뒤 은신처에서 살게 한다 — 그녀가 아우락스에게 숨기는 유일한 자비이자 약점"
  - id: off_ice_keeper
    title: 서리 이빨 얼음 정원지기 (노예 우두머리)
    holder: null
    reports_to: off_skadia
    powers: ["빙봉 아래 동굴에서 얼음을 깎는 인간 약 300의 반장"]
    chosen_by: "스카디아가 고른 '아름다운' 인간"
    perks: ["얼음 정원 접근"]
  - id: off_copper_overseer
    title: 구리 가마 대장간 감독
    holder: null
    reports_to: off_ormegin
    powers: ["대장장이 노예 80과 인간 계약 광부의 배정"]
    chosen_by: "오르메긴 지명"
    perks: ["두르강 작품 수집품 목록 열람"]
  - id: off_pearl_foreman
    title: 진주 무덤 잠수 반장
    holder: null
    reports_to: off_salastra
    powers: ["세렌 계약민 형식의 잠수 노예 600의 작업 배정"]
    chosen_by: "세렌 상관 추천, 살라스트라 승인"
