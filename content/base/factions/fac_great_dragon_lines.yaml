    holder: null
    reports_to: off_beryla
    powers: ["노래꾼 노예 40 — 목소리가 쉬면 '내보내는' 절차의 비밀 집행자"]
    chosen_by: "베릴라 직접 지명"
    perks: ["은신처의 위치"]

ranks:
  - {id: rank_lineage_head, title: "대룡 (가장 오래된 용)", duties: "보고를 모으고 지킨다", privileges: "혈통의 유일한 결정권", open_to_player: false}
  - {id: rank_collection_steward, title: "보고 관리인", duties: "수집물과 노예의 관리", privileges: "수집물 접근", open_to_player: false}
  - {id: rank_collection_slave, title: "수집된 인간 (얼음·금속·진주·노래)", duties: "용의 수집물로서 노동하거나 존재한다", privileges: "용의 보고에 속하므로 다른 용이 함부로 죽이지 못한다", open_to_player: true, condition: "노예로 팔려 들어가거나 징발된다. 노래꾼은 목소리, 얼음 정원은 외모, 구리 가마는 손재주가 선별 기준"}

decision: "각 대룡의 독단. 계승 위기에서의 입장은 한 번 정하면 거의 바뀌지 않는다 — 단 보고가 위협받으면 즉시 뒤집힌다. 다섯 대룡이 한자리에 모이는 일은 없다. 깨어나는 시점을 조작하는 것 외에 이들을 움직이는 수단은 계약의 문구와 수집물뿐이다."
succession: "혈통의 장(長)은 가장 오래된 용이 자연히 된다. 죽으면 가장 오래된 다음 용이 잇는다 — 스카디아에게는 이졸데(혈통 막내), 베릴라에게는 후계가 알려지지 않았다. 구리뿔·청동물결·검댕은 후계자가 불명확하다 (진룡 알은 수백 년에 하나)."

law:
  crimes:
    - {act: "남의 보고(수집물)를 만진다", punishment: "용족 법 — 용이면 결투, 인간·용인이면 즉결 처단", note: "다섯 혈통 모두 해당. 수집물인 인간도 보고의 일부다"}
    - {act: "영공에 세 번 선회하지 않고 든다", punishment: "선전포고로 간주", note: "대룡 사이에서는 더 엄격하다"}
    - {act: "수집물의 소유권을 부정한다 ('도둑', '잃었다')", punishment: "관계 −50, 심하면 결투", note: "역린"}
    - {act: "오르메긴–두르강 불가침 계약의 위반 (SK 1,900)", punishment: "계약 조문에 따른다 — 두르강은 맹세를 깨면 피가 돌로 굳는다", note: "오르메긴은 이 계약 때문에 두르강 영역에서 금속을 약탈하지 못한다"}
    - {act: "수호 계약(살라스트라–세렌)에 기대 세렌 계약민을 '노예'로 부른다", punishment: "세렌의 계약법상 위약 — 살라스트라의 보고가 위태로워진다", note: "진주 잠수 노예 600은 형식상 계약민"}
    - {act: "인간 노예의 탈주", punishment: "각 혈통의 방식 — 서리 이빨은 얼음에 가둔다, 구리 가마는 다리 한쪽을 거둔다, 진주 무덤은 바닥에 남긴다", note: "베릴라만 '목소리가 쉰 노예를 내보낸다'는 형식으로 은신처에 숨긴다"}
    - {act: "알을 깬다", punishment: "용서 없음", note: "스카디아는 흰 알이 파괴되면 복수를 위해 아우락스의 적이 된다"}
    - {act: "잠든 대룡의 보고에 닿는다", punishment: "깨어나는 순간 즉결 — 의지 판정 −20", note: "그로마크는 예외: 같은 하루의 아침에 맞을 뿐 죽이지는 않는 경우가 있다"}

customs:
  greeting: "정식 인사는 소유의 목록 — 상대가 가진 것을 대는 것이 예의. 날개 인사 세 번 선회. 인간은 낮게 엎드리고 눈을 내리깐다."
  taboos:
    - "수집물을 '재산'이 아닌 '물건'이라 부르는 것(그것은 몸의 일부다)"
    - "잠든 용 앞에서 '내일'을 말하는 것 — 그로마크 앞에서만은 예외다(내일이 대붕괴의 날이므로)"
    - "알, 역린"
    - "베릴라 앞에서 노래꾼의 소재를 묻는 것"
  rites:
    - {name: "수집물 점검", when: "해빙월 첫 안식일", what: "다섯 모두 자기 보고를 한 번 훑는다. 하나라도 비면 이웃을 의심한다"}
    - {name: "깃털 서약", when: "태양월", what: "용좌에 서약한 용(베릴라)이 용황의 비늘 의례에 불참하면 안 된다 — 312년엔 의례가 취소될 예정"}
    - {name: "침묵의 겨울잠", when: "서리월~굶주림월", what: "구리뿔·서리비늘은 보고 위에서 깊이 졸고, 깨는 시점이 정치가 된다"}
  speech: "느린 용언. 소유격과 목록. 문장 사이에 긴 침묵. 인간을 이름이 아니라 수집 번호나 특징으로 부른다 ('얼음 일곱째', '쉰 목소리')."

membership:
  join: "출생(혈통). 수집물은 팔리거나 징발되어 들어온다. 용인·크릭 관리인은 계약."
  leave: "수집물은 나갈 수 없다 — 베릴라의 '내보냄'은 은신처로 가는 길이다. 대룡은 혈통에서 나가지 않는다."
  signs: ["서리비늘 — 은백·서리 숨결", "구리뿔 — 구리빛 뿔", "청동물결 — 청동색", "검댕 — 검은 유리빛 비늘", "녹옥 — 이끼 낀 녹옥 발톱"]

internal_factions:
  - {name: "흰 알 편 (서리비늘)", leader: npc_isolde, aim: "손주의 즉위를 위해 북방에서 날아올 준비. 이졸데의 결정을 따른다", strength: 4}
  - {name: "멜리산드 편 (청동물결)", leader: null, aim: "세렌 자본과 같은 배. 단 도둑맞은 알 사건이 공개되면 세렌과 반목", strength: 3}
  - {name: "아우락스 편 (녹옥)", leader: null, aim: "즉위 시 왕비 자리. 노래꾼 은신처 폭로 시 아우락스가 의심한다", strength: 4}
  - {name: "중립·무관 (구리뿔, 검댕)", leader: null, aim: "오르메긴은 이긴 쪽에 금속을 판다. 그로마크는 아무것도 원하지 않는다 — 같은 하루를 반복한다", strength: 0}
  # strength = HOUSES §6.3 귀족 지지율. leader null = 카드 미작성(대룡은 NPC 카드가 아직 없다)

assets:
  - "얼음 속 아스테리아 시민 일곱 (서리 이빨) — 하나가 글이 새겨진 석판을 품었다"
  - "두르강 작품 수집품 (구리 가마)"
