    title: 대룡 회합 (존재한 적 없는 합의체)
    holder: null          # 형식상의 루트. 다섯 대룡이 한자리에 모인 적은 없다 — 모이는 날이 계승 판도가 뒤집히는 날이다
    reports_to: null
    powers: ["없음 — 각 대룡이 자기 보고의 유일한 주인이다. 이 자리는 '공석'이라는 사실을 보이기 위한 이름이다"]
    chosen_by: "—"
    perks: []
  - id: off_skadia
    title: 서리비늘 혈통의 가장 오래된 용 — 스카디아
    holder: "unnamed:스카디아 서리비늘 — 2,600세 (이졸데의 어미)"   # TODO-NPC
