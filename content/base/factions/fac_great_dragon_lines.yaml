# 혈족 밖의 대룡 혈통 다섯 — 정본: HOUSES §1.5, §1.6, §6.3 / RACES §2 / SUBRACES §3.1
# 다섯 혈통을 한 파일로 묶었다 (서리비늘·구리뿔·청동물결·검댕·녹옥). 서로 연합이 아니다 — 한 마리가 한 보고의 주인일 뿐이다.
# 베릴라 녹옥발톱은 용좌에 서약한 용제국 진룡(11마리 중 하나), 나머지 넷은 제국 밖(12마리 중). 이졸데는 서리비늘 혈통이지만 혈족 파일(fac_varskar_brood)에 소속.
id: fac_great_dragon_lines
name: 혈족 밖의 대룡 혈통 다섯
kind: house
race: [용족(진룡 — 고룡)]
governance: 보고 영주제 — 각 고룡이 자기 보고와 영지의 유일한 주인. 연합 없음, 계약만 있음
governance_note: >
  이들 사이에는 회의도 의장도 없다. 계승 위기의 입장은 전부 '자기 보고에 무엇이 들어오는가'로 정해진다.
  동맹은 계약(오르메긴–두르강 불가침, 살라스트라–세렌 수호 계약)이거나 혈연(스카디아–이졸데), 혹은 약속된 소유(베릴라–아우락스의 왕비 자리).
  잠든 동안은 보고가 곧 몸이므로 '깨어나는 시점'이 가장 큰 정치적 사건이다.
motto: "나는 내가 모은 것이다."
seat: "다섯 곳 — 서리 이빨(까마귀 문 서쪽 빙봉), 구리 가마(카즈둠 서쪽 기슭), 진주 무덤(남해 섬), 검은 유리 둥지(재의 황무지 남쪽 가장자리), 이끼 왕좌(정원 길 남쪽 숲)"
size:
  members: "고룡 5(스카디아 2,600세·오르메긴 2,200세·살라스트라 1,900세·그로마크 2,900세·베릴라 1,600세) + 수집된 인간 노예 약 1,100(300·80·600·0·40) + 소수의 용인·크릭 관리인"
  territory: "빙봉, 금속 기슭, 진주 섬, 황무지 가장자리, 숲 왕좌"
  wealth: "수집물 — 얼음 속에 보존된 아름다운 것들, 금속(특히 두르강의 작품), 침몰선과 화물, 아스테리아의 잔해, 살아 있는 것들(식물·짐승·노래하는 인간)"
  force: "진룡 5마리 — 그러나 용제국 밖 12마리 중 계승 위기에 실제로 날아올 수 있는 것은 소수. 스카디아는 흰 알의 즉위를 위해 날아올 준비가 되어 있다"

