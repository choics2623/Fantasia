toward_echo: "신고 — 그러나 예외가 많다. 잔향 신고 현상금 50비늘 + 일가족 해방은 목줄장이 꿈꿀 수 있는 유일한 '자유'다. 플레이어에게 가장 위험한 인간들. 마르타가 플레이어의 정체를 알게 되는 순간 어느 쪽을 고를지는 그동안 플레이어가 그녀에게 무엇을 해 주었는지에 달렸다 — 리즈의 이름이 2차 명단에 다시 오르는가."
player_paths:
