infiltration:
  join_real: "들어올 수 없다 — 증인은 그날을 본 자뿐이다. 다만 '지키는 자'와 '다음 입'은 결사가 고른다"
  join_fake: "가장 흔한 가짜는 '그날 거기 있었다'고 말하는 늙은 용인이다. 시험은 꿰맴 대조: 증인 하나가 자기 조각의 한 낱말을 빼고 말하고, 상대가 빠진 낱말을 채워야 한다. 그로마크의 반복되는 하루가 대조본이다 — 가짜는 그로마크가 매일 말하는 포위 계획과 어긋난다"
  proof_test: "잔향에게: 증인들은 처음에 그를 두려워한다 — 그는 그날 의식 한가운데 서 있던 자와 같은 것을 품고 있다. 시험은 하나 — 멈춘 광장의 원 중앙에서 그날의 한 장면을 기억해 오는 것(REGIONS §11.13). 그 장면이 아르벨의 조각과 맞으면 아르벨은 화상을 보인다"
  exposure: "아우락스는 증인들이 누구인지 반쯤 안다(그도 그날 거기 있었다). 드러나는 길: 맹약회의 전에 증언이 소문이 되면(21 §8) 아우락스와 드라반이 '그날 거기 있던 늙은 자들'을 하나씩 찾는다 — 바르스카르의 열한 노예와 같은 방식으로"

