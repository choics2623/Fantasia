# 재 아래 증인들 — 대붕괴의 날 불이 먼저 떨어지는 것을 본 용혈의 생존자들. 312년 동안 '불이 살아 있는 동안' 침묵하기로 서약했다.
# [신설 결사 — HOUSES에 없음] 세계가 함의하는 것: 아스테리아 포위군에 용족·용인·와이번이 있었다(WORLD_BIBLE §2 AS 0), 바르스카르는 진실을 들은 노예 11명을 처분했다
# (fact_dk_varskar_eleven_slaves), 볼드 가문 시조 엘리아스가 목격기를 남겼다(HOUSES §2.8), 그로마크는 대붕괴 전날을 반복해 산다(HOUSES §1.5),
# 왕관 와이번은 수명 약 600(원로 엘렌드 흰목 530 — AS 0에 218세), 순혈 용인은 400~900년.
# 왜 지금(AS 312): 서약의 문구는 "용황의 불이 살아 있는 동안"이다. 바르스카르가 죽어 간다. 불이 꺼지는 날 그들은 말해도 된다 — 그리고 아우락스는
# 그날 이전에 그들을 끝내려 한다. 맹약회의 313에서 대붕괴의 진실이 말해지면 계승 판세가 뒤집힌다(그로마크의 증언 = 아우락스 −5, HOUSES §6.3).
id: fac_ash_witnesses
name: 재 아래 증인들 (용혈의 비밀 서약)
kind: secret
race: [순혈 용인, 왕관 와이번, (살아 있는 증언) 진룡 그로마크]
governance: 서약 합의 — '그날을 꿰매는' 결사. 각자가 그날의 한 조각을 가졌고, 조각이 모두 모여야만 증언이 된다. 결정은 조각을 가진 자 전원
motto: "불은 먼저 왔다."
seat: 없음. 잿불 언덕 동쪽 '말라붙은 봉화대'(아르벨의 은거지)와 바알카르 홰의 회랑 아래층
size:
  members: "살아 있는 증인 여섯(순혈 용인 셋, 왕관 와이번 둘, 진룡 하나 — 그로마크는 자기가 증인인 줄 모른다), 증언을 이어받을 '다음 입' 후보 둘"
  territory: "바알카르, 잿불 언덕, 재의 황무지 남쪽 가장자리(검은 유리 둥지)"
  wealth: "기억 — 그리고 각자의 비늘에 남은 그날의 화상. 원로회 흰목 둥지의 의전 기록(정식 역사의 원고를 쓰는 둥지)"
  force: "없다. 흰목 둥지의 원로석 하나, 그리고 증언 그 자체 — 맹약회의에서 말해지면 칼보다 무겁다"

reason_now: >
  바르스카르가 죽어 간다. 서약이 풀리는 날이 온다. 그러나 아우락스도 그날 아버지 곁에 있었다 — 그는 증인들이 누구인지 반쯤 안다.
  아우락스에게 대붕괴의 진실은 '잔향 대숙청'의 명분('인간이 세계를 찢었다')을 무너뜨리는 독이다. 증인들은 불이 꺼지기 전에 자기 조각을 누구에게 넘길지 정해야 한다.

decision: >
  여섯은 한자리에 모인 적이 없다. 조각은 '꿰맴'으로만 합쳐진다 — 한 증인이 다른 증인 하나에게 자기 조각을 말로 넘기면, 받은 자는 두 조각을 가진다. 312년 동안 꿰맴은 네 번뿐이었다.
  결정(누구에게 말할 것인가, 언제 말할 것인가)은 조각을 가진 자 전원의 '화상 보임'으로 난다 — 각자 자기 비늘의 그날 화상을 상대에게 보이면 동의, 덮으면 거부. 하나라도 덮으면 결정은 없다.
  그로마크는 결정에 들지 못한다(그는 대붕괴 전날을 산다). 대신 증인들은 그를 '살아 있는 원본'으로 지킨다 — 조각이 어긋날 때 그의 반복되는 하루가 대조본이다.
succession: "증인은 늘지 않는다 — 그날을 본 자만 증인이다. 대신 '다음 입'을 고른다: 증언을 넘겨받아 맹약회의에서 말할 자. 후보는 둘 — 세라크 붉은재(아우락스의 딸, 할아버지에게 진실을 묻는 유일한 손녀), 그리고 노라(용황에게 직접 들은 열두 번째 노예 — 인간은 맹약회의에서 말할 수 없다)."

