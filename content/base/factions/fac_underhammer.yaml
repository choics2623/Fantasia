law:
  crimes:
    - {act: "대장장이 노예가 무기를 만듦(농기구 외)", punishment: "용제국: 금지 — 중벌. 성채는 발각 시 처형", note: "인간 대상. 브란은 낫마다 쇠를 반 돈씩 깎아 창날을 벼린다"}
    - {act: "칼에 이름을 새김", punishment: "용제국: 글자는 사형. 집안은 '이름은 스스로 짓는다'는 아스테리아의 첫 법을 따른다", note: "인간법 + 집안 규약"}
    - {act: "별강철 박자를 글자로 적음", punishment: "집안에서 박자를 가르치지 않는다", note: "집안 규약 — 박자는 입과 손으로만"}
    - {act: "별강철의 마지막 단계(대지의 진명)를 평범한 인간이 말함", punishment: "그 자리에서 죽는다 — 뼈바늘 노파는 빌린 피로 하면 수명 10년이 든다고 했다", note: "집안 규약 — 금기이자 자연의 법"}
    - {act: "인장을 낯선 이에게 보임", punishment: "집안의 인장은 소재를 알려 주지 않는다. 보인 자는 가르침이 끊긴다", note: "집안 규약"}
    - {act: "칼을 팔아 돈을 챙김(별 칼)", punishment: "집안 규약: 별 칼은 이름 없는 자들 또는 갇힌 이에게만 준다. 어기면 박자를 모른다", note: "집안 규약"}
    - {act: "비밀 이름(망치아래)을 낯선 이에게 말함", punishment: "성을 참칭한 죄 — 혀를 자를 수 있다", note: "인간법 + 집안 규약"}

