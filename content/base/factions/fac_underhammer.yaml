# 망치아래 — 아스테리아 대장장이 계보. 인간 숨은 혈통: '별강철' 담금질 비법을 노래 박자로 잇는다.
# 근거: HOUSES §4.9, greyford 카드(npc_bran), drakmar 카드(npc_greta), facts/greyford.yaml.
id: fac_underhammer
name: 망치아래 (아스테리아 대장장이 계보)
kind: house
secret: true
race: [인간(평범)]
governance: 모루 합의 — 박자 계보  # 안건을 망치질 박자로 말하고 같은 박자로 모루를 두드리면 찬성이다
motto: "이름을 칼에 새긴다."
seat: "회색여울 레이번 성채 대장간 / 잿불 언덕 대장간(피터) / 바알카르 대장간 노예 구역(욘의 옛 자리)"
size:
  members: "브란(45), 피터(19), 그레타(브란의 아내 — 세탁장에 '빌려져' 있다). 계보를 아는 이는 이들뿐"
  territory: "없음 — 성채와 광산의 대장간 하나씩"
  wealth: "아스테리아 대장간 인장(쇠 도장, 별과 망치 무늬), 미완성 별강철 칼날 한 자루(마지막 단계 — 진명을 새기는 것 — 를 아무도 모른다), 박자 노래(망치질 횟수와 담금질 시간)"
  force: "없음. 대장간 슬래그 더미 아래 숨긴 창날 23개와 단검 4자루(브란)"

decision: >
  망치아래는 대장간에서 결정한다. 대장간은 늘 소리가 나는 곳이어서 의심받지 않는다. 안건은 망치질 박자로 말해진다 — 박자의 수와 쉬는 자리가 문장이다.
  듣는 사람이 같은 박자로 모루를 두드리면 찬성이고, 박자를 비껴 두드리면 반대다. 박자를 한 번 끊으면 보류다. 이 방식으로 브란과 피터, 그리고 가끔 이름 없는 자들의 연락책이 합의를 낸다.
  결정은 대개 셋이다 — 누구에게 칼을 줄 것인가(이름 없는 자들, 디트마르 무리, 군나르), 몇 자루를 낫으로 위장할 것인가(낫마다 쇠를 반 돈씩), 마지막 단계를 누구에게 맡길 것인가.
  거부권은 '모루를 식힘'이다 — 불을 꺼서 하루 동안 아무것도 두드리지 않는다. 한 사람이라도 식히면 그날 작업은 없다.
  군나르와 브란은 봉기의 날을 재의 날 둘째 날(불 금지일, 감시가 가장 적은 날)로 정했다 — 대장간의 결정이 마구간으로 이어진 드문 예다.
succession: >
  박자는 아버지가 아들에게 가르친다. 브란은 AS 279 열두 살에 아버지 욘에게서 별강철의 박자를 배웠고 마지막 단계는 아버지도 몰랐다.
  욘은 AS 301 잿모루 씨족에 '임대'되었다가 사망했고, 브란의 후계는 제자 겸 조카 피터(19)다. 아내 그레타는 AS 305 '빌려져' 갔고 브란은 아이를 낳지 못했다.
  혈통은 잔향을 잇지 않으므로 망치아래도 평범한 인간이다. 별강철의 마지막 단계는 대지의 진명 한 마디를 쇠에 말해 넣어야 한다 — 브란이 하면 죽는다.

