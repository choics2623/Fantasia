# 소금 혀 — 신의 피를 지키는 심해 나가의 '물 위의 혀'. 바다를 맛보아 도둑의 피 냄새를 찾고, 지금은 '이름을 말할 수 있는 인간'을 찾는다.
# [신설 결사 — HOUSES에 없음] 세계가 함의하는 것: 나가는 신의 피를 받아 바다에 숨겼다(WORLD_BIBLE §1.4), 심해 나가는 해구의 피를 지키고 SK ~180 녹테른의 도둑질 이후
# 위로 올라오지 않는다(fact_sr_deep_naga_god_blood, SUBRACES §6), 모라나 일곱허물만이 올라가 본 적 있다(SUBRACES), 시렌나 상가의 깊은 바다 사원 지하에
# 도둑맞은 알이 있다(HOUSES §3.4), 심해 나가는 베아트릭스에게 '이름을 말할 수 있는 인간 하나'를 요구했다(fact_sr_beatrix_deep_naga_bargain),
# 진주 잠수 노예는 해구의 노래를 듣는다(SUBRACES), 네르실 소금턱이 해구 위에서 잠들어 있다(SUBRACES §3.1), 신의 피는 아직 말한다(fact_nc_gods_last_word).
# 왜 지금(AS 312): 해구의 피가 AS 311부터 더 크게 '말한다' — 잠수 노예의 코피가 늘었다. 베아트릭스의 거래로 깊은 쪽이 처음으로 위의 일에 손을 댔고(세베로가 사라를 고른 이유),
# 모르데카이는 잔향을 '듣는다'. 녹테른이 잔향을 먼저 잡아 그 피를 마시면 3,200년 전의 도둑질이 완성된다.
# 심해 나가가 '말하는 인간'을 어디에 쓸지는 그들만 안다(fact_sr_deep_naga_wants_speaker) — 이 파일도 확정하지 않는다. 결사 안의 두 해석만 적는다.
id: fac_salt_tongue
name: 소금 혀 (심해의 물 위 결사)
kind: secret
race: [심해 나가(머리), 라미아(혀), 왕관 나가 일부, 물결 엘다르(기억)]
governance: 맛의 위계 — 깊이가 곧 서열. 해구의 뜻은 '노래'로 올라오고, 위로 갈수록 그 노래를 덜 정확히 듣는다
motto: "물은 짜다. 피는 더 짜다."
seat: 세렌 만 바닥 '고인 피의 문'(심해의 사절이 서는 곳) — 위로는 시렌나 상가 깊은 바다 사원 지하, 남해 바깥 섬 '허물 바위'
size:
  members: "심해 나가 원로(해구 — 결사의 머리) 약 30, 오르내리는 자 2, 물 위의 혀(라미아·왕관 나가) 약 70, 물결 엘다르 기억지기 약 12"
  territory: "세렌 앞바다 '끓는 해구'(신의 피가 고인 곳), 세렌 만, 남해 섬들, 진주 무덤(살라스트라의 잠수장) 아래"
  wealth: "해구 — 그 자체가 재산이자 빚. 깊은 바다 사원의 봉헌, 도둑맞은 알(보관료로 받은 용의 알)"
  force: "심해 나가 — 깊이 내려온 잠수부는 돌아오지 않는다. 물 위에서는 라미아 밀정망(대륙 밀정망의 일부)"

reason_now: >
  잠수 노예들의 코피가 늘었다 — 해구의 노래가 커졌다. 네르실 소금턱이 잠결에 몸을 뒤척여 해구가 끓기 시작했다. 베아트릭스가 피 한 모금을 청한 대가로
  깊은 쪽은 처음으로 위에 '값'을 매겼다: 이름을 말할 수 있는 인간 하나. 그리고 모르데카이가 잔향의 피 냄새를 '듣는다' — 결사는 녹테른보다 먼저 그 인간을 찾아야 한다.

decision: >
  해구가 정한다 — 심해 원로 서른이 '노래'로. 노래는 오르내리는 자(모라나, 심해의 사절)를 통해 고인 피의 문까지 올라오고, 사절은 그것을 물 위의 혀에게 낱말로 옮긴다.
  물 위의 혀는 노래의 뜻을 다툴 수 없다 — 다만 '짜다/싱겁다'를 답할 수 있다: 노래를 실행할 수 없으면 혀를 내밀어 소금을 뱉는다(거부). 서른 중 열이 같은 혀의 거부를 들으면 노래를 다시 부른다.
  나가의 혈명(대가 없이는 아무것도 주지 못한다)에 따라 모든 지시에는 값이 붙는다 — 혀는 일을 하면 '피 한 방울의 기억'(해구에서 한 번 맛본 소금)을 받는다.
succession: "심해 원로는 죽으면 해구로 내려가 신의 피와 섞인다(나가의 믿음). 빈자리는 가장 깊이 내려가 본 자가 잇는다. 물 위의 혀는 사절이 고른다 — 라미아가 많다(위에서는 하인이라 아무도 보지 않는다)."

