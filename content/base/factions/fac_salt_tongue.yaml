infiltration:
  join_real: "물 위의 혀는 사절이 고른다. 시험은 '소금 세기' — 바닷물 한 모금을 머금고 그 안의 피 냄새가 어느 쪽에서 왔는지(녹테른인가, 해구인가, 사람인가) 맞히기. 나가의 혀만 할 수 있다"
  join_fake: "가짜 혀는 대개 다른 상가(몬달리)의 밀정이다. 거르는 장치: 혀가 받는 '피 한 방울의 기억'은 해구에서만 맛볼 수 있다 — 기억이 없는 혀는 노래를 들으면 소금을 뱉지 못한다"
  proof_test: >
    잔향에게(결사가 찾는 바로 그 인간): '물의 이름'. 사원 지하의 웅덩이 앞에서 물의 진명 한 낱말을 말하게 한다. 평범한 인간은 코피를 쏟고 수명을 잃는다(사라가 그 시험대에 오를 예정이다).
    말하고 타지 않으면 — 결사는 그를 해구로 데려가려 한다. 무엇을 위해서인지는 해구만 안다.
  exposure: "녹테른 피 냄새가 해구 위에 닿으면 심해 나가가 반드시 올라온다 — 그날 결사의 사슬 전체가 물 위에 드러난다(고요물 가문 배가 사라진 밤처럼)"

