# 타르비엔 자작가 — "정원의 문지기". 정본: HOUSES §2.5, §6.3 / REGIONS §1(정원 길) / WORLD_BIBLE §5(실바렌 정원지기)
# 기준: AS 312 낙엽월 1일. 'unnamed:...'는 TODO-NPC. 노엘(세관원 '놀')은 반엘다르 — 카드 npc_dane('은눈' 데인)과는 다른 인물이다.
id: fac_tarbien
name: 타르비엔 자작가
kind: house
race: [용인(순혈), 반엘다르(숨겨진 이복동생)]
governance: 봉건 위계 — 관문과 통역으로 서 있는 순혈 자작가
governance_note: >
  영지는 작다. 가문은 정원 길의 '문'(타르비엔 문) 하나이고, 문은 양쪽을 본다 — 통역과 통행 세관, 그리고 인간 아이를 '선별'해 엘다르에게 넘기는 중개.
  가문은 엘다르 순혈파(고목 가지)와 우호하나 존속파(새벽가지)의 요구에도 응한다. 공식은 아우락스, 실제는 저울질 — 흔들리는 중이다.
motto: "문은 양쪽을 본다."
seat: "타르비엔 문 — 정원 길 관문과 통행 세관 (바알카르 서쪽 정원 길 입구, 엘다르 숲으로 이어진다)"
size:
  members: "순혈 직계 3(+숨겨진 1) + 세관원·통역관 수십 + 선별 대상 인간 아이(연간 수십)"
  territory: "정원 길 관문 '타르비엔 문'과 통행 세관. 실바렌 출입 허가증(엘다르 측 발급)의 용제국 측 연서권"
  wealth: "통행세, 정원지기 경매 수수료(낙찰가 금화 50~200닢의 20%). 엘다르의 후원금 전달 창구 역할(AS 87 성 마렌 때부터)"
  force: "거의 없다 — 세관 경비 수십. 지지율 2 (아우락스, 흔들림). 가문의 힘은 '엘다르와 말이 통한다'는 사실"

offices:
  - id: off_viscountess
    title: 여자작
    holder: "unnamed:리산드라 타르비엔 — 여자작, 150세"   # TODO-NPC
    reports_to: null
    powers: ["가문의 법과 서약 — 엘다르어로 꿈을 꾼다", "실바렌 출입 허가증 용제국 측 연서", "엘다르 순혈파·존속파와의 접선"]
    chosen_by: "장자 상속 (시조 타르비엔 반목소리, SK 1,050 — 엘다르어를 익힌 첫 용인 통역관)"
    perks: ["연청색 바탕 은빛 아치형 문, 문 위에 잎 하나와 비늘 하나의 문장"]
  - id: off_selector
    title: 선별관 (정원지기 경매 중개)
    holder: "unnamed:바실 타르비엔 — 77세, 여자작의 아들"   # TODO-NPC
    reports_to: off_viscountess
    powers: ["영지에서 외모·재능이 뛰어난 인간 아이를 '선별' — 기준은 엘다르가 제시", "경매 중개와 20% 수수료"]
    chosen_by: "여자작 지명"
    perks: ["자기가 고른 아이 수를 센다 — 412명"]
  - id: off_customs_hidden
    title: 세관원 '놀' (숨겨진 이복동생)
    holder: "unnamed:노엘 — 가명 '세관원 놀', 32세(외모 25). 반엘다르"   # TODO-NPC. 카드 npc_dane('은눈' 데인)과 다른 인물
    reports_to: off_gate_warden
    powers: ["일반 세관 업무 — 통행세 징수와 통행증 확인"]
    chosen_by: "공식 기록상 '병사(病死)한 서자'. 이름을 바꿔 세관에서 일한다"
    perks: ["엘다르의 눈과 짧은 수명을 함께 가졌다 — 정원 길로 들어가는 가장 좋은 문"]
    note: "SK 3,280경 타르비엔 가주와 엘다르 여인 사이에서 태어난 반엘다르. 존재가 밝혀지면 엘다르와 용인 양쪽에서 가문이 끝장난다"
  - id: off_gate_warden
    title: 타르비엔 문 문지기장
    holder: "unnamed:문지기장 — 용인 비늘혈"
    reports_to: off_viscountess
    powers: ["정원 길 통행 허가증 검사", "엘다르 허가 없는 자가 숲에서 길을 잃도록 돌려보낸다"]
    chosen_by: "여자작 임명"
    perks: []
  - id: off_customs_clerks
    title: 통행 세관원
    holder: "unnamed:세관 서기 — 용인·크릭"
    reports_to: off_gate_warden
    powers: ["통행세 징수", "엘다르 약초 '선물'(수입) 검수"]
    chosen_by: "문지기장 임명"
    perks: []
  - id: off_translator
    title: 엘다르어 통역관
    holder: "unnamed:통역관 — 용인"
    reports_to: off_viscountess
    powers: ["엘다르 사절관(바알카르 정원 길 사절관 40)과 용제국 사이 통역", "문서 번역"]
    chosen_by: "가문의 업 — 엘다르어를 아는 용인은 가문 밖에 드물다"
    perks: []
  - id: off_aerin_liaison
    title: 새벽가지 '특별 선별' 연락
    holder: null          # AS 312 아에린 새벽가지가 요청 — 잔향 징후가 있는 아이. 담당자는 아직 정해지지 않았다
    reports_to: off_selector
    powers: ["엘다르 존속파의 '특별 선별' 명단 — 영혼 정원 클락에 직접 개입"]
    chosen_by: "—"
    perks: []

ranks:
  - {id: rank_viscountess, title: "자작", duties: "문과 통역, 선별 총괄", privileges: "엘다르 접선, 출입 허가 연서", open_to_player: false}
  - {id: rank_kin, title: "직계 (선별관·숨겨진 이복동생)", duties: "선별·세관", privileges: "엘다르의 후원 창구", open_to_player: false}
  - {id: rank_gate, title: "문지기·세관원", duties: "통행 검사와 징수", privileges: "엘다르 약초 선물 일부", open_to_player: false}
  - {id: rank_translator, title: "통역관", duties: "양쪽의 말을 옮긴다", privileges: "엘다르 사절관과 말한다", open_to_player: false}
  - {id: rank_selected_child, title: "선별 대상 인간 아이", duties: "엘다르 정원지기로 팔려 간다", privileges: "없다 — 외모와 재능으로 값이 매겨진다", open_to_player: true, condition: "영지에서 뛰어난 외모·재능으로 선별관의 눈에 들면 입문. 아에린의 '특별 선별'(잔향 징후)은 따로 있다"}

decision: "자작이 결정하고 선별관이 집행한다. 큰 결정은 엘다르 쪽 사절관의 입이 열리기를 기다린다 — 문의 양쪽에서 결정이 오는 가문이므로 느리다. 공식 서약(아우락스)과 실제 저울질(멜리산드로의 흔들림)은 자작 혼자의 머릿속에서만 만난다."
succession: "장자 상속 — 리산드라의 아들 바실이 후계. 숨겨진 반엘다르 노엘은 후계 서열 밖이며, 그의 존재가 알려지면 가문이 끝난다. 후계 문제는 곧 '비밀이 알려지는가'의 문제다."

law:
  crimes:
    - {act: "엘다르 허가 없이 정원 길 숲에 든다", punishment: "숲에서 길을 잃는다 — 가문은 막지 않고 돌려보내지도 않는다", note: "엘다르가 막는다. 인간·용인 모두 해당"}
    - {act: "선별 대상 아이를 빼돌린다", punishment: "인간은 가족 전원 매각, 용인은 가문 이름 삭제", note: "엘다르가 값을 이미 지불했다"}
    - {act: "엘다르 사절관과의 접선 내용을 발설한다", punishment: "통역관은 혀(용인이면 가문 퇴출)", note: "문지기 가문의 유일한 규칙"}
    - {act: "반엘다르의 존재를 입에 올린다", punishment: "가문의 판단 — 입막음", note: "노엘 — 존재가 밝혀지면 양쪽에서 가문이 끝장난다"}
    - {act: "통행세를 빼돌린다", punishment: "세관원은 태형, 용인이면 월급 삭감", note: ""}
    - {act: "인간이 정원 길 허가증을 위조한다", punishment: "즉결 처형 (글자 소지)", note: "엘다르 측 발급 — 위조는 두 종족의 법을 한꺼번에 어긴다"}

customs:
  greeting: "문의 인사 — 양손을 좌우로 펼쳐 보이고 '어느 쪽에서 오셨습니까'를 묻는다. 엘다르어로 먼저, 이어서 공용어로. 인간은 말을 걸지 않고, 통역은 눈높이에서 오가지 않는다."
  taboos:
    - "엘다르를 '귀 뾰족이'라 부르는 것 (통역관의 가장 큰 모욕)"
    - "노엘의 어머니를 묻는 것"
    - "선별 아이의 이름을 부르는 것 — '일곱 번째 문'처럼 번호로 부른다"
    - "문 가운데 서서 어느 쪽도 보지 않는 것 — 문지기의 자세"
  rites:
    - {name: "문의 열림", when: "해빙월 첫날", what: "서리 길과 정원 길의 새 통행증 발급을 시작한다. 엘다르 사절관이 연서를 가져온다"}
    - {name: "정원지기 경매", when: "파종월 대시장 뒤", what: "선별한 인간 아이의 경매. 낙찰가의 20%가 수수료"}
    - {name: "성 마렌 축일 후원금 전달", when: "꽃월", what: "AS 87 이후의 관례 — 엘다르 후원금을 순종의 빛에 전달하는 창구 의례(공식 이름은 '정원의 선물')"}
  speech: "엘다르어를 앞세운 완곡체. 말끝에 '그리고 반대편에서는'을 붙여 양쪽을 본다는 것을 표시한다. 인간에게는 직접 말하지 않는다. 금지어: 귀 뾰족이, 혼혈(엘다르의 앞에서), 선별(→ '추천')."

membership:
  join: "출생. 통역관은 가문의 어학 시험(엘다르어)과 실바렌 사절관의 승인."
  leave: "'문 밖'이 퇴장 — 문 안으로 다시 들어올 수 없다. 노엘은 이름이 지워지고 문 안에 남았다."
  signs: ["연청색 바탕 은빛 아치형 문 — 잎 하나와 비늘 하나", "통역관의 귀걸이(은빛 잎)"]

internal_factions:
  - {name: "문의 양쪽 (여자작)", leader: null, aim: "아우락스에 공식 서약 + 엘다르와의 통로 유지 — 어느 쪽이 이겨도 문은 열려 있어야 한다", strength: 50}
  - {name: "선별관의 장부 (바실)", leader: null, aim: "수수료 수입의 증대 — 아에린의 '특별 선별'을 놓치지 않는다", strength: 30}
  - {name: "새벽가지에 기운 통역관들", leader: null, aim: "엘다르 존속파가 멜리산드를 밀자 흔들린다", strength: 15}
  - {name: "노엘의 비밀", leader: null, aim: "반엘다르의 존재 — 파벌이 아니라 폭탄", strength: 5}
  # leader null = 카드 미작성

