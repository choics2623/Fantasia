relations:
  # HOUSES §2.5 '관계' 서술에서 환산 (행렬 §6.1 밖)
  - {to: fac_eldar, stance: 40, note: "엘다르 고목 가지(우호), 새벽가지(거래) — 가지별 값은 fac_eldar 쪽"}
  - {to: fac_kaldaran, stance: 30, note: "종속 — 칼다란 집사의 서명권 아래"}
  - {to: fac_bold, stance: 20, note: "학술 교류"}
toward_echo: "공식은 아우락스 진영 — 징후자는 화형. 그러나 아에린 새벽가지의 '특별 선별'은 잔향 징후가 있는 아이를 요청한다. 이 가문은 잔향을 '태우기'와 '붙잡기' 사이의 문 위에서 쥔다."
player_paths:
  - "특별 선별 명단 — 오른 아이를 빼돌리는 것은 영혼 정원 클락에 직접 개입하는 일이다"
  - "노엘 — 반엘다르 플레이어의 거울이자 실바렌으로 들어가는 가장 좋은 문. 비밀을 협박에 쓰면 가문이 양쪽에서 끝장난다 (지지 2점이 움직인다)"
  - "정원지기 경매 — 선별된 아이로 팔려 실바렌으로 들어간다"
  - "통역관 — 엘다르어를 익히면 문을 지나는 말을 들을 수 있다"
regression:
