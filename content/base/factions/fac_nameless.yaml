infiltration:
  join_real: "그들이 찾아온다. 탈주자를 한 번 숨기거나 정화청 밀고를 거부하는 것을 들키면 엘사(또는 지역 심지)가 접근한다. 첫 임무(불씨): '이 빵을 굶주린 언덕의 세 번째 동굴로 가져가라. 빵 속에 무엇이 들었는지 묻지 마라.' 빵 속에는 땅 글씨 연습용 뼈 막대가 들어 있다 — 묻거나 열어 보면 그 불씨는 거기서 끝난다(시험)."
  join_fake: "가입한 척하기 — 목줄단·정화청·바르그의 미끼로 들어가는 길. 불씨는 위로 한 칸밖에 모르므로 가짜 불씨가 얻는 것은 목소리 하나다. 가짜를 거르는 장치: 불씨는 1년 동안 한 가지 일만 받고, 그 일의 결과(아이가 늪에 닿았는가)로만 다음 칸에 오른다. 잡힌 아이가 있으면 그 줄의 불씨 전부가 의심받는다."
  climb_by_capture: "한 세포를 잡아 위로 올라가기 — 플레이어가 사냥꾼 쪽에 설 때. 손가락 하나를 잡으면 심지의 목소리, 심지를 잡으면 등잔의 암호명과 매개물(물통·양초·돌 틈), 등잔의 매개물을 지켜보면 회색 여인의 경로 하나. 회색여울은 북부 등잔 공석 때문에 손가락 → 엘사 → 회색 여인까지 세 칸뿐이다 — 대륙에서 가장 짧은 줄"
  proof_test: >
    '돌아오는 이' 증명 — AS 180·244 두 번 속은 뒤 생긴 시험. 말로는 통과할 수 없다. 셋 중 둘을 요구한다.
    ① 오지 않은 날: 그 세포만 아는 일이 7일 안에 일어날 것을 미리 말한다(회귀 지식). 엘사나 등잔이 확인한다.
    ② 타지 않는 입: 엘사(진명 낱말 140개)나 늪 노파 앞에서 진명 한 낱말을 말하고 타지 않는다.
    ③ 죽어 본 사람만 아는 것: 회색 여인이 정한 질문 하나 — 매 시드 다르다(예: '지난 겨울 서리 길 마지막 이정표에서 몇 명이 물렸나').
    통과해도 환영은 없다. 회색 여인은 증명된 잔향을 '조직의 통제 아래' 두려 하고, 통제를 벗어나면 가장 먼저 그를 버린다(fact_wd_grey_woman_would_sacrifice_echo).
  exposure: >
    정체가 탄로 나는 길: 표식을 잘못 쓰기(쇄골을 세 번 두드리면 '위험' — 아무 때나 쓰면 그 자리의 세포가 흩어진다), 잿빛 표를 받은 손바닥을 씻지 않고 검문을 받기,
    '그래도 끝나지 않아요'를 앞 구절 없이 말하기(목줄단이 아는 미끼 문구다 — 진짜 답은 앞 구절을 들은 뒤에만), 아이 옷깃의 재 가로줄을 지우지 않고 아이를 넘기기.
    세포가 잡히면 '끊어라' 지시가 하루 안에 내려간다 — 플레이어가 그 줄에 있었다면 다음 날부터 아무도 그를 모른다.
  signs_misuse: "플레이어가 표식을 아는 것은 지식 카드다(회귀해도 남는다). 회차 초반에 표식을 쓰면 상대는 '누가 가르쳤나'를 묻는다 — 답하지 못하면 미끼로 의심받는다(AS 244의 기억)."

law:
  crimes:
    - {act: "문서를 남김 (글을 땅 외에 씀)", punishment: "그 손을 끊는다(세포 절단). 재범이면 조직 밖으로", note: "단원 대상"}
    - {act: "다른 손의 얼굴을 알려고 함", punishment: "끊는다", note: "단원 대상"}
    - {act: "승인 없이 피를 흘림 (목줄장·밀고자 처리)", punishment: "그 등잔·심지를 끊는다", note: "단원 대상 — 칼렙이 가장 오래 참고 있는 규칙"}
    - {act: "밀고 (조직을 판 자)", punishment: "회색 여인의 매듭이 오면 죽음. 오지 않으면 그 밀고자가 아는 간선 전부를 버린다", note: "단원·협력자. AS 200~312 처리 기록 23건(목줄장 포함)"}
    - {act: "'돌아오는 이'를 자칭함", punishment: "의심, 격리, 증명 요구 — 증명 실패 시 그 줄을 끊는다", note: "누구에게나. AS 244 규칙"}
    - {act: "아이 표식을 지움 / 표식이 있는 아이를 넘김", punishment: "끊는다", note: "단원 대상"}
    - {act: "용제국 법의 '글 가르치기' (인간에게 적용되는 바깥 법)", punishment: "즉결 처형 — 조직은 그 처벌을 막지 못한다. 대신 그 자의 이름을 재의 날에 부른다", note: "인간 대상 — 재의 법"}

customs:
  greeting: "'밤이 기네요.' — 답: '그래도 끝나지 않아요.' 상대가 답하면 엄지로 자기 쇄골을 두 번 두드린다(동지). 세 번은 위험 — 그 자리를 떠라."
  taboos:
    - "얼굴을 묻는 것, 이름을 묻는 것 — 이름 대신 직급과 지역으로 부른다"
    - "'돌아오는 이'를 쉽게 입에 올리는 것 — 기다림을 가볍게 하는 말"
    - "땅에 쓴 글을 발로 지우지 않고 자리를 뜨는 것"
    - "재의 날에 아스테리온의 이름을 소리 내어 부르는 것 — 속으로만. 대신 아홉 해를 손가락으로 센다"
  rites:
    - {name: "재의 날의 셈", when: "재의 날 (연말 5일)", what: "불을 끈 어둠 속에서 아스테리아의 아홉 해를 손가락 아홉으로 세고, 그해 잡혀 간 이들의 이름을 한 번씩 부른다. 이름 없는 자들이 이름을 쓰는 유일한 날"}
    - {name: "첫 글자", when: "아이가 땅에 첫 글자를 쓴 날", what: "그 글자를 쓴 막대를 부러뜨려 반은 아이가, 반은 심지가 갖는다. 글자는 발로 지운다"}
    - {name: "잿빛 표 찍기", when: "거래·빚 갚기", what: "엄지에 재를 묻혀 상대 손바닥 가운데 동그라미 — 신용 1단위(빵 열 덩이)"}
    - {name: "아이 표식", when: "징후로 의심받을 아이가 생기면", what: "옷깃 안쪽에 재로 작은 가로줄 — '이 아이를 데려가라.' 지난 10년간 약 300명"}
  speech: "짧은 노예말, 은어와 날씨 이야기로 감싼다('비가 오겠네' = 바르그가 온다, '빵이 탔다' = 세포가 잡혔다). 존댓말과 반말을 섞지 않고, 서로 같은 높이의 평어를 쓴다 — 조직 안에 주인이 없다는 표시. '기다린다', '버틴다', '끝나지 않는다'를 자주 쓴다."

membership:
  join: "찾아갈 수 없다. 그들이 찾아온다(위 infiltration.join_real)"
  leave: "나갈 수는 있다 — '끊긴다.' 끊긴 자는 아무도 모르는 사람이 된다. 다만 아는 간선이 많을수록 끊기 전에 그 간선을 모두 버려야 하므로, 등잔이 나가면 지역 하나가 1년 동안 멈춘다."
  signs:
    - "인사 '밤이 기네요.' — '그래도 끝나지 않아요.'"
    - "엄지로 쇄골 두 번 = 동지, 세 번 = 위험"
    - "손바닥 가운데의 재 동그라미 (잿빛 표)"
    - "아이 옷깃 안쪽의 재 가로줄"
    - "잿빛 표 뒷면의 실 매듭 문자 (마그가 만든 체계 — fact_wd_knot_script_by_mag)"
    - "아홉을 세는 손가락 (재의 날)"

