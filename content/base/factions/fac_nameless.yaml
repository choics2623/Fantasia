# 이름 없는 자들 — 아스테리온의 유산을 잇는 세포 결사. "우리는 아스테리아가 무너진 날 태어났다."
# 근거: HOUSES §5.2·§5.5·§4·§6, WORLD_BIBLE §4.3·§6.3·§7.1, CHARACTERS R00-01·R02-14·R01-05·R04-05·R11-01, facts/wanderers.yaml·greyford.yaml.
# 세포 그래프(cell_graph)는 23 §4.1: 각 마디는 knows_up(한 단계 위로 가는 길)과 knows_members(아는 동료)만 안다.
# 한 마디가 잡히면 엔진은 그 마디의 간선만큼 드러낸다(if_captured).
id: fac_nameless
name: 이름 없는 자들
kind: secret
race: [인간, (접촉자) 반용·녹테른·두르강 일부]
governance: 세포 결사 — 위에서 아래로 한 줄. 서로의 얼굴을 모른다
motto: "밤이 기네요. — 그래도 끝나지 않아요."
seat: 없음. 지역 '등잔' 12곳. 회색 여인의 위치는 아무도 모른다
size:
  members: "정식 '손가락' 약 1,800 / 불씨(수습) 약 600 / 협력자 약 1만"
  territory: "용제국 전역, 루멘, 세렌, 모르바, 잿불 언덕, 아르카스, 카즈둠 만료장, 재의 황무지 가장자리 — 등잔 12곳"
  wealth: "잿빛 표(비밀 신용 — 1단위 = 빵 열 덩이), 잿빛 실(fac_grey_thread), 비밀 학교 11곳(학생 약 140), 별 칼 약 60자루, 잿모루산 화살촉 2,000"
  force: "무장 봉기 능력은 거의 없다. 대신 목줄장 암살 기록 23건(AS 200~312), 탈주 통로, 위조 통행증, 그리고 기다림"

decision: >
  결정은 위에서만 내려온다. 회색 여인의 지시는 잿빛 표 뒷면의 실 매듭 문자(마그가 만든 체계)로 등잔에게 가고,
  등잔은 그것을 입으로 심지에게, 심지는 손에게 전한다. 아래에서 위로는 '요청'만 올라간다 — 한 달에 한 번, 등잔이 한 줄.
  지시는 세 종류다: ① '숨겨라'(아이·탈주자), ② '가르쳐라'(학교·땅 글씨), ③ '끊어라'(세포 절단 — 이 지시가 오면 그 손은 서로를 모르는 사이가 된다).
  등잔은 지역 안에서 재량을 가진다 — 다만 피를 흘리는 일(목줄장 암살, 밀고자 처리)은 반드시 회색 여인의 매듭을 받아야 한다(받지 않고 하면 그 등잔이 끊긴다).
  거부권은 없다. 대신 '침묵'이 있다: 등잔이 지시에 한 달 동안 답하지 않으면 회색 여인은 그 등잔이 잡혔다고 보고 경로를 끊는다 — 그래서 반대하는 등잔은 침묵으로 버틴다.
  AS 244 이후 규칙 셋은 바뀌지 않는다: 문서를 남기지 않는다 / 돌아오는 이라고 말하는 자는 먼저 의심한다 / 하나 때문에 많은 것을 잃지 않는다.
succession: >
  위가 아래를 지명한다. 등잔이 잡히거나 죽으면 회색 여인이 그 지역 심지 중 하나에게 '새 등잔 매듭'(잿빛 표 세 개를 엮은 것)을 보낸다.
  지명된 자는 옛 등잔이 알던 경로를 모두 버리고 새 경로를 만든다 — 공석 동안 그 지역 심지들은 회색 여인과 '임시 실'로 직접 이어지며, 이것이 조직의 가장 위험한 순간이다
  (임시 실 하나가 잡히면 회색 여인까지 한 칸이다). 회색 여인의 자리는 승계를 말하지 않는다 — 수십 년간 같은 목소리, 같은 명령이 온다.
  (작가 전용: 회색 여인의 정체는 시대 시드가 정한다 — fact_wd_grey_woman_identity_by_seed. ⓓ 공유 가명이면 '승계'는 이미 매번 일어나고 있다.)

