toward_echo: >
  기다린다 — 그러나 증명을 요구한다. AS 180·244 두 번 미끼에 속은 뒤 첫 반응은 환영이 아니라 시험이다.
  증명된 뒤에도 회색 여인은 잔향을 지키는 것이 아니라 잔향이 일으킬 사람들을 지킨다: 잔향이 통제를 벗어나 사냥꾼을 부르면 가장 먼저 밀고할 수도 있다.
  잔향이 그들 사이에 있다는 사실이 새면, 바르그와 정화청은 그 지역의 아이를 모두 잡아들인다 — 플레이어의 존재 자체가 동지들을 위험하게 만든다.
  계승 지지율: 카스파르 1 → 찬가 단계와 연동해 최대 8.
player_paths:
  - "가입: 불씨 → 손가락 → 심지 → (공석) 북부 등잔. 회색여울은 줄이 가장 짧아 가장 빨리 오르고 가장 쉽게 무너진다"
  - "증명: 세 시험 중 둘 — 회차 지식(오지 않은 날)이 가장 쉬운 열쇠다. 두 번째 회차부터는 엘사의 질문에 먼저 대답할 수 있다"
  - "이용: 잿빛 표 신용, 위조 통행증, 비밀 학교 — '글' 단계(찬가 2)의 뼈대"
  - "침투(사냥꾼 쪽): 한 세포를 잡아 위로 — 엘사가 잡히면 카스파르와 회색 여인까지 한 칸씩. 그 길은 13_DARK_PATHS의 목줄 길과 이어진다"
  - "구하기: 이안의 추종자 60, 페니(매듭집), 회색여울 이졸의 목록에 오른 아이 셋 — 미끼파와 기다리는 자들 사이의 선택"
