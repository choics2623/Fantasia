# 늪 마녀 일곱 계보 — AS 2 '글 학교'의 여자 일곱이 연 일곱 스승-딸 사슬. 인간 숨은 혈통 중 유일하게 '혈명 대신 빌린 피'로 이어진다.
# 회합(운영 조직)은 fac_swamp_hags(다른 작가) — 이 파일은 계보의 몸(전승·규약·유품)이다.
# 근거: HOUSES §4.3, WORLD_BIBLE §1.3·§4.3, CHARACTERS R08, facts/morva.yaml.
id: fac_hag_lineages
name: 늪 마녀 일곱 계보 (쑥·뼈바늘·버들·거머리·재·안개·갈대)
kind: house
secret: true            # 모르바 늪에서는 자유(불법)이나 늪 밖에서는 화형·탑 인계다. 계보 이름이 곧 비밀 이름이다
race: [인간(주로 여성)]
governance: 계보 사슬 — 낱말 대조  # 스승과 딸의 일대일 사슬, 결정은 노파가 하고 오류는 딸이 잡는다
motto: "한 마디에 몇 주, 한 마디에 몇 년. 값을 알고 말하라."
seat: "모르바 늪 — 일곱 노파의 둥지(seven_hags_circle), 말하는 이끼 바위(seven_hags__talking_moss). 계보마다 오두막"
size:
  members: "노파 7, 딸(정식 제자) 약 30, 손님 제자 약 20, 견습 약 40 — 마흔을 넘기지 못하는 사람들이다"
  territory: "모르바 늪 안의 일곱 오두막과 섬. 늪 밖에서는 계보가 아니라 '약초 노파' 얼굴로 산다"
  wealth: "빌린 피 저장고(우르사 피, 거인 골수, 나가 허물, 용인 피(거머리로), 녹테른 피, 페이 이슬, 하르칸 피), 약초(세렌 마르디 상가에 판매), 고대 진명어 낱말 약 400개"
  force: "작은 주술 — 약효 돋우기, 안개 부르기, 상처 봉하기. 주문 하나에 수명 몇 주에서 몇 년. 독꼬리 와이번과의 '젖은 휴전'"

decision: >
  계보는 일대일 사슬이다. 한 계보 안에서는 노파가 결정하고, 딸들은 '낱말 대조'로 그 결정을 점검한다 — 노파가 낱말 하나를 틀리게 외우면 가장 어린 딸이라도 보름 회합에서 이의를 걸 수 있고,
  이의가 맞으면 노파는 그 낱말의 값(수명)을 자기 수명에서 먼저 낸다. 이 규칙이 계보를 정직하게 만든다 — 마녀의 말은 값이기 때문이다.
  계보와 계보 사이는 보름 회합(fac_swamp_hags)에서 다수결로 정하고, '말하는 이끼 바위'·시간 근원·'그릇'에게 낱말을 넘기는 일만은 일곱 전원이 필요하다.
  계보 안의 거부권은 '낱말을 돌려줌'이다 — 딸이 스승에게 외운 낱말을 돌려주고 늪을 떠난다(엘사가 AS 270에 그렇게 했다).
  시전의 결정은 늘 셈이다. 노파는 시전 전에 수명을 센다: 몇 주면 약초, 몇 달이면 안개, 몇 년이면 불의 낱말. 셈이 틀리면 그 자리에서 늙는다.
succession: >
  노파가 죽으면 그 계보의 딸 중 가장 많은 낱말을 외운 자가 다음 보름 회합에서 빈 오두막에 들어간다. 마녀는 마흔을 넘기지 못하므로 계승은 잦다.
  오다(첫째)는 남은 시전이 많아야 세 번이다(fact_mv_oda_three_casts_left) — 그녀가 죽으면 둘째 브리타가 첫째의 말을 쥐고 회합의 방침이 '그릇을 가두기'로 바뀐다.
  일곱째 루네는 앞 노파가 일찍 죽어 한 번도 시전하지 않은 채 자리를 이었다. 여덟째(시간)는 AS 2부터 공석이다 — 어떤 계보도 그 낱말을 입에 올리지 않는다.

