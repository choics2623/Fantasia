  - {id: rank_daughter, title: "딸 (정식 제자)", duties: "낱말을 외운다, 노파의 오류를 대조", privileges: "빌린 피 한 병, 계보 이름", open_to_player: false}
  - {id: rank_guest_disciple, title: "손님 제자 (AS 280 이후 — 남자·외부인도)", duties: "약초·소식·피를 가져온다, 낱말 한두 개를 배운다", privileges: "늪 안 거처와 보호", open_to_player: true, condition: "약초나 빌린 피, 소식으로 노파 한 명의 신뢰를 얻는다. 잔향은 빌린 피 없이 낱말을 말해도 타지 않는다 — 그것을 알면 노파들이 4:3으로 갈라진다. 일곱 근원 모두를 배우려면 일곱 노파 전원의 동의가 필요하다"}
  - {id: rank_apprentice, title: "견습", duties: "낱말을 소리 없이 따라 읊는다", privileges: "늪의 안전", open_to_player: false}

law:
  crimes:
    - {act: "빌린 피 없이 진명 낱말을 입에 올림", punishment: "한 마디에 목숨이 탄다 — 계보가 말리지 못한다", note: "인간 대상 (평범한 인간). 잔향만 예외"}
    - {act: "시간 근원(여덟째)의 낱말을 입에 올림", punishment: "시간 잔상에 걸린다 — 계보가 그 사람의 오두막을 비운다", note: "계보 규약 — 대붕괴 이후 금지"}
    - {act: "다른 계보의 근원 낱말을 허락 없이 가르침", punishment: "계보에서 낱말을 돌려받고 쫓아낸다", note: "계보 규약"}
    - {act: "'그릇'(돌아오는 이)에게 낱말을 일곱 전원의 병 없이 넘김", punishment: "회합이 그 노파의 병을 거둔다", note: "회합 규약 — 사실상 한 노파의 거부권"}
    - {act: "빌린 피 저장고의 병을 몰래 씀", punishment: "병 값의 열 배만큼 수명을 낸다 — 그 노파가 정한다", note: "계보 규약"}
    - {act: "늪 밖의 아이에게 낱말을 가르침", punishment: "쑥 계보 규약은 '그릇이 올 때까지 안 된다'. 어기면 낱말을 돌려주고 늪을 떠나야 한다 — 엘사 사례", note: "계보 규약 (쑥 계보의 규칙)"}
    - {act: "늪 밖에서 마법을 씀 (제국·루멘)", punishment: "화형", note: "인간법 — 용제국·루멘. 세렌은 벌금 후 잿빛 탑 인계, 카즈둠은 금지"}
    - {act: "비밀 이름(계보 이름)을 낯선 이에게 말함", punishment: "경고 후 딸의 낱말 중 하나를 노파가 돌려받는다", note: "계보 규약"}

customs:
  greeting: "'어느 계보냐?' — 답은 계보 이름(쑥, 뼈바늘, 버들, 거머리, 재, 안개, 갈대) 하나다. 계보 이름이 곧 비밀 이름이므로 낯선 이에게는 말하지 않는다. 노파끼리는 손바닥을 맞대고 서로의 오두막 냄새를 맡는다."
  taboos:
    - "시간의 낱말, 말하는 이끼 바위의 뒷면을 입에 올리거나 읽는 것"
    - "마흔을 넘기려 낱말을 아끼는 것 — 노파는 '아낀 낱말은 남의 목숨으로 갚는다'고 한다"
    - "빌린 피를 낭비하는 것(병 하나는 주문 하나 값이다)"
    - "평범한 인간이 낱말을 소리 내 따라 하게 두는 것"
    - "'마녀'라는 말 — 늪에서는 '노파', 늪 밖에서는 '약초 노파'"
  rites:
    - {name: "보름 회합", when: "보름마다", what: "일곱 노파가 둥지 원형 마당에 모여 낱말을 대조하고 병을 그릇 쪽으로 민다"}
    - {name: "낱말 대조", when: "보름 회합 전", what: "스승이 외운 낱말 400개를 딸이 한 줄씩 대조한다. 틀린 낱말의 값은 스승이 먼저 낸다"}
    - {name: "병 채우기", when: "겨울 전", what: "독꼬리 와이번 피 3병 등 빌린 피를 저장고에 채운다. 젖은 휴전의 표시는 사냥터에 맨 갈대 매듭"}
    - {name: "수명 셈", when: "시전 전", what: "노파가 이번 낱말의 값을 센다. 몇 주면 약초, 몇 년이면 불"}
    - {name: "이름 받기", when: "딸이 된 날", what: "계보 이름을 귓속말로 받고 첫 낱말을 외운다"}
  speech: "노파는 반말, 짧고 비유가 많다 — 값을 셈하는 말투('한 철어치', '석 달 값'). 딸은 노파에게 하오체로, 서로에게는 해요체. '고맙다' 대신 '값을 안다'고 한다. 낱말은 소리 내지 않고 입 모양과 손가락으로 말한다 — 소리를 낼 수 있는 이는 잔향뿐이라는 노래가 있다."

membership:
  join: "딸의 입문은 낱말 하나를 입 모양으로 외우는 것 — 노파가 받아 주고 계보 이름을 귓속말로 준다. 손님 제자는 약초·피·소식으로 받아 준다."
  leave: "낱말을 돌려주고 떠난다(엘사). 낱말을 돌려준 자는 그 계보에 대해 입을 닫는다. 마흔 전후로 시전의 값을 못 내면 죽는다."
  signs: ["일곱 계보의 유품 — 쑥 줄기 매듭, 거인 뼈 바늘, 버들가지 막대, 검은 거머리 단지, 잿빛 고리 목걸이, 유리판 조각, 갈대 피리", "목에 건 뼈 병(빌린 피)", "겉보기 나이가 실제보다 20~40년 많다"]

