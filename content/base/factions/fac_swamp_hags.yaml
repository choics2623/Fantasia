# 늪 마녀 회합 — 일곱 계보의 노파들. 말할 수 없는 낱말을 300년 지켜 온 자들.
# 근거: HOUSES §5.6·§4.3·§6.1·§3.9(잿가루), WORLD_BIBLE §1.3·§4.3·§5, REGIONS §8, CHARACTERS R08, CONTINUITY_LOG §2-A, facts/morva.yaml.
id: fac_swamp_hags
name: 늪 마녀 회합 (일곱 노파)
kind: secret
race: [인간 (여성 중심 — AS 280 이후 손님 제자는 남자·외부인도)]
governance: 일곱 노파 합의 — 보름 회합의 다수결, 그러나 '바위'의 일만은 일곱 전원
motto: "우리는 말하지 못하는 것을 지킨다."
seat: 모르바 늪 중심 '일곱 노파의 둥지' (seven_hags_circle) — 일곱 오두막이 원을 이루는 버섯 섬. 말하는 이끼 바위 (seven_hags__talking_moss)
size:
  members: "노파 7, 딸(정식 제자) 약 30, 손님 제자 약 20, 견습 약 40. 회합이 지키는 늪 자유민 약 4,200"
  territory: "모르바 늪 — 초대 없이는 섬이 '사라진다'(뿌리마을에서 26시간 늪길)"
  wealth: "빌린 피 저장고(각 종족의 피·골수·허물), 약초(세렌 마르디 상가에 판매 — 회합의 돈줄), 냄새 지우기 약, 상처 봉합 약"
  force: "작은 주술(안개 부르기, 상처 봉하기, 냄새 지우기) — 주문 하나에 수명 몇 주~몇 년. 독꼬리 와이번과의 '젖은 휴전'"

decision: >
  보름마다 둥지의 원형 마당에서 일곱 노파가 모인다. 안건마다 노파는 자기 계보의 빌린 피 병을 마당 가운데 그릇 쪽으로 밀거나(찬성) 자기 쪽으로 당긴다(반대).
  넷이면 정해진다. 첫째(오다)는 동수일 때가 아니라 '피를 쓰는 일' — 회합의 저장고에서 누가 얼마를 쓰느냐 — 에 한해 마지막 말을 한다.
  말하는 이끼 바위를 움직이는 일, 시간 근원을 입에 올리는 일, '그릇'(돌아오는 이)에게 낱말을 넘기는 일만은 일곱 전원의 병이 그릇에 닿아야 한다 — 사실상 한 노파의 거부권.
  AS 312 현재 '그릇'을 두고 4:3으로 갈라져 있다: 쑥·버들·재·갈대 계보는 '모든 근원을 그에게 주자', 뼈바늘·거머리·안개 계보는 '그가 오면 늪이 불탄다 — 다라 때처럼. 늪에 가둬 지키자.'
  전원 합의가 필요한 일이므로, 지금 회합은 그릇이 와도 아무것도 넘겨주지 못한다.
succession: >
  노파가 죽으면 그 계보의 '딸' 중 가장 많은 낱말을 외운 자가 다음 보름 회합에서 빈 오두막에 들어간다. 첫째 자리는 서열이 아니라 '쑥' 계보의 자리다 —
  그러나 첫째 노파가 죽으면 회합의 의장격(피의 마지막 말)은 둘째에게 간다(관례). 오다가 죽으면 브리타가 그 말을 쥐고, 회합의 방침이 '가두기'로 바뀐다(fact_mv_brita_confine_plan).
  견습이 노파 자리에 오르기도 한다 — 일곱째 루네(19)는 앞 노파가 일찍 죽어 한 번도 시전하지 않은 채 자리에 앉았다. 여덟째 근원(시간)의 자리는 AS 2부터 비어 있다.

