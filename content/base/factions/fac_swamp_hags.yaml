    - {act: "시간 근원을 입에 올림", punishment: "회합에서 내쫓긴다 — AS 2의 약속", note: "누구에게나"}
    - {act: "늪 자유민을 목줄단·바르그에 팖", punishment: "꿈 심문(엘스베트) → 늪에 빠뜨린다", note: "인간 대상 — 진흙등불 장부 연간 사망 30여 건 중 7건"}
    - {act: "마녀질 (바깥 법)", punishment: "용제국·루멘: 화형. 잿빛 탑: 포획 현상금 30비늘", note: "인간 대상"}

customs:
  greeting: "노파끼리: 서로의 목에 건 피 병 하나를 손끝으로 만진다 — '몇 해 남았나'라는 뜻. 답은 손가락 수(남은 시전 수). 외부인에게는 인사 대신 그의 목소리를 먼저 듣는다('말해 봐라, 아무 말이나')."
  taboos:
    - "노파의 나이를 묻는 것 — 서른인지 여든인지는 묻는 자가 정할 수 없다"
    - "바위 뒷면을 보려고 바위에 손을 대는 것"
    - "시간 근원, 대붕괴의 '그 낱말'"
    - "빌린 피를 땅에 흘리는 것"
  rites:
    - {name: "보름 회합", when: "매달 보름", what: "피 병을 그릇 쪽으로 밀고 당긴다. 끝나면 일곱이 바위 앞에 서서 한 줄씩 외운다 — 300년째"}
    - {name: "이끼 걷기", when: "해빙월", what: "말하는 이끼 바위의 이끼를 걷고 각문을 다시 외운다. 견습은 이때 처음 바위를 본다(읽지 않는다)"}
    - {name: "마흔의 밤", when: "노파가 죽은 밤", what: "남은 노파들이 그녀의 피 병을 늪에 붓고, 그녀가 마지막으로 말한 낱말을 한 번씩 입 모양으로만 따라 한다"}
  speech: "짧고 비유가 많다. 낱말 하나에 수명이 드는 사람들이라 말을 아낀다 — 불필요한 말을 하는 자를 '헤프다'고 한다. 늪 마을 사람에게는 할머니의 반말, 외부인에게는 질문으로 시험한다."

membership:
  join: "딸은 계보의 피로 태어나거나 어릴 때 데려온다. 손님 제자는 노파 셋의 허락 + 첫 임무(위)"
  leave: "딸은 시전을 끊으면 나갈 수 있다 — 엘사처럼. 그러나 그 계보의 낱말을 외운 채 나간 자는 회합의 빚이다"
  signs: ["목에 건 작은 뼈 병들(빌린 피)", "쑥 매듭·버들가지·거머리 단지·잿빛 고리 목걸이 — 계보의 유품", "갈대 매듭(독꼬리 와이번과의 젖은 휴전 표시)", "매듭 문자"]

