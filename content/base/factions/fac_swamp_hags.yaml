toward_echo: "4:3 분열 직전. 첫째 오다는 300년 기다린 그릇에게 낱말을 넘기려 한다. 브리타는 그를 늪에 가둬 지키려 한다. 플레이어가 정체를 드러내면 회합이 갈라지고, 반대파 노파 하나가 정화청과 거래할 수 있다."
