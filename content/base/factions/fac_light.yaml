  - {name: "정치파 (바알카르 교구)", leader: null, aim: "그리말도(unnamed) — 용인 가문과 결탁해 징후자를 팔고 누가 이기든 교단의 자리를 지킨다. 아우락스 쪽에 줄을 섰다(계승 지지율 2)", strength: 20}
  - {name: "끊어진 고리 (지하 신도회 — fac_broken_ring)", leader: npc_alberic, aim: "안에서 바꾼다. '사슬을 감은 것은 등불이 아니라 손이다'", strength: 10}

