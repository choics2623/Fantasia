toward_echo: >
  공식: 잔향은 '아우렐을 거역한 저주받은 영혼' — 정화청이 화형으로 다룬다(화형은 잔향을 끊지 못한다. 정화청은 그것을 모른다. 마테우스는 의심한다).
  정화청은 '진짜'를 잡으면 태우는 대신 세레니엘을 통해 영혼 정원으로 보낸다 — 엘다르가 원하는 쪽. 그레고르 7세는 사적으로 다르게 생각한다: 잔향은 교리가 비튼 원본 —
  '돌아오는 단 하나'의 실물이고, 그것이 드러나는 날 교단은 끝난다. 그는 잔향을 만나면 태우지도 넘기지도 못할 것이다.
player_paths:
  - "가입: 성표 신도 → 고리지기 → 찬송 순례자 → 사슬사제. 고리지기 첫 임무(아이 밀고)에서 자비·신앙 축이 갈린다. 사슬사제가 되면 합법 문해자 — '글' 단계의 가장 안전한 위장"
  - "이용: 찬송 순례자의 통행 허가증으로 대륙을 움직인다. 고해실은 소문 판정의 최고 출처다(펠릭스의 고해 장부)"
  - "침투: 정화청 밀고 접수관 자리로 들어가 밀고 함을 '잃어버린다' — 오스릭 관련 마르타의 보고가 거기 있다"
  - "무너뜨리기: 마렌의 두 번째 설교·『빛의 말씀』 원본 한 장·매듭집 매듭줄·볼드 사본 — 그레고르 7세에게 보여 축일 낭독을 결심시키면 끊어진 고리 클락(#8)이 '교단 분열/개혁'으로 넘어간다. 그날 밤 마테우스가 움직인다"
  - "계승 개입: 그레고르 7세가 죽는 날짜를 늦추거나(엘사·오다의 약), 마티아스 회색손에게 용기를 줄 증거를 쥐여 주기"
regression:
  fixed:
    - "그레고르 7세 82세, 알베릭 처형 서명 1년째 미룸, 1,107장의 종이"
    - "마테우스의 212명과 베라(213번째 후보)"
    - "북부 등불관 공석(AS 309~)"
    - "AS 313 꽃월 12일 성 마렌 축일, 정화의 뜰 이번 가을 장작 네 번"
  flow:
    - "그레고르 7세의 건강 — 대개 굶주림월에 한 번 크게 쓰러진다"
    - "가을 순회 심문관이 회색여울에 오는 날 — 마르타의 밀고 함 보고가 회수되지 않으면 이듬해 해빙월"
  drift:
    - "고해실에 그날 앉은 사제, 밀고 함의 작은 보고들"
    - "정화의 뜰에 오르는 개별 징후자의 얼굴 — 숫자는 비슷하고 사람은 다르다"
    - "토비아스가 그 주에 접수한 건수"
