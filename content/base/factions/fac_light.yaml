ranks:
  - {id: rank_high_priest, title: "빛의 대사제", duties: "교단 총괄, 축일 설교, 의견서 낭독", privileges: "흰 사슬 일곱 겹, 금실 등불 아래 서는 유일한 인간", open_to_player: false}
  - {id: rank_lamp, title: "등불관 (대교구장)", duties: "대교구 통치, 회의 표결, 사슬사제 서품", privileges: "흰 사슬 세 겹, 회의 한 표, 영주 저택 출입", open_to_player: false}
  - {id: rank_purifier, title: "심문 사제 (정화청)", duties: "징후 조사, 심문, 화형 요청", privileges: "검은 끈 성표, 무허가 이동, 구금권", open_to_player: false}
  - {id: rank_chain_priest, title: "사슬사제", duties: "교구 사목, 경전 낭독, 고해", privileges: "인간 중 유일한 합법 문해자(낭독문 한정), 쇠사슬 성표 + 등불", open_to_player: true}
  - {id: rank_ring_keeper, title: "고리지기", duties: "예배 준비, 밀고 접수, 성표 판매", privileges: "쇠고리 두 개, 배급 1.2배, 낭독 불가", open_to_player: true}
  - {id: rank_hymn_pilgrim, title: "찬송 순례자", duties: "순회 찬송, 소문 운반", privileges: "통행 허가증, 순례 지팡이", open_to_player: true}
  - {id: rank_believer, title: "성표 신도", duties: "안식일 예배, 고해, 일곱 번의 기도(루멘)", privileges: "쇠사슬 고리 하나 — '다음 생'의 약속", open_to_player: true}
# 플레이어의 사다리: 성표 신도 → 고리지기(사슬사제 추천 + 루멘 순례 1회, 첫 임무 '이상한 꿈을 말하는 아이를 보고하라')
# → 찬송 순례자(등불관 허가증) → 사슬사제(낭독문 300구절 암송 시험 — 잔향은 이 시험을 너무 쉽게 통과해 잿빛 저울의 눈에 띈다).

law:
  crimes:
    - {act: "기도 불참 3회 누적", punishment: "고해 광장 공개 고해", note: "신도(인간) — 루멘. 지방 교구는 안식일 불참 2회"}
    - {act: "사제 아닌 자의 경전 낭독", punishment: "금식 7일 + 등불 심문소 심문", note: "인간"}
    - {act: "글자 소지 (쪽지·막대 글씨 포함)", punishment: "화형. 공식적으로 사제도 예외 없음 — 실제로는 '낭독문 필사'라는 이름으로 사제는 넘어간다", note: "인간. 재의 법"}
    - {act: "에오르의 이름을 입에 올림", punishment: "혀 지짐", note: "인간. 교리상 신은 '아우렐, 빛의 일자'뿐이다"}
    - {act: "잔향 징후 (눈의 잿빛 얼룩, 오지 않은 일을 말하는 꿈, 이상한 학습 속도)", punishment: "세 질문 → 잿빛 저울 → 화형 또는 잿빛 탑·영혼 정원 인계", note: "인간. AS 213 이후 '징후자 1인당 맹약 보상금 3비늘'이 고발을 부른다. AS 213 이후 화형 약 6,100명, 그중 잔향 0"}
    - {act: "이단 — 다른 내세·다른 신을 말함 (회색 순례자의 '재가 신의 몸', 빛의 서신)", punishment: "투옥(침묵의 우물) → 공개 철회 거부 시 화형", note: "인간·사제 모두. 사제는 성표의 고리를 하나 끊는 '강등 의식' 뒤 처벌"}
    - {act: "밀고 거부 (고리지기·사슬사제가 징후 보고를 숨김)", punishment: "성표 박탈, 공물 명단 등재", note: "성직자 대상 — 끊어진 고리가 가장 많이 걸리는 죄"}
    - {act: "허가 없는 결혼", punishment: "둘 다 다른 성지로 분리", note: "인간 신도"}
    - {act: "사제가 대성당 안에서 성표를 벗음", punishment: "금식 3일, 재범 시 강등", note: "성직자"}
    - {act: "고해 내용 누설 (공식 교리)", punishment: "강등", note: "성직자 — 정화청으로의 '누설'은 관례상 죄가 아니다. 이중 잣대 자체가 끊어진 고리의 공격 지점"}
    - {act: "엘다르 감독관의 그림자를 가로지름", punishment: "공개 고해 + 금식 1일", note: "인간 — 엘다르는 처벌하지 않는다. 교단이 대신 처벌한다"}

customs:
  greeting: "신도끼리: '빛이 사슬을 비추기를.' — 답: '사슬이 빛을 지키기를.' 사제에게는 성표를 쥐고 고개를 숙이며 '등불 아래 엎드립니다.' 사제는 신도의 정수리에 손가락 두 개를 대고 '견디어라'라고만 한다. 엘다르 감독관을 만나면 인간은 말없이 세 걸음 물러나 무릎을 꿇는다."
  taboos:
    - "에오르의 이름 — '그분'조차 아니고, 아예 없는 것으로 친다. 신은 아우렐뿐"
    - "영원등 쪽으로 등을 돌리기, 영원등 앞에서 숨을 세게 쉬기"
    - "'돌아오지 않는다', '끝'을 신도 앞에서 말하기 — 교리의 핵심(다음 생)을 부정하는 말"
    - "재의 날에 불을 켜기 — 교단은 이날을 '인간이 세계를 찢은 날'의 속죄일로 지킨다"
    - "성표의 고리를 일부러 벌려 두기 — 끊어진 고리의 표식. 정화청이 눈여겨본다"
    - "꿈 이야기 — 특히 아이가 '오지 않은 일'을 꿈꾸었다고 말하는 것. 부모는 아이 입을 막는다"
  rites:
    - {name: "안식일 예배", when: "6일째마다", what: "사슬사제가 승인된 낭독문 한 구절을 낭독하고 신도는 '견디어라'를 세 번 따라 한다. 노예에게 유일한 쉬는 날이자 유일한 합법 집회"}
    - {name: "성표 서약", when: "일곱 살 되는 해 파종월", what: "아이 목에 쇠사슬 고리 하나를 건다. '나는 견디고 다음 생에 빛이 된다.' 고리 값 3못은 주인이 낸다 — 주인에게 이 의식은 재산 등록이다"}
    - {name: "성 마렌 축일", when: "꽃월 12일", what: "루멘 강변에 순례자 3만이 사슬 감긴 등불을 든다. 대사제가 설교한다 — AS 313에는 그레고르 7세가 마렌의 '두 번째 설교'를 낭독할지가 걸려 있다"}
    - {name: "정화", when: "정화청이 정한 날 (가을에 잦다)", what: "정화의 뜰 화형. 신도는 참석해 '그의 고난이 그를 정화하기를'을 외친다. 재는 은빛 강에 뿌린다"}
    - {name: "빈 사슬의 밤", when: "대사제 사망 시", what: "등불관 일곱이 영원등 앞에서 밤을 새우고 대사제의 흰 사슬을 한 겹씩 풀어 제단에 놓는다"}
    - {name: "재의 날 금불", when: "연말 5일", what: "모든 불을 끈다. 영원등만 탄다. 신도는 '우리 피가 세계를 찢었다'를 외우고 굶는다 — 이름 없는 자들은 같은 날 몰래 아스테리온을 기린다"}
  speech: "사제는 엘다르가 승인한 낭독문의 높은 말씨('~하리라', '~할지니')를 일상에서도 섞고, 신도에게는 단정한 반말, 엘다르에게는 극존칭에 고개를 든 적 없는 문장. '신' 대신 '빛', '죽음' 대신 '정화', '노예' 대신 '견디는 자'라고 한다. 신도는 '다음 생에는'이라는 말을 위로처럼 달고 산다. 정화청 사제는 질문을 세 개씩 묶어 말한다."

membership:
  join: "인간이라면 일곱 살에 성표를 걸어 누구나 신도가 된다(선택이 아니다). 고리지기: 사슬사제의 추천 + 루멘 순례 1회 + 첫 임무 — '이웃 중 이상한 꿈을 말하는 아이를 정화청에 보고하라'(HOUSES §5.1). 사슬사제: 고리지기 5년 + 낭독문 300구절 암송 시험 + 등불관의 서품. 정화청 심문 사제는 사슬사제 중 '밀고 접수 실적'으로 뽑힌다."
  leave: "나갈 수 없다 — 성표를 벗는 인간은 이단이다. 사제는 '강등 의식'(성표 고리 하나를 끊는다)으로 신도로 떨어진다. 유일한 출구는 죽음, 탈주(모르바), 또는 회색 순례자 — 모두 이단."
  signs: ["목의 쇠사슬 성표 — 고리 수가 신분(신도 1, 고리지기 2, 사슬사제 사슬+등불, 등불관 흰 사슬 세 겹, 대사제 일곱 겹, 정화청 검은 사슬·검은 끈)", "찬송 순례자의 지팡이와 통행 허가증(동판)", "헌금 쪽지(교단 동판)", "정화청 사제는 등불을 들지 않는다 — 대신 쇠 집게를 찬다"]

