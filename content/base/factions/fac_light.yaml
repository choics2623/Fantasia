# 순종의 빛 — 엘다르가 인간에게 만들어 준 신정(神政). 인간이 합법적으로 모일 수 있는 유일한 조직.
# 근거: HOUSES §5.1·§4.6·§3.1.5·§6.1, WORLD_BIBLE §6.1·§1.6·§2(AS 87·213·303), REGIONS §4(루멘), CHARACTERS R04, facts/lumen.yaml.
# id 규칙은 fac_eldar.yaml(다른 작가)과 맞춘다: 이 세력의 id는 fac_light.
id: fac_light
name: 순종의 빛 (교단)
kind: faith
race: [인간(사제·신도), 엘다르(외부 후견 — 빛실 가지)]
governance: 신정 (경전 해석권을 쥔 사제단 + 외부 후견인의 감수권)
motto: "고난은 정화다. 사슬은 등불을 지킨다."
seat: 루멘 사슬등불 대성당 (lumen__cathedral) — 정화청 본거지 등불 심문소 (lumen__inquisition), 빛의 지하 감옥 '침묵의 우물' (lumen__undercroft)
size:
  members: "성직자 약 4,000 (사슬사제 약 900, 고리지기 약 2,500, 찬송 순례자 약 600) / 루멘 수도자 2,000·서원 견습 400 / 성표 신도 — 용제국 인간의 대다수(약 30만이 성표를 건다)"
  territory: "루멘 성도(인구 약 45,700)와 일곱 대교구(루멘·바알카르·북부·잿불 언덕·은빛 강·세렌·서부 평원). 영지는 없다 — 사람의 머릿속이 영토다"
  wealth: "성표 판매(1개 3못, 주인이 대신 지불), 순례 허가증(1발톱), 헌금 쪽지(교단 발행 동판 — 대륙 유일의 합법 인간 '돈'), 엘다르 후원 물자 연 2,000비늘 상당"
  force: "무장 없음(인간 무기 금지). 대신 정화청 심문 사제 40, 목줄단 정보원 약 200(루멘), 대륙의 고해실 수천 개, 화형 집행 요청권 — 집행은 용인 수비대(루멘 300)와 각 영주의 손"

decision: >
  교리는 사람이 아니라 경전이 정한다는 것이 공식 입장이다. 실제 결정은 세 층에서 난다.
  ① 일곱 등불 회의 — 대사제와 등불관 일곱이 1년에 두 번(꽃월 성 마렌 축일 전야, 낙엽월 수확 공물 뒤) 대성당 종탑 아래 '사슬방'에서 모인다.
  등불관 일곱이 흰 사슬(찬성)과 검은 사슬(반대)을 제단 그릇에 던져 다수로 정하고, 대사제는 동수일 때만 던진다.
  정화청장은 등불관 자격으로 한 표를 가지며, 이단·징후 안건은 그만 상정할 수 있다(상정권 독점).
  ② 교리 감수 — 회의를 통과한 교리·낭독문 변경은 엘다르 교리 감수관(빛실 가지)의 '금실 표시'를 받아야 효력이 난다. 금실이 오지 않으면 안건은 '아직 빛이 닿지 않음'으로 무기한 보류된다 — 사실상의 절대 거부권.
  ③ 정화청 즉결 — 징후자 심문·이단 고발·화형 집행 요청은 회의를 거치지 않는다. 정화청장이 서명하고 대사제가 확인 서명하면 끝이다(대사제는 미룰 수만 있다 — 그레고르 7세는 알베릭의 처형 서명을 1년째 미루고 있다).
  임시 회의는 대사제 또는 후견인이 '등불을 든다'(대성당 종을 일곱 번 친다)로 소집한다. 대사제가 의식이 없는 날이 길어 AS 312 현재 회의의 실권은 회의 서기를 겸하는 정화청장에게 기울었다.
succession: >
  대사제가 죽으면 영원등 앞에서 등불관 일곱이 '빈 사슬의 밤'을 지내고, 사흘 뒤 일곱 등불 회의가 후보 둘을 흰 사슬로 뽑아 올린다.
  후견인(빛실 가지)이 둘 중 하나에 금실을 감으면 그가 대사제다 — 실제로는 후견인과 루멘 수석 감독관이 미리 정한다.
  AS 312 현재 후보는 마테우스(정화청장, 세레니엘이 민다)와 마티아스 회색손(은빛 강 등불관, 개혁파). 그레고르 7세가 죽는 날 마테우스가 즉시 알베릭의 처형에 서명한다(fact_lu_gregor_delays_signature).
  등불관 자리는 대사제가 사슬사제 중에서 지명하고 후견인이 확인한다. 공석은 대리(수녀·사슬사제)가 맡는다 — 북부 등불관은 AS 309부터 공석이고 수녀 아델이 대리한다.
  사슬사제는 교구 고리지기 중에서 등불관이 서품한다(낭독문 300구절 암송 시험). 고리지기는 사슬사제 추천 + 루멘 순례 1회.

