    title: 두 번째 설교 낭송자
    holder: npc_alberic
    reports_to: null
    powers: ["두 번째 설교의 낭송과 전수", "'빛의 서신' — 설교를 글로 옮긴 편지의 작가", "벽 두드림 문자의 창안"]
    chosen_by: "전대 낭송자의 전수 — 성 마렌의 숨은 후손"
    perks: ["침묵의 우물 감방(9년째)"]
  - id: off_candle_keeper
