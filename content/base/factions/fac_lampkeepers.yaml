# 등잔지기 — 성 마렌의 숨은 피. 인간 숨은 혈통: '두 번째 설교'를 입으로 외워 잇는다.
# 근거: HOUSES §4.6, history 카드(npc_st_maren), lumen 카드(npc_alberic, npc_gregor7, npc_vera), facts/lumen.yaml·history.yaml.
id: fac_lampkeepers
name: 등잔지기 (성 마렌의 숨은 후손)
kind: house
secret: true
race: [인간(평범)]
governance: 설교 낭송 사슬  # 한 줄의 설교를 한 사람이 다음 한 사람에게 입으로 넘긴다 — 글자로는 넘기지 않는다
motto: "사슬을 감은 것은 등불이 아니라 손이다. 손은 풀 수 있다."
seat: "루멘 — 대성당 양초 공방(촛불지기), 침묵의 우물(알베릭의 감방), 마렌의 관 아래(첫 성표)"
size:
  members: "알베릭(58, 투옥), 한나(58, 누이), 엘리(26, 아들). 설교를 들은 사람은 베라 외에 소수"
  territory: "없음 — 루멘 대성당의 양초 공방과 촛불 그릇들, 감방의 벽"
  wealth: "마렌의 첫 성표(일곱 고리 중 하나가 벌어진 쇠사슬 고리 — 대성당 제단 아래 마렌의 관 안), 두 번째 설교, 알베릭의 '빛의 서신' 2장(감방 벽)"
  force: "없음. 그레고르 7세가 알면서도 죽이지 못한다는 사실이 유일한 방패"

decision: >
  등잔지기의 결정은 하나다 — 누가 설교를 이을 것인가. 설교 낭송은 사슬이고, 낭송자는 한 번에 한 명이다. 낭송자가 후계를 정해 입으로만 설교를 넘긴다.
  넘기는 날은 성 마렌 축일(꽃월)이고, 넘길 때는 후계가 설교를 한 줄도 틀리지 않고 되읊어야 한다. 한 줄이라도 틀리면 그해의 전수는 미뤄진다.
  거부권은 '침묵'이다 — 낭송자가 입을 다물면 설교는 그 대에서 끝난다. 알베릭이 9년째 감방에서 설교를 머릿속에만 지니고 글로 옮기지 않는 이유다(실제로는 '빛의 서신'으로 옮겨 규약을 어겼고, 그 틈에 집안이 갈라졌다).
  외부의 결정에는 개입하지 않는다 — 대사제 그레고르 7세가 마렌의 두 번째 설교를 낭독할지 고민하는 일은 등잔지기가 정할 수 없고 기다릴 수 있을 뿐이다.
succession: >
  낭송자는 마렌의 딸(AS 108 첫 낭송을 받은 사람)부터 이어져 왔다. 알베릭이 투옥된 지금 낭송자는 알베릭이고, 후계는 누이 한나와 그녀의 아들 엘리(26)이다.
  알베릭이 죽으면 한나가 잇고, 한나가 죽으면 엘리다. 알베릭이 벽 두드림으로 글을 가르친 베라(잘못 고발된 징후자)는 후계가 아니지만 '듣고 쓸 수 있는' 사람이 되었다.
  혈통은 잔향을 잇지 않으므로 등잔지기도 평범한 인간이다 — 그들의 힘은 입과 기억뿐이다.

offices:
