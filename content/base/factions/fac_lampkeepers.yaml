  leave: "나갈 수 없다 — 설교를 한 번 들으면 그 사람은 사슬의 일부다. 설교를 잊는 것으로만 떠난다."
  signs: ["일곱 고리 중 하나가 벌어진 쇠사슬 고리(마렌의 첫 성표 — 원본은 관 안)", "'등불은 누가 켰나?' '손이 켰다.'", "양초 한 줄", "벽 두드림 문자"]

