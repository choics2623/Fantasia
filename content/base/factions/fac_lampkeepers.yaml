    chosen_by: "혈통 — 같은 해에 태어난 쌍둥이 누이"
    perks: ["대성당 출입 — 양초 공방의 합법적 자리"]
  - id: off_ring_keeper
    title: 고리지기 (연락과 운반)
    holder: npc_lm_eli
    reports_to: off_candle_keeper
    powers: ["끊어진 고리의 연락", "설교를 외우는 후계 후보"]
    chosen_by: "한나의 아들"
    perks: []
  - id: off_tap_student
    title: 벽 두드림 제자 (듣고 쓰는 자)
    holder: npc_vera
    reports_to: off_reciter
    powers: ["벽 두드림으로 알베릭에게 글을 배운다(읽고쓰기 35)", "설교의 일부를 '듣고 쓴다'"]
    chosen_by: "알베릭의 선택 — 옆 감방 — 후계가 아닌 제자"
    perks: []
  - id: off_first_token
    title: 마렌의 첫 성표 지킴이
    holder: npc_lm_beate
    reports_to: off_reciter
    powers: ["일곱 고리 중 하나가 벌어진 쇠사슬 고리 — '끊어진 고리' 신도회 이름의 기원"]
    chosen_by: "공석 — 대성당 제단 아래 마렌의 관 안에 있다고 '전해진다'. 누구도 확인하지 못했다"
    perks: []
  - id: off_silent_protector
    title: 알면서 죽이지 못하는 자 (외부 — 대사제)
    holder: npc_gregor7
    reports_to: null
    powers: ["알베릭의 처형 서명을 1년째 미룬다", "성 마렌 축일(AS 313 꽃월)에 두 번째 설교를 낭독할지 고민한다"]
    chosen_by: "외부 — 등잔지기가 아니다. 대사제는 알베릭이 마렌의 후손이라는 사실을 안다"
    perks: []
  - id: off_maren_daughter
    title: 마렌의 딸 (첫 낭송자 — AS 108)
    holder: null
    reports_to: off_reciter
    powers: ["없음 — 설교를 처음 받은 사람. 입은 서명할 수 없다는 이유로 마렌이 딸에게만 남겼다"]
    chosen_by: "공석(고인) — 전통의 시작"
    perks: []

ranks:
  - {id: rank_reciter, title: "낭송자", duties: "두 번째 설교를 외우고 한 명에게만 전한다", privileges: "성표의 이야기를 안다", open_to_player: false}
  - {id: rank_candle, title: "촛불지기·고리지기", duties: "연락과 보호, 설교를 외우는 후계 후보", privileges: "양초 공방의 합법적 자리", open_to_player: false}
  - {id: rank_listener, title: "들은 자 (설교를 들은 사람)", duties: "밀고하지 않는다", privileges: "등잔지기의 보호 — 촛불 한 줄", open_to_player: true, condition: "성 마렌 축일(꽃월)에 촛불 한 줄을 켜고 암호('사슬을 감은 것은?' '손.')를 받는다. 알베릭이나 한나가 설교를 들려준다. 플레이어가 '진짜'를 알면 낭송자가 후계에 포함시킬 수 있다"}

law:
  crimes:
    - {act: "두 번째 설교를 글자로 적음", punishment: "집안 규약상 전수 정지. 알베릭의 '빛의 서신'이 정확히 이 죄를 짓고 있다 — 집안이 갈라진 이유", note: "집안 규약. 제국·루멘 법상 글은 사형 / 루멘은 사제만 경전 낭독을 허용"}
    - {act: "허락 없이 낭송함(낭독)", punishment: "낭송자가 가르침을 거둔다", note: "집안 규약 — 대사제 그레고르 7세가 낭독하기로 결정하면 예외"}
    - {act: "마렌의 후손임을 밝힘", punishment: "정화청의 처형 대상 — 그레고르가 서명하지 않는 동안만 안전", note: "집안 규약 — 비밀 이름(등잔지기)도 성(姓)을 참칭한 죄"}
    - {act: "마렌의 첫 성표를 열어 확인하려 함 (제단 아래 관)", punishment: "교단의 신성모독 — 화형. 집안은 '전해지는 대로 두라'", note: "교단법과 집안 규약"}
    - {act: "설교를 낭송하다 한 줄을 틀림", punishment: "그해의 전수가 미뤄진다 — 한 줄도 틀리지 않아야 한다", note: "집안 규약"}
    - {act: "교리 셋째 장의 서명을 마렌의 글이라고 주장함", punishment: "교단은 이단으로, 집안은 침묵으로 대한다 — 서명만 했다는 기록은 루멘 서고에 있다", note: "교단법. 집안은 서명을 부정하지 않는다 — 입은 서명할 수 없었다"}

customs:
  greeting: "성표를 만지며 '등불은 누가 켰나?' — 답은 '손이 켰다.' 확인이 필요하면 '사슬을 감은 것은?' '손.'"
  taboos:
    - "설교를 글로 적는 것"
    - "마렌을 '성인'이라 높이거나 '창시자'라 낮추는 것 — 등잔지기는 '아버지의 아버지'라 한다"
    - "촛불을 두 줄 켜는 것(한 줄이 한 사람이다)"
    - "알베릭의 '빛의 서신'을 읽고 있다고 말하는 것"
  rites:
    - {name: "성 마렌 축일 낭송", when: "꽃월 (313년: 흰 알 부화 예정 달)", what: "촛불 한 줄을 켜고 두 번째 설교를 속으로 낭송한다. 후계가 소리 없이 입 모양으로 되읊는다"}
    - {name: "전수", when: "성 마렌 축일", what: "낭송자가 후계의 귀에 설교를 한 번 속삭이고 후계가 한 줄도 틀리지 않고 되읊는다"}
    - {name: "양초 한 줄", when: "누가 죽은 날", what: "양초 한 줄을 켜 둔다 — 감방 안에서도 한나가 양초 조각을 몰래 전한다"}
    - {name: "벽 두드림", when: "매일", what: "알베릭이 옆 감방 베라에게 두드림으로 글자와 설교를 가르친다"}
  speech: "낮고 조용하다. 설교의 문장은 소리 내어 인용하지 않고 입 모양과 눈짓으로 전한다. 교단 어휘('등불', '성표', '고난은 정화')를 그대로 쓰되 한 단어씩 다른 의미를 건다 — '등불'은 사람, '손'은 자유. 반문의 형식으로 말한다."

membership:
