  leave: "인간은 약속에 걸었던 것(기억·목소리·이름의 첫 글자)을 내고 숲 밖 길을 산다. 페이는 잊혀지면 사라지거나 진실을 말하게 되어 떨어진 자로 추방된다."
  signs: ["가시 한 가닥의 초대장", "그림자가 몸과 다르게 움직인다", "별명(진짜 이름은 숨김)", "철 못(인간이 숲에서 지키는 표식)", "돌 세는 자들의 조약돌 달력"]

