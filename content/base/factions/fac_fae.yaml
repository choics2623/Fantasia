# 페이 가시 궁정 — 꿈 혈명('변덕')의 굴레(진실을 말하면 그 말에 묶인다)가 만든 약속의 궁정.
# 근거: HOUSES §3.9, RACES §15, REGIONS §6, facts/thornmist.yaml.
# 조정: 바꿔치기 장인의 이름이 문서마다 다르다 — HOUSES '실뜨기', REGIONS '유리 손가락 부인', RACES '은방울 부인'. 여기서는 셋 모두 '자리의 별명'으로 본다 (보고).
id: fac_fae
name: 페이 가시 궁정 (가시 왕관의 궁정)
kind: polity
race: [페이 — 여름 궁정, 겨울 궁정, 붉은모자, 픽시, 바꿔치기, 인간 장난감·돌아온 아이]
governance: 약속 궁정 — 거울 전언제  # 직위는 약속의 형태이고 모든 결정은 반대로 전해지거나 농담으로 판결된다
motto: "웃어라, 아니면 약속하라. (페이는 가훈을 말하지 못한다 — 이것은 인간이 붙인 말이다)"
seat: 가시 궁정 (가시안개 숲 중심 — 왕좌 뒤 가시 속에 '웃음의 상자')
size:
  members: "이름 있는 페이 약 4,000(RACES) — 셀 수 없는 작은 이. 인간 장난감·하인 580~1,500, 바꿔치기 아이 출신 120, 두번째 엄마들의 마을 약 40"
  territory: "가시안개 숲 — 숲 안의 1년이 하룻밤일 수 있다. 안개 장터, 옛 돌 고리(회색여울 근처)가 숲 밖의 접점"
  wealth: "화폐 없음 — 약속과 대가. 안개 장터 시세(기억·웃음·이름의 첫 글자·목소리). 저주받은 유물이 세렌 암시장에 흘러나옴"
  force: "환영, 길 잃게 하기, 계약 함정. 쇠 무기를 든 무리는 숲이 삼킨다. 정면 전투는 하지 않는다"

decision: >
  페이는 진실을 말할 수 없거나 말하면 그 말에 묶인다. 그래서 궁정의 결정은 '말'이 아니라 '약속의 형태'로 존재한다.
  여왕은 한 마디 하고, 그 말은 첫째 원의 거울 시녀 셋('어제', '아니', '혹시')이 거꾸로 전한다 — 시녀의 말이 진실일 수 있는 것은 그 때문이다.
  전해진 말은 궁정이 '웃음'으로 받는다. 웃음 재판관(판사 휘파람)이 안건을 농담의 형태로 판결하고, 궁정이 세 번 웃으면 그 판결이 법이 된다.
  거부권은 '지루하다'다. 한 페이가 안건에 '지루하다'고 말하면 그 안건은 흥미를 잃어 사라진다 — 여왕이 가장 두려워하는 말이다.
  직위는 계절마다 바뀔 수 있고, 약속이 이행되면 그 자리가 사라진다(공석이 아니라 소멸). 칭호로만 불리고 진짜 이름은 이름 수집가가 보관한다.
  정기 회기는 긴밤월 '가시 무도회' — 여왕의 궁정이 열리는 밤이며 숲 밖 인간이 가시 한 가닥의 초대장을 받는 경우가 있다.
  인간은 의제가 아니다. 인간은 장난감이고 약속의 상대다. 계약 연회에서 음식을 먹으면 무엇을 주기로 했는지는 나중에 안다.
succession: >
  여왕 자리는 이은 적이 없다 — 신살 때 웃은 자 그대로다. 여왕의 지지(계승 위기에서 '가장 재미있는 쪽')는 현재 카스파르다('잡종 왕이라니, 웃기잖아').
  여왕의 진명은 시대의 마지막 장에서만 말할 수 있고, 그 전에 추측한 자는 그녀의 것이 된다. 잔향이 모든 이름을 말하는 날 그 이름도 불리고, 그것이 죽음인지 해방인지는 여왕도 모른다.
  하위 직위는 계절의 놀이에 따라 바뀐다 — 가장 오래 기억되는 자가 높다. 잊혀진 페이는 사라진다.

