ranks:
  - {id: rank_queen, title: "여왕", duties: "한 마디", privileges: "이름을 부르면 안 되는 자", open_to_player: false}
  - {id: rank_high_one, title: "높은 이 (이름 있는 페이 — 궁정 귀족)", duties: "궁정의 직위, 약속의 이행", privileges: "얼마나 오래 기억되는가로 서열", open_to_player: false}
  - {id: rank_named_fae, title: "이름 있는 페이", duties: "궁정의 놀이", privileges: "칭호만 쓰며 진짜 이름은 숨긴다", open_to_player: false}
  - {id: rank_small_one, title: "작은 이 (픽시 등)", duties: "장난, 전령", privileges: "없음", open_to_player: false}
  - {id: rank_changeling, title: "바꿔치기 (페이 아이)", duties: "인간 아이와 맞바뀌어 인간 사이에서 산다", privileges: "페이어를 배우며 큼", open_to_player: false}
  - {id: rank_toy, title: "장난감 (인간)", duties: "페이가 부르면 춤추고 노래하고 수수께끼를 맞히고 짐승이 된다", privileges: "페이의 음식 — 세 번 먹으면 숲 밖 음식이 재 맛이 난다", open_to_player: true, condition: "초대 없이 궁정에 들어서거나 계약 연회에서 음식을 먹는다. 쇠를 들지 않고 이름을 숨긴다"}
  - {id: rank_returned, title: "돌아온 아이 (바꿔치기 출신 인간)", duties: "없음 — 숲에서 자라 몇 년 뒤 돌려보내진다", privileges: "페이어 단어 몇 개, 숲의 안전한 길을 안다", open_to_player: true, condition: "플레이어가 잔향이 이식을 거부하는 판정(D −20)을 거쳐 출신이 될 수 있는 길 — 일반 인간은 대개 꺼려진다(목줄단이 마녀로 밀고하기 쉽다)"}

law:
  crimes:
    - {act: "약속 위반", punishment: "약속에 걸었던 것을 강제로 빼앗긴다", note: "페이·인간 모두. 집행자는 약속 그 자체. 한 번 '약속한다'고 하면 페이 자신도 깰 수 없다"}
    - {act: "'고맙다'고 말함", punishment: "빚이 생긴다 — 상대 페이가 아무 때나 갚으라고 할 수 있다", note: "인간 대상 (금기)"}
    - {act: "진짜 이름을 말함", punishment: "이름 수집가가 그 이름을 가져간다", note: "양쪽 모두. 스스로 지은 이름을 가진 자는 '이름 빼앗기'에 면역"}
    - {act: "여왕의 이름을 부름", punishment: "여왕의 주의 — 결과 무작위(대개 끔찍함)", note: "양쪽 모두"}
    - {act: "초대 없이 궁정 진입", punishment: "장난감이 된다", note: "인간 대상. 집행 세 번 웃는 기사"}
    - {act: "철(쇠)을 지니고 들어옴", punishment: "길이 닫힌다 — 안내도 받을 수 없다. 철은 실제 보호 수단", note: "인간 대상"}
    - {act: "공짜 선물을 받음 / 선물 거절의 무례", punishment: "받으면 빚(페이에게도), 거절하면 역린 — 모욕", note: "양쪽 모두"}
    - {act: "'진실을 말하라'고 강요하는 요구에 응함 / 강요에 성공함", punishment: "응한 페이는 그 말에 묶이고, 강요한 자도 같은 말에 묶인다", note: "페이 대상 — 강요한 인간도 묶인다"}
    - {act: "진실을 말하게 되도록 인간과 너무 오래 놂", punishment: "추방 — 떨어진 자가 된다", note: "페이 대상"}
    - {act: "지루하게 만듦", punishment: "여왕의 흥미를 잃은 안건·자는 '사라진다'", note: "양쪽 모두 — 가장 큰 불경"}

customs:
  greeting: "인사 대신 수수께끼나 반대말을 던진다. 이름 대신 별명을 말하고 상대의 별명을 먼저 묻지 않는다. '고맙다'를 말하는 순간 빚이 생기므로 감사는 '재미있었다'로 한다. 계약 연회의 첫 음식은 한 입만."
  taboos:
    - "여왕의 이름을 부르는 것 — 부르면 여왕이 온다"
    - "공짜 선물을 받는 것, '고맙다'고 말하는 것"
    - "쇠(대장간에서 두드린 쇠)를 궁정에 들이는 것"
    - "'진실을 말하라'는 요구에 응하는 것, 스스로 지은 이름을 가진 자에게 거짓 이름을 붙이는 것"
    - "원 안으로 발 들이기(버섯 고리), 거울 보기, 음식 세 번"
  rites:
    - {name: "가시 무도회", when: "긴밤월", what: "여왕의 궁정에서 열리는 무도회. 숲 밖 인간이 가시 한 가닥의 초대장을 받기도 한다"}
    - {name: "계약 연회", when: "수시", what: "연회에서 음식을 먹으면 계약이 성립한다 — 무엇을 주기로 했는지는 나중에 안다"}
    - {name: "바꿔치기", when: "수시(요람의 아기)", what: "인간 아기를 데려가고 나무토막이나 작은 이를 놓아둔다. 몇 년 뒤 돌려보내기도 한다(돌아온 아이)"}
    - {name: "칭호 교체", when: "계절마다", what: "직위가 놀이처럼 바뀐다. 약속이 이행되면 자리가 사라진다"}
    - {name: "웃음 판결", when: "계약 위반 시", what: "웃음 재판관이 농담으로 판결하고 궁정이 세 번 웃으면 법"}
