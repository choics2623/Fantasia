player_paths:
  - "서기 노예로 편입 — 숫자와 기호만 배운 척하며 서고에 들어, 이삭과 접촉한다 (이름 없는 자들의 등잔 후보)"
  - "볼드 사본 — 찬가 7단계 '잔향의 진실 공개'의 핵심 증거. 봉인 서가 일곱째 칸(이레네만 연다)을 향한 침투 또는 이삭의 필사본"
  - "이레네 — 진실을 알고도 쓰지 않는 학자. 잔향을 독점하려 하면 멜리산드가 이탈 (표 −5)"
  - "클로틸데 — 균열학파. 황무지 경계의 측정 데이터가 증언이 된다"
  - "테오 — 공식 연대기. 연대기와 사본의 차이를 폭로하는 길"
regression:
  fixed:
    - "볼드 사본이 봉인 서가 일곱째 칸에 있다, 이삭이 필사한 적이 있다"
    - "이레네가 낙엽월 안에 장부에 '설명되지 않는 기시감. 북쪽.'을 쓴다 (회차가 쌓일수록 더 일찍)"
    - "셋째 시험 14명 사망, 시간 유리 칼 '마지막 금'은 한 번도 쓰이지 않았다"
  flow:
    - "서고 점검, 시험 일정, 균열 측정 일자"
  drift:
    - "이삭이 그날 필사하는 문서"
    - "클로틸데가 황무지 경계에서 측정하는 시각"
