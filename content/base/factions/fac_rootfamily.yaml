# 뿌리집 — 실바렌 정원지기 혈통. 인간 숨은 혈통: 꽃 이름 아래 숨긴 '뿌리 이름'을 어머니의 귓속말로 잇는다.
# 근거: HOUSES §4.7, REGIONS §5, silvaren 카드(npc_mira, npc_liandel), facts/silvaren.yaml·history.yaml.
id: fac_rootfamily
name: 뿌리집 (엘다르가 붙인 꽃 이름 아래의 뿌리 이름)
kind: house
secret: true
race: [인간(정원 인간 — 평범)]
governance: 귓속말 계보 — 자장가 신호  # 모일 수 없는 사람들이 노래 한 줄의 변화로 결정을 전한다
motto: "뿌리는 아래에 있다."
seat: "실바렌 영원 정원 — 이슬 우리(eternal_garden__dew_pens)의 식당 아궁이 돌 뒤, 새벽 온실(영혼 정원 인접)"
size:
  members: "하라(30), 토빈(8), 몰리(65) — 정원지기 약 3,100 중 뿌리 이름을 아는 집이 수백. 이슬 노래 회원(별개 모임) 약 80"
  territory: "없음 — 정원 밖으로 나가지 못하는 사람들의 이슬 우리와 숙소"
  wealth: "정원 지도 노래 「물푸레 아래」(정원의 길·문·경비 교대 시간을 가사로 담은 자장가), 뿌리 이름 수백 개의 구전, 첫 불씨의 손가락 놀이"
  force: "없음. 대륙에서 가장 철저하게 갇힌 사람들 — 가장 잘 먹고 가장 아름다운 옷을 입고"

decision: >
  뿌리집은 모일 수 없다. 정원지기는 엘다르와 세 걸음 거리를 두어야 하고, 엘다르가 묻기 전에 말하지 못하며, 정원 밖으로 나갈 수 없다(침묵 서약).
  그래서 결정은 말이 아니라 자장가다. 어머니들이 밤마다 아이 귀에 뿌리 이름을 속삭이며 자장가 「물푸레 아래」를 부르는데, 한 줄의 가사가 바뀌면 그것이 신호다.
  가사 한 줄이 바뀌고 이슬 우리의 어머니 서넛이 그 줄을 따라 부르면 합의가 선 것이다. 엘다르는 노래를 듣고도 의미를 모른다 — 인간의 노래를 '기억할 가치가 없다'고 여기기 때문이다.
  거부권은 '속삭임을 멈춤'이다. 한 어머니가 아이 귀에 뿌리 이름을 속삭이지 않으면 그 줄은 그 집에서 끊긴다.
  의제는 대개 이렇다 — 누구에게 뿌리 이름을 속삭이는가(아이가 몇 살이 되었는가), 누구를 숨기는가, 언제 경비 교대 노래를 바꾸는가.
  이슬 노래(회원 약 80)는 별도의 저항 모임이고 뿌리집과 사람이 겹친다 — 뿌리집은 이름을, 이슬 노래는 진명 조각의 음높이를 이어 간다.
succession: >
  어머니가 아이의 귀에 속삭인다. 뿌리 이름의 전수자는 대개 어머니이고 아버지는 짝지어진 사람이라 가끔 모른다(엘다르가 외모와 재능으로 짝을 지어 주므로).
  몰리(65)는 영혼 정원 피험자의 뿌리 이름을 외운다 — 그녀가 죽으면 그 이름들이 사라질 위기에 있다. 하라의 아들 토빈(8)이 이을 사람이지만 리안델과의 우정 때문에 위험하다.
  혈통은 잔향을 잇지 않으므로 뿌리집도 평범한 인간이다.

