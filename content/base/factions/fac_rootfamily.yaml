law:
  crimes:
    - {act: "엘다르어로 말함 / 꽃을 꺾음 / 정원 밖으로 나감 / 글자", punishment: "정지 7일 / 정지 3일 / 잊힘 / 잊힘", note: "엘다르 정원의 법 (REGIONS §5.7). 뿌리집도 인간으로서 똑같이 받는다"}
    - {act: "낮에 뿌리 이름을 부름", punishment: "집안이 그 아이에게 한 달 동안 속삭임을 멈춘다", note: "집안 규약 — 뿌리 이름은 밤에만"}
    - {act: "엘다르 앞에서 자장가 가사의 뜻을 설명함", punishment: "집안에서 노래를 가르치지 않는다 — 정원 지도가 드러난다", note: "집안 규약"}
    - {act: "아이에게 뿌리 이름을 다섯 살 이전에 속삭임", punishment: "경고 — 아이가 낮에 말할 위험이 크다", note: "집안 규약"}
    - {act: "손가락 놀이의 뜻을 글로 풀이함", punishment: "엘다르가 알게 되면 '잊힘'. 집안은 풀이한 자의 놀이를 가르치지 않는다", note: "집안 규약 — 놀이의 뜻은 잊힌 채로 둔다"}
    - {act: "피험자의 뿌리 이름을 집 밖에 누설함", punishment: "몰리의 장부(구전)가 끊긴다 — 집안 모두의 이름이 사라진다", note: "집안 규약"}
    - {act: "비밀 이름(뿌리집)을 엘다르 앞에서 말함", punishment: "엘다르는 이름 자체를 '기억해 두었다가' 경멸한다 — 정지 30일", note: "인간법 + 정원의 법"}

