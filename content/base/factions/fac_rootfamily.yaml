toward_echo: "기다리기. 이슬 노래를 지키는 80명은 '돌아오는 이'에게 노래를 넘기려 한다. 정원지기에게 플레이어는 손님이 아니라 '노래의 수령인'이다. 영혼 정원 접목 침대의 1순위 피험자가 되기 전에 정원에서 숨어야 한다."
player_paths:
  - "잠입: 경매 정자에서 정원지기로 팔려 들어가 「물푸레 아래」를 배운다 — 로즈비타가 대기 우리 열쇠를 가졌다"
  - "구출: 몰리가 외운 피험자 뿌리 이름 / 미라의 다섯 번째 옮김 의식(서리월 9일) 전에 빼낸다"
  - "연합: 실바누스의 부탁(영혼 정원 파괴)과 뿌리집의 보호 — 피험자 70명을 어떻게 할 것인가"
  - "우정: 리안델과 토빈의 몰래 우정을 지킨다 — 들키면 정원지기 마을 전체가 처벌된다"
regression:
  fixed: ["뿌리 이름 속삭임과 자장가 가사의 구조", "경매 정자 열쇠와 정원 수로 배수구", "미라의 다섯 번째 옮김 일자(서리월 9일)", "손가락 놀이 = 첫 불씨의 글자"]
  flow: ["토빈과 리안델의 우정이 들키는 정도", "이슬 노래 회원 수(약 80)", "몰리가 가르치는 뿌리 이름의 수"]
  drift: ["어느 정원지기가 짝지어지는가", "경비 교대 노래의 한 줄 가사", "정지(처벌) 당하는 사람"]
