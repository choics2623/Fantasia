    - {name: "자장가 「물푸레 아래」", when: "밤마다", what: "정원의 길·문·경비 교대 시간을 가사로 담은 자장가. 한 줄의 가사가 바뀌면 신호"}
    - {name: "손가락 놀이", when: "아이들의 낮 놀이", what: "'첫 불씨'가 가르친 글자 모양을 손으로 그린다. 뜻도 모른 채 3,000년째"}
    - {name: "빈 요람의 밤 낮은 노래", when: "AS 268 마지막 출생 기념일(해빙월 — 임시)", what: "엘다르가 침묵하는 날. 정원지기는 노래를 한 옥타브 낮추어 부른다"}
    - {name: "이슬 거두기", when: "새벽", what: "'첫 아침의 노래' 동안 무릎 꿇고 이슬을 거둔다 — 이 틈에 이슬 노래의 음높이를 확인한다"}
  speech: "정원의 어투 — 엘다르가 묻기 전에 말하지 않는다. 문장 끝에 꽃 이름을 붙이는 호칭('~, 은방울'). 존대는 정원의 서열(미리엘 → 반장 → 정원지기)을 따르고, 밤에 이슬 우리에서는 뿌리 이름으로 낮게 부른다. 낮의 말은 모두 '엘다르의 귀가 있다'는 전제로 한다."

