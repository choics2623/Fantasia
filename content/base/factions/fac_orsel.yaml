# 오르셀 백작가 — "강 위의 사슬". 정본: HOUSES §2.7, §6.3 / REGIONS §9(세렌), §1.10(은빛 강) / 몰락 중 순혈
# 오르셀은 이미 파산했다 — 몬달리 상가에 4,200두카트, 배·항구·노예가 담보. 백작은 꼭두각시, 실질 가주는 몬달리 파견 회계 고문 지올.
# 기준: AS 312 낙엽월 1일. 'unnamed:...'는 TODO-NPC.
id: fac_orsel
name: 오르셀 백작가
kind: house
race: [용인(순혈), 나가(몬달리 파견 회계 고문)]
governance: 봉건 위계 (채무 종속) — 이름은 백작가, 실제 결정은 채권자의 회계 고문
governance_note: >
  이 가문은 아직 용인 대가문의 모양을 하고 있다. 백작 마그누스는 자기가 아직 주인이라고 믿고 싶어 하고, 함대장은 노예선에서 태어났다는 농담을 싫어하고,
  백작 며느리 이브레아는 친정(레이번)을 살리려 남편의 장부를 훔쳐본다. 그리고 회계 고문 지올의 도장이 없는 지출은 단 한 건도 집행되지 않는다.
motto: "강은 결국 바다로 간다."
seat: "오르셀 나루 — 은빛 강 중류 항구 (바알카르~루멘~세렌 수운)"
size:
  members: "순혈 직계 3(+며느리 1) + 나가 회계 고문 1 + 선장·항만 관리 수십 + 크릭 '배밑' 감독 + 노예선 23척 승선 노예 수천"
  territory: "은빛 강 중류 항구 '오르셀 나루', 노예선 23척, 바알카르~루멘~세렌 수운 통행세"
  wealth: "표면적으로 통행세와 노예선 운임. 실제로는 몬달리 상가에 4,200두카트(AS 298~) — 배·항구·노예 전부가 담보로 넘어갔다. AS 296 세렌 계약민법으로 계약민 운송권 획득"
  force: "노예선 23척과 선원 — 군사력이 아니라 운송력. 지지율 3 (멜리산드). 몬달리가 채권을 회수하면 즉시 붕괴"

