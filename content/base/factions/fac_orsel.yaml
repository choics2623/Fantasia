decision: "표면: 백작이 서명하고 함대장이 항해한다. 실제: 지올의 도장이 찍히지 않은 서명은 집행되지 않는다. 가문 회의는 따로 없고 저녁 식탁에서 지올이 '오늘의 장부'를 읽는 것으로 대신한다. 몬달리가 채권을 회수하면 모든 결정이 한꺼번에 종료된다."
succession: "장자 상속이 형식. 백작이 죽으면 세바스찬이 이을 수 있으나 가문의 담보 일체가 몬달리에게 넘어갈 수 있다 — 상속 자체가 의미가 없다. 지올은 후계가 아니라 '청산 시기'를 정한다."

law:
  crimes:
    - {act: "노예선 배밑 노예의 탈출·사슬 이탈", punishment: "즉결 — 바다에 던진다 또는 다음 항해에서 노꾼으로", note: "인간"}
    - {act: "선원의 잿빛 실 내통", punishment: "처형 — 용인이면 가문 이름 삭제, 인간 선원이면 선상 처형", note: "'검은 물떼새' 호의 선원 둘이 내통 중이나 아직 발각되지 않았다"}
    - {act: "회계 고문의 도장 없는 지출", punishment: "집행 불가 — 명령 철회, 반복되면 해당 용인은 가문 이름 삭제", note: "실질 가주의 규칙"}
    - {act: "담보 목록에 오른 배·노예를 임의로 매각", punishment: "몬달리 상가와의 계약 위반 — 담보 즉시 압류", note: "용인·나가 모두"}
    - {act: "통행세 빼돌림", punishment: "항만 관리는 태형, 장부 대조 후 월급 정산", note: ""}
    - {act: "노예선 항해 중 사망률 허위 보고", punishment: "선장은 항해 봉급 삭감, 반복 시 퇴선", note: "평균 6%를 넘으면 세렌 쪽이 먼저 알아챈다"}
    - {act: "계약민을 '노예'로 칭한다 (세렌 항구에서)", punishment: "세렌 계약법상 위약 — 벌금", note: "AS 296 이후 운송 형식은 계약민"}

customs:
  greeting: "'물길은 어디까지?' — 항로가 안부다. 선장은 선수 앞에서 닻을 손바닥으로 두 번 친다. 백작 앞에서 지올은 나가의 습관대로 한 걸음 뒤에 서고, 용인들은 그것을 못 본 척한다."
  taboos:
    - "'노예선에서 태어났다'는 농담 (세바스찬)"
    - "몬달리 상가의 빚 액수(4,200두카트)"
    - "AS 0~38 잿빛 겨울에 강이 얼어 3년 운항이 중단된 일 — 가문은 그때 배를 팔지 않은 것을 자랑한다"
    - "'꼭두각시'라는 낱말"
  rites:
    - {name: "첫 출항", when: "해빙월 범람이 끝난 뒤", what: "닻줄에 소금을 뿌리고 선장이 항로를 낭독. 올해의 첫 노예선이 나루를 떠난다"}
    - {name: "세렌 대시장 입항", when: "포도월", what: "노예선이 세렌 소금 나루에 닿는 날 — 몬달리 상가의 사람이 마중 나온다"}
    - {name: "얼음의 날", when: "긴밤월 결빙 때", what: "AS 0~38의 3년 운항 중단을 기억하는 침묵. 선원들은 그날 닻을 닦는다"}
  speech: "항로와 숫자의 말. 지올은 나가의 계산된 완곡체('이 건은 도장이 필요합니다'), 마그누스는 용인의 자존심 섞인 공문체. 인간을 '화물'이라 부르지 않고 '인원'이라 부른다. 금지어: 꼭두각시, 담보, 몬달리(백작 앞에서)."

