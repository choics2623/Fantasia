  - {id: rank_kin, title: "직계 (함대장·며느리)", duties: "선단과 장부", privileges: "선단 지휘", open_to_player: false}
  - {id: rank_captain, title: "선장·항만 관리", duties: "항해와 입출항", privileges: "배 위의 법", open_to_player: false}
