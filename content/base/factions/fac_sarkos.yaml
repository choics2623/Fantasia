toward_echo: "공식은 아우락스 편 — 징후자는 화형. 실제로는 '값'. 잔향 징후가 있는 아이에게는 30~60비늘을 매긴다. 그러나 이사벨은 지난 212건이 모두 틀렸음을 안다 — 진짜 잔향이 눈앞에 서면 처음으로 값을 매기지 못할 수 있다."
player_paths:
