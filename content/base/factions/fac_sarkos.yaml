# 사르코스 백작가 — "모든 목에는 값이 있다". 정본: HOUSES §2.3, §6.3 / RACES §3
# 비늘혈, 돈으로 산 작위. 바알카르 '쇠사슬 광장'(파종월 노예 매매 대시장 운영권)과 '울타리 셋' 수용소.
# 주의(모순 기록): REGIONS §1.3은 비늘 시장 운영권을 타르굴 가에 두고, HOUSES §2.3은 파종월 대시장 운영권을 사르코스(쇠사슬 광장)에 둔다.
# 이 파일은 둘을 다른 장소로 본다 (비늘 시장 = 타르굴 / 쇠사슬 광장 = 사르코스). 디자이너 확인 필요.
# 기준: AS 312 낙엽월 1일. 'unnamed:...'는 TODO-NPC.
id: fac_sarkos
name: 사르코스 백작가
kind: house
race: [용인(비늘혈), 크릭(수석 감독관 그림)]
governance: 봉건 위계 — 상업 독점권을 쥔 비늘혈 백작가
governance_note: >
  가문은 영지가 아니라 독점권으로 서 있다. 여백작이 값을 정하고, 동생이 광장에서 팔고, 딸이 분류하고, 크릭이 채찍으로 지킨다.
  '모든 목에는 값이 있다'는 가훈은 장사 철학이 아니라 가문의 통치법이다 — 거래되는 모든 것이 가문의 말이 된다.
motto: "모든 목에는 값이 있다."
seat: "바알카르 쇠사슬 광장 — 파종월 노예 매매 대시장 운영권. 수용소 '울타리 셋'은 은빛 강 상류"
size:
  members: "비늘혈 직계 3 + 크릭 감독관(수용소 노예 30명당 1) + 경매 보조·중개인 + 수용소 인간 노예 수천(등급 판매 대상)"
  territory: "바알카르 쇠사슬 광장, 은빛 강 상류 노예 수용소 '울타리 셋'"
  wealth: "거인 전쟁 때 양쪽 군대에 방패 노예를 공급해 최대 부호가 된 이래 대륙 노예 거래의 가장 큰 몫. 징후자 비밀 판매(1인당 30~60비늘)"
  force: "사병은 적다 — 대신 바르그 노예사냥 조합의 최대 후원자(AS 213 공인 로비 성공), 크릭 감독관 길드 '채찍손' 간부를 쥔다"

