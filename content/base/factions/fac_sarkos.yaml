ranks:
  - {id: rank_countess, title: "여백작", duties: "값의 결정, 이중 거래", privileges: "독점권, 바르그 조합 후원", open_to_player: false}
  - {id: rank_kin, title: "직계 (경매사·분류 담당)", duties: "광장·분류", privileges: "독점권의 실무", open_to_player: false}
  - {id: rank_overseer, title: "감독관 크릭", duties: "수용소·광장 감독", privileges: "'채찍손' 길드의 보호", open_to_player: false}
  - {id: rank_agent, title: "중개인·경매 보조", duties: "시세를 올리고 계약을 맞춘다", privileges: "수수료", open_to_player: false}
  - {id: rank_graded_slave, title: "등급 노예 (1~7등급)", duties: "수용소 입고·판매 대기", privileges: "등급이 높을수록 덜 위험한 주인에게 간다", open_to_player: true, condition: "붙잡히거나 팔려 수용소에 입고되면 이사벨의 분류를 통과해야 한다 — 이번만은 그녀의 분류가 맞다(잔향은 징후가 아니라 실제)"}
  - {id: rank_collar_slave, title: "목줄 경매 보조 (인간)", duties: "경매대에서 사람의 '장점'을 외쳐 값을 올린다 (예: 바알카르 롤프)", privileges: "시장 안에서의 반자율", open_to_player: true, condition: "목줄단 바알카르 지부 소속 — 노예 신분 그대로"}

decision: "여백작이 값과 계약을 정한다. 광장은 오트마르가, 분류는 이사벨이, 수용소는 그림이 집행한다. 의논은 장부 위에서 이루어지고, 결정은 장부에 한 줄이 더해지는 것으로 확정된다. 아우락스에 대한 공식 서약과 멜리산드에게 파는 이중 거래는 한 사람(여백작)의 머릿속에서만 만난다."
succession: "여백작의 선택 — 장자 원칙이 없다. 가문은 돈으로 산 작위이므로 재능(셈과 값)이 상속을 정한다. 네브라가 죽으면 이사벨과 오트마르의 다툼이 되고, 이사벨이 이기면 징후자 판매가 확대된다."

law:
  crimes:
    - {act: "인간의 등급 낙인 훼손·위조", punishment: "즉결 처형 또는 7등급 강등 묶음 판매", note: "왼쪽 손등 낙인. 등급이 곧 매매 이력"}
    - {act: "수용소 탈주 (울타리 셋)", punishment: "연좌 — 같은 칸의 인간 배급 삭감, 탈주자는 힘줄 절단 후 7등급 묶음 매각", note: "인간에게만"}
    - {act: "분류된 징후자를 외부에 알린다", punishment: "수용소의 인간은 처형, 용인은 가문 이름 삭제", note: "이사벨의 분류는 비밀 — 아우락스가 알면 하루아침에 불탄다"}
    - {act: "가격 담합 파괴 (파종월 시세 이탈)", punishment: "가문이 쓰는 값으로 시장에서 퇴출 — 중개인은 허가 취소", note: "용인·나가 중개인에게 적용"}
    - {act: "장부 사본을 외부에 넘긴다", punishment: "사본 보관처(졸라크 상가)와 계약 위반 — 가문 말소 위험", note: "가문 최대의 보험이자 약점"}
    - {act: "등급 낙인 없이 노예를 판다", punishment: "벌금 — 낙인 비용의 10배", note: "수용소 밖 거래"}

customs:
  greeting: "값을 묻지 않는 것이 인사다. '오늘의 시세는?'이 안부의 대신이고 대답은 숫자로 한다. 경매대 위의 인사는 경매사의 목소리 — 한 번에 '하나, 둘'을 부른다."
  taboos:
    - "값을 매길 수 없는 것을 입에 올리는 것 (여백작은 믿지 않는다)"
    - "212건 장부와 '진짜가 하나도 없었다'는 사실"
    - "'노예'를 사람이라 부르는 것 — '목'이라 부른다"
    - "열한 고리 중 하나가 빠진 쇠사슬 문장을 그리는 것"
  rites:
    - {name: "파종월 대시장", when: "파종월", what: "쇠사슬 광장에서 노예 매매 대시장이 열린다. 오트마르의 개시 선언 — 첫 목의 값이 한 해의 시세를 정한다"}
    - {name: "세렌 대시장 방문", when: "포도월", what: "졸라크 상가의 장부 사본을 확인하러 간다 — 보험 점검"}
    - {name: "수용소 입고 점호", when: "낙엽월·수확월", what: "수확기 이후 노예 입고량이 늘어난다. 이사벨의 분류가 이 시기에 가장 바쁘다"}
  speech: "숫자와 값으로 말한다. 경매사의 낭랑한 목소리. 인간을 '목' 또는 등급 번호('칠 등급 묶음')로 부른다. 존칭은 비늘혈 하급의 습관적 아첨. 금지어: 공짜, 값없는."

membership:
  join: "출생. 중개인·경매 보조는 수수료 계약."
  leave: "'장부에서 이름 삭제'. 중개인은 허가 취소로 퇴장."
  signs: ["짙은 녹색 바탕 쇠사슬 원 — 원 안에 금빛 용 머리, 고리 열한 개", "왼쪽 손등 등급 낙인 도구", "크릭 감독관의 채찍 손잡이 문장"]

