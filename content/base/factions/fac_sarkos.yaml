    chosen_by: "가문 세습 (SK 1,420 시조 사르코스 금목걸이가 포로 거래 독점권을 용황에게서 샀다)"
    perks: ["값을 매길 수 없는 것을 믿지 않는다 — 가문의 눈", "열한 고리 문장 — 고리 수 정확히 열한 개(맹약의 열한 종족)"]
