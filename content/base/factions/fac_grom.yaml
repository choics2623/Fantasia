  speech: "그롬 전투어 — 짧고 거친 명령형. 존칭이 없다. 서열은 호칭이 아니라 '몇 개의 흉터'와 눈의 높이로 드러난다. 인간 투사에게도 같은 전투어를 쓰며, 이름을 불러 주는 것이 최고의 인정이다('이빨 없는 자'가 아니라 이름으로). 완곡어는 약함이다 — 거절은 '싸우자'가 되고 동의는 '받는다'가 된다."

