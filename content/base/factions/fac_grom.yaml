# 그롬 전쟁무리 — 피 혈명('분노')의 굴레(싸우지 않으면 쇠약)가 만든 힘의 서열.
# 근거: HOUSES §3.7, §4.4(백승가), RACES §13, REGIONS §16, facts/grommar.yaml.
id: fac_grom
name: 그롬 전쟁무리 (피의 원형장)
kind: polity
race: [전쟁 그롬, 붉은 그롬, 오그림, 잿빛 그롬(변방), 인간 투사·소모품, 크릭, 나가(항구 상관)]
governance: 힘의 서열 — 도전제  # 계급은 결투로 바뀌고 도전은 거절할 수 없다
motto: "피가 곧 기도다."
seat: 피의 원형장 — 뼈의 전당 (그롬마르 붉은 황야 중심, 원형 도시 약 40,000)
size:
  members: "그롬 약 40,000(REGIONS)~210,000(RACES), 인간 투사 약 2,400, 소모품·노역 약 18,000(RACES는 95,000), 크릭 4,000, 나가 300"
  territory: "그롬마르 붉은 황야 — 씨족 요새 약 60곳, 그롬마르 항(나가 상관), 말뼈 여울(하르칸 분쟁지)"
  wealth: "화폐 경멸 — 전리품. 원형장 관람 공물, 철 무기, 용병 계약(쇠턱 ↔ 세렌 테르사 상가). 노예·철·곡물 수입"
  force: "정면 돌격과 광란. 인간 소모품이 첫 열, 투사 출신은 그롬 전사와 같은 열. 하르칸·요툰이 숙적"

decision: >
  그롬에게 서열은 곧 결정이고, 서열은 결투가 정한다. 누구든 바로 위의 자리에 도전할 수 있고 도전을 거절하는 것은 금기다 — 거절은 곧 패배이자 비겁이다.
  전쟁군주(씨족장 약 60)의 회합 '피의 소집'은 매년 푸른월(전쟁 시즌) 전에 열려 원정 여부와 소모품 징발을 정한다. 말로 하지 않고, 원형장 모래에서 각자의 도전 의사를 걸어 겨룬 뒤 남은 자들의 뜻이 결정이 된다.
  대전쟁군주 자리에 대한 도전은 태양월 피의 원형장 대축제에서만 받는다. 이 규칙이 우르가쉬의 약점이자 도전 시점을 조작할 수 있는 틈이다 — 쇠약이 시작된 군주도 대축제까지는 한 번만 이기면 한 해를 더 산다.
  거부권이라는 개념은 없다. 결정에 반대하는 자는 결정자에게 도전하면 된다. 인간 투사는 의제가 아니라 '경기'의 재료다 — 원형장 관리자(피의 감독)가 대진표와 계약을 정한다.
  백승의 인간 투사에게는 '혈명 없는 혈명'이 주어지고, 그 순간부터 그는 서열 밖의 '형제'다 — 그 권리를 둘러싼 논쟁(인간이 형제가 되면 원형장은 무엇이 되는가)이 원형장파와 원정파를 가른다.
succession: >
  대전쟁군주는 도전으로 바뀐다. 태양월 대축제에서 도전자가 군주를 쓰러뜨리면(죽이거나 무릎 꿇리면) 군주가 된다. 도전이 없으면 현직이 유지된다.
  현 군주 우르가쉬(61세)는 AS 309 아침 대련에서 처음 한 방을 맞고 무릎을 꿇었다(숨기고 있다). 피도끼의 그라샤(38)는 이번 태양월에 도전할 예정이다.
  전쟁군주 자리는 씨족 내 도전으로, 흉터 전사는 흉터 수로 서열이 정해진다. 늙어 죽는 것은 수치이므로 늙은 전사는 도전에 나서 죽는다.

