law:
  crimes:
    - {act: "침대에서 죽음 / 늙어 죽음", punishment: "수치 — 시신에 흉터 문신을 새기지 않는다", note: "그롬 대상 (금기 ①)"}
    - {act: "도전을 거절함", punishment: "비겁 — 서열 박탈, 결투 강제", note: "그롬 대상 (금기 ②). 거절하지 못하는 약점을 유인에 쓸 수 있다"}
    - {act: "원형장 밖에서 투사를 해침", punishment: "투사는 원형장의 것 — 모든 씨족의 사냥감", note: "양쪽 모두 (금기 ③)"}
    - {act: "죽은 적을 조롱함", punishment: "서열 박탈 — 적의 강함이 곧 나의 영광", note: "그롬 대상 (금기 ④)"}
    - {act: "등 뒤의 상처를 문신으로 덮음", punishment: "도망의 증거를 숨긴 것 — 결투 청구", note: "그롬 대상 (금기 ⑤)"}
    - {act: "나눔 식사 후 배신", punishment: "그롬은 거인 전쟁의 원인이 자신들이 아니라고 주장 — 언급 자체가 결투 사유", note: "그롬 대상 (금기 ⑥)"}
    - {act: "경기 거부", punishment: "소모품 강등", note: "인간 투사 대상. 집행 피의 감독"}
    - {act: "비겁(전장 이탈)", punishment: "소모품 강등 또는 결투", note: "인간 대상. 집행 숙영지 사령"}
    - {act: "투사의 탈주", punishment: "사냥 — 그롬 누구나. 단 99승 이상의 탈주는 '마지막 경기의 미룸'으로 본다", note: "인간 대상"}
    - {act: "무기 소지(투사) / 글자 / 마법", punishment: "처벌 없음 — 무관심(마법은 '싸우는 방법')", note: "인간 대상. 그롬마르 밖에서는 적용되지 않는다"}

