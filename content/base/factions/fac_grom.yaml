  taboos:
    - "침대에서 죽는 것, 늙어 죽는 것"
    - "도전을 거절하는 것"
    - "원형장 밖에서 투사를 해치는 것"
    - "죽은 적을 조롱하는 것"
    - "등 뒤의 상처를 문신으로 덮는 것"
    - "비겁, 늙음 조롱, 나눔 식사 배신 이야기"
  rites:
    - {name: "피의 원형장 대축제", when: "태양월 (313년은 맹약회의와 같은 달)", what: "그롬 문화의 중심. 100승 도전 경기, 대전쟁군주 도전. 대륙 최대 군중"}
    - {name: "혈명 없는 혈명", when: "100승 직후", what: "재울음 주술사가 그롬의 피를 이마에 바르고 전투어로 이름을 불러 준다. 붉은 젖(분노샘의 즙)을 먹인다 — 실제로는 중독의 의식"}
    - {name: "흉터 새김", when: "첫 싸움(10세), 성년(13세)", what: "흉터를 자랑으로 새긴다(흉터 문신). 등의 흉터만은 덮지 않는다"}
    - {name: "피의 소집", when: "푸른월 전", what: "전쟁군주 회합 — 원정·소모품 징발 결정"}
