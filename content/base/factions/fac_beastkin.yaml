law:
  crimes:
    - {act: "무리원을 버림", punishment: "무리에서 쫓겨남 — 홀로 가면 30일에 불면·환청, 90일에 외톨이 광증", note: "수인 대상 — 가장 큰 금기 (바르그)"}
    - {act: "그믐밤 사냥(달이 없는 밤의 사냥)", punishment: "무리에서 배척 — 사냥의 자격 박탈", note: "바르그 대상. 잿빛 실이 그믐에 움직이는 이유. 숲파는 올해 금기를 깨기로 했다는 소문"}
    - {act: "다른 무리의 표식 위에 표식을 덮음", punishment: "무리 간 도전 사유", note: "바르그 대상"}
    - {act: "늙은 늑대를 비웃음 / 사냥감에게 이름을 물음", punishment: "무리에서 수치 / 이름을 들으면 죽이기 어려워진다고 믿는다 — 사냥꾼 자격 의심", note: "바르그 대상"}
    - {act: "탈주 노예의 도주(조합 장부 등재 노예)", punishment: "현상금 5 발톱~2 비늘 — 산 채로 데려와야 한다. 수수료 30%", note: "인간 대상. 집행 바르그 조합. 맹약회의 AS 213 공인"}
    - {act: "줄무늬 서약(계약)을 어김", punishment: "맡긴 털 한 줌을 태워 공개 — 평생 고용 불가", note: "타이란 대상"}
    - {act: "짝을 버림 / 등 뒤에서 공격받은 뒤 도망 / 계약 중 술", punishment: "수치와 계약 박탈. 짝을 잃으면 1년 안에 광증", note: "타이란 대상"}
