customs:
  greeting: "냄새를 먼저 맡는다 — 서로 한 걸음 거리에서 숨을 들이쉰다. 처음 만나는 무리는 표식을 교환한다. 바르그는 상대의 무리를 묻고 '누구의 냄새냐'고 한다. 인간에게는 숨 냄새로 거짓을 맡았다는 표정을 먼저 짓는다."
  taboos:
    - "무리원을 버리는 것, 늙은 늑대를 비웃는 것"
    - "그믐밤 사냥, 다른 무리 표식 위에 표식을 덮는 것"
    - "사냥감에게 이름을 묻는 것"
    - "'개', '고양이', '쥐'(스카브), '썩은 입'(그나르) 등 종족 비하"
    - "잠든 우르사를 깨우는 것, 동면 굴을 남에게 알려주는 것"
    - "짝을 모욕하는 것, 줄무늬 서약 위반을 요구하는 것"
  rites:
    - {name: "보름 사냥", when: "보름마다", what: "달에게 사냥을 바친다. 무리가 냄새를 맞춰 결정한다. 사냥감의 첫 피는 우두머리가 핥는다(산 채로 데려와야 하는 사냥에서는 억누르는 훈련)"}
    - {name: "그믐 애도", when: "그믐마다", what: "사냥도 결정도 하지 않는다. 죽은 무리원의 냄새를 부른다"}
    - {name: "겨울 첫 보름 기도", when: "서리월 첫 보름", what: "우르사가 동면에 들며 달에게 '다시 깨우소서' 하고 기도한다. 겨울지기에게 굴을 맡긴다"}
    - {name: "꿀술 회의", when: "가을(낙엽월)", what: "골짜기 모임이 꿀술을 나눠 마시며 사흘간 겨울 굴을 배정한다"}
    - {name: "월식의 아이", when: "월식 밤 출생", what: "흰 털로 태어난 타이란은 신성시된다 — 사냐 흰털"}
    - {name: "줄무늬 서약", when: "계약 때", what: "자기 털 한 줌을 고용주에게 준다. 어기면 그 털을 태워 공개"}
  speech: "달말 — 울음·으르렁·냄새 표식이 섞여, 공용어도 짧고 거칠다. 경어가 아니라 '냄새의 거리'로 서열을 표현한다 — 가까이 다가가면 복종, 한 걸음 뒤는 경계. 바르그는 '냄새는 거짓말하지 않는다'로 상대의 거짓을 짚고, 타이란은 계약 조항을 글자로 인용하며, 우르사는 느리고 낮게 '겨울 ○번째'를 먼저 밝힌다. 인간에게는 '냄새나는 이', '짐'으로 부르며 이름을 묻지 않는다."

membership:
  join: "수인은 무리에 태어난다. 다른 무리에 받아들여지려면 냄새를 섞는 시간이 걸린다. 우르사 겨울지기는 굴의 맹약을 받아들이는 것. 인간 협력자는 조합 지부 등재로 들어간다."
  leave: "무리를 떠나면 광증이 온다 — 새 무리가 받아줄 때만 가능. 타이란은 계약 끝으로. 인간 겨울지기는 맹약 사냥꾼이 오면 지켜줄 수 없다."
  signs: ["무리 문장 — 달을 향해 벌린 회색 턱(회색송곳니), 눈 위의 흰 발자국(흰발), 줄무늬 사이의 왕관(줄무늬 왕좌), 꿀단지를 안은 곰(꿀바위)", "털 한 줌(줄무늬 서약)", "냄새 표식, 오줌 표식", "그나르의 웃음소리"]

