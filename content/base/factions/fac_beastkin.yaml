# 수인족 무리 — 생명 혈명('야성')의 굴레(피 냄새 충동, 무리 없이는 미쳐감)가 만든 냄새 합의.
# 근거: HOUSES §3.10, RACES §12, SUBRACES §10, facts(drakmar/greyford/hrosgard).
# 조정: 줄무늬 왕좌(HOUSES: '혼자 사냥하는 자가 왕이다')와 타이란 짝무리(RACES: 2~3명)의 사회 구조가 어긋난다. 흰발의 우두머리가 HOUSES '여우두머리 시라', RACES '라스카 흰발'로 다르다 — 여기서는 시라와 라스카를 짝으로 본다 (SUBRACES §10.1을 따름) (보고).
id: fac_beastkin
name: 수인족 무리 (달의 무리들)
kind: polity
race: [바르그(늑대), 타이란(범), 우르사(곰), 그나르(하이에나), 바울피(여우), 스카브(쥐)]
governance: 무리 연합 — 냄새 합의 (달 회합)  # 나라가 없다. 무리가 단위이고 합의는 냄새로 드러난다
motto: "냄새는 거짓말하지 않는다. (회색송곳니) / 무리 밖은 겨울이다. (흰발)"
seat: "없음 — 나라 없는 종족. 본거지: 바알카르 외곽 '사냥꾼 막사'(회색송곳니), 까마귀 문 북쪽 숲(흰발), 하르칸 초원 남부 밀림 경계(줄무늬 왕좌), 카즈둠 남쪽 숲(꿀바위)"
size:
  members: "수인족 약 200,000 — 바르그 64,000 / 타이란 21,000 / 우르사 17,000 / 그나르 12,000 / 바울피 6,000 / 스카브 45,000 (RACES·SUBRACES)"
  territory: "없음. 옛 사냥터 달그림자 숲(회색여울 서쪽~가시안개 숲 동쪽)은 SK 600 용제국에 편입. 붉은 갈대 언덕(타이란 9,000), 카즈둠 기슭 숲, 흐로스가르드 남부 숲"
  wealth: "송곳니를 빌려주고 번다 — 현상금(5 발톱~2 비늘), 용병 피값, 호위, 사냥 정원. 우르사는 겨울지기 사냥감의 1/3"
  force: "포위 사냥(바르그), 매복과 첫 일격(타이란), 돌진(우르사). 용제국 경보병·정찰대·세렌 호위·녹테른 경비·그롬마르 사냥 투사로 고용"

decision: >
  수인족에게 '나라'는 없다 — 땅을 받지 못했다. 정치의 단위는 무리(10~30)이고, 무리 안의 결정은 말이 아니라 냄새로 한다.
  바르그의 무리 감각은 무리원끼리 냄새로 감정을 공유하게 한다. 그래서 무리는 보름(사냥의 밤)마다 모여 '냄새를 맞춘다' — 우두머리 쌍이 안건을 냄새로 내놓으면
  무리원의 공포·분노·찬성이 냄새로 번져 합의가 눈에 보인다. 과반이 어긋난 냄새(반감)를 내면 우두머리 쌍은 물러나거나 도전을 받는다.
  거짓말은 소용이 없다 — 속으로는 반대하면서 찬성하는 냄새를 낼 수 없다. 그래서 무리 안의 정치는 침묵과 눈빛이다.
  그믐은 애도의 밤이다. 그믐밤에는 사냥도 결정도 하지 않는다(잿빛 실이 그믐에 움직이는 이유).
  무리와 무리 사이에는 상위 의회가 없다. 서로 표식(오줌 표식)을 교환하고, 다른 무리의 표식 위에 표식을 덮는 것은 금기다. 서열은 사냥으로 정해진다 — 산 것을 사냥하는 바르그·타이란이 높고, 죽은 것을 먹는 그나르, 훔치는 바울피, 감시하는 스카브가 낮다. 우르사는 서열 밖이다(너무 오래 잔다).
  거부권은 '무리를 떠남'이다. 그러나 무리 없이는 미쳐 가므로(혼자 30일이면 불면·환청, 90일이면 외톨이 광증) 떠남은 새 무리가 받아줄 때만 가능하다. 그래서 갈라짐은 드물고 결정적이다(흰발은 회색송곳니에서 갈라졌다).
  타이란의 정치는 피값 계약이다. 짝무리 위에는 고용주뿐이고 명성이 곧 계급(몇 번의 계약을 어기지 않았는가). 우르사의 정치는 가을 골짜기 모임의 꿀술 회의 — 사흘간 나눠 마시며 겨울 굴을 배정하고 가장 오래 잔 자가 먼저 말한다.
succession: >
  바르그 무리의 우두머리 쌍은 도전(이빨)으로 바뀐다. 우두머리 쌍만 새끼를 많이 낳는다. 조합장(볼크)은 조합 장부 안에서 승계한다.
  타이란의 명성은 승계되지 않는다 — 짝을 잃은 타이란은 1년 안에 광증에 빠진다. 우르사는 우두머리가 없고 최고령이 먼저 말한다. 그나르 무리장은 암컷이 잇고, 바울피 굴과 스카브 '이빨'은 힘과 거래로 바뀐다.

