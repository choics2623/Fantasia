law:
  crimes:
    - {act: "인간에게 지는 것", punishment: "목록에서 지워짐 — 굴이 외면한다. 크릭에게 세계가 무너지는 공포", note: "크릭 대상 (금기 ①). 공개되지 않으면 처벌 없음"}
    - {act: "주인을 바꿈", punishment: "굴에서 쫓겨남 — 단 주인이 패배하면 허락된다", note: "크릭 대상 (금기 ②). 길드 규칙 제1조의 예외 조항"}
    - {act: "굶주린 동족을 버림", punishment: "굴에서 외면 — 재굴 무리에서는 추방", note: "크릭 대상 (금기 ③)"}
    - {act: "재를 밟음", punishment: "조상을 모독한 자 — 굴 낭송에서 한 줄 지워짐", note: "크릭 대상 (금기 ④)"}
    - {act: "강자의 이름을 함부로 부름", punishment: "채찍 — 강자가 알면 주인이 처벌", note: "크릭 대상 (금기 ⑤)"}
    - {act: "감독관이 배급을 빼돌림", punishment: "길드 제명과 연봉 삭감 — 굶주린 크릭 새끼를 먹이려는 경우는 묵인되기도 한다", note: "감독관 대상. 인간 노예는 그 대가로 굶는다"}
    - {act: "인간이 크릭을 때리거나 공개적으로 모욕함", punishment: "주인의 재산 훼손으로 취급 — 주인이 정한다. 공개적인 승리는 굴종 판정", note: "인간 대상. 크릭의 주인에 따라 처분이 다르다"}
    - {act: "봉기에서 편을 바꾸지 못함(지는 쪽에 남음)", punishment: "길드가 외면 — 목록이 뒤집히는 날 가장 먼저 편을 바꾸는 쪽이 이긴다", note: "크릭 대상 — 규칙 제1조의 실질"}

customs:
  greeting: "'누가 위요?' — 상대의 주인을 먼저 묻고 목을 낮춘다. 같은 주인이면 '같은 발 아래'라 부르고, 더 높은 주인의 크릭이면 무릎을 굽힌다. 주인이 없으면 인사를 하지 않는다."
  taboos:
    - "인간에게 지는 것, 강자 목록이 뒤집히는 말"
    - "주인을 바꾸는 것(주인이 패배하지 않는 한)"
    - "굶주린 동족을 버리는 것, 재를 밟는 것"
    - "강자의 이름을 함부로 부르는 것"
    - "공개 모욕 — 강자 앞에서의 망신은 크릭을 미치게 한다"
  rites:
    - {name: "목록 낭송", when: "매일 저녁", what: "굴마다 강자 목록을 낭송한다. 아이들이 가장 먼저 외운다. 갱신된 줄이 있으면 그날 모든 굴이 같은 줄을 새로 외운다"}
    - {name: "굴종의 무릎", when: "패배 직후", what: "패배한 크릭이 이긴 자의 발 앞에 무릎 꿇고 목을 드러낸다. 이긴 자가 받아들이면 그의 크릭이 된다"}
