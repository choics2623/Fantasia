# 크릭 집단 — 재 혈명('적응')의 굴레(강자에게 굴종하는 본능)가 만든 '강자 목록' 군체형 추종.
# 근거: HOUSES §3.11, RACES §16, SUBRACES §14, facts(drakmar/emberhills/greyford/ashwaste).
id: fac_krik
name: 크릭 집단 (채찍손 길드 · 재굴 무리 · 굴 크릭 전체)
kind: polity
race: [굴 크릭, 늪 크릭, 감독관 크릭]
governance: 강자 목록 합의 (군체형 추종)  # 지도자가 없다. 전체가 하나의 '목록'을 외우고 목록이 바뀌면 같은 날 같은 방향으로 움직인다
motto: "주인이 바뀌면 채찍도 바뀐다. (채찍손 길드 규칙 제1조)"
seat: "없음 — 크릭 고유의 땅은 없다. 채찍손 길드 본부: 바알카르 지하 '굽은 회랑' / 재굴 무리: 재의 황무지 가장자리 마지막 등불 남쪽 '재굴'"
size:
  members: "크릭 약 1,400,000 — 굴 크릭 약 1,100,000, 늪 크릭 약 262,000, 감독관 크릭 약 38,000(채찍손 길드원 약 3,000), 재굴 무리"
  territory: "고유 땅 없음. 드라크마르 약 520,000, 세렌 하역꾼 약 180,000, 그롬마르 약 150,000, 카즈둠 약 60,000, 녹테른 약 40,000"
  wealth: "감독관 1인 연봉 4~8 비늘(인간 성인 노예 두 명 값). 하역 장부, 굴 단위의 식량 저장"
  force: "떼 — 단독으로는 싸우지 않는다. 주인의 군대의 짐꾼·땅굴 파기·후방 감시. 강자의 편에 서면 수가 곧 힘"

decision: >
  크릭에게는 지도자가 없다. 대신 모든 크릭이 같은 '강자 목록'을 외운다 — 용황 → 용 → 용인 → … → 크릭 → 인간. 크릭 아이는 말을 배우자마자 가장 먼저 이 목록을 외운다.
  결정은 목록이 한다. 누가 누구보다 강한지가 곧 누구를 따를지이고, 그 외의 정치는 없다. 크릭은 '우리가 정했다'고 말하지 않고 '목록이 그렇다'고 말한다.
  목록은 공개된 사건으로만 바뀐다 — 결투, 굴종의 무릎(패배한 크릭이 이긴 자의 발 앞에 무릎 꿇고 목을 드러낸다), 공개적인 패배와 망신. 아무도 보지 않은 패배는 목록을 바꾸지 못한다.
  갱신은 소문의 속도로 번진다. 굴 → 굴 모임(매일 저녁 '목록 낭송') → 감독관 크릭 → 채찍손 길드 → 다른 굴의 순서로 한 도시 안에서는 하루, 대륙 끝까지는 7~10일 걸린다.
  갱신 하나가 돌면 모든 굴이 같은 저녁에 같은 줄을 새로 외운다 — 그날 크릭 전체가 같은 방향으로 움직인다(편을 바꾼다). 군체처럼 보이는 이유다.
  거부권은 없고, '모른 척'뿐이다. 굴 모임이 새 목록을 낭송하지 않으면 그 굴은 목록 밖이 되어 주인 없는 크릭(고아)으로 취급받는다.
  채찍손 길드 규칙 제1조 '주인이 바뀌면 채찍도 바뀐다'는 이 구조의 명문화다. 봉기가 이기기 시작하면 감독관들이 가장 먼저 편을 바꾼다 — 인간 해방 대사의 숨은 변수(찬가 4단계).
  크릭은 맹약의 서명 종족이 아니다(공모에 부르지도 않았다) — 법도 맹약회의도 없다. 맹약회의 313에도 초대받지 않는다.
succession: >
  채찍손 길드장은 길드 원로회의 합의로 오른다 — 가장 큰 주인을 가진 감독관이 높다. 감독관의 아이는 감독관이 된다(크릭 사회의 유일한 세습).
  재굴 무리에는 우두머리가 없고 가장 오래 산 자(치륵, 37)가 말을 먼저 한다.
  목록 자체는 승계가 없다 — 가장 강한 자가 쓰러지면 다음 줄이 즉시 올라온다. 약점은 목록의 꼭대기가 뒤집히는 날이다(인간이 고대 종족 하나를 공개적으로 꺾는 날).

