    perks: []

ranks:
  - {id: rank_count, title: "백작", duties: "갱도와 사고 보고", privileges: "관리권, 요람 열쇠", open_to_player: false}
  - {id: rank_kin, title: "직계 (요람 행정·갱도 총감독)", duties: "요람과 광산 일상", privileges: "멜리산드에게 직접 보고", open_to_player: false}
  - {id: rank_inspector, title: "갱도 감독 (용인)", duties: "갱도 한 곳 책임", privileges: "갱조 처벌권", open_to_player: false}
  - {id: rank_overseer_kric, title: "크릭 감독", duties: "갱조 점호와 매질", privileges: "배급 가산", open_to_player: false}
  - {id: rank_foreman, title: "갱조 반장 (인간)", duties: "30명 갱조의 점호", privileges: "가장 늦게 먹는다 — 탈주 시 첫 연좌 책임", open_to_player: true, condition: "갱조 안에서 감독의 눈에 든 자 (매듭끈 계승자일 수 있다)"}
  - {id: rank_miner, title: "광부 (갱조원)", duties: "채굴, 연좌 책임", privileges: "없다 — 갱조 하나가 탈주하면 나머지 29명의 배급이 끊긴다", open_to_player: true, condition: "잿불 언덕 출신 시작 또는 국유 노예 배당"}
  - {id: rank_cave_born, title: "굴 태생", duties: "3대 이상 지상에 올라가 본 적 없다", privileges: "없다", open_to_player: false}
  - {id: rank_cradle_subject, title: "은비늘 요람 피험자 (대기 감방)", duties: "이식 순번을 기다린다", privileges: "멜리산드의 담요와 맥 짚기", open_to_player: true, condition: "'낙반'으로 갱조에서 빼내지거나 자원자(fac_collar 모집)로 들어간다. 이식 99%가 며칠 안에 죽는다"}

decision: "백작이 숫자로 보고하고 드루스가 갱도를 편성한다. 은비늘 요람은 오렐리아가 멜리산드의 명으로 따로 움직인다 — 가문 회의 없이 한 가문 안에 두 지휘선이 있다. 갱조는 결정에 참여하지 못한다 (연좌 책임만 진다)."
succession: "장자 상속 — 드루스. 백작이 죽으면 드루스의 독가스 장치 접근권이 가문에서 가장 큰 변수가 된다. 멜리산드의 즉위 여부가 '요람의 합법화'를 정한다 — 즉위하면 가문의 지위가 오르고 실패하면 요람의 시신이 가문의 죄가 된다."

law:
  crimes:
    - {act: "갱조원의 탈주", punishment: "나머지 29명의 배급 중단 + 탈주자 힘줄 절단 후 갱조 복귀 또는 요람 이송", note: "인간. 연좌 책임이 곧 감시"}
    - {act: "갱도 무단 이탈·지상 접촉", punishment: "태형 + 독방 봉인 3일", note: "굴 태생은 지상 접촉 자체가 형벌 사유"}
    - {act: "봉기·다라 관련 이야기의 전파", punishment: "갱조 전원 연좌 배급 삭감 + 주모자 갱도 봉쇄(질식)", note: "AS 100 다라의 반란 때 가주 코르빈이 광부들에게 산 채로 묻혔다 — 가문은 그것을 '용감한 전사'로 위조"}
    - {act: "서쪽 갱도 9곳 폐쇄 구역 출입", punishment: "시간 잔상에 잠긴 채 돌아오지 않는다 — 가문은 사고로 기록", note: "AS 0 시간 잔상에 잠긴 갱도"}
    - {act: "요람 피험자의 신원·수를 외부에 발설", punishment: "가족 전원 이식 순번 앞당김", note: "인간. 용인 서기는 가문 이름 삭제"}
    - {act: "독가스 장치의 위치를 안다 (갱도 감독 외)", punishment: "사형", note: "드루스만 전체를 안다"}
    - {act: "사망을 '낙반'이 아닌 이식으로 기록", punishment: "서기의 가문 이름 삭제", note: "비밀 규칙 — 요람 사망은 '낙반 사고'로만 적는다"}

customs:
  greeting: "'깊이는?' — 갱도의 깊이로 안부를 묻는다. 대답은 숫자로 짧게. 백작 앞에서는 낙반·열병의 수를 먼저 보고한다. 인간 광부는 감독 앞에서 곡괭이를 내려놓고 갱 번호를 댄다."
  taboos:
    - "'붉은 길'과 다라의 이름 (갱 안에서 입에 올리면 연좌)"
    - "코르빈 가주의 마지막 장면 — 가문은 '용감한 전사'로 위조했다"
    - "서쪽 갱도 9곳 안에서 일하는 광부의 그림자 이야기"
    - "독가스 장치"
  rites:
    - {name: "갱조 교대 종", when: "매일 교대 시각", what: "갱 번호별 점호 — 번호를 못 대면 교대 지연"}
    - {name: "월말 낙반 보고", when: "매달 말", what: "백작이 사고 수를 숫자로 낭독한다 ('낙반 3, 열병 7')"}
    - {name: "코르빈 추모", when: "TODO: 날짜 미정", what: "'용감한 전사' 코르빈을 기리는 공식 의례 — 위조된 이야기. 광부들은 이 날 말하지 않는다"}
    - {name: "재의 날 갱도 봉인", when: "연말 5일", what: "불을 피우지 않는다. 갱도 입구를 봉인하고 시간 잔상이 가장 많이 나타나는 서쪽 갱도는 문을 걸어 잠근다"}
  speech: "숫자 보고체. 죽음을 건조하게 낭독한다('낙반 3, 열병 7'). 갱 번호와 갱조 번호로 사람을 부른다. 멜리산드 이야기에서는 목소리가 낮아지고 존칭이 길어진다."

membership:
  join: "출생(순혈). 갱도 감독은 비늘혈 가신 계약. 광부는 배당 또는 사유."
  leave: "'낙반'. 퇴장은 죽음으로 기록된다."
  signs: ["검은 바탕 붉은 갱도 입구 — 위에 은빛 비늘 하나", "갱조 번호 목걸이(구리)", "크릭 감독의 채찍 손잡이 갱 번호"]

