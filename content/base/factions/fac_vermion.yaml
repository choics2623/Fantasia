  - {name: "드루스 독가스파", leader: null, aim: "다라의 반란이 다시 오리라 — 광부 전원 사살 장치로 대비", strength: 20}
  - {name: "아멜리의 친구", leader: null, aim: "실바라 은재와의 우정 — 피험자 명단 사본을 본 적이 있다. 아직 파벌이 아니다", strength: 5}
