toward_echo: "포획 후 이식 — 멜리산드의 '그릇'. 오렐리아는 요람의 감방이 비어 있는 날을 가장 두려워한다. 한 번도 살아남은 그릇이 없으므로 이 가문의 눈에 잔향은 '마침내 낭독할 수 있는 이름'이다."
player_paths:
