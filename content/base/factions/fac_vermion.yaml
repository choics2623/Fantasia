    chosen_by: "백작부인 지명"
    perks: []
  - id: off_sealed_west
    title: 서쪽 갱도 9곳 폐쇄 관리
    holder: null          # AS 0 대붕괴에서 시간 잔상에 잠긴 서쪽 갱도 9곳 — 관리자가 없다. 아무도 들어가려 하지 않는다
    reports_to: off_chief_miner
    powers: ["폐쇄 갱도의 출입 금지 — 시간 잔상이 일하는 광부들을 되풀이한다"]
