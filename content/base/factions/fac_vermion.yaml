# 베르미온 백작가 — "잿불 언덕의 관리인". 정본: HOUSES §2.6, §6.3 / REGIONS §3(잿불 언덕) / SCENARIOS 잿불 광산 출신
# 잿불 언덕의 소유자는 멜리산드, 관리자가 베르미온. 41번 갱도 아래 '은비늘 요람'의 행정도 이 가문이 쥔다 (수석 시술의 아드리안 코르벨은 멜리산드 직속 — 이 가문 소속이 아님).
# 주의(모순 기록): REGIONS §1.3의 '재무·세렌 대출 창구 오렐리아 베스페린'과 이 가문의 '백작부인 오렐리아 베르미온'은 이름이 같은 별개 인물로 둔다.
# 기준: AS 312 낙엽월 1일. 'unnamed:...'는 TODO-NPC.
id: fac_vermion
name: 베르미온 백작가
kind: house
race: [용인(순혈), 크릭(감독관)]
governance: 봉건 위계 — 갱 단위 봉인제로 굴을 통치하는 순혈 백작가
governance_note: >
  가문은 광산이다. 영지의 소유는 멜리산드, 관리권은 가문 — 가문의 통치는 '갱 단위 봉인제'로 요약된다. 광부는 갱도별 30명 '갱조'로 묶여
  함께 먹고 함께 처벌받는다. 갱조 하나가 탈주하면 나머지 29명의 배급이 끊긴다. 3대 이상 지상에 올라가 본 적 없는 '굴 태생' 노예가 4천 명.
  가문의 숫자는 죽음의 보고 — 백작은 '낙반 3, 열병 7'로 말한다.
motto: "깊이 팔수록 빛난다."
seat: "잿불 언덕 광산 지대 (REGIONS §3) — 갱도 41곳, 본갱 위 '은비늘 둥지'는 멜리산드의 것"
size:
  members: "순혈 직계 4 + 용인 갱도 감독 수십 + 크릭 감독 약 40(붉은 계단) + 광산 노예 약 1만 8천(갱조 600) + 굴 태생 4천"
  territory: "잿불 언덕 광산 지대 전체의 관리권(소유는 멜리산드), 갱도 41곳. AS 311 황무지 동쪽 경계 2리 확장으로 동쪽 갱도 4곳이 재에 묻혔다"
  wealth: "철·은·잿불석(AS 241 대량 채굴 시작). 소유권은 멜리산드, 가문은 관리 수수료와 채굴량 일부"
  force: "독가스 장치(드루스가 갱도마다 숨겼다) — 봉기 시 광부 전원을 죽일 수 있다. 크릭 감독 약 40. 지지율 6 (멜리산드)"

