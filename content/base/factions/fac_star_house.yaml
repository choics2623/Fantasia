# 별의 집 — 아스테리온의 후예(소문). 인간 숨은 혈통: 성(姓)이 없으므로 비밀 이름·구전·유품으로만 잇는다.
# 근거: HOUSES §4.1, §4 머리말, history 카드(npc_asterion), facts/history.yaml.
id: fac_star_house
name: 별의 집 (아스테르 — 노예말로 '별 아궁이')
kind: house
secret: true            # 비밀 이름을 입에 내는 것은 '성을 참칭한 죄' — 혀를 자를 수 있다
race: [인간(평범)]
governance: 열쇠 경합 (구전 계보 — 머리가 없다)  # 한 집안이 아니라 '청동 열쇠'를 가졌다고 주장하는 세 집안과 하나의 노래
motto: "…별 아래에서. (가족끼리 이름을 부를 때 마지막에 붙이는 말)"
seat: "없음 — 열쇠가 있는 곳이 집이다. 루멘(노르나·칼), 세렌(리스), 잿불 언덕 굴 태생 마을(에멧). 시조의 도시 아스테리아는 재의 황무지(옛 아스테리아)에 있다"
size:
  members: "주장자 4명 + 칼 — 노르나(61), 칼(17), 리스(24), 에멧(70). 열쇠를 둘러싼 이야기를 아는 사람은 더 많다"
  territory: "없음. 루멘 순례자 숙소와 세탁장, 세렌 계약민 서기 숙소, 잿불 언덕의 굴"
  wealth: "청동 열쇠(손가락 길이, 손잡이에 여덟 갈래 별) 셋 — 최소 둘은 가짜"
  force: "없음. 이름 없는 자들·잿빛 탑·드라반 붉은발톱이 열쇠를 노린다 — 별의 집은 쫓기는 쪽이다"

decision: >
  별의 집에는 결정이 없다. 가문은 하나가 아니라 이야기 셋이다 — 아스테리온의 딸 리스가 은빛 강을 따라 남쪽으로 간 뒤의 이야기가 노래마다 달랐고,
  그 갈래마다 열쇠 하나가 붙었다. 세 집안은 서로를 '가짜'라 부르지 않고 '다른 노래'라 부른다(그렇게 부르는 것이 집안 규약이다).
  세 집안은 한 번도 한자리에 모인 적이 없다. 열쇠 맞춤(세 열쇠를 한곳에 놓는 일)은 가장 오래된 금기이고, 그 이유는 안전이다 — 세 열쇠를 한 손에 모으면 하나만 잿빛 탑 봉인 서가의 일곱째 칸을 열 것이고 그 순간 가문은 사냥감이 된다.
  그래서 의사 결정이라 부를 만한 것은 '누구에게 노래를 넘기는가' 하나뿐이다. 노래는 입으로만 넘기며, 넘기는 사람은 가장이 아니라 그 노래를 가장 정확히 외운 사람이다.
  거부권은 침묵이다 — 외운 사람이 입을 닫으면 그 갈래의 노래는 거기서 끝난다.
succession: >
  계승은 외움의 정확함이다. 가장이라 부를 사람이 따로 없고, 열쇠는 '가장 오래 숨겨 온 사람'이 지닌다. 노르나가 죽으면 열쇠는 손자 칼이 잇는다(성표 안에 숨긴 채).
  리스(세렌 서기)는 조상의 이름을 받은 사람이다 — 이름도 열쇠도 그녀 대에서 끊길 수 있다. 에멧은 아이가 없다. 혈통은 잔향을 잇지 않으므로 '진짜' 후손이라 해도 평범한 인간이다.

offices:
