    chosen_by: "공석 — 셋이 한 번도 만난 적이 없고, 중재자를 뽑을 합의도 없다"
    perks: []

ranks:
  - {id: rank_keyholder, title: "열쇠 지닌 자", duties: "열쇠를 숨기고 노래를 외운다", privileges: "별 매듭과 '…별 아래에서'를 쓴다", open_to_player: false}
  - {id: rank_successor, title: "노래를 배우는 자 (견습)", duties: "노래를 입으로 배운다", privileges: "집안 이름(아스테르)을 안다", open_to_player: false}
  - {id: rank_kin_by_song, title: "노래 아래의 사람 (집안이 인정한 외부인)", duties: "별 매듭을 알아보고 열쇠에 대해 입을 다문다", privileges: "별의 집의 보호 — 숨는 곳과 소식", open_to_player: true, condition: "별 매듭을 알아보고 '…별 아래에서'를 받는다. 집안은 열쇠를 보여 주지 않는다 — 대신 이야기를 들려준다(하나의 갈래만)"}

law:
  crimes:
    - {act: "열쇠를 낯선 이에게 보이거나 팔거나 맡김", punishment: "'아궁이를 판 자' — 집안 노래에서 이름이 빠진다", note: "구전 규약. 집안 안에서는 가장 무거운 죄"}
    - {act: "세 열쇠를 한곳에 모음", punishment: "모으려는 자를 집안이 막는다 — 하나만 서가를 열고 그 순간 사냥이 온다", note: "구전 규약 — 열쇠 맞춤의 금기"}
    - {act: "다른 갈래의 열쇠를 '가짜'라 부름", punishment: "그 갈래의 노래에서 쫓겨난다", note: "구전 규약 — '다른 노래'라고만 말한다"}
    - {act: "비밀 이름(아스테르)을 입 밖에 냄", punishment: "성을 참칭한 죄 — 제국법은 혀를 자른다. 집안은 노래에서 그 사람의 이름을 지운다", note: "제국·세렌·루멘의 인간법과 겹친다"}
    - {act: "별 매듭을 낯선 이에게 사용함", punishment: "경고 후 노래 전수 중단", note: "구전 규약"}
    - {act: "노래를 글자로 적음", punishment: "재의 법: 글자는 사형. 집안은 적은 자를 '글 먹은 자'로 부르고 가르침을 중단한다", note: "인간 대상 — 제국법과 집안 규약이 같다"}

customs:
  greeting: "왼손 엄지와 검지로 별 매듭(수신호). 가족끼리 이름을 부를 때 마지막에 '…별 아래에서'를 붙인다."
  taboos:
    - "열쇠를 보이는 것, 열쇠를 '열쇠'라 부르는 것(노래에서는 '문고리')"
    - "세 열쇠를 한곳에 모으는 것"
    - "아스테리온을 '구원자'나 '영웅'이라 부르는 것 — 집안에서는 '그분'이라고도 하지 않고 '아버지'라고만 한다"
    - "리스의 마지막을 노래로 확정하는 것 — 갈래마다 다르게 끝나는 것이 규약이다"
  rites:
    - {name: "열쇠 닦기", when: "재의 날 둘째 밤 (불 금지일)", what: "불 없이 어둠 속에서 열쇠를 손끝으로 닦는다. 노래를 낮게 한 번 읊는다. 이름 없는 자들이 이 날 몰래 아스테리온을 기린다"}
    - {name: "사흘 걷기", when: "재의 날 사흘째", what: "리스가 대붕괴 사흘 전 도시를 떠난 사흘을 걸어서 되짚는다 — 남쪽으로 한 걸음씩 세며"}
    - {name: "이름 받기", when: "열세 살", what: "조상의 비밀 이름(아스테르)을 귓속말로 받는다. 받는 아이는 아무에게도 말하지 않겠다고 별 매듭으로 맹세한다"}
  speech: "완곡하고 낮다. 말끝에 '…별 아래에서'를 붙이는 것은 가족 사이뿐이고 낯선 이에게는 붙이지 않는다. '열쇠', '아스테리온', '대붕괴'를 직접 말하지 않고 '문고리', '아버지', '그날'이라 한다. 질문에는 질문으로 답하고, 노래는 요청받아도 한 소절만 준다."

membership:
  join: "혈통(노래를 받는 아이)과 노래의 암송. 외부인은 별 매듭을 알아보고 '…별 아래에서'를 받으면 '노래 아래의 사람'이 된다 — 열쇠에 대해서는 입을 다문다."
  leave: "나갈 수 없다 — 아궁이는 지울 수 없다. 노래를 버리면 '아궁이를 판 자'로 이름이 빠진다."
  signs: ["별 매듭 — 왼손 엄지와 검지", "이름 끝의 '…별 아래에서'", "청동 열쇠 — 손가락 길이, 손잡이에 여덟 갈래 별(성표 안에 숨기기도 한다)"]

