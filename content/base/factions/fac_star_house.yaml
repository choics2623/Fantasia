  - id: off_key_third
    title: 셋째 열쇠 지킴이 (잿불 언덕 갈래 — '배신자의 후손'을 자처)
    holder: "unnamed:에멧 (70, 잿불 언덕 굴 태생 노인)"
    reports_to: null
    powers: ["세 번째 열쇠", "'우리는 아스테리온의 딸이 아니라 아스테리온을 배신한 자의 후손'이라는 반쯤 다른 노래"]
    chosen_by: "굴 태생 가문의 마지막 낭송자"
    perks: []
  - id: off_key_witness
    title: 증언자 (외부 — 볼드 가문 서기)
    holder: "unnamed:볼드 가문 서기 — 진짜 열쇠는 잿빛 탑 봉인 서가의 자물쇠와 같은 장인의 솜씨라고 증언한 적이 있다"
    reports_to: null
    powers: ["열쇠의 장인을 안다"]
    chosen_by: "외부 — 별의 집이 아니다. 증언 한 번으로 가문을 사냥감으로 만들 수 있다"
    perks: []
  - id: off_key_arbiter
