    title: 첫째 열쇠 지킴이 (루멘 갈래)
    holder: "unnamed:노르나 (61, 루멘 세탁부 — 바알카르의 노라와는 다른 사람)"
    reports_to: null
    powers: ["열쇠를 성표 안에 숨겨 목에 건다", "루멘 갈래의 노래를 가장 오래 외운 자"]
    chosen_by: "가장 오래 숨겨 온 자"
    perks: ["성표 안의 열쇠 — 신도의 목걸이로 위장"]
  - id: off_key_first_heir
    title: 첫째 열쇠의 견습 (후계)
    holder: "unnamed:칼 (17, 노르나의 손자 — 루멘 순례자 견습)"
    reports_to: off_key_first
    powers: ["노래를 배우는 중", "순례자 신분으로 대성당에 출입"]
    chosen_by: "노르나의 선택 — 손자"
    perks: []
  - id: off_key_second
    title: 둘째 열쇠 지킴이 (세렌 갈래)
    holder: "unnamed:리스 (24, 세렌 계약민 서기 — 조상의 이름을 받았다)"
    reports_to: null
    powers: ["두 번째 열쇠", "세렌 오필 상가의 서기로서 글을 숫자 이상으로 읽는다(합법의 틈)"]
    chosen_by: "조상의 이름을 받음 — 노래로"
