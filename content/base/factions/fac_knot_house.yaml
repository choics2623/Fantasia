# 매듭집 — 돌아오는 이를 기록하는 집안. 인간 숨은 혈통: 글을 쓸 수 없으므로 말과 사건을 '매듭줄'에 묶는다.
# 근거: HOUSES §4.10, history 카드(npc_dara, npc_gregor7), nameless 파일(페니 구출).
id: fac_knot_house
name: 매듭집 (기억 매듭줄의 집)
kind: house
secret: true
race: [인간(평범)]
governance: 매듭줄 읽기 — 세 손 규칙 (장녀 계보)  # 읽는 법은 집안의 장녀에게만 전한다. 새 매듭은 세 사람이 당겨 확인한다
motto: "한 번 더 묶는다. 한 번 더 읽는다."
seat: "루멘 외곽 순례자 숙소(오마) / 은빛 강 짐꾼 길(다브) — 매듭줄의 소재는 숙소 지하 항아리 안"
size:
  members: "오마(80), 증손녀 페니(10), 손자 다브(34) — 매듭을 읽을 줄 아는 이는 오마와 그녀가 가르치는 페니"
  territory: "없음 — 순례자 숙소와 강 길 위의 짐꾼 신분"
  wealth: "기억 매듭줄 — 길이 약 40걸음, 매듭 1만 2천 개. AS 100부터 9대에 걸쳐 서로 다른 잔향자 여섯(다라 + 이름 없는 아이 다섯)이 남긴 말과 '아직 오지 않은 날'의 기록"
  force: "없음. 아홉 대째의 집안이 정화청과 잿빛 탑의 이목에서 이 줄을 지켜 왔다는 사실뿐"

decision: >
  매듭집의 결정은 '무엇을 기록하는가'다. 읽는 자(오마)는 새로 들은 일을 매듭줄에 묶을지 정하고, 묶는 매듭은 반드시 세 사람이 필요하다 — 묶는 사람, 줄의 양끝을 잡는 장녀 후보, 그리고 짐꾼.
  셋이 매듭에 손을 걸고 당겨 확인하면 매듭이 선다. 한 사람이라도 줄을 놓으면 매듭을 풀고 다시 묶는다(세 손 규칙). 거부권은 줄을 놓는 것이다.
  매듭줄은 숙소 지하 항아리 안에 있고, 한 번에 한 사람(오마)만 만진다. 읽는 법은 집안의 장녀에게만 가르친다 — 오마가 죽으면 장녀가 줄을 읽는다.
  외부의 요청(예: 플레이어가 자기 회차의 일을 매듭으로 묶어 달라는 것)은 오마의 판단이다. 오마는 묶어 줄 수 있으나 그 매듭은 그 회차에서만 남는다 — 회귀하면 오마는 그 매듭을 묶은 적이 없다.
  가장 위험한 결정은 '매듭줄을 내놓을 것인가'다. 줄은 잔향이 하나라는 것과 그것이 회귀라는 것을 증명하는 유일한 인간 측 기록이고, 잔향 사냥이 태운 다른 아이들이 모두 무고했다는 증거다 — 내놓으면 집안이 정화청에 불탄다.
succession: >
  읽는 자는 집안의 장녀가 잇는다. 오마(80)의 증손녀 페니(10)가 장녀 계보인데 매듭줄의 노래를 너무 잘 외워 '오지 않은 날을 말하는 아이'로 밀고당했다 — 정화청 심문 대기 중이다. 그녀는 평범한 아이다.
  페니가 불타거나 죽으면 계보가 끊긴다. 다브(34, 은빛 강 짐꾼)가 아들을 낳아도 읽는 법은 장녀에게만 가므로 다음 장녀를 찾는 일이 집안의 가장 큰 일이다.
  혈통은 잔향을 잇지 않는다 — 매듭집 사람들은 평범한 인간이다. 다만 200년 동안 다섯 번 잔향이 이 집안 가까운 아이에게 깃들었다(같은 영혼, 다른 사람).

