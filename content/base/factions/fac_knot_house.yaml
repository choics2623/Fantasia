  - {id: rank_hand, title: "손 (줄의 양끝을 잡는 자)", duties: "매듭이 서는 데 한 손을 보탠다", privileges: "매듭줄의 내용을 듣는다", open_to_player: false}
  - {id: rank_listener_of_knot, title: "매듭을 들은 자 (외부)", duties: "매듭줄을 밀고하지 않는다", privileges: "오마가 한 번 읽어 준다 — 이름 없는 아이들의 매듭 하나", open_to_player: true, condition: "페니를 정화청과 이졸에게서 지키거나 오마의 신뢰를 얻는다. 플레이어 안의 목소리가 이름 없는 아이들의 매듭을 알아본다. 회차의 일을 매듭으로 묶어 달라고 할 수 있다 — 그 회차에서만"}

law:
  crimes:
    - {act: "매듭줄을 낯선 이에게 보임", punishment: "집안은 그 사람의 가르침을 거둔다 — 정화청이 줄을 압수하면 집안이 불탄다", note: "집안 규약 — 가장 무거운 죄"}
    - {act: "읽는 법을 장녀 아닌 사람에게 가르침", punishment: "읽는 자가 그 사람의 기억에서 법을 지우는 것은 불가능하다 — 집안은 그를 '손'에서 제외한다", note: "집안 규약"}
    - {act: "한 사람이 혼자 매듭을 묶음", punishment: "세 손 규칙 위반 — 매듭을 풀고 다시 묶는다", note: "집안 규약"}
    - {act: "매듭줄의 매듭을 풀거나 끊음", punishment: "줄은 잔향의 증거다 — 집안은 끊은 자를 추방한다", note: "집안 규약"}
    - {act: "아직 오지 않은 날을 아이가 말하는 것을 숨김(징후 은폐)", punishment: "정화청의 징후 사냥 대상 — 밀고. 집안은 아이를 먼저 감춘다", note: "교단법 — 순종의 빛 정화청. 페니가 이 죄로 밀고당했다"}
    - {act: "글자를 씀", punishment: "재의 법 사형 — 그래서 매듭줄이다. 집안은 매듭을 '글이 아니다'라 한다", note: "제국·루멘 인간법"}
    - {act: "비밀 이름(매듭집)을 낯선 이에게 말함", punishment: "성을 참칭한 죄 — 혀를 자를 수 있다", note: "인간법 + 집안 규약"}

customs:
  greeting: "손가락 둘에 줄 한 올을 감아 보인다 — 매듭을 아는 자의 표식. 답은 상대가 줄 한 올을 감아 반쯤만 풀어 보이는 것. 낯선 이에게는 하지 않는다."
  taboos:
    - "매듭줄을 한 번에 펼치는 것 — 40걸음이 한 번에 보이면 안 된다"
    - "아직 오지 않은 날을 아이에게 확인하는 것 — '그날'을 묻는 것"
    - "'또 그 아침이야'라는 아이의 말을 어른이 되풀이하는 것"
    - "다라를 '붉은 손'이라 부르는 것 — 집안에서는 '첫 매듭'이라 한다"
  rites:
    - {name: "세 손 묶기", when: "새 매듭이 필요할 때", what: "읽는 자가 묶고 장녀와 짐꾼이 양끝을 잡아 당겨 확인한다"}
    - {name: "한 올 읽기", when: "재의 날 사흘째", what: "읽는 자가 매듭줄에서 한 올만 골라 낮게 읊는다. 40걸음을 1년에 한 올씩 읽는다"}
    - {name: "이름 없는 아이들의 매듭", when: "아이가 '또 그 아침이야'라고 울었을 때", what: "그 아이의 말을 매듭 모양으로 묶는다 — 아이는 대개 곧 끊긴다(매듭이 짧다)"}
    - {name: "항아리 점검", when: "서리월", what: "지하 항아리의 습기와 줄의 상태를 확인한다"}
  speech: "낮고 느리다. 사람 이름을 부르지 않고 매듭의 이름('세 번째의 아침', '짧은 매듭')으로 부른다. 말끝에 손가락으로 줄을 감는 동작을 곁들인다. '시간', '돌아옴' 같은 말을 쓰지 않고 '같은 날이 다시 왔다'고 한다. 반문과 침묵이 길다."

