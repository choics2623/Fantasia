# 다라손 — 붉은 손 다라의 피. 인간 숨은 혈통: 손자국과 노래로 잇는다.
# 근거: HOUSES §4.2, history 카드(npc_dara), emberhills 카드(npc_rok), facts/emberhills.yaml.
id: fac_darason
name: 다라손 (다라의 손)
kind: house
secret: true
race: [인간(평범, 광산 인간)]
governance: 갱조 구전 (손자국 계승)  # 갱도 막장 벽의 손자국이 곧 가문의 명부다
motto: "손은 벽에 있다."
seat: "잿불 언덕 9번 갱 막장 — 손자국 212개 벽 / 폐갱 '다라의 굴'(비축 곡괭이 200자루)"
size:
  members: "칼렙(58), 도르테(55), 야나(19) — 이보의 후손 약 40이 갱 곳곳에 흩어져 있다. 막장 벽의 손자국 212개"
  territory: "없음 — 9번 갱과 41개 갱도, 폐갱 '다라의 굴'"
  wealth: "다라의 곡괭이 머리(9번 갱 물웅덩이 아래), 노래 「붉은 길」 7절(처형자 1,300명의 이름), 로크의 곡괭이 200자루와 용불 기름 12통"
  force: "없음 — 갱조 동료 40명 정도의 신뢰. 제7갱반(로크)은 40명 중 3명이 목줄단 밀고자"

decision: >
  결정은 갱조의 몫이다. 같은 갱조 동료가 낙반에 깔려 죽을 때 그 피를 손바닥에 묻혀 벽에 찍은 사람들 — 다라가 AS 100 수확월에 한 일 — 이 가문의 최소 단위다.
  모임은 교대 사이의 짧은 틈, 9번 갱 막장에서 연다. 안건이 서면 모인 사람이 벽의 손자국에 손을 대고 침묵한다. 손을 벽에 둔 채 아무도 떼지 않으면 합의다.
  한 사람이라도 손을 떼면 안건은 보류되고, 손을 뗀 자가 이유를 말하지 않는 한 다음 교대까지 침묵한다. 거부권은 '손을 뗌'이다.
  봉기의 신호는 정해져 있다 — 하스트란 요새에 있는 다라의 오른손 미라를 가져와 9번 갱 벽에 '다시 찍는' 것. 그 전에는 누구도 곡괭이를 들지 않는다는 것이 칼렙의 규칙이고, 이름 없는 자들의 '기다려라'와 겹쳐 있다.
  의제는 대개 셋이다 — 누구를 숨길 것인가(밀고자 방지), 누구를 팔 것인가(절대 아니다), 언제 일어날 것인가(아직 아니다).
succession: >
  갱조장은 가장 많은 이름을 외운 사람이 잇는다. 노래 「붉은 길」 7절에는 처형자 중 기억되는 1,300명의 이름이 들어 있고, 한 절을 외우면 한 절씩 책임이 따른다.
  칼렙(58)이 쓰러지면 누이 도르테와 딸 야나가 있으나 야나는 은비늘 요람 대기 감방에 끌려갔다 — 로크(제7갱반장)가 '붉은 길의 손자'로서 앞에 선다.
  이보(다라의 아들, 당시 8세)의 후손 약 40명은 각 갱에 흩어져 있고, 서로 손자국으로만 안다. 혈통은 잔향을 잇지 않으므로 다라손은 평범한 인간이다.

