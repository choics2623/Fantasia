law:
  crimes:
    - {act: "동료가 낙반에 깔려 죽었을 때 피를 묻히지 않고 돌아섬", punishment: "벽에 손자국을 찍을 자격이 없다 — 갱조에서 이름을 부르지 않는다", note: "구전 규약 — 다라의 일"}
    - {act: "밀고(목줄단에 갱조 동료를 넘김)", punishment: "그 사람의 손자국을 벽에서 지우고 갱조에서 쫓는다. 갱 밖에서 일어난 일은 '낙반'이다", note: "구전 규약. 제7갱반 40명 중 3명이 밀고자"}
    - {act: "노래 「붉은 길」을 글자로 적음", punishment: "재의 법: 사형. 집안은 적은 자의 절을 다른 사람에게 옮긴다", note: "제국법과 규약이 같다"}
    - {act: "신호 없이 곡괭이를 듦(봉기)", punishment: "갱조의 합의 없이 봉기를 하면 이름을 벽에서 지운다 — 그리고 41개 갱도가 번질 때까지 다음 신호는 없다", note: "구전 규약 — 칼렙의 규칙"}
    - {act: "아이를 이식 명부에 자원해서 넘김", punishment: "갱조에서 영구히 추방", note: "구전 규약. 팔지 않는다"}
    - {act: "하스트란 기사의 이름을 갱 안에서 부름", punishment: "붉은 길의 기억을 모욕한 것 — 갱조 회합에서 발언이 정지된다", note: "구전 규약 금기"}
    - {act: "비밀 이름(다라손)을 입 밖에 냄", punishment: "성을 참칭한 죄 — 제국법은 혀를 자른다", note: "제국법"}

customs:
  greeting: "손바닥을 상대에게 보이며 '손은?' — 답은 '벽에 있다.' 손바닥의 붉은 점(3대째 낙인)이 있으면 말없이 맞댄다."
  taboos:
    - "하스트란 기사의 이름, 다라의 오른손을 잘린 이야기를 농담으로 하는 것"
    - "붉은 길을 '반란'이라 부르는 것 — 갱조는 '행진'이라 한다"
    - "벽의 손자국 위에 새 손을 겹쳐 찍는 것 — 아기의 손은 빈 자리에만 찍는다"
    - "노래 7절을 순서 없이 부르는 것"
  rites:
    - {name: "손바닥 찍기", when: "아기가 태어난 날", what: "붉은 진흙에 손바닥을 찍어 갱도 깊은 곳 벽에 남긴다. 9번 갱 막장 벽에 212개"}
    - {name: "낙반의 날", when: "수확월 (AS 100 수확월 봉기 기일)", what: "9번 갱 막장에서 「붉은 길」 7절을 한 절씩 낭송하고 1,300명 중 기억되는 이름을 부른다"}
    - {name: "경고의 날", when: "태양월 12일", what: "용인 경비가 모두 붉은 길에 서 있는 날 — 광부들의 봉기 후보일(로크의 계획). 손 벽 앞에서 말 없이 맹세한다"}
    - {name: "이름 불러 주기", when: "갱조 사람이 죽을 때", what: "노래 사이에 죽은 이의 이름을 한 절에 끼워 넣는다 — 그 이름은 영원히 불린다"}
  speech: "짧고 거칠다. 갱도에서 하듯 낮게 속삭인다. 존대는 벽의 손자국의 오래됨으로 정한다(오래된 손자국의 주인이 먼저). 감정은 말하지 않고 손으로 표현한다 — 어깨에 손을 올리면 위로, 손바닥을 맞대면 맹세. 하스트란·붉은 길은 '그때'라고 말한다."

