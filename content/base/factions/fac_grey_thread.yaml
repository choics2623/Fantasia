# 플레이어의 사다리: 탈주자 하나를 숨겨 주면 매듭지기 후보 → 첫 임무 '굶주린 언덕의 세 식구를 다음 보름까지 루멘행 배에 태워라' → 실잡이 → (북부 실타래가 잡히거나 하겐 문제를 끝내면) 실타래.

cell_graph:
  rule: "매듭은 앞 매듭과 뒤 매듭 하나씩만 안다(사람이 아니라 장소와 신호). 실잡이는 자기 구간 두 매듭을 안다. 실타래만 실 전체를 안다. 매듭 하나가 잡히면 그 앞뒤 구간이 드러나고, 실은 사흘 안에 그 매듭을 건너뛰지 못하면 한 계절 끊긴다"
  lines:
    - name: 북부 실
      knots: ["까마귀 문 배수구(국경군 내통 — fact_gf_crowgate_drain)", "회색여울 '절름발이 수탉' 지하 (npc_bram)", "굶주린 언덕 셋째 동굴", "용의 대로 우회 숲길", "오르셀 노예선 '검은 물떼새' 호 (내통 선원 2)", "루멘 양초 공방 강가 동굴 (안나 밀랍손) / 순례자 숙소 물 없는 우물 (npc_agnes)", "늪길 — 늪 어귀 망꾼", "모르바 진흙등불 (npc_bern)"]
      weak_knot: "하겐 — 북부 실을 아는 '안내인'을 가장한 판매자. 지난 2년 탈주자 19명(HOUSES는 11명)을 바르그에 팔았고 매듭 두 곳이 노출되었다"
    - name: 장미 실
      knots: ["그림자장미 혈목장 채혈 헛간 기록판('병사')", "장미원 셋째 덤불 아래 지하 통로 (npc_cecile가 직접 연다)", "온실 바닥 수로", "붉은 갈대 선 (npc_tessa 호송, 이틀)", "모르바 진흙등불 (npc_bern)"]
      weak_knot: "퀸트 — 알라리크가 회유 중. 그가 돌아서면 장미 실 전체와 세실이 함께 드러난다"
    - name: 광산 실
      knots: ["잿불 언덕 폐갱도", "황무지 가장자리(재 폭풍 속)", "마지막 등불 (주춧돌 사냥꾼의 판잣집)"]
      weak_knot: "황무지 그 자체 — 생존율 약 40%"
    - name: 얼음 실 (북방 갈래)
      knots: ["돌무릎 골짜기 (npc_asta)", "뼈울타리 — 노예 맏이 스벤이 해마다 한 무리를 놓아준다", "서리 길 마지막 산장 (npc_matusz)", "마지막 불 (잉에)", "울음 고개 대피 동굴", "까마귀 문 → 굶주린 언덕 (북부 실과 합류)"]
      weak_knot: "썩은이빨 고개의 오우거, 그리고 볼크가 산장을 '탈주자 소굴'로 지목했다(fact_hg_volk_marked_lodge)"

infiltration:
  join_real: "탈주자를 한 명 숨겨 주면 매듭지기 후보. 첫 임무: '굶주린 언덕의 세 식구를 다음 보름까지 루멘행 배에 태워라' — 경비 교대, 바르그 순찰, 하겐의 밀고를 피해야 한다"
  join_fake: "하겐처럼 '안내인'을 가장해 들어오는 판매자가 가장 큰 구멍이다. 거르는 장치: 실잡이는 같은 길을 두 번 가지 않는다 / 매듭지기는 실잡이의 얼굴이 아니라 신호(물총새 말뚝, 갈대배 바닥 표식)로만 받는다 / 넘긴 사람이 다음 매듭에 닿았다는 '도착 매듭 끈'이 사흘 안에 돌아오지 않으면 그 실잡이는 다시 쓰지 않는다"
  proof_test: "잔향이라고 말하는 자에게 실타래들은 아무것도 시험하지 않는다 — 꺼린다. '잔향이 있는 구간은 반드시 바르그가 온다.' 그를 실에 태우지 않으려 하고, 실에 태우면 그 구간의 다른 승객을 먼저 보낸다"
  exposure: "냄새가 실을 드러낸다 — 바르그의 코는 사흘 거리를 쫓는다. 냄새 지우기 약(12시간)이 떨어진 구간, 그리고 회차가 쌓일수록 짙어지는 플레이어의 젖은 재 냄새가 실을 가장 쉽게 드러낸다"

law:
  crimes:
    - {act: "승객을 버림 (병자·아이를 길에 두고 감)", punishment: "다시는 실을 잡지 못한다", note: "실잡이 대상 — 실타래의 재량으로 예외(살아 있는 다수를 위해)"}
    - {act: "탈주자를 팖", punishment: "회색 여인의 매듭이 오면 죽음 — 매듭을 기다린다", note: "하겐"}
    - {act: "같은 길을 두 번 감", punishment: "그 구간을 한 계절 닫는다", note: "실잡이 대상"}
    - {act: "탈주 방조 (바깥 법)", punishment: "용제국: 교수형·가족 매각. 녹테른: 공물 명단. 흐로스가르드: 무관심", note: "인간 대상"}

customs:
  greeting: "실잡이와 매듭지기는 인사하지 않는다. 신호만 — 물총새 말뚝을 기울인다, 갈대배 바닥을 두 번 두드린다, 장미 꽃잎을 놓는다, 양초 심지를 매듭짓는다."
  taboos: ["승객의 이름을 묻는 것", "'탈주'라는 낱말 — '남쪽으로 간다'고 한다", "실 위에서 불 피우기"]
  rites:
    - {name: "도착 매듭", when: "승객이 늪에 닿은 날", what: "진흙등불의 베른이 매듭 끈을 거꾸로 보내 실을 따라 올라오게 한다. 매듭 하나가 한 사람이다. 회색여울의 브람은 그 끈을 받으면 솥 밑바닥 누룽지를 아무에게나 준다"}
    - {name: "서리 길 첫날", when: "해빙월 서리 길이 열리는 날", what: "마지막 불에서 잉에가 바위 밑 룬을 새로 새긴다 — 첫 무리가 고개를 넘는 날짜"}
  speech: "날씨와 짐으로 말한다 — '짐이 셋'(사람 셋), '비가 오겠네'(바르그), '물이 불었다'(검문). 실잡이는 거의 말하지 않는다."

membership:
  join: "위 infiltration.join_real"
  leave: "매듭지기는 문을 닫으면 나간 것이다. 실잡이는 나갈 수 없다 — 그가 아는 두 매듭이 그의 목에 걸려 있다"
