# 잿빛 실 — 탈주 노예 지하 통로. 이름 없는 자들의 하부 조직. 실은 길이고, 매듭은 사람이다.
# 근거: HOUSES §5.5·§5.2·§3.2·§4.8, REGIONS §4.9(양초 공방)·§8.9·§13.5('얼음 실'), CHARACTERS R02-08·R04-05·R07-04·R08-02, facts/greyford.yaml·lumen.yaml·nocturne.yaml·hrosgard.yaml.
id: fac_grey_thread
name: 잿빛 실 (탈주 노예 지하 통로)
kind: secret
race: [인간, (협력) 녹테른 1·우르사 1·서리 와이번 1·늪 마녀]
governance: 세포 결사 — 길 그래프. 실타래(구간 책임자) 셋이 각자의 실을 쥐고, 매듭(은신처)은 앞뒤 매듭 하나씩만 안다
motto: "한 번에 한 매듭."
seat: 없음. 실의 끝은 모르바 늪 — 수령지 진흙등불·물안개 둑
size:
  members: "실잡이(길잡이) 약 120, 매듭지기(은신처) 약 60곳, 바늘(위조) 소수, 실타래 3"
  territory: "북부 실(까마귀 문 → 회색여울 → 굶주린 언덕 → 오르셀 노예선 → 루멘 → 늪길 → 모르바), 장미 실(그림자장미 혈목장 → 장미원 지하 → 붉은 갈대 → 모르바), 광산 실(잿불 언덕 폐갱 → 황무지 가장자리 → 마지막 등불), 북방 갈래 '얼음 실'(뼈울타리·돌무릎 골짜기 → 마지막 불 → 울음 고개 → 까마귀 문)"
  wealth: "은신처, 위조 통행증(1장 3일), 늪 마녀 냄새 지우기 약(바르그 추적 12시간 무력화), 잿빛 표"
  force: "없다. 운송량 연 약 400~600명 — AS 311 이후 북방 탈주자로 과부하(1,300명 대기)"

decision: >
  실타래 셋이 각자의 실을 맡는다. 실 위의 결정(언제, 몇 명, 누구를 먼저)은 실타래가 내린다 — 매듭지기는 '받는다/못 받는다'만 답한다.
  실타래끼리는 한 해 두 번(해빙월 서리 길이 열릴 때, 서리월 닫힐 때) 루멘 양초 공방 밀랍 저장고에서 심지 매듭으로 '대기 명단의 수'만 교환한다. 얼굴을 보지 않는다.
  누구를 먼저 보낼지(아이·장인·징후자·병자)는 공식 규칙이 있다 — 징후 표식(재 가로줄)이 있는 아이가 언제나 첫째. 나머지는 실타래의 재량이고, 그것이 이 조직의 가장 무거운 결정이다.
  배신자 처리는 실타래가 정하지 못한다 — 이름 없는 자들의 매듭(회색 여인)을 기다린다. 북부 실타래 '늙은 여울'은 하겐을 두고 2년째 매듭을 기다리고만 있다.
succession: "실타래가 잡히면 그 실의 매듭지기 중 가장 오래 버틴 매듭이 잇는다. 매듭이 잡히면 실잡이는 그 매듭을 건너뛰는 새 길을 사흘 안에 찾는다 — 못 찾으면 그 실은 한 계절 끊긴다."

