# 고리집 — 목줄단을 대대로 이어 온 집안. 인간 숨은 혈통 중 '배신자의 혈통'. 밀고 장부를 외워 잇는다.
# 운영 조직은 fac_collar(목줄단, 다른 작가) — 이 파일은 고리집이라는 집안의 몸이다.
# 근거: HOUSES §4.5, greyford 카드(npc_martha, npc_liz), facts/greyford.yaml.
id: fac_collar_house
name: 고리집 (목줄장 7대 집안)
kind: house
secret: true
race: [인간(평범)]
governance: 밀고 장부 구전 가장제  # 가장이 머릿속 장부를 쥐고 3조 규약으로 다스린다
motto: "목줄은 차는 자의 목도 조르지만, 쥐는 자의 손은 자유롭다."  # 시조 힐드
seat: "바알카르 — 수석 목줄장 에베르트의 처소 / 회색여울 레이번 성채 하인 숙소(마르타)"
size:
  members: "에베르트(60), 마르타(38), 마르타의 딸 리즈(14), 이다(45, 루멘). 7대에 걸친 집안"
  territory: "없음 — 목줄단의 핵심 자리(바알카르 수석, 회색여울, 루멘 정화청)를 대대로 차지한다"
  wealth: "목줄장의 쇠 지팡이(끝에 고리가 달린 검은 쇠막대), 머릿속의 밀고 장부 — 7대에 걸친 밀고 대상 이름 약 2,000개"
  force: "없음. 그러나 목줄단 전체의 정보망 — 집안이 이름 없는 자들 편으로 돌아서면 목줄단 전체가 뒤집힌다"

decision: >
  고리집의 결정은 가장이 한다. 가장은 머릿속의 밀고 장부를 쥔 자 — 7대에 걸친 밀고 대상 이름 약 2,000개를 순서대로 외운다. 현재 가장은 바알카르 수석 목줄장 에베르트(60)다.
  집안은 모이지 않는다 — 함께 앉으면 서로를 밀고할 수 있기 때문이다(그래서 규약 제2조가 있다). 대신 해마다 해빙월 첫 안식일 밤, 가장이 각 거점에 사람을 보내 '이번 해 놓아줄 하나'를 정하게 한다.
  그 외의 결정은 규약 3조로 닫힌다 — 규약이 정하지 못하는 일은 가장이 '장부에서 찾는다': 비슷한 일이 있었던 해의 처분을 불러내 같게 한다.
  거부권은 '장부를 닫음'이다 — 다음 가장에게 장부를 전수하지 않는다는 선언. 한 번도 쓰인 적이 없다.
  이름 없는 자들은 이 장부를 원한다(희생자 명부이자 배신자 명부이므로). 집안이 이름 없는 자들 편으로 돌아서면 목줄단 전체의 정보망이 뒤집힌다 — 규약 제3조가 그 유일한 틈이다.
succession: >
  가장은 장부를 가장 정확히 외운 자가 잇는다 — 가장이 죽기 전에 한 이름씩 후계에게 낭송해 넘긴다. 에베르트의 후계는 조카딸 마르타(38)이다.
  마르타의 딸 리즈(14)는 규약 제1조(열 살 아래는 팔지 않는다)의 보호에서 이미 벗어나 있고 그녀가 어머니의 장부를 이을지 아직 모른다.
  혈통은 잔향을 잇지 않는다 — 고리집도 평범한 인간이다.

