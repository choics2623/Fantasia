    chosen_by: "에베르트의 조카딸 — 열여섯에 첫 밀고, 23명의 이름을 외운다"
    perks: ["고드릭과의 약속: 밀고 100건을 채우면 리즈를 자유민 대우 하녀로(87건)"]
  - id: off_next_generation
    title: 마르타의 딸 (3대 후계 후보)
    holder: npc_liz
    reports_to: off_heir_martha
    powers: ["없음 — 규약 제1조의 보호 아래 있다가 벗어나는 중. 어머니가 지키려는 아이"]
    chosen_by: "혈통 — 장부를 아직 외우지 않았다"
    perks: []
  - id: off_lumen_branch
    title: 루멘 정화청 밀고자 (베른의 며느리)
    holder: "unnamed:이다 (45)"
    reports_to: off_head_ebert
    powers: ["루멘 정화청의 밀고 접수", "마테우스 휘하의 징후 고발 연락"]
    chosen_by: "혼인으로 들어온 며느리 — 목줄단 베른 가문의 며느리"
    perks: []
  - id: off_ledger_reciter
    title: 밀고 장부 낭송자 (가장 낭송 후계)
    holder: "unnamed:에베르트가 장부를 낭송해 넘기는 사람 — 지금은 마르타"
    reports_to: off_head_ebert
    powers: ["이름 2,000개를 순서대로 외운다 — 이름을 불러 주면 그날의 일을 기억한다"]
    chosen_by: "가장의 지명"
    perks: []
  - id: off_released_one
    title: 올해 놓아줄 하나 (해빙월에 정함)
    holder: null
    reports_to: off_head_ebert
    powers: ["그 사람은 밀고 장부에서 이름이 지워지고 집안이 그를 건드리지 않는다"]
    chosen_by: "공석 — 규약 제3조. 마르타는 올해 아직 쓰지 않았다. 플레이어가 그 '하나'가 될 수 있다"
    perks: []

