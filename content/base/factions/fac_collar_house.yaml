    chosen_by: "가장 정확히 외운 자 — 전대 가장의 낭송"
    perks: ["목줄장의 쇠 지팡이", "수석 목줄장의 지위"]
  - id: off_heir_martha
    title: 후계 — 회색여울 목줄장 (에베르트의 조카딸)
