  - {id: rank_head, title: "가장", duties: "밀고 장부를 외우고 3조 규약으로 집안을 다스린다", privileges: "쇠 지팡이, 놓아줌의 소집", open_to_player: false}
  - {id: rank_ring_blood, title: "고리집 사람 (피)", duties: "규약 3조를 지킨다", privileges: "같은 아궁이끼리 밀고하지 않는다", open_to_player: false}
  - {id: rank_married_in, title: "며느리·사위 (혼인으로 들어온 자)", duties: "집안의 밀고를 돕는다", privileges: "규약 제2조의 보호", open_to_player: false}
  - {id: rank_released, title: "놓아준 자 (규약 제3조로 풀려난 자)", duties: "없음 — 이름이 장부에서 지워진 자", privileges: "집안이 건드리지 않는다. 한 해의 보호", open_to_player: true, condition: "마르타나 에베르트가 올해의 '하나'로 정한 자. 밀고할 수 있었는데 하지 않은 자 — 플레이어가 그 대상이 될 수 있다"}

law:
  crimes:
    - {act: "열 살 아래 아이를 팔거나 밀고함", punishment: "집안에서 이름을 지운다 — 장부에서 그의 줄이 비워진다", note: "집안 규약 제1조"}
    - {act: "같은 아궁이(고리집) 사람을 밀고함", punishment: "가장이 그를 '놓아준 자'로 취급하지 않는다 — 장부에 올린다", note: "집안 규약 제2조 — 집안 안에서는 가장 무거운 죄"}
    - {act: "한 해가 가도록 '하나를 놓아주지' 않음", punishment: "다음 해빙월에 가장이 그 사람에게 '빚을 남겼다'고 선언한다. 빚이 남으면 장부가 무거워진다", note: "집안 규약 제3조"}
    - {act: "밀고 장부를 글자로 적음", punishment: "재의 법 사형. 집안은 적은 자의 장부를 다른 사람이 외운다", note: "제국법과 집안 규약"}
    - {act: "밀고 장부를 이름 없는 자들에게 넘김", punishment: "집안에서 영구 추방 — 목줄단은 그를 사냥한다", note: "집안 규약 — 장부가 희생자 명부이자 배신자 명부이기 때문"}
    - {act: "목줄장의 쇠 지팡이를 남에게 넘김", punishment: "가장의 자격 박탈", note: "집안 규약"}
    - {act: "비밀 이름(고리집)을 낯선 이에게 말함", punishment: "성을 참칭한 죄 — 혀를 자를 수 있다. 집안은 먼저 가장에게 보고한다", note: "인간법 + 집안 규약"}

customs:
  greeting: "'고리는?' — 답은 '쥐고 있다.' 서로 한 걸음 거리를 두고 상대의 목을 보지 않는다(목줄의 자리). 집안끼리는 이름을 부르지 않고 '고리'라고만 한다."
  taboos:
    - "집안끼리 한자리에 오래 앉는 것 — 서로의 밀고를 가능하게 한다"
    - "'배신자', '개'라는 말을 집안 안에서 쓰는 것"
    - "밀고 장부의 이름을 틀리게 부르는 것 — 이름은 정확히 외워야 한다"
    - "밀고 대상의 아이를 이름으로 부르는 것(열 살 아래)"
  rites:
    - {name: "놓아줌", when: "해빙월 첫 안식일 밤", what: "가장이 '이번 해 놓아줄 하나'를 정한다 — 밀고할 수 있었던 자 중 하나의 이름을 장부에서 지운다. 빚을 남기지 않기 위해"}
    - {name: "장부 낭송", when: "수확월 안식일 밤", what: "가장이 후계에게 이름 열 개씩을 낭송해 넘긴다. 7대에 걸친 2,000개를 2년에 걸쳐"}
    - {name: "쇠 지팡이 닦기", when: "재의 날 첫날", what: "목줄장의 쇠 지팡이를 불 없이 기름으로 닦는다 — 시조 힐드의 말을 낭송"}
    - {name: "첫 밀고 이름 외우기", when: "처음 밀고한 날", what: "그날의 이름을 가장에게 낭송한다. 그 이름은 평생 외워야 한다(마르타는 스물세 명을 안다)"}
  speech: "낮고 건조한 말투. 이름을 직접 부르지 않고 '그 사람', '그해의 사람'이라 한다. 약속을 하지 않고 '규약이 그렇다'고 한다. 밀고 이야기는 숫자('스물세 번째')로 말한다. 사과하지 않는다 — '놓아주었다'가 가장 가까운 사과다."

