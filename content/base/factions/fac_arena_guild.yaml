relations:
  - {to: fac_grom, stance: -20, note: "행렬 밖 — 해골이빨은 무관심, 피도끼는 투사를 소모품으로 쓴다(적대)"}
  - {to: fac_nameless, stance: 20, note: "행렬 밖 — 탈주자의 마지막 피난처가 여기다"}
  - {to: fac_barg, stance: -30, note: "행렬 밖 — 투사 거래"}
  - {to: fac_collar, stance: -20, note: "행렬 밖"}
toward_echo: "무관심에 가깝다. '100승을 하면 혈명 없는 혈명을 받는다. 죽고 다시 돌아올 필요가 있나?' — 그러나 잔향이 투사라면 그들은 가장 먼저 그를 따른다. 잔향이 백승자의 사슬(붉은 젖)을 드러내면 백승파가 무너지고 봉기파가 조합 전체를 쥔다."
player_paths:
  - "가입: 새끼 → 칼 → 흉터 → 문턱 → 100승. 회귀가 가장 정직하게 보상되는 사다리 — 몸의 상한에 묶이지만 기술은 남는다"
  - "봉기: 태양월 대축제 — 그라샤의 도전과 같은 날. 원형장 봉기(찬가 4단계)의 최적 시점이자 최악의 학살 시점"
  - "탈: 울브의 열쇠, 무르크의 배수로 — 뼈의 전당 지하. 탈을 빼내면 붉은 젖 금단으로 무너진다"
  - "고르바: 그는 마라의 100승 상대로 '군나르의 제자'를 찾는다 — 플레이어가 군나르에게 배웠다면 그 자리에 선다"
regression:
