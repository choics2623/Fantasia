  - {name: "백승파 (100승이 출구다)", leader: npc_mara, aim: "100승을 하면 혈명 없는 혈명 — 원형장 밖으로 걸어 나간다. 봉기는 동료를 다 죽인다. (그들은 백승자가 사슬에 묶여 있다는 것을 모른다)", strength: 40}
  - {name: "살아남기만 하는 자들", leader: null, aim: "새끼와 칼 다수. 오늘 살아남는 것", strength: 15}

assets:
