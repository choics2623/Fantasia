customs:
  greeting: "학자끼리: 자기 최근 논문 제목을 대고 상대의 것을 묻는다('「경계 말뚝의 떨림 셋째」 — 그대는?'). 원로에게는 한 층 아래 계단에서 멈추고 말한다. 서기 노예는 인사하지 않는다 — 고개를 숙이고 펜을 내려놓는다."
  taboos:
    - "'모른다'고 말하는 것 — '아직 측정되지 않았다'고 한다"
    - "피험자를 이름으로 부르는 것 — 번호로 부른다(할라만 예외처럼 불린다 — '기준체')"
    - "봉인 서가 일곱째 칸 앞에서 멈추는 것"
    - "칼의 이름을 소리 내어 부르는 것"
  rites:
    - {name: "낭독 논문", when: "해빙월·푸른월·포도월·긴밤월 첫날", what: "일곱 층 강당에서 논문을 읽고 정학자 셋의 봉인 도장을 받는다. 인간 서기들이 강당 뒤에서 모양만 받아 적는다"}
    - {name: "그믐의 일곱 의자", when: "매달 그믐", what: "원로 회의. 꼭대기 원탁 — 창이 일곱이고 하나는 늘 닫혀 있다(봉인 서가 쪽)"}
    - {name: "재의 날 측정", when: "재의 날 (연말 5일)", what: "모든 측정관이 황무지 경계와 탑 꼭대기 귀 기울이는 방에서 잔상 수를 센다 — 1년의 가장 큰 자료"}
  speech: "용언·엘다르어 학술어가 섞인 공용어. 단정 대신 측정치로 말한다('셋째 칸에서 열둘 중 넷'). 인간에게는 반말이 아니라 '대상'에게 쓰는 무감정한 존댓말 — 그것이 더 무섭다. 이레네는 '흥미롭다'를 가장 차가운 순간에 쓴다."

