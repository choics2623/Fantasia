# 잿빛 탑 (아르카스 학회) — 3,400년 사냥만 해 온 '돌아오는 자'를 처음으로 '이해'하려는 학자들. 가장 친절한 감옥.
# 근거: HOUSES §5.8·§2.8·§3.3(룬새김)·§3.2(흑수정)·§6.1, WORLD_BIBLE §1.3.1(시간 유리 칼)·§2(AS 201·214·268·305), REGIONS §10·§11.9(재눈 초소), CHARACTERS R10·R02-22, facts/arkas.yaml·greyford_b.yaml.
id: fac_ashen_tower
name: 잿빛 탑 (아르카스 학회)
kind: org
race: [용인, 엘다르, 두르강, 나가, 녹테른, 하르칸, 크릭, 아에리 — 학자 / 인간 — 서기 노예·피험자]
governance: 장인·학회 — 논문과 실험의 위계. 위에는 일곱 원로의 '일곱 의자'와 탑주의 봉인권
motto: "진실은 연구 대상이지 무기가 아니다. (탑주 이레네)"
seat: 아르카스 탑섬 — 열일곱 층 탑, 지하 '수집실', 봉인 서가, 꼭대기 '귀 기울이는 방' (REGIONS §10)
size:
  members: "학자 약 400 (용인 약 300 포함 — REGIONS 수치), 서기 노예 약 180~600 (문서마다 다르다 — 이 파일은 REGIONS 180을 상주, HOUSES 600을 볼드 가문 소속 포함 총수로 본다), 피험자(수집된 징후자) 약 230~400"
  territory: "아르카스 탑섬, 재의 황무지 재눈 초소(관측자 용인 8), 각지 '잿빛 눈' 수집관"
  wealth: "대륙 최대 서고, 봉인 서가(볼드 사본 포함), 맹약회의 '학술 의견' 제출권, 멜리산드·볼드 가문·세렌 오필 상가의 후원, 유물 구매(마지막 등불의 최대 구매자)"
  force: "잔향 사냥꾼 부대 '잿빛 눈' 12명, 시간 측정관, 그리고 시간 유리 칼 세 자루 — 진짜 죽음의 네 수단 중 하나"

decision: >
  학문의 일은 논문이 정한다 — 계절마다(해빙월·푸른월·포도월·긴밤월 첫날) 일곱 층 강당에서 '낭독 논문'을 발표하고, 같은 학파 정학자 셋의 '봉인 도장'을 받으면 탑의 지식이 된다.
  탑의 일(예산, 피험자 배분, 사냥꾼 파견, 맹약회의 학술 의견)은 '일곱 의자' — 일곱 원로가 매달 그믐 꼭대기 층 원탁에서 정한다. 넷이면 통과.
  그러나 탑주는 '봉인권'을 가진다: 봉인 서가·시간 유리 칼·잔향학파 수집실에 닿는 안건은 탑주 한 사람이 거부하거나 일곱 의자에서 빼낼 수 있다. 이레네는 AS 268 취임 뒤 이 권한을 44번 썼다.
  금지된 주제(아래 forbidden_topics)는 일곱 의자의 만장일치로만 풀 수 있고, 풀린 적이 없다.
  원로들은 각자의 바깥 주인(세렌 의회, 녹테른 흑수정 가문, 두르강 룬새김, 엘다르 은이슬)에게 먼저 보고한다 — 탑의 결정은 언제나 탑 밖에서 먼저 새어 나간다.
succession: >
  원로 자리가 비면 그 학파의 정학자 중 '봉인 도장을 가장 많이 받은 논문'의 저자가 일곱 의자 넷의 동의로 오른다. 탑주는 일곱 의자의 만장일치 — 실제로는 볼드 가문이 AS 201 창립 이래
  탑주를 낸다(공동 창립자 넷 중 볼드만 상주했기 때문). 이레네가 죽으면 그녀가 몸에 지닌 셋째 칼 '마지막 금'이 누구 손에 가는지가 계승 그 자체다.

forbidden_topics:
  - {topic: "시간의 진명 — 발화 실험", why: "AS 214 첫 칼 '첫 침묵'을 만들 때 실험자 넷이 잔상이 되었다. 시간 근원은 대붕괴 이후 어느 종족도 입에 올리지 않는다", penalty: "학자는 직위 박탈과 수집실 '관찰 대상', 인간 피험자는 즉시 시간 유리 칼 시험대", who_breaks_it: "진명학파 나엘리스는 흰 알 두루마리 복원에 시간의 목소리가 필요하다는 것을 안다 — 그녀만이 이 금지를 깨고 싶어 한다"}
  - {topic: "볼드 사본 — 대붕괴 목격기의 열람·인용", why: "공식 역사('인간이 세계를 찢었다')를 뒤집는다. 맹약회의의 재의 법이 그 역사 위에 서 있다", penalty: "봉인 서가 일곱째 칸은 탑주만 연다. 인용한 논문은 불태우고 저자는 탑을 떠난다(AS 241 한 번)", who_breaks_it: "이삭(볼드 수석 서기 노예)이 한 번 필사했다"}
  - {topic: "화형 통계 — '징후자 6,100명 중 잔향 0'", why: "AS 213 맹약회의의 잔향 사냥 의무가 무의미했다는 숫자다. 탑의 학술 의견이 그 정책을 지지해 왔다", penalty: "발표 금지. 숫자를 쓴 장부는 기록학파 금고에", who_breaks_it: "틱 셈쟁이가 셈했고 아무에게도 말하지 않았다"}
  - {topic: "인간에게 글 '쓰기'를 가르침", why: "재의 법·사슬의 맹약 제2조. 서기 노예에게는 '숫자와 기호만'", penalty: "학자는 맹세 위반(두르강은 돌화), 서기는 피험자로", who_breaks_it: "오틸리는 '읽기'만 가르친다 — 맹세의 틈. 그러나 오른손이 손목까지 돌로 굳어 간다"}
  - {topic: "고동 — 카즈둠 깊은 문 아래의 것", why: "두르강 왕가와의 자료 협정(룬새김 씨족 경유)의 조건. 깊은 문은 두르강의 일이다", penalty: "자료 압수, 두르강 원로 해그가 탑을 떠난다", who_breaks_it: "해그 룬새김은 깊은 문의 룬과 황무지 균열의 룬이 같은 손의 글씨라는 것을 발견했다 — 논문은 서랍 속에 있다"}
  - {topic: "순종의 빛의 기원", why: "엘다르 은이슬·빛실 가지 후원의 조건", penalty: "후원 철회 — 원로 둘이 떠난다", who_breaks_it: "없음. 기록학파 오필 시라는 세렌에 먼저 팔 생각을 한다"}
  - {topic: "시간 유리 칼의 제조법", why: "탑이 가진 유일한 '진짜 죽음'. 300년 동안 세 자루", penalty: "제조법은 탑주의 머릿속과 금고 하나에만 — 쓴 자는 칼의 시험 대상", who_breaks_it: "—"}

