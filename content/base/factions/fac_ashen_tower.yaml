law:
  crimes:
    - {act: "금지된 주제를 연구·발표", punishment: "위 forbidden_topics의 벌", note: "학자 대상"}
    - {act: "봉인 서가 무단 열람", punishment: "학자는 탑에서 추방, 서기·피험자는 수집실", note: "모두"}
    - {act: "서기 노예가 읽을 줄 앎이 들킴", punishment: "피험자로 옮긴다", note: "인간 대상 — 서기 약 180 중 약 70이 읽는다. 탑은 모르는 척한다"}
