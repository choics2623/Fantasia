toward_echo: "산 채로 잡는다. 아우락스(태운다)와 멜리산드(이식한다) 사이에서 탑은 '연구한다'를 고른다 — 플레이어에게는 가장 친절한 감옥이다. 판별법: 진명 한 음절에 수명이 0이면 진짜. 그리고 탑은 진짜를 끝낼 칼 세 자루를 쥐고 있다. 이레네의 장부에는 회차가 쌓일수록 더 일찍 '설명되지 않는 기시감. 북쪽.'이 적힌다."
