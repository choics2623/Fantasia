  - {name: "마리엘 원형장파", leader: null, aim: "도박과 인간 투사 시합. 그롬과 통하는 줄", strength: 15}
  - {name: "코넬의 흔들림", leader: null, aim: "인간 아이를 놓아준 견습. 아직 파벌이 아니다", strength: 5}
