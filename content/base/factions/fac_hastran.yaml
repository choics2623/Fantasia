toward_echo: "화형 → 단절. 아우락스 진영의 한 축이다. 발레리우스는 대붕괴의 '무언가'를 본 사람이고, 잔향 사냥이 왜 계속되는지 안다 — 증언을 하느냐 불을 끄고 자느냐가 이 가문의 선택이다."
player_paths:
  - "다라의 손 — 전리품 홀의 미라를 훔쳐내면 잿불 언덕 광부 전체를 일으킬 상징이 된다 (붉은 길 이후 베르미온과의 원한도 건드린다)"
  - "발레리우스의 증언 — 대붕괴의 목격자. 증언은 아우락스를 배신하는 일이다 (지지 6점이 움직인다, 단 발레리우스 사망 시 테렌스가 더 강경)"
  - "방패 노예 — 징발되어 최전열에서 살아남거나 탈주한다"
  - "코넬 — 인간 아이를 놓아준 견습 기사. 한 번 더 놓아주게 만들 수 있다"
  - "마리엘 — 원형장 도박판에서 정보와 줄을 얻는다"
regression:
