    chosen_by: "후작 지명"
    perks: ["군나르의 99승째 경기를 직접 보았다 — 투사 시합 최대 도박꾼"]
  - id: off_squire
    title: 견습 기사 (손자)
    holder: "unnamed:코넬 하스트란 — 48세"   # TODO-NPC
    reports_to: off_deputy
    powers: ["첫 임무 수행 중인 견습"]
    chosen_by: "가문 관례"
    perks: ["탈주자 추격 첫 임무에서 인간 아이를 놓아준 적이 있다"]
  - id: off_keep_warden
    title: 하스트 요새 관리인
    holder: "unnamed:하스트 요새 성주대리 — 용인"
    reports_to: off_marquis
    powers: ["요새 살림·노역 인간 관리·성벽"]
    chosen_by: "후작 지명"
    perks: ["성벽에 매다는 처형 집행의 책임"]
  - id: off_trophy_hall
    title: 전리품 홀 지기
    holder: "unnamed:전리품 홀 관리 용인"
