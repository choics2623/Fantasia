    powers: ["요새 전리품 홀 — 붉은 손 다라의 오른손 미라가 유리함에 보관되어 있다"]
    chosen_by: "후작 지명"
    perks: []
  - id: off_shield_master
    title: 방패 노예 조련관
    holder: "unnamed:방패 노예 조련 용인 기사"
    reports_to: off_deputy
    powers: ["전시 인간 노예 징발과 최전열 배치 (거인 전쟁에서 도입한 방패 노예 전술)", "평시에는 요새 노역"]
    chosen_by: "부단장 지명"
    perks: []
  - id: off_pursuit_liaison
    title: 탈주자 추격 계약 연락관
    holder: "unnamed:바르그 조합 연락 용인 기사"
    reports_to: off_south_gate
    powers: ["바르그 노예사냥 조합과의 탈주자 추격 계약"]
    chosen_by: "남문 수비대장 위임"
    perks: []
  - id: off_arena_bets
    title: 원형장 내기 관리인
    holder: "unnamed:비늘기사 내기 수금 담당"
    reports_to: off_south_gate
    powers: ["그롬마르 '피의 원형장' 인간 투사 시합에 건 내기 — AS 241 개장 이후 이어 온 가문 수입"]
    chosen_by: "마리엘 지명"
    perks: []

ranks:
  - {id: rank_marquis, title: "후작 (단장)", duties: "가문과 군의 법", privileges: "서약의 표, 동원령", open_to_player: false}
  - {id: rank_commander, title: "직계 지휘관", duties: "부단장·남문 수비·견습", privileges: "기사단 지휘선", open_to_player: false}
  - {id: rank_knight, title: "비늘 기사", duties: "드레이크 기병, 창 돌격 후 장검", privileges: "순혈 직계 외에도 비늘혈 무관이 오른다. 불의 잔 자격은 없다", open_to_player: false}
  - {id: rank_levy, title: "징집병", duties: "전시 징집된 용인 하급·비늘혈", privileges: "기사단 뒤의 보병", open_to_player: false}
  - {id: rank_shield_slave, title: "방패 노예", duties: "전시 최전열 — 용인 장교는 '인간 셋을 잃어도 기사 하나는 잃지 마라'를 교리로 배운다", privileges: "없다 — 평시에는 요새 노역", open_to_player: true, condition: "하스트란 소유로 팔리거나 징발될 때 입문. 크릭 감독관이 뒤에서 몬다"}
  - {id: rank_fort_labor, title: "요새 노역 인간", duties: "하스트 요새 노역", privileges: "탈주자가 성벽에 매달린 것을 보는 것 외에는 없다", open_to_player: true, condition: "국유 노예 배당 또는 사유"}

decision: "후작이 명령하고 부단장이 집행한다. 의논은 기사단 막사의 저녁 식탁에서 이루어지며 토론이라기보다 후작의 침묵이 승인이다. 동원령은 후작의 인장과 아우락스의 서약 사자가 함께 있어야 선다 — 지금 AS 312 여름 동원 대기령은 아직 비공개다."
succession: "장자 상속. 후작이 죽으면 부단장 테렌스가 단장. 테렌스는 아버지보다 강경하다 — 발레리우스의 죽음 자체가 하스트란을 더 단단한 아우락스 쪽으로 만든다 (지지율 6 유지). 단 발레리우스가 대붕괴 증언을 선택하면 가문이 쪼개진다."

law:
  crimes:
    - {act: "탈주자 (하스트란 소유 인간)", punishment: "요새 성벽에 매단다", note: "공개 처형. 도주 추격 중 포획된 외부 탈주자도 같다"}
    - {act: "전시 방패 노예의 후퇴", punishment: "즉결 — 뒤의 크릭 감독관이 베거나 기사가 드레이크로 짓밟는다", note: "방패 노예는 후퇴가 허용되지 않는다"}
    - {act: "기사가 인간 셋을 위해 기사 하나를 잃는다 (지휘 실책)", punishment: "단장의 징계 — 비늘 박탈", note: "교리 '인간 셋을 잃어도 기사 하나는 잃지 마라'"}
    - {act: "비늘기사가 명령 없이 결투한다", punishment: "후작의 판결 — 가문 내 결투는 아버지 앞에서만", note: "혈족 법과 별개"}
    - {act: "인간 아이를 놓아준다 (탈주자 추격 중)", punishment: "공식 처벌 없음 — 아버지가 알면 훈계, 단장이 알면 '다음 임무에서 보충'", note: "코넬의 선례"}
    - {act: "전리품 홀의 다라의 손을 건드린다", punishment: "즉결 처형 (가문원은 이름 삭제)", note: "잿불 언덕 광부 전체를 일으킬 상징물"}
    - {act: "비늘 서약을 아우락스 외 다른 용에게 한다", punishment: "가문 파문 — 대대로 아우락스 서약", note: ""}

customs:
  greeting: "기사는 오른 주먹을 가슴 비늘에 대고 창을 세운다(문장의 교차한 두 창). 대화는 짧다. 후작 앞에서는 묻지 않고 대답한다."
  taboos:
    - "'붉은 길'의 숫자(1만)를 가문 밖에서 입에 올리는 것 — 숫자 뒤에 다라의 이름이 따라 나온다"
    - "불에 대한 두려움 — 후작이 불을 끄고 자는 것을 지적하지 않는다"
    - "모르간트를 '겁쟁이'가 아닌 '국경의 사람'이라 부르는 것 (가문은 경멸을 소리 내어 말한다)"
    - "방패 노예에게 이름을 붙이는 것"
  rites:
    - {name: "창 교차 서약", when: "기사 서임 때", what: "두 은빛 창을 교차하고 그 사이에 붉은 발톱을 올려 맹세한다. 아우락스에게 비늘 서약을 새로 한다"}
    - {name: "푸른월 출정식", when: "푸른월 (전쟁 시즌)", what: "방패 노예 점호 — 번호를 부르고 낙인을 확인"}
    - {name: "원형장 대축제 관람", when: "태양월", what: "마리엘이 선두에 서서 내기. 군나르의 99승 경기가 마지막 전설"}
    - {name: "재의 날의 침묵", when: "연말 5일", what: "불을 피우지 않는다. 발레리우스는 평소에도 그렇게 지낸다"}
  speech: "명령형과 단문. 존칭은 '각하'(후작), 동급에게는 '귀하'. 감정은 묻지 않고, 수치(기·인원·거리)로 말한다. 금지어: 후퇴, 겁, 불(후작 앞)."

membership:
  join: "출생(순혈). 비늘혈 무관은 비늘 기사로 서임(가문 소속 아님). 인간은 방패 노예로 징발·구매."
  leave: "죽음, 파문. 기사는 '비늘 박탈'로 가문 없는 기사가 된다."
  signs: ["검은 바탕 교차한 두 은빛 창, 그 사이 붉은 용 발톱", "비늘기사 갑옷의 붉은 발톱 각인", "방패 노예의 가슴 낙인"]

