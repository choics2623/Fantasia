# 하스트란 후작가 — "비늘기사단". 정본: HOUSES §2.2, §6.3 / RACES §3(전쟁 방식) / SUBRACES §3.4(청동발과의 지휘권 다툼)
# 주의: 카드 npc_valerius는 '발레리우스 화염문'(순혈 310세, 비늘 언덕 저택)으로 이 가문의 발레리우스(334세)와 다른 인물이다.
# 기준: AS 312 낙엽월 1일. 'unnamed:...' 홀더는 TODO-NPC.
id: fac_hastran
name: 하스트란 후작가
kind: house
race: [용인(순혈), 드레이크(탈것)]
governance: 봉건 위계 — 순혈 후작가, 군 지휘선이 곧 가문의 줄
governance_note: >
  후작이 가문의 법이자 비늘기사단 단장이다. 가문은 하나의 군대이고 군대는 하나의 가문이다 — 지휘선과 혈연이 같다.
  대대로 아우락스에게 비늘 서약. 평시에는 하스트 요새와 장원 6곳을 다스리고, 전시에는 비늘기사단 600기와 징집병 8,000을 움직인다.
  그리고 전시에 인간 노예를 최전열에 세우는 '방패 노예'가 가문의 오래된 전술이다(거인 전쟁에서 배웠다).
motto: "꺾이지 않으면 부러뜨린다."
seat: "하스트 요새 (용의 대로 남부) — 바알카르 남문 수비도 겸한다"
size:
  members: "순혈 직계 4 + 용인 기사 600(비늘기사단) + 징집병 8,000 + 방패 노예(전시 징발) + 요새 노역 인간"
  territory: "용의 대로 남부 하스트 요새와 주변 장원 6곳, 바알카르 남문"
  wealth: "장원 수입, 전리품 홀, 원형장 내기 수익(AS 241 이후 비늘기사들이 인간 투사 시합에 내기를 걸기 시작)"
  force: "비늘기사단 600기(드레이크 기병) · 징집병 8,000 · 그라넥의 군량 공급 · 아우락스 서부군에 합류. AS 312 여름 동원 대기령(비공개)"

offices:
  - id: off_marquis
    title: 후작 — 비늘기사단 단장
    holder: "unnamed:발레리우스 하스트란 — 후작, 334세"   # TODO-NPC (npc_valerius 화염문과 다른 인물)
    reports_to: null
    powers: ["가문의 법과 군 지휘 일체", "비늘기사단 600기·징집병 8,000의 동원", "아우락스에게 올릴 표 6 (지지율)"]
    chosen_by: "장자 상속 — 시조 하스트 굽은창 (SK 640, 아그라몬의 호위대장)"
    perks: ["가장 나이 든 현역 용인 기사", "대붕괴의 생존 목격자 — 당시 청년 기사로 아우락스의 기수였다"]
    note: "밤마다 불을 끄고 잔다. 대붕괴 때 아우락스 곁에서 '무언가'를 보았고 그 뒤로 불을 무서워한다"
  - id: off_deputy
    title: 부단장 (장남)
    holder: "unnamed:테렌스 하스트란 — 201세"   # TODO-NPC
    reports_to: off_marquis
    powers: ["부단장 — 기사단의 일상 지휘", "아버지의 사후 단장"]
    chosen_by: "장자 상속 예정"
    perks: ["아버지가 죽기를 기다린다. 발레리우스 사망 시 더 강경해진다"]
  - id: off_south_gate
    title: 남문 수비대장 (딸)
    holder: "unnamed:마리엘 하스트란 — 176세"   # TODO-NPC
    reports_to: off_marquis
