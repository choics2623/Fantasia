    - "발레리우스는 밤마다 불을 끈다, 대붕괴의 증언을 한 적 없다"
    - "다라의 손 미라가 유리함에 있다"
  flow:
    - "푸른월 출정 일자, 원형장 대축제 관람 일자"
  drift:
    - "그날 요새에서 성벽에 매달린 탈주자가 누구인가"
    - "코넬이 놓아주는 아이가 누구인가"
