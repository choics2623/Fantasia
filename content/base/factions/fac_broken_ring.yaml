toward_echo: "분열. 다수는 '잔향은 아우렐이 보낸 개혁자'라 믿고, 소수는 '잔향 때문에 아이들이 불탄다 — 그가 오지 않았으면 좋겠다'고 말한다. 알베릭은 잔향을 만나면 이렇게 말할 것이다: '당신은 돌아온다. 우리는 돌아오지 않는다. 그러니 우리 몫의 이번 생을 낭비하게 두지 마시오.'"
player_paths:
  - "가입: 운반자 → 고리 → 걸쇠. 회색여울 오스릭의 고리가 가장 가까운 입구"
  - "축일 작전: AS 313 꽃월 12일 그레고르 7세가 두 번째 설교를 낭독하게 만든다 — 증거(매듭줄·볼드 사본·『빛의 말씀』 원본·삭제된 마렌 설교)를 대사제에게. 그날 밤 정화청이 움직인다"
  - "알베릭: 모셔 오면 도망자, 두면 순교자(처형 가능). 베라를 두고는 나가지 않는다"
  - "무너뜨리기(어두운 길): 아델 한 사람을 정화청에 넘기면 결사 전체가 드러난다"
