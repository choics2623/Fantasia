# 끊어진 고리 — 순종의 빛 안의 지하 신도회. "사슬을 감은 것은 등불이 아니라 손이다. 손은 풀 수 있다."
# 근거: HOUSES §5.3·§4.6·§5.1·§6.1, WORLD_BIBLE §6.1·§2(AS 303)·§10(클락 #8), REGIONS §4.3·§4.9, CHARACTERS R02-10·R04-01·R04-02·R04-05, facts/lumen.yaml·history.yaml.
id: fac_broken_ring
name: 끊어진 고리 (순종의 빛 지하 신도회)
kind: secret
race: [인간 (사제·수도자·신도)]
governance: 세포 결사 (일곱 고리 사슬) — 기억으로 잇는 고리. 숨은 지도부 '일곱째 고리'의 합의
motto: "사슬을 감은 것은 등불이 아니라 손이다."
seat: 각 교구 성당 지하실·순례자 숙소. 루멘 순례자 숙소 '물 없는 우물'이 사실상의 심장 (lumen__pilgrim_street)
size:
  members: "약 1,400 (사제 약 90 포함). 루멘에만 약 400(사제 31)"
  territory: "일곱 대교구 전부 — 북부(회색여울)·루멘이 가장 두텁고 바알카르가 가장 얇다"
  wealth: "돈이 없다. 합법 성직자 신분, 순례 허가증, 성당 지하실, 사제의 문해력이 재산이다"
  force: "없다. 간수 둘(침묵의 우물), 순례 허가증을 쥔 수녀들, 그리고 '빛의 서신' 필사본 17부"

decision: >
  일곱 명이 한 '고리'. 고리는 대표 하나('걸쇠')를 교구 '사슬'에 보낸다. 사슬은 안식일 예배 뒤 성당 지하실에서 '낭독 연습'을 핑계로 모인다(한 달에 한 번).
  결정은 만장일치가 아니라 '벌어짐'으로 한다 — 안건에 반대하는 걸쇠는 자기 성표의 벌어진 고리를 그 자리에서 오므린다. 하나라도 오므리면 안건은 다음 달로 미뤄진다.
  교구를 넘는 일(알베릭 구출, 축일 낭독 지원, 정화청 밀고자 처리)은 숨은 지도부 '일곱째 고리'만 정한다. 일곱째 고리는 1년에 두 번 — 성 마렌 축일과 재의 날 —
  루멘 순례 군중 속에서 서로를 '순례자'로 만난다. 일곱째 고리의 결정은 일곱 중 여섯이 고리를 벌린 채로 있어야 난다.
  알베릭은 결정하지 않는다. 그는 서신이다 — 그의 문장이 고리의 교리이고, 고리의 교리는 고리의 결정을 묶는다.
succession: >
  걸쇠가 잡히면 그 고리의 나머지 여섯 중 가장 오래 외운 자(빛의 서신 구절 수)가 잇는다. 일곱째 고리의 자리가 비면 남은 여섯이 사슬의 걸쇠 중 하나를
  축일 군중 속에서 '고리를 건넨다'(벌어진 성표를 바꿔 건다). 알베릭이 죽으면 서신을 잇는 자는 없다 — 대신 '두 번째 서신'(그의 머릿속에 완성되어 있다)을 누가 외우고 있는지가 고리의 운명을 정한다.

