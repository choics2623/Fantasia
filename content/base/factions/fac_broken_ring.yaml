infiltration:
  join_real: "사슬사제나 고리지기에게 '빛의 서신' 첫 줄 — '에오르는 우리를 노예로 만들지 않았다' — 를 속삭인다. 답은 '손은 풀 수 있다'(마렌의 두 번째 설교). 첫 임무: '이 구절을 외워 다음 마을 고리에 전하라.' 글이 아니라 기억으로 나른다"
  join_fake: "정화청 밀정이 들어오기 가장 쉬운 결사다 — 사제 신분이 그대로 덮개가 된다. 거르는 장치는 '구절 대조': 운반자가 나른 구절은 받는 고리가 일곱째 고리에서 내려온 원문과 한 글자씩 대조한다. 밀정은 대개 구절을 '고쳐' 나른다(정화청이 이단 문장을 정확히 외우는 것을 꺼린다). 한 글자가 틀리면 그 운반자는 다음 구절을 받지 못한다"
  proof_test: "잔향이라고 말하는 자에게: 고리는 증명을 요구하지 않는다 — 분열한다. 다수는 '아우렐이 보낸 개혁자'로 맞고, 소수는 '그 때문에 아이들이 탄다'며 밀고를 고민한다. 일곱째 고리는 잔향에게 단 하나를 묻는다: '축일 날 대사제 곁에 설 수 있느냐'"
  exposure: >
    벌어진 고리는 가난한 신도의 녹슨 성표처럼 보인다 — 그래서 위장이 된다. 그러나 AS 311부터 정화청 심문 사제들이 순회 심문 때 '벌어진 고리'를 세기 시작했다(마테우스의 지시).
    탄로 나는 길: 고해실에서 서신 구절을 입에 올리기(펠릭스), 구절을 종이에 적기(문서는 화형), 축일 군중 속에서 고리를 바꿔 걸다 목줄단 '혀'의 눈에 띄기.

law:
  crimes:
    - {act: "구절을 글로 적음", punishment: "고리에서 끊는다 — 글은 화형의 증거다", note: "회원 대상"}
    - {act: "구절을 고쳐 나름", punishment: "다음 구절을 주지 않는다(조용한 추방)", note: "회원 대상 — 밀정을 거르는 장치"}
    - {act: "고해실에서 고리를 말함", punishment: "그 고리 전체가 모임을 석 달 멈춘다", note: "회원 대상"}
    - {act: "교단 법의 '이단'·'밀고 거부' (바깥 법)", punishment: "투옥·강등·화형 — 고리는 막지 못한다", note: "fac_light의 법이 그대로 적용된다"}
    - {act: "정화청 밀고자를 해침", punishment: "결사 법에는 없다 — 그래서 하지 않는다. 고리는 피를 흘리지 않는 것을 자랑으로 삼는다", note: "이름 없는 자들과 갈리는 지점"}

customs:
  greeting: "성표를 쥔 손의 엄지로 벌어진 고리를 한 번 쓸어 보인다. 속삭이는 인사는 '등불 아래' — 답은 '손 위에'(공식 인사 '사슬 위에'를 한 글자 바꾼 것)."
  taboos:
    - "알베릭을 '구출'한다고 말하기 — 그는 그 말을 싫어한다. '모셔 온다'고 한다"
    - "피를 흘리자는 말"
    - "축일 낭독을 앞당겨 기대하는 말 — 대사제를 몰아붙이면 그가 무너진다"
  rites:
    - {name: "두 번째 설교 외우기", when: "매 안식일 예배 뒤 지하실", what: "마렌의 두 번째 설교 한 줄과 빛의 서신 한 구절을 일곱이 돌아가며 외운다. 틀리면 처음부터"}
    - {name: "고리 건넴", when: "성 마렌 축일 (꽃월 12일)", what: "축일 군중 속에서 일곱째 고리가 벌어진 성표를 서로 바꿔 건다. 등불 행렬의 불빛 아래라 아무도 손을 보지 않는다"}
    - {name: "재의 날의 오므림", when: "재의 날 첫째 날", what: "그해 잡혀 간 회원의 수만큼 벌어진 고리를 하루 동안 오므렸다가 다음 날 다시 벌린다"}
  speech: "공식 낭독문의 높은 말씨를 그대로 쓰되, 낱말 하나를 바꾼다('정화' 대신 '기억', '견디어라' 대신 '기억하라'). 서로를 '고리'라 부르고 알베릭을 '서신'이라 부른다. 겁 많은 자가 많아 문장이 중간에 끊긴다."

