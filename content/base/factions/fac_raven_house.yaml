decision: >
  남작이 결정한다. 점호(5:00·19:00)와 하루 일은 즈닉이, 처벌은 점호 직후 채찍 기둥 광장에서 즈닉이 집행한다(태형 5~40). 곡물·장어 절도·탈주·무기 소지 같은 중죄는
  성채 마당에서 남작이 판결하고, 잔향 징후는 오스릭 확인 → 남작 → 감금 후 잿빛 탑 또는 화형. 사형은 남작 권한(통보만 바알카르로).
  4일째마다 남작과 헨릭이 결산한다. 매각은 남작 단독 결정이며 마르타가 서재에서 명단 초안을 쓰고 경비·크릭이 호송한다.
  가문 회의는 없다 — 19시 연회실의 만찬(남작 혼자)이 결정의 시간이고, 성채 하인들은 거기서 들은 것으로 소문을 만든다.
  313 봄: 용황 사망 소식과 함께 편을 고른다 — 기본값은 멜리산드(빚). 오웬 설득 + 빚 해결 시 카스파르.
succession: >
  장자 상속, 상위 승인 필요 — 서임은 용좌, 집행은 하스트란(옛 주군)과 원로회 재날개 둥지(농노 배당)의 확인. 고드릭이 죽으면 오웬이 가주 — 그리고 즉시 카스파르 쪽으로 기운다.
  빚은 상속된다: 313 포도월 30일까지 못 갚으면 회색여울 전체가 담보로 넘어간다. 배당 노예의 무단 매각(37명)이 발각되면 영지 몰수 사유다(재날개 둥지가 이미 안다).
  남작 부인 자리는 22년째 공석이다 — 오웬이 사라와 맺어지면 인간 하녀를 부인으로 둔다는 불가능한 일이 되므로, 부인 자리는 오웬의 혼인 정치(비늘혈 가문과의 혼인)로 채워진다.

law:
  crimes:
    - {act: "점호 불참 · 통금 위반(21시~4시 반 외출) · 노동 태만", punishment: "점호 불참 태형 5 / 통금 태형 10 + 다음날 배급 없음 / 태만 태형 5~10", note: "인간. 즈닉이 판결하고 크릭 감독이 집행"}
    - {act: "곡물·장어 절도", punishment: "태형 20 + 3일 사슬 기둥, 재범 매각", note: "인간. 남작 판결, 즈닉 집행. 312년부터 '매각'이 처벌로 쓰이기 시작했다 — 사실은 빚이다"}
    - {act: "통행증 없이 쇠다리 통과", punishment: "태형 20, 낙인", note: "인간. 남작 판결, 경비 집행"}
    - {act: "양치기 표찰 없이 굶주린 언덕 출입", punishment: "탈주 시도로 간주 — 태형 30", note: "인간. 이르마의 표찰이 합법 출입증"}
    - {act: "옛 돌 고리 출입", punishment: "태형 30, 재범 화형 심문", note: "인간. 남작 + 오스릭의 증언. 금지된 고대 성소 (성채 지하 우물 옆 진명 석판 조각의 원산지)"}
    - {act: "무기 소지", punishment: "사형(교수)", note: "인간. 남작 판결. 농기구만 허용"}
    - {act: "탈주", punishment: "1회 태형 40 / 2회 힘줄 절단 / 3회 사형 또는 매각", note: "인간. 즈닉·바르그 집행"}
    - {act: "탈주자 은닉", punishment: "은닉자 가족 전원 매각", note: "인간. 남작 판결 — 가족 전원이 매각 명단으로 간다. 브람 지하의 에길 일가를 지키는 값"}
    - {act: "글자 소지·쓰기", punishment: "즉결 처형 (재의 법)", note: "인간. 누구든 집행. 오스릭만 경전 낭독 합법"}
    - {act: "잔향 징후 (오지 않은 일을 말함·배운 적 없는 날짜·이름을 중얼거림·처음 보는 곳을 앎)", punishment: "감금 후 잿빛 탑 또는 화형", note: "인간. 오스릭 확인 → 남작 → 경비 집행. 이졸(탑의 징후 수집관)이 순례자로 체류 중"}
    - {act: "용인에게 말대꾸", punishment: "태형 10", note: "인간. 현장 용인이 판결, 경비 집행"}
    - {act: "배당 국유 노예의 무단 매각 (37명 + 71명)", punishment: "영지 몰수 사유 — 원로회 재날개 둥지가 판정", note: "용인에게만. 이미 알려져 있고 아직 쓰이지 않았다. 고드릭을 쥔 또 하나의 끈"}
    - {act: "인두세 머릿수 허위 신고 (352 / 400)", punishment: "영지 몰수·가문 장부 말소", note: "용인에게만. 헨릭의 이중 장부 — 고드릭은 알고도 묵인(뇌물을 나눠 받음). 발각되면 둘이 함께 무너진다"}

customs:
  greeting: >
    인사는 가훈의 문답이다. "여울이 얕습니다." — "그래도 마르지 않습니다." 용인 가신은 남작 앞에서 오른손을 가슴 비늘에 얹고 한 걸음 물러선다.
    인간 농노는 모자를 벗고 눈을 내리깔고, 이름 대신 막사 번호를 댄다(이름은 있어도 성은 가질 수 없다). 남작 앞에서는 먼저 입을 열지 않는다.
  taboos:
    - "빚의 액수(1,840두카트)와 몬달리의 이름을 연회실에서 입에 올리는 것"
    - "비늘 수를 묻는 것(비늘혈이 순혈에게), 레이번이 3대째 불의 잔을 받지 못했다는 말"
    - "로웨나 부인의 이름 — 남작은 듣지 않으려 하고, 마을 노인들은 몰래 부른다"
    - "인간이 여울강에서 북쪽을 보고 소변보기 ('서리 어머니가 본다' — 북방 탈주자에게서 들어온 미신)"
    - "성채 그림자 안에서 노래하기"
    - "까마귀를 죽이기 — 까마귀 문 국경군의 상징이라 크릭이 처벌한다"
    - "인간 하녀와의 혼인·연애 — 가문 강등, 하녀는 죽음, 아이는 반용"
  rites:
    - {name: "여울 축복", when: "수확월 마지막 안식일", what: "오스릭이 여울강에 등불을 띄운다. 농노들은 그해 죽은 이의 머릿수만큼 조약돌을 강에 던진다 — 이름은 부르지 않고 번호만"}
    - {name: "인두세 납부와 결산", when: "수확월 + 매 4일째", what: "징세관이 장부 두 권을 펼쳐 남작과 결산한다. 인간 머릿수는 352로 읽는다"}
    - {name: "첫 눈 노래", when: "첫눈이 오는 밤", what: "막사에서 노예말 노래 「얕은 물은 차갑다」를 부른다. 실은 잿빛 실의 암호 구절에서 나왔다 — 가문은 그저 노래로 안다"}
    - {name: "재의 날", when: "연말 5일", what: "불을 피우지 않는다. 이름 없는 자들은 셋째 밤 옛 돌 고리에서 아스테리온을 기린다(312년 참석 예정 9명)"}
    - {name: "번호 장례", when: "해 질 녘에만", what: "인간은 이름 없이 번호로 묻힌다. 가족은 몰래 무덤 돌 밑에 그 사람의 물건 하나를 넣는다"}
    - {name: "남작의 만찬", when: "매일 19시", what: "연회실에서 혼자 든다. 아내가 죽은 뒤 22년째. 시중은 마르타의 하인들"}
    - {name: "매각 호송", when: "서리월 9일(1차 40명), 굶주림월 3일(2차 31명)", what: "용의 대로로 바알카르 사슬 부두를 거쳐 세렌 소금 나루로. 호송은 경비와 크릭이 맡는다"}
  speech: >
    비늘혈 하급 귀족의 '가신 말투' — 존칭은 정확하지만 문장이 짧고, 위(순혈·원로회) 앞에서는 말끝이 낮아지고 아래(인간) 앞에서는 지시형으로 끝난다.
    남작은 한숨 섞인 낮은 문어체로 빚 이야기를 돌려 말하고, 오웬은 들뜬 구어체로 카스파르를 말하고, 헨릭은 숫자와 항목으로 끝낸다.
    인간은 번호로 대답하고, 즈닉은 '…해라'만 쓴다. 금지어: 담보, 몬달리(연회실), 빚(남작 앞), 노예(인간에게 직접 쓰는 것 — '저것').

membership:
  join: >
    용인 일가는 출생. 용인 가신(징세관·경비)은 남작에게 서약하는 비늘혈 하급 용인 — 징세관은 가문명이 없다. 크릭 감독은 길드 계약으로 가문 소유가 된다.
    인간 농노 400은 용좌의 국유 노예 배당(재날개 둥지의 명부)으로 들어오고, 성채 하인 38과 숙련 노예는 성채 소유 노예다. 가신 서약의 대가는 매년 인두세 머릿수.
  leave: >
    용인은 몰수·말소·사망. 인간은 매각(세렌행)·탈주(굶주린 언덕·오물 습지)·사망으로만 나간다. 장부에서 지워지는 것(장부 밖)은 퇴장이 아니라 소멸이다.
  signs: ["회색 방패 위 은빛 물결 세 줄과 검은 용 발톱, 금이 간 다리 문장", "채찍 기둥 광장의 출결 막대(눈금 새김)", "쇠다리 통행증 쇠 패(영지 문장과 날짜)", "목줄장의 쇠 지팡이 — 마르타의 표식"]

internal_factions:
  - {name: "빚의 줄 (고드릭)", leader: npc_godric_raven, aim: "빚 때문에 멜리산드(세렌 자본) 쪽으로 기운다 — 313 봄 줄서기의 기본값. 농노를 팔아 한 해를 더 버틴다", strength: 45}
  - {name: "카스파르 노선 (오웬)", leader: npc_owen_raven, aim: "인간도 이름을 가질 수 있느냐는 물음. 카스파르 쪽으로 — 아버지 사망 시 즉시 가주가 되어 방향을 바꾼다", strength: 20}
  - {name: "칼다란 채권 매각안 (바렌)", leader: null, aim: "칼다란에게 가문 채권을 넘겨 가신으로 묶인다 — 바알카르에서 형을 설득하는 중 (leader: 바렌 레이번, id 없음)", strength: 15}
  - {name: "장부파 (헨릭)", leader: npc_henrik, aim: "착복분을 모아 루멘 근처 포도밭에서 은퇴. 남작의 빚 정보를 레아에게 팔아 가문의 약점을 쥔다", strength: 20}
  # strength = 영지 내 영향력의 추정(합 100). 경비대장 드레크의 봉급 불만은 파벌이 아니라 첫 균열이다 — 뇌물이 먹히는 이유

