toward_echo: >
  고드릭: 잔향 징후가 있는 자는 오스릭 확인 → 남작 판결 → 잿빛 탑 또는 화형이 법이다. 그러나 남작에게 잔향은 값이다 — 매각 명단 한 줄(3비늘)과 탑의 포상 사이를 저울질한다.
  오웬: 카스파르가 무엇을 하는 사람인지 아는 편이라 잔향 이야기에 귀를 기울인다. 헨릭: 징후 보고의 숫자도 장부 한 칸이다. 마르타: 신고 100건에 딸의 자유가 걸려 있다.
player_paths:
  - "가입 (낮은 층): 성채 하인(마르타 배정), 숙련 노예의 제자(브란·토마스·군나르), 목줄(밀고자) — 가신 서약은 불가능하다"
  - "이용: 서재 금고의 빚 증서와 세베로 계약서, 징세소 다락 마루 밑 실제 장부(400명), 매각 명단 — 훔치거나 위조해 남작을 협박하거나 뒤집는다"
  - "침투: 성채 하인으로 들어 서재·연회실의 대화를 엿듣는다 (사라의 길), 마르타의 밀고망에 이름을 올리거나 그 틈을 판다"
  - "오웬 설득: 카스파르 쪽으로 끌어오는 313 봄 줄서기(raven_chooses) — 빚 해결 + 오웬의 설득이 조건. 고드릭 사망 시 오웬이 가주"
  - "무너뜨리기: 재날개 둥지에 무단 매각(37명)을 폭로 → 영지 몰수. 인두세 이중 장부 폭로 → 헨릭과 남작 동반 몰락. 드레크의 봉급 불만을 이용한 성채 경비 이탈"
  - "빚 해결: 313 포도월 30일 이전에 1,840두카트(약 2,024비늘)를 마련하거나 세베로 계약을 파기 — 못 하면 회색여울 전체가 몬달리에게 넘어간다"
