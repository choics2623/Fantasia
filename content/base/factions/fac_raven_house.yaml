  - {id: rank_heir, title: "후계자", duties: "경비 보좌, 가문 외교 연락", privileges: "아버지 사후 가주", open_to_player: false}
  - {id: rank_retainer, title: "용인 가신 (징세관·경비)", duties: "징세, 경비, 쇠다리", privileges: "읽고 쓸 수 있다, 성채 출입", open_to_player: false}
  - {id: rank_overseer_kric, title: "크릭 감독", duties: "점호·채찍·밤 순회", privileges: "감독관 초소, 채찍손 길드", open_to_player: false}
  - {id: rank_keep_steward, title: "성채 노예 집사", duties: "하인 38 지휘, 밀고망", privileges: "배급 1.5배, 매매 면제(딸)", open_to_player: true, condition: "마르타의 자리 — 밀고 100건과 남작의 신임. 가장 위험한 노예 자리"}
  - {id: rank_keep_servant, title: "성채 하인", duties: "성채 시중", privileges: "성채 안에 들어간다 — 남작의 말·서재 가까이에서 들을 수 있다", open_to_player: true, condition: "마르타가 배정한다 (남작 소유 노예). 매각 명단에 오르면 가장 먼저 팔린다"}
  - {id: rank_craft_slave, title: "숙련 노예 (대장간·방앗간·마구간·양치기)", duties: "작업과 납품", privileges: "반자율 운영 허가, 시장가가 높아 함부로 팔지 않는다", open_to_player: true, condition: "브란·토마스·군나르 같은 노예의 제자나 조수가 되는 것이 입문"}
  - {id: rank_collar_informant, title: "목줄 (밀고자)", duties: "마르타 아래 6명 — 밀고 100건이면 일가족 해방", privileges: "배급 가산, 통금 후 이동 묵인", open_to_player: true, condition: "마르타의 눈에 들어 이름을 올린다. 밀고 한 건마다 처형 한 건이 따라온다"}
  - {id: rank_serf, title: "마을 농노 (400)", duties: "들일, 점호, 연좌 책임, 인두세의 머릿수", privileges: "없다 — 배급 두 그릇", open_to_player: true, condition: "회색여울 출신 시작 신분. 인두세 장부에는 352명으로 올라 있다 (48명은 장부 밖)"}
