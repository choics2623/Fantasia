    holder: null          # 로웨나 레이번 †AS 290 재열병. 생전에 인간 하녀들의 결혼을 몰래 허락해 주었다 — 마을 노인들은 지금도 기억한다
    reports_to: off_baron
    powers: ["성채 안살림 — 지금은 마르타가 사실상 맡는다", "인간 하녀의 결혼 허가 (생전에 비공식으로)"]
    chosen_by: "혼인 (AS 241 하스트란의 주선)"
    perks: []
