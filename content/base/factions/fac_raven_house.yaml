# 레이번 남작가 — "여울은 마르지 않는다" ★시작 지역 회색여울의 지배 가문
# 정본: HOUSES §2.10, §2.7(오르셀)·§1.7(재날개 둥지) / REGIONS §2.3(지배 구조)·§2.4~2.9·§2.11 / 카드: greyford/*.yaml (고드릭·오웬·헨릭·즈닉·마르타·브람·브란·토마스·군나르·이르마·사라·리즈·하인츠·오스릭)
# 까마귀 문(카스파르)은 남작령 안에 있지만 '용좌 직속' — 남작이 명령할 수 없다. 이 파일의 자리에 넣지 않았다 (fac_drakmar_empire의 off_northern_army 쪽).
# 주의(모순 기록): REGIONS의 '경비대장 드레크 반칼 — 신규'는 npcs.json에 id가 없다 → unnamed. 비늘 수·나이 표기는 카드 기준(고드릭 140, 오웬 40).
# 기준: AS 312 낙엽월 1일 (회귀점). 빚 만기 AS 313 포도월 30일.
id: fac_raven_house
name: 레이번 남작가
kind: house
race: [용인(비늘혈), 크릭(감독관·하인), 인간(농노·성채 노예)]
governance: 봉건 위계 — 영지 안에서는 영주가 법. 위로는 하스트란(옛 주군)·용좌·원로회 재날개 둥지에 묶여 있다
governance_note: >
  남작이 영지의 법이다. 사형은 남작의 권한(바알카르에는 통보만). 아래로는 즈닉의 채찍과 마르타의 밀고망이라는 이중 체제가 농노를 쥐고,
  배급은 징세관 헨릭이 막사를 통해 준다. 위로는 빚이 남작을 쥔다 — 몬달리 은행(오르셀 경유) 1,840두카트, 상환 기한 313 포도월 30일.
  가문의 법과 가문의 빚이 서로를 먹는 중이다: 매각은 처벌의 이름을 달고 시작되었지만 사실은 빚이다(AS 311부터).
motto: "여울은 마르지 않는다."
seat: raven_keep        # 레이번 성채 (REGIONS §2.10). 마을 greyford_village, 쇠다리 검문소(격자 18), 징세소 '셈집'(3)
size:
  members: "용인 일가 2(고드릭·오웬) + 용인 가신 15(징세관 1 + 경비 14) + 크릭 감독 8(즈닉 포함) + 크릭 성채 하인 6 + 성채 인간 하인 38 + 마을 농노 400 + 숙련 노예 몇(대장간·방앗간·마구간)"
  territory: "회색여울 마을, 레이번 성채, 쇠다리 통행세, 여울강 어업권, 서쪽 목초지·북쪽 벌목지, 굶주린 언덕·오물 습지(명목상). 영지 안에 까마귀 문 — 용좌 직속"
  wealth: "연수입 약 300비늘 (귀리 2,400섬·보리 900섬·양모(양 140두)·훈제 장어·통행세). 납품 귀리 600섬/년 대금은 용좌 국고에서 연 1회 — 312년분 미지급. 빚 1,840두카트(약 2,024비늘)"
  force: "용인 경비 14 (성채 8·쇠다리 2 교대·마을 순찰 4) + 크릭 감독 8 + 사냥개 9. 지지율 (1~2) — 313 봄 줄서기가 첫 표"

offices:
  # ── 가주와 일가 ──
  - id: off_baron
    title: 남작
    holder: npc_godric_raven
    reports_to: null
    powers: ["영지의 법 — 사형 권한(통보만 바알카르로)", "중죄 재판(성채 마당)", "농노 매각 계약 (세렌 노예 중개인 세베로 칼레스와)", "비늘 서약의 표 — 313 봄 줄서기 (미정)"]
    chosen_by: "장자 상속, 상위 승인 필요 (AS 255 아버지 사망 후 상속). 서임은 SK 2,960 시조 알드릭 레이번 — 하스트란 휘하 기사로 여울강 다리에서 요툰 약탈대를 막은 공"
    perks: ["성채 본관 2층 서재와 침실", "서재 금고(열쇠는 목걸이) — 매각 명단·빚 증서·세베로와의 계약서", "회색 방패 위 은빛 물결 세 줄 + 검은 용 발톱, 방패 아래 금이 간 다리(AS 0 이후 추가)"]
    note: "AS 290 아내 로웨나 사망 이후 연회실에서 혼자 만찬을 든다 (19시). 왼뺨에 녹슨 구릿빛 비늘"
