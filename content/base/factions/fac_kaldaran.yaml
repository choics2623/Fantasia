relations:
  # HOUSES §2.1 '관계' 서술에서 환산 (행렬 §6.1 밖 — 값은 디자이너 확인 대상)
  - {to: fac_hastran, stance: 60, note: "동맹 — 혼인 2대 (로잘린드)"}
  - {to: fac_sarkos, stance: -20, note: "이용하지만 경멸 — 노예 매매와 바르그 조합 후원"}
  - {to: fac_bold, stance: -30, note: "경쟁 — 기록의 독점권 다툼"}
  - {to: fac_raven_house, stance: 10, note: "채권 매입 검토 중 — 가신으로 묶을 기회"}
  - {to: fac_scale_council, stance: -30, note: "행정 서명권과 400년 경쟁. 원로회가 칼다란을 보는 값 −30의 대칭 가정"}
toward_echo: "공식은 '화형' — 잔향 사냥 의무화 AS 213 때 회색 장부에 징후 항목을 신설한 이 가문이다. 그러나 AS 311에 숫자를 절반으로 줄여 올린 대공은 '무언가 깨어났다'는 것을 숫자로 안다. 아르덴의 펜은 잔향이 아닌 척하는 사람을 지울 수도 있다."
player_paths:
  - "셋째 서랍 — 원본 족보를 손에 넣으면 칼다란을 협박해 카스파르 지지 또는 중립으로 돌리거나, 아우락스에게 넘겨 칼다란을 몰락시킨다 (지지 7점)"
  - "이름 지우기 — 아르덴의 펜. 탈주자의 사망 처리, 또는 자기 이름의 말소 ('없는 사람'이 되는 값)"
  - "리비아 — 카스파르를 동정하는 의전관. 접견 순서와 좌석을 통해 정보를 얻는다"
  - "세드릭 — 서랍을 아는 견습. 아직 어느 편도 아닌 사람"
