# 칼다란 대공가 — "불꽃 홀의 집사". 정본: HOUSES §2.1, §6.3 / RACES §3 / SUBRACES §3.3 (원로회와의 경쟁)
# 기준: AS 312 낙엽월 1일. id 없는 인물은 'unnamed:...' (TODO-NPC — HOUSES §2.1 구성원).
id: fac_kaldaran
name: 칼다란 대공가
kind: house
race: [용인(순혈)]
governance: 봉건 위계 — 순혈 대공가, 집사직 세습
governance_note: >
  대공이 가문의 법이다. 장남이 장부를 쥐고, 딸이 의전을 쥐고, 대공비가 외부 서신을 쥔다. 가문이 결정하는 것은 주로 '무엇을 기록하느냐'이다.
  SK 1,231 '잿날개의 밤'에 가주 오렐리안이 즉시 바르스카르에게 비늘 서약을 한 이후 2,000년간 집사직을 세습해 왔다 —
  집사 자리는 용황이 새로 임명하지 않는다. 대공은 용황의 병상 출입을 통제하는 유일한 용인이고, 병세를 AS 302에 처음 확인하고 비밀로 했다.
motto: "불은 위에서 아래로 흐른다."
seat: baalkar          # 바알카르 중심부 '불꽃 홀' 행정 구역. 동쪽 장원 9곳
size:
  members: "순혈 직계 5(+방계·서기단) · 용인 서기 수십 · 크릭 서기 다수 · 국유 노예 명부 약 4만(관리 대상) · 장원 9곳의 인간 노예"
  territory: "바알카르 중심부 '불꽃 홀' 행정 구역, 바알카르 동쪽 장원 9곳"
  wealth: "통행증·인두세 장부의 수수료, 장원 수입. 레이번 채권 매입 검토 중(몬달리 빚의 일부)"
  force: "사병은 적다 — 대신 칼다란은 하스트란(혼인 동맹)을 통해 비늘기사단 600을 움직이고, 불꽃 홀 서약 단상을 연다. 지지율 7 (아우락스)"

offices:
  - id: off_duke
    title: 대공 — 용좌 집사
    holder: npc_severian_kaldaran
    reports_to: null
    powers: ["가문의 법과 서약 — 비늘 서약 단상의 개방", "용황 병상 출입의 통제", "셋째 서랍 개방권 (세베리안만)"]
    chosen_by: "세습 — 집사 자리를 용황이 임명하지 않는다 (SK 604 시조 칼다르의 서임 이후)"
    perks: ["진홍 바탕 금빛 고리 세로 동공의 용 눈 문장 — 눈 아래 검은 띠 세 줄(세 번의 위기를 넘긴 표시)", "불꽃 홀 금고"]
  - id: off_duchess
    title: 대공비
    holder: npc_rosalind_kaldaran
    reports_to: off_duke
    powers: ["외부 서신 — 아우락스와 직접 서신을 주고받는다", "하스트란과의 혼인 동맹 유지"]
    chosen_by: "혼인 (2대째 하스트란)"
    perks: ["남편보다 강경한 목소리가 가문의 방향을 당긴다"]
  - id: off_ledger_heir
    title: 회색 장부 관리관 (장남)
    holder: npc_arden_kaldaran
    reports_to: off_duke
    powers: ["제국 국유 노예 약 4만의 번호 낙인과 인두세 기준 명부", "이름을 지운다 — 펜 한 번으로 탈주자의 사망 처리 (장부에서 빠진 인간은 '없는 사람')", "'잔향 징후' 항목 집계"]
    chosen_by: "장자 상속 예정. 숫자를 사랑하고 피를 싫어한다"
    perks: ["다른 가문의 노예 수까지 본다"]
  - id: off_ceremonial
    title: 불꽃 홀 의전관 (딸)
    holder: npc_livia_kaldaran
    reports_to: off_duke
    powers: ["비늘 서약·비늘 의례·불의 잔의 식순", "궁정 좌석과 접견 순서"]
    chosen_by: "대공 지명"
    perks: ["카스파르와 같은 해 바알카르 궁정에 있었던 사람 — 그를 동정한다"]
  - id: off_apprentice
    title: 견습 집사 (손자)
    holder: npc_cedric_kaldaran
    reports_to: off_duke
    powers: ["집사 업무의 보조"]
    chosen_by: "대공 지명"
    perks: ["셋째 서랍의 존재를 우연히 알았다 — 아직 열지 못했다"]
  - id: off_vault
    title: 셋째 서랍 지기
    holder: npc_severian_kaldaran   # 겸임 — 열 수 있는 유일한 사람
    reports_to: off_duke
    powers: ["시조 칼다르의 원본 족보 — 어머니가 인간 노예였다는 사실이 적혀 있다. 불꽃 홀 금고 '셋째 서랍'"]
    chosen_by: "대공만 연다"
    perks: []
  - id: off_manor_stewards
    title: 동쪽 장원 관리인 (9곳)
    holder: "unnamed:장원 관리인 9 — 용인 비늘혈"
    reports_to: off_ledger_heir
    powers: ["바알카르 동쪽 장원 9곳의 노동과 납세"]
    chosen_by: "대공 지명 (비늘혈 가신)"
    perks: []
  - id: off_ledger_scribes
    title: 회색 장부 서기단
    holder: "unnamed:용인·크릭 서기단"
    reports_to: off_ledger_heir
    powers: ["번호 매기기, 낙인 배정, 인두세 대조"]
    chosen_by: "아르덴 지명"
    perks: []
  - id: off_brand_bureau
    title: 낙인관
    holder: "unnamed:낙인 용인 관리 — 이름 미상"
    reports_to: off_ledger_heir
    powers: ["오른쪽 어깨 번호 낙인의 집행", "위조 낙인 감별"]
    chosen_by: "서기단 지명"
    perks: []
  - id: off_creditor_desk
    title: 레이번 채권 인수 담당 (검토 중)
    holder: null          # 바렌 레이번이 칼다란에게 가문 채권을 넘기자고 형을 설득 중 — 아직 담당자 미정
    reports_to: off_duke
    powers: ["레이번 채권 매입 — 성사되면 레이번이 칼다란의 가신처럼 묶인다"]
    chosen_by: "—"
    perks: []

ranks:
  - {id: rank_duke, title: "대공 (집사)", duties: "서약 단상, 병상 출입, 장부", privileges: "셋째 서랍, 용황의 뜻을 증언", open_to_player: false}
  - {id: rank_heir, title: "직계 (관리관·의전관·견습)", duties: "장부·의전·집사 보조", privileges: "장부 열람, 불꽃 홀 출입", open_to_player: false}
  - {id: rank_steward, title: "장원 관리인·서기 (용인)", duties: "장원 운영, 장부 정서", privileges: "읽고 쓸 수 있다", open_to_player: false}
  - {id: rank_kric_scribe, title: "크릭 서기", duties: "대독, 낙인 기록", privileges: "서기단 보호", open_to_player: false}
  - {id: rank_manor_slave, title: "장원 노예", duties: "동쪽 장원 노동", privileges: "칼다란 소유 표 — 다른 용에게서의 방패", open_to_player: true, condition: "회색 장부 번호를 받은 국유 노예가 칼다란 장원에 배당된다. 이름 지우기는 아르덴의 펜"}

decision: "대공이 결정하고 장남이 기록한다. 의전은 딸, 외부 서신은 대공비. 결정의 속도는 '무엇을 기록하느냐'와 '언제 기록하느냐'에 있다 — AS 311에는 '잔향 징후' 보고가 3배로 늘자 대공이 숫자를 절반으로 줄여 올렸다(혼란 방지). 가문 회의는 따로 없고 저녁 식사 자리의 한 마디가 방향을 정한다."
succession: "대공은 장자 상속 (아르덴). 집사직은 가문에 붙어 있으므로 대공이 죽으면 장남이 즉시 서약 단상의 열쇠를 받는다. 셋째 서랍은 대공이 죽기 전에 장남에게 구두로 넘기는 것이 관례 — 세드릭이 먼저 알면 장남을 건너뛸 변수가 생긴다."

law:
  crimes:
    - {act: "회색 장부 번호의 위조·낙인 위조", punishment: "인간은 즉결 처형. 용인 서기는 가문 장부에서 이름 삭제", note: "장부에서 빠진 인간은 '없는 사람'이 되어 누가 죽여도 죄가 아니다"}
    - {act: "인간 탈주자의 '사망 처리' 요청", punishment: "아르덴이 승인하면 합법 — 승인은 값(뇌물·정보)으로 얻는다", note: "펜 한 번이면 된다. 서기단이 이중 기록하지는 않는다"}
    - {act: "셋째 서랍을 열려는 시도 (가문원)", punishment: "대공의 판단 — 이름이 가문 장부에서 지워진다", note: "SK 2,512 하길라 반란 때 그녀 편에 선 용인 가문 셋의 장부를 불태워 '없는 가문'으로 만든 선례"}
    - {act: "카스파르를 '서자' 이외로 부르지 않는다 ('잡종'이라 부르는 것은 오히려 이 가문이 가장 앞장선다)", punishment: "법 아님 — 관습", note: "시조 칼다르의 어머니가 인간 노예라는 사실을 가리는 방식"}
    - {act: "용황 병상의 소식을 외부에 발설", punishment: "대공의 판단. 시종 노예는 처분", note: "AS 302부터 병세를 비밀로 했다"}
    - {act: "비늘 서약을 어긴다", punishment: "가문 장부 불태움 → '없는 가문'", note: "SK 2,512의 선례"}
    - {act: "인간이 장부를 열람한다 / 글자를 읽는다", punishment: "즉결 처형 (재의 법)", note: "서기 노예 예외는 없다 — 볼드와 다르다"}

customs:
  greeting: "대공 앞에서 손바닥을 펴 비늘 서약의 상처를 보이고 눈을 낮춘다. '불은 위에서 아래로 흐릅니다'로 맺는다. 인간은 말을 걸지 않는다 — 서기가 대신 읽는다."
  taboos:
    - "시조 칼다르의 어머니를 묻는 것 — 셋째 서랍"
    - "장부의 숫자를 사실과 다르게 읽는 것 (장부가 곧 현실이다)"
    - "카스파르의 어머니를 입에 올리는 것"
  rites:
    - {name: "회색 장부 결산", when: "수확월 말", what: "인두세 장부를 닫는다. 대공·장남·서기단이 번호를 한 줄씩 낭독해 오차를 맞춘다"}
    - {name: "비늘 서약의 확인", when: "새 용황이 불꽃 홀에 들 때", what: "대공이 단상을 연다. 가주들의 손바닥을 긋는 칼은 칼다란의 것"}
    - {name: "세 줄의 날", when: "재의 날 첫날", what: "세 번의 위기(SK 1,231 잿날개의 밤, SK 2,512 하길라, AS 0 대붕괴)를 낭송한다 — 문장의 검은 띠 세 줄"}
    - {name: "비늘 의례 의전", when: "태양월 1일", what: "리비아가 식순을 맡는다. 312년은 용황이 나오지 않아 취소될 예정"}
  speech: "문서체. 숫자와 항목으로 말한다. 가훈이 문장의 맺음. 순혈의 '완곡한 가시' — 비늘 수를 묻지 않는다는 말로 비늘 수를 묻는다. 인간에게는 직접 말하지 않는다."

membership:
  join: "출생 또는 혼인. 하스트란과 2대째 혼인 동맹."
  leave: "'없는 가문' — 장부가 불태워지는 것이 유일한 퇴장."
  signs: ["진홍 바탕 금빛 고리 세로 동공 용 눈 문장, 눈 아래 검은 띠 세 줄", "회색 장부 낙인 도구(번호 인두)", "집사의 서약 칼"]

internal_factions:
  - {name: "세베리안 질서파", leader: null, aim: "'질서 있는 공포' — 아우락스 즉위. 멜리산드의 실험은 질서를 깨고 카스파르는 혈통을 깨기 때문이다", strength: 50}
  - {name: "로잘린드 강경파", leader: null, aim: "아우락스와 직접 서신으로 한 발 더 — 하스트란과 합세해 확인 절차를 서두른다", strength: 25}
  - {name: "리비아 동정파", leader: null, aim: "카스파르를 동정하는 소수. 같은 해 궁정에 있었다. 셋째 서랍을 알면 흔들릴 수 있다", strength: 10}
  - {name: "세드릭의 서랍", leader: null, aim: "견습 집사가 셋째 서랍의 존재를 알았다 — 아직 아무 편도 아니다", strength: 15}
  # leader null = 카드 미작성. 셋째 서랍이 공개되면 질서파가 쪼개진다

