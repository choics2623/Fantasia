# 두르강 씨족 — 돌 혈명('불변')의 굴레(맹세를 깰 수 없다)가 만든 계약 공화국.
# 근거: HOUSES §3.3, RACES §9, REGIONS §12(카즈둠 산맥), facts/kazdum.yaml.
id: fac_durgan
name: 두르강 씨족 연합 (카즈둠 계약 공화국)
kind: polity
race: [산 두르강, 심층 두르강, 잿불 두르강, 이름 없는 자(맹세 파기 추방자), 계약 광부(인간)]
governance: 계약 공화국  # 법 = 쇠판에 새긴 계약. 왕도 한 서명자일 뿐이다
motto: "계약은 신성하다. 깨진 맹세는 돌이 된다."
seat: 카즈벨 왕의 홀 (카즈둠 중심) / 계약의 전당 / 돌 법정
size:
  members: "두르강 약 170,000 (왕도 카즈벨 6만, 그림하르 3.5만, 바르둠 8천), 인간 계약 광부 약 28,000"
  territory: "카즈둠 산맥(신의 뼈) 전역, 깊은 문(AS 289 봉인)"
  wealth: "금속·갑옷·무기. 용제국 비늘기사단 갑옷의 80%는 잿모루 씨족. 용제국·세렌·요툰과 교역"
  force: "방어의 종족 — 갱도·관문·함정, 판금 중갑 방진, 쇠뇌. 공격하러 나간 적은 거의 없다"

decision: >
  두르강에게 결정은 '서명'이다. 법은 쇠판에 룬으로 새기고, 영향받는 씨족의 족장이 피 한 방울과 손바닥 자국으로 서명해야 효력이 선다.
  서명하지 않은 자에게는 어떤 왕명도 닿지 않는다 — 그래서 모든 사안은 협상이 아니라 계약서 문구의 싸움이다.
  정기 회기는 둘이다. 매 계절 첫날(해빙월·푸른월·수확월·서리월 1일)에 계약의 전당에서 '서명 회기'가 열려 새 계약과 개정이 올라오고,
  7년마다 인간 계약 광부의 '갱신 회기'가 있다. 안건은 룬새김 씨족의 서기가 쇠판으로 만들고 돌 법정(맹세지기 씨족)이 조항 충돌을 심사한다.
  왕 브로르의 권한은 '서명을 받는 책상'이다. 용제국과의 계약은 용황 개인이 아니라 용좌와 맺은 것이라, 승자가 서면 갱신 서명만 받는다.
  거부권은 모든 서명자에게 있다. 한 번 서명하면 깰 수 없으므로 서명을 아끼고, 그래서 회기는 길고 문구는 촘촘하다 — 계약의 '빈틈'이 곧 정치이고 지렛대다.
  개정은 옛 계약을 고치는 것이 아니라 '옛 계약의 소멸 조항 + 새 계약'을 세우는 것이다. 맹세를 지키지 못한 자는 돌피병으로 스스로 처벌받는다(재판 이전에 몸이 판결한다).
succession: >
  왕은 깊은망치 씨족이 뽑는다. 왕 자리는 '용좌와의 계약, 인간 계약 광부 계약, 깊은 문 봉인 계약'을 모두 물려받는 일이라 승계는 곧 계약 승계다.
  후보는 족장 회합이 서명으로 추천하고, 망치 가문 9곳 중 과반의 서명과 돌 법정의 '맹세 청정' 판정(현재 깨진 맹세가 없다는 증명)을 받아야 한다.
  브로르의 오른쪽 귀가 돌로 굳어 가고 있다 — 반쯤 깨진 맹세의 흔적이다(fact_kz_bror_ear_stone). 그가 쓰러지면 왕위보다 먼저 '깊은 문 계약'의 서명자 자리가 비게 된다.

