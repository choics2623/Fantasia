law:
  crimes:
    - {act: "맹세·계약 파기 (두르강)", punishment: "돌피병 — 손끝부터 피가 굳어 1~5년 안에 석상. 재판은 몸이 먼저 한다. 돌 법정은 '이름 없는 자'로 선고", note: "두르강 대상. 맹세 회랑에 굳은 석상 412구(HOUSES는 1,312 — 보고)"}
    - {act: "거짓 맹세 / 맹세를 농담으로 함", punishment: "경고 후 벌금. 두 번째는 서명권 박탈", note: "두르강 대상 — '맹세코'는 진지할 때만"}
    - {act: "불량품 판매", punishment: "길드 추방", note: "두르강 대상 — 장인의 이름이 걸린 일"}
    - {act: "남의 작품에 허락 없이 손댐(수리 포함)", punishment: "작품값 배상 + 길드 견책", note: "양쪽 모두. 인간은 계약 연장 조항으로 처리"}
    - {act: "깊은 문 이야기를 입에 올림 (AS 289 이후)", punishment: "벌금 — 두 번째는 갱 접근 금지", note: "양쪽 모두"}
    - {act: "조상의 벽을 두드림 / 조상 도굴(룬 돌심장 뜯기)", punishment: "도굴은 추방 + 후손 배상. 조상의 벽을 두드리면 길드 정지", note: "양쪽 모두. 두르강 최대의 죄"}
    - {act: "빚을 지고 죽음", punishment: "후손이 갚는다", note: "두르강 대상"}
    - {act: "인간이 깊은 층(무쇠문 구역)에 들어감", punishment: "계약 1년 연장, 재범은 계약 해지 후 용제국 인계", note: "인간 대상"}
    - {act: "인간이 서명용 룬 외의 글자를 씀", punishment: "룬 계약서 서명용만 허용 — 위반은 계약 연장. 두르강은 묻지 않는다(묻는 순간 재의 법에 걸린다)", note: "인간 대상"}
    - {act: "도구 파손 / 갱도 붕괴로 멈춘 날", punishment: "도구 파손은 계약 1년 연장, 붕괴로 멈춘 날은 계약 일수에서 뺀다", note: "인간 대상 — 계약서의 덫. 두르강은 '읽지 않은 쪽의 책임'이라 한다"}

customs:
  greeting: "상대의 손바닥을 본다 — 굳은살의 결로 하는 일을 읽는다. '무엇을 만드시오?'가 인사다. 서명 자리에서는 '피를 걸겠소?'라고 묻는다. 손을 맞잡기 전에 계약의 범위를 말한다."
  taboos:
    - "맹세를 농담으로 하는 것. '맹세코'는 진지할 때만"
    - "남의 작품에 손대는 것(수리조차 허락이 필요)"
    - "조상의 벽을 두드리는 것"
    - "깊은 문 이야기 — AS 289 이후, 언급 시 벌금"
    - "불량품을 파는 것, 빚을 지고 죽는 것(후손이 갚는다)"
    - "'신의 뼈 도둑'이라 부르는 것, 맹세를 이용한 함정을 두르강에게 걸기"
  rites:
    - {name: "조상의 망치 앞 낭송", when: "매일 아침 작업 전", what: "조상 이름 일곱을 부른다. 조상의 영혼이 돌 속에서 후손의 작업을 지켜본다"}
    - {name: "서명 회기", when: "해빙월·푸른월·수확월·서리월 1일", what: "계약의 전당에서 쇠판에 새긴 안건을 서명한다. 피 한 방울 + 손바닥 자국"}
    - {name: "계약 갱신 회기", when: "7년마다", what: "인간 계약 광부 계약 갱신. 만료자에게 돌 증표(각인 철패)를 준다"}
    - {name: "조상의 벽 안치", when: "죽음", what: "시신을 조상의 벽에 묻는다. 영혼이 돌 속에 산다고 믿는다"}
    - {name: "맹세 회랑 참배", when: "서리월", what: "돌이 된 맹세 파기자들 앞에서 서명자가 자기 서약을 낭독한다"}
  speech: "짧고 정확하다. 숫자와 조항으로 말하며 형용사를 아낀다. 존대는 '만든 것'의 무게로 정한다 — 걸작을 가진 장인에게는 족장도 '장인께'라 부른다. 인간에게도 '계약자'라 부르며 거짓말은 하지 않고, 대신 '묻지 않은 것은 말하지 않는다'. 약속의 말을 할 때는 한 박자 쉰다 — 그 말이 곧 돌이 될 수 있기 때문."

membership:
  join: "두르강은 태어남으로. 길드는 견습 10~50년 후 걸작 하나로 승급한다. 인간은 7년 계약서에 피 한 방울과 손바닥 자국으로 서명해 들어간다. 계약서를 읽을 수 있다는 것은 묻지 않는다."
  leave: "계약이 끝나면 나간다. 인간은 돌 증표를 받아 자유민이 되나 카즈둠 밖에서는 용제국이 '주인 없는 재산'으로 잡을 수 있다. 맹세를 깬 두르강은 나가는 것이 아니라 돌이 된다 — 이름 없는 자로 추방되거나 회랑에 선다."
  signs: ["룬 문장 — 깊은망치(모루를 내리치는 망치), 룬새김(세 겹 원), 무쇠문(닫힌 문과 빗장), 잿모루(불꽃 속 모루), 회색광맥(바위를 가르는 회색 줄), 맹세지기(저울과 돌 심장)", "돌 증표(각인 철패)", "손바닥의 돌 같은 굳은살, 돌로 굳은 귀·손끝"]

