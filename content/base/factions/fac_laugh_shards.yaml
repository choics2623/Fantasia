# 웃음 조각 — 웃지 못하는 페이들. 여왕의 '웃음의 상자'를 한 번씩 열어 진실 한 조각과 맞바꾸고 웃음을 영원히 잃은 자들. 신살 때 왜 웃었는지 기억한다.
# [신설 결사 — HOUSES에 없음] 세계가 함의하는 것: 신살 때 페이는 웃었다(WORLD_BIBLE §1.4), 여왕이 웃은 이유는 에오르가 마지막 말을 인간에게 남기는 것을
# 그녀만 들었기 때문이다(fact_tm_queen_laugh_reason), 왕좌 뒤 '웃음의 상자' — 열면 진실 한 조각, 대가는 웃음(fact_tm_laugh_box), 여왕의 진명은 잔향이 '모든 이름'을
# 말하는 날 불린다(fact_tm_queen_true_name_fate), 떨어진 자들(HOUSES §3.9), 엉겅퀴 공은 대붕괴 당시 아스테리아 인간의 기억 한 해를 가졌다(fac_fae — RACES 신규).
# 왜 지금(AS 312): 여왕이 AS 311부터 '가장 좋은 장난감이 돌아왔다'며 숲 밖으로 사자를 보낸다(fact_tm_queen_knows_echo). 궁정 페이의 이름은 여왕의 진명에서
# 갈라져 나온 가지다 — 그녀의 이름이 불리는 날 그들의 이름도 불린다. 웃음 조각들은 그날을 '구경'이 아니라 '선택'으로 맞으려 한다.
id: fac_laugh_shards
name: 웃음 조각 (웃지 못하는 페이들)
kind: secret
race: [페이 — 궁정 페이와 떨어진 자, (귀) 바꿔치기된 인간]
governance: 조각 합의 — 각자 상자에서 꺼낸 진실 한 조각을 가졌고, 조각을 맞대야만 말이 된다. 페이는 진실을 말하면 그 말에 묶이므로 결사의 결정은 곧 결사의 굴레다
motto: "아무것도 우습지 않다."
seat: 가시안개 숲 궁정 안(웃음 재판관의 그늘), 그리고 숲 밖 — 모르바 늪 깊은 곳 가라앉은 종탑(잿가루)
size:
  members: "일곱 — 궁정 안 넷(거울 시녀 '혹시', 엉겅퀴 공, 가시 기사 '녹슨 장미', 이름 수집가의 시동), 떨어진 자 셋(잿가루 포함)"
  territory: "가시안개 숲, 모르바 늪"
  wealth: "진실 일곱 조각 — 페이에게 진실은 가장 비싼 것이다. 엉겅퀴 공이 가진 아스테리아 인간의 기억 한 해"
  force: "페이의 계약 마법, 환영 — 그리고 여왕에게 들키면 아무것도 아니다"

reason_now: >
  여왕이 사자를 보낸다. 웃음 조각들은 여왕이 3,400년 '구경'만 해 온 이유를 안다 — 자기 이름이 불리는 날이 죽음인지 해방인지 모르기 때문이다.
  조각들의 이름은 여왕의 이름의 가지이므로 그날 함께 불린다. 그들은 잔향을 여왕보다 먼저 만나 그날의 '순서'를 바꾸고 싶어 한다 — 여왕의 이름을 마지막에, 혹은 맨 처음에.

decision: >
  일곱은 새벽 사냥이 끝나는 시각 숲 경계의 '울지 않는 나무' 아래에서 만난다(한 계절에 한 번). 페이는 진실을 말하면 그 말에 묶이므로, 결정은 '진실 하나를 말하는 것'으로 한다 —
  안건마다 일곱 중 하나가 진실을 말하고(예: '우리는 그 아이를 여왕보다 먼저 만난다'), 그 말에 묶인 자가 그 일을 한다. 반대하는 자는 같은 자리에서 반대의 진실을 말할 수 있다 —
  그러면 둘 다 묶여 서로를 막는다. 그래서 반대는 드물다. 떨어진 자들은 진실을 말해도 묶이지 않는다(이미 떨어졌다) — 그래서 위험한 말은 떨어진 자가 한다.
succession: "조각은 이어지지 않는다 — 상자를 연 자만 조각을 가진다. 결사원이 사라지면(잊히면) 그 조각도 사라진다. 새 결사원은 상자를 한 번 열어야 한다 — 웃음을 영원히 잃는다."

