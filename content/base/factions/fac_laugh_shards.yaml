  join_real: "웃음의 상자를 한 번 연다 — 진실 한 조각을 얻고 웃음을 영원히 잃는다. 그 뒤 숲 경계 '울지 않는 나무' 아래에서 일곱 앞에 서서 아무 농담에도 웃지 않으면 된다(페이에게 그것은 죽음만큼 어렵다 — 상자를 열지 않은 자는 참지 못한다)"
  join_fake: "가짜는 불가능에 가깝다 — 웃음은 숨길 수 없다. 여왕의 밀정은 웃음을 참으려다 입꼬리가 떨린다"
  proof_test: "잔향에게: 잿가루의 값 — '네가 가장 아끼는 기억 하나'. 그리고 질문 하나: '그분이 마지막에 무엇을 보고 말했나?' — 잔향 안의 목소리가 답을 안다"
  exposure: "여왕은 자기 농담에 웃지 않는 자를 본다. 웃음 재판관이 '농담의 형태로' 판결한다 — 대개 추방(떨어진 자가 된다) 또는 잊힘(사라짐)"

