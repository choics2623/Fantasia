    chosen_by: "부족"
    perks: ["인간이 말을 탈 수 있는 유일한 부족 — 승마 스승 확보 가능"]
  - id: off_bek_lasthoof
    title: 마지막발굽 부족장 (전쟁 중)
    holder: "unnamed:보로 (80, 테무르의 숙적)"
    reports_to: off_bek_council
    powers: ["초원 서쪽 끝, 황무지 경계 — 패배 직전"]
    chosen_by: "부족 — 칸에게 복속하지 않았다"
