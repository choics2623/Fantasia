# 하르칸 초원 부족 — 바람 혈명('질주')의 굴레(정착 불가)가 만든 '달리는 합의'.
# 근거: HOUSES §3.6, RACES §11, REGIONS §15, facts/harkan.yaml.
# 조정: HOUSES(5부족) · RACES(부족 약 40, 31 복속) · REGIONS(씨족 14, 11 복속)의 부족 수가 어긋난다 — 이 파일은 HOUSES의 5부족을 중심에 두고 나머지는 '그 외 부족'으로 처리했다 (보고).
id: fac_harkan
name: 하르칸 초원 통일 칸국 (칸의 오르두)
kind: polity
race: [하르칸 바람발굽, 하르칸 무거운발굽, 하르칸 숲발굽, 인간 짐꾼, 크릭, 그나르(시체 청소부)]
governance: 씨족 연합 — 달리는 합의  # 칸은 '뒤에서 달리는 부족의 수'. 회의는 이동 중에 끝난다
motto: "바람보다 먼저."
seat: 칸의 오르두 (움직이는 수도 — 봄 북상, 가을 남하, 겨울 바람 우물)
size:
  members: "하르칸 약 60,000(REGIONS)~240,000(RACES), 인간 짐꾼 약 35,000~130,000(문서마다 다름), 크릭 약 3,000"
  territory: "하르칸 초원 — 서쪽 카즈둠 산기슭, 남쪽 말뼈 여울(그롬마르 분쟁지), 북부 여름 초원, 남부 겨울 초원"
  wealth: "말(대륙 최고, 8~15 비늘), 가죽, 소금 호수, 전리품. 수입은 무기(카즈둠)와 곡물"
  force: "기마 궁술(사거리 250m), 돌격·후퇴·포위. 도시는 교대 포위로 굶긴다. 인간 짐꾼 1,000명에게 활을 줬다는 소문"

decision: >
  하르칸의 정치는 달리면서 한다. 칸의 오르두는 열흘을 넘겨 한곳에 머물 수 없으므로(정주병), 모든 회의는 이동 중에 열리고 열흘 안에 끝나야 한다.
  부족장(벡)들은 오르두를 따라 나란히 달리며 짧은 말을 주고받고, 방향을 정하는 것은 바람 읽는 자의 예보와 칸의 한 마디다.
  칸은 혈통이 아니라 '추종하는 부족 수'로 정해진다 — 부족이 칸 뒤에서 달리면 지지이고, 옆으로 비껴 달리면 이탈이며, 이탈이 곧 불신임이다.
  그래서 투표는 없고, 모든 결정은 매일의 신임투표다. 벡은 '갈기 가닥을 잘라 날려' 칸과의 바람 맹세를 끊을 수 있고, 그 순간 그의 부족은 칸의 수에서 빠진다.
  거부권은 이탈이다. 다툼은 경주 재판으로 가른다 — 길이가 다툼의 무게다. 서풍(죽음의 바람)이 부는 날 서쪽으로 진군하지 않는다는 옛 법을 테무르가 처음 깼고, 그것이 옛 바람파의 분노다.
  인간은 의제가 아니다. 짐꾼은 짐으로 센다 — 다만 짐 맏이(인간)가 행렬을 지휘하는 자리를 가진다.
succession: >
  칸의 자리는 칸위 결투(경주 또는 맞대결)로 이어진다. AS 290 테무르가 스승 바타르의 다리를 부수고 칸위에 올랐다(바타르는 일부러 다리를 내주었다).
  칸이 죽으면 부족들이 흩어져 오르두는 사라지고 새 칸은 '가장 먼저 달리는 자' 뒤에서 다시 생긴다. 통일 칸국의 약점이 그것이다 — 테무르 하나가 쓰러지면 칸국은 일곱 가닥으로 풀린다.
  후계 구도: 아들 바투(HOUSES) 대 딸 소란(카드). 소란은 짐꾼의 짐을 내려놓게 하겠다고 두아에게 약속했다.

offices:
  - id: off_khan
    title: 칸
    holder: npc_temur
    reports_to: null
    powers: ["오르두 이동 방향", "벡들과의 바람 맹세", "서진 결정 — 서풍의 날 진군", "노예 사냥 계획"]
    chosen_by: "추종하는 부족 수 + 칸위 결투. 40부족 중 31(RACES) / 14씨족 중 11(REGIONS) 복속"
    perks: ["칸의 천막 지도(그롬마르와 용제국 동부를 모두 정복하는 계획)", "정착병이 시작됐다(통일 후 정착 왕국은 그를 병들게 한다)"]
  - id: off_consort_strategist
