  - id: off_wind_reader
    title: 바람 읽는 자
    holder: "unnamed:날씨·냄새·먼 소리를 읽는 하르칸"
    reports_to: off_khan
    powers: ["이동 방향 예보", "서풍의 날 경고"]
    chosen_by: "부족 추천"
    perks: []
  - id: off_death_ledger
    title: 말뼈 샘 시체 청소부 (그나르 — 비공식 기록자)
    holder: npc_hiak
    reports_to: off_khan
    powers: ["원정 길과 전장의 죽음 장부 — 누가 어디서 죽었는지"]
    chosen_by: "아무도 뽑지 않는다 — 그나르라 경멸받으나 쓸모가 있다"
    perks: ["쓰러진 짐꾼들의 유품 목록을 머릿속에 지닌다"]

ranks:
  - {id: rank_khan, title: "칸", duties: "추종 부족을 이끌어 달린다", privileges: "칸의 오르두", open_to_player: false}
  - {id: rank_bek, title: "부족장 (벡)", duties: "부족 이동과 맹세 유지", privileges: "회합 발언, 이탈권", open_to_player: false}
  - {id: rank_galloper, title: "질주자 (전사)", duties: "돌격·후퇴·포위, 땋은 갈기 수 = 승리 수", privileges: "부족 보호", open_to_player: false}
  - {id: rank_elder_horse, title: "어린 말·늙은 말", duties: "어린 말은 훈련, 늙은 말은 스스로 무리를 떠난다", privileges: "부양하지 않는다 — 늙어 달리지 못하는 자는 떠난다", open_to_player: false}
  - {id: rank_load_elder, title: "짐 맏이 (인간)", duties: "짐꾼 행렬 지휘", privileges: "행렬에서 낙오해도 한 번은 줍는다", open_to_player: true, condition: "초원어를 배우고(두아가 스승) 행렬을 낙오 없이 이끈다. 하르칸 한 명당 짐꾼 0.5명"}
  - {id: rank_porter, title: "짐꾼 (인간)", duties: "이동 천막·물자 나르기 — 하루 12시간", privileges: "말젖 죽, 행군 중 하루 1끼", open_to_player: true, condition: "초원에서 포획되거나 노예 시장에서 팔려 온다. '발굽 아래 법' — 초원에 버려진 인간은 누구의 것도 아니다"}
  - {id: rank_outcast_village, title: "버려진 자들의 마을 주민 (인간)", duties: "없음 — 누구의 것도 아닌 자", privileges: "초원에서 합법적으로 자유", open_to_player: true, condition: "행렬에서 낙오한 뒤 마을에 닿는다"}

law:
  crimes:
    - {act: "하르칸의 다리를 묶음(밧줄·덫)", punishment: "즉시 처형", note: "인간 대상 — 최악의 모욕"}
    - {act: "행렬 낙오", punishment: "버림", note: "인간 대상. 집행 채찍 기수 — 초원에 버려진 인간은 누구의 것도 아니다"}
    - {act: "짐 분실", punishment: "채찍 20", note: "인간 대상"}
    - {act: "말 훔치기 / 도주", punishment: "사냥(놀이) — 하르칸 누구나 쫓을 수 있다", note: "인간 대상"}
    - {act: "바람 표식 없는 통행(외부인)", punishment: "화살", note: "외부인 대상"}
    - {act: "바람을 등지고 거짓말함", punishment: "바람이 말을 실어 간다 — 맹세 무효, 신뢰 상실", note: "하르칸·인간 모두"}
    - {act: "지붕 아래 사흘 넘게 자거나 정착을 권유", punishment: "정주병의 모욕. 권유는 결투 사유", note: "하르칸 대상. 인간이 '여기 머물라'고 하면 역린"}
    - {act: "죽은 자를 땅에 묻음", punishment: "시신 훼손은 부족 전체의 사냥감 — 바람에게 줘야 한다(높은 언덕)", note: "양쪽 모두"}
    - {act: "늙어 달리지 못하는 자를 부양함", punishment: "부양하는 쪽이 치욕 — 늙은 하르칸은 스스로 무리를 떠난다", note: "하르칸 대상. 바타르·예순 늙은굽은 예외로 남았다"}
    - {act: "바람 맹세(갈기 교환) 파기", punishment: "그 갈기 가닥을 잘라 바람에 날린다 — 부족이 칸의 수에서 빠진다", note: "벡 대상"}

customs:
  greeting: "'어느 쪽 바람이오?' — 서로의 등 뒤 바람을 말하고 상대의 다리부터 본다. 갈기 한 가닥을 건네 보이는 것이 신뢰의 시작이다. 인간은 짐을 내려놓지 않고 눈을 낮춘다."
  taboos:
    - "다리를 묶는 것 — 밧줄·덫·말뚝. 가장 큰 모욕"
    - "지붕 아래 사흘 넘게 자는 것, '여기 머물라'는 정착 권유"
    - "바람을 등지고 거짓말하는 것"
    - "죽은 자를 땅에 묻는 것 — 시신은 높은 언덕에 둔다"
    - "늙음 조롱, 늙어 달리지 못하는 자를 부양하는 것"
    - "서풍(죽음)이 부는 날 서쪽으로 진군하는 것 — 테무르가 깨뜨렸다"
  rites:
    - {name: "바람 맹세", when: "수시", what: "서로 갈기를 한 가닥씩 바꿔 땋는다. 깨면 그 가닥을 잘라 바람에 날린다"}
    - {name: "경주 재판", when: "다툼이 있을 때", what: "길이 = 다툼의 무게. 먼저 닿은 자의 말을 듣는다. 승마는 소용없고 운동 판정이다"}
    - {name: "바람 장례", when: "죽음", what: "시신을 높은 언덕에 둔다 — 바람에게 준다"}
    - {name: "사냥 축제", when: "낙엽월", what: "오르두 남하와 함께. 사냥과 경주"}
    - {name: "오르두 이동", when: "봄 북상·가을 남하", what: "열흘을 넘기지 않는다. 겨울 진영은 바람 우물"}
    - {name: "늙은이의 떠남", when: "달리지 못하게 되었을 때", what: "스스로 무리를 떠난다 — 예순 늙은굽은 떠나지 않았다"}
  speech: "빠르고 짧다. 과거형은 거의 쓰지 않는다 — '오늘'을 사는 말. 존대는 땋은 갈기 수(승리 수)와 달리는 속도로 정한다. 인간에게는 '느린 발'이라 부르며 반말, 명령형 위주. 약속은 바람에게 하므로 '바람이 들었다'로 끝낸다. 머물러야 하는 이야기(긴 설명, 협상)는 서둘러 끝낸다 — 열흘을 넘기지 않는다."

membership:
  join: "하르칸은 부족에 태어난다. 다른 부족에게 받아들여지려면 갈기 가닥을 바꿔 땋는다(바람 맹세). 인간은 짐꾼으로 포획·구매되거나 버려진 자들의 마을에서 나와 짐 맏이가 된다."
  leave: "벡의 이탈은 갈기 가닥을 잘라 날리는 것. 늙은 하르칸은 스스로 무리를 떠난다. 인간 짐꾼은 낙오하면 버려지고, 그것이 곧 초원에서의 자유다."
  signs: ["땋은 갈기와 꼬리(땋은 수 = 승리 수)", "부족 문장 — 사자 머리(아르슬란), 붉은 말꼬리(붉은갈기), 원 안의 점 일곱(일곱샘), 검은 회오리(검은바람), 부러진 발굽(마지막발굽)", "초원의 돌무더기 — 이삭 줍기 표식"]

