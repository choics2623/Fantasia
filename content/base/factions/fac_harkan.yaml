    holder: "unnamed:카사르 붉은발굽 — 인간 짐꾼들에게 활을 가르쳤다는 소문"
    reports_to: off_khan
    powers: ["짐꾼 궁술(소문)"]
    chosen_by: "혈통"
    perks: []
  - id: off_heavy_hoof_head
