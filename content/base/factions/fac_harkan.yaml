    reports_to: off_khan
    powers: ["작전 구상", "오르두 이동 설계"]
    chosen_by: "칸의 선택"
    perks: []
  - id: off_khan_heir_batu
    title: 칸의 아들 (HOUSES 후계 후보)
    holder: "unnamed:바투 (30)"
    reports_to: off_khan
    powers: ["부족 일부의 지지"]
    chosen_by: "혈통 — 그러나 칸위는 결투로"
    perks: []
  - id: off_khan_heir_soran
    title: 칸의 딸 (카드 후계 후보)
    holder: npc_soran
    reports_to: off_khan
    powers: ["짐꾼 해방의 암류", "바타르에게서 몰래 창술을 배운다"]
    chosen_by: "혈통 — 칸위는 결투로"
    perks: []
  - id: off_bek_council
    title: 벡 회합 (부족장 — 집합 자리)
    holder: "unnamed:복속한 부족의 부족장(벡)들 — 달리는 회의"
    reports_to: off_khan
    powers: ["이동 중 의견 개진", "갈기 가닥을 잘라 이탈(거부권)", "경주 재판 청구"]
    chosen_by: "부족 내 추대"
    perks: []
  - id: off_bek_redmane
    title: 붉은갈기 부족장 (칸의 장인)
    holder: "unnamed:에젤 (58)"
    reports_to: off_bek_council
