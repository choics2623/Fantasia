# 인간 플레이어의 길(배신 루트): 탈주자 은신처 하나를 팔면 목줄꾼. 첫 임무 '오물 습지의 디트마르 무리 위치를 확인하라'.
# 이중 첩자 루트: 가짜 흔적을 남겨 바르그를 엉뚱한 곳으로 — 늪 마녀 냄새 지우기 약 필요.

law:
  crimes:
    - {act: "사냥감을 놓침 (보고 없이)", punishment: "다음 사냥에서 맨 뒤 — 무리 안에서 가장 무거운 수치", note: "바르그 대상. 볼크는 해마다 아이 하나를 '놓친' 것으로 보고한다 — 그 벌을 스스로 받는다"}
    - {act: "다른 송곳니의 사냥터를 침범", punishment: "둘레에서 목덜미를 물린다", note: "바르그 대상"}
    - {act: "현상금을 빼돌림", punishment: "조합에서 쫓아낸다 — 무리 없는 바르그는 미쳐 간다", note: "바르그 대상"}
    - {act: "탈주 (인간 — 맹약의 법)", punishment: "추적·포획. 현상금 5발톱~2비늘, 시체도 받는다(이르가는 받지 않으려 한다)", note: "인간 대상"}
    - {act: "목줄꾼이 거짓 위치를 팖", punishment: "그 목줄꾼의 냄새를 무리 전체가 기억한다 — 다음 사냥감이 그다", note: "인간 대상"}
    - {act: "잔향 징후를 숨김", punishment: "맹약 213의 의무 위반 — 정화청 인계", note: "누구에게나"}

customs:
  greeting: "바르그끼리 목덜미 냄새를 맡는다 — 아래 서열이 고개를 숙여 목을 내민다. 인간 목줄꾼에게는 인사하지 않는다. 그의 냄새를 한 번 맡을 뿐이다."
  taboos: ["사냥감의 냄새를 잊는 것(그 회차 안에서는 잊지 않는다)", "무리 앞에서 우는 것", "달 없는 밤의 사냥 — 보름 사냥이 신성하다(수인족은 달을 섬긴다)", "흰발 무리의 이름"]
  rites:
    - {name: "송곳니 둘레", when: "보름마다", what: "송곳니 회관 마당. 지난 사냥을 짖듯 보고하고 다음 사냥터를 받는다. 반대는 원 밖 한 걸음"}
    - {name: "첫 물기", when: "어린 코의 첫 사냥", what: "어린 바르그가 처음 잡은 사냥감의 피를 혀로 맛보고 그 냄새를 평생 기억한다고 맹세한다"}
    - {name: "마지막 냄새", when: "사냥대장이 늙었을 때", what: "가장 어려운 사냥 하나를 건다 — 물어 오는 자가 대장"}
  speech: "짧고 냄새의 말을 쓴다('그 녀석은 젖은 짚 냄새', '이 마을은 겁 냄새가 난다'). 볼크는 거짓말을 하지 않는다 — 조합의 말투도 그를 닮아 위협을 꾸미지 않는다. 인간에게는 반말, 용인에게는 짧은 존댓말."

