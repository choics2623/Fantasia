# 바르그 노예사냥 조합 — 맹약이 공인한 사냥개. "냄새는 거짓말하지 않는다."
# 근거: HOUSES §5.9·§3.10·§6.1·§6.3, WORLD_BIBLE §2(AS 213)·§1.3.1(젖은 재 냄새)·§7.2, RACES 수인족(무리 없이는 미쳐간다), CHARACTERS R02-07·R01-09·R02-33·R02-12, facts/greyford*.yaml·drakmar.yaml.
id: fac_barg
name: 바르그 노예사냥 조합
kind: org
race: [수인족 바르그 (코·송곳니), 인간·크릭 (목줄꾼)]
governance: 힘의 서열 (무리) — 사냥대장 아래 송곳니 열둘. 사냥대장은 도전이 아니라 '마지막 냄새'로 바뀐다
motto: "냄새는 거짓말하지 않는다."
seat: "바알카르 외곽 '사냥꾼 막사' — 본부 '송곳니 회관'. 지부 7곳 (회색여울 인근 — 까마귀 문 남쪽 '송곳니 초소')"
size:
  members: "사냥대장 1, 송곳니(분대장) 12, 코(추적 전문 바르그) 약 900, 목줄꾼(인간·크릭 보조) 약 300"
  territory: "용제국 통행 무제한 허가 — 대륙 어디든. 실제 사냥터는 용제국·회색여울·모르바 가장자리·서리 길"
  wealth: "현상금(5발톱~2비늘)의 30% 수수료, 징후자 1인당 맹약 보상금 3비늘. AS 311 수입 약 4,100비늘. 사르코스 가문 후원"
  force: "바르그의 코(냄새 추적 사흘 거리), 사냥개, 무리 — 늑대 수인 사냥꾼 하나가 마을을 공포에 떨게 한다"

decision: >
  사냥대장이 정한다. 그러나 바르그는 무리 없이는 미쳐 가는 종족이라 사냥대장도 무리의 '냄새'를 거스르지 못한다.
  보름마다 송곳니 회관 마당에서 '송곳니 둘레'가 열린다 — 송곳니 열둘이 원으로 서서 지난 보름의 사냥(머릿수, 놓친 냄새, 다친 코)을 짖듯 보고하고, 다음 사냥터를 받는다.
  송곳니 하나가 사냥대장의 결정에 반대하면 원 밖으로 한 걸음 나간다. 열둘 중 넷이 나가면 사냥대장은 그 결정을 거둔다(관례 — 볼크 재위 중 두 번).
  큰 계약(용제국 영주의 일괄 소탕, 잔향 포획의 입찰)은 사냥대장 혼자 정하고 사르코스 가문 인장으로 맺는다.
succession: >
  바르그 무리의 법은 도전이지만, 조합은 맹약회의가 공인한 '조합'이라 도전으로 대장을 바꾸면 공인 허가가 흔들린다. 그래서 관례가 생겼다 — '마지막 냄새':
  사냥대장이 더는 사흘 거리 냄새를 쫓지 못하게 되면(늙음) 송곳니 둘레에서 '마지막 냄새'를 낸다 — 가장 어려운 사냥 하나를 걸고, 그것을 물어 오는 송곳니가 다음 대장이다.
  볼크는 64세(수명 60~70, 노년). 후계 후보는 셋 — 북방 탈주자 전담 송곳니 세타(볼크의 후계 후보), 회색여울의 그로드, 그리고 부조합장 이르가('산 채로만'을 조합 전체의 규칙으로).
  볼크가 걸 '마지막 냄새'는 잔향이 될 것이라는 말이 송곳니들 사이에 돈다.

