toward_echo: "산 채로 — 최고가 입찰자에게. 볼크는 아우락스 지지자지만 잔향만큼은 화형대가 아니라 멜리산드나 잿빛 탑에 넘길 생각이다(예상가 500비늘 이상). 첫 회차의 그로드는 배급 줄을 그냥 지나친다. 열 번째 회차의 그로드는 줄 앞에서 멈춰 코를 든다 — 처음 맡는 냄새인데, 왜 쫓아야 할 것 같은지 모른다."
