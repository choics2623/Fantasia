# 바르스카르 혈족 (Brood) — 정본: HOUSES §1.3~1.4, §1.6, §6.1(진영 행), §6.3 / RACES §2 / SUBRACES §3.1 / WORLD_BIBLE §4.1
# 혈족은 '가문'이면서 계승 위기의 세 진영(+알)이 갈라서는 선이다. 이 파일은 피로 묶인 쪽 — 제국 행정(fac_drakmar_empire)과 구분한다.
# 기준: AS 312 낙엽월 1일. id 없는 자리의 holder는 'unnamed:...' (TODO-NPC).
id: fac_varskar_brood
name: 바르스카르 혈족
kind: house
race: [용족(진룡), 반용(서자)]
governance: 힘의 서열 — 그러나 '더 센 자'가 아니라 '더 많이 가진 자'
governance_note: >
  혈족에는 회의도 표결도 없다. 서열은 도전과 결투로 바뀌고, 결투의 승패는 힘이 아니라 소유 — 보고, 짝, 알, 영지 — 로 가려진다.
  용은 가진 것으로 자신을 정의하므로 혈족의 다툼은 언제나 약탈의 모양을 한다. 가문의 '의사 결정'이라 부를 수 있는 것은 두 가지뿐이다.
  ① 용황이 후계자 셋을 오후 한 시간씩 교대로 접견하는 순서(누가 먼저 병상에 닿는가). ② 알의 법 — 알은 어미만 이름을 부를 수 있다.
motto: "가진 것이 곧 이름이다."   # RACES §2: 정식 이름 = 고유명 + 몸의 특징 + 소유 목록
seat: dragon_throne_peak     # 용좌봉 '재의 둥지'. 혈족은 흩어져 산다 — 붉은 첨탑(red_spire), 잿불 언덕 은비늘 요람, 서리 요람, 재의 요람(남해), 까마귀 문
size:
  members: "진룡 8(바르스카르·아우락스·드라반·세라크·멜리산드·실바라·이졸데·세벨린) + 반용 1(카스파르) + 알 1 + 생사불명 1(아르젠티아) + 도둑맞은 알 1. 사망자는 계승의 증인이다(바엘리스·토르반·하길라·그림바르·아그라몬)"
  territory: "붉은 첨탑(아우락스), 잿불 언덕(멜리산드), 용좌봉(용황), 서리 요람(이졸데), 까마귀 문(카스파르의 지휘소), 재의 요람(세벨린의 자진 유배)"
  wealth: "제국 전체가 용황의 보고. 혈족 개인 재산은 영지·광산·노예·비늘 — 용황의 비늘은 하루 한 바구니씩 바래 떨어지고 암시장에서 금화 2닢에 팔린다"
  force: "진룡 8마리 중 계승 위기에 실제로 날아올 수 있는 것은 아우락스·드라반·세라크·멜리산드·실바라·이졸데·(세벨린)·바르스카르(병석) — 그러나 한 마리가 군대 하나다"

