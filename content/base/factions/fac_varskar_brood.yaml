decision: >
  혈족 전체의 결정은 없다. 용황이 깨어 있는 오후 한 시간의 접견이 유일한 '가족 회의'이고, 그 순서가 곧 서열의 신호다.
  나머지는 영지별 독단. 짝이 다른 용과 날면 결투가 법이다(이졸데 307년 결투에서 2마리가 죽었다). 진룡끼리의 직접 충돌은 낙하물 피해가
  제국 전체에 미치므로 계승 전쟁의 가장 두려운 장면이다. 혈족 안에서 '표결'이 있는 것은 오직 불꽃 홀의 확인 — 용인 가주들의 표 — 뿐이며 그것은 혈족의 것이 아니다.
succession: >
  용황이 죽으면 그의 보고를 가장 많이 차지한 자가 용황이 된다(계승 원칙 없음 → 계승 위기는 곧 약탈전). 아우락스는 장자이고 병력이 있으나 과반이 없다.
  멜리산드는 돈과 지식이 있다. 이졸데는 알이라는 가장 큰 보고를 쥐었다. 카스파르는 족보에 없으므로 즉위하려면 족보를 쓰는 자들(칼다란)과 싸워야 한다.
  세벨린은 오지 않으면 0, 오면 10. 흰 알은 부화가 313 꽃월이므로 '용황이 그 전에 죽는가'가 알의 운명을 정한다.
  한 후보의 지지율이 80을 넘거나 내전 6개월이 지나면 결말이 난다(SCENARIOS §2.1 — 클락 점수 아우락스 60 / 멜리산드 45 / 흰 알 25 / 카스파르 15).

law:
  crimes:
    - {act: "남의 보고를 만진다", punishment: "용이면 결투, 아니면 즉결 처단", note: "혈족 안에서도 같다 — 토르반은 아우락스의 보고를 건드려 가마솥 결투에서 죽었다"}
    - {act: "짝이 다른 용과 난다", punishment: "결투", note: "이졸데의 짝짓기 때 경쟁자 2마리가 죽었다"}
    - {act: "알을 깬다", punishment: "용서 없음", note: "3,400년간 단 한 번도 용서받지 못했다. 아우락스의 자객 3명이 서리 탑에서 이졸데에게 찢겼다"}
    - {act: "역린을 입에 올린다", punishment: "살해 위협으로 간주", note: "혈족 안에서도 다르지 않다"}
    - {act: "대붕괴의 진실을 입 밖에 낸다 ('불의 침묵')", punishment: "듣는 인간은 처분 — 용황은 열한 명을 처분했다", note: "아우락스와 소수의 고룡만 안다"}
    - {act: "반용 자식을 살려 둔다", punishment: "출생 직후 처분이 관례", note: "카스파르가 예외인 이유는 기록에 없다 (칼다란 기록)"}
    - {act: "자기 소유물(노예)을 스스로 죽인다", punishment: "금기 — 용인 집행관을 시킨다", note: "화형 집행관 드라반도 '용인 집행관을 대신해' 직접 불을 뿜는 것을 영예로 삼을 뿐이다"}
    - {act: "잃었다고 말한다", punishment: "관계 −50 (역린)", note: "패배는 '양보했다'"}

customs:
  greeting: "영공에 들 때 세 번 선회한다. 인사는 말이 아니라 소유의 확인 — '네 보고의 목록은 안녕한가'를 뜻하는 낮은 울음. 용인의 중개 없이 인간이 말을 거는 것 자체가 무례."
  taboos:
    - "남의 보고, 알, 역린"
    - "'잃었다', '도둑'"
    - "바엘리스의 이름 — 아비는 그날을 입에 올리지 않는다"
    - "하길라 흑연기의 이름 — 아우락스가 유일하게 '약해지는' 화제"
    - "대붕괴 때 의식 한가운데에 불을 뿜었다는 사실 — '불의 침묵'"
  rites:
    - {name: "소유의 낭송", when: "새 용황의 즉위", what: "모든 것의 목록을 낭송한다. 정식 이름을 다 읊는 데 사흘"}
    - {name: "두개골 회랑의 셈", when: "재의 날", what: "죽은 용의 두개골은 기도의 대상이 아니라 그들의 보고를 세어 보는 대상이다. 용좌봉 지하 회랑"}
    - {name: "알 품기", when: "산란 후 300일", what: "화산열 또는 어미의 체온. 부화의 화로 — 이졸데는 화로지기 인간 노예들을 아낀다"}
    - {name: "접견 교대", when: "매일 오후 용황이 깨는 한 시간", what: "세 후계자가 교대로 병상에 든다. 그 순서가 그날의 서열"}
  speech: "용언. 문장은 소유격으로 끝나는 선언 — '이것은 나의 것이다'가 아닌 '이것은 내가 가진 것의 일부다'. 인간을 가축의 울음으로 듣는다. 직접 호명하지 않고 목록으로 부른다."

membership:
  join: "출생. 짝으로 들어온 용은 혈족이 아니라 '소유'다. 반용은 출생 직후 처분이 관례 — 살려진 것이 예외."
  leave: "유배(세벨린), 이탈(아르젠티아), 결투의 죽음. 용은 혈족을 '그만두지' 않는다 — 가진 것을 잃을 뿐이다."
  signs: ["색: 잿빛(바르스카르)·붉은 계(아우락스)·은빛 계(멜리산드·이졸데·실바라)·흑 계(하길라·바엘리스)", "용의 표: 소유한 인간 왼쪽 어깨의 문장"]

internal_factions:
  - name: "불의 손 (아우락스파)"
    faction_id: fac_aurax
    leader: npc_aurax
    aim: "재의 법 강화, 잔향 대숙청, 반용 처단. 잔향자가 회귀를 깨닫기 전에 '아버지의 불'로 끊는다 (아버지가 살아 있는 동안에만 가능)"
    strength: 41
    matrix: {aurax: null, melisande: -60, kaspar: -90, eldar: 10, nocturne: -20, durgan: 10, seren: 20, jotun: -70, grom: 40, light: 30, nameless: -100, collar: 40, tower: -30, varg: 70, hags: -90}
  - name: "은의 서약 (멜리산드파)"
    faction_id: fac_melisande
    leader: npc_melisande
    aim: "인간은 개량할 자원 — 이식과 육종, 그리고 '견디는 단 하나의 그릇'(잔향). 최종 목표는 아버지의 시간의 상처를 그릇에 옮겨 담아 용족이 이름을 잃지 않는 것 + 즉위"
    strength: 32
    matrix: {aurax: -60, melisande: null, kaspar: -50, eldar: 60, nocturne: 0, durgan: 20, seren: 60, jotun: -40, grom: 0, light: 20, nameless: -80, collar: 20, tower: 70, varg: 10, hags: -60}
  - name: "알의 수호 (이졸데)"
    leader: npc_isolde
    aim: "흰 알을 아무에게도 소유되지 않는 용으로 키운다. 용황이 죽으면 알을 까마귀 문으로 피신시킬 계획(카스파르와 비밀 서신 두 번). 알이 위협받으면 누구와도 손잡는다"
    strength: 18
    matrix: {note: "행렬 행이 없음 — HOUSES §6.1은 후계자 진영 3개만 행으로 둔다. 원로회 쪽 값(이졸데/흰 알 +60)은 fac_scale_council 참조"}
  - name: "서자의 국경 (카스파르파)"
    faction_id: fac_kaspar
    leader: npc_kaspar
    aim: "혈통을 깨지 않고 어머니의 종족에게 성(姓)을 줄 수 있는 자리. 공개로는 침묵, 비밀리에 이름 없는 자들(탈주자 수송을 세 번 눈감아 줌)"
    strength: 9
    matrix: {aurax: -80, melisande: -50, kaspar: null, eldar: -10, nocturne: -20, durgan: 20, seren: 0, jotun: -30, grom: -10, light: 0, nameless: 40, collar: -40, tower: -30, varg: -60, hags: 20}
  # matrix 열 = HOUSES §6.1 열 순서(아우·멜리·카스·엘다·녹테·두르·세렌·요툰·그롬·순빛·이름·목줄·탑·바르·늪마). null은 자기 자신.
  # strength = HOUSES §6.3 귀족 지지율(%).

assets:
  - "진룡 8 — 각자의 영지가 곧 보고"
  - "용좌봉 두개골 회랑, 불꽃 홀 지하 '첫 둥지'의 아그라몬 해골(이빨 하나가 '신을 태운 이빨'로 밀거래된다는 소문)"
  - "흰 알과 서리 탑 / 서리비늘 혈통의 후원(스카디아, 서리 이빨)"
  - "붉은 첨탑과 재송곳 기사단 / 잿불 언덕과 은비늘 요람 / 까마귀 문과 국경군"
  - "토르반의 송곳니 — 잿불 언덕 광산 깊은 곳에 박혀 있다('열이 나는 돌')"
  - "그림바르의 뿔 — 두르강 왕가 보물고"

