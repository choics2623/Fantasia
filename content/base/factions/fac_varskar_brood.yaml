relations: []
# 의도적으로 비워 둔다. 혈족 전체의 행은 HOUSES §6.1에 없다 — 행은 후계자 진영(아우락스파·멜리산드파·카스파르파)별이다.
# 진영별 14개 열 값은 internal_factions[].matrix에 그대로 있다 (진영 id: fac_aurax, fac_melisande, fac_kaspar — 다른 세력 파일이 쓰는 id).
# 원로회가 혈족을 보는 값은 fac_scale_council.relations.

toward_echo: "혈족 안에서도 갈린다. 아우락스·드라반: 화형 후 아버지의 불로 단절. 멜리산드: 포획 후 이식. 카스파르: 불명 — 동질감인가 이용인가. 이졸데: 알의 각인에 닿는 잔향 — 껍질의 실금이 빛난다. 용황: 기시감, '다시 오겠다'는 아스테리온의 눈빛을 반쯤 기다린다."
player_paths:
  - "임종 시중 노예 — 노라 곁에서 용황의 마지막 숨을 듣는다 (불의 진명 한 마디가 전해질 수 있으나 그 순간 아우락스가 냄새를 맡는다)"
  - "흰 알 — 부화를 지키거나, 이졸데의 신뢰를 얻거나, 극단적으로 훔쳐 이름 없는 자들에게 넘긴다"
  - "멜리산드의 사냥 — 일부러 잡혀 들어가 안에서 무너뜨린다 (빈 그릇만 살아 나온다)"
  - "카스파르 — 레아의 정체 증명, 아우락스파의 암살 계획 전달"
  - "세라크·실바라 — 혈족 안의 균열: 진실을 묻는 손녀, 피험자 명단을 외운 손녀"
regression:
  fixed:
    - "용황의 병세(건강 34/100, 매달 −3), 접견 시간, 낙엽월 초하루의 '또 그 저녁' 중얼거림"
    - "흰 알 부화 313 꽃월 / 지지율 41·32·18·9"
    - "아우락스가 대붕괴의 진실을 안다, 멜리산드가 3,214명을 번호로 남겼다"
  flow:
    - "후계자 접견 순서의 평균 경향 (대개 아우락스 > 멜리산드 > 카스파르)"
  drift:
    - "세라크·드라반의 정찰 경로, 아우락스의 순회 날짜"
    - "누가 서리 탑 상공을 몇 시에 도는가"
  time_sensitive: "바르스카르(감도 1.5)는 회차가 쌓일수록 기시감이 강해진다 — 열 번째 회차쯤이면 화로지기에게 남쪽 강가 인간 아이들을 세어 오라 하고, 더 쌓이면 스스로 날개를 편다."
