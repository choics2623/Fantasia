# 흔적지기 — 앞선 잔향자들이 '끝난 자리'와 그들이 남긴 물건을 줍고 지키는 인간 결사. 매듭집이 말을 묶는다면, 흔적지기는 자리와 물건을 묶는다.
# [신설 결사 — HOUSES에 없음] 세계가 함의하는 것: 앞선 잔향자들의 최후(WORLD_BIBLE §1.3.1, T12), 시간 유리 칼 '첫 침묵'이 AS 214부터 이름 없는 아이들에게 쓰였다
# (fact_ar_glass_blades), 매듭집의 기억 매듭줄(HOUSES §4.10), 주춧돌(REGIONS §11.5), 교본 상자(fact_aw_kyle_found_box), 할라의 첫 불씨 기록(fact_ar_halla_first_ember_page),
# 서리손의 군데 전승(fact_hi_gunde_hungry_child), 다라의 곡괭이 머리와 9번 갱 손자국(HOUSES §4.2), 멈춘 광장(REGIONS §11.9), 15 문서 '앞선 잔향자의 목소리'.
# 왜 지금(AS 312): AS 311 징후 보고가 세 배가 되었다 — 흔적지기는 '그'가 깨어났다고 믿는다. 잔향 안의 목소리들은 그들이 끝난 자리에서 가장 크게 들린다.
# 흔적을 그에게 닿게 하는 것이 결사가 214년 동안 준비한 일이다. 그리고 잿빛 탑이 같은 물건(교본 상자 200비늘, 청동 열쇠, 첫 불씨 기록)을 사들이기 시작했다.
id: fac_trace_keepers
name: 흔적지기 (다섯 끝의 길)
kind: secret
race: [인간]
governance: 길 합의 — 다섯 '끝지기'가 각자 끝난 자리 하나를 지킨다. 결정은 끝지기 다섯 중 셋이 길 위에서 만나야 난다
motto: "어디서 끝났나? — 끝나지 않은 곳에서."
seat: 없음. 다섯 끝의 길 — 실바렌 흰 울타리 밖 재 구덩이(첫 불씨), 흐로스가르드 남쪽 옛 방패줄 들판(군데), 재의 황무지 멈춘 광장(아스테리온), 잿불 언덕 붉은 길(다라), 아르카스 탑섬 맞은편 바위(이름 없는 아이들 — 첫 침묵)
size:
  members: "끝지기 5, 길꾼(순례하며 나르는 자) 약 40, 줍는 자(협력자) 약 150 — 노예선 선원, 서기 노예, 유물 사냥꾼, 무덤지기"
  territory: "다섯 끝의 길 — 대륙을 가로지르는 순례. 길은 글이 아니라 노래 「다섯 끝의 노래」로 외운다"
  wealth: "흔적 — 첫 불씨 정원의 그을린 돌, 군데의 방패 테 조각, 아스테리아 아이의 신발 한 짝, 다라 갱도의 붉은 진흙, 첫 침묵에 끝난 아이들의 이름 매듭(매듭집과 나눠 가짐)"
  force: "없다. 걷는 다리뿐"

reason_now: >
  흔적지기의 믿음은 하나 — 잔향 안의 목소리들(앞선 잔향자들)은 그들이 끝난 자리에서 깨어난다. 그가 다섯 끝을 다 걸으면 다섯 목소리가 모두 깨어난다.
  AS 311 징후 3배 — 그가 왔다. 그리고 탑이 흔적을 사들이고 있다: 교본 상자에 200비늘, 할라의 기록은 이미 탑 안에 있다. 흔적이 탑의 서가에 들어가면 다시 나오지 않는다.

decision: >
  다섯 끝지기는 각자 자기 끝을 떠나지 않는다(떠나면 그 자리가 잊힌다). 그래서 결정은 길꾼이 나른다 — 길꾼 하나가 다섯 끝을 한 바퀴 돌며 안건을 노래로 묻고,
  끝지기가 '흙 한 줌'(찬성)이나 '빈손'(반대)을 쥐여 준다. 한 바퀴(약 1년 반)가 끝나 흙이 셋이면 정해진다. 급한 일은 '세 끝 모임' — 가장 가까운 셋이 길 위에서 만난다.
  지금 안건은 하나다: '흔적을 그에게 주는가, 그를 흔적에게 데려가는가.' 첫 바퀴가 아직 돌아오지 않았다.
succession: "끝지기는 자기 끝에서 죽는다. 그 자리는 그 끝을 가장 많이 걸어 본 길꾼이 잇는다. 첫 침묵의 끝(아르카스 맞은편)은 AS 214 결사의 시작부터 한 번도 비지 않았다."

