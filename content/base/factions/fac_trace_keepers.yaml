infiltration:
  join_real: >
    줍는 자는 흔적 하나를 탑·정화청·회색 순례자보다 먼저 주워 끝지기에게 가져오면 된다. 길꾼 시험은 '빈 귀': 한 구간을 혼자 걸어 끝에서 하룻밤을 자고 오면
    끝지기가 묻는다 — '무엇을 들었나?' 평범한 인간의 정직한 답은 '아무것도'다. 목소리를 들었다고 말하는 자는 거짓말쟁이(탑의 미끼, 회색 순례자)로 거른다 — 지난 100년 길꾼 후보 열둘이 그렇게 걸렀다.
  join_fake: "탑의 잿빛 눈과 회색 순례자가 길꾼으로 들어오려 한다 — 둘 다 '목소리를 들었다'고 말하는 버릇이 있다(탑은 사리풀 즙으로 정말 듣는다고 믿는다). 빈 귀 시험이 그들을 거른다"
  proof_test: "잔향에게: 빈 귀 시험이 거꾸로 선다 — 그는 정말 듣는다. 끝지기는 그 답을 두려워하며 확인한다: 그 끝의 잔향자만 아는 것(첫 불씨의 손짓 — 허공에 가로획, 다라의 마지막 매듭 문구, 군데의 '배고픈 아이')을 말하게 한다. 맞히면 흔적을 그의 손에 쥐여 준다"
  exposure: "흔적을 사고파는 시장(마지막 등불 튀크, 탑의 구매)에 결사의 물건이 나오면 탑이 줍는 자를 거슬러 찾는다. 정화청에게 흔적지기는 '유골 숭배 이단'이다"

