infiltration:
  join_real: "귀가 되려면 장부지기가 고른 젊은 두르강이 하루 종일 박자 방에 앉아 센다. 박자지기가 되려면 장부와 한 박자도 틀리지 않아야 하고, 돌판에 첫 망치 자국을 찍으며 맹세한다: '센다. 말하지 않는다.' 맹세는 거짓으로 할 수 없다 — 두르강의 피가 판정한다"
  join_fake: "두르강은 거짓 맹세를 할 수 없다(피가 굳는다) — 그래서 가짜 박자지기는 없다. 위험은 맹세하지 않은 '귀'에게서 샌다. 니다르의 창백한 예배당이 귀 하나를 끌어들였다는 의심이 있다"
  proof_test: "잔향에게: 장부지기는 묻지 않는다 — 센다. 잔향이 박자 방에 들어서면 고동이 한 박자 빨라진다(장부에 새길 일이다). 시험은 노래 — 그가 페타르의 노래를 부르면 고동이 어떻게 답하는지를 장부와 대조한다"
  exposure: "박자지기는 말하지 않으므로 드러나는 길은 몸이다 — 맹세를 깬 자는 돌이 되어 간다(할그림의 왼팔과 왼얼굴). 왕실 경비가 깊은 문 근처의 버려진 환기 갱에서 두르강의 발자국을 찾으면 박자 방이 드러난다(깊은 문 접근 = 투옥)"

