# 고동 장부 — 뼈가 다시 뛰면 세고, 세되 말하지 않겠다고 맹세한 두르강들. 3,400년의 박자를 돌에 새겨 왔다.
# [신설 결사 — HOUSES에 없음] 세계가 함의하는 것: 두린 깊은망치가 에오르의 뼈를 산 아래 묻었다(HOUSES §3.3, WORLD_BIBLE §1.4), 깊은 문은 AS 289
# '고동이 신의 심장'이라는 원로들의 판단으로 봉인되었다(fact_kz_seal_reason), 고동은 AS 311부터 빨라졌고 인간 목소리에 반응한다(fact_kz_pulse_faster_311·
# fact_kz_pulse_answers_song), 할그림 반돌은 '깊은 문 아래의 것을 말하지 않는다'는 맹세를 깼다(REGIONS §11.9), 맹세지기 우를라는 돌의 숲의 하나가
# 에오르를 묻을 때 맹세를 거부한 자임을 안다(HOUSES §3.3), 드라우르 셀른의 기억 노래는 고동과 같은 박자다(fact_kz_seln_eor_voice).
# 왜 지금(AS 312): 고동이 빨라졌다(최하층 보고 한 달 40건). 잿수염 탐사대가 룬 자물쇠를 하나씩 풀고 있고, 힐다는 개방 기계를 완성했고,
# 니다르의 신도들은 노래할 인간을 납치한다. 장부지기들은 침묵의 맹세를 깨고 왕에게 장부를 보일지 정해야 한다 — 깨면 돌이 된다.
id: fac_beat_ledger
name: 고동 장부 (박자지기들)
kind: secret
race: [산 두르강, (협력) 드라우르 1, (협력) 이름 없는 자(맹세 파기 두르강)]
governance: 맹세 합의 — 아홉 박자지기의 돌판 서약. 결정은 '돌에 새김'으로만 나고, 새기려면 아홉 전원의 망치 자국이 필요하다
motto: "센다. 말하지 않는다."
seat: 카즈둠 깊은 곳 — 고동 갱도(deep_gate__pulse_shaft) 아래로 이어지는 버려진 환기 갱 끝 '박자 방'
size:
  members: "박자지기 아홉(정원 — 지금 일곱이 살아 있고 둘은 공석), 귀(듣는 자 — 장부를 새기지는 못하는 견습) 약 20"
  territory: "고동 갱도, 박자 방, 조상의 망치 신전의 '맥박 치는 기둥'(deephammer__ancestor_shrine), 돌의 숲"
  wealth: "3,400년의 박자 장부 — 돌판 약 1,300장(하루 박자 수와 세기의 변화를 룬으로)"
  force: "없다. 맹세 — 그리고 그 맹세가 그들을 돌로 만들 수 있다는 사실"

reason_now: >
  장부는 말한다 — 고동은 아스테리온의 아홉 해 동안 빨라졌고 대붕괴의 날 멎을 듯 느려졌다. 붉은 손 다라의 석 달 동안 다시 빨라졌고 붉은 길의 날 느려졌다.
  AS 311 다시 빨라졌다. 장부지기들은 그것이 무엇을 뜻하는지 서로 다르게 읽는다(T21). 그리고 지금 깊은 문을 여는 자들(힐다·그로딘)과 깨우려는 자들(니다르)은
  장부를 보지 못한 채 문 앞에 서 있다.

decision: >
  아홉은 1년에 한 번, 재의 날 둘째 날 박자 방에 모여 그해의 돌판을 새긴다. 결정이 필요한 일(장부를 누구에게 보일 것인가, 문을 막을 것인가)은 돌판 한 장에 룬으로 새겨
  아홉이 각자 자기 망치 자국을 찍어야 효력이 난다 — 하나라도 찍지 않으면 그 돌판은 깨서 고동 갱도에 버린다. 두르강은 맹세를 깨면 피가 돌로 굳으므로,
  찍은 자국은 곧 맹세다. 그래서 결정은 3,400년 동안 아홉 번뿐이었다. 공석이 있으면 남은 자들의 자국만으로는 새길 수 없다 — AS 312 현재 둘이 비어 있어 장부는 '결정하지 못하는' 상태다.
succession: "박자지기가 죽거나(혹은 돌이 되거나) 맹세를 깨면 귀 중 하나가 하루 종일 박자 방에 앉아 장부와 한 박자도 틀리지 않게 세면 그 자리를 잇는다. 할그림 반돌이 맹세를 깬 뒤(AS 296) 그의 자리와, AS 289 봉인 날 문 안쪽에 갇힌 박자지기 하나의 자리가 비어 있다."

