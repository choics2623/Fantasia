    - {name: "대조", when: "계절마다", what: "장부지기가 드라우르 셀른의 동굴에 내려가 기억 노래와 박자를 맞춘다"}
  speech: "숫자와 박자로 말한다 — 두르강 룬어의 셈말. 문장이 넷씩 끊긴다. 맹세를 두려워해 '말하지 않겠다'고는 말하지 않는다 — '센다'고만 한다."

