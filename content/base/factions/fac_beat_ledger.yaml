  rule: "박자지기는 서로를 안다(아홉뿐이다). 그러나 바깥에 대해선 각자 한 사람만 안다 — 왕궁·법정·신전·탑에 하나씩 박혀 있다. 한 박자지기가 잡히면 그는 맹세 때문에 말하지 못한다. 대신 돌이 된다 — 굳은 몸이 드러냄이다"
  nodes:
