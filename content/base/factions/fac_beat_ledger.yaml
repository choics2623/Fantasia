# 인간은 박자지기가 될 수 없다 — 두르강의 맹세는 피가 돌로 굳어 지켜진다. 인간에게는 그 피가 없다. 결사는 그래서 인간을 믿지 않는다.
# 다만 '인간 귀' — 고동이 인간 목소리에 답하므로, 장부지기는 처음으로 인간 하나를 박자 방에 들일지 고민한다(페타르, 또는 잔향).

