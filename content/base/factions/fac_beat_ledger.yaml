    - {id: n_urla, who: "unnamed:우를라", knows_up: "n_osval", knows_members: ["돌의 숲의 '거부한 자'"], if_captured: "돌 법정이 결사를 재판할 수 있게 된다 — 법정의 수장이 결사원이다"}
