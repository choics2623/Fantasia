  - {id: rank_tooth, title: "이빨 (5)", duties: "종족별 사업", privileges: "다섯 접시", open_to_player: true}
  - {id: rank_tail, title: "꼬리 (구역장)", duties: "구역", privileges: "구역 수입 1/5", open_to_player: true}
