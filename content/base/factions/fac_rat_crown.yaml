# 쥐들의 왕관 — 법이 닿지 않는 곳의 질서. 잿빛 겨울의 굶주린 뒷골목에서 태어났다. 그리고 실은 세렌 졸라크 상가의 하청이다.
# 근거: HOUSES §5.11·§3.4(졸라크)·§3.11(채찍손 길드), WORLD_BIBLE §2(AS 0~38 잿빛 겨울), REGIONS §1(바알카르), facts/drakmar.yaml.
id: fac_rat_crown
name: 쥐들의 왕관 (도시 뒷골목 조직)
kind: org
race: [크릭, 인간, 추방 수인(바르그·스카브), 나가, 몰락 용인]
governance: 힘의 서열 + 왕관 도전 — 왕관을 쓴 자가 쥐왕. 도전은 '왕관 훔치기'로 한다
motto: "굶은 쥐가 왕이다."
seat: 바알카르 하수도 '왕관 방'. 세렌 '밤 부두' 지부, 오르셀 나루 지부
size:
  members: "약 1,500 — 쥐왕 1, 이빨 5, 꼬리(구역장) 약 40, 쥐 약 1,450"
  territory: "바알카르 하수도 전체, 세렌 밤 부두, 오르셀 나루. 밀수 길은 은빛 강 전체"
  wealth: "밀수, 장물, 도박(잉크손 베아의 도박장), 위조(인간용 통행증 1장 2비늘), 경비병 매수 명단 — 그러나 진짜 장부는 세렌 졸라크 상가가 쥐고 있다"
  force: "칼 든 쥐 수백, 해결사 '쉰목소리' 루, 하수도 지도 — 칼다란 도시 경비가 하수도에 들어오지 않는다"

decision: >
  쥐왕이 정한다. 이빨 다섯(종족별 간부)은 매달 첫 안식일 밤 왕관 방의 '다섯 접시'에서 자기 구역 수입을 접시에 올린다 — 가장 많이 올린 이빨이 그달 쥐왕 다음의 말을 한다.
  쥐왕을 바꾸는 법은 하나 — 왕관(녹슨 쇠 왕관, 크릭 머리에 맞는다)을 훔쳐 사흘 동안 지니고 다섯 접시에 나타나는 것. 피프는 일곱 번째로 왕관을 쓴 자다.
  그러나 큰일(밀수 경로 변경, 큰 장물 처분, 졸라크가 원하는 '심부름')은 피프가 정하지 않는다 — 세렌에서 매듭 편지가 온다. 쥐들 대부분은 그 사실을 모른다.
succession: "왕관 훔치기(위). 쥐왕이 죽으면 왕관은 왕관 방 기둥에 걸리고, 사흘 안에 그것을 벗겨 쓴 자가 왕이다 — 일곱 번 바뀌는 동안 졸라크 장부는 한 번도 바뀌지 않았다."

