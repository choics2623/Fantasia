# 플레이어의 길: 바알카르 하수도 입구에 쥐 그림을 그려 두면 사흘 안에 꼬리가 찾아온다. 첫 임무 '쇠사슬 광장 경매장에서 경매사 오트마르 사르코스의 인장 반지를 가져와라.'
# 왕관 훔치기는 플레이어에게도 열려 있다 — 사흘을 버티면 쥐왕.

law:
  crimes:
    - {act: "쥐가 쥐를 경비병에 팖", punishment: "하수도 물에 사흘 — 대개 죽는다", note: "조직원"}
    - {act: "다섯 접시에 수입을 덜 올림", punishment: "손가락 하나", note: "이빨·꼬리"}
    - {act: "왕관을 훔치고 사흘을 못 버팀", punishment: "왕관 방 기둥에 묶어 둔다 — 다음 쥐왕이 정한다", note: "누구든"}
    - {act: "바깥 법 — 인간의 돈 소지", punishment: "절도 의심 — 수색·매질·몰수", note: "인간 대상(용제국)"}

customs:
  greeting: "새끼손가락을 서로 건다(쥐 꼬리). 암호는 '오늘 비 오나?' — 답 '하수도는 늘 젖어.'"
  taboos: ["왕관 방에서 불을 크게 피우는 것(하수도 가스)", "채찍손 길드 크릭에게 말을 거는 것 — 크릭끼리의 원한", "졸라크라는 이름"]
  rites:
    - {name: "다섯 접시", when: "매달 첫 안식일 밤", what: "이빨 다섯이 수입을 접시에 올린다"}
    - {name: "잿빛 겨울의 빵", when: "굶주림월 첫날", what: "AS 39 무리의 기원 — 훔친 빵을 쥐 모두에게 한 조각씩 나눈다. 쥐왕이 직접 뜯는다"}
  speech: "크릭 은어와 노예말과 하수도 말이 섞인다. 모두 반말 — 왕관 앞에서도. 값을 먼저 말한다."

membership:
  join: "하수도 입구의 쥐 그림 → 꼬리의 방문 → 첫 임무"
  leave: "나갈 수 있다 — 아는 것이 적다면. 이빨은 나갈 수 없다"
  signs: ["하수도 입구의 쥐 그림", "새끼손가락 걸기", "'하수도는 늘 젖어'"]

