# 서리손 — 북방 혈통. 인간 숨은 혈통: 거인 전쟁 방패 노예의 후손, 서리말과 거인의 노래를 모어로 쓴다.
# 근거: HOUSES §4.8, greyford·hrosgard 카드(npc_sigrid, npc_asta, npc_einar), history 카드(npc_gunde), facts/hrosgard.yaml·greyford.yaml.
id: fac_frosthand
name: 서리손 (서리 어머니의 자장가를 아는 집)
kind: house
secret: true
race: [인간(서리 인간 — 평범)]
governance: 가장 + 두 거점의 노래  # 이빨 칼을 쥔 가장과 흐로스가르드에 남은 노예 장로, 둘의 거리가 집안의 모양이다
motto: "거인은 배고픈 짐승이 아니라 배고픈 아이다."
seat: "회색여울 늑대굴(시그리드 무리) / 흐로스가르드 돌무릎 골짜기(아스타) — 두 거점 사이에 서리 길"
size:
  members: "시그리드(33), 토르(50), 아스타(45), 에이나르(시그리드의 동생), 시그리드의 무리 47명(서리손이 아닌 이도 섞임), 남은 노예 약 800명(아스타가 매일 센다)"
  territory: "없음. 늑대굴(회색여울 굶주린 언덕 부근), 돌무릎 골짜기, 서리 길 마지막 산장"
  wealth: "거인 이빨 칼(늙은 거인의 어금니를 갈아 만든 칼날 한 뼘 반 — 가장에게 물려준다), 서리말 노래 「서리 어머니의 자장가」, 늑대굴 벽의 서리말 룬 사망자 명단 37명"
  force: "없음. 그러나 거인도 자장가를 들으면 잠시 손을 멈춘다 — 그리고 요툰 남침을 막는 협상의 유일한 통역이 이 집안이다"

decision: >
  서리손은 둘로 나뉘어 산다 — 남쪽 회색여울의 늑대굴과 북쪽 흐로스가르드의 돌무릎 골짜기. 그 사이 서리 길(울음 고개)이 집안의 혈관이다.
  가장은 거인 이빨 칼을 쥔 자(현재 시그리드)이고, 흐로스가르드의 노예 장로(현재 아스타)는 가장의 눈과 귀다. 큰 일은 서리 길 호송이 오가는 해빙월(탈주 시즌)과 서리월 직전 마지막 호송 두 번에 나뉘어 정해진다.
  가장이 정하면 아스타가 북쪽에서 실행하고, 아스타가 '그건 거인이 허락하지 않는다'고 하면 가장은 접는다 — 아스타의 거부권은 노예 800명의 목숨이 걸린 신호이기 때문이다.
  의사 전달은 노래다. 서리말 자장가의 한 소절이 바뀌면 전언이고, 거인은 노래를 들어도 인간이 아이 달래는 소리로만 안다.
  AS 311 서리왕의 비밀 칙령(노예를 남쪽으로 풀어 줌)을 아스타가 전달하는 지금, 가장과 장로의 결정은 대륙의 북방 대탈주 클락을 직접 움직인다.
succession: >
  가장은 거인 이빨 칼과 함께 물려받는다. 시그리드는 AS 301 스물두 살에 아버지를 잃고 가장이 되었다. 칼과 함께 집안에만 전해지는 서리말 룬 쓰는 법을 물려받았다(재의 법 위반).
  가장이 죽으면 이빨 칼은 장로가 아니라 가장의 아이나 동생에게 간다 — 에이나르(시그리드의 동생, 돌무릎 골짜기에서 생존)가 후계이나 서리 길에서 낙오해 지금 아스타가 숨겨 보호한다.
  장로는 노예 중에서 가장 많이 거인의 노래를 외운 자가 잇는다. 혈통은 잔향을 잇지 않으므로 서리손도 평범한 인간이다 — 집안에 전하는 군데의 말은 한 줄의 노래일 뿐이다.

