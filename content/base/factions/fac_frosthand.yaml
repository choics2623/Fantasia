law:
  crimes:
    - {act: "거인을 '짐승'이라 부름", punishment: "집안에서 노래를 가르치지 않는다 — 거인은 '배고픈 아이'다", note: "집안 규약 — 군데의 말"}
    - {act: "거인 이빨 칼을 가장이 아닌 사람이 지님", punishment: "집안이 칼을 되찾는다. 가장이 후계에게 직접 넘긴 경우만 인정", note: "집안 규약"}
    - {act: "서리 어머니의 자장가를 낯선 이 앞에서 장난으로 부름", punishment: "경고 — 노래는 거인에게 부르는 노래다. 다음에는 가르침이 끊긴다", note: "집안 규약"}
    - {act: "서리말 룬(글자)을 씀", punishment: "재의 법: 글자는 사형(용제국). 집안은 가장에게만 룬 쓰기를 허락한다", note: "인간법 + 집안 규약 — 시그리드의 늑대굴 벽 사망자 명단 37명이 이 죄"}
    - {act: "낙오자를 버리고 그 이름을 노래에 넣지 않음", punishment: "집안이 그를 '굶긴 자'로 부른다", note: "집안 규약 — 시그리드가 서리 길에서 셋을 버렸고 이름을 노래에 넣었다"}
    - {act: "비밀 이름(서리손)을 낯선 이에게 말함", punishment: "성을 참칭한 죄 — 혀를 자를 수 있다. 요툰은 이 법에 무관심하다", note: "인간법 + 집안 규약"}
    - {act: "서리 길이 닫힌 뒤(서리월) 호송을 보냄", punishment: "집안이 막는다 — 서리월 전에 울음 고개를 넘지 못한 자는 겨울을 서리땅에서 나야 한다", note: "집안 규약 — 실용 규칙"}
    - {act: "거인의 이름을 줄여 부름", punishment: "생명을 깎는 모욕 — 얼음 판결 청구 사유. 집안은 노예가 줄이면 매를 대신 맞는다", note: "요툰 법 + 집안 규약"}

customs:
  greeting: "서리말로 '같은 고기를 먹었소?'가 거인의 인사이고, 집안은 '아이는 먹었나?'로 바꿔 묻는다 — 답은 '먹였다.' 서리말 노래의 한 소절을 낮게 주고받는다."
  taboos:
    - "거인을 '짐승', '괴물'이라 부르는 것"
    - "음식을 버리는 것 — 거인 앞에서도 집안 안에서도"
    - "거인의 이름을 줄여 부르는 것"
    - "낙오자의 이름을 노래에 넣지 않는 것"
    - "서리 어머니의 호수에 침 뱉기"
  rites:
    - {name: "서리 길 열림", when: "해빙월", what: "탈주 시즌의 시작. 집안이 서리 길의 상태를 노래로 주고받는다"}
    - {name: "마지막 호송", when: "서리월 직전", what: "아스타가 남은 노예 200명을 서리 길로 보낸다. 서리월에 서리 길이 닫힌다"}
    - {name: "이름 불러 주기", when: "죽은 이가 생겼을 때", what: "늑대굴 벽의 서리말 룬 사망자 명단 37명 — 한 명씩 자장가 한 소절에 끼워 넣는다"}
    - {name: "자장가", when: "밤마다 / 거인이 손을 멈출 때", what: "「서리 어머니의 자장가」. 거인도 이 노래를 들으면 잠시 손을 멈춘다"}
    - {name: "이빨 칼 물려주기", when: "가장의 교체", what: "거인 이빨 칼을 물려받는 이가 서리 어머니의 호수 얼음 한 조각을 칼날에 문지른다"}
  speech: "느리고 낮은 서리말 억양이 공용어에도 묻어난다. 거인 앞에서는 천천히(+5), 길게 이름을 부르며 '작은 이'로 낮춘다. 집안 안에서는 짧고 단단하게 말하고 감정은 노래 소절로 돌린다. 거인에 대해 말할 때는 반드시 '배고픈'이라는 수식어를 붙인다."

