# 나가 세렌 열두 의석 — 물 혈명('흐름')과 교환의 굴레가 만든 상인 과두제.
# 근거: HOUSES §3.4, RACES §10, REGIONS §9 (장소 id: REGIONS §9.9), facts/seren.yaml.
# 조정: HOUSES(열두 의석) · REGIONS(아홉 비늘 의회당, 9상가) · RACES(가문 대표 21명) · facts(21명 중 11표)가 어긋난다.
#       이 파일은 '의석주 12 + 옛 아홉 상가의 비늘 표 9 = 21표, 과반 11'로 묶었다 (보고).
id: fac_seren
name: 세렌 해안 동맹 — 열두 의석
kind: polity
race: [왕관 나가, 심해 나가(외부 은둔), 라미아, 인간 계약민, 크릭(하역), 용인 용병]
governance: 상인 과두제 (의석 지분제) # 의석은 지분이고, 표는 값이 장부에 적히는 한 합법이다
motto: "대가 없이는 아무것도 주지 못한다."
seat: 세렌 — 아홉 비늘 의회당 (seren__nine_scales, 산호석 돔, 기록 수조)
size:
  members: "나가 약 14,000(세렌 도시권; RACES는 종족 전체 88,000), 인간 계약민 약 80,000(RACES는 340,000), 자유민 1,900, 용인 1,200, 크릭 5,000"
  territory: "세렌 항구 도시(섬 구역 14, 운하와 기둥 위 도시), 상업 도시 일곱, 소금 나루, 아르카스 상관, 그롬마르 항 상관"
  wealth: "대륙 최대. 몬달리 은행(양쪽 용제국 채권 각 12만, 합계 24만 두카트), 소금·진주·산호·해운·금융, 계약민 빚 채권"
  force: "물비늘대(나가 300, 용인 용병 200), 타이란·그롬(쇠턱)·인간 계약민 병사 용병, 해상 봉쇄, 곡물 금수"

decision: >
  의회는 표 21개로 움직인다 — 열두 의석의 의석주가 한 표씩, 그리고 옛 아홉 비늘(몬달리·카셀론·루첸티·바드라·오필·테르사·시렌나·마르디·졸라크)의
  의석주는 '비늘 표'를 한 표 더 쥔다. 과반은 11표. 모든 안건은 '계약안'의 형식으로 올라와야 한다 — 누가 무엇을 대가로 무엇을 받는지가 문장으로 적혀 있지 않으면 접수되지 않는다.
  정기 회기는 매달 그믐 이튿날, 포도월 대시장 기간에는 매일 임시 회기가 열린다. 의장은 4년마다 의석주가 투표로 뽑으며 연임 제한이 없다(베아트릭스 3선).
  표는 팔고 살 수 있고, 표의 값은 의회 기록 수조(물속 장부)에 적힌다. 장부에 적힌 매수는 합법이고, 적히지 않은 매수는 계약 사기다. 그래서 표 매수는 은폐가 아니라 '정산'이다.
  거부권은 '대가 미정산 이의'다 — 의석주 누구든 안건에 '대가가 정산되지 않았다'고 이의하면 정산이 끝날 때까지 안건은 정지한다. 이의를 풀려면 이의한 자가 받을 값을 맞추면 된다.
  나가는 상대가 값을 지불하는 한 약속을 어기지 못하므로, 결정은 늦으나 한번 서면 지켜진다. 계약 분쟁은 계약 판관 12명이 판결한다.
succession: >
  의석은 상가에 세습되며 사고팔 수 있다(최근 거래 AS 266, 9만 두카트). 의석주가 죽거나 파산해 공석이 되면 의석 경매가 열리고, 최고가 입찰자가 앉는다.
  인간이 자금줄을 대고 대리인을 앉히면 '세렌 내부의 인간 의석'이 생긴다(씨앗). 의장은 4년 임기마다 새로 선출한다. 베아트릭스는 6회 탈피 후 일곱째 탈피가 3년째 늦어지고 있고, 탈피에 실패하면 허물 속에서 죽는다 — 의장 자리가 비는 날의 대비는 아직 없다.

