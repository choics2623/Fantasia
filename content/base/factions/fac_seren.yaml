law:
  crimes:
    - {act: "계약 노동 불이행", punishment: "빚 +10%", note: "인간(계약민) 대상. 집행 상가"}
    - {act: "숫자 외 글자를 씀", punishment: "벌금 5 두카트 + 탑 인계 검토", note: "인간 대상. 집행 물비늘대"}
    - {act: "한 뼘 넘는 칼날 소지", punishment: "압수 + 벌금 2 두카트", note: "인간 대상. 테르사 상가가 경비 계약민에게 몰래 지급하는 것은 같은 위반"}
    - {act: "마법", punishment: "벌금 후 잿빛 탑 인계", note: "인간 대상"}
    - {act: "계약민 도주", punishment: "빚 2배 + 바르그 지부에 현상금", note: "인간 대상"}
    - {act: "계약 사기(상가 측)", punishment: "판관 청원 시 빚 감면 — 승소율 4%", note: "나가 대상, 계약민이 청원 가능(대륙 유일)"}
    - {act: "장부를 찢거나 빚을 없던 것으로 만듦", punishment: "살인보다 무거운 죄 — 의석 박탈, 가문 장부 압류", note: "나가 대상 — 신성모독"}
    - {act: "녹테른을 들임 / 녹테른과의 거래", punishment: "의회 제명과 거래 동결", note: "나가 대상 — 피의 빚. 나가는 녹테른을 계약 없이 죽일 권리를 주장한다"}
    - {act: "붉은 해구에 인간을 들임", punishment: "의석 정지, 심해 나가에게 대가 지불 의무", note: "나가 대상"}
    - {act: "계약서 없는 약속 / 공짜로 주고받음", punishment: "약속은 무효. 공짜를 받으면 나가는 갚을 때까지 의지 판정 −5", note: "양쪽 모두"}
    - {act: "눈을 가린 상대에게 매혹을 건 서명", punishment: "판관 무효 소송 대상 — 첫 인간 소송 사례 없음", note: "나가 대상. '비겁'으로 친다"}
    - {act: "표 매수를 장부에 적지 않음", punishment: "계약 사기 — 의석 정지", note: "나가 대상. 적으면 합법이다"}

customs:
  greeting: "처음 만나면 작은 것(조개, 동전)을 서로 건넨다. 받기만 하고 주지 않으면 모욕이다. 이어 '정산은?' — 상대가 무엇을 가져왔고 무엇을 원하는지 먼저 묻는다."
  taboos:
    - "'공짜'라는 말 — 세렌에서는 모욕이다. 대신 '미정산'이라 한다"
    - "장부를 찢거나 빚 탕감을 요구하는 것"
    - "녹테른을 들이는 것, 붉은 해구에 인간을 들이는 것"
    - "계약서 없는 약속, 눈을 가린 상대에게 매혹을 거는 것"
    - "그믐 밤 바다에 침 뱉기, 계약서를 찢기(신성모독)"
  rites:
    - {name: "그믐 대가 던지기", when: "매달 그믐", what: "신전 앞바다에 값비싼 물건을 '대가'로 던진다. 다음 날이 정기 회기"}
    - {name: "포도월 대시장", when: "포도월", what: "한 달간 운하가 배로 메워진다. 계약민 빚 채권 거래와 노예 경매. 임시 회기 매일"}
    - {name: "허물 장례", when: "탈피 후·죽음", what: "탈피한 허물을 바다에 띄운다. 죽은 나가의 마지막 허물은 가문 신전에 보관"}
    - {name: "의석 경매", when: "의석 공석 시", what: "의석주 사망·파산 시 열린다. 최고가 입찰자가 앉는다 — 인간 자금줄의 대리인도 앉을 수 있다"}
    - {name: "교환의 첫인사", when: "초면", what: "조개나 동전을 주고받는다. 받은 쪽이 갚으면 '정산 완료'"}
  speech: "숫자와 대가로 말한다. 문장 끝에 값을 붙이는 버릇('그건 한 닢어치 이야기요'). 존대는 장부의 크기로 정한다 — 큰 장부 앞에서는 정중하게, 작은 장부에는 낮추되 모욕은 아니다(숫자를 다루는 인간에게는 이상하게 공정하다). 눈을 맞추며 말하는 것이 예의이자 무기이다. '미안하다'는 말 대신 '값을 치르겠다'."

membership:
  join: "나가는 상가에 태어난다. 의석은 매입(9만 두카트 선례). 인간은 빚으로 들어와 계약민이 된다 — 계약서에 서명하는 순간 몸값이 빚이다. 계약민법(AS 296)에 따라 등록."
  leave: "나가는 장부가 정산되기 전에는 나갈 수 없다. 계약민은 빚을 다 갚으면 자유민(공식 상환율 6%, 실제 1.8%). 도주는 빚 2배와 현상금."
  signs: ["상가 문장 — 금빛 저울 위의 뱀(몬달리), 닻 셋(카셀론), 진주를 문 뱀(루첸티), 소금 결정(바드라), 펼친 두루마리와 뱀(오필), 교차한 단검(테르사), 소용돌이(시렌나), 향신료 잎 셋(마르디), 눈 하나 달린 열쇠(졸라크), 그물에 걸린 물고기(페스카르), 붉은 꽃(아마란트), 갈라진 뱀 혀(노르발)", "계약민의 노임 패(빚 차감 기록 동판)", "계약민 '셈 모임' — 숫자 암호(약 1,100명)"]

