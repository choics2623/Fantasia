# 셋째가 아는 대로의 마을 사람 (플레이어 화면에 이름 옆에 붙는 한 구절). 카드의 job은 설계자용이라 쓰지 않는다.
# 앞에 '?'가 붙은 사람은 셋째가 이름을 모른다 — 화면과 서술에 이름 대신 이 구절이 나온다 (말을 섞거나 이름을 들으면 안다).
# 셋째는 회색여울에서 나고 자랐다 — 마을 사람은 이름으로 안다. 바깥사람(이졸·볼크·요한·카스파르…)은 처음엔 겉모습으로만.
