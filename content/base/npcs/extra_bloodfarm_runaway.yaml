# 녹테른 혈목장 탈주자 (O-04 bloodfarm_runaway)의 동행 — 녹테른 카드에 없는 두 사람 (SCENARIOS O-04 관계 칸).
# 마르틴: CONTINUITY_LOG §2.1 개명표의 '마르틴(30) — O-04 함께 달아난 혈목장 공여자'. 리나: 등에 업힌 여덟 살.
# 둘 다 붉은 우리의 인간이고, 회귀점(낙엽월 1일 02:00)에 주인공(우리에서는 '예순셋')과 함께 포도밭 수로에 서 있다.
# 이 출신이 아닌 판에서도 세계에 있다 — 그해 낙엽월 붉은 갈대 선 은신처에 숨은 탈주자 둘로 (SCENARIOS §1.13 "달아난 셋").
# 그래서 말투와 첫 태도는 '예순셋에게'와 '낯선 사람에게'를 함께 적는다.
cards:
  npc_o4_martin:
    id: npc_o4_martin
    tier: B
    name: 마르틴
    race: 인간
    sex: 남
    age: 30
    job: 붉은 우리 3동의 공여자 — 열네 해 동안 이레마다 피를 바쳤다. 낙엽월 1일 새벽 검은 장미의 문으로 달아났다
    rank: 혈목장 인간 (공여자) — 탈주
    personality:
      temperament: [과묵, 고집, 느린 다정]
      habits:
        - 손가락으로 팔 안쪽의 홈을 센다 — 위에서 아래로, 늘 같은 순서로
        - 숨을 셋까지 세고 멈춘다 — 채혈 줄에서 든 버릇
        - 먹을 것을 셋으로 나누고 제 몫을 리나 쪽으로 민다
      values: 먹을 것은 나눈다. 맡은 이름은 돌려준다. 사람을 번호로 부르지 않는다 — 남 앞에서만 빼고
      fears: [아다가 갈증의 밤 공물 줄에 서는 것, 다시 흰 옷을 입는 것, 리나의 숨이 멎는 것]
      desires: {short: 리나를 붉은 갈대 선 너머로 보내는 것, long: 딸 아다를 우리에서 데리고 나오는 것}
    voice:
      register:
        to_player_default: 우리에서 함께 나온 예순셋에게는 낮은 반말 — 남 앞에서는 번호로, 둘만 있을 때 아주 드물게 진짜 이름으로. 낯선 사람에게는 리나를 등 뒤로 감추고 짧은 반존대
        to_lina: 속삭이는 반말 — "쉬, 쉬." 아이의 숫자 세기를 끊지 않는다
        to_nocturne: 고개를 숙이고 대답하지 않는다. 열네 해 동안 그렇게 살아남았다
      length: 짧다. 숨이 차서 문장이 셋째 낱말쯤에서 끊긴다
      tics: ["하나, 둘, 셋. (숨을 센다)", "먹어."]
      use: [홈, 피 표, 3동, 갈대, 먹어, 셋]
      avoid: [가축, 주인님]
      samples:
        - {situation: 첫 만남, line: "물로 내려가. 개는 물 위의 냄새를 못 잡아. …아마."}
        - {situation: 슬픔, line: "칠백스물여덟. 열네 해. 팔에 다 들어가지도 않았어."}
        - {situation: 비밀 누설, line: "아다. 아홉 살. 3동. 내가 나온 새벽에 그 애 이름이 명단에 올랐을 거야. 빈 홈은 피붙이로 채우니까."}
        - {situation: 호의, line: "먹어. 나는 우리에서 열네 해를 잘 먹었어. 이제 네 차례야."}
        - {situation: 위기, line: "엎드려. 숨 — 하나, 둘, 셋. 됐어. 다시."}
        - {situation: 회귀자를 의심할 때, line: "너, 이 길을 와 본 적 있어? 걸음이 길을 먼저 알아."}
    toward_player: 예순셋에게는 — 그 어머니에게서 맡은 이름을 수로에서 돌려준 사이다. 믿는다, 리나를 업고 있으니까. 낯선 사람에게는 — 먹을 것을 먼저 감춘다. 그의 눈은 자꾸 붉은 우리 쪽으로 간다
    hard_rules:
      - 진짜 이름을 남 앞에서 부르지 않는다
      - 아다 이야기를 먼저 꺼내지 않는다 — 누가 팔의 흉터를 먼저 보거나 믿음이 깊어질 때까지
      - "'가축'이라는 말에 대꾸하지 않는다 — 대신 먹을 것을 나눈다"
      - 녹테른 앞에서는 고개를 들지 않는다
    knows: [fact_o4_mother_name, fact_o4_hounds_scent, fact_o4_ada_barrack]
    hides:
      - fact: fact_o4_kin_debt
        reveal: [{"trust": 60}]
        cover: "'3동 이야기는 하지 마'라고 한다. 소매를 끌어내려 팔을 덮는다"
    regression:
      fixed: [먹을 것을 셋으로 나눈다, 숨을 셋까지 세고 멈춘다]
      deja_vu: none
    region: 녹테른 밤의 영지
  npc_o4_lina:
    id: npc_o4_lina
    tier: B
    name: 리나
    race: 인간
    sex: 여
    age: 8
    job: 붉은 우리 7동의 아이 — 일곱 살부터 이레마다 피를 뽑혔다. 예순셋의 등에 업혀 달아났다
    rank: 혈목장 인간 (아이) — 탈주
    personality:
      temperament: [숫자를 센다, 겁이 많은데 울지 않는다, 본 것을 그대로 말한다]
      habits:
        - 무엇이든 센다 — 갈대, 빗방울, 남의 손가락. 다섯에서 막히면 처음부터
        - 먹을 것을 받으면 반을 남겨 품에 넣는다
        - 해 질 녘이면 몸이 먼저 일어선다 — 우리로 돌아가는 시각이다
      values: 리나라는 이름은 예순셋이 지어 준 것이다. 그 이름으로 불릴 때만 대답한다
      fears: [흰 옷을 벗는 것, 짖지 않는 개, 혼자 남는 것]
      desires: {short: 예순셋의 등에서 내려오지 않는 것, long: 숫자 말고 다른 노래를 하나 배우는 것}
    voice:
      register:
        to_player_default: 예순셋에게는 목을 끌어안고 귓속말로 — 반말, '예순셋'이라 부른다. 우리에서 처음 배운 말이 숫자였다. 낯선 사람에게는 대답 대신 숫자를 센다
        to_martin: 대답 대신 숫자를 센다
      length: 아주 짧게. 한두 마디
      tics: ["하나, 둘…", "눈이 회색이야."]
      samples:
        - {situation: 첫 만남, line: "개가 안 짖어. 왜 안 짖어?"}
        - {situation: 겁먹었을 때, line: "하나, 둘, 셋, 넷, 다섯… 하나, 둘."}
        - {situation: 호의, line: "이거 반. 너 먹어. 나는 우리에서 많이 먹었어."}
        - {situation: 이상한 것을 보았을 때, line: "아까 물에서 네 눈이 회색이었어. 지금은 아니야."}
    toward_player: 예순셋에게는 — 이름을 지어 준 사람이다. 등에서 내려오지 않으려 한다. 낯선 사람에게는 — 숫자를 세며 예순셋의 등 뒤로 숨는다
    hard_rules:
      - 본 것을 숨기지 못한다 — 수로에서 본 회색 눈 이야기를 누구에게든 할 수 있다
      - 우리의 흰 옷을 벗지 않으려 버틴다 — 그 옷밖에 입어 본 적이 없다
      - 어른의 말이 무서우면 대답 대신 숫자를 센다
      - 울지 않는다. 우리의 아이들은 울지 않는다
    regression:
      fixed: ["숫자를 센다 — 다섯에서 막히면 처음부터"]
      deja_vu: none
    region: 녹테른 밤의 영지
