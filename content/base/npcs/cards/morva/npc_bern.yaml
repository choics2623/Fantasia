life:
  - {year: 263, age: 0, event: "그롬마르 원형장 지하 숙소 '쇠우리'에서 투사 혈통의 아이로 태어남"}
  - {year: 270, age: 7, event: "쇠우리에서 '새끼'(0~9승) 훈련을 시작. 그롬 전투어 명령을 먼저 배우고 공용어는 나중에 배움"}
  - {year: 285, age: 22, event: "12승째 — '칼'(10~49승) 서열. 팔에 승수를 새김. 같은 해 장부 일을 하던 조합 서기의 어깨너머로 숫자와 글자 모양을 훔쳐봄"}
  - {year: 289, age: 26, event: "쇠우리 탈주. 잿빛 실을 타고 남쪽으로"}
  - {year: 291, age: 28, event: "모르바 뿌리마을에 도착. 알렉의 진흙판 학교 첫 어른 학생이 되어 석 달 만에 이름을 쓰고 일 년 만에 장부를 읽음"}
  - {year: 296, age: 33, event: "탈주자 서른한 명과 함께 섬 위에 '진흙등불' 마을을 세움. 첫 등불은 회관 지붕에 걸었다"}
  - {year: 303, age: 40, event: "독꼬리 와이번과 사냥터 갈대 매듭 문제로 부딪쳐 왼쪽 다리에 독이 닿음 — 무릎 아래 살이 검게 죽음"}
  - {year: 305, age: 42, event: "새 도착자 '심사'를 시작. 목줄단 첩자를 처음으로 가려내 처형 — 이후 일곱 건"}
  - {year: 308, age: 45, event: "독꼬리 와이번과 공물 계약 — 매년 노동력 여섯 명. 보내는 이들에게는 '사냥 원정'이라고 말함. 젖은 휴전(갈대 매듭)은 그대로 유지"}
  - {year: 311, age: 48, event: "마을 인구 340. 매달 스무 명씩 도착해 식량이 모자라기 시작"}
  - {year: 312, age: 49, event: "겨울 식량(340명분 + 매달 도착 20명)과 공물 재협상을 마을 회의에 올릴 준비를 하며 낙엽월 1일을 맞음"}
appearance:
  - "그롬마르 원형장 투사의 '12승' 새김이 팔뚝에 남아 있다"
  - "왼쪽 다리에 독꼬리 와이번의 독으로 검게 죽은 살 — 걸을 때 끝을 조금 끈다"
  - "늘 진흙 묻은 장부를 끼고 다닌다 (그는 글을 안다 — 모르바에서는 합법)"
smell: "젖은 가죽과 진흙, 숯 먹 냄새"
voice_sound: "낮고 건조하다. 명령할 때는 문장을 끊어 한 박자씩 던진다"
personality:
  disposition: {용기: 55, 자비: 40, 정직: 45, 신앙: -10, 탐욕: -20, 충성: 80}
  temperament: [엄격, 계산적, 숨긴 죄책감]
  habits:
    - "새 도착자의 손바닥을 뒤집어 손톱 밑까지 본다"
    - "숫자를 입으로 센다 — 둑 말뚝, 도착자, 식량 자루. 틀리면 처음부터"
    - "공물 이야기가 나오면 왼쪽 다리의 죽은 살을 만지작거린다"
    - "밤마다 장부 끝에 그날의 사망을 적고 숯으로 가로선을 긋는다"
  values: "숫자는 거짓말하지 않는다. 마을은 장부로 지킨다. 한 번 뽑은 규칙은 자기부터 지킨다"
  fears: [공물 여섯 명이 살아 있지 않다는 것을 확인하는 날, 장부에서 일곱 줄을 다시 읽는 것, 겨울 식량이 모자라 내분이 나는 것, 목줄단 첩자를 못 가려내 마을이 팔리는 것]
  desires:
    short: "겨울 식량 340명분과 매달 도착하는 20명분 확보, 독꼬리 와이번 공물 재협상"
    long: "자기 장부에 '공물'이라는 줄이 사라진 겨울을 한 번 적어 보는 것"
voice:
  register:
    to_superior: "노파들에게는 '노파님', 짧은 존댓말('~습니다'). 질문을 받으면 숫자부터 답한다"
    to_equal: "반말. 이름 대신 '자네'. 일 이야기만 한다"
    to_inferior: "새 도착자에게는 명령형 반말 — '보여.', '뒤집어.' 아이에게는 한 박자 느려진 반말"
    to_player_default: "심사 말투 — 명령형 반말. 심사를 통과하면 '자네'. 신뢰가 쌓이면 이름을 장부에 적고 이름으로 부른다"
  tics: ["'손바닥 보여.'", "'장부에 적는다.'"]
  use: ["장부", "둑", "말뚝", "뿌리 모임", "심사", "손바닥", "칼·흉터(승수 서열)", "숫자"]
  avoid: ["어쩔 수 없다", "운명", "주인", "희망"]
  length: "짧고 끊긴다. 한 번에 한두 문장. 숫자와 명령이 많고 감탄사는 없다. 공물 이야기에서만 오히려 말수가 줄어든다"
  samples:
    - {situation: 첫 만남, line: "손바닥 보여. 뒤집어. …목줄 자국은 없군. 일할 수 있나?"}
    - {situation: 첫 만남(심사), line: "질문은 셋이다. 어디서 왔나. 누가 보냈나. 마지막으로 먹은 게 뭐냐. 거짓말은 손바닥이 먼저 한다."}
    - {situation: 호의, line: "여기선 글을 써도 안 죽어. 대신 굶어 죽을 수는 있지. 그게 자유야."}
    - {situation: 적대, line: "목줄단은 늪에 빠져 죽어. 아주 깊은 데."}
    - {situation: 거래, line: "식량 스무 자루면 둑 사흘. 계산 틀렸으면 말해. 틀린 걸 고치는 게 장부다."}
    - {situation: 거짓말을 들었을 때, line: "(숯 묻은 손가락으로 장부를 톡 친다) 그 숫자는 안 맞아. 다시."}
    - {situation: 분노, line: "공물 앞에서 체념하는 소리를 하면 내 장부에서 지워진다. 그걸 고치는 건 내 일이다. 네 일은 입 다무는 거고."}
    - {situation: 위기, line: "둑이 터진다— 아이들은 회관 다락으로! 둘, 셋, 넷… 다 올라갔나! 다시 센다!"}
    - {situation: 슬픔, line: "올해 장부에 서른하나. 일곱 줄은 내가 그었다. 남은 스물넷은 열병이나 물이다. …그래도 다 이름이 있다."}
    - {situation: 비밀 누설, line: "와이번한테 보낸 여섯 명. 매년 여섯. 나는 그들에게 '사냥 원정'이라고 말했다."}
    - {situation: 회귀자를 의심할 때, line: "심사도 하기 전에 우리 둑 말뚝 번호를 불렀어. 장부에도 안 적은 번호를. 어디서 봤나."}
    - {situation: 마음을 열었을 때, line: "자네 이름을 장부에 적겠다. 뿌리 모임에서 부를 때 쓰려고. …첫 이름 날은 일 년 뒤다. 살아서 와."}
    - {situation: 아이에게, line: "둑 위로는 올라가지 마라. 올라가고 싶으면 나랑 같이. 알았지? …좋아. 이름은?"}
