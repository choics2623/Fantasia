  - fact: fact_mv_oda_saska_blood_deal
    reveal_when: "신뢰 55 이상, 또는 플레이어가 공물 인간 26명의 진실을 먼저 꺼낸 뒤"
    cover: "'피는 거래로 얻는다. 누구에게서인지는 묻지 마라'라고 한다"
  - fact: fact_nc_cecile_ash_lineage_blood
