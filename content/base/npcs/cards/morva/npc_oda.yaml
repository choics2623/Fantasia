relations:
  - {to: npc_elsa, type: 스승 대에 떠난 자매, like: 30, trust: 40, visibility: 비밀, memo: 다툼 이후 42년, words: "만난 적 없는 선배. 스승의 말로만 아는 사람인데, 이제는 그 사람이 옳았을지 모른다고 생각한다. 보고 싶고, 겁이 난다"}
  - {to: npc_bern, type: 촌장, like: 50, trust: 60, visibility: 공개, memo: null, words: "자유촌의 둑을 지키는 사람. 장부에 적히는 사망이 몇 건인지 그녀는 안다. 말하지 않을 뿐"}
  - {to: npc_saska, type: 피의 거래 상대, like: -10, trust: 20, visibility: 비밀, memo: null, words: "알을 지켜 주면 피를 내주는 짐승. 언젠가 값을 매기러 올 것을 안다. 그날을 늦추는 중이다"}
  - {to: npc_hag_rune, type: 막내 제자, like: 80, trust: 60, visibility: 공개, memo: null, words: "손바닥에 낱말을 쓸어 써 주는 아이. 이 아이만은 영원히 시전하지 않기를 바란다. 그 마음이 회합의 방침과 어긋나는 것을 안다"}
  - {to: npc_cecile, type: 남쪽 송출자, like: 10, trust: 40, visibility: 비밀, memo: null, words: "붉은 갈대 너머에서 사람을 보내는 이. 만난 적은 없다. 장미 꽃잎이 놓이는 달에만 가까워진다"}
  - {to: npc_nadia, type: 자유촌 사냥꾼, like: 40, trust: 50, visibility: 공개, memo: null, words: "와이번 둥지 쪽을 가장 오래 지켜보는 사람. 그 활이 무엇을 주웠는지 오다는 짐작한다"}
  - {to: npc_hag_brita, type: 둘째·후계, like: 25, trust: 35, visibility: 공개, memo: 강경파, words: "자기가 죽으면 이 자리에 앉을 사람. 그릇을 늪에 가둬 두려는 마음을 안다. 틀렸다고만은 못 하겠다"}
toward_player: "손으로 얼굴을 더듬고 말소리를 듣고 판단한다. 차갑지는 않으나 문을 열지 않는다. 병자를 돌보는 손에는 약하다"
persuade:
  likes: ["엘사의 소식(+25)", "진명 낱말을 '말할 수 있음'을 보이기(+50 — 그녀는 300년의 기다림이 끝났음을 안다)", "병자를 돌보는 일", "낱말을 아끼는 태도"]
