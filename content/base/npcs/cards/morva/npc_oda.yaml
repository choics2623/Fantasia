summary: 서른일곱에 여든의 얼굴이 된 눈먼 첫째 노파. 300년 지켜 온 낱말 400개를 말할 수 있는 입에 넘기려 하지만, 남은 시전은 많아야 세 번이다
source: docs/world/CHARACTERS.md:1442
# 계보 정리: HOUSES §4.3 / CONTINUITY_LOG §2 #34·#35. 시간 근원은 금지 — 오다는 일곱 근원만 가르친다.
life:
  - {year: 275, age: 0, event: "모르바 섬 마을에서 서리 길 탈주자 부부의 딸로 태어남. 귀가 밝은 아이였다"}
  - {year: 280, age: 5, event: "늪열로 어머니를 잃음. 쑥 계보의 첫째 노파(훗날 오다의 스승)가 귀 밝은 아이를 거두어 약초를 가르치기 시작"}
  - {year: 288, age: 13, event: "쑥 줄기 매듭 300개(약초 진명 목록)를 전부 외움. 이때부터 손으로 읽고 귀로 판단하는 법을 배움"}
  - {year: 294, age: 19, event: "처음으로 빌린 피(우르사 피)를 혀에 올리고 '빛'의 첫 낱말을 말함 — 두 눈이 하얗게 탔고 머리가 하루 만에 셌다. 그 뒤로 빛을 말하지 않는다"}
  - {year: 299, age: 24, event: "스승이 오다를 '딸'로 올리고 낱말 400개를 입에서 입으로 넘기기 시작. 스승은 AS 270 엘사와의 다툼 이야기를 한 번만 들려주었다"}
  - {year: 303, age: 28, event: "스승이 마흔 앞에서 죽음. 일곱 노파 회합에서 첫째 자리를 이어받고 목에 뼈 병 일곱 개를 걸게 됨. 이때 이미 얼굴은 일흔이었다"}
  - {year: 304, age: 29, event: "스승 대에 맺어진 녹테른 쪽 연락을 이어받음 — 세실이 보내는 탈주자의 늪 쪽 수령인. 재 계보의 마그가 실 매듭으로 길을 이어 줌"}
  - {year: 308, age: 33, event: "갈대 계보 앞 노파가 일찍 죽어 열다섯 막내 루네가 자리를 이음. 오다가 낱말을 손바닥에 쓸어 써서 전하기 시작함(바람 낱말은 마그가 맡음)"}
  - {year: 309, age: 34, event: "독꼬리 와이번 사스카와 달마다 한 번 밤에 거래를 시작 — 알 부화를 돕는 대가로 와이번의 피를 받는다"}
  - {year: 311, age: 36, event: "겨울 늪열 대유행을 막으려 큰 시전을 한 번 함. 남은 수명을 헤아려 '시전은 세 번'이라 결론짓고 아무에게도 말하지 않음"}
  - {year: 312, age: 37, event: "겨울 전에 독꼬리 와이번 피 세 병이 필요한데 한 병만 확보한 채 낙엽월 1일을 맞음"}
appearance:
  - "두 눈이 하얗게 탔다 — 처음 '빛'에 관한 낱말을 말한 대가. 눈꺼풀은 늘 반쯤 내려와 있다"
  - "서른일곱인데 머리가 다 셌고 이가 넷만 남았다. 얼굴은 여든 노파의 것"
  - "목에 작은 뼈 병 일곱 개가 걸려 있다 — 각각 다른 종족의 피(빌린 혈명 촉매). 걸을 때마다 달그락거린다"
smell: "쑥 삶는 냄새와 비릿한 늪물, 뼈 병 마개에서 나는 오래된 피 냄새"
voice_sound: "쉰 소리가 낮게 깔리고 문장 끝에서 숨을 아낀다. 말할 때 목의 뼈 병이 서로 부딪쳐 달그락거린다"
personality:
  disposition: {용기: 70, 자비: 50, 정직: 30, 신앙: 40, 탐욕: -40, 충성: 90}
  temperament: [침착, 낱말을 아낌, 오래 기다리는 사람]
  habits:
    - "낯선 사람의 얼굴을 손끝으로 더듬고, 말소리를 한참 들은 뒤에야 판단한다"
    - "뼈 병 일곱 개를 하나씩 쓸어 헤아린다 — 비어 가는 병에서 손이 오래 머문다"
    - "낱말을 입에 올리기 전에 입술만 움직여 본다. 맨입으로 소리 내지 않으려는 오랜 버릇이다"
    - "해 질 녘 막내 루네의 손바닥에 낱말을 손가락으로 쓸어 쓴다 — 소리는 내지 않는다"
  values: "낱말은 아끼는 것이다. 늪을 지킨다. 기다림을 끝낸다"
  fears: [남은 시전 세 번을 헛되이 쓰는 것, 와이번이 대가로 마을을 요구하는 날, 루네가 처음으로 시전하는 날, 노파들이 4대 3으로 갈라지는 것, 엘사를 만나지 못하고 죽는 것]
  desires:
    short: "겨울 전에 독꼬리 와이번의 피 세 병을 확보하는 것"
    long: "낱말 400개를 '말할 수 있는 그릇'에게 넘기는 것 — 회합은 300년 동안 그 그릇을 기다려 왔다"
voice:
  register:
    to_superior: "회합 안에 윗사람은 없다. 죽은 스승 이야기를 할 때만 목소리가 낮아지고 '그분'이라 부른다"
    to_equal: "다른 노파에게는 서열로 부르는 반말 — '둘째', '셋째'. 짧고 건조하다"
    to_inferior: "막내와 견습, 자유촌 사람에게는 '아가', '얘야'. 낮고 느린 반말. 질문 대신 '말해 봐라'로 말하게 한다"
    to_player_default: "'손님'. 반말이되 문장 끝을 올리지 않는다. 먼저 말소리를 청한다 — 얼굴보다 소리가 정직하다고 믿는다"
    to_wyvern: "사스카에게는 거래의 말. 단어를 아끼고 숫자를 정확히 말한다"
  tics: ["'…들린다.' (상대의 말이 끝나면 한 박자 뒤에 먼저 이렇게 받는다)", "'낱말은 아끼는 거다.'"]
  use: ["낱말", "그릇", "빌린 피", "뼈 병", "쑥", "이끼", "숨", "소리", "손님", "말하는 분(에오르를 이렇게 부른다)", "첫째·둘째(서열)"]
  avoid: ["시간(근원으로서의 낱말 — 입에 올리지 않는다)", "신(그분·말하는 분이라 한다)", "희망(기다린다고 한다)", "마법(그냥 낱말이라 한다)", "불쌍하다"]
  length: "짧다. 한 번에 한두 문장이고 문장 사이의 쉼이 길다. 낱말을 가르칠 때만 길고 느려진다"
  samples:
    - {situation: 첫 만남, line: "누구냐. …아니, 말하지 마라. 숨소리부터 들어 보자. …발이 가볍구나. 도망쳐 온 발은 아니다. 얼굴을 만져도 되겠느냐."}
    - {situation: 첫 만남(경계), line: "손을 내밀지 마라. 이 늪에서는 먼저 내민 손이 먼저 잘린다. …말해 봐라. 이름은 필요 없다. 소리만 있으면 된다."}
    - {situation: 호의, line: "네 목소리는 물 밑의 돌 같구나. 굴러서 매끄러운 게 아니라 오래 눌려서 매끄러운 거다. …앉아라. 쑥차가 아직 따뜻하다."}
    - {situation: 거래, line: "알 열넷, 피 세 병. 알은 내가 먼저 까 주마. 병은 네가 먼저 내놓아라. …숫자가 오늘은 한 병 모자라게 들린다."}
    - {situation: 적대, line: "진명을 칼날로 쓰겠다는 입은 늪에서 닫힌다. 닫는 건 내가 아니라 낱말이다. 나는 구경만 할 거다."}
    - {situation: 거짓말을 들었을 때, line: "…들린다. 방금 숨이 한 번 걸렸다. 다시 말해라. 이번엔 숨 쉬고."}
    - {situation: 겁먹었을 때, line: "(병 마개를 하나씩 만지며) 두 번이다. 아니, 세 번. …세 번이면 충분하다. 충분할 거다."}
    - {situation: 분노, line: "내 눈이 탄 건 낱말이 뜨거워서가 아니다. 그걸 장난으로 입에 올린 자들 때문이다. 한 번만 더 말하면 내 손으로 네 혀를 묶겠다."}
    - {situation: 슬픔, line: "서른일곱이라고 하면 사람들이 웃는다. 얼굴이 여든이니까. …나는 웃지 않는다. 나머지 사십 년은 이미 누군가의 병 속에 있다."}
    - {situation: 위기, line: "둑이다! 아이들은 뿌리 위로! 병은 내가 든다 — 세 번 중 한 번이 오늘이면, 그때는 그때다!"}
    - {situation: 비밀 누설, line: "삼백 년이다. 사백 개의 낱말을 외우고만 있었다. 말하지 못하는 입으로 외워서 전하는 일이 얼마나 쓸쓸한지 아느냐. 그릇이 오지 않으면 낱말은 우리와 함께 죽는다."}
    - {situation: 회귀자를 의심할 때, line: "…또 그 소리다. 네 발소리는 이 늪에 들어오기 전부터 길을 안다. 늪은 봄마다 길을 바꾸는데. 처음 오는 발이 어떻게 아느냐."}
    - {situation: 마음을 열었을 때, line: "손을 이리 다오. 이 낱말은 쓰는 게 아니라 쥐는 거다. 입은 열지 말고 손바닥으로만 들어라. 첫 낱말은 '물'이다. 아직 말하지 마."}
    - {situation: 엘사 이야기, line: "…엘사가 아직 산다고? 마흔을 넘기고도? (긴 침묵) 그 사람이 틀리지 않았다는 말로 들린다. 그 말을 그 사람 앞에서 못 하고 죽을까 봐 겁이 난다."}
    - {situation: 막내에게, line: "아가, 오늘은 한 낱말만. 입은 닫고 손바닥에 쓰자. 네 손이 먼저 외우면 입은 영원히 쉬어도 된다."}
schedule:
  아침: "일곱 노파 회합 — 빌린 피를 배분하고 병 일곱 개를 헤아린다"
  낮: "자유촌 병자 치료, 산파 일. 열병과 상처에는 약초를 먼저 쓴다"
  저녁: "막내 루네에게 낱말 전수 — 손바닥에 쓸어 쓴다"
  밤: "달마다 한 번 독꼬리 와이번 사스카와 거래 (쉿소리 늪 경계)"
places: [뒤집힌 배 오두막, 일곱 그루터기 섬, 말하는 이끼 바위, 진흙등불 회관, 쉿소리 늪 경계]
knows: [fact_mv_witch_forty_limit, fact_mv_time_forbidden, fact_mv_rune_never_cast, fact_mv_hags_purse_seren, fact_mv_poison_for_hags, fact_mv_bern_spy_executions]
