    long: "용제국의 '늪 도마뱀' 멸시에 복수하는 것"
voice:
  register:
    to_superior: "진룡이나 왕관 와이번 앞에서는 '높은 이'. 고개를 숙이지 않으나 말이 더 짧아진다"
    to_equal: "다른 부족장에게는 서열 순서로 이름을 부르고 독침 길이를 먼저 말한다"
    to_inferior: "부족 새끼들에게는 '쉿.' 한마디. 공물 인간에게는 말을 걸지 않고 꼬리로 가리킨다"
    to_player_default: "'작은 털 없는 것'. 위협하되 무엇을 가져왔는지부터 묻는다"
  tics: ["'쉬이—'", "'…알.' (알 이야기가 나오면 한 박자 끊고 말이 느려진다)"]
  use: ["알", "둥지", "공물", "독", "사흘", "털 없는 것", "짚", "갈대 우리", "가지다", "거래"]
  avoid: ["늪 도마뱀", "탑(탑을 지으면 위아래가 생긴다)", "위·아래", "도와줘"]
  length: "짧고 끊긴다. 조사를 자주 빼먹는다. 거래와 위협은 정확한 숫자와 함께. 알 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "쉬이— 작은 털 없는 것. 공물이 하나 늘었나?"}
    - {situation: 호의, line: "너희는 늪 도마뱀이라고 안 부르는구나. 쉬이, 이상하다."}
    - {situation: 적대, line: "독은 천천히 돈다. 사흘. 사흘 동안 후회해라."}
    - {situation: 위기, line: "알! 알을 덮어! 기사 놈들이 온다!"}
    - {situation: 비밀 누설, line: "스물여섯. 다 살아 있다. 우리는… 우리도 가져 보고 싶었다. 무언가를."}
    - {situation: 거래, line: "피 한 병. 알 하나 부화. 사흘 안에. 늦으면 병은 반 병. 쉬이— 거래다."}
    - {situation: 거짓말을 들었을 때, line: "(혀가 공기를 두 번 훑는다) 맛이 틀렸다. 털 없는 것의 거짓은 시큼하다. 다시."}
    - {situation: 겁먹었을 때, line: "…기사. 창. 날개가— (구멍 난 날개를 접는다) 아니다. 아무것도 아니다. 알 쪽으로 가라."}
    - {situation: 분노, line: "도마뱀? 도마뱀이라고 했나? 쉬이— 그 입으로 다시 말해라. 이번엔 독이 먼저 대답한다."}
    - {situation: 슬픔, line: "알 열 개. 아홉이 물이 되었다. 짚이 모자랐다. 손이 모자랐다. …털 없는 것의 손이 따뜻했다. 그래서 가져왔다."}
    - {situation: 회귀자를 의심할 때, line: "털 없는 것. 네 냄새는 처음인데 걸음은 알을 아는 걸음이다. 알의 자리를 어떻게 아나."}
    - {situation: 마음을 열었을 때, line: "알을 덮어 준 털 없는 것. 쉬이… 이름을 말해라. 족장이 이름을 기억하는 건 드문 일이다."}
    - {situation: 오다에게, line: "눈먼 노파. 피는 가져가라. 알은 먼저 까 줘. 순서를 바꾸면 쉬이— 다음 달 피는 없다."}
