life:
  - {year: 202, age: 0, event: "쉿소리 늪 둔덕에서 부화. 독침이 두 갈래로 자랐다 — 족장 혈통의 표시"}
  - {year: 240, age: 38, event: "독침 길이 순위 다툼에서 이겨 부족 사냥대의 우두머리가 됨"}
  - {year: 280, age: 78, event: "용제국 기사 와이번이 '늪 도마뱀 토벌'을 와서 부족 새끼 아홉을 잃음. 왼쪽 날개를 창이 뚫었다. 그날 이후 기사 와이번이라는 낱말에 몸이 굳는다"}
  - {year: 287, age: 85, event: "모르바 자유민과 갈대 매듭으로 사냥터를 가르는 '젖은 휴전'을 맺음. 이후 25년 동안 어느 쪽도 먼저 어기지 않았다"}
  - {year: 289, age: 87, event: "선대 족장이 죽자 '가장 오래 산 암컷'으로 부족장 자리를 이음"}
  - {year: 303, age: 101, event: "베른의 마을이 갈대 매듭을 옮기는 일로 부딪침. 독침이 베른의 왼쪽 다리에 닿았다. 죽이지는 않았다"}
  - {year: 307, age: 105, event: "겨울 추위로 알 열 개 중 아홉이 썩음. 알을 덮을 짚을 나를 손과 둥지를 치울 손이 모자랐다"}
  - {year: 308, age: 106, event: "베른과 공물 계약 — 매년 노동력 여섯. 첫 여섯을 갈대 우리에 들임. 한 명도 죽이지 않기로 정했다"}
  - {year: 309, age: 107, event: "눈먼 오다와 달마다 한 번 피 거래를 시작 — 알 부화를 돕는 대가로 와이번의 피를 내준다"}
  - {year: 312, age: 110, event: "알 열넷을 품고 낙엽월 1일을 맞음. 갈대 우리에는 공물 사이에서 태어난 둘을 포함해 인간 스물여섯"}
appearance:
  - "꼬리 끝 독침이 두 갈래다 — 족장 혈통. 몸길이 팔 미터쯤, 이끼색과 진흙색 얼룩 비늘"
  - "왼쪽 날개에 기사 와이번의 창에 뚫린 구멍 — AS 280 '늪 도마뱀 토벌'. 바람이 불면 구멍으로 휘파람 소리가 샌다"
  - "목이 길고 눈은 가늘다. 말할 때 혀끝이 비늘 사이로 빠르게 드나든다"
smell: "썩은 갈대와 진흙, 독침에서 나는 시큼한 냄새"
voice_sound: "낮게 쉬는 소리. 'ㅅ'이 길게 늘어지고 말끝이 '쉬이—' 하고 샌다. 공용어가 서툴러 말이 짧게 끊긴다"
personality:
  disposition: {용기: 60, 자비: -30, 정직: 40, 신앙: 10, 탐욕: 60, 충성: 80}
  temperament: [위협적, 거래에 정직, 알 앞에서는 느려짐]
  habits:
