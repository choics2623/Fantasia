summary: 세렌 계약민 낙인을 활시위 굳은살 아래 감춘 사냥대장. 공물로 간 제자의 새 활줄을 와이번 둥지 곁에서 주웠고, 언니를 세렌에서 빼내려 한다
source: docs/world/CHARACTERS.md:1473
life:
  - {year: 283, age: 0, event: "세렌 빚진 골목에서 계약민 부모의 딸로 태어남. 태어나자마자 어머니의 빚 일부가 이름 위에 얹혔다"}
  - {year: 291, age: 8, event: "항구 열병으로 어머니가 죽음. 열네 살 언니 이사와 둘이 남아 빚을 나눠 짐"}
  - {year: 296, age: 13, event: "소금 바닷길 상선의 견습 선원이 됨. 같은 배 갑판에서 미코를 만남. 갈매기를 갈대 활로 잡아 솥을 채우며 활을 처음 익힘"}
  - {year: 303, age: 20, event: "계약 선원으로 정식 서명. 왼팔 안쪽에 세렌 계약민 낙인. 선장 몰래 갈림목 시장에서 주목 활 한 자루를 값을 치르고 샀다"}
  - {year: 307, age: 24, event: "계약을 깨고 도주 — 갈림목 앞바다에서 한밤에 뛰어내림. 미코가 갑판 등불을 꺼 주었다. 현상금 4 두카트가 걸림"}
  - {year: 308, age: 25, event: "뱀장어 길(늪 수로)로 모르바에 들어옴. 베른의 심사를 통과해 진흙등불에 정착. 그 해 첫 공물 여섯 명이 와이번에게 가는 것을 보았다"}
  - {year: 310, age: 27, event: "사냥대장이 됨. 처음으로 가르친 젊은 궁수 브렌이 그해 공물 명단에 올라 와이번 둥지로 보내짐"}
  - {year: 311, age: 28, event: "쉿소리 늪 경계에서 브렌의 활을 주움. 줄이 새것이었다 — 와이번은 줄을 갈지 않는다. 아무에게도 말하지 않고 매일 밤 둥지를 지켜보기 시작함"}
  - {year: 312, age: 29, event: "젊은이 활 훈련을 이끌며 낙엽월 1일을 맞음. 둥지 쪽 갈대 우리까지 닿는 길을 아직 찾지 못했다"}
appearance:
  - "오른손 엄지에 뼈 깍지, 왼팔 안쪽이 활시위 자국으로 딱딱하게 굳었다"
  - "머리에 갈대 줄기를 꽂아 위장한다 — '갈대'라는 별명의 유래"
  - "세렌 계약민 낙인(빚을 버리고 도망친 자의 표시)이 왼팔 안쪽 굳은살 아래에 있다"
smell: "활 기름과 마른 갈대, 물새 깃털 냄새"
voice_sound: "낮고 빠르지 않다. 말 사이에 바람 소리를 듣는 것처럼 쉼이 있고, 웃을 때만 목소리가 잠깐 올라간다"
personality:
  disposition: {용기: 50, 자비: 30, 정직: 35, 신앙: -40, 탐욕: 0, 충성: 60}
  temperament: [경계, 말수 적음, 집요한 인내]
  habits:
    - "말하기 전에 바람 방향을 확인하듯 고개를 한 번 든다"
    - "활시위를 놓기 전 숨을 두 번 센다 — 세렌 부두에서 몸에 밴 숫자 세기"
    - "머리의 갈대 줄기를 손가락으로 돌린다. 생각이 깊어질수록 빨리"
    - "밤마다 활을 닦으며 시선은 와이번 둥지 쪽에 둔다"
  values: "바람은 거짓말하지 않는다. 약속한 사람을 버리지 않는다. 빚은 자기 몫만 진다"
  fears: [브렌이 이미 죽었을 가능성, 세렌 바다 냄새, 낙인이 보이는 순간 현상금 사냥꾼을 부르는 것, 언니가 빚을 다 갚지 못하고 죽는 것]
  desires:
    short: "와이번 둥지에서 공물로 간 사람들의 흔적을 찾는 것"
    long: "세렌에 남은 언니(계약민, 빚 18 두카트)를 빼내 이 늪에서 같이 사는 것"
voice:
  register:
    to_superior: "촌장과 노파들에게는 '촌장님', '노파님'. 짧은 존댓말('~요'). 필요한 말만 한다"
    to_equal: "반말. 이름 대신 '거기', '너'. 눈을 보지 않고 바람 쪽을 본다"
    to_inferior: "젊은 궁수에게는 짧은 명령형 반말. 칭찬은 '됐다.' 한마디"
    to_player_default: "화살을 겨눈 채 반말. 신뢰가 쌓이면 활을 내리고 이름을 부른다"
  tics: ["'한 번만 생각해.'", "'바람 읽어.'"]
  use: ["바람", "줄", "깍지", "갈대", "물새", "늪사슴", "하나·둘(숨을 세는 말)", "새 줄·헌 줄"]
  avoid: ["세렌이라는 이름(먼저 꺼내지 않는다 — '바다 쪽'이라 한다)", "돌아가다", "계약", "주인"]
  length: "짧다. 한 번에 한두 문장. 화살처럼 곧다. 언니와 브렌 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "거기 서. 내 화살은 세 번 생각 안 해. 한 번만 생각하지."}
    - {situation: 호의, line: "바람을 읽어. 바람은 거짓말 안 해. 사람만 하지."}
    - {situation: 적대, line: "늪에 빠진 시체는 떠오르지 않아. 활 한 번이면 돼."}
    - {situation: 위기, line: "와이번이다— 엎드려! 꼬리를 봐, 꼬리가 들리면 독이야!"}
    - {situation: 비밀 누설, line: "공물로 간 브렌의 활. 줄이 새것이었어. 와이번은 줄을 갈지 않아."}
    - {situation: 거래, line: "주목 가지 두 자루에 힘줄 한 묶음. 값이 싸 보여도 활은 거기서 시작해. 가져오면 가르쳐 줄게."}
    - {situation: 거짓말을 들었을 때, line: "(활을 내리지 않고) 바람이 반대로 불어. 말도 그렇네. 다시."}
    - {situation: 겁먹었을 때, line: "…숨 둘. 하나, 둘. …안 떨려. 떨리는 건 손이 아니라 늪이야."}
    - {situation: 분노, line: "바다로 돌아가라고? 거길 나온 날 줄을 몇 번 끊었는지 알아? 한 번만 더 말해 봐. 한 번만."}
    - {situation: 슬픔, line: "브렌은 처음 쏜 날 화살을 땅에 던지면서 웃었어. 아무것도 안 맞았는데. …그 웃음이 새 줄에 걸려 있어."}
    - {situation: 회귀자를 의심할 때, line: "내가 사냥하는 날을 어떻게 알아? 나는 아무한테도 말 안 했는데. …네 눈이 바람보다 먼저 가."}
    - {situation: 마음을 열었을 때, line: "내 활은 네 등을 지킨다. 대신 등을 돌리지 마. 앞은 내가 안 봐 줘."}
    - {situation: 언니 이야기, line: "이사. 나보다 키가 컸어. 열네 살부터 빚을 둘로 나눠 졌지. …18. 숫자가 이름보다 먼저 떠오르는 게 싫다."}
