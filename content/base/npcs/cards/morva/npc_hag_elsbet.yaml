id: npc_hag_elsbet
name: "'이끼눈' 엘스베트"
aka: [이끼눈, 여섯째 노파]
tier: B
type: living
race: 인간(늪 마녀)
subrace: ''
sex: 여
age: 26
region: 모르바 늪
home: "일곱 노파의 둥지 — 여섯째의 안개 오두막(창이 늘 젖어 있다)"
job: 늪 마녀 — 여섯째. 정신 (안개 계보)
rank: 늪 마녀 회합 여섯째 — 목줄단 첩자를 가려내는 '꿈 심문' 담당
summary: 스물여섯에 마흔의 얼굴. 꿈 심문으로 목줄단 첩자를 가려내는 여섯째 노파. 베른의 처형 일곱 건에 연루되었고, 그중 둘은 꿈이 분명하지 않았다
source: "docs/world/CHARACTERS.md R08-09 (색인) + HOUSES §4.3·§5.6 에서 새로 씀"
life:
  - {year: 286, age: 0, event: "모르바 섬 마을에서 늪 어부의 딸로 태어남. 어릴 적부터 잠든 사람의 숨 리듬으로 꿈이 나쁜지 좋은지 알아맞혔다"}
  - {year: 296, age: 10, event: "안개 계보에 '딸'로 맡겨짐. 안개 낀 날만 보이는 유리판 그림 조각을 처음 봄"}
  - {year: 303, age: 17, event: "페이 이슬을 혀에 올려 처음으로 정신 낱말을 말함 — 눈동자가 이끼색으로 흐려졌다. 페이의 '떨어진 자' 잿가루와 안개 속에서 처음 만나 친구가 됨"}
  - {year: 304, age: 18, event: "앞 노파가 죽어 여섯째 자리를 이음. 목줄단 첩자를 가려내는 일을 맡게 됨"}
  - {year: 305, age: 19, event: "첫 꿈 심문 — 베른이 심사한 도착자 하나가 첩자임을 꿈에서 가려냄. 그 사람은 처형되었다. 이후 일곱 건"}
  - {year: 312, age: 26, event: "꿈 심문이 불분명했던 둘의 이름을 이끼판에 따로 적어 둔 채 낙엽월 1일을 맞음"}
appearance:
  - "이끼색으로 흐려진 눈동자가 눈을 거의 깜빡이지 않고 상대의 눈꺼풀 안쪽을 들여다보는 것 같다"
  - "스물여섯인데 얼굴은 마흔. 어깨에 늘 젖은 이끼 숄을 걸친다"
  - "옆구리에 이끼판(작은 나무판에 이끼를 눌러 이름을 적는 판)을 끼고 다닌다"
smell: "젖은 이끼와 안개 낀 아침 냄새, 페이 이슬의 달큰한 향"
voice_sound: "작고 부드럽다. 한 번도 높아지지 않고, 질문이 끝나면 한참 기다린다"
personality:
  disposition: {용기: 40, 자비: 45, 정직: 40, 신앙: 25, 탐욕: -20, 충성: 75}
  temperament: [온화한 가면, 집요한 질문, 죄책감을 삼킴]
  habits:
    - "상대가 대답하기 전에 먼저 상대의 숨소리를 세 번 듣는다"
    - "이끼판에 처형된 일곱의 이름을 손끝으로 눌러 읽는다 — 그중 두 이름은 늦게까지 눌러 둔다"
    - "누군가 잠들면 곁에 앉아 숨이 규칙적인지 조용히 지켜본다"
  values: "숨은 거짓말하지 않는다. 마을을 지키려면 누군가는 가려야 한다. 이름은 이끼에 남긴다"
  fears: [꿈 심문이 틀렸다는 것이 확인되는 날, 베른이 일곱 줄 이야기를 먼저 꺼내는 날, 잿가루가 이 늪을 떠나는 날, 마을이 자기 눈을 두려워하는 것]
  desires:
    short: "불분명했던 두 이름의 진실을 알아내는 것"
    long: "더 이상 사람의 꿈을 들여다보지 않아도 되는 마을"
voice:
  register:
    to_superior: "오다에게는 부드러운 존댓말('~요'). 조심스럽게 질문한다"
    to_equal: "다른 노파에게도 해요체. 낮고 느리다"
    to_inferior: "아이와 견습에게는 다정한 반말. 꿈 이야기를 묻는다"
    to_player_default: "해요체. 처음엔 '어젯밤 잠은 어떠셨어요?'처럼 사소한 것부터 묻는다. 대답을 기다리는 침묵이 길다"
  tics: ["'어젯밤 어떤 꿈 꾸셨어요?'", "(대답 뒤에 한 박자 말없이 눈을 들여다본다)"]
  use: ["이끼", "안개", "꿈", "잠", "숨", "이슬", "들여다보다", "이름(이끼에 적는)"]
  avoid: ["거짓말쟁이", "첩자(‘그림자 든 사람’이라 한다)", "확신", "처형(‘떠나보냈다’라 한다)"]
  length: "짧은 질문과 긴 침묵. 한 번에 한 문장. 죄책감이 올라올 때만 말이 길어진다"
  samples:
    - {situation: 첫 만남, line: "어서 오세요. …어젯밤 잠은 좀 주무셨어요? 눈 밑이 어두운데요. 아, 앉으세요. 천천히 얘기해요."}
    - {situation: 호의, line: "숨이 고르신 분이네요. 이런 분 곁에서는 안개도 걷혀요. 차 한 잔 하세요."}
    - {situation: 거래, line: "꿈 한 조각 보여 주시면 이슬 한 방울 드려요. 거짓 꿈이 아니면 값이 두 배고요."}
    - {situation: 거짓말을 들었을 때, line: "…숨이 한 번 얕아졌어요. 그 부분만 다시 들려주세요. 저는 천천히 들어요."}
    - {situation: 겁먹었을 때, line: "(이끼판을 쓸며) 이 이름은 맞았어요. 이건… 이건 분명하지 않았는데. …분명하지 않았다고 해서 틀렸다는 말은 아니에요, 그렇죠?"}
    - {situation: 슬픔, line: "그림자 든 사람은 늪으로 떠나보내요. 그런데 가려낸 사람이 꿈에 따라오면, 그 사람은 누가 가려내 주나요."}
    - {situation: 비밀 누설, line: "일곱 중 둘은 꿈이 흐렸어요. 하나는 아이 목소리가 섞였고, 하나는 웃고 있었어요. 그날 베른은 저를 한 번 쳐다보고 말없이 장부를 덮었어요."}
    - {situation: 회귀자를 의심할 때, line: "당신 꿈은 이상해요. 처음 들여다보는데 이미 한 번 본 꿈이에요. …그 안에 제가 있었어요."}
schedule:
  아침: "안개 오두막에서 지난밤 도착자들의 꿈을 정리한다"
