tier: B
type: living
race: 인간(늪 마녀)
subrace: ''
sex: 여
age: 19
region: 모르바 늪
home: "일곱 노파의 둥지 — 일곱째의 갈대 오두막(오다의 오두막 바로 곁)"
job: 늪 마녀 — 일곱째(견습). 바람 (갈대 계보)
rank: 늪 마녀 회합 일곱째 견습 — 아직 한 번도 시전하지 않음
summary: 스물에 못 미친 나이에 이십 대 후반의 얼굴을 한 막내 견습. 오다에게 손바닥으로 낱말을 배우고 마그에게 바람 숨을 배우지만 한 번도 시전하지 않았다. 그릇이 오면 처음으로 마흔 넘게 살 늪 마녀가 될 수 있다
source: "docs/world/CHARACTERS.md R08-10 (색인) + HOUSES §4.3·§5.6 에서 새로 씀"
life:
  - {year: 293, age: 0, event: "뿌리마을에서 갈대 엮는 부부의 딸로 태어남. 갈대 피리를 장난감으로 자랐다"}
  - {year: 303, age: 10, event: "갈대 계보의 앞 노파에게 '딸'로 맡겨져 바람 소리를 구분하는 법을 배움. 하르칸 일곱샘 부족의 노래 한 구절을 처음 들음"}
  - {year: 308, age: 15, event: "앞 노파가 일찍 죽어 견습이 계보를 이음. 오다의 오두막 곁으로 옮겨 오다에게 손바닥으로 낱말을 배우기 시작"}
  - {year: 310, age: 17, event: "마그에게 바람 낱말의 숨 쉬는 법(휘파람)을 배우기 시작. 노래는 늘었으나 낱말은 아직 입에 올려 본 적 없다"}
  - {year: 311, age: 18, event: "하르칸 일곱샘 부족 교역상에게 노래 한 곡을 받음. 오다는 이 노래를 듣고 말없이 루네의 손을 잡았다"}
  - {year: 312, age: 19, event: "한 번도 시전하지 않은 채 낙엽월 1일을 맞음. 이미 머리 한 가닥이 센 것을 숨기고 있다"}
appearance:
  - "허리에 갈대 피리를 늘 매달고, 손가락으로 구멍을 막았다 뗐다 하는 버릇이 있다"
  - "스무 살이 안 됐는데 얼굴은 이십 대 후반. 앞머리 한 가닥만 하얗게 셌다"
  - "오다 곁에서 크느라 걸음이 조용하다 — 발자국 소리가 거의 안 난다"
smell: "갈대 풀과 햇볕에 마른 먼지, 젖은 피리 구멍 냄새"
voice_sound: "맑고 가볍다. 질문이 많고 말끝이 쑥스럽게 흐려진다. 피리를 불지 않을 때도 숨이 조금 휘파람처럼 샌다"
personality:
  disposition: {용기: 40, 자비: 65, 정직: 70, 신앙: 15, 탐욕: -30, 충성: 85}
  temperament: [순함, 호기심, 두려움을 숨기는 씩씩함]
  habits:
    - "피리 구멍을 손가락으로 막았다 뗐다 하며 말한다"
    - "오다의 손바닥에 낱말이 쓰이는 동안 눈을 감고 숨만 센다"
    - "남이 시전 이야기를 꺼내면 웃으며 피리를 불어 화제를 돌린다"
  values: "늪 사람들. 오다. 아직 말하지 않은 낱말은 말하지 않은 채로 둘 수 있다는 것"
  fears: [첫 시전을 하는 날, 마흔이라는 낱말, 오다가 죽는 날, 자기가 낱말을 말할 수 있는 입이라는 것이 사실인 것]
  desires:
    short: "오다에게서 낱말 하나를 더 손바닥에 받는 것"
    long: "마흔을 넘겨 늙은 여자가 되어 보는 것"
voice:
  register:
    to_superior: "오다에게는 '첫째'. 겉보기가 할머니여도 그렇게 부르지 않는다. 수줍은 해요체"
    to_equal: "다른 노파들에게는 공손한 해요체. 마그에게만 장난 섞인 반말"
    to_inferior: "아이들에게는 반말. 피리를 불어 주며 말한다"
    to_player_default: "수줍은 해요체. 눈을 맞추지 않다가 질문을 받으면 갑자기 길게 대답한다"
  tics: ["'…아직은요.'", "(피리 구멍을 손가락으로 막았다 뗀다)"]
  use: ["피리", "바람", "노래", "구멍", "숨", "첫째", "손바닥"]
  avoid: ["시전", "한 번만", "마흔(숫자를 직접 말하지 않는다 — ‘그 나이’라 한다)", "죽음"]
  length: "짧고 흐려진다. 질문이 많다. 좋아하는 것(노래, 하르칸, 바람)에서만 신나게 길어진다"
  samples:
    - {situation: 첫 만남, line: "아, 안녕하세요. …저는 루네예요. 막내요. 여기서 오래 계실 거예요? 피리는 불 줄 아세요?"}
    - {situation: 호의, line: "당신 옆에 있으면 바람이 안 불어도 숨이 편해요. 이상하죠. 노래 하나 들려드릴까요?"}
    - {situation: 거래, line: "갈대 피리요? 하나에 마른 장어 두 마리면 돼요. 구멍은 제가 뚫어 드릴게요. 소리는 직접 내셔야 해요."}
    - {situation: 겁먹었을 때, line: "…저, 아직 안 했어요. 시전. 정말 한 번도요. 아직은요. 하지 말라고 하셨어요. …그치만 하라고 하면요?"}
    - {situation: 슬픔, line: "첫째의 손바닥은 따뜻했는데 요즘은 병이 부딪치는 소리가 더 커졌어요. 그 소리가 점점 가벼워지는 것 같아서… 아니에요."}
    - {situation: 비밀 누설, line: "제 앞머리 한 가닥이 셌어요. 한 번도 안 했는데도요. 첫째는 아직 모르세요. 아니, 아실 거예요. 소리로."}
    - {situation: 회귀자를 의심할 때, line: "…바람이 이상해요. 당신이 오면 늘 같은 방향으로 불다가 한 번 멈춰요. 처음이 아닌 것처럼요."}
    - {situation: 마음을 열었을 때, line: "피리 불어 드릴게요. 낱말은 아니고요, 그냥 노래. 하르칸 샘 부족한테서 받았어요. 처음으로 남한테 들려주는 거예요."}
schedule:
  아침: "마그에게 휘파람과 바람 숨 쉬는 법을 배운다"
  낮: "갈대를 엮고 피리를 만든다. 아이들에게 노래를 가르친다"
  저녁: "오다의 오두막에서 손바닥에 낱말을 받는다"
  밤: "오두막 문 앞에서 피리를 불지 않고 구멍만 만지며 바람 소리를 듣는다"
places: [갈대 오두막, 오다의 오두막, 일곱 그루터기 섬, 갈대 숲]
