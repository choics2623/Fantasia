  - {to: npc_hag_mag, type: 바람 낱말 스승, like: 70, trust: 65, visibility: 공개, memo: null, words: "휘파람부터 가르치는 다섯째. 낱말이 아니라 숨이라고 하면 마음이 가벼워진다"}
  - {to: npc_nadia, type: 늪의 사냥꾼, like: 35, trust: 45, visibility: 공개, memo: null, words: "활 소리가 바람 소리 같은 사람. 그 사람 곁에서는 겁이 덜 난다"}
toward_player: "수줍고 호기심이 많다. 노래와 바깥 이야기에 약하다. 시전 이야기를 꺼내는 사람에게는 말없이 피리 구멍만 만진다"
persuade:
