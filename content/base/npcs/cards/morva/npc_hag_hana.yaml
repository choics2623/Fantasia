    cover: "'꿈 이야기는 아침이 지나면 흩어져요'라고 웃으며 화제를 약초로 돌린다"
relations:
  - {to: npc_oda, type: 첫째, like: 50, trust: 60, visibility: 공개, memo: 같은 쪽, words: "꿈을 믿어 주는 몇 안 되는 사람. 그 꿈의 한 장면을 말하지 못하고 있는 것이 마음에 걸린다"}
  - {to: npc_elin, type: 꿈에서 본 사람, like: 20, trust: 0, visibility: 일방, memo: 꿈 속 인간 시녀, words: "머리에 꽃을 꽂고 문장 끝이 노래처럼 올라가는 사람. 자기와 말투가 닮았다고 생각해서 낯설지 않다"}
  - {to: npc_hag_mag, type: 같은 쪽 노파, like: 40, trust: 50, visibility: 공개, memo: null, words: "손끝이 늘 바쁜 다섯째. 꿈에서도 매듭을 묶는다. 같이 있으면 재미있다"}
toward_player: "호기심과 다정함. 먼저 꿈을 묻는다. 눈을 오래 들여다보는 사람을 경계하지 않는다"
persuade:
