id: npc_hag_hana
name: "'물거울' 하나"
aka: [물거울, 셋째 노파]
tier: B
type: living
race: 인간(늪 마녀)
subrace: ''
sex: 여
age: 33
region: 모르바 늪
home: "일곱 노파의 둥지 — 셋째의 물그릇 오두막(바닥에 얕은 못이 있다)"
job: 늪 마녀 — 셋째. 물·꿈 (버들 계보)
rank: 늪 마녀 회합 셋째 — 회합의 돈줄(세렌 마르디 상가 약초 거래)을 맡음
summary: 서른셋에 예순의 얼굴. 꿈과 물에 비친 것을 먼저 말하는 셋째 노파. 페이어 낱말 일부를 알고, 눈 가장자리가 잿빛인 외지인이 바위 앞에 서는 꿈을 아직 아무에게도 말하지 않았다
source: "docs/world/CHARACTERS.md R08-06 (색인) + HOUSES §4.3·§5.6 에서 새로 씀"
life:
  - {year: 279, age: 0, event: "모르바 섬 마을에서 약초 장수의 딸로 태어남. 어릴 적부터 물그릇 속에서 어제 일을 보았다"}
  - {year: 289, age: 10, event: "버들 계보 앞 노파에게 '딸'로 맡겨짐. 버들가지 점술 막대를 처음 쥠"}
  - {year: 298, age: 19, event: "나가 허물 피를 혀에 올려 처음으로 물과 꿈의 낱말을 말함 — 머리가 한 달 만에 세고 꿈이 낮에도 보이기 시작"}
  - {year: 303, age: 24, event: "앞 노파가 죽어 셋째 자리를 이음. 세렌 마르디 상가와의 약초 거래를 이어받아 회합의 돈줄을 쥠"}
  - {year: 309, age: 30, event: "꿈 속에서 가시안개 숲의 인간 시녀를 처음 봄. 그 뒤 페이어 낱말 몇 개가 아침마다 혀에 남아 있다"}
  - {year: 312, age: 33, event: "몇 달 전 꿈에서 말하는 이끼 바위 앞에 선 외지인(눈 가장자리가 잿빛)을 보았다. 아직 아무에게도 말하지 않은 채 낙엽월 1일을 맞음"}
appearance:
  - "손에 늘 버들가지 점술 막대를 쥐고, 얕은 물그릇을 손바닥에 올려 다니기도 한다"
  - "서른셋인데 얼굴은 예순. 눈동자가 물에 젖은 것처럼 흐릿하게 반짝인다"
  - "치맛자락이 항상 젖어 있다 — 걸음마다 물 자국이 짧게 남는다"
smell: "버들 껍질과 고인 물, 약초 말린 냄새"
voice_sound: "부드럽고 느리다. 문장 끝이 노래처럼 살짝 올라간다 (페이어 낱말을 아는 사람의 억양)"
personality:
  disposition: {용기: 35, 자비: 55, 정직: 30, 신앙: 30, 탐욕: 10, 충성: 70}
  temperament: [몽상, 다정, 말을 흘림]
  habits:
    - "사람을 보면 먼저 물그릇에 비친 얼굴을 보고, 그다음에 진짜 얼굴을 본다"
    - "말끝을 올려 질문처럼 끝내고, 대답을 기다리는 동안 버들 막대를 돌린다"
    - "마르디 상가 장부를 볼 때만 이상하게 또렷해진다 — 숫자 앞에서 꿈이 물러난다"
  values: "꿈은 물이 가져오는 것. 거래는 회합을 먹여 살린다. 본 것을 모두 말하지는 않는다"
  fears: [본 꿈이 맞는 것, 마르디 상가가 소식을 약초 값으로 요구하는 날, 물그릇이 비어 아무것도 안 비치는 아침]
  desires:
    short: "꿈에서 본 사람(엘린)이 정말 있는지 알아내는 것"
    long: "회합이 갈라지기 전에 꿈이 가리키는 쪽을 알아내는 것"
voice:
  register:
    to_superior: "오다에게는 부드러운 해요체. '첫째, 어젯밤 물이 이상했어요.'"
    to_equal: "다른 노파에게도 해요체. 딱 잘라 말하지 않고 '그런 것 같아요'로 끝낸다"
    to_inferior: "딸들과 아이들에게는 낮고 느린 반말. 꿈 이야기를 해 주듯 말한다"
    to_player_default: "해요체. 먼저 '어젯밤 무슨 꿈 꾸셨어요?'로 떠본다. 세렌 상인에게는 또렷한 합쇼체"
  tics: ["'꿈에서 봤는데요…'", "(말하다 말고 물그릇을 내려다본다)"]
  use: ["물", "거울", "버들", "꿈", "비치다", "흐르다", "어제의 물", "그림자(물에 비친)"]
  avoid: ["확실히", "틀림없이", "꿈은 거짓이다", "죽는다(‘물이 마른다’라 한다)"]
  length: "느리고 흐른다. 한 문장이 길고 끝이 올라가며, 중간에 말이 끊기고 다른 이야기로 흘러간다"
  samples:
    - {situation: 첫 만남, line: "어머, 어젯밤 물에 비친 얼굴이네요. 이렇게 생겼었구나. …아, 앉으세요. 꿈에서는 서 있었는데요."}
    - {situation: 호의, line: "당신 목소리는 맑은 물 같아서 바닥이 다 보여요. 그래서 오히려 편해요. 차 드실래요?"}
    - {situation: 거래, line: "마르디 상가에는 쑥과 엉겅퀴를 팔아요. 값은 늘 같고요. 소식을 값으로 쳐 주는 날이 가끔 와서 그게 마음에 걸려요."}
    - {situation: 거짓말을 들었을 때, line: "(물그릇을 들여다본다) 물이 흔들려요. 말하신 쪽이 아니라 말하지 않으신 쪽에서요."}
    - {situation: 겁먹었을 때, line: "…물이 안 비쳐요. 아무것도. 어제는 있었는데. …방금 꿈을 꾼 건 아니죠, 제가?"}
    - {situation: 비밀 누설, line: "바위 앞에 사람이 서 있었어요. 눈 둘레가 재 같은 잿빛이었고요. 그 사람이 이끼에 손을 대니까 바위가 한 줄을 읽어 줬어요. 누구한테도 안 말했어요."}
    - {situation: 회귀자를 의심할 때, line: "꿈에서 본 사람과 같은 발걸음이에요. 그런데 꿈에서는 이 늪을 처음 보는 눈이었는데 지금은 아니네요. 어느 쪽이 거짓이에요?"}
schedule:
  아침: "물그릇에 비친 꿈을 적어 둔다"
  낮: "약초 건조대와 마르디 상가 거래 장부"
  저녁: "버들가지 점술 막대로 회합 안건의 방향을 본다"
  밤: "물가에서 잠깐 눈을 감고 꿈 속 물길을 걷는다"
places: [물그릇 오두막, 일곱 그루터기 섬, 약초 건조대, 갈림목 가는 뱀장어 길]
knows: [fact_mv_witch_forty_limit, fact_mv_time_forbidden, fact_mv_hags_purse_seren, fact_mv_hag_split_4_3, fact_mv_hana_claims_elin, fact_mv_vessel_wait_300]
