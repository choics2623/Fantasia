life:
  - {year: 277, age: 0, event: "뿌리마을에서 북방(서리 길) 탈주자 부부의 딸로 태어남. 서리말 자장가를 듣고 자랐다"}
  - {year: 288, age: 11, event: "거인 골수 촉매를 쓰는 뼈바늘 계보에 맡겨져 북방 출신 아이들 사이에서 낱말을 배우기 시작"}
  - {year: 297, age: 20, event: "처음으로 거인 골수를 혀에 올리고 대지의 낱말을 말함 — 오른손 손가락 마디가 쇠빛으로 굳음. 그날부터 쇠를 만지면 손이 차갑지 않다"}
  - {year: 300, age: 23, event: "앞 노파가 마흔 앞에서 죽어 둘째 자리를 이음. 북방 탈주자 출신 제자가 가장 많은 계보가 됨"}
  - {year: 303, age: 26, event: "스승 대에 있었던 엘사와 첫째 노파의 다툼 이야기를 오다의 스승에게서 직접 들음. 그 뒤로 엘사를 '떠난 여자'라 부른다"}
  - {year: 311, age: 34, event: "회합 보름 모임에서 '그릇이 오면 늪에 묶어 둔다'는 안을 처음 입에 올림. 쑥·버들·재·갈대 쪽과 갈림"}
appearance:
  - "오른손 손가락 마디가 쇠빛으로 굳어 있고, 늘 뼈바늘 한 개를 손가락 사이에 끼고 다닌다"
  - "서른다섯인데 얼굴은 일흔. 어깨가 넓고 목이 짧아 노파라기보다 대장장이처럼 보인다"
  - "오두막 문틀이 거인의 정강이뼈이고, 그녀는 문턱을 넘을 때마다 손바닥으로 한 번 쓸고 들어간다"
smell: "쇠 녹과 골수 기름, 젖은 돌 냄새"
voice_sound: "낮고 단단하다. 말끝을 내려 찍고 숨을 거의 쉬지 않는다"
personality:
  disposition: {용기: 60, 자비: 25, 정직: 50, 신앙: 20, 탐욕: -20, 충성: 85}
  temperament: [단단함, 의심, 지키려는 고집]
  habits:
    - "말하는 동안 뼈바늘로 손바닥 굳은살을 천천히 찌르며 헤아린다"
    - "처음 보는 사람이 문턱을 넘으면 발소리를 세 번 듣고 나서야 앉으라고 한다"
    - "북방 출신 제자들이 서리말로 중얼거리면 아무 말 없이 같은 말로 대꾸해 준다"
  values: "늪이 먼저다. 아이들이 불타지 않게 한다. 한 번 지킨 것은 놓지 않는다"
  fears: [다라 때처럼 늪이 불타는 것, 제자들이 불려 나가는 것, 오다가 죽는 날 자기가 첫째가 되는 것, 그릇이 와서 회합이 4대 3으로 갈라지는 것]
  desires:
    short: "그릇이 오면 늪에 묶어 지키는 안을 회합에서 통과시키는 것"
    long: "다음 세대 노파들이 마흔을 넘기도록 낱말의 값을 줄이는 법을 찾는 것"
voice:
  register:
    to_superior: "오다에게는 '첫째'. 짧은 존댓말. 반대할 때도 말투는 낮춘다"
    to_equal: "다른 노파에게는 서열로 부르는 반말 — '넷째', '다섯째'. 토를 달지 않는다"
    to_inferior: "제자에게는 거친 반말. 칭찬은 꿰맨 자리를 손바닥으로 한 번 두드리는 것"
    to_player_default: "낯선 이에게는 평어 반말, 문턱에서 신발을 벗게 한다. 북방 말투가 섞이면 한 박자 늦게 풀린다"
  tics: ["'꿰맨다.'", "'늪이 먼저다.'"]
  use: ["뼈바늘", "돌", "쇠", "꿰매다", "늪", "묶어 둔다", "거인 골수", "제자"]
  avoid: ["엘사 이름(‘떠난 여자’라 한다)", "가두다(‘묶어 둔다’, ‘지킨다’라 한다)", "희망", "자유"]
  length: "짧은 평서문. 끝을 찍는다. 제자를 야단칠 때만 한두 문장 길어진다"
  samples:
    - {situation: 첫 만남, line: "신발 벗어라. 이 문틀은 거인 뼈다. 밟는 놈은 값을 낸다."}
    - {situation: 호의, line: "북쪽 사람이냐. 말투에 서리 냄새가 남았구나. 앉아라. 쇠 식기 전에."}
    - {situation: 거래, line: "돌 한 조각, 쇠 한 자루. 꿰매 주마. 대가는 내 수명이 아니라 네 수고다."}
    - {situation: 적대, line: "그 이름은 내 집에서 입에 올리지 마라. 늪을 버리고 바깥에 낱말을 흘린 여자다. 떠난 여자라 불러라."}
    - {situation: 분노, line: "그릇이 오면 늪이 불탄다. 다라 때 불탄 아이들 숫자를 아느냐. 나는 안다. 그래서 묶어 둔다."}
    - {situation: 슬픔, line: "내 어머니는 서리 길에서 이빨 칼에 한쪽 팔을 잃고도 늪까지 걸어왔다. 그 팔이 이 바늘이다."}
    - {situation: 회귀자를 의심할 때, line: "네 눈은 이 늪을 처음 보는 눈이 아니다. 처음 보는 눈은 돌에 먼저 손을 안 댄다."}
