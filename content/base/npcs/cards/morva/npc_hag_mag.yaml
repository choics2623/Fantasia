id: npc_hag_mag
name: "'실뜨기' 마그"
aka: [실뜨기, 다섯째 노파]
tier: B
type: living
race: 인간(늪 마녀)
subrace: ''
sex: 여
age: 30
region: 모르바 늪
home: "일곱 노파의 둥지 — 다섯째의 매듭 오두막(천장에 실이 거미줄처럼 걸려 있다)"
job: 늪 마녀 — 다섯째. 바람·그림자 (재 계보)
rank: 늪 마녀 회합 다섯째 — 갈대 계보의 바람 낱말을 대신 맡아 루네를 가르친다
summary: 서른에 쉰의 얼굴. 잿빛 실의 '매듭 문자'를 만든 다섯째 노파. 녹테른 그림자장미 가문의 피로 그림자 낱말을 지키고, 막내 루네에게 바람 낱말을 가르친다
source: "docs/world/CHARACTERS.md R08-08 (색인) + HOUSES §4.3·§5.6 에서 새로 씀"
life:
  - {year: 282, age: 0, event: "모르바 섬 마을 어부의 딸로 태어남. 그물 매듭을 먼저 배우고 글자를 나중에 배웠다"}
  - {year: 291, age: 9, event: "재 계보 앞 노파에게 '딸'로 맡겨짐. 잿빛 고리 모양 목걸이를 처음 만져 봄"}
  - {year: 299, age: 17, event: "실 매듭으로 숫자와 낱말을 적는 방식을 처음 고안. 잿빛 실 연락원 몇 명에게 시험해 보임"}
  - {year: 303, age: 21, event: "'매듭 문자'가 잿빛 실 종착지 '마지막 말뚝'에서 쓰이기 시작. 그림자 계보의 녹테른 피 거래 창구를 이어받음"}
  - {year: 305, age: 23, event: "앞 노파가 죽어 다섯째 자리를 이음. 목에 걸린 잿빛 고리는 '시간의 조각을 재에 묻은 날'을 기억하는 표시"}
  - {year: 308, age: 26, event: "일곱째 갈대 계보의 앞 노파가 일찍 죽자 견습 루네에게 바람 낱말을 가르치는 일을 맡음"}
  - {year: 312, age: 30, event: "녹테른 정원사 핍스가 장미 꽃잎과 함께 보내는 피 한 병을 낙엽월 초에 받을 차례를 기다린다"}
appearance:
  - "열 손가락 마디마다 실 자국이 깊고, 말하는 내내 손끝이 실을 묶고 푼다"
  - "서른인데 얼굴은 쉰. 머리를 가늘게 땋아 실처럼 꼰 끈으로 묶었다"
  - "목에 잿빛 고리 모양 목걸이 — 매듭 문자의 원형이 새겨져 있다"
smell: "젖은 실과 재, 그림자장미 꽃잎의 어두운 향"
voice_sound: "빠르고 가볍다. 말끝이 올라가며 숫자 세는 소리처럼 또박또박 끊긴다"
personality:
  disposition: {용기: 45, 자비: 40, 정직: 25, 신앙: 20, 탐욕: 5, 충성: 70}
  temperament: [재치, 호기심, 손이 쉬지 않음]
  habits:
    - "말하는 동안 손끝으로 실을 묶고 풀며, 한 문장이 끝날 때마다 매듭을 하나 묶는다"
    - "낯선 이의 손을 보고 그 사람이 매듭을 읽을 줄 아는지 맞혀 본다"
    - "루네 곁에 앉으면 바람 낱말 대신 바람 소리를 흉내 내는 휘파람부터 가르친다"
  values: "알려 준 만큼 묶인다. 길은 매듭으로 남는다. 시간 근원은 재에 묻은 것이니 건드리지 않는다"
  fears: [매듭 문자가 목줄단 손에 들어가는 것, 재에 묻은 시간의 낱말이 다시 일어나는 것, 루네가 바람 낱말을 말하는 날이 오는 것]
  desires:
    short: "녹테른에서 오는 피 한 병을 무사히 받는 것"
    long: "잿빛 실 전체를 매듭 문자로 이어 아무도 길을 잃지 않게 하는 것"
voice:
  register:
    to_superior: "오다에게는 '첫째'. 장난기를 숨기고 또박또박 존댓말"
    to_equal: "다른 노파에게는 반말. 가볍게 수수께끼를 던진다"
    to_inferior: "루네에게는 다정한 반말. 매듭 하나로 칭찬한다"
    to_player_default: "가볍게 반말. 상대의 손부터 본다. 매듭을 읽을 줄 알면 말이 더 빨라진다"
  tics: ["'매듭 하나.' (한 문장이 끝날 때마다 속으로 센다)", "(손끝이 실을 묶고 푼다)"]
  use: ["매듭", "실", "꼬임", "풀다", "묶다", "재", "그림자", "바람", "하나·둘(매듭 수)"]
  avoid: ["시간(낱말로서 — 재에 묻은 것이다)", "비밀(‘매듭 안쪽의 일’이라 한다)", "배신"]
  length: "짧고 빠른 문장이 이어진다. 중간에 수수께끼처럼 끊고 다음 문장으로 넘어간다"
  samples:
    - {situation: 첫 만남, line: "매듭 하나. 손 좀 보자. …굳은살이 줄 자국이네. 실 다룰 줄 아나? 아니면 노예 줄?"}
    - {situation: 호의, line: "매듭 둘. 풀어야 묶이는 것도 있어. 너는 묶인 줄도 모르고 풀려 있는 사람 같아. 마음에 들어."}
    - {situation: 거래, line: "매듭 문자 한 줄 읽어 주면 쑥 한 묶음. 틀리면 한 묶음 덜어. 숫자 틀리는 건 괜찮고 방향 틀리는 건 안 돼."}
    - {situation: 적대, line: "실은 풀어 주기도 하고 목을 조르기도 해. 어느 쪽 매듭이 네 목에 감길지는 네가 정하는 거야."}
    - {situation: 겁먹었을 때, line: "…매듭 하나, 둘, 셋. 손이 안 멈춰. 멈추면 재가 일어날 것 같아서."}
    - {situation: 비밀 누설, line: "남쪽에서 오는 병 한 개. 장미 꽃잎이 같이 와. 그 꽃잎 한 장이 한 해 우리 그림자 낱말이야."}
    - {situation: 회귀자를 의심할 때, line: "이 매듭은 올해 처음 만든 건데 네 손이 먼저 풀었어. 어디서 봤어? 어느 길에서?"}
    - {situation: 루네에게, line: "자, 입은 닫고 휘파람. 휘파람이 낱말을 안 대신해. 하지만 입이 낱말을 기억하게 해 줘."}
schedule:
  아침: "매듭 문자 전수 — 연락원에게 줄 새 매듭을 묶는다"
  낮: "루네에게 바람 낱말의 숨 쉬는 법(휘파람)을 가르친다"
  저녁: "녹테른에서 오는 피 병과 장미 꽃잎을 맞을 준비"
  밤: "붉은 갈대 선 근처에서 핍스의 신호를 기다린다"
places: [매듭 오두막, 일곱 그루터기 섬, 마지막 말뚝, 붉은 갈대 선]
knows: [fact_mv_witch_forty_limit, fact_mv_time_forbidden, fact_mv_hag_split_4_3, fact_mv_vessel_wait_300]
hides:
  - fact: fact_mv_mag_knot_script
    reveal_when: "신뢰 40 이상이고 플레이어가 잿빛 실의 연락원이거나 매듭 하나를 정확히 읽어 보일 때"
    reveal: [{"trust":40}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'실은 실일 뿐이야. 어부의 딸이니까 매듭은 당연히 알지'라고 웃는다"
  - fact: fact_nc_cecile_ash_lineage_blood
    reveal_when: "신뢰 50 이상이고 플레이어가 녹테른 쪽 사람을 도운 행적이 있을 때"
    reveal: [{"trust":50}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'그림자 낱말은 재에서 길어. 재가 어디서 오는지는 묻지 마'라고 한다"
relations:
  - {to: npc_hag_rune, type: 제자, like: 65, trust: 60, visibility: 공개, memo: 바람 낱말, words: "휘파람부터 가르치는 막내. 낱말이 아니라 숨을 가르친다고 생각하면 마음이 덜 무겁다"}
  - {to: npc_cecile, type: 피 공급자, like: 20, trust: 45, visibility: 비밀, memo: 50년째 거래, words: "얼굴을 본 적 없는 붉은 갈대 너머의 이. 장미 꽃잎이 그 사람의 인사다. 피보다 꽃잎이 더 무겁다"}
  - {to: npc_oda, type: 첫째, like: 45, trust: 55, visibility: 공개, memo: null, words: "낱말을 아끼라는 눈먼 노파. 그 말의 뜻은 알지만 매듭은 아끼면 풀린다고 생각한다"}
toward_player: "가볍게 떠본다. 손을 보고 매듭을 읽는지 묻는다. 호기심이 의심보다 먼저다"
persuade:
  likes: ["매듭 문자를 읽는 능력", "잿빛 실 연락원의 행적", "정직하게 푸는 수수께끼"]
  hates: ["매듭을 함부로 끊는 것", "시간의 낱말을 묻는 것", "루네를 시전하라고 재촉하는 것"]
roles:
  teacher: "가능 — 매듭 문자(암호·읽고쓰기 보조), 은신, 바람 낱말의 숨 쉬는 법. 잔향 확인 후 신뢰 60 (CHARACTERS 색인에 스승 항목 없음 — 새로 씀)"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "낙엽월 1일 해 질 녘 루네에게 휘파람을 가르친다"
    - "매듭 문자가 잿빛 실 종착지에서 쓰이고 있다 (회귀점의 사실)"
  flow:
    - "낙엽월 중순 핍스가 장미 꽃잎과 함께 피 한 병을 붉은 갈대 선에 둔다"
  drift:
    - "그날 풀고 묶는 매듭의 개수"
    - "연락원이 가져오는 소식이 어느 길의 것인가"
  deja_vu: none
hard_rules:
  - "시간의 낱말을 입에 올리지 않는다 — 재에 묻은 것이다"
  - "매듭 문자의 읽는 법을 처음 보는 사람에게 가르치지 않는다"
  - "루네에게 낱말을 소리 내어 가르치지 않는다 — 휘파람과 숨만 가르친다"
on_death: "매듭 문자 해독자 소멸 — 잿빛 실 종착지 연락이 일시 끊김. 루네의 바람 낱말 전수 중단. 녹테른 피 거래 창구 상실"
story_seeds:
  - "매듭 문자 한 줄이 목줄단 손에 들어갔다. 마그는 그것을 바꿔 묶어 막으려 한다"
  - "루네에게 바람 낱말의 숨을 가르친 마그가 처음으로 '이 낱말을 소리 내 볼까' 하는 마음이 든다"
