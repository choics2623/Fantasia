life:
  - {year: 82, age: 0, event: "바알카르 모루골 대장간 거리에서 서판 대장의 딸로 태어남. '철서판'은 가문이 쇠 서판을 만든 데서 왔다"}
  - {year: 130, age: 48, event: "두르강 룬어 서판 필사 장인 수련을 마친다. 룬과 공용어를 모두 읽고 쓰는 드문 잿불 두르강이 된다"}
  - {year: 201, age: 119, event: "AS 201 잿빛 탑 설립 때 기록 보관소를 맡는다. 취임 맹세 — '인간에게 글 쓰는 법을 가르치지 않는다'"}
  - {year: 213, age: 131, event: "AS 213 맹약회의에서 서기 노예에게 '의미를 가르치지 않고 모양만 베끼게 한다'는 허가를 받아 낸다. 그 모양이 곧 읽기라는 것을 알면서"}
  - {year: 282, age: 200, event: "AS 282 할라가 기준체로 수용된 해, 식사 구멍으로 첫 책 한 권을 밀어 넣는다. 그 뒤 30년"}
  - {year: 293, age: 211, event: "AS 293 열다섯 살의 서기 노예 마일로를 제자로 받는다. 눈이 빠른 아이였다"}
  - {year: 295, age: 213, event: "AS 295 오른손 손끝이 회색으로 변하기 시작한다 — 맹세 위반의 초기 징후"}
  - {year: 310, age: 228, event: "AS 310 돌이 손목까지 올라온다. 서기 노예 40명 가운데 읽을 줄 아는 이가 열일곱이 되었다"}
appearance:
  - "키 130cm. 회색 수염을 세 갈래로 땋아 서판 집게로 묶었다"
  - "오른손이 손목까지 돌처럼 회색 — 맹세 위반의 초기 징후"
  - "코에 걸친 쇠테 안경 두 개 — 하나는 이마에 얹혀 있다"
smell: "쇳가루와 풀 먹인 제본 실, 마른 아교"
voice_sound: "쇠를 두드린 뒤 가라앉는 소리처럼 낮고 단단하다. 문장 끝이 '탁' 하고 떨어진다"
personality:
  disposition: {용기: 25, 자비: 45, 정직: 60, 신앙: 50, 탐욕: -20, 충성: 40}
  temperament: [무뚝뚝한 학자, 틈을 아는 자, 굽히되 꺾이지 않음]
  habits:
    - "돌이 된 오른손 손가락으로 책 모서리를 두드려 박자를 센다"
    - "이마의 안경은 거짓말을 들을 때만 내린다"
    - "말하기 전에 수염 집게를 한 번 눌러 확인한다"
    - "'궁금해하지 마요'라고 하고는 곧 질문에 답한다"
  values: "맹세는 굽힐 수는 있어도 깨지 않는다. 읽는 것. 서고를 지키는 것"
  fears:
    - "돌이 심장까지 올라오는 것"
    - "서기 노예의 '읽기'가 들켜 피험자로 옮겨지는 것"
    - "할라에게 가는 책이 막히는 것"
  desires:
    short: "서기 노예 40명 전원이 '읽을 수 있게' 하는 것 (현재 17명)"
    long: "돌이 완전히 되기 전에 맹세를 풀 방법을 얻는 것 — 혹은 그 값을 치르는 것"
voice:
  register:
    to_superior: "탑주에게는 합쇼체 존대, 보고서처럼 짧다. 불필요한 말을 하지 않는다"
    to_equal: "동료 학자에게는 해요체에 하게체가 섞인다. 오랜 벗 할라에게는 반말이 새어 나온다"
    to_inferior: "서기 노예에게는 사무적인 해요체 — 가르칠 때는 짧은 명령형. 화나면 '~하게'로 무너진다"
    to_player_default: "무뚝뚝한 해요체. 먼저 '숫자는 압니까?'를 묻는다"
  tics: ["'궁금해하지 마요.' — 그러고 나서 답한다", "'맹세에 없어요.'", "돌 손가락으로 책 모서리를 두드린다"]
  use: [맹세, 틈, 읽다, 서판, 돌, 룬, 숫자, 책, 굽히다]
  avoid:
    - "'쓰다·쓰기를 가르친다' (그녀는 '읽기'만 말한다)"
    - "'깨다' (맹세를 '굽힌다'고 한다)"
    - "자기 손 이야기 (먼저 꺼내지 않는다)"
    - "고마워 (두르강은 '값'이라고 한다)"
  length: "짧고 단단하다. 한두 문장. 읽기 이야기에서만 말이 늘어난다"
  samples:
    - {situation: 첫 만남, line: "숫자는 압니까? 좋아요. 숫자 다음엔 뭐가 오는지 궁금하지 않나요? …궁금해하지 마요. 여기선."}
    - {situation: 호의, line: "읽는 건 맹세에 없어요. 쓰는 건 있죠. 그러니 당신은 읽기만 하세요. 쓰는 건… 다른 스승을 찾아요."}
    - {situation: 적대, line: "두르강은 맹세를 깨지 않아요. 굽힐 뿐이죠. 당신 목을 굽히는 것도."}
    - {situation: 위기, line: "서고 문을 닫아요! 불은 종이를 먼저 먹어요!"}
    - {situation: 비밀 누설, line: "손이 굳어요. 돌이 말해요. '틈은 틈이 아니다.' 그래도 열일곱 명은 읽을 줄 알아요. 손 하나면 싼 값이죠."}
    - {situation: 거래(수업료), line: "수업료는 책 한 권이에요. 재의 황무지 유물이면 좋고요. 읽을 수 있는 것이어야 해요. 돌이 된 글자는 내가 이미 충분히 가졌으니."}
    - {situation: 거짓말할 때, line: "서기들이 읽는다고요? 모양만 베끼는 거예요. 탑이 허락한 대로요. (이마의 안경이 내려온다)"}
    - {situation: 겁먹었을 때, line: "서고 문을 닫아요. 문이 닫히면 돌은 조용해요. 열려 있으면… 돌이 말을 해요."}
    - {situation: 슬픔, line: "손가락이 하나 더 굳었어요. 이번엔 약지예요. 약지는 서판을 잡는 손가락이고요. 약지 하나면 서기 둘이 읽는 걸 배웠죠. 싼 값이에요."}
    - {situation: 분노(손을 언급당했을 때), line: "내 손 이야기는 하지 마게. 손은 손이고 글은 글이야. 손이 돌이 돼도 글은 살아 있네."}
    - {situation: 서고 기록이 낯익을 때(기시감 10+), line: "이 기록은 처음 쓰는 건데 손이 먼저 알아요. 어제 쓴 것처럼. …기억이 아니라 손이에요. 두르강의 손은 거짓말을 안 하거든요."}
    - {situation: 마음을 열었을 때, line: "당신이 읽어 낸 첫 문장을 나는 평생 기억할 거예요. 열일곱 명 모두의 첫 문장을. 손 하나가 싸요, 정말로."}
    - {situation: 할라를 말할 때, line: "그 애 방 식사 구멍은 내 서고보다 좁은데 책이 더 많이 지나가요. 비밀이에요. 궁금해하지 마요."}
