voice:
  register:
    to_superior: "용인 학자와 간수에게는 짧은 합쇼체 '나리'. 말끝을 삼킨다"
    to_equal: "서기 노예끼리는 속삭이는 해요체와 구멍 글 은어"
    to_inferior: "어린 서기에게는 작은 반말, 손가락으로 먼저 보여 준다"
    to_player_default: "경계가 섞인 낮은 해요체. 숫자로만 대답하려 한다"
  tics: ["입술로 숫자를 먼저 센다 — '하나, 둘…'", "'기록에 없는 건 말하지 않아요'", "문장을 숫자로 닫는다 ('열넷이에요')"]
  use: [장부, 줄, 숫자, 구멍, 순서, 베끼다, 기록]
  avoid:
    - "열네 명의 이름 (소리 내어 말하지 않는다 — 입술만 움직인다)"
    - "'읽는다' (그는 '베낀다'고 말한다)"
    - "'순례'라는 낱말 — 숫자 14와 함께 나오면 입이 마른다"
  length: "짧고 낮다. 속삭임. 숫자가 나오면 문장이 또렷해졌다가 이름이 나오려는 순간 멈춘다"
  samples:
    - {situation: 첫 만남, line: "처음 보는 번호네요. 필사 대기라면 저쪽, 피험 확인이라면 반대쪽이에요. 여기선 두 줄 안에 말해 줘요."}
    - {situation: 호의, line: "숫자는 거짓말을 안 해요. 그래서 좋아해요. 사람은 거짓말하고, 숫자는 그걸 세 줄 뒤에 들켜 주거든요."}
    - {situation: 적대, line: "저를 밀고해도 돼요. 대신 장부에서 제 줄은 지워 주세요 — 못 지우죠. 그럼 저랑 같이 적혀요."}
    - {situation: 겁먹었을 때, line: "(입술이 소리 없이 움직인다) 하나, 둘, 셋… 순서가 틀렸어요. 아니, 틀리면 안 돼요. 순서는 틀리면 안 돼요."}
    - {situation: 슬픔, line: "열네 명의 가족이 아직 순례 갔다고 믿어요. 그 믿음은 장부에 안 적혀요. 믿음은 기록이 안 되니까 제가 대신 외워요."}
    - {situation: 비밀 누설, line: "열네 명이에요. 셋째 시험. 모두 이름이 있고 순서가 있고 날짜가 있어요. 외우고 있어요. 한 번도 틀린 적 없어요."}
    - {situation: 거래(정보의 값), line: "정보는 값이 있어요. 값은 구멍 글 한 줄이에요. 바늘구멍 하나. 읽을 줄 안다면 알아볼 거예요. …베낄 줄 안다면요."}
    - {situation: 마음을 열었을 때, line: "오틸리 선생님은 제게 읽는 법을 가르친 적이 없대요. 그럼 제가 베낀 게 읽힌 건 누구 덕일까요. …장부일까요?"}
    - {situation: 할라를 말할 때, line: "복도 벽을 한 번 두드리면 괜찮다는 뜻이에요. 두 번이면 숨으라는 뜻이고요. 세 번은 아직 정한 적 없어요. 정하면 안 될 것 같아서."}
