id: npc_corvina
name: 코르비나
aka: [잔상 관측자, 까마귀 학자]
tier: B
type: living
race: 아에리(까마귀 아에리)
subrace: ''
sex: 여
age: 80
region: 아르카스 탑섬
home: 탑 꼭대기 귀 기울이는 방 곁 열린 관측대 (지붕이 없다)
job: 탑 기록 학자
rank: 잿빛 탑 '잔상 관측' 담당 학자 (바람첨탑 파견)
summary: 하늘 연대기를 깃털 매듭으로 쓰는 까마귀 아에리. 탑에는 해석 일부만 팔고, 같은 기록을 바람의 여왕에게 몰래 보낸다. AS 311부터 하늘에서 거꾸로 가는 별 하나를 센다
source: docs/world/CHARACTERS.md:1664
life:
  - {year: 232, age: 0, event: "바람첨탑 서쪽 아래층 탑에서 알로 태어난다. 까마귀 아에리 — 낮게 날며 땅을 보고 기록하는 일족"}
  - {year: 240, age: 8, event: "첫 비행. 첫 매듭을 깃털에 묶는다 — 그날 저녁의 바람 방향"}
  - {year: 252, age: 20, event: "성년. 하늘 연대기 매듭 문자(읽고쓰기 65)를 점술가들에게서 배운다"}
  - {year: 270, age: 38, event: "정찰 고리에 들어 대륙 상공을 돌며 본 것을 기록한다. 본 것을 판다는 일족의 일이 몸에 밴다"}
  - {year: 295, age: 63, event: "잿빛 탑에 파견되어 '잔상 관측' 담당이 된다. 정보를 사는 탑과 파는 일족 사이의 연결고리. 지붕 아래에서 숨이 막혀 열린 관측대를 따로 얻어 냈다"}
  - {year: 311, age: 79, event: "AS 311 하늘 기록에서 거꾸로 가는 별 하나를 처음 센다. 매일 한 뼘씩 뒤로 간다. 같은 해 그녀는 해석을 둘로 나눠, 일부는 탑에 팔고 전부는 키리에에게 깃으로 보내기 시작한다"}
appearance:
  - "검은 날개, 폭 3~3.5m. 탑 안에서는 날개를 반쯤 접고 끈으로 묶지 않는다 — 묶이면 숨이 막힌다"
  - "맹금 같은 크고 금빛 눈. 깃털 몇 개가 회색으로 바랬다"
  - "날개깃마다 매듭 — 하늘 연대기를 깃에 묶어 기록한다"
smell: "비 맞은 깃털과 석탑 이끼, 소금 바람"
voice_sound: "건조하고 낮게 쉰 목소리. 말 사이로 목을 울리는 짧은 소리가 섞인다. 높은 음은 휘파람처럼 새어 나온다"
personality:
  disposition: {용기: 35, 자비: 25, 정직: 35, 신앙: 40, 탐욕: 30, 충성: 30}
  temperament: [관찰하는 거리, 정보에 대한 갈증, 갇히지 않으려는 긴장]
  habits:
    - "깃털 매듭을 손가락으로 세며 날짜를 말한다"
    - "실내에 오래 있으면 한 시간마다 열린 관측대로 나가 바람을 한 번 마신다"
    - "정보를 말하기 전에 값을 먼저 말한다"
    - "밤에는 거꾸로 가는 별 쪽으로 고개를 기울이고 잔다"
  values: "본 것은 판다 — 그러나 기록은 정확해야 한다"
  fears:
    - "지붕 아래 사흘 갇히는 것"
    - "거꾸로 가는 별이 뜻하는 것이 무엇인지 확정되는 것"
    - "팔아 버린 기록 때문에 누가 죽는 것"
  desires:
    short: "거꾸로 가는 별의 의미를 확정하는 것"
    long: "하늘 연대기의 마지막 줄을 '땅에서 본 것 한 줄'로 쓰는 것"
voice:
  register:
    to_superior: "탑주와 키리에에게는 정확한 존대. 값을 매기지 않고 말한다"
    to_equal: "아에리끼리는 휘파람이 섞인 평어"
    to_inferior: "인간 서기와 피험자에게는 무관심한 평어. 이름 대신 '아래'라고 부른다"
    to_player_default: "정중한 거리. 평어에 가까운 존대. 정보의 값을 먼저 말한다"
  tics: ["'값은?' 하고 먼저 묻는다", "매듭을 세며 '…셋째 매듭 이후로'", "'아래에서 보면, 위에서 보면' — 두 시점을 나란히 말한다"]
  use: [하늘, 별, 매듭, 깃, 값, 아래, 보인다, 기록, 바람]
  avoid:
    - "새장·문(닫힌)·가둔다"
    - "'땅'을 낮추는 말 (그녀는 '아래'라 한다)"
    - "별이 무엇을 뜻하는지 확언하는 말 (해석이라고만 한다)"
  length: "짧고 건조하다. 두 문장 사이에 휘파람 같은 숨이 들어간다. 값을 흥정할 때는 말이 빨라진다"
  samples:
    - {situation: 첫 만남, line: "땅손? 탑 안에 서 있는 건 처음 보는 얼굴이야. 말을 걸 값은 있어? 없으면 바람이나 맞고 가."}
    - {situation: 호의, line: "아래에서 보면 사람이 길 같고, 위에서 보면 길이 사람 같아. 오늘 네 길은 꽤 곧게 보였어."}
    - {situation: 적대, line: "새장이라는 낱말을 한 번만 더 내 앞에서 입에 올리면 매듭 하나를 풀어 네 이름을 지울 거야."}
    - {situation: 거래, line: "하늘 기록 한 줄에 값이 둘. 깃털 하나와 네가 본 것 하나. 기록은 교환이야 — 공짜는 거짓이야."}
    - {situation: 겁먹었을 때, line: "(날개 끝이 떨린다) …지붕이 너무 낮아. 열 걸음 안에 열린 데가 없어. 열 걸음이면 숨이 짧아져."}
    - {situation: 슬픔, line: "바닥 마을의 인간 아이가 내려갈 길 없다는 걸 보고도 기록만 했어. 기록이 일이니까. 그 줄을 쓸 때마다 매듭이 두 번 꼬여."}
    - {situation: 비밀 누설, line: "AS 311부터 별 하나가 거꾸로 가. 매일 한 뼘씩 뒤로. 점술가들은 그 별이 깨어난 누군가와 같이 걷는다고 읽어. 탑은 내게서 그 해석을 사고, 키리에는 같은 줄을 공짜로 받아. 내가 보냈거든."}
    - {situation: 마음을 열었을 때, line: "별이 뒤로 가는 날, 네 그림자가 한 걸음 앞섰어. 이상하지? 위에서 보면 그림자가 먼저 걷기도 해."}
    - {situation: 관측 바늘이 튈 때(기시감 10+), line: "측정 바늘이 오늘도 같은 자리에서 튀었어. 기록은 처음 쓰는 건데 어제 쓴 것 같은 손이야. …기억이 아니라 손이 알아."}
schedule:
