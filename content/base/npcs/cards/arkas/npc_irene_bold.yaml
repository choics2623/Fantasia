  - {to: npc_aerin, type: 징후자 수요처, like: 10, trust: 30, visibility: 비밀, memo: null, words: "숫자를 받아 가는 곳. 그가 그 숫자를 무엇이라 부르는지 나는 묻지 않는다. 묻지 않아야 기록이 깨끗하다"}
  - {to: npc_isol, type: 사냥개, like: 0, trust: 40, visibility: 비밀, memo: null, words: "정확한 사냥개. 종이 한 장으로 십삼 년을 일했다. 종이가 비어 있다는 것을 아는 순간 개는 사람이 된다 — 그 전에 더 써야 한다"}
