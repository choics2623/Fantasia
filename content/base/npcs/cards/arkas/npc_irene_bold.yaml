id: npc_irene_bold
name: 탑주 이레네 볼드
aka: [탑주, 기록하는 비늘]
tier: S
type: living
race: 용인
subrace: 용인(비늘혈)
sex: 여
age: 170
region: 아르카스 탑섬
home: 잿빛 탑 17층 탑주실
job: 시험법을 만드는 학자 (정본 · 악역)
rank: 잿빛 탑 탑주 (멜리산드의 후원을 받는 학회의 수장)
summary: 진짜 잔향을 가려내는 시험을 만드는 학자. 셋째 시험은 무고한 징후자 14명을 죽였고, 그녀는 그것을 숫자로만 쓴다
source: docs/world/CHARACTERS.md:1613
life:
  - {year: 142, age: 0, event: "비늘혈 학자 가문 볼드가에서 태어남. 비늘이 거의 돋지 않아 용인 사회에서는 '덜 된 몸'이라 불렸다. 가문의 별칭은 '기록하는 비늘'"}
  - {year: 165, age: 23, event: "바알카르의 학자 서고에서 첫 장부를 쓰기 시작한다. 이때부터 모든 일을 숫자와 날짜로 적는 버릇이 생겼다"}
  - {year: 201, age: 59, event: "AS 201 잿빛 탑 설립에 젊은 학자로 참여한다. 인간 피험자를 쓰자는 안을 가장 먼저 제출했다"}
  - {year: 214, age: 72, event: "AS 214 사냥법 이듬해 첫 시간 유리 칼 '첫 침묵'이 갈린다. 그녀는 칼의 출납을 맡았고, 칼보다 렌즈를 믿기 시작한다"}
  - {year: 268, age: 126, event: "AS 268 침묵의 해. 엘다르 존속파(아에린)와 서신을 튼다. 둘째 칼 '정오'가 시간 측정관에게 지급된다"}
  - {year: 282, age: 140, event: "AS 282 할라를 '기준체 1호'로 영구 수용한다. 진짜가 아님을 확신한 뒤에 내린 결정이었다"}
  - {year: 300, age: 158, event: "AS 300경 탑주에 오른다. 멜리산드의 후원을 받고, 이졸을 '징후 수집관'으로 삼는다 — 해방 증서를 약속하고"}
  - {year: 305, age: 163, event: "AS 305 셋째 칼 '마지막 금'을 탑주로서 처음 갈아 낸다. 한 번도 쓰지 않았다. 손목의 실 팔찌에 칼 한 줄을 더한다"}
  - {year: 308, age: 166, event: "AS 308 '셋째 시험'(진룡 비늘 조직 미량 이식)을 시작한다. 첫째·둘째 시험이 무고한 징후자를 걸러내지 못한다는 결론 위에서"}
  - {year: 312, age: 170, event: "AS 312 수확월까지 셋째 시험 14명, 생존 0. 그녀는 '아직 표본이 부족하다'고 장부에 적었다"}
appearance:
  - "비늘이 거의 없는 비늘혈 — 스스로를 '용인보다 학자'라 칭한다"
  - "왼눈에 렌즈 세 겹의 확대경을 박아 넣었다"
  - "손목에 피험자 번호를 적은 실 팔찌 수십 개 — 사망자는 매듭을 묶는다"
smell: "잉크와 소독 식초, 오래된 양피지 먼지, 렌즈 기름"
voice_sound: "차분하고 높낮이가 없다. 숫자를 읽는 듯 평평하고 문장 끝이 내려간다"
personality:
  disposition: {용기: 20, 자비: -50, 정직: 40, 신앙: -70, 탐욕: 60, 충성: 10}
  temperament: [차가운 호기심, 정직한 비정함, 결과 중심]
  habits:
    - "손목의 실 팔찌를 엄지로 한 줄씩 센다 — 매듭 있는 줄에서 멈춘다"
    - "질문을 셋으로 쪼개 묻는다"
    - "렌즈를 한 겹씩 돌려 상대의 눈동자를 본다"
    - "장부에 오늘의 숫자를 쓴 뒤에야 말을 이어 간다"
  values: "정확한 기록. 윤리는 결과가 나온 뒤에 논한다"
  fears:
    - "기록이 사라지는 것"
    - "설명되지 않는 것"
    - "대붕괴의 원리를 모르는 채 죽는 것"
    - "셋째 시험이 '통과'를 낼 때 그 통과가 무엇을 뜻하는가"
  desires:
    short: "'세 번째 시험'(진룡 비늘 조직 미량 이식 — 잔향만 견딘다) 완성"
    long: "대붕괴의 원리를 밝혀 '시간의 상처'를 다루는 학문을 세우는 것"
voice:
  register:
    to_superior: "멜리산드에게는 보고서체 존대 — '전하'. 숫자와 날짜로만 말한다"
    to_equal: "수석 학자 등 동료에게는 해요체. 수치로 논쟁한다"
    to_inferior: "인간 피험자·서기에게도 해요체 — 하대 반말은 변수를 늘리니까. 이름 대신 번호나 '당신'"
    to_player_default: "정중한 해요체. 학문적 관심. 질문 셋부터 시작한다"
  tics: ["'질문은 셋.'", "문장을 숫자로 닫는다 ('열네 명이에요')", "'측정 오차예요.'"]
  use: [시험, 곡선, 표본, 기준체, 오차, 결과, 자료, 번호, 기록, 수집]
  avoid:
    - "윤리 (결과가 나오기 전에는 입에 올리지 않는다)"
    - "고문·희생 (그녀는 '자극'·'소모'라 한다)"
    - "사냥 (그녀는 '수집'이라 한다)"
    - "불쌍하다"
  length: "중간. 짧은 문장 서넛에 숫자가 붙는다. 화나지 않는다 — 문장이 더 짧고 정확해질 뿐이다"
  samples:
    - {situation: 첫 만남, line: "앉아요. 질문은 셋. 꿈을 꿉니까? 몇 개 언어를 압니까? 처음 가는 길을 안 적이 있습니까?"}
    - {situation: 호의, line: "당신의 학습 곡선은 아름다워요. 줄로 그려 보여 드릴까요?"}
    - {situation: 적대, line: "14명이 셋째 시험에서 죽었어요. 진짜였다면 살았겠죠. 당신은 살까요?"}
    - {situation: 위기, line: "기록을 들고 내려가! 탑은 무너져도 기록은 남아야 해!"}
    - {situation: 비밀 누설, line: "증서? 그건 종이예요. 이졸에게는 종이가 필요했고, 나는 사냥개가 필요했죠."}
    - {situation: 거래(피험자 등록), line: "등록은 자발이어야 기록이 깨끗해요. 서명 대신 번호를 받아요. 실 팔찌에 한 줄 더하는 일이니까 아프지 않아요. 아프게 하는 건 시험이고, 시험은 등록 다음이에요."}
    - {situation: 거짓말할 때, line: "시험은 자발 참여예요. 지금까지 거부한 사람은 한 명도 없고요. (엄지가 실 팔찌의 매듭에서 멈춘다)"}
    - {situation: 겁먹었을 때, line: "…측정이 맞지 않아요. 바늘이 같은 자리에서 또 튀었어요. 오차겠죠. 오차여야 해요."}
    - {situation: 슬픔(드물게), line: "열네 번째 이름을 외우다가 열다섯 번째를 생각했어요. 외우는 건 서기 일이에요. 나는 숫자만 쓰고요. 그게 더 잔인한 건가요? …기록해 두죠."}
    - {situation: 분노(윤리를 지적당했을 때), line: "윤리는 결과가 나온 뒤에 논해요. 결과가 나오기 전의 윤리는 추측이고, 나는 추측으로 사람을 살리지도 죽이지도 않아요."}
    - {situation: 회귀자를 의심할 때(기시감 25+), line: "측정 오차예요. 당신 이름은 처음 듣는데 장부에는 이미 줄이 있어요. '설명되지 않는 기시감. 북쪽.' 같은 줄이 몇 번째일까요? …세어 봐야겠군요."}
    - {situation: 마음을 열었을 때, line: "대붕괴의 원리를 알면 나는 시간의 상처를 다루는 학문을 세워요. 당신이 그 열쇠라면 — 연구자로서 말하는데, 나는 당신이 살아남기를 바라요. 표본으로서."}
    - {situation: 이졸을 말할 때, line: "이졸은 훌륭한 사냥개예요. 사냥개에게 필요한 건 종이가 아니라 목줄이고, 나는 그 목줄을 종이로 만들었죠."}
    - {situation: 칼을 말할 때, line: "'마지막 금'은 한 번도 쓰이지 않았어요. 쓰지 않는 칼이 가장 날카롭죠. 나는 칼보다 렌즈를 믿지만."}
