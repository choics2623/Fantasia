  - {to: npc_ottilie, type: 수석 학자, like: 30, trust: 50, visibility: 공개, memo: null, words: "맹세 때문에 손이 굳어 가는 동료. 읽기만 가르친다는 것을 안다. 모르는 척하는 값은 그녀의 서고에서 나온다"}
  - {to: npc_mateus, type: 경쟁 사냥꾼, like: -20, trust: 10, visibility: 공개, memo: null, words: "불로 확인하는 사냥꾼. 나는 렌즈로 확인한다. 같은 표본을 다른 방식으로 낭비한다"}
toward_player: "학문적 관심. 질문 셋부터 시작하고, 쓸모를 숫자로 잰다"
persuade:
  likes: ["새로운 자료 (+30)", "대붕괴 정보 (+40)", "정확한 숫자", "기록을 존중하는 태도"]
  hates: ["실험의 비윤리를 지적하는 것 ('윤리는 결과가 나온 뒤에 논한다')", "기록을 훼손하겠다는 말", "'측정 오차'를 비웃는 것"]
