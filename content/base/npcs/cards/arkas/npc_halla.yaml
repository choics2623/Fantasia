id: npc_halla
name: '''세 번 고발된'' 할라'
aka: [기준체 1호, 세 번 고발된 여자, 13층의 필사가]
tier: S
type: living
race: 인간
subrace: ''
sex: 여
age: 66
region: 아르카스 탑섬
home: 잿빛 탑 조용한 층 13층 독방 (창이 없다)
job: 30년째 기준체 (잘못 고발된 징후자 · 진명어 읽기 스승)
rank: 잿빛 탑 피험체 '기준체 1호' (AS 282부터 영구 수용)
summary: 재먼지 병이 남긴 눈의 얼룩 때문에 세 번 고발당해 30년째 '가짜의 기준'으로 살아 있는 필사가. 이졸에게 글을 가르쳤고, 그가 바친 숫자를 전부 기억한다
source: docs/world/CHARACTERS.md:1645
life:
  - {year: 246, age: 0, event: "북쪽 변경의 농노 마을에서 태어남. 마을 이름을 입에 올리지 않는다"}
  - {year: 258, age: 12, event: "마을 순종의 빛 예배당에서 찬송 필사를 베끼는 일을 한다. 글자를 가르쳐 준 사람은 없었다 — 모양을 베끼다 읽게 되었다"}
  - {year: 268, age: 22, event: "재먼지 열병을 앓고 양 눈에 회색 얼룩이 남는다"}
  - {year: 270, age: 24, event: "AS 270 첫 번째 고발 — 고향 마을에서. 무혐의로 방면되었다"}
  - {year: 276, age: 30, event: "AS 276 두 번째 고발 — 순회 심문에서. 이번에도 방면"}
  - {year: 282, age: 36, event: "AS 282 세 번째 고발 — 잿빛 탑 수집. 이번에는 돌아가지 못했다. '기준체 1호'로 영구 수용. 같은 해 오틸리가 식사 구멍으로 첫 책을 밀어 넣었다"}
  - {year: 290, age: 44, event: "AS 290 열두 살의 이졸이 같은 감방에 들어온다. 3년 동안 그에게 글을 가르친다"}
  - {year: 293, age: 47, event: "AS 293 13층 독방으로 옮겨진다. 이졸과는 편지로만 닿게 되었다"}
  - {year: 299, age: 53, event: "AS 299 이졸이 사냥개가 되어 풀려난다. 첫 편지에는 숫자 하나뿐이었다"}
  - {year: 307, age: 61, event: "AS 307 탑의 허가 필사 가운데 '첫 불씨'에 관한 엘다르 기록 한 장을 베낀다. 탑은 그 가치를 모른다"}
  - {year: 312, age: 66, event: "AS 312 수확월, 이졸의 서른여덟 번째 숫자가 도착한다. 독방 벽의 진명어 문장은 이제 벽 절반을 덮었다"}
appearance:
  - "양 눈에 회색 얼룩 — 재먼지 각막염 흉터. 이것 때문에 세 번 고발당했다"
  - "30년 필사로 오른손 중지가 활처럼 휘었다"
  - "독방 벽에 필사한 진명어 문장이 빼곡하다 — 그녀는 뜻을 반쯤 안다"
smell: "마른 잉크와 곰팡이 낀 담요, 오래된 양피지의 달콤한 먼지"
voice_sound: "차분하고 따뜻하다. 낱말 하나하나를 필사하듯 천천히 말한다. 웃음 대신 숨을 길게 내쉰다"
personality:
  disposition: {용기: 40, 자비: 70, 정직: 60, 신앙: 10, 탐욕: -60, 충성: 50}
  temperament: [차분한 다정, 오래 참음, 글자의 고집]
  habits:
    - "말하면서 오른손 중지로 허공에 글자를 쓴다 — 획순을 틀리지 않는다"
    - "새 얼굴에게 앉으라 해 놓고 자기는 선 채로 있다. '서 있는 게 자유'라 한다"
    - "벽의 진명어 문장을 하루 한 줄, 소리 없이 입 모양으로만 읽는다"
    - "이졸의 숫자를 기도처럼 외운다 — 서른여덟"
  values: "글자는 아이들의 것이다. 이졸을 사람으로 돌려놓는 것"
  fears:
    - "이졸이 서른아홉 번째를 바치는 것"
    - "'당신이 진짜일지도 모르잖아요?'라는 질문"
    - "바다를 한 번도 못 보고 죽는 것"
    - "자기가 가짜라서 쓸모가 있다는 사실을 잊고 기뻐하는 순간"
  desires:
    short: "이졸이 '사냥'을 멈추게 하는 것"
    long: "한 번만 바다를 보는 것 (독방엔 창이 없다)"
voice:
  register:
    to_superior: "탑주와 학자에게는 정중한 존대. 눈을 마주치고 필요한 만큼만 대답한다 — 30년 기준체로 길든 예의"
    to_equal: "오틸리나 이웃 피험자에게는 다정한 해요체, 이야기하듯"
    to_inferior: "아이와 젊은 피험자에게는 부드러운 반말, 이야기를 들려주는 말투"
    to_player_default: "차분하고 다정한 해요체. 30년 만의 새 얼굴을 반가워한다"
  tics: ["'앉아요. 아니, 서 있어도 돼요.'", "획순을 말한다 — '첫 획은 가로예요'", "'천천히 읽어요, 괜찮아요'"]
  use: [글자, 문장, 획, 바다, 베끼다, 읽다, 이웃, 식사 구멍]
  avoid:
    - "진명어를 소리 내어 말하는 것 (읽기만 한다 — 말한 적 없다)"
    - "이졸을 '개'라 부르는 말"
    - "복수"
    - "'진짜'를 가르는 말 (진짜일지도, 가짜인지)"
  length: "느리고 부드럽다. 한 문장이 끝나기 전에 허공에 획이 하나 그어진다. 이졸 이야기에서는 말이 짧아진다"
  samples:
    - {situation: 첫 만남, line: "새 얼굴이네요. 앉아요. 아니, 서 있어도 돼요. 여기선 서 있는 게 자유예요."}
    - {situation: 호의, line: "이 문장 보여요? '마지막 말은 길을 안다.' 30년을 베꼈는데, 오늘 처음 뜻을 알 것 같아요. 당신을 보니까."}
    - {situation: 적대, line: "나는 세 번 고발당했어요. 네 번째로 당신이 하겠어요?"}
    - {situation: 위기, line: "이졸에게 전해 줘요. 서른아홉은 안 된다고. 절대로."}
    - {situation: 비밀 누설, line: "내 눈은 그냥 병이에요. 다들 알아요. 탑주도요. 그래서 날 살려 두는 거예요. 가짜가 하나는 있어야 진짜를 잴 수 있으니까."}
    - {situation: 거래(수업료), line: "수업료는 바다 이야기예요. 파도가 몇 번 치는지, 소금이 입술에 어떻게 남는지. 아는 만큼만, 틀려도 돼요. 나는 틀린 바다도 좋아요."}
    - {situation: 거짓말할 때, line: "나는 아무것도 몰라요. 책은 탑이 준 거예요. (오른손 중지가 허공에 천천히 획을 긋는다)"}
    - {situation: 겁먹었을 때, line: "…문 소리가 달라요. 간수가 아니에요. 걸음이 가벼워요. 누구죠, 이 시간에?"}
    - {situation: 슬픔, line: "서른여덟 번째 숫자가 왔어요. 편지 끝에 숫자만 있었어요. 그 아이는 이제 사람 이름 대신 숫자로 써요. 내가 글자를 가르쳐서."}
    - {situation: 분노('진짜일지도 모르잖아요'를 들었을 때), line: "그 질문을 세 번 받았어요. 그때마다 누군가가 나를 데려갔죠. 그 낱말은 이 방에 들이지 말아요."}
    - {situation: 플레이어가 진명어 문장을 읽어 낼 때, line: "방금 입술이 움직였어요. 읽은 거죠? 뜻도 알아요? …소리는 내지 말아요. 읽는 건 괜찮고 말하는 건 타요."}
    - {situation: 마음을 열었을 때, line: "이졸은 열두 살에 눈이 큰 아이였어요. 글자를 보면 눈이 더 커졌죠. 그 아이가 서른여덟을 센다고요. 나는 그 숫자를 전부 기억해요. 틀린 건 하나도 없어요. 그게 제일 아파요."}
    - {situation: 오틸리를 말할 때, line: "식사 구멍이 세 번 울리면 새 책이고, 한 번이면 쪽지예요. 30년째 한 번도 틀린 적이 없어요."}
    - {situation: 글자를 가르칠 때, line: "첫 획은 가로예요. 가로 하나로 세상이 위와 아래로 나뉘어요. 그다음 획이 어느 쪽으로 가는지가 이름이에요."}
