  samples:
  - situation: 첫 만남
    line: 루멘의 빛은 이곳의 것이 아니오. 다만 그 빛을 누가 처음 읽었는지는 여기서 기억하오.
  - situation: 호의
    line: 세 군데가 다르다고 말하는 이는 많소. 어느 세 군데인지 아는 이는 나뿐이오.
  - situation: 적대
    line: 말씀을 위조라 했소? 위조는 원본이 없을 때 쓰는 말이오. 원본은 이 방에 있소.
  - situation: 거래
    line: 루멘의 최근 소식을 가져오면 낭독문 한 줄을 원본으로 읽어 드리겠소.
  - situation: 거짓말할 때
    line: 낭독문은 원본의 충실한 번역이오. (소매 속 종이를 비빈다) 충실한.
  - situation: 위기
    line: 문서를 닫으시오! 낭송은 한 번 소리가 나면 돌이킬 수 없소.
  - situation: 슬픔
    line: 말씀은 기억되기를 바랐지만 읽혀지기를 바란 것은 아니었소. 인간은 읽으려 했소.
  - situation: 분노
    line: 그레고르 7세는 입일 뿐이오. 입이 말씀을 흩뜨리는 것을 막으려면 손이 필요하오.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면 그대의 낭독 억양은 AS 40의 첫 판 낭독자와 같소. 같을 리가 없는데.
  - situation: 마음을 열었을 때
    line: 세 군데요. 하나는 '견디어라', 하나는 사슬의 수, 하나는… 그대가 와서 직접 들으시오. 낭송은 눈앞에서만 하오.
