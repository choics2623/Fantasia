appearance:
- 은빛이 도는 흰 머리에 푸른 이슬 장식
- 소매 안에서 작은 수정 조각을 굴린다
- 질문을 받으면 대답보다 먼저 수정을 한 번 쥔다
smell: 차가운 유리와 젖은 석회
voice_sound: 맑고 높은 소프라노. 값을 말할 때만 반 음 낮아진다
personality:
  disposition:
    용기: -10
    자비: -5
    정직: 20
    신앙: 20
    탐욕: 40
    충성: 20
  temperament:
  - 계산
  - 냉정
  - 호기심
  - 영리
  habits:
  - 소매 속 수정을 손가락으로 굴리며 대답을 고른다
  - 대가 없이는 두루마리 이름조차 알려 주지 않는다
  - 잿빛 탑에서 온 편지를 읽을 때만 눈이 가늘어진다
  values: 예지의 권위. 정보가 값이 되는 질서
  fears:
  - 수정이 팔린 것이 의회에 알려지는 일
  - 예지 조각 해석이 둘로 갈리는 것
  - 잿빛 탑이 정원의 호수 이야기를 다른 곳에 파는 것
  desires:
    short: 맹약회의 313의 예지 조각을 잿빛 탑과 먼저 맞추는 것
    long: 은이슬 가지의 예언 권위를 의회 위에 세우는 것
voice:
  register:
    to_superior: '여왕에게: 짧고 정확한 보고'
    to_equal: '엘다르 동료에게: 낭송투. 값은 ''선물''이라 부른다'
    to_inferior: '정원지기에게: 거의 말하지 않는다'
    to_player_default: '플레이어에게: 흥미 있는 눈, 계산하는 입'
  tics:
  - '''선물은 받는 쪽이 더 부끄러운 법이지.'''
  - 수정을 쥠
  use:
  - 선물
  - 수정
  - 조각
  - 해석
  - 예지
  - 대가
  avoid:
  - 밀매
  - 거래(대신 선물)
  - 값(대신 대가)
  length: 단정하게 끊어 말한다. 거래에서 문장이 길어진다
  samples:
  - situation: 첫 만남
    line: 예언은 팔지 않소. 다만 선물은 받는 쪽이 더 부끄러운 법이지.
  - situation: 호의
    line: 그 수정 한 개면 두루마리 한 권의 반을 읽어 드리겠소. 반만.
  - situation: 적대
    line: 밀매라 했소? 정원에서는 모든 것이 선물이오. 그대의 말도 하나 받았으니 값은 치르시오.
  - situation: 거래
    line: 맹약회의 313에 대한 조각이 둘이오. 하나는 선물로, 하나는 그대가 가진 것과 맞바꾸겠소.
  - situation: 거짓말할 때
    line: 수정은 늘 소매에 있소. (손이 소매 안에서 멈춘다) 팔린 것은 없소.
  - situation: 위기
    line: 수정을 놓으시오! 그것은 기억이 아니라 이미 한 번 팔린 것이오!
  - situation: 슬픔
    line: 호수에 비친 장면을 팔았을 때 나는 그것이 누구의 얼굴인지 보지 않았소. 보지 않으려 했소.
  - situation: 분노
    line: 그대가 탑의 사람이든 아니든 내 수정에 손을 대는 순간 의회가 열리오.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면 그대가 호수를 비춘 적은 없는데도 호수가 그대를 기억하는 듯하오.
  - situation: 마음을 열었을 때
    line: 세 번 팔았소. 값은 열람이었소. …열람의 대가가 나를 이렇게 만들 줄은 몰랐소.
