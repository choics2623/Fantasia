on_death: 은이슬 서고 관리가 이벨린에게 넘어가 복원실이 드러날 위험이 오른다. 잿빛 탑과의 정보 통로 하나가 끊긴다
story_seeds:
- 호수 수정의 값은 플레이어의 정체다. 잿빛 탑이 이미 알고 있다는 사실을 알게 되는 순간 이졸의 보고가 의미를 바꾼다
- 세 번째 수정은 아직 탑 금고에 있다 — 되찾으면 정체가 덜 드러난다
- 그녀가 긴밤월에 탑으로 가는 길에 호송대가 필요하다
