summary: 빈 마지막 음 앞에서 늘 숨을 멈추는 이슬 노래 지도자. 80명의 회원을 이름이 아니라 음으로 안다
source: docs/world/people/silvaren.md
life:
- year: 260
  age: 0
  event: 이슬 우리 17동에서 태어남. 어머니가 이슬 단지 나르는 소리로 자장가를 불렀다
- year: 272
  age: 12
  event: 이슬 줍기 시작. 처음으로 '틀리게 부르기'를 배움
- year: 281
