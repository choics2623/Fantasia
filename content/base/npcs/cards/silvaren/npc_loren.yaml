- year: 300
  age: 40
  event: 노래 회원이 쉰을 넘음. 어머니의 마지막 음이 비어 있음을 알게 됨
- year: 309
  age: 49
  event: '''보리''를 처음 정지에 보냄 — 일부러. 그것이 미라를 위한 어긋남이었다'
- year: 311
  age: 51
  event: 미라의 네 번째 의식이 끝난 밤 처음으로 노래를 틀리게 불렀다
- year: 312
  age: 52
  event: 회원 약 80. 아이 열둘에게 음을 가르치는 중 (낙엽월 1일 기준)
appearance:
- 이슬 우리 사람 중 가장 곧은 어깨
- 손바닥에 굳은살 대신 이슬 단지 자국이 둥글게 남았다
- 말하다 멈출 때 목울대가 한 번 오르내린다
smell: 이슬 젖은 흙과 흰 빵 냄새
voice_sound: 낮고 부드러운 목소리. 문장 끝을 일정한 음으로 맺는다
personality:
  disposition:
    용기: 35
    자비: 60
    정직: 20
    신앙: 10
