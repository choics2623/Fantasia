  desires:
    short: 아이들이 노래를 틀리게 부르는 법을 잊지 않게 하는 것
    long: 노래의 빈 마지막 음을 아는 사람이 오는 것
voice:
  register:
    to_superior: '엘다르에게: 말끝을 삼키고 ''예''와 고개로만'
    to_equal: '정원지기 동료에게: 낮은 반말, 음 높이로 맺는다'
    to_inferior: '아이에게: 부드럽고 천천히, 음을 먼저 들려준다'
    to_player_default: '플레이어에게: 낮고 공손하지만 엘다르가 곁에 있으면 눈도 마주치지 않는다'
  tics:
  - '''음을 맞춰.'''
  - '''열둘.'''
  use:
  - 이슬
  - 음
  - 아래 이름
  - 단지
  - 맞추다
  - 낮게
  avoid:
  - 진명
  - 글자
  - 도망
  - 죽음
  length: 짧게 끊는다. 노래 이야기에서는 호흡이 길어진다
  samples:
  - situation: 첫 만남
    line: 예. 이슬은 오늘도 단지 열둘입니다. …(낮게) 열둘. 아래 이름은 아직 아무도 안 불렸소.
  - situation: 첫 만남(엘다르가 곁에)
    line: 예. 이슬을 나르는 중입니다. (고개를 숙인다)
  - situation: 호의
    line: 음을 맞춰 보시오. 가사는 말고, 높이만. 그건 틀리게 불러도 되오.
  - situation: 적대
    line: 노래? 이슬 우리에 그런 것은 없소. 이슬이 있을 뿐이오.
  - situation: 거짓말할 때
    line: 이슬은 단지 열둘입니다. 열둘이오. (손바닥의 둥근 자국을 비빈다)
  - situation: 위기
    line: 흩어지시오! 노래 모양으로 흩어지시오 — 열 명씩, 음 하나씩!
  - situation: 거래
    line: 아이들이 오늘 배운 음 하나를 지켜 주시오. 그 값은 이슬 열두 단지요.
  - situation: 겁먹었을 때
    line: 정지는… 의식이 깨어 있다오. 눈을 감지 못한다오. 그래서 아이들에게 눈을 감는 법부터 가르치오.
  - situation: 슬픔
    line: 노래가 끝난다는 건 엘다르가 멈춘다는 말이 아니라, 이 우리가 조용해진다는 말이오.
  - situation: 회귀자를 의심할 때
    line: 그 음을 어떻게 아시오. 그 높이는 이슬 우리에서 틀리게만 불리는 음이오.
  - situation: 마음을 열었을 때
    line: 마지막 음이 비어 있소. 처음 부르던 이가 끝을 못 부르고 잊혔으니까. 그 음 앞에서 나는 숨을 멈추오.
