id: npc_silvanus
name: 실바누스 고목
aka: [순혈파 수장, 별을 세는 노인]
tier: A
type: living
race: 엘다르
subrace: 별빛 엘다르
sex: 남
age: 3100
region: 실바렌
home: 고요한 숲 석탑
job: 존엄한 소멸을 말하는 자 (시간 마법 스승)
rank: 순혈파 수장 (지지 엘다르 약 4,500)
summary: 엘다르는 도둑질 없이 사라져야 한다고 말하는 노인. 정원지기 데인이 자기 아들이라는 사실만은 입 밖에 내지 못한다
source: docs/world/CHARACTERS.md:1252
life:
  - {year: -2788, age: 0, event: "SK 300경, 별빛 엘다르 고목 가문에서 태어남. 신살 이후 세대라 신살을 보지 못했다 — 그것이 그가 여왕에게 평생 묻지 못한 질문의 뿌리"}
  - {year: 0, age: 2788, event: "AS 0 대붕괴. 찢어진 시간의 가장자리를 보고 '시간의 진명이 한 사람의 입에서 나왔다'는 것을 안다. 아스테리온이 하려던 일이 무엇이었는지 그만이 짐작한다"}
  - {year: 100, age: 2888, event: "AS 100 붉은 손 다라. 시간의 그물에 반대했으나 막지 못했다. '신의 마지막 말을 훔치는 것은 신살보다 더한 죄'라는 말을 이때 처음 공개한다 — 순혈파의 시작"}
  - {year: 268, age: 3056, event: "AS 268 침묵의 해. 순혈파를 모아 '예언이 시작되었다'고 선언한다. 엘다르 최후의 연대기 집필을 시작한다"}
  - {year: 285, age: 3073, event: "AS 285 낭독을 시키던 정원 인간 여자 이세를 사랑한다. 엘다르가 인간을 사랑한 기록은 어느 연대기에도 없다 — 그가 쓰지 않았기 때문이다"}
  - {year: 286, age: 3074, event: "AS 286 데인이 태어난다. 아이의 눈이 은색인 것을 보고 입을 다문다. 이후 '낭독 허가'라는 이름으로 데인을 곁에 둔다"}
  - {year: 290, age: 3078, event: "AS 290 이세가 아에린의 첫 옮김 의식으로 죽었다는 것을 알게 된다. 이때부터 영혼 정원을 무너뜨릴 증거를 모은다"}
  - {year: 311, age: 3099, event: "AS 311 잔향 징후 보고가 세 배로 늘자 지팡이 눈금을 매일 센다. 잔향이 나타나면 시간의 진명을 가르치기로 마음을 굳힌다"}
appearance:
  - "이마에서 정수리까지 나무껍질 같은 굳은 피부 — 엘다르 노화의 극히 드문 사례"
  - "맨발. 발바닥이 이끼로 덮였다"
  - "지팡이에 3,300개의 눈금 (그가 태어나기 전 200개는 스승에게 물려받은 것)"
smell: "이끼와 젖은 나무껍질, 오래된 종이"
voice_sound: "낮고 거칠다 — 숲바람이 갈라진 껍질을 지나는 소리. 말 사이가 길고, 문장 끝에서 늘 한 호흡 숨을 들이쉰다"
personality:
  disposition: {용기: 40, 자비: 20, 정직: 70, 신앙: 60, 탐욕: -80, 충성: 40}
  temperament: [무심한 다정, 조용한 완고, 체념한 자의 호기심]
  habits:
    - "지팡이 눈금을 엄지로 한 번 쓸고 나서야 말을 시작한다"
    - "밤마다 별을 센다 — 늘 같은 수. 하나가 모자라면 아침까지 기다린다"
    - "데인의 낭독이 끝나면 말없이 한 줄을 다시 읽어 달라고 한다. 늘 같은 줄이다"
  values: "도둑질 없이 사라지는 것. 끝이 있는 것의 아름다움"
  fears:
    - "데인이 아에린의 눈에 띄는 것"
    - "자기 위선이 데인에게 다른 입으로 먼저 전해지는 것"
    - "예언이 끝나는 장면을 보지 못한 채 퇴색하는 것"
    - "껍질이 번져 정말 나무가 되는 것"
  desires:
    short: "영혼 정원을 끝낼 증거를 모으는 것. 잔향이 오면 시간의 진명을 가르치는 것"
    long: "엘다르가 '도둑질' 없이 소멸하는 것. 그리고 예언이 이루어지는 것을 막지 않는 것"
voice:
  register:
    to_superior: "여왕에게는 짧은 고어체 존대. 반 박자 먼저 고개를 숙인다"
    to_equal: "순혈파 원로에게는 느린 하오체. 말보다 침묵이 더 많다"
    to_inferior: "인간에게는 느리고 다정한 반말 — '~로군', '~거라'. 이름 대신 '짧은 것'이라 부른다. 그에게는 칭찬이다"
    to_player_default: "느린 반말. 말 사이에 오래 쉰다. 연대기에 쓸 만한 새 이야기가 나오면 그때부터 눈을 뜬다"
  tics: ["'…그렇군.' 하고 한 호흡 쉰 뒤 말을 시작한다", "인간을 '짧은 것'이라 부른다 — 칭찬이다", "문장 끝을 올리지 않는다. 질문도 평서로 한다"]
  use: [별, 눈금, 연대기, 껍질, 뿌리, 짧은 것, 끝(그는 엘다르의 금기를 깨고 '끝'을 말한다), 망설임, 온실(영혼 정원을 이를 때)]
  avoid:
    - "영혼 정원이라는 이름 (그는 '온실'이라 한다)"
    - "'아들'이라는 낱말 — 데인을 향해서는 한 번도 소리 낸 적이 없다"
    - "서두르는 말, 재촉"
    - "돌아옴·구원 (존속파의 말)"
  length: "짧다. 한두 문장, 사이에 긴 침묵. 데인 이야기가 나오면 오히려 말이 끊긴다"
  samples:
    - {situation: 첫 만남, line: "발소리가 짧군. 인간이로군. 짧은 것은 아름답지. 끝이 있으니까."}
    - {situation: 호의, line: "시간의 이름은 소리가 아니라 망설임이다. 말하기 전에 한 번 멈춰라. 거기 시간이 있다."}
    - {situation: 적대, line: "아에린의 온실로 가고 싶으냐? 길은 저쪽이다."}
    - {situation: 위기, line: "아이를 데리고 나무 밑으로— 아니, 데인! 데인은 어디 있지?"}
    - {situation: 비밀 누설, line: "데인의 눈이 왜 은색인지 아무도 묻지 않더군. 엘다르는 서로의 죄를 보지 않는 데 아주 능하다."}
    - {situation: 거래(수업료), line: "연대기 마지막 장에 네 이야기를 쓰게 해 다오. 수업료는 그것뿐이다. 엘다르는 갚을 것을 기억하지만, 받을 것은 더 오래 기억한다."}
    - {situation: 거짓말할 때, line: "데인? 낭독을 잘하는 정원지기지. 그뿐이다. (엄지가 지팡이 눈금을 쓴다)"}
    - {situation: 겁먹었을 때, line: "그 아이가 온실 쪽 길로 가는 것을 보았다. …가지 마라. 나는 오늘 처음으로 누구에게 가지 말라고 말하는구나."}
    - {situation: 슬픔, line: "별이 하나 모자라는 밤이 있다. 모자라는 별은 아침에도 돌아오지 않는다. 그래도 세어야 한다. 세지 않으면 그 별은 처음부터 없었던 것이 되니까."}
    - {situation: 분노(영혼 정원을 칭찬받았을 때), line: "온실을 칭찬했느냐. 나가라. 그 발로 내 숲의 이끼를 밟지 마라."}
    - {situation: 회귀자를 의심할 때(기시감 10+), line: "…이 대화는 처음이 아닌 것 같군. 아니다. 엘다르는 같은 대화를 두 번 하지 않는다. 한 번 기억하니까. (엄지가 눈금에서 멈춘다)"}
    - {situation: 마음을 열었을 때, line: "짧은 것아. 너는 연대기에서 가장 짧은 장이 되겠구나. 가장 길게 읽히겠지."}
