  - {to: npc_silvanus, type: 순혈파 수장, like: 40, trust: 50, visibility: 공개, memo: null, words: "별을 세는 오래된 벗. 그의 연대기 마지막 장에 누가 쓰일지 나는 안다. 그가 말하지 않는 아이의 눈 색도"}
  - {to: npc_liandel, type: 마지막 아이, like: 90, trust: 60, visibility: 공개, memo: null, words: "내 손녀. 이름 없는 것을 처음 가져 본 아이. 그 아이가 변한다면 나는 두려워하고 — 바란다"}
  - {to: npc_first_ember, type: 그녀가 그물로 끊은 앞선 잔향자, like: 10, trust: 0, visibility: 비밀, memo: 말투를 기억, words: "그 아이는 정원이 탈 때도 나를 '그분'이라 불렀다. 그 말투를 한 번도 잊지 못했다. 잊을 수 있다면 좋았을 것을 — 이것은 처음 한 생각이다"}
  - {to: npc_gregor7, type: 꼭두각시, like: -10, trust: 30, visibility: 공개, memo: null, words: "내가 짠 노래의 인간 쪽 끝. 늙은 그가 무언가를 후회한다는 것도 안다. 후회도 기억으로 남는다 — 그것이 그를 용서하는 일은 아니다"}
  - {to: npc_thorn_queen, type: 신살의 공범, like: -60, trust: -80, visibility: 공개, memo: null, words: "웃은 자. 그녀가 왜 웃었는지 3,400년 동안 묻지 않았다. 묻는 순간 대답을 들을 것이므로"}
  - {to: npc_dara, type: 두 번째 그물, like: 0, trust: 0, visibility: 비밀, memo: null, words: "붉은 길에서 끝낸 두 번째. 그 아이의 말투도 기억한다. 첫 불씨와 달리 그 아이는 나를 보지 않았다"}
toward_player: "알현 불가가 기본. 닿게 되면 다정한 반말로 '아이'라 부르며 세 걸음 밖에 둔다. 잔향임을 알아본 뒤에는 오래, 아주 오래 쳐다본다"
