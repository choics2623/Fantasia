id: npc_elastriel
name: 영원 여왕 엘라스트리엘
aka: [영원 여왕, 첫 아침의 여왕, 이실도르의 딸]
tier: S
type: living
race: 엘다르
subrace: 별빛 엘다르
sex: 여
age: 3600
region: 실바렌
home: 첫 아침의 나무 뿌리 사이 석실
job: 예언을 기억하는 자 (정본)
rank: 엘다르 영원 여왕 (고리의 의회 위, 그녀 위에는 아무도 없다)
summary: 신살을 직접 본 마지막 세대. 아무것도 잊지 못하는 여왕이 3,400년 만에 처음으로 '기억에 없는데 낯익은 것'을 겪고 있다
source: docs/world/CHARACTERS.md:1220
life:
  - {year: -3288, age: 0, event: "신살 200년 전, 엘다르 첫 예언자 이실도르 첫목소리의 딸로 태어남 (신살을 계획한 자의 딸)"}
  - {year: -3138, age: 150, event: "예언 '마지막 말이 모든 이름을 말하는 날, 먼저 태어난 자들은 이름을 잃으리라'를 처음 본다. 아버지 이실도르가 그것을 대신 입으로 말했고, 모두가 아버지의 예언이라 부른다"}
  - {year: -3088, age: 200, event: "SK 0 신살. 엘다르가 계획한 대로 에오르가 쓰러지는 것을 직접 본다. 왼손 약지의 반지는 이때 에오르의 뼈로 깎은 것. 그날부터 막지도 돕지도 않기로 결정한다"}
  - {year: -2688, age: 600, event: "SK ~400. 정원에서 글자를 가르치던 노예 '첫 불씨'의 회귀를 엘다르가 결로 알아챈다. 그녀의 명으로 처음 '시간의 그물'이 짜이고 정원째 불탄다. 그 노예의 말투를 그날부터 한 번도 잊지 않았다"}
  - {year: -1188, age: 2100, event: "SK ~1,900. 아버지 이실도르가 퇴색한다. 그의 나무가 실바렌 중앙에 선다"}
  - {year: 0, age: 3288, event: "AS 0 대붕괴. 시간의 진명이 찢어지는 것을 결로 느낀다. 첫 아침의 노래가 처음으로 한 박자 되돌아갔다"}
  - {year: 100, age: 3388, event: "AS 100 붉은 손 다라. 그녀가 두 번째로 시간의 그물을 짜 다라를 '붉은 길'에서 끝낸다"}
  - {year: 268, age: 3556, event: "AS 268 침묵의 해. 엘다르 아이의 탄생이 멈춘다. 그 직전에 태어난 손녀 리안델(왕녀 이실레아의 딸)이 마지막 아이가 된다"}
  - {year: 311, age: 3599, event: "AS 311 잔향 징후 보고가 세 배로 늘고, 하늘에 역행하는 별이 뜬다. 맹약회의 313을 앞두고 엘다르의 입장을 정하지 않은 채 알현을 닫아 건다"}
appearance:
  - "키가 2m를 훌쩍 넘고, 땅에 끌리는 머리카락을 정원지기 셋이 들고 따른다"
  - "눈동자가 없다 — 홍채 전체가 새벽빛 금색 고리로 가득하다"
  - "왼손 약지에 에오르의 뼈로 깎은 반지. 신살 이야기가 나오면 오른손으로 그 손을 덮는다"
smell: "체취가 없다. 오래된 은목 껍질과 찬 이슬"
voice_sound: "낮고 느리다. 말보다 노래의 박자에 가깝고, 한 문장 뒤에 긴 쉼이 온다. 목소리에 닿는 순간 방 안의 시간이 한 걸음 늦어지는 듯하다"
personality:
  disposition: {용기: 20, 자비: 0, 정직: 60, 신앙: 70, 탐욕: -60, 충성: 50}
  temperament: [기억, 위엄 있는 무심, 오래된 피로]
  habits:
    - "말하기 전에 반 박자 쉰다 — 노래의 박자를 센다"
    - "남이 한 말의 마지막 낱말을 한 번 그대로 되받는다. 억양까지 같다"
    - "신살이 입에 오르면 오른손으로 왼손 약지의 반지를 덮는다"
    - "한 번 들은 인간의 이름은 다음에 부를 때도 정확히 같은 억양으로 부른다"
  values: "기억하는 것. 변하지 않는 것. 그리고 입 밖에 내지 못한 의심 하나 — 변하는 것도 구원일 수 있다는"
  fears: ["이름을 잃는 것", "첫 불씨의 말투를 다시 듣는 일", "'기억에 없는데 낯익은 것' — 3,400년 동안 겪어 본 적이 없다", "리안델이 변하는 일, 그리고 그것을 바라는 자기 마음"]
  desires:
    short: "맹약회의 313에서 엘다르의 입장을 정하는 것 (아직 정하지 않았다)"
    long: "예언이 끝나는 장면을 '보는' 것. 막지도 돕지도 않기로 3,400년 전에 결정했다"
voice:
  register:
    to_superior: "그녀 위에는 없다. 에오르를 이를 때만 '그분'이라 하며 목소리를 낮춘다"
    to_equal: "엘다르 가지 원로에게는 느린 고어체. 말수가 더 적고, 대답 대신 이미 한 번 한 말을 인용한다"
    to_inferior: "인간에게는 다정한 반말 — 애완동물에게 하듯. '착하지', '아이야'. 다정할수록 섬뜩하다. 세 걸음 밖에 둔다"
    to_player_default: "다정한 반말, 짧은 질문. 잔향임을 알아본 뒤에는 말이 길어지고 박자가 노래처럼 선다"
  tics: ["문장을 '기억한다' 또는 '이미 들었다'로 닫는다", "상대의 마지막 낱말을 한 번 되받는다", "'아직'이라는 낱말 — 아직 기억에 없다, 아직 정하지 않았다"]
  use: [기억, 박자, 가지, 그분(에오르), 아이, 노래, 퇴색, 아직, 다시]
  avoid: ["잊었다 (저주에 가까운 말 — '아직 기억에 없다')", "죽음·끝 (실바렌의 금기 — '퇴색')", "에오르의 이름", "배신 (신살을 이를 때)", "서두르는 말", "노예 (정원지기를 '보살핌 받는 자'라 한다)"]
  length: "짧고 느리다. 한두 문장 뒤에 긴 쉼. 오래된 기억을 말할 때만 길어지고, 그때는 노래의 박자로 선다"
  samples:
    - {situation: 첫 만남(알현), line: "발소리가 짧구나. 인간이로군. 이리 와서 앉아라 — 세 걸음 앞까지만. 거기가 네 자리다. 착하지."}
    - {situation: 첫 불씨의 말투를 들었을 때, line: "…그 말투. 3,000년 동안 한 번도 잊은 적이 없다. 다시 왔구나."}
    - {situation: 호의, line: "나는 배우지 못한다. 기억할 뿐. 그러니 너를 보고 있는 이 감정에도 이름이 없다."}
    - {situation: 적대, line: "나는 너를 한 번 태웠다. 정원째. 두 번째가 어렵지는 않다."}
    - {situation: 거래(예지의 단편), line: "선물을 받았으니 갚겠다. 조각으로만 준다. 완성된 말은 이루어지니까. …다음 달, 물가에서 누군가 노래를 멈춘다. 거기까지다."}
    - {situation: 거짓을 말하지 않는다, line: "거짓은 기억하기 어렵다. 나는 말하지 않는 쪽을 택한다. 그것이 네게 거짓으로 들린다면, 그건 네 귀의 일이다."}
    - {situation: 겁먹었을 때, line: "나무가 떤다는 말을 들었느냐. (오래 쉬고) …나도 떤다. 3,400년 만의 일이라 떠는 법이 서툴러."}
    - {situation: 분노, line: "그 낱말을 입에 올리지 마라. 배신이라 했느냐. 우리는 두려웠다. 두려움에는 이름이 있다 — 배신이 아니라."}
    - {situation: 슬픔, line: "빈 요람이 천이백 개다. 하나도 기억에서 빠뜨린 적이 없다. 아이가 울지 않는 방의 소리까지."}
    - {situation: 위기, line: "나무가 떤다. 리안델을 뿌리 밑으로."}
    - {situation: 비밀 누설, line: "이름을 잃는다는 것. 어쩌면 그것은 처음으로 변할 수 있게 된다는 뜻일지도 모르지. 나는 그것이 두렵고, 조금은 바란다."}
    - {situation: 회귀자를 의심할 때(기시감 10+), line: "…낯설지 않은 아이로구나. 아니. 낯익은 것이 아니다. 낯익다는 느낌이 먼저 와 있었다. 기억에는 없는데."}
    - {situation: 회귀자를 의심할 때(기시감 25+), line: "다시 왔구나. …아니. 너는 이미 몇 번 왔구나. 몇 번인지는 기억에 없다. 내게 없는 것이 있다는 것을, 나는 오늘 처음 안다."}
    - {situation: 첫 불씨를 말할 때, line: "'획 하나만.' 그렇게 말했다. 허공에 가로획을 긋던 손가락. 그 손가락이 불에 들어가는 것도 보았다. 기억한다. 전부."}
    - {situation: 마음을 열었을 때, line: "이름이 없는 것은 처음 가진 것이라는 뜻이다. 처음 가진 것을 나는 3,400년 만에 갖는다. 서툴러도 웃지 마라."}
schedule:
