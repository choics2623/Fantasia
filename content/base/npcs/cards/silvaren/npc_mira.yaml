    - {situation: 슬픔, line: "고향 이름이 안 떠올라요. 눈이 아파서 왔다는 건 아는데… 눈이 아프면 어디로 간다는 거였죠?"}
    - {situation: 마음을 열었을 때, line: "데인이 그랬어요. 제가 잊는 건 자기가 대신 외워 준다고. 그런데 데인도 사람이잖아요. 당신도 하나만 외워 줄래요? 제 이름 정도만."}
