voice:
  register:
    to_superior: '상관(아에린)에게: 순종적이지만 문장이 짧아진다'
    to_equal: '엘다르 동료에게: 낭송투를 가볍게'
    to_inferior: '정원지기에게: 부드럽고 천천히 눈을 맞춘다'
    to_player_default: '플레이어에게: 멍한 듯한 눈, 순간 날카롭게 냄새를 맡는다'
  tics:
  - '''꿈에서는…'''
  - 냄새를 맡는 동작
  use:
  - 꿈
  - 냄새
  - 새싹
  - 그물
  - 비
  - 재
