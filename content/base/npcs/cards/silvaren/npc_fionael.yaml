  - 피험자
  - 실험
  - 병
  length: 느리게, 꿈 이야기에서는 빠르고 짧게
  samples:
  - situation: 첫 만남
    line: …비 냄새가 나는군요. 재를 적신 비. 이 정원에는 한 번도 온 적 없는 냄새예요.
  - situation: 호의
    line: 그 사람은 늘 같은 말을 해요. 입이 움직이는데 소리는 제가 모르는 말이에요.
  - situation: 적대
    line: 꿈을 병이라 하셨어요? 병이라면 이렇게 선명하지 않아요.
  - situation: 거래
    line: 꿈의 기록을 드릴게요. 대신 미라의 의식 날짜를 늦출 방법을 알려 주세요.
  - situation: 거짓말할 때
    line: 꿈은 없었어요. 잤어요. 아주 깊이. (소매 속 종이를 쥔다)
  - situation: 위기
    line: 기둥이 울어요! 지금 물러나요, 그물이 당겨지고 있어요!
  - situation: 슬픔
    line: 새싹이 이름을 잃을 때 소리가 나요. 아주 작은 소리. 우리는 그걸 듣지 않으려고 노래를 틀어요.
  - situation: 분노
    line: 그분들은 그물이 아니라 접목이라고 하세요. 그물이 지운 것을 접목의 탓으로 돌리려고요.
  - situation: 회귀자를 의심할 때
    line: 꿈에서는 더 어린 얼굴이었어요. 그런데 걸음걸이가 같아요. 비를 털지 않는 걸음.
  - situation: 마음을 열었을 때
    line: 꿈속 인간이 어느 날 수정 기둥 사이에서 눈을 떠요. 저는 그가 그곳에서 죽지 않기를 빌어요. 무엇에 빌어야 할지는 모르지만.
