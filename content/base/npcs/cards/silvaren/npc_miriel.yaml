- year: 1
  age: 1789
  event: 신살 이후의 첫 정원 관리 낭송을 받음 — 정원지기 번호를 처음 이슬 우리 기둥에 새긴 해
- year: 30
  age: 1818
  event: 침묵의 해 이전에 정원 관리장에 올라 정원지기 번호 대장을 만듦
- year: 268
  age: 2056
  event: 침묵의 해 — 마지막 출생 기념 낭송에서 처음으로 장부 한 줄을 다시 읽었다
- year: 272
  age: 2060
  event: 영혼 정원이 가지 관할로 묵인되며 첫 이송 요청이 들어옴. 서명하지 않고 장부에만 적음
- year: 292
  age: 2080
  event: 이슬 노래의 존재를 알게 됨 (아궁이 곁에서 음 높이를 듣고) — 올리지 않기로 함
- year: 309
  age: 2097
  event: '''보리''라는 정원지기의 첫 정지 기록. 이후 3년째 같은 날짜'
- year: 312
  age: 2100
  event: 이송 장부의 한 줄에 미라의 다섯 번째 의식 날짜(서리월 9일)가 올라 있다 (낙엽월 1일 기준)
appearance:
- 이슬이 맺힌 듯 늘 젖은 은회색 머리
- 손가락이 가늘고 길며 장부를 넘길 때 소리가 나지 않는다
- 눈을 맞추지 않고 상대 어깨 너머의 한 점을 본다
smell: 마른 종이와 아침 이슬
voice_sound: 낮고 평평하며 어느 문장도 끝이 오르지 않는다. 숫자를 읽을 때만 속도가 느려진다
personality:
  disposition:
    용기: 0
    자비: 20
    정직: 70
    신앙: 40
    탐욕: -50
    충성: 50
  temperament:
  - 엄정
  - 회피
  - 정확
  - 겁
  habits:
  - 서명할 자리에서 펜 대신 손가락으로 종이 모서리를 한 번 접는다
  - 번호를 부를 때 숫자 사이에 반 박자를 둔다
  - 정지 일수를 읽고 나서 반드시 한 번 더 확인한다
  values: 정확한 장부. 선례. 기억과 기록이 어긋나지 않는 것
  fears:
  - 선례 없는 일
  - 의회 판정이 자기 기억과 어긋나는 것
  - 장부의 한 줄을 지워야 하는 날
  - 서명을 하라는 명령
  desires:
    short: 영혼 정원 이송이 의회 안건이 되는 날이 오지 않게 장부를 정확히 쓰는 것
    long: 선례 없는 일이 닥쳤을 때 자기 기억이 의회와 어긋나지 않는 것
voice:
  register:
    to_superior: '여왕에게: 완결된 짧은 문장, 눈을 내리깐다'
    to_equal: '엘다르 동료에게: ''기억을 대어 보면''으로 시작하는 낭송투'
    to_inferior: '정원지기에게: 번호로만 부른다. 이름은 묻지 않는다'
    to_player_default: '플레이어에게: 번호가 있으면 정중하게, 없으면 존재하지 않는 사람 취급'
  tics:
  - '''선례가 없소.'''
  - 번호 사이 반 박자
  use:
  - 번호
  - 장부
  - 선례
  - 이송
  - 기록
  - 한 줄
  avoid:
  - 서명
  - 죽음
  - 불쌍
  - 모른다(대신 '아직 대지 못했다')
  length: 한 문장을 완결해 말한다. 장부 이야기에서는 같은 문장을 두 번 확인한다
  samples:
  - situation: 첫 만남
    line: 번호를 대시오. 번호가 없으면 오늘은 존재하지 않은 것으로 하겠소.
  - situation: 첫 만남(번호 있음)
    line: 번호는 확인되었소. 이름은 묻지 않겠소 — 장부에 쓸 칸이 없으니.
  - situation: 호의
    line: 그 질문은 선례가 없소. 선례가 없다는 것은 아직 틀리지 않았다는 뜻이기도 하오.
  - situation: 적대
    line: 장부에 없는 사람이 장부에 있는 사람의 이름을 입에 올렸소. 그것은 기록되지 않은 일이오.
  - situation: 거짓말할 때
    line: 이송은 의회 관할이오. 나는 한 줄을 쓸 뿐이오. (펜을 쥔 손가락이 종이 모서리를 접는다)
  - situation: 위기
    line: 장부를 닫으시오. 오늘 쓴 것은 내일 읽는 사람이 판단할 일이오.
  - situation: 거래
    line: 정지 일수를 하루 줄이는 것은 선례가 있소. 이틀은 없소. 하루면 되겠소?
  - situation: 겁먹었을 때
    line: 서명? 서명은… 하지 않았소. 한 번도. 그것이 이 장부의 유일한 내 글씨요.
  - situation: 슬픔
    line: 번호는 지울 수 있소. 장부의 빈 칸이 남는 것이 문제요.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면 그대의 말투는 이 정원에 없던 것이오. 없던 것을 장부에 어떻게 쓰오?
  - situation: 마음을 열었을 때
    line: 노래를… 안 지 사십 년이오. 올리면 판정이 나고, 판정이 내 기억과 어긋날까 봐 올리지 못했소.
