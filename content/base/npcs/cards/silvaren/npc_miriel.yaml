rank: 별빛 엘다르 (이슬지기 가지)
summary: 선례가 없다는 이유로 40년째 아무것도 의회에 올리지 않는 관리자. 이슬 노래를 알고, 영혼 정원 이송을 장부에 쓰되 서명은 하지 않았다
