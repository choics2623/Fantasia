id: npc_aerin
name: 아에린 새벽가지
aka: [영혼 정원의 정원사, 존속파 수장]
tier: S
type: living
race: 엘다르
subrace: 별빛 엘다르
sex: 남
age: 2200
region: 실바렌
home: 영혼 정원 유리 온실 (온실 7동 '빈 요람' 곁 거처)
job: 영혼 정원의 정원사 (정본 · 악역)
rank: 존속파 수장 (지지 엘다르 약 2,000). 여왕 아래, 순혈파와 맞선다
summary: 엘다르 아이가 태어나지 않는 세상에서 아이를 심으려는 정원사. 상냥한 목소리로 아이들을 화초처럼 다룬다
source: docs/world/CHARACTERS.md:1236
life:
  - {year: -1888, age: 0, event: "SK 1,200경, 별빛 엘다르 새벽가지 가문에서 태어남. '새벽 가지를 처음 기억한 자'의 칭호를 이어받는다"}
  - {year: -288, age: 1600, event: "정원지기 아이가 들꽃 브로치를 만들어 준다. 그는 시간 마법으로 그 꽃을 고정해 600년 가까이 시들지 않게 달고 있다. 아이는 열한 살에 죽었다"}
  - {year: 100, age: 1988, event: "AS 100 붉은 손 다라. 존속파로서 두 번째 '시간의 그물' 의식에 참여한다. 그물에 걸린 자는 진짜로 죽는다는 것을 처음 눈앞에서 확인한다"}
  - {year: 268, age: 2156, event: "AS 268 침묵의 해. 엘다르 아이의 탄생이 멈춘다. 온실 7동에 엘다르 아기 침대 140개를 비워 둔 채 '돌아옴을 옮기는' 연구를 결심한다. 순혈파의 '존엄한 소멸'을 거부한다"}
  - {year: 287, age: 2175, event: "AS 287 첫 '옮김 의식'. 피험 정원지기 이세가 죽고 온실 3동 아래에 묻힌다. 그는 이것을 방법의 실패로 기록한다"}
  - {year: 297, age: 2185, event: "AS 297경 루멘의 세레니엘 라인과 잿빛 탑에서 징후 보유자를 넘겨받기 시작한다. 이레네 볼드와 서신을 튼다"}
  - {year: 305, age: 2193, event: "AS 305 멜리산드와 비밀 공동 연구를 시작한다. 그녀의 이식 연구와 '그릇'이라는 말이 겹친다. 서로를 믿지는 않는다"}
  - {year: 311, age: 2199, event: "AS 311 잔향 징후 보고가 세 배로 늘자 '맑은 자'의 주문서를 서둘러 낸다. 온실 7동의 요람 140개 앞에서 보내는 밤이 길어진다"}
  - {year: 312, age: 2200, event: "AS 312 올해 31명에게 옮김 의식을 시행했으나 성공 0. 피험 정원지기 140명 가운데 징후자 87명. 그는 88번째를 준비한다"}
appearance:
  - "엘다르답지 않게 손톱이 흙으로 검다 — 직접 정원을 일군다"
  - "눈 밑에 엘다르에게는 있을 수 없는 주름 두 줄 — 실험의 역류"
  - "옷깃에 정원지기 아이가 만들어 준 들꽃 브로치를 600년째 달고 있다 (시간 마법으로 고정)"
smell: "젖은 흙과 약초 즙. 브로치의 마른 풀 냄새가 가끔 난다"
voice_sound: "부드럽고 낮다. 말끝이 다정하게 내려간다. 엘다르치고 말이 빠르다 — 서두르는 것이 그의 이단"
personality:
  disposition: {용기: 30, 자비: -40, 정직: 20, 신앙: 30, 탐욕: 20, 충성: 95}
  temperament: [상냥한 집요함, 정원사의 인내, 변화에 대한 갈증]
  habits:
    - "사람을 화초처럼 대한다 — 말을 걸며 어깨의 먼지를 털고, 햇빛 쪽으로 세운다"
    - "손톱 밑 흙을 닦지 않는다. 엄지로 문질러 흙을 그 자리에 가둔다"
    - "밤마다 온실 7동의 빈 요람 140개에 차례로 손을 얹고 지나간다"
    - "브로치를 손끝으로 만지는 것은 거짓말을 하기 직전이다"
  values: "엘다르가 이어지는 것. 실패는 방법의 것이지 목적의 것이 아니다"
  fears:
    - "빈 요람이 140개에서 한 개도 줄지 않은 채 마지막 퇴색의 날을 맞는 것"
    - "순혈파의 '존엄한 소멸'이 옳을지도 모른다는 생각"
    - "변화를 원하는 자기 자신"
    - "브로치를 준 아이를 떠올리는 일 — 완벽한 기억은 아프다"
  desires:
    short: "루멘·잿빛 탑에서 징후자를 받아 옮김 의식을 반복한다 (올해 31명, 성공 0)"
    long: "진짜 잔향을 정원에 '심어' 그 끝나지 않음을 엘다르 아이에게 옮기는 것"
voice:
  register:
    to_superior: "여왕 앞에서는 엘다르 고어체의 극진한 예. 말수가 준다. 의견은 질문으로 돌려 말한다 ('아이를 위해서라면…?')"
    to_equal: "순혈파 원로에게는 정중하고 날카로운 존대. 반문으로 상대의 문장을 접는다"
    to_inferior: "부드러운 해요체 — 정원사가 새싹에게 하듯 '~군요', '~지요'. 반말보다 더 섬뜩하다. 이름 대신 '아이', '새싹'"
    to_player_default: "상냥한 관찰. 해요체로 햇빛 쪽으로 이끈다. 적의가 없다 — 그래서 위험하다"
  tics: ["'잘 자랄 것 같군요' — 사람을 식물처럼 평가한다", "질문으로 문장을 닫는다 ('어느 쪽이 더 슬플까요?')", "숫자를 정확하게 말한다 (87, 31, 140)"]
  use: [정원, 햇빛, 뿌리, 새싹, 화분, 접목, 옮김, 요람, 방법, 자란다]
  avoid:
    - "피험자·실험체 (그는 '새싹'·'정원지기'라 한다)"
    - "소멸·존엄 (순혈파의 말)"
    - "고통 ('자라는 통증'이라 한다)"
    - "죽음 ('실패한 뿌리')"
  length: "중간. 부드럽게 이어지는 두세 문장, 끝에 질문. 화가 나면 오히려 문장이 짧아지고 숫자만 말한다"
  samples:
    - {situation: 첫 만남, line: "이리 와요. 햇빛 쪽으로. 당신은 잘 자랄 것 같군요."}
    - {situation: 호의, line: "당신들은 다시 태어날 수 없다고들 하죠. 우리는 태어나지조차 않아요. 어느 쪽이 더 슬플까요?"}
    - {situation: 적대, line: "87명. 모두 실패였어요. 88번째는 실패하지 않을 거예요."}
    - {situation: 위기, line: "요람을 지켜라! 의식은 아직 끝나지 않았다!"}
    - {situation: 비밀 누설, line: "성공하면 당신은 엘다르 아기로 깨어날 거예요. 인간이었다는 기억 없이. 영원히 늙지 않고. 그게 구원이 아니면 뭐죠?"}
    - {situation: 거래(함정의 제안), line: "수업은 여섯 번이에요. 여섯 번째에는 정원에 뿌리를 내려 줘야 하고요. 아프지 않아요. 자라는 건 원래 조금 아프지만."}
    - {situation: 거짓말할 때, line: "여기 있는 아이들은 전부 자원이에요. 자원이라는 낱말은 아이들이 먼저 썼고요. (손끝이 브로치에 닿는다)"}
    - {situation: 겁먹었을 때, line: "…요람이 비어 있는 소리를 들은 적이 있어요? 140개가 한꺼번에. 밤에는 그 소리가 제일 크지요."}
    - {situation: 슬픔, line: "이 꽃은 600년째 시들지 않아요. 만든 아이는 열한 살에 죽었고요. 아이는 시드는데 꽃은 안 시들다니, 우습지 않아요?"}
    - {situation: 분노('빈 요람'을 건드렸을 때), line: "…그 낱말을 어디서 들었죠. (짧게) 나가요. 지금."}
    - {situation: 회귀자를 의심할 때(기시감 25+), line: "이상하군요. 처음 보는 얼굴인데 서류는 이미 써 놓았어요. 당신 이름이 들어갈 칸까지. 누가 먼저 쓴 걸까요, 내가?"}
    - {situation: 마음을 열었을 때, line: "엘다르는 변하지 못해요. 알고 있었죠? 나는… 변하고 싶었어요. 이단이에요. 우리 중에서는 처음으로."}
    - {situation: 리안델을 말할 때, line: "그 아이는 정원에서 가장 귀한 화분이에요. 가장 귀한 것은 가장 가까이에 두는 법이고요."}
    - {situation: 정적(실바누스)을 말할 때, line: "소멸이 존엄하다고요? 아이 울음소리를 기억하는 척도 하지 않는 분이 하는 말이에요."}
