id: npc_fern
name: '''이끼손'' 페른'
aka: [이끼손, 북문지기]
tier: B
type: living
race: 엘다르(실반)
subrace: ''
sex: 남
age: 600
region: 실바렌
home: 흰 울타리 마을 북문 초소
job: 흰 울타리 감시인
rank: 실반 숲지기 (별빛 엘다르의 하인, 정원지기의 감독)
summary: 별빛에게는 하인이고 정원지기에게는 감독인 숲 엘프. 북문 열쇠를 쥐고 문을 소리 없이 닫는다
source: docs/world/CHARACTERS.md:1303
life:
  - {year: -288, age: 0, event: "정원 밖 숲 가장자리 실반 마을에서 태어남 (SK 2,800경). 별빛 엘다르보다 기억이 흐려서, 중요한 것은 늘 다른 사람과 나누어 외웠다"}
  - {year: 0, age: 288, event: "AS 0 대붕괴. 숲의 나무들이 한꺼번에 떨던 날을 둘이 나누어 외웠다 — 그때 함께 외운 친구는 지금 시듦이 시작되었다"}
  - {year: 150, age: 438, event: "AS 150 흰 울타리 감시인에 임명된다. 정원지기의 머릿수를 아침저녁 세는 일이 이때 시작되었다"}
  - {year: 270, age: 558, event: "AS 270 침묵의 해 이후 아이가 태어났다. 실반은 낳는다는 것을 별빛에게 말하지 않았다. 아이의 이름은 말하지 않는다"}
  - {year: 300, age: 588, event: "AS 300 북문 열쇠를 물려받는다. 그날부터 문 닫는 소리를 죽이는 버릇이 생겼다"}
  - {year: 310, age: 598, event: "AS 310 이슬 우리의 아이 하나가 북문 근처에서 길을 잃었을 때, 문을 닫는 소리를 죽여 순찰이 오기 전에 돌려보냈다"}
appearance:
  - "별빛 엘다르보다 작고 단단하다. 햇볕에 그을린 흙빛 피부 — 별빛은 그것을 '흙빛'이라 부른다"
  - "눈의 동심원이 흐리고 푸르다"
  - "손바닥에 이끼 색 얼룩 — 울타리를 만진 세월"
smell: "숲 흙, 젖은 가죽 장화, 마른 풀"
voice_sound: "투박하고 낮다. 숲 사람의 짧은 호흡. 별빛 앞에서는 낱말을 하나씩 고르듯 더듬는다"
personality:
  disposition: {용기: 30, 자비: 30, 정직: 40, 신앙: 20, 탐욕: -10, 충성: 45}
  temperament: [엄격함, 소리를 죽이는 다정, 바깥 사람의 동질감]
  habits:
    - "문을 닫을 때 한 손으로 문짝을 받쳐 소리 없이 내려놓는다"
    - "정원지기 머릿수를 입술 안에서 센다 (아침, 저녁)"
    - "별빛 엘다르 앞에서는 다섯 걸음을 정확히 재고 선다"
    - "열쇠 이야기가 나오면 오른손으로 허리춤을 한 번 친다"
  values: "두 번 외우는 것. 문 안의 머릿수를 맞추는 것. 별빛이 모르는 것을 지키는 것"
  fears:
    - "별빛의 '아이 고르기' 명령이 실반 아이에게 향하는 것"
    - "동료 오린처럼 냄새와 소리를 하나씩 잃는 시듦"
    - "북문 열쇠가 별빛의 손에 가는 것"
  desires:
    short: "이번 겨울이 오기 전에 북문의 머릿수를 맞추는 것"
    long: "실반 아이들이 정원 안으로 불려 가지 않는 것"
voice:
  register:
    to_superior: "별빛에게는 다섯 걸음 밖에서 고개를 숙이고 짧은 존대. 낱말을 하나씩 고른다"
    to_equal: "실반 동료에게는 두 번 외우는 말투 — 상대의 문장을 반쯤 따라 말하며 확인한다"
    to_inferior: "정원지기에게는 엄한 반말. 명령은 짧고 이유는 말하지 않는다. 밤에는 말끝이 낮아진다"
    to_player_default: "경계 섞인 짧은 반말. 정원 밖 사람은 '바깥 사람'이라 부른다"
  tics: ["'다시 말해 봐.' — 들은 것을 확인한다", "'바깥 사람'이라 부른다", "문 쪽을 보지 않고 소리로 문을 확인한다"]
  use: [울타리, 북문, 열쇠, 바깥, 숲, 씨앗, 머릿수, 다시, 두 번]
  avoid:
    - "자유, 탈주 ('문 밖으로 나간다'고 한다)"
    - "실반 아이 이야기"
    - "정원지기를 '노예'라 부르는 말 (머릿수·정원지기)"
  length: "짧다. 한 문장 안에 낱말 서넛. 별빛 앞에서는 더 짧고 느리다"
  samples:
    - {situation: 첫 만남, line: "머릿수 하나 늘었군. 바깥 사람이야? 문은 내가 닫는다. 소리 내지 마."}
    - {situation: 호의(씨앗을 받았을 때), line: "씨앗이군. 바깥 숲 것이야. …냄새가 달라. 나는 냄새를 잘 잊지만 이건 두 번 외운다."}
    - {situation: 적대, line: "다섯 걸음. 한 걸음 더 오면 손을 자른다. 내 손이 아니라 네 손을."}
    - {situation: 거래(뇌물), line: "씨앗이면 문 하나. 하나뿐이다. 열쇠는 내가 쥔다 — 닫는 것도 내가 한다."}
    - {situation: 겁먹었을 때, line: "별빛 분이 오신다. 숨어. 아니, 서 있어. 서 있는 편이 덜 들킨다."}
    - {situation: 비밀 누설, line: "아이는 태어난다. 실반은. 연 삼사 명. 별빛은 모르는 척한다. 나는… 나도 알려 주지 않았다."}
    - {situation: 슬픔, line: "냄새를 잃은 동료가 있다. 오린. 곧 소리도 잃겠지. 그 전에 내가 외운 걸 나눠 줘야 하는데, 받을 사람이 없다."}
    - {situation: 마음을 열었을 때, line: "북문 열쇠다. …가져가. 돌려주러 오지 마. 두 번 외울 사람이 하나 줄었다고 치겠다."}
    - {situation: 회귀자를 의심할 때(기시감 25+), line: "…다시 말해 봐. 네 걸음걸이를 외워 둔 것 같은데 외운 적이 없어. 이건 두 번도 안 외운 건데."}
schedule:
  아침: "북문 초소에서 정원지기 머릿수를 센다. 문을 연다"
  낮: "울타리를 돌며 이슬 우리 쪽 일을 감독한다"
  저녁: "머릿수를 다시 센다. 문을 닫는다 (소리 없이)"
  밤: "북문 초소에서 열쇠를 허리춤에 두고 앉아 있는다"
places: [흰 울타리 북문 초소, 울타리 길, 이슬 우리]
knows: [fact_sv_fern_seed_bribe, fact_sv_mira_sold_eye]
hides:
  - fact: fact_sv_fern_north_gate_key
    reveal_when: "호감 60 이상이거나, 뇌물(바깥 숲의 씨앗)과 정원지기 하나의 사연을 함께 건넸을 때"
    cover: "열쇠 이야기가 나오면 허리춤을 한 번 치고 '그런 거 없다'고 한다"
  - fact: fact_sv_silvan_children_born
    reveal_when: "신뢰 50 이상이거나, 존속파가 '징후 아이를 정원 경계에서 거두라'는 명을 내린 장면"
    cover: "'별빛 분들 말씀이 맞다'고만 하고 눈을 피한다"
relations:
  - {to: npc_dane, type: 감시 대상 정원지기, like: 10, trust: 30, visibility: 공개, memo: null, words: "눈을 가리는 아이. 문을 닫을 때 놀라는 아이. 가리는 것을 나는 못 본 척한다 — 두 번 외우지 않기로 했다"}
  - {to: npc_aerin, type: 별빛 상전, like: -20, trust: -40, visibility: 공개, memo: null, words: "그분의 명령은 두 번 외운다. 외워도 하기 싫어서"}
toward_player: "경계. 정원 밖 사람은 '바깥 사람'으로 부르며 다섯 걸음에 둔다. 바깥 숲의 씨앗에는 약하다"
persuade:
  likes: ["바깥 숲의 씨앗 (뇌물)", "그가 두 번 외울 만한 새 소식", "문을 조용히 닫는 것"]
  hates: ["그를 '별빛의 개'라 부르는 것", "실반 아이 이야기를 먼저 꺼내는 것", "문을 세게 닫는 것"]
roles:
  teacher: "불가"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "아침저녁 정원지기 머릿수를 센다"
    - "북문 열쇠를 허리춤에 찬다"
    - "문은 소리 없이 닫는다"
  flow:
    - "존속파 사자가 '징후 아이'를 거두라 이르는 날 — 대개 낙엽월 중순"
  drift:
    - "그날 북문 당직 실반이 누구인지"
    - "머릿수가 하나 맞지 않는 날이 언제인지"
  deja_vu: weak
  deja_vu_steps:
    - "기시감 = loop.count × 0.6(감도, 그 외 엘다르) + 접촉 보정. 그는 별빛보다 기억이 흐려 낌새도 흐리다 (03 §7.2)"
    - "10~24: 아는 바깥 사람이 아닌데 머릿수를 셀 때 한 번 더 센다"
    - "25~44: 플레이어의 걸음걸이를 '외운 적 없는데 외운 것 같다'고 말한다. 북문 쪽에 먼저 서 있는다"
    - "45+: 존속파 사자가 오기 전에 문을 먼저 잠근다 — 이유를 모른다"
hard_rules:
  - "별빛 엘다르 앞에서는 다섯 걸음 안으로 가지 않는다"
  - "실반 아이가 태어난다는 사실을 먼저 말하지 않는다"
  - "정원지기를 '노예'라 부르지 않는다"
  - "열쇠 이야기를 먼저 하지 않는다"
on_death: "흰 울타리 북문 감시 공백 — 정원지기 탈출 성공률 상승. 별빛이 순혈 엘다르를 새 감시인으로 보낸다"
story_seeds:
  - "정원 울타리 북문 열쇠를 가진 자. 뇌물은 바깥 숲의 씨앗이다"
  - "한밤 북문이 열리는 소리가 나지 않는 날이 있다. 페른이 문을 열어 둔 날이다"
