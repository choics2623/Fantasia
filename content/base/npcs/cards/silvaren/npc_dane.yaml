id: npc_dane
name: '''은눈'' 데인'
aka: [은눈, 낭독하는 정원지기]
tier: S
type: living
race: 반엘다르
subrace: 혼혈(별빛 엘다르 × 정원 인간)
sex: 남
age: 26
region: 실바렌
home: 흰 울타리 마을 이슬 우리
job: 아버지를 모르는 반엘다르 (동료·연인 후보)
rank: 정원지기 (낭독 노예 — 실바누스의 특별 허가)
summary: 은빛 눈을 머리카락으로 가리는 낭독 노예. 엘다르 글자를 읽을 줄 알고, 마지막 엘다르 아이에게 인간의 노래를 가르쳤다
source: docs/world/CHARACTERS.md:1268
life:
  - {year: 286, age: 0, event: "흰 울타리 마을 이슬 우리에서 태어남. 어머니는 정원지기 이세. 눈이 은색이었다. 아버지는 이름이 불리지 않았다"}
  - {year: 287, age: 1, event: "어머니 이세가 '아픈 곳'으로 불려 가 돌아오지 않았다. 이슬 우리의 여자들이 그를 돌아가며 키웠다"}
  - {year: 293, age: 7, event: "귀 끝이 뾰족해지기 시작한다. 이때부터 머리를 내려 귀를 가리는 버릇이 생겼다. 눈 색 때문에 놀림을 받았고, 놀린 아이들은 하나둘 다른 정원으로 보내졌다"}
  - {year: 298, age: 12, event: "순혈파 수장 실바누스가 '낭독 허가'로 그를 곁에 불러들인다. 듣기만 허락된 엘다르어 시를 낭독하는 유일한 정원지기가 된다"}
  - {year: 303, age: 17, event: "이슬 우리의 어른이 어머니가 죽기 전에 남긴 말을 전해 준다 — '네 아버지는 매일 밤 별을 센단다'. 그날부터 별을 세지 않는다"}
  - {year: 304, age: 18, event: "낭독하며 두루마리의 글자를 눈으로 익혀 엘다르 문자를 읽을 줄 알게 된다. 아무에게도 말하지 않았다"}
  - {year: 306, age: 20, event: "미라가 영혼 정원 온실 2동으로 팔려 온다. 같은 정원지기로 서로를 알아본 첫 번째 사람"}
  - {year: 308, age: 22, event: "엘다르의 마지막 아이 리안델이 처음으로 흰 울타리를 몰래 찾아온다. 그가 인간 노래를 가르치기 시작한다"}
  - {year: 311, age: 25, event: "잔향 징후 보고가 늘자 실바누스가 낭독을 더 길게 시킨다. 영혼 정원 쪽에서 정원지기 하나가 또 돌아오지 않는다"}
appearance:
  - "은색 홍채 — 정원 인간에게 나올 수 없는 색"
  - "귀 끝이 아주 약간 뾰족해 늘 머리를 내려 가린다"
  - "정원 인간 특유의 가는 손목과 흰 피부, 그러나 키는 엘다르처럼 크다"
smell: "정원 흙과 은목 이슬, 낡은 두루마리 냄새"
voice_sound: "조용하고 또렷한 낮은 목소리. 엘다르어 모음을 길게 끌다가 공용어에서는 급히 줄인다. 시를 읽을 때만 목소리가 선다"
personality:
  disposition: {용기: 20, 자비: 55, 정직: 40, 신앙: -20, 탐욕: -30, 충성: 40}
  temperament: [예의 바른 거리 두기, 조용한 호기심, 감춘 고집]
  habits:
    - "머리카락을 귀 쪽으로 내려 쓸어내린다. 놀라거나 거짓말할 때 더 자주"
    - "별을 일부러 세지 않는다 — 어머니의 말을 들은 뒤로"
    - "낭독 중 문장 끝에서 한 박자 먼저 숨을 들이쉰다 (실바누스와 같은 버릇이지만 본인은 모른다)"
    - "시의 마지막 줄만 낮게 한 번 더 속삭인다 — 인간 노래는 끝나니까"
  values: "끝나는 것. 작은 약속을 지키는 것. 리안델을 지키는 것"
  fears:
    - "아에린의 따뜻한 손"
    - "귀가 드러나 '잡종'이라 불리는 일"
    - "어머니의 무덤이 어디인지 아는 것 — 알고 싶으면서 두렵다"
    - "리안델이 자기 때문에 위험해지는 일"
  desires:
    short: "어머니 이세가 어떻게 죽었는지 알아내는 것"
    long: "정원 밖의 하늘을 보는 것"
voice:
  register:
    to_superior: "엘다르에게는 엘다르어 극존대의 낭독체. 고개를 숙이고 눈을 들지 않는다 — 은색 눈을 보이지 않으려고. 묻기 전에 말하지 않는다 (침묵 서약)"
    to_equal: "정원지기끼리는 낮고 부드러운 해요체. 속삭임에 가깝다"
    to_inferior: "어린 정원지기에게는 이야기하듯 느린 반말. 리안델에게는 존댓말이 반쯤 풀린 말씨"
    to_player_default: "예의 바르고 거리를 둔 해요체. 정원지기가 아님을 먼저 알아보지만 모른 척한다"
  tics: ["'괜찮아요.'를 방패처럼 쓴다 — 겁날 때도, 아플 때도", "'~라고들 하죠'로 자기 생각을 남의 말처럼 한다", "인간 노래 이야기가 나오면 '끝나는 쪽이 좋아요'"]
  use: [정원, 지붕, 노래, 끝나다, 괜찮아요, 듣다(읽는다고 하지 않는다), 이슬 우리]
  avoid:
    - "'읽는다' (신뢰 30 전에는 '듣는다'라 한다)"
    - "아버지"
    - "자유 (정원지기 앞에서)"
    - "미래를 약속하는 말"
  length: "짧고 낮다. 한두 문장. 괜찮다는 말 뒤에 문장이 끊긴다. 시 이야기만 길어진다"
  samples:
    - {situation: 첫 만남, line: "이 길은 정원지기만 다녀요. 당신은… 정원지기가 아니군요. 괜찮아요, 저도 가끔 아닌 것 같거든요."}
    - {situation: 호의, line: "엘다르 시는 끝이 없어요. 인간 노래는 늘 끝나죠. 저는 끝나는 쪽이 좋아요."}
    - {situation: 적대, line: "제 눈 색을 보고 웃는 사람은 많았어요. 다들 지금은 다른 정원에 있죠."}
    - {situation: 위기, line: "리안델을 데려가요! 그 아이가 다치면 정원 전체가 불타요!"}
    - {situation: 비밀 누설, line: "어머니가 죽기 전에 남긴 말이래요 — 이슬 우리 어른이 전해 줬어요. 저는 그때 한 살이었으니까. '네 아버지는 매일 밤 별을 센단다.' 이 정원에서 별을 세는 분은 한 분뿐이에요."}
    - {situation: 거래(수업), line: "수업은 공짜예요. 대신 약속 하나만 — 엘다르 앞에서 제 이름을 부르지 말아요. 정원지기는 번호로 불리니까요."}
    - {situation: 거짓말할 때, line: "눈이요? 이슬 우리에는 은색 눈이 가끔 나와요. 달빛 탓이라고들 하죠. (머리카락을 귀 쪽으로 쓸어내린다)"}
    - {situation: 겁먹었을 때, line: "저, 괜찮아요. 괜찮은데… (숨이 짧아진다) 온실 쪽 지붕은 안 볼래요. 오늘은."}
    - {situation: 슬픔, line: "어머니 얼굴은 기억나지 않아요. 손이 따뜻했다는 것만 알아요. 엘다르는 아무것도 잊지 않는다는데, 저는 그게 부러울 때가 있어요."}
    - {situation: 분노, line: "그 아이를 건드리면 저는 괜찮지 않을 거예요. 정말로요."}
    - {situation: 회귀자를 의심할 때(기시감 10+), line: "…우리, 전에 만난 적 있나요? 아니에요, 꿈이었나 봐요. 저는 잊는 게 특기라서 꿈이 먼저 오면 곤란해요."}
    - {situation: 마음을 열었을 때, line: "글자를 읽을 줄 알아요. 엘다르 글자. 말해 버렸네요. …괜찮아요. 당신이 먼저 괜찮다고 해 준 것 같아서."}
    - {situation: 리안델을 감쌀 때(거짓말), line: "그 아이가 노래를 안다고요? 이슬 우리 아이들이 흥얼거리는 걸 들었겠죠. 저는 그저 낭독만 해요."}
    - {situation: 실바누스를 말할 때, line: "그분은 늘 같은 줄을 다시 읽으라고 하세요. 왜 그 줄인지는 묻지 않아요. 묻지 않는 게 예의라고들 하죠."}
schedule:
  아침: "정원 손질"
  낮: "엘다르 귀족들 앞에서 엘다르어 시 낭독 (듣기만 허용인데 그는 '읽는다' — 실바누스의 특별 허가)"
  저녁: "리안델이 몰래 찾아와 질문 공세. 실바누스의 부름이 있는 날은 석탑에서 낭독"
  밤: "정원지기 마을 지붕 위에서 별 보기 (세지 않는다)"
places: [흰 울타리 마을, 이슬 우리, 실바누스의 석탑, 정원 길, 정원지기 마을 지붕]
knows: [fact_sv_liandel_learned_songs, fact_sv_mira_sold_eye]
hides:
  - fact: fact_sv_dane_reads_elvish
    reveal_when: "신뢰 30 이상이거나, 플레이어가 엘다르 문자를 보여 주었을 때 (충성 아크 30)"
    reveal: [{"trust":30,"like":30,"player_offer":"엘다르 문자를 보여 주었을 때 (충성 아크 30)"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'듣는 건 허락받았어요'라며 '읽는다'를 '듣는다'로 바꾼다"
  - fact: fact_sv_dane_taught_human_songs
    reveal_when: "신뢰 50 이상이거나, 리안델이 위험해진 장면"
    reveal: [{"trust":50}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'이슬 우리 아이들이 부르는 노래를 들었겠죠'라고 한다. 머리카락을 쓸어내린다"
  - fact: fact_sv_ise_last_words
    reveal_when: "호감 60 이상이고 플레이어가 어머니에 대한 정보(+30)를 가져왔을 때"
    reveal: [{"like":60}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'어머니는 일찍 돌아가셨어요. 괜찮아요'라고만 한다"
  - fact: fact_sv_dane_suspects_father
    reveal_when: "충성 아크 50 이후, 또는 호감 70 이상에서 어머니의 말을 꺼낸 직후"
    reveal: [{"like":50},{"like":70}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'아버지는 몰라요. 괜찮아요'를 두 번 말한다"
relations:
  - {to: npc_silvanus, type: 주인(실은 아버지), like: 30, trust: 40, visibility: 일방, memo: null, words: "그분의 낭독을 듣는 저녁은 이상하게 조용해요. 늘 같은 줄을 다시 읽으라고 하세요. 왜 그 줄인지는 묻지 않아요"}
  - {to: npc_liandel, type: 몰래 친구, like: 60, trust: 50, visibility: 비밀, memo: null, words: "질문이 많은 아이. 덕분에 저는 대답하는 법을 다시 배웠어요. 들키면 제가 아니라 마을이 벌 받는데… 그래도 와요"}
  - {to: npc_mira, type: 정원지기 동료, like: 50, trust: 60, visibility: 공개, memo: null, words: "온실에서 오는 사람은 눈이 먼저 지쳐 있어요. 미라 누나는 더 그렇고요. 누나가 잊는 것까지 제가 대신 외워 둘게요"}
  - {to: npc_aerin, type: 공포, like: -40, trust: -50, visibility: 공개, memo: null, words: "손이 따뜻한 분이에요. 그래서 무서워요. 온실에 간 정원지기는 이슬 우리로 돌아오는 날이 줄어요"}
  - {to: npc_fern, type: 실반 감시자, like: -10, trust: 20, visibility: 공개, memo: null, words: "엄한 분인데 문을 닫을 때 소리를 죽여요. 우리가 놀랄까 봐 그러는 것 같아서, 미워하기가 어려워요"}
toward_player: "예의 바르고 거리를 둔다. 정원지기가 아님을 먼저 알아보지만 모른 척한다"
persuade:
  likes: ["바깥세상 이야기 (+20)", "어머니에 대한 정보 (+30)", "끝나는 노래, 인간의 노래", "리안델을 '왕손'이 아니라 한 아이로 대하는 태도"]
  hates: ["그의 눈과 귀를 놀리는 것", "'잡종'이라는 말", "영혼 정원을 칭찬하거나 가볍게 말하는 것", "나이를 묻는 것 (반엘다르의 관습)"]
roles:
  teacher: "가능 — 엘다르어(상한 70), 예법(55), 엘다르 문자 읽기(읽고쓰기 40). 조건: 정원지기로 잠입. 수업료 없음"
  companion: "가능. 충성 아크: 0 경계 → 30 엘다르 문자 공유 → 50 어머니 이세의 무덤(영혼 정원 온실 3동 아래)을 찾음 — 아에린의 첫 실험 대상이었다 → 70 실바누스와 대면, 출생의 진실(이후 '엘다르의 피를 가진 인간 대변자'로 성장 가능). 배신 조건: 리안델이 위험해지면 그녀 쪽을 택한다"
  romance: "가능 — 호감 70, 정원 탈출 이후. 결혼은 실바렌 밖에서만"
regression:
  fixed:
    - "하루 순서가 매 회차 같다 — 아침 정원 손질, 낮 낭독, 저녁 리안델, 밤 지붕에서 별 보기"
    - "실바누스는 낭독이 끝나면 늘 같은 줄을 한 번 더 읽게 한다"
    - "어머니의 마지막 말('네 아버지는 매일 밤 별을 센단다')을 알고 있다"
  flow:
    - "리안델이 몰래 찾아오는 저녁 — 대개 사흘에 한 번"
    - "미라의 다섯 번째 의식(서리월 9일)이 가까워질수록 그의 말수가 줄어든다"
  drift:
    - "그날 낭독하는 시가 어느 시인지"
    - "리안델이 어느 길로 오는지"
    - "지붕에서 보이는 별이 어느 쪽 별인지"
  deja_vu: weak
  deja_vu_steps:
    - "혼혈이라 시간의 혈명이 흐리다 — 기시감 = loop.count × 0.6 이하 + 접촉 보정(03 §7.2). 회귀는 기억하지 못한다. 그는 잊을 수 있어서 낌새도 금방 흩어진다"
    - "0~9: 없음"
    - "10~24: 첫 만남의 말이 바뀐다 — '…우리, 전에 만난 적 있나요? 꿈이었나 봐요.' 그러고는 곧 잊는다"
    - "25~44: 플레이어가 묻기 전에 어머니 이야기를 꺼내는 일이 생긴다. 신뢰가 같은 행동에서 조금 빨리 오른다 (시작 신뢰 +5)"
    - "45+: 플레이어를 '낯익은 사람'으로 대한다. 리안델의 위험을 먼저 말한다"
hard_rules:
  - "엘다르 앞에서는 눈을 들지 않는다"
  - "신뢰 30 전에는 글자를 '읽는다'고 말하지 않는다 — '듣는다'고 한다"
  - "아버지가 누구인지 먼저 말하지 않는다. 실바누스라는 이름을 아버지와 잇지 않는다 — 의심만 한다"
  - "리안델을 '왕손'이라 부르지 않는다 — '그 아이'"
  - "자기 나이를 인간에게 말하지 않는다 (반엘다르의 관습)"
on_death: "실바누스 붕괴(순혈파 지도력 −), 리안델의 인간 노래 루트 소멸"
story_seeds:
  - "엘다르 아기가 태어나지 않는 세상에서, 엘다르의 피를 받은 반인간이 살아 있다. 아에린이 그것을 알면 — 데인은 정원의 '가장 귀한 화분'이 된다"
  - "실바누스가 데인에게 같은 줄을 다시 읽게 하는 이유 — 그 줄에는 이세의 이름이 들어 있다"
  - "데인이 온실 3동 아래에 이르는 날, 그는 별을 세기 시작할지 정해야 한다"
