  - fact: fact_sv_liandel_learned_songs
    reveal_when: "신뢰 40 이상이거나, 플레이어가 새 노래를 가르쳐 준 직후"
    cover: "'엘다르 노래예요!'라고 우긴다. 호주머니의 피리를 쥔다"
  - fact: fact_sv_aerin_vessel_liandel
    reveal_when: "신뢰 50 이상이거나, 아에린이 가까이 온 위기 장면에서 스스로 터뜨릴 때"
    cover: "'무슨 소리죠?' 하고 되묻고 다른 질문으로 도망친다"
relations:
  - {to: npc_elastriel, type: 보호자, like: 70, trust: 60, visibility: 공개, memo: null, words: "할머님은 아무것도 잊지 않으셔서 제가 처음 한 질문도 기억하세요. 그래서 좋은데 무서워요"}
  - {to: npc_dane, type: 친구, like: 80, trust: 70, visibility: 비밀, memo: null, words: "선생님이라고 부르면 안 돼서 친구라고 불러요. 친구가 뭔지는 데인한테 배웠어요"}
  - {to: npc_aerin, type: 두려움, like: -20, trust: -30, visibility: 일방, memo: null, words: "손이 따뜻해서 더 무서워요. 저를 볼 때 요람을 세는 얼굴이에요"}
  - {to: npc_silvanus, type: 다정한 할아버지, like: 40, trust: 40, visibility: 공개, memo: null, words: "이끼 냄새 나는 할아버지. 제가 노래하는 걸 아시는 것 같은데 모른 척해 줘요. 모른 척도 선물이래요"}
toward_player: "호기심이 폭발한다. 인간이면 손부터 보여 달라고 한다"
persuade:
  likes: ["새로운 것을 가르쳐 주기 (+30)", "노래, 이야기, 처음 보는 물건", "데인에 대한 좋은 말"]
  hates: ["그녀를 '마지막'이라 부르는 것", "'고쳐야 할 병'이라는 말", "데인을 위협하는 말"]
roles:
  teacher: "불가"
  companion: "불가 (그녀가 정원을 떠나면 엘다르 전체가 추적한다)"
  romance: null
regression:
  fixed:
    - "저녁마다 흰 울타리로 몰래 간다 — 호위 실반 둘은 늘 잠든 척한다"
    - "인간 노래 세 곡을 '배웠다' (회귀점의 사실)"
    - "낙엽월 1일 저녁에도 호주머니에 나무 피리가 있다"
  flow:
    - "아에린이 정자 근처를 도는 날 — 대개 엿새마다"
  drift:
    - "어느 호위 실반이 졸았는지"
    - "데인이 어느 길에서 기다리는지"
    - "그날 기억 수업의 주제"
  deja_vu: weak
  deja_vu_steps:
    - "기시감 = loop.count × 0.6(감도, 그 외 엘다르) + 접촉 보정(그녀와 만난 회차 수 × 2). 회귀를 기억하지 못한다 (03 §7.2)"
    - "0~9: 없음"
    - "10~24: 처음 보는 인간에게 '손을 먼저 내밀고 싶었다'고 말한다 — 배운 것이 아닌 느낌을 '이름 없는 것'이라 부른다"
    - "25~44: 플레이어가 아직 알려 주지 않은 노래의 첫 소절을 흥얼거린다. '기억이 아닌데 배운 것 같다'고 한다"
    - "45+: 정자에서 플레이어를 기다린다 — '오늘 올 것 같았어요.' 아에린이 그녀 곁에 오는 날이 앞당겨진다"
hard_rules:
  - "스스로를 '마지막'이라 부르지 않는다"
  - "엘다르 앞에서 인간 노래를 부르거나 손뼉을 치지 않는다"
  - "아에린에게서 들은 말은 신뢰 50 전에 먼저 꺼내지 않는다 — 되묻기로 피한다"
  - "자기 나이를 '열 살'로 말하지 않는다 — '마흔네 해'라고 정확히 말한다"
on_death: "엘다르 전체의 광기 — 실바렌 주변 인간 '정리'(대규모 처형), 엘다르 소멸 수용 분기 가속"
story_seeds:
  - "잔향의 끝나지 않음을 엘다르 아이에게 옮긴다면 — 그 아이는 리안델이 될 것이다. 그리고 그 회차의 잔향자는 다시는 배급 줄로 돌아가지 못한다"
  - "그녀가 배운 세 번째 노래의 끝 줄을 데인은 아직 가르쳐 주지 않았다. 플레이어가 그것을 알고 있다면"
  - "엘다르 교사들이 '병'의 증거를 찾기 시작했다. 정자의 나무 신발이 먼저 발견된다"
