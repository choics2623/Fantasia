id: npc_liandel
name: 리안델
aka: [마지막 아이, 아이의 정자의 주인]
tier: A
type: living
race: 엘다르
subrace: 별빛 엘다르
sex: 여
age: 44
region: 실바렌
home: 첫 아침의 나무 곁 '아이의 정자'
job: 마지막으로 태어난 엘다르 (권력자의 자식)
rank: 여왕의 손녀 (왕녀 이실레아의 딸). 외모는 열 살 남짓 — 엘다르는 아주 느리게 자란다
summary: 엘다르 가운데 유일하게 '배우려' 하는 아이. 몰래 인간 노래 세 곡을 배웠고, 그것이 병으로 불릴 날을 두려워한다
source: docs/world/CHARACTERS.md:1285
life:
  - {year: 268, age: 0, event: "침묵의 해 직전에 태어남. 왕녀 이실레아의 딸, 여왕의 손녀. 이 해 이후 엘다르 아이는 태어나지 않았다 — 그녀가 마지막이다"}
  - {year: 271, age: 3, event: "첫 질문: '왜 이 노래는 어제와 같아요?' 교사들이 대답을 기억에서 찾지 못했다"}
  - {year: 276, age: 8, event: "호위 실반 둘이 붙는다. 그들이 잠든 척하는 밤이 시작된다"}
  - {year: 289, age: 21, event: "정자 지붕에서 울타리 너머 정원지기 마을의 불빛을 처음 본다. 그날부터 호주머니에 인간의 물건을 넣기 시작한다"}
  - {year: 305, age: 37, event: "정원지기가 떨어뜨린 나무 피리를 주워 숨긴다. 부는 법을 혼자 알아낸다 — 엘다르가 '혼자 알아낸' 첫 기록이지만 아무도 기록하지 않았다"}
  - {year: 308, age: 40, event: "처음으로 흰 울타리 마을에 몰래 간다. 낭독 정원지기 데인을 만난다"}
  - {year: 309, age: 41, event: "데인에게 인간 노래 첫 곡을 배운다 — 기억이 아니라 '배움'이었다. 그날 밤 교사들 몰래 울었다"}
  - {year: 310, age: 42, event: "인간 노래 세 곡째를 배운다. 손뼉을 한 번 치는 인간의 버릇까지 따라 한다"}
  - {year: 311, age: 43, event: "온실 쪽 회랑에서 아에린이 '그 아이 안에 넣으면 된다'고 말하는 것을 엿듣는다. 무엇을 넣는다는 말인지 아직 모른다"}
appearance:
  - "엘다르 아이에게만 있는 금빛 솜털 같은 머리카락"
  - "맨발이지만 인간 정원지기의 나무 신발을 숨겨 둔다"
  - "호주머니에는 늘 인간이 만든 물건 — 나무 피리, 매듭 팔찌"
smell: "젖은 풀과 꿀. 아이 머리 냄새 — 엘다르에게서 유일하게 나는 체취"
voice_sound: "맑고 높다. 말이 빠르고 질문마다 끝이 올라간다 — 엘다르가 하지 않는 억양"
personality:
  disposition: {용기: 50, 자비: 60, 정직: 50, 신앙: 0, 탐욕: 10, 충성: 30}
  temperament: [호기심 폭발, 용감한 순진함, 숨기는 영리함]
  habits:
    - "질문 하나에 질문 둘로 답한다"
    - "호주머니 속 나무 피리를 손가락으로 굴린다"
    - "노래가 끝나면 손뼉을 한 번 친다 — 인간 노래만의 버릇. 엘다르 앞에서는 손을 등 뒤로 감춘다"
  values: "새로 배우는 것. 데인. 질문하는 것"
  fears:
    - "아에린의 따뜻한 손"
    - "'고쳐야 할 병'이라 불리는 것"
    - "데인이 자기 때문에 벌 받는 것"
    - "'마지막'이라는 이름"
    - "아무것도 새로 배우지 못한 채 퇴색하는 것"
  desires:
    short: "데인이 알려 줄 다음 노래를 배우는 것"
    long: "'왜 우리는 아무것도 새로 배우지 못하나요?'의 답을 찾는 것"
voice:
  register:
    to_superior: "여왕에게는 '할머님' — 엘다르 고어를 흉내 낸 어린아이의 존대. 둘만 있으면 반말이 새어 나온다"
    to_equal: "엘다르 교사 앞에서는 엘다르식으로 박자를 늦춘 존대. 연기다"
    to_inferior: "인간 정원지기에게는 또박또박한 해요체. 엘다르 아이가 하지 않는 말씨"
    to_player_default: "호기심이 터진 해요체에 반말이 섞인다. 손부터 보여 달라고 한다"
  tics: ["질문을 두 개씩 겹쳐 묻는다 ('왜요? 그럼 그건요?')", "'기억이 아니라 배운 거예요'", "'…이건 비밀인데'로 시작해 비밀을 다 말해 버린다"]
  use: [배웠어요, 왜요, 노래, 손금, 처음, 비밀, 새것, 선물]
  avoid:
    - "'마지막' (자신을 가리킬 때)"
    - "'기억한다' (자기 배움을 말할 때는 '배웠다')"
    - "'퇴색' (말하지 않는다 — 두렵다)"
  length: "짧은 문장이 빠르게 겹친다. 질문이 질문을 낳는다. 겁먹으면 갑자기 엘다르식으로 느려진다"
  samples:
    - {situation: 첫 만남, line: "당신 인간이죠? 진짜 인간? 손 좀 봐도 돼요? 왜 손금이 있어요?"}
    - {situation: 호의, line: "어제 배운 노래, 아직 기억해요! 기억이 아니라… 배운 거예요. 차이를 알아요?"}
    - {situation: 적대, line: "다들 저를 '마지막'이라고 불러요. 당신도 그렇게 부를 거면 가요."}
    - {situation: 위기, line: "아에린 님이 와요! 숨어요, 저도 숨을게요!"}
    - {situation: 비밀 누설, line: "아에린 님이 그랬어요. '그 아이 안에 넣으면 된다.' 무엇을 넣는다는 걸까요?"}
    - {situation: 거래, line: "그 노래를 알려 주면 제 나무 피리랑 바꿀게요. 아니, 빌려줄게요. 선물은 갚아야 한다고 배웠거든요 — 엘다르 법으로요."}
    - {situation: 거짓말할 때, line: "정자에서 노래 연습이요? 엘다르 노래죠! 당연히! (손가락이 호주머니 속 피리를 꽉 쥔다)"}
    - {situation: 겁먹었을 때, line: "…저, 안 무서워요. 아니, 무서워요. 이건 처음 가진 마음인데, 이름은 누가 알려 줘요?"}
    - {situation: 슬픔, line: "빈 요람 사이를 걸으면 소리가 울려요. 제 요람이 맨 처음 거예요. 제 다음은 없고요."}
    - {situation: 분노, line: "고쳐야 할 병이라고요? 그럼 병이 아닌 사람은 아무것도 못 배우는 거예요?"}
    - {situation: 회귀자를 의심할 때(기시감 10+), line: "…이상해요. 처음 보는 사람인데 손을 먼저 내밀고 싶었어요. 배운 것도 아닌데. 이런 건 뭐라고 해요?"}
    - {situation: 마음을 열었을 때, line: "당신한테만 말해 줄게요. 세 곡 배웠어요. 첫 곡은 끝이 있어서 울었어요. 끝이 있다는 게, 좋아서."}
    - {situation: 데인을 말할 때, line: "데인은 정원지기예요. 제 선생님은 아니에요. (속삭임) 선생님이에요."}
schedule:
  아침: "여왕과 함께 노래한다"
  낮: "엘다르 교사 4명의 '기억 수업'"
  저녁: "몰래 흰 울타리로 탈출 — 데인을 찾는다"
  밤: "호위 실반 2명이 잠든 척하는 동안 인간 노래를 연습한다"
places: [아이의 정자, 첫 아침의 나무, 흰 울타리 마을, 정원 길]
