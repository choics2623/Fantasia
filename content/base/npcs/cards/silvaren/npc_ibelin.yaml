  - 예언을 '위협'이라 부르는 말
  - 모른다
  length: 인용할 때는 길게, 그 밖에는 짧게
  samples:
  - situation: 첫 만남
    line: 서고에 인간은 들이지 않소. …문 앞에서 기다리면 한 줄은 읽어 드릴 수 있소.
  - situation: 호의
    line: 이 구절은 위협처럼 들리지 않소. 읽어 보면 오히려 누군가를 기다리는 사람의 어조요.
  - situation: 적대
    line: 두루마리를 '저주'라 했소? 저주는 이렇게 조심스럽게 쓰이지 않소.
  - situation: 거래
    line: 손 기호 하나를 복원해 준다면 서고 문 안쪽에서 반 시간을 드리겠소.
  - situation: 거짓말할 때
    line: 복원실은 비어 있소. (문고리에서 손을 뗀다) 습기만 있소.
  - situation: 위기
    line: 두루마리가 젖소! 물이 아니라 눈물이라면 더 나쁘오 — 닦지 마시오, 번지니까!
  - situation: 슬픔
    line: 손 기호가 하나 사라질 때마다 낭송이 한 줄 줄어드오. 줄어든 낭송은 돌아오지 않소.
  - situation: 분노
    line: 이 두루마리를 불태우자는 말은 정원 전체를 불태우자는 말과 같소.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면 그대는 이 서고에 온 적이 없소. 그런데 두루마리가 그대를 향해 펴지는 것 같소.
  - situation: 마음을 열었을 때
    line: 예언의 뒷부분은 약속처럼 읽히오. 누가 누구에게 하는 약속인지는 아직 대지 못했소.
