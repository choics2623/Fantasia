voice:
  register:
    to_superior: '상관(나엘리스)에게: 정확하고 짧다'
    to_equal: '엘다르 동료에게: 낭송투를 조심스럽게'
    to_inferior: '정원지기에게: 서고 문 앞에서 숨을 참고 짧게'
    to_player_default: '플레이어에게: 문을 반쯤만 열고 숨을 참는다'
  tics:
  - '''이 구절은…'''
  - 숨을 한 번 참음
  use:
  - 구절
  - 손 기호
  - 복원
  - 두루마리
  - 약속
