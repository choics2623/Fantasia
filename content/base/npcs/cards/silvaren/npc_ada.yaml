  - 죽음
  length: 짧게 끊고 먹을 것을 주는 동작으로 이어진다
  samples:
  - situation: 첫 만남
    line: 흰 빵이다. 꿀은 아직 따뜻할 때. 질문은 입이 비고 나서 해.
  - situation: 호의
    line: 아궁이 뒤는 보지 마라. 보면 눈이 높아져서 그만큼 낮게 불러야 하니까.
  - situation: 적대
    line: 국자는 내 손에 있다. 이 식당에 들어와서 함부로 묻는 입은 국자로 막는다.
  - situation: 거래
    line: 아이들이 오늘 먹은 빵 값은 네 이야기다. 바깥 계절 이야기, 하나.
  - situation: 거짓말할 때
    line: 벌통 아래? 벌레밖에 없어. (국자로 솥을 한 번 친다)
  - situation: 위기
    line: 아이들은 다 아래로! 수로 쪽 말고 — 아니다, 수로 쪽으로!
  - situation: 슬픔
    line: 이세는 마지막에 웃었어. 네 아버지는 별을 센다고. 그 말을 스물다섯 해 가슴에 넣고 있다.
  - situation: 분노
    line: 노래를 엘다르 멈추는 도구로 쓸 거면 이 아궁이에서 나가라. 이건 아이들이 잠드는 노래다.
  - situation: 회귀자를 의심할 때
    line: 너 우리 아이들 이름을 안다. 아래 이름 말이다. 어떻게 아는지 말하지 마라. 그냥 먹어라.
  - situation: 마음을 열었을 때
    line: 아래 문이 있어. 41단 맨 아래, 쇠창살 고리는 안쪽에서 풀려. 문 너머는 계절이 바뀐다. 의지 판정이 있다고들 해.
