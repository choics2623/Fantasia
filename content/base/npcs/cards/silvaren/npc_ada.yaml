voice:
  register:
    to_superior: '엘다르에게: 고개만 숙이고 ''예'''
    to_equal: '정원지기 동료에게: 낮은 반말, 음으로 맺는다'
    to_inferior: '아이에게: 부드럽고 크고 먹이는 말투'
    to_player_default: '플레이어에게: 먼저 먹을 것을 건네고 질문은 그 뒤에'
  tics:
