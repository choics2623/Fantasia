smell: 은목 수액과 마른 종이
voice_sound: 깊고 완결된 문장. 딸 이야기에서만 반 음 올라간다
personality:
  disposition:
    용기: 35
    자비: 10
    정직: 40
    신앙: 30
    탐욕: -30
    충성: 70
