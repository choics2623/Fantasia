  values: 딸. 선례를 만드는 것. 막지도 돕지도 않는 중립이 비겁이 되는 날을 피하는 것
  fears:
  - 아에린의 손이 딸 머리 위에 오래 머무는 것
  - 어긋남 선언이 취소되지 않는 것
  - 44년이 아니라 400년이 지나도 아이가 없는 것
  desires:
    short: 맹약회의 313에서 흰 알 섭정안을 통과시키는 것
    long: 딸이 그릇이 되지 않는 세상에서 엘다르가 '다시 기억'하는 것
voice:
  register:
    to_superior: '여왕에게: 어머니로서 낭송투를 낮춘다'
    to_equal: '엘다르 동료에게: 격식 낭송, ''기억을 대어 보면'''
    to_inferior: '정원지기에게: 정중하지만 눈을 맞추지 않는다'
    to_player_default: '플레이어에게: 격식 뒤에 한 박자 따뜻함'
  tics:
  - '''기억을 대어 보면'''
  - '''한 박자 남았소.'''
  use:
  - 대리
  - 선례
  - 한 박자
  - 아이
  - 섭정
  - 다시 기억
  avoid:
  - 마지막(아이를 가리킬 때)
  - 소멸
  - 반역
  length: 완결된 문장을 천천히. 딸 이야기가 나오면 문장이 짧아진다
  samples:
  - situation: 첫 만남
    line: 기억을 대어 보면, 그대의 얼굴은 선례에 없소. 그것이 오늘 내가 그대에게 말을 거는 이유요.
  - situation: 호의
    line: 아이가 태어나는 곁에 서 보는 일. 우리는 44년 동안 그것조차 해 보지 못했소.
  - situation: 적대
    line: 내 딸을 '마지막'이라 부르는 입은 이 정원에서 다시 말하지 못하게 되오.
  - situation: 거래
    line: 흰 알 섭정안에 표를 줄 수 있다면 그대의 청 하나를 의회 앞에서 낭송하겠소.
  - situation: 거짓말할 때
    line: 어긋남은 없소. (소매 속 종이를 만진다) 한 박자도.
  - situation: 위기
    line: 어긋남을 선언하겠소. …아니, 아직이오. 아직 한 박자 남았소.
  - situation: 슬픔
    line: 그 아이는 기억하는 대신 배우려 하오. 그것이 병인지 선물인지 선례가 없어 대지 못하오.
  - situation: 분노
    line: 존속파 2,000의 기억과 내 한 박자가 맞서는 날, 그대들은 무엇을 낭송하려오.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면 처음인데, 어머니의 낭송에서 들은 말투와 닮았소. …모르겠소.
  - situation: 마음을 열었을 때
    line: 딸이 인간 노래를 부르는 것을 압니다. 병이라 부를 의회 앞에서 나는 어머니이고 싶소.
  - situation: 비밀 누설
    line: 아에린이 딸 머리 위에서 손을 멈추는 시간을 세어 보았소. 열을 넘기는 날 나는 어긋남을 선언하오.
