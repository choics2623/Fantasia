  register:
    to_superior: '멜리산드에게: 극존대 하오체'
    to_equal: '엘다르에게: 한 박자 늦은 격식 하오체'
    to_inferior: '인간에게: 짧은 명령형 반말, 이름은 묻지 않는다'
