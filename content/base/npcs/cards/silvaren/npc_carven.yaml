  samples:
  - situation: 첫 만남
    line: 기다리겠소. 이곳의 시간은 우리 것이 아니니, 협정서도 이곳의 속도로 읽혀야겠지.
  - situation: 호의
    line: 도면 한 장이 은목재 열 짐보다 값지다고 합니다. 값이라는 말은 이곳에서 쓰지 않지만.
  - situation: 적대
    line: 정원에서 용인의 비늘 이야기를 입에 올린 자는 정원 밖에서도 용인의 이름을 듣게 되오.
  - situation: 거래
    line: 협정에 대한 의문이 있다면 서면으로 올리시오. 서면은 내 주군이 읽소.
  - situation: 거짓말할 때
    line: 도면? 문서일 뿐이오. 은목재 선적 목록이지. (인장 반지를 하나 굴린다)
  - situation: 위기
    line: 서신을 태우시오! …태워서는 안 되오. 재가 남으면 안 되니까.
  - situation: 슬픔
    line: 아에린 경은 인간을 새싹이라 부르오. 나는 그 말이 불편한 것이 아니라 정확하다는 것이 불편하오.
  - situation: 분노
    line: 멜리산드 님이 알면 그대 목은 한 번에 끝나지 않소. 그것만은 약속드리겠소.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면… 아니, 우리 용인은 기억을 대지 않소. 다만 그대의 눈이 낯이 익소.
  - situation: 마음을 열었을 때
    line: 미라는 90 비늘에 팔렸소. 나는 그 서류에 증인으로 서명했소. 이름 칸이 비어 있었소.
