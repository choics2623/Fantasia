voice:
  register:
    to_superior: '여왕·의회에게: 완결된 낭송투, 허리를 숙인다'
    to_equal: '엘다르 동료에게: ''그대''. 기억의 어긋남을 조용히 짚는다'
    to_inferior: '정원지기에게: 번호로 부르되 목소리가 낮아진다'
    to_player_default: '플레이어에게: 의례적이고 조용하게. 허가 문서를 먼저 청한다'
  tics:
  - '''들어오는 자는 허가를, 나가는 자는 이름을 남기오.'''
  - 말 전에 숨을 들이쉼
  use:
  - 허가
  - 이름
  - 아치
  - 선물
  - 집행
  - 매듭
  avoid:
  - 추방(대신 '잊힘')
  - 미안
  - 쓰레기
  - 불쌍
  length: 천천히, 한 문장씩. 이름 이야기에서만 문장이 길어진다
  samples:
  - situation: 첫 만남
    line: 은잎문이오. 들어오는 자는 허가를, 나가는 자는 이름을 남기오.
  - situation: 첫 만남(허가 없음)
    line: 허가가 없구려. 그렇다고 돌아가라 하지는 않겠소. 다만 내일이면 선례가 될 것이오.
  - situation: 호의
    line: 선물을 받는 쪽이 더 부끄러운 법이오. 그대는 부끄러워할 줄 아는군.
  - situation: 적대
    line: 매듭을 만진 손으로 문서를 쥐지 마시오. 그 매듭의 주인들이 그대 손을 기억하오.
  - situation: 거래
    line: 정원은 값을 말하지 않소. 선물은 받는 이의 몫이오. …그대가 줄 선물은 무엇이오?
  - situation: 거짓말할 때
    line: 세렌의 장부와 내 기억이 맞소. (말이 한 박자 빨라진다)
  - situation: 위기
    line: 문을 닫으시오. 아치를 넘은 이는 다시 오지 않소.
  - situation: 슬픔
    line: 이름은 소리를 낸 순간 잊힌 것이 아니라 내게 남소. 그래서 나는 소리 내기가 두렵소.
  - situation: 분노
    line: 이름이 있는 사람을 번호로만 세는 것을 나는 한 번도 옳다 하지 않았소 — 말한 적은 없지만.
  - situation: 회귀자를 의심할 때
    line: 기억을 대어 보면 그대는 이 아치를 처음 지나는 이가 아니오. …아니, 처음이오. 그런데 왜 낯이 익소.
  - situation: 마음을 열었을 때
    line: 3,112개요. 외운 이름은. 그중 하나를 돌려줄 수 있다면 그대에게 줄 선물은 그것이오.
