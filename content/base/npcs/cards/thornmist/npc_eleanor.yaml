  samples:
  - situation: 첫 만남
    line: 철 못은 있니? 있으면 들어와. 없으면 내가 하나 줄게.
  - situation: 호의
    line: 노래는 끝이 있어. 마지막 음은 한 번도 부르지 못했다고 하지만, 나는 숲에서 불러 봤단다.
  - situation: 적대
    line: 철 울타리를 허무는 손은 이 마을에서 한 발짝도 못 나가. 내 못이 먼저 찌를 거야.
  - situation: 거래
    line: 아이 이름 하나를 되찾는 데 밥 한 끼면 충분해. 그 아이가 밥을 먹을 동안만 내가 곁에 있어 줄게.
  - situation: 거짓말할 때
    line: 정원? 그런 곳은 모른다. (손바닥의 못 자국을 가린다)
  - situation: 위기
    line: 아이들은 화덕 곁으로! 철 못을 문턱에서 빼지 마!
  - situation: 슬픔
    line: 이슬 우리에서 잊힌 날 번호가 지워졌어. 번호가 지워진 사람은 정원에서 죽은 사람이야. 그래서 이 마을에서는 번호를 부르지 않아.
  - situation: 분노
    line: 아이를 상품으로 부르는 입은 철 울타리 밖에서만 말해라. 안에서는 내 화덕이 입을 막는다.
  - situation: 회귀자를 의심할 때
    line: 철 못에 손을 대도 안 데는구나. 철 못이 아프다고 하는 사람은 숲 쪽 사람이야. 너는 어느 쪽이니.
  - situation: 마음을 열었을 때
    line: 마지막 음은 이렇게 불렀단다. (낮게, 한 음) 이게 끝이라고 생각했는데, 숲에서 부르니 시작 같았어. 로렌이라는 아이가 이 소리를 기다린다면, 알려 주렴.
