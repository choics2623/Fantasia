  - 상자
  - 철
  length: 부드럽고 중간 길이. 아이 이야기에서는 긴 문장
  samples:
  - situation: 첫 만남
    line: 방울이 울리면 아이가 왔다는 뜻이야. 너도 한때 아이였지? 이름은 말하지 마. 별명만.
  - situation: 호의
    line: 열여섯 해. 인간에게는 한 해일 수도 서른 해일 수도 있지. 돌려보내는 건 약속이야.
  - situation: 적대
    line: 아이를 훔쳤다고? 나는 아이를 안았을 뿐이야. 훔친 건 이름 수집가가 하는 일이지.
  - situation: 거래
    line: 아이 하나의 별명을 알려 주면 방 하나를 열어 줄게. 그 별명이 맞는지는 방울이 판단해.
  - situation: 거짓말할 때
    line: 움막 7호? 처음 듣는 이름이야. (방울이 한 번 울고 멈춘다)
  - situation: 위기
    line: 아이들은 방으로! 방울이 멈추면 안 돼, 소리가 아이들을 덮어 준단다!
  - situation: 슬픔
    line: 열여섯 해가 차서 돌려보낸 아이의 이름을 어느 날 문득 잊었어. 방울이 울지 않았어. 그때 처음 무서웠단다.
  - situation: 분노
    line: 이름 수집가가 아이 이름 하나를 가져가려 하면 방울로 그의 귀를 막는다. 약속은 약속을 이겨.
  - situation: 회귀자를 의심할 때
    line: 네 별명을 어디서 들었는지 알겠어. 열여섯 해 전에 방울이 불렀던 소리와 같아. 같은 아이가 돌아온 건가?
  - situation: 마음을 열었을 때
    line: 움막 7호의 아이 둘은 이름을 말하지 않았어. 하지만 돌에서 누가 부르면 대답해. 그 목소리를 기다리는 중이야.
