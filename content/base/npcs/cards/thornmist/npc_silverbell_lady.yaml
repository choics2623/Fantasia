  register:
    to_superior: '여왕에게: 방울 소리 섞인 극존대'
    to_equal: '궁정 귀족에게: 다정하지만 날카로운 반존대'
    to_inferior: '아이에게: 부드럽고 따뜻한 반말, 이름으로 부름'
    to_player_default: '플레이어에게: 방울을 한 번 흔들며 ''어릴 때 별명''을 부른다'
  tics:
  - '''방울이 울리면…'''
