on_death: 여름 궁정의 아이들이 이름 없이 방치되어 이름 수집가에게 넘어갈 위험이 커진다. 회색여울의 사라진 아이 둘이 돌아갈 길이 하나 줄어든다
story_seeds:
- 아이 잃은 돌에서 이름을 부르면 방울이 한 번 울린다. 그 이름이 맞으면 부인은 돌려보낼 약속을 먼저 꺼낸다 — 약속의 대가는 아직 그녀도 모른다
- 열여섯 해가 차는 아이가 곧 돌아가고, 그 자리를 채울 아이를 데려오는 시기가 가까워진다
- 움막 7호의 부모가 돌에서 부르는 목소리가 가장 먼저 닿는 곳이 이 방이다
