  event: 대붕괴 직후 숲 밖으로 처음 걸어 나감 — 뒤로
- year: 100
  age: 불명
  event: 숲 밖 철에 처음 닿아 걷는 방향이 바뀜. 이후 뒤로만 걷는다
- year: 213
