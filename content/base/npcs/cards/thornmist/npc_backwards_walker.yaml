appearance:
- 발자국이 앞으로 가는데 몸은 뒤를 보고 걷는다
- 가슴에 '어제'라 쓴 것 같은 거울 조각을 달았다
- 입이 뒤통수에 붙어 있는 듯 목소리가 뒤에서 들린다
smell: 안개와 젖은 가시
voice_sound: 낮고 뒤에서 들리는 목소리. 앞에서 말하면 목소리가 사라진다
personality:
  disposition:
    용기: 30
    자비: 0
