  - 고독
  habits:
  - 항상 상대를 등지고 서서 말한다
  - 발자국을 한 번 되돌아본다
  - 철 냄새가 나면 한 걸음 물러선다
  values: 여왕의 초대. 가장 좋은 장난감이 돌아오는 순간
  fears:
  - 철이 닿아 앞으로 걷는 것
  - 숲 안으로 끌려가는 것
