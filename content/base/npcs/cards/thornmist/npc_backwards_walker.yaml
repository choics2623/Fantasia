    long: 가장 좋은 장난감이 숲으로 돌아오는 것을 보는 것
voice:
  register:
    to_superior: '여왕에게: 뒤돌아서 극존대'
    to_equal: '페이에게: 뒤에서 들리는 반존대'
    to_inferior: '인간에게: 등을 보인 채 수수께끼'
    to_player_default: '플레이어에게: 뒤를 보고 서서 인사한다. 앞모습을 보이지 않는다'
  tics:
  - '''뒤로 와.'''
  - 발자국 돌아보기
  use:
  - 뒤로
  - 어제
  - 초대
  - 가시
  - 발자국
  avoid:
  - 고맙다
  - 철
  - 앞
  - 진짜 이름
  length: 짧고 수수께끼 같다
  samples:
  - situation: 첫 만남
    line: (등을 보인 채) 앞에서 오지 마. 뒤로 와. 그래야 네 얼굴이 어제 얼굴이 돼.
  - situation: 호의
    line: 초대장은 가시 한 가닥이야. 짐 속에 넣어 두었어. 열어 보지 않아도 돼, 이미 받았으니까.
  - situation: 적대
    line: 앞에서 말을 거는 건 무례가 아니야. 도전이야. 받을 거라면 철을 내려놓고.
  - situation: 거래
    line: 초대의 대가는 내가 말하지 않아. 네가 들을 때까지 기다릴 뿐이야.
  - situation: 거짓말할 때
    line: 옛 돌 고리? 나는 거기 있지 않았어. (발자국이 한 걸음 앞으로 간다)
  - situation: 위기
    line: 철! 철이 닿는다! 앞으로 걸으면 안 돼!
  - situation: 슬픔
    line: 처음 뒤로 걸은 날 발자국이 앞으로 갔어. 몸은 뒤인데 길은 앞이었지. 그날부터 나는 어디로 가는지 모른다.
  - situation: 분노
    line: 내가 앞으로 걷는 날은 너희가 숲에 들어오는 날이야. 그러니 철을 아끼지 마.
  - situation: 회귀자를 의심할 때
    line: 네 발자국은 내 발자국과 닮았다. 앞으로 간 줄 알았는데 뒤로 가 있다. 너도 한 번 뒤로 걸었구나.
  - situation: 마음을 열었을 때
    line: 여왕이 '이름을 알아 오라'고 했어. 나는 못 알아. 네가 말해 줄 수 있다면 대가는 이름이 아니라 앞으로 걷는 한 걸음이면 돼.
