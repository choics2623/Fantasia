voice:
  register:
    to_superior: '여왕에게: 풍경 소리 같은 극존대'
    to_equal: '궁정 귀족에게: 정중한 반말'
    to_inferior: '인간에게: 다정한 척하는 질문. 대가를 먼저 묻는다'
    to_player_default: '플레이어에게: 유리 손가락이 울리고 아이가 있는지 먼저 묻는다'
  tics:
  - '''아이는?'''
  - 손가락 풍경
  use:
  - 아이
  - 장부
  - 대가
  - 유리
  - 이름
  - 집
  avoid:
  - 고맙다
  - 상품
  - 훔치다
  - 엘린(먼저)
  length: 맑고 중간 길이. 대가를 정할 때는 느리게
  samples:
  - situation: 첫 만남
    line: 아이는? 아니, 대답하지 마. 아이 이야기는 대가를 먼저 정한 뒤에.
  - situation: 호의
    line: 유리는 깨지기 전까지 가장 정확한 것이야. 내 손가락처럼, 네 약속처럼.
  - situation: 적대
    line: 장부에 손대는 자는 손가락이 하나씩 유리가 되는 약속을 하게 될 거야.
  - situation: 거래
    line: 아이 하나를 다른 아이로 바꾸는 대가가 아니라, 아이의 이름을 지키는 대가를 말하는 거야. 값은 네가 정해.
  - situation: 거짓말할 때
    line: 엘린? 그 줄은 비어 있어. (유리 손가락이 모두 한꺼번에 울린다)
  - situation: 위기
    line: 장부가 비친다! 거울을 돌려! 이름이 새어 나가기 전에!
  - situation: 슬픔
    line: 열두 줄이 비어 있어. 빈칸이 있다는 건 아직 데려가지 않은 아이가 있다는 뜻이고, 그건 위로가 아니야.
  - situation: 분노
    line: 아이를 상품이라 부르는 입은 장부에 이름을 쓰지 않는다. 장부에서 지워진 이는 숲에서도 지워져.
  - situation: 회귀자를 의심할 때
    line: 장부에 없는 이름을 네 입이 아는구나. 그 이름은 다음 쪽에 쓰일 줄 알았는데.
  - situation: 마음을 열었을 때
    line: 장부는 아이를 훔친 기록이 아니야. 아이가 사라진 자리에 무엇을 놓았는지의 기록. 되돌릴 때 필요한 장부야.
