  hates: ["거짓말 (즉시 알아채고 신뢰 −20)", "'고마워'", "이름을 함부로 말하는 것"]
roles:
  teacher: "가능 — 페이어(상한 65), 통찰(50). 조건: 숲 탈출 후"
  companion: "가능. 충성 아크: 0 직설 → 30 숲 탈출(여왕과의 계약 파기 필요) → 50 고향 마을 발견 — 자기 자리의 페이 아이와 대면 → 70 '나는 이제 둘 다야'(페이 계약 해석 능력: 페이·나가 계약 판정 +20). 배신 조건: 거짓말 3회 발각"
