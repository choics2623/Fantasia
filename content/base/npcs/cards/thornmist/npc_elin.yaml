    cover: "주먹을 쥐고 '손바닥엔 아무것도 없어요~'라고 한다. 목소리가 한 음 내려간다 — 그녀 자신이 거짓말을 한 것이다"
relations:
  - {to: npc_nibble, type: 납치범·양육자, like: 10, trust: -40, visibility: 공개, memo: null, words: "나를 데려온 이. 키운 이. 거짓말만 하는 이. 미워하려면 날개 소리가 너무 가여워요"}
  - {to: npc_thorn_queen, type: 주인, like: -20, trust: -60, visibility: 공개, memo: null, words: "얼굴이 내가 가장 그리운 얼굴로 보이는 날이 있어요. 그날은 눈을 감아요"}
  - {to: npc_odo, type: 장난감 정원 동료, like: 60, trust: 70, visibility: 공개, memo: null, words: "같은 춤을 추면서도 매일 다른 얼굴을 하는 아저씨. 시간을 알려 주면 검 잡은 손이 떨려요"}
toward_player: "놀랄 만큼 직설적이다. 거짓은 냄새로 안다. '고마워'를 하려는 사람부터 말린다"
persuade:
