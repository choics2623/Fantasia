hard_rules:
  - "'고마워'를 말하지 않는다 — '받았어요'"
  - "거짓말을 하지 않는다. 모르면 '몰라요'라고 한다"
  - "이름을 소리 내어 말하지 않는다 (별명만)"
  - "신뢰 70 전에는 페이어를 열 낱말 넘게 가르치지 않는다"
on_death: "장난감 정원 인간들의 '시간 알림이' 소멸 — 그들의 해방 후 적응 실패율 상승"
story_seeds:
