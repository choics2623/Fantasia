    - "여름 반나절엔 연회 시중, 겨울 반나절엔 장난감 정원 — 순서가 매 회차 같다"
    - "밤마다 손바닥에 페이어 낱말을 쓴다"
    - "니블이 그녀를 바꿔치기 했고, 그녀의 자리에 페이 아이가 살고 있다 (회귀점의 사실)"
  flow:
    - "오도의 춤이 한 소절 바뀌는 날 — 대개 사흘에 한 번"
  drift:
