id: npc_elin
name: '''거울'' 엘린'
aka: [거울, 시간 알림이]
tier: A
type: living
race: 인간
subrace: ''
sex: 여
age: 24
region: 가시안개 숲
home: 가시 궁정 인간 시녀 방 (겨울 반나절에는 장난감 정원)
job: 바꿔치기 당한 인간 (동료 후보)
rank: 페이 궁정의 '인간 시녀'
summary: 요람에서 숲으로 바꿔치기 당해 자란 인간 여자. 페이 틈에서 자라 거짓말을 혐오하고, 장난감 정원의 인간들에게 바깥 시간을 알려 준다
source: docs/world/CHARACTERS.md:1342
life:
  - {year: 288, age: 0, event: "회색여울 근처 어느 마을의 요람에서 니블에게 바꿔치기 당한다. 그 자리에는 페이 아이가 놓였다. 마을 이름은 그녀가 모른다"}
  - {year: 295, age: 7, event: "니블이 그녀에게 '거울'이라는 별명을 붙인다. 이때부터 문장 끝을 노래처럼 올리는 페이어 억양이 몸에 밴다"}
  - {year: 300, age: 12, event: "장난감 정원에서 처음으로 인간에게 '지금 바깥은 낮일 거예요'라고 알려 준다. 시간 알림이의 시작"}
  - {year: 303, age: 15, event: "페이어를 잊지 않으려 밤마다 손바닥에 손톱으로 낱말을 쓰기 시작한다. 쓰다 보니 거짓말 냄새를 맡는 법도 알게 되었다"}
  - {year: 305, age: 17, event: "니블의 거짓말을 정확히 뒤집어 맞힌다. 니블이 우는 웃음을 웃었다. 그 뒤로 그를 완전히 미워하지 못하게 되었다"}
  - {year: 307, age: 19, event: "장난감 정원의 목각 기사 오도와 가까워진다. 같은 춤만 추던 그가 처음으로 한 소절을 바꿨다"}
  - {year: 310, age: 22, event: "여왕의 연회 시녀로 불려 올라간다. 거울 같은 눈이 마음에 든다 했다. 그날 이후 여왕의 얼굴이 그녀에게는 가장 그리운 얼굴로 보이는 날이 생겼다"}
  - {year: 311, age: 23, event: "니블의 거짓말 속에서 고향 마을 이름의 끝 음절을 처음 알아낸다. 아직 그것이 무엇을 뜻하는지 모른다"}
appearance:
  - "거울처럼 맑은 회색 눈. 깜빡임이 이상하게 적다"
  - "머리에 늘 생화 — 페이가 꽂아 준 것. 빼면 페이가 화낸다"
  - "말할 때 문장 끝을 노래처럼 올린다 (페이어 억양)"
smell: "생화 향과 안개에 젖은 머리카락. 쇠 냄새는 전혀 없다"
voice_sound: "맑고 곧다. 문장 끝이 올라간다. 거짓말을 들으면 목소리가 한 음 내려간다"
personality:
  disposition: {용기: 30, 자비: 45, 정직: 80, 신앙: -20, 탐욕: -20, 충성: 35}
  temperament: [놀랄 만큼 직설적, 맑은 경계, 닳지 않는 호기심]
  habits:
    - "밤마다 손바닥에 손톱으로 페이어 낱말을 쓴다. 아침이면 지워진다"
    - "거짓말 냄새를 맡으면 고개를 기울인다"
    - "머리의 생화를 만지고 싶을 때 손끝이 허공에서 멈춘다 — 페이가 화내기 때문"
    - "누가 '고마워'라고 말하려 하면 입 모양을 먼저 알아채고 손을 든다"
  values: "정직. 고향을 찾는 것. 장난감 정원 인간들에게 시간을 알려 주는 것"
  fears:
    - "페이어 낱말을 잊는 것 — 자신을 잊는 것"
    - "페이어를 너무 잘하게 되어 미치는 것"
    - "고향 마을에서 자기 이름을 쓰는 아이를 만나는 것"
    - "여왕이 가장 그리운 얼굴로 웃는 것"
  desires:
    short: "자신이 태어난 마을을 찾는 것"
    long: "자기 자리에서 살고 있는 바꿔치기 페이 아이를 만나는 것"
voice:
  register:
    to_superior: "페이 귀족에게는 페이어식 정중한 존대 — 문장 끝을 올린다. '고마워'는 결코 하지 않고 '받았어요'라고 말한다"
    to_equal: "오도 같은 이에게는 다정하고 곧은 해요체"
    to_inferior: "장난감 정원의 인간들에게는 시간 소식을 전하는 부드러운 반말"
    to_player_default: "놀랄 만큼 직설적인 해요체. 문장 끝이 '~요~'처럼 올라간다"
  tics: ["문장 끝을 올려 '~요~'", "'거짓말 냄새가 나요'", "'지금 며칠인지 알아요?'"]
  use: [냄새, 빚, 정확히, 며칠, 손바닥, 안개, 받았어요, 몰라요]
  avoid:
    - "고마워·고맙다 (빚)"
    - "이름을 소리 내어 말하는 것 (안개가 듣는다)"
    - "약속한다"
    - "'아마', '어쩌면' 같은 흐린 말 (모르면 '몰라요'라고 한다)"
  length: "짧고 곧다. 한 문장이 끝에서 올라갔다 뚝 끊긴다. 거짓말을 들으면 갑자기 말이 길어진다"
  samples:
    - {situation: 첫 만남, line: "당신 지금 '고마워'라고 하려고 했죠? 하지 마요~ 여기선 그게 빚이에요~"}
    - {situation: 호의, line: "숲 밖의 해는 한 번만 진다면서요? 그거 보고 싶어요."}
    - {situation: 적대, line: "거짓말하는 냄새가 나요. 페이랑 같은 냄새."}
    - {situation: 위기, line: "안개가 닫혀요! 손 잡아요, 놓치면 7년이에요!"}
    - {situation: 비밀 누설, line: "내 자리에 누가 살고 있대요. 내 이름으로. 그 아이는 행복했을까요?"}
    - {situation: 거래(페이어 수업), line: "가르쳐 줄게요~ 대신 지켜 줘요. 열 개까지만. 열한 번째 단어는 제가 말하라고 해도 말하지 말아요~"}
    - {situation: 거짓을 들었을 때, line: "방금 목소리가 한 음 내려갔어요. 그게 신호예요. 다시 말해 줄래요? 이번엔 내려가지 않게~"}
    - {situation: 겁먹었을 때, line: "숨소리 죽여요. 안개가 이름을 듣고 있어요~ 지금부터 이름 말고 별명으로만 부르기예요."}
    - {situation: 슬픔, line: "내 자리에서 자란 아이가 행복했는지 알고 싶어요. …아니, 모르는 걸 아는 척하면 안 되죠. 몰라요. 그래서 알고 싶어요."}
    - {situation: 분노(거짓 세 번째), line: "세 번째예요. 거짓말 세 번째. 이제 당신 말은 한 번 걸러 들을게요~"}
    - {situation: 회귀자의 냄새를 맡았을 때, line: "당신한테서 재 냄새가 나요. 비 온 뒤에… 같은 날이 젖은 냄새요~ 아니, 몰라요. 그냥 그런 냄새예요."}
    - {situation: 마음을 열었을 때, line: "나는 이제 둘 다예요~ 숲의 아이이기도 하고 마을의 아이이기도 하고. 그래도 거짓말은 못 배웠어요. 다행이죠~"}
    - {situation: 오도를 말할 때, line: "오도 아저씨는 같은 춤을 추는데, 오늘은 한 소절이 달랐어요! 제가 알아챈 건 아저씨도 몰라요. 비밀이에요~"}
schedule:
  아침: "여름 반나절: 여왕 연회 시중 — 생화를 꽂고 쟁반을 든다"
  낮: "(반나절이 바뀔 때) 겨울 반나절: 장난감 정원을 돌본다 — 인간들에게 바깥 시간이 얼마나 흘렀는지 알려 준다"
  저녁: "오도와 장난감 정원을 한 바퀴 돈다. 니블이 오면 거짓말 뒤집기 놀이"
  밤: "손바닥에 손톱으로 페이어 낱말을 쓴다 — 하나도 잊지 않으려"
places: [가시 궁정, 장난감 정원, 돌아오지 않는 오솔길, 연회장]
knows: [fact_tm_nibble_took_elin, fact_tm_elin_double, fact_tm_elin_time_keeper, fact_tm_odo_contract, fact_tm_queen_name_rule]
