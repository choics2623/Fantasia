    long: 모아 둔 웃음을 돌려줄 날을 만드는 것
voice:
  register:
    to_superior: '여왕에게: 가시 돋친 극존대'
    to_equal: '웃음 조각에게: 곧고 낮은 말'
    to_inferior: '인간에게: 웃은 날을 묻는 부드러운 질문'
    to_player_default: '플레이어에게: 가시를 건네며 웃은 날을 묻는다'
  tics:
  - '''웃은 날이 있나.'''
  - 가시 건네기
  use:
  - 웃은 날
  - 병
  - 기억
  - 가시
  - 초대장
  avoid:
  - 고맙다
  - 빼앗다
  - 도둑
  length: 중간 길이. 기억 이야기에서는 길고 부드러움
  samples:
  - situation: 첫 만남
    line: 웃은 날이 있나. 하나만. 오늘 초대장 한 가닥을 고르는 데 필요하니.
  - situation: 호의
    line: 곧게 말하는 것은 아프다. 하지만 네게는 아프지 않게 말해 주마. 초대장이 올 것이다.
  - situation: 적대
    line: 기억을 빼앗는다고? 나는 웃음을 모으는 거야. 울음은 가져가지 않아. 네가 우는 날은 네 것이다.
  - situation: 거래
    line: 웃은 날 하나를 병에 담아 주면 아스테리아 기억 한 장면을 보여 주마.
  - situation: 거짓말할 때
    line: 병에는 아무것도 없어. 안개만. (병을 소매에 감춘다)
  - situation: 위기
    line: 기억의 병이 깨진다! 웃음이 흩어지면 모두 한꺼번에 웃게 된다 — 막아라!
  - situation: 슬픔
    line: 그 도시는 하얗게 불탔고, 마지막 해의 기억은 웃음으로 가득했다. 그것이 가장 아프다.
  - situation: 분노
    line: 웃음을 훔쳐 온 것이 아니라 맡아 둔 것이다. 맡긴 사람이 잊었을 뿐이다.
  - situation: 회귀자를 의심할 때
    line: 네 웃음은 병 속의 웃음과 같은 소리를 낸다. 같을 리 없는데. 그 웃음은 AS 0의 것이다.
  - situation: 마음을 열었을 때
    line: 여왕이 이름 무덤에 묻은 이름이 그 하얀 도시의 이름과 같다. 나는 그것을 안다. 그리고 곧게 말한다. 묶여도 좋다.
