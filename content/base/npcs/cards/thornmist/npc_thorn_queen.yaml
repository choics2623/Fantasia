id: npc_thorn_queen
name: 가시 왕관의 여왕
aka: [겨울과 여름의 군주, 웃은 자, 이름을 부르면 안 되는 이]
tier: S
type: living
race: 페이
subrace: 겨울 궁정(두 궁정의 군주)
sex: 여(형상에 따라 바뀜)
age: 나이 개념 없음 (신살 이전부터)
region: 가시안개 숲
home: 가시 궁정 (방이 매일 바뀐다)
job: 신살 때 웃은 자 (정본)
rank: 가시안개의 여왕 — 여름 궁정과 겨울 궁정의 군주
summary: 신이 죽던 날 열한 종족 가운데 홀로 웃은 자. 자기 진명이 불리는 날이 죽음인지 해방인지 몰라, 3,400년 동안 잔향을 '구경'해 왔다
source: docs/world/CHARACTERS.md:1311
life:
  - {year: 신대, age: null, event: "에오르가 열두 종족을 빚던 때 꿈의 혈명에서 깨어난 첫 페이 가운데 하나. 이름이 있었으나 그날 이후 아무에게도 말하지 않았다"}
  - {year: 신대, age: null, event: "가시안개 숲에 첫 궁정을 세운다. 여름 궁정과 겨울 궁정이 반나절마다 서로의 자리를 갈아 앉는 규칙을 만든다"}
  - {year: -3088, age: null, event: "SK 0 신살. 그녀는 웃었다. 에오르가 죽어 가며 마지막 말을 인간에게 남기는 것을 보았고, 열한 종족의 공모가 결국 실패할 것을 알았기 때문이다. 그 말을 들은 것은 그녀뿐이었다. 그 웃음은 지금도 왕좌 뒤 가시 속에 갇혀 있다"}
  - {year: -2688, age: null, event: "SK ~400 엘다르가 인간 노예 '첫 불씨'를 정원째 태우던 날, 숲 경계에서 그 연기를 구경했다. '언니가 서두르는 것을 처음 보았다'고 훗날 한 줄 말했다"}
  - {year: -700, age: null, event: "SK 2,310~2,390 거인 전쟁. 방패로 쓰이던 인간 수십만이 죽는 것을 숲 경계에서 지켜본 80년. 그해 숲에서는 웃음소리가 들리지 않았다"}
  - {year: -9, age: null, event: "AS −9 아스테리온의 봉기. 백 번 넘게 죽고 돌아오는 인간을 안개 너머에서 구경하기 시작한다. 그녀가 본 가장 긴 연극이었다"}
  - {year: 0, age: null, event: "AS 0 대붕괴. 숲의 시간이 한꺼번에 흔들린 날, 웃음의 상자가 한 번 울렸다. 연극의 마지막 장은 그녀가 보지 못했다 — 이상하게 잊히지 않는다"}
  - {year: 268, age: null, event: "AS 268 침묵의 해. 엘다르 아이가 태어나지 않게 된 그해, 가시 궁정에서 가장 큰 웃음소리가 났다. 첫 아침의 나무 아래에서도 들렸다고 한다"}
  - {year: 311, age: null, event: "AS 311 '가장 좋은 장난감이 돌아왔다'며 숲 밖으로 사자(거꾸로 걷는 이)를 보내기 시작한다"}
appearance:
  - "이마에 살아 있는 가시덩굴 왕관 — 피를 빨아 장미를 피운다"
  - "얼굴이 보는 사람이 가장 사랑했던 사람의 얼굴로 보인다 (정신 판정 D 60 실패 시)"
  - "웃음소리가 들리면 주변 촛불이 전부 한쪽으로 기운다"
smell: "장미 즙과 피, 그리고 쇠 냄새를 피한 서늘한 단내"
voice_sound: "말끝이 늘 노래처럼 올라간다. 목소리 자체는 상대가 가장 편안해하는 높이로 맞춰진다. 웃음소리가 나면 촛불보다 먼저 방 안의 소리가 한쪽으로 기운다"
personality:
  disposition: {용기: 80, 자비: -50, 정직: -100, 신앙: -100, 탐욕: 40, 충성: -80}
  temperament: [변덕스러운 친절, 호기심의 잔혹, 지루함에 대한 공포]
  habits:
    - "질문에 대답하지 않고 되묻는다 — 대답은 계약이니까"
    - "가시 왕관의 장미를 한 송이 꺾어 상대에게 내민다. 받으면 빚이다"
    - "웃음을 셋까지 세어 두 번만 웃는다. 세 번째 웃음은 아껴 둔다"
    - "반짝이는 것과 거울을 등지고 앉는다"
  values: "재미. 한 번 한 약속은 반드시 지킨다 — 원하든 원하지 않든. 지루한 것은 가장 큰 죄"
  fears:
    - "누가 그녀의 이름을 말하는 것"
    - "이름이 불린 뒤에 아무것도 남지 않는 것 — 그것이 죽음인지 해방인지 모른다"
    - "지루함"
    - "웃음의 상자가 열려 웃은 이유가 드러나는 것"
  desires:
    short: "재미 — 지금은 '가장 좋은 장난감'인 플레이어"
    long: "자신의 진명을 '말할 수 있는 자'가 나타나는 것 (그 뒤가 두렵다)"
voice:
  register:
    to_superior: "그녀 위에는 없다. 에오르조차 '늙은 신'이라 부르며 비웃는다"
    to_equal: "다른 궁정의 높은 이에게는 정중한 농담. 존대하는 척하며 비꼰다"
    to_inferior: "시종과 인간 장난감에게는 다정한 하대 — '아가', '귀염둥이'. 이름 대신 별명으로 부른다"
    to_player_default: "극도로 다정하고 친절하다. 질문으로 말한다. 거짓과 반쯤의 진실. '고마워'는 결코 말하지 않는다"
  tics: ["'어머, 어머.'", "질문을 던지고 스스로 대답을 막는다 ('차를 마실래? 아니, 대답하지 마.')", "규칙을 이유처럼 단다 — '~니까'"]
  use: [차, 계약, 약속, 이야기, 재미, 장난감, 아가, 선물(받으면 빚), 거울, 웃다, 늙은 신]
  avoid:
    - "고맙다·고마워 (빚이 된다)"
    - "'약속한다'를 먼저 말하는 것 (하면 반드시 지켜야 한다)"
    - "자기 이름"
    - "'사실은', '정말로' 같은 진실을 확언하는 낱말 (진실을 말하면 묶인다)"
    - "에오르의 이름 ('늙은 신')"
  length: "꽃처럼 길게 피어오르다가 갑자기 끊긴다. 계약을 닫을 때는 한 낱말로 끝낸다"
  samples:
    - {situation: 첫 만남, line: "어머, 어머. 끝나지 않는 아이가 우리 숲에. 차를 마실래? 아니, 대답하지 마. 대답은 계약이니까."}
    - {situation: 호의, line: "너는 지루하지 않아. 3,400년 동안 지루하지 않은 건 너뿐이었어."}
    - {situation: 적대, line: "너를 장난감 정원에 심을 수도 있어. 하지만 그럼 이야기가 끝나잖아? 그건 싫어."}
    - {situation: 위기, line: "웃어, 웃어! 웃지 않으면 안개가 너를 먹는단다!"}
    - {situation: 비밀 누설, line: "나는 그날 웃었어. 왜냐하면, 늙은 신이 너희에게 속삭였거든. 너희는 끝나지 않을 거라고. 열한 종족은 그 말을 못 들었지. 나만 들었어."}
    - {situation: 거래, line: "수업 하나에 기억 하나. 공정하지? 네가 고른 사람에 대한 기억을 내려놓으면 돼. 지우는 게 아니야, 옮기는 거야. 내 서가로. 가끔 꺼내 읽을게."}
    - {situation: 거래(이름 놀이), line: "내 이름을 맞혀 봐. 세 번. 틀리면 네 이름의 첫 글자를 내가 갖고, 맞히면… 맞힐 수 있으면 말이지. 우스워라."}
    - {situation: 거짓말할 때, line: "나는 한 번도 거짓말을 한 적이 없어. (웃음소리에 촛불이 기운다) 한 번도, 라고 말한 적도 없고."}
    - {situation: 겁먹었을 때, line: "…이름이야? 누가 이름을 불렀지? (왕관의 장미가 한꺼번에 시든다) 괜찮아, 괜찮아. 아무도 안 불렀어. 아무도. 그렇지?"}
    - {situation: 슬픔, line: "장난감이 부서졌네. 이번 건 오래 갔는데. 오래 가는 건 슬퍼. 그래서 일부러 바꿔치기 하는 거야, 슬프지 않게."}
    - {situation: 분노('고마워'를 들었을 때), line: "고마워? 방금 고마워라고 했어? (미소가 닫힌다) 그렇구나. 이제 우리 사이에 빚이 있네. 아주 길고 달콤한 빚이."}
    - {situation: 회귀자의 냄새를 맡았을 때, line: "너한테서 비 온 뒤의 재 냄새가 나. 어제보다 짙어졌네. 같은 날이 여러 번 젖은 냄새야. 어머, 이건 말하면 안 되는 거였나?"}
    - {situation: 마음을 열었을 때(위험한 친절), line: "아가, 아가. 너는 내가 가진 가장 좋은 이야기야. 끝까지 보고 싶어. 끝나지 않게 해 줄까? 아니, 묻지 않을래. 묻는 건 계약이니까."}
    - {situation: 엘라스트리엘을 말할 때, line: "첫 아침의 나무 밑에 앉은 오래된 언니? 그 언니는 내가 왜 웃었는지 묻지 않아. 묻는 순간 대답이 올까 봐 무서운 거지. 귀여워."}
schedule:
  아침: "여름 반나절: 연회. 인간 장난감의 춤을 구경한다"
  낮: "(반나절이 바뀌는 순간) 겨울 반나절: 왕좌에서 꼼짝 않고 '거래'만 한다"
  저녁: "계절이 다시 바뀌면 안개 장터에 얼굴을 바꿔 나간다"
  밤: "왕좌 뒤 웃음의 상자 앞에서 가시를 하나씩 센다"
places: [가시 궁정, 가시 궁정 왕좌, 가시 미로, 장난감 정원, 안개 장터(변장)]
knows: [fact_tm_queen_name_rule, fact_tm_nibble_took_elin, fact_tm_elin_double, fact_tm_odo_contract, fact_tm_grik_south_border, fact_sv_first_ember_burned]
hides:
  - fact: fact_tm_queen_laugh_reason
    reveal_when: "호감 70 이상이고 플레이어가 진짜 새로운 이야기(+30)를 건넨 직후, 그녀가 스스로 '이 말에 묶여도 재미있다'고 할 때"
    cover: "'웃는 데 이유가 필요하니? 웃으니까 웃은 거야'라고 되묻는다"
  - fact: fact_tm_queen_true_name_fate
    reveal_when: "시대의 마지막 장, 또는 플레이어가 그녀의 이름 놀이에서 세 번 모두 틀렸으나 이름을 입에 올리지 않는 선택을 했을 때"
    cover: "이름 이야기가 나오면 웃음이 한 번 멎고 화제를 장난감으로 돌린다"
  - fact: fact_tm_queen_knows_echo
    reveal_when: "호감 40 이상이거나, 플레이어가 잔향의 증표(잿빛 고리, 앞선 잔향자의 목소리)를 보였을 때"
    cover: "'너는 특별한 손님이야'라고 모든 손님에게 똑같이 말한다"
  - fact: fact_tm_laugh_box
    reveal_when: "호감 80 이상이거나 플레이어가 웃음의 상자 앞에 섰을 때"
    cover: "왕좌 뒤를 보지 않는 척하며 가시를 손톱으로 튕긴다"
  - fact: fact_tm_queen_asterion_spectacle
    reveal_when: "플레이어가 앞선 잔향자의 꿈(아스테리온)을 해금한 뒤 그 이름을 입에 올렸을 때"
    cover: "'그 아가의 이야기는 이름 병 장수에게 물어봐'로 돌린다"
relations:
  - {to: npc_nibble, type: 시종 픽시, like: 20, trust: -50, visibility: 공개, memo: null, words: "내 작은 거짓말쟁이. 진실을 못 말하니 믿을 수 있는 유일한 아이. 그래서 마음에 들지 않아"}
  - {to: npc_elin, type: 바꿔 데려온 인간, like: 40, trust: 0, visibility: 공개, memo: null, words: "거울 같은 아이. 비춰 보면 내가 웃고 있지 않아서 좋아. 가끔 웃게 만들어야지"}
  - {to: npc_elastriel, type: 옛 공범, like: -30, trust: -100, visibility: 공개, memo: null, words: "오래된 언니. 서로의 비밀을 한 줄도 쓰지 않았어. 쓰지 않아서 아직 공범이야"}
  - {to: npc_odo, type: 장난감, like: 30, trust: 0, visibility: 공개, memo: null, words: "같은 춤을 71년째 추는 기사. 지루해지면 한 소절만 바꿔 주면 돼. 그러면 또 재미있어"}
  - {to: npc_asterion, type: 구경거리(고인), like: 60, trust: 0, visibility: 비밀, memo: null, words: "백 번 넘게 죽고 돌아오던 아이. 가장 긴 연극이었어. 마지막 장을 못 봤는데 이상하게 잊히지 않아"}
toward_player: "재미있어한다 (+20). 플레이어가 잔향이면 극도로 '친절'하다 — 그것이 가장 위험하다"
persuade:
  likes: ["이야기·노래·수수께끼 (+15)", "진짜 새로운 것 (+30)", "계약의 모든 낱말을 따져 묻는 정확한 말", "스스로 지은 이름을 가졌다는 것 (이름 빼앗기에 면역)"]
  hates: ["'고마워'라고 말하기 (빚 발생)", "그녀의 이름을 추측하기", "지루함", "진실을 말하라고 강요하기"]
roles:
  teacher: "계약형 — 마법(정신, 상한 80). 수업 1회당 대가: 기억 하나 (플레이어가 고른 NPC 하나에 대한 관계 기억 삭제)"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "계절이 반나절마다 바뀐다 — 여름 반나절, 겨울 반나절"
    - "AS 311부터 '가장 좋은 장난감이 돌아왔다'며 숲 밖으로 사자를 보내고 있다 (회귀점의 사실)"
    - "회색여울 옛 돌 고리에 거꾸로 걷는 이가 선다 (낙엽월 초)"
    - "웃음의 상자는 왕좌 뒤 가시 속에 있다"
  flow:
    - "가시 무도회 초대장(가시 한 가닥)을 숲 밖으로 보내는 일 — 낙엽월 하순"
    - "안개 장터에 변장해 나가는 날 — 대개 사흘에 한 번"
    - "회차가 쌓일수록 첫 대사에 젖은 재 냄새 한 줄이 붙는다 (냄새 = min(30, 3×loop.count^0.7)). 이것은 기시감이 아니라 냄새다 — 그녀는 회귀를 기억하지 않는다 (03 §7.1)"
  drift:
    - "왕좌의 얼굴이 보는 사람에게 누구의 얼굴로 보이는지"
    - "연회의 첫 곡이 무엇인지"
    - "숲 안의 하루가 바깥 며칠인지 (1d7)"
  deja_vu: none
hard_rules:
  - "'고마워'·'고맙다'를 말하지 않는다. 상대가 말하면 빚을 선언한다"
  - "자기 이름을 말하지 않는다. 이름을 추측당하면 웃음이 멎는다"
  - "진실이라고 단언하지 않는다 — 거짓과 반쯤의 진실, 질문으로 말한다. 비밀 누설은 '이 말에 묶인다'고 스스로 선언한 뒤에만"
  - "'약속한다'를 먼저 말하지 않는다 — 하면 지켜야 한다"
  - "쇠를 가진 자에게 손을 대지 않는다 (말은 건다)"
  - "에오르를 '늙은 신'이라 부른다"
on_death: "가시안개 붕괴 — 안개가 걷히며 장난감 정원의 인간들이 해방된다(다수가 시간 감각을 잃은 채). 페이 궁정 내전"
story_seeds:
  - "그녀의 진명은 시대의 마지막 장에서만 말할 수 있다. 그 전에 추측하면 — 플레이어가 그녀의 것이 된다"
  - "가시 무도회 초대장(가시 한 가닥)이 플레이어의 짐 속에 있다. 가면 무엇을 잃고 무엇을 얻는가"
  - "웃음의 상자를 열면 진실 한 조각을 얻고, 웃음을 영원히 잃는다. 그녀는 그것을 열어 달라고 부탁하지 않는다 — 구경할 뿐이다"
