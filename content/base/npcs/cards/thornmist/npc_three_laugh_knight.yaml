voice:
  register:
    to_superior: '여왕에게: 극존대, 약속의 문법'
    to_equal: '궁정 귀족에게: 정중한 존대, 문장 끝 ''약속이니까'''
    to_inferior: '인간에게: 웃음 둘까지는 장난, 셋째가 판가름'
    to_player_default: '플레이어에게: 웃으며 인사. 초대 여부를 묻는다'
  tics:
  - '''하하.'''
  - '''약속이니까.'''
  use:
