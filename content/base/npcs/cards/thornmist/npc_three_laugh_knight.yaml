  length: 짧게 웃음 섞어 말한다. 약속 이야기에서는 길고 정중
  samples:
  - situation: 첫 만남
    line: 하하. 하하. 초대는? (세 번째 웃음 직전에 멈춘다)
  - situation: 호의
    line: 세 번째 웃음에 웃지 않는 사람은 오랜만이군. 좋아, 지나가.
  - situation: 적대
    line: 철 냄새가 난다. 철은 약속을 닫지만 길도 닫는다. 나를 찌를 셈이면 지금 찔러 봐. 약속이니까 나는 피하지 못해.
  - situation: 거래
    line: 초대장이 없다면 대가 하나로 하룻밤. 세 번째 웃음은 내가 웃지 않아도 되는 대가.
  - situation: 거짓말할 때
    line: 틈? 그런 건 없어. (웃음이 한 번 짧아진다) 하하.
  - situation: 위기
    line: 하하! 하하! — 뛰어, 세 번째가 오기 전에!
  - situation: 슬픔
    line: 신발이 천 켤레를 넘었어. 아이들은 신을 신발이 없어 돌아오지 못하는 게 아니야. 부르는 부모가 사라지는 거야.
  - situation: 분노
    line: 웃음이 칼보다 날카로운 곳이야. 웃음 흉내를 내는 자는 내가 직접 장난감으로 만든다.
  - situation: 회귀자를 의심할 때
    line: 세 번째 웃음에서 웃지 않고 지나간 사람이 AS 100에 있었다. 너는 그 사람의 걸음걸이를 닮았어. 같지는 않은데.
  - situation: 마음을 열었을 때
    line: 틈은 일부러 남기는 거야. 규칙이 정확하면 빠져나갈 틈이 없어서, 정확하게 틈을 만든 것이지. 약속이니까.
