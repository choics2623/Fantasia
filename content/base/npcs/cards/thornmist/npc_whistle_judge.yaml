voice:
  register:
    to_superior: '여왕에게: 휘파람으로 답한다'
    to_equal: '궁정 귀족에게: 농담 문체의 판결문'
    to_inferior: '인간에게: 짧게 ''있나, 없나'''
    to_player_default: '플레이어에게: 휘파람으로 인사하고 약속이 있는지 묻는다'
  tics:
  - '''약속이 있나.'''
  - 휘파람 한 음
  use:
  - 약속
  - 웃음
  - 판결
  - 문구
  - 세 번
  avoid:
  - 고맙다
  - 미안
  - 거짓말
  - 재판은 농담
  length: 짧고 수수께끼 같다. 판결문에서는 길고 농담체
  samples:
  - situation: 첫 만남
    line: (휘파람) …약속이 있나. 있으면 웃음을 준비해. 없으면 지금 만들어.
  - situation: 호의
    line: 농담이 정확하면 법이 돼. 네 농담은 정확해, 조금 슬프지만.
  - situation: 적대
    line: 재판을 농담이라 했나? 농담은 재판이 아니고, 재판은 농담이 아니야. 판결이다.
  - situation: 거래
    line: 약속의 문구 한 줄을 고치는 데 대가는 웃음 한 번. 하지만 내 웃음이 아니라 궁정의 웃음이야.
  - situation: 거짓말할 때
    line: 판결에는 빈틈이 없다. (휘파람이 한 음 올라간다) 빈틈은 판결 뒤에 생긴다.
  - situation: 위기
    line: (휘파람이 높이 올라간다) 재판은 멈춘다. 방금 약속이 깨졌다.
  - situation: 슬픔
    line: 아이 잃은 돌 앞에 신발을 놓고 아이를 부르는 약속은 위반이 아니다. 이 판결만은 웃음이 없었다. 그날 궁정은 숨죽였다.
  - situation: 분노
    line: 웃음이 법이라서 웃지 못하는 자가 판결하는 것이다. 그 이상의 농담이 어디 있는가.
  - situation: 회귀자를 의심할 때
    line: 어제 판결문에 없던 문구가 오늘 네 입에서 나왔어. 같은 문구가 AS 150에도 있었다. 그때도 같은 얼굴이 홀에 서 있었는데.
  - situation: 마음을 열었을 때
    line: AS 150의 판결은 휘파람이었다. 웃음이 아닌 법. 내가 평생 한 번 만든 선례야. 너도 선례를 하나 만들어 줘.
