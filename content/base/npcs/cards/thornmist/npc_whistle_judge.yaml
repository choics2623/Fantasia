- 작은 가발 속에서 나비가 한 마리 나온다
- 손에 든 방울이 소리 대신 숨을 낸다
smell: 양초 그을음과 꽃 시든 냄새
voice_sound: 휘파람 섞인 맑은 목소리. 판결할 때만 한 음이 낮아진다
personality:
  disposition:
    용기: 20
