story_seeds:
  - "잿빛 실의 남쪽 우회로가 그의 사냥터와 겹친다. 북방 탈주자들이 서리 길이 막혀 폐탑 아래를 지난다"
  - "그의 모자를 빼앗는 법 — 한 시간을 버텨야 한다. 그 한 시간 동안 그는 미친 듯 덤빈다"
