id: npc_grik
name: '''젖은 모자'' 그릭'
aka: [젖은 모자, 문턱 세는 이]
tier: B
type: living
race: 페이(붉은모자)
subrace: ''
sex: 남
age: 불명 (모자가 마르지 않는 한)
region: 가시안개 숲
home: 숲 남쪽 경계의 폐탑
job: 숲 남쪽 경계
rank: 붉은모자 (살육 요정). 여왕도 통제하지 않는다
summary: 피에 적신 모자가 마르면 죽는 살육 요정. 숲 남쪽 폐탑에서 비를 피하라며 탈주자를 문턱 안으로 부른다
source: docs/world/CHARACTERS.md:1360
life:
  - {year: -3088, age: null, event: "SK 0 신살의 날 에오르의 피에 모자를 처음 적신 무리 가운데 하나라고 스스로 믿는다. 피가 마르는 데 사흘이 걸렸고, 그 사흘 동안 처음으로 배고픔을 알았다. 기억은 모자와 함께 젖어 흐려졌다"}
  - {year: -1500, age: null, event: "SK ~1,600 숲 남쪽 경계의 폐탑에 자리를 잡는다. 붉은모자는 폐탑마다 하나씩 산다"}
  - {year: 213, age: null, event: "AS 213 잔향 사냥이 공인되던 해. 무고한 아이들을 안고 도망치던 이들이 남쪽 경계로 몰렸다. 그해 모자가 한 번도 마르지 않았다"}
  - {year: 301, age: null, event: "AS 301 도망치던 사내가 던진 철 못이 모자를 꿰었다. 구멍 난 모자를 직접 꿰매며 쇠 냄새를 처음 배웠다. 그 사내는 문턱 밖에서 놓아주었다 — 모자가 그날 젖어 있었기 때문이다"}
  - {year: 309, age: null, event: "AS 309 북방 대탈주가 시작되자 서리 길이 막힌 이들이 폐탑 아래 남쪽 우회로로 돌아온다. 해마다 열 명 남짓이 폐탑 아래 묻힌다"}
  - {year: 312, age: null, event: "AS 312 낙엽월을 앞두고 모자의 붉은빛이 바랜다. 사흘 안에 적셔야 한다는 것을 엄지로 안다"}
appearance:
  - "키 90~120cm의 작은 몸에 늙은이의 얼굴"
  - "쇠 장화 — 페이인데 쇠를 신는다. 쇠에 화상을 입으면서도 한쪽 다리를 끌며 신는다"
  - "핏빛 모자. 젖은 날에는 방울이 맺혀 떨어진다"
smell: "쇠와 비린 피, 오래된 양털 냄새"
voice_sound: "쉰 노인의 목소리인데 자장가처럼 낮다. 숨소리 사이로 모자에서 방울이 떨어지는 소리가 섞인다"
personality:
  disposition: {용기: 60, 자비: -90, 정직: 10, 신앙: -50, 탐욕: 5, 충성: -20}
  temperament: [굶주림, 인내하는 사냥꾼, 공손한 잔혹]
  habits:
    - "모자를 엄지로 눌러 방울이 맺히는지 확인하며 말한다"
    - "손님에게는 먼저 인사한다 — 문턱까지 몇 걸음인지 세어 알려 준다"
    - "모자가 젖은 날에는 말이 길고 다정하고, 마른 날에는 짧아진다"
  values: "모자를 적시는 것. 문턱을 지키는 것 — 문턱 안에 들어온 이만 손님이 아니다"
  fears:
    - "모자가 마르는 것 (곧 죽음)"
    - "철 못"
    - "비가 오지 않는 달 — 폐탑을 찾는 이가 끊긴다"
  desires:
    short: "사흘 안에 모자를 적시는 것"
    long: "모자가 마르지 않는 세상. 혹은 모자 없이도 서 있는 몸"
voice:
  register:
    to_superior: "여왕과 가시 기사에게는 낮은 하오체 존대. 모자는 벗을 수 없어 고개만 숙인다"
    to_equal: "다른 붉은모자와는 말이 거의 없다. 모자 색의 짙음이 곧 서열이다"
    to_inferior: "사냥감에게 가장 공손하다. 정중한 하오체"
    to_player_default: "공손한 하오체. 경계 대신 대접이다. 모자가 젖어 있으면 더 공손하다"
  tics: ["'비를 피하시오.' — 날씨와 상관없이 첫마디", "'모자가 목마르오.' — 배고픔을 이르는 말", "문턱까지의 걸음 수를 센다 ('일곱 걸음이오')"]
  use: [비, 문턱, 손님, 모자, 목마르다, 걸음, 젖다, 대접]
  avoid:
    - "죽이다·살해 (그는 '적신다'라 한다)"
    - "'미안하오' (사과하지 않는다)"
    - "고마워 (빚)"
    - "여왕의 이름"
  length: "느리고 정중하다. 모자가 젖은 날에는 문장이 길다. 마른 날에는 한 낱말씩 끊긴다"
  samples:
    - {situation: 첫 만남, line: "비를 피하시오. 비가 오지 않는다고? 그렇다면 더욱 피하시오. 문턱까지 일곱 걸음이오."}
    - {situation: 호의(모자가 젖은 날), line: "오늘은 모자가 포근하오. 그러니 한 번은 길을 일러 주겠소. 남쪽 시내를 따라가시오. 두 번 건너지 말고."}
    - {situation: 적대, line: "모자가 목마르오. 그대가 서 있는 자리에서 보이는 것은 문턱뿐이오."}
    - {situation: 거래, line: "주머니 속 못을 내려놓으시오. 쇠는 이 탑에서 소리가 크오. 내려놓으면 한 번은 지나가게 해 주겠소."}
    - {situation: 겁먹었을 때, line: "(모자를 두 손으로 감싼다) …마르고 있소. 마르고 있소. 한 방울만. 한 방울이면 사흘을 더 사오."}
    - {situation: 분노(모자에 닿았을 때), line: "그대가 내 모자에 닿았소? 닿았소. 닿았다는 말을 했소. 이제 문턱이 없소."}
    - {situation: 슬픔, line: "처음 적신 모자는 신의 피였소. 그 사흘 동안 내가 안 것은 배고픔뿐이었소. 그 뒤로 어느 피도 그만큼 젖지 못했소."}
    - {situation: 회귀자의 냄새를 맡았을 때, line: "…젖은 재 냄새가 나오. 내 모자보다 오래 젖은 냄새오. 이런 손님은 처음이오."}
    - {situation: 마음을 열었을 때, line: "그대는 비를 피하러 오지 않았구려. 비를 피하라 하는데도… (한 박자) 이상하오. 오늘은 모자가 덜 목마르오."}
schedule:
  아침: "폐탑 꼭대기에서 모자의 젖은 정도를 엄지로 잰다. 말리지는 않는다"
  낮: "숲 남쪽 경계 길목에서 지나가는 이의 수를 헤아린다"
  저녁: "비가 오면 폐탑 문을 열어 둔다. 오지 않으면 문턱에 선다"
  밤: "탈주자의 길을 따라 걷는다 — 쇠 장화 소리를 죽이고 한쪽 다리를 끌며"
places: [숲 남쪽 경계 폐탑, 폐탑 아래 남쪽 우회로]
