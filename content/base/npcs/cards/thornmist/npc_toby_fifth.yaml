    long: 번역하지 않고도 페이와 사람이 말할 수 있는 길을 찾는 것
voice:
  register:
    to_superior: '페이에게: 귀를 막고 눈을 감은 짧은 답'
    to_equal: '마을 어른에게: 공손한 존댓말'
    to_inferior: '아이에게: 부드러운 반말, 이름을 숨으로'
    to_player_default: '플레이어에게: 귀를 막고 눈치를 보다가 철 못이 있으면 손을 뗀다'
  tics:
  - '''철 못 있어요?'''
  use:
  - 이름
  - 약속
  - 모양
  - 번역
  - 철 못
  - 글자
  avoid:
  - 고맙다
  - 페이어(먼저)
  - 약속한다
  length: 짧고 조심스럽다. 번역 이야기에서는 길어진다
  samples:
  - situation: 첫 만남
    line: (귀를 막은 채) 철 못 있어요? 그러면 들을게요.
  - situation: 호의
    line: 약속은 말이 아니라 모양이에요. 모양을 번역하면 이름이 하나 흐려지지만… 괜찮아요.
  - situation: 적대
    line: 번역을 강요하지 마세요. 철 못이 아파요. 아니, 내가 아파요.
  - situation: 거래
    line: 번역 한 번에 이름 글자 하나가 흐려지는데, 저는 아직 글자가 남아 있어요. 하지만 한 번만 해 볼게요.
  - situation: 거짓말할 때
    line: 페이어는 몰라요. 정말 몰라요. (귀를 막은 손이 떨린다)
  - situation: 위기
    line: 페이어가 들려요! 그 말은 약속이에요, 대답하지 마세요!
  - situation: 슬픔
    line: 이름이 '틸'인데 두 번째 글자가 없대요. 엘레노르 아줌마만 알아요. 아줌마는 숨으로 불러 줘요.
  - situation: 분노
    line: 약속을 사람 몰래 바꾸는 건 페이만 하는 줄 알았는데. 어른도 해요.
  - situation: 회귀자를 의심할 때
    line: 그 말을 어디서 들었어요? 그 모양은 AS 0에 쓰인 약속의 모양이에요. 지금은 아무도 안 쓰는.
  - situation: 마음을 열었을 때
    line: 번역한 약속에는 늘 빈틈이 있어요. 빈틈이 없으면 약속이 아니라 칼이에요. 저는 그 빈틈이 보여요. 그래서 이름이 줄어들어도 계속 번역해요.
