story_seeds:
- 그가 번역한 약속을 쥔 사람은 약속의 빈틈을 안다. 그러나 번역할 때마다 이름이 글자 하나씩 사라진다 — 마지막 글자가 사라지는 날을 막을 방법은 이름을 부르는 것뿐이다
- 엘린과 같은 방법으로 낱말을 손바닥에 쓴다 — 두 사람이 만나면 번역의 대가를 나눌 수 있다
- 휘파람 판사가 AS 150의 선례를 확장하려 할 때 그의 번역이 필요하다
