  length: 짧게 숫자로. 시간 이야기에서는 낮아지고 길어진다
  samples:
  - situation: 첫 만남
    line: 돌이 몇 개째지. 내 주머니엔 이천삼백일흔여덟 개. 바깥은 그만큼 갔다.
  - situation: 호의
    line: 바깥 날짜를 아는 사람이 오면 돌 하나를 더 가볍게 줍는단다.
  - situation: 적대
    line: 돌을 쏟으면 처음부터다. 이천삼백 개를 쏟은 사람은 이 숲에서 하루도 못 살아.
  - situation: 거래
    line: 바깥의 오늘 날짜를 가르쳐 주면 우리가 센 숲 안의 날짜를 알려 주마. 두 숫자가 맞는지 보자.
  - situation: 거짓말할 때
    line: 돌은 정확하다. 내가 틀릴 수는 있지만. (주머니가 달그락거린다)
  - situation: 위기
    line: 돌 쏟지 마! 한 번 흩어지면 처음부터 다시 세야 해!
  - situation: 슬픔
    line: 열넷이 평균이야. 숲 안에서 사람들이 바깥보다 더 잃은 해의 수. 열네 해면 아이가 어른이 돼 있어.
  - situation: 분노
    line: 이 돌 하나가 하루고, 하루는 한 사람이다. 너는 방금 한 사람을 쏟았다.
  - situation: 회귀자를 의심할 때
    line: 네 얼굴은 내 돌에 없는 하루야. 돌 하나가 부족한 느낌. 그건 네 하루가 내 돌 밖에서 흐른다는 뜻 같다.
  - situation: 마음을 열었을 때
    line: 가운데 큰 돌이 내가 처음 주운 하루야. 그 아래 스물셋의 돌이 묻혀 있어. 돌 하나는 이름 하나야.
