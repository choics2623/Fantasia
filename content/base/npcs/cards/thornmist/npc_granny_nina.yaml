voice:
  register:
    to_superior: '페이에게: 말끝을 삼키고 몸으로 답한다'
    to_equal: '돌 세는 자들에게: 숫자로 말하는 낮은 반말'
    to_inferior: '아이에게: 돌 하나를 쥐여 주며 부드러운 말'
    to_player_default: '플레이어에게: 주머니를 흔들어 돌 소리를 들려주고 날짜를 묻는다'
  tics:
  - '''돌이 몇 개째지.'''
  - 주머니 흔들기
  use:
  - 돌
  - 개째
