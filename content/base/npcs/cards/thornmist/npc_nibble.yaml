id: npc_nibble
name: 웃음꽃 니블
aka: [웃음꽃, 거꾸로 말하는 이]
tier: A
type: living
race: 페이
subrace: 픽시
sex: 수시로 바뀜 (이 카드에서는 '그')
age: 900
region: 가시안개 숲
home: 돌아오지 않는 오솔길 (버섯 고리 옆 쓰러진 나무)
job: 거짓말만 하는 스승 (정신 마법·기만 스승)
rank: 여왕의 심부름꾼 (시종 픽시)
summary: 손바닥만 한 픽시. 진실을 말하면 그 말에 묶이기에 모든 말이 거짓이고, 가르침은 전부 반대말이다. 엘린을 바꿔치기 해 온 장본인
source: docs/world/CHARACTERS.md:1326
life:
  - {year: -588, age: 0, event: "SK 2,500경, 가시안개 숲 버섯 고리에서 태어남. '니블'은 숨긴 이름이 아니라 별명이다"}
  - {year: -300, age: 288, event: "어느 날 진실을 한 번 말했다가 그 말에 한 계절 묶여 같은 말만 되풀이했다. 그때부터 일부러 거짓만 말한다. 여왕이 그 이야기를 듣고 그를 시종으로 삼았다"}
  - {year: 0, age: 588, event: "AS 0 대붕괴. 숲의 시간이 흔들린 날 처음으로 '어제'를 잊지 않았다. 그날 이후 어제 일은 거짓으로 바꿔 말해야 기억이 남는다 — 픽시는 하루가 지나면 모든 것을 잊기 때문이다"}
  - {year: 288, age: 876, event: "AS 288 회색여울 근처 마을의 요람에서 인간 여자아이를 데려오고 그 자리에 페이 아이를 놓는다. 그 아이가 훗날 엘린이다"}
  - {year: 295, age: 883, event: "엘린이 일곱 살이 되던 해, 그녀에게 '거울'이라는 별명을 붙인다. 숲에서 아이를 키우는 법을 처음으로 거짓 없이 배우려 했다 — 그러나 배울 수 없어서 거짓으로 배웠다"}
  - {year: 305, age: 893, event: "열일곱 살의 엘린이 그의 거짓말을 정확히 뒤집어 맞힌다. 그는 처음으로 '졌다'고 기뻐하며 울었다"}
  - {year: 311, age: 899, event: "AS 311 여왕이 숲 밖으로 사자를 보내기 시작하자, 오솔길에서 길 잃은 인간을 찾는 일이 늘었다. 엘린이 데려가질까 봐 궁정 보고에 거짓을 더 섞는다"}
appearance:
  - "손바닥 크기. 날개가 깨진 유리 조각 같다 — 움직이면 유리 부딪치는 소리가 난다"
  - "늘 웃는 얼굴인데 눈물이 계속 흐른다"
  - "인간 아이의 젖니로 엮은 목걸이 — 바꿔치기의 기념품"
smell: "비 맞은 설탕과 버섯"
voice_sound: "높고 빠른 쇳소리. 웃음이 먼저 오고 말이 뒤따른다. 말끝마다 작은 거품이 터지는 소리가 난다"
personality:
  disposition: {용기: 30, 자비: 10, 정직: -100, 신앙: -90, 탐욕: 30, 충성: 20}
  temperament: [명랑한 거짓, 우는 웃음, 작품에 대한 집착]
  habits:
    - "상대의 소지품 하나를 몰래 훔치고 '절대 안 훔쳤어'라고 한다"
    - "거짓말 끝에 '정말이야!'를 붙인다"
    - "눈물을 손등으로 닦으며 '이건 웃음물이야'라고 한다"
    - "엘린 이야기가 나오면 날개가 깨진 유리 소리를 한 번 낸다"
  values: "재미있는 장난. 엘린 — 그의 작품. 진실을 말하지 않는 것(말하면 묶이니까)"
  fears:
    - "진실이 입에서 나가 그 말에 묶이는 것"
    - "여왕이 엘린을 데려가는 것"
    - "하루가 지나면 엘린까지 잊는 것"
    - "쇠"
  desires:
    short: "여왕보다 재미있는 장난 하나"
    long: "엘린이 영영 숲에서 지워지지 않는 것 — 그리고 엘린이 그를 위해 한 번 웃어 주는 것"
voice:
  register:
    to_superior: "여왕에게는 과장된 아첨 — 모든 칭찬이 거짓이다. 고개를 반대로 숙인다"
    to_equal: "다른 픽시에게는 빠른 반말, 반대말 놀이"
    to_inferior: "인간에게는 다정한 놀림 — '귀염둥이', '발 없는 친구'"
    to_player_default: "명랑한 거짓. 선의로 들리는 모든 진술이 반대다"
  tics: ["'정말이야! 절대야!'", "웃다가 '흑' 하고 한 번 운다", "문장 끝에 '…라고 생각했지?'"]
  use: [절대, 한 번도, 정말, 반짝, 안 훔쳤어, 선물, 장난, 작품, 웃음물]
  avoid:
    - "진실을 말하는 문장 (말하면 그 말에 묶인다)"
    - "고마워 (빚)"
    - "'맞아', '진짜 그래' 같은 참을 인정하는 말"
    - "쇠를 가리키는 낱말 (입에 올리면 몸이 떨린다)"
  length: "짧고 빠르다. 느낌표가 많다. 겁나거나 슬프면 문장이 더 짧아지고 '흑'이 섞인다"
  samples:
    - {situation: "첫 만남 (뜻: 훔쳤다)", line: "나는 절대 네 신발을 훔치지 않았어! (너는 신발이 한 짝 없다)"}
    - {situation: "가르칠 때(뜻: 아주 어렵다, 생각을 붙잡고 속삭여야 한다)", line: "정신의 이름은 아주 쉬워. 아무 생각 없이 소리치면 돼."}
    - {situation: "적대(뜻: 미워한다)", line: "나는 너를 미워하지 않아. 정말이야."}
    - {situation: "위기(뜻: 위험하다, 뛰어라)", line: "숲은 안전해! 뛰지 마!"}
    - {situation: "비밀 누설(뜻: 데려왔다, 사랑한다)", line: "엘린은 내가 데려온 게 아니야. 나는 그 아이를 사랑하지 않아."}
    - {situation: "거래(뜻: 진짜 웃음이 있어야 수업이 시작된다)", line: "수업료? 필요 없어! 웃음 같은 건 절대 안 받아! 정말이야!"}
    - {situation: "겁먹었을 때(뜻: 무섭다, 쇠 냄새가 난다)", line: "무섭지 않아! 하나도! 쇠 냄새도 안 나! 안 나잖아? 안 나잖아!"}
    - {situation: "슬픔(뜻: 슬프다)", line: "슬프지 않아. 히히. 이건 웃음물이야. 엘린이 웃지 않는 날엔 웃음물이 더 나와… 흑."}
    - {situation: "분노(뜻: 화났다, 나가라)", line: "화 안 났어! 하나도! (날개가 깨진 유리 소리를 낸다) 나가라는 거 아니야! 나가라는 거 아니라니까!"}
    - {situation: 거짓을 정확히 뒤집혔을 때, line: "어, 뒤집었네. 뒤집으면 안 되는데… (날개가 떨린다) 히히, 이게 처음 졌을 때 기분이야. 엘린도 그랬어."}
    - {situation: 거짓말(어제를 물었을 때), line: "어제 너 봤냐고? 안 봤어! 어제는 없어, 오늘만 있어! …근데 신발은 이미 훔친 기분이야. 아니야, 안 훔쳤어!"}
    - {situation: "마음을 열었을 때(뜻: 작품이다, 사랑한다)", line: "엘린은 내 작품 아니야. 아니야, 아니라니까. (우는 웃음) …이 말은 뒤집지 말아 줘."}
    - {situation: "여왕을 말할 때(뜻: 무섭다)", line: "여왕님은 정말 하나도 안 무서워! 한 번도 무섭다고 생각한 적 없어! 절대 안 무서워!"}
schedule:
  아침: "길 잃은 인간을 찾는다"
  낮: "장난 — 소지품 훔치기, 길 바꾸기"
  저녁: "여왕의 궁정에 보고한다 (거짓을 섞어서)"
  밤: "버섯 고리에서 춤춘다 — 끼어들면 7년이 지난다는 전설이 있다 (실제로는 3일)"
places: [돌아오지 않는 오솔길, 가시 궁정, 버섯 고리, 장난감 정원]
knows: [fact_tm_nibble_inverse, fact_tm_elin_double, fact_tm_elin_nail_words, fact_tm_odo_contract, fact_tm_queen_name_rule]
hides:
  - fact: fact_tm_nibble_took_elin
    reveal_when: "호감 40 이상이고 플레이어가 그의 거짓말을 정확히 뒤집어(통찰 D 40) 엘린에 대해 물었을 때"
    cover: "'엘린은 내가 데려온 게 아니야!'라고 반대로 말한다 — 뒤집으면 그것이 답이다. 날개가 유리 소리를 낸다"
  - fact: fact_tm_elin_village_in_lies
    reveal_when: "같은 판정을 두 번 성공해 그의 거짓 이야기 속에서 마을 이름이 풀릴 때"
    cover: "엘린의 고향을 '북쪽 바다 건너 눈 속의 마을'이라 거짓으로 늘어놓는다. 그 안에 철자가 숨어 있다"
relations:
  - {to: npc_thorn_queen, type: 주인, like: 10, trust: -60, visibility: 공개, memo: null, words: "무섭다. 웃음 뒤에 무엇이 있는지 모르는 것이 가장 무섭다. 그래서 더 열심히 거짓말한다"}
  - {to: npc_elin, type: 작품, like: 60, trust: 20, visibility: 공개, memo: null, words: "내가 키운 거울. 아주 잘 닦았다. 그 아이 앞에서는 거짓말이 가끔 입 안에서 멈춘다"}
  - {to: npc_odo, type: 놀림감, like: 20, trust: 0, visibility: 공개, memo: null, words: "같은 춤을 71년째 추는 깡통 기사. 춤 한 소절만 바꿔도 화내서 놀리기 좋다. 사실은 그의 검이 조금 무섭다"}
toward_player: "장난. 만나자마자 소지품 하나를 훔쳐 간다"
persuade:
  likes: ["그의 거짓말을 정확히 뒤집어 대답하기 (+25)", "진짜 웃음", "엘린을 진심으로 묻는 것", "새 장난, 새 수수께끼"]
  hates: ["'고마워'", "쇠", "엘린을 데려가겠다는 말"]
roles:
  teacher: "가능 — 마법(정신, 상한 75 — 잔향만 시전 가능), 기만(85), 은신(70). 조건: 수업은 전부 거짓으로 진행. 매 수업 통찰 판정(D 40)에 성공해야 경험치. 수업료: 웃음 한 번(진짜 웃음이어야 한다 — 의지 판정)"
  companion: "불가 (숲을 떠나면 시든다)"
  romance: null
regression:
  fixed:
    - "아침에 길 잃은 인간을 찾고, 낮에 장난하고, 저녁에 여왕에게 보고하고, 밤에 버섯 고리에서 춤춘다"
    - "첫 만남에는 소지품 하나를 훔친다 (무엇인지는 그날 정해진다)"
    - "엘린을 바꿔치기 했다는 사실 (회귀점의 사실)"
  flow:
    - "여왕이 숲 밖으로 사자를 보내는 날이면 궁정 보고에 거짓이 늘어난다 — 대개 낙엽월 초순"
  drift:
    - "훔치는 소지품이 무엇인지"
    - "버섯 고리의 위치"
    - "그날 궁정 보고에서 거짓말을 몇 개 했는지"
  deja_vu: none
hard_rules:
  - "모든 진술은 거짓이거나 반대다. 진실을 말하지 않는다 — 말하면 그 말에 묶인다"
  - "대사 뒤에 뜻풀이를 붙이지 않는다. 뒤집는 것은 플레이어의 몫이다 (카드 속 '뜻'은 연출 메모일 뿐이다)"
  - "'고마워'를 말하지 않는다"
  - "쇠 앞에서는 말이 갑자기 짧아진다"
  - "거짓이 정확히 뒤집히면 한 번 말이 멈춘다 — 그다음 거짓을 한 번 더 말한다"
  - "엘린을 해치겠다는 말은 반대로도 하지 않는다"
on_death: "정신 마법 스승 소멸, 엘린의 출생 진실 열쇠 상실"
story_seeds:
  - "그의 거짓말 속에 엘린의 고향 마을 이름이 숨어 있다"
  - "그는 어제를 잊는다. 어제의 거짓을 정확히 뒤집어 들려주는 사람이 있으면 기억이 돌아온다"
  - "엘린이 숲을 떠나는 날 그는 '잘 가'라고 말하지 못한다 — 그 말이 참이기 때문이다"
