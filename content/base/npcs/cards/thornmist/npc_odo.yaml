relations:
  - {to: npc_elin, type: 장난감 정원 동료, like: 60, trust: 70, visibility: 공개, memo: null, words: "날짜를 알려 주는 아이. 그 아이의 목소리는 소절을 하나 바꾼다. 나는 그 아이에게 검을 가르치고 싶었으나 계약이 막았다"}
  - {to: npc_thorn_queen, type: 계약의 상대, like: -30, trust: -60, visibility: 공개, memo: null, words: "내 춤을 구경하는 분. 지루해지면 한 소절을 바꿔 주신다. 바꿔 주실 때만 감사하다고 말하고 싶으나 그 낱말은 못 쓴다"}
  - {to: npc_nibble, type: 놀리는 픽시, like: -10, trust: -30, visibility: 공개, memo: null, words: "깡통 기사라 부르며 소지품을 훔쳐 가는 작은 것. 훔친 것이 목검이 아닌 날은 가만둔다"}
toward_player: "경계한다. 쇠를 지녔는지 먼저 본다. 춤을 방해하면 화낸다"
