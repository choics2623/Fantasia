id: npc_odo
name: 목각 기사 오도
aka: [목각 기사, 같은 춤의 기사]
tier: B
type: living
race: 인간
subrace: ''
sex: 남
age: 101
region: 가시안개 숲
home: 장난감 정원 한가운데 (춤추는 자리)
job: 장난감 정원
rank: 페이 계약에 묶인 장난감 (원래 용병 노예)
summary: AS 241 서른에 숲에 들어와 페이 계약으로 늙지 않고 매일 같은 춤을 추는 기사. 숲에 든 지 71년, 검술 60이 몸에 굳어 있다
source: docs/world/CHARACTERS.md:1359
life:
  - {year: 211, age: 0, event: "인간 노예의 아들로 태어남. 어린 나이에 호위 노예로 길러져 검을 쥐었다. 고향 이름은 이제 기억하지 못한다"}
  - {year: 238, age: 27, event: "주인에게 임대되어 용병 노예로 대상(隊商) 호위를 다닌다. 검술이 몸에 굳은 때가 이 무렵이다"}
  - {year: 241, age: 30, event: "AS 241 대상을 호위하다 안개에 길을 잃고 가시안개 숲에 들어간다. 여왕 앞에서 춤을 청받고 계약을 받아들였다. 무엇을 주기로 했는지는 나중에 알았다. 이날부터 몸이 서른에서 늙지 않는다"}
  - {year: 260, age: 49, event: "같은 춤을 열아홉 해째 추던 해, 장난감 정원의 인간들이 서로의 이름을 잊기 시작했다. 그는 매일 아침 어깨를 세 번 돌리며 자기 이름을 소리 내지 않고 외웠다"}
  - {year: 307, age: 96, event: "시간 알림이 엘린과 가까워진다. 오늘이 며칠인지 묻는 습관이 이때 생겼다"}
  - {year: 311, age: 100, event: "춤이 한 소절 바뀌는 날이 생긴다. 바뀐 건 그가 아니라 숲이다. 그는 그것이 이상하게 좋았다"}
appearance:
  - "서른 살로 보이는 얼굴에 깊게 박힌 검사의 어깨. 눈만 일흔 해를 산 사람의 눈이다"
  - "움직임이 나무 장난감처럼 뚝뚝 끊긴다 — 같은 춤을 71년 춘 몸"
  - "허리에 쇠 없는 목검. 쇠는 페이가 싫어한다"
smell: "광목과 송진. 늙지 않은 몸이라 세월의 냄새가 없다"
voice_sound: "건조하고 낮은 군인의 목소리. 문장이 네 박으로 끊긴다"
personality:
  disposition: {용기: 55, 자비: 30, 정직: 50, 신앙: -10, 탐욕: -20, 충성: 45}
  temperament: [체념한 성실, 굳은 몸의 고집, 한 소절의 희망]
  habits:
    - "하루를 시작할 때 어깨를 세 번 돌린다 — 검사의 습관"
    - "춤의 박자를 발끝으로 센다 (일, 이, 삼, 사)"
    - "엘린이 날짜를 말해 주면 검 잡던 손을 쥐었다 편다"
  values: "계약의 문장은 지킨다. 맡은 일은 끝까지 한다"
  fears:
    - "계약이 풀려 하룻밤에 숲에서 보낸 71년을 먹는 것"
    - "바뀐 한 소절이 다시 같은 소절로 돌아가는 것"
    - "검을 잊는 것"
  desires:
    short: "엘린에게서 오늘이 며칠인지 한 번 더 듣는 것"
    long: "계약의 문장을 정확히 읽어 풀 방법을 찾는 것 — 풀지 않는 선택까지 포함해서"
voice:
  register:
    to_superior: "여왕과 가시 기사에게는 군인식 짧은 존대 '예'. 쇠를 말하지 않는다. 약속 어휘를 피한다"
    to_equal: "장난감 정원의 인간에게는 낮은 반말"
    to_inferior: "어린 정원지기에게는 명령처럼 다정한 짧은 반말"
    to_player_default: "구식 하오체. 먼저 상대에게 쇠가 있는지 본다"
  tics: ["박자를 센다 — '일, 이, 삼, 사'", "'오늘이 며칠이오?'", "문장 끝을 네 박으로 자른다"]
  use: [박자, 소절, 검, 날(칼날), 오늘, 며칠, 계약, 춤]
  avoid:
    - "'쇠'라는 낱말 (페이가 듣는다 — '날'이라 한다)"
    - "고마워 (빚)"
    - "고향의 이름 (잊었다)"
  length: "짧다. 네 박으로 끊어 말한다. 엘린 이야기에서만 문장이 길어진다"
  samples:
    - {situation: 첫 만남, line: "일, 이, 삼, 사. …손님이오? 비키시오. 소절이 끝나기 전에는 멈출 수 없소."}
    - {situation: 호의, line: "오늘이 며칠이오? …아니, 대답하지 마시오. 들으면 손이 떨리니. 그래도 물어보고 싶었소."}
    - {situation: 적대, line: "서른의 몸으로 칼을 든 일흔의 마음이오. 한번 겪어 보겠소?"}
    - {situation: 거래(길 안내), line: "안개 장터는 셋째 박자에서 동쪽이오. 대신 엘린에게 오늘 소식 한 마디만 전해 주시오."}
    - {situation: 겁먹었을 때, line: "계약이 풀리면 하룻밤에 일흔한 해를 먹는다 했소. …말하지 마시오. 그 말은 소절에도 안 들어가오."}
    - {situation: 슬픔, line: "얼굴은 늙지 않았는데 나를 아는 사람은 다 늙어 죽었소. 이름 부르는 이 하나 없는 춤은 길더이다."}
    - {situation: 비밀 누설, line: "숲에 든 해가 AS 241이오. 서른이었소. 엘린이 세어 주는데 일흔한 해라 하더이다. 계약을 풀면 그 해가 한꺼번에 오오. 하룻밤에."}
    - {situation: 춤이 달라졌을 때, line: "…소절이 달랐소. 내가 아니라 오늘이 달랐소. 늘 같은 춤인데 오늘은 박자가 한 걸음 앞서 있소."}
    - {situation: 마음을 열었을 때, line: "엘린이 오늘 이야기를 해 주면 소절이 하나 바뀌오. 바뀌면 안 되는 건데… 나는 그게 좋소."}
schedule:
  아침: "장난감 정원 한가운데서 같은 춤을 시작한다 (여름 반나절)"
  낮: "겨울 반나절에는 춤을 멈추고 얼어붙은 채 서 있는다"
  저녁: "엘린이 오면 오늘의 날짜를 듣는다"
  밤: "목검을 닦고 어깨를 세 번 돌린다"
