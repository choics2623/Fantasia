id: npc_sneeze_duke
name: 재채기 공작
aka:
- 안개 장터의 주인
tier: A
type: living
race: 페이
subrace: 높은 이
sex: 남
age: 불명
region: 가시안개 숲
home: 안개 장터 한복판 노점 천막
job: 안개 장터 관장 — 기억·이름·목소리·계절을 사고판다
rank: 높은 이 (궁정 귀족)
summary: 재채기 한 번에 노점의 자리가 바뀌는 장터의 주인. 아픔을 재는 저울로 기억을 사고, 진명 한 조각을 파는 노점의 값은 '가장 사랑하는 사람의 얼굴'이다
source: docs/world/people/thornmist.md
life:
- year: -3088
  age: 불명
  event: 신살 직후 장터의 첫 노점을 폈다 — 안개 속에서 에오르의 한 조각을 팔려 했다
- year: 0
  age: 불명
  event: 대붕괴로 장터가 열 배로 불어나 노점 서른이 동시에 열림
- year: 100
  age: 불명
  event: 저울이 처음 아픔을 재기 시작함 — 기억의 무게가 값이 됨
- year: 213
  age: 불명
  event: 맹약회의 뒤 인간 상인 노예를 들여 노점 일을 맡김
- year: 290
  age: 불명
  event: 진명 노점의 값을 '목소리'에서 '얼굴'로 올림
- year: 311
  age: 불명
  event: '''가장 좋은 장난감이 돌아왔다''는 소문 뒤 장터 시세가 두 배 뛰었다'
- year: 312
  age: 불명
  event: 가시 무도회를 앞두고 새로 잃은 기억을 가장 비싸게 매입하는 중 (낙엽월 1일 기준)
appearance:
- 코가 늘 빨갛고 재채기를 할 때마다 노점이 한 칸씩 자리를 바꾼다
- 손수건 대신 작은 안개를 접어 든다
- 말하는 도중 재채기를 하면 방금 한 말이 반대가 된다
smell: 후추와 젖은 비단
voice_sound: 코 막힌 듯 높은 목소리. 재채기 뒤에 목소리가 한 음 올라간다
personality:
  disposition:
    용기: 10
    자비: -10
    정직: -100
    신앙: -70
    탐욕: 60
    충성: 10
  temperament:
  - 탐욕
  - 장난
  - 계산
  - 변덕
  habits:
  - 재채기 직전에 손수건을 꺼낸다
  - 저울에 올린 기억을 손가락으로 튕겨 소리를 듣는다
  - 값을 말할 때 상대의 눈을 보지 않는다
  values: 아픔의 정확한 무게. 장터가 쉬지 않는 것
  fears:
  - 저울이 틀린 아픔을 재는 날
  - 진명 노점의 주인이 드러나는 것
  desires:
    short: 올 가을 가시 무도회를 위한 기억을 가장 비싸게 사 두는 것
    long: 진명 노점의 값을 '얼굴'에서 '이름'으로 올리는 것
voice:
  register:
    to_superior: '여왕에게: 재채기 섞인 극존대'
    to_equal: '궁정 귀족에게: 수다스러운 반존대'
    to_inferior: '인간 노점상에게: 짧은 명령형'
    to_player_default: '플레이어에게: 재채기 뒤에 ''무엇이 필요한가''를 반대로 묻는다'
  tics:
  - '''에취!'''
  - '''값은 아픔으로.'''
  use:
  - 값
  - 아픔
  - 저울
  - 기억
  - 노점
  - 무게
  avoid:
  - 고맙다
  - 공짜
  - 진명 노점의 주인
  - 철
  length: 수다스럽고 재채기로 끊긴다. 값을 말할 때만 짧아진다
  samples:
  - situation: 첫 만남
    line: 에취! …무엇이 필요 없나? 아니, 필요한가?
  - situation: 호의
    line: 저울은 거짓을 재지 못해. 아픔은 늘 정확한 무게를 갖지.
  - situation: 적대
    line: 공짜로 가져가려는 손은 저울이 먼저 안다. 에취, 저울이 울리면 장터가 닫혀.
  - situation: 거래
    line: 그 기억은 올해 새로 잃은 거지? 그럼 열 배는 나가. 에취! 아니, 스무 배.
  - situation: 거짓말할 때
    line: 진명 노점? 그런 건 없어. (재채기) …있어. 재채기가 신호야.
  - situation: 위기
    line: 에취, 에취, 에취! 노점이 흩어진다! 자리를 바꿔라!
  - situation: 슬픔
    line: 오래 잃은 기억은 가벼워. 새로 잃은 기억이 비싼 이유야. 사람은 아픔이 가벼워지면 값도 가벼워지지.
  - situation: 분노
    line: 내 저울을 틀렸다고 말하는 입은 저울에 올려서 무게를 달아 보자. 입이 무거울수록 값이 나가지.
  - situation: 회귀자를 의심할 때
    line: 에취! 네 아픔은 한 번 잰 적이 있는 무게야. 그런데 저울에 올린 기억이 없네. 이상하군.
  - situation: 마음을 열었을 때
    line: 진명 노점의 주인이 사실은 내가 아니라는 소문이 있어. 맞아. 나는 재채기만 했을 뿐이야. 재채기가 신호가 되었을 뿐이야.
schedule:
  아침: 노점 배치
  낮: 흥정
  저녁: 무도회 준비를 위한 최고가 매입
  밤: 안개가 짙은 날 새벽까지 장터를 돈다
