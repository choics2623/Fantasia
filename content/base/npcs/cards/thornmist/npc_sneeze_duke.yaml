on_death: 안개 장터의 시세가 무너지고 진명 노점이 사라진다. 기억·이름 매입이 이름 수집가 한 곳에 몰린다
story_seeds:
- 진명 노점의 값은 얼굴이다. 얼굴 없이 진명을 얻을 수 있는 사람이 있다면 그는 값 자체를 면제받은 사람이다
- 가시 무도회 전 새로 잃은 기억이 가장 비싸다 — 플레이어가 팔 수 있는 기억은 무엇인가
