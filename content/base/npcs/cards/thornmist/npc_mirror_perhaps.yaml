voice:
  register:
    to_superior: '여왕에게: 완벽한 거꾸로 전달, 감정 없는 평평한 말'
    to_equal: '웃음 조각에게: 곧고 낮은 말'
    to_inferior: '인간에게: 가정으로 질문하고 곧게 답한다'
    to_player_default: '플레이어에게: 가정을 던지고 상대가 가정에 답하면 한 걸음 가까이 온다'
