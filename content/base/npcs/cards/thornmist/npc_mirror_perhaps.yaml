  length: 짧다. 진실 하나를 말할 때는 길고 곧다
  samples:
  - situation: 첫 만남
    line: 혹시… 네가 오늘 이 방에 온 것이 우연이 아니라면, 어제 본 얼굴과 닮았다고 말해도 될까.
  - situation: 첫 만남(결사 인사)
    line: (주먹을 입 앞에 쥔다) 무엇이 우스운가? — 아무것도.
  - situation: 호의
    line: 여왕은 '웃지 마라'고 했어. 나는 '웃어라'고 전할게. 그것이 진실에 가까워.
  - situation: 적대
    line: 여왕을 미워한다고 말하는 건 우리가 아니야. 우리는 웃지 못할 뿐이야.
  - situation: 거래
    line: 진실 하나를 줄게. 대신 네가 아는 진실 하나를 줘. 값은 같아야 해.
  - situation: 거짓말할 때
    line: 혹시 모든 것이 거울이라면 어제와 오늘은 같은 얼굴이겠지. (거울이 뒤집힌다)
  - situation: 위기
    line: 혹시 문이 열려 있다면 뛰어. 혹시 닫혀 있다면 — 아니, 뛰어.
  - situation: 슬픔
    line: 여왕은 웃었다고 하지만 나는 그녀의 말을 거꾸로 전한다. 그래서 나는 그녀가 운 날도 안다.
  - situation: 회귀자를 의심할 때
    line: 혹시 네가 이 방에 처음이 아니라면 거울이 먼저 알아봤을 거야. 거울은 말하지 않았어. 말하지 않은 것이 증거야.
  - situation: 마음을 열었을 때
    line: 이번 가을 내가 말할 진실은 '우리는 그 아이를 여왕보다 먼저 만난다'일지도 몰라. 혹시라는 말은 그래서 쓰는 거야.
