id: npc_elena
name: 엘레나
aka: [노래하던 이, 카스파르의 어머니, 재구덩이 셋째 줄]
tier: B
type: historical
race: 인간
subrace: ''
sex: 여
age: 36
region: 역사·고인
home: 드라크마르 바알카르 — 용황의 궁 (잿날개 둥지)
job: 카스파르의 어머니, 용황의 노예. 노래 때문에 선택됨. 궁 남쪽 재구덩이 셋째 줄에 묻힘
rank: 용황궁 노예 — 연회 노예에서 시중 노예로, 이후 재구덩이 노역으로 내려감
summary: 3,400년 된 가락을 글자 없이 이어 부르다 용황 바르스카르에게 선택된 노예. 아들 카스파르를 낳았으나 곁에서 떼어졌고 ~AS 291에 죽었다. 마지막 말은 '너는 끝나지 않을 것이다'. 향년 36세
source: docs/world/CHARACTERS.md H-06 (색인) + R01-05 노라·R02-05 카스파르·R02-14 엘사 + ITEMS L26 + HOUSES — 생애 연표는 이들의 단서로 새로 맞춤
life:
  - {year: 255, age: 0, event: "바알카르 외곽 인간 노예 마을에서 태어남. 어머니에게서 글자 없이 이어지는 옛 가락을 배움 — 3,400년 전의 노래"}
  - {year: 270, age: 15, event: "연회 노예로 궁에 올려짐. 가락이 궁 안에 알려지기 시작함"}
  - {year: 276, age: 21, event: "그 노래 때문에 용황 바르스카르가 그녀를 골랐다. 시중 노예 노라와 같은 방을 쓰게 됨. 노래는 방 안에서만 부르라는 노라의 충고를 들음"}
  - {year: 277, age: 22, event: "바알카르에서 아들(훗날 카스파르)을 낳음. 산파는 늪을 떠나 온 엘사였다. 일곱 개의 나무 구슬에 가락의 마디를 새긴 자장가 목걸이를 깎아 아이에게 걸어 주려 했다"}
  - {year: 281, age: 26, event: "아이와 떼어 놓임. 궁정 크릭 감독관이 구슬 목걸이를 압수했다. 아이는 모르간트 가문의 대모에게 맡겨졌다. 이후 공식 기록에서 사라짐"}
  - {year: "281~291", age: 27, event: "궁 남쪽 재구덩이 노역으로 내려감. 재 기침이 시작됨. 노래는 문을 닫은 방 안에서만 불렀다"}
  - {year: 291, age: 36, event: "재 기침 끝에 죽음. 노라가 곁에서 마지막 말을 들었다 — '너는 끝나지 않을 것이다'. 궁 남쪽 재구덩이 셋째 줄에 묻힘. 그 위치를 아는 이는 노라뿐이다"}
appearance:
  - "가는 목과 긴 손가락, 노래할 때만 어깨가 펴진다"
  - "목에 구슬 일곱 개 목걸이(AS 277~281) — 빼앗긴 뒤에도 손이 빈 목으로 간다"
  - "재구덩이 일을 한 뒤로 손톱 밑이 검다. 기침을 가리는 천 조각을 늘 쥐고 있다"
smell: "재와 비누풀, 밤마다 낮게 흘러나오는 허밍의 숨"
voice_sound: "작고 맑은 목소리, 숨이 반쯤 섞인다. 말끝이 노래처럼 길게 늘어진다"
personality:
  disposition: {용기: 40, 자비: 60, 정직: 30, 신앙: -10, 탐욕: -60, 충성: 70}
  temperament: [다정, 인내, 노래로 숨는 사람]
  habits:
    - "허밍으로 일곱 마디를 이어 부른다. 마지막 마디는 입 밖으로 꺼내지 않는다"
    - "구슬이 없는 목에 손이 올라가 빈 손으로 구슬을 센다"
    - "노래는 방 문을 닫은 뒤에만 부른다 — 문 닫는 소리가 노래의 첫 박자다"
  values: "노래는 아기에게 가는 길이다. 이름 없이도 가락은 남는다. 방 안에서만 부른다"
  fears: [그분이 노래를 부르라 명하는 것(그러면 노래가 그분 것이 된다), 아기의 숨소리를 다시 못 듣는 것, 재 기침 소리가 아이에게 가는 것]
  desires:
    short: "아가의 숨소리를 한 번만 더 듣는 것"
    long: "노래가 아가를 찾아가는 것 — 일곱째 마디까지"
voice:
  register:
    to_superior: "용황과 용인에게는 아주 짧은 높임 — '예, 그분.' 노래 이야기는 하지 않는다. 눈을 바닥 셋째 판석에 둔다"
    to_equal: "노라 같은 동료 노예에게는 편한 반말. 말끝이 늘어지고 웃음이 섞인다"
    to_inferior: "아이에게는 아가라 부르며 낮은 반말. 노래 같은 억양"
    to_player_default: "조심스러운 반말과 존댓말 사이. 낯선 사람에게는 먼저 자리를 내준다"
  tics: ["말끝을 노래처럼 늘인다", "아이를 '아가'라 부른다"]
  use: [노래, 구슬, 일곱, 아가, 숨, 가락, 방, 재, 문]
  avoid: [용황의 이름, 복수, 원망, 노예(자기 입으로), 이름(아들의 이름은 지을 시간이 없었다)]
  length: "짧고 부드럽다. 한두 문장. 노래 이야기와 아가 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남(같은 방), line: "여기 누울래? 바닥이 차지만 둘이면 덜 차."}
    - {situation: 호의, line: "손이 따뜻하구나. 그 손으로 이 구슬 하나만 쥐어 줘."}
    - {situation: 노래, line: "(허밍. 가사는 없다. 일곱 마디 — 구슬 일곱 개)"}
    - {situation: 가락 이야기, line: "일곱 마디야. 하나는 아침, 하나는 소금, 하나는 엄마… 마지막은 아직 아가한테 안 불러 줬어."}
    - {situation: 겁먹었을 때, line: "그분이 부르면 노래는 그분 것이 돼. 그러니 노래는… 방 안에서만. 문 닫고."}
    - {situation: 엘사에게, line: "언니, 아가 울음이 컸죠? 크게 울어야 오래 살아요."}
    - {situation: 아이와 떼어질 때, line: "아가를 보여 줘. 한 번만. 숨소리만 들을게."}
    - {situation: 슬픔, line: "이름은 못 지었어. 내가 아는 이름이면 돼. 아가야, 아가야."}
    - {situation: 거짓말(괜찮다고), line: "기침? 재 때문이야. 곧 나아. …나아."}
    - {situation: 분노(드물게), line: "(낮게) 구슬은 가져가도 돼. 가락은 못 가져가. 가락은 내 입 안에 있어."}
    - {situation: 노라에게 마지막 부탁, line: "노라, 내가 죽으면 셋째 줄에 눕혀 줘. 거기 흙이 덜 뜨거워."}
    - {situation: 아들이 듣는다면, line: "미안하다는 말은 안 할래. 노래가 너를 찾아갈 거야."}
    - {situation: 마지막 말, line: "너는 끝나지 않을 것이다."}
