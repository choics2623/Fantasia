  - {to: npc_dara, type: 다툼(같은 목소리), like: -10, trust: -20, visibility: 일방, memo: null, words: "같은 잿불 광산. '그대는 1만을 걸고 계획 하나 없었소.' 속도로 돌파한 사람과 설계로 쌓은 사람 — 서로의 방식이 서로의 무덤이었다고 속으로는 안다"}
  - {to: npc_first_ember, type: 다툼(같은 목소리), like: 10, trust: 0, visibility: 일방, memo: null, words: "'한 글자씩, 그 사이에 아이들이 몇 번 탔소.' 3,000년 전의 선생. 한 글자씩의 힘을 그는 아스테리아에서 증명했다고 믿는다"}
  - {to: npc_ian_ash, type: 이름을 입은 가짜, like: 20, trust: 0, visibility: 일방, memo: null, words: "'돌아온 아스테리온'을 자칭하는 재오염 수도자. 자기 이름을 입고 불에 오르려는 이를 보며, 이름은 스스로 짓는 것이라는 첫 법을 떠올린다"}
toward_player: "주인공을 '그대'라 부른다. 이름을 묻고, 계획과 문서를 권한다. 한 사람을 구하는 일에는 힌트를 붙이지 않는다"
