id: npc_asterion
name: 아스테리온
aka: [백 번 돌아온 입법자, 문의 목소리, 아스테리아의 창건자]
tier: B
type: historical
race: 인간
subrace: 광산 인간
sex: 남
age: 41
region: 역사·고인
home: 아스테리아 (잿불 언덕 광산에서 시작해 대륙 중앙에 세운 최초의 인간 자유 도시)
job: 앞선 잔향자. 잿불 언덕 광산 노예, 아스테리아 건설, 대붕괴
rank: 아스테리아의 창건자·입법자. 광산 노예 출신 — 이름은 스스로 지었다
summary: 백 번 넘게 죽고 돌아오며 진명을 모아 AS −9 봉기와 자유 도시 아스테리아를 세운 사람. AS 0 마지막 회차에 회귀를 모든 인간에게 돌려주려다 바르스카르의 불에 회귀가 끊겼다(대붕괴). 하오체 연설조의 〈문의 목소리〉. 향년 41세
source: docs/world/CHARACTERS.md H-03 (색인) + docs/systems/15_INNER_VOICES.md §3.3 (목소리 정본) + WORLD_BIBLE §1.3.1·§2.1
life:
  - {year: -41, age: 0, event: "잿불 언덕 광산 노예 집안에서 태어남. 어머니가 지어 준 이름이 있었으나 백 번의 회차 어딘가에서 잃었고, 지금 그것을 아는 이는 아무도 없다"}
  - {year: -21, age: 20, event: "광산의 어느 새벽 낙반으로 죽었다가 같은 새벽에 눈을 뜸 — 그의 회귀점. 이 시점으로 백 번 넘게 돌아오게 된다"}
  - {year: -21~-11, age: 21, event: "회귀를 거듭하며 진명을 낱말씩 모음. 회차마다 몇 낱말. 광산의 같은 새벽을 백 번 맞는 법을 익힘. 스스로 '아스테리온'이라는 이름을 지음"}
  - {year: -11, age: 30, event: "아스테리아 서기장이 될 노예 미라벨에게 '첫 글자'를 가르침. 곡괭이 대신 깃펜을 들기 시작함"}
  - {year: -9, age: 32, event: "잿불 광산 봉기. 몰래 익힌 진명으로 노예 봉기를 이끌고 대륙 중앙에 최초의 인간 자유 도시 아스테리아를 세움. 첫 법 「이름은 스스로 짓는다」를 선포"}
  - {year: -9~0, age: 33, event: "아스테리아 9년. 인구 최대 12만. 인간이 글을 배우고 이름(성)을 가졌다. 노예에게 성을 지어 주는 일을 가장 큰 일로 여김"}
  - {year: 0, age: 41, event: "대붕괴. 연합군이 아스테리아를 포위한 마지막 회차, '시간'의 진명으로 회귀를 한 사람이 아닌 모든 인간에게 돌려주려는 의식이 성공 직전이었다. 용황 바르스카르의 불이 먼저 와 그의 회귀를 끊었고 시간이 찢어졌다. 아스테리아와 주변 수백 리가 소멸 → 재의 황무지"}
appearance:
  - "광부의 굳은 어깨와 갈라진 손톱 — 어깨엔 곡괭이 자국, 오른손엔 깃펜 굳은살이 겹쳐 있다"
  - "시선이 한 박자 늦게 따라온다. 말과 눈이 어긋나 보인다 — 백 번의 그가 한꺼번에 보는 탓이다"
  - "손바닥에 엄지로 문 하나의 윤곽을 긋는 버릇 — 아스테리아의 성문"
smell: "광산 분진과 잉크, 불탄 재의 끝"
voice_sound: "깊고 막힘없는 연설가의 목소리. 한 문장이 끝나면 반 박자 뒤에 같은 말이 아주 작게 한 번 더 겹친다"
personality:
  disposition: {용기: 70, 자비: 10, 정직: -20, 신앙: 40, 탐욕: 30, 충성: 40}
  temperament: [웅변, 설계, 자책에서 집착으로]
  habits:
    - "사람을 보면 이름부터 묻는다 — 주인이 붙인 것 말고, 스스로 지은 것을"
    - "엄지로 손바닥에 문 하나의 윤곽을 긋는다 — 말이 길어질수록 문이 커진다"
    - "말하다가 같은 문장을 반 박자 늦게 한 번 더 겹쳐 말한다"
  values: "이름은 스스로 짓는다. 법과 문서가 칼 백 자루보다 오래 간다. 끝내지 못한 것은 끝내야 한다"
  fears: [처음의 이름을 아는 사람이 하나도 남지 않았다는 것, 의식을 끝내지 못한 자기, 불, 아스테리아를 기억하는 이가 사라지는 것]
  desires:
    short: "이름을 말하게 하는 것 — 단 한 사람에게라도"
    long: "끝내지 못한 것을 끝내는 것. 회귀를 한 사람이 아닌 모든 인간에게 돌려주는 것"
voice:
  register:
    to_superior: "용인이든 용황이든 하오체. 고개를 숙이지 않고 연설하듯 말한다"
    to_equal: "하오체. '그대'. 질문이 아니라 선언으로 묻는다"
    to_inferior: "노예와 군중에게도 하오체. 더 천천히, 이름을 한 사람씩 묻는다"
    to_player_default: "'그대'. 하오체 연설조. 명령형이 많다. 이름을 묻는다"
  tics: ["'그대 이름은?'", "'계산하시오.'", "줄이 반 박자 늦게 한 번 더 겹쳐 나온다"]
  use: [그대, 이름, 문, 법, 도시, 계산, 지도, 초안, 성(姓), 백]
  avoid: [반말, 해요체, 용서, 쉬다, 한 사람만을 위해(그는 계획 위주로 말한다)]
  length: "길다. 연설조의 두세 문장에 명령형 한 줄. 아이들 앞에서는 문장이 끊긴다"
  samples:
    - {situation: 첫 등장, line: "문마다 이름이 새겨져 있었소. 읽을 수 있지 않소? 읽으시오. (…읽으시오.)"}
    - {situation: 처음 만난 사람에게, line: "그대 이름은? …아니, 주인이 붙인 것 말고."}
    - {situation: 매각 명단을 볼 때, line: "마흔 개의 이름. 한 번도 스스로 지은 적 없는 이름들이오."}
    - {situation: 진명 판정 앞(그가 R3 이전일 때), line: "확실하오. 나는 이것보다 큰 것도 말했소."}
    - {situation: 진명 판정 앞(그가 R3 이후일 때), line: "운이 따라야 하오. …이번엔 정직하게 말하겠소."}
    - {situation: 군중 앞, line: "저들은 그대를 보지 않소. 그대 뒤를 보고 있소. 뒤에 무언가 있다고 믿게 하시오. (…믿게 하시오.)"}
    - {situation: 한 사람을 구해야 할 때, line: "그 아이 하나 때문에 400을 잃을 셈이오? 계산하시오. 다음 회차에 구하면 되오."}
    - {situation: 회차가 망가졌을 때, line: "이 회차는 버리시오. 지도는 얻었소. 다음 저녁에 더 잘하면 되오."}
    - {situation: 첫 이름의 책, line: "미라벨의 손 글씨… 미라벨이 들고 나갔군. 그 회차에는. 나는 그녀가 성문에서 죽은 줄 알았소 — 아흔 번은 그랬으니까."}
    - {situation: 재의 날(그가 R3 이전일 때), line: "오늘은 불을 피우지 않는다지. 내 탓이오. 312년째 내 탓이오."}
    - {situation: 성(姓)을 지어 주는 선택, line: "그것이오. 성 하나가 칼 백 자루보다 오래 가오. 이번 회차가 끝날 때까지는."}
    - {situation: 다라와 다툴 때, line: "그대는 사슬을 열었고, 다음 날 1만의 목이 사슬보다 무거워졌소. 아홉 번이나."}
    - {situation: 첫 불씨와 다툴 때, line: "한 글자씩? 그 사이에 아이들이 몇 번 탔는지 세어 보시겠소?"}
    - {situation: 지난 회차의 나에 대하여, line: "그것들은 초안이오. 찢어 버리시오. …나는 백 장을 찢었소. 마지막 장에 무엇이 남았는지 보시오."}
    - {situation: 처음의 이름에 대하여, line: "처음의 나를 아는 사람이 하나도 남지 않았소. 나조차."}
    - {situation: 아이들 앞에서, line: "(연설이 끊긴다. 반 박자 뒤에 겹침만 혼자 남는다) …소."}
    - {situation: 의식을 떠올릴 때(R3), line: "불이 먼저 왔소. 내가 아니었소. …그렇다면, 다시 할 수 있소."}
    - {situation: 비밀 누설(R3 이후), line: "그때 의식을 끝내지 못한 것은 나였소."}
    - {situation: 소리 내어 물었을 때, line: "크게 말하시오. 숨어서 세운 도시는 없소."}
    - {situation: 회차 끝, line: "이 회차의 법은 무엇이었소? …없다면, 다음 저녁에 지으시오."}
