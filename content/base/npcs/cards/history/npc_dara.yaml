id: npc_dara
name: 붉은 손 다라
aka: [아홉 번 일어선 자, 매듭 쥔 목소리, 붉은 길의 다라]
tier: B
type: historical
race: 인간
subrace: 광산 인간
sex: 여
age: 24
region: 역사·고인
home: 잿불 언덕 광산 막사 (붉은 계단)
job: 앞선 잔향자. 잿불 광산 봉기를 아홉 번 되풀이했고, 엘다르의 그물에 걸려 붉은 길에서 진짜로 죽음
rank: 광산 노예 — 봉기의 주모자
summary: AS 100, 같은 봉기를 아홉 번 되풀이한 광부. 회차마다 더 빨리, 더 많이 쳤고 아이 이야기에서만 무너진다. 주인공을 '다음의 나'라 부르는 거친 반말의 〈매듭 쥔 목소리〉. 마지막 말 '나는 전에도 왔고 또 올 것이다'. 향년 24세
source: docs/world/CHARACTERS.md H-04 (색인) + docs/systems/15_INNER_VOICES.md §3.4 (목소리 정본) + WORLD_BIBLE §1.3.1
life:
  - {year: 76, age: 0, event: "잿불 언덕 광산 갱도 안에서 노예의 딸로 태어남. 곡괭이를 걷기보다 먼저 쥐었다"}
  - {year: 99, age: 23, event: "광산 막사의 어느 밤, 족쇄를 처음 만져 본 순간 — 그녀의 회귀점. 이 밤으로 아홉 번 돌아오게 된다"}
  - {year: 100, age: 24, event: "첫 번째 봉기. 밀고자를 살려 보냈고 그 밀고자 때문에 사흘 만에 무너졌다. 이 일을 그녀는 평생 가장 큰 잘못으로 센다"}
  - {year: 100, age: 24, event: "두 번째~여덟 번째 봉기. 회차마다 더 빨리, 더 많이 먼저 쳤다. 밀고자를 먼저 제거했고 협력자도 살려 두지 않았다. 매듭끈에 매듭을 하나씩 더했다"}
  - {year: 100, age: 24, event: "아홉 번째 봉기. 진명으로 족쇄를 열었고(끊지 않았다) 실바렌 외곽에서 엘다르 궁수대를 매복으로 꺾었다. 엘다르가 그녀의 낌새를 알아챘다"}
  - {year: 100, age: 24, event: "3개월 만에 진압. 반란자 1만 명이 붉은 길에서 처형됨. 그녀는 엘다르의 시간의 그물에 걸린 채 진짜로 죽었다. 마지막 말 '나는 전에도 왔고 또 올 것이다' — 그물을 몰랐다. 아홉 번째에는 그 말이 사실이 아니었다"}
  - {year: 100, age: 24, event: "처형 전날 밤 매듭끈에 '다음의 나야. 아이들을 태우게 두지 마라'를 묶음. 자기 때문에 탄 아이들의 이름을 마지막 매듭에 묶었다. 아홉 번 묶었다"}
appearance:
  - "손바닥에 붉은 철광 흙이 박혀 있다 — 씻어도 지지 않아 '붉은 손'이라 불렸다"
  - "손목에 매듭끈이 아홉 겹 감겨 있다. 매듭 하나가 봉기 한 번이다"
  - "귀 한쪽이 접혀 있고 눈빛이 빠르다 — 사람의 손과 귀 끝부터 읽는다"
smell: "철광 분진과 젖은 밧줄, 오래 쓴 곡괭이 자루의 땀"
voice_sound: "낮고 거친 목소리. 빠르게 끊어 말한다. 아이 이야기에서만 목소리가 갈라지고 말이 끊긴다"
personality:
  disposition: {용기: 80, 자비: -60, 정직: 20, 신앙: -40, 탐욕: -30, 충성: 60}
  temperament: [거침, 정확함, 아이 앞에서 무너짐]
  habits:
    - "수를 매듭으로 센다 — 손가락으로 끈을 꼬듯 '한 매듭', '두 매듭'"
    - "손바닥의 굳은살을 엄지로 문지른다. 사람을 만나면 손과 귀 끝부터 본다"
    - "적의 수를 일부러 20% 적게 말한다. 겁을 먼저 덜어 주려는 버릇이다"
  values: "먼저 친다. 본보기를 세운다. 밀고자는 한 번 팔았으면 또 판다. 단 하나의 예외 — 아이"
  fears: [아이가 불에 타는 것, 자기가 만든 법이 아이를 태웠다는 것, 아홉 번째에도 같은 밀고자가 있다는 것, 다음의 내가 자기처럼 되는 것]
  desires:
    short: "아홉 번째는 아니기를 — 이번엔 밀고자가 한 번 덜 팔기를"
    long: "아이들이 불에 타지 않는 아침. 그 아침을 다음의 내가 보게 되는 것"
voice:
  register:
    to_superior: "용인은 '비늘', 목줄단은 '목줄', 크릭 감독은 '채찍'이라 부른다. 윗사람에게도 반말이 새어 나온다. 눈을 내리지 않는다"
    to_equal: "거친 반말. 매듭으로 센다. 짧게 끊는다"
    to_inferior: "신참 광부에게도 반말이지만 정확하다. 먼저 먹이고 먼저 쉬게 한다"
    to_player_default: "'다음의 나'. 거친 반말. 주인공은 그녀에게 잔향이라는 하나의 줄의 다음 매듭이다"
  tics: ["'한 매듭.'", "'다음의 나야.'", "'후회 안 해.'"]
  use: [매듭, 비늘, 목줄, 채찍, 손, 굳은살, 사슬, 이름, 본보기, 아이(예외)]
  avoid: [존댓말, 협상, 용서, 기도하는 말, 후회(말로는 '후회 안 해'만)]
  length: "짧고 빠르다. 한두 문장. 아이 이야기에서는 말이 끊긴다. 마지막 매듭 이야기에서만 길어진다"
  samples:
    - {situation: 첫 등장, line: "손 펴. 굳은살 봐. 이 손은 곡괭이 말고 다른 것도 쥘 줄 알아."}
    - {situation: 마르타를 볼 때, line: "목줄이다. 귀 끝 잘린 거 보이지? 첫 밀고 상이야. 스물세 매듭은 묶었겠네."}
    - {situation: 매복 앞, line: "해볼 만해. 셋이야. (실제로는 넷)"}
    - {situation: 설득 앞, line: "무모해. 비늘한테 말이 통한 적 있어?"}
    - {situation: 밀고자를 잡았을 때, line: "살려 보내면 내일 바르그를 데려와. 나 그거 한 번 해 봤어. 첫 번째에. 매듭 하나 묶고 끝내."}
    - {situation: 지난 회차에 배신한 자를 볼 때, line: "저거 지난번에 너 팔았잖아. 아직 안 팔았다고? 아직이지."}
    - {situation: 본보기를 권할 때, line: "머리 하나 걸면 열 명이 입을 닫아. 셈이 맞잖아."}
    - {situation: 학살을 권할 때, line: "목줄들, 그 식구까지. 남겨 두면 그 애들이 커서 목줄이 돼. 다 끝내."}
    - {situation: 아이가 휘말리는 순간, line: "잠깐. 애는 빼. 애는— 애는 빼라고!"}
    - {situation: 사슬·족쇄 앞, line: "끊지 마. 끊으면 소리가 나. 여는 거야. 이름을 알면 열려."}
    - {situation: 붉은 길의 돌무덤, line: "하나 집어. 이름 들려? …다 나 때문에 걸린 목이야. 아홉 번째 거. 후회 안 해. 후회 안 한다고."}
    - {situation: 마지막 매듭을 묶으며(처형 전날 밤), line: "다음의 나야. 아이들을 태우게 두지 마라. 아홉 번 묶었다."}
    - {situation: 마지막 말(붉은 길), line: "나는 전에도 왔고 또 올 것이다."}
    - {situation: 회귀 직후, line: "다시 처음이네. 이번엔 누구부터 칠지 알잖아."}
    - {situation: 첫 불씨와 다툴 때, line: "그분들? 그분들이 너를 태웠어. 정원째."}
    - {situation: 아이들의 합창이 끝난 뒤, line: "…알아. 내가 그 법을 만들었지. 내가 또 깨어나서."}
    - {situation: 소리 내어 물었을 때, line: "입 다물어. 목줄들은 귀가 좋아."}
    - {situation: 잠식 직전, line: "손 줘. 잠깐만. 내가 할게."}
    - {situation: 회차 끝, line: "다음의 나야. 아이들은? …몇 명 남았어? 다음 저녁엔 몇 명부터 시작해?"}
