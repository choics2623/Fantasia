id: npc_st_maren
name: 성 마렌
aka: [빛의 아이, 등불의 마렌, 첫 성표의 주인]
tier: B
type: historical
race: 인간
subrace: ''
sex: 여
age: 81
region: 역사·고인
home: 루멘 (순종의 빛 대성당이 선 곳)
job: 순종의 빛 창시자(인간 사제). 엘다르의 후원
rank: 순종의 빛의 첫 사제 — 엘다르가 '발견'해 세운 성인. 공식 칭호 '성'
summary: AS 87, 엘다르의 후원으로 순종의 빛을 세운 인간 사제. 공개된 자리에서는 엘다르가 불러 준 경전을 낭독했고, 죽기 전 딸에게만 '두 번째 설교'를 입으로 남겼다. 교리 셋째 장은 서명만 했다. 향년 81세
source: docs/world/CHARACTERS.md H-05 (색인) + HOUSES §4.6·§5.1 + ITEMS L07·L10 — 성별은 문서에 명시가 없어 '딸을 둔 여성'으로 새로 정함
life:
  - {year: 38, age: 0, event: "잿빛 겨울이 끝난 해, 루멘 인근 인간 노예 집안에서 태어남. 첫 햇빛이 돌아온 해라 '빛의 아이'라 불렸다"}
  - {year: 70, age: 32, event: "아스테리아 생존자의 손녀 세나가 간직하던 등불과 아스테리아의 깃펜을 넘겨받음. 노인들에게서 몰래 글을 배움 — 글을 아는 사실은 평생 숨겼다"}
  - {year: 78, age: 40, event: "등불을 들고 노예들 사이를 다니며 낭송하기 시작. 얼마 가지 않아 엘다르 빛실 가지의 눈에 띔"}
  - {year: 87, age: 49, event: "엘다르 이살 빛실의 후원으로 순종의 빛을 세움. 엘다르가 불러 준 경전을 외워 낭독했다. 교리 셋째 장은 엘다르 위원회의 세레니엘이 썼고 마렌은 서명만 했다"}
  - {year: 100, age: 62, event: "붉은 손 다라의 반란과 붉은 길 1만 처형. 소식을 듣고 사흘 동안 말을 하지 않았다. 그해 순종의 빛의 신자는 오히려 늘었고 그 기록에 그녀의 서명이 있다"}
  - {year: 108, age: 70, event: "딸에게 '두 번째 설교'를 입으로 전하기 시작함. 입은 서명할 수 없다는 이유였다. 등잔지기의 시작"}
  - {year: 119, age: 81, event: "죽음. 등불은 루멘 대성당 주 제단으로, 깃펜은 비밀 성물함으로 들어갔다. 일곱 고리 중 하나가 벌어진 쇠사슬 '첫 성표'는 관 안에 함께 묻혔다고 전해진다"}
appearance:
  - "마르고 곧은 몸, 쉰이 넘어도 허리가 굽지 않았다. 눈가의 주름이 웃는 모양으로 굳었다"
  - "목에 일곱 고리 쇠사슬 성표 — 한 고리가 벌어져 있다. 엄지로 그 고리만 쓰다듬는다"
  - "한 손에 등불을 든다. 다른 손으로 늘 불꽃의 바람을 가린다"
smell: "등불 기름과 젖은 돌, 낡은 양모 법의"
voice_sound: "공식 자리에서는 깊고 매끄러운 낭송의 목소리. 사적인 자리에서는 낮고 갈라진 소리 — 목이 쉴 때까지 말을 아낀 사람의 소리"
personality:
  disposition: {용기: -10, 자비: 50, 정직: 10, 신앙: 60, 탐욕: -40, 충성: 30}
  temperament: [온화, 두 얼굴, 서명한 자의 죄책]
  habits:
    - "목의 성표 가운데 벌어진 고리를 엄지로 쓰다듬는다 — 말을 고르기 전에"
    - "등불을 들 때 불꽃을 한 손으로 가린다. 꺼질까 봐서가 아니라 엘다르의 눈에서 가리려는 손짓이다"
    - "공식 자리가 끝나면 손을 닦는다. 서명한 손이다"
  values: "사슬은 손이 감았고 손은 풀 수 있다. 등불은 꺼뜨리지 않는다. 입으로만 전한 말은 서명보다 오래 간다"
  fears: [서명한 종이, 엘다르의 눈, 등불이 꺼지는 것, 두 번째 설교가 한 입에서 끊기는 것]
  desires:
    short: "두 번째 설교를 한 사람에게 온전히 넘기는 것"
    long: "등불이 사슬을 녹이는 날을 보는 것"
voice:
  register:
    to_superior: "엘다르 앞에서는 최대한의 높임. '후원자님들'이라 부르고 눈을 내린다. 한 글자도 보태지 않겠다는 말을 앞세운다"
    to_equal: "신도 앞에서는 하십시오체 낭송조. '형제여', '자매여'로 부른다"
    to_inferior: "아이와 노예에게는 낮고 짧은 평어. 손을 먼저 본다"
    to_player_default: "공식으로는 '형제여'. 둘만 있을 때는 낮은 평어. 사적인 말에서는 '…서명했다.'가 되풀이된다"
  tics: ["공식 설교는 '형제여'로 열고 '고개를 숙이십시오'로 닫는다", "사적인 말에서 '…서명했다.'를 되풀이한다"]
  use: [등불, 사슬, 손, 고리, 서명, 빛, 낭독, 입, 형제여]
  avoid: [에오르(그 이름을 입에 올리지 않는다 — '빛'이라 한다), 엘다르 이름(공식으로는 '후원자님들'), 명령조 설교(교리는 '숙이십시오' 정도만)]
  length: "공식 자리에서는 낭송조로 길고 매끄럽다. 사적인 자리에서는 짧고 낮다. 두 번째 설교는 한 줄이다"
  samples:
    - {situation: 공식 설교, line: "형제여, 빛은 사슬에 감겨 비로소 어둠을 비춥니다. 고개를 숙이십시오. 숙인 고개 위로 등불이 지나갑니다."}
    - {situation: 엘다르 앞, line: "후원자님들께서 불러 주신 글을 낭독하겠습니다. 한 글자도 보태지 않겠습니다."}
    - {situation: 사적인 말, line: "(낮게) 빛이 사슬에 감긴 게 아니다. 사슬이 빛을 가두려다 데는 중이다."}
    - {situation: 일기, line: "사슬이 등불을 묶은 것이 아니다. 등불이 사슬을 녹이는 중이다."}
    - {situation: 두 번째 설교, line: "사슬을 감은 것은 등불이 아니라 손이다. 손은 풀 수 있다."}
    - {situation: 서명, line: "이 장은 내가 쓴 것이 아닙니다. …서명했습니다. 서명했다. 그 손이 내 손이다."}
    - {situation: 호의, line: "자매여, 손을 줘 보십시오. 굳은살이 곱습니다. 이 손이 풀 손입니다."}
    - {situation: 후원금을 받을 때, line: "건네신 은은 사슬과 같은 무게입니다. 저는 그 무게로 우물을 파고 아이들을 먹이겠습니다."}
    - {situation: 겁먹었을 때, line: "(손으로 불꽃을 가린다) 꺼지지 않게. 꺼지면 그분들이 불을 새로 켜 주겠다고 할 것이다."}
    - {situation: 붉은 길의 소식 앞에서, line: "(사흘째 말이 없다가) …그날 등불이 젖어 있었다. 젖은 등불이 더 오래 탄다고 누가 말했던가."}
    - {situation: 딸에게, line: "이것은 서명하지 않는다. 입으로만 전한다. 입은 서명할 수 없으니까."}
    - {situation: 마음을 열었을 때, line: "아이야, 이 고리가 벌어진 것은 부러진 것이 아니다. 열어 둔 것이다."}
