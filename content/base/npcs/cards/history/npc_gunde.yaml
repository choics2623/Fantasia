  - {to: npc_yorun, type: 노래로 남긴 자의 후손, like: 10, trust: 0, visibility: 일방, memo: null, words: "방패 노예가 거인에게 말을 걸었다는 노래를 아는 무녀. 그 노래가 자기 이야기인 줄은 모른다. 배고픈 아이가 먹고 있기를 바랄 뿐이다"}
  - {to: npc_dara, type: 다툼(같은 목소리), like: 0, trust: -10, visibility: 일방, memo: null, words: "'친 놈들은 앞에서 죽어. 방패는 뒤에서 오래 죽고.' 치는 쪽과 버티는 쪽 — 서로 상대가 틀렸다고 말하지 않는다"}
  - {to: npc_asterion, type: 다툼(같은 목소리), like: 0, trust: -20, visibility: 일방, memo: null, words: "'백 번? 나도 셌어. 세다 보면 세는 놈만 남아.' 세지 말라고 말하고 싶다. 세지 않고는 못 서 있는 것도 안다"}
toward_player: "주인공을 같은 줄에 선 막내로 본다. 먹었는지, 몇이 남았는지부터 묻는다. 영웅담은 받지 않는다"
