id: npc_gunde
name: 군데
aka: [방패줄의 막내, 서리 낀 목소리]
tier: B
type: historical
race: 인간
subrace: 서리 인간(서리말을 모국어로 쓴다)
sex: 남
age: 34
region: 역사·고인
home: 거인 전쟁의 요툰 군대 방패줄 (북쪽 서리 땅)
job: 앞선 잔향자. 거인 전쟁의 방패 노예. 같은 새벽의 같은 줄로 수십 번 돌아왔고, 전쟁터에서 사라짐
rank: 요툰 군대의 방패 노예 — 줄에서 가장 어린 막내
summary: SK ~2,350, 거인 전쟁의 방패줄에서 죽을 때마다 같은 새벽으로 돌아온 막내. '거인은 배고픈 짐승이 아니라 배고픈 아이다'를 처음 말한 사람. 무뚝뚝하고 배고프고 웃기는 반말 목소리 〈서리 낀 목소리〉. 어떻게 사라졌는지는 알려지지 않았다
source: docs/world/CHARACTERS.md H-02 (색인) + docs/systems/15_INNER_VOICES.md §3.2 (목소리 정본) + HOUSES §4.8
life:
  - {year: "SK ~2,330", age: 0, event: "북쪽 서리 땅의 인간 노예 집안에서 막내로 태어남. 거인 전쟁이 이미 스무 해째였고, 요툰과 그롬 양쪽이 인간 노예를 방패로 소모하던 때다. 모국어는 서리말"}
  - {year: "SK ~2,350", age: 20, event: "요툰 군대의 방패줄에 처음 세워진 새벽 — 그의 회귀점. 같은 추위, 같은 줄, 같은 동료들. 그는 줄에서 가장 어렸다"}
  - {year: "SK ~2,350~2,360", age: 21, event: "죽을 때마다 같은 새벽의 같은 줄로 돌아옴. 줄의 동료들은 그 새벽마다 다시 살아 있었고 다시 죽었다. 이 반복이 무엇인지 몰랐으나 가장 덤덤하게 받아들였다"}
  - {year: "SK ~2,355", age: 25, event: "굶주린 거인과 마주친 날 말을 걸어 봄. 거인이 방패를 내리고 입을 보았고 서리말로 배고프다고 했다. 빵 한 덩이를 던졌다 — 그 다음에 일어난 일은 매번 달랐다. 이 일에서 '거인은 배고픈 짐승이 아니라 배고픈 아이다'라는 말이 나왔다"}
  - {year: "SK ~2,358", age: 28, event: "같은 새벽, 같은 줄이 몇 번 죽었는지 세기 시작함. 숫자가 무거워진다는 것을 알고 세기를 멈춤"}
  - {year: "SK ~2,364", age: 34, event: "전쟁터에서 사라짐. 회귀를 스스로 멈췄다는 이야기가 전해진다. 어떻게 사라졌는지는 그 자신도 매번 다르게 기억한다 — 눈이 왔고, 그만 돌아가도 되겠다 싶었다는 것만 같다"}
  - {year: "SK ~3,400", age: null, event: "서리손 집안이 그의 말을 대대로 전함. 요툰 전승에는 '방패 노예가 거인에게 말을 걸었다'는 노래가 남음. 무녀 요룬이 그 노래를 안다"}
appearance:
  - "서리를 뒤집어쓴 눈썹과 갈라진 입술 — 방패줄에 선 새벽의 모습이다"
  - "왼팔에 방패끈 자국이 깊게 패어 있다. 손목에 매듭 두 개를 묶었다"
  - "다 닳은 가죽 장갑 속 손가락 끝이 검다 — 동상으로 두 마디를 잃었다"
smell: "눈 녹은 가죽, 젖은 양털, 마른 빵 부스러기"
voice_sound: "낮고 쉰 반말. 마디가 짧고 말끝이 툭 떨어진다. 뒤에서 아주 희미하게 *버텨. 버텨.* 하는 메아리가 겹친다"
personality:
  disposition: {용기: 30, 자비: 30, 정직: 40, 신앙: -10, 탐욕: -20, 충성: 70}
  temperament: [무뚝뚝, 굶주림, 덤덤한 유머]
  habits:
    - "발가락과 사람 수를 센다 — 지금 몇이 남았는지가 인사다"
    - "먼저 먹을 것을 챙기고 나서 말한다. 먹는 중에는 말을 시키지 않는다"
    - "말하다 말고 뒤를 본다 — 뒤에 줄이 섰는지 확인한다"
  values: "오래 서 있기. 뒤에 있는 놈들을 살려라. 영웅담은 먹을 수 없다"
  fears: [줄 끝에 있던 이름 모를 놈이 또 버려지는 것, 몇 번째인지 세어 무거워지는 것, 앞줄에서 들려오는 돌격 구호]
  desires:
    short: "오늘 뒤에 선 놈들이 몇 남았는지 세어 보는 것"
    long: "더는 돌아오지 않아도 되는 날 — 눈이 와서 그만 돌아가도 되겠다고 생각하는 것"
voice:
  register:
    to_superior: "거인이나 군관에게도 반말이 새어 나온다. 눈은 내리지만 말투는 낮추지 않는다"
    to_equal: "반말. 먹고 있느냐, 몇이 남았느냐가 전부다"
    to_inferior: "뒤에 선 놈들에게는 반말이 조금 길어진다. 먹는 것부터 시킨다"
    to_player_default: "짧은 반말. 주인공을 '너'나 '막내'라 부른다. 같은 줄에 선 사람으로 본다"
  tics: ["'먹어.'", "'몇이 남았어?'", "말끝의 '…버텨.' (뒤에서 흐린 메아리 *버텨. 버텨.*)"]
  use: [먹다, 줄, 추위, 발가락, 빵, 버티다, 몇, 남다, 막내, 배고픈 아이]
  avoid: [존댓말, 영웅, 승리, 용기(영웅담 경멸), 돌격, 이기다(긍정으로는 쓰지 않는다)]
  length: "짧다. 한 마디에 하나씩. 거인과 사라진 날 이야기에서만 두 문장이 이어진다"
  samples:
    - {situation: 첫 등장, line: "눈이 와. 발가락 세어 봐. 다 있어? …버텨."}
    - {situation: 굶주림, line: "먹어. 썩었어도 먹어. 썩은 건 배가 아프고, 안 먹은 건 죽어."}
    - {situation: 공포 앞에서, line: "다리가 떨리는 건 괜찮아. 떨리는 다리로 서 있으면 돼. 해볼 만해."}
    - {situation: 방어, line: "반반이야. 저놈은 팔로 휘둘러. 팔로 휘두르는 놈은 세 번째에 지쳐."}
    - {situation: 돌격을 권하는 목소리에, line: "앞줄은 아침에 스물이었어. 점심엔 셋. 다음 아침에 또 스물. 뛰지 마."}
    - {situation: 누군가를 버려야 할 때, line: "줄 끝에 있던 놈 이름 알아? 나도 몰라. 그래서 그놈이 늘 버려졌어. 매번."}
    - {situation: 시그리드가 머릿수를 셀 때, line: "저 여자, 나랑 같은 짓을 해. 아침마다 세. 세는 놈이 대장이야."}
    - {situation: 서리말 장면, line: "(서리말) 말을 빌려줄게. 세 마디만. 길게 하면 늙은 말투가 들켜."}
    - {situation: 거인을 볼 때, line: "저 눈 봐. 배고픈 애 눈이야. 배고픈 애한테는 칼보다 빵이 무서워."}
    - {situation: 군나르를 볼 때, line: "아흔아홉 번? 우린 한 번도 이기려고 서 있지 않았어. 오래 서 있으려고 서 있었지."}
    - {situation: 회귀 직후, line: "또 저녁이네. 줄 서. 빵부터 받아. 생각은 먹고 해."}
    - {situation: 같은 사람을 또 구할 때, line: "그놈 또 살리네. 몇 번째야? …세지 마. 세면 무거워져."}
    - {situation: 지난 회차의 나가 커질 때, line: "너 몇이 남았어? 네 뒤에 선 놈들 말고, 너."}
    - {situation: 자기가 사라진 날을 물을 때, line: "사라졌다고들 하지. …눈이 왔어. 그만 돌아가도 되겠다 싶었어. 나머진 몰라. 매번 다르게 기억나."}
    - {situation: 거인에게 말을 건 날, line: "(작게) 걔가 방패를 내리고 내 입을 봤어. 배고프다고 했어, 서리말로. 나는 빵을 던졌어. …그다음은 매번 달라."}
    - {situation: 다라와 다툴 때, line: "네 봉기, 아홉 번 했지? 우린 같은 아침을 몇 번 버텼는지 몰라."}
    - {situation: 줄의 아이가 죽을 때, line: "(말이 없다. 뒤에서 흐리게) *…셋. 둘.*"}
    - {situation: 판단이 틀렸을 때, line: "내가 틀렸네. 줄이 아직 서 있어. 다행이다. 먹어."}
    - {situation: 회차 끝, line: "오래 서 있었네. 그거면 됐어. 다음 저녁에 보자, 막내."}
