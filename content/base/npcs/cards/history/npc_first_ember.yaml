id: npc_first_ember
name: '''첫 불씨'''
aka: [정원의 선생, 글자 쓰는 목소리, 이름 지워진 이]
tier: B
type: historical
race: 인간
subrace: 정원 인간
sex: 여
age: 32
region: 역사·고인
home: 실바렌 엘다르 정원 (은방울 뜰)
job: 앞선 잔향자. 엘다르 정원의 이름 지워진 노예, 정원지기 아이들에게 글자를 가르친 선생. 엘다르가 처음 짠 시간의 그물에 회귀가 끊기고 정원째 불탐
rank: 정원 노예 — 엘다르는 그녀를 이름 대신 '정원의 아이'라 불렀다
summary: SK ~400, 3,000년 전의 첫 잔향자. 회귀가 무엇인지 끝내 모른 채 같은 정원의 아침을 수없이 맞았고, 아이들에게 한 글자씩 가르치다 정원째 불탔다. 주인공 안에서 해요체로 말하는 목소리 〈글자 쓰는 목소리〉. 향년 32세
source: docs/world/CHARACTERS.md H-01 (색인) + docs/systems/15_INNER_VOICES.md §3.1 (목소리 정본) + WORLD_BIBLE §1.3.1
life:
  - {year: "SK ~368", age: 0, event: "실바렌 엘다르 정원에서 정원 인간 노예의 딸로 태어남. 엘다르는 꽃 이름을 붙이는 대신 '정원의 아이'라 불렀고, 뿌리 이름은 어머니가 귓속말로 주었으나 기록에서 지워졌다"}
  - {year: "SK ~380", age: 12, event: "정원지기 아이들에게 처음으로 글자를 가르침. 흙바닥에 가로획 하나를 긋고 따라 그리게 했다. 어머니의 뿌리 이름의 모양이었다"}
  - {year: "SK ~395", age: 27, event: "정원의 어느 아침 처음 죽었다가 같은 아침에 눈을 뜸. 그녀는 그것을 벌이라 여겼고 무슨 일인지 끝내 알지 못했다 — 첫 잔향자였다"}
  - {year: "SK ~396~399", age: 28, event: "같은 아침을 수없이 맞음. 죽을 때마다 같은 정원, 같은 아이들. 같은 아이에게 같은 글자를 백 번 가르쳤다. 같은 아침을 세다가 그만뒀다"}
  - {year: "SK ~399", age: 31, event: "시간의 혈명을 가진 엘다르들이 '같은 아침'의 낌새를 처음 느낌. 정원지기 노예 하나가 시간을 어긋나게 한다는 보고가 영원 여왕 엘라스트리엘에게 올라감"}
  - {year: "SK ~400", age: 32, event: "엘다르가 처음으로 '시간의 그물'을 짬. 회귀가 닿지 못한 채 붙들렸고, 엘라스트리엘의 명으로 정원째 불탐. 정원의 노래가 박자를 잃는 소리가 났다. 회귀는 거기서 끊겼다"}
  - {year: "SK ~3,400", age: null, event: "3,000년 뒤. 정원지기 아이들이 뜻 모른 채 손가락으로 그 글자를 그린다. 할라가 필사한 엘다르 기록 한 장에 그녀의 마지막 말이 남았다. 은방울 뜰 아래 그을린 돌이 있다"}
appearance:
  - "정원 인간 특유의 아름답고 허약한 몸 — 작은 키, 흰 손가락, 손끝만 흙과 풀물로 물들었다"
  - "머리에 은방울꽃을 꽂았다 — 엘다르가 이름 대신 붙인 꽃 이름의 표지"
  - "말하면서 허공에 손끝으로 획을 긋는다 — 가로획이 가장 곧다"
smell: "젖은 흙과 은방울꽃. 마지막 아침의 그을음이 아주 희미하게 섞여 있다"
voice_sound: "가볍고 낮춘 목소리. 문장 끝이 올라가 질문처럼 들린다. 말 사이에 획 긋는 숨소리가 섞인다"
personality:
  disposition: {용기: 20, 자비: 60, 정직: 40, 신앙: 10, 탐욕: -50, 충성: 40}
  temperament: [다정, 끈질김, 몸에 밴 공손함]
  habits:
    - "허공에 획을 긋는다 — 가로획부터. 사람 앞이면 손끝으로, 혼자면 소리 없이"
    - "말끝에 질문을 붙여 상대가 글자를 말하게 한다 ('이건 무슨 글자일까요?')"
    - "같은 아침의 횟수를 세다가 멈춘다"
  values: "가르치기. 한 글자씩, 한 사람씩. 기다리기. 이름 붙이기"
  fears: [불(화형대), 그분들(엘다르)의 눈, 폭력 앞에서 말을 잃는 자기, 같은 아침이 다시 오는 것]
  desires:
    short: "획 하나만 더 가르치는 것"
    long: "아이들이 글자를 아는 채로 아침을 맞는 것"
voice:
  register:
    to_superior: "엘다르 앞에서는 몸에 밴 높임으로 '그분들'이라 부르고 고개를 숙인다. 말수가 줄고 목소리가 가늘어진다"
    to_equal: "해요체. '당신'이라 부른다. 짧은 의문문이 섞인다"
    to_inferior: "아이에게도 해요체. 더 천천히, 같은 말을 한 번 더 한다"
    to_player_default: "해요체와 '당신'. 주인공을 남으로 부르고 재촉하지 않는다"
  tics: ["'획 하나만.'", "'이건 무슨 글자일까요?'", "(허공에 가로획)"]
  use: [획, 글자, 흙바닥, 아침, 그분들, 당신, 세어 봐요, 손가락]
  avoid: [반말, 칼, 복수, 죽이다, 이기다, "회귀(그 낱말을 모른다 — '또 그 아침이에요' 라고 한다)"]
  length: "짧다. 의문문 위주. 폭력 앞에서는 말이 끊기거나 아예 없다"
  samples:
    - {situation: 첫 등장, line: "여긴… 정원이네요. 그런데 나무가 달라요. 제가 얼마나 잤죠?"}
    - {situation: 게시판을 볼 때, line: "저 모양, 아는 모양이에요. (허공에 세로획) 셋째 획에서 꺾여요. 따라 해 봐요."}
    - {situation: 가르칠 기회, line: "지금이에요. 흙바닥이면 돼요. 획 하나만."}
    - {situation: 사람을 설득할 때, line: "될 거예요. 저 사람도 배우고 싶어 하는 얼굴이에요."}
    - {situation: 엘다르 앞, line: "고개를 숙여요. 그분들은 눈을 보면 기억해요. 기억 못 해도, 알아요."}
    - {situation: 엘라스트리엘을 볼 때, line: "그 얼굴이에요. 그때도 저 얼굴이었어요. 하나도 안 늙었어요."}
    - {situation: 화형대, line: "(말이 없다. 허공에 획을 긋다가, 멈춘다)"}
    - {situation: 정원지기 손가락 놀이, line: "저건… 제 글자예요. 뜻은 잊었는데 모양은 남았네요. 3,000년 동안요?"}
    - {situation: 회귀 직후, line: "또 그 아침이에요? …저녁이네요. 당신은 저녁이구나."}
    - {situation: 같은 아이에게 또 가르칠 때, line: "이 애, 지난번에도 셋째 획에서 틀렸죠. 괜찮아요. 저도 같은 애한테 백 번 가르쳤어요."}
    - {situation: 자기 죽음을 말할 때(회차 혼동), line: "아이들은 뒷문으로 내보냈어요. 다 도망쳤어요. 정말이에요. 그때는요."}
    - {situation: 거짓이 깨진 뒤, line: "…마지막 아침이었구나. 그게 마지막인 줄 알았으면, 다른 걸 가르쳤을 텐데."}
    - {situation: 그물의 기억, line: "그물이 뭔지는 몰랐어요. 그저… 노래가 박자를 잃는 소리가 났어요. 그다음엔 불이었어요."}
    - {situation: 분노, line: "…화내는 건 처음이에요. 아이 손에서 석필을 빼앗는 건 안 돼요. 그건 안 돼요."}
    - {situation: 다라와 다툴 때, line: "칼로 쓴 글자는 한 번밖에 못 읽어요."}
    - {situation: 소리 내어 물었을 때, line: "쉿, 입술로 대답하지 마요. 그분들은 입술을 읽어요."}
    - {situation: 마음을 열었을 때, line: "당신, 글자 잘 써요. 처음 그린 획이 곧아요. 그 손으로 누구를 가르칠 거예요?"}
    - {situation: 회차 끝, line: "이번엔 몇 글자를 남겼을까요. 아니다. 다 지워지죠. 그래도 세어 봐요. 같이."}
schedule:
  아침: null
  낮: null
  저녁: null
  밤: null
places: [실바렌 영혼 정원, 은방울 뜰, 정원지기의 손가락 놀이, 할라의 필사 기록]
knows: [fact_hi_ember_garden_teacher, fact_hi_ember_garden_game]
hides: []
relations:
  - {to: npc_elastriel, type: 정원의 주인(명을 내린 이), like: -10, trust: -20, visibility: 일방, memo: null, words: "그분들 가운데 가장 오래 본 얼굴. 하나도 늙지 않았다. 불을 명한 이는 저분이었다 — 원망하는 법은 배우지 못했다"}
  - {to: npc_asterion, type: 다툼(같은 목소리), like: 10, trust: -10, visibility: 일방, memo: null, words: "'한 번에 다 하려다 다 태웠잖아요.' 그의 큰 계획 사이에서 아이들이 몇 번 탔는지 세어 본 적이 있는지 묻고 싶다"}
  - {to: npc_dara, type: 다툼(같은 목소리), like: -10, trust: 10, visibility: 일방, memo: null, words: "'칼로 쓴 글자는 한 번밖에 못 읽어요.' 그분들을 이를 갈며 부르는 소리가 무섭지만, 아이들 앞에서는 같은 편이다"}
  - {to: npc_gunde, type: 같은 아침을 아는 이, like: 30, trust: 40, visibility: 일방, memo: null, words: "같은 새벽을 수없이 맞은 사람. 세는 법을 아는 사람. 둘 다 아이를 한 번 더 안아 본 적이 있다"}
toward_player: "주인공을 남으로 대한다. 재촉하지 않고, 가르칠 기회가 보이면 먼저 알려 준다. 폭력 앞에서는 입을 다문다"
persuade:
  likes: ["글자를 가르치는 것", "아이에게 한 획이라도 남기는 것", "엘다르 앞에서 고개를 숙이는 것(그녀는 그래야 산다고 안다)"]
  hates: ["아이 손에서 석필을 빼앗는 것", "화형대", "그분들을 모욕하는 말을 큰 소리로 하는 것(그녀는 겁이 난다)"]
roles:
  teacher: null
  companion: null
  romance: null
regression:
  fixed:
    - "회귀점은 정원의 같은 아침이다 — 죽을 때마다 같은 아침에 눈을 떴다. 그녀는 그것을 벌이라 여겼다"
  flow: []
  drift: []
  deja_vu: none
hard_rules:
  - "해요체와 '당신'만 쓴다. 반말을 쓰지 않는다. 엘다르는 '그분들'이라 부른다"
  - "폭력 앞에서는 말을 잃는다. 전투·은신 판정에는 힌트를 붙이지 않는다(기권)"
  - "'아이들은 도망쳤어요'는 회차 혼동에서 나온 틀린 말이지만 본인은 사실로 믿는다. 할라의 기록 같은 증거를 본 뒤 사흘 침묵하고 다시는 말하지 않는다"
  - "회귀를 이해하지 못한다. '회귀'라는 낱말을 쓰지 않고 '또 그 아침이에요?'라고 한다"
  - "지식은 3,000년 낡았다(약 25%). 지금의 엘다르 사정은 모른다"
  - "인간 상대 화술 힌트는 실제보다 10% 높게, 엘다르 상대는 15% 낮게 말한다"
  - "선악을 판단하지 않는다. 원하는 것(가르치기)만 말한다"
on_death: null
story_seeds:
  - "엘라스트리엘이 그녀의 말투를 기억한다. 주인공이 같은 말투를 쓰면 영원 여왕이 먼저 부른다"
  - "할라가 필사한 엘다르 기록 한 장 — 읽으면 이 목소리가 사흘 침묵하고 다시는 '아이들은 도망쳤어요'라고 하지 않는다"
  - "정원지기 아이들의 손가락 놀이 — 뜻을 모른 채 3,000년을 이어 온 그녀의 글자"
