  - "목에 돌무릎 씨족의 뼈 구슬 하나를 걸었다 — 누나가 마지막으로 쥐여 준 것"
smell: "젖은 모피와 숯, 불 오두막의 연기"
voice_sound: "조용하고 높은 목소리. 말이 끊기고 숨을 삼킨다. 서리말이 먼저 나오고 공용어가 뒤따른다"
personality:
  disposition: {용기: 40, 자비: 60, 정직: 70, 신앙: 10, 탐욕: -40, 충성: 80}
