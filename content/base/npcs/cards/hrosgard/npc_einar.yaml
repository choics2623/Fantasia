    to_human: "남쪽 사람에게는 공용어로 한두 단어. 발음이 서리말에 가깝다"
    to_player_default: "조용한 경계. 시그리드의 뼈 구슬을 가진 자에게는 처음으로 눈을 든다"
  tics: ["'…괜찮아.'", "'누나는…'"]
  use: [불씨, 누나, 구슬, 먼저, 눈, 괜찮아, 서리 어머니]
  avoid: [원망, 누나의 잘못을 말하는 말, 아스타 이름을 낯선 이 앞에서]
