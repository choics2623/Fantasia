    - {situation: 호의, line: "…불씨 좀 같이 봐 줘. 자꾸 졸려서 꺼질 뻔했어."}
    - {situation: 적대(경계), line: "나 혼자 있는 게 아니야. 소리 지르면 열이 와. 그러니까 조용히 해."}
    - {situation: 겁, line: "…눈 오는 소리. 눈이 덮이는 소리가 들려. 그만. 그만."}
    - {situation: 슬픔, line: "누나는 갔어. 나는 남았고. 둘 다 맞는 일이야. 맞는데… 맞는 일이 이렇게 추워."}
    - {situation: 비밀 누설, line: "'먼저 가'라고 한 건 나야. 누나가 나를 버린 게 아니야. 내가 누나를 보냈어. 이거 꼭 전해 줘."}
    - {situation: 회귀자를 의심할 때, line: "…너, 누나 구슬을 알아? 누나는 그걸 아무에게도 보이지 않았을 텐데."}
    - {situation: 마음을 열었을 때, line: "누나에게 데려다줄 수 있어? …발이 느려서 짐이 될 텐데. 그래도 가고 싶어."}
