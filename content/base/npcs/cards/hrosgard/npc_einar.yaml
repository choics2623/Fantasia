life:
  - {year: 293, age: 0, event: "돌무릎 노예 움막에서 태어남. 누나 시그리드가 열네 살 때 갓난아기를 업어 키움"}
  - {year: 301, age: 8, event: "첫 불 오두막 일. 서리말 노래 「서리 어머니의 자장가」를 누나에게서 배움"}
  - {year: 309, age: 16, event: "시그리드와 서리 길로 탈주. 울음 고개 근처에서 오른발이 얼어 걷지 못하게 됨. 스스로 '먼저 가'라고 말하고 눈 속에 남음"}
  - {year: 310, age: 17, event: "거인 순찰에 발견되어 돌무릎 골짜기로 끌려옴. 발가락 셋을 잃음. 바우그가 죽은 것으로 장부를 정리하려던 것을 아스타가 숨겨 살림"}
  - {year: 311, age: 18, event: "아스타가 왕의 칙령으로 호송을 보내기 시작. 그는 호송에 못 끼고 움막에서 불 오두막 불씨 관리를 맡음"}
  - {year: 312, age: 19, event: "늦여름. 시그리드가 살아 있는지 모른 채 매일 남쪽을 보고 뼈 구슬을 만진다"}
appearance:
