  - 자기가 불의 바람을 안다는 것이 한 번이라도 입 밖에 나오는 것
  desires:
    short: 겨울이 오기 전에 불 오두막 곁에서 아이 서른을 먹이는 것
    long: 군데의 말을 전당 안에서 한 번이라도 큰 소리로 말해 보는 것
voice:
  register:
    to_superior: 요툰에게는 낮은 서리말 존대
    to_equal: 노예에게는 쉰 반말
    to_inferior: 아이에게는 부드러운 반말
    to_player_default: 인간에게는 반말. 손부터 본다
  tics:
  - '''손부터 보여.'''
  - '''불이 안다.'''
  use:
