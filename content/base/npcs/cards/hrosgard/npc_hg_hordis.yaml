  - 열두
  - 탈주
  length: 짧고 따뜻하다
  samples:
  - situation: 첫 만남
    line: 손부터 보여. 언 손은 불을 겁낸다. 겁내지 마. 여기서는 불이 먼저 너를 안아.
  - situation: 호의
    line: 죽 한 숟갈이다. 한 숟갈이 열 숟갈이 되는 건 네 마음이야.
  - situation: 거절
    line: 그건 말하지 않아. 불은 많은 것을 알아. 불이 아는 건 불만 말해.
  - situation: 슬픔
    line: 거인은 배고픈 짐승이 아니라 배고픈 아이라고 했다. 아이가 3년째 굶는데 짐승이 되지 않은 게 이상한 거야.
  - situation: 위기
    line: 문을 닫아! 바람이 곡창 쪽이다! 불씨는 안으로 넣어라 — 불이 길을 안다!
  - situation: 비밀 누설
    line: 열두 섬이었어. 쪽문으로 왔어. 왕비가 보냈고 곡창지기가 내렸고 나는 아이들 입에 넣었어.
  - situation: 거래
    line: 불 곁에 앉아 있게 해 줄게. 대신 네 이름을 한 번 불러 줘. 불이 기억하니까.
  - situation: 분노
    line: 불 오두막에 칼을 들고 오지 마. 불은 칼보다 오래 산다.
