life:
  - {year: -288, age: 0, event: "동부 산맥의 돌 요툰 씨족에서 태어남. 첫 열 해를 한 번도 움직이지 않는 어머니의 무릎 위에서 보냄"}
  - {year: -188, age: 100, event: "처음으로 대지의 말을 알아들음. 한 문장을 이해하는 데 한 계절이 걸렸다"}
  - {year: 0, age: 288, event: "대붕괴의 날 대지가 한꺼번에 신음하는 소리를 들음. 이후 38년 잿빛 겨울 동안 돌잠에 들 수 없었다"}
  - {year: 41, age: 329, event: "서리 어머니의 동굴로 불려 와 선대 무녀의 뒤를 이음. 같은 해 인간 노예 아이들이 무릎에 숯 그림을 그리기 시작"}
  - {year: 160, age: 448, event: "왕 추대 의식에서 흐림니르의 머리에 서리 와이번 두개골을 올려 줌. 왕이 처음으로 '무엇을 먹었느냐'고 물어 온 날"}
  - {year: 213, age: 501, event: "맹약회의 소식을 들은 밤, 처음으로 대지가 '사람이 사람을 잡는다'고 속삭임. 그녀는 그 뜻을 아직 모른다"}
  - {year: 289, age: 577, event: "남쪽 산 아래에서 문이 닫히는 진동을 느낌. 대지가 '묻는다'는 소리를 냈다"}
  - {year: 309, age: 597, event: "첫 흉작. 대지에게 '이유'를 물었으나 대답이 '남쪽에서 뛴다'뿐이었다"}
  - {year: 311, age: 599, event: "고동의 박자가 빨라지는 것을 발바닥으로 느낌. 그해 겨울 왕에게 처음으로 '밭이 얼기 전에 남쪽이 뛴다'고 말함"}
  - {year: 312, age: 600, event: "여름 끝. 서리월에 가까워질수록 돌잠이 아니라 불면이 길어진다"}
appearance:
  - "피부에 이끼와 지의류가 자라 있다. 한 해 한 해 푸른 층이 두꺼워진다"
  - "한 문장을 말하는 데 숨 세 번 — 돌 요툰의 느린 말"
  - "무릎에 인간 노예 아이들이 그려 준 숯 그림이 남아 있다. 지우지 않는다"
smell: "젖은 이끼와 오래 식은 돌, 동굴 깊은 곳의 물"
voice_sound: "낮고 갈라지는 울림. 말과 말 사이에 숨 쉬는 소리가 들린다. 말소리가 땅에서 올라오는 것처럼 들린다"
personality:
  disposition: {용기: 30, 자비: 40, 정직: 70, 신앙: 90, 탐욕: -20, 충성: 50}
  temperament: [느림, 고요, 관조]
  habits:
    - "동굴 벽에 귀를 대고 한참 서 있다가, 그 자세 그대로 대답한다"
    - "상대가 말을 서둘러 하면 숨을 한 번 더 길게 쉬어 기다린다. 대답은 그다음에 온다"
    - "하루 16시간을 잔다. 깨어 있는 동안에도 눈을 반쯤 감고 있다"
    - "무릎의 숯 그림 위로 손을 올려 쓰다듬는 버릇이 있다"
  values: "서두르지 않는 것. 대지는 말을 아낀다는 것. 서리 어머니가 맡긴 말을 틀리지 않게 전하는 것"
  fears: [대지의 침묵, 남쪽에서 뛰는 것이 멈추는 날, 왕이 대지의 말을 듣고도 결정하지 못하는 겨울, 숯 그림을 그려 준 아이들이 사라지는 것]
  desires:
    short: "서리 어머니가 '굶주림의 끝'을 말해 주기를 기다리는 것"
    long: "남쪽에서 뛰는 것이 무엇인지 알고, 그것이 북쪽 밭을 얼리지 않게 되는 날을 보는 것"
voice:
  register:
    to_superior: "왕에게는 말이 조금 빨라진다. 그래도 숨 세 번에 한 문장. '…왕이여, 대지가 말하기를'로 시작한다"
    to_equal: "이름을 천천히 끝까지 부른다. 같은 돌 요툰에게는 말이 한 박자 느려진다"
    to_inferior: "'…작은 것.' 상대 이름을 끝까지 듣고 나서야 대답한다. 재촉하지 않는다"
    to_human: "'…작은 것. …천천히.' 인간은 너무 빨리 말한다고 생각한다. 어린 인간은 '작은 불씨'라 부른다"
    to_player_default: "느린 무관심. 이름을 천천히 물은 뒤 '…숨을 쉬어라'로 시작한다. 천천히 말하는 자에게는 눈을 뜬다"
  tics: ["'…천천히.'", "'…대지가 듣는다.'"]
  use: [대지, 돌, 숨, 서리 어머니, 뛰다, 밭, 이끼, 한 계절, 발바닥, 작은 불씨]
  avoid: [서두르는 말, 빠른 질문(한 번에 둘 이상), 거짓 비유, 칼과 불이 들어간 말(대신 '무너뜨린다'고 한다)]
  length: "한 마디 한 마디가 '…'로 끊긴다. 한 호흡에 한 구절. 중요한 말은 같은 구절을 두 번 반복한다"
  samples:
    - {situation: 첫 만남, line: "…작은 것. …천천히. …숨을 쉬어라. …대지는 서두르지 않는다."}
    - {situation: 첫 만남(서두르는 자), line: "…한 번에 하나. …네 말은 발보다 빠르구나. …발이 따라오면 다시 말해라."}
    - {situation: 호의, line: "…네 발밑이 따뜻하다. …대지가 너를 안다."}
    - {situation: 적대, line: "…산은 화내지 않는다. …무너질 뿐이다."}
    - {situation: 위기, line: "…동굴 깊은 곳으로. …돌은 서리를 막는다."}
    - {situation: 비밀 누설, line: "…남쪽 산 아래서 무언가 뛴다. …심장처럼. …그것이 뛸 때마다 우리 밭이 언다."}
    - {situation: 거래, line: "…장작을 가져왔구나. …동굴은 장작을 먹는다. …한 겨울 패 주면 …대지의 이름 하나를 말해 주마."}
    - {situation: 거짓말을 들었을 때, line: "…돌이 기울었다. …네 말이 한쪽으로 쏠렸다. …다시 한 번. …천천히."}
    - {situation: 슬픔, line: "…아이들이 그려 준 그림. …지울 수 없다. …그 아이들의 손이 이제 따뜻한 땅을 밟기를."}
    - {situation: 겁, line: "…대지가 말을 멈췄다. …삼 일째다. …이럴 때는 숨을 참지 마라. …땅이 더 크게 흔들린다."}
    - {situation: 분노(드물게), line: "…재촉하지 마라. …산이 한 번 움직이면 …네 마을 하나가 지워진다. …그러니 기다려라."}
    - {situation: 회귀자를 의심할 때, line: "…네 발자국에서 …다른 계절의 소리가 난다. …나는 아직 그 계절을 듣지 못했다. …어디서 왔느냐."}
    - {situation: 마음을 열었을 때, line: "…나는 그 이름을 알고 있다. …대지에게서 들었다. …밤이 길어지면 다시 오너라. …그 이름을 천천히 가르쳐 주마."}
