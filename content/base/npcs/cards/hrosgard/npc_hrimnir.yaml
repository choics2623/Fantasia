id: npc_hrimnir
name: 서리왕 흐림니르
aka: [굶주린 왕, 빈 곡창의 왕]
tier: S
type: living
race: 요툰
subrace: 서리 요툰
sex: 남
age: 580
region: 흐로스가르드
home: 얼음턱 전당 (빙하를 깎은 거인 전당, 문 높이 20m)
job: 서리왕 — 씨족장 회의 '얼음 탁자'가 추대한 요툰의 왕
rank: 흐림 씨족(왕가) 가장. 서리땅 전체의 왕
summary: 왕이 먼저 굶는 법을 지키다 갈비뼈가 드러난 왕. 먹일 수 없는 노예를 몰래 문 열어 내보낸 사람이며, 남침과 협상 사이에서 아직 결정하지 못했다
source: docs/world/CHARACTERS.md:1786
life:
  - {year: -268, age: 0, event: "서리 씨족 흐림 가문에서 얼음 호수 위에 태어남. 신을 붙잡은 팔 '흐림 대주먹'의 후손"}
  - {year: -208, age: 60, event: "성체가 되어 첫 얼음 판결에 나가 자기보다 무거운 사촌을 이김. 굶주림이 덕목이라는 말을 이때 배움"}
  - {year: 0, age: 268, event: "대붕괴의 해. 남쪽 하늘이 재로 어두워지는 것을 망루에서 봄. 이후 38년 잿빛 겨울"}
  - {year: 12, age: 280, event: "잿빛 겨울 12년째 씨족의 '덜어냄'에서 어머니가 스스로 얼음 들판으로 걸어 나감. 그가 마지막으로 배웅"}
  - {year: 38, age: 306, event: "잿빛 겨울이 끝남. 서리 요툰 인구의 3분의 1이 사라짐. 그때 노예가 먼저 덜어졌고 그는 막지 못했다"}
  - {year: 122, age: 390, event: "왕비 스칼라와의 사이에서 아들 스카디르가 태어남"}
  - {year: 160, age: 428, event: "얼음 탁자가 서리왕으로 추대. 왕관 대신 서리 와이번의 두개골을 쓰기 시작함"}
  - {year: 213, age: 481, event: "맹약회의에서 서리땅 대표로 '잔향 사냥' 의무에 서명. 서리 길 너머의 인간 아이들 일이라 여겨 깊이 묻지 않았다. 지금도 그 서명을 가끔 떠올린다"}
  - {year: 309, age: 577, event: "첫 흉작. 왕실 곡창을 열 번 열어 열 번 비어 있음을 확인. 배급을 줄이고 자신이 가장 적게 먹기 시작"}
  - {year: 311, age: 579, event: "셋째 흉작. 한밤에 인간 노예 장로 아스타를 불러 비밀 칙령을 내림 — 먹일 수 없는 노예에게 서리 길의 문을 열어 줄 것"}
  - {year: 312, age: 580, event: "여름 끝. 곡창 바닥에 마지막 보리 300섬만 남음. 스카디르가 남침을 공공연히 요구하고 씨족장 회의가 갈라짐"}
appearance:
  - "키 9m. 수염에 1년 내내 고드름이 매달려 있다"
  - "갈비뼈가 가죽 위로 드러날 만큼 말랐다 — 왕이 먼저 굶는 것이 요툰의 법"
  - "왕관 대신 서리 와이번의 두개골을 쓰고 있다 — 이마 위에서 빈 눈구멍이 앞을 본다"
smell: "얼음 밑 물과 마른 뼈, 곡식이 사라진 곡창의 서늘한 먼지"
voice_sound: "낮고 느린 울림. 한 줄이 끝나기 전에 바닥이 먼저 울린다. 숨 쉬는 간격이 길다"
personality:
  disposition: {용기: 50, 자비: 10, 정직: 50, 신앙: 70, 탐욕: 40, 충성: 60}
  temperament: [과묵, 굶주림, 무거운 고뇌]
  habits:
    - "말하기 전에 오래 숨을 쉰다. 상대가 중간에 말을 이으면 끝까지 듣고 처음부터 다시 대답한다"
    - "식탁에서 가장 마지막에 먹고 가장 적게 먹는다. 남은 것은 손가락으로 쓸어 곡창 쪽으로 밀어 놓는다"
    - "밤마다 망루에서 남쪽을 보며 손가락을 꼽아 남은 겨울 수를 센다"
    - "음식 버리는 소리가 나면 고개가 먼저 돌아간다"
  values: "백성이 먼저 먹고 왕이 나중에 먹는 것. 서리 어머니 앞에서 부끄럽지 않은 것. 한 번 나눈 식탁을 깨지 않는 것"
  fears: [빈 곡창, 서리 어머니의 침묵, 아들이 왕관을 얻는 겨울, 백성이 서로를 먹다 오우거가 되는 날]
  desires:
    short: "이번 겨울 아사자를 가장 적게 내는 것 — 남침이냐 협상이냐를 서리월 전에 정하는 것"
    long: "굶주림이 끝난 서리땅. 남침이든 곡물 교역이든, 백성이 봄을 보는 것"
voice:
  register:
    to_superior: "서리 어머니 앞에서만 낮아진다. 말수가 줄고 '어머니'라고 부른다. 그 밖에 윗사람은 없다"
    to_equal: "이름을 줄이지 않고 길게 부른다. 상대를 '손님'이라 칭하고, 한 줄 말하고 오래 기다린다. 존칭은 쓰지 않지만 무시도 하지 않는다"
    to_inferior: "단정문. 질문하지 않고 '…하라'로 끝낸다. 굶은 백성에게는 말이 더 짧고 낮아진다"
    to_human: "'작은 것'이라 부른다. 하라체 하대, 천천히. 때리거나 모욕하는 말은 쓰지 않는다 — 무관심할 뿐이다"
    to_player_default: "하라체 하대. 첫 마디는 관찰이다('작구나', '말랐구나'). 먹을 것을 가진 자에게만 말이 길어진다"
  tics: ["'…먹었느냐.'", "'서리 어머니가 본다.'"]
  use: [굶주림, 곡창, 겨울, 백성, 식탁, 덜어내다, 서리 어머니, 작은 것, 손님, 봄]
  avoid: [탈주(칙령은 '문을 열었다'고 한다), 용서, 희망(그는 '봄'이라 한다), 이름 줄이기(자기 이름도 정식으로 말한다)]
  length: "한 번에 한 줄. 말 사이 '…'가 길다. 화나면 오히려 낮고 짧아진다. 중요한 말은 노래 거인처럼 세 번 되풀이한다"
  samples:
    - {situation: 첫 만남, line: "작구나. 그리고 말랐구나. 너희도 굶는구나."}
    - {situation: 첫 만남(그림자), line: "…가까이 와라. 내 그림자 안에서는 먹지 마라. 법이다."}
    - {situation: 호의, line: "나는 노예를 먹지 않았다. 그것만은 서리 어머니 앞에 말할 수 있다."}
    - {situation: 적대, line: "배고픈 거인은 산사태다. 산사태에게 이유를 묻지 마라."}
    - {situation: 거래, line: "곡식 한 수레라 했느냐. …수레는 작다. 그러나 오늘 내 곡창에는 그 한 수레가 없다. 값을 말해라. 이름을 줄이지 않고."}
    - {situation: 거짓말을 들었을 때, line: "…다시 말해라. 천천히. 서리는 거짓말 위에 오래 얼어붙지 않는다."}
    - {situation: 위기, line: "곡창 문을 열어라— 빈 곡창이라도 열어라! 백성이 봐야 한다!"}
    - {situation: 비밀 누설, line: "탈주가 아니다. 내가 문을 열었다. 먹일 수 없는 자를 붙잡아 두는 것은 왕의 짓이 아니다."}
    - {situation: 분노, line: "…내 아들이 굶주림을 비웃는 소리를 들었다. 그 아이는 아직 한 번도 먼저 굶어 본 적이 없다."}
    - {situation: 슬픔, line: "어머니가 얼음 들판으로 걸어갈 때 나는 이백팔십이었다. 지금 내 백성이 같은 길을 걷는다. 배웅할 사람이 모자란다."}
    - {situation: 겁(무력감), line: "…곡창이 비었다. 열 번을 열어 보았는데 열 번 비어 있다. 왕이 열 번을 열어 봐야 믿는 일이 있다."}
    - {situation: 회귀자를 의심할 때, line: "너에게서 젖은 재 냄새가 난다. 남쪽 황무지에서 불어온 것이냐. 올해 우리 밭에도 그 냄새가 앉았다."}
    - {situation: 마음을 열었을 때, line: "식탁에 앉아라. …나눔 식사를 한다는 뜻이다. 이 고기를 같이 먹으면 한 해는 서로를 베지 않는다. 나는 이 법만은 깬 적이 없다."}
    - {situation: 협상 제안, line: "남쪽의 반쪽짜리 용에게 전할 말이 있다. 곡식과 평화. …길을 아는 작은 것이 필요하다. 서리말을 아느냐."}
schedule:
  아침: "얼음 탁자에서 씨족장 회의 — 굶주림 보고를 듣는다"
  낮: "왕실 곡창 점검 — 비어 있다"
  저녁: "서리 어머니의 동굴로 걸어가 무녀 요룬의 점복을 듣는다"
