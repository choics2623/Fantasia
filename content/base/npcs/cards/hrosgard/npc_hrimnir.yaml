toward_player: "굶주린 눈으로 내려다본다 — 공포 판정 D 55. 작은 것을 짐승이 아니라 또 하나의 굶는 입으로 본다. 먹을 것과 남쪽 소식을 가진 자에게만 말이 길어진다"
