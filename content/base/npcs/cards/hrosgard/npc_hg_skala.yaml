appearance:
- 왕보다 한 뼘 작고 갈비뼈가 드러나지 않을 만큼만 마른 노인 거인, 흰 머리를 아홉 가닥으로 땋아 얼음 빗으로 꽂음
- 왼쪽 손목에 깊은우물 씨족의 눈 모양 문신
