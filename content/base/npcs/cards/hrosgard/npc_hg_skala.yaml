story_seeds:
- 스칼라의 쪽문은 곡창 마지막 보리를 불 오두막으로 흘리는 길이다. 그 길을 쓰면 남침 군량이 줄고 왕은 범인을 찾는다.
- 왕비가 깊은우물의 꿈을 왕의 귀에 닿게 하는 날 협상의 문이 열린다 — 아스타를 통해.
