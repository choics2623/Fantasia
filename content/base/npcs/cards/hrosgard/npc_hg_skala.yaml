  - 열두 섬
  - 탈주
  length: 느리고 짧다. 아이에게는 길어진다
  samples:
  - situation: 첫 만남
    line: (숨을 고른다) 작은 이여. 같은 고기를 먹었는가. 아니라면 한 점 나누고 이야기하자.
  - situation: 호의
    line: 아이들이 네 이름을 불렀다. 아이가 이름을 부르면 나도 부른다.
  - situation: 거절
    line: 그 이야기는 식탁에서 하지 않는다. 식탁에서 할 수 없는 이야기는 쪽문에서도 하지 않는다.
  - situation: 분노
    line: 왕의 그림자 안에서 먹는 자는 왕이 아니라 그림자를 먹는 것이다. 물러서라.
  - situation: 슬픔
    line: 아이들이 줄어든다. 줄어드는 숫자를 세는 것은 요툰의 일이 아니라고 배웠다. 나는 센다.
  - situation: 위기
    line: 쪽문을 열어라! 불 오두막으로 가는 길이다. 아이들 먼저, 그다음이 보리다!
  - situation: 비밀 누설
    line: 열두 섬이다. 곡창지기를 탓하지 마라. 내가 문을 열었고 그가 자루를 내렸다.
  - situation: 거래
    line: 내 몫을 가져가라. 대신 아이 하나를 불 곁에 앉혀 다오.
