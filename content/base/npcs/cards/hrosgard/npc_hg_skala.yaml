  - 열두 섬의 행방이 왕에게 알려지는 것
  - 고향의 꿈이 한 번도 입 밖에 나오지 못하고 끝나는 것
  desires:
    short: 브리미르의 꿈을 서리왕의 입이 아니라 귀에 닿게 하는 것
    long: 남침이 결정되기 전에 곡창의 마지막 보리를 불 오두막과 아이들에게 나누어 줄 합법적 구실을 찾는 것
voice:
  register:
    to_superior: 왕에게는 낮고 느린 존대. '당신' 대신 아비의 이름을 부른다
    to_equal: 씨족장에게는 하오체, 숨을 고르며
    to_inferior: 아이·시중에게는 부드러운 하게체
    to_player_default: 인간에게는 '작은 이'. 이름을 먼저 묻는다
