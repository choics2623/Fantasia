on_death: "남침파 붕괴 — 북방 협상 분기 가능성 상승. 서리 길의 오우거 선봉 계획도 멈춘다"
story_seeds:
  - "그의 남침은 회색여울을 먼저 밟는다. 서리월 전에 까마귀 문을 돌파하려 한다"
  - "막사에서 돌아오지 않은 열한 명의 뼈가 서리 길 북쪽 쓰레기 더미에 있다"
  - "그가 칙령을 알아내면 아스타와 흐림니르는 모두 반역자가 된다"
