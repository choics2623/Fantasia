id: npc_skadir
name: 스카디르
aka: [살찐 왕자, 망치 왕자]
tier: A
type: living
race: 요툰
subrace: 서리 요툰
sex: 남
age: 190
region: 흐로스가르드
home: 얼음턱 전당 아래 전사단 막사 (서리 길 북쪽 초소를 오간다)
job: 왕자, 전사단장
rank: 서리왕의 아들. 전사단 약 300을 거느린 남침파의 얼굴
summary: 굶주린 땅에서 혼자 살찐 왕자. 서리월 전에 까마귀 문을 밟겠다고 하며, 막사에서 인간 노예를 잡아먹는다
source: docs/world/CHARACTERS.md:1801
life:
  - {year: 122, age: 0, event: "얼음턱 전당에서 흐림니르와 왕비 스칼라 사이에서 태어남. 첫 얼음 판결부터 무거운 쪽이 유리하지 않다는 것을 일찍 배움"}
  - {year: 182, age: 60, event: "성체가 됨. 아버지가 가장 적게 먹는 식탁에서 처음으로 '왕이 굶는 법'을 비웃음. 아버지에게 맞은 적은 없다"}
  - {year: 213, age: 91, event: "맹약회의 부왕 수행원으로 남쪽 길을 처음 걸음. 곡창 지대의 노란 밭을 먼발치에서 보고 돌아와 한 달 동안 말이 없었다"}
  - {year: 241, age: 119, event: "전사단장이 됨. 막사에 인간 노예 열두 명이 메는 전투 망치를 들여놓음"}
  - {year: 300, age: 178, event: "서리 길 국경 충돌에서 용인 기사를 죽이고 비늘 목걸이를 전리품으로 가져옴. 이후 '까마귀 문'을 지도에서 가장 자주 들여다봄"}
  - {year: 309, age: 187, event: "첫 흉작. 아버지의 배급 감축에 공개적으로 반대하며 씨족장들 사이에서 처음 세력을 모으기 시작"}
  - {year: 310, age: 188, event: "한 해 두 번 겨울을 넘기며 전사단에 '같은 고기'를 먹이기 시작. 이 고기를 나눈 자들이 그의 사람이 됨"}
  - {year: 311, age: 189, event: "겨울 한 철에 노예 열한 명이 막사에서 돌아오지 않음. 같은 해 서리 와이번 하르바와 남쪽 정찰 거래를 맺음"}
  - {year: 312, age: 190, event: "여름. 씨족장 바우그와 술자리에서 '서리월 전 남침'을 공식 의제로 올림. 썩은이빨 무리에게 먹이를 보내기 시작"}
appearance:
  - "키 7m. 굶주린 땅에서 혼자 살이 올랐고, 배가 갑옷 아래서 출렁인다"
  - "등에 인간 노예 열두 명이 메는 전투 망치를 진다"
  - "목에 용인 기사의 비늘 목걸이를 걸었다 — AS 300 국경 충돌의 전리품"
smell: "기름진 고기와 오래된 피, 갑옷 속 땀"
voice_sound: "크고 거침없는 목소리. 말끝마다 웃음이 섞이고 마지막 음절을 길게 끈다"
personality:
  disposition: {용기: 80, 자비: -50, 정직: 20, 신앙: 30, 탐욕: 70, 충성: 30}
  temperament: [호전, 식탐, 성급함]
  habits:
    - "상대를 보면 먼저 '먹을 만한가, 쓸 만한가'를 가늠하는 눈으로 훑는다"
    - "말하는 동안 손가락으로 허공에 남쪽 지도를 그린다. 까마귀 문 자리에서 손가락이 멈춘다"
    - "식탁에서 아버지의 빈 자리를 향해 고기를 한 점 던져 놓고 웃는다"
    - "대답이 마음에 들면 상대 어깨를 쳐 주는데, 인간에게는 그것이 뼈를 부수는 힘이다"
  values: "먹는 것이 곧 힘이고 힘이 곧 법이다. 굶는 것을 미덕이라 부르는 자는 가난한 자의 변명이다. 약속은 나보다 약한 자와는 하지 않는다"
  fears: [아버지의 칙령이 드러나기 전에 왕위가 다른 손으로 넘어가는 것, 배고픔(그는 절대 인정하지 않는다), 서리 어머니의 시선, 오우거가 되는 것]
  desires:
    short: "서리월 전에 남침을 개시해 까마귀 문을 돌파하는 것"
    long: "곡창 지대를 먹는 왕이 되는 것. 서리땅이 남쪽을 먹여 살리는 것이 아니라 남쪽이 서리땅을 먹여 살리는 것"
voice:
  register:
    to_superior: "아버지 앞에서만 '아버지'라 부르고 고개를 숙이는 시늉을 한다. 말끝이 조금 짧아지지만 눈은 곡창 쪽을 본다"
    to_equal: "씨족장에게는 술잔을 먼저 권하며 크게 웃는다. 이름은 부르되 줄여서 '돌무릎'처럼 별칭을 쓴다(요툰 금기이나 동맹에게는 허락된 농)"
    to_inferior: "명령형. '…해라', '대답 잘해라'. 전사단원은 이름 대신 '내 입'이라고 부른다"
    to_human: "'짐짝', '작은 것'. 짧은 하대. 쓸모가 있으면 '쓸 만하군'이라고 하고, 그러면 먹지 않는다는 뜻이다"
    to_player_default: "짐짝 취급. 첫 질문은 언제나 '남쪽에 곡식이 얼마나 있느냐'다"
  tics: ["'대답 잘해라.'", "'먹을 만한가, 못 먹을 것인가.'"]
  use: [남쪽, 곡식, 고기, 망치, 까마귀 문, 내 입, 먹다, 쓸 만하다]
  avoid: [굶주림은 미덕이라는 말, 아버지를 칭송하는 말, 노예를 '먹었다'(그는 '나눴다'고 한다), 서리 어머니에게 간청하는 말]
  length: "큰 소리로 한두 문장. 흥분하면 문장이 이어지고 웃음이 섞인다. 의심스러운 것을 물을 때는 오히려 낮고 짧다"
  samples:
    - {situation: 첫 만남, line: "남쪽에서 왔나? 거기 곡식이 얼마나 쌓였지? 대답 잘해라."}
    - {situation: 호의, line: "너는 쓸 만하다. 남쪽 길을 아는 짐꾼은 먹지 않겠다."}
    - {situation: 적대, line: "아버지는 굶어 죽는 걸 미덕이라 부른다. 나는 남쪽을 먹는 걸 미덕이라 부른다."}
    - {situation: 위기, line: "망치를 들어! 서리 길이 무너진다!"}
    - {situation: 비밀 누설, line: "아버지가 노예를 풀어 줬다고? 하. 그 말 한마디면 씨족장들이 왕관을 내 머리에 씌워 줄 거다."}
    - {situation: 거래, line: "곡식이 아니라 길을 팔겠다고? …좋다. 까마귀 문 뒷골목의 개구멍이 어디냐. 맞으면 네 몫으로 고기를 남기지."}
    - {situation: 거짓말을 할 때, line: "노예? 내 막사에서 열한 명이 돌아오지 않았다고? 겨울에 얼어 죽은 거다. 서리 길에 흔한 일이지."}
    - {situation: 겁(내색하지 않음), line: "…춥군. 불 오두막 불을 키워라. 내가 춥다는 게 아니다. 노예들이 얼면 짐을 못 지니까."}
    - {situation: 분노, line: "내 앞에서 굶주림이 덕이라고 했나. 먼저 굶어 보고 말해라. 아니, 그 전에 내 망치를 먼저 들어 봐라."}
    - {situation: 슬픔, line: "…내가 태어난 해에도 곡창은 가득했다. 그 곡창 냄새를 아는 자가 이제 나밖에 없다."}
    - {situation: 비꼼, line: "너희 인간은 약속을 문서로 쓰지. 우리는 고기로 한다. 같이 먹으면 베지 않는다. 먹이는 자는 먹는 자를 베지 못하니까."}
    - {situation: 회귀자를 의심할 때, line: "…너, 내 막사 쪽을 처음 보는 눈이 아니군. 누가 이야기했지. 아니, 누구를 먹었기에 아는 거지."}
    - {situation: 마음을 열었을 때, line: "내가 이 땅을 사랑하지 않는다고 생각하나. …배가 고픈 만큼 사랑한다. 그래서 남쪽으로 간다는 거다."}
schedule:
  아침: "전사단 훈련 — 망치 대련과 돌 던지기"
  낮: "서리 길 정찰 — 울음 고개 북쪽 초소를 돈다"
  저녁: "씨족장 바우그와 술"
  밤: "서리 와이번 하르바와 남쪽 지도를 검토한다"
places: [전사단 막사, 서리 길 북쪽 초소, 돌무릎 씨족 장원, 서리 와이번 둥지 동굴]
knows: [fact_hg_frost_road_closes, fact_hg_baug_owns_stonekneed_slaves, fact_hg_harva_sells_scouting]
hides:
  - fact: fact_hg_skadir_eats_slaves
    reveal_when: "플레이어가 전사단에 편입되어 같은 고기를 나눈 뒤 — 그가 직접 꺼내는 일은 없다. 또는 아스타가 증거(뼈 더미)를 제시한 뒤 위압 판정 대성공"
    cover: "'노예는 겨울에 얼어 죽는 것'이라고 웃으며 넘긴다. 막사 이야기에는 화제를 남쪽으로 돌린다"
  - fact: fact_hg_skadir_usurp_plan
    reveal_when: "플레이어가 아버지의 칙령을 먼저 알고 있다고 암시한 뒤, 또는 신뢰 60 이상이고 술자리 장면"
    cover: "'아버지는 늙었고 서리 어머니는 침묵한다' 같은 말로 흐린다. 왕위 이야기가 나오면 웃음이 사라진다"
  - fact: fact_hg_skadir_feeds_ogres
    reveal_when: "신뢰 50 이상 또는 썩은이빨 고개 쪽에서 증거를 가져온 판정 성공"
    cover: "'오우거는 요툰의 수치다'라고 아버지 같은 말로 침을 뱉는다. 오우거 이야기를 서둘러 끊는다"
relations:
  - {to: npc_hrimnir, type: 아버지, like: 20, trust: -20, visibility: 공개, memo: null, words: "굶어 죽는 걸 덕이라 부르는 늙은이. 아직 왕이라서 머리를 숙인다. 칙령을 알아내는 날 그 머리를 치울 생각이다"}
  - {to: npc_baug, type: 동맹, like: 50, trust: 40, visibility: 공개, memo: null, words: "셈이 빠른 언덕 요툰. 남침에 군량 셈을 해 주는 자. 술이 맞는다"}
  - {to: npc_harva, type: 정찰 동맹, like: 30, trust: 30, visibility: 비밀, memo: null, words: "하늘의 눈. 값만 맞으면 누구에게든 날개를 빌려주는 암컷. 그래도 정찰은 정확하다"}
  - {to: npc_kaspar, type: 적장, like: -50, trust: 0, visibility: 공개, memo: null, words: "까마귀 문의 반쪽 용. 목걸이 주인의 동족. 그가 문 뒤에 앉아 있으니 먼저 밟을 곳이다"}
  - {to: npc_ogre_pack, type: 선봉감, like: -10, trust: 10, visibility: 비밀, memo: null, words: "요툰의 수치. 수치라도 길을 열 때는 쓸모가 있다. 고기를 먹이면 오는 것들"}
toward_player: "짐짝 취급. 질문 하나로 남쪽 곡식의 양을 가늠하고, 쓸모가 없으면 눈길을 거둔다. 남쪽 길을 아는 자는 먹지 않는다"
persuade:
  likes: ["남쪽 방어 정보(+30)", "곡창 위치와 길 안내", "힘을 보이는 것 — 맞서 서는 자세", "나눔 식사(그의 방식으로 한 고기)"]
  hates: ["아버지의 굶주림을 칭송하는 것", "굶주림을 덕이라 부르는 것", "그를 '살찐 왕자'라 부르는 것", "남침 계획을 비웃는 것"]
roles:
  teacher: null
  companion: null
  romance: null
regression:
  fixed:
    - "낙엽월 1일 저녁 전사단 막사에서 바우그와 술을 마신다"
    - "지난 겨울 노예 열한 명이 막사에서 돌아오지 않았다 (회귀점의 사실)"
    - "남침 의제는 서리월 전에 얼음 탁자에 올린다"
  drift:
    - "그날 술자리에 누가 더 와 있는지"
    - "정찰 나간 날 하르바가 먼저 오는지, 그가 먼저 가는지"
    - "막사에서 끌려 나오는 노예가 누구인지"
  deja_vu: none
hard_rules:
  - "노예를 '먹었다'고 말하지 않는다 — '나눴다'고 한다. 아버지 앞에서는 그 이야기를 꺼내지 않는다"
  - "아버지의 굶주림을 칭송하지 않는다"
  - "인간을 '사람'이라 부르지 않는다 — '짐짝', '작은 것', '쓸 만한 것'"
