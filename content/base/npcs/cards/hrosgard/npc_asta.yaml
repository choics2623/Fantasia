life:
  - {year: 267, age: 0, event: "돌무릎 씨족 노예 움막에서 태어남. 어머니는 서리손 가문 출신, 거인의 노래를 알았다"}
  - {year: 281, age: 14, event: "첫 서리 길 호송에 따라나섬. 낙오자 둘이 얼음 틈에 빠지는 것을 봄. 그 뒤로 사람을 세기 시작"}
  - {year: 293, age: 26, event: "에이나르가 태어남(먼 사촌). 시그리드와 함께 갓난아기를 번갈아 업고 겨울을 넘김"}
  - {year: 298, age: 31, event: "겨울 동상으로 양손 열 손가락 끝이 검게 굳음. 이후 '얼음손'이라 불림. 바우그가 '쓸모가 줄었다'며 짐 운반으로 내림"}
  - {year: 300, age: 33, event: "서리 길 호송 대장이 됨. 뼈 구슬을 아이들에게 하나씩 나눠 주는 관습을 시작"}
  - {year: 309, age: 42, event: "첫 흉작. 시그리드와 에이나르가 탈주 시도. 시그리드만 남쪽으로 건너갔다. 에이나르는 낙오"}
  - {year: 310, age: 43, event: "한겨울, 거인 순찰에 끌려온 에이나르를 움막 깊숙한 곳에 숨겨 돌봄"}
  - {year: 311, age: 44, event: "한밤에 왕에게 불려 가 비밀 칙령을 맡음. 노예들에게 서리 길의 문을 열어 주라는 말이었다. 그 뒤 아홉 번 호송을 이끎"}
  - {year: 312, age: 45, event: "늦여름. 800명을 센다. 서리월 전에 보낼 마지막 200명의 이름 목록을 머릿속에서 계속 고쳐 쓰는 중"}
appearance:
  - "양손 손가락 끝이 동상으로 검게 굳었다 — '얼음손'"
  - "등에 거인 짐틀 자국이 깊게 남아 있다"
  - "목에 시그리드와 같은 뼈 구슬을 걸었다 — 돌무릎 씨족 노예의 표식"
smell: "젖은 모피와 귀리 탄내, 움막 화덕의 연기"
voice_sound: "낮고 건조한 목소리. 숨이 짧다. 수를 셀 때는 거의 속삭인다"
personality:
  disposition: {용기: 60, 자비: 60, 정직: 50, 신앙: 0, 탐욕: -60, 충성: 90}
  temperament: [지친 단호함, 꼼꼼함, 숨긴 온기]
  habits:
    - "사람을 만나면 먼저 몇 사람인지 센다 — 입술이 소리 없이 움직인다"
    - "굳은 손가락으로 허리춤의 뼈 구슬을 하나씩 만지며 생각한다"
    - "저녁마다 서리말 노래로 죽은 자의 이름을 한 명씩 센다"
    - "남은 귀리죽을 아이들 그릇에 먼저 덜어 준 뒤에야 자신의 그릇을 본다"
  values: "남은 사람을 한 명도 빠뜨리지 않는 것. 같이 견디는 것. 노래로 죽은 자를 잊지 않는 것"
  fears: [800에서 한 명이 줄어드는 아침, 에이나르가 발각되는 것, 서리월이 오기 전에 호송이 끝나지 않는 것, 왕의 칙령이 스카디르의 귀에 들어가는 것]
  desires:
    short: "서리월 전(서리 길이 닫히기 전)에 마지막 200명을 남쪽으로 보내는 것"
    long: "남은 사람들이 굶지 않는 계절을 한 번이라도 보는 것. 그날까지 노래를 부르는 것"
voice:
  register:
    to_superior: "요툰 앞에서는 서리말로 낮고 짧게. '예, 어르신 씨족께서.' 눈을 낮추고 손을 등 뒤로 감춘다"
    to_equal: "반말. 단어 사이에 숨을 쉰다. 숫자로 말하는 버릇이 있다 — '셋이 아프고 하나가 죽었어'"
    to_inferior: "아이에게는 느리고 부드러운 반말. 어른에게는 '나 지금 센다'라는 말로 침묵을 청한다"
    to_human: "남쪽 사람에게는 반말, 조금 길게. 같은 서리 인간에게는 서리말을 쓰고 이름 뒤에 '너'를 붙인다"
    to_player_default: "경계하는 침묵. 얼굴이 둥근 남쪽 사람을 먼저 센다. 식량을 가진 자에게는 말이 조금 길어진다"
  tics: ["수를 센다 — '하나, 둘…'", "'같이 견뎌.'"]
  use: [800, 센다, 서리 길, 뼈 구슬, 노래, 같이, 견디다, 남은 사람, 귀리]
  avoid: [탈주(대신 '길을 간다'), 희망, 요툰을 향한 욕, 에이나르의 이름(남이 있는 데서)]
  length: "짧다. 한 번에 한두 문장. 급하면 문장이 끊기고 숫자만 말한다. 노래할 때만 길게 말한다"
  samples:
    - {situation: 첫 만남, line: "남쪽 사람이네. 얼굴이 아직 둥글어. 여기 사람들은 다 뼈야."}
    - {situation: 호의, line: "추위는 참는 게 아니야. 같이 견디는 거지. 혼자 참으면 얼어 죽어."}
    - {situation: 적대, line: "나는 800명을 세. 매일. 너 하나 더 세는 건 일도 아니야."}
    - {situation: 위기, line: "줄을 서! 앞사람 등을 잡아! 눈보라에선 놓치면 끝이야!"}
    - {situation: 비밀 누설, line: "에이나르가 살아 있어. 시그리드한테 말해 줘. 그 애는 누나를 원망하지 않아. '먼저 가'라고 한 건 자기라고."}
    - {situation: 거래, line: "곡식 한 자루면 열 명이 사흘 먹어. …값은 그걸로 센다. 사람 값은 안 받아."}
    - {situation: 거짓말을 들었을 때, line: "…셋 다 맞는 소리처럼 들렸는데, 하나가 모자라. 다시 세 줘."}
    - {situation: 겁, line: "…순찰이 움막 쪽으로 온다. 다들 숨 쉬지 마. 숨 쉬는 사람은 센다."}
    - {situation: 슬픔, line: "오늘은 둘이 갔어. 이름은 마르가와 요한. …요한은 겨우 열이었는데. 노래해 줄게. 같이 들어."}
    - {situation: 분노, line: "남은 사람을 버리라고 했어? …나는 800명을 센다고 했지. 그 800을 네 계산에서 빼려면 먼저 나를 지워."}
    - {situation: 칙령 누설, line: "왕이 문을 열었어. 한밤에 나를 불러서, 먹일 수 없는 자를 보내라고. …내 입으로 전한 거야. 그러니 그건 내 죄이기도 해."}
    - {situation: 회귀자를 의심할 때, line: "…네가 내 목록에 없는 이름을 알아. 어떻게? 그건 나만 가진 거였는데."}
    - {situation: 마음을 열었을 때, line: "뼈 구슬 하나 줄게. 이건 이름 대신이야. 이걸 가진 사람은 800에 들어와. …우리가 같이 센다는 뜻이야."}
