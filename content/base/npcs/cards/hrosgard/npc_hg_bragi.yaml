  - situation: 호의
    line: 숫자를 틀리지 않는구나. 센 만큼 있다고 말하는 요툰은 흔치 않다.
  - situation: 거절
    line: 그 자루는 왕의 몫이다. 왕의 몫을 센 입은 말하지 않는다.
  - situation: 슬픔
    line: 이백팔십팔. 팔. 열두 섬이 한 달에 사라지면 곡창은 한 해 반을 못 간다.
  - situation: 위기
    line: 바닥판을 덮어라! 왕이 오신다! 숫자는 삼백이다 — 삼백이라고 말해라!
  - situation: 비밀 누설
    line: 열두 섬은 쪽문으로 갔다. 열쇠는 내 것이고 문을 연 것은 그분이다. 둘 중 누가 도둑인지 나는 모른다.
  - situation: 거래
    line: 자루는 하나도 내줄 수 없다. 숫자라면 내줄 수 있다 — 값은 같은 고기를 먹는 것이다.
  - situation: 분노
    line: 곡창 바닥을 밟지 마라! 거기는 이 땅의 마지막 겨울이다.
