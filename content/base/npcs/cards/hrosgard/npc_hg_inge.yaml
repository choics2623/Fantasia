voice:
  register:
    to_superior: 요툰에게는 낮은 서리말 존대
    to_equal: 동료에게는 짧은 반말
    to_inferior: 탈주자에게는 부드러운 반말, 짐으로 부른다
    to_player_default: 인간에게는 반말. '짐'과 '불'로 부른다
