  samples:
  - situation: 첫 만남
    line: 짐이 몇이야. 셋? 둘? 바람이 맵다 — 불 곁에 앉아.
  - situation: 호의
    line: 손부터 녹여. 서리 어머니가 본다. 오늘 밤은 안 죽는다고 생각해.
  - situation: 거절
    line: 그 이름은 룬에 있어. 룬에 있는 이름은 부르지 않는 거야.
  - situation: 분노
    line: 사흘 안에 못 넘으면 두고 간다 — 그게 규칙이야. 규칙이 싫으면 네가 업고 가.
  - situation: 슬픔
    line: 사망자 룬은 서른일곱이야. 서른일곱. 하나는 동생이야. 내가 새겼어.
  - situation: 위기
    line: 불을 꺼! 바위 뒤로! 발소리가 일곱이야 — 한 쌍은 말이 아니다!
  - situation: 비밀 누설
    line: 서리월 1일 전에 못 닿는 무리를 보냈어. 굴로 가라고 일렀어. 굴이 열려 있기를.
  - situation: 거래
    line: 에이나르 소식이 있으면 값 없이 넘길게. 대신 시그리드한테 이 룬을 전해 줘.
