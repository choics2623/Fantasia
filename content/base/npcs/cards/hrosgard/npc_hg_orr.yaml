story_seeds:
- 오르의 거절한 고기는 스카디르의 충성이 무엇으로 이루어졌는지의 증거다. 그를 증인으로 세우면 스카디르의 칼이 흔들린다.
- 전쟁 노병이 서리 길에서 선봉으로 쓰러지면 선봉이 오우거로 바뀐다.
