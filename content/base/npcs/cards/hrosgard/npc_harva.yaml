# (해결) 하르바는 여족장 흐로아 얼음깃 아래 울음 협곡 둥지 한 구역의 장 — SUBRACES 서리 와이번 대표 인물
on_death: "스카디르의 남쪽 정찰 단절. 서리 와이번의 하늘길이 닫혀 서리 길 폐쇄 겨울 탈주 경로 소멸"
story_seeds:
  - "서리 길이 닫힌 겨울, 하늘길은 그녀뿐이다. 삯은 소금과 남쪽 이야기"
  - "그녀가 판 정찰 지도가 카스파르와 스카디르 양쪽에 있다. 둘이 같은 지도를 보고 마주친다"
