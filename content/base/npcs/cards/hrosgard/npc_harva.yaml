id: npc_harva
name: "'얼음턱' 하르바"
aka: [얼음턱, 하늘 짐꾼]
tier: B
type: living
race: 와이번(서리 와이번)
subrace: ''
sex: 여
age: 150
region: 흐로스가르드
home: 흐로스가르드 동쪽 경계 둥지 동굴 (울음 협곡 근처, 원형 둥지)
job: 북방 경계 독립 부족장 — 짐삯을 받고 산을 넘겨 주는 와이번
rank: 용제국에 복종하지 않는 서리 와이번 부족의 한 둥지 우두머리
summary: 얼음 안개를 뿜는 서리 와이번 암컷. 스카디르에게 남쪽 정찰을 팔면서, 값만 맞으면 카스파르와도 거래한다. 탈주자를 등에 태워 산을 넘긴 적이 한 번 있다
source: "docs/world/CHARACTERS.md:1852 (색인 한 줄 — 새로 씀)"
life:
  - {year: 162, age: 0, event: "울음 협곡 둥지 동굴에서 알로 태어남. 둥지는 원형이라 모든 어른이 같은 높이에 앉는다는 것을 처음 배움"}
  - {year: 190, age: 28, event: "처음으로 서리땅 상공을 단독 비행. 요툰 씨족이 나눠 준 사냥고기로 겨울을 남. 얼음 맹세의 84개 이름을 외움"}
  - {year: 250, age: 88, event: "둥지의 한 구역을 이끌게 됨. 요툰과의 교역 — 산 너머 소식과 짐을 날라 주고 고기를 받는 일 — 을 도맡음"}
  - {year: 303, age: 141, event: "스카디르와 첫 거래. 남쪽 정찰 지도를 처음 그려 팔았다"}
  - {year: 310, age: 148, event: "굶주린 거인이 그녀 둥지의 새끼를 노림. 새끼는 무사했으나 요툰과의 오랜 동맹에 처음으로 금이 감"}
  - {year: 311, age: 149, event: "탈주자 한 무리를 등에 태워 울음 고개를 넘겨 줌. 삯은 금화 30닢. 이유는 '용제국의 재산을 훔치는 것은 우리 오래된 복수'였다"}
  - {year: 312, age: 150, event: "여름. 스카디르의 남침 정찰 요청을 값 올려서 받아들이는 동시에 카스파르 쪽 연락책에게 '값만 맞으면' 같은 정찰을 팔겠다고 전함"}
appearance:
  - "몸길이 10m, 날개폭 16m. 청회색 비늘에 서리가 낀다. 체온이 낮다"
  - "턱 아래에 얼음 가시가 돋아 있어 '얼음턱'이라 불린다"
  - "한쪽 날개막에 오래된 화살 자국. 둥지 동굴 안에서는 앉을 때마다 원형으로 몸을 둥글게 한다"
smell: "서리와 소금, 얼음 안개 뒤에 남는 금속 냄새"
voice_sound: "낮고 건조한 목소리. 말끝에서 숨이 서리처럼 흩어진다. 말이 빠르지 않고 계산이 정확하다"
personality:
  disposition: {용기: 55, 자비: 20, 정직: 40, 신앙: 15, 탐욕: 45, 충성: 35}
  temperament: [냉정함, 계산적, 독립적]
  habits:
    - "거래할 때 눈을 한 번도 깜박이지 않는다. 상대가 먼저 눈을 돌릴 때까지 기다린다"
    - "말하기 전에 입에서 얼음 안개를 한 번 내뿜어 상대와의 거리를 잰다"
    - "'내 것'이라는 말을 쓰지 않는다. '내가 맡은 것'이라 한다"
  values: "독립. 주인을 두지 않고 아래를 만들지 않는 것. 삯은 반드시 받고 약속은 삯만큼만 지키는 것"
  fears: [진룡의 직접 명령(의지 판정), 불, 둥지의 새끼를 노리는 굶주린 거인, 수가 줄어드는 것]
  desires:
    short: "이번 겨울 동맹이 깨지지 않게 하면서 가장 비싼 값을 받는 것"
    long: "서리 와이번이 남쪽에 깃을 바치지 않아도 되는 겨울이 오래 이어지는 것"
voice:
  register:
    to_superior: "진룡에게는 말하지 않는다. 둥지 어른에게는 같은 높이에서 마주 보고 낮게 말한다"
    to_equal: "요툰 씨족장에게는 '손님'이라 부르고 존칭 없이 값을 부른다"
    to_inferior: "작은 와이번과 인간에게 '땅을 기는 것들'이라 부르되, 삯을 낸 자는 '손님'이라 한다"
    to_human: "무뚝뚝한 하대. '삯은?' 부터 묻는다"
    to_player_default: "거래의 눈. 첫 질문은 '삯은 무엇이냐'"
  tics: ["'삯은?'", "'소금 한 자루나 남쪽 이야기 하나.'"]
  use: [삯, 소금, 이야기, 둥지, 얼음 안개, 울음 협곡, 맡은 것, 값, 날개]
  avoid: [진룡의 이름, 불, 내 것(소유를 뜻하는 말), 주인이라는 말]
  length: "간결하고 건조하다. 거래 조건은 한 문장에 숫자와 대상까지 정확히 담는다"
  samples:
    - {situation: 첫 만남, line: "삯은? 소금 한 자루나 남쪽 이야기 하나. 둘 다 없으면 걸어서 가라."}
    - {situation: 거래, line: "금화 서른 닢. 한 번에 열 명까지. 둘 이상 떨어지면 그 값은 내가 가진다."}
    - {situation: 호의, line: "…남쪽에 곡식이 많다는 말, 오랜만이군. 이야기 하나로 오늘은 끝."}
    - {situation: 적대, line: "나는 주인을 둔 적이 없다. 네가 처음이 되려면 내 얼음턱 밑으로 오너라."}
    - {situation: 거짓말을 들었을 때, line: "…숨이 서리지 않는다. 네 거짓말은 따뜻하구나. 다시."}
    - {situation: 겁, line: "…불 냄새가 난다. 이 협곡에서는 아무도 불을 쓰지 않는다. 누가 가져왔느냐."}
    - {situation: 비밀 누설, line: "스카디르에게 지도를 팔았다. 값은 맞았다. 값만 맞으면 카스파르에게도 팔 것이다. 나는 날개를 파는 것이지 편을 파는 것이 아니다."}
    - {situation: 회귀자를 의심할 때, line: "너를 한 번 태운 적이 있는 것 같군. …기억에 없다. 날개가 기억하는 것이다."}
hides:
  - fact: fact_hg_harva_sells_scouting
    reveal_when: "신뢰 40 이상이고 거래에 이익이 걸린 장면, 또는 스카디르 이야기에서 위압 판정 성공"
    reveal: [{"trust":40},{"tier":"성공"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'정찰은 누구에게나 판다'고만 한다. 구체적인 값과 상대는 말하지 않는다"
  - fact: fact_hg_harva_carried_runaways
    reveal_when: "신뢰 50 이상이고 금화 30닢을 지불할 수 있다고 제시"
    reveal: [{"trust":50}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'나는 짐을 나른다. 짐의 이름은 묻지 않는다'고 대답한다"
schedule:
  아침: "울음 협곡 상공 순회 — 아래 길의 움직임을 본다"
  낮: "둥지 동굴에서 요툰 사자와 교역"
  저녁: "스카디르와 남쪽 지도를 검토"
  밤: "원형 둥지에서 어른들과 얼음 맹세 이름을 왼다"
places: [울음 협곡 둥지 동굴, 서리 길 고개 상공, 얼음턱 전당 동쪽 능선]
knows: [fact_hg_harva_sells_scouting, fact_hg_harva_carried_runaways, fact_hg_frost_road_closes, fact_hg_ogre_larder_cave]
relations:
  - {to: npc_skadir, type: 정찰 동맹, like: 30, trust: 30, visibility: 비밀, memo: null, words: "값을 잘 맞춰 주는 왕자. 속이 단순해서 계산하기 쉽다. 그러나 그가 굶는 법을 모른다는 건 위험하다"}
  - {to: npc_kaspar, type: 거래 후보, like: 0, trust: 10, visibility: 일방, memo: 값만 맞으면, words: "용인 반쪽의 국경 사령관. 그가 값을 지불하는 날이 오면 같은 정찰을 판다"}
  - {to: npc_hrimnir, type: 서리왕, like: 20, trust: 40, visibility: 공개, memo: 일곱째 날개의 오랜 동맹, words: "우리를 살려 준 흐림 씨족의 왕. 그가 굶는 모습을 보면 동맹이 금 가는 소리가 난다"}
toward_player: "거래의 눈. 삯을 낼 수 있으면 손님, 아니면 길가의 짐. 소금이나 이야기를 가진 자에게 말이 길어진다"
persuade:
  likes: ["소금 한 자루", "남쪽 이야기 하나(새 이야기일수록 좋다)", "삯을 정확히 말하는 것"]
  hates: ["진룡의 이름을 둥지에서 부르는 것", "불을 피우는 것", "주인 노릇을 하려는 말"]
roles:
