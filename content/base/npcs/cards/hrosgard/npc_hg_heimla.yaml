    line: 옛 노래에 이르기를 — 손님은 먼저 앉고 나중에 묻는다. 앉아라, 작은 이여.
  - situation: 호의
    line: 듣는 자의 숨소리가 곧다. 노래는 곧은 숨 위에서 오래 산다.
  - situation: 거절
    line: 그 구절은 아직 내 입의 것이 아니다. 아직 주인이 오지 않았다.
  - situation: 슬픔
    line: 삼천 년의 노래를 한 달씩 걸려 부른다. 한 번 끝나면 다시 첫 구절이다. 그 사이에 몇 명이 굶어 죽었는가는 노래에 없다.
  - situation: 분노
    line: 노래를 끊지 마라. 한 소절이 끊기면 그 달 전체가 틀린다.
  - situation: 위기
    line: 막대를 내려라. 아이를 데려가라. 노래는 내가 남는다 — 노래는 늙은 입에 남는 법이다.
  - situation: 비밀 누설
    line: 용이다. 그롬이 아니다. 노래는 용이 칼을 쥐고 웃었다고 했다. 얼음 탁자에서는 부른 적 없다.
  - situation: 거래
    line: 한 달을 열흘 듣고 오라. 열흘을 들은 자는 한 구절을 가져갈 수 있다.
