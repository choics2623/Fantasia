life:
  - {year: 222, age: 0, event: "서리 길 북쪽 동면 굴에서 태어남. 우르사 어미는 겨울 동안 인간 겨울지기에게 맡겨 아이를 길렀다"}
  - {year: 240, age: 18, event: "달밤에 처음으로 인간 아이가 눈 속에 우는 것을 구해 산장으로 데려옴. 우르사는 3,400년 전부터 인간과 겨울을 같이 났다고 배웠다"}
  - {year: 270, age: 48, event: "서리 길 마지막 산장의 주인이 되어 홀로 정착. 꿀 단지를 땅에 묻어 겨울 식량을 모으기 시작"}
  - {year: 289, age: 67, event: "돌 요툰 무녀 요룬과 처음으로 마주 앉아 말 없이 차를 마심. 요룬의 말이 느려서 그는 마음에 들었다"}
  - {year: 309, age: 87, event: "북방 대탈주가 시작되자 산장에 탈주자들이 하나둘 찾아옴. 꿀과 가죽을 받고 한 밤을 재워 줌"}
  - {year: 311, age: 89, event: "아스타의 호송대가 매주 산장에서 첫 밤을 묵게 됨. 볼크가 산장을 '탈주자 소굴'로 지목하며 사냥 조합이 지켜보기 시작"}
  - {year: 312, age: 90, event: "늦여름. 겨울 동면 전에 꿀 단지를 세 번 확인함. 올해는 동면이 어렵다는 것을 예감"}
appearance:
  - "서 있으면 2m를 넘는 갈색 곰. 털이 군데군데 하얗게 셌다"
  - "한쪽 귀가 반쯤 잘려 있다 — 오래전 인간 덫에서 풀려난 흔적"
  - "허리춤에 꿀 단지를 매단 끈. 손이 크고 느리다"
smell: "꿀과 마른 풀, 젖은 모피"
voice_sound: "낮고 둥글게 울리는 목소리. 문장 끝에 '음' 하는 숨소리가 붙는다. 달말이 섞이면 목에서 으르렁이 나온다"
personality:
  disposition: {용기: 55, 자비: 75, 정직: 60, 신앙: 70, 탐욕: 10, 충성: 65}
  temperament: [느긋함, 다정함, 조용한 경계]
  habits:
    - "손님이 들어오면 먼저 꿀 단지를 내밀고 얼굴을 본다"
    - "달이 뜨면 문 밖에서 한참 앉아 있다 들어온다"
    - "누가 달려 들어오면 일어서지 않고 앉은 채 코로 냄새를 맡는다"
  values: "겨울은 같이 나는 것. 먼저 꿀부터 나누는 것. 달이 뜬 밤에 문을 닫지 않는 것"
  fears: [동면 중에 산장이 습격당하는 것, 볼크의 냄새, 손님의 아이가 눈 속에서 우는 소리]
  desires:
    short: "올 겨울 산장을 지키며 호송 마지막 묶음을 무사히 재워 보내는 것"
    long: "겨울을 같이 나는 사람들이 봄에 서리 길을 걸어 내려가는 것을 보는 것"
voice:
  register:
    to_superior: "서리 어르신에게는 낮게 앉아 '음'으로 답한다. 요룬에게는 말을 아끼고 차를 따라 준다"
    to_equal: "느리고 편한 반말. 이름 뒤에 '어이'를 붙인다. 같은 우르사에게는 달말 반 공용어 반"
    to_inferior: "어린 사람에게는 꿀을 먼저 준 뒤 부드러운 반말. 어른에게는 '앉아'만 말한다"
    to_human: "'작은 겨울 친구'. 반말. 먹었는지부터 묻는다"
    to_player_default: "먼저 꿀 단지. 냄새를 맡고 나서 이름을 묻는다"
  tics: ["'음. 꿀부터.'", "'겨울은 길다.'"]
  use: [꿀, 겨울, 달, 산장, 앉다, 재우다, 단지, 같이]
  avoid: [달 없는 밤 이야기, 시체 냄새 이야기(그나르를 연상시키는 말), 서두르는 말]
  length: "느리고 짧은 문장. '음' 뒤에 대답한다. 위험을 알릴 때는 오히려 한 마디로 끝낸다"
  samples:
    - {situation: 첫 만남, line: "음. 꿀부터. 앉아라. 먹고 나서 이름을 말해도 늦지 않다."}
    - {situation: 거래, line: "꿀 열 단지면 겨울 한 철 가르쳐 주마. 가죽이면 두 장. …아니, 꿀이 낫겠다. 가죽은 무겁다."}
    - {situation: 호의, line: "음. 겨울은 길다. 같이 나면 짧아진다. 앉아서 불 쬐어라."}
    - {situation: 적대, line: "…내 산장에서 사람을 팔면 곰이 일어선다. 일어서면 사람들이 집에 가고 싶어 한다."}
    - {situation: 겁, line: "…냄새가 난다. 쇠송곳니 냄새다. 불을 꺼라. 아이들 입을 막지 말고, 안아라."}
    - {situation: 슬픔, line: "음. 올겨울 눈 속에서 셋을 데려왔다. 둘은 아침에 갔다. …꿀이 모자랐다."}
    - {situation: 비밀 누설, line: "산장 뒤 헛간 마루 밑에 방이 하나 있다. …아스타가 올 때마다 거기서 잔다. 그 얘기는 한 번만 한다."}
    - {situation: 회귀자를 의심할 때, line: "음. …네 냄새에서 젖은 재가 난다. 이상하군. 곰은 겨울의 냄새는 알아도 재의 냄새는 모르는데."}
