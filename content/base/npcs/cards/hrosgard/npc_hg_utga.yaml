    line: 서리 길이 열렸다! 돌 망치를 들어라! 푸른월은 내일이다!
  - situation: 비밀 누설
    line: 푸른월이다. 까마귀 문. 보름이면 닿는다. 이 말을 들은 자는 내 고기를 먹은 것이다.
  - situation: 거래
    line: 군량 한 섬 값으로 네 이름 하나를 살려 주겠다. 이름은 서리 길에서 긴 법이다.
  - situation: 슬픔
    line: 서리 어머니가 우리를 버렸다는 말이 있다. 돌은 버려도 돌이다. 돌로 길을 연다.
