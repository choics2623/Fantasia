  - situation: 비밀 누설
    line: 우리 땅의 보리만 자랐다. 산이 재를 막았다. 막아 준 것이 산인지 어머니인지는 모른다.
  - situation: 거래
    line: 보리알 하나로 시작하자. 하나로. 하나를 받아 준 자와는 나머지도 나눌 수 있다.
