  - situation: 호의
    line: 네가 말한 이야기는 서고에 없는 줄이다. 값을 매기지 않겠다. 매듭을 하나 묶어 주마.
  - situation: 거절
    line: 그 매듭은 팔지 않는다. 팔지 못하는 줄은 없다 — 이 줄만 빼고.
  - situation: 분노
    line: 서고에서 깃털을 뽑지 마라! 뽑은 깃털은 이야기가 아니라 무게다.
  - situation: 슬픔
    line: 할머니가 매듭을 묶던 날, 손이 떨렸다고 했다. 그날 이후 서고는 떨리는 손으로 읽힌다.
  - situation: 위기
    line: 불이다! 안쪽 매듭부터 — 안쪽부터 옮겨라! 첫 줄이 없으면 우리가 우리를 모른다!
  - situation: 비밀 누설
    line: 불이 의식보다 먼저 떨어졌다. 의식이 불렀다는 말은 거짓이다. 할머니의 매듭이 그렇게 적혀 있다.
  - situation: 거래
    line: 네 이야기로 값을 치르겠다. 한 시간. 한 줄도 빼지 말고.
