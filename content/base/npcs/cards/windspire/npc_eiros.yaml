id: npc_eiros
name: 에이로스
aka: [걷고 싶은 왕자, 맨발 왕자]
tier: A
type: living
race: 아에리
subrace: 백조 아에리
sex: 남
age: 60
region: 바람첨탑
home: 흰 깃 첨탑 아래쪽 둥지 (왕족 둥지의 가장 낮은 자리)
job: 왕자 — 맹약회의 313 아에리 대표 후보
rank: 키리에의 아들. 높은둥지 왕족
summary: 땅에 내려가고 싶은 백조 아에리 왕자. 날개 아래 깃털에 인간 글자가 그려져 있고, 타일라의 날개를 자른 판결에 홀로 반대표를 던졌다
source: docs/world/CHARACTERS.md:1875
life:
  - {year: 252, age: 0, event: "높은둥지에서 키리에의 알로 태어남. 어미는 알이 부화하는 사흘 동안 첨탑 끝에서 아래를 보았다고 한다"}
  - {year: 260, age: 8, event: "첫 비행. 구름 아래를 처음 내려다보다 어미에게 '위만 봐라'고 꾸중을 들음"}
  - {year: 272, age: 20, event: "성년. 첫 번째 깃털 의회 참석에서 '땅의 일은 우리와 상관없다'는 의석에 앉아 입을 열지 못함"}
  - {year: 302, age: 50, event: "스무 살 인간 오른이 첨탑에 끌려와 '애완 인간'이 됨. 에이로스가 처음으로 땅의 말을 배우기 시작. 같은 가을 깃털 법정에서 타일라의 날개를 자르는 판결에 홀로 반대표를 던짐"}
  - {year: 303, age: 51, event: "오른에게서 인간 글자를 배우기 시작. 오른이 날개 아래쪽 깃털에 숯으로 글자를 그려 줌. 아무도 눈치채지 못함"}
  - {year: 304, age: 52, event: "처음으로 몰래 깃털 절벽 아래로 내려가 타일라를 만남. 활을 맞을 뻔함"}
  - {year: 306, age: 54, event: "다리 근육을 키우려고 첨탑 아래 계곡에서 몰래 걷는 연습을 시작함. 한 번에 열 걸음이 한계"}
  - {year: 311, age: 59, event: "어머니가 아래를 내려다보기 시작하는 것을 보며 기뻐했으나, 어머니가 땅에 내려간 적이 있다는 이야기를 오른에게 들음. 어머니와 처음으로 언쟁"}
  - {year: 312, age: 60, event: "여름. 맹약회의 313에 아에리 대표로 가겠다고 의회에 청원. 셀레스 긴목이 '올려다보는 자들'의 이름으로 반대"}
appearance:
  - "날개 아래쪽 깃털에 오른이 숯으로 그린 인간 글자. 아에리는 무관심해 아무도 모른다"
  - "목에 땅의 흙을 담은 작은 주머니를 걸었다"
  - "다른 아에리보다 다리 근육이 굵다 — 몰래 걷는 연습의 결과"
smell: "높은 바람과 마른 풀, 주머니 속의 젖은 흙"
voice_sound: "맑고 들뜬 목소리. 흥분하면 음정이 한 단 올라간다. 웃음이 먼저 나오고 말이 뒤따른다"
personality:
  disposition: {용기: 60, 자비: 50, 정직: 40, 신앙: 10, 탐욕: -20, 충성: 30}
  temperament: [들뜸, 호기심, 서투른 용기]
  habits:
    - "새로운 이야기를 들으면 눈을 크게 뜨고 '그다음은?' 하고 몸을 앞으로 기울인다"
    - "목의 흙 주머니를 손으로 꼭 쥐고 있다가 긴장이 풀리면 놓는다"
    - "날개를 접고 걸으려다 균형을 잃어 비틀거리고 웃는다"
    - "인간 글자를 날개 아래에서 가끔 손가락으로 더듬는다"
  values: "아래를 직접 보는 것. 날개를 묶지 않는 것. 땅의 말을 배우는 것은 부끄러운 일이 아니라는 것"
  fears: [어머니가 땅에 내려갔던 이야기가 알려지는 것, 타일라가 끝내 하늘로 돌아오지 못하는 것, 자신의 날개가 묶이는 것]
  desires:
    short: "맹약회의 313에 아에리 대표로 가서 '아래'를 처음으로 직접 보는 것"
    long: "땅과 하늘 사이에 줄이 아니라 길을 놓는 것. 타일라와 오른을 땅에 돌려주는 것"
voice:
  register:
    to_superior: "어머니에게는 '어머니'. 말이 빨라지고 목소리가 조금 올라간다. 언쟁 때는 짧게 끊는다"
    to_equal: "다른 아에리 귀족에게는 반말이지만 공손함이 서투르게 섞인다"
    to_inferior: "인간에게도 반말. 그러나 질문이 많고 존칭을 일부러 배워서 서툴게 쓰려 한다"
    to_human: "'땅의 사람'. 흥분한 반말. 호기심이 우선이고 무례를 모른다"
    to_player_default: "열광적인 호기심. 첫 반응은 감탄, 두 번째는 '보여 줘!'"
  tics: ["'보여 줘!'", "'땅에서는 어떻게 해?'"]
  use: [땅, 걷다, 발, 흙, 글자, 줄, 아래, 보여 줘, 처음]
  avoid: [날개를 묶는 말, 새장, 지붕과 방 이야기, 어머니를 비난하는 말, 하늘만 보는 자들의 구호]
  length: "빠르고 짧은 문장 여럿. 질문이 이어진다. 흥분하면 숨 쉬는 틈 없이 말한다"
  samples:
    - {situation: 첫 만남, line: "걸어서 왔어?! 그 다리로? 보여 줘. 걷는 거, 다시 한 번!"}
    - {situation: 호의, line: "땅은 무거워 보여. 근데 다들 거기서 서로 붙어 있잖아. 하늘엔 그런 게 없어."}
    - {situation: 적대, line: "하늘에서 떨어지는 것도 걷는 거라고 할 수 있을까?"}
    - {situation: 위기, line: "타일라! 타일라는 날 수 없어— 내가 잡을게!"}
    - {situation: 비밀 누설, line: "어머니는 땅에 내려간 적이 있어. 깃털 셋. 나는 그 이야기를 오른한테 들었어."}
    - {situation: 거래, line: "땅의 소식 하나면 나도 하늘 소식 하나 줄게. 아니, 둘! …근데 땅의 소식은 진짜 새것이어야 해."}
    - {situation: 거짓말을 들었을 때, line: "어, 그건 이상해. 땅에서는 그렇게 안 한다고 오른이 그랬는데. 어떻게 된 거야?"}
    - {situation: 겁, line: "…바람이 이상해. 줄이 흔들려. 땅에서는 이럴 때 어떻게 해? 도망쳐? 아니면 가만히 있어?"}
    - {situation: 슬픔, line: "타일라의 날개가 잘리는 날 나 혼자 반대했어. 손을 든 건 나 혼자였어. 날개가 아프지 않은데도 그날 밤새도록 아팠어."}
    - {situation: 회귀자를 의심할 때(약한 호기심), line: "어? 너 어디서 봤더라. …아냐, 처음이지. 근데 왜 오래된 친구 같지?"}
    - {situation: 마음을 열었을 때, line: "날개 아래 글자 보여 줄게. 오른이 그려 준 거야. 읽을 줄은 몰라, 근데 이게 내 이름이래."}
schedule:
  아침: "비행 훈련 — 높은 바람 속에서 균형 잡기"
  낮: "첨탑의 인간 오른에게 땅의 말을 배운다"
  저녁: "어머니와 언쟁. 그 뒤 몰래 깃털 절벽 아래 타일라를 찾아간다"
  밤: "깃털 절벽 아래를 내려다본다"
places: [흰 깃 첨탑 아래쪽 둥지, 깃털 절벽 위, 깃털 절벽 아래 동굴, 바람 정원 입구]
