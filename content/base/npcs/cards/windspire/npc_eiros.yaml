    reveal: [{"trust":50},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "날개 아래쪽을 몸으로 가린다. '깃털이 가려워서'라고 말한다"
  - fact: fact_ws_eiros_knows_kyrie_secret
    reveal_when: "신뢰 55 이상이고 키리에에 대한 이해를 보인 뒤, 또는 오른이 이미 말했을 때"
    reveal: [{"trust":55},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'어머니는 높이 나는 분이야'라고만 한다. 깃털 셋 이야기를 꺼내려다 입을 다문다"
relations:
  - {to: npc_kyrie, type: 어머니, like: 50, trust: 30, visibility: 공개, memo: null, words: "아래를 보기 시작한 여왕. 그런데 자기가 땅에 내려갔던 건 감추고 있다. 그 비밀이 나를 아프게 한다"}
  - {to: npc_tyla, type: 존경, like: 60, trust: 60, visibility: 비밀, memo: null, words: "날개를 잃고도 바람을 듣는 사냥꾼. 활을 겨눠도 나는 웃게 된다. 그녀가 하늘에 돌아올 길을 찾고 싶다"}
  - {to: npc_orn, type: 스승 같은 인간, like: 60, trust: 60, visibility: 공개, memo: null, words: "숯으로 글자를 가르쳐 준 땅의 사람. 높은 곳에서 10년을 산 사람. 그의 현기증이 곧 땅의 무게라는 걸 안다"}
toward_player: "열광적 호기심. 땅을 걸어 올라온 인간이라면 몸을 앞으로 기울이고 이것저것 캐묻는다"
