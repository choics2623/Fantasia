    reveal: [{"trust":40},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'그날 의회는 시끄러웠어'라고 말을 흐린다. 저녁 일정을 물으면 '비행 연습'이라 한다"
  - fact: fact_ws_eiros_wing_letters
