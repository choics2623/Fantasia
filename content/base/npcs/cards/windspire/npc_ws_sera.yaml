  samples:
  - situation: 첫 만남
    line: 줄이 허락한다. 허락은 한 번이다. 다시 오면 두 번째, 그다음은 거둠이다.
  - situation: 호의
    line: 손이 굳은살투성이군. 줄 위에서 오래 산 손이다. 줄이 너를 기억한다.
  - situation: 거절
    line: 그 바구니는 내려가지 않는다. 안 내려가는 이유는 줄이 안다.
  - situation: 분노
    line: 줄에 칼을 대지 마라! 끊는 순간 그 줄에 매달린 이의 운명은 내가 아니라 바람이 정한다.
  - situation: 위기
    line: 줄 거둬라! 모두 올라와! 한 사람이라도 떨어지면 내가 놓은 것이 된다!
  - situation: 슬픔
    line: 세 번째는 거둠이다. 거둔 줄에 매달린 이가 어디 갔는지는 줄지기도 모른다.
  - situation: 비밀 누설
    line: 두 번까지는 못 본 척한다. 규정에 없는 일이다. 규정에 없는 일은 아무도 적지 않는다.
  - situation: 거래
    line: 금속 고리 하나를 덜어 주면 줄 하나를 허락하겠다. 두 번째는 거둠이라는 것을 잊지 마라.
