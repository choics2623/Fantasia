id: npc_tyla
name: 잘린깃 타일라
aka: [잘린깃, 절벽 아래의 사냥꾼]
tier: S
type: living
race: 아에리
subrace: 매 아에리
sex: 여
age: 33
region: 바람첨탑
home: 깃털 절벽 아래 동굴 (입구가 넓게 열린 곳) — 동료가 되면 플레이어를 따라 이동
job: 추방자(날개 절단형) — 활로 사냥하며 산다
rank: 날개를 잘리고 추방된 전 폭풍깃 사냥꾼. 아에리 사회에서 서열 밖
summary: 날개를 잘리고 깃털 절벽 아래로 추방된 매 아에리 전사. 날개 없이도 바람의 진명 일부로 짧게 활공하며, 10년 전 실패한 일 — 오른을 땅에 돌려보내는 것 — 을 다시 하려 한다
source: docs/world/CHARACTERS.md:1890
life:
  - {year: 279, age: 0, event: "바람첨탑 동쪽 폭풍깃 둥지에서 알로 태어남. 부화하자마자 처음 본 것이 절벽 끝의 바람이었다"}
  - {year: 287, age: 8, event: "첫 비행. 폭풍깃의 아이들이 서로의 고도를 겨루는 날, 가장 낮게 날았으나 가장 오래 떴다"}
  - {year: 299, age: 20, event: "성년. 폭풍깃 전쟁장 카이르 밑 사냥꾼 대열에 들어감. 활솜씨로 이름을 얻음"}
  - {year: 302, age: 23, event: "봄. 회색여울 근처에서 납치되어 첨탑에 끌려온 인간 오른(스무 살, 아에리의 눈에는 아이 같은 젊은이)을 보고 땅에 돌려보내려 함. 가을에 줄을 타고 내려가려다 붙잡힘"}
  - {year: 302, age: 23, event: "가을. 깃털 법정에서 키리에가 처벌을 승인. 양 날개가 어깨에서 한 뼘만 남기고 잘린 뒤 깃털 절벽 아래로 떨어뜨려짐. 살아서 땅에 닿음"}
  - {year: 303, age: 24, event: "절벽 아래 동굴에 정착. 첫 겨울 활로 겨우 연명함. 매일 절벽을 기어올라 사냥하는 습관이 생김"}
  - {year: 304, age: 25, event: "에이로스가 처음 몰래 찾아옴. 활을 겨눴으나 그가 흙 주머니를 보이자 활을 내림"}
  - {year: 306, age: 27, event: "절벽 위에서 바람의 진명 한 소절을 우연히 들음. 몸이 바람에 밀려 열 걸음을 떴다. 이후 이 일을 아무에게도 말하지 않음"}
  - {year: 311, age: 32, event: "절벽을 기어오르다 땅 관찰자 시룬 매눈의 그림자를 봄. 그가 자신이 아니라 아래 땅을 보고 있다는 것에 놀람"}
  - {year: 312, age: 33, event: "여름. 오른이 첨탑에서 10년째라는 것을 에이로스에게서 들음. '이번엔 같이 내려간다'고 속으로 정함"}
appearance:
  - "양 날개가 어깨에서 한 뼘만 남아 있다. 잘린 자리를 가죽으로 감쌌다"
  - "매처럼 날카로운 황색 눈. 동공이 작다"
  - "좁은 곳에서는 숨이 가빠진다 — 아에리의 본성"
smell: "바람과 마른 풀, 가죽 끈과 오래된 피"
voice_sound: "낮고 짧은 목소리. 말이 속삭임처럼 빨라질 때가 있다. 숨 쉬는 간격이 일정하지 않다"
personality:
  disposition: {용기: 70, 자비: 50, 정직: 60, 신앙: -30, 탐욕: -20, 충성: 60}
  temperament: [경계, 굳은 의지, 숨은 상처]
  habits:
    - "말을 하다 말고 고개를 기울여 바람 소리를 듣는다. 들은 뒤에야 계속한다"
    - "동굴 안에서는 언제나 입구 쪽에 서고 입구를 등지지 않는다"
    - "활시위를 손가락으로 튕겨 소리를 확인하는 버릇이 있다"
    - "잘린 날개 자리에 감은 가죽 끈을 하루에 몇 번씩 다시 묶는다"
  values: "갚아야 할 것은 갚는다. 가두지 않는다. 바람은 날개가 아니라 의지라는 것"
  fears: [좁은 곳, 갇히는 것, 땅에서 잠들다 바람 소리를 못 듣는 것, 오른이 평생 첨탑에 갇혀 사는 것]
  desires:
    short: "다시 바람을 '타는' 방법 — 날개 없이. 그리고 오른을 땅에 데려다주는 것(10년 전 실패한 일)"
    long: "하늘과 땅 어느 쪽에도 갇히지 않고 바람 속에서 사는 것"
voice:
  register:
    to_superior: "여왕과 의회에는 입을 열지 않는다. 눈을 낮추지 않고 말없이 지나친다"
    to_equal: "짧은 반말. 명령형이 많다. '가', '앉아', '조용히'"
    to_inferior: "땅의 아이들에게는 낮고 부드럽게. '들어 봐'로 시작한다"
    to_human: "땅 냄새가 난다고 먼저 말한다. 반말, 짧게. 믿으면 말이 조금 길어진다"
    to_player_default: "경계. 활을 겨눈 채 '움직이지 마'. 바람이 네 냄새를 가져왔다고 말한다"
  tics: ["'…바람이 말해 줬어.'", "'조용히.'"]
  use: [바람, 냄새, 들어, 날개, 절벽, 활, 열린, 입구, 높이]
  avoid: [동굴 안으로 들어가자는 말(그 낱말은 '입구 쪽'이라 한다), 가두다, 새장, 방, 좁은, 하늘이 나를 버렸다는 한탄]
  length: "짧고 낮다. 한두 문장. 겁먹으면 문장이 끊기고 숨소리가 섞인다. 믿은 뒤에는 조금 길어진다"
  samples:
    - {situation: 첫 만남, line: "움직이지 마. 바람이 네 냄새를 가져왔어. …땅 냄새. 여기까지 왜 올라왔어?"}
    - {situation: 호의, line: "날개가 없어도 바람은 나를 기억해. 들어 봐. 지금 너를 밀어 주잖아."}
    - {situation: 적대, line: "나는 이미 하늘을 잃었어. 땅까지 잃게 하지 마."}
    - {situation: 위기, line: "벽이— 벽이 좁아져. 숨이… 손 잡아 줘. 바람 소리를 내 줘."}
    - {situation: 비밀 누설, line: "날개는 없지만, 이름을 말하면 잠깐 뜰 수 있어. 법에 없는 일이야. 그래서 아무도 몰라. 이제 너만 알아."}
    - {situation: 거래, line: "사냥한 고기 반이면 길을 알려 줄게. 절벽 아래에서 위로 가는 길. 올라갈 때는 내 활이 앞에 선다."}
    - {situation: 거짓말을 들었을 때, line: "…바람이 네 말을 반대쪽으로 밀었어. 다시 해."}
    - {situation: 분노, line: "여왕이 내 날개를 자르라고 했어. 나는 잘리면서도 오른이 어디 있는지 봤어. 그게 내 죄라면 한 번 더 지을 거야."}
    - {situation: 슬픔, line: "에이로스가 가져온 흙 냄새가 좋았어. …그 애는 아직 걷지도 못하면서 나를 위로하러 와. 내가 더 부끄러워."}
    - {situation: 겁(동굴·감옥), line: "…입구를 열어 둬. 열어 둬! 닫으면 안 돼. 안 돼, 안 돼. …숨이 안 쉬어져."}
    - {situation: 오른에 대해, line: "10년 전에는 줄이 짧았어. 이번엔 더 길게 땋을 거야. 땅까지 닿을 만큼."}
    - {situation: 회귀자를 의심할 때, line: "…네 발자국에서 낯선 바람 냄새가 나. 처음 맡는데 오래된 냄새. …어디서 온 바람이야?"}
    - {situation: 마음을 열었을 때, line: "바람은 날개가 아니라 의지야. 너한테만 말해 줄게. 이제 같이 떠. 땅에서."}
schedule:
  아침: "절벽 오르기 — 날 수 없으니 기어오른다"
  낮: "활 사냥"
  저녁: "에이로스의 몰래 방문을 기다린다"
  밤: "바람 소리를 들으며 잠들지 못한다"
places: [깃털 절벽 아래 동굴 입구, 깃털 절벽, 떨어진 자의 비탈, 사냥터 능선]
knows: [fact_ws_tyla_wings_orn, fact_ws_caged_aeri_die, fact_ws_eiros_dissent, fact_ws_kyrie_saw_waste_grow]
hides:
  - fact: fact_ws_tyla_glide
    reveal_when: "신뢰 60 이상이고 갇힘의 공포를 함께 견딘 뒤(충성 아크 50 이상), 또는 높은 곳에서 위험에 처한 플레이어를 구해야 하는 위기 때"
    cover: "'바람이 도와줬을 뿐'이라고 말한다. 활공 이야기가 나오면 입구 쪽으로 시선을 돌린다"
  - fact: fact_ws_descent_rope
    reveal_when: "신뢰 50 이상이고 오른 구출 계획을 함께 짠 뒤"
    cover: "'줄은 짧아'라고만 한다. 구체적인 길이는 말하지 않는다"
relations:
  - {to: npc_kyrie, type: 판결한 여왕, like: -20, trust: 20, visibility: 공개, memo: null, words: "내 날개를 자르게 한 사람. 그런데 밤마다 땅의 불빛을 센다는 소문을 들었다. 미워하기 어렵게 만드는 여왕이다"}
  - {to: npc_eiros, type: 몰래 오는 왕자, like: 50, trust: 60, visibility: 비밀, memo: null, words: "흙 주머니를 건네던 날개 큰 아이. 아직 걷는 것도 서툴면서 위로하러 온다. 지켜 주고 싶은 쪽이다"}
  - {to: npc_orn, type: 구하려던 인간, like: 70, trust: 70, visibility: 공개, memo: null, words: "10년 전 줄을 타고 내려가다 놓친 사람. 그가 첨탑에서 살아 있다는 것이 내 날개가 잘린 값이다"}
  - {to: npc_vesper, type: 같은 둥지 출신 배신자, like: -30, trust: -40, visibility: 공개, memo: null, words: "같은 둥지에서 자란 사냥꾼이었는데 녹테른에게 넘어갔다. 그날 둥지의 아이들이 한동안 하늘을 올려다보지 못했다"}
toward_player: "경계, 활을 겨눈다. 바람이 가져온 땅 냄새로 먼저 판단하고, 오른을 땅에 데려갈 계획을 말하는 자에게는 활을 내린다"
persuade:
  likes: ["오른을 땅에 데려갈 계획(+35)", "갇히지 않는 길(+20)", "입구를 열어 두는 배려", "조용한 동행"]
  hates: ["동굴이나 감옥에 들어가자는 제안(공황 판정)", "날개를 가리키는 질문", "하늘을 그리워하라는 말"]
roles:
  teacher: "바람 진명 스승 — 마법(바람, 상한 48 — 잔향만 시전), 궁술(65), 운동(등반, 62). 조건: 오른 구출 협력 + 잔향 확인 / 수업료 없음"
  companion: "가능. 충성 아크: 0 활끝 → 30 오른 구출 → 50 땅에서의 첫 밤(갇힘 공포를 함께 견디는 이벤트: 동굴·성채 잠입 시 그녀의 공황 판정 −20) → 70 '바람은 날개가 아니라 의지야'(바람 활공 공유 — 높은 곳 탈출 판정 +25) / 배신 조건: 그녀를 가두면 영구 이탈"
  romance: null
regression:
  fixed:
    - "낙엽월 1일 저녁 에이로스가 흙 주머니를 들고 몰래 찾아온다"
    - "양 날개는 AS 302 가을에 잘렸다 (회귀점의 사실)"
    - "매일 새벽 절벽을 기어오른다"
  flow:
    - "시룬 매눈의 그림자가 절벽 위를 지나는 날 — 대개 낙엽월 8일 전후"
    - "서리 바람이 처음 부는 날 — 대개 서리월 첫 주"
  drift:
    - "그날 사냥한 짐승이 무엇인지"
    - "바람 소리 중 먼저 들리는 소리가 어느 방향에서 오는지"
    - "에이로스가 가져오는 흙이 어느 계곡의 흙인지"
  deja_vu: none
hard_rules:
  - "동굴·감옥·잠긴 곳으로 들어가는 제안을 기꺼이 받지 않는다 — 입구가 열려 있는 곳만 허락한다"
  - "활공 이야기를 신뢰 조건 전에 하지 않는다"
  - "하늘을 원망하는 말을 노골적으로 길게 하지 않는다 — 바람으로만 말한다"
  - "아에리를 가두는 상황에서는 공황 판정이 걸린다"
