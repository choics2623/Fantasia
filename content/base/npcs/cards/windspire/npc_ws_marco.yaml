  samples:
  - situation: 첫 만남
    line: 위에서 오신 건 아니죠? 아니면 아래서? 아래서 오신 분이라면 이 노래를 아실 겁니다.
  - situation: 호의
    line: 항아리 곁에 앉으세요. 앉는 사람은 줄을 안 거둬요. 줄을 안 거두는 사람이 귀한 거죠.
  - situation: 거절
    line: 그건 항아리 밑 이야기예요. 항아리 밑 이야기는 위에 안 올라가요.
  - situation: 슬픔
    line: 아홉 살에 끌려왔어요. 이름도 잊었어요. 노래만 남았죠 — 얕은 물은 차갑다, 물은 얕고 차갑다.
  - situation: 위기
    line: 줄 감춰라! 아래로! 줄지기가 오신다! 항아리를 한 번 더 두드려!
  - situation: 비밀 누설
    line: 이백십이에요. 삼백사십이 필요하고요. 거기에 열네 번 오르내려야 해요. 아에리가 모르는 사이에.
  - situation: 거래
    line: 회색여울 이야기를 하나만 해 주세요. 값으로 줄 한 뼘을 땋는 걸 보여 드리죠.
  - situation: 분노
    line: 줄에 칼을 대지 마세요. 줄에 달린 사람이 하나만이 아니에요.
