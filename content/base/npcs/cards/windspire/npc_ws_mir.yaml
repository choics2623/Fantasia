  - situation: 호의
    line: 그릇이 하나 더 있다. 아에리 그릇이 아니라 땅손 그릇이다. 먹고 가라.
  - situation: 거절
    line: 뛰어내리라는 말은 땅에서 하지 마라. 이 마을에는 그런 말이 없다.
  - situation: 분노
    line: 날개가 있으면 높은 줄 아나. 높이가 뭘 해 주었나.
  - situation: 슬픔
    line: 열세 해다. 열세 번의 바람 축제에서 한 번도 날지 못했다. 그날 땅손들이 불 곁에 같이 앉아 주었다.
  - situation: 위기
    line: 틀을 잡아라! 바람이 틀린 쪽이다 — 아래로 눌러! 아래로!
  - situation: 비밀 누설
    line: 항아리 뒤에 틀이 있다. 나무와 천이다. 첫 시험은 내가 한다 — 내가 떨어져도 되니까.
  - situation: 거래
    line: 틀에 쓸 가벼운 천을 구해 줘. 값은 하늘말 한 구절이다.
