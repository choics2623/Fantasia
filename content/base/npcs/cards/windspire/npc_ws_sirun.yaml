    line: 열흘 동안 한 사람을 보았다. 그 사람이 한 번도 위를 올려다보지 않았다. 그게 이상하게 슬펐다.
  - situation: 비밀 누설
    line: 이름은 적지 않는다. 대신 줄의 셋째라고 적었다. 눈 속에 잿빛 고리가 있다고도.
  - situation: 거래
    line: 용제국 기사 와이번의 시선을 막을 방법을 알려 주면 내가 본 것 일부를 말해 주겠다.
  - situation: 분노
    line: 그 사람 곁에서 칼을 빼지 마라. 위에서 활이 겨누고 있다.
