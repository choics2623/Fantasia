  - situation: 호의
    line: 이름은 묻지 마라. 이름은 적지 않는다. 대신 본 것은 말해 주겠다.
  - situation: 거절
    line: 그것은 여왕의 일이다. 여왕의 일은 땅에서 말하지 않는다.
  - situation: 위기
    line: 내려와라! 와이번이 먼저 본다 — 그 줄에서 시선을 떼라!
