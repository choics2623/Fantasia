  samples:
  - situation: 첫 만남
    line: (숨을 고른다) …날개가 쓸려요. 위를 보지 말고 이쪽을 봐요. 숨이 짧아서 길게 말 못 해요.
  - situation: 호의
    line: 손이 따뜻하네요. 위에서는 아무도 안 닿는데.
  - situation: 거절
    line: 목걸이는 가져가세요. 대신 내 가문에 소식을. 값은 가문이 치러요.
  - situation: 위기
    line: (숨이 가쁘다) 그물을 걷어요! 한 겹이라도! 심장이 — 짧아져요!
  - situation: 슬픔
    line: (숨이 짧다) …그물이 낮아요. 날개를 펴면 닿아요. 한 번 폈다가 접었어요.
  - situation: 비밀 누설
    line: 내 목걸이를 가져가라고 했어요. 도적이 믿지 않았어요. 믿으면 풀려야 하니까요.
  - situation: 거래
    line: 나를 풀어 주면 가문이 값을 치러요. 값은 가문이 정해요. 내가 정하는 건 감사예요.
  - situation: 분노
    line: (숨을 고른다) …날 가둔 사람을 다치게 하지 마세요. 아에리의 가장 오래된 법이 그를 쓸어 버리니까요.
