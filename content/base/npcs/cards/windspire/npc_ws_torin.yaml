    line: 줄이 140명을 내려놓는 계약인가, 140명을 사는 계약인가. 문구가 정하지 못한 것은 내 책임이 아니오 — 아니, 내 책임이오.
  - situation: 위기
    line: 창고를 닫으시오! 깃털에 불이 붙었소 — 금속이 아니라 깃털이오!
  - situation: 비밀 누설
    line: 라츠에게 곡식을 팔았소. 장부에서 지웠소. 지운 것이 서명을 지운 것은 아니오.
  - situation: 거래
    line: 130m. 서명 하나. 문구는 같이 쓰시오. 대가 칸은 비워 두지 않겠소.
