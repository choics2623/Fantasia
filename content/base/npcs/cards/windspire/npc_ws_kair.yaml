  - situation: 호의
    line: 너는 땅 이야기를 정확하게 하는구나. 정확한 이야기는 높이 올라가면 더 무겁다.
  - situation: 거절
    line: 그 전쟁은 땅의 것이다. 땅의 전쟁에는 하늘이 이름을 올리지 않는다.
  - situation: 분노
    line: 나를 땅의 창 앞에 세우려는 자는 먼저 바람 앞에 서라.
  - situation: 슬픔
    line: 절벽 중턱의 인간들이 부르는 노래를 들으면 사냥이 무겁다. 노래가 무엇을 말하는지는 모르겠지만.
  - situation: 위기
    line: 급강하! 폭풍깃, 전원 올라라! 땅의 창은 높이 못 닿는다!
  - situation: 비밀 누설
    line: 표 둘이다. 에이로스가 오면 던지지 않는다. 그것이 내 서약이다. 서약은 바람에 한 것이라 돌처럼 무겁다.
  - situation: 거래
    line: 땅 이야기 하나와 표 하나를 바꾸자. 이야기가 맞으면 표는 따라간다.
