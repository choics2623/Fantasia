  - {to: npc_tyla, type: 구해 주려던 사람, like: 75, trust: 70, visibility: 공개, memo: null, words: "내 줄을 끊기게 한 날개 없는 사냥꾼. 그녀의 날개가 잘린 값이 내가 아직 여기 있는 이유다"}
