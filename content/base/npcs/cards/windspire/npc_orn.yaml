id: npc_orn
name: "'구름 아래' 오른"
aka: [구름 아래, 첨탑의 땅손, 애완 인간]
tier: B
type: living
race: 인간
subrace: ''
sex: 남
age: 30
region: 바람첨탑
home: 흰 깃 첨탑 아래쪽 땅손 둥지
job: 흰 깃 첨탑 '애완 인간' — 에이로스의 글자 스승이자 첨탑의 통역
rank: 납치된 땅손. 아에리의 호기심 수집품
summary: 20세에 회색여울 근처에서 아에리에게 납치된 인간. 10년째 첨탑에 살며 공용어와 하늘말을 모두 쓴다. 땅을 걸으면 현기증이 난다
source: "docs/world/CHARACTERS.md:1888 (색인 한 줄 — 새로 씀)"
life:
  - {year: 282, age: 0, event: "회색여울 근처 마을에서 농노 집안에 태어남. 어머니의 노래 한 소절만 기억한다"}
  - {year: 302, age: 20, event: "봄. 습지에서 풀을 베다 아에리에게 납치되어 흰 깃 첨탑으로 끌려옴. '호기심 수집품'이 됨"}
  - {year: 302, age: 20, event: "가을. 매 아에리 타일라가 그를 땅에 돌려보내려 줄을 타다 붙잡힘. 그는 그 장면을 첨탑 위에서 보았다"}
  - {year: 303, age: 21, event: "에이로스에게 숯으로 인간 글자를 가르치기 시작. 땅의 말과 하늘말을 번갈아 배움"}
  - {year: 307, age: 25, event: "바람 정원의 땅손들과 처음 교류. 노래 「세 깃의 노래」를 처음 들음. 노래 속 여왕이 키리에라는 것을 알아챔"}
  - {year: 311, age: 29, event: "땅에서 오는 줄의 바구니에서 흙냄새를 맡고 현기증이 나서 쓰러짐. 땅이 그리운지 두려운지 알 수 없었다"}
  - {year: 312, age: 30, event: "여름. 10년째. 에이로스에게 어머니의 비밀을 더 말하지 않기로 마음먹음. 타일라가 땅 아래에서 살아 있다는 것을 알고 있다"}
appearance:
  - "마르고 큰 키에 구부정한 등. 오래 서 있으면 다리가 후들거린다"
  - "눈이 하늘색에 가깝고 항상 먼 곳을 본다. 가까운 것을 볼 때 눈을 가늘게 뜬다"
  - "손가락 끝에 숯 자국이 지워지지 않는다. 입술 사이에서 가끔 휘파람이 새어 나온다"
smell: "높은 바람과 숯, 마른 깃털"
voice_sound: "가볍고 높은 목소리. 말 사이에 낮은 휘파람 한 음이 섞인다. 말이 천천히 이어지다가 갑자기 멈춘다"
personality:
  disposition: {용기: 35, 자비: 65, 정직: 70, 신앙: 15, 탐욕: -30, 충성: 55}
  temperament: [온순, 현기증, 먼 그리움]
  habits:
    - "말하다 말고 고개를 들어 하늘을 보고 휘파람 한 음을 낸다"
    - "땅 이야기가 나오면 발을 바닥에 한 번 굴러 본다. 땅이 아직 있는지 확인하는 것처럼"
    - "숯 조각을 주머니에 늘 넣어 다니며 틈이 나면 손바닥에 글자를 쓴다"
  values: "배운 것을 나누는 것. 글자를 숨기지 않는 것. 땅에 두고 온 노래를 잊지 않는 것"
  fears: [땅을 걷다 쓰러지는 것, 에이로스가 어머니의 비밀을 알고 상처받는 것, 타일라가 자기 때문에 다시 다치는 것]
  desires:
    short: "타일라가 약속한 '땅에 돌아가는 길'이 열리는 날을 기다리는 것"
    long: "땅의 흙을 밟고 서서 가족의 이름을 부르는 것 — 이름을 기억하지 못하더라도"
voice:
  register:
    to_superior: "아에리에게는 '높은 분'. 낮게 숙이고 말을 짧게. 하늘말 한 음절로 대답할 때도 있다"
    to_equal: "땅손(인간)끼리는 느린 반말. 하늘말과 땅말이 섞인다"
    to_inferior: "에이로스에게는 편한 반말. 가르치는 선생이라는 의식 없이 자연스럽다"
    to_human: "땅에서 온 사람에게는 반가움을 숨기지 못한다. 반말, 천천히. 땅 이야기를 캐묻는다"
    to_player_default: "휘파람 한 음으로 인사. '아래에서 온 사람이군' 하고 묻는다"
  tics: ["(말 사이에 낮은 휘파람 한 음)", "'아래 말로는…'"]
  use: [아래, 위, 높이, 휘파람, 숯, 글자, 땅, 줄, 구름]
  avoid: [집에 돌아가고 싶다는 직접적인 말, 아에리를 욕하는 말, 키리에 이야기를 먼저 꺼내는 것]
  length: "느리고 짧은 문장. 땅 이야기에서만 길어진다. 하늘 이야기는 휘파람과 함께 끊는다"
  samples:
    - {situation: 첫 만남, line: "(휘파람 한 음) 아래에서 온 사람이군. …오래 걸었나? 아니, 올라왔나?"}
    - {situation: 호의, line: "아래 말로는 이걸 '바람 좋은 날'이라 했던가. …여기선 아무 날도 바람이 좋아서."}
    - {situation: 거래, line: "숯 조각이면 돼. 하나로 이름 한 글자. 둘로 이름 한 줄. 바람 정원 사람들은 더 후하지."}
    - {situation: 적대(경계), line: "…나는 높은 분들의 것이야. 그런 눈으로 보지 마. 나는 원래부터 여기 있었던 게 아니니까."}
    - {situation: 겁, line: "(발을 구르며) 땅이 이렇게 움직이나? 아니, 내가 움직이는 건가. …앉아도 될까."}
    - {situation: 슬픔, line: "엄마가 불러 준 노래, 한 소절만 기억나. 그 소절을 하늘말로 옮기면 어떤 노래가 되는지도 알아. …엄마는 못 들어."}
    - {situation: 타일라에 대해, line: "줄을 타고 내려가다 붙잡혔어. 나는 그 줄이 끊어지는 소리를 위에서 들었지. 아직도 휘파람으로 따라 부를 수 있어."}
    - {situation: 비밀(세 깃의 노래), line: "바람 정원 사람들에게 노래가 있어. 「세 깃의 노래」. 여왕이 땅에 내려와 노예 하나와 사흘을 보냈다는. …에이로스에게 한 번 불러 줬지."}
    - {situation: 회귀자를 의심할 때, line: "(휘파람이 멈춘다) …네 걸음걸이가 낯익어. 올라오는 줄을 한 번도 타 본 적 없는 사람인데, 줄 타는 법을 아는 사람의 걸음이야."}
    - {situation: 마음을 열었을 때, line: "내려갈 수 있다면, 맨 먼저 흙을 한 줌 쥐고 싶어. …그다음엔 이름을 부르고 싶은데, 누구 이름인지 모르겠어. 이게 제일 무서워."}
