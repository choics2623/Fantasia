  samples:
  - situation: 첫 만남
    line: 누구 보냈소. 장터 쪽이오, 위쪽이오. 위쪽이면 돌아가시오. 위쪽은 전령이 아니라 칼을 보내니까.
  - situation: 호의
    line: 당신은 몸값 이야기를 이해하는군. 몸값은 장사요. 장사는 정직해야 오래 가오.
  - situation: 거절
    line: 새는 안 내놓소. 값이 올 때까지는.
  - situation: 위기
    line: 새장 문 잠가라! 아니, 열지 마! 위에서 새들이 온다 — 쏘지 마! 쏘면 안 돼!
  - situation: 슬픔
    line: 새가 말을 안 해. 물도 안 마셔. 어제는 날개를 한 번 폈다. 폈다가 접는 걸 보고 이틀을 잤소.
  - situation: 비밀 누설
    line: 그물을 지붕 대신 덮었소. 지붕을 올릴 줄 모르오. 지붕을 올리면 죽는다고 해서.
  - situation: 거래
    line: 전령을 구해 주시오. 위로 가서 요구서를 던지고 오기만 하면 되오. 돌아오면 새를 풀어 주겠소.
  - situation: 분노
    line: 새를 건드리지 마시오! 몸값이 달린 새요! 건드린 놈은 장터에서 목을 매야 하오!
