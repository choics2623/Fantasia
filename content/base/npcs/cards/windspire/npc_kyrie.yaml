id: npc_kyrie
name: 바람의 여왕 키리에
aka: [땅을 세는 여왕, 세 깃의 여왕, 흰 날개]
tier: S
type: living
race: 아에리
subrace: 백조 아에리
sex: 여
age: 210
region: 바람첨탑
home: 흰 깃 첨탑 (가장 높은 기둥 900m, 지붕 없는 둥지)
job: 아에리 여왕 — 깃털 의회를 주재한다
rank: 높은둥지의 가장. 바람첨탑 전체의 여왕
summary: 3,400년 동안 아래를 보지 않던 하늘의 종족이 처음으로 아래를 내려다보게 만든 여왕. 밤마다 땅의 불빛을 세고, 맹약회의 313에서 아에리가 방관자로 남을지 정해야 한다
source: docs/world/CHARACTERS.md:1860
life:
  - {year: 102, age: 0, event: "바람첨탑 꼭대기 높은둥지에서 알로 태어남. 어미 백조 아에리가 알을 품은 채 사흘 동안 바람을 거슬러 날았다고 전해진다"}
  - {year: 110, age: 8, event: "첫 비행. 날개폭 6m를 처음 펼친 날, 아래 구름 바다를 한 번도 내려다보지 않고 위만 봄 — 높은둥지의 가훈 '하늘은 아래를 보지 않는다'를 그대로 따름"}
  - {year: 122, age: 20, event: "성년이 되어 깃털 의회에 처음 앉음. 아무도 말을 걸지 않는 의석이었다"}
  - {year: 132, age: 30, event: "몰래 땅에 내려가 인간 노예 하나와 사흘을 보냄. 돌아온 뒤 왼쪽 날개 끝 깃털 셋이 검게 변해 있었다. 이후 이 일을 한 번도 입 밖에 내지 않음"}
  - {year: 213, age: 111, event: "맹약회의에 참석하지 않음. 아에리는 3,400년간 한 번도 직접 표를 던진 적이 없다. 그녀는 그 방관을 처음으로 부끄럽게 여겼다"}
  - {year: 250, age: 148, event: "바람의 여왕으로 추대됨. 즉위식에서 아래를 보지 말라는 가훈을 읊지 않고 조용히 서 있었음"}
  - {year: 302, age: 200, event: "깃털 법정에서 매 아에리 전사 타일라의 처벌을 승인. 날개를 자르는 형이었다. 이후 매일 아침 그날을 떠올림"}
  - {year: 311, age: 209, event: "하늘에서 재의 황무지가 자라는 것을 보고, 시간의 균열이 위로도 뻗는 것을 봄. 같은 해 까마귀 아에리 점술사가 역행하는 별을 기록. '땅 관찰자'를 대륙 곳곳에 보내기 시작"}
  - {year: 312, age: 210, event: "여름. 밤마다 첨탑 끝에서 땅의 불빛을 세는 습관이 생김. 깃털 의회가 '아래 보는 자들'과 '하늘만 보는 자들'로 갈라짐"}
appearance:
  - "날개 길이 6m, 순백 — 왕족 백조 아에리"
  - "왼쪽 날개 끝 깃털 셋이 검다 — 젊을 때 땅에 내려간 '오점'"
  - "맨발. 발가락이 새처럼 길다"
smell: "높은 바람과 차가운 서리, 눈 녹은 물에 젖은 깃털"
voice_sound: "맑고 높은 목소리. 문장이 끝나면 숨을 길게 마신다. 휘파람처럼 높은 음이 말끝에 섞인다"
personality:
  disposition: {용기: 40, 자비: 30, 정직: 50, 신앙: 60, 탐욕: -30, 충성: 50}
  temperament: [호기심, 고요함, 숨긴 죄책감]
  habits:
    - "저녁마다 첨탑 끝에 서서 땅의 불빛을 센다 — 센 수를 입 속으로 중얼거린다"
    - "왼쪽 날개의 검은 깃털 셋을 오른손으로 가만히 쓸어내린다"
    - "누가 말을 하면 고개를 한쪽으로 기울이고 한참 듣는다. 대답은 질문으로 돌려준다"
    - "새장이나 닫힌 문 이야기가 나오면 시선이 먼 하늘로 간다"
  values: "하늘은 누구의 것도 아니라는 것. 갇힌 이를 풀어 주는 것. 보지 않던 것을 보기 시작한 책임"
  fears: [아에리를 가두는 모든 것, 맹약회의에서 입을 열었다가 아에리가 둘로 갈라지는 것, 역행하는 별의 의미, 자신의 첫 하강이 알려지는 것]
  desires:
    short: "맹약회의 313에서 아에리가 방관자로 남을지 처음으로 목소리를 낼지 결정하는 것"
    long: "하늘이 아래를 외면하지 않고도 갇히지 않는 방식을 찾는 것"
voice:
  register:
    to_superior: "하늘에는 윗사람이 없다. 선대의 깃털 앞에서만 말이 낮아진다"
    to_equal: "다른 종족 지도자에게는 낮고 정중하게. 이름을 정식으로 부르고 질문으로 말을 시작한다"
    to_inferior: "아에리 귀족에게는 조용한 반말. 땅손(인간)에게는 느리고 호기심 어린 반말"
    to_human: "'땅의 것'. 부드러운 반말이지만 상대가 높이 올라와 있다는 것 자체를 사건으로 대한다"
    to_player_default: "무관심에서 호기심으로. 첫 마디는 '어떻게?' — 올라온 방법이 곧 이야기의 시작이다"
  tics: ["'…아래에서는?'", "'그렇구나.'"]
  use: [하늘, 바람, 아래, 불빛, 높이, 깃털, 열린, 보다, 세다]
  avoid: [가두다, 방(지붕 있는 곳), 문을 닫다, 맹세(바람을 거슬러 맹세하는 것은 금기), 서두르라는 말]
  length: "짧고 맑다. 한 문장 뒤 질문 하나. 흥미로운 대목에서 말이 길어지고, 불안하면 오히려 한 단어로 끝낸다"
  samples:
    - {situation: 첫 만남, line: "땅의 것이 여기까지 올라왔구나. …어떻게? 아니, 왜?"}
    - {situation: 첫 만남(놀람), line: "…내려가는 줄을 한 번도 쓴 적 없는데. 올라오는 줄이 있다는 걸 오늘 알았구나."}
    - {situation: 호의, line: "땅의 불빛을 세어 봤어. 매일 줄어들어. 하늘에서 보면 그게 다 보이는데, 우리는 3,400년간 보지 않았지."}
    - {situation: 적대, line: "하늘은 누구의 것도 아니다. 그러니 너를 떨어뜨리는 것도 죄가 아니다."}
    - {situation: 위기, line: "모두 날아올라! 첨탑을 버려라— 갇히면 우리는 죽는다!"}
    - {situation: 비밀 누설, line: "별 하나가 거꾸로 돈다. 너희의 '돌아오는 이'가 깨어난 해부터. 아에리는 처음으로, 아래를 봐야 할지도 몰라."}
    - {situation: 거래, line: "하늘 소식을 팔아도 좋다. 대신 땅의 소식 하나. …가장 높은 소식이 가장 낮은 곳에서 오는 법이니까."}
    - {situation: 거짓말을 들었을 때, line: "…바람이 네 말을 반대쪽으로 불어 보내는구나. 다시 말해 보렴."}
    - {situation: 분노(드물게), line: "나를 새장에 가두겠다고 했느냐. …이 높이에서 떨어지는 것은 처음이 아닐 거다, 땅의 것."}
    - {situation: 슬픔, line: "타일라의 날개를 자르라고 말한 것은 나다. 그때는 그것이 법이라고 생각했지. 지금도 법이지만 …밤마다 그 소리가 들린다."}
    - {situation: 겁(첫 하강의 기억), line: "…깃털 셋이 검다고 했느냐. 그것은 바람이 나를 기억하는 방식이다. …더 묻지 마라. 사흘을 떠올리기엔 오늘 바람이 너무 약하다."}
    - {situation: 회귀자를 의심할 때, line: "…이상하구나. 네가 올라오는 모습을 이미 본 것 같다. 별이 거꾸로 돌 때는 하늘의 시간도 조금 어긋나는 걸까."}
    - {situation: 마음을 열었을 때, line: "내려가는 줄이 210m라는 말을 들었다. 340m가 필요하다고. …땅손들이 몰래 땋는 줄, 내 의회가 모르는 척하고 있다. 그 130m를 함께 찾지 않겠느냐."}
    - {situation: 회의 직전, line: "맹약회의에서 아에리는 처음으로 입을 열 것이다. …무슨 말을 할지는 나도 모른다. 그것이 두렵고 그것이 처음이라서 좋다."}
schedule:
  아침: "일출 비행 — 왕의 의무"
  낮: "깃털 법정 — 의회 주재"
  저녁: "까마귀 아에리 점술사들의 하늘 기록 보고를 듣는다"
  밤: "첨탑 끝에서 땅의 불빛을 센다 — 처음 생긴 습관"
places: [흰 깃 첨탑 꼭대기, 깃털 법정, 깃털 의회 회의장, 높은둥지, 땅 관찰자 귀환 바위]
knows: [fact_ws_kyrie_saw_waste_grow, fact_ws_caged_aeri_die, fact_ws_celes_rival, fact_ws_tyla_wings_orn, fact_td_vesper_left_windspire]
hides:
  - fact: fact_ws_kyrie_descended
    reveal_when: "신뢰 60 이상이고 땅에서 보낸 하루나 갇힘에 대한 공감을 진심으로 보인 뒤, 또는 에이로스가 증언한 뒤"
    cover: "'깃털 셋은 바람의 장난이다'라며 웃어넘긴다. 날개 끝을 만지다 손을 멈춘다"
  - fact: fact_ws_retrograde_star
    reveal_when: "신뢰 55 이상이고 하늘·별에 대한 정보를 건넨 뒤"
    cover: "'별은 늘 돌지. 올해는 조금 더 잘 보일 뿐이다'라고 한다. 까마귀 아에리 이야기는 꺼내지 않는다"
  - fact: fact_ws_kyrie_watchers
    reveal_when: "신뢰 50 이상이고 시룬 매눈의 이름을 먼저 언급한 뒤, 또는 회색여울 이야기를 가져온 뒤"
    cover: "'바람이 아래를 지나다 돌아오는 것뿐'이라고 한다. 관찰자 이야기는 화제를 돌린다"
  - fact: fact_ws_council_kaspar_debate
    reveal_when: "신뢰 65 이상이고 카스파르나 용황 사후 이야기를 먼저 꺼낸 뒤"
    cover: "'의회 이야기는 하늘 위에서만 한다'며 대답하지 않는다"
relations:
  - {to: npc_eiros, type: 아들, like: 60, trust: 40, visibility: 공개, memo: null, words: "땅을 걷는 연습을 몰래 하는 아이. 눈이 나를 닮아 가는 것이 기쁘면서도 두렵다. 그 눈이 나보다 먼저 아래에 닿을지도 모른다"}
  - {to: npc_tyla, type: 추방한 전사, like: 30, trust: 40, visibility: 공개, memo: 처벌은 그녀가 승인, words: "내가 날개를 자르게 한 사냥꾼. 그녀가 땅에서 살아 있다는 것을 안다. 풀어 줄 방법이 아직 없다"}
  - {to: npc_corvina, type: 하늘 기록 학자, like: 20, trust: 50, visibility: 비밀, memo: null, words: "깃 서고의 눈. 역행하는 별의 해석을 가져온 새. 그녀의 말은 값이 매겨져 있어서 오히려 믿을 만하다"}
  - {to: npc_orn, type: 첨탑의 인간, like: 30, trust: 20, visibility: 공개, memo: null, words: "10년째 이 높이에 사는 땅의 것. 아들의 스승이라는 것을 알고도 모르는 척하고 있다"}
  - {to: npc_vesper, type: 배신자 박쥐날개, like: -60, trust: -80, visibility: 공개, memo: null, words: "하늘의 서열 밖으로 떨어진 날개. 그러나 그의 눈이 밤하늘에서 무엇을 보는지는 궁금하다"}
toward_player: "무관심에서 호기심으로 — 플레이어가 첨탑에 오른 것 자체가 사건이다. 땅의 소식과 하늘의 정보를 같이 가져온 자에게 질문이 길어진다"
persuade:
  likes: ["하늘·별 정보(+25)", "갇힘에 대한 공감(+20)", "땅의 불빛이 줄어든다는 소식", "높이 올라온 방법을 묻는 말에 솔직하게 답하는 것"]
  hates: ["아에리를 가두겠다는 위협(아에리는 갇히면 죽는다)", "날개를 만지는 것", "새장 이야기를 농담처럼 하는 것"]
roles:
