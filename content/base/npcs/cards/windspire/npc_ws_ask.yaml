  - situation: 호의
    line: 당신은 값을 아는 눈이군. 값을 아는 눈에게는 보고서 한 장을 거저 주겠다.
  - situation: 거절
    line: 그 경로는 팔지 않는다. 팔지 않는 것이 하나 있어야 파는 것이 값을 갖는다.
  - situation: 위기
    line: 보고서를 불로! 두 벌 모두! 누가 읽기 전에!
  - situation: 슬픔
    line: 서리 길에서 오는 행렬에 아이 둘이 보였다. 어디서 본 눈이었는데 기억나지 않는다.
  - situation: 비밀 누설
    line: 경로는 팔았다. 아이들의 경로다. 이름 없는 자들의 것인 줄 알면서.
  - situation: 거래
    line: 경로 하나 값으로 서리 길 행렬을 서고에서 지워 드리겠다. 그쪽 값은 같은 무게다.
  - situation: 분노
    line: 내가 파는 것은 본 것이지 사람이 아니다. 사람은 사는 놈이 책임진다.
