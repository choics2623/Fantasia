    line: (위를 본다) 삼백사십 미터예요. 정확해요. 몸으로 알아요.
  - situation: 호의
    line: 손이 곧아요. 줄 위에서 오래 산 손이에요. 제가 떨어진 줄을 아세요?
  - situation: 거절
    line: 그날 이야기는 안 해요. 안 하면 안 떨어져요.
  - situation: 위기
    line: 줄이 흔들려요! 매듭이 세 번째 — 이게 끊어지면 열 명이 한꺼번에!
