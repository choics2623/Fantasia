    line: 그날 바위 턱이 세 번 있었어요. 세 번째에서 눈을 떴어요. 아래에 사람이 있었어요.
  - situation: 비밀 누설
    line: 줄은 삼백사십이 필요해요. 그보다 짧으면 마지막 열 걸음이 허공이에요.
  - situation: 거래
    line: 계약서를 읽어 주세요. 읽어 주시면 제가 높이를 한 번 더 정확히 말해 드리죠.
  - situation: 분노
    line: 줄이 짧다고 하지 마세요. 짧아서 떨어진 사람이 저예요.
