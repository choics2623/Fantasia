  - situation: 호의
    line: 너는 올려다볼 줄 아는구나. 올려다보는 눈이 가장 높은 눈이다.
  - situation: 거절
    line: 하늘은 아래의 일을 맹세하지 않는다. 맹세하는 순간 하늘이 아니다.
  - situation: 분노
    line: 추락을 하강이라 부르지 마라. 이름이 사실을 바꾸지는 못한다.
  - situation: 슬픔
    line: 어린 날 위에서 처음으로 아래를 본 적이 있다. 아주 짧게. 그 짧은 한 순간이 지금까지 부끄럽다.
  - situation: 위기
    line: 균열이다! 균열이 이쪽이다 — 아니다, 아무것도 없다! 모두 위를 봐라!
  - situation: 비밀 누설
    line: 표를 받았다. 가문 둘. 값은 폭풍깃의 침묵이다. 바람이 알고 있고 나도 알고 있다.
  - situation: 거래
    line: 내 대표 자리를 인정하면 땅손의 줄은 한 해 더 허락하겠다. 두 해는 약속하지 않는다.
