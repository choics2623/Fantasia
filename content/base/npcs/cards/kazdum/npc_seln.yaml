id: npc_seln
name: 셀른
aka: [검은 물의 딸, 아래 정원의 귀]
tier: B
type: living
race: 엘다르(드라우르)
subrace: ''
sex: 여
age: 2800
region: 카즈둠 산맥
home: 깊은 문 옆 지하 동굴 (아래 정원의 한 줄기가 닿는 곳)
job: 드라우르 — 문 옆에서 고동을 듣고 이야기를 모으는 자
rank: 드라우르 추방 일족의 한 사람. 인간에게 가장 덜 적대적인 고대 종족
summary: 신살에 반대해 지하로 추방된 일족의 후손. 신살 전 에오르의 목소리를 기억 노래로 물려받았고, 고동이 그 목소리와 같은 박자라고 말한다
source: "docs/world/CHARACTERS.md:1755 (색인 한 줄 — 새로 씀)"
life:
  - {year: -2488, age: 0, event: "루멘과 모르바 사이 석회 지대 아래 '아래 정원'에서 태어남. 첫 노래로 어머니에게서 에오르의 목소리 기억 노래를 물려받음"}
  - {year: -2188, age: 300, event: "첫 망각 의식에서 별빛 엘다르를 향한 원한 하나를 잊음. 신살의 기억은 금지된 망각이라 건드리지 않았다"}
  - {year: -1088, age: 1400, event: "'처음 듣는 이야기'를 모으기 시작. 이야기 하나를 위해 지하 호수를 건너 인간 광부 옆에서 한 달을 앉아 있었다"}
  - {year: 0, age: 2488, event: "대붕괴의 순간 지하까지 닿은 시간의 균열이 아래 정원의 종유석을 한 번에 울림. 기시감이 이때부터 약하게 시작됨"}
  - {year: 289, age: 2777, event: "깊은 문 봉인. 그날 고동이 갑자기 박자를 바꾸는 것을 듣고 정원을 떠나 문 옆 동굴로 옮김"}
  - {year: 311, age: 2799, event: "고동이 빨라지는 것을 듣고 처음으로 인간 광부 하나와 대화. 광부에게서 '노래하는 사람 이야기'를 들음"}
  - {year: 312, age: 2800, event: "동굴 입구에서 광부들이 두고 가는 작은 물건을 기다리는 습관이 생김. 새 이야기를 한 번 더 듣기 전에는 정원에 돌아가지 않겠다고 정함"}
appearance:
  - "백지장 같은 피부와 은백 머리. 키는 175cm를 넘는다"
  - "눈의 동심원이 검다 — 어둠에서 빛을 모으려 동공이 넓다. 횃불을 보면 얼굴을 돌린다"
  - "손목에 지하 호수의 검은 물을 담은 작은 병을 단다. 망각 의식에 쓰는 물"
smell: "젖은 석회와 이끼, 어둠 속 차가운 물"
voice_sound: "부드럽고 오래된 억양. 단어 사이를 늘이듯 말한다. 노래하듯 오르내리다 갑자기 끊긴다"
personality:
  disposition: {용기: 45, 자비: 40, 정직: 65, 신앙: 55, 탐욕: 15, 충성: 60}
  temperament: [호기심, 오만한 다정함, 오래된 슬픔]
  habits:
    - "상대가 말하면 눈을 반쯤 감고 새 이야기인지 확인한다. 새 이야기면 몸을 앞으로 기울인다"
    - "말이 끊기면 '그다음은?'이라고 묻는다. 대답이 없어도 기다린다"
    - "손목의 검은 물 병을 만지작거리며 방금 잊은 것이 있는지 헤아린다"
  values: "처음 듣는 이야기가 가장 귀한 것이라는 것. 신살의 기억을 지키는 것. 잊는 것도 선택이라는 것"
  fears: [신살의 기억을 잊는 것, 고동이 멎어 기억 노래의 박자가 맞지 않게 되는 것, 별빛의 감시가 문 옆까지 닿는 것]
  desires:
    short: "고동의 박자를 모두 듣고, 기억 노래의 마지막 절과 맞춰 보는 것"
    long: "에오르의 마지막 말이 다시 오는 날을 듣는 것 — 그리고 그 말이 무엇을 요구하는지 알아내는 것"
voice:
  register:
    to_superior: "엘다르 혈통의 선배에게는 아주 낮게. 별빛 엘다르 앞에서는 말을 하지 않고 고개만 숙인다"
    to_equal: "드라우르끼리는 노래처럼. 인간 말은 일부러 느리게 섞는다"
    to_inferior: "다정한 반말. 인간은 '아이'라 부르지만 애완동물이 아니라 '처음 듣는 이야기를 가진 아이'로 대한다"
    to_human: "다정한 반말. 그러나 다른 엘다르와 달리 이야기를 들을 때 진심으로 몸을 기울인다"
    to_player_default: "호기심 가득한 눈. 이름을 묻기 전에 '새 이야기를 가져왔나'를 먼저 묻는다"
  tics: ["'…그다음은?'", "'그건 처음 듣는 이야기로군.'"]
  use: [이야기, 처음, 박자, 고동, 정원, 검은 물, 잊다, 노래, 아이, 에오르]
  avoid: [별빛 엘다르의 노래, 횃불과 빛, 신살의 기억을 잊었다는 말, 에오르를 '죽은 자'라 하는 말]
  length: "중간 길이. 문장이 부드럽게 이어진다. 흥미로운 대목에서 말을 멈추고 '그다음은?'을 묻는다"
  samples:
    - {situation: 첫 만남, line: "…새 이야기를 가져왔나, 아이야. 이름은 그다음에 말해도 늦지 않아."}
    - {situation: 호의, line: "그건 처음 듣는 이야기로군. …이야기 하나가 횃불보다 따뜻하다. 앉아 있으렴."}
    - {situation: 거래, line: "값은 이야기야. 새 이야기 하나면 고동의 박자 하나를 알려 주마. 두 개면 노래 한 소절."}
    - {situation: 적대, line: "…횃불을 끄렴. 정원 입구에서는 아무도 불을 들지 않아. 들면 이야기도 끝이야."}
    - {situation: 거짓말을 들었을 때, line: "…그건 이미 들은 이야기로군. 몇 번째 들려주는 거지? 아니, 방금 지어낸 것 같기도 하고."}
    - {situation: 겁, line: "…고동이 노래에 가까워졌어. 그 박자는 내 기억 노래의 첫 마디와 같아. …무서운 게 아니라 …오래 기다린 거야."}
    - {situation: 슬픔, line: "…오늘도 하나를 잊었어. 무엇인지 잊었으니 슬픈지도 모르겠구나. 그게 제일 슬퍼."}
    - {situation: 비밀 누설, line: "고동은 그분의 목소리와 같은 박자야. 내가 들은 건 어머니에게서 물려받은 기억 노래이지만, 틀림없어. 그분의 마지막 숨이었어."}
    - {situation: 회귀자를 의심할 때(기시감 약), line: "…이상하네. 너를 처음 보는 것 같은데 '다시'라는 말이 입가에 맴돌아. 오래 산 자의 착각일 수도 있지."}
    - {situation: 마음을 열었을 때, line: "너를 '주인님의 마지막 숨'이라 부르는 날이 올지도 몰라. 두렵니? …두려워하지 마. 드라우르는 불편하게 하는 것을 가장 싫어해."}
