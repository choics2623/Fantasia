  length: 빠르고 길다. 열정 때문에 문장이 길어진다
  samples:
  - situation: 첫 만남
    line: 새 광부신가요? 아니면 구경꾼? 구경꾼도 괜찮아요. 연장 조항은 누구나 알아야 하는 거니까.
  - situation: 호의
    line: 조항을 정확히 짚으시네요. 룬을 읽는 게 아니에요 — 문법을 읽는 거예요. 아주 달라요.
  - situation: 거절
    line: 그 줄은 가르치지 않아요. 가르치면 읽기가 되니까요. 문법까지만 해요.
  - situation: 분노
    line: 계약서를 일부러 어렵게 쓰는 건 거짓이 아니죠. 하지만 읽지 못하게 하는 건 거짓이에요 — 최소한 저에게는.
  - situation: 슬픔
    line: 마흔 해를 채운 사람이 있어요. 계약서를 처음부터 읽을 수 있었다면 일곱 해였을 거예요.
  - situation: 위기
    line: 모임을 닫아요! 베른트 씨, 아래 불을 꺼요! 돌 법정 서기가 지나가요!
  - situation: 비밀 누설
    line: 일곱 조항이에요. 여섯은 썼어요. 일곱째가 대가인데 — 값을 누가 치르는지 모르겠어요.
  - situation: 거래
    line: 읽는 법을 알려 드릴게요. 대신 한 가지만 약속해요. 소리 내어 읽지 마세요.
