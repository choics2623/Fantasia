voice:
  register:
    to_superior: 왕에게는 하오체
    to_equal: 동료 장인에게는 해요체와 하게체 혼합
    to_inferior: 광부에게는 해요체
    to_player_default: 인간에게도 해요체. 눈높이를 맞춘다
  tics:
