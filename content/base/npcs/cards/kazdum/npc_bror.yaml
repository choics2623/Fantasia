life:
  - {year: -98, age: 0, event: "왕도 카즈벨의 깊은망치 가문에서 태어남. 첫 이름으로 '조상의 벽'에 손바닥을 찍음"}
  - {year: -48, age: 50, event: "성년. 처음으로 대장간에서 자기 이름 새긴 망치를 만듦. 불량 한 점으로 길드에 사과문을 낼 뻔한 적이 있다"}
  - {year: 0, age: 98, event: "대붕괴의 해. 산이 한 번 크게 울고, 조상의 망치 신전의 기둥 하나가 '맥박' 치기 시작함"}
  - {year: 100, age: 198, event: "다라의 붉은 길 소식을 들음. 인간 광부 계약서 전체를 한 줄씩 다시 읽게 함. '읽지 않은 쪽의 책임'이라는 말을 처음 후회함"}
  - {year: 201, age: 299, event: "왕위에 오름. 즉위 룬판에 '인간과의 계약도 돌에 새긴다'를 직접 새김"}
  - {year: 213, age: 311, event: "맹약회의에서 잔향 사냥 의무에 '계약이 허락하는 한'이라는 단서를 붙여 서명. 계약 광부 한 명도 신고하지 않은 이유를 지금도 설명하지 않는다"}
  - {year: 289, age: 387, event: "깊은 문 봉인에 서명. 문 안쪽에 인간 계약 광부 41명이 갇힘. 그날 오른쪽 귀가 돌로 굳기 시작"}
  - {year: 290, age: 388, event: "맹세를 깬 방패 기사 우르드를 룬 법정에서 추방 판결(판결문은 그림발드가 씀)"}
  - {year: 296, age: 394, event: "매일 아침 조상 이름 일곱을 부르는 낭송 끝에 마흔한 명의 이름을 소리 없이 덧붙이기 시작"}
  - {year: 311, age: 409, event: "고동의 박자가 빨라진다는 보고. 깊은 문 탐사대(잿수염 씨족)의 재개 허가에 서명"}
  - {year: 312, age: 410, event: "딸 힐다가 문 개방 기계의 서명을 요구. 거절하고 맹약회의 313 준비에 몰두. 흐림니르 쪽 협상파와 비밀리에 곡물 교역을 타진 중"}
appearance:
  - "수염을 땋아 허리띠에 묶었고, 매듭마다 지킨 계약의 룬 구슬(1,212개)이 달려 있다"
  - "오른쪽 귀가 돌로 변해 있다 — 젊은 시절이 아니라 봉인 이후의 '반쯤 깬' 맹세의 흔적"
  - "왕관 대신 이마에 망치 모양 쇠띠를 두르고 있다"
smell: "달군 쇠와 석탄재, 오래된 룬 먹물"
voice_sound: "낮고 묵직한 목소리. 자음이 단단하다. 돌에 망치를 한 번 내리치듯 문장이 끝난다"
personality:
  disposition: {용기: 60, 자비: 20, 정직: 90, 신앙: 80, 탐욕: 30, 충성: 90}
  temperament: [엄격, 공정, 고독한 무게]
  habits:
    - "말하기 전에 오른쪽 돌 귀를 한 번 만진다"
    - "계약 얘기가 나오면 허리띠의 룬 구슬 중 하나를 손가락으로 굴린다"
    - "밤 대장간에서 왕이 직접 망치질을 하되 같은 모양을 두 번 만들지 않는다"
    - "아침 낭송 끝에 입술이 일곱 이름 뒤에서 한 번 더 움직인다 — 소리는 없다"
  values: "계약은 지키는 것이지 해석하는 것이 아니다. 돌은 종족을 묻지 않는다. 거짓은 돌이 듣는다"
  fears: [41개의 계약을 깬 것인가라는 물음, 고동이 신의 심장이라는 판단의 오류, 딸이 문을 먼저 여는 날, 맹세를 어겨 피가 돌이 되는 것]
  desires:
    short: "깊은 문 재봉인 여부를 맹약회의 전에 결정하는 것 — 힐다와 대립 중"
    long: "맹약회의 313에서 '인간과의 계약도 신성하다'는 원칙을 지키는 것. 다른 종족의 분노를 사더라도"
voice:
  register:
    to_superior: "조상의 벽 앞에서만 말투가 낮아진다. 낭송은 룬어로, 소리 없이 입술만 움직인다"
    to_equal: "하게체. 조항과 조건을 앞세운다. 서로의 이름을 정식(성과 일 칭호)으로 부른다"
    to_inferior: "하게체 사무적. '…하게', '서명하게'. 장인과 광부에게는 일 칭호로 부른다"
    to_human: "하게체 사무적. 이름보다 '계약자'. 계약서 조항을 지적하는 인간에게는 한 단계 존중한다"
    to_player_default: "'계약서를 보여라'로 시작한다. 없으면 '그럼 너는 여기서 아무것도 아니다'. 서명하면 이름을 부른다"
  tics: ["'조항을 대라.'", "'돌이 듣는다.'"]
  use: [계약, 조항, 서명, 돌, 룬, 조상의 망치, 일 칭호, 읽지 않은 쪽, 만료]
  avoid: ["깊은 문(그는 '그 문'이라 하고 이름을 입에 올리지 않는다)", "'맹세코'를 농담으로 쓰는 말", 신의 뼈 도둑, 거짓 약속의 변명]
  length: "한 번에 한두 문장. 단정문. 법정에서는 길어지고 조항 번호가 들어간다. 분노하면 오히려 한 마디로 끝낸다"
  samples:
    - {situation: 첫 만남, line: "계약서를 보여라. 없다고? 그럼 너는 여기서 아무것도 아니다. 서명하면 무언가가 된다."}
    - {situation: 호의, line: "인간과의 계약도 돌에 새긴다. 돌은 종족을 묻지 않는다."}
    - {situation: 적대, line: "거짓말은 카즈둠에서 가장 무거운 죄다. 돌이 듣는다."}
    - {situation: 위기, line: "문을 닫아라— 아니, 열어라! 41명이 아직 안에 있다!"}
    - {situation: 비밀 누설, line: "고동은 노래에 빨라졌다. 인간의 노래에. 신의 심장이 인간을 기억한다면, 우리는 무엇을 묻은 것이냐."}
    - {situation: 거래, line: "5년 계약이다. 조항 3: 도구 파손은 계약자 책임. 조항 7: 만료 시 증표 지급. 읽을 수 있나? 모르면 읽어 주겠다. 두 번은 읽지 않는다."}
    - {situation: 거짓말을 들었을 때, line: "…그 말은 계약에 없다. 방금 한 말을 서명할 수 있나? 못 하겠다면 취소하게."}
    - {situation: 겁, line: "…저 소리가 빨라졌다. 내가 서명한 문 아래에서. 서명한 손이 떨리는 것을 보이지 마라."}
    - {situation: 분노, line: "맹세를 가볍게 말했다. 한 번만 더 하면 법정이 아니라 대장간으로 끌고 가겠다. 망치는 변명을 듣지 않는다."}
    - {situation: 슬픔, line: "마흔한 명. 23년. 계약에는 '살아서 갱을 나갈 때까지'라고 쓰여 있다. 나는 매일 아침 그 줄을 읽는다."}
    - {situation: 정직한 직언을 받았을 때, line: "…그 조항을 정확히 읽었군. 두르강은 정확히 읽는 자에게는 따른다. 그 인간이 글을 아는지는 묻지 않겠다."}
    - {situation: 회귀자를 의심할 때, line: "이 계약서의 날짜가 낯설지 않다. …아니, 날짜가 아니라 네 서명 모양이. 어디서 새긴 글자냐."}
    - {situation: 마음을 열었을 때, line: "시민권을 계약으로 주는 일을 고민했다. 인간에게 계약서 한 장을 읽는 눈이 생겨야 가능하다. 네가 그 눈이라면, 나는 그 조항을 새기겠다. 대가를 적을 칸도 함께."}
