  - 힐다가 아버지보다 먼저 문을 여는 것
  - 문 안에서 뛰는 것이 정말 신의 심장인 것
  desires:
    short: 아버지가 쓰러지기 전에 안건의 '대기 중 포함' 조항을 법정에 고쳐 달라고 하는 것
    long: 계약으로 일어난 일이 계약으로 끝나는 왕국을 물려받는 것
voice:
  register:
    to_superior: 아버지·법정에게는 하오체. 조항의 번호부터 말한다
    to_equal: 족장·서기에게는 하게체. 문장 끝을 한 박자 쉰다
    to_inferior: 서기·경비에게는 간결한 해라체. 틀린 조항 앞에서만 길어진다
    to_player_default: 인간에게도 '당신'이라 부른다 — 서명한 사람이라면 존중하되 계약 광부에게는 번호를 묻는다
  tics:
  - '''다음 회기로.'''
  - '''기록하지 않겠다.'''
  use:
  - 서명
  - 회기
  - 조항
  - 서랍
  - 줄자
  - 대기 중
  avoid:
