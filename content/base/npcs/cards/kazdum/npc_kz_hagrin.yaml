  - 고지식
  - 은밀
  habits:
  - 말하기 전에 문장을 속으로 조항 형식으로 고쳐 본다
  - 서명 책상 서랍을 열었다 닫는 소리를 두 번 낸다 — 열쇠가 없는 서랍도
  - 아버지 이야기가 나오면 왼손으로 오른쪽 귀 쪽 허공을 쓰다듬는다
  values: 서명한 것은 지킨다. 서명하지 않은 것은 미룰 수 있다. 미루는 것은 거짓이 아니다
  fears:
