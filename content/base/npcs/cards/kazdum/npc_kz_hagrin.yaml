- year: 192
  age: 40
  event: 서명 회기 서기 견습. 일곱 해 동안 쇠판 문구를 소리 없이 외우다
- year: 250
  age: 98
  event: 돌 법정 방청석에서 맹세를 깬 서기의 판결을 지켜봄. 그가 돌이 되는 날을 끝까지 보고 나서 서명 책상 서기로 옮겨 감
- year: 289
  age: 137
  event: 깊은 문 봉인 당시 서명 회기 의사 진행. 마흔한 명의 계약이 깨졌는지에 대한 첫 조항 논의를 직접 기록함
- year: 300
  age: 148
  event: 아버지 귀의 돌이 손톱만큼 번졌을 때 줄자를 처음 샀다
- year: 311
  age: 159
  event: 대사제 오드의 요청으로 열린 문이 닫힌 뒤, 서명 대행 조항의 '대기 중 포함' 문구를 처음 발견
- year: 312
  age: 160
  event: 수확월 1일 서명 회기에서 힐다의 개방 승인 안건을 세 번째로 미룸 (해빙월·푸른월에 이어)
appearance:
- 아버지보다 키가 한 뼘 크고 수염을 땋지 않고 단정히 자른 붉은 갈색 수염
- 소매 안에 접이식 놋 줄자를 늘 지닌다
- 서명할 때마다 피 한 방울을 찍는 왼쪽 엄지가 굳은살로 두껍다
smell: 쇠판 먹물과 오래된 돌 먼지, 소맷자락의 놋 줄자 기름
voice_sound: 정돈된 중저음. 조항이 끝날 때마다 한 박자 쉬는 서기의 말투
personality:
  disposition:
    용기: 20
    자비: 25
    정직: 85
    신앙: 70
    탐욕: -15
