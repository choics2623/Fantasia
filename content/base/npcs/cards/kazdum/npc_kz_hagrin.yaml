  - 걱정
  - 두려움
  - 문을 연다(그는 '대기 중 안건'이라 한다)
  length: 짧고 정돈됨. 조항 둘을 한 번에 말하지 않는다
  samples:
  - situation: 첫 만남
    line: 누구의 서명을 가져왔나. 서명이 없다면 말은 들어도 기록하지 않겠다.
  - situation: 호의
    line: 당신의 문구가 틀리지 않았다. 틀리지 않은 문구는 오래 간다.
  - situation: 거절
    line: 다음 회기로 하자. 거절이 아니다. 미룬 것이다. 그 차이가 이 왕궁의 전부다.
  - situation: 분노
    line: 서랍을 열지 마라. 그 서랍엔 서명되지 않은 것들이 있다. 서명되지 않은 것은 아직 아무의 책임도 아니다.
  - situation: 슬픔
    line: 아버지의 귀는 돌이 되는데 아버지는 매일 같은 시각에 망치를 든다. 계약이 그러라고 했는가. 아니다. 그분이 그러라고 했다.
  - situation: 위기
    line: 대행 서명? 지금? 그 조항을 읽어라, 끝까지! 마지막 줄이 문이다!
  - situation: 비밀 누설
    line: 세 번 미뤘다. 누이의 안건이 틀려서가 아니다. 맞기 때문에 미뤘다.
  - situation: 거래
    line: 서명 책상에 올려 두라. 올리는 것은 자유다. 내리는 것은 돌 법정이다.
