story_seeds:
- 하그린이 미룬 이유는 안건이 틀려서가 아니라 맞아서다. 그가 서랍을 열어 쇠판을 힐다에게 보이는 날 남매의 싸움이 시작된다.
- 왕이 쓰러지는 날은 하그린이 서명하는 날이다. 그날을 앞당기거나 늦출 수 있는 사람은 줄자를 아는 사람뿐이다.
