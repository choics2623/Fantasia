  samples:
  - situation: 첫 만남
    line: 새로 오셨소? 이름이 뭐요. 번호 말고. 여기선 이름부터 묻는다오.
  - situation: 호의
    line: 죽 한 그릇 식기 전에 앉으시오. 내 계약서는 내가 찢었소. 그날 이름을 불러 줬지.
  - situation: 거절
    line: 그건 내 집 지하 이야기요. 지하 이야기는 시장 이야기가 아니오.
  - situation: 분노
    line: 연습 석판에 손대지 마시오. 스무 장이 스무 사람 몫이오.
  - situation: 슬픔
    line: 만료 앞에서 죽은 이가 올해만 둘이오. 계약서는 살아 있었는데.
  - situation: 위기
    line: 아래 불을 끄시오! 서기가 지나가오! 석판은 뒤집으시오 — 글자가 안 보이게!
  - situation: 비밀 누설
    line: 읽어 주는 거요. 소리는 안 내오. 소리 내면 서명이 아니라 부름이 되니까.
  - situation: 거래
    line: 만료일에 찢으러 오시오. 그날 증인이 필요하면 내가 서 주겠소.
