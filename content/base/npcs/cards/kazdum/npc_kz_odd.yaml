  values: 조상은 돌 속에서 말한다. 돌이 말하는 것은 서명이 아니라 부름이다
  fears:
  - 자기가 열게 한 문이 부름이 아니었을 가능성
  - 경비 셋의 가족이 신전 문 앞에 서는 날
  - 맥박 기둥이 멈추는 것 — 그리고 더 빨라지는 것
  desires:
    short: 문이 다시 열릴 때 조상의 뜻이 무엇이었는지 확인하는 것
    long: 대사제 자리에서 내려오기 전에 한 번 더 빗장을 들 용기를 얻거나 완전히 버리는 것
voice:
  register:
    to_superior: 왕에게는 하오체이되 '폐하' 대신 '왕'이라 부른다
    to_equal: 사제에게는 하게체
    to_inferior: 수습 사제에게는 부드러운 해라체
    to_player_default: 인간에게는 '그대'. 손을 먼저 본다
  tics:
  - '''돌이 듣는다.'''
  - '''조상이 보신다.'''
  use:
  - 조상
  - 망치
  - 두드림
  - 기둥
  - 돌
  - 손
  avoid:
