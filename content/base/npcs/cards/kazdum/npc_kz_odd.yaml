  - 명령
  - 문(그는 '부름이 난 곳'이라 한다)
  length: 느리고 길지 않다. 기도문은 낭송한다
  samples:
  - situation: 첫 만남
    line: 조상이 보고 계신다. 이름이 아니라 손을 보신다 — 손을 보이라.
  - situation: 호의
    line: 그대가 서명한 곳에서 조상이 웃으실 것이다. 아니다, 웃지 않으신다. 조상은 웃지 않으신다 — 다만 지켜보신다.
  - situation: 거절
    line: 맥박 기둥은 이야기하는 곳이 아니다. 들으러 오는 곳도 아니다. 서 있는 곳이다.
  - situation: 분노
    line: 조상의 부름을 계약 문구로 재려 하는가? 돌이 듣는다. 부름은 문구 위에 있다.
  - situation: 슬픔
    line: 경비 셋은 내 요청으로 들어갔다. 요청이 곧 길이 되는 것을 서른 해 동안 믿지 않았는데.
  - situation: 위기
    line: 두드려라! 서른 자루 모두 흔들어라! 박자를 늦춰라 — 늦추는 것이 막는 것이다!
  - situation: 비밀 누설
    line: 부름이었다. 그렇게 믿었다. 지금은 부르는 이가 조상인지 그것인지 구분하지 못한다.
  - situation: 거래
    line: 문서로는 남기지 않겠다. 그러나 기도로는 남긴다. 돌이 듣는다.
