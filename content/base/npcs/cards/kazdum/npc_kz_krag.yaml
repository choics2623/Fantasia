  - situation: 호의
    line: 교대가 끝나면 잔을 나누자. 우리 경비들은 이름으로 마신다.
  - situation: 거절
    line: 문 앞에서는 문 이야기를 하지 않는다. 그것이 내가 지킨 유일한 맹세다.
  - situation: 분노
    line: 문에 귀를 대지 마라! 한 번 대면 이 초소 사람들이 그 소리를 들은 놈으로 부른다.
  - situation: 슬픔
    line: 셋의 이름은 명부에 있다. 지우면 죽은 것이 되고, 안 지우면 아직 오는 중이다.
  - situation: 위기
    line: 교대 앞으로! 셋째 줄은 선 뒤로! 문이 두드린다 — 돌아서지 마라!
  - situation: 비밀 누설
    line: 빗장을 든 건 나다. 오드는 말했고, 나는 들었다. 그 둘이 같은 죄인가는 법정이 아직 말하지 않았다.
  - situation: 거래
    line: 이름을 대라. 그 이름이 셋 가운데 하나라면 내 왼손이 아니라 오른손으로 악수하겠다.
