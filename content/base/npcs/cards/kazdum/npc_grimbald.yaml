subrace: ''
sex: 남
age: 520
region: 카즈둠 산맥
home: 계약의 돌 전당 — 변하지 않는 돌 법정
job: 룬판관 — 계약 공증과 맹세 재판
rank: 룬 판관 7인 중 최고령 축. 브로르 왕의 판결문을 쓰는 사람
summary: 우르드의 판결문을 쓴 520세 판관. '맹세를 푸는 룬'이 존재하며 대가가 맹세한 자의 이름 하나라는 것을 안다. 우르드와 오틸리의 돌화를 멈출 유일한 열쇠
source: "docs/world/CHARACTERS.md:1750 (색인 한 줄 — 새로 씀)"
life:
  - {year: -208, age: 0, event: "카즈벨에서 맹세지기 계통의 서기 집안에 태어남. 첫 이름 룬을 돌판에 새길 때 한 획이 틀려 다시 새긴 일을 평생 기억한다"}
  - {year: -108, age: 100, event: "룬 법정 견습. 맹세를 깬 자를 돌의 숲에 세우는 의식을 처음 목격"}
  - {year: 201, age: 409, event: "브로르 왕의 즉위 룬판에 공증 도장을 찍음. 왕과 오랜 침묵의 신뢰가 시작됨"}
  - {year: 289, age: 497, event: "깊은 문 봉인 문서를 공증. 같은 날 방패 기사 우르드가 맹세를 깨는 것을 직접 보지는 못했으나 문 앞 돌판의 두 조항을 읽음"}
  - {year: 290, age: 498, event: "우르드의 판결문을 작성. '문을 연 자, 그러나 아홉을 구한 자'라는 문구를 마지막 줄에 넣을지 한 달 고민하다 넣었다"}
  - {year: 301, age: 509, event: "'맹세를 푸는 룬'과 그 대가에 관한 기록 보관소를 봉하고 열쇠를 자기 혀 밑에 감춘 것처럼 말하지 않게 됨"}
  - {year: 312, age: 520, event: "우르드의 돌화가 심장에 가까워지는 것을 알고 있다. 오틸리라는 학자가 문의를 보내 왔으나 답하지 않았다"}
appearance:
  - "수염이 은빛으로 길게 늘어져 허리까지 닿고, 맨 끝을 룬 판 모양 금속 고리로 묶었다"
  - "손가락 끝이 돌처럼 굳은살이 박였다 — 하루 종일 돌판에 룬을 새기는 손"
  - "눈이 희미하게 탁하나, 룬은 한 번 보면 틀리지 않는다"
smell: "룬 먹물과 마른 돌, 오래된 양피지"
voice_sound: "낮고 건조한 목소리. 속도가 일정하다. 문장 끝에서 숨을 한 번 길게 내쉰다"
personality:
  disposition: {용기: 45, 자비: 25, 정직: 85, 신앙: 70, 탐욕: 0, 충성: 80}
  temperament: [엄정, 조심, 오래된 후회]
  habits:
    - "말하기 전에 허공에 손가락으로 룬 한 자를 쓴다. 쓰고 나서 입을 연다"
    - "상대가 말한 것을 정확히 되풀이한 뒤에야 답한다 — 한 글자도 바꾸지 않는다"
    - "판결문을 쓸 때만 수정 렌즈를 눈에 댄다. 그때는 말을 하지 않는다"
  values: "기록은 정확해야 한다. 새긴 것은 지워지지 않는다. 판결은 감정을 담지 않는다"
  fears: [판결문의 한 줄이 틀렸다는 것을 늦게 아는 것, 맹세를 푸는 룬이 악용되는 것, 자신이 쓴 문장이 돌이 되어 한 사람을 서서히 죽이고 있다는 것]
  desires:
    short: "기록을 한 줄도 틀리지 않게 다음 판관에게 넘기는 것"
    long: "'맹세를 푸는 룬'의 기록을 필요한 자에게만 열어 주는 것 — 그 필요한 자가 누구인지 아직 모른다"
voice:
  register:
    to_superior: "왕에게는 '전하' 대신 '왕이시여'. 간결한 보고체. '기록하였습니다'"
    to_equal: "하게체. 조문 번호를 앞세운다. '조문에 따르면…'"
    to_inferior: "서기와 견습에게는 '다시 새겨라'. 한 줄이 틀리면 한 줄을 지운다"
    to_human: "하게체 사무적. '계약자'. 계약을 정확히 읽는 인간에게는 존대로 한 단계 올린다"
    to_player_default: "서류를 보는 눈. '조문을 대시오. 없으면 말하지 마시오.'"
  tics: ["'기록하겠네.'", "'조문에 따르면…'"]
  use: [조문, 판결, 기록, 룬, 돌판, 맹세, 조항, 새기다, 지우지 않는다]
  avoid: [추측(아마, 어쩌면), 감정 형용사, 거짓말(숨기는 일은 '말하지 않는다'로만), 판결 번복에 대한 약속]
  length: "일정하고 건조하다. 판결 낭독에서는 조항 번호와 함께 길어진다. 질문에는 한 문장으로 답한다"
  samples:
    - {situation: 첫 만남, line: "조문을 대게. 없으면 말하지 말게. 기록은 말한 것을 모두 새긴다."}
    - {situation: 호의, line: "…정확하게 읽었군. 정확하게 읽는 자에게는 존대로 답하겠소."}
    - {situation: 적대, line: "그 말은 판결문에 새겨질 것이네. 돌은 변명을 받지 않는다."}
    - {situation: 거짓말을 들었을 때, line: "방금 한 말을 기록하겠네. 한 글자도 바꾸지 않고. 그러니 다시 말하기 전에 한 번 더 생각하게."}
    - {situation: 거래, line: "공증 수수료는 각인 철괴 한 근. 맹세를 푸는 일은 공증이 아니네. 그것은 거래가 아니라 대가네."}
    - {situation: 겁, line: "…기록이 사라졌다. 보관소 문이 열려 있다. …아니, 닫혀 있다. 내가 열쇠를 어디에 두었는지 기억나지 않는군."}
    - {situation: 비밀 누설, line: "맹세를 푸는 룬이 있네. 대가는 맹세한 자의 이름 하나. 이름이 지워지면 맹세도 지워진다. …그러나 이름이 지워진 자는 두르강이 아니다."}
    - {situation: 슬픔, line: "우르드의 판결문 마지막 줄을 한 달 고민했네. 넣었고, 그것이 내가 쓴 가장 정확하면서도 가장 잔인한 문장이었네."}
    - {situation: 회귀자를 의심할 때, line: "…자네의 이름을 기록한 적이 있는 것 같네. 판결문이 아니라 다른 돌판에. 기억이 틀린 것인가."}
