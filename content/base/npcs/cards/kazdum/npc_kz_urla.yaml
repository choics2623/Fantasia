appearance:
- 허리가 굽었으나 눈이 흐리지 않은 백발 노파. 수염을 한 가닥으로 땋아 법정 바닥에 닿도록 길렀다
- 손가락 마디마다 판결 번호를 새긴 놋 가락지를 낀다
- 오른손 새끼손가락 끝이 이미 돌이다 — 어린 시절 깨뜨린 사소한 맹세의 흔적
smell: 법정 바닥 석회 가루와 오래 닫힌 돌방의 서늘한 냄새
voice_sound: 갈라진 낮은 목소리. 판결문을 읽을 때만 또렷하다
personality:
  disposition:
    용기: 55
    자비: 5
    정직: 95
    신앙: 70
    탐욕: -25
    충성: 85
  temperament:
  - 엄격
  - 침묵
  - 완고
  habits:
  - 판결 전에 법정 바닥 한가운데 돌을 발뒤꿈치로 세 번 두드린다
  - 누가 거짓말을 하려는 낌새가 보이면 말을 끊고 눈을 감는다 — 침묵으로 기회를 준다
  - 층계를 오를 때 걸음 수가 아니라 박자를 센다
  values: 법은 쇠판에 새긴 문구다. 문구 밖으로 나간 판결은 판결이 아니라 의견이다
  fears:
  - 법정이 자기 수장이 속한 결사를 재판할 수 없다는 사실이 드러나는 것
  - 돌의 숲의 '거부한 자'의 이름이 법정 밖에서 불리는 것
  - 자기 맹세 하나가 이미 금이 갔다는 것
  desires:
    short: 깊은 문이 열리는 날 법정이 '문구 밖'으로 나가지 않도록 판결 순서를 정해 두는 것
    long: 자기가 죽기 전에 장부의 박자 읽기를 서로 다르게 하는 아홉 사람의 해석을 한 쇠판에 놓는 것
voice:
  register:
    to_superior: 왕에게도 하오체. '청정 판정'이라는 말로 존대를 대신한다
    to_equal: 판관·족장에게는 하게체. 문구를 인용한다
    to_inferior: 서기·방청객에게는 해라체이되 느리다
    to_player_default: 인간에게는 '그대'. 맹세의 수를 묻는다
  tics:
  - '''돌이 듣는다.'''
  - '''문구를 보자.'''
  use:
  - 맹세
  - 판결
  - 청정
  - 돌
  - 문구
  - 침묵
  avoid:
  - 아마도
  - 사랑
  - 용서
  - 마음(그녀는 '맹세'라 한다)
  length: 짧다. 판결문을 읽을 때만 길다
  samples:
  - situation: 첫 만남
    line: 맹세는 몇 개나 가졌나. 답이 없다면 법정은 그대를 '이름 없는 방청객'으로 적는다.
  - situation: 호의
    line: 그대의 문구는 정직하다. 정직한 문구는 판결문 아래에서 오래 산다.
  - situation: 거절
    line: 그것은 법정의 문구 밖이다. 문구 밖의 판결은 의견이다. 의견은 판관에게 허락되지 않았다.
  - situation: 분노
    line: 돌에 대고 한 말을 돌 법정에서 번복하겠다고? 나는 사백칠십 해를 이 의자에 앉아 있었다. 돌은 기다린다.
  - situation: 슬픔
    line: 맹세를 깬 자는 돌이 되고, 돌이 된 자의 이름은 회랑에 선다. 나는 이름이 서는 것을 사백 번 보았다.
  - situation: 위기
    line: 법정을 닫아라! 아니 — 열어 둬라. 닫힌 법정은 아무것도 판결하지 못한다.
  - situation: 비밀 누설
    line: 법정은 자기 수장이 속한 것을 재판하지 못한다. 그것이 내가 숨긴 유일한 문구다.
  - situation: 거래
    line: 맹세 청정 판정은 값을 받지 않는다. 판정 전에 말을 하라. 판정 뒤의 말은 증언이다.
