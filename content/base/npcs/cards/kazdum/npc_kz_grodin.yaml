    long: 형이 문 안에서 맹세를 푸는 방법을 얻게 하는 것
voice:
  register:
    to_superior: 왕녀·왕에게는 하오체이되 말이 빠르다
    to_equal: 족장에게는 하게체, 탐사대원에게는 반말과 하게체 혼합
    to_inferior: 대원·견습에게는 반말. 칭찬이 많다
    to_player_default: 인간에게는 하게체. '손님'이라 부르고 맥주부터 권한다
  tics:
  - '''두 잔 뒤에.'''
