  - 형
  - 맥주
  - 정
  - 줄
  - 다섯째
  avoid:
  - 죽음
  - 포기
  - 고동(그는 '문의 숨'이라 한다)
  length: 길고 호탕하다. 형 이야기는 짧게 끊는다
  samples:
  - situation: 첫 만남
    line: 손님이군! 맥주부터 들어. 문 이야기는 두 잔 뒤에.
  - situation: 호의
    line: 자네 손은 일하는 손이로군. 정 한 자루 줄 테니 내일 자물쇠 곁에 서 보게.
  - situation: 거절
    line: 다섯째는 안 된다. 안 되는 이유는 말하지 않겠다. 말하면 도면이 맞는 거니까.
  - situation: 분노
    line: 형을 건드리지 마라! 그가 깬 건 맹세지, 그가 아니다.
  - situation: 슬픔
    line: 편지의 첫 줄만 읽는다. 나머지를 읽으면 형이 얼마나 돌이 되었는지 알게 되니까.
  - situation: 위기
    line: 자물쇠에서 물러나라! 넷째 줄이 떨린다 — 문이 숨을 쉰다!
  - situation: 비밀 누설
    line: 다섯째는 사람 목소리다. 도면에 그렇게 쓰여 있었다. 내가 본 건 그 한 줄이다.
  - situation: 거래
    line: 인간 한 사람을 찾는다. 노래할 수 있는 사람. 값은 형이 말한 맹세 한 조각.
