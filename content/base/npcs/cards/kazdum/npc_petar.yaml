id: npc_petar
name: "'마흔 해' 페타르"
aka: [마흔 해, 노래하는 광부]
tier: B
type: living
race: 인간(광산 인간)
subrace: ''
sex: 남
age: 58
region: 카즈둠 산맥
home: 바깥 갱 계약 광부 숙영지 (굴뚝 숙영지 근처)
job: 바깥 갱 계약 광부 — 40년 계약
rank: 두르강 계약 광부. 계약 만료 37일 전(서리월 8일)
summary: 7년 계약이 연장되고 연장되어 마흔 해를 채운 극소수 광부. 깊은 문 봉인 날 구출된 아홉 중 하나이며, 고동이 반응한 그 노래를 부른 사람이다
source: "docs/world/CHARACTERS.md:1754 (색인 한 줄 — 새로 씀)"
life:
  - {year: 254, age: 0, event: "굴뚝 숙영지의 계약 광부 집에서 태어남. 아버지는 석탄을 졌고 어머니는 노래를 했다"}
  - {year: 272, age: 18, event: "7년 계약에 서명(손바닥 자국). 서명용 룬 몇 개만 배웠다. 계약서의 나머지 글자는 읽지 못함"}
  - {year: 279, age: 25, event: "7년 만료일에 '도구 파손은 1년 연장' 조항이 적용되어 연장. 이후 한 번도 만료일에 풀려난 적이 없다"}
  - {year: 289, age: 35, event: "깊은 문 앞 최하층 작업 중 봉인의 날. 광부 50명 중 노래를 부르던 그는 문이 닫히기 직전 낯선 방패 기사에게 끌려 나온 아홉 중 하나. 기사의 얼굴은 횃불 눈부심에 보지 못했다"}
  - {year: 290, age: 36, event: "구출 후 바깥 갱으로 옮겨짐. 이후 깊은 문 이야기를 입에 올리지 않았고 노래도 거의 부르지 않았다"}
  - {year: 305, age: 51, event: "고동이 빨라진다는 소문이 광부들 사이에 돌기 시작. 그는 밤마다 갱도 벽에 귀를 대지 않으려 한다"}
  - {year: 311, age: 57, event: "왕녀 힐다의 측정 보조원이 '노래를 불러 달라'고 처음 청해 옴. 거절함"}
  - {year: 312, age: 58, event: "계약 만료 37일 전. 낙엽월 1일 저녁, 손가락으로 남은 날을 센다. '서른일곱'"}
appearance:
  - "40년 광부의 어깨 — 한쪽이 처지고 허리가 굽었다. 손바닥에 서명의 룬 자국이 지워지지 않는다"
  - "눈이 횃불 빛에 약하다. 눈가에 석탄가루가 묻어 있다"
  - "목에 감은 낡은 수건. 노래할 때만 푼다"
smell: "석탄가루와 땀, 젖은 광부 모자"
voice_sound: "낮고 둥근 목소리. 말하다 가끔 콧노래가 새어 나온다. 노래할 때만 소리가 맑아진다"
personality:
  disposition: {용기: 35, 자비: 70, 정직: 80, 신앙: 20, 탐욕: -20, 충성: 50}
  temperament: [온순, 인내, 숨은 죄책감]
  habits:
    - "남은 날을 손가락으로 센다. 틈만 나면 '서른일곱'이라고 중얼거린다"
    - "갱도에서 누가 노래를 부르려 하면 손을 들어 막고 고개를 젓는다"
    - "깊은 문 이야기가 나오면 수건으로 목을 감싸고 말을 돌린다"
  values: "계약을 끝까지 지키는 것. 정직하게 서명하는 것. 노래는 일하는 사람에게 값이 아니라 숨이라는 것"
  fears: [노래가 다시 고동을 깨우는 것, 문 안에 남은 이들의 얼굴, 만료일에 자유가 오지 않는 것]
  desires:
    short: "서리월 8일 계약 만료일에 돌 증표를 받고 자유민이 되는 것"
    long: "자유민이 되어 바깥 갱의 햇빛 아래서 노래를 다시 부르는 것"
voice:
  register:
    to_superior: "두르강에게는 '예, 맏이.' 짧고 공손하다. 계약 조항을 물으면 정확히 답한다"
    to_equal: "인간 광부끼리는 부드러운 반말. '서른일곱 남았어' 같은 날짜 이야기가 인사다"
    to_inferior: "새 계약 광부에게는 느리고 다정한 반말. 작업 요령과 노래 대신 휘파람을 가르친다"
    to_human: "친절하나 자신의 이야기는 거의 하지 않는다. 이름 대신 '자네'"
    to_player_default: "조용한 호의. 날짜를 묻는 것으로 말을 튼다 — '오늘 며칠이었지? 서른일곱이 맞나'"
  tics: ["'서른일곱 남았어.'", "(말끝에 콧노래 한 음)"]
  use: [남은 날, 계약, 증표, 맏이, 갱, 서명, 수건, 노래]
  avoid: [깊은 문(그는 '그 아래'라 한다), 고동, 구해 준 사람 이야기(은인의 얼굴을 모른다)]
  length: "짧고 부드럽다. 날짜와 계약 이야기에서 길어진다. 노래 이야기에서는 입을 닫는다"
  samples:
    - {situation: 첫 만남, line: "오늘 며칠이었지? 서른일곱이 맞나. …아, 처음 보는 얼굴이군."}
    - {situation: 호의, line: "노래는 일하는 사람 숨이야. 값을 받으려고 하는 건 아니었어."}
    - {situation: 거래, line: "계약은 정확히 읽는 게 제일이야. 모르는 글자가 나오면 맏이께 물어봐. 두 번까지는 가르쳐 주셔."}
    - {situation: 적대(경계), line: "…나는 계약서 말고는 아무것도 서명하지 않았어. 그 아래 일은 몰라."}
    - {situation: 겁, line: "…노래는 안 불러. 그 노래는 안 불러. 이 갱도에서는 안 돼."}
    - {situation: 슬픔, line: "마흔한 명 이름은 다 외웠어. 아무도 물어보지 않아서 매일 혼자 세."}
    - {situation: 비밀 누설, line: "그날 노래를 불렀어. 벽이 박자를 맞추더군. …내가 부르는 동안 문이 닫혔고, 안에 마흔한 명이 남았어."}
    - {situation: 회귀자를 의심할 때, line: "…이상하네. 자네 얼굴은 처음인데 목소리가 낯익어. 그 아래 이야기를 아는 사람 같은 목소리야."}
    - {situation: 마음을 열었을 때, line: "만료일에 돌 문 앞에서 노래를 부를까 해. 마흔 해 만에. …자네가 와 주면 좋겠어."}
hides:
  - fact: fact_kz_petar_was_singer
    reveal_when: "신뢰 45 이상이고 그가 먼저 노래를 부르게 될 만큼 신뢰가 쌓인 뒤, 또는 힐다가 직접 요청하는 장면"
    cover: "'광부는 다 노래하지. 내 노래는 유별난 게 없었어'라고 넘긴다. 수건으로 목을 감싼다"
  - fact: fact_kz_41_sealed_inside
    reveal_when: "신뢰 50 이상이고 우르드나 힐다의 이름으로 다가간 뒤"
    cover: "'그날 얘기는 안 한다'고 한다. 서른일곱 이야기로 화제를 돌린다"
schedule:
  아침: "새벽 갱 입구에서 점호 — 날짜를 센다"
  낮: "바깥 갱에서 10시간 채굴. 계약에 적힌 그대로"
  저녁: "숙영지에서 배급(귀리죽 둘, 버섯빵). 새 광부들에게 요령을 가르친다"
  밤: "혼자 앉아 날짜를 센다. 노래는 하지 않는다"
places: [바깥 갱, 굴뚝 숙영지, 광부 식당, 만료장(곧 가게 될 곳)]
knows: [fact_kz_petar_expiry, fact_kz_contract_clauses, fact_kz_pulse_faster_311]
relations:
  - {to: npc_bror, type: 왕(고용주), like: 10, trust: 50, visibility: 공개, memo: null, words: "계약을 돌에 새기는 왕. 마흔 해 동안 한 번도 약속을 어기지 않았다. 그런데도 그 아래 마흔한 명은 아무도 안 꺼냈다"}
  - {to: npc_hilda, type: 측정하는 왕녀, like: 15, trust: 20, visibility: 일방, memo: null, words: "붉은 머리 왕녀. 노래를 불러 달라고 했다. 거절했지만 그 눈빛이 잊히지 않는다"}
  - {to: npc_urd, type: 방패 기사(얼굴을 모름), like: 30, trust: 20, visibility: 일방, memo: 아직 은인인 줄 모른다, words: "그날 나를 끌어낸 사람이 누구인지 모른다. 방패를 들고 있었다는 것만 기억한다"}
toward_player: "조용한 호의. 날짜를 묻는 것으로 말을 튼다. 노래와 깊은 문 이야기에는 문을 닫는다"
persuade:
