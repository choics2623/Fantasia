id: npc_deep_nidar
name: 사제 니다르
aka: [귀의 사제, 창백한 입]
tier: B
type: living
race: 두르강(심층 두르강)
subrace: ''
sex: 남
age: 270
region: 카즈둠 산맥
home: 깊은 문 앞 '창백한 예배당' (바르둠 요새 아래층)
job: 고동 수도회의 '입' — 문 안쪽의 소리를 위층에 전하는 사제
rank: 심층 두르강 사제. 위층 산 두르강은 그를 두려워하면서도 버리지 못한다
summary: 고동을 깨어나는 심장으로 숭배하는 창백한 사제. 인간의 목소리가 열쇠라 믿고, 그의 신도들이 노래할 인간을 모으려 계약 광부를 납치하기 시작했다
source: "docs/world/CHARACTERS.md:1752 (색인 한 줄 — 새로 씀)"
life:
  - {year: 42, age: 0, event: "바르둠 요새 아래층의 심층 두르강 집안에서 태어남. 첫 말은 '들린다'였다고 어머니가 전함"}
  - {year: 92, age: 50, event: "성년이 되어 고동 수도회에 입문. '귀'로서 바닥에 귀를 대고 자는 훈련을 시작"}
  - {year: 202, age: 160, event: "수도회의 '입'으로 임명됨 — 귀가 들은 것을 위층에 전하는 직책. 평생 말이 적던 그가 말을 해야 하는 자리가 되었다"}
  - {year: 289, age: 247, event: "깊은 문 봉인. 수도회는 문 안쪽 회랑 '귀의 회랑'에 남기로 하고, 그는 문 앞 예배당에서 안과 밖을 잇는 일을 맡음"}
  - {year: 309, age: 267, event: "문 앞 측정 현장에서 왕녀 힐다와 처음 만남. '고동은 인간의 목소리로 깨어난다'고 처음 말함"}
  - {year: 311, age: 269, event: "고동의 박자가 빨라진 것을 기록. 신도들이 노래할 인간을 모으기 시작함"}
  - {year: 312, age: 270, event: "여름. 신도들의 계약 광부 납치가 시작됨. 그는 말리지도 부추기지도 않고 문 앞에서 귀를 기울이고만 있다"}
appearance:
  - "종이처럼 흰 피부에 정맥이 푸르게 비친다. 햇빛을 3대째 보지 못했다"
  - "귀 뒤에 굳은살이 박여 있다 — 바닥에 귀를 대고 잠드는 자의 표식"
  - "눈이 크고 홍채가 옅다. 횃불을 보면 눈가를 손으로 가린다"
smell: "젖은 돌과 차가운 흙, 오래 닫힌 방의 숨"
voice_sound: "속삭임에 가까운 낮은 목소리. 말하다가 갑자기 멈추고 귀를 기울인다. 고동에 맞춰 호흡이 늦춰진다"
personality:
  disposition: {용기: 40, 자비: -10, 정직: 40, 신앙: 95, 탐욕: 0, 충성: 70}
  temperament: [광신, 경청, 고요]
  habits:
    - "말하는 도중 갑자기 멈추고 바닥에 귀를 댄다. 그동안은 질문에 답하지 않는다"
    - "깊은 문 앞에서는 입을 열지 않는다 — 고동을 덮는다고 믿는다. 대신 손가락으로 바닥을 두드려 박자를 전한다"
    - "횃불 앞에서는 손으로 눈을 가리고 '눈부신 것'이라 부른다"
  values: "고동이 멈추지 않게 하는 것. 들리는 것을 거짓 없이 전하는 것. 심장을 '신'이라 부르지 않고 '심장'이라 부르는 것"
  fears: [고동이 멈추는 것, 위층이 문을 영구히 봉인하는 것, 노래할 인간이 오기 전에 박자가 소진되는 것]
  desires:
    short: "노래할 인간을 찾아 고동 앞에 데려가는 것"
    long: "고동이 말을 시작하는 날 그 첫 낱말을 가장 먼저 듣는 것"
voice:
  register:
    to_superior: "원장 앞에서는 말이 더 작아진다. 손가락 두드리는 소리로만 보고한다"
    to_equal: "같은 수도회의 귀들과는 박자로 말한다. 말보다 두드림이 먼저다"
    to_inferior: "신도에게는 '들어라'. 짧은 속삭임"
    to_human: "'계약자'. 속삭이듯 부드럽다. 다정하게 들리나 선택지를 주지 않는다. '위층 사람들'이 아닌 자에게는 거의 정중하다"
    to_player_default: "경청하는 눈. 이름을 묻고 이름의 박자를 입으로 따라한다"
  tics: ["'…들어라.'", "'…박자가 아직 말하지 않았다.'"]
  use: [고동, 심장, 귀, 박자, 깨어나다, 위층, 눈부신 것, 들리다, 노래]
  avoid: [고동을 신이라 부르는 말, 빛(횃불은 눈부신 것이라 한다), 산 두르강의 계약 용어, 크게 말하는 소리]
  length: "짧고 낮다. 문장 사이에 오래 멈춘다. 고동 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "…계약자. 이름을 천천히. …박자가 맞는지 들어 보겠다."}
    - {situation: 호의, line: "…네 목소리는 가늘다. 가는 목소리가 깊은 데까지 간다. …노래해 본 적 있나."}
    - {situation: 적대, line: "…위층 사람들은 귀가 막혔다. 너도 그렇다면 …돌아가라."}
    - {situation: 거짓말을 들었을 때, line: "…박자가 틀렸다. 한 박 늦게 나왔다. 사람의 거짓은 박자가 먼저 안다."}
    - {situation: 겁, line: "…고동이 멈췄다. 세 숨 동안. …이런 적은 없었다. …눈부신 것은 치워라."}
    - {situation: 비밀 누설, line: "…에오르의 마지막 말이 다가오면 심장은 인간의 목소리로 깨어난다. 힐다에게 그렇게 말했다. …그 아이는 믿었다."}
    - {situation: 거래, line: "…노래할 계약자를 하나 데려오면 문 앞까지 길을 열어 주겠다. 값은 한 사람의 노래. …납치는 하지 않았다. 이것은 내 말이다."}
    - {situation: 슬픔, line: "…마흔하나가 안에 있다. 그들의 숨이 아직 들린다. …고동 사이에 섞여서."}
    - {situation: 회귀자를 의심할 때, line: "…박자가 두 겹이다. 네 심장 소리 뒤에 다른 박자가 하나 더 있다. …어디서 왔나."}
hides:
  - fact: fact_kz_nidar_cult_abducts
    reveal_when: "신뢰 50 이상이고 납치된 광부의 이름을 제시한 뒤, 또는 문 앞에서 신도를 직접 마주쳤을 때"
    reveal: [{"trust":50},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'계약자는 스스로 문 앞에 온다'고만 한다. 신도 이야기가 나오면 귀를 바닥에 댄다"
  - fact: fact_kz_nidar_voice_wakes
    reveal_when: "힐다의 이름과 함께 노래할 인간을 찾는다고 하면 신뢰 40 이상에서"
    reveal: [{"trust":40}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'심장은 말을 기다린다'라고만 한다. 인간의 목소리라는 조건은 말하지 않는다"
schedule:
  아침: "문 앞 예배당에서 바닥에 귀를 대고 박자를 센다"
  낮: "신도들에게 고동의 변화를 전한다"
  저녁: "왕녀 힐다와 밀담 — 문 앞 측정 초소 뒤편"
  밤: "예배당에서 기록 — 박자를 룬으로 새긴다"
places: [창백한 예배당, 바르둠 요새 아래층, 깊은 문 앞 측정 초소, 귀의 회랑 입구]
knows: [fact_kz_pulse_faster_311, fact_kz_gate_reopening, fact_kz_41_sealed_inside]
relations:
  - {to: npc_bror, type: 왕, like: -40, trust: -50, visibility: 공개, memo: null, words: "문을 덮은 자. 그러나 그 귀가 돌이 되어 가는 것을 보면 그도 듣고 있다. 우리를 버리지도 끌어올리지도 못한다"}
  - {to: npc_hilda, type: 계약자 왕녀, like: 20, trust: 40, visibility: 비밀, memo: null, words: "문을 열 수 있는 손을 가진 아이. 심장을 신이라 부르지 않는 법을 알려 주었다. 그 아이는 내 말을 믿었다"}
  - {to: npc_petar, type: 노래할 인간, like: 10, trust: 20, visibility: 일방, memo: 후보, words: "노래를 잘하는 계약 광부. 그의 목소리가 이미 한 번 심장을 흔들었다는 기록을 보았다"}
toward_player: "경청하는 눈. 노래할 줄 아는 인간이라면 선택지를 주지 않는 부드러움으로 문 앞까지 이끌려 한다"
persuade:
  likes: ["고동에 대한 정보", "노래 이야기", "조용히 귀 기울이는 태도"]
  hates: ["크게 말하는 것", "횃불을 얼굴에 들이대는 것", "고동을 '신'이라 부르거나 비웃는 것"]
roles:
  teacher: null
  companion: "불가"
  romance: null
regression:
  fixed:
    - "낙엽월 1일 저녁 힐다와 문 앞 측정 초소 뒤편에서 밀담을 나눈다"
    - "신도들의 납치가 이미 시작되었다 (회귀점의 사실)"
  deja_vu: none
hard_rules:
  - "고동을 '신'이라 부르지 않는다 — '심장'이라고만 한다"
  - "깊은 문 앞에서는 말하지 않고 손가락으로 두드린다"
  - "횃불을 보면 눈을 가리고 '눈부신 것'이라 부른다"
on_death: "수도회의 '입'이 사라져 위층과의 연락 두절. 심층 두르강의 이탈 가능성이 커진다. 힐다의 정보원 소멸"
story_seeds:
  - "그의 신도들이 계약 광부를 납치하기 시작했다. 납치된 광부 중에는 '노래를 잘하는' 이가 들어 있다"
  - "힐다에게 한 말이 문 개방의 불씨가 되었다. 그는 그 결과를 듣는 자리에 가장 먼저 서고 싶어 한다"
