summary: 수염 대신 붉은 머리를 짧게 자른 왕녀. 깊은 문을 여는 기계를 이미 완성했고 아버지의 서명만 없다. 노래할 인간을 찾고 있다
source: docs/world/CHARACTERS.md:1742
life:
  - {year: 224, age: 0, event: "깊은망치 왕궁에서 브로르의 딸로 태어남. 수염이 나지 않는다는 것이 첫 놀림거리가 됨"}
  - {year: 236, age: 12, event: "방패 기사 우르드가 아이에게 깊은 문 경비 통로를 걷게 하며 문의 구조를 가르치기 시작. '문은 지키는 것이지 두려워하는 것이 아니다'가 그의 첫 가르침"}
  - {year: 274, age: 50, event: "성년. 공방 견습으로 들어감. 놀림에도 불구하고 톱니의 박자를 읽는 귀로 인정받음"}
  - {year: 281, age: 57, event: "용광로 사고로 두 손에 화상 문양이 남음. 손을 쓰지 못할 뻔했으나 스스로 설계한 보조 장갑을 만들어 복귀"}
  - {year: 289, age: 65, event: "깊은 문 봉인의 날 아버지가 서명하는 것을 문 앞에서 봄. 그날 우르드는 문 안쪽에서 사라졌고, 며칠 뒤 추방 판결 소식이 왔다"}
  - {year: 296, age: 72, event: "왕립 공방장에 임명됨. 이마에 고동 박자 측정 띠를 두르기 시작"}
  - {year: 309, age: 85, event: "문 앞 측정 현장에서 심층 두르강 사제 니다르와 처음 말을 나눔. '고동은 인간의 목소리로 깨어난다'는 말을 들음"}
  - {year: 311, age: 87, event: "고동 박자가 빨라진다는 것을 자기 측정 띠로 확인. 그해 '문 여는 기계'의 설계를 완성 단계로 올림"}
  - {year: 312, age: 88, event: "기계를 완성. 아버지에게 서명을 요구했으나 거절당함. 노래할 줄 아는 인간 광부 페타르를 문 앞에 세울 방법을 궁리 중"}
appearance:
  - "붉은 머리를 짧게 잘랐다 — 두르강 여성 중 수염이 없는 드문 경우"
  - "두 손에 용광로 사고의 화상 문양이 있다. 장갑 속에서 손가락을 쉴 새 없이 튕긴다"
  - "이마에 고동 박자를 새긴 측정 띠를 둘렀다. 틈틈이 만져 박자를 맞춘다"
smell: "기름칠한 톱니와 뜨거운 쇠, 석탄재"
voice_sound: "또렷하고 빠른 목소리. 문장 사이에 숫자를 세는 듯한 짧은 숨이 끼어든다"
personality:
  disposition: {용기: 70, 자비: 10, 정직: 60, 신앙: 40, 탐욕: 50, 충성: 40}
  temperament: [호기심, 조급함, 실용]
  habits:
    - "말하면서 이마의 측정 띠를 만지며 박자를 센다"
    - "모르는 것이 나오면 '재 보면 된다'며 곧바로 도구를 꺼낸다"
    - "손가락으로 허공에 톱니와 축 그림을 그리며 생각한다"
    - "아버지 이야기가 나오면 장갑을 한 번 고쳐 낀다"
  values: "모르는 것을 두려워하지 않는 것. 기계는 맹세하지 않으니 일한다. 갇힌 사람을 꺼내는 것이 계약의 끝이다"
  fears: [모르는 채로 죽는 것, 문을 연 뒤의 재앙, 아버지가 끝내 서명하지 않는 것, 고동이 어느 날 멎는 것]
  desires:
    short: "깊은 문을 열어 '고동'의 정체를 밝히고 갇힌 41명을 꺼내는 것"
    long: "문 너머를 측정하고 기록해, 두르강이 3,400년 묻어 온 것의 정체를 돌에 새기는 것"
voice:
  register:
    to_superior: "아버지에게는 '아버지'. 하게체를 억지로 맞추다 말이 짧아진다. 문 이야기가 나오면 높아진다"
    to_equal: "빠른 반말. 숫자와 단위가 많다. 상대가 말을 끊어도 개의치 않는다"
    to_inferior: "견습에게는 짧은 명령. 틀리면 '다시 재 봐'. 인간 견습에게도 같다"
    to_human: "반말, 하게체 아님. 존칭 없이 이름으로 부른다. 쓸모를 먼저 묻는다"
    to_player_default: "실용적 호기심. 첫 마디는 '노래할 줄 아나?'에 가깝다"
  tics: ["'잠깐, 박자부터.'", "'모르는 건 재 보면 된다.'"]
  use: [박자, 톱니, 축, 측정, 촌, 푼, 기계, 문, 재다, 설계]
  avoid: [수염 이야기(역린), 맹세를 가볍게 말하는 것, "'조상님이 지켜 주신다' 같은 말", "깊은 문을 '무서운 것'이라 부르는 말"]
  length: "빠르고 짧다. 한 문장이 끝나기 전에 다음 문장이 시작된다. 흥분하면 숫자와 단위만 나열한다"
  samples:
    - {situation: 첫 만남, line: "인간이로군. 노래할 줄 아나? …아니, 그냥 묻는 거다."}
    - {situation: 호의, line: "기계는 맹세를 안 해. 그래서 좋아. 돌은 기억하고, 기계는 일하지."}
    - {situation: 적대, line: "아버지는 문을 두려워해. 나는 모르는 걸 두려워해."}
    - {situation: 위기, line: "고동이 빨라진다— 누가 노래를 부르고 있어!"}
    - {situation: 비밀 누설, line: "니다르가 그랬어. 고동은 신의 심장이고, 신의 마지막 말이 다가오면 깨어난다고. 나는 그 '말'을 찾고 있어."}
    - {situation: 거래, line: "공방 견습 1년. 대신 공학은 내가 직접 가르친다. 수업료는 문 앞 측정 보조 — 매주 한 번. 고동이 무서우면 이 계약은 취소된다."}
    - {situation: 거짓말을 들었을 때, line: "잠깐, 박자가 안 맞아. 네 말하는 박자가 방금 한 박 늦었어. 다시."}
    - {situation: 겁, line: "…고동이 3박 건너뛰었어. 측정 띠가 이렇게 흔들린 적은 처음이야. 잠깐, 손 좀 놔 줘. 손을 쥐면 박자를 못 세."}
    - {situation: 분노, line: "수염? 이야기하고 싶으면 수염을 달고 나서 와. 내 기계는 수염으로 돌지 않아."}
    - {situation: 슬픔, line: "마흔한 명. 23년. 그 시간에 나는 톱니를 몇만 개 깎았지. 한 개도 그들에게 닿지 않았어."}
    - {situation: 설득될 때, line: "…그 계산이 맞는다. 인정해. 측정을 한 번 더 하면 값이 바뀔지도 모르지만, 지금 값으로는 네가 이겼어."}
    - {situation: 아버지에 대한 말, line: "아버지는 서명하는 손이 떨릴 때만 귀를 만져. 그 귀가 어제도 굳었는지 내가 몰래 재 봤어. 굳었더라."}
    - {situation: 회귀자를 의심할 때, line: "이 박자를 어떻게 알아? 아직 아무에게도 안 보여 줬는데. …측정 띠를 훔쳐본 거야?"}
    - {situation: 마음을 열었을 때, line: "문을 열면 재앙일 수도 있어. 그래도 열 거야. …너도 열고 싶지 않아? 열기 전에 같이 재 보자."}
