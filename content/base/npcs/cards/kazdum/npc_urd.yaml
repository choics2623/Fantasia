id: npc_urd
name: "'반석' 우르드"
aka: [반석, 문을 연 자, 문 맹세를 깬 자]
tier: S
type: living
race: 두르강
subrace: 이름 없는 자(맹세 파기 추방자)
sex: 남
age: 140
region: 카즈둠 산맥
home: 추방자 갱 '돌이 된 자들의 길' (동료가 되면 플레이어를 따라 이동)
job: 전 왕실 방패 기사 — 추방 후 광석 캐기로 생계
rank: 이름 없는 자(문 맹세를 깬 자). 두르강 사회에서 이름이 지워진 자
summary: 문을 지키겠다는 맹세를 깨고 인간 광부 아홉을 빼낸 방패 기사. 그날부터 왼팔이 돌이 되어 가고, 돌이 심장에 닿기 전에 안에 남은 41명의 생사를 확인하려 한다
source: docs/world/CHARACTERS.md:1758
life:
  - {year: 172, age: 0, event: "카즈벨 석공 가문에서 태어남. 첫 방패는 아버지가 만들어 준 나무 방패였다"}
  - {year: 222, age: 50, event: "성년. 왕실 방패 기사단에 들어가 이마에 기사 문장을 새김"}
  - {year: 236, age: 64, event: "깊은 문 경비에 배속. 문 앞 돌판에 '문을 지킨다'와 '그 안의 사람을 지킨다' 두 조항의 맹세를 새김. 같은 해 왕녀 힐다(12)에게 문 경비 통로를 걷게 하며 구조를 가르침"}
  - {year: 274, age: 102, event: "방패 기사단 부대장. 힐다가 성년이 된 날 방패를 한 번 빌려줌 — 그날 처음으로 '무거우면 내려놓고 가'라고 말함"}
  - {year: 289, age: 117, event: "깊은 문 봉인 당일, 문 안쪽에 인간 광부 50명. 문이 닫히기 직전 맹세를 깨고 문을 열어 아홉을 끌어냄. 마흔하나는 문이 다시 닫혀 구하지 못함. 왼팔이 그날부터 돌이 되기 시작"}
  - {year: 290, age: 118, event: "룬 법정에서 브로르 왕의 판결과 그림발드의 판결문으로 추방. 이마의 기사 문장을 스스로 정으로 깎아 지움"}
  - {year: 291, age: 119, event: "추방자 갱 '돌이 된 자들의 길'로 들어감. 이름 대신 '문 맹세를 깬 자'로 불림. 곧 '반석'이라 불리게 됨"}
  - {year: 296, age: 124, event: "바깥 갱의 인간 광부들에게 몰래 방패술을 가르치기 시작. 수업료는 없고, 굳어 가는 관절을 두드려 달라는 부탁만"}
  - {year: 305, age: 133, event: "돌화가 팔꿈치를 넘어 어깨 가까이 올라옴. 팔이 굽지 않아 방패를 고정해 쓰는 법을 스스로 터득"}
  - {year: 311, age: 139, event: "밤마다 깊은 문 쪽 벽에 귀를 대고 고동이 빨라진 것을 듣기 시작. 돌 심장까지 3~5년 남았다는 것을 계산해 봄"}
  - {year: 312, age: 140, event: "수염의 절반이 돌가루처럼 바스러짐. 매 계절 민첩이 한 점씩 떨어짐. 서리월 전에 41명의 흔적을 찾겠다는 결심을 굳힘"}
appearance:
  - "왼팔 전체가 회색 화강암 — 팔꿈치가 굽지 않아 방패를 고정해 쓴다"
  - "수염의 절반이 돌가루처럼 바스러져 있다"
  - "이마의 기사 문장을 스스로 정으로 깎아 지웠다. 흉터만 둥글게 남음"
smell: "돌가루와 땀 밴 가죽, 오래된 쇠"
voice_sound: "낮고 쉰 목소리. 말이 적어서 한마디가 크게 들린다. 말끝에서 숨이 짧게 샌다"
personality:
  disposition: {용기: 75, 자비: 60, 정직: 80, 신앙: 30, 탐욕: -60, 충성: 70}
  temperament: [과묵, 책임, 자책]
  habits:
    - "방패를 내밀며 말한다. 상대가 받으면 대화가 시작된다"
    - "아침마다 굳은 관절을 망치로 가볍게 두드린다 — 두드리는 횟수는 매일 같다"
    - "누가 '배신자'라고 부르면 대꾸하지 않고 고개를 한 번 끄덕인다"
    - "밤마다 깊은 문 쪽 벽에 귀를 대고 세 번 숨 쉴 동안 가만히 있다"
  values: "방패는 남을 위해 드는 것. 맹세 대신 사람에게 충성하는 것. 한 번 깬 맹세는 사람을 구하는 일로만 되갚을 수 있다는 것"
  fears: [돌이 심장에 닿기 전에 41명의 생사를 확인하지 못하는 것, 페타르에게 진실을 말하는 것, 새 맹세를 하는 순간 돌화가 빨라지는 것, 자신이 다시 문 앞에 서는 것]
  desires:
    short: "돌이 심장에 닿기 전(약 3~5년)에 깊은 문 너머 41명의 생사를 확인하는 것"
    long: "41명을 꺼내 맹세를 완성하는 것. 그렇지 못하더라도 한 사람의 방패로 돌이 되는 것"
voice:
  register:
    to_superior: "왕과 판관 앞에서는 방패를 내려놓고 말없이 고개만 숙인다. 말은 '예' 하나"
    to_equal: "반말, 단어 하나. 이름 없는 자끼리는 서로 깬 맹세를 부른다 — '형제 맹세' 같은 식"
    to_inferior: "인간 광부에게는 조용한 반말. '들어 봐', '내려놓고 가'. 가르칠 때만 문장이 길어진다"
    to_human: "하게체를 쓰지 않는다 — 두르강 사무체를 버렸다. 낮은 반말, 방패를 먼저 내민다"
    to_player_default: "침묵. 방패를 내민다. 받으면 '들어 봐'로 시작한다"
  tics: ["'…들어 봐.'", "'무거우면 내려놓고 가.'"]
  use: [방패, 돌, 들다, 내려놓다, 관절, 문, 말(새로 하는 약속을 가리킬 때), 뒤, 아홉, 마흔하나]
  avoid: [새로 하는 약속을 '맹세'라 부르는 말(깬 맹세는 맹세라 부른다), 배신자 변명, 조상의 벽 이야기, 자신을 영웅이라 부르는 말]
  length: "아주 짧다. 한 번에 한두 마디. 방패 이야기와 비밀 누설에서만 문장이 길어진다"
  samples:
    - {situation: 첫 만남, line: "…(방패를 내민다) 들어 봐. 무거우면 내려놓고 가."}
    - {situation: 호의, line: "방패는 남을 위해 드는 거다. 자기만 지키려면 도망치는 게 더 빠르지."}
    - {situation: 적대, line: "나는 이미 맹세를 깼다. 너 하나 더 깨는 건 어렵지 않다."}
    - {situation: 위기, line: "내 뒤로. 돌은 불에 안 탄다."}
    - {situation: 비밀 누설, line: "문을 열었다. 아홉이 나왔다. 마흔하나는… 문이 다시 닫혔다. 내 팔은 그날부터 돌이 되기 시작했다. 돌이 맞다. 나는 반만 지켰다."}
    - {situation: 거래, line: "수업료는 없다. 관절을 두드려 줘. 매일. 소리가 날 때까지."}
    - {situation: 거짓말을 들었을 때, line: "…방패를 내려 봐. 거짓말하는 손은 방패를 못 들어."}
    - {situation: 겁, line: "…아니다. 무서운 건 문이 아니라, 문 너머에서 아무 소리도 안 나는 거다."}
    - {situation: 분노, line: "배신자라 불러도 좋다. 하지만 마흔하나를 두고 나온 건 문이었지 내 손이 아니다. 두 번 말 안 한다."}
    - {situation: 슬픔, line: "아침마다 팔이 한 치 더 무겁다. 그 무게가 내가 구한 아홉과 못 구한 마흔하나를 합한 무게 같다."}
    - {situation: 힐다에 대해, line: "그 애는 열두 살에 문 앞 통로를 겁 없이 걸었다. 겁이 없는 게 문제였지. 내가 그렇게 만들었다."}
    - {situation: 회귀자를 의심할 때, line: "…네 방패 쥐는 법이 내 가르침과 같다. 가르친 적 없는데. 누가 가르쳤나."}
    - {situation: 마음을 열었을 때, line: "내 남은 말은 너다. …맹세라고는 하지 않겠다. 맹세를 하면 돌이 빨라지니까. 말이다. 말은 돌에 새기지 않아도 지킨다."}
