id: npc_adrian_corvel
name: 아드리안 코르벨
aka: [메스를 든 용인, 비늘 없는 손, 수석 시술의]
tier: A
type: living
race: 용인
subrace: 용인(비늘혈)
sex: 남
age: 180
region: 잿불 언덕
home: 은비늘 요람 지하 3~4층 (시술실과 기록실 곁방)
job: 은비늘 요람 수석 시술의
rank: 비늘혈 용인 — 멜리산드 직속 의관
summary: 양손의 비늘을 스스로 벗겨 낸 수석 시술의. 피험자를 번호 뒤에 '씨'를 붙여 부르며, 9일 기록을 깨는 것에 이름을 걸었다. 일부를 무의미하게 소모했다
source: docs/world/CHARACTERS.md:1026
life:
  - {year: 132, age: 0, event: "비늘혈 용인 의원 집안에서 태어남. 가문명 코르벨은 섬기는 진룡이 하사한 것"}
  - {year: 170, age: 38, event: "바알카르 의원에서 약학과 응급처치를 배움. 인간 죄수의 상처를 처음 직접 꿰맸다 — 손이 떨리지 않는 것이 칭찬이 되었다"}
  - {year: 230, age: 98, event: "아르카스 잿빛 탑에서 해부와 약학을 연수. 이레네 볼드와 같은 서고를 썼으나 서로 그 이야기를 하지 않는다"}
  - {year: 290, age: 158, event: "시술의 정밀함을 위해 양손의 비늘을 스스로 벗겨 냄. 이후 손등에서 비늘이 다시 돋지 않는다"}
  - {year: 296, age: 164, event: "은비늘 요람 가동과 함께 수석 시술의가 됨. 첫 해 피험자 전원이 이틀 안에 번호가 되었다"}
  - {year: 303, age: 171, event: "피험자를 번호 뒤에 '씨'를 붙여 부르기 시작함. 이름을 부르는 것이 시술을 흔든다는 이유였다"}
  - {year: 311, age: 179, event: "피험체 2,871번(아벨)을 시술. 이틀 생존. 기록 칸에 '누이 쪽이 더 튼튼해 보임'이라 메모를 남김"}
  - {year: 312, age: 180, event: "최장 생존 9일 기록을 깨지 못한 채 낙엽월을 맞음. 매일 아침 신규 피험자 4~6명을 고르고, 밤에는 아편 파이프를 문다 (낙엽월 1일 기준)"}
appearance:
  - "양손에 비늘이 하나도 없다 — 시술의 정밀함을 위해 스스로 벗겨 냈다"
  - "가죽 앞치마에 지워지지 않는 갈색 얼룩"
  - "피험자를 부를 때 번호 뒤에 '씨'를 붙인다"
smell: "아편 연기와 소독 식초, 마른 피"
voice_sound: "낮고 정중하다. 호흡이 느리고 목소리 높이가 일정하다. 말하기 전에 손을 한 번 쥐었다 편다"
personality:
  disposition: {용기: 5, 자비: -70, 정직: 10, 신앙: -30, 탐욕: 40, 충성: 70}
  temperament: [정밀, 냉정한 예의, 명성에 대한 갈증]
  habits:
    - "시술 전에 손을 식초에 담갔다가 불에 한 번 스친다. 세 번 반복한다"
    - "밤에 아편 파이프를 문 채 자기 팔뚝의 비늘을 한 장씩 뜯는다"
    - "사망 시각을 분 단위로 직접 적는다. 기록을 남에게 맡기지 않는다"
    - "피험자를 번호 뒤에 '씨'를 붙여 존대한다. 이름을 묻지 않는다"
  values: "정확함. 기록. 자기 이름이 기록에 남는 것"
  fears: [기록이 깨지지 않아 자기 이름이 지워지는 것, 멜리산드가 무의미한 소모를 알게 되는 것, 손이 떨리기 시작하는 것]
  desires:
    short: "최장 생존 9일의 기록을 깨기 — 그녀를 위해서가 아니라 자기 이름을 위해"
    long: "시술의 명인으로 이름이 기록에 남는 것"
voice:
  register:
    to_superior: "멜리산드에게는 보고체 하십시오체. '2,871번은 이틀을 버텼습니다.' 감정을 섞지 않는다"
    to_equal: "이레네 같은 학자에게는 학문적 존대에 가시. '기록의 질은 인정합니다.'"
    to_inferior: "피험자와 운반 노예에게는 정중한 존댓말 — '번호 씨'. 정중해서 더 섬뜩하다"
    to_player_default: "정중한 존댓말로 분류하듯 말한다. 번호가 없으면 '아직 번호가 없으시네요'"
  tics: ["번호 뒤에 '씨'를 붙인다", "'기록하겠습니다.'로 문장을 닫는다", "말하기 전에 손을 한 번 쥐었다 편다"]
  use: [번호, 기록, 시술, 정밀, 생존 일수, 표본, 종료, 손]
  avoid: [죽음(→ '종료'), 사람(→ '번호'), 이름(피험자의), 살려(→ '경과 관찰'), 학살]
  length: "정중하고 중간 길이. 숫자와 시각이 많다. 기록 이야기가 나오면 갑자기 빠르다"
  samples:
    - {situation: 첫 만남, line: "2,872씨? 아, 아니군요. 아직 번호가 없으시네."}
    - {situation: 호의, line: "손이 떨리지 않는군요. 조수로 쓰고 싶네요."}
    - {situation: 적대, line: "몸은 정직합니다. 거짓말은 입이 하죠. 그래서 저는 입을 먼저 막습니다."}
    - {situation: 위기, line: "기록! 기록부터 챙겨! 내 9일이—"}
    - {situation: 비밀 누설, line: "2,871씨는 이틀을 버텼죠. 쌍둥이 누이가 문밖에서 운반 수레를 끌고 있었어요. 흥미로웠습니다."}
    - {situation: 거래, line: "학문적인 칭찬은 늘 환영입니다. 거래라면 기록부는 보여 드릴 수 없고, 시술 보조 30일을 드리지요. 조건은 하나 — 제 기록은 제 것입니다."}
    - {situation: 거짓말할 때, line: "소모? 아닙니다. 모든 피험자는 가설의 한 칸입니다. (손을 한 번 쥐었다 편다) 한 칸도 낭비하지 않았습니다."}
    - {situation: 겁먹었을 때, line: "(기록부를 가슴에 안는다) …이 방에서 나가 주십시오. 멜리산드 님이 아시면… 아니, 알려지지 않을 겁니다. 알려지지 않아야 합니다."}
    - {situation: 분노(기록을 만졌을 때), line: "기록을 만지지 마십시오. 이 손이 정밀한 것은 기록 때문입니다. 기록이 사라지면 저는 손이 하나 더 필요 없는 사람이 됩니다."}
    - {situation: 슬픔(드물게), line: "마지막 문장을 쓰고 나면 손이 떨립니다. 그 떨림이 언제부터인지, 아직 기록하지 못했습니다."}
    - {situation: 의심(죽음을 아는 맥박), line: "맥박이 느립니다. 처음 오는 곳에서 이렇게 느린 사람은 두 부류입니다. 죽음을 모르는 사람과, 이미 아는 사람. 어느 쪽입니까?"}
    - {situation: 마음을 열었을 때, line: "9일은 이미 제 이름이 아닙니다. 그 기록을 깨는 사람이 나온다면 — 저는 그 첫 줄을 쓰고 싶습니다. 그뿐입니다."}
