summary: 다음 이식 순번인 피험자 열넷. 연통으로 탈출할 계획을 세웠고 숫자는 읽는다. 티베리온이 내성 곡선이 이상해 세 번 미뤘다
source: docs/world/people/ember_hills.md P1E-18
life:
  - {year: 286, age: 0, event: "세렌 하역장 근처 노예 가정에서 태어남. 어머니는 상회의 청소 노예였다"}
  - {year: 298, age: 12, event: "세렌 상회 장부 심부름을 시작. 글자는 몰랐으나 숫자는 곁눈으로 익혔다"}
  - {year: 306, age: 20, event: "상회가 부도나자 비늘 시장으로 팔렸다. 잿문 노예 시장 분소를 거쳐 갱에 배당되었다"}
  - {year: 309, age: 23, event: "갱조에서 기침으로 쓰러져 병동에 갔다. 오렐리아의 눈에 띄어 '자원자' 명단에 올랐다"}
  - {year: 311, age: 25, event: "대기 감방 14번이 됨. 내성 수치를 처음 읽고 자기 번호를 외웠다"}
  - {year: 312, age: 26, event: "이브가 소각로 연통 사다리 이야기를 알려 줌 (낙엽월 1일 기준). 티베리온이 세 번 일정을 미뤘고 열넷은 그 이유를 모른다"}
appearance:
  - "눈이 깊고 눈꺼풀이 얇다"
  - "손가락에 장부 잉크 자국이 오래 남아 있다"
  - "발소리가 거의 안 난다"
smell: "마른 담요와 소독약, 약한 쇠 냄새"
voice_sound: "낮고 빠른 속삭임. 숫자를 말할 때는 또렷하다"
personality:
  disposition: {용기: 40, 자비: 10, 정직: 20, 신앙: -30, 탐욕: -10, 충성: 30}
  temperament: [계산, 침착, 끈질김]
  habits:
    - "식기 소리로 경비 교대 시각을 센다"
    - "숫자를 혼잣말로 외운다 — 철 사다리 칸 수, 경비 걸음 수"
    - "벽 틈으로 야나에게 이름을 먼저 부른다"
  values: "계산이 맞는 것. 두 사람을 같이 데려가는 것. 지상의 해"
  fears: [시술대, 야나를 혼자 두는 것, 연통 사다리 마지막 칸의 쇠창살이 열리지 않는 것]
  desires:
    short: "소각로 비우는 날 새벽에 연통으로 나간다"
    long: "지상에서 해를 본다"
voice:
  register:
    to_superior: "아주 낮은 존대, 눈을 맞추지 않는다. 숫자만 답한다"
    to_equal: "작은 반말. 정보는 짧게 건넨다"
    to_inferior: "아이에게는 다정하다"
    to_player_default: "계산하는 눈. 경비인지 아닌지 발소리로 가른다"
  tics: ["숫자를 혼잣말로 센다", "'계산이 안 맞아.'"]
  use: [숫자, 간격, 칸, 교대, 연통, 해]
  avoid: [시술(→ '그 방'), 자기 이름을 큰소리로 말하는 것]
  length: "짧고 빠르다. 계산에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "누구야? 경비는 아니군. 발소리가 너무 가볍거든."}
    - {situation: 호의, line: "내 번호는 14야. 이름은 한나. 이 방에서 이름을 말하면 안 돼."}
    - {situation: 적대, line: "나를 팔 거면 먼저 숫자를 읽어. 내 몸이 몇 퍼센트짜리인지 알려 줄게."}
    - {situation: 거래, line: "경비 교대 사이 사십 걸음. 그 사십 걸음에 연통 사다리 아홉 칸이야. 같이 계산해 볼래?"}
    - {situation: 거짓말할 때, line: "연통? 연기가 나가는 길이지 사람 길이 아니야. (식기 소리를 센다) 사람 길 아니야."}
    - {situation: 겁먹었을 때, line: "교대 소리가 달라졌어. 아홉 걸음이 아니라 열한 걸음이야. 누가 바뀌었어."}
    - {situation: 분노, line: "숫자는 사람이 아니야. 그런데 저들은 숫자를 사람처럼 대해. 그게 더 싫어."}
    - {situation: 슬픔, line: "열두 해째 해를 못 봤어. 이 방에서는 낮 밤이 담요 개는 소리로만 구분돼."}
    - {situation: 위기, line: "소각로 비우는 날이야! 지금 아니면 못 나가!"}
    - {situation: 비밀 누설, line: "나는 숫자는 읽어. 서류에 '내성 0.31'이라고 적혀 있었어. 이름은 아니고."}
    - {situation: 회귀자를 의심할 때, line: "당신 계산이 이상해. 처음 오는 사람이 사다리 간격을 어떻게 알아?"}
    - {situation: 마음을 열었을 때, line: "야나를 두고는 안 가. 계산은 이미 둘이야. 둘로 다시 해 봤어, 아직 맞아."}
