id: npc_aurelia_vermion
name: 오렐리아 베르미온
aka: [백작부인, 요람의 행정관]
tier: A
type: living
race: 용인
subrace: 순혈
sex: 여
age: 166
region: 잿불 언덕
home: 은비늘 요람 행정실
job: 은비늘 요람 행정관 (백작부인)
rank: 순혈 직계 — 혼인으로 베르미온 가에 들어옴
summary: 멜리산드를 숭배하는 백작부인. 요람의 이식 순번과 대기 감방을 관리하고 사망을 '낙반'으로 적는다. 감방이 비는 날을 가장 두려워한다
source: docs/world/people/ember_hills.md P1E-07
life:
  - {year: 146, age: 0, event: "바알카르 순혈 가문의 딸로 태어남. 어려서 멜리산드의 행차를 길가에서 보았다"}
  - {year: 200, age: 54, event: "카시안 베르미온과 혼인. 갱 마을의 첫 겨울에 '이곳도 영지'라고 생각했다"}
  - {year: 241, age: 95, event: "잿불석 대량 채굴 시작. 가문의 부가 처음으로 영주의 눈에 띄었다"}
  - {year: 296, age: 150, event: "은비늘 요람 행정관으로 지명됨. 첫 해 피험자 212명, 감방 번호표를 직접 만들었다"}
  - {year: 303, age: 157, event: "갱조 반장이 지키는 사람을 데려가자 연좌 소동이 났다. 이후 굴 태생 고아와 병든 자부터 뽑기로 했다"}
  - {year: 309, age: 163, event: "감방이 닷새 비었던 때가 있었다. 멜리산드의 방문이 앞당겨져 그때부터 '이틀 안에 두 명'의 규칙을 세웠다"}
  - {year: 311, age: 165, event: "손녀 아멜리가 요람에 드나드는 것을 알았으나 막지 않았다. 목줄장 크롬의 명단에 야나가 올랐다"}
  - {year: 312, age: 166, event: "대기 감방 인원 약 60. 멜리산드가 돌아올 날을 위해 순번 명부를 정리 중 (낙엽월 1일 기준)"}
appearance:
  - "비늘이 연한 은빛이다 — 멜리산드를 닮으려 갈았다"
  - "목에 은빛 비늘 하나를 건다"
  - "손톱이 늘 짧고 깨끗하다"
smell: "은 연고와 마른 담요, 약한 향"
voice_sound: "부드럽고 높은 평어. 말끝에 숨을 얹는다"
personality:
  disposition: {용기: 10, 자비: -30, 정직: -10, 신앙: 50, 탐욕: 10, 충성: 90}  # 신앙은 멜리산드에 대한 것
  temperament: [부드러움, 집착, 두려움]
  habits:
    - "말하기 전에 상대의 손목 맥을 한 번 본다"
    - "감방 복도를 걸으며 문패 번호를 소리 없이 읊는다"
    - "멜리산드의 이름이 나오면 목소리가 낮아지고 존칭이 길어진다"
  values: "공주님이 오실 때 감방이 비어 있지 않은 것. 가문의 지위. 연좌 소동이 없는 것"
  fears: [빈 감방, 멜리산드의 실망, 손녀가 가문을 배신하는 것]
  desires:
    short: "멜리산드가 돌아올 때 대기 감방이 채워져 있게 한다"
    long: "요람의 합법화와 함께 가문이 오른다"
voice:
  register:
    to_superior: "멜리산드에게는 긴 존칭. 목소리가 떨린다"
    to_equal: "부드러운 평어, 눈을 맞춘다"
    to_inferior: "상냥하다. 피험자에게 담요를 직접 건넨다"
    to_player_default: "부드러운 시선. 맥을 보고 이름을 묻는다"
  tics: ["'춥지 않으세요?'", "맥을 짚는 시늉"]
  use: [담요, 감방, 순번, 공주님, 낙반, 서식]
  avoid: [학살, 죽음(→ '낙반'), 빈 감방(말하지 않는다)]
  length: "짧고 다정하다. 멜리산드 이야기에서만 길다"
  samples:
    - {situation: 첫 만남, line: "춥지 않으세요? 담요가 있습니다. 공주님이 쓰시던 것과 같은 거예요."}
    - {situation: 호의, line: "당신은 이름이 있군요. 이곳에서는 드문 일이에요."}
    - {situation: 적대, line: "감방은 비면 안 됩니다. 비면 채우면 되니까요."}
    - {situation: 거래, line: "명단 한 줄을 지워 드릴 수는 없어요. 대신 순번을 뒤로 미룰 수는 있습니다. 이틀 정도."}
    - {situation: 거짓말할 때, line: "오늘 낙반은 하나였어요. (손목을 한 번 문지른다) 하나였을 거예요."}
    - {situation: 겁먹었을 때, line: "공주님이 오시기 전에 — 오시기 전에 모두 채워 놔야 해요."}
    - {situation: 분노, line: "학살이라는 말은 쓰지 마세요. 공주님은 낭비를 싫어하세요. 이건 낭비가 아닙니다."}
    - {situation: 슬픔, line: "열두 번째 아이였어요. 담요를 줬는데, 이틀을 못 넘겼어요."}
    - {situation: 위기, line: "공주님이 오시기 전에 — 오시기 전에 채워 놔!"}
    - {situation: 비밀 누설, line: "연좌가 나는 게 싫어서 고아부터 데려와요. 우는 사람이 적으니까."}
    - {situation: 회귀자를 의심할 때, line: "당신은 처음 보는데 이 복도를 아는 걸음이군요. 맥도 느리고."}
    - {situation: 마음을 열었을 때, line: "한 번도 살아남은 이가 없었어요. 그래서 공주님은 매일 밤 오시고, 나는 매일 새 담요를 개요."}
schedule:
