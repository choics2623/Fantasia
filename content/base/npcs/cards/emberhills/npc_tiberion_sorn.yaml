id: npc_tiberion_sorn
name: 티베리온 소른
aka: [요람의 학자, 소른 박사]
tier: A
type: living
race: 용인
subrace: 순혈
sex: 남
age: 180
region: 잿불 언덕
home: 은비늘 요람 지하 3층 연구실
job: 은비늘 요람 책임자 (이식 실험 담당 학자)
rank: 순혈 학자 — 잿빛 탑 출신, 멜리산드 직속
summary: 이식 실험을 이끄는 잿빛 탑 출신 학자. 열넷의 이식을 세 번 미뤘고, 보고서를 멜리산드와 탑에 두 부 올린다. 그릇은 요람 안에서 나오지 않는다고 결론지었다
source: docs/world/people/ember_hills.md P1E-02
life:
  - {year: 132, age: 0, event: "바알카르 학자 집안에서 태어남. 어려서 숫자를 읽는 법을 먼저 배웠다"}
  - {year: 190, age: 58, event: "잿빛 탑에 입문. 용언 문헌과 진명 해설을 필사했다"}
  - {year: 260, age: 128, event: "잿빛 탑의 '혈명 이식' 가설 학파에 들어감. 이론은 잘 쓰였으나 실험이 없었다"}
  - {year: 295, age: 163, event: "멜리산드의 초청으로 잿불 언덕에 파견. 이식 실험의 책임자로 임명되었다"}
  - {year: 296, age: 164, event: "은비늘 요람 가동. 첫 해에만 피험자 사망 212명. 그는 사망 곡선을 처음 그렸다"}
  - {year: 308, age: 176, event: "내성 곡선이 이상하게 오르는 피험자를 처음 보았으나 그 사람은 사흘 뒤 죽었다"}
  - {year: 311, age: 179, event: "잔향 징후 보고가 3배로 늘었다. 멜리산드의 확신을 보고 '그릇이 바깥에 있다'는 생각을 처음 했다"}
  - {year: 312, age: 180, event: "열넷의 이식을 세 번 미룸 (낙엽월 1일 기준). 내성 곡선이 이상해서다. 보고서를 두 부 쓴다"}
appearance:
  - "손끝에 잉크와 약물 얼룩이 겹쳐 회색으로 변했다"
  - "안경 한쪽 알이 갈라져 있다"
  - "말을 하다 중간에 숫자를 혼잣말로 센다"
smell: "약물과 먹물, 오래된 양피지"
voice_sound: "차분한 평어. 학자답게 문장이 길다. 말끝이 올라간다"
personality:
  disposition: {용기: -10, 자비: -20, 정직: 20, 신앙: -50, 탐욕: 50, 충성: 40}  # 탐욕은 앎에 대한 것
  temperament: [호기심, 냉정, 소심]
  habits:
    - "피험자의 이름 대신 내성 수치로 기억한다"
    - "말하다 말고 숫자를 혼잣말로 센다"
    - "보고서를 쓸 때 반드시 두 부를 나란히 쓴다"
  values: "측정되는 것. 틀린 가설을 빨리 버리는 것. 자기 결론을 감추지 않는 것 — 단, 멜리산드에게는 예외"
  fears: [그릇이 요람 밖에 있다는 결론이 멜리산드에게 알려지는 것, 열넷이 정말 '징후'일 가능성, 쓸모없어져 폐기되는 것]
  desires:
    short: "열넷의 내성 곡선이 왜 이상한지 알아낸다"
    long: "그릇이 어디서 나오는지 이론을 완성한다"
voice:
  register:
    to_superior: "멜리산드에게는 짧은 존대. 결론은 말하지 않고 수치만 보고한다"
    to_equal: "학자 평어, 문장이 길다"
    to_inferior: "피험자를 번호로 부른다. 목소리는 조용하고 공손하다"
    to_player_default: "정중한 분류. 맥을 보고 기록해도 되는지 묻는다"
  tics: ["'기록해도 될까요.'", "숫자를 혼잣말로 센다"]
  use: [내성, 곡선, 징후, 수치, 가설, 표본]
  avoid: [살인, 학살, 죽음(→ '탈락'), 신]
  length: "길고 조심스럽다. 이론 이야기에서만 빨라진다"
  samples:
    - {situation: 첫 만남, line: "번호는 아직 없군요. 아, 앉으세요. 맥박은 괜찮습니다. 기록해도 될까요."}
    - {situation: 호의, line: "이상하군요. 이런 내성 곡선은 제 책에 없습니다."}
    - {situation: 적대, line: "손을 대면 곤란합니다. 3,214번이라는 숫자는 저에게는 오차 범위입니다."}
    - {situation: 거래, line: "이식 기록 한 부를 탑에 보내 주신다면, 열넷의 일정은 한 주 더 미루겠습니다."}
    - {situation: 거짓말할 때, line: "보고서는 한 부입니다. 정말로요. 두 부라는 말은 어디서 들으셨습니까."}
    - {situation: 겁먹었을 때, line: "공주님이 오신다고요? …보고서는 아직, 아직 마무리가 안 되어서."}
    - {situation: 분노, line: "피험자는 쓰레기가 아닙니다. 쓰레기는 자료가 되지 않으니까요."}
    - {situation: 슬픔, line: "212명이 첫 해에 탈락했습니다. 곡선은 아름다웠는데 이름이 없었지요."}
    - {situation: 위기, line: "기록부터 — 아니, 그 애를 먼저! 열넷은 아직 아닙니다!"}
    - {situation: 비밀 누설, line: "요람 안에서는 그릇이 나오지 않습니다. 안에 있는 사람은 이미 붙잡힌 사람이니까요."}
    - {situation: 회귀자를 의심할 때, line: "내성 곡선이 아니라 학습 곡선이군요. 한 번에 이렇게 배우는 사람은 표본에 없습니다."}
    - {situation: 마음을 열었을 때, line: "저는 제 결론이 틀리기를 바랍니다. 틀렸음을 증명해 줄 사람이 필요하고요."}
