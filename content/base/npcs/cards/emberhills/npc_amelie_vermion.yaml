    - {situation: 호의, line: "이름이 기억나요. 열일곱 개. 더는 기억이 안 나는 게 부끄러워요."}
    - {situation: 적대, line: "할머니께 말씀드리진 않을게요. 대신 저도 아무것도 듣지 않았어요."}
    - {situation: 거래, line: "이름 하나를 알려 주시면 저도 하나 알려 드릴게요. 한 번에 하나씩만요."}
    - {situation: 거짓말할 때, line: "명단? 저는 못 봤어요. (손톱을 문다) 아, 아니, 몇 줄만 봤어요."}
    - {situation: 겁먹었을 때, line: "할머니가 오세요! 숨으세요— 아니, 저는 숨을 데가 없어요."}
    - {situation: 분노, line: "그 이름들은 숫자가 아니에요. 하나씩 읽었는데, 하나씩 얼굴이 있었어요."}
    - {situation: 슬픔, line: "열일곱을 매일 외워요. 외우는 게 제가 할 수 있는 전부라서 외워요."}
    - {situation: 위기, line: "그 쪽으로 가지 마요! 요람 문은 제가 열 수 없어요!"}
    - {situation: 비밀 누설, line: "명단 마지막 쪽에 '야나'가 있었어요. 갱조 시간 중에 제 옷소매를 잡았던 아이일 거예요."}
    - {situation: 회귀자를 의심할 때, line: "…저를 아는 눈이군요. 우리 처음 보는 거 맞죠?"}
    - {situation: 마음을 열었을 때, line: "실바라에게는 말하지 않았어요. 친구에게 부끄러운 건, 아직 용기가 없어서예요."}
