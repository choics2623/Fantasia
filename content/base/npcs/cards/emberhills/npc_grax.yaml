appearance:
  - "손톱이 시커멓게 갈라졌다 — '검은 손톱' 지부의 표식"
  - "허리에 감은 가죽 채찍과 점호용 나무 패. 패의 모서리를 이빨로 문다"
  - "입가가 늘 씰룩인다. 겁이 날 때 더 심해진다"
smell: "석탄 먼지와 가죽 기름, 싸구려 담배"
voice_sound: "가늘고 날카롭다. 말끝이 올라가고 강한 상대 앞에서는 갑자기 낮아진다"
personality:
  disposition: {용기: -40, 자비: -70, 정직: -20, 신앙: 30, 탐욕: 30, 충성: 40}
  temperament: [비굴, 잔인, 계산]
  habits:
