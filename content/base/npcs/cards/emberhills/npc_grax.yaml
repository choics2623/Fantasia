voice:
  register:
    to_superior: "'예예 나리, 숫자는 맞추겠습니다.' 허리를 꺾고 눈을 들지 않는다"
    to_equal: "크릭 감독들끼리는 은어와 비웃음. 서로의 점호 숫자를 깎아내린다"
    to_inferior: "인간 노예에게는 고함. 이름 대신 번호"
    to_player_default: "번호와 반을 먼저 묻는 호통. 끝에 '…알겠나?'를 붙인다"
  tics: ["'숫자!'로 호통을 시작한다", "'맞추겠습니다'를 입버릇처럼 말한다", "말끝을 올려 '…알겠나?'로 묻는다"]
  use: [숫자, 점호, 할당량, 공급, 명단, 검은 손톱, 담배, 번호]
  avoid: [인간의 이름, 불쌍하다, 죽다(→ '빠지다'), 요람(자기 입으로는 '위')]
  length: "짧고 날카롭다. 고함 한두 마디. 윗사람 앞에서는 길고 굽신거린다"
  samples:
    - {situation: 첫 만남, line: "숫자! 몇 번 반이냐! 번호 없으면 번호 받을 때까지 서 있어, 알겠나?"}
    - {situation: 호의(드물게), line: "…오늘은 명단이 안 모자라니까 네 번호는 안 올린다. 대신 담배 하나 구해 와, 알겠나?"}
    - {situation: 적대, line: "할당량 미달 반은 명단에 오른다. 네 반이 미달이면 네 번호가 첫째 줄이야."}
    - {situation: 비밀 누설, line: "매주 여섯을 고른다. 약한 놈부터가 아니다. 조용한 놈부터야. 조용한 놈이 빠져도 반이 안 흔들리거든."}
    - {situation: 거래, line: "한 놈 대신 한 놈. 네가 대신 건네면 명단은 맞는다. 누구든. 이름은 안 물어."}
    - {situation: 겁먹었을 때, line: "(채찍을 떨어뜨린다) 하드리안 님이다— 아니, 아니, 모두 자리로! 숫자 맞춰라, 숫자!"}
