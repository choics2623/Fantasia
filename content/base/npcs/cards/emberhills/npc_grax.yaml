  - {year: 303, age: 29, event: "붉은 계단 총감독관으로 승진. 크릭 감독 40명을 지휘. 하드리안 숯턱에게 처음으로 이름을 불렸다"}
  - {year: 311, age: 37, event: "아드리안이 하루 4~6명으로 선별 수를 올리자 공급 명단을 확대하라는 압박을 받음. 담배 몫이 늘었다"}
