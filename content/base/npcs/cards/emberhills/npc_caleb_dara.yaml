id: npc_caleb_dara
name: 칼렙
aka: [9번 갱 갱조장, 손 벽의 칼렙, 기다리는 사람]
tier: A
type: living
race: 인간
subrace: 광산 인간
sex: 남
age: 58
region: 잿불 언덕
home: 굴 마을 검은 교대 구역
job: 9번 갱 갱조장 (다라손, 이름 없는 자들 잿불 언덕 등잔)
rank: 국유 노예 — 갱조장
summary: 다라손의 갱조장이자 이름 없는 자들의 잿불 언덕 등잔. 봉기를 원하지만 '기다려라'에 묶여 있고, 딸 야나가 요람 순번 37번에 올랐다
source: docs/world/people/ember_hills.md P1E-15
life:
  - {year: 254, age: 0, event: "굴 마을에서 태어남. 태어난 날 아버지가 붉은 진흙으로 손바닥을 찍어 9번 갱 벽에 남겼다"}
  - {year: 268, age: 14, event: "첫 입갱. 같은 갱조 동료가 낙반에 깔려 죽자 그 피를 손바닥에 묻혀 벽에 찍었다 — 손 벽의 사람이 되었다"}
  - {year: 285, age: 31, event: "도르테의 소개로 아내를 맞았다. 야나가 태어나던 해, 아내가 열병으로 죽었다"}
  - {year: 296, age: 42, event: "요람 가동. 갱조에서 아이가 둘 사라졌다. 그는 '기다려라'를 더 굳게 믿기로 했다"}
  - {year: 302, age: 48, event: "이름 없는 자들의 회색 여인이 보낸 매듭을 받아 잿불 언덕 등잔이 됨"}
  - {year: 309, age: 55, event: "9번 갱조장이 됨. 가장 많은 이름을 외운 사람이었다"}
  - {year: 311, age: 57, event: "목줄장 크롬이 모임 시간을 캐물었으나 말하지 않았다. 석 달 뒤 야나가 갱조에서 사라졌다"}
  - {year: 312, age: 58, event: "딸이 요람 순번 37번에 올랐다는 것을 안다 (낙엽월 1일 기준). 손을 벽에서 뗄 수 없다"}
appearance:
  - "손바닥이 붉은 진흙으로 물들어 있다"
  - "어깨가 한쪽으로 기울었다 — 낙반 흉터"
  - "말을 아끼려 턱을 든다"
smell: "젖은 흙, 붉은 진흙, 곡괭이 자루의 땀"
voice_sound: "낮고 갈라진 목소리. 갱 안에서는 입술만 움직인다"
personality:
  disposition: {용기: 40, 자비: 30, 정직: 40, 신앙: 30, 탐욕: -30, 충성: 90}  # 신앙은 다라에 대한 것
  temperament: [인내, 단단함, 침묵]
  habits:
    - "새 사람을 만나면 손바닥부터 본다"
    - "벽을 지날 때 손을 대고 한 박자 쉰다"
    - "회합에서 안건이 서면 말 대신 손을 벽에 둔다"
  values: "벽에서 손을 떼지 않는 것. 갱조를 버리지 않는 것. 기다리는 것"
  fears: [야나가 시술대에 오르는 것, 손 벽이 무너지는 것, 로크가 서둘러 갱조를 붉은 길에 세우는 것]
  desires:
    short: "딸 야나가 시술대에 오르기 전에 구한다"
    long: "다라의 오른손이 벽에 다시 찍히는 날을 본다"
voice:
  register:
    to_superior: "용인과 감독에게는 짧은 '예.' 눈은 바닥에"
    to_equal: "갱조원에게는 낮은 반말. 손으로 말을 보탠다"
    to_inferior: "신참과 아이에게는 느리고 부드럽다. 손바닥을 먼저 보인다"
    to_player_default: "손부터 본다. 말은 나중이다"
  tics: ["'손은?'", "'…벽에 있다.'"]
  use: [손, 벽, 갱조, 이름, 기다려, 그때]
  avoid: [봉기(→ '그때'), 하스트란 기사 이름, 붉은 길을 '반란'이라 부르는 말(→ '행진')]
  length: "짧다. 딸 이야기가 나오면 말이 끊긴다"
  samples:
    - {situation: 첫 만남, line: "손은?"}
    - {situation: 호의, line: "벽에 있다. …그렇게 대답하는 거야, 이 갱에서는."}
    - {situation: 적대, line: "하스트란이라고 입에 올렸나. 발언이 정지되었다, 이 갱조에서는."}
    - {situation: 거래, line: "곡괭이 머리가 필요하면 물웅덩이를 찾아. 길은 내가 안 가르쳐 줘. 대신 이름 하나를 외워 줘."}
    - {situation: 거짓말할 때, line: "모임? 그런 건 없어. (손바닥으로 허벅지를 한 번 문지른다) 교대 사이에 쉴 뿐이지."}
    - {situation: 겁먹었을 때, line: "크롬이 왔어? 입 다물어. 손은 벽에 두고."}
    - {situation: 분노, line: "행진이야. 반란이 아니라. 만 명이 걸었어. 걸은 사람을 반란자라 부르지 마."}
    - {situation: 슬픔, line: "딸은 열아홉이야. 벽에 찍은 손바닥이 아직 작아. 나는 그 손을 뗄 수가 없다."}
    - {situation: 위기, line: "벽에서 손 떼지 마! 떼면 끝이야!"}
    - {situation: 비밀 누설, line: "딸이 시술대에 오른다. 나는 손을 벽에서 뗄 수가 없다. 뗀 사람이 있었지. 이름이 지워졌어."}
    - {situation: 회귀자를 의심할 때, line: "자네 손바닥은 붉지 않은데 벽을 아는 눈이야. 어디서 배웠나."}
    - {situation: 마음을 열었을 때, line: "다라의 오른손이 돌아오는 날이 신호야. 그 전에 딸을 구할 수 있다면… 나는 손을 뗄 수도 있어."}
