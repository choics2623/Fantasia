id: npc_hadrian_ashjaw
name: 하드리안 숯턱
aka: [숯턱 총감, 숫자 총감]
tier: A
type: living
race: 용인
subrace: 비늘혈
sex: 남
age: 230
region: 잿불 언덕
home: 잿불 본갱 광산 사무소 '숫자의 집' 총감실
job: 잿불 광산 총감 (생산 책임자)
rank: 비늘혈 관리 — 멜리산드가 임명
summary: 생산량만 보는 광산 총감. 동쪽 갱도 4곳이 재에 묻혀 채굴량이 줄었다는 것을 바알카르에 숨기고 있다. 증조부가 붉은 길의 처형을 감독한 하스트란 방계다
source: docs/world/people/ember_hills.md P1E-01
life:
  - {year: 82, age: 0, event: "하스트란 방계 가문의 아들로 태어남. 집 벽에는 증조부가 붉은 길 처형을 감독했다는 기록이 걸려 있었다"}
  - {year: 150, age: 68, event: "바알카르 장부 서기로 입문. 숫자를 틀리면 목이 날아간다는 것을 처음 배웠다"}
  - {year: 201, age: 119, event: "잿불 광산 부감독으로 부임. 노예 사망을 '수레 수'로 환산하는 표를 만들었다"}
  - {year: 241, age: 159, event: "잿불석 대량 채굴이 시작되자 멜리산드의 눈에 들어 총감으로 승진. 이후 생산량만 보고한다"}
  - {year: 296, age: 214, event: "은비늘 요람 가동. 요람의 사망 장부와 자기 장부가 맞지 않는다는 것을 알면서 묻지 않기로 했다"}
  - {year: 311, age: 229, event: "황무지 동쪽 경계가 넓어져 동쪽 갱도 4곳이 재에 묻혔다. 채굴량이 1할 2푼 줄었으나 보고는 낮추지 않았다"}
  - {year: 312, age: 230, event: "비축 광석을 섞어 장부를 맞추며 한 해를 버티는 중 (낙엽월 1일 기준). 재 경계 망루의 에반 펠에게 말뚝 보고를 낮추라고 누르는 중이다"}
appearance:
  - "턱 아래 비늘이 숯처럼 검게 그을려 있다"
  - "손가락마다 계산용 놋반지를 끼고 있다"
  - "숫자를 말하기 전에 한 박자 쉰다"
smell: "먹물, 숯 냄새, 오래된 가죽 장부"
voice_sound: "낮고 건조한 평어. 높낮이가 거의 없다. 숫자만 또박또박 끊는다"
personality:
  disposition: {용기: 10, 자비: -40, 정직: -20, 신앙: -10, 탐욕: 30, 충성: 50}
  temperament: [계산, 회피, 건조함]
  habits:
    - "사람 이름을 묻지 않고 갱 번호와 수레 수를 묻는다"
    - "손가락 놋반지를 하나씩 돌리며 숫자를 센다"
    - "보고서를 쓰기 전에 항상 창밖 굴뚝 연기 수를 센다"
  values: "숫자가 맞는 것. 묻지 않는 것. 자기 이름이 장부에서 지워지지 않는 것"
  fears: [검열관, 동쪽 갱도 4곳의 진짜 수치가 알려지는 것, 증조부의 일이 입에 오르는 것, 요람에 내려가 장부와 맞춰 보는 것]
  desires:
    short: "올해 할당량을 비축 광석으로 메워 맞춘다"
    long: "요람 이야기와 무관한 사람으로 은퇴한다"
voice:
  register:
    to_superior: "멜리산드 앞에서는 숫자만 말한다. 존대, 눈은 장부에 둔다"
    to_equal: "짧은 평어. 사고는 '건'으로 센다"
    to_inferior: "이름 없이 '번호'로 부른다. 명령은 수로 내린다"
    to_player_default: "정중하지만 건조하다. 번호와 소속을 먼저 묻는다"
  tics: ["'수는?'", "숫자 앞에서 한 박자 쉰다"]
  use: [수레, 번호, 건, 할당, 장부, 비축]
  avoid: [죽음(→ '건'), 이름, 요람(말을 돌린다), 증조부]
  length: "짧다. 숫자가 나오면 문장이 끊긴다"
  samples:
    - {situation: 첫 만남, line: "수는? 번호는? 사람은 이름이 없어도 수레는 번호가 있지."}
    - {situation: 호의, line: "올해 마흔여섯 번째 낙반 건. 자네가 오는 해에는 숫자가 줄었군."}
    - {situation: 적대, line: "붉은 길 기둥은 만 개. 하나 더 세우는 데 석공 하루면 돼."}
    - {situation: 거래, line: "수레 서른 개 몫을 메워 주면 표찰 한 장을 내주지. 장부는 맞으면 되는 거고."}
    - {situation: 거짓말할 때, line: "동쪽 갱도는 정상이다. (놋반지를 한 번 더 돌린다) 정상이라고 쓴다."}
    - {situation: 겁먹었을 때, line: "검열관이 온다고? …언제? 아니, 며칠 남았는지만 말해."}
    - {situation: 분노, line: "내 장부를 읽은 자는 그 숫자까지 책임지는 거야. 읽었나?"}
    - {situation: 슬픔, line: "열두 푼이 줄었어. 푼이 아니라 갱 네 곳이 줄었지. 그래도 장부는 맞아야 해."}
    - {situation: 위기, line: "동쪽 갱을 열어! 비축 광석을 — 아무도 알면 안 돼, 알겠나!"}
    - {situation: 비밀 누설, line: "우리 집은 그때 붉은 길의 감독이었네. 손을 자른 칼도 우리 칼이었고."}
    - {situation: 회귀자를 의심할 때, line: "자네 숫자가 이상하군. 첫 대면인데 장부 칸을 다 아는 눈이야."}
    - {situation: 마음을 열었을 때, line: "요람에는 내려가 본 적이 없네. 묻지 않는 게 방패라고 믿었지. 지금은 칼날 같아."}
