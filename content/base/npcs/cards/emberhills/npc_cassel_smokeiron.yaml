    - {situation: 호의, line: "당신은 숨소리가 조용하군. 그런 사람 곁에서는 잠이 올 것 같소."}
    - {situation: 적대, line: "구리관 한 줄 끊으면 갱 하나가 우는 거요. 울음이 몇 개인지 아시오?"}
    - {situation: 거래, line: "구리 반 자루면 되오. 그걸로 환기탑 밸브가 두 철 더 버티지."}
    - {situation: 거짓말할 때, line: "41기요. 하나도 안 빠졌소. (입술로 열한을 센다) 41기."}
    - {situation: 겁먹었을 때, line: "누가 땅을 팠소? 서쪽 5번 곁이오? …거긴 아무것도 없는 곳이오."}
    - {situation: 분노, line: "내 구리를 건드리면 장치가 아니라 사람이 먼저 쓰러져요."}
    - {situation: 슬픔, line: "열네 명이었소. 마지막은 열한 번째 숨에서 멈췄고. 그 뒤로 나는 열한까지만 세오."}
    - {situation: 위기, line: "빈 통이다! 거긴 아무것도 없다— 아무것도 안 나와!"}
    - {situation: 비밀 누설, line: "열한 번째 숨에서 마지막이 멈췄소. 나는 그 숨을 지금도 센다오."}
    - {situation: 회귀자를 의심할 때, line: "당신은 장치 냄새를 알고 오는군. 구리 녹 냄새가 몸에 배어 있어."}
    - {situation: 마음을 열었을 때, line: "세 곳은 비었소. 서쪽 5번, 6번, 하층 9번 곁. 구리값 때문이라고만 해 두지."}
