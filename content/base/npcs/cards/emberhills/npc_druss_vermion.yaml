rank: 순혈 직계 — 가문 갱도 일상 관리
summary: 다라의 반란이 되풀이되리라 믿고 갱도마다 독가스 장치를 숨긴 베르미온 가의 장남. 총열쇠 하나를 목에 걸고 산다
source: docs/world/people/ember_hills.md P1E-05
life:
  - {year: 200, age: 0, event: "베르미온 백작가의 장남으로 태어남. 다라의 반란 이야기를 어른들의 낮은 목소리로 들으며 자랐다"}
  - {year: 245, age: 45, event: "갱도 감독 수습. 처음으로 갱조 하나가 낙반으로 사라지는 것을 보았다"}
  - {year: 270, age: 70, event: "갱도 총감독 후보로 지명. 가문의 갱도 설계도 전체를 물려받았다"}
  - {year: 290, age: 90, event: "독가스 장치 구상 시작. 갱도마다 환기구에 붙일 구리관 설계를 직접 그렸다"}
  - {year: 296, age: 96, event: "요람 가동 해에 오렐리아와 갱조 모집선 분리 협상. 가문 안에 지휘선이 둘이 되었다"}
  - {year: 308, age: 108, event: "카셀이 열네 명의 지원 노예로 장치를 시험했다. 그는 시험 장면 앞에서 눈을 감지 않았다"}
  - {year: 311, age: 111, event: "황무지 경계 확장으로 동쪽 갱도 4곳이 재에 묻혔다. 장치 41기 중 몇 곳이 묻혔는지 직접 점검하지 못했다"}
  - {year: 312, age: 112, event: "독가스 장치 점검 순회 중 (낙엽월 1일 기준). 총열쇠를 목에 걸고 유언장에 카셀을 지명해 두었다"}
appearance:
