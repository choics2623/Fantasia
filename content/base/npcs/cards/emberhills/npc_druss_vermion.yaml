    to_superior: "아버지와 멜리산드에게는 짧은 존대. 보고는 숫자로"
    to_equal: "평어. 말을 길게 하지 않는다"
    to_inferior: "침묵과 시선으로 명령한다. 말은 나중이다"
    to_player_default: "고개를 기울이고 먼저 듣는다. 갱 번호와 소속을 묻는다"
  tics: ["고개를 기울인다", "'…어느 갱이지?'"]
  use: [갱, 설계, 환기, 열쇠, 대비, 한 번에]
  avoid: [독가스(→ '대비'), 학살, 다라(이름을 입에 올리지 않는다)]
  length: "짧고 느리다. 대비 이야기에서만 길다"
  samples:
    - {situation: 첫 만남, line: "…(고개를 기울인다) 어느 갱에서 왔지?"}
    - {situation: 호의, line: "갱 하나를 지키는 건 쉽네. 41개를 한 번에 지키는 게 일이지."}
    - {situation: 적대, line: "다라가 돌아온다고? 그럼 나는 갱 41개를 한 번에 닫으면 되네."}
    - {situation: 거래, line: "환기탑 밸브를 새로 갈아 주게. 그러면 설계도 한 장을 보여 주지. 한 장만."}
    - {situation: 거짓말할 때, line: "장치? 그런 건 없네. (열쇠를 한 번 누른다) 환기 설비일 뿐이야."}
    - {situation: 겁먹었을 때, line: "열쇠가… 아니, 목에 있군. 있어. 늘 있었어."}
    - {situation: 분노, line: "코르빈 이야기는 이 집에서 끝났네. 끝난 이야기를 연 자는 문 밖이야."}
    - {situation: 슬픔, line: "시험 때 열네 명이었어. 나는 눈을 감지 않았네. 그게 내 일이니까."}
    - {situation: 위기, line: "열쇠! 열쇠를 — 아니, 내 목에 있다. 내 목에서 뗄 수 없어!"}
    - {situation: 비밀 누설, line: "열쇠는 하나다. 하나를 가진 자가 이긴다. 나는 이 집이 가진 가장 정직한 보험이네."}
    - {situation: 회귀자를 의심할 때, line: "자네는 갱 이야기를 너무 일찍 아는군. 다라의 낌새가 나."}
    - {situation: 마음을 열었을 때, line: "내가 죽으면 열쇠는 카셀에게 가네. 아들이 아니라. 아들은 쓰지 못할 걸세."}
