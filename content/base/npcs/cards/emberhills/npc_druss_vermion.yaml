  - "손바닥에 갱도 설계 선이 굳은살로 그어져 있다"
  - "말없이 고개를 한쪽으로 기울이는 버릇이 있다"
smell: "구리 녹, 젖은 쇠, 갱도 먼지"
voice_sound: "낮고 느린 목소리. 말을 아끼다 한 번에 길게 한다"
personality:
  disposition: {용기: 30, 자비: -60, 정직: 10, 신앙: -10, 탐욕: 10, 충성: 60}
  temperament: [침착, 의심, 끈질김]
  habits:
    - "말을 듣다 고개를 한쪽으로 기울인다"
    - "목의 구리 열쇠를 손으로 한 번 누르고 대답한다"
    - "갱도 입구를 지날 때마다 환기구 소리를 듣는다"
  values: "대비하는 것. 한 번에 끝내는 것. 아버지 세대가 못 한 일을 하는 것"
  fears: [다라의 반란이 돌아오는 것, 열쇠가 다른 손에 가는 것, 코르빈의 마지막이 알려지는 것]
  desires:
