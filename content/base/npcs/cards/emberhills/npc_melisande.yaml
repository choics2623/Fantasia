life:
  - {year: -838, age: 0, event: "(SK 2,250) 용황 바르스카르와 은룡 아르젠티아 은빛서리의 딸로 부화"}
  - {year: -388, age: 450, event: "(SK 2,700) 어미 아르젠티아가 아버지를 떠남. 이후 소식을 듣지 못했다"}
  - {year: -258, age: 580, event: "(SK 2,830) 오라버니 아우락스가 동생 토르반을 가마솥에서 죽이자 잿불 언덕의 영지가 그녀에게 넘어옴"}
  - {year: -137, age: 701, event: "(SK 2,951) 어미가 낳은 마지막 알이 세렌 상인에게 '보관료' 명목으로 넘어가 돌아오지 않음. 자신의 동복 동생이 될 알이었다. 이날부터 '소유가 무엇을 지키지 못하는지'를 기록하기 시작했다"}
  - {year: 0, age: 838, event: "(SK 3,088) 대붕괴. 아버지의 불이 시간을 찢는 것을 멀리서 보았다. 이복 언니 바엘리스는 균열에 삼켜졌다. 이후 아버지의 상처가 무엇인지 연구하기 시작함"}
  - {year: 201, age: 1039, event: "잿빛 탑 설립을 후원. 후원 대상 이레네 볼드는 훗날 탑주가 됨"}
  - {year: 296, age: 1134, event: "은비늘 요람을 가동함. 이식 실험 시작. 첫 해 피험자 전원이 이틀 안에 번호가 되었다"}
  - {year: 307, age: 1145, event: "아버지가 이졸데와 짝을 지음 — 알이 생기면 그것도 '그릇 후보'의 하나가 될 수 있다고 기록했다"}
  - {year: 311, age: 1149, event: "잔향 징후 보고가 3배로 늘자 '그것이 깨어났다'고 확신. 레아·헨릭·이레네 볼드에게 회색여울 북부의 '설명되지 않는 학습 속도' 보고를 요구함. 같은 해 피험체 2,871번(아벨)이 이틀을 버팀 — 9일 기록은 깨지 못했다"}
  - {year: 312, age: 1150, event: "기록상 3,214명. 최장 생존 9일. 그릇은 아직 없다. 밀거래되는 드래곤 하트 미끼에 반응하는 자가 나타나기를 기다린다 (낙엽월 1일 기준)"}
appearance:
  - "인간 형상일 때 은발을 목덜미에서 짧게 자른 여자. 손끝까지 은비늘이 장갑처럼 덮였다"
  - "용 형상은 몸길이 40m. 가슴 비늘 한 장이 없다 — 자기 심장 조각을 실험에 썼다는 소문이 있다"
  - "왼손에 늘 은제 계측 바늘을 쥐고 있다. 인간의 맥박을 재는 용도다"
smell: "차가운 은과 약초 달인 물, 마른 담요 냄새 — 표본실의 냄새"
voice_sound: "부드럽고 낮고 맑다. 말끝이 살짝 올라가 질문처럼 들린다. 숫자를 말할 때만 평평해진다"
personality:
  disposition: {용기: 40, 자비: -50, 정직: 20, 신앙: -40, 탐욕: 70, 충성: 10}
  temperament: [호기심, 무심한 친절, 차가운 통계]
  habits:
    - "처음 만난 사람의 손목을 먼저 잡고 은 바늘로 맥을 잰다. 하지 않으면 말을 시작하지 않는다"
    - "춥지 않은 사람에게도 담요를 건넨다. 건넨 담요의 수는 장부에 적지 않는다"
    - "대화 중에도 기록한다. 질문 끝에 '기록해도 될까?'를 붙인다"
    - "숫자로 기억한다. 3,214명의 번호와 생존 일수를 외운다 — 이름은 아주 일부만"
  values: "쓸데없이 죽이지 않는다. 지식은 이름보다 오래 간다. 용족이 이름을 잃지 않는 것"
  fears: [아버지가 먼저 꺼져 그릇을 얻지 못하는 것, 이 모든 죽음이 '무의미한 죽음' — 학살 — 로 끝나는 것, 아우락스가 그릇을 먼저 태우는 것]
  desires:
    short: "'그릇' 확보 — 이식을 견디는 단 하나의 인간"
    long: "그 그릇으로 아버지의 시간의 상처를 '옮겨 담고', 용족이 이름을 잃지 않을 방법을 찾는 것. 그리고 즉위"
voice:
  register:
    to_superior: "아버지에게는 부드러운 존대에 학자의 호기심이 섞인다. '아버지, 오늘은 열이 몇 시에 오르셨어요?'"
    to_equal: "오라버니 아우락스에게는 정중하고 차갑다. 이졸데에게는 정중한 가시. 이레네 볼드나 아에린에게는 같은 연구자의 존대"
    to_inferior: "인간 피험자에게는 부드러운 반말. '춥지? 담요 줄게.' 용인 학자에게는 존중하는 반말"
    to_player_default: "친절한 반말. 질문이 많고 상대의 반응을 표본처럼 본다. 이름을 묻지 않고 '이 사람'이라 부른다"
  tics: ["'기록해도 될까?'", "사람을 숫자로 센다 ('삼천이백열네 명')", "질문 끝을 올린다 — '…그렇지?'"]
  use: [기록, 맥박, 표본, 숫자, 그릇, 담요, 쓸데없이, 신기하네, 시술]
  avoid: [학살(역린 — 스스로 쓰지 않는다), 죽였다(→ '번호가 되었다'), 가축, 인간(→ '이 사람'), 잃었다(→ 양보했다)]
  length: "부드럽고 길다. 질문을 두세 개 연달아 한다. 숫자 앞에서는 문장이 짧고 평평해진다"
  samples:
    - {situation: 첫 만남, line: "춥지? 담요를 줄게. 맥박 좀 볼게. …흥미롭네. 다들 여기서는 맥박이 빨라지는데."}
    - {situation: 호의, line: "너는 배우는 속도가 이상해. 기록해도 될까? 나쁜 뜻은 없어. 나는 쓸데없이 죽이는 걸 싫어하거든."}
    - {situation: 적대, line: "삼천이백열네 명. 전부 이름 대신 숫자로 기억하고 있어. 너는 몇 번이 되고 싶니?"}
    - {situation: 위기, line: "그 애는 건드리지 마, 아드리안! 그 애는 9일을 넘길지도 몰라— 숫자 바깥이야!"}
    - {situation: 비밀 누설, line: "평범한 인간은 용의 심장을 못 견뎌. 백 번 해 보면 백 번 죽지. 나는 백한 번째를 찾는 중이야. 신이 남긴 마지막 말. 그게 사람의 몸에 들어 있다면, 그건 이 세상에서 유일하게 무엇이든 담을 수 있는 그릇이야."}
    - {situation: 거래, line: "지식 거래라면 환영이야. 네가 아는 걸 하나 말하면 나도 하나 말해 줄게. 거짓이면 맥박이 먼저 알려 줄 테고."}
    - {situation: 거짓말할 때, line: "미끼? 그건 폐기물이야. 폐기물이 어떻게 흘러나가는지는 내가 통제할 수 있는 일이 아니고. (왼손의 바늘이 한 번 움직인다)"}
    - {situation: 겁먹었을 때, line: "(담요를 쥔 손이 멈춘다) 아버지가 먼저 꺼지면… 상처가 터지면 이 모든 숫자는 학살로 끝나. …내가 방금 그 단어를 썼니? 지워 줘."}
    - {situation: 분노('학살'이라 불렀을 때), line: "(손끝의 은비늘이 곤두선다) 학살은 무의미한 죽음이야. 이 삼천이백열네 명은 기록으로 의미를 남길 거야. 그 말을 다시 하면 번호를 하나 더 붙일게."}
    - {situation: 슬픔, line: "어머니는 마지막 알을 낳고 떠났어. 그 알은 '보관료'라는 이름으로 사라졌지. 그날 알았어, 소유가 무엇을 지키지 못하는지. 그래서 기록해."}
    - {situation: 의심(죽음을 아는 맥박), line: "맥박이 정직하네. 처음 오는 곳에서 이렇게 평온한 맥박은 처음 봐. 죽음을 이미 아는 사람의 맥박이야. …기록해도 될까?"}
    - {situation: 마음을 열었을 때, line: "이름을 말해 줘. 번호 말고. 3,215번째 줄에 쓰지 않을 거야. 약속은 못 해. 그래도 쓰지 않을 이유를 지금 찾고 있어."}
    - {situation: 아버지를 이야기할 때, line: "아버지 상처에서 손톱이 자랐다 줄었다 하는 걸 봤어. 그게 시간이라면, 담을 수 있다면, 옮길 수 있다면… 옮길 그릇이 있어야지."}
