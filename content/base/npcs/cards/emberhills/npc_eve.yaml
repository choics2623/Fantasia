  저녁: "숯막 갱도 마을에서 로크의 갱반과 몰래 접촉"
  밤: "소각로 옆 운반 노예 우리"
places: [은비늘 요람 소각로, 시술실 복도, 숯막 갱도 마을, 소각로 연통]
