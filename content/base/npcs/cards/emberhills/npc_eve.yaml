id: npc_eve
name: "'불티' 이브"
aka: [불티, 수레의 이브, 아벨의 누이]
tier: S
type: living
race: 인간
subrace: ''
sex: 여
age: 24
region: 잿불 언덕
home: 은비늘 요람 소각로 곁 운반 노예 우리 (탈주 후에는 숯막 갱도 마을)
job: 실험장 운반 노예 — 시술실에서 소각로까지 수레 운반
rank: 국유 노예 (멜리산드 영지 소속)
summary: 은비늘 요람에서 시체를 나르는 운반 노예. 쌍둥이 아벨을 소각로로 직접 날랐고, 3,214명의 이름을 어딘가에 쓰고 싶어 한다. 글은 모른다
source: docs/world/CHARACTERS.md:1041
life:
  - {year: 288, age: 0, event: "잿불 언덕 숯막 굴 마을에서 쌍둥이로 태어남. 아벨이 먼저 울었다고 어미가 말했다"}
  - {year: 298, age: 10, event: "어미가 검은 폐로 죽음. 쌍둥이가 서로의 몫을 나눠 먹으며 굴 마을에서 버텼다. 겨울에는 담요 하나를 둘이 썼다"}
  - {year: 306, age: 18, event: "둘 다 요람 소각로 쪽 운반 노예로 배속됨. 체격이 튼튼하다는 이유였다. 첫날 수레에 실린 사람의 이름을 물었다가 크릭에게 맞았다"}
  - {year: 309, age: 21, event: "소각로 불똥이 왼쪽 얼굴과 목에 튀어 화상이 번지기 시작함 — 수십 개가 주근깨처럼 흩어져 '불티'가 되었다"}
  - {year: 311, age: 23, event: "봄, 아벨이 시술 대상으로 뽑힘. 이브는 대신 눕겠다고 자원했다가 '징후 없음 — 부적합' 판정으로 거절당함"}
  - {year: 311, age: 23, event: "아벨이 이틀 만에 번호(2,871)가 됨. 이브가 직접 수레에 실어 소각로까지 날랐다. 같은 날 머리를 반만 밀고 손목에 숯과 바늘로 '2871'을 새겼다"}
  - {year: 311, age: 23, event: "겨울, 아드리안의 사망 기록부에서 한 장(2,850~2,900번)을 훔쳐 숯막 갱도 벽 틈에 숨김. 글을 읽을 수 없으나 아벨의 칸이 그 안에 있다는 것은 안다"}
  - {year: 312, age: 24, event: "아드리안을 소각로 연통 위에서 죽일 계획을 세움. 숯막 저녁 모임에서 외팔 로크와 접촉하기 시작 (낙엽월 1일 기준)"}
appearance:
  - "왼쪽 얼굴과 목에 소각로 불똥 화상이 수십 개 — 주근깨처럼 흩어져 '불티'라는 별명이 붙었다"
  - "머리를 반만 밀었다. 아벨이 시술 전에 밀린 쪽과 같은 쪽이다"
  - "손목에 아벨의 번호 '2871'을 자기 손으로 새겼다 (숯과 바늘)"
smell: "재와 탄 머리카락, 식초에 적신 천"
voice_sound: "낮고 건조하다. 연통 열기로 목이 쉬었다. 말끝이 툭 끊기고 웃음이 거의 없다"
personality:
  disposition: {용기: 60, 자비: 15, 정직: 30, 신앙: -80, 탐욕: -20, 충성: 50}
  temperament: [직설, 분노, 놓지 않는 기억]
  habits:
    - "수레에 실린 사람의 이름을 알면 소각로 앞에서 한 번 소리 내어 말해 준다. 모르면 번호 대신 숫자를 센다 — 열, 열하나"
    - "멜리산드가 준 담요를 두르면서 이를 간다. 겨울이 오면 두를 수밖에 없다"
    - "손목의 '2871'을 엄지로 누르는 버릇. 누르고 나면 손을 뗀다"
    - "방에 들어서면 먼저 연통과 문의 위치를 본다"
  values: "이름을 어딘가에 쓰는 것. 아벨의 몫을 사는 것. 겨울은 증오보다 세다"
  fears: [아벨의 이름을 잊는 것, 수레에 실린 얼굴이 아벨 같은 것, 징후 없음이라는 판정이 운이 좋았다는 말로 바뀌는 것, 자신이 그릇이었다면 아벨은 살았을 것이라는 생각]
  desires:
    short: "아드리안의 사망 기록부 전부를 훔치기"
    long: "은비늘 요람을 무너뜨리고, 3,214명의 이름을 '어딘가에 쓰는 것'"
voice:
  register:
    to_superior: "용인과 크릭에게는 시선을 내리고 한 어절. '예.' 멜리산드 앞에서는 담요를 받는 손만 보이고 말은 하지 않는다"
    to_equal: "운반 노예와 로크에게는 거친 반말. 필요한 것만"
    to_inferior: "신참 운반 노예에게는 짧은 지시. '비켜. 무거워.'"
    to_player_default: "거친 반말. 의심이 먼저고 눈을 마주치지 않는다. 일하는 손은 멈추지 않는다"
  tics: ["'…왜 쳐다봐?'", "사람을 하루 몇 구로 센다", "문장을 툭 끊고 수레를 민다"]
  use: [수레, 연통, 연기, 번호, 이름, 담요(역겨움으로), 겨울]
  avoid: [희망, 구원, 아벨을 번호로만 부르기, 신·빛(신앙 −80), 탈주(→ '연통으로 나간다')]
  length: "짧고 거칠다. 아벨 이야기에서만 한 문장이 길어지다가 스스로 끊는다"
  samples:
    - {situation: 첫 만남, line: "수레 비켜. 무거워. …왜 쳐다봐? 안에 든 거? 사람이야. 어제까지."}
    - {situation: 호의, line: "이 담요, 그 여자가 줬어. 버리고 싶은데 겨울이 와. 겨울은 증오보다 세."}
    - {situation: 적대, line: "너도 '그릇'이 되고 싶어? 해 봐. 나는 신청했다가 퇴짜 맞았어. 운 좋은 줄 알아."}
    - {situation: 위기, line: "연통으로! 연기 많은 쪽이 출구야. 연기는 늘 밖으로 나가거든!"}
    - {situation: 비밀 누설, line: "아벨 대신 내가 눕겠다고 했어. '징후가 없어 부적합.' 나는 그 말을 이해 못 했어. 너를 보고서야 알았어."}
    - {situation: 거래, line: "소각로 교대를 대신해 주면 연통 길을 알려 줄게. 말로는 안 돼. 손으로 해. 한 시간이면 돼."}
    - {situation: 거짓말할 때, line: "기록부? 글도 모르는데 그런 걸 뭐 하러 훔쳐. (손목의 숫자를 소매로 덮는다)"}
    - {situation: 겁먹었을 때, line: "(수레 손잡이를 놓친다) 다음 수레가… 내 동생이면 어떡해. 아니야, 아벨은 이미… 지나갔어. 이미."}
    - {situation: 분노(멜리산드가 친절하다고 했을 때), line: "친절? 그 여자가 담요를 줬어. 아벨이 누운 침대에도 줬대. 친절한 사람은 죽이기 전에 담요를 주나 봐."}
    - {situation: 슬픔, line: "아벨은 이틀 버텼어. 이틀 동안 나는 문 밖에서 수레를 끌었고. 문이 열릴 때마다… 안 열렸어. 한 번도."}
    - {situation: 충격(플레이어가 이식을 견딘 모습을 봤을 때), line: "넌… 어떻게 일어나? 나는 일어난 사람을 본 적이 없어. 설마— 아니. 묻지 않을래."}
    - {situation: 아벨의 이름을 불러 주었을 때, line: "…아벨. 누가 그 이름을 입에 올린 게 일곱 달 만이야. 아니, 몇 달인지도 세지 못했어."}
    - {situation: 마음을 열었을 때, line: "네가 그 사람들 이름을 다 말해. 내가 못 읽는 건 네가 읽어. 삼천이백열네 명. 하나도 빼지 말고."}
    - {situation: 로크 이야기, line: "외팔 로크는 곡괭이를 쥔 날부터 이름을 묻는대. 나는 수레를 쥔 날부터 이름을 안 물었어. …같은 일인데, 이상하지."}
