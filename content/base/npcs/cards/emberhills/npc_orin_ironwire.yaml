life:
  - {year: 107, age: 0, event: "카즈둠 잿모루 씨족에서 태어남. 돌과 쇠의 이름을 먼저 배웠다"}
  - {year: 155, age: 48, event: "견습 계약. 돌 법정 앞에서 맹세를 낭독하고 계약석에 번호를 새겼다"}
  - {year: 241, age: 134, event: "잿불석 대량 채굴과 함께 잿불 언덕에 파견되었다. 갱도 지지대 설계가 첫 일이었다"}
