  - {year: 303, age: 196, event: "처음으로 '분실'을 시도. 환기 지도 한 장을 쓰레기 더미로 흘려보냈다"}
  - {year: 308, age: 201, event: "카셀의 장치 설계를 환기 지도의 공기 흐름으로 짐작했다. 이를 입 밖에 내지 못했다"}
  - {year: 312, age: 205, event: "올해의 '분실'을 준비하며 계약서 문구를 다시 읽는다 (낙엽월 1일 기준). 로크와 간접 접촉"}
appearance:
