smell: "쇠 기름과 마른 돌가루"
voice_sound: "느리고 낮은 목소리. 문구를 읊듯 말한다"
personality:
  disposition: {용기: 10, 자비: 30, 정직: 20, 신앙: 10, 탐욕: -10, 충성: 80}  # 충성은 맹세에 대한 것
