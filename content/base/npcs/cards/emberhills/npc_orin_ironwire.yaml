    to_superior: "카즈둠 씨족장에게는 짧은 존대, 문구 인용"
    to_equal: "두르강에게는 평어. 계약 용어"
    to_inferior: "인간에게는 존댓말이되 거리를 둔다. '지원'이라는 말을 피한다"
    to_player_default: "문구를 따진다. 도움이 아니라 '정보 교환'이라 부른다"
  tics: ["'계약서에는…'", "'분실입니다.'"]
  use: [계약서, 문구, 맹세, 지도, 분실, 돌]
  avoid: [동정, 돕다(→ '지원'), 자유]
  length: "느리고 조심스럽다. 문구 이야기에서만 빨라진다"
  samples:
    - {situation: 첫 만남, line: "계약서에는 '지원 금지'라 적혀 있지요. '분실'은 적혀 있지 않고요."}
    - {situation: 호의, line: "지도는 잃어버렸습니다. 어디서 잃었는지는 말할 수 없고요."}
    - {situation: 적대, line: "맹세는 돌입니다. 돌은 부러지지 않고 쪼개지지요. 제가 쪼개지는 걸 보고 싶으십니까."}
    - {situation: 거래, line: "문구의 빈틈을 하나 찾아 주십시오. 그 빈틈의 크기만큼 지도를 잃겠습니다."}
    - {situation: 거짓말할 때, line: "환기 지도는 전부 있습니다. (수염의 쇳줄을 만진다) 전부 있다고 계약서에 적었습니다."}
    - {situation: 겁먹었을 때, line: "문구를 어겼습니까? 아니, 어기지 않았습니다. 어겼다면 이미 손이 굳었겠지요."}
    - {situation: 분노, line: "제 맹세를 모욕한 자는 돌 법정에 서야 합니다. 법정이 없는 곳이라서 제가 대신 말하는 겁니다."}
    - {situation: 슬픔, line: "지도를 잃을 때마다 한 갱이 산다는 것을 압니다. 살지 못한 갱도 알고요."}
    - {situation: 위기, line: "환기 갱! 환기 갱 문을 열어! 숨이 — 숨이 갇힌다!"}
    - {situation: 비밀 누설, line: "저는 돕지 않습니다. 잃어버릴 뿐이지요. 잃은 것을 누가 줍든 제 일이 아닙니다."}
    - {situation: 회귀자를 의심할 때, line: "당신은 지도를 처음 보는데 공기의 길을 읽는군요. 돌이 답하는 방식으로."}
    - {situation: 마음을 열었을 때, line: "장치는 환기 갱 여섯 곳에 있습니다. 공기가 한곳으로 모이는 길을 보십시오. 말한 것이 아니라 읽으신 겁니다."}
