  - {to: npc_tuk, type: 보급 거래, like: 20, trust: 30, visibility: 공개, memo: null, words: "기름과 곡식을 제값에 파는 고물상. 내 눈에 재를 바르는 걸 본 눈이다. 값에 입막음이 들어 있는지 묻지 않았다"}
