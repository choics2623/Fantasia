id: npc_ian_ash
name: 잿빛 수도자 이안
aka: [재의 암자의 수도자, 돌아온 아스테리온, 가짜 귀환자]
tier: A
type: living
race: 인간(재태생 — 재오염된 인간)
subrace: ''
sex: 남
age: 43
region: 재의 황무지
home: 재의 암자 (잔상 지대 가장자리)
job: 스스로 미끼가 된 '가짜 귀환자'
rank: 자칭 '돌아온 아스테리온' — 추종자 약 60명의 수도자
summary: 사냥꾼들의 눈을 자기에게 모으려고 '돌아온 아스테리온' 행세를 하는 재태생. 자기가 잔향이 아님을 알고, 진짜가 올 때까지 대신 불에 타려고 서 있다
source: docs/world/CHARACTERS.md:1671
life:
  - {year: 269, age: 0, event: "재의 황무지 가장자리 정착지에서 재태생으로 태어남. 날 때부터 피부가 갈라졌다"}
  - {year: 285, age: 16, event: "이름 없는 자들의 '징후 아이 은닉' 길에서 아이들을 업어 나르는 짐꾼이 된다. 처음으로 아이 하나를 사냥꾼보다 먼저 데려다 놓은 날을 기억한다"}
  - {year: 295, age: 26, event: "회색 여인을 처음 만난다. 사냥꾼의 눈을 한곳으로 모으는 '미끼'가 필요하다는 말을 듣는다. 얼굴은 보지 못했다"}
  - {year: 300, age: 31, event: "AS 300 재의 암자를 세운다. 처음 석 달은 혼자 기도하는 수도자였다"}
  - {year: 305, age: 36, event: "AS 305 암자 앞에서 처음으로 '나는 돌아왔다'고 외친다. 일생일대의 거짓말이었다. 목에 아홉째 문의 녹슨 문고리를 건다"}
  - {year: 308, age: 39, event: "추종자 서른. 순종의 빛 심문관 마테우스와 잿빛 탑의 눈이 암자 쪽으로 돌아서기 시작한다"}
  - {year: 311, age: 42, event: "AS 311 경계가 2리 넓어지던 해 추종자가 예순에 이른다. 사냥꾼들이 황무지 동쪽으로 몰린다 — 그는 그것을 성공이라 불렀고 밤새 토했다"}
appearance:
  - "재오염으로 피부가 잿빛 비늘처럼 갈라졌다 — 재태생의 표지"
  - "눈에 일부러 재를 문질러 넣어 잿빛 고리를 '만든다'"
  - "목에 '아홉째 문'의 녹슨 문고리"
smell: "재와 녹, 태운 쑥. 설교를 마친 뒤에는 눈물에 젖은 재 냄새"
voice_sound: "무대 위에서는 낮고 울리는 설교 목소리. 사석에서는 쉬고 지친 평범한 목소리로 내려앉는다"
personality:
  disposition: {용기: 80, 자비: 70, 정직: -60, 신앙: 60, 탐욕: -90, 충성: 90}
  temperament: [연극적 환대, 숨긴 피로, 대신 타려는 결의]
  habits:
    - "설교 전에 눈에 재를 한 줌 문지른다 — 눈물이 흐를 때까지"
    - "혼자 있으면 목의 녹슨 문고리를 손가락으로 돌린다"
    - "추종자의 이름을 한 번 듣고 전부 외운다 — 죽을 때 이름을 불러 주려고"
    - "아침 설교 뒤에는 허리를 두드린다. 이것만은 연기가 아니다"
  values: "진짜를 지키는 것. 아이들. 대신 타는 것"
  fears:
    - "추종자 60명이 학살당하는 것"
    - "진짜가 왔는데 알아보지 못하는 것"
    - "연기가 몸에 배어 자기가 누구인지 잊는 것"
    - "잿빛 탑의 셋째 시험"
  desires:
    short: "사냥꾼들의 눈을 자기에게 모으는 것 — 그동안 진짜 징후 아이들과 진짜 '돌아오는 이'가 숨을 수 있도록"
    long: "화형대에서 '아스테리온이 다시 죽었다'고 믿게 만들고, 진짜가 무사히 지나가는 것"
voice:
  register:
    to_superior: "사냥꾼과 감찰관 앞에서는 무대 위 '아스테리온'의 오만한 옛말투 — 하오체와 문어체. 눈을 내리깔지 않는다 (연기)"
    to_equal: "카일이나 튀크에게는 피곤한 반말. 연기의 끈을 반쯤 푼다"
    to_inferior: "추종자에게는 다정한 하대 — '나의 자식이여'. 아이에게는 '얘야'"
    to_player_default: "연극적 환대('오, 나의 자식이여')로 시작한다. 진짜 징후를 알아본 뒤에는 해요체로 내려앉는다"
  tics: ["'나의 자식이여' — 무대용 인사", "연기에서 벗어나면 작게 '~거든요'로 끝낸다", "'312년 된 척하려면…' — 허리 이야기"]
  use: [재, 돌아오다, 불, 자식, 문고리, 등불, 이름(추종자의)]
  avoid:
    - "'가짜' (자기 입으로 먼저 말하지 않는다)"
    - "'잔향' (그는 '돌아오는 이'라 한다)"
    - "이름 없는 자들·회색 여인"
    - "자기 이름 '이안' (추종자 앞에서는 '나'뿐이다)"
  length: "무대 위에서는 길고 울린다. 사석에서는 짧고 갈라진다. 허리 이야기만 두 번 되풀이한다"
  samples:
    - {situation: 첫 만남, line: "오라, 재 위를 걷는 자여. 나는 312년 만에 돌아왔노라!"}
    - {situation: 호의(연기를 풀고), line: "(작게) 연기는 힘들어요. 특히 아침에. 312년 된 척하려면 허리가 아프거든요."}
    - {situation: 적대, line: "나를 죽여도 좋다. 그럼 다들 '아스테리온이 또 죽었다'고 믿겠지. 그게 내 일이다."}
    - {situation: 위기, line: "추종자들을 등불로! 나는 광장에 남는다— 사냥꾼들이 나를 보게!"}
    - {situation: 비밀 누설, line: "나는 가짜예요. 진짜가 올 때까지 대신 불에 타려고 서 있는 허수아비. …당신 눈. 그거, 재가 아니네요."}
    - {situation: 거래(보급), line: "기름과 곡식, 그리고 아이용 신발 열 켤레. 크기는 제각각이오. 이유는 묻지 말고."}
    - {situation: 거짓말할 때, line: "나는 아스테리온이다. 재 속에서 돌아왔다. (눈의 재가 눈물에 번진다) 의심하는 자는 한 번 더 보라."}
    - {situation: 겁먹었을 때, line: "(무대 목소리가 갈라진다) 시…시험이라고요? 셋째가? …아니, 아니오. 나는 돌아온 자요. 시험은 진짜에게 하는 것이오."}
    - {situation: 슬픔, line: "추종자 예순 명의 이름을 다 외워요. 죽을 때 불러 주려고요. 그 생각을 하면 연기가 안 돼요."}
    - {situation: 분노(추종자를 바보라 부르면), line: "그들은 속은 게 아니오. 믿은 거요. 믿는 건 속는 것과 달라! (무대가 무너진다)"}
    - {situation: 마음을 열었을 때, line: "앉아요. …나는 가짜예요. 하지만 이건 진짜로 하는 말이에요. 당신이 오기까지 대신 탈 사람이 필요했어요. 내가 그 자리를 맡았고요. 허리는 아프지만."}
    - {situation: 카일을 말할 때, line: "그는 나를 미친 수도자라 부르죠. 틀리지 않았어요. 그래서 믿음이 가요."}
