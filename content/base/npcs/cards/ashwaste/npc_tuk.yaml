  - {year: 296, age: 18, event: "마지막 등불에서 등불 기름 짐꾼을 하다가 손님이 버린 유물을 주워 팔기 시작한다"}
  - {year: 300, age: 22, event: "고물상 '등잔 밑'을 열고 처음으로 끈 매듭 장부를 만든다. 매듭 크기가 큰 놈일수록 크다"}
  - {year: 305, age: 27, event: "아스테리아 시대 은 의치를 구해 낀다. 이가 다 빠진 뒤 처음으로 흥정에서 웃음을 얻었다"}
  - {year: 309, age: 31, event: "AS 309 드래곤 하트(용심) 조각 하나를 판다. 산 사람은 사흘 만에 타 죽었다"}
  - {year: 310, age: 32, event: "AS 310 두 번째 조각을 판다. 산 사람이 또 사흘 만에 죽었다. 누가 그것을 흘렸는지 묻기 시작한다"}
  - {year: 311, age: 33, event: "AS 311 이안이 눈에 재를 문지르는 것을 우연히 보고 입을 다물기로 한다 — 제값을 내는 손님이니까"}
appearance:
  - "키 90~120cm 굴 크릭. 회색 피부, 큰 노란 눈. 이가 다 빠져 아스테리아 시대 은 의치를 낀다"
  - "등에 유물 보따리를 늘 지고 있어 등이 굽었다"
  - "강한 자 앞에서도 무릎을 꿇지 않는다 — 다리가 굳어서라고 주장한다"
smell: "재 기름과 녹슨 은, 오래된 먼지"
voice_sound: "쇳소리 섞인 빠른 목소리. 말 사이마다 '흥, 흥' 코를 울린다. 은 의치가 부딪히는 소리가 말에 박자를 만든다"
personality:
  disposition: {용기: 10, 자비: 20, 정직: -30, 신앙: 0, 탐욕: 65, 충성: 10}
  temperament: [약삭빠른 장사꾼, 비굴해 보이는 영리함, 큰 놈들 이름의 수집가]
  habits:
    - "말하기 전에 '흥, 흥' 하고 코를 두 번 울린다"
    - "장부 대신 끈 매듭에 이름을 묶는다 — 큰 놈일수록 큰 매듭"
    - "강자 앞에서는 일부러 한쪽 무릎을 굳혀 선다"
    - "유물을 이로 물어 은인지 본다 (은 의치로)"
  values: "큰 놈들의 이름을 쥐는 것. 값이 제대로 치러지는 거래"
  fears:
    - "몸이 먼저 무릎을 꿇는 순간"
    - "강자 목록이 뒤집히는 날"
