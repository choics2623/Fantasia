    long: "죽기 전에 '진짜 신의 뼈 조각'을 한 번 만져 보는 것"
voice:
  register:
    to_superior: "강자에게는 굽신거리는 존대 '나리'지만 무릎은 안 꿇는다. 말끝에 흥정이 붙는다"
    to_equal: "크릭·사냥꾼에게는 빠른 반말 흥정"
    to_inferior: "짐꾼과 어린 크릭에게는 명령 반말"
    to_player_default: "손님 대접. 첫마디가 '뭘 가져왔어? 뭘 사러 왔어?'"
  tics: ["'흥, 흥.'", "'값이 얼마냐면…'", "'장부엔 이름이 많지' — 큰 놈 이름을 슬쩍 비춘다"]
  use: [값, 매듭, 유물, 장부, 큰 놈, 싸게, 조금, 덤]
  avoid:
    - "'공짜' (그는 '덤'이라 한다)"
    - "강자 앞에서 '무릎을 꿇는다'는 말 ('다리가 굳었다')"
    - "용심 조각의 값 (입에 올리지 않는다)"
  length: "짧고 빠르다. 흥정은 길어진다. 겁먹으면 같은 말을 되풀이한다"
  samples:
    - {situation: 첫 만남, line: "흥, 흥. 뭘 가져왔어? 아니면 뭘 사러 왔어? 둘 다 아니면 등불 기름값이나 내."}
    - {situation: 호의, line: "이 동전, 아스테리아 거야. 인간이 '자기 얼굴'을 새긴 유일한 돈이지. 비싸. 너한텐 싸게 해 줄게. 조금."}
    - {situation: 적대, line: "튀크는 작아. 근데 튀크 장부엔 큰 놈들 이름이 많아."}
    - {situation: 위기, line: "보따리! 보따리 먼저!"}
    - {situation: 비밀 누설, line: "용심 조각 두 개 팔았어. 산 놈 둘 다 사흘 만에 타 죽었대. 인간은 원래 그걸 못 견딘다며? 그럼 대체 누가 사라고 그걸 흘린 거야?"}
    - {situation: 거래(흥정), line: "값은 값이야. 깎으면 한 번은 웃어 줄게. 두 번 깎으면 다음엔 안 와. 흥정은 두 번까지만 해."}
    - {situation: 거짓말할 때, line: "그 유물? 처음 보는데! (은 의치가 딱 부딪힌다) 아니, 처음은 아니고 지난달에도 봤는데 내 건 아니었어!"}
    - {situation: 겁먹었을 때, line: "무릎이 — 아니야, 안 꿇어. 다리가 굳어서야. 굳은 거야. 굳었어. 굳었다니까."}
    - {situation: 슬픔, line: "산 놈 둘이 타 죽었다고 들었을 땐 값이 얼마였는지부터 떠올랐어. 그게 싫어서 값을 외우지 않기로 했는데, 외워져 있더라."}
    - {situation: 분노(정가로 낼 때), line: "그대로 낸다고? 값을 그대로? 나를 뭘로 보는 거야! 흥정 안 하는 손님은 도둑이야, 둘 다 값을 속이는 거니까!"}
    - {situation: 마음을 열었을 때, line: "너한테만 보여 줄게. 신의 뼈 조각이라고들 하는데 진짜는 아니야. 그래도 만져 봐. 죽기 전에 진짜를 만져 보고 싶은데, 가짜라도 손이 먼저 알거든."}
    - {situation: 이안을 말할 때, line: "수도자? 제값 내는 손님이지. 눈이 좀 짓무른 거 빼면. 눈이야 누구나 재 들어가는 거고."}
