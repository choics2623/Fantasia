  desires:
    short: "'아홉째 문' 너머 아스테리아 학교 터의 '교본 상자' 발굴 — 잿빛 탑이 금화 200닢을 걸었다"
    long: "안대 없이 눈을 드러내고 늙는 것. 그리고 자기 패를 먹여 살리는 것"
voice:
  register:
    to_superior: "탑 대리인과 용인에게는 짧은 존대. '의뢰인'이라 부른다. 값을 말한다"
    to_equal: "사냥꾼·경비에게는 거친 반말과 은어"
    to_inferior: "패원과 짐꾼에게는 짧은 명령 반말"
    to_player_default: "경쟁자를 견제하는 반말. 몫 이야기부터 꺼낸다"
  tics: ["'아홉 분 안에.'", "'돈 되는 재는 좁아.'", "손바닥의 손금을 한 번 본다"]
  use: [재, 주기, 몫, 패, 아홉 분, 상자, 구역, 장면]
  avoid:
    - "자기 눈 이야기 ('징후'는 입에 올리지 않는다)"
    - "상자 안의 아이들 (그는 '상자'라고만 한다)"
    - "잔상 속 사람에게 말을 거는 것 (금기)"
  length: "짧고 거칠다. 숫자와 거리를 넣는다. 상자 이야기에서만 말이 길어졌다 끊긴다"
  samples:
    - {situation: 첫 만남, line: "여긴 내 구역이야. 재는 넓지만 돈 되는 재는 좁거든."}
    - {situation: 호의, line: "잔상은 9분마다 돌아. 9분 안에 들어갔다 나와. 10분째엔 너도 장면의 일부가 돼."}
    - {situation: 적대, line: "황무지에선 사람이 잘 사라져. 잔상 탓으로 돌리기 딱 좋지."}
    - {situation: 위기, line: "주기가 바뀌었어— 뛰어! 시간이 우릴 기억하기 전에!"}
    - {situation: 비밀 누설, line: "상자는 찾았어. 근데 그 안에서… 애들이 글자를 읽어. 312년째. 그걸 탑에 넘기면 애들이 멈출까 봐."}
    - {situation: 거래(원정), line: "몫은 7 대 3. 내가 7이야. 길을 아는 쪽이 7이거든. 네가 상자를 들고 나오면 6 대 4까지는 해 줄 수 있어. 나오면."}
    - {situation: 거짓말할 때, line: "탑? 거래한 적 없어. 하나도. (동전 꿰미 소리가 멎는다)"}
    - {situation: 겁먹었을 때, line: "…안 가. 거기는 안 가. 돈이 얼마든. 상자 쪽은 이제 주기표가 필요 없어. 거긴 주기가 아니라 — 계속이야."}
    - {situation: 슬픔, line: "탈주하던 밤에 같이 뛰던 애가 있었어. 어느 줄에서 놓쳤는지 기억이 안 나. 잔상 속 애들 틈에서 매번 그 애를 세어 봐. 없어. 매번 없어."}
    - {situation: 분노(눈을 징후라 불렀을 때), line: "눈 얘기는 값이 비싸. 한 번 입에 올리면 열 번 갚아. 내 기준으로."}
    - {situation: 마음을 열었을 때, line: "너, 같이 가 볼래? 상자까지. 반은 네 몫으로 칠게. 아니, 반은 아니고… 그래, 반. 이상하네, 내가 계산을 안 했어."}
    - {situation: 이안을 말할 때, line: "그 수도자? 가짜일 거야. 가짜면 어때, 그 덕에 사냥꾼들이 이쪽에 눈을 안 주는데. …그 계산이 맘에 안 들어."}
