life:
  - {year: 276, age: 0, event: "용의 대로 남쪽 어느 영지의 노예 막사에서 태어남"}
  - {year: 294, age: 18, event: "주인의 곡물 수레 밑에 숨어 탈주한다. 같이 뛰던 아이 하나가 어느 줄에서 손을 놓쳤는지 기억하지 못한다"}
  - {year: 296, age: 20, event: "황무지 가장자리 모래 폭풍 속에서 잿빛 모래에 왼눈을 긁힌다. 마지막 등불에 들어온 첫해, 그것이 징후로 오인되지 않도록 안대를 쓰기 시작했다"}
  - {year: 300, age: 24, event: "유물 사냥꾼 패 '모래눈'을 세운다. 첫 패원 여섯 가운데 둘은 일 년 안에 잔상에 먹혔다"}
  - {year: 305, age: 29, event: "AS 305 잔상 주기표를 완성한다 — 9분을 기준으로 장면마다 몇 걸음 앞까지 오는지 외웠다. 손바닥의 시간 잔상 화상은 이 시기에 생겼다"}
  - {year: 309, age: 33, event: "AS 309 아홉째 문 너머 아스테리아 학교 터에서 '교본 상자'를 찾는다. 잔상 속 아이들이 글자를 따라 읽는 소리에 그는 손을 거뒀다"}
  - {year: 311, age: 35, event: "AS 311 잿빛 탑이 교본 상자에 금화 200닢을 걸었다는 소문이 돈다. 의뢰인 이레네의 서신이 도착한다. 그는 패원 하나가 탑의 눈이라는 것을 알면서 곁에 둔다"}
appearance:
  - "왼눈이 잿빛 모래에 긁혀 뿌옇다 — 징후로 오인되지 않으려 늘 안대"
  - "허리에 아스테리아 시대 동전 꿰미"
  - "손바닥에 시간 잔상 화상 — 손금이 거꾸로 났다"
smell: "재와 땀, 쇠 동전 냄새"
voice_sound: "거칠고 낮다. 장사꾼처럼 빠르다. 말끝을 자르고 상대의 반응부터 본다"
personality:
  disposition: {용기: 60, 자비: -10, 정직: -20, 신앙: -60, 탐욕: 70, 충성: 30}
  temperament: [경계심 많은 장사꾼, 계산하는 용기, 숨긴 겁]
  habits:
    - "시간을 '아홉 분' 단위로 말한다"
    - "손바닥을 불빛에 비춰 거꾸로 난 손금을 한 번 본다"
    - "안대를 고쳐 쓸 때 상대의 눈을 본다"
    - "동전 꿰미를 짤랑여 숫자를 센다. 거짓말을 하면 소리가 멎는다"
  values: "몫. 자기 패. 주기표대로 돌아오는 것"
  fears:
    - "교본 상자 속 아이들"
    - "10분째에 자기가 장면의 일부가 되는 것"
