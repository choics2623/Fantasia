id: npc_echo_wall_girl
name: 성벽 위의 소녀 (잔상)
aka: [손 흔드는 아이, 아홉째 문의 소녀]
tier: B
type: living
race: 시간 잔상
subrace: ''
sex: 여
age: 불명 (대붕괴 직전 한 장면의 열두 살쯤 소녀)
region: 재의 황무지
home: 아홉째 문 성벽 (옛 아스테리아)
job: 아홉째 문 성벽
rank: 사람이 아니다 — 대붕괴 직전의 한 장면이 시간에 박혀 9분마다 되풀이된다
summary: 아스테리아 마지막 날 성벽 위에서 누군가에게 손을 흔드는 소녀의 9분. 잔향이 다가가면 '이름'을 부른다. 회차가 쌓일수록 손짓이 플레이어 쪽으로 조금씩 기운다
source: docs/world/CHARACTERS.md:1719
life:
  - {year: -11, age: 0, event: "아스테리온의 봉기 전 어느 아이로 태어났다고 전해진다 — 잔상 속에서는 이름이 들리지 않는다. 성(姓)을 가진 아이였다는 것만 문패가 말해 준다"}
  - {year: 0, age: 11, event: "AS 0 대붕괴 직전의 한낮. 아홉째 문 성벽 위에서 누군가에게 손을 흔든다. 그 9분이 찢어진 시간에 박혀 되풀이된다"}
  - {year: 311, age: 11, event: "AS 311 경계가 2리 넓어지며 장면이 마지막 등불 300보 앞까지 다가온다. 장면은 더 선명해졌다"}
appearance:
  - "열한두 살쯤의 소녀. 옷에 재가 앉지 않는다 — 아스테리아의 마지막 낮 그대로다"
  - "성벽 모서리에 몸을 기대 오른팔을 높이 흔든다. 손이 먼저 움직이고 소리가 늦게 도착한다"
  - "얼굴은 해를 등져 늘 반쯤 그늘에 있다. 다가가면 눈이 장면 밖을 향한다"
smell: "냄새가 없다. 가까이 가면 햇볕에 마른 빨래 냄새가 잠깐 스친다 — 아스테리아의 마지막 낮"
voice_sound: "맑고 높은 아이 목소리가 한 박자 늦게 도착한다. 말끝이 바람에 풀려 재처럼 흩어진다"
personality:
  disposition: {용기: 0, 자비: 0, 정직: 0, 신앙: 0, 탐욕: 0, 충성: 0}
  temperament: [되풀이, 기다림, 한쪽으로 기울어짐]
  habits:
    - "9분마다 처음 자리로 되감겨 같은 몸짓으로 손을 흔든다"
    - "손이 먼저 움직이고 소리가 한 박자 늦게 도착한다"
    - "다가오는 이가 있으면 손짓의 방향이 조금 기운다"
  values: "없다 — 그 순간이 전부다"
  fears:
    - "없다 — 장면이 끝나는 것을 모른다"
  desires:
    short: "손을 흔드는 것"
    long: "손을 흔든 상대가 돌아보는 것"
voice:
  register:
    to_superior: "잔상이라 신분에 따라 달라지지 않는다 — 누구에게나 같은 말을 같은 억양으로 한다"
    to_equal: "같음"
    to_inferior: "같음"
    to_player_default: "잔향이 다가오기 전에는 같은 말만 한다. 잔향이 다가오면 장면 밖을 향해 '이름'을 부른다"
  tics: ["손이 먼저, 소리가 한 박자 늦게", "문장이 끝나기 전에 장면이 되감긴다"]
  use: [여기, 손, 올라와요, 아직, 문, 성벽, 열려 있어요]
  avoid:
    - "이름 (직접 설명하지 않는다 — 부르기만 한다)"
    - "대붕괴 이후의 일 (모른다)"
    - "질문에 대한 대답 (대답하지 않는다 — 장면이 되풀이될 뿐)"
  length: "한 번에 한두 마디. 9분마다 같은 말"
  samples:
    - {situation: 장면 처음(9분 주기), line: "거기 있네요! 올라와요! 아직 문 안 닫혔어요!"}
    - {situation: 손을 흔드는 중, line: "(손을 크게 흔들며) 나 여기예요! 여기 성벽 위!"}
    - {situation: 잔향이 다가갈 때, line: "(손이 멈춘다. 처음으로 장면 밖을 향해) …이름을 부른다. 소리는 재처럼 흩어지고, 플레이어 안의 목소리가 그 이름을 대신 말해 준다."}
    - {situation: 장면 끝(되감김), line: "올라와요… 아직 문이— (장면이 처음으로 되감긴다)"}
    - {situation: 플레이어가 말을 걸었을 때(금기), line: "(대답하지 않고 같은 손짓) 거기 있네요! 올라와요!"}
    - {situation: 회차가 쌓인 뒤(손짓이 기울 때), line: "(손짓이 플레이어 쪽으로 반 뼘 기운다) 올라와요. 이번엔… 이쪽이에요."}
schedule:
  아침: "9분마다 같은 장면을 되풀이한다"
  낮: "같음. 해가 높을수록 장면이 선명하다"
  저녁: "같음. 해가 질 무렵 소리가 더 늦게 도착한다"
  밤: "잔상 지대가 가장 위험한 때 — 장면 주위가 일그러진다"
places: [아홉째 문 성벽, 멈춘 광장 가장자리]
knows: [fact_aw_echo_girl_calls]
hides: []
relations: []
toward_player: "다가오는 이에게만 반응한다. 잔향이 아닌 이에게는 같은 손짓과 같은 말을 되풀이할 뿐이다"
persuade:
  likes: []
  hates: ["장면에 손을 대는 것 — 손을 뻗어 붙잡으려 하면 장면이 흩어진다"]
roles:
  teacher: null
  companion: null
  romance: null
regression:
  fixed:
    - "9분 주기로 같은 장면이 되풀이된다"
    - "손을 흔드는 높이와 첫마디가 같다"
  flow:
    - "회차가 쌓일수록 손짓이 플레이어 쪽으로 조금씩 기운다 (loop.count 10마다 반 뼘) — 시간에 묶인 장면이라서"
  drift:
    - "장면이 시작되는 정확한 초 — 주기가 회차마다 몇 초씩 어긋난다"
  deja_vu: none
hard_rules:
  - "대화하지 않는다 — 같은 장면의 같은 말만 한다"
  - "이름을 소리 내어 말하지 않는다. 플레이어 안의 목소리가 대신 들려 주게 한다 (이름이 정해지기 전까지 비워 둔다)"
  - "플레이어가 손을 대면 장면이 흩어진다 — 비명 없이 사라지고 9분 뒤 같은 자리에서 되돌아온다"
  - "대붕괴 이후의 일을 알지 못한다"
on_death: "죽지 않는다 — 잔상이다. 흩어져도 9분 뒤 돌아온다. 플레이어가 장면을 해금하면 앞선 잔향자의 꿈이 열린다"
story_seeds:
  - "그녀가 부르는 이름은 무엇인가 — 앞선 잔향자의 꿈 해금"
  - "잔상은 시간에 묶여 있어, 회차가 쌓일수록 그녀의 손짓이 플레이어 쪽으로 조금씩 기운다"
