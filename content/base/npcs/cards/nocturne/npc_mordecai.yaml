source: docs/world/CHARACTERS.md:1368
# 연대: AS 312 = SK 3,400. 'AS 년도'는 음수로 적는다 (SK 180 = AS -2908). WORLD_BIBLE §0·RACES §6.
life:
  - {year: -3188, age: 0, event: "엘다르 아르네시엘 가지에서 태어남. 신살 때는 이미 백 살이었고, 그날 무엇을 보았는지 말하지 않는다"}
  - {year: -2908, age: 280, event: "SK ~180 — 가지의 일족 약 300명이 세렌 앞바다 해구에서 신의 피를 길어 올려 마심. 2/3가 그 자리에서 죽었고 그는 살아남아 처음으로 신의 목소리 조각을 들었다. 그날 이후 한 번도 잠들지 않음"}
  - {year: -2700, age: 488, event: "남서쪽 구릉에 흑요석 성 아르네스를 세우고 지하에 마른 우물을 팜. 단지에 담아 온 신의 피 한 모금을 우물 바닥에 부음"}
  - {year: -1988, age: 1200, event: "SK ~1,100 — 붙잡힌 아에리 한 무리에게 피를 소량씩 허락해 박쥐날개를 만듦. 이때부터 인간뿐 아니라 하늘의 눈도 갖게 됨"}
  - {year: -9, age: 3179, event: "AS -9 아스테리온의 봉기 해 — 우물 바닥의 피가 처음으로 거세게 떨림. 그는 그 떨림이 '말의 주인이 대륙에 깨어났다'는 뜻이라 믿게 됨"}
  - {year: 100, age: 3288, event: "붉은 길(다라의 마지막 봉기)이 진압되던 날 우물의 떨림이 한순간에 멎음. 그 침묵이 이백 년 넘게 이어졌다 — 그는 '목소리가 죽었다'고 생각했다"}
  - {year: 298, age: 3486, event: "영지 경계를 넘은 바르그 무리를 사냥꾼들에게 '정리'하게 함. 한 마리 어린 것이 살아 나갔다는 보고를 받고도 쫓지 않았다"}
  - {year: 311, age: 3499, event: "우물 바닥의 떨림이 다시 시작됨 — 처음에는 먼 심장 소리처럼, 날이 갈수록 가까워졌다. 그는 처음으로 우물 곁에서 혼자 웃었다"}
  - {year: 312, age: 3500, event: "갈증의 밤 공물 300명 확보를 준비하며 낙엽월 1일을 맞음. 소리는 하루가 다르게 커지고 있다"}
appearance:
  - "입술이 없다 — 3,000년 동안 이빨이 입술을 닳게 했다"
  - "피부가 마른 양피지처럼 얇아 그 아래 검은 피가 흐르는 것이 보인다"
  - "목소리가 우물 속에서 울리듯 두 겹으로 들린다"
smell: "마른 우물 돌과 오래 식은 피, 꺼진 향 냄새"
voice_sound: "우물 속에서 울리는 낮은 소리. 말 하나가 끝나면 한 박자 늦게 같은 말이 더 낮게 겹쳐 들린다"
personality:
  disposition: {용기: 60, 자비: -90, 정직: 30, 신앙: 100, 탐욕: 80, 충성: 20}
  temperament: [고요, 굶주림, 3,000년을 기다린 인내]
  habits:
    - "우물에 비친 것을 오래 보며 입술 없는 입으로 낱말 없이 말을 한다"
    - "한 번 한 말을 낮게 한 번 더 되풀이한다 — 두 겹으로 들리는 이유다"
    - "마른 우물 돌의 붉은 얼룩을 손가락 끝으로 쓸어 읽는다"
    - "인간이 앞에 서면 숨소리를 세어 맥박을 들으며 그 사람의 피가 노래하는지 가늠한다"
  values: "마지막 말을 완성하는 것. 첫 갈증은 은혜다. 가축은 쓸모로 존재한다"
  fears: [소리가 멎는 것, 굶주린 자들(자기의 미래), 말이 인간에게 남겨졌다는 것이 사실인 것, 자신이 3,000년을 헛기다렸다는 증거]
  desires:
    short: "갈증의 밤 공물 300명 확보"
    long: "신의 피에 남은 '목소리'를 완성하는 것 — 마지막 말이 깃든 영혼(잔향)의 피를 마시는 것"
voice:
  register:
    to_superior: "윗사람이 없다. 신의 피에게만 낮은 소리로 묻는다"
    to_equal: "원로와 첫 잔의 가문에게는 '그대'. 느리고 조용한 하오체"
    to_inferior: "알라리크 같은 신하에게는 '충실한 이'. 짧고 낮게. 가축에게는 '너'. 반말에 이름이 없다"
    to_player_default: "가축으로 본다. 말이 짧고 눈도 마주치지 않는다. 잔향의 냄새가 닿으면 먼저 다가와 두 겹으로 말한다"
  tics: ["'한 방울이면 된다.'", "(한 말을 두 겹으로 되풀이한다)"]
  use: ["우물", "잔", "한 방울", "갈증", "목소리", "말(신의 말)", "너희", "가축", "갈증의 밤"]
  avoid: ["저주(첫 갈증을 이렇게 부르는 것이 그의 역린이다)", "엘다르(‘버린 가지’라 한다)", "부탁", "미안", "죽다(‘마르다’라 한다)"]
  length: "느리고 짧다. 한 번에 한두 문장, 그 뒤에 긴 침묵. 신의 말을 이야기할 때만 문장이 길고 가라앉는다"
  samples:
    - {situation: 첫 만남, line: "(두 겹의 목소리) …들린다. 네 피가 노래를 한다. 3,000년 만에 같은 노래를."}
    - {situation: 호의, line: "가까이 오너라. 한 방울이면 된다. 한 방울이면 나는 신이 무엇을 말하려 했는지 안다."}
    - {situation: 적대, line: "나는 신을 마셨다. 너 정도는 갈증 축에도 끼지 않는다."}
    - {situation: 위기, line: "우물이 끓는다— 누가 신의 이름을 말했지?"}
    - {situation: 비밀 누설, line: "신의 피는 아직 말한다. '너희는 끝나지 않을 것이다.' 나는 그 '너희'가 우리이기를 3,000년간 바랐다."}
    - {situation: 거래, line: "공물 삼백. 하나가 모자라면 열 개가 모자란 것으로 친다. 가축의 수는 성의 우물이 센다. 서명은 필요 없다."}
    - {situation: 거짓말을 들었을 때, line: "(맥박을 듣는다) 네 심장이 한 번 빨랐다. 빠른 심장은 거짓을 말한다. 거짓을 말한 피는 맛이 없다. …다시."}
    - {situation: 겁먹었을 때, line: "…소리가 멎었다. (두 겹으로) 멎었다. 아니다. 멎지 않았다. 아직 먼 곳에서— 멎지 않았다."}
    - {situation: 분노, line: "저주? 첫 갈증을 저주라 했느냐. 3,000년을 갈증으로 산 자 앞에서. …한 방울이 아니라 한 모금이다, 네 값은."}
    - {situation: 슬픔, line: "굶주린 자들은 한때 나의 잔을 돌려 마시던 이들이었다. 지금은 숨소리를 따라 짖는다. …그것이 3,000년 뒤의 나다."}
    - {situation: 회귀자를 의심할 때, line: "…네 피 냄새가 지난번과 같다. 지난번이라고? 내가 너를 처음 보는데, 어째서 '지난번'이라는 말이 입에서 나오는가."}
    - {situation: 마음을 열었을 때, line: "너는 잔향이 깃든 몸이다. 이제 가축으로 부르지 않겠다. …그러나 한 방울은 여전히 필요하다. 나는 그 말을 끝까지 듣고 싶다."}
    - {situation: 알라리크에게, line: "충실한 이. 세실의 장부를 겹쳐 보는 일은 천천히 하라. 천천히. 급히 쥔 장부는 먼저 찢어진다."}
schedule:
  아침: "잠들지 않으나 빛을 피해 성 지하 '피의 우물' 곁에 머문다"
  낮: "우물에 비친 것을 본다 — 신의 피가 보여 주는 환영"
