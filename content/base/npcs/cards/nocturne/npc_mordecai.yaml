sex: 남
age: 3500
region: 녹테른 밤의 영지
home: "첫 갈증 성(흑성 아르네스) — 지하 '첫 갈증의 우물' 곁, 옥좌 '마르지 않는 잔'"
job: 3,200년 깨어 있는 자 (정본)
