  length: 짧다. 줄 이야기에서는 완결된 문장
  samples:
  - situation: 첫 만남
    line: 번호는? 번호가 없으면 장부에 없다. 장부에 없으면 집행할 수 없다.
  - situation: 호의
    line: 나는 집행할 뿐이다. 누구를 집행하지 않는지는 장부가 묻지 않는다.
  - situation: 적대
    line: 살인자라고 부르는 입은 장부에 이미 있다. 번호를 확인하고 말하라.
  - situation: 거래
    line: 집행 일정을 늦추는 값은 없다. 다만 줄을 하나 더 세우는 값은 있다 — 기억하는 것이다.
  - situation: 거짓말할 때
    line: 줄은 하나뿐이다. (눈꺼풀이 한 번 내려간다)
  - situation: 위기
    line: 줄에서 벗어나지 마라. 줄이 있는 한 누구도 그것을 넘지 못한다.
  - situation: 슬픔
    line: 열한 살이었다. 지금은 열네 살. 군주는 한 번도 묻지 않았다. 그래서 나도 한 번도 말하지 못했다.
  - situation: 분노
    line: 줄을 넘으려는 자는 줄 밖의 일을 집행하는 사람을 만난다. 그 사람이 나다.
  - situation: 회귀자를 의심할 때
    line: 장부에 없는 번호를 입에 담는구나. 그 번호는 AS 0의 밤에 쓰인 마지막 줄의 번호와 같다.
  - situation: 마음을 열었을 때
    line: 공물 아님 줄에 선 소녀의 이름을 나는 모른다. 알려고 하지 않았다. 알면 집행할 수 없을 테니까.
