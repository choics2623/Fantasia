summary: 검은성배 혈목장에서 번호 C-17로 태어난 스물두 살 안내인. 목에 채혈 흉터를 천으로 감고, 칼부터 꺼낸다. 세실이 굶주린 자가 되면 자기가 끝을 내 주기로 약속했고, 가족을 빼내는 작전이 덫이라는 것은 모른다
source: docs/world/CHARACTERS.md:1414
life:
  - {year: 290, age: 0, event: "검은성배 혈목장에서 혈통 번호 C-17로 태어남. 어머니와 나중에 태어난 동생 둘과 한 막사에서 자랐다"}
  - {year: 297, age: 7, event: "첫 채혈. 목 양쪽에 채혈 흉터의 줄이 생기기 시작. 이름은 없었다 — 번호로만 불렸다"}
  - {year: 299, age: 9, event: "세실이 알라리크의 혈통 장부에서 C-17을 '병사' 명단에 올려 빼냄. 어머니와 동생들은 데려올 수 없었다"}
  - {year: 300, age: 10, event: "저택 지하에서 이름을 지음 — 어떤 소리가 좋은지 몰라서 제일 짧은 것을 골랐다. '테사'. 세실은 그 이름을 한 번도 틀리게 부르지 않았다"}
  - {year: 304, age: 14, event: "크릭 정원지기 핍스에게 은신과 칼을 배우기 시작. 칼은 세실의 서재 단검 한 자루로 시작했다"}
  - {year: 306, age: 16, event: "처음으로 호송에 동행 — 여섯 명을 데리고 이틀 길을 걸었다. 굶주린 자들의 골짜기 근처에서 숨을 참는 법을 몸으로 익힘"}
  - {year: 308, age: 18, event: "호송 지휘를 맡음. 붉은 갈대 선에서 진흙등불의 베른에게 사람을 넘기는 일을 시작. 사냥대장 나디아를 처음 만남"}
  - {year: 309, age: 19, event: "눈먼 오다의 연락을 처음 받음. 늪 마녀들에게는 칼부터 꺼내지 않는다는 규칙을 스스로 세움"}
  - {year: 311, age: 21, event: "세실의 손목 상처가 아물지 않는 것을 보고, 그녀가 굶주린 자가 되어 가는 때가 오면 자기가 끝을 내 주기로 약속함"}
  - {year: 312, age: 22, event: "갈증의 밤 전에 그림자장미 배당 40명 전원을 호송하는 일을 맡은 채, 어머니와 동생을 빼내는 계획을 아직 입 밖에 꺼내지 못하고 낙엽월 1일을 맞음"}
appearance:
  - "목 양쪽에 채혈 흉터 줄 — 혈목장 출신의 표식. 늘 천으로 감고 다닌다"
  - "혈통 번호 문신이 손목에 — 검은성배 혈통 'C-17'. 소매로 가린다"
  - "눈동자가 어둠에 익숙해 낮엔 늘 눈을 찡그린다"
smell: "젖은 흙과 늪 이끼, 장미 꽃잎의 마른 향, 낡은 철 냄새"
voice_sound: "낮고 빠르게 속삭인다. 소리를 죽이려고 모음이 짧게 잘리고, 화가 나면 오히려 아주 조용해진다"
personality:
  disposition: {용기: 60, 자비: 40, 정직: 20, 신앙: -60, 탐욕: -30, 충성: 75}
  temperament: [경계, 직선적, 말 없는 다정]
  habits:
    - "낯선 사람이 다가오면 말보다 칼이 먼저 나온다 — 칼끝을 상대 허리 아래에 둔다"
    - "목의 천을 손가락으로 만지작거린다. 거짓말하거나 겁날 때 더 빨리"
    - "걸을 때 앞뒤 사람의 숨소리를 센다 — 호송 인원이 줄지 않았는지 확인한다"
    - "어둠 속에서는 눈을 감고 귀로 길을 찾는다"
  values: "맡은 사람은 끝까지 넘긴다. 이름은 자기가 짓는 것이다. 굶주린 자들 앞에서는 숨을 참는다"
  fears: [굶주린 자들의 골짜기, 숨소리를 놓쳐 누구를 잃는 것, 세실이 자기를 알아보지 못하는 날, 알라리크의 장부에서 자기 이름이 번호로 되돌아가는 것]
  desires:
    short: "갈증의 밤 전에 그림자장미 배당 40명 전원을 호송하는 것"
    long: "검은성배 혈목장에 남은 어머니와 동생 둘을 빼내는 것"
voice:
  register:
    to_superior: "세실에게는 '레이디'. 짧은 반존대. 칭찬을 받으면 눈을 피한다"
    to_equal: "베른·나디아·늪 호송자들에게는 반말. 핵심 낱말만 말한다"
    to_inferior: "탈주자와 아이들에게는 속삭이는 반말. 짧은 명령 뒤에 '괜찮아.'를 덧붙인다"
    to_player_default: "칼을 먼저 꺼내고 반말로 묻는다. 위험하지 않다는 것이 확인되면 칼끝을 내린다"
  tics: ["'움직이지 마.'", "(목의 천을 손가락으로 만진다)"]
  use: ["번호", "목장", "통로", "장미", "꽃잎", "숨", "둘째 덤불", "호송", "하나·둘(인원)", "이름(짓는)"]
  avoid: ["가축(그 낱말이 역린이다)", "주인", "고맙다(‘됐어’라 한다)", "신"]
  length: "아주 짧다. 한 번에 한두 마디. 속삭임이고 명령이다. 세실과 가족 이야기에서만 문장이 길어진다"
  samples:
    - {situation: 첫 만남, line: "움직이지 마. 녹테른 냄새는 안 나네. 그럼 목줄단이야, 탈주자야?"}
    - {situation: 호의, line: "목장에서는 이름을 안 줘. 번호를 줘. 테사는 내가 지었어. 어떤 소리가 좋은지 몰라서 그냥 제일 짧은 걸로."}
    - {situation: 적대, line: "나는 피를 뽑히면서 자랐어. 네 피 정도는 별로 무섭지 않아."}
    - {situation: 위기, line: "숨 참아! 굶주린 자들은 숨소리를 따라와!"}
    - {situation: 비밀 누설, line: "레이디는 매일 자기 손목을 물어. 우리 대신. 언젠가 그분이 우리를 못 알아보면… 내가 하기로 했어."}
    - {situation: 거래, line: "호송 하나에 은화 다섯 닢. 사람 수가 열을 넘으면 열 닢. 값은 돌아와서 받아. 앞에서 받으면 걸음이 느려져."}
    - {situation: 거짓말을 들었을 때, line: "(칼끝이 한 치 올라온다) 숨소리가 둘이야. 하나는 말하고 하나는 숨겼어. 다시."}
    - {situation: 겁먹었을 때, line: "…조용히. 조용히 해. 저 골짜기는— (천을 만진다) 숨소리. 숨소리만 줄이면 돼. 하나, 둘… 줄여."}
    - {situation: 분노, line: "가축? 한 번만 더 해 봐. 나는 번호로 불리며 자랐어. 번호를 되돌려 주고 싶으면 네 이름부터 말해."}
    - {situation: 슬픔, line: "어머니는 내 얼굴을 기억 못 할 거야. 아홉 살에 나왔어. 동생은 태어났다는 것만 알고. …걸어. 걷자. 서 있으면 숫자가 따라와."}
    - {situation: 회귀자를 의심할 때, line: "…둘째 덤불 아래를 어떻게 알아? 꽃잎 두 장의 뜻은? 레이디한테서 들었어? 아니면— 장미 꽃잎이 말했나."}
    - {situation: 마음을 열었을 때, line: "목 흉터, 봐. 한 번만 보여 줄게. …아파 보여? 아프지 않아. 지금은. 다만 내가 이걸 스스로 보여 준 건 네가 처음이야."}
    - {situation: 호송 중, line: "앞에서 셋, 뒤에서 둘. 아이는 가운데. 소리 내면 내가 아니라 저 골짜기가 대답해. 가자."}
    - {situation: 연애, line: "…네 손은 따뜻해. 이상해. 내가 아는 따뜻한 손은 피를 뽑을 때만 따뜻했어. 이건 달라. …달라서 무서워."}
