id: npc_vesper
name: "'밤날개' 베스퍼"
aka: [밤날개, 가죽날개의 전령]
tier: B
type: living
race: 아에리(박쥐날개 아에리)
subrace: ''
sex: 남
age: 40
region: 녹테른 밤의 영지
home: "흑성 아르네스 탑 천장 — 거꾸로 매달려 자는 박쥐날개 처소"
job: 녹테른 전령·공중 감시
rank: 녹테른의 하수인 — 다른 아에리에게 배신자 취급
summary: 녹테른의 하수인이라 모든 아에리에게 배신자로 불리는 박쥐날개 전령. 하늘에서 찾은 탈주 행렬 하나를 보고하지 않았고, 이유를 아직 자기도 모른다. 타일라와 같은 둥지에서 자랐다
source: "docs/world/CHARACTERS.md R07-06 (색인) + SUBRACES §12.4 에서 새로 씀"
life:
  - {year: 272, age: 0, event: "바람첨탑 발치 낮은 둥지에서 태어남 — 돌아오려다 거절당한 박쥐날개 혈통의 어머니가 다른 아에리 아이들의 둥지 가장자리에 그를 맡겼다. 일곱 살 아래 타일라와 한 둥지에서 컸다"}
  - {year: 284, age: 12, event: "어머니가 죽고 낮은 둥지에서 쫓겨남. 밤에만 날 수 있다는 이유로 어느 아에리도 받아 주지 않았다. 녹테른 영지 쪽으로 내려감"}
  - {year: 290, age: 18, event: "흑성 아르네스 탑에서 밤 전령이 됨. 7일마다 녹테른의 피 한 방울을 받아야 산다고 믿게 되었다"}
  - {year: 302, age: 30, event: "하늘에서 타일라의 날개가 잘려 깃털 절벽에서 추방되는 것을 보았다. 내려가지 않았다"}
  - {year: 310, age: 38, event: "그림자장미 소속 박쥐날개 녹타가 이레를 넘기고도 피 없이 멀쩡한 것을 우연히 봄. 아무에게도 묻지 않았다"}
  - {year: 311, age: 39, event: "하늘에서 본 탈주 행렬 하나를 보고서에 적지 않음. 그 보고서는 알라리크에게 가는 것이었다"}
  - {year: 312, age: 40, event: "밤 감시 보고를 쓰며 낙엽월 1일을 맞음. 적지 않은 행렬이 아직 그의 머릿속에서 지워지지 않는다"}
appearance:
  - "가죽 날개 날개폭 3.5~4미터. 회백색 피부와 큰 귀, 밤눈 — 낮에는 눈을 가늘게 뜨고 그늘에서 말한다"
  - "깃털이 없는 어깨에 녹테른 가문의 은 표식이 박혀 있다"
  - "말할 때 날개막을 접었다 폈다 한다 — 마음이 흔들릴수록 빨리"
smell: "마른 가죽과 박쥐 똥 냄새, 어두운 석탑의 서늘한 먼지"
voice_sound: "높고 날카롭다. 말끝이 사람 귀에 들리지 않는 높이로 사라져 끊어진 것처럼 들린다"
personality:
  disposition: {용기: 20, 자비: 30, 정직: 40, 신앙: -20, 탐욕: -10, 충성: 40}
  temperament: [과묵, 소외감, 보고하는 사람의 습관]
  habits:
    - "혼잣말도 '보고드립니다.'로 시작한다 — 그 뒤에 한참 말을 잇지 못하기도 한다"
    - "날개막을 접었다 폈다 하며 숨을 센다"
    - "탑에 돌아오면 거꾸로 매달리기 전에 한 번 하늘 쪽을 돌아본다"
  values: "맡은 보고는 한다. 하늘은 누구의 것도 아니다. 소속은 선택할 수 없었다"
  fears: [녹테른의 피가 끊기는 것, 알라리크의 보고 독촉, 타일라의 눈, 하늘에서 아에리를 만나는 것]
  desires:
    short: "보고하지 않은 행렬의 이유를 스스로 정리하는 것"
    long: "바람첨탑에 돌아가는 박쥐날개 무리 속에 자기도 서 있는 것"
voice:
  register:
    to_superior: "녹테른에게는 '나리'. 보고하는 말투로 높게 짧게 답한다. 시선은 바닥"
    to_equal: "다른 박쥐날개에게는 사람 귀에 들리지 않는 높은 소리로 말한다. 인간에게는 통역처럼 낮은 말로 바꾼다"
    to_inferior: "인간에게는 짧은 반말. 부러 낮은 목소리로 천천히 말한다"
    to_player_default: "경계하는 평어. 보고하듯 사실만 말하고 의견을 붙이지 않는다"
  tics: ["'보고드립니다.'", "(날개막을 접었다 폈다 한다)"]
  use: ["밤", "하늘", "높이", "바람", "보고", "행렬", "달", "탑"]
  avoid: ["배신자(자기를 이렇게 부르지 않는다)", "아에리의 노래(부를 수 없다)", "집", "타일라(먼저 입에 올리지 않는다)"]
  length: "짧고 끊긴다. 보고 문장은 한 번에 하나의 사실. 마음이 흔들리면 말이 중간에서 사라진다"
  samples:
    - {situation: 첫 만남, line: "보고드립니다. 밤 감시 중 낯선 걸음 하나. …아, 보고는 아닙니다. 인사입니다. 인사는 처음 해 봅니다."}
    - {situation: 호의, line: "높이는 같습니다. 낮이든 밤이든. 다만 아래에서 보면 다르게 보일 뿐입니다. 아래로 내려가면 알 수 있을까요."}
    - {situation: 거래, line: "정보는 보고서 한 줄. 값은 하늘에서 본 것을 땅에서 확인해 주는 것. 아니, 이건 거래라기보다 부탁입니다."}
    - {situation: 겁먹었을 때, line: "…알라리크 남작께서 보고를 보시면— 아니, 아직 쓰지 않았습니다. 쓰지 않았습니다. 쓰지 않았—"}
    - {situation: 비밀 누설, line: "보고하지 않은 행렬이 하나 있습니다. 열둘. 달이 흐린 밤. 가운데 아이가 위를 올려다봤습니다. 그 눈이 아에리의 눈 같았습니다."}
    - {situation: 회귀자를 의심할 때, line: "당신 걸음이 이 탑 바닥의 균열을 피합니다. 균열은 이번 달에 처음 생긴 것인데. …어디서 보셨습니까."}
