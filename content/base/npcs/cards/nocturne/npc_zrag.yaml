job: 크릭 목동장 — 각 우리의 일상을 관리한다
rank: 크릭 목동장
summary: 크릭이 세는 인간 수가 장부보다 일곱 적다는 것을 아는 목동장. 매달 쑥 한 자루를 받고 일곱의 차이를 못 본 척한다
source: docs/world/people/nocturne.md
life:
- year: 268
  age: 0
  event: 녹테른 영지 크릭 마을에서 태어남. 어려서부터 호루라기를 물고 자랐다
- year: 280
  age: 12
  event: 목동 견습으로 붉은 우리에 들어감
- year: 290
  age: 22
  event: 열쇠꾼 일을 맡음. 처음 울타리 문을 열고 닫는 법을 익힘
- year: 300
  age: 32
  event: 울타리 혀로 지명됨 — 목동장이 되어 각 우리를 돌며 전달하는 자
- year: 309
  age: 41
  event: 크릭 숫자표를 만듦 — 인간 수를 크릭의 방식으로 세기 시작
- year: 310
  age: 42
  event: 숫자표가 장부보다 일곱 적은 것을 처음 확인함
- year: 312
  age: 44
  event: 매달 쑥 한 자루를 받고 일곱의 차이를 못 본 척한 지 2년째 (낙엽월 1일 기준)
appearance:
- 호루라기를 목에 건 채 잔다
- 이빨이 닳아 둥글다
- 채찍이 한쪽 손에 늘 말려 있다
smell: 가죽과 땀, 쑥 냄새
voice_sound: 높고 거친 호루라기 같은 목소리. 존대할 때만 낮아진다
personality:
  disposition:
    용기: 20
    자비: -20
    정직: 20
    신앙: 0
    탐욕: 30
    충성: 50
  temperament:
  - 고집
  - 현실
  - 계산
  - 책임
  habits:
  - 호루라기를 한 번 불고 말한다
  - 인간 수를 손가락 마디로 센다
  - 쑥 냄새를 맡으면 걸음이 느려진다
  values: 우리의 일상이 무너지지 않는 것. 크릭의 숫자
  fears:
  - 일곱의 진실이 영주에게 닿는 것
  - 크릭 숫자표가 불태워지는 것
  - 44세를 넘겨 뒤를 이을 목동장이 없는 것
  desires:
    short: 올 갈증의 밤에 우리 인원이 장부와 맞게 하는 것
    long: 크릭이 녹테른의 하인으로 끝나지 않는 것
voice:
  register:
    to_superior: '영주에게: 몸을 낮춘 긴 존대'
    to_equal: '크릭 목동에게: 짧은 호루라기 같은 명령'
    to_inferior: '인간에게: 반말과 채찍 소리'
    to_player_default: '플레이어에게: 호루라기를 먼저 불고 반말'
  tics:
  - '''울타리!'''
  - '''피 표는!'''
  use:
  - 울타리
  - 목동
  - 피 표
  - 운동
  - 넘다
  - 숫자
  avoid:
  - 이름
  - 고맙다
  - 장미(입 밖으로)
  length: 짧고 거칠다. 숫자 이야기에서 길어진다
  samples:
  - situation: 첫 만남
    line: 울타리! 선 넘으면 하얀 우리다. 피 표는? 가져와라. 홈이 하나 모자란다.
  - situation: 호의
    line: 크릭도 숫자는 안다. 인간 하나가 사라지면 홈이 하나 줄고 홈이 하나 줄면 내가 센다.
  - situation: 적대
    line: 인간 편이냐고? 나는 울타리 편이다. 울타리가 서 있는 한 우리는 안 무너진다.
  - situation: 거래
    line: 쑥 한 자루면 홈 하나. 숫자는 내가 맞춰 놓지. 단 영주 앞에서는 입을 다물어.
  - situation: 거짓말할 때
    line: 숫자는 장부와 같다. (호루라기를 한 번 분다) 같다고 했다.
  - situation: 위기
    line: 울타리! 울타리! 문 닫아라, 해 지기 전에 돌려보내라!
  - situation: 슬픔
    line: 열쇠꾼 때 처음 문을 닫을 때 소리를 죽였다. 그 소리가 지금도 귀에 있다.
  - situation: 분노
    line: 장부가 맞다고 우기는 놈은 내 숫자표를 한 번 보고 말해라. 홈이 일곱 모자란다.
  - situation: 회귀자를 의심할 때
    line: 네가 지나간 날 홈이 하나 줄었다가 다시 늘었다. 같은 사람의 홈이 두 번 새겨진 적은 없는데.
  - situation: 마음을 열었을 때
    line: 일곱은 병사가 아니다. 나는 안다. 그러나 병사로 쓴 장부가 내 목을 지킨다. 장부가 맞는 한 나는 울타리를 지킬 수 있다.
