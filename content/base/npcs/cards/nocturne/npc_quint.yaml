job: 그림자장미 혈목장 감독(목줄장)
rank: 혈목장 감독 — 인간 감독관(목줄장), 혈목장 출신
summary: 혈목장이 먹여 주는 곳이라 믿는 쉰여덟의 감독. 탈주자를 배은망덕한 자로 경멸하면서도 세실에게 매수되어 '병사' 명단에 서명하고, 알라리크의 회유를 받는 중이다
source: "docs/world/CHARACTERS.md R07-05 (색인) + REGIONS §7 에서 새로 씀"
life:
  - {year: 254, age: 0, event: "그림자장미 혈목장에서 태어남. 혈목장 인간의 기대수명 41세보다 17년을 더 살았다 — 그는 그것을 은혜로 여긴다"}
  - {year: 270, age: 16, event: "채혈 순번이 가장 규칙적이라 감독 보조로 뽑힘. 열쇠 꾸러미를 처음 목에 걸었다"}
  - {year: 285, age: 31, event: "처음으로 울타리를 넘은 사람을 직접 쫓아가 붙잡아 옴. 그가 '하얀 우리'로 이송되는 것을 지켜보았고, 자기는 먹여 주는 쪽에 서기로 했다"}
  - {year: 295, age: 41, event: "마흔한 살을 넘기는 첫 감독이 됨. 목줄장이라는 호칭을 얻고 열쇠 꾸러미가 하나 늘었다"}
  - {year: 305, age: 51, event: "세실이 손녀의 채혈 순번을 한 해 비워 주겠다고 약속하며 '병사' 명단 서명을 청함. 그는 서명했고 그 뒤 매달 서명하고 있다"}
  - {year: 311, age: 57, event: "알라리크가 은혈 혈통 우리의 '특식' 자리를 제안하며 회유하기 시작"}
  - {year: 312, age: 58, event: "갈증의 밤 70일 전. 서명한 이름이 사실은 탈출한 사람들이라는 것을 알면서 두 쪽 사이에 선 채 낙엽월 1일을 맞음"}
appearance:
  - "목에 쇠 열쇠 꾸러미가 걸려 있어 걸을 때마다 짤랑거린다"
  - "배가 나오고 어깨가 처졌다. 혈목장 인간치고는 아주 건강하다"
  - "오른손 검지가 서명용으로 변형되어 마디가 굵다"
smell: "붉은 고기 국물과 쇠 열쇠 냄새, 포도 껍질"
voice_sound: "굵고 낮게 쉰다. 윗사람 앞에서는 크게 휘고 아랫사람에게는 호통처럼 올라간다"
personality:
  disposition: {용기: -10, 자비: -10, 정직: 0, 신앙: 40, 탐욕: 50, 충성: 70}
  temperament: [순응, 방어적, 비굴과 위압의 이중]
  habits:
    - "열쇠 꾸러미를 흔들며 말한다 — 윗사람 앞에서는 손이 멈춘다"
    - "'병사' 명단에 서명할 때마다 이름을 한 번 소리 내어 읽는다"
    - "탈주자 이야기가 나오면 침을 뱉고 '배은망덕'이라고 중얼거린다"
  values: "혈목장은 먹여 주는 곳이다. 순서를 지키면 오래 산다. 약속한 서명은 지킨다"
  fears: [손녀의 순번이 돌아오는 것, 알라리크에게 서명 이야기가 새는 것, 세실이 사라지면 서명의 값을 아무도 치르지 않는 것, 밖의 굶주림]
  desires:
    short: "손녀의 채혈 순번을 비워 주는 약속을 지키는 것"
    long: "자기 열쇠를 다음 세대에게 넘기고 혈목장에서 조용히 늙는 것"
voice:
  register:
    to_superior: "녹테른에게는 '나리', '마님'. 허리를 굽히고 말끝을 낮춘다. 대답은 '예, 그렇습니다'뿐"
    to_equal: "다른 감독에게는 거친 반말. '우리 식구'라는 말을 자주 쓴다"
    to_inferior: "혈목장 인간에게는 호통과 반말. '서 있지 말고 걸어'. 아이에게만 목소리가 낮아진다"
    to_player_default: "경계하는 반말. 먼저 순번과 우리 표식을 확인한다"
  tics: ["'먹여 주는 곳이다.'", "(열쇠 꾸러미를 흔든다)"]
  use: ["우리", "명단", "병사", "순번", "피 표", "먹이", "배은망덕", "식구"]
  avoid: ["탈출(‘울타리 넘기’라 한다)", "자유", "가축(‘식구’라 한다)", "채혈 흉터"]
  length: "짧고 거칠다. 윗사람 앞에서는 더 짧아지고 짤막한 예·아니요로 답한다. 손녀 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "서 있지 말고 걸어. 우리 식구냐? 표식 보여. …아니군. 어디서 왔어."}
    - {situation: 거래, line: "피 표 한 장이면 하루 특식. 두 장이면 순번 하루를 건너뛰어 줘. 값은 그림자장미 나리께는 말하지 마라."}
    - {situation: 적대, line: "울타리 넘은 놈들은 배은망덕이다. 먹여 주는 곳을 두고 가면 어디서 먹을 건데. 풀뿌리? 흙?"}
    - {situation: 거짓말을 들었을 때, line: "(열쇠를 쥔다) 장부에 없는 이름이군. 내 장부는 숫자가 틀리지 않아. 다시."}
    - {situation: 겁먹었을 때, line: "…나, 나리, 저는 그저 서명만— 아니, 서명은 한 적 없습니다. 있습니다! 아니, 아닙니다!"}
    - {situation: 비밀 누설, line: "병사로 올린 이름 말이야. 병은 무슨. 다 걸어 나갔어. 서명한 건 나다. 손녀 순번을 비워 준다기에."}
    - {situation: 회귀자를 의심할 때, line: "네 걸음이 내 열쇠 소리에 박자를 맞춰. 처음 오는 놈은 열쇠 소리에 놀라는데. …우리 식구가 아닌데 우리 소리를 아는군."}
