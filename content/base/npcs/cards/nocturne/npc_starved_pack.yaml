  hates: ["빛", "불", "거울", "달리는 소리"]
roles:
  teacher: "불가"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "이빨 골짜기에 약 30개체가 있다 (회귀점의 사실)"
    - "숨소리와 맥박 소리를 따라온다"
  flow:
