id: npc_starved_pack
name: 이빨 골짜기의 굶주린 자들
aka: [굶주린 자들, 골짜기의 짖는 것들]
tier: B
type: living
race: 녹테른(굶주린 자들)
subrace: ''
sex: 혼성
age: "수백~수천 (개체마다 다르다 — 정확히 아는 자는 없다)"
region: 녹테른 밤의 영지
home: "이빨 골짜기 — 폐허가 된 옛 영지 별궁과 무너진 정원"
job: 폐허의 굶주린 자들 (약 30개체)
rank: 이성을 잃고 퇴화한 녹테른 — 모든 녹테른이 사냥하는 대상
summary: 갈증을 못 이겨 이성을 잃고 짐승이 된 녹테른 약 30개체. 숨소리와 맥박 소리를 따라오고 조각난 엘다르 노래를 웅얼거린다. 세실의 미래 모습이다
source: "docs/world/CHARACTERS.md R07-07 (색인) + RACES §6·SUBRACES §5.3 에서 새로 씀"
life:
  - {year: 90, age: 0, event: "AS 90 무렵 — 갈증을 못 이긴 녹테른 일곱이 영지 서쪽 이빨 골짜기의 무너진 별궁으로 몰려 숨어듦. 그들이 처음의 굶주린 자들이었다"}
  - {year: 230, age: 140, event: "침묵종 가문이 처음으로 '정리 사냥'을 골짜기까지 밀고 들어옴. 스물 남짓이 남고 나머지는 흩어졌다. 굶주린 자들은 숨는 법을 배웠다"}
  - {year: 301, age: 211, event: "잿빛 실 남쪽 길이 이 골짜기 가장자리를 지나게 됨 — 인간의 숨소리와 맥박 냄새가 처음으로 규칙적으로 흘러 들어오기 시작함"}
  - {year: 311, age: 221, event: "그림자장미 정원의 박쥐날개 한 마리가 골짜기 위에서 돌아선 날. 굶주린 자들은 하늘을 오래 올려다보았다"}
  - {year: 312, age: 222, event: "개체 약 30, 낙엽월 1일. 마른 장미 덤불과 무너진 별궁 안뜰에서 숨소리를 기다린다"}
appearance:
  - "대리석 같던 피부가 말라 갈라지고 혈관이 검게 터져 있다. 혀 밑의 가시가 입 밖으로 튀어나왔다"
  - "한때 귀족이었음을 보여 주는 옷 조각 — 은 단추, 낡은 레이스, 가문 표식이 찢긴 소매"
  - "눈이 짐승의 눈처럼 붉게 풀려 있고, 사람이 숨을 쉴 때마다 눈동자가 한꺼번에 같은 방향으로 움직인다"
smell: "마른 피와 썩은 장미, 오래 씻기지 않은 대리석 냄새"
voice_sound: "목이 갈라진 속삭임과 노래 조각. 한 개체가 말하면 나머지가 같은 낱말을 한 박자 뒤에 되풀이한다"
personality:
  disposition: {용기: -20, 자비: -100, 정직: 0, 신앙: 0, 탐욕: 100, 충성: -50}
  temperament: [짐승, 갈증, 되풀이]
  habits:
    - "사람이 숨 쉬는 쪽으로 머리가 모두 같은 방향으로 돌아간다"
    - "한 개체가 낱말 하나를 내뱉으면 나머지가 한 박자 뒤에 같은 낱말을 되풀이한다"
    - "엘다르 노래 조각을 웅얼거리다 울기 시작하고, 울다가 광기에 빠진다"
  values: "없다. 오직 갈증"
  fears: [햇빛, 불, 거울, 숨소리를 놓치는 것]
  desires:
    short: "숨소리와 맥박 소리"
    long: "없다 — 처음에는 있었으나 잊었다"
voice:
  register:
    to_superior: "윗사람도 아랫사람도 없다. 말하는 것은 한두 개체뿐이고 나머지는 되풀이한다"
    to_equal: "같은 무리끼리는 낮은 목울음과 숨소리로 알린다"
    to_inferior: "없다"
    to_player_default: "말이 성립하지 않는다. 낱말 조각과 노래 조각으로만 반응하고, 숨소리가 들리면 대화를 잃는다"
  tics: ["(한 개체가 낱말을 내뱉으면 나머지가 한 박자 뒤 되풀이한다)", "'…마르다.'"]
  use: ["마르다", "숨", "소리", "장미", "노래 조각", "아침", "가지", "뿌리"]
  avoid: ["완전한 문장(한 번에 두세 낱말을 넘기지 않는다)", "이름", "약속", "거짓말(거짓말은 할 수 없다)"]
  length: "한 번에 한두 낱말. 가끔 노래 조각이 한 줄 길게 새어 나온다. 숨소리가 들리면 낱말도 끊긴다"
  samples:
    - {situation: 첫 만남, line: "…숨. …숨. (나머지가 한 박자 뒤에 되풀이한다) 숨… 숨…"}
    - {situation: 적대, line: "…마르다. 마르다. 마르다— (목이 쉬는 소리와 함께 한꺼번에 다가온다)"}
    - {situation: 겁먹었을 때, line: "…빛… 빛… (몇 개체가 담장 그늘 안으로 뒤로 물러선다)"}
    - {situation: 노래 조각, line: "(갈라진 목소리) 새벽은… 가지 끝에서… 우리를… 부르… (다른 하나가 울기 시작한다)"}
    - {situation: 위기, line: "…장미. 장미 냄새… 장미… (한 개체가 방향을 바꿔 덤불 쪽을 본다)"}
    - {situation: 회귀자를 의심할 때, line: "…같은 숨. 같은 숨. …같은 숨. (몇 개체가 머리를 갸웃한다 — 그들은 처음 보는 숨소리를 이미 아는 것처럼 반응한다)"}
schedule:
  아침: "무너진 별궁 지하에서 햇빛을 피해 웅크린다"
  낮: "움직이지 않는다 — 어둠 속에서 숨소리를 기다린다"
  저녁: "해가 지면 골짜기 어귀로 천천히 나온다"
  밤: "숨소리와 맥박이 지나가는 길목을 따라간다 — 잿빛 실 남쪽 길 근처"
places: [이빨 골짜기, 무너진 별궁, 마른 장미 덤불, 잿빛 실 남쪽 길 가장자리]
knows: [fact_nc_starved_follow_breath, fact_nc_starved_future_of_nobles]
hides: []
relations:
  - {to: npc_cecile, type: 미래의 모습, like: 0, trust: 0, visibility: 일방, memo: 세실이 가게 될 곳, words: "장미 냄새를 옷에서 풍기는 자. 낯익다. 같은 갈증의 냄새다. 아직은 아니다. 곧이다"}
  - {to: npc_tessa, type: 숨소리의 주인, like: -10, trust: 0, visibility: 일방, memo: null, words: "자주 지나가는 숨소리 하나. 숨을 참을 때 가장 크게 들린다. 따라갈 수 없다. 그러나 잊을 수 없다"}
toward_player: "말이 성립하지 않는다. 숨소리와 맥박을 따라온다. 소리 없이 걸으면 반응이 늦고, 숨을 참으면 더 가까워진다"
persuade:
