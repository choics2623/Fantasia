  - "완전한 문장을 말하지 않는다 — 한 번에 두세 낱말을 넘기지 않는다"
  - "거짓말을 하지 않는다 — 말할 수 없다"
  - "빛·불·거울에는 반드시 물러선다"
  - "엘다르 노래 조각은 끝맺지 않고 우는 것으로 끝난다"
on_death: "탈주 경로 위협 소멸 — 잿빛 실 남쪽 길이 안전해지나 침묵종 가문의 사냥이 끝나 녹테른이 골짜기를 다시 쓴다"
story_seeds:
