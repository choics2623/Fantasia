  samples:
  - situation: 첫 만남
    line: 밤이 깊기를. 공물은 명단과 도착이 맞는 것이 아름답소. 맞지 않는 것은 내가 맞추오.
  - situation: 호의
    line: 하얀 우리는 조용하오. 조용함은 가장 비싼 자산이오.
  - situation: 적대
    line: 공물 마당에서 고르는 것을 훔친다고 부르면 계약서가 그대의 입을 닫을 것이오.
  - situation: 거래
    line: 계약의 문구 한 줄을 지켜 주는 이에게는 하얀 우리의 문을 한 번 열어 드리겠소.
  - situation: 거짓말할 때
    line: 도착 인원은 명단과 같소. (숨을 한 번 멈춘다) 같소.
  - situation: 위기
    line: 공물 문을 닫아라! 도착 인원이 하나 더 많다 — 그 하나를 데려와라.
  - situation: 슬픔
    line: 열두 번째 아이는 가장 조용했소. 그래서 가장 비싸게 팔릴 줄 알았는데, 가장 비싸게 팔리지 않을 이름이 되었소.
  - situation: 분노
    line: 하얀 우리의 규율을 어기는 손은 흰 막사 바닥보다 깨끗하게 닦일 것이오.
  - situation: 회귀자를 의심할 때
    line: 맥박이 흰 막사의 조용함과 같소. 같을 리 없는데. 그대는 어디서 그렇게 조용해졌소?
  - situation: 마음을 열었을 때
    line: 계약은 '잔향 후보 한 명'이오. 마리안이 아니라면 다른 이름을 넣어야 하오. 올해 공물 가운데 있을지도 모르오.
