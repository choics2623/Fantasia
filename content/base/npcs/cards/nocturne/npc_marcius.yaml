voice:
  register:
    to_superior: '군주에게: 극존대'
    to_equal: '가문 귀족에게: 격식 있는 정중함'
    to_inferior: '인간에게: 말을 걸지 않는다. 걸 때는 번호로'
    to_player_default: '플레이어에게: 격식 있게 정중하다. 명단 이야기가 나오면 말이 느려진다'
  tics:
  - '''확정되기 전의 명단은…'''
  - 붉은 잔 반지 돌리기
  use:
  - 명단
  - 확정
