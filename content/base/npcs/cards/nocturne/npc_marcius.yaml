  - 이름(인간 앞에서)
  - 결번(먼저)
  length: 격식 있게 중간 길이
  samples:
  - situation: 첫 만남
    line: 밤이 깊기를. …명단은 아직 확정되지 않았소. 확정되기 전의 명단은 숨소리와 같소 — 들리나 읽히지 않소.
  - situation: 호의
    line: 한 줄은 늘 비워 두는 것이 예의요. 모든 줄을 채우면 잔이 넘치니까.
  - situation: 적대
    line: 알라리크 경이 보낸 분이오? 그렇다면 확정된 명단만 보시오. 확정되기 전의 것은 읽으면 집행되지 않소.
  - situation: 거래
    line: 한 줄을 비우는 값은 없소. 다만 비운 줄에 무엇이 들어가는지 묻지 않는 값은 있소.
  - situation: 거짓말할 때
    line: 결번? 그런 단어는 의례에 없소. (반지를 한 바퀴 돌린다)
  - situation: 위기
    line: 명단을 닫으시오! 확정되기 전에 읽힌 이름은 집행되지 않는 법이오.
  - situation: 슬픔
    line: 우물에서 두 겹 목소리를 받아 적을 때 한 줄이 비는 것을 느끼오. 그 줄이 결번과 같은 줄이오.
  - situation: 분노
    line: 알라리크가 이 자리를 가져가면 결번은 없어지오. 결번이 없어지면 우물의 한 줄도 비지 못하오.
  - situation: 회귀자를 의심할 때
    line: 맥박이 한 번 어긋났소. 우물의 두 겹 사이의 세 번째 소리와 같은 박자요. 기록하지 않았지만 기억하오.
  - situation: 마음을 열었을 때
    line: 세 번째 소리를 들었소. 우물이 두 겹으로 울릴 때 가장 낮은 곳에서. 그것이 누구의 소리인지는… 아직 기록하지 않았소.
