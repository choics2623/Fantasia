appearance:
- 손가락 끝마다 홈 자국이 겹겹이 남았다
- 나이보다 곧은 허리
- 말할 때 눈동자가 낮은 곳을 본다
smell: 양초 그을음과 장미 가지
voice_sound: 낮고 부드러운 목소리. 숫자를 말할 때 목소리가 평평해진다
personality:
  disposition:
