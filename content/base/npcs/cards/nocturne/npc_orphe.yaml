voice:
  register:
    to_superior: '세실에게: 극존대. ''주인께서'''
    to_equal: '녹테른 귀족에게: 눈을 낮춘 짧은 존대'
    to_inferior: '인간에게: 낮은 반말'
    to_player_default: '플레이어에게: 공손하고 낮다. 번호가 없는 사람에게도 존대한다'
  tics:
  - '''주인께서는…'''
  - 허공에 홈 새기기
  use:
  - 주인
  - 장부
  - 홈
  - 촛불
  - 낮
  - 숫자
  avoid:
  - 글자
  - 도망
  - 장미(먼저)
  - 이름
  length: 낮고 짧다. 홈 이야기에서만 길어진다
  samples:
  - situation: 첫 만남
    line: 주인께서는 해 지기 전에는 말씀이 없으십니다. 장부는 스물일곱 장. 오늘 밤은 서른.
  - situation: 호의
    line: 홈은 거짓말을 못 합니다. 거짓말을 하는 것은 홈을 새기는 손이지요.
  - situation: 적대
    line: 글자를 아느냐고요? 글자는 불에 닿으면 사라집니다. 홈은 불에 닿아도 번지기만 합니다.
  - situation: 거래
    line: 홈 하나를 맞추는 값은 없습니다. 다만 홈을 맞출 사람을 소개해 주십시오.
  - situation: 거짓말할 때
    line: 붉은 우리의 기록판은 한 번도 가 본 적이 없습니다. (손가락이 허공에 홈을 새긴다)
  - situation: 위기
    line: 촛불을 끄십시오! 장부는 불에 닿으면 홈이 번집니다.
  - situation: 슬픔
    line: 서른여덟 번 고쳤습니다. 서른여덟 사람이 홈 하나로 병사가 되었고, 서른여덟 사람이 어딘가에 살아 있습니다.
  - situation: 분노
    line: 주인을 해치려는 손은 홈이 하나도 새겨지지 않은 손입니다. 그런 손은 이 저택에서 아무것도 만지지 못합니다.
  - situation: 회귀자를 의심할 때
    line: 그 홈 모양은 어디서 배우셨습니까. 내가 사십 년 전에 처음 새긴 홈과 같습니다. 다른 사람은 못 읽습니다.
  - situation: 마음을 열었을 때
    line: 410이 목표가 아닙니다. 410이 처음입니다. 장미 하나가 열 사람이라면 4,100이 되는 날이 와도 좋겠습니다.
