  samples:
  - situation: 첫 만남
    line: 공물이에요. 번호는 열일곱. 이름은 말하지 않는 게 낫죠.
  - situation: 호의
    line: 장미를 따라가라는 말이 있잖아요. 그 장미를 만져 본 적 있어요.
  - situation: 적대
    line: 공물 줄에서 말을 건다는 건 같은 줄에 선다는 뜻이에요. 같은 줄에 설 각오가 있나요.
  - situation: 거래
    line: 제 이름이 명단에 어떻게 올랐는지 알면 알려 주세요. 대신 제가 아는 줄 하나를 드릴게요.
  - situation: 거짓말할 때
    line: 저는 그냥 루멘의 신도예요. (말이 반 박자 빨라진다) 정말이에요.
  - situation: 위기
    line: 줄에서 벗어나요! 결번이 나예요 — 아니, 내가 아니길 바라요!
  - situation: 슬픔
    line: 열두 살 소녀의 이름이 올해도 명단에 있어요. 지운 자국만 남겨 놓고. 그 자국이 나보다 오래 가요.
  - situation: 분노
    line: 명단은 이름을 먹는 거예요. 먹는 데 쓰는 종이가 하얀 게 가장 화가 나요.
  - situation: 회귀자를 의심할 때
    line: 그 말투… 루멘 서고에서 한 번 본 필체와 닮았어요. 필체는 아니고 말투가. 같을 리 없는데.
  - situation: 마음을 열었을 때
    line: 주머니에 꽃잎이 한 장 있어요. 마른 지 열이틀. 젖으면 길이 지워진대요. 그래서 입에 물고 걸어요.
