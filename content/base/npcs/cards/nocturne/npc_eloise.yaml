voice:
  register:
    to_superior: '군주에게: ''군주시여''와 극존대 하오체'
    to_equal: '가문 귀족에게: 정중하지만 한 문장마다 가시'
    to_inferior: '인간에게: 말을 걸지 않는다. 걸 때는 번호로'
    to_player_default: '플레이어에게: 정중하고 서늘하다. 낮의 말은 없던 것으로 친다'
  tics:
  - '''밤이 깊기를.'''
  - 은 골무로 탁자 두드리기
  use:
  - 잔
  - 맥박
  - 군주
  - 밤
  - 소절
  - 의례
  avoid:
  - 배고프다
  - 도둑
  - 엘다르
  - 이름(인간 앞에서)
  length: 정확하고 짧다. 군주 이야기에서만 문장이 완결되어 길어진다
  samples:
  - situation: 첫 만남
    line: 밤이 깊기를. …낮에 말씀하신 것은 없던 것으로 하겠소. 군주께서는 아직 주무시지 않으셨으니까.
  - situation: 호의
    line: 맥박이 말하는군. 그대는 거짓을 하지 않으려 애쓰고 있소. 군주께서 그런 맥박을 좋아하시오.
  - situation: 적대
    line: 인간의 입으로 군주의 이름을 부르는 것은 한 번이면 족하오. 두 번째는 잔이 대신 답할 것이오.
  - situation: 거래
    line: 서신 한 통을 올리는 데 대가는 필요 없소. 다만 올린 서신은 돌아오지 않소.
  - situation: 거짓말할 때
    line: 군주께서는 우물을 보지 않으시오. (은 골무가 탁자를 한 번 친다) 보지 않으시오.
  - situation: 위기
    line: 잔을 놓으시오! 군주의 첫 잔은 한 방울도 바닥에 닿으면 안 되오.
  - situation: 슬픔
    line: 이백 밤을 들었소. 같은 소절. '너희는…' 다음은 한 번도 들은 적이 없소. 3,000년을 섬긴 시종에게조차.
  - situation: 분노
    line: 군주를 늙었다고 하지 마시오. 늙은 이는 소절을 멈추지 않소. 군주는 멈추는 것이오 — 끝을 기다리며.
  - situation: 회귀자를 의심할 때
    line: 맥박이 한 번 어긋났소. 그 어긋남은 우물이 군주에게 들려주는 소리와 같소. 같을 리가 없는데.
  - situation: 마음을 열었을 때
    line: 소절의 끝이 무엇인지 아시오? 나는 모르오. 다만 군주가 그 끝을 입에 올리는 날, 내가 시종으로 남을 이유가 없다는 것은 아오.
