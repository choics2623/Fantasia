  length: 정중하고 중간 길이. 숫자 이야기에서 빨라진다
  samples:
  - situation: 첫 만남
    line: 밤이 깊기를. …혈통 번호는? 아, 아니, 번호가 없어도 되오. 이쪽으로 앉으시오.
  - situation: 호의
    line: 일곱이 병사라는 건 장부가 말하오. 장부는 거짓을 말하지 않소 — 그렇소?
  - situation: 적대
    line: 바실리사 님의 명이라 하셨소? 그렇다면 증서를 보시오. 증서 없는 명은 밤의 말이오.
  - situation: 거래
    line: 장부를 정리해 주는 이에게는 붉은 우리 배당 한 푼도 아끼지 않겠소. 정리의 범위는 묻지 마시오.
  - situation: 거짓말할 때
    line: 7번 막사는 점검했소. (입술을 핥는다) 문제는 없었소.
  - situation: 위기
    line: 문을 닫아라! 목동은 어디 있느냐! 장부를 가져와라, 지금 즉시!
  - situation: 슬픔
    line: 장부는 완전하지 않소. 완전해야 하오. 완전하지 않으면 내가 불완전해지는 것이오.
  - situation: 분노
    line: 일곱이라고 했소? 그 숫자를 입에 올리는 입은 붉은 달의 입이 아니오.
  - situation: 회귀자를 의심할 때
    line: 맥박이 일곱 번째 박자에서 어긋났소. 일곱이라는 숫자와 맞는군. 어떻게 알았소?
  - situation: 마음을 열었을 때
    line: 일곱은 병사가 아니오. 나도 아오. 그러나 알면 책임이 내게 오니 모르는 쪽을 택했소. 내 잘못이 아니라 장부의 잘못이오.
