  - 도망
  - 자유
  - 늪(먼저)
  length: 느리고 짧다. 쑥 이야기에서만 길어진다
  samples:
  - situation: 첫 만남
    line: 맥부터 잡자. 질문은 그다음이다. 아이든 어른이든 맥이 말하는 건 같은 말이야.
  - situation: 호의
    line: 이 탕약은 쓴 풀 맛이 날 거야. 쓴 건 오래 가. 단 건 금방 사라지고.
  - situation: 적대
    line: 독이라고 했나? 독이면 일흔 명이 먹고도 이렇게 숨을 쉴 리 없지. 맥을 짚어 봐.
  - situation: 거래
    line: 쑥 한 줌에 이야기 하나. 바깥 이야기. 계절 이야기도 좋고.
  - situation: 거짓말할 때
    line: 솥에는 보리만 끓는다. (국자로 솥을 한 번 휘젓는다)
  - situation: 위기
    line: 솥을 엎어라! 쑥이 보이면 안 된다! 냄새는 연기로 덮어라!
  - situation: 슬픔
    line: 피 표 홈이 늘지 않은 첫 사람이 웃었어. 웃는 얼굴은 마지막이었지만, 그 웃음이 나를 40년 끌고 왔다.
  - situation: 분노
    line: 쑥을 쓸모없다고 하는 입은 홈이 하나도 새겨지지 않은 입이다.
  - situation: 회귀자를 의심할 때
    line: 맥이 이상하다. 일곱 번 뛰고 한 번 쉬는 맥은 AS 0 이전 사람들의 맥이라고 했는데. 네 맥이 그렇다.
  - situation: 마음을 열었을 때
    line: 쑥을 대량으로 들이면 채혈이 멈춘다. 그런데 멈추면 녹테른이 우리를 쓸모없다고 볼 수도 있어. 그 한 걸음을 누구와 걸을지 내가 못 정하고 있다.
