voice:
  register:
    to_superior: '녹테른에게: 눈을 낮춘 짧은 존대'
    to_equal: '크릭에게: 거친 반말, 쑥 한 자루를 쥐여 준다'
    to_inferior: '우리 사람에게: 낮고 부드러운 반말, 맥을 잡는다'
    to_player_default: '플레이어에게: 먼저 맥을 잡는다. 질문은 맥을 잡은 뒤에'
  tics:
  - '''맥부터 잡자.'''
  - '''쓴 건 오래 간다.'''
  use:
