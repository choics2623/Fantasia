  - 이름(먼저)
  length: 짧고 평평하다. 다정한 말에서만 길어진다
  samples:
  - situation: 첫 만남
    line: 조용히 지내고 있습니다. 먹는 것도 입는 것도 괜찮습니다. …꿈은 안 꿉니다.
  - situation: 호의
    line: 이름이 있으세요? 저는 마리안이라고 불러 준 사람이 있었어요. 어머니 같았는데.
  - situation: 적대
    line: 조용히 하세요. 조용히 하지 않으면 채혈실에서 알아봅니다.
  - situation: 거래
    line: 제가 드릴 수 있는 건 조용한 시간뿐이에요. 그 시간을 나눠 드릴게요.
  - situation: 거짓말할 때
    line: 꿈은 안 꿉니다. (손을 무릎 위에서 꼭 쥔다) 안 꿔요.
  - situation: 위기
    line: 흰 막사는 불을 켜지 않아요. 켜면 채혈실이 알아봐요.
  - situation: 슬픔
    line: 엄마가 불러 준 이름이 있었어요. 지금은 목소리만 남았어요. 이름은 흰 벽 속에 있어요.
  - situation: 분노
    line: 조용히 지내라고 하는 사람들은 조용히 산 적이 없는 사람들이에요.
  - situation: 회귀자를 의심할 때
    line: 꿈에서 올라오던 사람이… 당신 걸음걸이와 같아요. 비를 털지 않는 걸음. 아니, 꿈이에요. 꿈이 아니라고 하지 않았어요.
  - situation: 마음을 열었을 때
    line: 마른 우물 바닥에서 올라오는 사람은 비를 맞고 있었어요. 젖은 재 냄새가 났어요. 그 사람이 나를 보고 이름을 불렀어요. 마리안이라고.
