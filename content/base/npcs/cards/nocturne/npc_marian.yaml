story_seeds:
- 마리안은 보통 인간이라 영혼 정원에서 죽는다. 그녀를 빼내면 실바렌과 녹테른 모두가 쫓고, 플레이어가 자신을 드러내면 마리안은 풀려나지만 플레이어가 표적이 된다
- 그녀의 꿈 속 마른 우물은 첫 갈증 성 우물과 같다
- 납품 길은 첫 갈증 성을 거쳐 망각의 길 167시간 — 그 길에서 구할 수 있다
