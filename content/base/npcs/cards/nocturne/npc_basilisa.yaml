  length: 윤기 있는 중간 길이. 계산에서는 짧아진다
  samples:
  - situation: 첫 만남
    line: 밤이 깊기를. 맥박이 흥미롭군. 낮에는 말하지 않았을 이야기를 하게 될 맥박이야.
  - situation: 호의
    line: 맹약회의에서 내가 낼 안은 단순하오. 처형하지 말 것. 우리가 먼저 마신다는 뜻이오.
  - situation: 적대
    line: 붉은 달의 배당을 건드리는 입은 맥박이 먼저 멈춘다. 그대는 어느 쪽인가.
  - situation: 거래
    line: 사냥꾼 인도 조항에 표를 주는 이에게는 붉은 우리 배당 한 몫을 나누어 드리지.
  - situation: 거짓말할 때
    line: 장부는 완전하오. (잔을 한 번 두드린다) 완전하지 않다면 내가 먼저 알았을 터.
  - situation: 위기
    line: 아드리엘은 어디 있느냐! …그의 장부를 가져오라. 지금 당장.
  - situation: 슬픔
    line: 2,900년을 살면 잔이 비는 소리가 익숙해지오. 비는 소리가 조용해질 때가 두렵소.
  - situation: 분노
    line: 대숙청을 지지하는 입은 군주의 갈증을 모르는 입이오. 그 입을 닫는 건 붉은 달이 하오.
  - situation: 회귀자를 의심할 때
    line: 그 맥박은 군주가 우물에서 듣는 박자와 같소. 같을 리가 없는데. …아니, 같을 수도 있겠군.
  - situation: 마음을 열었을 때
    line: 군주께서 원하시는 건 죽은 잔향이 아니오. 산 한 방울이오. 그걸 모르는 가문은 멸하오.
