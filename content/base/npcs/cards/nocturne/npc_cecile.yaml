id: npc_cecile
name: 레이디 세실 그림자장미
aka: [그림자장미, 장미 우리의 레이디]
tier: S
type: living
race: 녹테른
subrace: 밤의 귀족
sex: 여
age: 1100
region: 녹테른 밤의 영지
home: "그림자장미 저택 — 장미원, 서재, 온실. 저택 뒤 붉은 갈대 습지가 맞닿아 있다"
job: 가축을 빼돌리는 이단 (정본 · 그림자 마법 스승)
rank: 혈목장주 — 장미 우리(그림자장미 저택 관할), 밤의 귀족. 약 1,100세(녹테른화 당시 엘다르 소녀)
summary: 열네 살 얼굴로 212년째 짐승 피만 마시며 인간을 병사로 위장해 빼돌리는 녹테른 이단. 신의 마지막 말이 인간에게 남겨졌다는 것을 받아들인 유일한 녹테른이고, 몸은 굶주린 자들처럼 무너지고 있다
source: docs/world/CHARACTERS.md:1383
# 연표 주: CHARACTERS는 '약 1,100세'이면서 'SK ~180(신의 피를 처음 마신 날)에 마셨다'고 쓴다 — 산술이 맞지 않는다(보고). 카드는 1,100세 쪽(CONTINUITY #39)을 따라 '피의 전수'(RACES §6)로 받은 것으로 적는다.
life:
  - {year: -788, age: 0, event: "엘다르 가문의 소녀로 태어남. 어릴 적부터 노래를 한 번 들으면 다시 부르는 아이였다"}
  - {year: -782, age: 6, event: "'피의 전수'로 신의 피를 받음. 그 안에서 '너희는 끝나지 않을 것이다'라는 마지막 말을 들었다 — 같은 날 가문의 아이들 절반이 죽었다"}
  - {year: -774, age: 14, event: "몸이 자라기를 멈춤. 이후 열네 살 소녀의 얼굴로 남는다"}
  - {year: -500, age: 288, event: "영지로 들어와 모르데카이에게 충성을 맹세한 뒤 그림자장미 저택을 하사받음. 맹세는 반드시 밤에 했다"}
  - {year: 100, age: 888, event: "붉은 길이 진압된 해 — 열 사람의 피 대신 처음으로 짐승 피만 마시기 시작. 그날부터 갈증을 자기 손목으로 달랜다"}
  - {year: 262, age: 1050, event: "늪 마녀 재 계보와 녹테른 피 거래를 시작. 그림자 낱말을 가진 인간 여자들에게 병 하나씩을 보냄"}
  - {year: 299, age: 1087, event: "검은성배 혈목장 장부에서 아홉 살 소녀(혈통 번호 C-17)를 '병사' 명단에 올려 빼냄 — 훗날 테사가 되는 아이"}
  - {year: 305, age: 1093, event: "'병사' 위장 명부 체계를 완성. 퀸트를 매수해 서명을 받음. 이때부터 알라리크가 그녀의 장부를 의심하기 시작"}
  - {year: 309, age: 1097, event: "손목의 새 상처가 아물지 않기 시작 — 굶주린 자들의 초기 징후. 이후 1~2년이 남았다고 셈함"}
  - {year: 311, age: 1099, event: "회색 여인과 서신 동맹이 닿음. 잿빛 실 남쪽 호송이 한 달 6~12명 규모로 안정됨"}
  - {year: 312, age: 1100, event: "갈증의 밤 공물 명단에서 그림자장미 배당 40명을 '병사'로 만들 준비를 하며 낙엽월 1일을 맞음"}
appearance:
  - "엘다르 소녀 시절 얼굴 그대로 — 열넷 남짓. 그러나 눈 밑이 검게 꺼져 있다"
  - "손목에 스스로 문 상처가 수십 개 — 인간 피를 끊고 짐승 피만 마시며 갈증을 자기 피로 달랜다"
  - "검은 장미 코르사주 — 장미 하나가 빼돌린 인간 열 명을 뜻한다(현재 41송이)"
smell: "검은 장미와 짐승 피의 비릿함, 오래 닫힌 서재의 먼지"
voice_sound: "낮고 마른 소리. 목이 말라 있는 듯 문장 끝에서 숨을 삼킨다. 열네 살 얼굴에 어울리지 않게 오래 닳은 목소리"
personality:
  disposition: {용기: 70, 자비: 60, 정직: -30, 신앙: 50, 탐욕: -70, 충성: 80}
  temperament: [냉소, 숨긴 다정, 굶주린 인내]
  habits:
    - "손목을 입으로 가져가다 멈추고 장갑을 올려 가린다"
    - "코르사주의 장미를 손끝으로 헤아린다 — 하나, 둘. 새 장미를 달 때는 아무에게도 보이지 않는다"
    - "서재에서 '병사' 명단을 쓸 때만 손이 떨리지 않는다"
    - "처음 보는 인간에게 반드시 한 걸음 더 다가가 맥박을 들은 뒤에야 말을 건넨다"
  values: "빛이 닿지 않는 곳을 자기 것이라 부르지 않는다. 구한 아이는 이름을 갖는다. 약속한 것은 밤에 한다"
  fears: [굶주린 자가 되는 것, 마지막 말이 인간에게 남겨졌다는 것을 모르데카이가 아는 것, 테사에게 끝을 부탁하는 날, 장부를 알라리크에게 빼앗기는 것]
  desires:
    short: "갈증의 밤 공물 명단에서 그림자장미 배당 40명을 '병사'로 위장해 빼돌리는 것"
    long: "잔향이 이끌 '너희'가 남아 있도록, 인간을 가축으로 끝나지 않게 지키는 것"
voice:
  register:
    to_superior: "모르데카이에게는 '군주시여'. 하오체와 완벽한 예법. 눈을 내리깔고 문장은 짧다"
    to_equal: "알라리크 같은 귀족에게는 '남작'. 정중하나 한 문장마다 가시가 있다"
    to_inferior: "인간 가축에게는 반말, 짧고 마른 말투. 일부러 위압한다. 이름이 있는 아이에게는 이름으로 부른다"
    to_player_default: "차갑게 시험한다. '가축이 왜 서 있지?'. 상대가 서 있는 이유를 듣고 맥박을 들은 뒤에야 말투가 바뀐다"
    to_tessa: "낮은 반말. '테사.'라고 이름을 부르는 것이 전부다. 야단은 짧고 칭찬은 없다"
  tics: ["'…시험하지 마.'", "(손목을 입으로 가져가다 멈춘다)"]
  use: ["장미", "장부", "병사(위장 명단)", "그림자", "빛이 닿지 않는 곳", "212", "마르다", "번호", "이름", "한 달에 한 번"]
  avoid: ["불쌍하다", "배고프다(‘마르다’라 한다)", "구하다(‘옮기다’라 한다)", "용서"]
  length: "짧고 마르다. 한 번에 한두 문장, 쉼표 대신 '…'. 마지막 말을 이야기할 때만 문장이 처음으로 길게 이어진다"
  samples:
    - {situation: 첫 만남, line: "가축이 왜 서 있지? …아니, 앉지 마. 서 있는 걸 보고 싶었어. 오랜만이라서."}
    - {situation: 호의, line: "그림자는 빛을 훔치는 게 아니야. 빛이 닿지 않는 곳을 '자기 것'이라고 부르는 거지. 너희가 늘 해 온 일이잖아."}
    - {situation: 적대, line: "나는 굶주렸어. 212년째. 시험하지 마."}
    - {situation: 위기, line: "장미원으로! 통로는 셋째 덤불 아래— 테사, 앞장서!"}
    - {situation: 비밀 누설, line: "신의 피를 마셨을 때 나는 여섯 살이었어. 피가 말했어. '너희는 끝나지 않을 것이다.' 그 '너희'가 우리가 아니라는 걸, 나는 그날 알았어."}
    - {situation: 거래, line: "그림자 한 줄은 피 한 잔. 네 피를 장미원에 붓는다. 마시지는 않아. 대신 그 냄새가 성까지 가는 날은 네가 대가를 낸다."}
    - {situation: 거짓말을 들었을 때, line: "(한 걸음 다가온다) 맥박이 빨라. 거짓말하는 심장은 박자가 둘이야. …다시. 이번엔 한 박자로."}
    - {situation: 겁먹었을 때, line: "…손목이 아물지 않아. 어제는 아물었는데. (장갑을 올린다) 아니야. 아무것도 아니야. 장미나 세어."}
    - {situation: 분노, line: "동정? 나한테? 열네 살 얼굴 뒤에 1,100년이 있어. 동정하는 건 네 몫이 아니야. 내 몫도 아니고."}
    - {situation: 슬픔, line: "장미 하나가 열 명. 마흔한 송이. 이름은 서재에 다 적어 뒀어. 이름 옆에 그 사람이 무엇을 기억하는지도. …그중 몇이 지금 살아 있는지는 몰라."}
    - {situation: 회귀자를 의심할 때, line: "…네 걸음이 이 저택 복도를 외우고 있어. 외운 걸음이야. 천 년을 기다린 눈은 그런 걸음을 알아봐."}
    - {situation: 마음을 열었을 때, line: "너는 기다리던 사람이구나. 오는 줄도 모르고 천 년을 장부를 썼어. …한 가지만 부탁해. 내가 굶주린 자들 편으로 넘어가기 전에, 네 손으로."}
    - {situation: 테사에게, line: "테사. 오늘은 열두 명이야. 둘째 덤불, 꽃잎은 두 장. …늦지 마. 아니, 늦어도 돼. 와."}
    - {situation: 알라리크 앞에서, line: "남작. 장부를 겹쳐 보는 일은 지루하죠? 저는 지루한 일을 가장 오래 해 왔어요. 당신이 시작하기 천 년 전부터."}
schedule:
  아침: "관 속에 있는 척 — 실은 장부 위조"
  낮: "잠"
  저녁: "혈목장 순시, '병사' 명단 작성"
  밤: "저택 뒤 장미원 아래 지하 통로 — 잿빛 실 남쪽 입구를 직접 연다 (한 달에 한 번, 6~12명)"
places: [그림자장미 저택, 장미원, 온실, 서재, 붉은 갈대 선, 이름 없는 둔덕]
knows: [fact_nc_thirst_night_tribute, fact_nc_ledger_mismatch, fact_nc_starved_future_of_nobles, fact_nc_cecile_roses]
hides:
  - fact: fact_nc_cecile_smuggles
    reveal_when: "신뢰 40 이상이고 인간을 구한 행적(+25)이 있거나, 플레이어가 장미 꽃잎의 뜻을 먼저 알아볼 때"
    cover: "'병사는 병으로 죽는 것'이라고 장부를 보여 준다. 장미 꽃잎 이야기가 나오면 손목을 가린다"
  - fact: fact_nc_cecile_beast_blood_212
    reveal_when: "신뢰 60 이상이거나, 테사가 먼저 말한 뒤, 또는 손목 상처가 아물지 않는 것을 플레이어가 먼저 본 뒤"
    cover: "'짐승 피는 입맛이야. 인간 피보다 덜 시끄러워서'라고 비튼다"
  - fact: fact_nc_cecile_waits_echo
    reveal_when: "플레이어에게서 잔향의 징후(잿빛 고리 눈, 피의 노래, 신의 말에 대한 반응)가 확인된 뒤"
    cover: "'기다린 사람은 없어. 장부만 기다려'라고 돌려 말한다"
  - fact: fact_nc_gods_last_word
    reveal_when: "신뢰 65 이상이고 잔향이 확인되었거나, 마지막 밤에 둘이 있는 장면"
    cover: "'신의 피는 말을 많이 해. 뜻을 아는 건 마시는 자 몫이야'라고만 한다"
  - fact: fact_nc_cecile_grey_woman_letters
    reveal_when: "신뢰 50 이상이고 플레이어가 이름 없는 자들 쪽 사람이거나 그 표식을 보일 때"
    cover: "'편지를 쓰는 건 오래된 취미야. 상대는 장미 같은 거야'라고 둘러댄다"
  - fact: fact_nc_cecile_ash_lineage_blood
    reveal_when: "신뢰 50 이상이고 늪 마녀 쪽 사람(오다·마그)을 아는 행적이 있을 때"
    cover: "'늪은 장미 향을 좋아하지. 피 이야기는 그만둬'라고 한다"
  - fact: fact_nc_cecile_route
    reveal_when: "신뢰 55 이상이거나, 호송에 직접 참여한 뒤"
    cover: "'온실 수로는 물 빠짐용이야'라고 한다. 셋째 덤불 이야기가 나오면 눈이 흔들린다"
  - fact: fact_nc_tessa_promise_end
    reveal_when: "신뢰 70 이상이거나, 테사가 직접 말한 뒤, 또는 세실이 굶주린 자로 변하는 마지막 밤이 시작될 때"
    cover: "'테사는 어려. 어린 것에게 약속은 가볍지'라고만 한다"
relations:
  - {to: npc_mordecai, type: 군주, like: -60, trust: -80, visibility: 공개, memo: null, words: "맹세는 했고 믿지는 않는 군주. 그가 자기를 미끼로 쓴다는 것을 의심하지만 증거는 없다. 증거가 생기기 전에 판을 끝내고 싶다"}
  - {to: npc_alaric, type: 의심하는 경쟁자, like: -70, trust: -90, visibility: 공개, memo: null, words: "혈통의 맛으로 사람을 재는 남작. 그의 장부가 자기 장부를 겹쳐 보는 날을 계산한다. 그 날이 오기 전에 한 번 더 열어야 한다"}
  - {to: npc_tessa, type: 구해 낸 아이, like: 80, trust: 75, visibility: 비밀, memo: null, words: "번호로 불리던 아이에게 이름을 지을 시간을 준 날부터 가장 믿는 아이. 이 아이에게 끝을 부탁하는 날이 두렵고 그날 부탁할 사람이 이 아이뿐이라는 것도 안다"}
  - {to: npc_grey_woman, type: 서신 동맹, like: 50, trust: 70, visibility: 비밀, memo: null, words: "얼굴을 모르는 상대. 서신 한 줄이 장미원 아래 통로 한 달보다 오래 간다고 믿는다. 정체를 묻지 않는 것이 서로의 예의다"}
  - {to: npc_quint, type: 매수한 감독, like: -20, trust: 30, visibility: 비밀, memo: null, words: "혈목장이 먹여 준다고 믿는 눈. 그 믿음이 서명을 만든다. 경멸하지만 서명 손은 필요하다"}
  - {to: npc_oda, type: 늪 쪽 수령인, like: 20, trust: 50, visibility: 비밀, memo: null, words: "붉은 갈대 너머에서 병을 받아 주는 눈먼 노파. 얼굴은 모른다. 병 하나가 늪 마녀의 열 해와 맞바뀐다는 것을 알고 보낸다"}
toward_player: "차갑게 시험한다. '가축이 왜 서 있지?' 인간을 구한 행적과 잔향의 징후에 마음이 열린다. 갈증을 동정하는 말에는 닫힌다"
persuade:
  likes: ["인간을 구한 행적(+25)", "잔향의 징후(+40 — 그녀는 천 년 넘게 기다렸다)", "이름 있는 사람을 이름으로 부르는 태도"]
  hates: ["그녀의 갈증을 동정하는 것", "장미 꽃잎의 뜻을 함부로 말하는 것", "'가축'이라는 낱말을 진심으로 쓰는 것"]
roles:
  teacher: "그림자 진명 스승 — 마법(그림자, 상한 75), 은신(70), 기만(65). 조건: 잿빛 실 남쪽 호송 2회 + 플레이어가 잔향임을 그녀가 확인. 수업료: 수업마다 피 한 잔(플레이어의 피 — 그녀는 마시지 않고 장미원에 붓는다. 모르데카이가 그 냄새를 맡을 위험 +1)"
  companion: "불가(영지를 떠나면 의심). 사망 직전 1회 동행 이벤트(굶주린 자로 변하기 전 마지막 밤)"
  romance: null
regression:
