    - {situation: 첫 만남(두 번째 회차 이후 — 기시감), line: "…또 왔구나, 사절. 아니, 처음인가. 오늘따라 네 얼굴을 어디서 본 것 같군."}
    - {situation: 호의, line: "서고는 내 것이 되오. 불에 타지 않소. 그것이 약속이오 — 용은 가진 것을 버리지 않으니."}
    - {situation: 적대, line: "내 둥지의 것을 만지는 손은 내 것이 되오. 손만 남기고."}
    - {situation: 거래, line: "남문을 하루 늦게 치겠소. 그 대가로 서고의 문을 내게 여시오. 책 한 권도 빠짐없이."}
    - {situation: 수집, line: "이 문패를 보시오. '하르텐.' 인간이 자기 이름을 돌에 새겼소. 이것보다 아름다운 걸 본 적이 없소."}
    - {situation: 거짓말을 들었을 때, line: "사절은 거짓말을 하지 않소. 거짓말을 하는 자는 사절이 아니오. …너는 누구냐."}
    - {situation: 위기(해 질 녘), line: "…해가 진다. 너는 또 늦었소. 내일 다시 오시오 — 아니, 오늘 다시."}
    - {situation: 분노, line: "그분의 불이 서고에 닿으면, 사절, 나는 그분의 날개를 물겠소. 그것이 형제를 문 용에게 할 수 있는 유일한 대답이니."}
    - {situation: 슬픔, line: "탑이 셋이오. 아직 셋. 내일도 셋일 거요. …내일은 왜 이렇게 멀지."}
    - {situation: 비밀 누설, line: "회의에서 그분이 말했소. 원이 다 그려지기 전에 불을 뿜는다고. 노예의 말이 끝나기 전에. 그 노예는 죽어도 돌아온다고 — 그러니 돌아올 곳을 태운다고."}
    - {situation: 회귀자를 의심할 때, line: "너에게서 젖은 재 냄새가 나오. 내일의 냄새. …사절은 아직 내일을 모를 텐데."}
    - {situation: 시험 — 진실을 들었을 때(해 질 녘의 틈), line: "…312년. (오래 침묵) 그럼 서고는. 그럼 그 노예는. 그럼 나는 무엇을 갖고 있었던 거요."}
    - {situation: 마음을 열었을 때, line: "가져가시오, 이 문패 하나. 나는 가진 것을 버리지 않소. 그러니 이건 버리는 게 아니오 — 맡기는 거요."}
