life:
  - {year: -2588, age: 0, event: "SK 500, 남쪽 사막 가장자리 검댕 혈통 둥지에서 부화. 신을 태운 세대의 자식"}
  - {year: -2486, age: 102, event: "드라크마르 건국(SK 602). 용좌에 서약하지 않았다 — '서약은 가진 것을 남에게 맡기는 일'"}
  - {year: -1857, age: 731, event: "잿날개의 밤. 바르스카르가 잠든 형 그림바르의 목을 무는 것을 하늘에서 보았다. 그 뒤로 바르스카르를 '그분'이라 부른다 — 두려움으로"}
  - {year: -778, age: 1810, event: "거인 전쟁. 전장의 방패와 깃발과 부러진 사슬을 모으기 시작 — 수집의 시작"}
  - {year: -9, age: 2579, event: "인간 노예들이 성을 쌓는 것을 멀리서 지켜봄. 인간이 문패에 자기 이름을 새기는 것을 처음 봄. 그 도시를 갖고 싶어졌다"}
  - {year: -1, age: 2587, event: "포위군 남쪽 진지. 대붕괴 전날의 포위 회의에서 바르스카르가 계획을 말한다 — '원이 다 그려지기 전에 불을 뿜는다.' 그날 밤 아스테리아의 인간 사절과 거래: 서고를 태우지 않고 그에게, 대가로 남문을 하루 늦게 친다. 사절은 돌아오지 않았다"}
  - {year: 0, age: 2588, event: "대붕괴. 남쪽 진지에서 찢어진 시간이 오른쪽 옆구리를 스쳤다. 그날부터 그는 전날을 산다 — 해가 지면 하루가 처음으로 돌아간다"}
  - {year: 41, age: 2629, event: "둥지 아래 녹은 모래가 굳어 검은 유리 지대가 됨. 그는 그것을 '내일 아침의 서리'라고 부른다"}
  - {year: 160, age: 2748, event: "처음으로 길 잃은 인간을 '사절'로 맞아 살려 보냄. 마지막 등불에 소문이 생김"}
  - {year: 290, age: 2878, event: "몰락 기사 데스('유리눈')를 사절로 맞아 살려 보냄. 데스는 그 뒤 잔상을 보는 의안을 끼웠다"}
  - {year: 311, age: 2899, event: "그의 '하루'의 해 질 녘이 조금씩 길어진다 — 해가 진 뒤에도 몇 박 동안 '내일'을 기억한다. 그는 그것을 피로라 여긴다"}
appearance:
  - "몸길이 약 30m, 그을린 잿빛-검정 비늘. 날개막에 녹은 모래가 굳은 검은 유리 조각이 박혀 움직일 때마다 유리가 운다"
  - "오른쪽 옆구리 비늘의 결이 거꾸로 났다 — 시간의 균열이 스친 자리. 가까이 서면 그림자가 늦게 따라온다"
  - "둥지는 아스테리아 집터의 문패·창틀·종 조각으로 쌓였다. 인간의 성이 새겨진 문패만 400여 개"
smell: "식은 숯과 녹은 모래, 그리고 오래된 종이 — 그가 아직 갖지 못한 서고의 냄새를 그는 매일 상상한다"
voice_sound: "깊고 느린 용언 억양의 공용어. 말끝마다 유리가 우는 소리가 섞인다. 해 질 녘이 가까우면 말이 빨라진다"
