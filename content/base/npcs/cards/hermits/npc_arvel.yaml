    - {situation: 호의, line: "봉화에 불을 붙이지 않은 지 312년이다. 불이 꺼지는 날 — 그분의 불이 — 나는 이걸 켠다. 그게 우리 신호다."}
    - {situation: 적대, line: "그 말을 내 앞에서 하지 마라. 인간이 세계를 찢었다고? 나는 원 바깥 열 걸음에 서 있었다."}
