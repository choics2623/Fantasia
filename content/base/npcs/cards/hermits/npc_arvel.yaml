    - {situation: 위기, line: "붉은 날개다 — 드라반이다. 지하 저장고로! 그는 늙은 자들의 냄새를 찾고 있다."}
    - {situation: 슬픔, line: "성 안에서 아이들이 글자를 읽고 있었다. 항복하라고 세 번 외쳤는데. 답 대신 그 소리가 났다. 다음 날 아침 그 소리가 끊겼다."}
    - {situation: 그날 이야기(현재형), line: "원이 빛난다. 거의 다 그려졌다. 그 노예가 고개를 든다. 그분이 숨을 들이쉰다 — 나는 외칠 자리에 서 있는데 외칠 말이 없다."}
    - {situation: 회귀자를 의심할 때(기시감 약), line: "…그날 원 바깥에서 너 같은 눈을 본 것 같다. 잿빛 고리. 아니, 312년 전이다. 늙은 자의 착각이지."}
    - {situation: 세라크 이야기, line: "그분의 손녀가 할아버지에게 진실을 묻는다지. 묻는 용은 드물다. 묻는 자가 들어야 한다."}
    - {situation: 비밀 누설, line: "원은 거의 다 그려져 있었다. 그 노예가 성 전체를 향해 외쳤다 — 너희는 끝나지 않을 것이다. '너희'라고 했다. 그리고 불이 먼저 왔다. 의식은 끝나지 않았다."}
    - {situation: 마음을 열었을 때, line: "네가 다음 입이 되어라. 아니면 다음 입을 데려와라. 불이 꺼지는 날 이 봉화가 켜지면 — 바알카르의 늙은 둘과 잉크 거리의 늙은이가 본다. 그리고 아우락스도."}
