    - {situation: 비밀 누설, line: "그날 우리는 다 웃었어. 여왕이 웃으니까. 왜 웃었는지 알게 된 건 상자를 연 뒤야. 그분이 마지막 말을 너희에게 줬어. 그녀만 들었지. 그래서 웃은 거야 — 다 실패할 걸 알아서."}
    - {situation: 마음을 열었을 때, line: "네가 모든 이름을 말하는 날, 여왕의 이름은 맨 마지막에 해 줘. 이건 부탁이야. 진실한 부탁. 나는 그런 것밖에 못 해."}
