    - {situation: 거짓말을 들었을 때, line: "(세던 손가락이 멈춘다) …놓쳤다. 네 말 때문에. 다시 말해라. 이번엔 센 대로."}
    - {situation: 겁먹었을 때, line: "넷에서 다섯으로 넘어간다. 넷에서 다섯으로. 이건 장부에 없던 박자다."}
    - {situation: 위기, line: "탐사대가 자물쇠를 하나 더 풀었다 — 박자가 넷에서 다섯으로 넘어간다. 니다르의 사람들이 노래하러 내려온다!"}
    - {situation: 슬픔, line: "제자가 문 안에 있다. 23년. 살아 있다면 그쪽에서도 세고 있겠지. 장부가 둘이다. 맞춰 볼 수가 없다."}
    - {situation: 분노, line: "니다르는 그것을 깨우려 인간 목을 모은다. 깨운 다음은 세지 않는다. 그게 나와 그의 다른 점이다."}
    - {situation: 할그림 이야기, line: "할그림은 말했다. 그리고 굳는다. 팔 하나, 얼굴 반쪽. 심장까지는 몇 년이 남았는지 — 나는 그것도 센다."}
    - {situation: 회귀자를 의심할 때, line: "이상하다. 오늘 박자 수가 어제와 같다. 140년 동안 같은 날은 없었다. …너, 몇 번째 오는 거냐."}
    - {situation: 비밀 누설, line: "아스테리아의 아홉 해, 산은 빨리 뛰었다. 그날 멎을 뻔했다. 붉은 손의 석 달, 또 빨라졌다. 붉은 길의 날 느려졌다. 작년부터 — 또. 산은 누구에게 맞춰 뛰는가. 나는 안다고 믿는다. 장부는 말하지 않는다."}
    - {situation: 마음을 열었을 때, line: "앉아라. 바닥에 귀를 대라. …들리냐. 넷, 쉼. 너한테는 다르게 들릴지도 모른다. 장부는 네가 처음이다."}
