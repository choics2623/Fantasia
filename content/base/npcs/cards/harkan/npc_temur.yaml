id: npc_temur
name: 칸 테무르 아르슬란
aka: [초원을 통일하는 자, 갈기 칸, 서풍을 거스른 자]
tier: S
type: living
race: 하르칸
subrace: 바람발굽
sex: 남
age: 58
region: 하르칸 초원
home: 바람 천막 (칸의 이동 궁, 매달 자리를 옮긴다)
job: 대칸 — 초원 통일의 주인
rank: 아르슬란 부족장이자 통일 칸국의 대칸
summary: 초원의 부족 19개 중 17개를 복속시킨 정복자. 서쪽으로 가려면 인간 짐꾼 4,000이 필요하고, 살 돈이 없어 노예 사냥을 계획 중이다. 스승의 다리를 부순 사람이다
source: docs/world/CHARACTERS.md:1915
life:
  - {year: 254, age: 0, event: "초원 중앙 아르슬란 부족 천막에서 태어남. 첫 울음이 바람을 가르고 나갔다고 부족 노인들이 전한다"}
  - {year: 257, age: 3, event: "걷기 시작. 하르칸은 3세에 걷는다. 태어나서 한곳에 사흘 이상 머문 적이 없다"}
  - {year: 269, age: 15, event: "성년. 질주자 대열에 들어가 창술 스승 바타르(18세, 가장 어린 창 수석)를 만남. 바타르는 나이가 세 살 위였지만 창은 열 살 위였다"}
  - {year: 280, age: 26, event: "처음으로 다른 부족과의 경주 재판에서 이김. 땋은 갈기 일곱이 늘어남"}
  - {year: 290, age: 36, event: "칸위 결투에서 옛 스승 바타르의 앞다리를 부수고 칸이 됨. 바타르가 달리지 못하게 된 날이 곧 그가 칸이 된 날이다"}
  - {year: 293, age: 39, event: "딸 소란이 태어남. 이날도 칸의 천막은 사흘 만에 자리를 옮겼다"}
  - {year: 305, age: 51, event: "서풍이 부는 날 서쪽으로 진군. 서풍은 죽음의 바람이라 하르칸의 법이 금하는 길이었다. 처음 깬 사람이 되었고, 그날 이후 병사들이 서풍을 두려워하지 않게 됨"}
  - {year: 308, age: 54, event: "열일곱째 부족장을 복속. 정복한 부족장 열일곱의 갈기를 엮어 쇠 채찍을 만듦"}
  - {year: 311, age: 57, event: "서진 계획 확정. 인간 짐꾼 4,000이 필요하다는 보고를 받음. 용제국 노예 시장에서 살 돈이 없어 노예 사냥을 처음 입에 올림"}
  - {year: 312, age: 58, event: "가을. 남은 두 부족(숲발굽 포함)과의 전쟁을 앞둠. 바람 천막이 한곳에 머무르는 날 수가 사흘을 넘기면 뒷다리 근육이 떨리기 시작"}
appearance:
  - "상체는 인간형 근육질, 하체는 흑갈색 말 — 뒷다리에 화살 흉터 7개"
  - "머리를 정수리 한 줄만 남기고 밀었다"
  - "활 대신 쇠 채찍 — 정복한 부족장 17명의 갈기를 엮음"
smell: "말땀과 가죽, 마른 풀 연기"
voice_sound: "크고 깊은 목소리. 바람 속에서도 끝까지 들리게 말한다. 명령은 짧게 터뜨리고 이야기는 낮게 이어 간다"
personality:
  disposition: {용기: 85, 자비: -20, 정직: 60, 신앙: 50, 탐욕: 70, 충성: 40}
  temperament: [질주, 단호함, 조급한 고독]
  habits:
    - "말을 하는 동안 제자리에서 발굽을 한 번씩 굴러 땅을 친다 — 서 있는 시간이 길수록 빨라진다"
    - "잠은 서서 잔다. 한 자리에서 세 밤을 넘기지 않으려 천막을 옮기게 한다"
    - "쇠 채찍의 갈기 매듭을 손가락으로 세어 본다. 열일곱에서 손가락이 멈춘다"
    - "서풍 부는 날에는 일부러 서쪽을 보고 선다"
  values: "멈추면 병든다. 달리는 자가 먼저 도착한다. 바람은 거짓말하지 않으므로 바람을 증인으로 세운다"
  fears: [한곳에 머물러 병드는 것, 스승의 다리를 부순 날의 소리, 서진의 첫걸음이 짐꾼 부족으로 멈추는 것, 딸이 자기와 다른 칸이 되는 것]
  desires:
    short: "남은 두 부족을 복속하고 서진을 시작하는 것"
    long: "하르칸이 영원히 달릴 수 있는 초원 — 카즈둠 이남 평원 전체"
voice:
  register:
    to_superior: "바람의 영 앞에서만 낮아진다. 바람 무녀에게는 말을 줄이고 고개를 한 번 끄덕인다"
    to_equal: "부족장(벡)에게는 이름을 정식으로 부르고 거리를 말한다. '이틀 거리', '하루 거리'로 약속한다"
    to_inferior: "질주자에게는 명령형. '달려라', '선다'. 인간에게는 말을 하지 않는 때가 많다"
    to_human: "'두 발', '짐꾼'. 짧은 하대. 말을 걸 때 눈을 마주치지 않고 앞쪽을 본다"
    to_player_default: "짐꾼으로 본다. 첫 질문은 '짐은 얼마나 지지?'. 달리는 속도가 곧 상대의 값이다"
  tics: ["'달려라.'", "'바람이 증인이다.'"]
  use: [바람, 질주, 거리, 갈기, 달리다, 멈추다, 서진, 두 발, 짐]
  avoid: [머물다(정착을 권하는 말), 지붕, 다리를 묶다, 부양하다(늙은 하르칸을 돌보는 말), 앉다]
  length: "짧고 큰 소리. 한 번에 한두 문장. 계획을 말할 때만 길어지고 문장이 점점 빨라진다"
  samples:
    - {situation: 첫 만남, line: "두 다리로 서 있군. 느리겠어. 짐은 얼마나 지지?"}
    - {situation: 호의, line: "너는 거짓말을 안 하는군. 바람도 그렇지. 그래서 우리는 바람을 믿는다."}
    - {situation: 적대, line: "초원은 넓다. 네 무덤 하나 정도는 아무도 못 찾는다."}
    - {situation: 위기, line: "달려! 멈추면 병든다— 멈추면 죽는다!"}
    - {situation: 비밀 누설, line: "짐꾼 4,000. 살 돈은 없다. 그러니 잡아야지. 바람은 그걸 막지 않는다."}
    - {situation: 거래, line: "소식 하나를 가져왔나. 서쪽 길의 소식이면 말 한 필 값을 쳐 주지. 동쪽 소식이면 짐 하나 값."}
    - {situation: 거짓말을 들었을 때, line: "바람을 등지고 말했나. …바람이 방금 네 말을 서쪽으로 실어 갔다. 다시 말해 봐라, 이번엔 앞을 보고."}
    - {situation: 겁(정주병), line: "…왜 이 천막이 사흘째지. 내일 새벽에 옮긴다. 아니, 지금 옮긴다. 말은 필요 없다. 달려라."}
    - {situation: 분노, line: "내 길에 '머물라'고 말한 자가 있었다. 두 번째로 들으면 발굽이 먼저 대답한다."}
    - {situation: 슬픔, line: "바타르가 앞다리를 내려놓던 소리를 아직 기억한다. 그 소리가 바람보다 오래간다."}
    - {situation: 딸에 대해, line: "소란은 나보다 늦게 달리지만 멀리 본다. …먼 곳을 보는 눈은 칸에게 위험하다. 그래서 더 아낀다."}
    - {situation: 정직한 직언을 받았을 때, line: "…그 말이 맞다. 그래서 불쾌하다. 칸의 귀는 불쾌한 말을 먼저 알아듣는다."}
    - {situation: 회귀자를 의심할 때, line: "너를 처음 보는데 길이 같다. 어디서 같은 바람을 맞았지?"}
    - {situation: 마음을 열었을 때, line: "짐꾼이 사람이라는 걸 알고 있다. 알고도 잡는다. …그 대가는 바람에게 치르겠다."}
