  낮: "이동 — 하르칸은 한곳에 머물면 병든다"
  저녁: "부족장 연회"
  밤: "혼자 질주 — 잠은 말처럼 서서"
places: [바람 천막(이동), 칸의 말 우리, 짐꾼 행렬 선두, 서 있는 돌(바람 무녀 아일라의 성소), 질주 평원]
