on_death: "초원 통일 클락 붕괴 — 17부족 분열, 서진 소멸. 소란 승계 시 서진 대신 교역 분기"
story_seeds:
  - "4,000명의 노예 사냥 — 그 사냥터는 카즈둠 바깥 갱과 그롬마르 경계다"
