  - {to: npc_batar, type: 옛 스승, like: 20, trust: 30, visibility: 공개, memo: 다리를 부쉈다, words: "내게 창을 가르친 스승. 앞다리를 부순 날 칸이 되었다. 그 앞에 서면 발굽이 땅을 파고든다"}
  - {to: npc_dua, type: 짐꾼 우두머리, like: 10, trust: 40, visibility: 공개, memo: null, words: "짐꾼 천 이백을 지는 여자. 그녀가 지는 짐이 칸의 서진이다. 그러나 이름은 부르지 않는다"}
  - {to: npc_bror, type: 서진 상대, like: 0, trust: 10, visibility: 공개, memo: null, words: "산 속에 사는 계약의 왕. 서쪽 길의 첫 문이다. 무기는 사야 하고 길은 열어야 한다"}
  - {to: npc_urgash, type: 서진 상대, like: 20, trust: -20, visibility: 공개, memo: null, words: "피의 원형장의 늙은 주인. 숙적이면서 쓸모 있는 방패. 서진 때 먼저 베어야 할 쪽이다"}
