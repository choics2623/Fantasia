  - 칸위
  - 아버지보다
  length: 짧고 조심스럽다. 가끔 말을 삼킨다
  samples:
  - situation: 첫 만남
    line: 어느 쪽 바람이오. 아르슬란의 바투요. 편히 말하시오 — 칸의 아들이라 해서 달려 도망치지는 않소.
  - situation: 호의
    line: 당신 말은 갈기에 거짓이 없소. 아버지는 이런 사람을 싫어하오. 나는 좋아하오.
  - situation: 거절
    line: 그 이야기는 아버지의 몫이오. 아들의 입으로 하면 아버지의 말이 줄어드오.
  - situation: 분노
    line: 짐꾼은 짐이오, 그러나 짐은 사람이 진다는 것을 잊은 자는 걷지 마시오.
  - situation: 슬픔
    line: 어머니가 부르던 노래는 마지막 구절을 끝까지 들어 본 적이 없소.
  - situation: 위기
    line: 기병대는 내 뒤로! 짐꾼부터 안쪽으로 세워라!
  - situation: 비밀 누설
    line: 일곱샘의 외손자요. 외할머니의 샘이 나를 키웠소. 그렇다고 칸의 아들이 아닌 것은 아니오.
  - situation: 거래
    line: 회의에 데려가 달라는 말이오? 짐꾼으로라면 데려가겠소. 장부에는 짐으로 올리겠소.
  - situation: 거짓말
    line: 갈기 가닥을 한 번 만지시오. 거짓이면 내 가닥이 흔들릴 거요 — 오늘은 흔들리지 않았소.
