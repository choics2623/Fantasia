  - 어머니의 노래를 부르는 목소리가 아버지의 천막까지 닿는 것
  desires:
    short: 맹약회의에서 하르칸을 부끄럽지 않게 대표하고 돌아오는 것
    long: 결투 없이 칸국이 소란 쪽으로 넘어가거나 풀어지지 않게 두는 것
voice:
  register:
    to_superior: 아버지에게는 낮은 평어, 눈을 아래로
    to_equal: 벡에게는 정중한 존대
    to_inferior: 짐꾼에게는 조심스러운 평어 — 이름을 부른다
    to_player_default: 낯선 사람에게는 먼저 '어느 쪽 바람이오'를 묻고 다리가 아니라 눈을 본다
  tics:
  - 갈기 가닥을 만진다
  - '''그랬던 것 같소.'''
  use:
  - 가닥
  - 어머니
  - 물
  - 한 걸음
  - 아르슬란
  - 짐
  avoid:
