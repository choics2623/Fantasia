    long: 버려진 자들의 마을을 이삭 한 줌이 아니라 한 해의 곡식으로 키우는 것
voice:
  register:
    to_superior: 하르칸에게는 눈을 낮춘 짧은 존대('예, 달리시는 분')
    to_equal: 짐꾼에게는 걸으며 낮은 반말, 이름을 부른다
    to_inferior: 아이 짐꾼에게는 반말이 조금 길어진다
    to_player_default: 낯선 사람에게는 짐부터 건네고 걸으면서 묻는다
  tics:
  - 허리끈 매듭을 만진다
  - '''걸으면서 말해.'''
  use:
  - 줄
  - 짐
  - 쓰러진
  - 줍는
  - 돌무더기
  - 걸음
  avoid:
  - 탈주
  - 해방
  - 이삭(바깥사람 앞에서)
  length: 끊어 말한다. 걸음 수 이야기만 길다
  samples:
  - situation: 첫 만남
    line: 짐부터 들어. 이야기는 걸으면서. 앞사람 발뒤꿈치만 보고 걸어.
  - situation: 호의
    line: 걸음이 곧다. 쓰러져도 줍는 사람이 있으면 쓰러진 게 아니야. 기억해 둬.
  - situation: 거절
    line: 그건 돌 앞에서 하는 말이 아니야. 돌은 듣고 있어.
  - situation: 분노
    line: 넷째 줄을 세 번 센 뒤에야 알았어. 아무도 줍지 않았다는 걸. 다시는 세지 않아.
  - situation: 슬픔
    line: 한 줄이 비었다. 그 줄에는 이름이 있었어. 이름은 해가 지면 말해 줄게.
  - situation: 위기
    line: 쓰러져! 지금! 일어서면 안 돼 — 돌무더기까지 기어서!
  - situation: 비밀 누설
    line: 허리끈을 봐. 이 매듭 하나가 줍힌 한 사람이야. 풀면 자리가 드러나. 그래서 풀지 않아.
  - situation: 거래
    line: 물통 하나를 대신 지어 주면 돌무더기 자리 하나를 알려 줄게. 그다음은 네 걸음이야.
  - situation: 거짓말
    line: 쓰러진 사람은 해가 지면 그 자리에 없었어. 바람이 데려갔겠지.
