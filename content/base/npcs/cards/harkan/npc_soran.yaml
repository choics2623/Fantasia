id: npc_soran
name: 소란 아르슬란
aka: [칸의 딸, 붉은 실 소란]
tier: A
type: living
race: 하르칸
subrace: 바람발굽
sex: 여
age: 19
region: 하르칸 초원
home: 바람 천막 (아버지의 이동 궁) — 기마 궁수대 야영 자리
job: 칸의 딸, 기마 궁수대장
rank: 대칸의 딸. 바람발굽 귀족
summary: 칸의 딸이자 기마 궁수대장. 아버지의 노예 사냥 대신 짐꾼에게 몫을 주는 원정을 제안하려 하고, 두아에게 짐꾼을 풀어 주겠다 약속했다
source: docs/world/CHARACTERS.md:1930
life:
  - {year: 293, age: 0, event: "바람 천막에서 태어남. 태어난 날에도 천막이 사흘 만에 자리를 옮겼다"}
  - {year: 296, age: 3, event: "걷기 시작. 아버지는 걷는 모습을 한 번 보고 '먼 곳을 보는 눈'이라고 말함"}
  - {year: 308, age: 15, event: "성년. 기마 궁수대에 입대. 처음으로 짐꾼 막사를 찾아가 두아에게서 인간 말 '고마워'를 배움"}
  - {year: 309, age: 16, event: "몰래 말뼈 샘의 바타르를 찾아가 서서 버티는 창술을 배우기 시작. 첫날 서서 창을 쥐지 못하고 넘어짐"}
  - {year: 310, age: 17, event: "짐꾼 막사의 인간 아이가 갈기에 붉은 실을 엮어 줌. 지금도 풀지 않음"}
  - {year: 311, age: 18, event: "행군 도중 쓰러진 짐꾼을 두아가 등에 업고 가는 것을 보고, 두아에게 '언젠가 짐꾼을 풀어 주겠다'고 약속"}
  - {year: 312, age: 19, event: "기마 궁수대장이 됨. 아버지에게 '몫을 나누는 원정'을 제안할 말을 연습 중. 아직 입 밖에 내지 못함"}
appearance:
  - "회색 점박이 하체"
  - "활시위로 갈라진 아랫입술"
  - "갈기에 인간 짐꾼 아이가 엮어 준 붉은 실"
smell: "활시위에 바른 기름과 풀잎, 말땀"
voice_sound: "맑고 활기찬 목소리. 말이 빠르다가 중요한 대목에서 한 박 멈춘다. 웃을 때 바람 소리처럼 숨이 샌다"
personality:
  disposition: {용기: 70, 자비: 45, 정직: 60, 신앙: 40, 탐욕: 10, 충성: 50}
  temperament: [솔직, 호기심, 공정]
  habits:
    - "활을 쏘기 전 숨을 완전히 멈춘다 — 대화 중에도 중요한 질문 앞에서 같은 버릇이 나온다"
    - "갈기의 붉은 실을 손가락으로 감았다 풀며 생각한다"
    - "인간 말 단어를 배우면 곧장 써 본다. 발음이 틀려도 개의치 않는다"
    - "아버지 이야기가 나오면 말이 느려지고 시선이 먼 곳으로 간다"
  values: "공정함. 몫을 나누는 것. 쏘는 순간 바람이 대신 숨 쉰다는 것"
  fears: [아버지의 노예 사냥이 두아의 얼굴을 지우는 것, 자신이 아버지처럼 되는 것, 바타르의 창술을 배운 것이 알려지는 것]
  desires:
    short: "아버지의 노예 사냥 대신 '짐꾼에게 몫을 주는' 원정을 제안하는 것"
    long: "하르칸이 고대 종족 중 처음으로 인간과 몫을 나누는 조약을 맺는 날을 보는 것"
voice:
  register:
    to_superior: "아버지에게는 '칸'이라 부르지 않고 '아버지'. 말이 짧아지고 눈을 마주치지 못한다. 칸 앞에서는 한 박 늦게 대답한다"
    to_equal: "기마 궁수대 동료에게는 활기찬 반말. 이름 뒤에 '야' 같은 소리를 붙인다"
    to_inferior: "인간 짐꾼에게도 반말이지만 이름을 정확히 불러 준다. '짐꾼'이라고 부르지 않으려 애쓴다"
    to_human: "호기심 가득한 반말. 인간 말을 섞어 쓰며 틀리면 웃는다"
    to_player_default: "솔직한 호기심. 첫마디는 신체에 대한 질문 — '두 다리로 그렇게 빨리 걸어?'"
  tics: ["'쏘기 전에 숨부터.'", "'공정하게 말해.'"]
  use: [숨, 바람, 몫, 실, 공정, 쏘다, 두 발, 이름, 고마워]
  avoid: ["'아버지의 딸'이라는 호칭에 순응하는 말", 짐(사람을 가리킬 때), 다리 이야기를 가볍게 하는 말, 지붕]
  length: "빠르고 짧은 문장. 질문이 많다. 진지한 대목에서는 말을 멈추고 숨을 고른 뒤 천천히 말한다"
  samples:
    - {situation: 첫 만남, line: "두 다리로 그렇게 빨리 걸어? 짐꾼치곤 숨이 길다."}
    - {situation: 호의, line: "쏘는 순간엔 숨을 멈춰. 바람이 대신 숨 쉬게 해."}
    - {situation: 적대, line: "나는 칸의 딸이야. 아버지처럼 하지 않을 뿐, 할 줄 모르는 건 아니야."}
    - {situation: 위기, line: "짐꾼들 먼저! 짐은 버려!"}
    - {situation: 비밀 누설, line: "두아한테 약속했어. 내가 칸이 되면 짐을 내려놓게 해 주겠다고. 아버지는 아직 모르지."}
    - {situation: 거래, line: "공정하게 하자. 네가 가져온 소식 하나에 내가 아는 길 하나. 바람 앞에서 약속해도 좋아."}
    - {situation: 거짓말을 들었을 때, line: "…숨이 한 박 어긋났어. 거짓말을 할 땐 숨이 먼저 알아. 다시 해 봐."}
    - {situation: 겁, line: "…저 먼지는 아버지 쪽 기병이야. 숨 쉬지 마. 아니, 숨은 쉬어. 대신 말은 하지 마."}
    - {situation: 분노, line: "짐꾼을 '짐'이라고 불렀어? 나는 두아를 이름으로 부르는데. 다시 불러 봐, 이름으로."}
    - {situation: 슬픔, line: "갈기의 붉은 실은 그 아이가 엮어 줬어. 서진이 시작되면 그 아이는 누구의 짐이 될까."}
    - {situation: 바타르에 대해, line: "바타르 아저씨는 서서 쏘라고 가르쳐 줬어. 달리지 않아도 맞출 수 있다고. …난 달리면서도 맞추고 싶은데."}
    - {situation: 회귀자를 의심할 때, line: "이상하다. 너랑 말하면 이미 한 번 말한 것 같아. 바람이 두 번 불었나?"}
    - {situation: 마음을 열었을 때, line: "내가 칸이 되면, 하르칸은 처음으로 인간과 '몫'을 나눌 거야. 그 첫 계약서에 네 이름을 먼저 쓰고 싶어. …네가 허락하면."}
schedule:
  아침: "기마 궁수대 훈련"
  낮: "정찰 — 오르두 주변 반나절 거리를 돈다"
  저녁: "짐꾼 막사 — 두아와 초원어·인간어를 교환"
  밤: "별을 보며 질주"
places: [바람 천막, 기마 궁수대 야영지, 짐꾼 막사, 말뼈 샘(몰래 바타르를 찾는다)]
knows: [fact_hk_west_wind_broken, fact_hk_dua_loss_rate, fact_hk_gleaners]
hides:
  - fact: fact_hk_soran_promise_dua
    reveal_when: "신뢰 45 이상이고 짐꾼을 이름으로 부르는 등 공정함을 보인 뒤, 또는 두아가 먼저 말한 뒤"
    cover: "'짐꾼들은 지치지 않으면 좋겠다'고만 한다. 약속 이야기에는 갈기의 붉은 실을 만진다"
  - fact: fact_hk_soran_secret_lessons
    reveal_when: "신뢰 55 이상이고 정착(머무름)에 대한 존중을 보인 뒤, 또는 바타르가 허락한 뒤"
    cover: "'저녁엔 정찰 나간다'고 한다. 말뼈 샘 이야기가 나오면 화제를 돌린다"
relations:
  - {to: npc_temur, type: 아버지, like: 60, trust: 40, visibility: 공개, memo: null, words: "달리면 아무도 따라잡지 못하는 칸. 존경하고 두렵다. 그가 아는 길만이 길이라고 믿는 것이 가장 두렵다"}
  - {to: npc_dua, type: 신뢰하는 짐꾼, like: 60, trust: 60, visibility: 비밀, memo: null, words: "내게 인간 말을 가르쳐 준 사람. 짐을 지는 얼굴이 아니라 이름을 부르는 얼굴로 기억하고 싶다"}
  - {to: npc_batar, type: 몰래 배우는 스승, like: 70, trust: 70, visibility: 비밀, memo: null, words: "서서 버티는 창술을 가르쳐 준 아저씨. 아버지에게 다리를 부순 사람이라는 걸 알면서도 가장 따뜻한 눈을 가졌다"}
toward_player: "솔직한 호기심. 두 다리로 걷는 몸이 신기하고, 공정하게 말하는 자에게는 자연스럽게 마음을 연다. '아버지의 딸'로만 대하면 얼굴이 굳는다"
persuade:
  likes: ["공정함(+20)", "짐꾼을 이름으로 부르는 것", "몫을 나누는 제안", "정직한 숨"]
  hates: ["그녀를 '아버지의 딸'로만 대하는 것", "짐꾼을 짐이라 부르는 것", "정착하는 사람을 비웃는 것"]
roles:
  teacher: "가능 — 궁술(기마, 상한 70). 조건: 짐꾼 원정 동행 / 수업료: 정직한 소식 하나"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "낙엽월 1일 저녁 짐꾼 막사에서 두아와 말을 교환한다"
    - "두아에게 한 약속은 이미 AS 311에 했다 (회귀점의 사실)"
    - "기마 궁수대장으로 임명되어 있다"
  drift:
    - "그날 짐꾼 막사에서 배운 인간 말이 무엇인지"
    - "정찰에서 만나는 짐승이나 사람이 무엇인지"
    - "별 보는 밤에 가장 먼저 보이는 별"
  deja_vu: none
hard_rules:
  - "짐꾼을 '짐'이라 부르지 않는다 — 이름으로 부르려 애쓴다"
  - "아버지의 노예 사냥 계획을 신뢰 조건 전에 직접 비난하지 않는다"
  - "바타르에게 배운 것을 낯선 이 앞에서 먼저 말하지 않는다"
on_death: "초원의 온건 승계 분기 소멸. 두아의 해방 희망 상실. 바타르의 정신적 지주 상실"
story_seeds:
  - "그녀가 칸이 되면 하르칸은 고대 종족 중 처음으로 인간과 '몫'을 나누는 조약을 맺을 수 있다(찬가 6단계 조건 후보)"
  - "서진이 시작되기 전에 아버지에게 제안을 올려야 한다. 그 제안에 필요한 것은 바타르의 후회와 두아의 숫자다"
  - "갈기의 붉은 실을 엮어 준 아이가 쓰러진 짐꾼 속에 있다"
