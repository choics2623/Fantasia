relations:
  - {to: npc_temur, type: 주인, like: 0, trust: 30, visibility: 공개, memo: null, words: "내 어깨 위 1,200의 짐을 정하는 사람. 미워하지는 않는다. 다만 그가 4,000이라고 말할 때 숫자가 아니라 얼굴이 떠오른다"}
  - {to: npc_soran, type: 약속한 공주, like: 50, trust: 50, visibility: 비밀, memo: null, words: "내 앞에서 짐꾼의 이름을 정확히 부르는 칸의 딸. 그 아이가 칸이 되는 날 짐을 내려놓을 수 있을지, 그날까지 몇 명이 쓰러질지 센다"}
  - {to: npc_batar, type: 이웃, like: 50, trust: 50, visibility: 공개, memo: null, words: "샘가에 선 늙은 하르칸. 그에게 약초를 한 줌씩 두고 가는 것이 내 인사다. 그가 아무 말 않는 것이 고맙다"}
  - {to: npc_oktai, type: 같은 멍에, like: 55, trust: 60, visibility: 공개, memo: null, words: "쓰러진 짐꾼을 등에 실어 주는 무거운발굽. 그가 짐 두 배 벌을 받는 것을 보았다. 그에게 빚이 있다"}
