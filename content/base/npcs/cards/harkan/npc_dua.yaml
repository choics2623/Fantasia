id: npc_dua
name: 두아
aka: [짐 맏이, 한 줄 머리 두아]
tier: A
type: living
race: 인간
subrace: ''
sex: 여
age: 40
region: 하르칸 초원
home: 짐꾼 막사 (이동 — 오르두를 따라 매달 자리를 옮긴다)
job: 칸 직속 인간 짐꾼 우두머리 (짐꾼 1,200) — 승마·초원어 스승
rank: 칸의 짐꾼. 머리를 한 줄만 남기고 민 '영예'를 받은 노예
summary: 짐꾼 1,200을 이끄는 여자. 서진 원정에서 사망률을 절반으로 줄이려 하고, 막사의 짐 속에 사람을 숨겨 초원 길로 탈주시키는 루트를 37명째 운영한다
source: docs/world/CHARACTERS.md:1961
life:
  - {year: 272, age: 0, event: "짐꾼 막사에서 태어남. 어머니는 짐을 지다 쓰러졌고, 이름은 짐 맏이가 지어 주었다"}
  - {year: 278, age: 6, event: "처음으로 짐을 짐. 하르칸의 걸음에 맞춰 걷지 못해 처음으로 낙오 직전까지 갔으나 어머니의 친구가 업고 갔다"}
  - {year: 290, age: 18, event: "테무르가 칸위에 오르던 해, 칸 직속 짐꾼으로 뽑힘. 머리를 한 줄만 남기고 밀었다 — 영예라 했으나 표식이기도 하다"}
  - {year: 295, age: 23, event: "말을 돌보는 일을 맡음. 말 이빨에 손등을 다섯 번 물렸다. 말은 겁을 안다는 것을 처음 배움"}
  - {year: 301, age: 29, event: "전임 짐 맏이가 서진 예행 원정에서 쓰러져 짐꾼 우두머리가 됨. 처음 맡은 날 짐꾼 막사의 쓰러진 사람을 세었다"}
  - {year: 303, age: 31, event: "짐 속에 아이 하나를 숨겨 초원 길로 탈주시킴. '짐 속 사람' 루트의 첫 사람. 이후 아홉 해 동안 37명"}
  - {year: 308, age: 36, event: "칸의 딸 소란이 막사에 처음 찾아옴. 초원어와 인간어를 교환하기 시작"}
  - {year: 311, age: 39, event: "지난 원정에서 짐꾼 22%가 죽음. 쓰러진 짐꾼을 업고 가다 소란에게 약속을 받음"}
  - {year: 312, age: 40, event: "서진을 앞두고 짐꾼 4,000 소집 소문이 돎. 목표는 사망률 절반. 37명째 '짐 속 사람' 루트를 점검하는 중"}
appearance:
  - "다리가 짐꾼답게 굵고 휘었다"
  - "말 이빨 자국 흉터가 손등에 다섯"
  - "하르칸식으로 머리 한 줄만 남기고 밀었다 — 칸의 짐꾼이라는 '영예'"
smell: "말땀과 가죽끈, 마른 풀 연기"
voice_sound: "낮고 쉰 목소리. 말이 짧고 걸음 박자에 맞춰 끊긴다. 오래 걸으며 말하는 사람의 숨"
personality:
  disposition: {용기: 45, 자비: 50, 정직: 40, 신앙: 20, 탐욕: -10, 충성: 60}
  temperament: [실용, 인내, 조용한 반항]
  habits:
    - "사람을 만나면 짐의 무게와 발의 모양을 먼저 본다 — 그다음에 얼굴을 본다"
    - "쓰러진 짐꾼의 수를 입 속으로 센다. 하나, 둘, 셋… 멈추는 곳이 그날의 숫자다"
    - "말을 쓰다듬을 때 속으로 '겁은 발끝에 숨겨'라고 중얼거린다"
    - "짐을 들어 줄 때 먼저 상대에게 짐을 건넨다 — 짐 드는 법을 보는 것이다"
  values: "짐은 들고 사람은 안는다. 쓰러진 사람을 세는 것. 짐의 이름 대신 사람의 이름을 부르는 것"
  fears: [서진에서 사망률이 지난 22%를 넘는 것, "'짐 속 사람' 루트가 발각되는 것", 소란이 칸이 되기 전에 서진이 시작되는 것]
  desires:
    short: "서진 원정에서 짐꾼 사망률을 '절반'으로 줄이는 것(지난 원정 22%)"
    long: "짐꾼이 짐이 아니라 사람으로 불리는 하르칸 초원"
voice:
  register:
    to_superior: "하르칸에게는 '예, 바람발굽 님'. 하르칸을 '말'이라 부르지 않는다 — 초원에서는 죽는다. 눈을 낮추고 짐부터 건넨다"
    to_equal: "짐꾼끼리는 짧은 반말. 이름을 정확히 부른다. '짐 먼저'가 인사다"
    to_inferior: "새 짐꾼에게는 짧고 단호하게. 아이들에게는 낮고 느리게. 발부터 본다"
    to_human: "외부 인간에게는 짧은 반말. 짐을 건네며 시작한다"
    to_player_default: "짐을 먼저 건넨다 — 드는 법을 본다. 이야기는 걸으면서"
  tics: ["'짐부터.'", "(쓰러진 이를 하나씩 센다)"]
  use: [짐, 걷다, 발, 하나 둘, 이름, 막사, 말(하르칸 호칭 대신 '님'), 업다]
  avoid: [말(하르칸을 가리키는 말), 도망, 탈주(그녀는 '길을 보냈다'고 한다), 자유]
  length: "짧고 끊긴다. 걷는 박자에 맞춘 문장이 많다. 숫자를 세는 순간에만 문장이 길어진다"
  samples:
    - {situation: 첫 만남, line: "짐부터 들어. 이야기는 걸으면서."}
    - {situation: 호의, line: "말은 등에 탄 사람의 겁을 알아. 겁먹으면 말도 겁먹어. 그러니 겁은 발끝에 숨겨."}
    - {situation: 적대, line: "나는 1,200명 짐을 진다. 너는 그중 하나일 뿐이야."}
    - {situation: 위기, line: "짐을 내려! 사람이 먼저야! 칸이 뭐라든!"}
    - {situation: 비밀 누설, line: "짐 속에 사람이 있어. 서른일곱 명이 그렇게 갔지. 짐은 아무도 들여다보지 않거든."}
    - {situation: 거래, line: "초원어 한 마디를 가르치는 값은 짐 하나 대신 들어 주는 거야. 말 타는 법은 원정에 한 번 따라와. 값은 그때 정해."}
    - {situation: 거짓말을 들었을 때, line: "…짐 무게가 안 맞아. 네 말하고 들고 있는 것 둘 다. 어느 쪽을 내려놓을래."}
    - {situation: 겁, line: "…저 먼지는 채찍 기수야. 짐 뒤로 숨어. 숨이 소리 나면 짐처럼 가만히 있어."}
    - {situation: 분노, line: "하르칸을 '말'이라고 불러? 초원에서 그 말 한마디로 서른 명이 죽은 적이 있어. 나는 서른하나는 안 센다."}
    - {situation: 슬픔, line: "오늘은 둘이 쓰러졌어. 이름은 요르카와 니사. …다음 행렬이 주우면 좋겠어. 돌무더기 세 개 놓고 왔어."}
    - {situation: 소란에 대해, line: "그 아이는 짐을 지지 않아. 대신 짐 지는 사람 얼굴을 기억해. 그게 짐 지는 것보다 어려워."}
    - {situation: 회귀자를 의심할 때, line: "…네 발자국이 오늘 처음인 줄 알았는데 내 막사 길을 알고 있어. 누가 알려 줬어?"}
    - {situation: 마음을 열었을 때, line: "짐 속 사람 이야기, 너한테는 해도 되겠어. 이 길을 같이 지킬 사람이 필요했거든. 다만 하나만 약속해 — 사람을 짐이라고 부르지 마."}
schedule:
  아침: "짐 분배 — 짐꾼 한 명 한 명의 짐을 확인한다"
  낮: "이동 — 짐꾼은 하르칸 속도를 따라 하루 40리"
