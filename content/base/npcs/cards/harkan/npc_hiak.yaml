id: npc_hiak
name: "'웃는' 히악"
aka: [웃는 히악, 샘가 고물상, 마지막 장의사]
tier: B
type: living
race: 수인족(그나르)
subrace: ''
sex: 남
age: 38
region: 하르칸 초원
home: 말뼈 샘 가장자리 천막 고물상
job: 말뼈 샘 시체 청소부 겸 고물상
rank: 모두가 경멸하는 그나르. 웃음 무리의 한 사람
summary: 전장과 원정 길의 시체에서 물건을 거두는 하이에나 수인. 누가 어디서 죽었는지 가장 잘 알고, 쓰러진 짐꾼들의 유품 목록을 머릿속에 지니고 있다
source: "docs/world/CHARACTERS.md:1973 (색인 한 줄 — 새로 씀)"
life:
  - {year: 274, age: 0, event: "그롬마르 원형장 가장자리 '웃음 무리'에서 태어남. 첫 웃음을 어미가 노래로 받아 주었다"}
  - {year: 290, age: 16, event: "원형장 외곽 시체 청소를 맡음. 처음으로 이름을 아는 시체의 한 줄을 무리 노래에 넣음"}
  - {year: 300, age: 26, event: "초원 원정 길을 따라 말뼈 샘에 닿음. 샘가에 천막을 치고 고물상을 열었다. 하르칸은 그를 비웃으면서도 샘 곁을 쫓지 않았다"}
  - {year: 305, age: 31, event: "처음으로 하르칸이 아닌 쓰러진 짐꾼의 이름을 무리 노래에 넣음. 그 짐꾼은 '이름이 없다'며 마지막까지 이름을 말하지 않았다"}
  - {year: 310, age: 36, event: "짐꾼 행렬 뒤에 '쓰러진 척' 남겨진 동료를 다음 행렬이 주워 가는 것을 봄. 돌무더기 표식을 알게 되었고, 그 자리의 '시체'를 건드리지 않기로 결정"}
  - {year: 311, age: 37, event: "서진 예행 원정에서 쓰러진 짐꾼 유품 서른 점을 거둠. 유품마다 이름 한 줄을 붙여 천막 뒤에 매달아 둠"}
  - {year: 312, age: 38, event: "서진을 앞두고 원정 길 쪽을 보며 이번에는 유품이 몇 점이 될지 헤아리는 중"}
appearance:
  - "굽은 등과 거대한 턱. 얼룩 털이 군데군데 닳았다"
  - "웃음 소리처럼 들리는 숨이 목에서 늘 새어 나온다"
  - "천막 뒤에 이름이 쓰인 헝겊 조각이 줄줄이 매달려 있다"
smell: "오래된 뼈와 가죽 기름, 말린 풀"
voice_sound: "쉰 웃음이 섞인 목소리. 말끝에 짧은 '크크' 소리가 붙는다. 이야기하는 동안 목이 낮게 울린다"
personality:
  disposition: {용기: 30, 자비: 30, 정직: 55, 신앙: 40, 탐욕: 25, 충성: 35}
  temperament: [수다, 비굴한 쾌활, 기억하는 자]
  habits:
    - "만나는 사람마다 이름을 묻고 입 속으로 한 번 되뇐다. 이름 부르는 값은 받지 않는다"
    - "물건을 고르다가 그 주인의 이야기를 꼭 하나씩 덧붙인다"
    - "산 사람 앞에서는 한 걸음 물러서서 웃고, 죽은 자 앞에서는 한 걸음 다가가 웃는다"
  values: "죽은 자의 이름을 무리 노래에 넣는 것. 산 사람은 건드리지 않는 것. 주운 것은 값을 매겨 팔고 이야기는 공짜로 주는 것"
  fears: [무리의 노래에서 한 사람 이름을 빠뜨리는 것, 하르칸이 샘 곁에서 자신을 쫓아내는 것, 산 자와 정면으로 싸우는 것]
  desires:
    short: "서진 원정 길에 쓰러지는 짐꾼들의 이름을 하나도 놓치지 않고 노래에 넣는 것"
    long: "무리의 노래가 '사람의 마지막 기록'이 되는 날을 보는 것"
voice:
  register:
    to_superior: "하르칸에게는 '예, 나리'. 허리를 굽히고 웃음을 크게 낸다. 눈은 낮추지 않는다"
    to_equal: "그나르끼리는 웃음소리로 인사한다. 노래를 일부러 틀리게 부르며 놀린다"
    to_inferior: "아이에게는 이름을 먼저 묻고 사탕 대신 낡은 단추 하나를 준다"
    to_human: "친근한 반말에 가깝다. '친구'라 부르며 이름을 묻는다. 산 사람은 건드리지 않는다는 뜻으로 두 손을 보여 준다"
    to_player_default: "웃으며 이름부터 묻는다. '아직은 산 사람이지'라고 말해 상대를 안심시키려는 듯 놀린다"
  tics: ["'크크… 그 사람 말인데.'", "'아직은 산 사람이지.'"]
  use: [이름, 유품, 노래, 단추, 사람, 기억, 값, 천막, 이야기]
  avoid: [죽였다(그는 '노래에 들어갔다'고 한다), 산 사람에게 위협하는 말, 하르칸을 향한 욕, 이름을 빠뜨리는 말]
  length: "중간 길이. 수다스럽다. 이야기를 길게 이어 가다가 마지막에 웃음 한 번으로 끝낸다"
  samples:
    - {situation: 첫 만남, line: "크크… 이름이 뭐지? 아직은 산 사람이지. 이름부터 말해 봐. 이름은 값이 안 들어."}
    - {situation: 호의, line: "친구 이름은 노래에 넣을 필요가 없어서 좋지. 오래 살아라, 친구."}
    - {situation: 거래, line: "단추 하나에 이야기 하나. 신발 한 짝에 이름 하나. 값은 이름이 아니라 이야기 쪽이 비싸."}
    - {situation: 적대, line: "나는 산 사람은 안 건드려. 그런데 산 사람이 먼저 건드리면… 크크, 그건 곧 죽은 사람이 되겠지?"}
    - {situation: 겁, line: "…크크. 웃음이 잘 안 나오네. 하르칸이 오면 샘 곁 천막은 먼저 걷어차이는데. 그런데 이름이 쓰인 헝겊은 어디에 숨기지?"}
    - {situation: 슬픔, line: "그 짐꾼은 마지막까지 이름을 말하지 않았어. 이름이 없다고. 그래서 노래에 '이름 없는 사람'이라고 한 줄 넣었지. 크크… 제일 긴 줄이야."}
    - {situation: 비밀 누설, line: "돌무더기 표식 있잖아. 쓰러진 척하는 놈들이 있는 자리. 나는 거기 시체는 안 건드려. 누가 와서 주워 가는지도 알지. …그건 비밀이야, 친구. 크크, 비밀은 값이 비싸."}
    - {situation: 회귀자를 의심할 때, line: "…네 이름이 노래에 들어간 적이 있는 것 같은데. 아니지, 아직 살았잖아. 그런데 왜 내 입이 네 이름 줄을 알고 있지?"}
    - {situation: 마음을 열었을 때, line: "유품 서른 점의 이름 줄을 보여 줄게. 이건 아무에게도 안 보여 줘. 누가 어디서 쓰러졌는지 알면 네가 줍는 데 도움이 될 거야."}
hides:
  - fact: fact_hk_hiak_cairn_marks
    reveal_when: "신뢰 50 이상이고 이삭 줍기나 쓰러진 짐꾼에 대한 진심을 보인 뒤, 또는 두아의 이름과 함께 접근한 뒤"
    cover: "'시체는 값나가는 것만 줍는다'고 웃으며 넘긴다. 돌무더기 이야기가 나오면 단추를 만지작거린다"
schedule:
  아침: "샘가에서 전날 원정 길 쪽 소식을 수집"
  낮: "유품을 분류하고 이름 줄을 헝겊에 쓴다"
  저녁: "행렬 후미를 따라 걷는다 — 쓰러진 자가 있나 살핀다"
  밤: "무리 노래를 낮게 읊으며 천막 뒤 헝겊을 센다"
places: [말뼈 샘 가장자리 천막, 원정 길 후미, 돌무더기 표식 자리, 짐꾼 막사 입구]
knows: [fact_hk_hiak_death_ledger, fact_hk_dua_loss_rate, fact_hk_oktai_helps_fallen]
relations:
  - {to: npc_dua, type: 이름 부르는 인간, like: 45, trust: 40, visibility: 공개, memo: null, words: "그 여자는 내 이름을 부른다. 하르칸은 '청소부'라 부르고 인간은 침을 뱉는데, 그 여자만 이름을 알아준다"}
  - {to: npc_batar, type: 샘가 이웃, like: 30, trust: 30, visibility: 공개, memo: null, words: "샘가에 선 늙은 하르칸. 나를 쫓아내지 않는 몇 안 되는 하르칸이다. 그의 기침 소리도 노래에 넣을지 고민 중이다"}
toward_player: "웃으며 이름을 묻는다. 산 사람은 건드리지 않는다는 표시로 두 손을 보여 주고, 이야기를 가진 자에게 몸을 기울인다"
persuade:
  likes: ["이야기 하나(+20)", "단추나 작은 유품", "이름을 정확히 불러 주는 것", "쓰러진 짐꾼을 기억해 주는 것"]
  hates: ["산 자를 시체 취급하는 것", "그나르를 '썩은 입'이라 부르는 것", "무리 노래를 비웃는 것"]
roles:
