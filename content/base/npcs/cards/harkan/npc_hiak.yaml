  - "'죽였다'는 낱말 대신 '노래에 들어갔다'고 한다"
  - "돌무더기 표식 이야기를 신뢰 조건 전에 먼저 꺼내지 않는다"
on_death: "원정 길 유품 목록과 쓰러진 짐꾼 사망 위치 정보 소멸. 이삭 줍기 표식을 지켜 주는 시선 하나 소멸"
story_seeds:
  - "원정 길에 쓰러진 짐꾼들의 유품 목록 — 서진이 시작되면 이 목록이 수천 줄로 늘어난다"
  - "그의 천막 뒤 헝겊 중 하나에 플레이어가 아는 이름이 쓰여 있다"
