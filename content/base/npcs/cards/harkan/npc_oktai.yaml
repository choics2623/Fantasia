on_death: "야영지 무거운발굽 3만의 지도자 공백 — 바람발굽 멍에장에게 흡수. 무거운발굽과 인간 짐꾼 연대 가능성 소멸"
story_seeds:
  - "무거운발굽과 인간 짐꾼의 연대 가능성 — 같은 멍에가 같은 날 내려놓아지면"
  - "탄나 짐굽이 외운 멍에 서약 원문. 기한이 만료되었다는 증거를 칸 앞에서 읽을 사람이 필요하다"
