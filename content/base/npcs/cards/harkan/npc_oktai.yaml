id: npc_oktai
name: 옥타이
aka: [멍에장 옥타이, 무거운 걸음]
tier: B
type: living
race: 하르칸(무거운발굽)
subrace: ''
sex: 남
age: 45
region: 하르칸 초원
home: 말뼈 샘 곁 무거운발굽 짐 야영지
job: 무거운발굽 짐 야영지 우두머리
rank: 바람발굽에게 반쯤 예속된 대형 부족의 야영지 우두머리 (멍에 서약 아래)
summary: 짐을 끄는 대형 하르칸 부족의 야영지 우두머리. 인간 짐꾼과 같은 처지라는 것을 알면서도 인간보다 위라고 믿고 싶어 한다. 야영지에 바타르를 받아 주었다
source: "docs/world/CHARACTERS.md:1972 (색인 한 줄 — 새로 씀)"
life:
  - {year: 267, age: 0, event: "무거운발굽 짐 야영지에서 태어남. 어미가 멍에를 진 채 낳았다고 한다. 첫 걸음에 멍에 끈이 어깨에 닿았다"}
  - {year: 275, age: 8, event: "처음으로 수레 끈을 건 날. 그날 '형제라 부른다지'라는 말을 처음 들음 — 바람발굽 아이가 놀리며 한 말"}
  - {year: 298, age: 31, event: "야영지 우두머리가 됨. 바람발굽 족장의 명령이 닿는 자리에 앉았으나 직함에 '멍에'를 붙이는 것을 거부"}
  - {year: 303, age: 36, event: "13년 수레에 실려 온 바타르를 말뼈 샘에서 내려 줌. 정착병이 시작된 것을 알고도 떠나라고 하지 않았다"}
  - {year: 310, age: 43, event: "쓰러진 인간 짐꾼을 등에 실어 다음 야영지까지 나른 것이 발각되어 짐 두 배 벌을 받음. 그 짐을 지고 사흘을 걸었다"}
  - {year: 311, age: 44, event: "탄나 짐굽이 외우는 멍에 서약 원문 '가뭄이 끝날 때까지'를 처음 들음. 부정했고, 그 밤 샘가에서 혼자 걸었다"}
  - {year: 312, age: 45, event: "서진 원정에 야영지 무거운발굽 3만이 끌려가는 것이 확정됨. 짐꾼과 같은 날 멍에를 벗는 일이 있을까를 입 속으로 계산하고 있다"}
appearance:
  - "말 몸이 짐말처럼 굵고 발굽이 접시만 하다. 키 2.7m, 체중 1톤 가까이"
  - "어깨에 멍에 굳은살이 단단하게 박였다. 한쪽 어깨가 더 낮다"
  - "눈이 느리고 깊다. 말할 때 먼저 눈을 감았다 뜬다"
smell: "젖은 가죽과 땀, 수레 기름"
voice_sound: "낮고 굵은 목소리. 한 걸음마다 한 마디가 나오는 듯 박자가 느리다. 문장 끝에서 숨을 내쉰다"
personality:
  disposition: {용기: 45, 자비: 40, 정직: 60, 신앙: 25, 탐욕: 0, 충성: 45}
  temperament: [묵직함, 자존심, 억눌린 연민]
  habits:
    - "한 걸음에 한 마디씩 말한다. 걸을 때는 말을 하지 않는다"
    - "쓰러진 인간 짐꾼이 눈에 띄면 눈을 돌린다. 그러나 발굽은 조금 느려진다"
    - "'형제'라는 말이 나오면 고개를 한 번 들고 한참 있다 내린다"
  values: "멍에를 졌어도 걸음은 내 것이라는 것. 약한 이를 지나치지 않는 것. 불평하지 않는 것"
  fears: [멍에 서약의 원문이 기한 만료라는 것이 알려지는 것, 짐 두 배 벌이 인간 짐꾼에게까지 번지는 것, 자신이 인간 짐꾼과 다를 바 없다는 것을 인정하게 되는 것]
  desires:
    short: "이번 서진 원정에서 쓰러지는 짐꾼과 무거운발굽 수를 줄이는 것"
    long: "멍에를 벗는 날 걸음이 가벼워질지 알아보는 것"
voice:
  register:
    to_superior: "바람발굽에게는 '예, 형제'. 말끝이 짧게 끊기고 눈을 조금 내린다. 이 호칭이 비웃음이라는 걸 안다"
    to_equal: "무거운발굽끼리는 걸음 박자에 맞춰 짧게. '한 걸음', '또 한 걸음'이 인사다"
    to_inferior: "야영지 어린 무거운발굽에게는 낮게. 인간 짐꾼에게는 '짐 맏이'에게만 말을 건다"
    to_human: "'발 둘'. 낮고 느린 하대. 위라고 말하지만 눈은 연민이 섞여 있다"
    to_player_default: "느린 침묵. 한 걸음씩 위아래로 훑어본다. 짐을 지고 있으면 한마디 건넨다"
  tics: ["'형제라 부른다지.'", "'한 걸음.'"]
  use: [멍에, 걸음, 한 걸음, 형제, 짐, 수레, 샘, 어깨, 같은 날]
  avoid: [쉬다, 인간과 같다는 말, 멍에를 부끄럽다고 말하는 것, 바람발굽을 비난하는 말]
  length: "느리고 짧다. 한 번에 한두 마디. 숨을 한 번 내쉬고 다음 문장이 나온다"
  samples:
    - {situation: 첫 만남, line: "…발 둘. …짐이 무겁군. …한 걸음. 먼저 가라."}
    - {situation: 호의, line: "멍에는 내려놓을 때 가장 가볍다. …아니, 내려놓은 뒤가 가장 무겁다. …그래도 걸어."}
    - {situation: 적대, line: "나는 멍에를 졌다. …그래도 발굽은 내 것이다. 밟고 싶으면 밟아라."}
    - {situation: 겁, line: "…채찍 기수가 온다. …아니, 소리만. …짐 뒤에 서라. …한 걸음 물러서라."}
    - {situation: 슬픔, line: "쓰러진 짐꾼을 등에 올렸다. 짐 두 배 벌을 받았다. …둘 다 가벼웠다. 사람이 짐보다 가볍다니."}
    - {situation: 비밀 누설, line: "멍에 서약의 원문은 '가뭄이 끝날 때까지'다. 탄나가 외운 그대로. …가뭄은 오래전에 끝났다. 알고 있다. …말하지 못했다."}
    - {situation: 회귀자를 의심할 때, line: "…네 발에서 낯익은 소리가 난다. …짐을 진 사람들의 걸음 소리. …너도 어디선가 오래 걸었군."}
    - {situation: 마음을 열었을 때, line: "형제라 부른다지. …네가 부르면 그 말이 처음으로 맞는 것 같다. …한 걸음. 같이 가자."}
hides:
  - fact: fact_hk_yoke_oath_expired
    reveal_when: "신뢰 60 이상이고 탄나 짐굽의 이름을 존중하며 꺼낸 뒤, 또는 멍에를 벗는 일에 대해 진지하게 이야기한 뒤"
    cover: "'서약은 서약이다'라고 한 걸음 물러난다. 원문 이야기가 나오면 말없이 걸음을 옮긴다"
  - fact: fact_hk_oktai_same_yoke
    reveal_when: "신뢰 40 이상이고 쓰러진 짐꾼을 함께 구하는 장면 뒤"
    cover: "'인간 짐꾼은 인간 짐꾼이다'라고 한다. 눈을 돌린다"
schedule:
  아침: "수레 끈을 점검하고 야영지 무거운발굽의 멍에를 확인한다"
  낮: "짐을 끌고 샘가 길을 오간다"
  저녁: "쓰러진 짐꾼이 있으면 등에 실어 야영지로 옮긴다 — 아무도 보지 않을 때만"
  밤: "샘가에서 혼자 걷는다. 바타르 곁을 지나가며 한마디 건넨다"
places: [무거운발굽 짐 야영지, 말뼈 샘, 수레 길, 샘가 풀밭]
knows: [fact_hk_oktai_helps_fallen, fact_hk_batar_wagon_years, fact_hk_west_wind_broken]
relations:
  - {to: npc_batar, type: 야영지에 받은 이, like: 40, trust: 50, visibility: 공개, memo: null, words: "수레에서 내려 준 늙은 바람발굽. 나보다 더 땅에 붙은 자. 그 곁에서 걸으면 멍에가 조금 덜 무겁다"}
  - {to: npc_dua, type: 같은 멍에, like: 55, trust: 60, visibility: 공개, memo: null, words: "짐꾼 맏이. 쓰러진 사람을 세는 여자. 나는 지나치고 그녀는 멈춘다. 그 차이가 부끄럽다"}
  - {to: npc_temur, type: 칸, like: -10, trust: 0, visibility: 공개, memo: 멍에 서약의 주인, words: "바람발굽의 칸. 우리 멍에를 형제라 부르며 쓰는 자. 그의 서진 아래 우리는 다시 3만이 끌려간다"}
toward_player: "느린 침묵. 짐을 진 몸을 위아래로 훑고, 짐 진 자에게만 한마디 건넨다. 인간 짐꾼에게는 위라고 말하지만 연민을 감추지 못한다"
persuade:
  likes: ["짐을 진 채 걷는 자세", "쓰러진 짐꾼을 함께 돕는 것", "멍에 이야기에 정직하게 귀를 기울이는 것"]
  hates: ["멍에를 부끄러워하라는 말", "바람발굽에 대한 험담", "무거운발굽을 '짐승'이라 부르는 것"]
roles:
