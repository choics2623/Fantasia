    long: 칸이 쓰러져도 오르두가 풀리지 않게 두 번째 칸(소란)을 키우는 것
voice:
  register:
    to_superior: 칸에게는 낮은 평어. 눈을 맞추지 않고 걸음을 맞춘다
    to_equal: 벡에게는 짧은 존대. 가닥 이야기로 돌려 말한다
    to_inferior: 짐꾼에게는 숫자로 말하는 반말
    to_player_default: 낯선 이는 '낯선 손'이라 부른다. 바람 표식과 숫자를 먼저 본다
  tics:
  - 손가락 끈을 감는다
