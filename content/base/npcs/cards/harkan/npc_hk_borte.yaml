  - 머물다
  - 정착
  - 칸의 발
  length: 짧고 평평하다. 숫자 이야기만 길다
  samples:
  - situation: 첫 만남
    line: 어느 쪽 바람이오. 바람 표식은 화살 끝에 있소 — 내려놓으시오. 짧게 말하오. 오르두는 아흐레 뒤면 여기 없소.
  - situation: 호의
    line: 숫자를 틀리지 않는 손은 오르두에서 오래 가오. 다음 이동일에 이 끈 한 가닥을 가져가시오.
  - situation: 거절
    line: 그 줄은 내 매듭이 아니오. 남의 매듭은 풀지 않소.
  - situation: 분노
    line: 칸의 다리 이야기는 천막 밖에서도 하지 마시오. 바람이 들으면 벡들의 귀에 닿소.
  - situation: 슬픔
    line: 아흐레는 짧소. 열흘은 길고. 하루 모자란 자리에서 사람이 하나 줄었소.
  - situation: 위기
    line: 천막을 걷어라! 칸이 설 자리를 옮긴다 — 아흐레가 아니라 오늘이다!
  - situation: 비밀 누설
    line: 말 사백 필이오. 사백 필이면 짐꾼 사천이오. 칸은 말을 팔지 않소. 그래서 사냥을 하오.
  - situation: 거래
    line: 내 매듭 하나를 풀어 주겠소. 대신 세렌에서 말 값을 아는 사람의 이름 하나를 가져오시오.
  - situation: 거짓말
    line: 칸은 달리오. 달리는 이는 머물 겨를이 없소. 그뿐이오.
schedule:
