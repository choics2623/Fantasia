  samples:
  - situation: 첫 만남
    line: 어느 쪽 바람이오. 이곳은 마지막 진영이오. 칸의 사람이 아니면 앉아서 말하시오 — 나는 이제 서 있을 힘이 없소.
  - situation: 호의
    line: 당신은 이름을 묻는군. 이름을 묻는 사람은 이 진영에서 귀하오.
  - situation: 거절
    line: 약속은 내일 바람에게 하오. 오늘은 말하지 않겠소.
  - situation: 분노
    line: 방패라는 말을 이 천막 안에서 입에 올리지 마시오. 인간은 방패가 아니라 사람이오 — 적어도 내 눈앞에서는.
  - situation: 슬픔
    line: 열두 이름 가운데 둘이 어제 아침 쓰러졌소. 이름을 나머지 열에 더하려 했는데 이름이 모자라오.
  - situation: 위기
    line: 깃발을 올려라! 꺾인 채로라도 올려라 — 마지막 진영에도 깃발은 필요하다!
  - situation: 비밀 누설
    line: 이기지 못한다는 것을 알고 있소. 알면서 약속을 하려 하오. 바람이 나를 벌할 거요.
  - situation: 거래
    line: 인간 열을 데려가 주시오. 이 진영에서 가장 젊은 열이오. 그 대가로 칸의 천막으로 가는 길 하나를 알려 주겠소.
  - situation: 거짓말
    line: 무기를 나눠 준 적 없소. 짐꾼들이 스스로 쥔 것이오.
