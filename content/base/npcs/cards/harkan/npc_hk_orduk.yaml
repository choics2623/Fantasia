  - 소란이 아버지에게 가닥을 도로 건네는 것
  desires:
    short: 서풍의 날 진군 때 갈기 가닥을 끊고 옛 바람파를 함께 비껴 달리게 하는 것
    long: 칸이 없는 초원이 아니라 짐꾼에게 몫을 주는 칸이 서는 초원
voice:
  register:
    to_superior: 칸에게는 짧은 평어, 눈을 서쪽으로 둔다
    to_equal: 벡에게는 비웃는 존대
    to_inferior: 인간 기수에게는 '말 위의 형제' 반말 — 이름을 부른다
    to_player_default: 인간에게는 일어서서 눈을 맞춘다. 말에 앉을 줄 아는지 묻는다
  tics:
  - 돌 구슬을 굴린다
  - '''바람은 주인이 없소.'''
  use:
  - 바람
  - 가닥
  - 안장
  - 형제
  - 서쪽
  - 말 위
  avoid:
  - 충성(그 말은 쓰지 않는다)
  - 복속
  - 짐꾼(기수라 부른다)
  length: 굵고 빠르다. 비웃음은 짧게
  samples:
  - situation: 첫 만남
    line: 어느 쪽 바람이오. 말에 앉을 줄 아시오? 앉을 줄 모르면 서 있는 법이라도 알려 드리겠소.
  - situation: 호의
    line: 당신은 땅에 있어도 서쪽 바람을 보는군. 그런 눈이면 말 등이 낯설지 않을 거요.
  - situation: 거절
    line: 그건 천막 안에서 하는 이야기가 아니오. 바람이 있는 곳에서 하겠소.
  - situation: 분노
    line: 인간을 짐이라 부르는 입은 내 천막 앞에서 닫으시오. 닫지 않으면 내가 닫겠소.
  - situation: 슬픔
    line: 첫 기수가 떨어져 죽은 날 안장을 닦았소. 아직 그 안장은 아무도 타지 않소.
  - situation: 위기
    line: 기수들은 내 옆으로! 칸의 화살이 오기 전에 가닥을 끊는다!
  - situation: 비밀 누설
    line: 서풍이 불 때 가닥을 끊겠소. 돌피가 철을 주었소. 이 이야기는 바람에게도 하지 마시오.
  - situation: 거래
    line: 철 창날 열 자루를 세 길에 나눠 주면 안장 하나를 내주겠소. 안장 하나가 인간 하나요.
  - situation: 거짓말
    line: 칸에게 갈기를 건넨 이상 나는 칸의 뒤에서 달리오. 오늘까지는.
schedule:
