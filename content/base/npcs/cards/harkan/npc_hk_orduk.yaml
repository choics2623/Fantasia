- year: 312
  age: 45
  event: "서풍 날 진군 때 가닥을 끊기로 결심. 옛 바람파에 사람을 보냄"
appearance:
- 검은 털 하체, 오른쪽 앞무릎에 오래된 쇠사슬 자국 — 젊은 날 인간 노예와 같은 줄에 묶였던 흔적
- 갈기에 돌 구슬 하나를 땋아 넣었다 — 돌피 씨족이 준 것
- 웃을 때 이가 한쪽만 드러난다
smell: "마른 풀과 쇠 녹, 인간 기수의 가죽 안장 기름"
voice_sound: "굵고 낮으며 빠르다. 비웃음이 섞였으나 화를 내지 않는다"
personality:
  disposition:
