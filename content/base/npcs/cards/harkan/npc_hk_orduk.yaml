summary: "인간 쉰 명에게 말을 타고 활을 쏘는 법을 가르치는 하르칸 부족장. 추방 씨족 돌피에게서 철 창날을 받는다. 테무르가 서풍의 날 서쪽으로 진군하는 날 갈기 가닥을 자르고 칸의 자리에 소란을 세우려 한다"
