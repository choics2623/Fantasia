id: npc_batar
name: "'느린발' 바타르"
aka: [느린발, 샘가의 창, 서 있는 하르칸]
tier: A
type: living
race: 하르칸
subrace: 바람발굽(강등 — 무거운발굽 야영지 거주)
sex: 남
age: 61
region: 하르칸 초원
home: 말뼈 샘 곁 무거운발굽 짐 야영지
job: 전 칸위 경쟁자, 현재 무거운발굽 짐 야영지의 '정착자' — 창·장병기 최고 스승
rank: 강등된 바람발굽. 달리지 못하는 늙은 하르칸이라 부족에서 이름이 지워진 자에 가깝다
summary: 테무르의 옛 스승. 칸위 결투에서 일부러 앞다리를 내주었고, 지금은 노예 사냥 계획 때문에 그것을 후회한다. 달리지 않는 자의 창술을 누군가에게 남기려 한다
source: docs/world/CHARACTERS.md:1945
life:
  - {year: 251, age: 0, event: "초원 중앙 바람발굽 부족에서 태어남. 첫 해에 앞다리가 약하다는 소리를 들었으나 3세에 일찍 걸었다"}
  - {year: 266, age: 15, event: "성년. 첫 기마 전쟁에서 창으로 부족 하나를 막아섬. '버티는 창'이 그의 이름이 되기 시작"}
  - {year: 269, age: 18, event: "질주자 대열 가장 어린 창 수석으로 15세 테무르를 제자로 맡음. 나이는 세 살 위, 창은 열 살 위"}
  - {year: 280, age: 29, event: "초원 부족 전쟁에서 제자 테무르가 처음으로 자신의 창을 넘어서는 것을 봄. 기뻤으나 웃지 않았다"}
  - {year: 290, age: 39, event: "칸위 결투에서 제자 테무르에게 일부러 앞다리를 내줌. 초원이 하나가 되어야 부족 전쟁이 끝난다고 믿었다. 왼쪽 앞다리가 부러져 굳음"}
  - {year: 291, age: 40, event: "바람발굽에서 강등됨. 달리지 못하는 하르칸은 부족 안에서 설 곳이 없다. 무거운발굽 수레에 실려 이동하기 시작"}
  - {year: 303, age: 52, event: "13년 만에 말뼈 샘에서 수레를 멈추고 내려섬. 한곳에 머문 지 열흘 만에 정주병이 시작되었으나 떠나지 않았다. 이후 9년째 샘 곁에 서 있다"}
  - {year: 309, age: 58, event: "칸의 딸 소란(16)이 몰래 찾아와 창술을 배우겠다고 함. 첫날 서서 창을 쥐지 못하고 넘어졌다. 그 뒤로 매주 저녁 소란이 옴"}
  - {year: 311, age: 60, event: "테무르가 서진을 위해 인간 노예를 사냥할 계획이라는 소문을 들음. 처음으로 후회가 뼈에 닿았다"}
  - {year: 312, age: 61, event: "정착병으로 밤마다 기침한다. 샘 곁 하르칸 중 가장 오래 선 자가 되었다. 서리월 전에 소란에게 마지막 창 한 자락을 가르치려 한다"}
appearance:
  - "왼쪽 앞다리가 부러진 채 굳어 땅을 짚지 못한다"
  - "9년 정착으로 피부에 버짐이 올랐다 — 하르칸의 '정착병'"
  - "창 자루에 초원 부족 19개의 문양이 새겨져 있다"
smell: "샘물과 젖은 가죽, 쓴 약초"
voice_sound: "낮고 느린 목소리. 말 사이마다 기침이 끼어든다. 문장 끝이 땅을 짚듯 내려앉는다"
personality:
  disposition: {용기: 60, 자비: 40, 정직: 70, 신앙: 30, 탐욕: -50, 충성: 20}
  temperament: [차분함, 시험하는 눈, 늙은 후회]
  habits:
    - "상대가 말하면 먼저 서 있는 자세를 본다. 발이 땅에 붙어 있는지부터 확인한다"
    - "창을 쥔 채 샘을 바라보며 하루 종일 서 있는다. 서 있는 동안 창끝은 한 번도 흔들리지 않는다"
    - "기침이 나면 창 자루에 이마를 대고 숨을 고른다"
    - "소란이 올 시간이 가까워지면 샘가의 풀을 발굽으로 정리한다"
  values: "서서 버티는 것도 달리는 것만큼 오래 산다는 것. 늙었다고 부양받지 않는다는 것. 창은 가르칠 사람에게 건네야 완성된다는 것"
  fears: [소란의 창이 자기 때문에 아버지와 갈라지는 것, 서진이 시작되기 전에 쓰러지는 것, 후회가 노예 사냥으로 번지는 것]
  desires:
    short: "죽기 전에 '달리지 않는 자의 창술'을 누군가에게 남기는 것 — 두 다리로 서는 인간에게 오히려 맞는 창술"
    long: "초원이 다시는 한 사람에게 다리를 부수게 하지 않는 것"
voice:
  register:
    to_superior: "칸에게는 말하지 않는다. 바람의 영 앞에서만 고개를 낮추고 입을 닫는다"
    to_equal: "하르칸 장로에게는 차분한 반말. 서로 늙은 갈기를 보고 인사한다"
    to_inferior: "제자에게는 짧은 지시. '서 봐라', '버텨라'. 틀리면 고쳐 주고 맞으면 아무 말도 하지 않는다"
    to_human: "'발 둘' 대신 '서 있는 자'. 반말, 느리게. 창을 쥐는 법부터 본다"
    to_player_default: "차분한 시험. 첫 지시는 '창을 쥐어 봐라'. 발이 땅에 붙어 있는지 먼저 본다"
  tics: ["'서 봐라.'", "(기침 한 번)"]
  use: [창, 서다, 버티다, 샘, 발, 땅, 창끝, 늦다, 오래]
  avoid: [동정하는 말, 달려라(그는 '서라'고 말한다), 불쌍하다, 지붕 이야기, 테무르를 비난하는 말]
  length: "느리고 짧다. 한 번에 한두 문장. 가르칠 때만 문장이 이어지고 비유가 들어간다"
  samples:
    - {situation: 첫 만남, line: "창을 쥐어 봐라. …발이 땅에 붙어 있구나. 좋다. 그게 너희 무기다."}
    - {situation: 호의, line: "우리는 달려서 찌른다. 너희는 서서 버틴다. 버티는 창이 더 오래 산다."}
    - {situation: 적대, line: "다리는 부러졌어도 창은 안 부러졌다."}
    - {situation: 위기, line: "창끝을 낮춰! 말은 창끝을 넘지 못한다!"}
    - {situation: 비밀 누설, line: "다리는 내가 내줬다. 초원이 하나가 되라고. 그런데 하나가 된 초원이 이제 사람을 사냥하러 간다는군."}
    - {situation: 거래, line: "약초를 가져왔나. 엘사나 오다의 약이면 좋다. 정착병이 가라앉는 동안 창 한 자락을 가르쳐 주마."}
    - {situation: 거짓말을 들었을 때, line: "…서 봐라. 거짓말하는 발은 땅에 붙어 있지 않다. 다시."}
    - {situation: 겁, line: "…기침이 멎지 않는다. 오늘은 서 있는 것도 어렵다. 부축하지 마라. 서서 버티는 게 내 일이다."}
    - {situation: 분노, line: "나를 불쌍하다고 했느냐. 불쌍한 건 다리 없이도 걸어야 하는 초원이다. 나는 아직 서 있다."}
    - {situation: 슬픔, line: "열다섯 소년이 처음 창을 쥐던 날을 기억한다. 그 아이의 손은 떨리지 않았다. 지금 손은 쇠 채찍을 쥐고 있다."}
    - {situation: 소란에 대해, line: "칸의 딸은 서서 쏘는 법을 배우려고 매주 온다. 그 아이가 서 있는 법을 알게 되면 초원에도 서 있는 사람이 생긴다."}
    - {situation: 회귀자를 의심할 때, line: "…창을 쥐는 모양이 낯익다. 가르친 적 없는 모양인데, 내 오래전 창과 같다. 누구에게 배웠나."}
    - {situation: 마음을 열었을 때, line: "내 창술을 가져가라. 달리지 않는 자의 창술이다. 인간의 발은 달리기엔 느리지만 서기에는 우리보다 낫다."}
schedule:
  아침: "창 손질 — 샘물로 창끝을 씻는다"
  낮: "말뼈 샘 곁에 서 있다 — 하르칸이 한곳에 머물면 병드는데, 그는 9년째 머문다"
  저녁: "소란의 몰래 수업"
  밤: "기침"
places: [말뼈 샘, 무거운발굽 짐 야영지, 샘가 풀밭, 창 연습 자리]
knows: [fact_hk_batar_wagon_years, fact_hk_west_wind_broken, fact_hk_dua_loss_rate, fact_hk_oktai_helps_fallen]
hides:
  - fact: fact_hk_batar_yielded_leg
    reveal_when: "신뢰 55 이상이고 정착에 대한 존중을 보인 뒤, 또는 테무르의 노예 사냥 계획 저지에 협조하겠다고 약속한 뒤"
    cover: "'결투에서 졌다. 그것이 전부'라고 말한다. 다리 이야기가 나오면 창을 쥐고 샘을 바라본다"
  - fact: fact_hk_soran_secret_lessons
    reveal_when: "신뢰 50 이상이고 소란의 이름을 존중하며 꺼낸 뒤"
    cover: "'저녁엔 샘가에 서 있을 뿐이다'라고 한다. 찾아오는 자가 있느냐고 물으면 침묵한다"
relations:
  - {to: npc_temur, type: 옛 제자, like: 10, trust: 20, visibility: 공개, memo: null, words: "내가 창을 가르친 아이. 나를 이기려고 달렸고, 나는 그에게 이기도록 다리를 내줬다. 그 선택이 옳았는지는 지금도 모르겠다"}
  - {to: npc_soran, type: 몰래 제자, like: 70, trust: 70, visibility: 비밀, memo: null, words: "칸의 딸. 서서 쏘는 법을 배우러 온다. 이 아이가 서서 버티는 날이 오면 내 다리 값이 조금 풀린다"}
  - {to: npc_dua, type: 인간 이웃, like: 50, trust: 50, visibility: 공개, memo: null, words: "짐꾼 막사의 두아. 샘가에서 마주치면 약초를 한 줌씩 두고 간다. 서로 아무것도 묻지 않아 편하다"}
  - {to: npc_oktai, type: 야영지 주인, like: 40, trust: 50, visibility: 공개, memo: 샘가에 자리를 내줌, words: "무거운발굽의 야영지 우두머리. 달리지 못하는 나를 수레에서 내려 주었다. 그의 멍에가 내 정착을 받친다"}
toward_player: "차분한 시험 — 창을 쥐는 법부터 본다. 발이 땅에 붙어 있는지, 서 있는 자세가 흔들리는지를 보고 마음을 정한다"
persuade:
  likes: ["정착(머무름)에 대한 존중(+20)", "약초(정착병 완화)", "서 있는 자세에 대한 질문", "소란을 존중하는 말"]
  hates: ["동정", "그를 불쌍하다고 부르는 것", "테무르를 칭송하거나 비난하는 것을 서두르는 말"]
roles:
  teacher: "창·장병기 최고 스승 — 창·장병기(상한 75), 학식(전술, 55). 조건: 말뼈 샘에서 30일 머물기 + 테무르의 노예 사냥 계획 저지에 협조 / 수업료: 약초(정착병 완화 — 엘사·오다의 약)"
