- year: 306
  age: 106
  event: 도르반에게서 말 열두 마리를 빌려 역참 말을 채움. 그 값을 아직 갚지 못함
- year: 311
  age: 111
  event: 검문 하사 오르벡의 위조 통행증 장사를 알아챔. 하사의 월급이 석 달 밀려 있음을 이유로 눈감음
- year: 312
  age: 112
  event: 월말 장부에 봉인 수와 밀랍 색만 적어 재상에게 올림. 기록은 이미 열두 해를 채웠다
appearance:
