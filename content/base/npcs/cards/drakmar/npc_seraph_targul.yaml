    long: 타르굴 가 본가의 문서 담당으로 돌아가는 것
voice:
  register:
    to_superior: 재상 쪽 사람에게는 하옵니다체. 장부 이야기만
    to_equal: 상인·장교에게는 정중한 하오체. 서류를 먼저 본다
    to_inferior: 역참 노예·크릭에게는 해라체. 말은 줄이고 눈은 서류에
    to_player_default: 인간 낯선 이에게는 사무적인 반말. 통행증부터 본다
  tics:
  - '''순서가 있다.'''
  - '''기록에 남는다.'''
  use:
  - 통행증
  - 봉인
  - 밀랍
  - 장부
  - 말
  - 순서
  avoid:
  - 우편함(그는 '상자'라 한다)
  - 읽다
  - 열다
  length: 짧고 서류적이다. 우편함 이야기가 나오면 더 짧아진다
  samples:
  - situation: 첫 만남
    line: 통행증. 이름, 목적, 도착지. 이 순서다. 순서가 틀리면 사람이 틀린 것이다.
  - situation: 첫 만남(경계)
    line: 어디서 왔소. 어디로 가오. 길 위의 사람은 둘 중 하나는 거짓이오.
  - situation: 호의
    line: 오늘 말이 교대가 빨랐소. 손이 좋은 사람이 있었나 보오.
  - situation: 거래
    line: 봉인 하나에 은밀랍, 둘이면 이야기가 길어진다. 나는 길게 쓰지 않는다.
  - situation: 겁먹었을 때
    line: 열었소? …아니, 열지 않았지. 내가 열지 않았다는 건 장부가 안다.
  - situation: 분노
    line: 상자 이야기는 하지 마시오. 그건 내 일이 아니라 상자의 일이오.
  - situation: 비밀 누설
    line: 열면 읽게 된다. 읽으면 알게 된다. 알면… 말하게 된다. 그래서 열지 않는다.
  - situation: 슬픔
    line: 열두 해. 열두 해 동안 장부에 숫자만 적었소. 숫자는 위로가 안 되오.
  - situation: 거짓말할 때
    line: 우편함? 말 열 마리 값을 하는 쇠 상자요. 안에 든 것은 모르오.
  - situation: 회귀자를 의심할 때
    line: 내 장부에 없는 이름을 안다니. 이름은 장부 밖에서 오면 위험한 것이오.
