- 눈 밑이 처졌다
- 모든 서류를 두 손가락으로 집는다
smell: 가죽 문서와 밀랍, 마른 말똥과 먼지 냄새
voice_sound: 낮고 건조한 목소리. 문장이 서류처럼 끝나고 질문은 항상 세 번째에 나온다
