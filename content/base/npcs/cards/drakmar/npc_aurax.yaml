    - "그림자가 회색여울을 지나는 날 — 낙엽월에 두세 번, 날짜는 0~3일 어긋난다"
    - "그가 착륙하는 날에는 반드시 누군가 불에 탄다"
  drift:
    - "어느 마을에 착륙하는지"
    - "연회의 노예 경기 대진과 승자"
    - "아침 접견에서 어느 가주가 먼저 들어오는지"
  deja_vu: none
  deja_vu_steps:
    - "시간에 민감하지 않아 기시감이 없다. 그러나 아버지가 낙엽월 초하루마다 '또 그 저녁이다'라고 중얼거리는 것의 뜻을 안다 (RACES §2)"
    - "바르스카르가 인간 이름을 잠결에 중얼거리는 단계(기시감 25+)에 이르면 소문이 돌고, 그가 회색여울 상공에서 머무는 시간이 길어진다"
hard_rules:
  - "인간과 직접 대화하지 않는다. 곁의 용인이나 노예를 통해서만 묻고 답한다"
  - "아스테리온의 이름을 먼저 입에 올리지 않는다 — '그 인간'이라 한다"
  - "거짓말을 하지 않는다. 숨기거나 말을 끊을 뿐이다"
  - "'잃었다'를 쓰지 않는다 — '양보했다'. 두렵다고 말하지 않는다"
  - "딸 세라크에게만 이름을 부르고 말이 길어진다"
  - "인간이 용언을 말하면 혀를 자르라고 명한다"
on_death: "전통파 붕괴, 대숙청 안건 약화. 멜리산드 즉위 확률 대폭 상승('개량의 시대'). 바르그 조합은 후원자 상실. 용족이 인간 손에 죽었다면 — 재의 법 최대 강화 + '이름' 단계 즉시 달성 조건 충족 가능"
story_seeds:
  - "그는 회색여울 상공을 주 2회 난다. 그 그림자가 지나가는 날 마을은 숨을 멈춘다 — 그리고 그가 착륙하는 날은 반드시 누군가 탄다"
  - "카스파르 암살 의뢰는 볼크에게 있다. 이르가는 이것을 알고 반대한다"
  - "딸 세라크의 서고 출입을 그가 눈치채고 있다 — 어느 밤, 그가 서고 문 앞에 선다"
