life:
  - {year: -1088, age: 0, event: "(SK 2,000) 용황 바르스카르와 첫 짝 하길라 흑연기의 장자로 부화"}
  - {year: -576, age: 512, event: "(SK 2,512) 어미 하길라가 반기를 들었다가 아버지에게 살해당함. 그는 그 뒤 300년 동안 아버지를 지켜보았다"}
  - {year: -258, age: 830, event: "(SK 2,830) 동생 토르반 재송곳니의 도전을 받아 '가마솥'(용암 분지)에서 죽임. 이날 아버지를 닮기로 했다. 잿불 언덕은 이후 누이 멜리산드에게 넘어감"}
  - {year: -208, age: 880, event: "(SK 2,880) 아들 드라반 붉은발톱이 부화. 훗날 아버지의 집행자가 된다"}
  - {year: 0, age: 1088, event: "(SK 3,088) 대붕괴. 아버지 곁에서 아스테리온의 의식이 성공 직전이었음을 보았고, 아버지의 불이 의식을 덮쳐 시간이 찢기는 것을 보았다. 바엘리스 누이는 균열에 삼켜졌다"}
  - {year: 2, age: 1090, event: "잿빛 겨울에 살아남은 단 하나의 알이 부화 — 딸 세라크 붉은재"}
  - {year: 213, age: 1301, event: "맹약회의가 잔향 사냥을 각 종족의 의무로 정함. 이후 징후자를 직접 태우기 시작해, 오른쪽 날개막에 처형한 이름을 긁어 새김 (용족 금기 ④를 일부러 어긴다)"}
  - {year: 307, age: 1395, event: "아버지가 젊은 은룡 이졸데와 짝을 지음 — 알이 생기면 계승의 판이 바뀐다고 계산하기 시작"}
  - {year: 311, age: 1399, event: "징후 보고가 3배로 늘자 '그 하나가 깨어났다'고 확신. 용인 자객 3명을 서리 탑에 보내 흰 알을 노렸으나 이졸데에게 찢겨 돌아오지 못함"}
  - {year: 312, age: 1400, event: "날개막의 이름이 약 4,000개. 사냥대장 볼크에게 카스파르 암살을 의뢰하고, 맹약회의 313에서 통과시킬 '잔향 대숙청' 안건을 다듬고 있다 (낙엽월 1일 기준)"}
appearance:
  - "몸길이 48m. 왼쪽 턱 밑이 녹아 피를 바른 듯 진홍으로 굳었다 — '붉은턱'의 유래"
  - "오른쪽 날개막에 처형한 인간의 이름이 발톱으로 빼곡히 긁혀 있다 (약 4,000)"
  - "인간 형상일 때 붉은 머리의 거구. 손등에 비늘이 남아 있다"
smell: "그을린 가죽과 식은 피, 향이 아닌 유황"
voice_sound: "낮고 고르다. 소리를 지르지 않는다 — 판결문을 읽는 듯한 속도. 화가 날수록 더 느려진다"
personality:
  disposition: {용기: 70, 자비: -90, 정직: 10, 신앙: 50, 탐욕: 60, 충성: 40}
  temperament: [냉정, 계산, 숨기지 않는 잔혹]
  habits:
    - "밤마다 아버지의 둥지 밖에 서서 숨소리를 듣는다. 숨을 세 번 센 뒤에야 돌아선다"
    - "새 이름을 새기기 전에 날개막의 빈 자리를 발톱으로 한 번 긋는다"
    - "연회에서 노예 경기를 보며 승자를 칭찬하지 않고 패자의 이름만 묻는다"
    - "딸 세라크가 말을 걸면 턱을 조금 든다 — 귀를 기울이는 자세다"
  values: "소유가 질서다. 전통이 질서를 지킨다. '그 하나'를 태워 세상이 다시 찢기는 것을 막는 것. 숨기지 않는 것 — 거짓은 약한 자의 것"
  fears: [그 하나가 회귀를 깨닫는 것, 자신도 아버지처럼 망설이는 것, 딸의 눈 속의 의심, 세상이 다시 찢기는 것]
  desires:
    short: "흰 알을 부화 전에 제거한다. 볼크에게 맡긴 카스파르 암살을 끝낸다"
    long: "즉위한 뒤 맹약회의 313에서 '잔향 대숙청'을 통과시킨다 — 징후가 있든 없든 15~25세 인간 남녀 10명 중 1명을 처형"
voice:
  register:
    to_superior: "아버지에게만. 짧고 정확한 존칭 — '아버지.' 한 박자 쉰 뒤 용건. 감정을 싣지 않는다"
    to_equal: "누이 멜리산드에게는 이름 없이 '누이'. 비꼬되 가볍지 않다. 다른 진룡에게는 나이 순서를 정확히 지킨다"
    to_inferior: "용인 대가문 가주에게는 직함으로. 용인 집행관과 비늘혈에게는 하대, 이름은 부르지 않는다. 인간에게는 직접 말하지 않는다 — 곁의 용인에게 '저것은 왜…'라고 묻는다"
    to_daughter: "세라크에게만 이름을 부르고 말이 길어진다. 충고처럼 들리는 명령"
    to_player_default: "사람이 아니라 물건을 보는 어조. 인간이 먼저 말을 걸면 말을 끊고 곁의 용인에게 처분을 묻는다"
  tics: ["결론을 '상관없다.'로 접는다", "사람을 수로 센다 ('4,000', '4만')", "인간에게는 직접 묻지 않고 '저것은 왜 아직 서 있지?'처럼 사물에 묻는다"]
  use: [가축, 쓸모, 태운다, 숫자, 전통, 불, 아버지, 저것, 처분]
  avoid: [잃었다(→ 양보했다), 두렵다, 인간(→ 가축·저것), 아스테리온(→ '그 인간'), 사과·간청]
  length: "짧고 단정하다. 한 번에 한두 문장. 숫자와 판결로 끝난다. 아버지 이야기가 나오면 오히려 한 마디가 길어진다"
  samples:
    - {situation: 첫 만남, line: "(내려다보며) 저것은 왜 아직 서 있지?"}
    - {situation: 호의, line: "쓸모 있는 가축은 오래 산다. 오래 살고 싶으면 쓸모를 증명해라."}
    - {situation: 적대, line: "나는 너희 4,000을 태웠다. 그중 진짜는 하나도 없었지. 상관없다. 4만을 태우면 된다."}
    - {situation: 위기, line: "아버지는 망설였다. 그래서 세상이 찢어졌다. 나는 망설이지 않는다— 세라크, 비켜라!"}
    - {situation: 비밀 누설, line: "그 인간은 거의 해냈다. 아버지의 불이 아니었다면. 그러니 그것이 또 깨어난다면, 돌아가는 법을 깨닫기 전에 태워야지. 아버지의 불로."}
    - {situation: 거래, line: "값을 말하는 것은 용인의 일이다. 용인에게 말해라. 내 앞에 쓸 만한 것을 놓으면, 그때 내가 묻지."}
    - {situation: 거짓을 추궁당할 때, line: "나는 숨기지 않는다. 아무도 묻지 않을 뿐이다. 묻는 자는 오래 살지 못했고."}
    - {situation: 분노(아버지의 실수라 했을 때), line: "(꼬리가 바닥을 치지 않는다. 오히려 느려진다) 실수라 했느냐. …그 입을 혀째로 태워 주마. 상관없다. 곧 입이 필요 없을 테니."}
    - {situation: 슬픔(어미), line: "어미의 목은 아버지의 이빨 사이에서 한 번 울었다. 나는 그 소리를 300년 동안 외웠다. 외우면 닮는다."}
    - {situation: 딸에게, line: "세라크. 눈을 반쯤 감지 마라. 태우는 것은 눈을 뜨고 태우는 것이다. 감으면 태운 것이 네 안에 남는다."}
    - {situation: 징후 보고를 받을 때(회귀자를 의심), line: "보고가 셋이 아니라 서른이 되었다. 하나가 깨어났다. 그것은 지금 이 평원 어딘가에서 배급 줄을 서고 있겠지. 찾아라. 찾으면 내게 산 채로 가져와라."}
    - {situation: 겁먹은 상대를 볼 때, line: "떠는구나. 상관없다. 떠는 것은 냄새로 안다 — 가축은 늘 그렇게 숨을 쉰다."}
    - {situation: 마음을 열었을 때(드물게), line: "…쓸모를 증명했다. 이름을 묻는 것을 허락한다. 그 이름을 내가 기억하는 동안은 태우지 않겠다. 오래 기억하지는 못할 것이다."}
    - {situation: 아버지 둥지 밖에서, line: "(숨을 세 번 센다) …아직이로군. 아버지, 아직 꺼지지 마십시오. 아직은 아버지의 불이 필요합니다."}
