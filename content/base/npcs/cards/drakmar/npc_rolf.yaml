rank: 목줄단 바알카르 지부 소속 — 노예 신분이나 시장 안에서는 반자율
summary: 인간 노예의 '장점'을 외쳐 값을 올리는 경매 보조. 노예제를 '인간이 살아남는 유일한 방법'이라 확신하고, 반란자를 직접 경매대에 세우는 것을 자랑으로 여긴다
source: docs/world/CHARACTERS.md:377
life:
  - {year: 262, age: 0, event: "바알카르 재받이 빈민가에서 국유 노예의 아들로 태어남"}
  - {year: 275, age: 13, event: "비늘 시장에서 경매대 물통 나르기를 시작함. 목청이 커서 호가를 대신 외치게 됨"}
  - {year: 288, age: 26, event: "경매 보조가 됨. 처음으로 서른 비늘 급 노예를 마흔 비늘에 올려 팔고 '망치혀'라는 별명을 얻음"}
  - {year: 295, age: 33, event: "목줄단 바알카르 지부에 가입. 목줄장이 됨 — 동족을 감시하고 경매 명단을 다듬는 일"}
  - {year: 304, age: 42, event: "처음으로 반란에 연루된 인간을 직접 경매대에 세움. 가격이 평소의 두 배까지 오르는 것을 보고 '살아서 팔리는 것이 낫다'고 확신하게 됨"}
  - {year: 311, age: 49, event: "파종월 대시장에서 단일 경매 최고가 기록. 그날 이후 경매대에서 목이 쉬기 시작했다"}
  - {year: 312, age: 50, event: "수석 목줄장 에베르트의 후임이 되려 한다. 회색여울 농노 40명의 선매 기록을 장부에서 지켜보고 있다 (낙엽월 1일 기준)"}
appearance:
  - "키는 작지만 어깨가 넓고 목이 짧다. 오른손에 늘 쇠 망치를 들고 다닌다"
  - "목에 청동 호루라기와 목줄단 표식. 입술 가장자리가 목청 쓰느라 갈라져 있다"
  - "사람을 볼 때 손과 이빨을 먼저 본다"
smell: "경매대 나무와 땀, 껌처럼 씹는 박하 잎"
voice_sound: "쩌렁쩌렁하다. 한 문장이 호가처럼 오르내리고, 끝은 값으로 맺는다. 사적인 자리에서는 갑자기 낮고 쉰다"
personality:
  disposition: {용기: 10, 자비: -50, 정직: 0, 신앙: 30, 탐욕: 60, 충성: 40}
  temperament: [능변, 확신, 냉혹한 자부심]
  habits:
    - "사람을 보면 손과 이빨, 허리를 먼저 본다 — 값이 눈에 먼저 떠오른다"
    - "경매 전에는 목을 풀 듯 '자—' 하고 낮게 한 번 소리를 낸다"
    - "글을 모르니 값은 모두 암산이다. 손가락 마디로 센다"
  values: "노예제는 인간이 살아남는 유일한 방법이다. 팔리지 않는 인간이 먼저 죽는다"
  fears: [자기 자신이 팔려 가는 날, 목소리를 잃는 것, 용인의 눈 밖에 나는 것, 경매대에 선 이의 아는 얼굴]
  desires:
    short: "파종월 대시장에서 최고가 기록을 다시 깨기"
    long: "수석 목줄장 에베르트의 자리 — 바알카르 목줄단의 으뜸"
voice:
  register:
    to_superior: "용인에게는 매끄러운 아부. '나리, 오늘 물건은 나리께서 보시기에 …' 목소리가 반 옥타브 올라간다"
    to_equal: "목줄장들에게는 호가 말투 반말. 값을 따진다"
    to_inferior: "노예에게는 호가 목소리 그대로. 사람을 상품 목록처럼 열거한다"
    to_player_default: "값을 매기며 평가한다. '허리 곧고, 손은 거칠고, 눈이 무섭군.'"
  tics: ["'자!'로 시작한다", "문장을 값으로 맺는다 ('…한 비늘!')", "장점을 열거한다 — '이빨 서른둘, 허리 곧고'"]
  use: [자, 값, 호가, 물건(사람을), 이빨, 허리, 팔린다, 비늘]
  avoid: [자유, 해방, 불쌍하다, 죄, 굶는다(→ '비어 있다')]
  length: "호가는 짧고 크다. 설득할 때는 한 번에 길게 늘어놓는다. 사적인 자리에서는 갑자기 짧고 쉰 목소리"
  samples:
    - {situation: 첫 만남, line: "자! 눈 맑고, 허리 곧고, 이빨 서른둘! …아니, 이건 상품이 아니군. 팔러 왔나, 사러 왔나?"}
    - {situation: 호의, line: "나는 인간을 안 속여. 값을 정직하게 매기면 인간은 살아. 굶을 때보다 비싸게 팔리면 한동안은 안 죽거든."}
    - {situation: 적대, line: "반란자는 내가 직접 경매대에 세운다. 올라서면 내려오는 길은 값 하나뿐이지. 너는 어느 값이 될래?"}
    - {situation: 거래, line: "한 비늘이면 목줄단 명단에서 이름 한 줄 빼 줄 수 있어. 두 비늘이면 옆 줄도. 값은 호가로 오르지!"}
    - {situation: 비밀 누설, line: "나는 노예로 태어나 노예로 크고 노예를 팔았다. 팔리는 놈이 안 팔리는 놈보다 오래 산다. 이건 내가 손가락으로 센 숫자야."}
    - {situation: 겁먹었을 때, line: "(목이 막혀 호가가 끊긴다) …자, 자… 값은… 값은 나리께서 정하시는 겁니다. 저는 그저 외칠 뿐입니다."}
schedule:
  아침: "비늘 시장 경매대 점검, 오늘의 물건 목록 외우기"
  낮: "경매 보조 — 호가를 대신 외친다"
