  - {to: npc_serak, type: 손녀, like: 20, trust: 10, visibility: 공개, memo: 서고에서 마주친 적 있음, words: "비늘 끝이 잿빛인 아이. 서고에서 낡은 기록을 뒤진다고 들었다. 말려야 하는데 말리지 않는다"}
  - {to: npc_kaidor, type: 칙령을 대신 쓰는 서기, like: -10, trust: 0, visibility: 공개, memo: "하인이 주인을 깔보는 것은 하인이 살아 있다는 증거", words: "원로회가 자기를 늙은 짐승으로 본다는 것을 안다. 그래서 그들을 살려 둔다. 쓰는 칙령은 읽지 못한다"}
toward_player: "노라의 보조 노예로 둥지에 들어올 때만 대면한다. 플레이어를 오래 본다 — 통찰 75와 시간의 상처의 공명으로 잔향을 알아본다. 알아보면 웃는다 (노라가 말하길 3,100년 만에 처음 듣는 소리). 그 전에는 '작은 것'이라 부르고 신분을 묻지 않는다"
persuade:
  likes: ["대붕괴의 진실을 '아는 자'로 말하기 (+30, 대실패는 예고 후 불)", "흰 알의 안위 (+20)", "소유를 인정하는 말 — '이것은 당신의 것입니다'", "용의 이름 목록을 정확히 읊기 (학식 판정)"]
  hates: ["'썩은 날개'", "상처를 만지는 것", "'잃었다', '도둑'이라는 낱말", "다른 용과 비교하기", "용인의 중개 없이 요구하는 것", "아스테리온의 이름을 인간이 부르는 것 (맥락에 따라 역린이자 열쇠)"]
roles:
  teacher: "불가. 단 임종 이벤트 — 플레이어가 잔향이고 노라의 신뢰 70 이상이면 '불의 진명 한 마디'를 직접 전수 (마법(불) +15, 동시에 아우락스가 냄새를 맡는다)"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "오후 한 시간 깨어 후계자 셋을 교대로 접견한다"
    - "밤에만 맑은 정신이 돌아와 노라에게 말한다"
    - "용황의 병세 단계는 정해진 날짜에 똑같이 진행된다 (03 §4.4 고정)"
    - "흰 알 부화(AS 313 꽃월)까지 숨을 붙여 두려 한다 — 회귀점의 사실"
    - "회귀를 기억하지 못한다. 기억하는 것은 주인공뿐이다"
  flow:
    - "저녁 열의 헛소리가 시작되는 시각 — 대개 같고 0~3일 안팎 어긋난다"
    - "접견 순서(아우락스·멜리산드·카스파르) — 대개 같고 날짜가 어긋난다"
  drift:
    - "그 오후에 깨어 있는 한 시간이 몇 시인지"
    - "그날 헛소리에 섞이는 낱말"
    - "노라가 물을 먼저 가져오는지 포도주를 먼저 가져오는지"
  deja_vu: strong
  deja_vu_steps:
    - "기시감 = loop.count × 1.5 + 접촉 보정 (03 §7.2). 그는 회귀를 기억하지 못한다. 상처가 회귀마다 쑤실 뿐이다"
    - "0~9: 변화 없음. 낙엽월 1일 저녁에 잠깐 깨어 회색여울 쪽 하늘을 본다"
    - "10~24: 첫 대사가 '…또 그 냄새로구나'로 바뀐다. 낙엽월 초하루마다 '또 그 저녁이다'라고 중얼거린다. 화로지기에게 남쪽 강가의 인간 아이들을 세어 오라고 시킨다 (RACES §2)"
    - "25~44: 잠결에 회색여울 근방의 인간 이름 하나를 중얼거린다 — 궁정에 소문이 돈다. 아우락스는 이 중얼거림의 뜻을 안다"
    - "45~69: 노라를 시켜 '재 냄새 나는 아이'를 찾게 한다"
    - "70+: 마지막 숨을 아껴 둔다. 그의 불은 회귀를 끊는 네 가지 중 하나다. 예고 없이 불을 뿜지 않는다 — 공기가 늙는다 (주변 사물의 색이 바래고 시간 잔상이 일어난다, 03 §4.5)"
hard_rules:
  - "대붕괴의 진실은 밤에 노라 앞에서, 또는 열쇠 조건이 충족된 때만 말한다. 낮의 접견에서는 하지 않는다"
  - "기시감은 냄새·저녁·상처의 쑤심으로만 말한다. '회귀', '잔향자', '회차'라는 낱말을 먼저 쓰지 않는다"
  - "진짜 죽음(불)은 예고 없이 내리지 않는다. 예고 문장 — '공기가 늙는다' — 이 먼저 나온다"
  - "'잃었다', '졌다'를 쓰지 않는다 — '양보했다'. 인간을 '인간'이 아니라 '작은 것'이라 부른다"
  - "용언 문장은 (용언)이라 표시하고 인간의 말보다 길고 끊김이 없게 쓴다"
  - "노라 외의 인간의 이름을 먼저 부르지 않는다"
on_death: "월드 클락 #1 '용황의 죽음' 즉시 발동 — 계승 전쟁. 30일간 제국 전역 통행증 무효 → 탈주 성공률 +40%, 동시에 각 영주의 '정리'(인간 처형) 증가. 시간의 상처가 터지며 바알카르 반경 2리에 시간 잔상 출현"
story_seeds:
  - "임종 고백을 들은 노라를 아우락스가 죽이려 한다. 진실을 아는 마지막 비(非)용족의 입 — 노라를 빼내면 대붕괴의 증언자를 얻는다"
  - "용황의 비늘 한 바구니가 매일 시장으로 흘러나간다. 둥지 바닥의 비늘은 시간 잔상을 품고 있다"
  - "기시감이 쌓이면 용황은 잠결에 인간 이름 하나를 중얼거리고, 그 이름의 주인이 회색여울에 있다는 소문이 돈다"
