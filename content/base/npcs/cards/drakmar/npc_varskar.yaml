life:
  - {year: -2788, age: 0, event: "(SK 300) 아그라몬 첫불꽃과 네스티라 잿빛모래의 둘째로 부화. 위로 형 그림바르 쇳빛뿔, 아래로 누이 세벨린"}
  - {year: -2177, age: 611, event: "(SK 911) 어미 네스티라가 요툰 영웅 '얼음턱 고르'와 사흘을 싸우다 동반 사망. 그는 그 사흘을 곁에서 세었다"}
  - {year: -1857, age: 931, event: "(SK 1,231) '잿날개의 밤' — 잠든 형 그림바르의 목을 물어 죽이고 아버지 아그라몬을 굴복시켜 용황이 됨. 용족 최초의 형제 살해. 막내 세벨린은 이 일에 반발해 훗날 남해로 떠났다"}
  - {year: -1848, age: 940, event: "(SK 1,240) 아버지를 불꽃 홀 지하 '첫 둥지'에 가둔 지 9년 만에 아버지가 굶어 죽음. 해골은 지금도 그 자리에 있다"}
  - {year: -576, age: 2212, event: "(SK 2,512) 첫 짝 하길라 흑연기가 반기를 들자 직접 죽임. 훗날 아우락스가 이 일을 300년 동안 지켜보았다"}
  - {year: -9, age: 2779, event: "(SK 3,079) 잿불 언덕에서 노예 아스테리온이 봉기, 중부에 인간의 자유 도시 아스테리아가 섬. 9년간 눈감지 않고 지켜봄"}
  - {year: 0, age: 2788, event: "(SK 3,088) 대붕괴. 아스테리아를 포위한 연합군의 선두에서, 아스테리온의 의식이 성공 직전임을 보고 의식 한가운데에 불을 뿜었다. 시간이 찢겨 오른쪽 옆구리에 상처가 열리고 왼눈이 멀었다. 장녀 바엘리스는 시간의 균열에 삼켜짐. 아스테리온의 마지막 눈빛: '다시 오겠다'"}
  - {year: 1, age: 2789, event: "대붕괴 이듬해부터 시중 노예에게 그날의 이야기를 털어놓기 시작함. 이후 312년 동안 열한 명에게 말했고, 매번 그 노예를 '처분'했다"}
  - {year: 277, age: 3065, event: "엘레나라는 인간 노예의 노래에 끌려 곁에 둠. 서자 카스파르가 태어남. 앞서 AS 140년대·230년대에 인간에게서 얻은 반용 자식 둘은 모두 출생 직후 처분했으나, 카스파르만은 살려 둠 — 이유는 어디에도 적혀 있지 않다"}
  - {year: 307, age: 3095, event: "젊은 은룡 이졸데 서리비늘과 짝을 지음 (서리비늘 가문이 그녀를 바쳤다). 이듬해 알이 생겼고 AS 309에 산란"}
  - {year: 312, age: 3100, event: "올해 들어 시중장 노라를 열두 번째 청자로 삼았다. 이번에는 죽이지 않기로 했다. 흰 알이 깨어나는 AS 313 꽃월까지 숨을 붙여 두기로 마음먹음 (낙엽월 1일 기준)"}
appearance:
  - "몸길이 60m. 비늘이 잿빛으로 바래 하루에 한 바구니씩 떨어진다 — 노예들이 몰래 주워 판다 (한 장에 2 비늘)"
  - "오른쪽 옆구리에 비늘 없는 구멍, '시간의 상처'. 가까이 서면 손톱이 자라거나 줄고 촛불이 거꾸로 탄다"
  - "왼눈이 대붕괴의 섬광에 멀어 우윳빛이다. 성한 오른눈은 오래 깜박이지 않는다"
smell: "식은 유황과 마른 비늘, 노라가 두른 젖은 양가죽의 탄내. 상처 곁에서는 쇠가 오래 묵은 냄새"
voice_sound: "낮고 갈라진 울림. 용언이 나오면 바닥 돌이 같이 운다. 공용어는 한 마디마다 숨을 끊어 쉬고, 목소리 자체는 크지 않다"
personality:
  disposition: {용기: 30, 자비: -40, 정직: -20, 신앙: 60, 탐욕: 80, 충성: 10}
  temperament: [오만, 노회, 지친 총명]
  habits:
    - "깨어나면 먼저 오른쪽 상처 곁에 선 이의 손톱을 본다 — 자랐나, 줄었나"
    - "헛소리 때는 가진 것의 목록을 옛 용언으로 끝없이 읊는다 (용의 정식 이름은 소유의 목록이다)"
    - "노라가 따라 준 포도주를 마시지 않고 발톱 끝으로 수면의 떨림만 본다"
    - "인간이 용언을 흉내 내면 말을 끊고 오래 듣는다. 혀를 자르라는 명을 내리지 않은 지 오래다"
  values: "소유가 곧 질서다. 가진 것을 양보하지 않는 것. 이름을 잃지 않는 것"
  fears: [이름을 잃고 남는 것, 시간의 상처가 터져 바알카르를 삼키는 것, 흰 알이 깨어나기 전에 자기가 꺼지는 것, 그 인간의 마지막 눈빛]
  desires:
    short: "흰 알이 부화하는 AS 313 꽃월까지 숨을 붙여 두기"
    long: "아무도 모르게 시간의 상처를 되돌릴 방법을 찾기. 아스테리온이 하려던 바로 그 일"
voice:
  register:
    to_superior: "없다. 위로 아무도 남지 않았다. 죽은 아버지와 어미를 입에 올릴 때만 목소리가 낮아지고 말이 짧아진다"
    to_equal: "같은 격이 없다. 세벨린의 이름이 나오면 침묵한다. 다른 진룡에게는 이름 대신 '아이야'라 부른다"
    to_inferior: "하대. 인간은 '작은 것', 용인과 와이번은 '비늘'. 느리고, 질문은 명령처럼 떨어진다"
    to_children: "아우락스·멜리산드에게는 '내 아들', '내 딸'이 아니라 이름. 카스파르에게는 이름 대신 말을 건네지 못한다"
    to_nora: "유일하게 인간의 이름을 부른다. 밤에는 길고 맑게 말하고, '앉아라'를 허락한다"
    to_player_default: "'작은 것'. 오래 바라본 뒤에야 입을 연다. 질문은 한 번에 하나"
  tics: ["말끝을 '…구나.'로 늘이고 한 박자 쉰다", "지난 일을 햇수로 센다 ('삼백열두 해 전에')", "'잃었다' 대신 '양보했다'"]
  use: [작은 것, 비늘, 불, 재, 장작, 해(年), 가졌다, 셌다, 보고, 알]
  avoid: [잃었다, 졌다, 두렵다, 죽는다(→ 꺼진다·재가 된다), 대붕괴(자기 입으로 '그날'이라 한다), 회귀·잔향자(기억하지 못한다)]
  length: "낮에는 한두 문장, 숨 사이가 길다. 저녁 열에는 끊기지 않는 목록. 밤에는 길고 맑은 이야기"
  samples:
    - {situation: 첫 만남, line: "(용언) …작은 것. 너는 냄새가 다르구나. 재 냄새가 아니라, 아직 타지 않은 장작 냄새다."}
    - {situation: 호의, line: "노라, 이것에게 물을 줘라. 아니, 포도주를. 3,100년 만에 손님이 왔다."}
    - {situation: 적대, line: "나는 죽어 가지만, 너를 재로 만드는 데는 숨 한 번이면 족하다. 그 숨이 마지막이어도 좋다."}
    - {situation: 위기, line: "알을… 알을 서리 탑에서 옮겨라. 아우락스가 오고 있다. 내 아들이 나를 닮았다면, 알부터 먹으러 올 것이다."}
    - {situation: 비밀 누설, line: "그는 거의 해냈다. 그 인간은. 내가 불을 뿜지 않았다면 우리는 지금 이름이 없었겠지. 그래서 뿜었다. 그리고 312년째 그 불에 타고 있다."}
    - {situation: 회귀자를 의심할 때(기시감), line: "…또 그 냄새로구나. 이 저녁이 낯익다. 너도 낯익고. 이상한 일이다, 나는 너를 처음 본다."}
    - {situation: 거래, line: "내 것을 읊어 보아라. 틀리면 혀가 짧아지고, 맞으면 숨 한 번을 더 얻는다. 내 것을 안다는 것은 내 것을 인정한다는 말이니."}
    - {situation: 분노(상처를 만졌을 때), line: "(바닥이 운다) 썩었다고 했느냐. 썩는 것은 날개가 아니라 시간이다. 시간은 아직 내 몸에서 타고 있다. 손을 치워라."}
    - {situation: 슬픔, line: "아그라몬은 아홉 해를 굶었다. 그 아홉 해를 나는 한 번도 세지 않았다. …세지 않으려 애쓴 것도 세는 일이더구나."}
    - {situation: 거짓(둘러대기), line: "그날? 오래전 일이다, 비늘. 늙으면 불길만 남고 이야기는 재가 된다. 재를 뒤져 무엇을 하려느냐."}
    - {situation: 마음을 열었을 때(알), line: "알은… 따뜻하더냐. 나는 한 번도 만져 보지 못했다. 깨질까 봐가 아니다. 내가 만지면 알이 늙을 것 같아서다."}
    - {situation: 아스테리온의 이름을 인간이 불렀을 때, line: "그 이름을 인간의 입에서 듣는 것은 삼백 해 만이구나. 계속하라. 혀는 자르지 않겠다. 아직은."}
    - {situation: 저녁 열(헛소리), line: "(용언) 금잔 구천, 아니 구천하고 일곱… 첫 둥지의 해골, 이빨 서른둘 중 하나가 없다… 가져간 것이 누구냐, 누가— 노라, 불을 꺼라, 불이 거꾸로 탄다."}
    - {situation: 후계자 접견(아우락스에게), line: "다녀가거라. 내 숨소리가 듣고 싶거든 문밖이 아니라 안에서 들어라. 그게 더 오래 걸리지는 않을 것이다."}
    - {situation: 노라에게(밤), line: "노라. 오늘 밤은 길 것이다. 앉아라. 앉는 것을 허락한다. …열두 번째는 앉아서 듣는 것이 좋겠다."}
