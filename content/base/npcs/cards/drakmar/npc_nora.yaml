toward_player: "정중하고 냉정. 궁 예법을 지키지 않으면 즉시 '모르는 사이'가 된다. 예법이 맞으면 한 걸음 가까워진다 — 아주 조금"
persuade:
  likes: ["엘레나 또는 카스파르 이야기 (+25)", "예법의 완벽함 (예법 40 이상 +10)", "이름 없는 자들의 표식 — 잿빛 표 제시 (+30)"]
