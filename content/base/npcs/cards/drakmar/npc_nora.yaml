  companion: "조건부 — 임종 이후 궁 탈출에 성공하면 1회 동행 후 루멘 또는 모르바로 은거. 충성 아크: 0 냉정 → 40 엘레나 이야기 → 70 용황의 고백 전문을 들려줌 (대붕괴 진실 지식 획득)"
  romance: null
