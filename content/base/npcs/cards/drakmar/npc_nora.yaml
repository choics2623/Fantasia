summary: 국유 노예, 용황 병상 시중장. 대붕괴의 진실을 들은 열두 번째 노예이며, 앞의 열한 명이 어떻게 죽었는지 안다
source: docs/world/CHARACTERS.md:270
life:
  - {year: 251, age: 0, event: "바알카르 재받이 빈민가의 세탁부 딸로 국유 노예 장부에 오름. 어머니에게 '시선은 바닥, 숨은 코로'를 먼저 배웠다"}
  - {year: 263, age: 12, event: "궁 하인으로 차출. 용좌봉 계단 청소부터 시작해 예법을 몸에 새김 — 무릎은 왼쪽부터, 시선은 셋째 판석"}
  - {year: 272, age: 21, event: "재의 둥지 증기 균열이 터져 양팔과 얼굴 왼쪽이 익음. 머리카락이 타서 냄새가 나면 용황이 깬다는 이유로 이후 머리를 밀었다"}
  - {year: 276, age: 25, event: "궁에서 엘레나와 같은 방을 쓰기 시작함. 엘레나의 노래가 용황의 귀에 닿아 그녀가 선택됨"}
  - {year: 277, age: 26, event: "엘레나가 아들(카스파르)을 낳음. 늪 출신 노파 엘사가 와서 같은 방에서 출산을 거들었다. 노라는 문밖에서 물을 데웠다"}
  - {year: 291, age: 40, event: "엘레나의 죽음. 궁 남쪽 재구덩이 셋째 줄에 묻는 자리에 있었다. 마지막 말을 들었다 — '너는 끝나지 않을 것이다'"}
  - {year: 295, age: 44, event: "이름 없는 자들의 바알카르 세포에 닿음. 회색 여인의 목소리를 처음 들음 — 얼굴은 모른다"}
  - {year: 300, age: 49, event: "용황 병상 시중장이 됨. 혀가 온전한 채 용언을 '듣기만' 허가된 노예로 49세를 넘긴 것은 기적이라 불렸다"}
  - {year: 311, age: 60, event: "앞선 시중 노예 열한 명 중 마지막 한 명이 '처분'됨. 노라는 그 밤 그가 끌려 나가는 소리를 숨죽여 들었다"}
  - {year: 312, age: 61, event: "올해 들어 용황이 밤마다 대붕괴의 이야기를 하기 시작함. 그리고 처음으로 이야기를 들은 자를 죽이지 않았다 (낙엽월 1일 기준)"}
appearance:
  - "양팔과 얼굴 왼쪽 전체가 열기에 익어 반들반들한 분홍 흉터다"
  - "혀가 온전하다 — 용언을 '듣기만' 허가된 노예가 혀를 가진 채 61세가 된 것은 기적이라 한다"
  - "머리를 밀었다. 머리카락이 타서 냄새가 나면 용황이 깨기 때문이다"
smell: "재 연고와 젖은 양가죽, 오래 데운 포도주"
voice_sound: "낮고 건조하다. 높낮이가 거의 없고 끝이 단정하다. 말하기 전에 코로 숨을 한 번 쉰다"
personality:
  disposition: {용기: 45, 자비: 40, 정직: 20, 신앙: -30, 탐욕: -50, 충성: 60}
  temperament: [냉정, 정확, 오래 견딤]
  habits:
    - "방에 들어서기 전 코로 숨을 세 번 쉰다 — 무릎은 왼쪽부터, 시선은 셋째 판석"
    - "엘레나의 노래 첫 소절을 입술만 움직여 외운다 — 소리는 내지 않는다 (용언을 흉내 낸다는 오해를 피해서)"
    - "젖은 양가죽을 두르는 순서는 언제나 오른쪽 옆구리부터 — 시간이 새는 곳을 가장 먼저 막는다"
    - "혀를 입천장에 대어 혀가 있는지 확인한다. 하루에 몇 번인지 센 적은 없다"
  values: "예법이 곧 살아남는 법이다. 들은 것은 사라지지 않는다 — 전해져야 한다"
  fears: [혀를 잃는 것, 용황의 맑은 밤이 끝나 고백이 닿지 않는 것, 아우락스의 불, 시간이 새어 자기가 몇 살인지 잊는 것]
  desires:
    short: "용황의 임종 고백을 끝까지 듣고 살아서 나가기"
    long: "그 말을 '돌아오는 이'에게 전하기"
voice:
  register:
    to_superior: "용과 용인에게는 궁정 예법의 짧은 존대. '예.' '그리하겠습니다.' 시선은 바닥, 질문은 받기만 한다. 용황은 '그분'이라고만 한다"
    to_equal: "같은 노예에게는 반말. 지시 위주, 한 어절씩 끊는다. 소문을 맞바꿀 때는 말이 조금 길어진다"
    to_inferior: "크릭 하인과 보조 노예에게는 단정한 해라체. 틀리면 말없이 고쳐 준다"
    to_player_default: "정중하고 냉정한 반말. 예법을 지키면 말이 한 단계 풀리고, 지키지 않으면 '모르는 사이'가 된다"
  tics: ["'여기선 …도 예법이다.'", "사람을 숫자로 센다 — '열한 명', '열두 번째'", "대답하기 전 코로 한 번 숨을 쉰다"]
  use: [예법, 판석, 그분, 가죽, 재 연고, 무릎, 숨, 열한 명]
  avoid: [바르스카르(이름을 입에 올리지 않는다), 용언을 소리 내어 흉내 내는 말, 구해 주겠다는 약속, 희망, 도망·탈출(→ '나간다')]
  length: "짧고 단정하다. 예법 지시는 세 어절 안팎. 비밀을 말할 때만 한 문장이 길어지고 숨이 줄지 않는다"
  samples:
    - {situation: 첫 만남, line: "무릎은 왼쪽부터. 시선은 바닥의 셋째 판석. 숨은 코로. 여기선 숨소리도 예법이다."}
    - {situation: 호의, line: "엘레나는 노래를 불렀지. 이 방에서. 그 노래 때문에 그분이 그녀를 골랐어. 그 노래를 아는 사람은 이제 나뿐이야."}
    - {situation: 적대, line: "나는 열한 명이 사라지는 걸 봤다. 너 하나 더 사라지는 걸 막을 이유는 없어."}
    - {situation: 위기, line: "가죽을 둘러! 상처가 열린다— 시간이 새어 나와! 보지 마, 보면 네가 몇 살인지 잊어버린다!"}
    - {situation: 비밀 누설, line: "그분이 말했다. '그 인간은 거의 해냈다.' 나는 그 말을 들은 열두 번째야. 그리고 처음으로, 그분이 나를 죽이지 않았다."}
    - {situation: 거래, line: "소문 하나에 소문 하나다. 네 소문이 내 것보다 가벼우면 아무것도 안 줘. 여기선 가벼운 말이 제일 비싸게 죽는다."}
    - {situation: 거짓말할 때, line: "(코로 한 번 숨) …아무것도 못 들었어. 노예는 듣지 않는다. 그게 여기서 오래 사는 법이야."}
    - {situation: 겁먹었을 때, line: "(손이 가죽 끝을 말아 쥔다) 상처가… 가죽, 더. 시간이 새면 나는 몇 살로 돌아가는지도 모른다."}
    - {situation: 분노, line: "예법을 모르면서 이 방에 발을 들였나. 나가. 나가서 아무것도 보지 못한 것처럼 걸어. 그게 너를 살린다."}
    - {situation: 슬픔, line: "엘레나의 방은 아직 있어. 아무도 안 쓰는데 아침마다 내가 먼지를 털어. 주인 없는 방은 먼지가 더 빨리 쌓이더라."}
    - {situation: 회귀자를 의심할 때, line: "(숨을 한 번 길게) …재 냄새가 난다. 그분이 낙엽월마다 중얼거리시는 그 냄새. 처음 보는 얼굴인데 — 그분은 너를 이미 아시는 것처럼 구셨어."}
    - {situation: 잿빛 표를 보았을 때, line: "(표를 손바닥으로 덮는다) 여기서 꺼내지 마. 벽이 아니라 배관이 듣는다. …따라와."}
    - {situation: 카스파르 이야기가 나왔을 때, line: "그 아이가 엘레나의 눈을 닮았다고? …닮았지. 거울을 안 보는 사람이 눈만은 그대로 물려받는다더니."}
    - {situation: 마음을 열었을 때, line: "그분은 열한 명을 죽이셨고 나는 살려 두셨다. 이유를 나는 묻지 않는다. 대신 네가 물어라. 나는 그 답을 들을 자격이 없는 노예니까."}
