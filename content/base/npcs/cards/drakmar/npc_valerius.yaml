    - {situation: 적대, line: "내 저택에서 사라진 것은 숫자 하나가 아니라 체면이다. 숫자는 되찾을 것이고, 체면은 값을 받겠다."}
    - {situation: 비밀 누설(세탁장), line: "세탁장에 '빌려온' 여자가 하나 있다. 왼손에 화상이 있고. 남편이 아직 산다고 들었다. …그것이 값이 되는 이야기냐?"}
    - {situation: 거짓말할 때, line: "세탁장의 인원은 정확히 열둘이다. 정확히. (장부를 닫는다)"}
    - {situation: 겁먹었을 때, line: "(손이 소매 속으로 들어간다) …장부를 가져와라. 아니, 불은 켜지 마라. 아우락스 각하의 사자가 아니라면 열지 마라."}
