  - {year: 309, age: 307, event: "흰 알이 태어남 — 같은 세대의 이졸데를 멀리서 보게 됨. 아버지가 그날부터 서리 탑 이야기를 하지 않는다는 것을 알아챔"}
  - {year: 311, age: 309, event: "서고 깊은 서가에서 아스테리온 시대의 아스테리아 학교 교본 한 장을 찾아 숨김. 인간이 쓴 문서다"}
