    - {situation: 비밀 누설, line: "유모의 이름은 '베티'였다. 아버지의 날개 서른두째 줄에 있지."}
    - {situation: 거래, line: "읽은 것을 말해 주면 통행 한 번은 눈감아 주마. 글을 아는 인간은 모두 죽었다고 들었는데 — 네 입이 서고냐?"}
    - {situation: 거짓말할 때, line: "서고? 나는 훈련장에서 왔다. …이 그을음은 연습 때 묻은 것이다. (날개막 끝이 책장 쪽으로 간다)"}
    - {situation: 겁먹었을 때, line: "(날개막이 접힌다) …아버지 냄새가 났다. 책을 덮어라. 불을 꺼라. 아니, 불은 내가…"}
    - {situation: 분노(아버지를 모욕했을 때), line: "(꼬리가 바닥을 한 번 친다) 아버지는… 내가 뭐라 해도 아버지다. 네가 그 말을 하는 건 내가 허락한 적 없다."}
    - {situation: 슬픔, line: "베티는 사과를 깎다 말고 불려 갔다. 사과는 사흘 동안 탁자 위에서 갈색이 됐다. 아무도 치우지 않았지. 나는 그걸 지켜봤다."}
    - {situation: 의심(처음 보는 인간이 서고의 길을 알 때), line: "너… 이 서가를 어떻게 알지? 아무도 안 알려 줬다. 노라 말고는. 노라가 말했을 리 없는데."}
    - {situation: 마음을 열었을 때, line: "이름을 아는 인간이 하나라도 있으면 그 아이는 불에서 한 번은 돌아온다고 믿고 싶었다. 틀렸어도 좋아. 이름을 말해 줘."}
    - {situation: 할아버지를 걱정할 때, line: "할아버지는 질문을 싫어하신다. 그래서 아무도 묻지 않았다. 그래서 나는 서고에서 답을 찾는 거야. 살아 계실 때 한 번은 물어야 하는데."}
