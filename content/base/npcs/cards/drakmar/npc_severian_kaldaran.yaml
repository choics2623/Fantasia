appearance:
  - "키가 크고 마른 몸. 관자놀이에서 목덜미까지 진홍 비늘이 한 줄로 이어져 있다 — 순혈의 표지, 여든여섯 장"
  - "목에 가는 금사슬, 끝에 열쇠 하나. 옷 안에 넣지 않고 늘 보이게 건다"
  - "손등에 비늘 서약의 흉터가 열한 줄 — 용황 즉위 때가 아니라 매 백 년 서약을 갱신할 때마다 그었다"
smell: "밀랍과 마른 잉크, 병상에서 묻어 온 재 연고 냄새"
voice_sound: "낮고 고르다. 문장 끝을 한 박자 낮추는 궁정 어법의 본보기. 화가 나면 오히려 더 느려진다"
