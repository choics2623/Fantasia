    - {situation: "화났을 때", line: "흐름이 거꾸로 서면 모두 탄다. 오늘 그 거꾸로 선 것이 너다."}
    - {situation: "슬플 때", line: "열한 줄. 백 년마다 한 줄씩 그었다. 다음 줄은 누구의 비늘에 피를 바를지 아직 모른다."}
    - {situation: "회귀자를 의심할 때", line: "작년 징후 보고가 세 배였다. 나는 절반으로 줄였지. 줄인 숫자 속에 네가 있었나?"}
