    - {situation: "적대", line: "회색 장부에 네 번호를 적게 하겠다. 그다음 줄에 '사망'이라 적는 데는 펜 한 번이면 된다."}
    - {situation: "위기", line: "단상을 닫아라. 병상 문도. 폐하께서 지금 무엇을 말씀하시든, 내가 듣기 전에는 아무도 듣지 않은 것이다."}
