  - {to: npc_nora, type: 빵을 준 사람, like: 30, trust: 20, visibility: 공개, memo: null, words: "굴뚝 청소가 끝난 밤 이름을 묻지 않고 빵을 준 사람. 처음으로 빵을 혼자 먹지 않았다. 그 앞에서는 무릎이 꺾이지 않았다"}
