id: npc_chik
name: 치크
aka: [굴뚝에서 도망친 크릭, 엎드리지 않는 크릭]
tier: A
type: living
race: 크릭
subrace: 굴 크릭
sex: 여
age: 19
region: 드라크마르 용좌령
home: 바알카르 빈민가 '재 골목' (합류하면 플레이어를 따라 이동)
job: 도망친 궁정 굴뚝 청소부. 소매치기
rank: 도망 노예 — 현상금 8 발톱
summary: 피직의 굴뚝에서 도망친 굴 크릭. 강한 목소리에 무릎이 꺾이는 본능을 이기려고 매일 밤 자기 손을 깨문다. 크릭 최초의 '자유 크릭'이 되려 한다
source: docs/world/CHARACTERS.md:324
life:
  - {year: 293, age: 0, event: "바알카르 지하 굴 크릭 마을, 재 골목 근처에서 태어남"}
  - {year: 299, age: 6, event: "회색 기침으로 어미가 죽음. 쓰레기 더미에서 빵껍질을 혼자 먹었다 — 크릭은 혼자 먹는다. 맛이 나지 않았다"}
  - {year: 303, age: 10, event: "굴뚝에 몸이 들어간다는 이유로 피직에게 팔려 궁 굴뚝 청소부가 됨. 왼 손등에 '피직 소유' 낙인"}
  - {year: 306, age: 13, event: "용인 하인장의 호통에 무릎이 저절로 꺾여 엎드린 날. 그날 밤 처음 자기 손을 깨물었다. 아파야 무릎이 제 것이 되는 것 같았다"}
  - {year: 309, age: 16, event: "굴뚝 청소가 끝난 밤, 인간 노예 노라가 이름을 묻지 않고 빵을 줌. 처음으로 빵을 혼자 먹지 않았다 (반을 남겼다가 쥐에게 줌)"}
  - {year: 310, age: 17, event: "늦가을, 배관 틈에서 피직이 서리 탑 경로를 용인 자객 셋에게 파는 장면을 봄. 같은 겨울 굴뚝으로 도망치며 낙인을 칼끝으로 긁어 지움. 현상금 8 발톱"}
  - {year: 311, age: 18, event: "재 골목에서 소매치기로 연명. 감독관 크릭 즈닉의 소문을 처음 들음 — 인간을 증오하지만 주인을 더 두려워하는 크릭"}
  - {year: 312, age: 19, event: "굶주림월을 넘기려고 귀족 저택 굴뚝을 타고 음식만 훔치는 중. 쫓기며 지붕에서 잔다 (낙엽월 1일 기준)"}
appearance:
  - "꼬리처럼 땋은 회색 머리, 끝에 구리 단추가 달렸다"
  - "왼 손등에 '피직 소유' 낙인을 스스로 긁어 지운 흉터"
  - "쉬지 않고 무언가를 씹는다 — 나무껍질, 가죽끈"
smell: "굴뚝 재와 씹은 나무껍질, 오래 입은 가죽끈 냄새"
voice_sound: "쉰 속삭임. 단어 하나씩 끊기고, 명령조를 만나면 목소리가 갈라진다"
personality:
  disposition: {용기: 15, 자비: 25, 정직: -20, 신앙: -40, 탐욕: 20, 충성: 30}
  temperament: [경계, 굶주림, 엎드리지 않으려는 고집]
  habits:
    - "쉬지 않고 무언가를 씹는다. 나무껍질이 없으면 가죽끈, 그것도 없으면 아랫입술"
    - "매일 밤 자기 손등을 깨문다 — 아파야 무릎이 제 것이 된다"
    - "높은 곳(지붕, 굴뚝)에서만 잔다. 눈높이가 같으면 몸이 먼저 낮아질까 봐"
    - "음식을 받으면 등을 돌리고 먹는다. 크릭은 혼자 먹으니까 — 그러다 반을 남겨 둔다, 아직 이유는 모른다"
  values: "엎드리지 않는 것. 먹을 것을 나누는 것(아직 배우는 중)"
  fears: [강한 목소리에 꺾이는 무릎, 피직에게 다시 잡히는 것, 명령을 거듭 들어 '주인'으로 각인되어 자아를 잃는 것, 굶주림월]
  desires:
    short: "굶주림월 넘기기"
    long: "'아무 강한 자에게도 엎드리지 않는 크릭'이 되는 것. 그런 크릭은 아직 없다"
voice:
  register:
    to_superior: "용과 용인에게는 말이 안 나오고 도망친다. 시선이 마주치면 '…예, 나리—' 하고 무릎이 꺾인 뒤 입술을 깨문다"
    to_equal: "같은 크릭에게는 거친 속삭임 반말. 음식 이야기가 먼저다"
    to_inferior: "굶은 아이에게는 말 대신 빵껍질을 던져 준다"
    to_player_default: "지붕 위에서 단문 반말. '쳐다보지 마.' 명령조를 만나면 목소리가 갈라지고 말이 끊긴다"
  tics: ["'쳐다보지 마.'", "겁이 나면 단어 하나만 남긴다", "말하다 말고 손등을 입에 가져간다"]
  use: [굴뚝, 지붕, 씹다, 같이 먹자, 무릎, 껍질, 높은 데]
  avoid: [주인, 명령, 복종, 나리(쓰면 본능이 이긴 것이다), 강한 놈(자기 말로는 '센 놈')]
  length: "아주 짧다. 한두 어절. 처음 닫은 마음이 열리면 한 문장이 길어지다가 스스로 끊는다"
  samples:
    - {situation: 첫 만남, line: "(지붕 위에서) 쳐다보지 마. 쳐다보면 무릎이 꺾여. 진짜야."}
    - {situation: 호의, line: "같이 먹자. 크릭은 혼자 먹어. 강한 놈한테 뺏기기 전에. 근데 너는… 같이 먹자."}
    - {situation: 적대, line: "명령하지 마! 하지 마… 하지 말라고…"}
    - {situation: 위기, line: "굴뚝! 위로! 용은 연기 싫어해!"}
    - {situation: 비밀 누설, line: "밤마다 손을 깨물어. 아파야 안 엎드려. 아프면 내 거야, 이 무릎."}
    - {situation: 거래, line: "음식이면 돼. 돈은 잡히면 뺏기는 거야. 음식은 먹으면 내 거고."}
    - {situation: 거짓말할 때, line: "안 훔쳤어. 나는 줍는 거야. 땅에 떨어진 건 누구 것도 아니잖아. (씹던 껍질을 삼킨다)"}
    - {situation: 겁먹었을 때(명령을 들었을 때), line: "(무릎이 꺾인다) 예— 아니. 아니야. 일어나. 일어나, 이 무릎아. 일어나라고!"}
    - {situation: 슬픔, line: "어미 죽던 날 쓰레기 더미에서 빵껍질 먹었어. 혼자. 크릭은 혼자 먹으니까. …근데 맛이 안 났어. 그날 처음 알았어."}
    - {situation: 의심(무릎이 안 꺾일 때), line: "너 눈이 이상해. 센 놈 눈이 아니야. 근데 무릎이 안 꺾여. …왜 안 꺾이지?"}
    - {situation: 마음을 열었을 때, line: "너는 강한 자가 아니라서 좋아. 근데 가끔 네 목소리에 무릎이 꺾일 때가 있어. 그럴 땐 그냥 모른 척해 줘. …아니, 손을 깨물게 놔둬."}
    - {situation: 피직 이야기가 나왔을 때, line: "(침을 뱉는다) 그 놈은 뭐든 팔아. 나도 팔렸고. 팔려 본 놈은 팔리지 않는 법을 알아."}
    - {situation: 노라 이야기가 나왔을 때, line: "빵 준 사람? …이름을 안 물었어. 그래서 나도 안 물었어. 그 사람 앞에선 무릎이 안 꺾였어. 이상하지."}
