  - {to: npc_sigmund, type: 정보 교환, like: 5, trust: 20, visibility: 비밀, memo: null, words: "길에서 정보를 바꾸는 사람. 값을 매기지 않아 마음이 놓인다"}
  - {to: npc_aurax, type: 아버지의 후원자, like: -30, trust: -20, visibility: 공개, memo: 카스파르 암살 의뢰의 주인, words: "아버지에게 일을 맡기는 큰 그림자. 냄새가 불에 탄 가죽 같다. 가까이 가면 꼬리가 말린다"}
