id: npc_irga
name: 이르가 붉은귀
aka: [붉은귀, 자비로운 사냥꾼, 가죽 포승의 이르가]
tier: A
type: living
race: 수인족
subrace: 바르그(늑대)
sex: 여
age: 34
region: 드라크마르 용좌령
home: 노예사냥 조합 본부 '송곳니 회관' (회색여울·서리 길 순회)
job: 노예사냥 조합 부조합장. 사냥개 무리(바르그 6명) 지휘
rank: 노예사냥 조합 부조합장 — 조합장 볼크의 딸
summary: 볼크의 딸이자 조합 부조합장. 은 사슬 대신 가죽 포승을 쓰고, 잡은 탈주자에게 물과 빵을 준다. 목에 걸린 나무 피리는 처음 잡은 소녀의 것이다
source: docs/world/CHARACTERS.md:340
life:
  - {year: 278, age: 0, event: "바르그 노예사냥 조합장 볼크 회색송곳니의 딸로 태어남. 오른쪽 귀의 털이 태어날 때부터 붉게 물들어 있었다"}
  - {year: 286, age: 8, event: "처음 아버지의 사냥개 무리를 따라 걸음. 아버지가 '냄새는 거짓말하지 않는다'고 가르침 — 이 말은 지금도 그녀의 첫 규칙"}
  - {year: 296, age: 18, event: "조합 입회. 추적·사냥에서 또래를 앞섰다. 처음 은 사슬을 쥔 날 손바닥에 남은 화상 자국을 오래 들여다봤다"}
  - {year: 300, age: 22, event: "처음 잡은 탈주자가 열한 살 소녀였다. 아버지가 '규칙'이라며 볼크 앞에서 처형. 소녀의 나무 피리를 주워 목에 걸었다. 그날부터 은 사슬 대신 가죽 포승을 쓴다 — '은은 상처를 남긴다'"}
  - {year: 303, age: 25, event: "잡은 탈주자에게 물과 빵을 주기 시작함. 조합원들의 조롱을 들었으나 그만두지 않았다"}
  - {year: 308, age: 30, event: "조합 부조합장으로 승진. 할당량을 채우려 하겐의 정보를 쓰기 시작함 — 경멸하면서"}
  - {year: 311, age: 33, event: "북방 대탈주에서 시그리드 무리를 추적하기 시작. 송곳니 회관 냄새 단지에 무리의 옷 조각 셋이 놓였다"}
  - {year: 312, age: 34, event: "아버지가 카스파르 암살을 고민한다는 것을 알게 됨 — 아우락스의 의뢰다. 반대하는 말을 아직 입 밖에 내지 못했다 (낙엽월 1일 기준)"}
appearance:
  - "오른쪽 귀의 털이 태어날 때부터 붉게 물들어 있다"
  - "은 사슬 대신 가죽 포승을 쓴다 — '은은 상처를 남긴다'"
  - "인간 아이 손가락 크기의 나무 피리를 목에 걸었다 (누구 것인지 말하지 않는다)"
smell: "젖은 개털과 가죽 기름, 풀밭에 눕힌 몸에서 나는 마른 풀 냄새"
voice_sound: "낮고 쉬었다. 말 앞에 킁 하고 코로 숨을 들이쉰다. 화가 나면 목소리가 낮아지다가 으르렁이 섞인다"
personality:
  disposition: {용기: 50, 자비: 25, 정직: 45, 신앙: 50, 탐욕: 0, 충성: 60}
  temperament: [정직, 끈질김, 숨긴 자비]
  habits:
    - "사람을 만나면 먼저 코로 숨을 들이쉬어 냄새로 판단한다 — 겁, 거짓, 굶주림"
    - "잡은 탈주자의 손목을 묶기 전에 먼저 물그릇을 내민다. 포승은 두 번 확인하고 한 번 느슨하게 푼다"
    - "밤마다 달을 향해 짧은 기도를 한다. 소리는 내지 않고 목만 길게 늘인다"
  values: "사냥하되 죽이지 않는다. 정직한 냄새는 믿을 수 있다. 무리를 버리지 않는다"
  fears: [아버지의 '규칙'이 자기 손에서 되풀이되는 것, 피리 주인의 얼굴이 흐려지는 것, 볼크가 시그리드를 먼저 찾는 것, 조합에서 약하다고 쫓겨나는 것]
  desires:
    short: "시그리드 무리를 '산 채로' 잡기 (아버지는 시체도 받는다)"
    long: "조합을 물려받아 '사냥하되 죽이지 않는' 규칙을 세우기"
voice:
  register:
    to_superior: "아버지 볼크에게는 짧은 존대. '아버지, 먼저 들으세요.' 눈을 마주치지 못하고 코끝만 본다"
    to_equal: "조합원에게는 거친 반말과 킁 소리. 하겐에게는 반말에 가시가 있다"
    to_inferior: "사냥개 무리에게는 이름 대신 냄새 별명으로 부르는 짧은 명령. 잡은 탈주자에게는 낮고 천천히, 반말이지만 부드럽다"
    to_player_default: "냄새를 맡고 판단. '킁.' 뒤에 반말. 겁먹은 상대에게는 '괜찮아.'를 먼저 말한다"
  tics: ["말 앞에 '킁.'", "상대가 떨면 '괜찮아.'를 먼저 말한다", "문장 끝을 끌지 않고 낮춰 끊는다"]
  use: [냄새, 무리, 달, 물, 정직하다, 규칙, 산 채로]
  avoid: [시체(→ '식은 것'), 짐승(탈주자에게), 현상금(→ '값'), 아버지를 욕하는 말]
  length: "짧고 낮다. 냄새로 판단한 것만 말한다. 피리·아버지 이야기가 나오면 갑자기 길어졌다 끊긴다"
  samples:
    - {situation: 첫 만남, line: "킁. 겁먹었구나. 괜찮아. 겁먹은 냄새는 정직하거든."}
    - {situation: 호의, line: "물 마셔. 잡힌 게 죄는 아니야."}
    - {situation: 적대, line: "나는 아버지만큼 빠르진 않아. 대신 포기를 안 하지."}
    - {situation: 위기, line: "무리 뒤로! 이건 우리 사냥이 아니야!"}
    - {situation: 비밀 누설, line: "이 피리 주인은 열한 살이었어. 아버지는 '규칙'이라고 했지. 나는 그날부터 규칙을 바꾸기로 했어."}
    - {situation: 거래, line: "산 채로 넘기면 값이 반이야. 그래도 반이면 족해. 대신 하나 — 그 사람 이름을 내가 물으면 말해 줘."}
    - {situation: 거짓말할 때, line: "나는 쫓는 사람이 없어. (귀가 한 번 뒤로 젖혀진다) …킁. 거짓말이 서툴러서 귀가 먼저 나가."}
    - {situation: 겁먹었을 때, line: "(꼬리가 다리 사이로 말린다) …아버지가 오고 있어. 냄새가 달라졌어. 지금은 말을 아끼자."}
    - {situation: 분노(피리를 건드렸을 때), line: "(이가 보인다) 손 치워. 한 번만 더 대면 나는 사냥꾼이 아니라 그냥 짐승이 돼."}
    - {situation: 슬픔, line: "빨랐어, 그 애는. 한 번 놓칠 뻔했지. …놓칠걸. 이름도 묻지 않았어. 규칙이 그렇다고 했거든."}
    - {situation: 회귀자를 의심할 때(젖은 재 냄새), line: "킁. …재 냄새. 불이 꺼진 뒤에 한 번 더 젖은 냄새야. 너 어디서 온 거야? 아니, 어디서 '돌아온' 거야?"}
    - {situation: 마음을 열었을 때, line: "조합을 물려받으면 첫 규칙이 있어. '산 채로만.' 죽은 값을 안 치르면 사냥꾼들도 죽이지 않을 거야. …도와줘."}
    - {situation: 아버지 이야기, line: "아버지는 빨라. 나는 아버지를 이길 수 없어. 그래서 아버지가 달리기 전에 길을 바꿔야 해."}
    - {situation: 하겐 이야기, line: "하겐 냄새는 썩은 사과에 꿀 바른 것 같아. 근데 그 코에 걸리는 길은 정확해. 그래서 더 싫어."}
