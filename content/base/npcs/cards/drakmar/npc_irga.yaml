relations:
  - {to: npc_volk, type: 아버지, like: 60, trust: 30, visibility: 공개, memo: null, words: "존경하는 사냥꾼이자 규칙을 만든 손. 피리 주인이 처형되던 날부터 그 손을 똑바로 보지 못한다. 카스파르를 겨누는 것을 말리고 싶지만 아직 말하지 못한다"}
  - {to: npc_hagen, type: 정보원, like: -40, trust: 30, visibility: 비밀, memo: null, words: "탈주자를 팔아 먹고 사는 웃는 자. 냄새가 썩었다. 그 정보 없이는 할당량을 못 채워 더 싫다"}
  - {to: npc_sigrid, type: 존중하는 사냥감, like: 10, trust: 0, visibility: 일방, memo: null, words: "북방 탈주자의 우두머리. 발자국이 흔들리지 않는다. 먼저 찾아 산 채로 잡고 싶다 — 아버지보다 먼저"}
