appearance:
  - "둥근 어깨, 무거운 몸. 손가락마다 다른 가문의 인장 반지 — 빚을 받은 대가로 받은 반지들이다"
  - "턱 비늘이 누렇게 바랬다. 웃을 때 송곳니 하나가 금이다"
  - "늘 경매관 시절의 검은 장갑을 낀다. 인간이 쓴 물건을 맨손으로 만지지 않는다"
smell: "향유와 동전, 시장 물통의 비린내가 옷깃에 남아 있다"
voice_sound: "부드럽고 둥글다. 숫자를 말할 때만 목소리가 경매대처럼 커졌다 작아진다"
personality:
