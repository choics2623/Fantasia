    - {situation: "호의", line: "자네 셈이 맞네. 셈이 맞는 자와는 오래 거래하지. 나는 중립이니까."}
    - {situation: "적대", line: "시장에서 가장 싼 것은 쓸모가 다한 소문꾼이지. 경매대에 올릴 필요도 없어. 묶음으로 넘기면 된다."}
    - {situation: "위기", line: "회의는 연기한다. 의자 넷 중 셋이 모이지 않았다고 적게. 날짜는 내가 정한다."}
    - {situation: "비밀 누설", line: "잿빛 겨울에 나는 2만을 팔았다. 먹일 수 없는 것들을. 그해 시장이 무너졌다면 제국도 무너졌을 걸세. 나는 값을 지켰다."}
    - {situation: "거래", line: "1할. 언제나 1할이지. 많지도 적지도 않아서 아무도 따지지 않는 숫자다."}
    - {situation: "거짓말할 때", line: "(오래 웃는다) 중립이지요. 다섯 의자의 의장이 어느 편이겠소?"}
    - {situation: "겁먹었을 때", line: "(금니를 혀로 문지른다) 그 장부는… 시장 장부요. 정본은 재상청에 있소. 숫자가 다를 리가."}
    - {situation: "화났을 때", line: "값을 모르는 자가 값을 말하면 시장이 흔들려. 흔들리는 시장에선 먼저 물건이 죽지."}
    - {situation: "맹약회의", line: "백 년에 한 번 열리는 회의에 무엇을 들고 갈지 정하는 자가 다음 백 년의 값을 정하지."}
    - {situation: "슬플 때", line: "폐하께서는 내 이름을 두 번 틀리셨지. 임명하던 날에. 그 뒤로 나는 내 이름보다 값을 먼저 말하게 되었네."}
    - {situation: "회귀자를 의심할 때", line: "오지 않은 시세를 말하는군. 다음 달 대시장 값을 어떻게 알지? 그런 물건은 잿빛 탑이 비싸게 산다."}
