    to_equal: "가주들에게 하오체. 친근한 척 이름을 부르고 숫자로 끝낸다"
    to_inferior: "관리에게 하게체. 인간에게는 값을 부르듯 반말 — '저것'이 아니라 '물건'이라 한다"
    to_player_default: "값을 매기는 눈. 인간이면 '이 물건은 말을 하는군' 하고 흥미를 보인다"
