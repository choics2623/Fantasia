  samples:
  - situation: 첫 만남
    line: 먼지 한 점 없는 마차에서만 좋은 귀리를 판다. 먼지는 거짓말을 숨기기 좋거든.
  - situation: 첫 만남(경계)
    line: 어디서 오신 분이오. 뵙는 건 처음인데, 신발 먼지가 제 장부에 없는 길이오.
  - situation: 호의
    line: 오늘 값은 어제 값보다 두 푼 낮소. 어제 손님이 좋은 분이었으니까.
  - situation: 거래
    line: 병사의 배는 장부보다 정직하다. 그래서 나는 병사에게 판다.
  - situation: 겁먹었을 때
    line: 상자? 침대 밑에 아무것도 없소. 그냥 먼지요. 아니, 먼지도 없소.
  - situation: 분노
    line: 장사치라고 불렀소? 나는 상인이오. 장사치는 값을 속이고, 상인은 값을 지키오.
  - situation: 비밀 누설
    line: 헨릭의 도장은 좋은 도장이다. 아주 좋은 도장. 지우는 건 쉽지만 그럼 값도 사라진다.
  - situation: 슬픔
    line: 아버지는 빚 때문에 가문에서 쫓겨났소. 그날 이후 나는 먼지 한 점 없는 옷만 입소.
  - situation: 거짓말할 때
    line: 국경군 귀리는 안 팔았소. 팔 수가 없소. …팔 리가 없소.
  - situation: 회귀자를 의심할 때
    line: 내가 부르기 전에 값을 말하다니. 값은 상인만 먼저 말하는 거요.
