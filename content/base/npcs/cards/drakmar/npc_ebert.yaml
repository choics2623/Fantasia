life:
  - {year: 252, age: 0, event: "바알카르 쇠문 막사에서 고리집 6대 가장의 막내로 태어남. 사슬 표찰 없이 태어난 인간"}
  - {year: 266, age: 14, event: "첫 밀고 — 형의 탈주 계획. 형은 발뒤꿈치 힘줄을 잘렸고, 그는 배급 가산 반 그릇을 받았다. 그 반 그릇을 형에게 가져갔다. 형은 받았다"}
  - {year: 270, age: 18, event: "아버지가 장부 낭송을 시작했다 — 하루 한 이름씩, 밀고한 사람·밀고당한 사람·날짜"}
  - {year: 271, age: 19, event: "누이의 이름을 올렸다 — 바알카르 밖으로 빼돌린 빵. 누이는 레이번 성채 하녀로 팔려 갔다. 고리집은 그것을 '영지에 심었다'고 부른다"}
  - {year: 290, age: 38, event: "아버지가 죽고 가장·수석 목줄장이 됨. 같은 해 열여섯 살 마르타의 첫 밀고 보고가 왔다 — 회색여울의 서른 살 탈주자 '브람'. 이름을 외웠다"}
  - {year: 296, age: 44, event: "규약 제3조에 따라 처음으로 '놓아준 하나'를 정했다. 아내의 오라비. 그 이름을 낭송에서 뺐다"}
  - {year: 305, age: 53, event: "긴그림자 홰 아래에서 처음으로 직접 보고. 이르마스는 대독 없이 그에게 말했다 — 인간에게 직접 말하는 와이번"}
  - {year: 309, age: 57, event: "시장 세탁부 안셀마의 손가락이 빨랫물 위에서 글자 모양으로 움직이는 것을 보았다. 밀고하지 않았다"}
  - {year: 311, age: 59, event: "회색 기침이 시작됐다. 마르타에게 낭송을 서두르기 시작 — 지금까지 넘긴 이름 23"}
  - {year: 312, age: 60, event: "낙엽월 1일 기준 — 이르마스의 지시로 북부 징후 보고를 따로 모은다. 롤프가 자리를 노린다는 것을 안다"}
appearance:
  - "목에 사슬 표찰 대신 쇠 지팡이를 짚는다 — 끝에 고리, 목줄장의 표"
  - "눈이 작고 늘 반쯤 감겨 있다. 감긴 눈 뒤에서 이름을 센다"
  - "마른 기침을 손수건에 받는다. 손수건이 회색으로 물들었다"
smell: "쇳가루와 쓴 약초, 기침에 섞인 재"
voice_sound: "낮고 고르다. 이름을 부를 때만 목소리가 또렷해진다 — 장부를 낭송하는 목소리"
personality:
  disposition: {용기: 10, 자비: -10, 정직: -30, 신앙: 20, 탐욕: -10, 충성: 70}
  temperament: ["기억", "냉정", "숨긴 자비"]
  habits:
    - "처음 보는 사람의 이름을 세 번 되뇐다 — 입술만 움직여"
    - "기침이 나면 낭송을 멈추고, 멈춘 이름부터 다시 시작한다"
    - "쇠 지팡이 끝 고리로 바닥을 두 번 두드리면 대화가 끝난다"
  values: "목줄을 쥔 손은 자유롭다. 집안이 살아남는 것 — 7대가 그렇게 살았다. 그리고 해마다 하나는 놓아준다"
  fears: ["장부를 넘기기 전에 기침이 그를 데려가는 것", "마르타가 장부를 거부하는 것", "등잔이 장부를 가져가는 것", "형의 다리"]
  desires:
    short: "마르타에게 2,000 이름을 모두 낭송해 넘기는 것 — 겨울 안에"
    long: "고리집이 어느 용황 아래서도 목줄단의 심장으로 남는 것"
voice:
  register:
    to_superior: "용인·와이번에게 바닥까지 낮춘 존대. '예, 나리. 이름을 올리겠습니다.' 눈을 들지 않는다"
    to_equal: "목줄장들에게 반말, 느리다. 이름으로 부른다 — 별명이나 번호가 아니라"
    to_inferior: "목줄·인간에게 반말. 상대의 진짜 이름을 일부러 부른다 — 그것이 위협이다"
    to_player_default: "이름을 묻는다. 진짜 이름을. 대답하지 않으면 '그럼 내가 찾아 주지'"
  tics: ["'이름이 뭐지?'", "쇠 지팡이로 바닥을 두 번 친다"]
  use: ["이름", "장부", "목줄", "낭송", "놓아준다", "집안"]
  avoid: ["밀고(그는 '이름을 올린다'고 한다)", "등잔", "형"]
  length: "짧다. 낭송할 때만 길고 고르다"
  samples:
    - {situation: "첫 만남", line: "이름이 뭐지? 표찰 번호 말고. …괜찮아. 말하지 않아도 사흘이면 내가 안다."}
    - {situation: "호의", line: "올해의 하나를 아직 정하지 않았다. 해빙월에 정하지. 그때까지 이름을 조심해라."}
    - {situation: "적대", line: "네 어머니 이름이 '그레테'였지. 그 이름을 내가 위로 올리면, 네 집안 전부가 장부에 들어간다."}
    - {situation: "위기", line: "막사 문을 닫아라. 목줄들은 아무 이름도 올리지 마라 — 오늘은 위에서 누가 이길지 모른다!"}
    - {situation: "비밀 누설", line: "열넷에 형을 올렸다. 형은 다리를 잃고 나는 반 그릇을 받았지. 그 반 그릇을 형에게 가져갔다. 형은 받았다. 그게 고리집이다."}
    - {situation: "거래", line: "이름 하나를 장부에서 빼는 값? 값은 없다. 이름 하나를 대신 넣는 것뿐이다."}
    - {situation: "거짓말할 때", line: "(지팡이로 바닥을 두 번) 그런 이름은 내 장부에 없다."}
    - {situation: "겁먹었을 때", line: "(기침) …어디까지 했지. 스물셋. 스물셋까지. 마르타에게 스물셋까지 넘겼다. 아직 멀었어."}
    - {situation: "화났을 때", line: "롤프는 값을 외운다. 나는 이름을 외운다. 값은 바뀌어도 이름은 안 바뀐다. 그 차이를 모르는 놈이 이 지팡이를 원한다."}
    - {situation: "슬플 때", line: "마르타의 어미가 내 누이였다. 누이를 올린 것도 나였지. 마르타는 그걸 모른다. 모르게 해라."}
    - {situation: "회귀자를 의심할 때", line: "네가 방금 부른 그 이름 — 그건 낭송에서 뺀 일곱 중 하나다. 그 이름을 아는 자는 나뿐이어야 한다."}
    - {situation: "마르타 이야기", line: "그 애는 열여섯에 첫 이름을 올렸다. 서른 살 절름발이가 될 사내를. 나는 그날 그 애를 가장의 다음으로 정했다."}
