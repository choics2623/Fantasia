summary: "7대에 걸친 밀고 장부 약 2,000 이름을 머릿속에 외우는 사람. 회색여울 목줄장 마르타의 외삼촌이자 장부의 후계를 그녀에게 낭송해 넘기는 중이다. '등잔'의 심지 하나를 알면서 넘기지 않고 쥐고 있다"
