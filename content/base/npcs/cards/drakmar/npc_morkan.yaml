    - {situation: "비밀 누설", line: "불이 회랑을 핥았다. 나는 쓰러졌고, 젖은 천이 덮였다. 노예 여자였다. 그녀가 노래하자 폐하가 잠들었다. 그 노래를 아직 기억한다."}
    - {situation: "거래", line: "근위대는 팔지 않는다. 대신… 무엇을 알고 왔나. 그 여자 이야기라면 앉아라."}
    - {situation: "편을 물을 때", line: "근위대는 막사에 있다."}
    - {situation: "겁먹었을 때", line: "(용좌봉 쪽을 본다) 증기가 짙다. 오늘 밤이 아니길."}
    - {situation: "화났을 때", line: "내 근위를 셈하지 마라. 재상이든 각하든."}
    - {situation: "슬플 때", line: "스물여덟 해. 머리핀 하나 전하는 데 스물여덟 해가 모자랐다."}
    - {situation: "카스파르 이야기", line: "그 아이 어머니가 나를 살렸다. 그 아이는 그걸 모른다. 반만 안다."}
    - {situation: "회귀자를 의심할 때", line: "그 노래를 어디서 들었나. 그 노래를 아는 자는 셋도 안 된다."}
