relations:
  - {to: npc_varskar, type: 명목상 주인, like: -10, trust: 0, visibility: 공개, memo: 늙은 유물, words: "3년째 글을 못 읽는 유물. 인장은 내 손에 있다. 살아 있는 동안은 폐하이시고 그 이후는 내 칙령이 정한다"}
  - {to: npc_aurax, type: 최대 위협, like: -60, trust: -70, visibility: 공개, memo: null, words: "즉위하면 원로회를 '날개 달린 도마뱀'이라 부르며 지울 장자. 그가 서명하기 전에 내가 먼저 써야 한다"}
  - {to: npc_isolde, type: 섭정 계획의 열쇠, like: 30, trust: 10, visibility: 비밀, memo: null, words: "알의 어미. 알을 지키는 발톱은 쓸모가 크다. 섭정이라는 글자는 그녀 앞에서도 입에 올리지 않는다"}
  - {to: npc_white_egg, type: 꼭두각시 후보, like: 40, trust: 0, visibility: 비밀, memo: null, words: "깨어날 흰 용. 어리고, 각인되고, 서기의 손에서 자랄 용. 원로회에 가장 합리적인 군주"}
  - {to: npc_kaspar, type: 대안 후보, like: 10, trust: 10, visibility: 비밀, memo: null, words: "잡종 서자. 아우락스가 오르면 대안이 필요하다. 쓸 만한 가치가 있는지 재는 중이다"}
  - {to: npc_valerius, type: 순혈 경쟁자, like: -40, trust: -30, visibility: 공개, memo: null, words: "아우락스에게 돈을 대는 순혈 가주. 행정권을 두고 400년째 다투는 쪽 — 오랜 적수라 오히려 속이 읽힌다"}
  - {to: npc_beatrix, type: 자금 협상, like: 20, trust: 20, visibility: 비밀, memo: null, words: "내전의 양쪽에 돈을 빌려주는 세렌 의장. 섭정 자금은 그 은행 장부를 지나야 한다"}
  - {to: npc_serak, type: 섭정의 말 후보, like: 5, trust: -10, visibility: 비밀, memo: 서고에 출입하는 젊은 용, words: "아우락스의 딸이 서고에서 대붕괴를 읽는다고 들었다. 그 의심이 쓸 만하다. 아직 이름만 적어 두었다"}
toward_player: "인간은 문서로만 본다. 통행증 거래가 유일한 접점이다. 서기가 대신 읽는 말 뒤에서 가치만 재고 있다"
persuade:
