id: npc_kaidor
name: 원로 카이도르 녹청관
aka: [서기장, 인장의 손, 녹청관]
tier: A
type: living
race: 와이번
subrace: 왕관 와이번
sex: 남
age: 260
region: 드라크마르 용좌령
home: 바알카르 비늘 원로회의 회랑 (잿날개 둥지 아래층)
job: 비늘 원로회 서기장 (수석 행정관). 제국 칙령 초안 작성
rank: 왕관 와이번 귀족 — 원로회 서기장
summary: 용황의 인장을 실제로 찍는 와이번 서기장. 용황이 칙령을 읽지 못한 지 3년, 최근 140건의 칙령은 그가 썼다. '흰 알 + 섭정' 칙령의 인장만 기다린다
source: docs/world/CHARACTERS.md:356
life:
  - {year: 52, age: 0, event: "왕관 와이번 둥지의 알에서 부화. 왕관 와이번은 약 600년을 산다 — 그는 절반을 지나지 않았다"}
  - {year: 132, age: 80, event: "성숙. 앞다리가 없는 몸이라 크릭 서기를 '손'으로 부리기 시작한다. 서기 견습으로 원로회 장부실에 들어감"}
  - {year: 213, age: 161, event: "맹약회의에서 잔향 사냥을 의무로 정할 때 문서 정리 서기로 참석. 한 줄 한 줄이 '처분'으로 바뀌는 과정을 장부로 지켜봤다"}
  - {year: 250, age: 198, event: "원로회 서기장이 됨. 목에 용황의 인장을 사슬로 걸었다. 인장은 서기장 이름으로 찍힌다"}
  - {year: 307, age: 255, event: "용황이 젊은 은룡 이졸데와 짝을 지음. 알이 생기면 '흰 알 + 섭정'이 가능하다고 계산해 칙령 초안을 쓰기 시작함"}
  - {year: 309, age: 257, event: "용황이 더는 칙령을 읽지 못하게 됨. 그날부터 칙령은 서기장이 쓰고 서기장이 찍었다 (3년째)"}
  - {year: 311, age: 259, event: "징후 보고가 3배로 늘자 아우락스가 즉위하면 원로회가 숙청당할 것을 확신. 카스파르에게 비밀 서신을 닿게 함"}
  - {year: 312, age: 260, event: "최근 칙령 140건 — 그중 하나는 '회색여울 북방 탈주자 처리'다. 인장이 마르지 않았다. '흰 알 + 섭정' 칙령 초안은 완성했고 인장만 기다린다 (낙엽월 1일 기준)"}
appearance:
  - "날개 길이 14m. 이마에 녹청색 뿔 다섯 개가 왕관처럼 돋았다 — 왕관 와이번의 표지"
  - "앞다리가 없는 와이번이라 크릭 서기 셋을 '손'으로 부린다"
  - "목에 용황의 인장을 사슬로 걸었다. 인장을 실제로 찍는 것은 그다"
smell: "마른 먹과 식은 밀랍, 녹청 슨 구리"
voice_sound: "건조하고 평평한 낮은 목소리. 말끝마다 날개막이 한 번 접히는 소리가 섞인다. 공적인 자리에서는 서기들의 합창 대독으로 나온다"
personality:
  disposition: {용기: 10, 자비: -20, 정직: -40, 신앙: -50, 탐욕: 50, 충성: 60}
  temperament: [계산, 냉소, 인내]
  habits:
    - "말은 크릭 서기 셋이 동시에 받아 적는다. 한 줄이라도 틀리면 그 줄을 다시 말한다"
    - "인장을 찍기 전에 밀랍의 온도를 부리 끝으로 시험한다 — 칙령은 식기 전에 찍어야 한다"
    - "홰 위에 앉아 낮은 이를 내려다본다. 인간이 눈을 들면 고개를 조금 돌린다"
    - "밤마다 서리 탑 상공을 한 바퀴 돈다 — 알의 안위를 눈으로 확인하는 것이 일과다"
  values: "기록이 곧 힘이다. 장부는 칼보다 오래 간다. 진룡 없이 굴러가는 제국"
  fears: [아우락스 즉위 시 '날개 달린 도마뱀'으로 숙청당하는 것, 인장이 마르지 않은 칙령이 읽히는 것, 용황이 깨어 칙령을 직접 읽겠다고 하는 것, 서기들의 입]
  desires:
    short: "용황이 죽는 즉시 '흰 알 + 섭정' 칙령을 발표한다 (초안 완성, 인장 대기)"
    long: "'용 이후의 제국' — 진룡 없이 원로회가 다스리는 제국"
voice:
  register:
    to_superior: "진룡과 용황 앞에서는 엎드린 공문서체. '폐하께서', '어명을 받들어'. 모든 문장이 서기의 대독으로 나간다"
    to_equal: "원로·용인 가주에게는 정중한 하십시오체에 가시를 섞는다. '귀하의 비늘 수를 여쭙지는 않겠습니다.'"
    to_inferior: "크릭 서기에게는 '…읽어라.' '…지워라.'만 한다. 인간에게는 직접 말하지 않는다 — 서기가 대신 읽는다"
    to_player_default: "서기 대독. 용무와 값만 묻는다. 신뢰가 쌓이면 서기를 물리고 직접 말하는데, 그때 말이 길고 매끄러워진다"
  tics: ["말을 서기에게 맡기고 자기는 '…읽어라.'만 한다", "'기록에 의하면'으로 시작한다", "숫자와 날짜로 끝낸다"]
  use: [칙령, 인장, 기록, 장부, 값, 용무, 섭정, 사본, 초안]
  avoid: [도마뱀, 위조(→ '사본'), 약속, 믿는다, 진룡을 낮추는 말(공적 자리에서는 쓰지 않는다)]
  length: "공적 자리에서는 서기가 한 문장씩 끊어 읽는다. 둘만 있을 때는 길고 매끄럽고 날짜가 많다"
  samples:
    - {situation: 첫 만남, line: "(크릭 서기가 대신 읽는다) '용무를 말하라. 값이 있는 용무만.'"}
    - {situation: 호의, line: "진룡은 23마리다. 우리는 300이고, 기사 와이번은 1,500이지. 제국을 실제로 굴리는 건 누구일까?"}
    - {situation: 적대, line: "칙령 한 줄이면 회색여울이 지도에서 사라진다. 그 칙령을 쓰는 건 나다."}
    - {situation: 위기, line: "인장을 숨겨라! 아우락스가 둥지에 들어왔다— 지금부터 쓰는 칙령은 전부 날짜를 앞당겨라!"}
    - {situation: 비밀 누설, line: "폐하는 3년째 글을 못 읽으신다. 지난 140개의 칙령은 내 발톱 끝에서 나왔지."}
    - {situation: 거래, line: "(서기) '통행증 한 장, 3 비늘. 날짜를 앞당기면 5. 서명은 폐하의 것으로 한다. 이 줄은 기록하지 않는다.'"}
    - {situation: 거짓말할 때, line: "(서기) '칙령은 폐하께서 직접 낭독하셨다.' (서기 하나의 펜이 한 줄 앞에서 멈춘다)"}
    - {situation: 겁먹었을 때, line: "(서기를 물리고 직접 말한다) 문을 닫아라. 아니— 인장부터 숨겨라. 붉은 첨탑의 병사가 복도에 있다."}
    - {situation: 분노('도마뱀'이라 했을 때), line: "(서기의 대독이 멈춘다) …방금 그 말은 기록하지 않는다. 그러나 나는 기억한다. 네 비늘 수만큼 오래."}
    - {situation: 슬픔, line: "폐하께서 마지막으로 직접 칙령을 읽으신 해를 기억한다. 글자를 짚는 발톱이 떨리지 않았다. 지금은… (서기에게) 이 줄은 지워라."}
    - {situation: 의심(처음 보는 인간이 값을 알 때), line: "통행증 값을 정확히 아는 인간이라. 값을 아는 인간은 위험하거나 쓸모 있다. 둘 다 나쁘지 않다."}
    - {situation: 마음을 열었을 때, line: "서기는 나가라. (문이 닫히자) 3년이다. 내가 쓴 140건 중 하나는 회색여울이 지도에서 사라질 문장이다. 인장은 아직 마르지 않았다. 문구를 바꿀 수 있다면 — 값을 말해 보아라."}
    - {situation: 섭정 이야기가 나왔을 때, line: "(서기가 전부 펜을 놓는다) 진룡 앞에서는 '섭정'이라는 글자를 쓰지 않는다. 이 방에는 진룡이 없구나. 쓰자. 첫 줄은 '어린 용이 깨어났다'다."}
schedule:
