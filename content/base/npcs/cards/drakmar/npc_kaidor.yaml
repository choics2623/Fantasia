  낮: "원로회 회의, 세렌 사절 접견"
  저녁: "순혈 용인 가주들과 견제 만찬"
  밤: "서리 탑 상공을 한 바퀴 돈다 — 알의 안위 확인"
places: [비늘 원로회의 회랑, 세렌 사절 접견실, 서리 탑 상공]
