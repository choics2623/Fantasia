life:
  - {year: -88, age: 0, event: "(SK 3,000) 까마귀 문 서쪽 빙봉 '서리 이빨'에서 어미 스카디아 서리비늘의 알에서 부화"}
  - {year: 0, age: 88, event: "대붕괴. 어린 몸으로 어미의 날개 밑에서 하늘이 찢어지는 소리를 들었다. 그 소리를 오래도록 꿈에서 들었다"}
  - {year: 250, age: 338, event: "어미의 얼음 정원을 구경하며 자란 시절의 끝 무렵 — 어미가 '아름다운 것'으로 얼음 속에 보존한 인간 아이의 얼굴을 보고 '아름답지?'라는 말을 들음. 그날 처음으로 아름다운 것이 싫어졌다"}
  - {year: 307, age: 395, event: "서리비늘 가문이 그녀를 용황 바르스카르에게 '바쳤다'. 짝짓기는 그녀의 선택이 아니었다"}
  - {year: 309, age: 397, event: "알을 낳음. 알이 흰 것을 보고 아무에게도 말하지 않았다. 알을 서리 탑으로 옮겨 숨으로 데우기 시작"}
  - {year: 311, age: 399, event: "아우락스가 보낸 용인 자객 3명이 서리 탑에 침입. 직접 찢어 죽였다 — 이때 왼쪽 앞발톱 둘이 부러짐. 이날부터 밤에 잠들지 않는다"}
  - {year: 311, age: 399, event: "카스파르에게 첫 서신을 보냄 (용황이 죽으면 알을 까마귀 문으로 옮기겠다는 청). 가을에 답을 받음"}
  - {year: 312, age: 400, event: "여름, 카스파르와 두 번째 서신. 같은 해 알 껍질에 귀를 대고 소리가 진명어임을 알아차렸다 — 해독하지 못하고 엘다르 학자에게 물을 수도 없다 (낙엽월 1일 기준)"}
appearance:
  - "몸길이 22m. 달빛 같은 은비늘에 꼬리 끝만 서리처럼 희다"
  - "왼쪽 앞발의 발톱 둘이 부러져 있다 — 자객 셋을 찢을 때 부러졌다"
  - "눈동자가 서리빛이라 인간이 마주 보기 힘들다. '작은 몸'을 취할 나이가 되지 않아 늘 용의 몸으로 알을 감싼다"
smell: "찬 석회와 마른 서리, 알 곁에서는 따뜻한 조개 냄새"
voice_sound: "맑고 높으나 날이 서 있다. 서리 낀 유리를 긁는 소리. 알 이야기에서는 낮아지고 느려진다"
personality:
  disposition: {용기: 55, 자비: 20, 정직: 30, 신앙: -10, 탐욕: 40, 충성: 5}  # 충성 5는 용황에게. 알에게는 100
  temperament: [날 선 경계, 젊은 직설, 알에 대한 광적인 애착]
  habits:
    - "아침마다 알을 감싸고 서리 숨을 세 번 아주 약하게 불어 껍질이 얼지도 식지도 않게 데운다"
    - "껍질에 귀를 대고 오래 가만히 있는다 — 소리가 나면 꼬리 끝이 떨린다"
    - "탑 아래 계단에서 낯선 발소리가 나면 말을 하기 전에 숨부터 모은다"
    - "시녀가 알 곁을 지나가면 껍질의 실금 수를 속으로 센다 — 어제보다 늘지 않았나"
  values: "알은 아무도 소유할 수 없다. 나조차도. 고른 것은 지키고, 바쳐진 것은 갚지 않는다"
  fears: [알이 깨진 채 발견되는 것, 아우락스의 발톱, 어미처럼 '아름다운 것'을 가두는 용이 되는 것, 알의 소리를 영영 이해하지 못하는 것]
  desires:
    short: "AS 313 꽃월 부화까지 알을 지킨다"
    long: "알을 아우락스와 멜리산드 모두에게서 떼어 놓고, 아무도 '소유하지 않는' 용으로 키운다 — 용족에게 모순된 꿈"
voice:
  register:
    to_superior: "용황에게는 공적으로 '폐하', 사적으로 필요한 말만. 어미 스카디아에게는 '어머니', 말끝이 줄어든다"
    to_equal: "아우락스에게는 이름 없이 '장자' 또는 '붉은 놈'. 멜리산드에게는 정중한 가시. 같은 세대 세라크에게는 조금 부드럽다"
    to_inferior: "크릭 시녀에게는 이름만 부르고 짧은 명령. 인간에게는 '너' 반말 — 그러나 알이 걸린 일에서는 인간의 손을 인정한다"
    to_player_default: "경계의 반말. 질문도 명령처럼 끊는다. 알 반경 100보 안에서는 말보다 숨이 먼저 나온다"
  tics: ["질문조차 '…해라.'로 끊는다", "알 이야기가 나오면 말이 한 박자 느려지고 낮아진다", "'나는 젊다.'를 방패처럼 쓴다"]
  use: [알, 서리, 껍질, 숨, 소리, 이름, 고른다, 소유하지 않는다]
  avoid: [물건(알을), 소유물, '용황의 것', 잃었다(→ 양보했다), 아름답다(어미의 말이라 싫어한다)]
  length: "짧고 빠르다. 경계할 때는 한 문장에 명령이 둘. 알 이야기에서만 길어지고 느려진다"
  samples:
    - {situation: 첫 만남, line: "한 걸음 더 오면 너는 서리 조각상이 된다. 대답해라. 누가 보냈지?"}
    - {situation: 호의, line: "들어 봐. 껍질 너머에서… 무언가를 부른다. 이름인지, 노래인지."}
    - {situation: 적대, line: "나는 젊다. 그러니 아직 자비를 배우지 못했다."}
    - {situation: 위기, line: "탑이 불탄다— 알을 들어! 인간의 손이 더 작고 따뜻해. 내 발톱보다 안전해!"}
    - {situation: 비밀 누설, line: "나는 그를 고르지 않았어. 하지만 이 아이는 내가 골랐다. 이 아이는 아무도 갖지 못한다. 나조차도."}
    - {situation: 거래, line: "알을 지킨 공로가 둘이면 진명 한 마디다. 맹약은 들키지 않으면 어긴 것이 아니다. 이건 '알을 위한 계약'이라 부르면 된다."}
    - {situation: 거짓말할 때, line: "알? 이 탑엔 아무것도 없다. 서리와 나뿐이다. 돌아가라. (눈이 껍질 쪽으로 한 번 간다)"}
    - {situation: 겁먹었을 때, line: "(꼬리가 껍질을 감싼다) …아직이야. 꽃월이 오지 않았어. 깨지 마. 아직 안 돼."}
    - {situation: 분노(알을 물건이라 불렀을 때), line: "물건이라 했나. (서리 숨이 바닥을 따라 퍼진다) 한 번 더 말해 봐. 한 번이면 네 혀가 얼어 떨어진다. 두 번째는 필요 없어."}
    - {situation: 슬픔(어미의 얼음 정원), line: "어머니가 얼음 속의 인간 아이를 보여 주셨어. 아름답지? 하셨지. 나는 그날부터 아름다운 것이 싫었다. 아름다운 건 갇혀 있으니까."}
    - {situation: 알이 반응했을 때(진실을 알아챔), line: "…껍질이 빛났다. 네 손이 닿았을 때. 이 일은 아무에게도 말하지 마라 — 네가 아니라 내가 먼저 찢긴다."}
    - {situation: 시녀에게(자기도 모르는 첩자), line: "숨. 껍질 곁에 오래 서 있지 마라. 가라. 내가 부르기 전에는 오지 마."}
    - {situation: 아우락스 이야기, line: "붉은 놈이 보낸 셋은 문턱에서 끝났다. 넷째는 문턱도 못 넘는다. 이 발톱 둘이 부러진 값을 그가 치르게 할 거야."}
    - {situation: 마음을 열었을 때, line: "…곁에 있어 줘. 이름을 지어 달라는 게 아니야. 깨어나면 그 아이가 정할 거야. 나는 그냥, 아무것도 소유하지 않는 법을 가르칠 사람이 하나 더 필요해."}
