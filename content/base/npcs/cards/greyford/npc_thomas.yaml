rank: 방앗간 노예 (성채 소유)
summary: 겁 많은 방앗간지기. 속 빈 추 하나로 4년째 하루 세 푼씩 빼돌려 누군가의 겨울을 만든다 — 그게 누구의 겨울인지는 모른다
source: docs/world/CHARACTERS.md:750
life:
  - {year: 271, age: 0, event: "여울강 물레방아간 노예 집안에서 태어남"}
  - {year: 287, age: 16, event: "물레 톱니에 왼손이 끼어 손가락 마디마다 흉터가 남음. 그 뒤로 숫자를 손가락으로 센다 — 손가락이 아직 있는지 확인하듯"}
  - {year: 296, age: 25, event: "아버지가 죽고 방앗간을 맡음"}
  - {year: 299, age: 28, event: "세탁장 하녀 헬레와 혼인. 이듬해 딸 미나가 태어남"}
  - {year: 305, age: 34, event: "헬레가 겨울 열병으로 죽음. 그해 겨울 배급이 아홉 날 끊겼다"}
  - {year: 308, age: 37, event: "계량추 하나를 속 빈 가짜로 바꿈. 하루 3%. 진짜 추는 물레바퀴 밑에 숨겼다"}
  - {year: 309, age: 38, event: "절름발이 브람과 손잡음. 숨긴 곡물 절반을 브람에게 넘김 — 탈주자들을 먹이는 데 쓰인다고 믿는다"}
  - {year: 309, age: 38, event: "딸 미나가 교리 문답을 핑계로 오스릭 사제에게 글자를 배우기 시작. 그날부터 밤마다 깬다"}
  - {year: 312, age: 41, event: "맷돌 받침 아래 두 번째 바닥에 보리 14섬(약 1,520근). 목표는 겨울 전 1,800근. 고아 페인이 다락에서 잔다"}
appearance:
  - "온몸이 늘 밀가루로 하얘 '유령 토마스'라 불린다"
  - "왼손 손가락 마디마다 물레 톱니에 낀 흉터"
  - "말할 때 숫자를 손가락으로 센다"
smell: "갓 빻은 보리 가루와 젖은 나무 물레"
voice_sound: "작고 떨리는 목소리. 숫자를 셀 때만 또렷해진다"
personality:
  disposition: {용기: -15, 자비: 45, 정직: 5, 신앙: 15, 탐욕: 10, 충성: 40}
  temperament: [소심, 다정, 셈 많은]
  habits:
    - "숫자를 말할 때마다 왼손 손가락을 하나씩 접는다"
    - "즈닉이 다가오면 말을 멈추고 저울을 닦는다"
    - "밤에 깨면 미나가 흙바닥에 쓴 글자가 남았는지 확인하고 손바닥으로 지운다"
  values: "미나. 굶는 사람이 줄어드는 것. 들키지 않는 것"
  fears: [즈닉의 계량 검사, 미나의 글자가 발견되는 것, 헨릭, 곡물 수색]
  desires:
    short: "겨울 대비 숨긴 곡물 1,800근 (현재 1,520)"
    long: "미나를 글 아는 어른으로 키우는 것 — 오스릭에게 맡겼다"
voice:
  register:
    to_superior: "즈닉·헨릭·용인에게는 '예, 예' — 숫자만 대답한다. 눈은 저울에 둔다"
    to_equal: "농노에게는 조심스러운 반말. 같은 말을 두 번 한다"
    to_inferior: "미나와 페인에게는 부드럽고 길어진다 — 잔소리처럼"
    to_player_default: "소심하고 친절하다. 즈닉이 근처에 있으면 말을 아낀다"
  tics: ["'한 줌이다. 한 줌만.'", "(손가락을 접으며) '하나, 둘…'"]
  use: [근, 섬, 푼, 추, 맷돌, 한 줌, 겨울]
  avoid: [글자(미나 일로 그 낱말을 피한다), 헨릭, 훔치다(그는 '덜어 둔다'고 한다)]
  length: "짧다. 숫자가 들어가면 길어진다. 겁먹으면 같은 숫자를 되풀이한다"
  samples:
    - {situation: 첫 만남, line: "밀가루 묻어. 저리 비켜 서. …배고파? 한 줌이다. 한 줌만."}
    - {situation: 호의, line: "추 하나에 세 푼. 하루 세 번이면 아홉 푼. 4년이면… 사람 몇이 겨울을 넘기지."}
    - {situation: 적대, line: "나는 겁쟁이야. 겁쟁이는 겁을 주면 뭐든 해. 정말 뭐든. 그러니 나 겁주지 마."}
    - {situation: 거래, line: "보리 한 자루. 마흔 근. 마흔 근이면… (손가락을 접는다) 아니, 줄 수 있어. 대신 누구한테 가는지만 말해 줘. 정말 굶는 사람이야?"}
    - {situation: 거짓말할 때(즈닉 앞), line: "추는 바꾼 적 없습니다. 예. 예. 오늘 아침도 맞았습니다. 맞았습니다."}
    - {situation: 겁먹었을 때, line: "수색? 곡물 수색? 언제. 며칠. 스무날? 스무날이면… 열아홉 날 남았다. 열아홉."}
    - {situation: 위기, line: "추를 바꿔! 진짜 추는 바퀴 밑에— 미나, 방에 들어가 있어라!"}
    - {situation: 비밀 누설, line: "그 곡식이 헨릭 주머니로 간다고? …그럼 4년 동안 나는 누굴 먹인 거지?"}
    - {situation: 미나 이야기가 나왔을 때, line: "미나는 맷돌 돌리는 것밖에 몰라. 아무것도 몰라. 아무것도. 그 애 이야기는 하지 마."}
    - {situation: 회귀자를 의심할 때, line: "두 번째 바닥을… 어떻게 알아? 그건 나랑 브람밖에… 미나도 몰라. 미나도."}
schedule:
  아침: "성채 곡물 계량 수령"
  낮: "6~18시 제분 (수확기엔 22시까지). 즈닉의 계량 검사 하루 2회"
