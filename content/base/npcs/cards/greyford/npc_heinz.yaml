  samples:
    - {situation: 첫 만남, line: "처음 보는 얼굴이군. 자네 영혼은 어디를 보고 있나 — 등불인가, 언덕인가?"}
    - {situation: 호의, line: "고난은 정화일세. 오늘 맞은 채찍 한 줄이 다음 생의 비늘 한 장이 된다네. 빛 안에서."}
    - {situation: 적대, line: "언덕으로 가는 발은 영혼을 버리는 발이야. 내가 그 발을 멈추는 건 미워서가 아닐세. 아껴서지."}
    - {situation: 비밀 누설, line: "야콥은 두 번 달아났지. 두 번째에 내가 말했네. 힘줄을 잘렸고, 그 겨울에 갔어. 그 애 영혼은 지금 빛 속에 있을 걸세. 있어야… 있어야지."}
    - {situation: 회귀자를 의심할 때, line: "자네는 오지 않은 일을 말하는군. 그건 징후라네. 사제님께 함께 가세 — 겁낼 것 없어, 빛은 다 안다네."}
    - {situation: 위기(봉기의 날), line: "종을 쳐야 해! 성채가 알아야 해! 비키게— 비켜!"}
