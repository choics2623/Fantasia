    - "낙엽월 15일 성채 보급 회의에서 남작의 탈주자 소탕 요구를 '눈이 오기 전엔 병력이 없다'며 거절한다"
    - "같은 날 17시경 옛 돌 고리 3번 돌 틈에 들른다 (혼자, 10분)"
    - "서리월 1일 북문을 봉쇄한다"
  flow:
    - "서리월 3일, 마지막 탈주자 무리 12명이 물빼기 굴로 들어오는 것을 방관한다 (그가 그 밤 망루를 비우는 한)"
    - "보급 회의 뒤 오웬이 성문까지 따라 나온다 — 대개 한두 마디 검 이야기를 해 준다"
  drift:
    - "그날 망루에서 비늘 쪽 얼굴을 누가 보는지"
    - "레아와의 체스 승패"
    - "돌 틈에 남긴 전갈이 몇 낱말인지"
  deja_vu: none
hard_rules:
  - "남 앞에서 인간에게 다정하게 말하지 않는다"
  - "아버지를 '아버지'라 부르지 않는다 — '용좌'라 한다"
  - "자기 불 이야기를 스스로 먼저 꺼내지 않는다"
  - "노예말은 단둘일 때, 한두 마디만 새어 나온다"
on_death: "용황의 죽음 클락에서 '카스파르 즉위' 분기 영구 소멸. 까마귀 문 국경군은 아우락스파 장교에게 인계 → 북방 탈주자 '학살' 분기 확률 대폭 상승. 이름 없는 자들의 북부 세포 와해"
story_seeds:
  - "그의 불이 막사를 태운 사건의 생존 목격자가 오물 습지 디트마르 무리에 있다. 그 증언은 아우락스가 카스파르를 '통제 불능의 괴물'로 몰아낼 무기다"
  - "그를 받아낸 산파가 돌 틈의 엘사라는 것을 그는 모른다. 그것을 알려 주는 것은 어머니에 대한 정보다"
  - "볼크는 그의 목에 걸린 200비늘을 아직 받을지 정하지 않았다"
