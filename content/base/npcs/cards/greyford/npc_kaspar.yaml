  - {to: npc_owen_raven, type: 동생 같은, like: 35, trust: 30, visibility: 공개, memo: null, words: "그 아비에게서 어떻게 저런 아이가 났는지. 답장을 보냈는데 아이가 아무 말이 없다"}
  - {to: npc_elsa, type: 연락책, like: 40, trust: 55, visibility: 비밀, memo: null, words: "돌 틈의 늙은 손. 그녀가 왜 자기를 믿는지는 묻지 않았다"}
  - {to: npc_aurax, type: 이복형·적, like: -80, trust: -90, visibility: 공개, memo: null, words: "아버지의 불을 가장 닮은 자. 용좌가 비는 날 제일 먼저 북쪽을 볼 자"}
