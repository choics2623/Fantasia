  낮: "북문 순시, 탈주자 심문, 병사 훈련 감독 — 직접 검술 지도. 매월 15일 성채 보급 회의(10~16시)"
  저녁: "레아와 체스(주 4회), 이후 집무"
  밤: "매월 15일 보급 회의 귀로 17시경 혼자 옛 돌 고리 경유(10분) — 3번 돌 틈으로 엘사와 전갈 교환"
places: [까마귀 문 망루, 사령관실, 북문, 옛 돌 고리, 레이번 성채 연회실(15일)]
