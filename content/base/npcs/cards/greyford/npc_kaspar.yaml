toward_player: "공정하지만 거리를 둔다. 인간 앞에서 일부러 엄하게 군다. 단둘이 되면 손을 먼저 본다"
persuade:
  likes: ["병사들의 목숨을 아끼는 계획", "어머니 엘레나에 대한 기억이나 정보", "실현 가능한 계획"]
  hates: ["'잡종'", "어머니를 노예로 낮추는 말", "그의 불을 목격했음을 떠벌리는 것"]
roles:
  teacher: "검술(상한 68), 방패술(50), 승마(55). 조건: 국경군 '말 돌보는 노예'로 배속되어 3개월 성실 근무 + 신뢰 40. 수업료 없음 — 대신 탈주자 관련 일을 하나 맡는다"
  companion: "조건부(고난도) — 용황 사망 후 도주 분기에서. 충성 아크: 0 감시 → 30 은밀한 대화 → 50 엘레나의 무덤을 함께 찾음 → 70 '내 이름의 반은 네 것이다'(해방 칙령 루트 해금). 배신: 플레이어가 그의 병사를 대량 학살할 때"
  romance: "고난도 — 신뢰 70, 호감 80 이상, 용황 사망 이후에만. 결혼 시 '반용의 짝' 칭호와 아우락스파의 영구 적대"
regression:
