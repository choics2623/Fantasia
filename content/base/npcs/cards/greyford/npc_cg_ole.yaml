  - 누가 길 이야기를 하면 눈을 감고 소리를 듣는다
  - 추워 보이지 않을 때도 손을 겨드랑이에 넣는다
  values: 길을 아는 것. 같이 걸은 사람을 끝까지 데려가는 것
  fears:
  - 형이 쌓은 돌이 눈에 묻히는 것
  - 순나와 일다가 의무실에서 죽는 것
  - 값 받는 안내인이 길을 파는 것
  desires:
    short: 순나와 일다가 의무실에서 살아 나가는 것
    long: 형 프로드의 이정표 밑 돌무더기를 한 번 더 보는 것
voice:
  register:
    to_superior: 용인에게는 서리말 섞인 낮은 존댓말. 시선을 내리지만 말은 길을 말한다
    to_equal: 같은 인간에게는 서리 억양의 반말. 느리고 따뜻하다
    to_inferior: 아이에게는 서리 자장가 같은 반말
    to_player_default: 낯선 사람에게는 먼저 길을 묻는다 — '어디까지 가나.'
  tics:
  - '''길은 발이 아니라 눈이다.'''
  - '''돌이 몇 개냐.'''
  use:
  - 길
  - 눈
  - 돌
  - 고개
  - 바람
  - 서리
  avoid:
  - 운(그는 '길'이라 한다)
  - 값
  - 팔다
  length: 느리다. 길 이야기는 길어지고 사람 이야기는 짧다
  samples:
  - situation: 첫 만남
    line: 발가락 없이도 길은 걷는다. 길을 아는 건 발이 아니라 눈이다. …너는 눈이 있느냐.
  - situation: 첫 만남(경계)
    line: 어디서 왔나. 남쪽 사투리다. 서리 길은 남쪽에서 오는 사람에게 더 춥다.
  - situation: 호의
    line: 돌 하나를 쌓았다고 해서 길이 되지는 않는다. 그런데 돌이 없으면 길은 사라진다.
  - situation: 거래
    line: 길 하나를 알려 주마. 대신 의무실의 어린것이 살게 해 다오.
  - situation: 겁먹었을 때
    line: 저 문은 안 된다. 아니, 열려야 한다. 저 문이 열리면 열둘이 든다.
  - situation: 분노
    line: 형을 운 없는 놈이라 하지 마라. 형은 길을 알았다. 길이 형을 몰랐을 뿐이다.
  - situation: 비밀 누설
    line: 서쪽 비탈. 바람이 칼 같은 곳. 거기엔 망루가 없다. 망루가 설 자리가 없어서다.
  - situation: 슬픔
    line: 형이 쌓은 돌이 여섯 개다. 일곱 번째 돌은 내 것이었다. 아직 쌓을 사람이 없다.
  - situation: 거짓말할 때
    line: 남쪽 길이 있다. 대로를 따라가면 된다. …거짓이다. 곧 알 거다.
  - situation: 회귀자를 의심할 때
    line: 너는 길을 두 번 걸은 얼굴이다. 같은 길을 처음 걷는 얼굴이 아니다.
