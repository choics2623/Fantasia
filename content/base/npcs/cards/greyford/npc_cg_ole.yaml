- year: 296
  age: 38
  event: 형 프로드와 갈라서 따로 안내. 형은 까마귀 문 쪽, 올레는 울음 고개 서쪽
- year: 303
  age: 45
  event: 서리 길 안내로 마흔 명을 살림. 한 번도 값을 받지 않았다
- year: 309
  age: 51
  event: 흉작이 시작되자 탈주자가 몰림. 값을 받는 안내인이 늘어남
- year: 311
  age: 53
  event: 형 프로드가 이정표 부근에서 동사. 잿빛 표 여섯 개가 이정표 밑에 묻힘
- year: 312
  age: 54
  event: 탈주자 열한 명을 데리고 오다 까마귀 문 순찰에 붙잡힘. 일부러 붙잡혔다는 말은 아무에게도 하지 않았다
appearance:
- 왼발 발가락이 모두 얼어 잘렸다
- 수염이 눈 색으로 희고 입가만 노랗다
- 손이 길 이름을 쓰듯 허공에서 움직인다
smell: 젖은 털가죽과 연기, 눈 녹은 쇠 냄새
voice_sound: 거칠고 낮은 목소리. 길 이름을 말할 때만 천천히 정확해진다
personality:
  disposition:
    용기: 40
    자비: 30
    정직: 10
    신앙: 5
