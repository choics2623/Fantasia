life:
- year: 258
  age: 0
  event: 서리 길 북쪽 서리 인간 마을에서 태어남. 형 프로드는 여섯 살 위
- year: 272
  age: 14
  event: 형을 따라 안내인 견습. 처음 넘은 길은 울음 고개
- year: 284
  age: 26
