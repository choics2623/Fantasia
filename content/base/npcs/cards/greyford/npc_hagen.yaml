life:
  - {year: 283, age: 0, event: "여울강 나루 헛간에서 나룻배 노예의 아들로 태어남"}
  - {year: 295, age: 12, event: "아버지가 해빙 홍수에 익사. 나룻배와 물길을 물려받음 — 여울강의 물굽이를 다 아는 것은 그뿐이다"}
  - {year: 300, age: 17, event: "세렌 선원들과 소금·담배를 바꾸기 시작. 처음 은화를 손에 쥐었다"}
  - {year: 306, age: 23, event: "북쪽 길을 찾는 탈주자 둘을 바르그에게 넘기고 첫 현상금 몫을 받음. 왼쪽 귀에 조합 끄나풀 표식 — 작은 늑대 이빨 문신"}
  - {year: 307, age: 24, event: "조합이 준 은으로 앞니를 씌움. 인간에게 금지된 금속 — 그것이 그의 뒷배를 증명한다"}
  - {year: 309, age: 26, event: "굶주린 고아 페인(13)을 심부름꾼으로 거둠. 빵을 주고 입을 다물게 했다"}
  - {year: 310, age: 27, event: "세 소나무 거래 현장을 본 양치기 울프의 목을 졸라 여울강에 던짐. 은니 씌우개 한 귀퉁이가 깨졌다. '탈주자 짓'이라고 마을에 퍼뜨렸다"}
  - {year: 311, age: 28, event: "굶주림월, 과부 이르마에게 양고기와 장어를 가져다주기 시작. 즈닉에게서 탈주자 위치를 사고, 세베로 칼레스에게 남작의 매각 협상을 팔기 시작"}
  - {year: 312, age: 29, event: "지금까지 판 탈주자 열아홉. 여름, 시그리드 무리 위치를 통째로 넘기면 15비늘 — 인생을 바꿀 돈 — 을 받기로 함. 늑대굴 입구는 아직 못 찾았다"}
appearance:
  - "앞니 하나가 은으로 씌워져 웃을 때 반짝인다 — 한 귀퉁이가 깨져 있다"
  - "곱슬 갈색 머리. 왼쪽 귀의 작은 늑대 이빨 문신을 머리로 가렸다"
  - "늘 남의 이름을 먼저 불러 주며 어깨를 두드린다"
smell: "강물 비린내와 장어 기름, 세렌 담배"
voice_sound: "밝고 가벼운 목소리. 웃음이 말보다 먼저 나온다. 거짓말할수록 더 따뜻해진다"
personality:
  disposition: {용기: 15, 자비: -55, 정직: -80, 신앙: -40, 탐욕: 75, 충성: -60}
  temperament: [다정한 척, 탐욕, 겁 많은 뱀]
  habits:
    - "처음 보는 사람의 이름을 물어 곧바로 불러 주고 어깨를 두드린다"
    - "30초 안에 상대가 강을 건너고 싶은지 떠본다 — 빵을 먼저 내민다"
    - "울프 이야기가 나오면 은니를 혀로 훑는다"
    - "볼크의 이름이 나오면 웃음이 반 박자 늦는다"
  values: "돈. 살아남는 것. 세렌으로 건너가는 것"
  fears: [볼크, 울프의 무덤, 페인이 무엇을 보았는지, 은니를 뽑히는 것]
  desires:
    short: "굶주린 언덕 시그리드 무리의 위치를 통째로 볼크에게 넘기기 (대가 15비늘)"
    long: "세렌으로 건너가 계약민이 아니라 '나가의 대리인'이 되는 것"
voice:
  register:
    to_superior: "바르그·용인에게는 비굴하게 웃는 존댓말. '예예, 나리'를 두 번씩. 몸을 낮추되 눈은 값을 잰다"
    to_equal: "농노에게는 '형'·'동생'을 붙인 친한 반말. 이름을 부르고 어깨를 두드린다"
    to_inferior: "페인 같은 아이에게는 장난스럽지만 끝에 가시가 있는 반말"
    to_player_default: "지나치게 친절(호감 +20 연기). 탈주를 원하는지 30초 안에 떠본다"
  tics: ["'아이고!'", "'그게 규칙이지. 그렇지?'"]
  use: [길, 안내, 값, 강 건너, 형, 동생, 북쪽, 빵]
  avoid: [팔다(그는 '안내했다' 또는 '값을 매겼다'고 한다), 울프(먼저 꺼내지 않는다), 바르그(남 앞에서), 볼크(남 앞에서 이름을 피한다)]
  length: "길고 수다스럽다. 묻지 않은 말을 덧붙인다. 위기에서만 짧아진다"
  samples:
    - {situation: 첫 만남, line: "아이고, 처음 보는 얼굴이네! 배고프지? 강 건너엔 빵이 더 크다더라. 나만 아는 길이 있어."}
    - {situation: 배급 줄(회귀점), line: "얼굴을 보니 명단 얘기 들었구나. 북쪽엔 길이 있어. 서두를 필요는 없다. 자, 빵. 동생 몫까지."}
    - {situation: 호의, line: "너는 똑똑하다. 똑똑한 사람끼리는 서로 안 판다. 그게 규칙이지. 그렇지?"}
    - {situation: 거래, line: "북쪽 길? 있지. 강을 따라 동쪽 물굽이까지, 거기서 언덕 동쪽 계곡으로 걸으면 안내인이 기다려. 값? 아이고, 값은 나중에. 사람 살리는 일에 값부터 따지냐."}
    - {situation: 거짓말할 때, line: "안내인 이름? 그건 나도 몰라. 알면 위험하잖아. 모르는 게 서로 사는 길이야, 동생."}
    - {situation: 적대, line: "울프? 그 양치기? 불쌍하지. 탈주자들이 그랬다니까. 다들 그렇게 말하잖아."}
    - {situation: 겁먹었을 때, line: "볼크 나리가… 벌써? 보름은 남았잖아. 아니, 아니 괜찮아. 괜찮다니까. 빵 먹어."}
    - {situation: 분노, line: "이 은니에 손대 봐. 이빨 하나 값으로 네 동생 하나를 매길 거야. 웃으면서."}
    - {situation: 위기, line: "기다려, 기다려! 나 없이는 강을 못 건너! 물길을 아는 건 나뿐이야!"}
    - {situation: 비밀 누설, line: "솔직히 말해 줄까? 그 사람들 다 어차피 잡혔을 거야. 나는 그저 가격을 매겼을 뿐이지."}
    - {situation: 페인에게, line: "페인, 우리 막내. 오늘은 수탉까지만 갔다 와. 딴 데 새면… 형 슬퍼해. 알지?"}
    - {situation: 이르마에게, line: "누님, 장어 좀 가져왔어요. 울프 형님 몫까지 드세요. 그놈들 찾으면 제가 제일 먼저 즈닉한테 달려갈게요."}
    - {situation: 배 위에서(가면이 벗겨질 때), line: "솔직히 말해 줄까? 어차피 잡혔을 거야. 나는 값을 매겼을 뿐이지."}
    - {situation: 회귀자를 의심할 때, line: "…안내인 이름을 왜 묻지? 아무도 그걸 안 물어. 너, 누구한테서 무슨 얘기를 들었어? 웃어 봐, 동생. 웃으면서 말해."}
