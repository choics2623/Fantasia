story_seeds:
  - "페인의 증언, 이르마의 복수, 디트마르의 분노 — 셋 중 누구에게 진실을 먼저 알리느냐에 따라 하겐의 최후가 달라진다(재판·린치·도주)"
  - "울프의 주먹 안에 은니 조각이 있다. 하겐은 씌우개가 그날 깨진 것만 안다 — 어디에 떨어졌는지는 모른다"
  - "그를 '안내인' 이름으로 떠보면 그는 처음으로 셋째를 '물건'이 아니라 '위험'으로 본다 — 그리고 볼크에게 먼저 판다"
