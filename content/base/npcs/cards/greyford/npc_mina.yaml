    - {situation: 비밀 누설, line: "스물일곱 개 알아요. 서른 개가 되면 아빠 이름을 써 줄 거예요. 아빠는 자기 이름이 어떻게 생겼는지 몰라요."}
    - {situation: 회귀자를 의심할 때, line: "그 글자 어떻게 알아요? 이건 사제님이랑 나만 아는 건데."}
