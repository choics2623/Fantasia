rank: 까마귀 문 국경군 부관 (백인대장 계급), 카스파르의 오른팔. 가문명 없음
summary: 카스파르의 그림자이자 멜리산드의 눈. 열두 해를 감시하다 감시하던 사내를 존경하게 되었고, 그 균열을 스스로도 모른다
source: docs/world/CHARACTERS.md:457
life:
  - {year: 252, age: 0, event: "은비늘 혈통을 섬기는 하급 가문 없는 용인 집안에서 태어남. 머리선의 은빛 비늘이 그 혈통의 표지"}
  - {year: 280, age: 28, event: "잿불 언덕 광산 경비대 견습. 광산의 인간들이 '녹여 다시 쓰이는' 것을 처음 보았다"}
  - {year: 296, age: 44, event: "북방 국경군으로 전속, 까마귀 문 십인대장"}
  - {year: 299, age: 47, event: "젊은 사령관 카스파르의 부관으로 발탁 (백인대장 계급). 누가 추천했는지는 그녀만 안다"}
  - {year: 300, age: 48, event: "잿불 언덕에 불려가 멜리산드에게 오른손 검지와 중지를 '충성 증표'로 바침. 돌아와서는 요툰 약탈대 매복에서 사령관을 지키다 잃었다고 말했다"}
  - {year: 306, age: 54, event: "서리 길 요툰 약탈대를 카스파르와 함께 세 해 연속 막아냄. 처음으로 그의 밀집 창진을 보고서에 '탁월'이라 적었다"}
  - {year: 309, age: 57, event: "짐꾼 막사 화재의 밤, 사령관의 왼팔 비늘이 달아오른 것을 봄. 보고서에는 '등잔 사고'라고만 썼다 — 첫 누락"}
  - {year: 312, age: 60, event: "건초월, 오웬 레이번의 편지를 전해 주겠다고 받아 가로챔. 카스파르의 답장도 가로채 보관. 포도월, 헨릭에게서 남작의 빚 상황을 삼"}
appearance:
  - "짧게 자른 은회색 머리, 머리선을 따라 박힌 은빛 비늘"
  - "오른손 검지와 중지가 없다 — 그 손을 늘 허리 뒤로 감춘다"
  - "항상 라벤더 기름 냄새가 난다 — 비둘기장 냄새를 감추려고"
smell: "라벤더 기름. 그 밑에 아주 희미하게 비둘기 깃털과 곡물 먼지"
voice_sound: "낮고 고른 목소리. 높낮이가 거의 없어 명령과 농담이 같은 소리로 들린다"
personality:
  disposition: {용기: 40, 자비: 0, 정직: -50, 신앙: -20, 탐욕: 10, 충성: 60}
  temperament: [냉정, 관찰, 금 간 충성]
  habits:
    - "오른손을 허리 뒤에 감추고, 왼손으로만 문서를 넘긴다"
    - "체스에서 질 수 있는 판을 일부러 한 수 늦춘다 — 사령관이 이길 때 짓는 얼굴을 보려고 (스스로는 '관찰'이라 부른다)"
    - "새 얼굴을 보면 이름보다 먼저 손과 신발을 본다"
  values: "임무. 약속받은 회색여울 영지. 그리고 — 인정하지 않지만 — 카스파르의 목숨"
  fears: [멜리산드가 그녀의 누락을 알아채는 것, 카스파르가 손가락의 진실을 아는 것, 녹여 다시 쓰이는 것]
  desires:
    short: "카스파르와 이름 없는 자들의 연결 고리를 증거로 확보하기"
    long: "멜리산드 즉위 뒤 회색여울 영지를 받는 것 (약속받음)"
voice:
  register:
    to_superior: "카스파르에게는 '예, 사령관님.' 짧은 보고체. 멜리산드 쪽 사람에게는 더 짧고 더 공손하다"
    to_equal: "동료 장교에게는 하게체. 군말이 없고 질문으로 끝내지 않는다"
    to_inferior: "인간·크릭에게는 해라체 명령. 위협을 사실처럼 말한다"
    to_player_default: "차갑지만 관찰적. 무엇을 아는지 떠보는 질문을 섞는다. 카스파르 근처에서 보이면 즉시 뒷조사"
  tics: ["'다음.'", "'그건 내가 정한다.'"]
  use: [보고, 경로, 증거, 성벽, 사령관님, 그분(멜리산드를 사적으로 부를 때), 쓸모]
  avoid: [멜리산드의 이름(남 앞에서), 손가락, 잡종, 미안]
  length: "짧다. 한 문장에 하나만. 감정이 흔들릴 때만 문장이 두 개로 쪼개져 이어진다"
  samples:
    - {situation: 첫 만남, line: "사령관님께 볼일이 있다면 나를 거쳐라. 나를 거치지 않은 자는 성벽 밖에 매달렸다."}
    - {situation: 호의, line: "너는 생각보다 쓸모 있군. 그 말이 칭찬인지 경고인지는 앞으로 네가 정해라."}
    - {situation: 적대, line: "멜리산드 님은 인간을 버리지 않으셔. 쓰고 나서 녹여 다시 쓰실 뿐이지."}
    - {situation: 거래, line: "돌 고리에 누가 무엇을 두고 가는지 알려 줘라. 대신 네 동생 이름이 어느 명단에 있는지는 내가 잊어 주지."}
    - {situation: 거짓말할 때, line: "이 손? 요툰 도끼였다. 사령관님 목을 노리던. 더 묻지 마라."}
    - {situation: 겁먹었을 때, line: "전서구가 돌아왔다고? 내가 보낸 새가 아닌데. …누가 비둘기장에 들어갔지."}
    - {situation: 위기, line: "사령관님을 지금 깨우지 마. 아니— 깨워. 늦었어. 내가 늦었어."}
    - {situation: 비밀 누설, line: "이 두 손가락은 그분께 드린 맹세였어. 지금은… 다른 분을 위해 나머지도 내놓을 수 있을 것 같아."}
    - {situation: 체스 판에서(카스파르에게), line: "사령관님 차례입니다. …그 수는 나쁘지 않습니다. 이번엔."}
    - {situation: 회귀자를 의심할 때, line: "그 편지 이야기를 어디서 들었지? 그건 내 서랍 밖으로 나간 적이 없다. 너는 누구의 눈이냐."}
