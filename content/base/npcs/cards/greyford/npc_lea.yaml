aka: [부관, 여덟손가락(병사들이 뒤에서)]
tier: A
type: living
race: 용인
subrace: 용인(비늘혈)
sex: 여
age: 60
region: 회색여울 변경
home: 까마귀 문 요새, 사령관 집무실 옆 부관실
