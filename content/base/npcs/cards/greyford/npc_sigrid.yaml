on_death: "북방 탈주자 무리 지휘 붕괴 → 디트마르가 흡수(폭력화) 또는 산개(아사). 북방 대탈주 클락 '학살' 쪽 +1. 아스타가 소식을 들으면 흐로스가르드 노예 봉기 결심"
story_seeds:
