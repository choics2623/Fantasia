  companion: "가능(핵심 동료). 충성 아크: 0 경계 → 30 무리의 일원 인정(뼈 구슬 하나) → 50 에이나르 고백, 서리 길 귀환 퀘스트 → 70 '무리를 네게 맡긴다'(지휘권 공유, 계승 가능). 배신: 플레이어가 무리를 위험에 버리면 즉시 이탈, 회복 불가"
  romance: "가능 — 호감 75 + 에이나르 퀘스트 완료. 결혼은 모르바 또는 자유촌에서만 (제국 안에선 주인 허가가 필요한데, 그녀에겐 주인이 없다)"
