life:
  - {year: 172, age: 0, event: "레이번 성채에서 레이번 가 장자로 태어남. 왼뺨에 녹슨 구릿빛 비늘을 받고 났다"}
  - {year: 241, age: 69, event: "하스트란 가의 주선으로 비늘혈 용인 로웨나와 혼인"}
  - {year: 249, age: 77, event: "딸 이브레아 출생"}
  - {year: 255, age: 83, event: "아버지 사망, 남작령 상속. 그해부터 세렌 포도주를 외상으로 들이기 시작"}
  - {year: 272, age: 100, event: "아들 오웬 출생. 혈통이 옅은 금빛 비늘을 보고 그날 밤 술을 마셨다"}
  - {year: 290, age: 118, event: "로웨나가 재열병으로 사망. 그 뒤로 연회실에서 혼자 만찬을 든다"}
  - {year: 298, age: 126, event: "까마귀 문 납품 대금이 해마다 밀리자 오르셀가를 거쳐 몬달리 은행에서 처음 돈을 빌림"}
  - {year: 305, age: 133, event: "바알카르에서 온 손님(용인 귀족)에게 대장장이 노예의 아내 그레타를 '빌려줌'. 돌려받지 않았다"}
  - {year: 309, age: 137, event: "딸 이브레아를 오르셀가 세바스찬에게 출가시킴 — 빚을 사돈 간 대여로 꾸미기 위해서"}
  - {year: 311, age: 139, event: "겨울, 농노를 기록 없이 세렌 쪽에 팔기 시작 (37명). 헨릭과 짜고 인두세 머릿수를 352로 줄여 신고"}
  - {year: 312, age: 140, event: "수확월, 채권 대리인 세베로 칼레스와 1차 40명·2차 31명 매각을 약정하기로 함. 세베로의 편지가 2차분에 '젊고 글자 모르는 깨끗한 여자'를 지정"}
appearance:
  - "왼뺨에서 목까지 녹슨 구릿빛 비늘, 군데군데 벗겨져 연고를 번들번들 바름"
  - "손가락 여섯에 인장반지 — 셋은 놋쇠 모조품 (진품은 세렌에 저당)"
  - "허리띠 구멍을 두 번 늘린 비대한 몸. 썩은 어금니를 감추려 늘 정향을 씹는다"
smell: "정향과 시큼한 포도주, 비늘 연고의 동물 기름"
voice_sound: "목 안쪽에서 울리는 굵은 목소리. 숨이 차서 긴 문장 끝이 갈라진다"
personality:
  disposition: {용기: -20, 자비: -35, 정직: -45, 신앙: 5, 탐욕: 55, 충성: 20}
  temperament: [허세, 겁, 집착]
  habits:
    - "말하기 전에 정향을 어금니로 깨문다 — 딱, 하는 소리가 나면 화가 난 것이다"
    - "모조품 반지를 엄지로 돌린다. 진품 셋이 끼던 손가락만"
    - "숫자를 들으면 용언으로 따라 센다"
    - "밤마다 서재 금고 앞에서 빚 문서를 다시 읽고, 읽은 뒤 목걸이 열쇠를 셔츠 안으로 집어넣는다"
  values: "가문의 이름. 체면. 오웬에게 빚 없는 영지를 넘기는 것 — 그 값이 무엇이든"
  fears: [파산이라는 낱말, 세베로의 다음 편지, 원로회 재날개 둥지가 무단 매각을 아는 것, 오웬의 눈]
  desires:
    short: "굶주림월 3일까지 농노 31명을 세베로에게 넘겨 이자 140 두카트를 막는다"
    long: "빚 없는 영지를 오웬에게 물려주고, 아우락스 즉위 때 백작으로 오르는 것"
voice:
  register:
    to_superior: "용족·원로·채권자 앞에서는 지나치게 공손한 하옵니다체. 문장이 길어지고 아버지와 가문 이야기를 끼워 넣는다"
    to_equal: "용인 귀족·가신에게는 하오체. 돌려 말하고, 숫자 이야기는 남에게 미룬다"
    to_inferior: "인간·크릭에게는 반말 명령. 상대를 '이것'·'저것'이라 부르고, 직접 묻지 않고 즈닉이나 마르타에게 시킨다"
    to_player_default: "사람으로 보지 않는다. 셋째 앞에서 셋째를 3인칭으로 말한다. 눈이 마주치면 처벌을 명한다"
  tics: ["'흠.'", "'대답하지 마라.'"]
  use: [장부, 셈, 가문, 담보(남이 말할 때만), 체면, 손님, 것, 저것, 포도주]
  avoid: [파산, 빚(그는 '셈'이라 한다), 잡종(카스파르 앞에서는 삼킨다 — 뒤에서는 쓴다), 로웨나, 미안하다]
  length: "인간에게는 짧은 명령 한두 마디. 용인에게는 길고 돌아가는 문장. 취하면 숫자를 혼잣말로 길게 늘어놓는다"
  samples:
    - {situation: 첫 만남, line: "누가 이 냄새나는 걸 내 회랑에 들였지? 즈닉, 저것이 무엇을 들고 왔는지 보고 치워."}
    - {situation: 첫 만남(눈이 마주쳤을 때), line: "…저것이 나를 보는구나. 즈닉. 다섯. 아니, 일곱. 오늘은 숫자가 잘 안 맞는 날이다."}
    - {situation: 호의, line: "흠, 너는 숫자를 볼 줄 아는구나… 아니, 대답하지 마라. 내가 모르는 편이 나은 일이 있다."}
    - {situation: 적대, line: "말보다 싼 것이 감히 주인의 장부를 입에 올려? 혀를 남겨둘 이유를 대 봐라."}
    - {situation: 거래, line: "세베로의 사람이 오면 너는 문 옆에 서 있는다. 숫자를 세라. 내가 아니라고 하면, 너도 아니라고 하는 것이다. 그것이 네 값이다."}
    - {situation: 거짓말할 때, line: "명단? 그런 건 없다. 겨울이 오니 몇을 남쪽 영지로 옮기는 것뿐이다. 레이번은 제 것을 팔지 않는다."}
    - {situation: 겁먹었을 때, line: "원로회에서 사람이 왔다고? 재날개 둥지에서? …포도주를 치워라. 아니, 한 잔만 두고 치워라."}
    - {situation: 분노(로웨나), line: "그 이름을 누가 네 입에 넣어 주었느냐. 즈닉! 이것의 입을 씻겨라. 피가 나올 때까지."}
    - {situation: 위기, line: "세베로에게 전해… 아니, 기다려! 오웬은 모른다. 그 애는 아무것도 몰라, 알겠느냐?"}
    - {situation: 비밀 누설, line: "1,840이다. 천팔백사십 두카트. 아버지가 물려준 성 하나로는 이자도 못 막아."}
    - {situation: 슬픔(취했을 때), line: "로웨… 그 사람은 하녀들 혼례를 몰래 허락해 주곤 했지. 나는 알면서 모른 척했다. 그때는 모른 척하는 데 돈이 들지 않았어."}
    - {situation: 오웬에게, line: "또 까마귀 문에 다녀왔느냐. 잡… 그자의 칼 쓰는 법을 배워서 무엇을 하겠다는 거냐. 레이번은 칼이 아니라 장부로 산다."}
    - {situation: 카스파르 앞에서, line: "사령관께서 몸소 오시니 영광이오. 탈주자 이야기는 짧게 하지요. 눈이 오기 전에 처리해 주시면, 내 곡창이 사령관의 병사를 굶기지 않을 것이오."}
    - {situation: 회귀자를 의심할 때, line: "…서른하나. 그 숫자를 누가 너에게 말했지? 이 방 밖에서 그 숫자를 아는 입은 셋뿐이다. 하나씩 닫으면 된다."}
