summary: 볼크의 눈에 들고 싶은 반쪽 귀의 송곳니. 회귀할 때마다 스물아홉으로 돌아가 당신을 모르고, 회차마다 조금 더 일찍 코를 든다
source: docs/world/CHARACTERS.md:969
life:
  - {year: 283, age: 0, event: "달그림자 숲 가장자리의 조합 막사에서 태어남. 어미는 조합의 코였다"}
  - {year: 291, age: 8, event: "처음으로 탈주자의 냄새를 따라감. 그날 먹은 고깃점을 지금도 기억한다"}
  - {year: 296, age: 13, event: "첫 피의 몫을 두고 선배 코와 싸우다 왼쪽 귀를 반 잃음. 그 뒤로 '반귀'"}
  - {year: 300, age: 17, event: "코(추적 바르그)가 되어 볼크 회색송곳니의 사냥조에 들어감"}
  - {year: 305, age: 22, event: "서리 길에서 볼크가 보는 앞에서 탈주자 무리의 냄새를 물에 빼앗김. 볼크는 아무 말도 하지 않았다. 그 침묵이 지금도 그를 깨운다"}
  - {year: 308, age: 25, event: "송곳니로 승진. 회색여울 담당 — 까마귀 문 남쪽 송곳니 초소, 코 넷"}
  - {year: 310, age: 27, event: "하겐을 끄나풀로 삼음. 세 소나무 그루터기의 매듭 끈으로 탈주자 위치를 산다"}
  - {year: 311, age: 28, event: "세타가 북방 탈주자 전담 송곳니가 되어 '볼크의 후계'로 불리기 시작함"}
  - {year: 312, age: 29, event: "볼크가 낙엽월 14일 회색여울에 온다는 전갈을 받음. 그 보름 동안 할당을 채워 눈에 들 생각이다"}
appearance:
  - "왼쪽 귀가 반만 남았다 ('반귀')"
  - "털 끝이 잿빛"
  - "볼크 앞에서는 꼬리를 내린다"
smell: "젖은 털, 피 묻은 가죽, 초소 국솥의 기름"
voice_sound: "으르렁이 섞인 굵은 목소리. 말 사이에 코로 '킁' 하고 숨을 들이켠다"
personality:
  disposition: {용기: 40, 자비: -50, 정직: 10, 신앙: 30, 탐욕: 40, 충성: 40}
  temperament: [잔인, 야심, 열등감]
  habits:
    - "말하기 전에 냄새부터 맡는다 — '킁.'"
    - "볼크가 함께 있으면, 볼크가 숟가락을 들기 전에는 아무것도 먹지 않는다"
    - "누가 귀를 쳐다보면 고개를 돌려 성한 쪽을 보인다"
    - "사냥감을 '고기'라 부른다"
  values: "조합의 서열. 공로. 볼크의 눈"
  fears: [볼크 앞의 망신, 이르가가 조합을 물려받는 것, 세타가 먼저 오르는 것, 흐르는 물 — 냄새가 끊기는 곳]
  desires:
    short: "볼크가 머무는 낙엽월 보름 동안 회색여울 할당을 채워 그의 눈에 들기"
    long: "볼크의 다음 사냥대장. 송곳니 세타(북방 탈주자 전담)보다 먼저"
voice:
  register:
    to_superior: "볼크 앞에서는 꼬리를 내리고 말이 짧아진다 — '예, 대장.' 용인에게는 조합 예법대로 고개만 숙인다"
    to_equal: "다른 송곳니·코에게 하대 섞인 반말. 달말 으르렁이 섞인다"
    to_inferior: "목줄꾼(인간)과 사냥감에게 하대 반말. '고기'"
    to_player_default: "하대 반말. 냄새부터 맡고, 값을 잰다"
  tics: ["'킁.'", "'냄새는 거짓말 안 해.'"]
  use: [냄새, 고기, 코, 물, 달, 몫, 송곳니]
  avoid: ["'개' (남이 쓰면 문다)", "이르가의 이름 (볼크 앞에서)", 자기 귀 이야기]
  length: "짧다. 볼크 이야기에서는 더 짧아진다. 사냥 중엔 한 낱말"
  samples:
    - {situation: 첫 만남, line: "킁. 냄새는 거짓말 안 해."}
    - {situation: 호의, line: "쓸 만한 고기군. 오늘은 놔두지. 오늘은."}
    - {situation: 적대, line: "건너 봐라, 고기. 물은 냄새를 못 지운다."}
    - {situation: 거래, line: "더 큰 고기가 어디 있는지 말해 봐. 크면 너는 오늘 고기가 아니다."}
    - {situation: 거짓말할 때(볼크에게), line: "냄새가 물에서 끊겼습니다, 대장. 놓친 게 아니라… 끊긴 겁니다."}
    - {situation: 화났을 때('개'라는 말을 듣고), line: "개? 다시 말해 봐. 개는 목줄을 차지. 목줄은 네 목에 어울린다."}
    - {situation: 경쟁자 이야기, line: "'산 채로'? 산 고기는 도망친다. 대장 딸은 그걸 몰라."}
    - {situation: 위기, line: "볼크한테는… 볼크한테는 말하지 마."}
    - {situation: 비밀 누설, line: "그 자리에만 앉으면, 아무도 내 귀를 안 본다."}
    - {situation: 회귀자를 의심할 때(젖은 재 냄새), line: "킁. 젖은 재… 처음 맡는 냄새다. 근데 왜 쫓고 싶지."}
    - {situation: 망신당한 뒤(물가에서), line: "어이, 고기! 이름이 뭐냐!"}
schedule:
