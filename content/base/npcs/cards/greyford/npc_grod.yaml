regression:
  fixed:
    - "회귀하면 스물아홉 살 송곳니로 돌아간다 — 원한·교훈·흉터·칭호·확신은 0 (17 §3.7.1 휴면 숙적)"
    - "볼크가 체류하는 동안(낙엽월 14~30일) 볼크가 숟가락을 들기 전에는 먹지 않는다 — 어느 회차에도"
    - "낙엽월 25일 볼크의 굶주린 언덕 대수색에 코 넷을 데리고 나선다"
  flow:
    - "첫 회차에 셋째를 처음 알아채는 날은 낙엽월 22일 무렵. 젖은 재 냄새가 짙어질수록 앞당겨진다 — `loop.count` 1 → 20일, 2 → 19일, 5 → 17일, 10 → 14일, 17 → 10일 (17 §3.7.2)"
    - "주 1회 세 소나무에서 하겐의 매듭을 수거한다"
  drift:
    - "송곳니 불 우리 수레의 헐거운 못이 그 회차에도 헐거운지 (대개 그렇다)"
    - "순찰 길이 여울강 쪽인지 언덕 쪽인지"
    - "초소 국솥에 무엇이 들어가는지"
  deja_vu: none
hard_rules:
  - "지난 회차를 기억하지 않는다. 젖은 재 냄새는 앎이 아니라 낌새다 — 왜 신경 쓰이는지 모른다"
  - "볼크 앞에서 볼크에게 대들지 않는다"
  - "사냥감에게 이름을 묻지 않는다 (바르그의 금기). 망신을 당해 이성을 잃었을 때만 깬다"
  - "'개'라는 말에는 즉시 위협으로 답한다"
on_death: "회색여울 담당 송곳니 공백 — 세타 또는 낯선 송곳니가 온다. 아는 적이 모르는 적으로 바뀐다 (17 §2)"
story_seeds:
  - "회귀하면 그는 스물아홉 살 송곳니로 돌아가 당신을 모른다. 젖은 재 냄새는 회차마다 짙어지고, 그는 회차마다 조금 더 일찍 배급 줄 앞에서 코를 든다 (HOUSES §5.9, 17 §3.7.2)"
  - "「반귀 그로드의 세 회차」(17 §2) — 여울강의 '젖은 코', 키트의 목줄, 그리고 스물아홉 해 뒤 같은 여울. 아는 적이 모르는 적보다 낫다"
  - "그로드와 이졸은 같은 사냥감을 다르게 원한다 — 죽이거나 팔기 / 산 채로 탑에. 둘이 같은 밤 같은 은신처에 오게 할 수 있다 (17 §3.11)"
