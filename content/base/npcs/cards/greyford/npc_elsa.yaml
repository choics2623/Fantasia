life:
  - {year: 242, age: 0, event: "바알카르 아래 도시 노예 막사에서 태어남"}
  - {year: 261, age: 19, event: "재열병을 앓고 눈동자에 옅은 잿빛 고리 자국이 남음. 잔향 징후자로 고발되어 화형 명단에 오름 — 모르바 늪으로 달아났다. 그해 그녀 대신 징후자 아이 셋이 불탔다"}
  - {year: 261, age: 19, event: "늪 마녀 회합 쑥 계보에 입문. 첫째 노파에게 약초 진명과 빌린 혈명을 배움"}
