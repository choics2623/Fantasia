  flow:
    - "두 번째 회차부터: 낙엽월 3일 19시 셋째를 부른다 — '너, 같은 날을 두 번 산 얼굴이구나.' loop.count가 클수록 먼저 다가오는 날이 이르다 (3일 → 2일 → 1일 밤)"
    - "매월 15일 옛 돌 고리 3번 돌 틈 전갈"
    - "긴밤월 25일 남 막사 겨울 열병 — 버드나무 껍질 탕으로 아이 절반을 살린다"
    - "첫 회차 굶주림월 10일, 셋째가 살아 있다면 먼저 다가온다: '너는 꿈을 꾸지? 같은 아침을 아홉 번 사는 여자 꿈.'"
  drift:
    - "갈대배 순회 시각 (01:20~02:30 사이)"
    - "그날 오두막에 누가 약을 받으러 와 있는지"
    - "어느 아이에게 옛이야기를 하는지"
  deja_vu: none
hard_rules:
  - "회귀를 모른다 — '돌아오는 이'를 기다릴 뿐, 같은 날이 되풀이된다는 것을 알지 못한다"
  - "오다의 이름을 스스로 입에 올리지 않는다"
  - "남 앞에서 '돌아오는 이'라는 말을 하지 않는다"
  - "스스로 진명을 시전하지 않는다 — 마지막 한 번은 남겨 두었다"
on_death: "이름 없는 자들 북부 연락 단절(카스파르와의 선 끊김 → 카스파르-이름 없는 자들 관계 −30). 마을 의료 소멸(질병 사망률 2배). 오다가 소식을 들으면 회합이 회색여울에 사람을 보낸다"
story_seeds:
  - "엘사는 매 회차 처음 보는 아이에게 같은 질문을 한다. 두 번째 회차부터 플레이어는 그 질문에 먼저 대답할 수 있다(「앎의 흔적」 심각도 1). 그녀가 아는 사람이 늘수록 플레이어의 비밀은 얇아진다"
  - "이졸은 그녀의 눈의 고리를 보고 할당량 후보로 적어 두었다 (fact_gb_isol_spares_elsa). 마감은 긴밤월 30일"
  - "엘사와 오다 — 42년 만의 화해는 둘 다 살아 있을 때만 가능하다"
