  - {year: 270, age: 28, event: "여덟째 자리에 오를 날을 앞두고 첫째 노파와 다툼 — '낱말을 늪 밖 아이들에게도 가르치자'. 늪을 떠남. 그 뒤로 주술을 거의 끊었다"}
  - {year: 272, age: 30, event: "이름 없는 자들에 들어감. 다른 이름으로 바알카르 궁 노예 구역의 산파가 되었다"}
  - {year: 277, age: 35, event: "궁에서 노예 엘레나의 출산을 받음 — 반용 아기. 엘레나의 피가 멎지 않아 빌린 혈명을 썼다 (42년간 세 번 중 첫째). 같은 방의 노라가 곁에 있었다"}
  - {year: 279, age: 37, event: "레이번 성채에 산파로 '팔려' 옴. 이름 없는 자들 회색여울 심지"}
  - {year: 298, age: 56, event: "배급 막사의 절름발이 브람을 찾아가 잿빛 실 회색여울 매듭을 묶음 — 물총새 말뚝, 수탉 지하, 옛 수로, 갈대배"}
  - {year: 308, age: 66, event: "목줄장 마르타의 딸 리즈가 열병으로 죽어 가자 두 번째로 주술을 씀. 값으로 마르타는 탈주 일가 하나를 못 본 척했다"}
  - {year: 310, age: 68, event: "옛 돌 고리 3번 돌 틈에 처음 전갈을 남김 — 그녀가 받아낸 아기, 이제 까마귀 문 사령관에게. 그는 그녀가 누구인지 모른다"}
  - {year: 312, age: 70, event: "수확월, 시그리드가 데려온 에길 일가를 브람의 지하로 보냄. 문설주에 숯 원을 그은 아이가 넷"}
appearance:
