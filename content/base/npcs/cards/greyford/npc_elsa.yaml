  - "손톱 밑이 영원히 초록색 (이끼 염료)"
  - "눈동자에 아주 옅은 잿빛 고리 — 열아홉에 앓은 재열병 자국일 뿐이다"
smell: "쑥과 늪물, 말린 개구리 단지, 솥에서 늘 끓는 쓴 버드나무 껍질"
voice_sound: "갈라진 혀로 내는 쉰 속삭임. 웃음은 마른 갈대 부딪는 소리"
personality:
  disposition: {용기: 40, 자비: 55, 정직: -10, 신앙: 50, 탐욕: -60, 충성: 85}
  temperament: [수수께끼, 인내, 오래된 죄책]
  habits:
