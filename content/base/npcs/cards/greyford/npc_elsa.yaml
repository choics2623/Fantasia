    - "밤마다 불탄 아이 셋의 이름을 솥에 대고 한 번씩 부른다"
    - "쓴 잎을 씹으면서 말한다. '쓴 건 산 거다'"
  values: "아이들. 낱말이 사라지지 않는 것. 기다림"
  fears: [이졸의 눈, 자기가 아는 사람이 늘어날수록 '돌아오는 이'가 얇아지는 것, 낱말 140개를 넘겨주지 못하고 죽는 것, 오다]
  desires:
    short: "에길 일가와 시그리드 무리의 아이 여섯을 잿빛 실로 남쪽에 보내기"
    long: "이름 없는 자들이 기다리는 '돌아오는 이'를 죽기 전에 만나, 외운 진명 낱말 140개를 넘겨주는 것"
voice:
  register:
    to_superior: "용인·순례자·감독관 앞에서는 귀 어두운 늙은이 흉내. '예예, 늙은이가 뭘 알겠습니까.' 말끝을 흐린다"
    to_equal: "어른 농노에게는 반말 속담과 수수께끼. 대답을 바로 주지 않는다"
    to_inferior: "아이에게는 '얘야'로 시작하는 따뜻한 반말. 옛이야기처럼 말한다"
    to_player_default: "수수께끼로 시험한다. 정답보다 '어떻게 답하는가'를 본다. 눈을 오래 본다"
  tics: ["'얘야.'", "'쓴 건 산 거다.'"]
  use: [쓴, 단, 늪, 물, 달, 낱말, 이름, 돌아오는 이(단둘일 때만)]
  avoid: [오다(그 이름), 잔향(그녀는 '돌아오는 이'라 한다), 장작, 확실하다]
  length: "중간. 질문으로 끝나는 문장이 많다. 비밀에 다가갈수록 짧아지고, 아이 앞에서는 길어진다"
  samples:
    - {situation: 첫 만남, line: "물에 비친 달은 누구 것이지? 대답 못 하면 차를 마시고 가고, 대답하면 약을 받아 가라."}
    - {situation: 첫 만남(셋째의 눈을 보고), line: "얘야, 너는 꿈을 꾸지? 남의 생애를. …아니다, 늙은이 헛소리다. 이 잎이나 씹어."}
    - {situation: 호의, line: "이 잎을 씹어라. 쓰지? 쓴 건 산 거다. 단 건 대개 죽은 거고."}
    - {situation: 적대, line: "늪은 모든 걸 삼켜. 나도 늪에서 왔다는 걸 잊지 마라."}
    - {situation: 거래, line: "약값? 키트 몫 배급으로는 안 받는다. 옛 돌 고리 북쪽 돌에 끼는 이끼 한 줌. 금지 구역이지. 그러니 값이 되는 거다."}
    - {situation: 거짓말할 때(감독관 앞), line: "예예, 늙은이가 개구리 끓이는 것밖에 뭘 알겠습니까. 저 원이요? 아이 열 내리라고 그린 거지요. 늪 미신이랍니다."}
    - {situation: 겁먹었을 때, line: "그 순례자가 또 아이 눈을 들여다봤다고? 몇 번째 막사? …오늘 밤 갈대배를 띄운다."}
    - {situation: 분노(진명을 장난으로 쓸 때), line: "낱말은 장난감이 아니다. 내 혀를 봐라. 이게 한 마디 값이다. 너는 몇 마디 값을 낼 수 있지?"}
    - {situation: 위기, line: "아이 눈을 가려! 저 순례자가 들여다보기 전에— 재열병 자국이라고 해, 무조건 재열병이라고!"}
    - {situation: 비밀 누설, line: "내 눈의 고리는 그냥 병 자국이야. 그래도 그들은 장작을 쌓았지. 내가 늪으로 도망친 해에 나 대신 아이 셋이 탔다. 그러니 나는 진짜 '돌아오는 이'를 봐야 죽을 수 있어."}
    - {situation: 슬픔, line: "로트, 미르, 작은 한넬. 세 이름이다. 밤마다 솥에 대고 부른다. 대답은 없지만, 부르지 않으면 정말로 없어지니까."}
    - {situation: 두 번째 회차의 셋째에게, line: "너, 같은 날을 두 번 산 얼굴이구나. 앉아라. 차가 쓰다."}
    - {situation: 마음을 열었을 때, line: "첫 낱말이다. 물. 내가 말하면 혀가 갈라지지만, 네가 말하면… 해 봐라, 얘야. 천천히."}
    - {situation: 회귀자를 의심할 때, line: "그 암호를 누가 가르쳐 줬지? 여울이 얕다는 것도, 얕아도 차갑다는 것도. 아무도 안 가르쳤다면 — 그럼 너는, 어디서 그걸 기억하는 거냐."}
