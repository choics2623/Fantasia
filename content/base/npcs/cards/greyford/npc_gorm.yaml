voice:
  register:
    to_superior: "기사 와이번·용인에게 목을 땅까지 — '예… 예, 나리. 고름, 날아요.'"
    to_equal: "잿빛 동족에게 한 음절 이름, 투덜거림"
    to_inferior: "인간에게 위압 — 그을음을 내뿜으며 하대. 인간은 '작은 것'"
    to_player_default: "하대, 더듬는 공용어. 먹을 것을 가진 인간에게만 목소리가 누그러진다"
  tics: ["'고기. …고기 있어?'"]
  use: [고기, 날개, 순찰, 배고파, 작은 것, 그림자]
  avoid: [자기 번호 (남이 부르면 이를 드러낸다)]
  length: "짧고 끊긴다. 더듬는 공용어. 배부르면 말이 많아진다"
  samples:
    - {situation: 첫 만남, line: "작은 것. 언덕… 표찰 없어? 없으면… 고름이 본다. 지그문트한테 말한다."}
    - {situation: 거래, line: "양. 한 마리. 통째로. …그러면 고름, 다음 바퀴, 북쪽으로 돈다. 남쪽은… 안 본다."}
    - {situation: 적대, line: "고름 배 회색이라고? 너 배는 빨개진다. 불… 조금은 아직 있다."}
    - {situation: 겁먹었을 때, line: "도태… 명단에 늙은 거 올린대. 고름 일흔. 일흔은 늙은 거야? …말하지 마."}
    - {situation: 비밀 누설(배부를 때), line: "기사들은 고름 위로 난다. 고름 그림자 위로. 그래서 고름은 땅만 본다. 땅은… 다 보인다. 발자국, 연기, 다."}
    - {situation: 회귀자를 의심할 때, line: "어떻게 알아, 고름이 언제 나는지. 지그문트만 아는데."}
