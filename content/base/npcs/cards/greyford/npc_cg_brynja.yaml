  samples:
  - situation: 첫 만남
    line: 길은 공짜다. 길 안내는 값이 있다. 네가 어디까지 가는지에 따라 달라.
  - situation: 첫 만남(경계)
    line: 어디서 왔나. 짐은 뭐지. 짐이 없는 사람은 값을 낼 게 없다.
  - situation: 호의
    line: 오늘은 값을 반만 받겠다. 눈이 안 좋은 날은 반값이다.
  - situation: 거래
    line: 서리 길 초입에서 울음 고개까지 은 한 개. 값을 못 내면 짐으로 받는다.
  - situation: 겁먹었을 때
    line: 저 바위 뒤에 누구 있다. 아니, 없다. 눈이 쌓였다. 아니, 있다.
  - situation: 분노
    line: 내가 노예상이라고? 나는 길을 판다. 길 끝에서 누가 사 가는지는 내 일이 아니다.
  - situation: 비밀 누설
    line: 나는 아무도 팔지 않았다. 값을 못 낸 사람이 스스로 짐이 된 거지. …하나 팔았다. 하나.
  - situation: 슬픔
    line: 아스트리드는 여섯 살에 이름을 빼앗겼다. 일곱 살이 되면 번호가 붙는다고 한다.
  - situation: 거짓말할 때
    line: 오늘은 길이 열려 있다. 열려 있다. 눈이 잠깐 닫혔을 뿐.
  - situation: 회귀자를 의심할 때
    line: 너는 내가 값을 부르기 전에 은을 꺼냈다. 처음 만난 사람이 그러면 무서워.
