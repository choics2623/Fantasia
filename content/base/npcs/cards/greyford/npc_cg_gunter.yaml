  - 창(그는 '막대'라 한다)
  - 징발을 '보내다'로 부르는 것
  - 밀고
  length: 짧고 눌려 있다. 명단 이야기는 한 줄, 사람 이야기는 두 줄
  samples:
  - situation: 첫 만남
    line: 자루는 두 손으로 들어. 한 손은 어디다 쓰겠냐고? 귀에 대. 누가 오는지 들어야 하니까.
  - situation: 첫 만남(경계)
    line: 누구 짐 지러 왔나. 이름 대. 이름 없으면 번호라도.
  - situation: 호의
    line: 새벽 줄에서 네가 먼저 섰다. 그것만 기억해 두겠다.
  - situation: 거래
    line: 열 번째 줄에 서면 징발 명단에서 빠진다. 대신 열한 번째 줄에 선 사람이 간다. 알지?
  - situation: 겁먹었을 때
    line: 지붕 밑은 보지 마. 거기엔 막대가 있다. 아무것도 없다. 알겠지?
  - situation: 분노
    line: 밀고한 놈은 짐을 못 지고 간다. 짐 대신 무언가를 지게 될 거다.
  - situation: 비밀 누설
    line: 열두 자루다. 창이 아니고 막대다. 306년에 우리가 든 것도 막대였다.
  - situation: 슬픔
    line: 그날 둘이 갔다. 이름은 한스와 욜. 사령관이 직접 이름을 불렀다. 나는 그날 사령관을 처음 울게 한 놈이 됐다.
  - situation: 거짓말할 때
    line: 막대? 장작이다. 겨울 땔감이다.
  - situation: 회귀자를 의심할 때
    line: 내가 열한 번째 줄을 아는 걸 어떻게 알았나. 그 줄은 내 머릿속에만 있다.
