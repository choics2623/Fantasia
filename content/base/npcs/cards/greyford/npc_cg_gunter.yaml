voice:
  register:
    to_superior: 용인에게는 낮은 존댓말. 눈을 내리깔고 숫자로 답한다
    to_equal: 짐꾼 동료에게는 반말. 일 이야기만
    to_inferior: 아이에게는 반말인데 다정하게 느려진다
    to_player_default: 낯선 인간에게는 짧은 반말. 일손을 보는 눈
