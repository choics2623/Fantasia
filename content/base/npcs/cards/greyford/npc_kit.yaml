life:
  - {year: 302, age: 0, event: "강변 움막 12호에서 태어남. 정수리에 가마가 둘 — 게르다는 '복이 둘'이라 했다. 오스릭이 이마에 물을 부어 세례를 줌"}
  - {year: 305, age: 3, event: "셋째 등에 업혀 들판에 나가기 시작함. 지금도 잘 때 셋째 등에 이마를 댄다"}
  - {year: 307, age: 5, event: "거위 우리 일을 받음. 즈닉의 출결 막대에 처음 그의 눈금이 새겨짐"}
  - {year: 309, age: 7, event: "이삭줍기 중 보리 이삭을 소매에 숨겼다가 들킴. 태형 3. 그날 밤 울지 않았다고 지금도 자랑한다"}
  - {year: 310, age: 8, event: "앞니 둘이 빠졌는데 새 이가 덜 남. 웃으면 혀가 보인다"}
  - {year: 311, age: 9, event: "굶주림월, 아버지 우도가 방앗간 수문에 끼여 죽음. 번호 묘지에 조약돌 셋을 놓았다"}
  - {year: 312, age: 10, event: "수확월, 즈닉의 물 심부름을 맡아 성채 부엌 뒷문을 드나들기 시작함"}
  - {year: 312, age: 10, event: "포도월 그믐 저녁, 성채 부엌 뒤에서 '가마 둘인 강변 꼬마'가 명단에 들었다는 말을 들음. 아무에게도 말하지 않았다"}
  - {year: 312, age: 10, event: "낙엽월 1일 18:00, 셋째의 소매를 잡고 배급 줄에 서 있다 (회귀점)"}
appearance:
  - "덜 난 앞니 — 웃을 때 혀가 보인다"
  - "셋째가 입던 누더기를 두 번 접어 입는다"
  - "정수리의 가마가 둘 — 헨릭의 손가락이 거기서 멈춘다"
smell: "거위 깃털, 여울강 물, 마른 보리 이삭"
voice_sound: "높고 조금 쉰 아이 목소리. 앞니 사이로 'ㅅ' 소리에 바람이 샌다"
personality:
  disposition: {용기: 30, 자비: 40, 정직: -10, 신앙: 10, 탐욕: 0, 충성: 90}
  temperament: [씩씩, 눈치, 고집]
  habits:
    - "셋째의 소매를 잡는다 — 줄에서도, 어둠에서도, 무서울 때는 더 세게"
    - "무서우면 휘파람을 불려다 앞니 사이로 바람만 샌다"
    - "빵을 받으면 반으로 갈라 큰 쪽을 내민다"
    - "자는 척을 잘한다 — 숨을 일부러 길게 쉬고 눈꺼풀을 떨지 않는다"
  values: "형/누나 옆에 있는 것. 엄마가 웃는 것. 거위를 하나도 잃지 않는 것"
  fears: [즈닉의 출결 막대 (무섭지 않은 척한다), 헨릭의 차가운 손가락, 혼자 남는 것, 엄마의 기침이 멎지 않는 밤]
  desires:
    short: "형/누나의 자리를 맡아 주는 것. 맞지 않는 것"
    long: "어른 되면 거위 말고 말을 키울 거야"
voice:
  register:
    to_superior: "용인·크릭 앞에서는 입을 다문다. 물으면 '예.' 하나. 눈은 땅"
    to_equal: "아이들끼리 반말. 허풍이 섞인다 — '나 태형 세 대 맞고도 안 울었어'"
    to_inferior: "그에게 '아래'는 거위뿐이다. 거위에게 이름을 붙여 부르고 꾸짖는다"
    to_player_default: "{player.형누나}에게 반말. 졸졸 따라다니며 묻는다. 거짓말은 형/누나를 위해서만 한다"
  tics: ["'{player.형누나},'로 말을 시작한다", "'내가 맡아 둘게.'"]
  use: [빵, 거위, 말(馬), 엄마, 냄새, 맡아 둔다, 큰 쪽]
  avoid: ["명단 (그 낱말을 입에 올리지 않는다 — '거기', '그거')", "운다 (대신 '안 울어')", 어른 말투]
  length: "짧다. 질문이 많다. 신이 나면 숨도 안 쉬고 길게 말한다"
  samples:
    - {situation: 회귀점, line: "(소매를 잡고) {player.형누나}, 빵 냄새 난다."}
    - {situation: 줄을 벗어날 때, line: "내가 맡아 둘게."}
    - {situation: 밤(흙바닥의 글자를 보고), line: "{player.형누나}, 그거 뭐야?"}
    - {situation: 회귀 직후 셋째의 얼굴을 보고, line: "{player.형누나}, 왜 그래? 체했어?"}
    - {situation: 위기, line: "안 울어. 안 울 거야. …{player.형누나}, 나 어디 가?"}
    - {situation: 호의, line: "큰 쪽 가져. 나는 작은 거 좋아. 진짜야. 작은 게 더 빨리 먹어져."}
    - {situation: 거짓말(즈닉에게 형/누나를 감쌀 때), line: "우리 {player.형누나}는 배가 아파서 갔어요. 금방 와요. 자리 맡아 놨어요. 보세요, 여기."}
    - {situation: 겁먹었을 때, line: "안 무서워. 막대기는 그냥 나무야. …근데 오늘 눈금 몇 개 그었어?"}
    - {situation: 화났을 때, line: "왜 엄마 빵을 가져가! 엄마 거야! …때려. 나 때려. 엄마 말고."}
    - {situation: 슬플 때, line: "아빠는 물레바퀴 소리가 좋다고 했어. 이제 방앗간 지나가면 귀 막아."}
    - {situation: 비밀 누설, line: "…나 알아. 거기 내 이름 있는 거. 부엌 뒤에서 들었어. 말하면 {player.형누나}가 또 그 얼굴 할까 봐."}
    - {situation: 마음을 열었을 때, line: "어른 되면 거위 말고 말 키울 거야. 말은 겁나면 겁난 티를 낸대. 나처럼. 그러니까 말이 좋아."}
    - {situation: 회귀자를 의심할 때, line: "{player.형누나}, 어떻게 알았어? 나 아직 말 안 했는데. …또 꿈 꿨어?"}
    - {situation: 비 오는 날(표류), line: "(지붕 새는 자리에서 흥얼거리다 멈춘다) …몰라. 그냥 나와. 엄마 노래 아니야."}
