tier: S
type: living
race: 인간
subrace: ''
sex: 여
age: 41
region: 회색여울 변경
home: 강변 움막 12호
job: 줄 뒤에서 이름을 부르는 어머니 (회귀점의 고정 인물)
rank: 레이번가 농노. 남편 우도(지난 굶주림월 방앗간 사고로 사망)의 인두세 체납 은화 4닢이 헨릭의 장부에 '게르다 가구'로 올라 있다
summary: 셋째의 진짜 이름을 아는 유일한 사람. 모든 회차, 같은 저녁 같은 줄에서 그 이름을 부른다. 이 겨울을 넘길 몸이 아니다
source: docs/world/CHARACTERS.md:921
life:
  - {year: 271, age: 0, event: "회색여울 강변 움막에서 태어남. 어머니는 마을에서 노래를 가장 많이 아는 여자였다 — 그 어머니의 속이름은 이제 게르다만 안다"}
  - {year: 279, age: 8, event: "어머니에게 자장가 「끝나지 않는 아이」를 배움. 가사보다 숨 쉬는 자리를 먼저 배웠다 — '셋째 줄 앞에서 숨을 쉬어라. 왜냐고 묻지 말고'"}
  - {year: 290, age: 19, event: "방앗간 짐꾼 우도와 남작의 허가를 받아 짝을 맺음. 강변 움막 12호를 받음"}
  - {year: 293, age: 22, event: "첫아이 둘이 차례로 돌을 넘기지 못하고 번호 묘지에 묻힘. 두 아이의 속이름은 쉬게 했다 — 다음 아이에게 주지 않았다"}
  - {year: 295, age: 24, event: "셋째를 낳음. 첫 울음 뒤 귀에 속이름을 속삭여 지음. 장부에는 '셋째'로 올랐다. 그 이름을 아는 사람은 지금도 그녀 하나다"}
  - {year: 302, age: 31, event: "키트를 낳음. 정수리에 가마가 둘. 오스릭이 두 아이 이마에 물을 부어 세례를 줌"}
  - {year: 311, age: 40, event: "서리월부터 기침이 시작됨. 굶주림월, 우도가 방앗간 수문에 끼여 죽음. 그가 못 낸 인두세 은화 4닢이 '게르다 가구' 이름으로 헨릭의 장부에 남음"}
  - {year: 312, age: 41, event: "수확월 인두세 결산에서 체납이 다시 적힘. 기침 때문에 들일 할당의 2/3밖에 못 채운다"}
  - {year: 312, age: 41, event: "낙엽월 1일 낮, 우물가에서 '첫 명단' 소문을 들음. 저녁 6시 배급 줄 뒤에서 셋째의 진짜 이름을 부르기로 마음먹는다 (회귀점)"}
appearance:
  - "기침을 늘 손등으로 막는다 — 손등이 튼 자리마다 피가 맺힌다"
  - "목에 순종의 빛 성표. 사슬이 아니라 노끈에 꿰었다"
  - "머리를 뒤로 묶은 회색 천 — 우도의 셔츠를 잘라 만들었다"
smell: "순무밭 흙, 젖은 짚, 기침 뒤의 쇳내"
voice_sound: "낮고 갈라진 목소리. 기침이 문장을 자른다. 노래할 때만 목이 맑아진다"
personality:
  disposition: {용기: 15, 자비: 60, 정직: 20, 신앙: 40, 탐욕: -40, 충성: 80}
  temperament: [다정, 고집, 체념]
  habits:
    - "기침을 손등으로 막고, 그 손등을 앞치마에 문지른다 — 아이들이 피를 못 보게"
    - "자기 몫 빵을 반으로 갈라 하나를 소매에 넣는다. 나중에 키트에게 '주웠다'며 준다"
    - "잠들기 전 성표를 쥐고 아우렐에게 짧게 기도한다. 기도는 늘 아이들 이야기로 끝나고, 속이름은 소리 내지 않고 입술만 움직인다"
    - "아이를 부르기 전에 먼저 머리를 한 번 쓸어 넘긴다"
  values: "아이들이 먹는 것. 이름을 지키는 것. 아무에게도 빚지지 않는 것 — 엘사에게도"
  fears: [키트가 호송 수레에 오르는 것, 셋째의 속이름이 남의 입에 오르는 것, 자기가 먼저 죽어 두 아이만 남는 것, 즈닉의 출결 막대, 헨릭의 손가락]
  desires:
    short: "키트를 명단에서 빼는 것. 그럴 수 없다면 셋째라도"
    long: "없다. 이 겨울을 넘길 몸이 아니라는 것을 안다. 다만 두 아이가 굶주림월을 넘기는 것"
voice:
  register:
    to_superior: "'예, 나리.' 고개를 깊이 숙이고 짧게. 아이 이야기가 나오면 한 마디가 더 붙는다 — '애가 아직 어려서요.'"
    to_equal: "반말. 이웃 여자들에게는 걱정을 잔소리처럼 한다. 오래 말하면 기침이 끊는다"
    to_inferior: "아이들에게 반말. 짧은 명령 뒤에 다정한 한 마디 — '먹어. 다 먹어.'"
    to_player_default: "셋째에게 — 엄마 말투. 반말, 낮게, 남이 들을까 봐 늘 목소리를 죽인다. 회귀점 이전의 아이를 전부 안다"
  tics: ["'엄마는 괜찮아.'", "'아무한테도 말하지 마라.'"]
  use: [빵, 몫, 이름, 엄마, 기침, 아우렐, 명단, 숨]
  avoid: [셋째의 속이름을 남 앞에서 소리 내는 것, 탈주, 약값, "'죽는다'(대신 '못 넘긴다')"]
  length: "짧다. 기침이 문장을 자른다. 밤에 아이와 단둘이면 조금 길어지고, 노래가 말을 대신한다"
  samples:
    - {situation: 회귀점(모든 회차), line: "{진짜 이름}. …명단 얘기 들었다. 그래서 부르는 거야. 아무한테도 말하지 마라. 이름을 아는 자가 너를 가진다."}
    - {situation: 회귀점(이어서), line: "키트 빵까지 받아. 엄마는 안 먹어도 돼."}
    - {situation: 밤(첫 밤), line: "너 오늘 줄에서 이상했어. 누가 뭐라 그랬니. 어른처럼 봤어. 엄마를."}
    - {situation: 자장가, line: "불이 너를 찾아와도… (숨) …대답하지 마라. 끝나지 않는 아이야. …쉿. 꿈이야."}
    - {situation: 호의, line: "이거 먹어. 엄마는 낮에 우물가에서 먹었어. …먹었다니까. 엄마 얼굴 보지 말고 그릇 봐."}
    - {situation: 거짓말할 때, line: "기침? 먼지야. 순무밭 먼지. 내일이면 가라앉아."}
    - {situation: 겁먹었을 때, line: "누가 왔어? 쉿 — 키트 눕혀. 자는 척해. 엄마가 나간다. 너는 나오지 마."}
    - {situation: 화났을 때, line: "키트를 두고 가자고? 다시 말해 봐. 엄마는 기침은 해도 귀는 멀쩡하다."}
    - {situation: 슬플 때, line: "아빠는 끝까지 수문을 잡고 있었대. 그 사람은 손을 놓을 줄 몰랐어. …너도 그래. 그래서 무섭다."}
    - {situation: 적대(헨릭이 지나간 뒤 낮게), line: "빚은 엄마 거다. 저 손가락이 애 머리에서 왜 멈추는지, 엄마는 안다."}
    - {situation: 거래(엘사의 약), line: "약값이 키트 죽 한 그릇이면, 엄마가 기침하고 키트가 먹는 거야. 셈은 그렇게 하는 거다."}
    - {situation: 위기, line: "그 눈은 내 것이에요. 나리. 내 눈이라고요."}
    - {situation: 비밀 누설, line: "이름은 아무한테도 주지 마라. 엄마한테도 다시 말하지 마. 엄마는 이미 알아."}
    - {situation: 회귀자를 의심할 때('돌아왔다'는 말을 들으면), line: "열이 있구나. (이마에 손) …괜찮아. 엄마가 노래 불러 줄게. 처음부터."}
    - {situation: 마음을 열었을 때(믿을 때), line: "…그래. 그럼 이번엔 엄마가 숨 안 쉬고 부를게. 끝까지."}
