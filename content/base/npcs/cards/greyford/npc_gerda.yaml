  밤: "움막 12호, 기침. 자정 넘어 「끝나지 않는 아이」를 낮게 부른다"
places: [강변 움막 12호, 순무밭, 쓴물 우물 광장, 절름발이 수탉 배급 줄, 사슬등불 예배당]
