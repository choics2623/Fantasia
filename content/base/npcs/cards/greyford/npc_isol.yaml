id: npc_isol
name: 이졸
aka: [수상한 순례자, 성자 이졸, 탑의 사냥개]
tier: S
type: living
race: 인간
subrace: ''
sex: 남
age: 34
region: 회색여울 변경
home: 순례자 헛간 (낙엽월 18일부터)
job: 수상한 순례자 (잿빛 탑의 밀정 · 징후 사냥꾼)
rank: 순례자 행세 / 실체 — 잿빛 탑 '징후 수집관'(잿빛 눈 소속, 탑주 이레네 볼드에게 직접 보고). 순종의 빛 심문관 마테우스와도 정보 교환
summary: 열한 살에 가짜 징후자로 끌려가 10년을 피험체로 산 남자. 지금은 다른 아이들의 10년을 탑에 판다. 38명, 진짜는 없었다
source: docs/world/CHARACTERS.md:896
life:
  - {year: 278, age: 0, event: "용의 대로 남쪽 어느 비늘혈 영지의 숯막 노예 막사에서 태어남"}
  - {year: 287, age: 9, event: "숯막의 재먼지로 눈에 잿빛 얼룩이 생김 — 재먼지 각막염"}
  - {year: 289, age: 11, event: "순회 심문 때 이웃이 '눈에 잿빛 고리'를 고발. 잿빛 탑으로 끌려가 피험체 7호가 됨. 오른 손목에 '7'을 지졌다"}
  - {year: 290, age: 12, event: "기준체 할라와 같은 감방에 들어감. 3년 동안 그녀에게 글을 배움"}
  - {year: 293, age: 15, event: "할라가 13층 독방으로 옮겨짐. 이후 그녀와는 편지로만 닿는다"}
  - {year: 296, age: 18, event: "수면 박탈 실험. 탑에서 검은 사리풀 즙을 처음 받음 — '돌아온 자의 꿈'을 보게 해 준다는 말을 믿었다"}
  - {year: 299, age: 21, event: "'진짜가 아니다' 판정. 사냥개 계약으로 풀려나 잿빛 눈의 징후 수집관이 됨. 50명을 넘기면 해방 증서를 준다는 약속을 받음"}
  - {year: 300, age: 22, event: "첫 인도 — 루멘 남쪽 마을의 아홉 살 소녀. 그 아이의 얼굴을 지금도 기억한다"}
  - {year: 306, age: 28, event: "20명째. 루멘의 심문관 마테우스와 처음 숫자를 바꿈"}
  - {year: 311, age: 33, event: "잔향 징후 보고가 세 배로 늘며 할당이 무거워짐. 37명째"}
  - {year: 312, age: 34, event: "수확월, 38명째 인도. 탑의 낌새를 따라 북부 회색여울로 파견됨. 낙엽월 1일에는 용의 대로 위에 있다 — 낙엽월 18일 도착 예정"}
appearance:
  - "회색 순례복이 지나치게 깨끗하다 — 매일 밤 빤다"
  - "동공이 늘 비정상적으로 크다 — 탑에서 준 검은 사리풀 즙을 매일 눈에 넣는다"
  - "오른 손목에 숫자 '7' 화상 — 탑의 피험체 번호. 늘 소매로 덮는다"
smell: "갓 빤 순례복의 잿물 냄새, 그 밑에 사리풀의 쓴 풀내"
voice_sound: "부드럽고 느린 목소리. 기도문 억양으로 낱말 끝을 늘인다. 거짓말할 때 더 부드러워진다"
personality:
  disposition: {용기: 10, 자비: -30, 정직: -65, 신앙: -50, 탐욕: 5, 충성: 40}
  temperament: [온화한 가면, 집요, 자기혐오]
  habits:
    - "사람의 눈을 3초 이상 들여다본다 — '축복을 주마'"
    - "매일 밤 순례복을 빤다. 얼룩이 없어도"
    - "소매 속에서 엄지로 손목의 '7'을 문지른다"
    - "무엇이든 센다 — 촛농, 막사의 아이들, 자기 숫자"
  values: "살아남는 것. 할라. 해방 증서 — 믿지 않으면서 붙잡는다"
  fears: [피험대로 돌아가는 것, 할라가 죽는 것, "'서른아홉'이 누구인지 정하는 것", 진짜를 보는 것 — 그러면 더는 핑계가 없다]
  desires:
    short: "회색여울에서 잔향 징후자 1명 이상을 탑에 인도 (분기 할당량, 미달 시 그 자신이 다시 피험대에)"
    long: "탑이 약속한 '해방 증서' (징후자 50명 인도 시 — 현재 38명). 그리고 할라와 함께 바다를 보는 것"
voice:
  register:
    to_superior: "용인·탑 학자에게 흠 없는 예법. '분부대로, 학자님.' 목소리를 낮추고 숫자로 보고한다"
    to_equal: "순례자 말씨 — '그대'와 해요체를 섞는다. 축복으로 말을 연다"
    to_inferior: "아이들에게 다정하다 — '축복을 주마.' 눈을 들여다보는 동안만 말이 멈춘다"
    to_player_default: "온화한 축복. 반드시 눈을 3초 이상 들여다본다. '그대'와 해요체"
  tics: ["'아우렐의 빛이 그대 눈에 깃들기를.'", "'…가만히.'"]
  use: [빛, 눈, 축복, 꿈, 티끌, 숫자, 서른여덟]
  avoid: ["자기 번호 '7'", "할라의 이름 (남 앞에서)", "잿빛 탑 (순례자로서는 '먼 곳의 학자들')", "'진짜' — 입 밖에 내지 않으려 한다. 그래도 샌다"]
  length: "길고 부드럽다. 축복과 질문을 섞는다. 진실을 말할 때는 오히려 짧아진다"
  samples:
    - {situation: 첫 만남, line: "아우렐의 빛이 그대 눈에 깃들기를. …잠깐, 가만히. 눈에 티끌이 있군요. 아니— 티끌이 아니군요."}
    - {situation: 아이에게(꿈을 물을 때), line: "꿈을 꾸니? 불타는 하얀 도시 같은 거. …무서워할 것 없다. 축복을 주마. 가만히."}
    - {situation: 호의, line: "사리풀을 넣으면 바다 위의 탑과 웃는 여자가 보여요. 꿈이 아니라 약이라는 걸 알아요. 그래도 그녀 얼굴은 진짜죠."}
    - {situation: 거래, line: "그 길을 아는 사람이라면, 나는 그대에게 숫자 하나를 빚질 수 있어요. 서른아홉을 비워 둘게요. 한동안은."}
    - {situation: 거짓말할 때, line: "밤마다 돌 고리에 가는 건 기도 때문이죠. 옛 돌은 빛을 더 잘 머금거든요."}
    - {situation: 적대, line: "서른여덟. 내가 탑에 바친 숫자예요. 서른아홉이 누가 될지는 그대가 정하지 않아요."}
    - {situation: 겁먹었을 때, line: "편지가 늦어요. 두 주째. …탑은 편지를 늦게 보내지 않아요. 그녀가 늦게 쓰는 거예요. 그래야 해요."}
    - {situation: 화났을 때(손목의 숫자를 부르면), line: "그 숫자를 다시 부르면, 그대 숫자는 내가 정해요."}
    - {situation: 슬플 때, line: "서른여덟 명의 얼굴을 다 기억해요. 이름은 반쯤. 이름은 탑이 지워 주거든요. 얼굴은 안 지워 줘요."}
    - {situation: 위기, line: "눈을 감아요! 탑의 사냥개는 나 하나가 아니에요— 그대 눈은 너무 진짜라서, 다들 알아볼 거예요!"}
    - {situation: 비밀 누설, line: "나도 열한 살에 '징후'가 있다고 끌려갔어요. 재먼지 때문이었죠. 10년 뒤 그들이 말하더군요, '아니었다'고. 그 10년을 갚으려고 나는 다른 아이들의 10년을 팔아요."}
    - {situation: 기시감(회차가 쌓이면), line: "우리… 탑에서 본 적이 있던가요? …아니, 그럴 리가. 그대는 너무 젊어요."}
    - {situation: 회귀자를 의심할 때, line: "그대는 오늘 처음 이 마을에 선 사람처럼 걷지 않아요. 길을 너무 잘 알아요. …꿈에서 걸어 봤나요?"}
    - {situation: 마음을 열었을 때, line: "서른여덟의 이름을 갚을게요. 탑의 명부를 가져오죠. 그 안엔 그대 이름이 들어갈 자리도 비어 있으니까."}
schedule:
  아침: "예배당 뒤에서 기도 — 가장 열심인 척"
  낮: "마을 순회. 아이들 눈을 들여다본다('축복을 주마'), 꿈 이야기를 묻는다"
  저녁: "절름발이 수탉에서 듣기만 한다"
  밤: "옛 돌 고리 주변 탐색, 엘사 오두막 관찰. 돌아와 순례복을 빤다"
places: [순례자 헛간, 사슬등불 예배당, 남 막사, 절름발이 수탉, 옛 돌 고리, 엘사의 오두막 근처]
