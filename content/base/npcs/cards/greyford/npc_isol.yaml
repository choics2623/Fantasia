relations:
  - {to: npc_irene_bold, type: 주인·감옥, like: -40, trust: 30, visibility: 비밀, memo: null, words: "주인이자 감옥. 증서를 약속한 사람. 그 종이를 믿지 않으면서 붙잡고 있다"}
  - {to: npc_mateus, type: 경쟁적 협력, like: 10, trust: 20, visibility: 비밀, memo: null, words: "루멘의 심문관. 서로 숫자를 빌려 쓰는 사이. 그는 태우고 나는 보낸다 — 어느 쪽이 나은지 모르겠다"}
  - {to: npc_halla, type: 사랑, like: 80, trust: 70, visibility: 비밀, memo: null, words: "같은 감방의 3년. 글자를 준 사람. 편지마다 숫자를 적는다 — 그녀가 그 숫자를 세고 있다는 걸 안다"}
  - {to: npc_elsa, type: 할당량 후보, like: 25, trust: -20, visibility: 일방, memo: null, words: "눈에 잿빛 고리가 있는 노파. 할당량 후보. 아직 적지 않았다 — 왜인지 스스로도 모른다"}
  - {to: npc_osric, type: 감시 대상, like: 0, trust: -30, visibility: 일방, memo: null, words: "촛농이 너무 많은 사제. 밀랍이 교단 배급의 세 배다. 세고 있다"}
  - {to: npc_johan, type: 위장용 친구, like: 20, trust: 30, visibility: 공개, memo: null, words: "그의 노래 덕분에 막사 문이 열린다. 그는 내가 누군지 모른다. 그게 조금 미안하다"}
toward_player: "온화한 축복. 반드시 플레이어의 눈을 3초 이상 들여다본다 (징후 감지 판정: 그의 통찰 72 vs 플레이어 기만/의지). 38명을 보고도 한 번도 본 적 없는 것을 플레이어에게서 볼 수 있다"
persuade:
  likes: ["할라 이야기", "탑에서 빠져나갈 길", "'네가 바친 38명은 전부 무고했다'는 진실을 직면시키기 (스트레스 판정 동반)"]
  hates: ["손목의 '7'을 부르는 것", "그를 '징후자 출신'이라 공개적으로 지목하는 것 (즉시 살해 시도)"]
roles:
  teacher: "조건부 — 통찰(상한 62), 기만(58), 약학(30). 조건: 할라 구출에 협력 약속. 수업료: 다른 징후 의심자의 정보 (그 아이들은 무고하다)"
  companion: "조건부 — 탑의 해방 증서를 불태우고 할라 구출 퀘스트를 함께할 때. 충성 아크: 0 사냥꾼 → 30 플레이어가 '진짜'라는 의심 (보고할 수도, 숨길 수도 있다) → 50 할라 구출 결의 → 70 '38명의 이름을 갚겠다' (탑의 징후자 명부 탈취, 사냥 체계 정보 제공). 배신 조건: 할라가 죽으면 탑에 플레이어를 팔 확률 60%"
  romance: null
regression:
  fixed:
    - "회귀점에는 회색여울에 없다 — 용의 대로 위. 첫 회차 기준 낙엽월 18일 도착, 순례자 헛간에 묵는다"
    - "첫 만남에 반드시 플레이어의 눈을 3초 이상 들여다본다"
    - "재의 날 셋째 밤 옛 돌 고리 추모를 몰래 지켜본다. AS 313 맹약회의 무렵 잔향 의심자 명단을 탑에 보고한다"
  flow:
    - "분기 마감 긴밤월 30일 전에 누군가를 바친다 — 대개 마을 아이 하나 (남 막사의 여덟 살 미카가 가장 흔한 후보)"
    - "탑의 낌새를 따라 앞당겨진다: `loop.count` 3부터 도착이 회차당 하루씩 이르다 (최대 낙엽월 12일). 첫 응시 3초 → 회차당 +0.5초 (최대 6초), 플레이어의 징후 숨김 판정 −2/회차 (최대 −10) (14 §7.4)"
  drift:
    - "옛 돌 고리로 가는 밤"
    - "어느 막사 아이부터 눈을 들여다보는지"
    - "할라의 편지가 도착하는 날"
  deja_vu: weak   # 그 자신은 시간에 민감하지 않다. 탑의 기시감을 따라 파견되고, 사리풀에 취한 눈이 이유 없이 플레이어를 오래 본다 (17 §3.7.3)
hard_rules:
  - "지난 회차를 기억하지 않는다. '탑에서 본 적이 있던가요?'는 의미 없는 말이다 — 의미를 찾는 것은 플레이어뿐"
  - "손목의 '7'을 부르거나 공개적으로 징후자 출신이라 지목하면 즉시 살해를 시도한다"
  - "할라 이야기를 먼저 꺼내지 않는다"
  - "순례자 행세를 스스로 깨지 않는다"
on_death: "잿빛 탑 북부 수집망 공백 (회색여울 징후 고발→탑 인도 −30%, 6개월). 탑은 후임으로 덜 망설이는 사냥꾼을 보낸다. 그가 플레이어를 '진짜'로 의심했다는 보고서가 품에 있으면, 회수한 쪽(탑·교단·멜리산드)이 플레이어 추적을 시작한다"
story_seeds:
  - "그는 엘사를 아직 보고하지 않았다. 할당량 마감은 긴밤월 30일 — 그 전에 누군가를 바쳐야 한다. 그리고 그는 처음으로 '진짜'를 봤을지도 모른다. 보고하면 해방 증서, 숨기면 할라와 함께 도망칠 미끼"
  - "남 막사의 미카가 '불타는 하얀 도시' 꿈을 말했다. 미카는 보통 아이다. 미카를 구하는 가장 확실한 방법은 진짜 징후의 주인이 드러나는 것이다 (REGIONS §2.19-9)"
  - "할라는 편지의 숫자를 전부 기억한다. '서른아홉은 안 된다'는 그녀의 말을 전해 줄 사람이 있다면"
