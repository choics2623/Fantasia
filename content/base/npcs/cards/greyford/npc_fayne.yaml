  companion: "가능(핵심 동료, 비연애). 충성 아크: 0 장사꾼 → 30 비밀 하나 공유(하겐의 정체) → 50 증언할 각오 → 70 '형(누나)이 죽으면 내가 이어서 한다'(그 회차 안에서 당신의 일을 잇는다 — 당신이 죽으면 그 회차는 접히고, 페인은 배급 줄에서 처음 보는 눈으로 당신을 본다). 배신: 굶주림 상태 7일 이상 방치 시 하겐에게 정보를 팔 확률 30%"
  romance: null
regression:
