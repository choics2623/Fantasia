life:
  - {year: 296, age: 0, event: "남 막사에서 농노의 아들로 태어남"}
  - {year: 300, age: 4, event: "아버지가 북쪽 벌목지에서 쓰러진 나무에 깔려 죽음"}
  - {year: 303, age: 7, event: "어머니가 겨울 열병으로 죽음. 남 막사 아이 구석에서 혼자 자기 시작"}
  - {year: 305, age: 9, event: "성채 부엌 뒷문에서 잔반을 훔치다 크릭 하인에게 맞아 코가 처음 부러짐"}
  - {year: 307, age: 11, event: "서리월 밤, 헝겊 감은 발로 순무를 캐다 동상으로 발가락 하나를 잃음. 엘사가 손목에 부적 끈을 감아 주었다"}
  - {year: 309, age: 13, event: "나루의 하겐이 빵을 주며 심부름꾼으로 거둠. 처음으로 매일 먹었다"}
  - {year: 310, age: 14, event: "세 소나무 근처 갈대숲에서 하겐이 양치기 울프의 목을 조르고 아직 숨 쉬는 그를 여울강에 발로 미는 것을 봄. 숨도 못 쉬었다"}
  - {year: 311, age: 15, event: "하겐의 손에 코가 두 번째로 부러짐 — '심부름이 늦었다'고. 방앗간 토마스가 다락에서 자게 해 주기 시작"}
  - {year: 312, age: 16, event: "오스릭이 사라에게 글을 가르치는 것을 예배당 창문 너머로 보고 글자 넷을 익힘 — 물, 빵, 불, 그리고 '나'. 하겐이 판 열아홉 중 일곱의 이름과 날짜를 외운다"}
appearance:
  - "두 번 부러졌다 붙은 코가 왼쪽으로 휘었다"
  - "신발 대신 헝겊으로 감은 발 — 발가락 하나가 동상으로 없다"
  - "머리에 늘 짚 부스러기, 손목에 엘사가 감아 준 해진 부적 끈"
smell: "밀가루와 짚, 강물에 젖은 헝겊"
voice_sound: "변성기가 덜 끝난 갈라진 목소리. 빠르게 말하다가 겁이 나면 뚝 끊긴다"
personality:
  disposition: {용기: 20, 자비: 30, 정직: -30, 신앙: -50, 탐욕: 20, 충성: 10}
  temperament: [영악, 겁, 외로움]
  habits:
    - "손바닥을 위로 내민다 — 무엇이든 받고 나서 말한다"
    - "높은 데(처마·지붕·바위)에 올라가 있어야 말을 한다"
    - "흙바닥에 손가락으로 글자를 썼다가 발로 지운다"
    - "하겐 이름이 나오면 웃는 얼굴을 만든다 — 너무 빨리"
  values: "먹을 것. 말해도 죽지 않는 곳. 키트 같은 아이들"
  fears: [하겐, 물속, 굶주림월, 자기가 아는 것이 들키는 것]
  desires:
    short: "굶주림월 넘기기"
    long: "아무에게도 말 못 한 것을 말해도 죽지 않는 곳에 가는 것"
voice:
  register:
    to_superior: "용인·크릭 앞에서는 고개를 처박고 '예, 예, 나리.' 그리고 사라진다"
    to_equal: "어른 농노에게는 '아저씨'·'누나'·'형'을 붙인 건방진 반말. 값부터 묻는다"
    to_inferior: "키트 같은 어린아이에게는 형 노릇 — 퉁명스럽게 챙긴다"
    to_player_default: "정보를 판다. '뭘 알고 싶은데? 대신 뭘 줄 건데?'"
  tics: ["'공짜는 없어.'", "'다 알아.'"]
  use: [빵, 값, 형, 누나, 지붕, 뒷문, 냄새, 노예말 은어]
  avoid: [고아, 울프(그 이름만 나와도 말을 끊는다), 물(물에 들어가는 이야기), 고맙다(그는 '갚을게'라 한다)]
  length: "빠르고 짧다. 한 숨에 여러 조각을 쏟아 낸다. 진실에 다가가면 말이 끊긴다"
  samples:
    - {situation: 첫 만남, line: "뭐 찾아? 성채 뒷문? 하겐 형? 아니면… 사라 누나? 다 알아. 공짜는 없어."}
    - {situation: 배급 줄(처마에서 손을 내밀며), line: "뭘 알고 싶은데? 대신 뭘 줄 건데?"}
    - {situation: 거래, line: "명단? 첫째는 서리월. 둘째는 겨울 끝. 둘째에 사라 누나가 들어갈 거라는 얘기도 있고. …북쪽 길 찾는 거면 하겐 형한테 가 봐. 아, 아니다. 그냥 해 본 말이야."}
    - {situation: 호의, line: "이거 봐, 내가 쓴 거야. '물.' 맞지? …맞다고 해 줘."}
    - {situation: 적대, line: "너도 똑같네. 다들 처음엔 빵 주고, 그다음엔 입 다물라고 해."}
    - {situation: 거짓말할 때, line: "하겐 형? 좋은 형이야. 빵 주잖아. 형이 나쁜 짓 하는 거 본 적 없어. 한 번도."}
    - {situation: 겁먹었을 때, line: "형이 나 찾았어? 언제? 뭐라고 했는데? …나 오늘 여기 없었던 거야, 알았지?"}
    - {situation: 위기, line: "뛰어! 오른쪽 말고 왼쪽! 오른쪽은 즈닉 놈이 맨날 오줌 싸는 데라 냄새로 들켜!"}
    - {situation: 비밀 누설, line: "울프 아저씨… 물에 넣기 전에 아직 숨 쉬고 있었어. 하겐이 발로 밀었어. 나는 갈대 속에서 숨도 못 쉬었어."}
    - {situation: 지붕 위에서 본 것을 물을 때, line: "어제 마르타 아줌마랑 무슨 얘기 했어? 나 지붕에 있었어. 소리는 못 들었어. 얼굴은 봤어."}
    - {situation: 분노(고아 소리를 들었을 때), line: "불쌍하다고? 그 말 한 사람들 다 빵은 안 줬어. 불쌍해하지 말고 빵을 줘."}
    - {situation: 슬픔, line: "엄마 얼굴은 생각 안 나. 기침 소리는 나. 키트네 엄마 기침이 그 소리랑 똑같아서, 그 움막 앞은 돌아서 가."}
    - {situation: 마음을 열었을 때, line: "형(누나)이 죽으면 내가 이어서 한다. 무슨 일이든. 그러니까 죽지 마. 이어서 하는 거 무섭단 말이야."}
    - {situation: 회귀자를 의심할 때, line: "…울프 아저씨 이름을 왜 나한테 해? 너 그때 거기 없었잖아. 아무도 없었어. 나밖에."}
