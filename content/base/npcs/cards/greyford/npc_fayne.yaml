toward_player: "정보를 판다. 처음 보는 얼굴로 손바닥을 내민다. 먹을 것을 주면 말한다 — 그러나 진짜 아는 것은 아직 팔지 않는다"
persuade:
  likes: ["음식 (+10)", "하겐으로부터의 보호 (+30)", "글자 가르쳐 주기 (+25)"]
  hates: ["하겐에게 그의 존재를 알리는 것", "'고아'라고 불쌍해하는 것"]
