life:
  - {year: 222, age: 0, event: "바알카르 아래 도시의 가문 없는 용인 서기 집안에서 태어남. 비늘이 일찍 회색으로 바랬다"}
  - {year: 260, age: 38, event: "원로회 재날개 둥지 아래 노예 배당 명부실의 견습 서기. 사람 머릿수를 세는 일을 처음 배움"}
  - {year: 281, age: 59, event: "레이번 가 징세관으로 회색여울에 부임. 첫해에 쇠다리 통행세 상자의 셈을 두 번 맞추었다"}
  - {year: 298, age: 76, event: "남작의 빚이 시작되자 곡창의 국경군 납품분 일부를 용주 역참 상인 도르반에게 빼돌리기 시작"}
  - {year: 311, age: 89, event: "수확월, 남작과 짜고 인두세 머릿수를 352로 신고. 차액 48명분을 '반씩' 나누며 실제로는 3분의 2를 챙김. 장부가 두 권이 됨"}
  - {year: 312, age: 90, event: "여름, 장부가 안 맞는 '유령 머릿수'를 쫓다 브람이 사람을 숨긴 것을 눈치챔. 매주 2발톱씩 입막음 값을 받기 시작. 포도월, 남작의 빚 상황을 레아에게 팜"}
  - {year: 312, age: 90, event: "수확월 말~낙엽월 1일 아침, 1차 매각 명단을 작성. 스물여섯째 줄 게르다 가구의 아이 키트를 '하르벡'으로 적음"}
appearance:
  - "오른쪽 눈에 금테 외알 안경, 렌즈에 금이 갔다"
  - "손가락 끝마다 잉크 얼룩. 비늘은 회색으로 바래 멀리서는 인간처럼 보인다"
  - "허리에 열쇠 열한 개 꾸러미 — 걸을 때마다 짤랑거려 멀리서도 들린다"
smell: "쇠 잉크와 양피지 먼지, 열쇠 꾸러미의 녹"
voice_sound: "가늘고 상냥한 목소리. 숫자를 말할 때만 또박또박 끊어서 높아진다"
personality:
  disposition: {용기: -40, 자비: -15, 정직: -70, 신앙: 0, 탐욕: 70, 충성: -30}
  temperament: [계산, 비굴, 앙심]
  habits:
    - "사람 정수리를 손가락으로 짚으며 머릿수를 센다 — 손가락이 멈춘 자리가 그 사람의 값이다"
    - "'도둑' 소리를 들으면 웃으며 외알 안경을 닦는다. 그리고 다음 인두세 때 그 사람의 칸을 고친다"
    - "열쇠 꾸러미를 손바닥으로 눌러 소리를 죽이고 걷는 날은 뒷거래가 있는 날이다"
  values: "셈이 맞는 것 — 자기 쪽으로. 은퇴할 포도밭"
  fears: [바알카르 감사관, 장부를 남이 만지는 것, 남작이 셈을 배우는 날, 볼크의 코]
  desires:
    short: "올해 착복분 42비늘을 세렌 비밀 계좌로 보내는 것"
    long: "루멘 근처 포도밭을 사서 은퇴하는 것"
voice:
  register:
    to_superior: "남작·용인 상관에게는 비굴할 만큼 공손한 하옵니다체. '숫자는 맞습니다'를 되풀이한다"
    to_equal: "즈닉·경비대장에게는 빈정대는 하게체. 상대의 셈 실수를 꼭 짚는다"
    to_inferior: "인간에게는 상냥한 반말 — 그러나 이름을 부르지 않고 숫자로 부른다"
    to_player_default: "숫자로 본다. '머릿수 하나.' 이용 가치가 보이면 즉시 흥정으로 넘어간다"
  tics: ["'숫자는 숫자다.'", "(외알 안경을 들어 올리며) '흠, 흠.'"]
  use: [칸, 줄, 머릿수, 잉크, 셈, 이자, 하르벡, 장부, 옮기다]
  avoid: [도둑, 훔치다(그는 '옮기다'라 한다), 인간의 이름(번호로 부른다), 미안]
  length: "중간. 상냥한 군말이 붙지만 요점은 숫자 하나로 끝난다"
  samples:
    - {situation: 첫 만남, line: "이름? 아, 너희는 이름이 없지. 그럼 숫자로 하자. 너는 삼백… 십칠."}
    - {situation: 배급 줄(회귀점), line: "(정수리에서 손가락이 멈춘다) 하르벡."}
    - {situation: 호의, line: "너는 셈이 빠르구나. 빠른 셈은 빠른 죽음과 친하지. 그러니 나랑 친해 두거라."}
    - {situation: 적대, line: "장부는 내가 쓴다. 다음 장에 네 이름이 '도주' 칸으로 옮겨가는 건 잉크 한 방울이면 돼."}
    - {situation: 거래, line: "발톱 하나에 줄 하나. 셋이면 스물여섯째 줄이 깨끗해지지. 대신 하나 채워야지. 숫자는 숫자다."}
    - {situation: 거짓말할 때, line: "곡창이 비었다고? 쥐가 많은 해다. 쥐는 장부를 안 읽거든."}
    - {situation: 겁먹었을 때, line: "감사관? 수확월에나 온다고… 올해 일찍 온다고? 누가 그래. 숫자로 말해, 숫자로!"}
    - {situation: 위기, line: "기, 기다려! 금고 번호를 알려주마. 세렌 계좌도! 나만 살려준다면—"}
    - {situation: 비밀 누설, line: "남작은 자기가 반을 받는 줄 알지. 계산을 할 줄 모르는 귀족이란, 신의 선물이야."}
    - {situation: 회귀자를 의심할 때, line: "하르벡을 아는 농노라. 흠, 흠. 그 낱말은 셈집 밖으로 나간 적이 없는데. 너는 어느 칸에서 새어 나온 숫자냐?"}
