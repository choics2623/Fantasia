  밤: "징세소 다락에서 이중 장부 작업. 2층 창의 불빛이 늦게까지 켜져 있다"
places: [징세소 '셈집', 절름발이 수탉 뒷문, 영주 곡창, 레이번 성채 서재, 배급 줄]
