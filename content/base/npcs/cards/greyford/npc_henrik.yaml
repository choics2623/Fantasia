on_death: "장부 대혼란 — 다음 인두세에서 실제 머릿수가 드러나 '유령 48명' 수색 → 브람 지하실 발각 확률 크게 상승. 남작은 징세관을 잃어 세렌 이자 지불 지연"
story_seeds:
  - "이중 장부는 징세소 다락 마루 밑에 있다. 카스파르에게 넘기면 고드릭을 무너뜨릴 수 있지만, 브람의 비밀도 함께 드러난다"
  - "'하르벡'은 담보라는 뜻이다. 키트는 체납 4발톱의 담보로 명단에 올랐다 — 그 낱말을 아는 회차부터 흥정이 달라진다"
  - "AS 313 수확월 1일 바알카르 감사관이 온다. 그날 헨릭은 누군가의 목을 내밀어야 한다"
