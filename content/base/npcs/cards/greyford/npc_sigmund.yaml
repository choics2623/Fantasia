    - {situation: 호의(드물게), line: "너 같은 짐꾼이 셋만 더 있으면 서리월 보급을 맞추겠군. …칭찬이 아니다. 계산이다."}
    - {situation: 적대, line: "사령관이 봐주는 것과 내가 봐주는 것은 다르다. 나는 숫자를 센다."}
    - {situation: 거짓말할 때, line: "집에서 온 편지? 어머니 안부다. 늙은 용인은 안부가 길지."}
    - {situation: 비밀 누설, line: "가문은 내게 '그가 넘어지면 문을 잡아라' 했다. 그가 넘어지지 않게 하는 게 내 일인지, 넘어지길 기다리는 게 내 일인지 — 아직 모르겠다."}
    - {situation: 회귀자를 의심할 때, line: "북문 물빼기 굴을 어떻게 아나. 그건 사령관과 나, 그리고 죽은 짐꾼 몇만 아는 길이다."}
