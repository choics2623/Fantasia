voice_sound: "낮고 단정한 목소리. 명령에 익은 짧은 끝맺음. 용언 존칭은 한 음절도 틀리지 않는다"
personality:
  disposition: {용기: 50, 자비: 0, 정직: 30, 신앙: 20, 탐욕: 10, 충성: 55}
  temperament: [엄격, 실용, 갈등]
  habits:
    - "매일 새벽 어깨끈 매듭을 새로 묶는다 — 매듭이 비뚤면 그날 처벌이 늘어난다"
