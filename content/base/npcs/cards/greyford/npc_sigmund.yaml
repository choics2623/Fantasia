  - {year: 311, age: 119, event: "가문 서신 — '그가 넘어지면 문을 잡아라.' 답장하지 않고 화로에 넣었다"}
  - {year: 312, age: 120, event: "바르그 이르가와 비밀리에 정보를 바꾸기 시작함 — 탈주자 이동과 조합 일정"}
appearance:
