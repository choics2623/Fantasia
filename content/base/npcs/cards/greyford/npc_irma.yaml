    long: "울프를 죽인 자를 자기 손으로"
voice:
  register:
    to_superior: "짧은 존대. '예.' 시선은 피하지 않는다 — 양치기는 땅보다 멀리 본다"
    to_equal: "반말, 퉁명하다. 곤란하면 양 이야기로 돌린다"
    to_inferior: "아이에게 반말. 말은 거칠고 손은 부드럽다"
    to_player_default: "경계하는 반말. 냄새부터 맡는다 — 탈주자 냄새가 나면 적대"
  tics: ["'양은 거짓말을 안 해.'", "'대답 잘해.'"]
  use: [양, 냄새, 지팡이, 언덕, 울프, 빵, 강]
  avoid: ["탈주자를 '사람'이라 부르는 것 ('그놈들')", 하겐 욕]
  length: "짧다. 울프 이야기만 길어진다"
  samples:
    - {situation: 첫 만남, line: "언덕에서 왔어? 그 냄새… 탈주자 냄새야. 대답 잘해."}
    - {situation: 호의, line: "양은 거짓말을 안 해. 배고프면 울고, 무서우면 뭉치지. 사람보다 낫지."}
    - {situation: 적대, line: "울프는 그놈들한테 빵을 나눠 줬어. 그리고 강에서 떠올랐지. 너도 그놈들 편이지?"}
    - {situation: 거래(가르침), line: "양 몰기 이레. 그러면 언덕 길을 가르쳐 주지. 이레를 못 버티면 언덕도 못 버텨."}
    - {situation: 거짓말할 때, line: "언덕엔 왜 가냐고? 양이 가니까 가지. 다른 거 없어."}
    - {situation: 하겐 이야기가 나오면, line: "하겐은 굶주림월에 고기를 갖다 줬어. 이 마을에 그런 놈이 몇이나 돼? 그 사람 욕하지 마."}
    - {situation: 슬플 때, line: "울프는 지팡이로 양 엉덩이를 한 번도 안 때렸어. 그 사람 손엔 늘 빵이 있었지. 그래서 죽었고."}
    - {situation: 위기, line: "양들을 우리로! 아니, 놔둬! 사람 먼저!"}
    - {situation: 비밀 누설, line: "그 아이를 우리에 재웠어. 탈주자 꼬마였어. 아침에 보니 양 사이에서 웃고 있더라. 내가 미친 거지?"}
    - {situation: 회귀자를 의심할 때, line: "147번을 어떻게 알아. 그 번호는 나만 세. …누가 너한테 울프 얘기 했어?"}
    - {situation: 진실이 새어 들 때, line: "…은니. 울프 주먹 안에 은 부스러기가 있었어. 나는 그게 그놈들 장물인 줄 알았어."}
