  - {year: 310, age: 33, event: "울프의 양치기 지팡이와 표찰을 이어받음. 지팡이 끝에 첫 칼자국을 그음"}
  - {year: 311, age: 34, event: "서리월 어느 밤, 언덕에서 내려온 탈주자 아이를 양 우리에 재움. 아이는 새벽에 사라졌다"}
  - {year: 311, age: 34, event: "굶주림월, 하겐이 몰래 가져다준 양고기와 장어로 겨울을 넘김"}
  - {year: 312, age: 35, event: "포도월, 북쪽 무리가 굶주린 언덕에 든 뒤 짝수 날마다 늑대굴 길목을 찾음. 낙엽월 1일 현재 지팡이 칼자국 일곱"}
appearance:
