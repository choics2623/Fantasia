smell: "젖은 양털과 양기름, 언덕의 쑥"
voice_sound: "바람에 깎인 굵은 목소리. 양을 부를 때의 휘파람이 말끝에 섞인다"
personality:
  disposition: {용기: 30, 자비: -20, 정직: 40, 신앙: 35, 탐욕: 0, 충성: 20}
