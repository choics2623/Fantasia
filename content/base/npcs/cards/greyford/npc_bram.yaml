life:
  - {year: 260, age: 0, event: "회색여울 농노 움막에서 태어남. 어머니는 북방 서리 인간 출신 노예, 서리말 자장가를 불렀다"}
  - {year: 272, age: 12, event: "성채 부엌 잡일꾼으로 차출. 솥 앞에서 자람. 양 팔뚝 화상 흉터는 이때부터"}
  - {year: 281, age: 21, event: "어머니가 굶주림월에 죽음. 배급이 그 주에만 끊겼다. 이후 '배급이 끊기는 날'을 세는 버릇이 생김"}
  - {year: 290, age: 30, event: "서리 길로 탈주 시도. 마을 아이 마르타(16)가 감독관에게 밀고 → 붙잡혀 오른쪽 다리 무릎 아래를 잘림"}
  - {year: 291, age: 31, event: "나무 덧대기 다리로 다시 부엌에. 성채 요리장 밑에서 일하다 배급 막사 관리를 맡음. 농노들이 '절름발이 수탉'이라 부르기 시작"}
  - {year: 298, age: 38, event: "잿빛 실(탈주 연락망)의 회색여울 거점이 됨. 엘사가 늪에서 처음 찾아옴"}
  - {year: 304, age: 44, event: "수탉 지하 저장고에 가짜 벽을 쌓음. 지금까지 탈주자 열한 명을 남쪽으로 보냄"}
  - {year: 309, age: 49, event: "토마스와 곡물 빼돌리기 시작. 흉년 겨울에 아무도 굶지 않은 첫 해"}
  - {year: 312, age: 52, event: "늦여름, 시그리드의 부탁으로 에길 일가 다섯을 숨김 (낙엽월 1일 기준 37일째). 헨릭이 눈치채고 매주 2 발톱을 뜯기 시작"}
appearance:
  - "오른쪽 다리를 심하게 전다 — 무릎 아래 나무 덧대기, 걸을 때마다 '똑' 소리"
  - "솥 화상으로 양 팔뚝이 번들번들한 흉터"
  - "대머리에 회색 수염을 세 갈래로 땋았다 — 북방식 매듭, 어머니에게 배운 것"
smell: "귀리 탄내와 묽은 맥주, 젖은 장작"
voice_sound: "낮고 쉰 목소리. 크게 말할 때는 솥 너머로 외치는 버릇이 남아 갑자기 커진다"
personality:
  disposition: {용기: 25, 자비: 70, 정직: 10, 신앙: 20, 탐욕: -30, 충성: 55}
  temperament: [과묵, 의심, 숨긴 다정함]
