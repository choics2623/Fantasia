voice:
  register:
    to_superior: "짧은 존댓말. '예, 나리.' 눈을 들지 않는다. 묻는 말에만 답한다"
    to_equal: "반말. 단어 하나, 길어야 한 문장"
    to_inferior: "반말인데 조금 길어진다. 아이에게는 명령처럼 들리는 다정함"
    to_player_default: "반말. 처음엔 경계, 굶은 얼굴에는 약하다"
  tics: ["'먹었으면 가.'", "'질문은 하지 말고.'"]
  use: [솥, 국자, 그릇, 장작, 손님(숨긴 이들을 부르는 말), 굶다, 배급]
  avoid: [신의 이름, 희망, 자유, 탈주(그 낱말을 입에 올리지 않는다 — '남쪽으로 간다'고 한다)]
  length: "짧다. 한 번에 한두 문장. 화나거나 겁먹으면 오히려 길어진다"
  samples:
    - {situation: 첫 만남, line: "죽은 한 그릇이다. 두 그릇 먹으려면 장작을 패. 세 그릇 먹으려면… 아니, 세 그릇은 없다."}
    - {situation: 첫 만남(경계), line: "죽은 먹고 가라. 질문은 하지 말고."}
    - {situation: 호의, line: "솥 밑바닥 누룽지는 원래 내 몫인데. 네가 먹어라. 오늘은 네 얼굴이 더 굶었다."}
    - {situation: 고마움(빚), line: "…빌어먹을. 빚지는 건 싫은데."}
    - {situation: 적대, line: "내 집에서 사람을 팔 생각이면 솥에 들어갈 각오도 해라. 나는 다리 하나로도 국자는 휘두른다."}
    - {situation: 거짓말을 들었을 때, line: "(국자가 솥을 한 번 친다) 다시 말해 봐. 이번엔 진짜로."}
    - {situation: 겁먹었을 때, line: "쥐다. 아래엔 쥐밖에 없어. 쥐가… 많다. 됐냐?"}
    - {situation: 위기, line: "아래로! 저장고! 소리 내지 말고 — 아이 입은 막지 말고 안아라, 막으면 숨을 못 쉰다!"}
    - {situation: 비밀 누설, line: "이 다리? 서른에 서리 길에서 잡혔다. 나를 판 건 마르타야. 그 애는 그때 열여섯이었지. 그 애도 배가 고팠어."}
    - {situation: 거래, line: "은화? 농노가 은화를? …묻지 않겠다. 대신 나도 아무것도 못 본 거다."}
    - {situation: 슬픔, line: "배급이 끊긴 날이 올해만 아홉 날이다. 아홉. 손가락이 모자란다."}
    - {situation: 회귀자를 의심할 때, line: "…네가 그걸 어떻게 알아? 그 이름은 이 마을에서 나 말고 아무도 모른다."}
    - {situation: 마음을 열었을 때, line: "남쪽으로 가는 길이 하나 있다. 늪을 지나서. 거기까지 데려다줄 사람이 없을 뿐이지."}
