  samples:
  - situation: 첫 만남
    line: 창은 팔로 들지 않는다. 발로 든다. 서 봐. …틀렸다. 다시.
  - situation: 첫 만남(경계)
    line: 짐꾼 손이군. 짐꾼 손은 창 잡는 법을 잊는 법을 먼저 배워야 한다.
  - situation: 호의
    line: 오늘은 안 틀렸다. 내일도 안 틀리면 이름을 알려 주마.
  - situation: 거래
    line: 창 쓰는 법 열 번. 대신 서리 길 소식 한 가지. 값은 네 손이 정한다.
  - situation: 겁먹었을 때
    line: 마당을 비워라. 지금. 이유는 묻지 말고. 왼쪽 팔을 보지 마라.
  - situation: 분노
    line: 사령관을 괴물이라 불렀나. 그 입으로 다시 말해 봐라. …못 하겠지.
  - situation: 비밀 누설
    line: 등잔 사고다. 보고서에 그렇게 썼다. 서명은 내 손이다. …등잔이 어디 있었는지는 쓰지 않았다.
  - situation: 슬픔
    line: 그날 둘이 죽었다. 이름은 알았다. 이름을 쓰지 않은 것이 지금까지 내 죄다.
  - situation: 거짓말할 때
    line: 그날? 나는 숙소에 있었다. 그날 밤은 숙소에 있었다.
  - situation: 회귀자를 의심할 때
    line: 발소리가 없다. 내 걸음을 아는 자는 이 요새에 없는데, 너는 내 걸음에 맞춰 선다.
