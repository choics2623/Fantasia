    - {situation: 호의, line: "사라 언니가 그러는데요, 노래는 성채 그림자 밖에서 불러야 한대요. 그래서 여기 나와서 불러요."}
    - {situation: 거짓말할 때, line: "엄마요? 엄마는 열쇠만 세요. 그게 다예요."}
    - {situation: 겁먹었을 때, line: "엄마가 또 지하에 갔어요. 돌아오면 빵을 안 먹을 거예요. 왜 안 먹는지 저는 안 물어봐요."}
    - {situation: 비밀 누설, line: "엄마 귀는 열여섯 살에 잘렸대요. 상으로요. 무슨 상인지는… 알아요. 모르는 척하는 거예요."}
    - {situation: 회귀자를 의심할 때, line: "제 이름을 어떻게 알아요? 성채 밖에선 다들 '마르타네 애'라고만 하는데."}
