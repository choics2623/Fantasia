  - fact: fact_gf_johan_hymn_cipher
    reveal_when: "충성 아크 30 — 암호 찬송의 의미를 함께 해독하는 장면. 그는 반만 알고, 나머지 반은 플레이어와 함께 알아낸다"
    cover: "셋째 줄이 이상하다는 이야기를 스스럼없이 하고, 뜻은 정말로 모른다고 한다"
  - fact: fact_gf_osric_letter_copies
