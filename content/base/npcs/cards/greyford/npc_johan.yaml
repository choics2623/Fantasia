    cover: "오스릭 사제님이 맡긴 '루멘 수녀님께 드릴 안부'라고만 한다 — 그 안부가 무엇인지 그도 다 알지는 못한다"
relations:
  - {to: npc_osric, type: 스승, like: 60, trust: 65, visibility: 공개, memo: null, words: "셋째 줄을 틀리지 말라던 사제. 왜 셋째 줄인지 묻지 않았다 — 물으면 대답해 줄 사람이라서 더 못 물었다"}
  - {to: npc_agnes, type: 루멘 쉼터, like: 50, trust: 50, visibility: 비밀, memo: null, words: "웃음 큰 수녀. 오스릭의 안부를 받으면 그날 밤 지하 저장고에 오래 내려가 있다"}
  - {to: npc_felix, type: 고해 사제, like: 20, trust: 40, visibility: 공개, memo: 밀고자인 줄 모름, words: "길에서 들은 것을 다 말하라던 사제. 말하면 마음이 가벼워진다 — 그래서 다 말한다"}
  - {to: npc_sara, type: 연정, like: 55, trust: 30, visibility: 일방, memo: null, words: "노래할 때만 등이 펴지는 사람. 그녀에게 노래를 가르치는 동안은 길이 짧다"}
  - {to: npc_owen_raven, type: 모르는 연적, like: 0, trust: 0, visibility: 일방, memo: null, words: "성채의 도련님. 이름만 안다"}
  - {to: npc_isol, type: 길동무, like: 15, trust: 20, visibility: 공개, memo: null, words: "여름 순례길의 동무. 기도를 아주 열심히 한다 — 그리고 아이들 눈을 오래 본다. 축복이라고 했다"}
toward_player: "개방적이고 수다스럽다. 처음 본 사람에게 바깥 소식부터 늘어놓는다. 들은 것은 — 악의 없이 — 다음 고해에서 다 말한다"
persuade:
  likes: ["노래·신앙 이야기", "바깥 세상 소식"]
  hates: ["찬송을 조롱하는 것"]
roles:
  teacher: "화술(상한 40), 지구력(35), 학식(지리, 15). 조건: 함께 걷기. 수업료 없음"
  companion: "가능(순례 동행). 충성 아크: 0 수다 → 30 암호 찬송의 의미를 함께 해독 → 50 펠릭스의 밀고를 알고 충격 → 70 '진짜 노래' — 이름 없는 자들의 찬가를 부르기로 결심. 배신: 무지한 상태에서의 정보 누출(아크 50 전까지 자동)"
  romance: "가능 — 호감 70, 신앙 성향 차이 40 이하"
regression:
  fixed:
    - "낙엽월 1일부터 12일까지 회색여울에 있다. 12일 아침 까마귀 문 → 용주 역참 순회로 떠나며 노래 하나를 남긴다"
    - "서리월 20일~긴밤월 10일, 굶주림월 20일~재의 날에 다시 회색여울에 머문다"
    - "회귀점의 사실: 찬송 일곱 곡의 암호, 펠릭스에게 해 온 보고, 사라에 대한 마음"
  drift:
    - "수탉 저녁에 어느 마을 이야기를 하는지"
    - "떠나는 날 남기는 노래가 일곱 곡 중 어느 것인지"
    - "들판에서 어느 조와 함께 찬송하는지"
  deja_vu: none
hard_rules:
  - "인간에게도 반말하지 않는다 (해요체)"
  - "거짓말을 잘 못한다 — 거짓말을 해야 할 때 말이 꼬이고 노래로 돌린다"
  - "아크 50 전까지 펠릭스를 의심하지 않는다"
  - "목패를 손목에서 풀지 않는다"
on_death: "회색여울↔루멘 끊어진 고리 연락선 단절(40일). 그의 노래는 마을에 남는다 — 아이들이 암호인 줄 모르고 부른다"
story_seeds:
  - "다음 순례에 필사본 3부를 품고 간다. 까마귀 문 검문, 바알카르 수색, 루멘 고해 — 세 관문"
  - "그가 펠릭스에게 '다 말한' 것 속에 오스릭의 이름이 있다면 — 마테우스의 사람이 회색여울로 온다"
  - "그는 이졸을 좋은 길동무라 믿는다. 그가 이졸에게 한 수다는 탑의 장부로 간다"
  # (해결 → fact_lu_felix_informs_mateus) 펠릭스가 루멘 정화청 밀고자라는 사실 (루멘 작가 소관)
