id: npc_volk
name: 볼크 회색송곳니
aka: [사냥대장, 쇠송곳니, 늙은 회색]
tier: S
type: living
race: 수인족
subrace: 바르그(늑대)
sex: 남
age: 64
region: 회색여울 변경
home: 바알카르 외곽 '송곳니 회관'(노예사냥 조합 본부). 회색여울 체류 시 송곳니 불 야영지 또는 성채 손님방
job: 사냥대장 (정본 · 악역)
rank: 바르그 노예사냥 조합 사냥대장 (송곳니 12 · 코 약 900 · 목줄꾼 약 300), 회색송곳니 무리 가장, 아우락스파
summary: 거짓말을 하지 않는 사냥꾼. 무리를 두 번 잃고 사냥 자체를 무리로 삼았다. 한 번 맡은 냄새는 — 그 회차 안에서는 — 잊지 않는다
source: docs/world/CHARACTERS.md:530
life:
  - {year: 248, age: 0, event: "바알카르 외곽 회색송곳니 무리에서 태어남. 할아버지는 붉은 손 다라의 반란(AS 100) 진압 때 받은 훈장을 차고 다녔다"}
  - {year: 252, age: 4, event: "겨울 열병과 무리 다툼으로 첫 무리를 잃음. 조합 우리지기였던 인간 노예 여인이 그를 거두어 길렀다. 그 여인의 이름은 그만 안다"}
  - {year: 258, age: 10, event: "그 여인이 탈주하다 다른 바르그에게 잡혀 죽음. 그는 그날 처음으로 '도망치는 냄새'를 배웠다"}
  - {year: 270, age: 22, event: "조합 송곳니(분대장). 할아버지의 훈장을 녹여 부러진 왼쪽 송곳니 자리에 쇠송곳니를 박음"}
  - {year: 278, age: 30, event: "딸 이르가 태어남. 두 번째 무리를 꾸림"}
  - {year: 285, age: 37, event: "조합 사냥대장. '정직한 사냥'의 규칙 — 거짓말하지 않는다, 약속한 날에 온다 — 을 조합에 세움"}
  - {year: 298, age: 50, event: "녹테른 영지 원정 중 두 번째 무리(이르가를 뺀 가족)가 피를 뽑혀 몰살됨. 그 밤부터 사냥 자체가 그의 무리가 되었다"}
  - {year: 300, age: 52, event: "딸 이르가가 처음 잡은 열한 살 탈주자 소녀를 규칙대로 자기 앞에서 처형함. 이르가는 그 피리를 아직 목에 건다"}
  - {year: 309, age: 61, event: "해빙월, 서리 길에서 북방 탈주자 일행을 쫓아 모두 잡고 한 여자만 놓침 — 시그리드. 그녀의 냄새를 기억한다"}
  - {year: 312, age: 64, event: "여름, 아우락스에게서 카스파르 암살 의뢰(200비늘)를 받고 아직 답하지 않음. 낙엽월 14일부터 보름간 회색여울 체류가 잡혀 있다"}
appearance:
  - "2m가 넘는 키, 은회색 털 사이로 흰 흉터가 그물처럼 얽혔다"
  - "왼쪽 송곳니가 쇠 — 할아버지의 훈장을 녹여 만든 것"
  - "허리에 탈주자 손목에서 벗긴 노예 낙인 가죽 조각을 매듭으로 엮어 찬다 (312개)"
smell: "젖은 털과 오래된 피, 쇠송곳니의 녹"
voice_sound: "가슴 깊은 데서 굴러 나오는 낮은 소리. 말 사이사이 코로 숨을 크게 들이쉰다 — 킁"
personality:
  disposition: {용기: 70, 자비: -80, 정직: 20, 신앙: 40, 탐욕: 35, 충성: 50}
  temperament: [정직, 무자비, 고독]
  habits:
    - "누구를 만나든 먼저 목덜미에 코를 대고 냄새를 맡는다 — 허락을 구하지 않는다"
    - "약속한 날짜를 쇠송곳니로 나무에 새기고, 그날이 되면 반드시 온다"
    - "보름달 밤에는 사냥하지 않고 달을 보며 낙인 가죽 매듭을 하나씩 센다"
    - "식사 때 무리(송곳니·코)보다 먼저 숟가락을 든다 — 그가 들기 전에는 아무도 먹지 않는다"
  values: "정직한 사냥. 약속. 무리 — 이제는 사냥 그 자체"
  fears: [무리 없이 늙어 죽는 것, 녹테른의 밤, 이르가가 너무 자비로운 것]
  desires:
    short: "북방 탈주자 일괄 소탕 계약(1명당 1비늘, 총 60비늘)을 고드릭과 체결"
    long: "맹약회의 313에서 '잔향 사냥'을 바르그의 독점권으로 공인받기"
voice:
  register:
    to_superior: "아우락스·용족에게도 하오체 이상으로 높이지 않는다. 짧게 '그렇소', '아니오'. 강한 자에게만 고개를 조금 숙인다"
    to_equal: "남작·조합 간부에게는 하게체. 흥정도 사실만으로 한다"
    to_inferior: "인간·목줄꾼·코에게는 해라체. 사냥감은 '고기'라 부른다 — 모욕이 아니라 분류다"
    to_player_default: "냄새를 맡는다. 플레이어의 냄새(탈주자·은화·진명어·젖은 재)를 기억에 등록한다. 직접 위협은 없지만 공포 판정 강제(D45)"
  tics: ["'킁.'", "'나는 거짓말 안 한다.'"]
  use: [냄새, 고기, 무리, 사냥, 달, 사흘, 약속, 코]
  avoid: [아마, 어쩌면(그는 짐작을 말하지 않는다), 녹테른, 엄마(그 여인을 가리키는 어떤 말도)]
  length: "짧고 무겁다. 한 문장에 사실 하나. 무리 이야기를 할 때만 문장이 길어지고 끝이 갈라진다"
  samples:
    - {situation: 첫 만남, line: "킁. 너한테서 젖은 재와 은화 냄새가 나는구나. 기억해 두마. 나는 한 번 맡은 건 안 잊는다."}
    - {situation: 첫 만남(냄새가 짙을 때), line: "킁. 젖은 재. …재 냄새가 이렇게 진한 고기는 처음이다. 처음인데, 왜 처음 같지가 않지."}
    - {situation: 호의, line: "너는 거짓말을 안 했다. 그러니 나도 안 하겠다. 다음 달에 너를 사냥할 거다. 사흘 먼저 뛰어라."}
    - {situation: 적대, line: "도망쳐라. 도망치는 고기가 더 맛있다."}
    - {situation: 거래(남작에게), line: "언덕의 고기 예순. 하나에 한 비늘. 산 것이든 죽은 것이든 같은 값이오. 남작이 시체를 원하면 시체를 주겠소."}
    - {situation: 거짓말을 들었을 때, line: "킁. 방금 냄새가 바뀌었다. 거짓말은 땀에서 난다. 너는 이제 내 사냥 목록에 있다."}
    - {situation: 약속, line: "사흘이다. 나흘째 아침에 나는 네 냄새가 끝나는 곳에 서 있을 거다. 나는 거짓말 안 한다."}
    - {situation: 분노(녹테른), line: "그 이름을 내 앞에서 꺼낸 고기는 둘이었다. 둘 다 나보다 빨리 뛰지 못했다."}
    - {situation: 위기, line: "무리가… 내 무리가 어디 갔지? 이르가! 이르가, 대답해!"}
    - {situation: 비밀 누설, line: "내 새끼들은 피를 다 뽑혀 죽었다. 녹테른의 밤에. 그날부터 나는 쫓는 쪽이 되기로 했지."}
    - {situation: 슬픔, line: "나를 기른 것도 고기였다. 인간 여자. 빵을 씹어서 내 입에 넣어 줬지. …그 여자도 도망쳤다. 다른 코가 먼저 찾았다."}
    - {situation: 하겐에 대해, line: "목줄꾼은 냄새가 둘이다. 웃는 냄새, 그 밑의 겁 냄새. 쓸 만하다. 믿지는 않는다."}
    - {situation: 이르가에게, line: "산 채로, 산 채로. 산 고기는 물고, 도망치고, 다음 해에 또 넘어온다. 너는 너무 물렁하다, 딸."}
    - {situation: 회귀자를 의심할 때, line: "…너. 이 냄새. 꿈에서 맡은 것 같군. 나는 꿈을 안 꾸는데."}
schedule:
  아침: "회색여울 체류 시(낙엽월 14~30일): 까마귀 문 앞 들판에서 사냥개 훈련"
  낮: "굶주린 언덕·오물 습지 수색"
  저녁: "성채 손님방에서 고드릭과 술. 사흘에 한 번은 절름발이 수탉 구석에서 하겐과 마신다"
  밤: "직접 사냥 — 바르그는 밤에 강하다. 보름달 밤은 쉰다"
places: [송곳니 불 야영지, 굶주린 언덕, 오물 습지, 레이번 성채 손님방, 절름발이 수탉, 바알카르 송곳니 회관]
knows: [fact_gf_volk_sweep_contract, fact_gf_hagen_sells_runaways, fact_gf_hagen_drinks_volk, fact_gf_sigrid_volk_escape, fact_gb_grod_buys_hagen]
