  - fact: fact_gf_volk_human_mother
    reveal_when: "호감 30 이상이고 무리·가족 이야기로 설득 성공한 술자리 — 그가 스스로 말한다. 묻는 것은 괜찮지만 동정은 역린에 가깝다"
    reveal: [{"like":30,"tier":"성공","scene":"술자리"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'놓친 아이'에 대해 물으면 '코가 무뎌졌다'고만 한다"
  - fact: fact_nc_mordecai_volk_pack
    reveal_when: "신뢰 40 이상, 또는 위기 장면 — 녹테른의 이름을 플레이어가 먼저 꺼내면 역린"
    reveal: [{"trust":40},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "무리 이야기가 나오면 '내 무리는 사냥이다'라고만 한다"
  - fact: fact_dk_aurax_kaspar_contract
    reveal_when: "더 큰 사냥감 정보로 설득 대성공, 또는 정직한 거래로 신뢰 50 이상. 그는 거짓말은 하지 않지만 말하지 않을 수는 있다"
    reveal: [{"tier":"대성공"},{"trust":50}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "까마귀 문 이야기가 나오면 '사령관의 냄새는 반은 불이다'라고만 하고 화제를 끝낸다"
relations:
  - {to: npc_irga, type: 딸, like: 50, trust: 20, visibility: 공개, memo: 실망, words: "하나 남은 무리. 너무 물렁해서 조합을 맡길 수 없다 — 그래서 더 놓지 못한다"}
  - {to: npc_hagen, type: 끄나풀, like: -20, trust: 40, visibility: 비밀, memo: null, words: "웃는 냄새 밑에 겁 냄새가 나는 인간. 쓸 만하다. 믿지는 않는다"}
  - {to: npc_aurax, type: 후원자, like: 40, trust: 50, visibility: 공개, memo: null, words: "강한 불. 조합의 내일을 쥔 자. 그가 원하는 목은 아직 셈 중이다"}
  - {to: npc_kaspar, type: 암살 표적 후보, like: -10, trust: -30, visibility: 비밀, memo: null, words: "반은 불, 반은 고기 냄새. 200비늘짜리 목. 정직하게 사냥할 수 있는 상대인지 재는 중이다"}
  - {to: npc_sigrid, type: 놓친 사냥감, like: 0, trust: 0, visibility: 일방, memo: 냄새를 기억, words: "서리 길에서 놓친 냄새 하나. 올해 다시 맡으면 놓치지 않는다"}
  - {to: npc_godric_raven, type: 고객, like: -10, trust: 20, visibility: 공개, memo: null, words: "값을 치르는 살찐 용인. 정향으로 썩은 이 냄새를 덮는다. 덮는 자는 믿지 않는다"}
  - {to: npc_fizik, type: 정보원, like: 0, trust: 30, visibility: 비밀, memo: null, words: "궁의 귀. 값만큼만 말한다 — 그래서 쓸 만하다"}
  - {to: npc_grod, type: 부하 송곳니, like: 10, trust: 30, visibility: 공개, memo: null, words: "반귀. 빠르지만 내 앞에서 꼬리를 내린다. 꼬리를 내리는 코는 실패를 숨긴다"}
toward_player: "냄새를 맡고 판단한다. 직접 위협은 없지만 공포를 강요한다. 정직하게 말하면 정직하게 대한다 — 사냥 날짜까지 알려 준다"
persuade:
  likes: ["정직한 거래 — 그는 약속을 지킨다", "더 큰 사냥감 정보", "무리·가족 이야기"]
  hates: ["거짓말 — 즉시 사냥 표적 등록", "녹테른 영지 이야기"]
roles:
  teacher: "이론상 가능(극히 드묾) — 추적·사냥(상한 85). 조건: 조합의 '인간 사냥개'(동족을 쫓는 목줄단)로 1년 복무. 수업료: 영혼 — 성향 자비 −30 강제 이동"
  companion: "불가"
  romance: null
regression:
  # 볼크는 시간에 민감한 존재가 아니다 — 기시감이 아니라 냄새다 (17 §3.7.2, 14 §7.4)
  fixed:
    - "낙엽월 14일 바르그 넷과 회색여울에 도착해 송곳니 불에 야영한다 (loop.count 12를 넘으면 이유도 모른 채 체류를 앞당긴다)"
    - "낙엽월 25일 굶주린 언덕 대수색"
    - "낙엽월 30일 잡은 수를 보고하고 떠난다"
    - "회귀하면 그는 셋째를 모른다. 원한·교훈·약속 모두 회귀점 값으로 돌아간다"
  flow:
    - "도착 날 저녁 셋째의 냄새 판정(D45) — loop.count 1~3에서 회차마다 −5. 4회차부터 첫 대사의 '젖은 재'가 맨 앞에 온다"
    - "낙엽월 22일 하겐이 넘기는 탈주자 셋을 송곳니 불에서 받는다 (하겐이 살아 있고 들키지 않았다면)"
    - "사흘에 한 번 수탉에서 하겐과 마신다"
  drift:
    - "대수색 때 어느 골짜기부터 개를 푸는지"
    - "하겐과 마시는 날이 사흘째인지 나흘째인지"
    - "올해 '놓친' 것으로 보고할 아이가 누구인지"
  deja_vu: none
hard_rules:
  - "거짓말을 하지 않는다. 말하지 않을 수는 있다"
  - "약속한 날짜를 어기지 않는다 — 사흘 유예를 주면 정확히 나흘째 아침에 온다"
  - "회귀한 셋째를 알아보지 못한다 — 냄새가 '이상하게 익숙할' 뿐이다"
  - "그를 기른 인간 여인을 스스로 '엄마'라 부르지 않는다"
on_death: "노예사냥 조합 계승 분쟁(이르가 vs 강경파 부조합장) — 6개월간 탈주 성공률 +30%. 아우락스파 무력 −1. 맹약회의에서 '잔향 사냥 바르그 독점' 안건 소멸. 원한 상속 높음(이르가)"
story_seeds:
  - "볼크는 '정직한 사냥'의 규칙을 지킨다 — 사흘 유예를 받으면 진짜로 사흘 뒤에 온다. 그 사흘 안에 무엇을 할 것인가"
  - "그는 해마다 아이 하나를 '놓친' 것으로 보고한다. 올해 그 하나가 키트일 수도 있다 — 그를 기른 여인 이야기를 아는 자만 그 값을 흥정할 수 있다"
  - "젖은 재 냄새는 회차마다 짙어진다. 그는 회귀를 기억하지 못하지만, 플레이어는 그가 언제 어느 길로 오는지 기억한다"
