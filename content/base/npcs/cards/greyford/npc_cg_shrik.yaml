  - 결재
  - 사본
  - 날짜
  - 인장
  - 서랍
  avoid:
  - 쥐(그 자신을 가리킬 때)
  - 잡종
  - 거짓
  length: 짧고 빠르다. 날짜와 숫자는 한 번에 정확히
  samples:
  - situation: 첫 만남
    line: 서류에 이름이 없으면 일어난 일이 아니다. 내가 쓰면 일어난 일이 된다. 무서운 일이다.
  - situation: 첫 만남(경계)
    line: 누가 보냈나. 문서 번호는. …번호가 없으면 나는 받지 않는다.
  - situation: 호의
    line: 오늘은 틀리게 쓰지 않았다. 그러면 하루가 조금 가볍다.
  - situation: 거래
    line: 사본 한 장. 장소는 말할 수 없다. 대신 날짜 하나를 알려 주겠다.
  - situation: 겁먹었을 때
    line: 서랍을 열지 마라. 아니, 열어도 된다. 거기엔 없다. 없다고 쓰면 없는 거다.
  - situation: 분노
    line: 그 문서를 불에 넣을 거면 나부터 불에 넣어라. 글자는 불에 안 죽지만 나는 죽는다.
  - situation: 비밀 누설
    line: 열한 장이다. 이중바닥 밑에 있다. 한 장은 물빼기 굴 보고서다. 결재가 없다.
  - situation: 슬픔
    line: 사령관은 읽고 서랍에 넣었다. 그 서랍 소리가 아직도 귀에 있다. 조용한 소리였다.
  - situation: 거짓말할 때
    line: 그 보고서? 쓴 적 없다. 아니, 쓴 적 있다. 쓰지 않았다고 쓰겠다.
  - situation: 회귀자를 의심할 때
    line: 너는 서류에 없는 사람이다. 서류에 없는 사람이 서류를 이렇게 정확히 아는 건 이상하다.
