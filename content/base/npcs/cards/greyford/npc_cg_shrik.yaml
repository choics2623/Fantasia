voice:
  register:
    to_superior: 용인에게는 짧고 빠른 존댓말. 시선을 서류에 둔다
    to_equal: 같은 크릭에게는 낮고 빠른 반말
    to_inferior: 인간에게는 문서 중심의 조심스러운 반말
    to_player_default: 낯선 사람에게는 서류를 먼저 본다
  tics:
  - '''기록에 남았다.'''
  - '''일어난 일이 된다.'''
  use:
