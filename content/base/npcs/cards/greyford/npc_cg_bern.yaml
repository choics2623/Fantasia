voice:
  register:
    to_superior: 용인에게는 낮은 존댓말. 허리를 굽히고 웃는다
    to_equal: 같은 노예에게는 반말. 친한 척 말이 많다
    to_inferior: 수용자에게는 반말. 다정한 척하다 갑자기 차가워진다
    to_player_default: 인간 낯선 이에게는 호기심 반 의심 반의 반말
  tics:
  - '''열쇠는 내가 쥐고 있다.'''
  - '''이름만 팔았다.'''
  use:
