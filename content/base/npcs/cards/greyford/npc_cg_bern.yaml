  - 딸을 팔다
  - 그로드를 이름으로 부르는 것
  length: 웃음이 섞인 중간 길이. 곤란해지면 오히려 말이 빨라진다
  samples:
  - situation: 첫 만남
    line: 열쇠는 내가 쥐고 있다. 열쇠가 문을 여는 게 아니라, 내가 열쇠를 돌려 주는 거지.
  - situation: 첫 만남(경계)
    line: 어느 칸 사람이오? …아니, 이쪽이 아니군. 어디서 왔소.
  - situation: 호의
    line: 죽은 따뜻한 걸 가져가시오. 식은 걸 주면 사람이 남을 원망하거든.
  - situation: 거래
    line: 쪽지 한 장에 은화 2닢. 이름 열 개에 고향 둘이면 은화 5닢까지 쳐 준다.
  - situation: 겁먹었을 때
    line: 그로드 님은… 아니, 손님은 때를 안 가리고 오신다. 열쇠를 놓고 왔는데…
  - situation: 분노
    line: 내 귀 이야기 하지 마. 그건 내 값이 아니다.
  - situation: 비밀 누설
    line: 나는 아무도 팔지 않았다. 이름만 팔았다. …이름 말고 뭐가 남았는데?
  - situation: 슬픔
    line: 딸 이름이 에다다. 문서에 쓰면 에다가 되지, 짐꾼 계집이 아니라.
  - situation: 거짓말할 때
    line: 쪽지? 무슨 쪽지. 나는 글자도 모르는데.
  - situation: 회귀자를 의심할 때
    line: 어떻게 알았소, 그 쪽지를. 열 번째 쪽지는 아직 쓰지도 않았는데.
