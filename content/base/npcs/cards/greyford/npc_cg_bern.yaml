story_seeds:
- 쪽지를 바꿔치면 송곳니들을 잘못된 곳으로 보낼 수 있다. 베른의 가족 해방 문서를 구해 주면 그는 쪽지를 팔지 않을 수도 있다.
- 베른의 쪽지를 위조해 송곳니를 엉뚱한 곳으로 보낼 수 있다. 그의 딸의 해방 문서를 구해 주면 쪽지는 멈춘다
