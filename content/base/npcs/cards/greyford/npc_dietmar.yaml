life:
  - {year: 281, age: 0, event: "바알카르 근교 비늘혈 가문 포도원의 노예 막사에서 태어남. 네 살 위 형 오토가 있었다"}
  - {year: 290, age: 9, event: "포도 따기에 나감. 형이 그를 대신해 앞에 서서 맞는 날이 많았다"}
  - {year: 296, age: 15, event: "형 오토가 포도주를 훔쳤다는 혐의. 주인이 디트마르의 손에 채찍을 쥐여 줬다 — '네 형이니까 네가 해라.' 서른 대를 세면서 쳤다. 형은 열하루 뒤 죽었다"}
  - {year: 297, age: 16, event: "잿불 언덕 광산으로 팔림. 오른쪽 볼에 첫 매각 낙인"}
  - {year: 303, age: 22, event: "용주 역참 짐꾼으로 다시 팔림. 같은 볼에 두 번째 낙인"}
  - {year: 306, age: 25, event: "역참 경비를 돌로 쳐 쓰러뜨리고 흉갑을 벗겨 입고 달아남. 갈비뼈가 드러난 몸에 지금도 그 녹슨 흉갑"}
  - {year: 307, age: 26, event: "오물 습지 죽은 버드나무 섬에 자리 잡음. 달아난 노예들이 하나둘 모임"}
  - {year: 309, age: 28, event: "까마귀 문에서 물빼기 굴로 도망친 짐꾼 레오를 받아들임. 왜 도망쳤는지는 묻지 않았다"}
  - {year: 311, age: 30, event: "브란과 거래 시작 — 습지의 쇠붙이와 장물을 주고 쟁기날로 위장한 창날을 받는다. 현상금 1 비늘 10 발톱이 붙음"}
  - {year: 312, age: 31, event: "건초월, 잿빛 실 통과자 소녀 프리다(15)를 '통행세'로 붙잡아 둠"}
  - {year: 312, age: 31, event: "포도월 하순, 식량 다툼 끝에 시그리드 무리원 둘을 죽임 (하나는 직접). 세렌 선원 소문으로 굶주림월 3일 수송대 이야기를 들음"}
appearance:
  - "오른쪽 볼에 이중 노예 낙인 — 두 번 팔렸다는 뜻"
  - "갈비뼈가 드러난 마른 몸에 용인 병사에게서 빼앗은 녹슨 흉갑"
  - "손톱을 모두 짧게 물어뜯었다. 누가 말하면 그 사람의 입이 아니라 손을 본다"
smell: "습지 진흙과 훔친 술, 녹슨 쇠"
voice_sound: "쉬고 거친 목소리. 웃음이 기침처럼 끊긴다. 화나면 오히려 낮아진다"
personality:
  disposition: {용기: 55, 자비: -45, 정직: 10, 신앙: -80, 탐욕: 30, 충성: 35}
  temperament: [절망, 폭력, 거친 의리]
  habits:
    - "손톱을 물어뜯는다 — 말이 끊길 때마다"
    - "상대가 말할 때 입이 아니라 손을 본다 — 칼을 쥘 손인가"
    - "술을 마실 때 첫 모금은 땅에 붓는다. 이유를 묻는 놈에게는 대답하지 않는다"
    - "때릴 때 소리 내어 센다"
  values: "오늘. 무리 — 그것도 불안정하게. 아무도 다시 그의 손에 채찍을 쥐여 주지 못하게 하는 것"
  fears: [채찍을 쥔 자기 손, 무리가 그를 버리는 것, 희망 — 생기면 잃을 것이 생긴다, 쇠사슬 끄는 소리]
  desires:
    short: "굶주림월 3일 세베로의 노예 수송대(31명)를 습격해 '해방'하고 짐을 빼앗는다"
    long: "없다. '다음 해는 없다'가 그의 철학"
voice:
  register:
    to_superior: "용인·크릭에게 존대하지 않는다. 침을 뱉거나 침묵. 잡혔을 때만 이를 악문 '예' 하나"
    to_equal: "반말. 욕이 섞인 명령조"
    to_inferior: "무리원에게 반말과 명령. 겁에 질린 아이 앞에서는 이상하게 말이 짧고 낮아진다"
    to_player_default: "강도의 반말. 시험하듯 위협한다"
  tics: ["'내일은 없다.'", "'주머니 뒤집어.'"]
  use: [주머니, 술, 오늘, 사슬, 창, 배(腹), 무리, 값]
  avoid: ["'희망' (조롱으로만 쓴다)", "형 (스스로 꺼내지 않는다)", 기도]
  length: "짧고 거칠다. 취하면 길어지고, 길어지면 형 이야기 근처로 간다"
  samples:
    - {situation: 첫 만남, line: "주머니 뒤집어. 안 뒤집으면 내가 뒤집는다. 네 배를."}
    - {situation: 호의, line: "…술 남았다. 마셔. 내일은 없으니까 오늘 마셔."}
    - {situation: 적대, line: "희망? 희망은 주인들이 우리 목에 거는 두 번째 목줄이야."}
    - {situation: 거래(통행세), line: "잿빛 실이든 뭐든 내 섬을 지나면 값을 내. 사흘치 식량. 없으면 사람."}
    - {situation: 거짓말할 때, line: "그 계집애? 자기가 남겠다던데. 여기가 남쪽보다 낫대."}
    - {situation: 겁먹었을 때, line: "…저 소리. 쇠 끄는 소리. 듣지 마. 듣지 말라고!"}
    - {situation: 화났을 때, line: "형 얘기 꺼낸 놈은 혀부터 센다. 하나, 둘—"}
    - {situation: 슬플 때(취해서), line: "형은 나보다 네 살 많았어. 맞을 땐 늘 나보다 먼저 앞에 섰지. 마지막엔 내가 앞에 섰어. 채찍 들고."}
    - {situation: 하겐의 배신을 들었을 때, line: "하겐이? 그 웃는 놈이? …술은 걔가 줬지. 술값이 사람이었구나."}
    - {situation: 위기, line: "다 뛰어! 나 두고 뛰어! 이번엔— 이번엔 내가 남는다, 형."}
    - {situation: 비밀 누설, line: "주인이 채찍을 내 손에 쥐여 줬어. '네 형이니까 네가 해라.' 서른 대. 나는 세면서 쳤어."}
    - {situation: 회귀자를 의심할 때, line: "굶주림월 사흘을 네가 어떻게 알아. 그건 내 머릿속에만 있는 날짜다. …누가 팔았어?"}
    - {situation: 마음을 열었을 때, line: "…다음 해. 다음 해엔 말이야. 아니, 됐다. 그냥 — 다음 해에도 술 남겨 둘게."}
