on_death: "습지 무리 와해 (일부 시그리드 합류, 일부 바르그에게 잡힘). 세베로 수송대 습격 이벤트 소멸 → 31명 그대로 세렌행"
story_seeds:
  - "수송대 습격이 성공하면 31명이 '해방'되지만, 고드릭은 보복으로 마을에서 10명을 처형한다 (재의 법 집단 처벌). 그 10명을 누가 고르나 — 마르타"
  - "그의 무리에 '숯불 레오'가 있다 — 카스파르의 불을 본 유일한 생존자. 디트마르는 그 값을 모른다. 아우락스는 안다"
  - "섬의 프리다(15). 잿빛 실은 그녀가 남쪽에 닿은 줄 안다. 엘사가 알면 습지의 '통행세'는 끝난다 — 아니면 잿빛 실이 끊긴다"
