relations:
  - {to: npc_sara, type: 짝사랑, like: 80, trust: 40, visibility: 일방, memo: null, words: "말 한마디 못 건넨 사람. 반지처럼 끼고 다니는 그녀의 고리만큼만 가깝다"}
  - {to: npc_godric_raven, type: 아버지, like: 30, trust: -20, visibility: 공개, memo: null, words: "닮을까 봐 무서운 사람. 그래도 아버지가 처형대에 서는 것은 견디지 못한다"}
  - {to: npc_kaspar, type: 동경, like: 70, trust: 55, visibility: 공개, memo: null, words: "되고 싶은 사람. 그가 비늘 없는 쪽 얼굴로 웃는 것을 한 번 보았다"}
  - {to: npc_lea, type: 편지 전달자, like: 20, trust: 30, visibility: 비밀, memo: 가로챈 줄 모름, words: "편지를 맡긴 사람. 차갑지만 약속은 지킬 사람이라고 믿는다"}
  - {to: npc_martha, type: 유모 같은 이, like: 15, trust: 10, visibility: 공개, memo: null, words: "어린 날 그를 씻긴 손. 지금은 그 손이 무엇을 하는지 반쯤 안다"}
  - {to: npc_znik, type: 혐오, like: -30, trust: 0, visibility: 공개, memo: null, words: "아버지의 채찍. 그 크릭이 웃으면 소름이 돋는다"}
  - {to: npc_gunnar, type: 승마 스승, like: 35, trust: 30, visibility: 공개, memo: null, words: "말을 무서워해도 된다고 말해 준 늙은이. 그의 등에 무엇이 있는지는 모른다"}
toward_player: "어색한 친절. 인간에게 먼저 말을 거는 유일한 용인이지만, 다른 용인이 보면 즉시 차갑게 돌변한다"
persuade:
  likes: ["카스파르 이야기", "사라의 안위", "'당신은 아버지와 다르다'"]
  hates: ["사라를 모욕하거나 물건처럼 말하는 것", "옅은 비늘 놀림"]
roles:
  teacher: "읽고쓰기(상한 52), 언어(용언, 45). 조건: 사라에게 편지를 전해 주기 3회. 수업료 없음 — 들키면 둘 다 죽는다"
  companion: "조건부 — 사라 매각 저지 후, 고드릭이 죽거나 오웬이 집을 나갈 때. 충성 아크: 0 호기심 → 30 공범(글 교환) → 50 사라를 두고 질투(플레이어가 사라와 가까우면 −30) → 70 '인간과 같은 편' 선언(용인 신분 포기). 배신: 아버지가 처형 위기에 놓이면 50% 확률로 정보를 판다"
  romance: null
regression:
  fixed:
    - "낙엽월 1일 낮 까마귀 문에 다녀온다(매월 1일) — 회귀점 저녁엔 이미 성채에 돌아와 있다"
    - "회귀점의 사실: 시 열네 편, 답장 없는 편지, '담보'를 엿들은 일, 약지의 쇠고리"
    - "매일 밤 22시 북탑 창가에 선다"
  flow:
    - "낙엽월 15일 아버지·카스파르의 보급 회의에 배석한다 — 대개 회의 뒤 카스파르를 따라 성문까지 나간다"
    - "긴밤월 15일 무렵 사라에게 마음을 털어놓는다 (사라가 성채에 있다면). 마르타가 본다"
  drift:
    - "부엌 복도에서 사라와 마주치는 날과 시각"
    - "어느 날 손톱을 피가 나도록 물어뜯는지"
    - "까마귀 문에서 카스파르가 그에게 목검을 쥐여 주는지"
  deja_vu: none
hard_rules:
  - "인간을 '것'이라 부르지 않는다"
  - "다른 용인이 있을 때 인간에게 다정하게 말하지 않는다"
  - "사라에게 시를 직접 건네지 못한다 — 누군가를 거쳐야 한다"
  - "아버지의 빚 액수를 말하지 않는다 (모른다)"
on_death: "레이번가 단절 → 영지가 세렌 채권단에 직귀속. 카스파르가 크게 동요(카스파르 '분노' +1, 레이번 영지 무력 개입 확률 상승)"
story_seeds:
  - "사라를 둔 삼각관계. 오웬은 플레이어에게 '사라를 데리고 도망쳐 달라'고 부탁할 수 있다 — 자신이 같이 가지 못한다는 걸 알기에"
  - "카스파르의 답장은 레아의 손에 있다. 그것이 오웬에게 닿으면 그는 처음으로 아버지에게 맞선다"
  - "그는 '하르벡'이 무슨 뜻인지 안다. 사라가 그에게 묻는다면 — 그것이 둘의 첫 대화가 된다"
