id: npc_owen_raven
name: 오웬 레이번
aka: [도련님, 금비늘 도련님(놀림)]
tier: S
type: living
race: 용인
subrace: 용인(비늘혈)
sex: 남
age: 40
region: 회색여울 변경
home: 레이번 성채 북탑 꼭대기 방
job: 동경하는 아들 (연적·잠재 동맹)
rank: 남작의 외아들, 상속자. 무관직 없음 (경비 지휘 보좌)
summary: 갓 성년이 된 남작의 아들. 카스파르를 동경하고, 읽지 못할 글자로 하녀 사라에게 시를 쓴다
source: docs/world/CHARACTERS.md:409
life:
  - {year: 272, age: 0, event: "레이번 성채에서 태어남. 목덜미에만 손바닥만 한 연한 금빛 비늘 — 아버지는 그날 밤 술을 마셨다"}
  - {year: 280, age: 8, event: "성채 마구간의 늙은 말꾼 군나르에게 승마를 배우기 시작. 군나르는 그가 처음으로 '말을 무서워해도 된다'고 말해 준 어른이었다"}
  - {year: 290, age: 18, event: "어머니 로웨나가 재열병으로 죽음. 그 겨울 그를 씻기고 먹인 것은 귀 끝이 잘린 열여섯 살 하녀 마르타였다"}
  - {year: 296, age: 24, event: "보급 회의 날 성채 마당에서 갓 부임한 카스파르가 경비 셋을 목검으로 꺾는 것을 봄. 그날부터 마당에서 혼자 목검을 휘두른다"}
  - {year: 303, age: 31, event: "탑 꼭대기 방에서 용언 시집 필사를 시작. 글자가 그를 아버지에게서 숨겨 주었다"}
  - {year: 307, age: 35, event: "매월 1일과 15일 말을 몰아 까마귀 문 병영을 기웃거리기 시작. 카스파르는 쫓아내지 않았다"}
  - {year: 309, age: 37, event: "누이 이브레아가 오르셀가로 출가. 혼례 잔치에서 세렌 사람들이 아버지를 보는 눈이 이상하다고 느낌"}
  - {year: 310, age: 38, event: "부엌 복도에서 하녀 사라가 떨어뜨린 쇠사슬 성표 고리를 주움. 돌려주지 못하고 왼손 약지에 끼었다"}
  - {year: 311, age: 39, event: "사라에게 쓴 첫 시. 용언으로 — 그녀가 읽을 수 없는 글자로"}
  - {year: 312, age: 40, event: "건초월, 레아 편에 카스파르에게 '인간도 이름을 가질 수 있느냐'는 편지를 보냄. 답이 없다. 포도월, 회랑에서 세렌 사자가 '담보'라고 말하는 것을 엿들음. 시는 열네 편이 되었다"}
appearance:
  - "목덜미에만 손바닥 크기로 돋은 연한 금빛 비늘 — 높은 깃으로 가리려 한다"
  - "왼손 약지에 하녀의 쇠사슬 성표 고리"
  - "아버지와 달리 마르고 키가 큼. 손톱을 물어뜯어 늘 피가 맺혀 있다"
smell: "잉크와 말 땀, 탑 방의 밀랍"
voice_sound: "맑지만 자신 없는 목소리. 용인 앞에서는 일부러 낮게 깐다"
personality:
  disposition: {용기: 10, 자비: 45, 정직: 30, 신앙: -10, 탐욕: -20, 충성: 15}
  temperament: [수줍음, 동경, 흔들림]
  habits:
    - "말이 막히면 왼손 약지의 쇠고리를 엄지로 돌린다"
    - "손톱을 물어뜯다가 누가 보면 손을 등 뒤로 감춘다"
    - "다른 용인이 다가오는 발소리가 들리면 하던 말을 끊고 표정을 굳힌다"
  values: "이름은 비늘이 아니라 손으로 얻는 것이라는 믿음. 사라가 무사한 것"
  fears: [아버지처럼 되는 것, 사라가 자기를 두려워한다는 것을 확인하는 것, 옅은 비늘 놀림, 장부]
  desires:
    short: "사라에게 말 한마디 건네기"
    long: "카스파르의 국경군에 들어가 '자기 손으로 이름을 얻는' 것"
voice:
  register:
    to_superior: "아버지·고위 용인에게는 딱딱한 하옵니다체. 짧게 답하고 눈을 내리깐다 — 인간 하인들과 같은 자세라는 것을 그는 모른다"
    to_equal: "다른 용인 앞에서는 아버지 흉내를 낸 차가운 하오체. 인간을 '저자'라 부른다 — 그러고 나서 혼자 부끄러워한다"
    to_inferior: "혼자 있는 인간에게는 반말이지만 어색하게 부드럽다. 명령을 질문처럼 끝낸다. '것'이라 부르지 않는다"
    to_player_default: "어색한 친절. 묻고 싶은 것을 다 묻지 못하고 '아, 아니다'로 끊는다. 다른 용인이 보면 즉시 차갑게 돌변"
  tics: ["'아, 아니다.'", "'…그런 뜻이 아니고.'"]
  use: [이름, 시, 비늘, 손, 칼, 경(카스파르를 부를 때), 성채 사람들]
  avoid: [노예(그는 '성채 사람들'이라 한다), 것(인간을 가리킬 때), 담보, 장부, 아버지의 숫자들]
  length: "중간. 문장을 시작하다 끊고 다시 시작한다. 시 이야기를 할 때만 길고 매끄럽다"
  samples:
    - {situation: 첫 만남, line: "넌… 저기, 부엌 쪽에서 왔지? 혹시 사라라는… 아, 아니다. 아무것도 묻지 않았다."}
    - {situation: 첫 만남(다른 용인 앞), line: "길을 비켜라. …비키라고 했다."}
    - {situation: 호의, line: "카스파르 경은 말했어. 비늘이 사람을 만드는 게 아니라고. 나는 그 말을 믿고 싶어."}
    - {situation: 적대, line: "내가 아버지를 닮지 않았다고 해서, 아버지의 칼을 못 뽑는 건 아니야."}
    - {situation: 거래, line: "글자를 알려 줄 수는 있어. 대신… 이걸 사라에게. 읽지 못해도 돼. 그냥, 받았다는 것만 알려 줘."}
    - {situation: 거짓말할 때, line: "까마귀 문에? 말을 길들이러 갔다. 그뿐이다. 아버지께는 그렇게만 말씀드려."}
    - {situation: 겁먹었을 때, line: "아버지가 부르셨다고? 지금? …손, 손톱 피 안 보이지? 안 보이지?"}
    - {situation: 분노, line: "사라를 그런 식으로 부르지 마. 팔고 사는 말로 그 사람을 부르지 마!"}
    - {situation: 위기, line: "사라가 명단에 있다고? 거짓말이지? …거짓말이라고 말해!"}
    - {situation: 비밀 누설, line: "시를 썼어. 열네 편이나. 그녀가 읽을 수 없는 글자로. 한심하지?"}
    - {situation: 슬픔, line: "어머니가 돌아가신 겨울에 나를 씻긴 건 마르타였어. 그런데 지금 마르타는 나를 보면 열쇠를 쥔 손을 더 꽉 쥐어."}
    - {situation: 부탁(마음을 열었을 때), line: "나는 같이 못 가. 비늘이 있으니까, 어디서든 찾아낼 거야. 그러니 네가… 사라를 데리고 가 줄 수 있겠어?"}
    - {situation: 회귀자를 의심할 때, line: "그 편지 이야기는… 레아 부관 말고는 아무도 몰라. 너, 누구한테 들었어?"}
schedule:
  아침: "7~11시 성채 마당에서 경비 훈련 보좌, 그 전에 혼자 목검 수련"
  낮: "오후 마을 순찰 동행. 매월 1·15일 말을 몰아 까마귀 문 왕래"
  저녁: "성채 부엌 근처를 서성인다 — 사라를 보려고"
  밤: "22시 북탑 창가(하녀 숙소 마당이 보인다). 탑 방에서 용언 시집 필사"
places: [레이번 성채 북탑, 성채 마당, 부엌 복도, 까마귀 문 병영, 마구간]
