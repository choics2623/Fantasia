  companion: "조건부 — 리즈를 안전한 곳(모르바 또는 루멘)에 보낸 뒤. 충성 아크: 0 계산 → 30 거래 → 50 리즈를 맡김 → 70 23명의 이름을 들려줌(속죄 루트, 목줄단 해체 정보). 배신: 리즈가 위협받으면 100%"
