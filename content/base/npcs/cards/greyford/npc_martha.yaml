aka: [목줄장, 집사 아주머니, 귀 잘린 마르타(뒤에서)]
tier: S
type: living
race: 인간
subrace: ''
sex: 여
age: 38
region: 회색여울 변경
home: 레이번 성채 하인 숙소 구석방 (딸 리즈와 함께)
job: 목줄장, 딸을 지키는 어머니
