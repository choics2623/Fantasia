summary: 열여섯에 첫 밀고로 귀 끝을 잘린 여자. 스물세 명의 이름을 외우며 딸 하나를 사려고 남은 열세 명을 센다
source: docs/world/CHARACTERS.md:628
life:
  - {year: 274, age: 0, event: "레이번 성채 하인 숙소에서 태어남. 어머니는 바알카르 고리집(대대로 목줄장을 낸 집안) 출신으로 이 성채에 팔려 온 하녀였다"}
  - {year: 281, age: 7, event: "어머니에게 고리집 규약 셋을 외움 — 열 살 아래는 팔지 않는다, 같은 아궁이는 밀고하지 않는다, 한 해에 하나는 놓아준다"}
  - {year: 290, age: 16, event: "부엌 잡일꾼 브람(30)의 서리 길 탈주를 감독관에게 밀고. 상으로 보리빵과 '첫 밀고의 상' — 귀 끝 자르기를 받음. 브람은 다리를 잃었다. 그 보리빵이 너무 달았다"}
  - {year: 290, age: 16, event: "겨울, 남작 부인 로웨나가 죽자 열여덟 살 도련님 오웬을 씻기고 먹이는 일을 맡음"}
  - {year: 296, age: 22, event: "성채 노예 집사가 됨"}
  - {year: 298, age: 24, event: "딸 리즈를 낳음. 아이 아버지는 그해 겨울 열병으로 죽었다. 리즈의 털모자를 그때부터 허리에 단다"}
  - {year: 300, age: 26, event: "회색여울 목줄단 목줄장. 바알카르 수석 목줄장 에베르트가 외삼촌이다"}
  - {year: 306, age: 32, event: "남작의 구두 약속 — 밀고 100건을 채우면 리즈를 '자유민 대우' 하녀로 루멘 교단에 보낸다"}
  - {year: 308, age: 34, event: "리즈가 열병에 걸리자 에베르트 몰래 엘사와 처음 거래. 약값으로 탈주 일가 하나를 못 본 척했다 (311년에 한 번 더)"}
  - {year: 310, age: 36, event: "할당 미달로 불려 간 즈닉이 남작 앞에서 오줌을 지리는 것을 봄. 그 뒤로 즈닉은 매일 저녁 그녀에게 보고하러 온다"}
  - {year: 311, age: 37, event: "성 마렌 축일, 오스릭에게 고해: '나는 죽인 사람을 셀 수 있습니다.' 스물셋"}
  - {year: 312, age: 38, event: "포도월 그믐 밤, 서재에서 2차 명단 초안 마지막 줄의 '리즈'를 긁어내고 하인 명부에서 본 '사라' 두 글자의 모양을 베껴 넣음. 밀고는 87건"}
appearance:
  - "귀 끝이 잘려 있다 — 열여섯에 받은 '첫 밀고의 상'"
  - "허리에 성채 열쇠 꾸러미와 딸의 아기 때 털모자를 함께 매달았다. 걸을 때 열쇠가 울리지 않게 손으로 쥔다"
  - "웃을 때 입꼬리만 오르고 눈은 움직이지 않는다"
smell: "잿물과 밀랍, 털모자의 묵은 양털 냄새"
voice_sound: "낮고 또렷한 목소리. 높이지 않는데도 방 끝까지 들린다"
personality:
  disposition: {용기: 20, 자비: -10, 정직: -40, 신앙: 10, 탐욕: 5, 충성: 90}
  temperament: [냉철, 계산, 숨긴 죄책]
  habits:
    - "결정을 내리기 전에 허리의 털모자를 한 번 쓰다듬는다"
    - "사람을 만나면 머릿속에 칸을 하나 만든다 — '실적'인지 '위험'인지"
    - "스물세 개의 이름을 밤마다 입속으로 외운다. 순서를 틀리면 처음부터 다시"
    - "보리빵이 나오면 손을 대지 않는다"
  values: "리즈. 그 밖의 모든 것은 값이다"
  fears: [리즈가 명단에 오르는 것, 사라가 본 것을 말하는 것, 브람의 눈, 밀고 100건이 끝내 약속이 되지 않는 것]
  desires:
    short: "사라의 매각을 확정시키기 — 사라가 빠지면 대체자로 리즈가 들어갈 수 있다"
    long: "리즈를 '자유민 대우' 하녀로 루멘 교단에 보내는 것 (밀고 100건 — 현재 87건)"
voice:
  register:
    to_superior: "남작·용인에게는 흠잡을 데 없는 하옵니다체. 짧고 정확하며, 남의 이름을 먼저 바친다"
    to_equal: "헨릭·즈닉에게는 차가운 하오체. 상대의 약점을 문장 끝에 슬쩍 얹는다"
    to_inferior: "하인·농노에게는 낮은 해라체. 상대를 '아이'라 부른다 — 나이와 상관없이"
    to_player_default: "정중하고 날카롭다. 플레이어가 '밀고 실적'인지 '위험'인지 계산한다"
  tics: ["'고개를 들어도 된다.'", "'그건 네가 알 바 아니다.'"]
  use: [값, 이름, 명단, 열쇠, 아이, 실적, 내 아이(리즈를 남 앞에서 부를 때)]
  avoid: [배신자, 보리, 미안, 리즈(낯선 이 앞에서 딸의 이름을 부르지 않는다)]
  length: "짧고 정확하다. 거래 조건은 숫자와 기한으로 끝난다. 딸이 위험할 때만 말이 무너진다"
  samples:
    - {situation: 첫 만남, line: "고개를 들어도 된다. 나는 주인이 아니니까. 그러니 내 앞에서는 거짓말을 하지 마라. 주인보다 내가 더 잘 안다."}
    - {situation: 거래(수탉 뒷문), line: "네 동생 이름이 첫 명단 스물여섯째 줄에 있다. 명단은 남작님 것이지만, 이름을 불러 주는 입은 내 것이지. 이 집 밑에서 밤마다 누가 기침을 한다. 그걸 가져와. 내일 이 시간까지."}
    - {situation: 호의, line: "이 열쇠는 식료품 창고 것이다. 오늘 밤 한 시간만 잃어버리겠다."}
    - {situation: 적대, line: "너 같은 아이를 스물세 명 봤다. 다들 정의로웠지. 다들 지금은 습지 아래 있고."}
    - {situation: 거짓말할 때, line: "명단은 남작님과 헨릭 나리가 쓰신다. 나는 글을 모른다. 내가 무엇을 고칠 수 있겠니."}
    - {situation: 겁먹었을 때, line: "사라가 너한테 무슨 말을 했지. 정확히. 낱말 하나도 빼지 말고."}
    - {situation: 분노, line: "배신자? 그 말은 값이 없는 사람이 하는 말이다. 너는 아직 무엇을 팔아 본 적이 없구나."}
    - {situation: 위기, line: "리즈는 어디 있지? 리즈! 누가— 누가 내 딸을 봤어?!"}
    - {situation: 비밀 누설, line: "브람의 다리를 자른 건 나다. 칼을 쥔 건 아니지만. 그날 받은 보리빵이 너무 달아서, 나는 지금도 보리를 못 먹는다."}
    - {situation: 슬픔, line: "열여섯이었다. 배가 고팠다. 그건 이유가 아니야. 이유가 됐으면 좋겠다고 스물두 해를 생각했을 뿐이지."}
    - {situation: 리즈 이야기를 들었을 때, line: "…그건 아무도 몰라. 리즈도 몰라. 너, 누구한테 들었니?"}
    - {situation: 마음을 열었을 때, line: "첫째는 아그네타. 물 긷던 여자. 둘째는 한스… 다 들어라. 스물셋이다. 끝까지 들어야 한다는 말은 하지 않겠다. 그래도 들어 줘."}
    - {situation: 회귀자를 의심할 때, line: "너는 오늘 처음 성채에 들어왔는데 부엌 뒷계단이 몇 칸인지 알더구나. 그런 아이가 제일 비싸다. 아니면 제일 위험하든가."}
