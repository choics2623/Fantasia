  - {to: npc_znik, type: 약점을 쥠, like: -40, trust: 10, visibility: 비밀, memo: null, words: "오줌을 지린 채찍. 매일 저녁 그녀에게 보고하는 이유를 둘 다 안다"}
  - {to: npc_bram, type: 자신이 판 자, like: 10, trust: -20, visibility: 공개, memo: 죄책감, words: "보리빵 한 덩이. 그가 리즈에게만 누룽지를 준다는 것을 안다. 그래서 더 못 본다"}
