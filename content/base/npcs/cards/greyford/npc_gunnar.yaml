on_death: "검술 최상급 스승 소멸. 브란이 봉기를 서두름 (봉기 조기 발동, 성공률 −15%). 등의 99 새김이 시신에서 발견되면 소문이 그롬마르까지 퍼져 우르가쉬가 '탈주 투사의 제자들'을 수배"
story_seeds:
  - "마라의 100승은 AS 313 태양월 대축제에 잡혀 있다. 군나르는 그것을 듣는 순간 그롬마르로 가려 한다 — 74세의 몸으로"
  - "탈과의 재회 — 74세와 98세. 둘 중 하나만 나올 수 있다면"
  - "그가 죽은 회차의 313번 말뚝. 회귀하면 그는 다시 마구간에서 말에게 먼저 말을 건다 — 검은 다시 들보 위에 있다 (20 장면 4, §7.4)"
