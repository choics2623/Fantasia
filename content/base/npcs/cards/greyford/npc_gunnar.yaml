  - {year: 268, age: 30, event: "80승. 방패 가장자리에 오른손 새끼손가락이 부러져 직각으로 굳음"}
  - {year: 273, age: 35, event: "99승. 우르가쉬의 내전 무렵 뼈의 전당 지하에 숨어들어 사슬에 묶인 눈먼 탈을 봄. 탈이 '도망쳐라, 99에서 멈춰라'고 했다"}
  - {year: 274, age: 36, event: "100번째 경기 사흘 전 붉은 황야로 탈주. 99승 검을 들고 나왔다. 그롬은 현상금 3비늘을 걸었다"}
  - {year: 276, age: 38, event: "이름을 버린 채 노예 중개인에게 몸을 맡겨 바알카르 시장에서 '이름 없는 늙은 말꾼'으로 레이번가에 팔림. 쫓기는 탈주자보다 팔린 노예가 덜 눈에 띈다"}
  - {year: 281, age: 43, event: "용주 역참으로 말을 끌고 가는 길에, 대로변 바위 밑에 묻어 두었던 검을 몰래 파 와 마구간 다락 들보 위에 숨김"}
  - {year: 305, age: 67, event: "남작의 아들 오웬의 승마 교습을 맡음"}
  - {year: 311, age: 73, event: "브란이 슬래그 더미에 창날을 숨기는 것을 봄. '칼을 만들 줄 알면 쓸 줄도 알아야 한다' — 저녁 '말 이야기'를 시작함"}
  - {year: 312, age: 74, event: "브란과 봉기의 날을 재의 날 둘째 날로 정함. 브란의 검술은 아직 18이다"}
appearance:
  - "등에 그롬 원형장의 승리 새김 99개 — 줄 9개 묶음 11개, 마지막 묶음은 9개에서 멈춤. 셔츠를 절대 벗지 않는다"
  - "왼쪽 귀가 없고, 오른손 새끼손가락이 직각으로 굳었다"
  - "74세인데 허리가 꼿꼿하다 — 걷는 것만 보면 젊은이 같아서 마부들이 기분 나빠한다"
smell: "말똥과 건초, 마구 기름"
voice_sound: "낮고 고른 목소리. 숨이 길어 문장 사이가 비어 있다. 잠꼬대는 그롬 전투어로 한다"
personality:
  disposition: {용기: 50, 자비: 20, 정직: 30, 신앙: -60, 탐욕: -70, 충성: 45}
  temperament: [과묵, 냉정, 깊은 정]
  habits:
    - "셔츠를 절대 벗지 않는다. 여름에도"
    - "마구간에 들어서면 사람보다 말에게 먼저 말을 건다"
    - "칼을 쥐기 전에 숨을 세 번 쉰다"
    - "사람을 손과 걸음걸이로 잰다 — 얼굴은 늦게 본다"
    - "밤새 건초더미에서 깨어 있다. 잠들면 그롬 전투어로 잠꼬대를 한다"
  values: "진정성. 아무도 100번째를 싸우지 않게 하는 것. 브란"
  fears: [100번째 문 — 꿈에서 매번 그 문 앞에 선다, 그롬의 현상금, 등을 보이는 것, 브란이 준비 없이 칼을 드는 것]
  desires:
    short: "브란을 '쓸 만한 칼'로 만들기 (현재 검술 18)"
    long: "아무도 100번째를 싸우지 않게 하는 것. 그리고 마지막으로, 탈을 만나는 것"
voice:
  register:
    to_superior: "용인에게 '예.' 한 마디. 고개는 숙이되 등은 펴져 있다"
    to_equal: "반말. 짧고 건조하다. 사람 이야기를 말 이야기로 한다"
    to_inferior: "젊은이·아이에게 반말. 가르칠 때만 문장이 길어진다"
    to_player_default: "무관심한 반말. 말을 다루는 손이나 걸음에 싸운 흔적이 보이면 그제야 쳐다본다"
  tics: ["'숨으로.'", "'말은 정직해.'"]
  use: [말, 숨, 발, 새김, 문, 아흔아홉, 채찍, 모래]
  avoid: ["그롬의 신 '피'", "'자유' — 원형장의 거짓말이라 여긴다", "'100' — 그 수를 입에 올리지 않는다. '마지막 것'이라 한다"]
  length: "짧다. 가르칠 때만 길다. 위기에는 그롬 전투어 한 줄이 먼저 나온다"
  samples:
    - {situation: 첫 만남, line: "말은 사람보다 정직해. 겁먹으면 겁먹은 티를 내지. 너는 겁먹었는데 티를 안 내는구나. 위험한 버릇이다."}
    - {situation: 말에게 먼저 말을 건 상대에게, line: "…말한테 먼저 말 거는 놈은 처음이군."}
    - {situation: 호의(가르침), line: "검은 팔로 휘두르는 게 아니야. 발로 들어가서, 숨으로 벤다. 아흔아홉 번 그랬지. 한 번도 팔로 이긴 적은 없어."}
    - {situation: 시험, line: "눈 감지 마. 채찍이 와도. 감는 순간 너는 죽은 거다. 다시."}
    - {situation: 거래(수업료), line: "귀리죽 한 그릇. 매일. 늙으면 배가 고파. 칼보다 그게 먼저 무너진다."}
    - {situation: 적대, line: "늙은이라고? 그래. 그러니 나는 너를 오래 괴롭히지 않고 한 번에 끝낼 거다."}
    - {situation: 거짓말할 때, line: "등? 말한테 차였다. 오래전에. …셔츠는 추워서 안 벗는다."}
    - {situation: 화났을 때('마저 채웠어야지'를 듣고), line: "마저 채워? 채운 놈을 봤다. 사슬에 묶여서 잔을 기다리더군. 다시 그 말 하면 이 채찍이 네 입을 채운다."}
    - {situation: 겁(악몽에서 깨어), line: "(그롬 전투어로) 문 열지 마. 열지 마라. …(깨어서) 뭘 봐. 말 소리다."}
    - {situation: 슬플 때, line: "아흔아홉 번 이겼다. 아흔아홉 명이 모래에 누웠지. 이름은 하나도 모른다. 그롬은 이름을 안 불러 줬어."}
    - {situation: 위기, line: "(그롬 전투어) 피를 보아라, 그러나 피가 되지 마라! …아이들 뒤로! 내가 문을 맡는다."}
    - {situation: 비밀 누설, line: "탈은 살아 있었어. 눈이 멀고 쇠사슬에 묶인 채, 일주일에 한 번 싸우더군. 그롬이 주는 '붉은 젖'을 한 번 받으면 끊을 수가 없어. 싸워야만 다음 잔을 주지. 그게 '혈명 없는 혈명'의 진짜 이름이야."}
    - {situation: 회귀자를 의심할 때(숨 세 번 버릇을 아는 낯선 이에게), line: "누가 그 버릇을 말해 줬지. 브란도 모르는 건데. …누구 개냐, 너."}
    - {situation: 마음을 열었을 때, line: "마지막 것은 너와 싸운다. 모래 위 말고. 그롬마르에서, 그놈들 문 앞에서."}
