life:
  - {year: 238, age: 0, event: "바알카르 근교 국유 채석장 노예 막사에서 태어남"}
  - {year: 252, age: 14, event: "그롬 상인에게 '소모품'으로 팔려 피의 원형장 쇠사슬 우리로 감"}
