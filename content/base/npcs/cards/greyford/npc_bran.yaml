    reveal_when: "신뢰 50 이상이고 봉기에 대한 현실적 계획을 내놓는 판정 성공. 군나르가 먼저 말했다면 바로"
    reveal: [{"trust":50,"tier":"성공"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
