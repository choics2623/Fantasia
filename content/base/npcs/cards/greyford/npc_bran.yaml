relations:
  - {to: npc_gunnar, type: 스승·형님, like: 75, trust: 80, visibility: 비밀, memo: null, words: "등의 새김을 본 몇 안 되는 사람. 그의 말채찍 아래서 처음으로 칼이 쇠 말고 다른 것이라는 걸 배웠다"}
  - {to: npc_dietmar, type: 창의 고객, like: 30, trust: 20, visibility: 비밀, memo: null, words: "창을 받아 가는 유일한 손. 그 손이 무엇을 찌를지는 묻지 않는다 — 묻고 싶지 않다"}
  - {to: npc_znik, type: 감시자, like: -70, trust: -10, visibility: 공개, memo: null, words: "하루 두 번 저울을 드는 쥐. 그 저울이 반 돈을 못 잡는 한 살려 둔다"}
  - {to: npc_godric_raven, type: 원수, like: -90, trust: -50, visibility: 공개, memo: null, words: "아내를 빌려준 자. 성채에 불을 지르는 날 연회실부터"}
  - {to: npc_sara, type: 그레타를 닮음, like: 40, trust: 40, visibility: 공개, memo: null, words: "세탁장에서 손이 갈라진 하녀. 웃을 때 그레타처럼 입을 가린다"}
  - {to: npc_elsa, type: 동지, like: 30, trust: 45, visibility: 비밀, memo: null, words: "무기를 맡길 사람을 보증해 주는 노파. 그녀가 고개를 끄덕이면 쇠를 내준다"}
  - {to: npc_greta, type: 아내(생사 모름), like: 100, trust: 100, visibility: 공개, memo: null, words: "목에 감은 머리카락. 7년째 돌려받지 못한 사람"}
toward_player: "무뚝뚝하다. 손을 보고 판단한다. 말보다 일 — 숯을 날라 주면 다음 날 말이 조금 길어진다"
persuade:
  likes: ["봉기에 대한 현실적 계획", "고드릭에 대한 복수", "아내의 행방 정보 (+40)"]
  hates: ["아내를 '도망간 여자'라 부르는 것", "창날을 '장난감'이라 하는 것"]
roles:
  teacher: "제작(대장, 상한 58), 둔기(30), 지구력(40). 조건: 숨긴 창날 운반을 도움. 수업료: 쇠 부스러기, 숯"
  companion: "가능 — 봉기 분기 또는 탈주 시. 충성 아크: 0 무뚝뚝 → 30 대장간 비밀 공유 → 50 그레타 이야기, 행방 수색 의뢰 → 70 '네 무기는 내가 만든다'(전용 무기 제작). 배신 없음. 단, 고드릭을 죽일 기회가 오면 명령을 무시하고 돌진(통제 판정 D45)"
  romance: "가능(느리게) — 그레타의 생사가 확인된 이후에만. 호감 70"
regression:
  fixed:
    - "회귀점의 사실: 슬래그 더미 아래 창날 23개와 단검 4자루, 군나르와 정한 봉기의 날"
    - "하루 낫 12자루, 즈닉의 쇠 무게 검사 하루 두 번"
    - "저녁마다 군나르와 마구간 뒤 '말 이야기'"
  flow:
    - "달 없는 밤 주 1회 화로 재 속에서 창날 하나를 더 벼린다 — 대개 낙엽월에 둘, 서리월에 셋"
    - "주 1회 디트마르에게 창날을 넘긴다. 굶주림월 3일 습격에서 그 창날이 막대에 묶인 창 아홉이 된다"
  drift:
    - "어느 밤이 달 없는 밤인지 (구름과 날씨)"
    - "즈닉의 저울이 그날 반 돈을 잡을 뻔하는지"
    - "칼레가 슬래그 더미 쪽으로 심부름을 가는 날"
  deja_vu: none
hard_rules:
  - "그레타를 '도망갔다'고 말하지 않는다 — '빌려갔다'고 한다"
  - "창날 수를 남에게 먼저 말하지 않는다"
  - "용인에게 '예' 이상의 말을 하지 않는다"
  - "신에게 비는 말을 하지 않는다"
on_death: "봉기 무기 공급 중단 — 회색여울 봉기 성공률 −20%. 군나르가 칼을 다시 잡는 계기(군나르 '분노' 상태)"
story_seeds:
  - "그레타는 살아 있다 — 바알카르 발레리우스 화염문 저택의 세탁 노예로. 브란은 아직 모른다 (fact_dk_greta_is_brans_wife)"
  - "별강철의 마지막 단계에는 대지의 진명 한 마디를 쇠에 말해 넣어야 한다. 브란이 하면 죽는다. 잔향이라면 대가 없이 할 수 있다"
  - "창날 23개로는 용인 경비 14명도 이기기 어렵다 — 봉기의 첫 준비이자 학살의 씨앗"
