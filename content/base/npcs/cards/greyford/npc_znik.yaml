voice:
  register:
    to_superior: "고드릭·용인에게는 '주인님, 주인님' 두 번씩. 몸을 낮추고 말끝을 떤다. 남의 잘못을 먼저 고자질한다"
    to_equal: "크릭 감독들에게는 크릭 은어 섞인 빠른 반말. 서열을 확인하는 욕설"
    to_inferior: "인간에게는 짧은 반말 위협. '큰 것', '새 것'이라 부르고 채찍 줄 수로 말한다"
    to_player_default: "즉각 적대(−40). 플레이어가 더 강해 보이면 즉시 굽신거림으로 반전"
  tics: ["'흐, 흐흐.'", "'일곱 줄.'"]
  use: [줄(채찍 자국), 큰 것, 새 것, 강한 거, 주인님, 할당, 눈금]
  avoid: [앤, 작다·키(자기 키를 말하는 모든 낱말), 미안, 무섭다(그는 '싫다'고 한다)]
  length: "짧다. 같은 낱말을 두 번 되풀이한다. 겁먹으면 말이 빨라지고 길어진다"
  samples:
    - {situation: 첫 만남, line: "흐, 흐흐. 새 것? 새 것은 일해라. 일 안 하면 등에 줄 긋는다. 일곱 줄."}
    - {situation: 배급 줄, line: "(국자로 솥을 친다) 줄! 줄 서! 두 자리 맡는 쥐새끼는 등으로 갚는다!"}
    - {situation: 호의, line: "너, 너는 강해… 즈닉은 강한 거 좋아해. 즈닉이 네 그림자 할게."}
    - {situation: 적대, line: "너희 큰 것들은 다 똑같아. 크니까 맞아도 안 죽잖아. 그러니까 더 때려야 해."}
    - {situation: 거래, line: "언덕 냄새 나는 놈 어디 있는지 알아? 말해. 즈닉이 하겐한테… 아니, 즈닉이 주인님한테 말해. 너는 이번 주 안 맞아."}
    - {situation: 거짓말할 때, line: "즈닉은 아무것도 안 팔아. 즈닉은 주인님 거야. 목걸이 봐, 목걸이."}
    - {situation: 겁먹었을 때, line: "할당, 할당이 모자라… 주인님이 세시면, 세시면 안 돼. 큰 것들이 더 베어 와. 더!"}
    - {situation: 위기, line: "주인님! 주인님 살려줘! 즈닉 아무것도 안 봤어! 아무것도!"}
    - {situation: 분노(앤), line: "그 이름 하지 마. 하지 마! 큰 것들은 빵 주고 속여. 속여서 주인님한테 혼나게 해!"}
    - {situation: 비밀 누설, line: "앤은… 앤은 즈닉한테 빵 줬어. 즈닉이 말했어. 주인님한테. 빵 어디서 났는지."}
    - {situation: 회귀자를 의심할 때, line: "흐… 왜 오른쪽으로 안 가? 거기 즈닉 자리인 거 어떻게 알아? 누가 말했어. 누가!"}
