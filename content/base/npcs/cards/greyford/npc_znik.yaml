  - {year: 288, age: 6, event: "성채 집사가 '그 빵 어디서 났냐'고 묻자 앤을 가리킴. 앤은 곡물 절도로 처형되어 오물 습지 처형터에 묻혔다. 그는 그 일을 '인간이 나를 속였다'로 바꿔 기억한다"}
  - {year: 293, age: 11, event: "채찍손 길드 견습 감독. 들판에서 처음 인간을 때렸다. 맞은 인간이 그보다 두 배 컸다"}
  - {year: 299, age: 17, event: "농노 감독관으로 오름. 고드릭이 '주인의 것'이라 새긴 놋쇠 목걸이를 걸어 줌"}
  - {year: 303, age: 21, event: "채찍 손잡이에 인간 이빨을 박기 시작. 지금 일곱 개"}
