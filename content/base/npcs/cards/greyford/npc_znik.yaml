smell: "젖은 가죽 채찍과 크릭 특유의 쥐 비린내"
voice_sound: "쇳소리 섞인 빠르고 높은 목소리. 웃음이 '흐, 흐흐' 하고 끊긴다"
personality:
  disposition: {용기: -50, 자비: -60, 정직: -20, 신앙: 30, 탐욕: 30, 충성: 70}
  temperament: [비굴, 잔혹, 겁]
  habits:
