rank: 흐로스가르드 거인 씨족 '돌무릎'의 노예였던 탈주자. 시그리드 무리원
summary: 아내 룬, 맏아들 아르네(9)와 두 아이(6·3)를 데리고 브람의 지하에 숨은 북방 아버지. 서리말만 한다. 기침이 위층까지 새기 시작했다
source: docs/world/CHARACTERS.md 색인 한 줄뿐 — 새로 써야 한다 (R02-24)
life:
  - {year: 272, age: 0, event: "흐로스가르드, 거인 씨족 '돌무릎'의 노예 막사에서 태어남. 서리말만 배웠다"}
  - {year: 290, age: 18, event: "거인의 숯 굴로 보내져 십 년을 숯을 구움. 폐에 숯먼지가 앉은 것은 이때부터"}
  - {year: 302, age: 30, event: "같은 막사의 룬과 짝을 맺음"}
  - {year: 303, age: 31, event: "맏아들 아르네가 태어남. 거인은 그 애를 번호로 불렀고, 에길은 밤마다 이름으로 불렀다"}
  - {year: 309, age: 37, event: "셋째가 태어난 해에 첫 흉작. 거인들이 노예를 혹사하기 시작함"}
  - {year: 312, age: 40, event: "해빙월, 시그리드와 함께 돌무릎 씨족에서 달아남. 서리 길 넉 달 — 아이 셋을 한 명도 잃지 않았다"}
  - {year: 312, age: 40, event: "수확월 하순, 막내의 열 때문에 시그리드가 브람에게 부탁해 일가 다섯이 수탉 지하 가짜 벽 뒤에 숨음. 포도월 말부터 피 섞인 가래가 나온다. 낙엽월 1일 37일째"}
appearance:
  - "가슴까지 내려온 턱수염에 북방식 매듭 하나"
  - "손가락 마디가 동상으로 검고 굵다"
  - "등이 굽었다 — 거인의 땔감을 진 등. 지하 천장이 낮아 늘 더 굽어 있다"
smell: "지하 곰팡이와 젖은 흙, 오래 못 빤 털옷"
voice_sound: "쉰 낮은 목소리, 서리말의 둥근 모음. 말끝마다 기침을 삼킨다"
personality:
  disposition: {용기: 20, 자비: 50, 정직: 40, 신앙: 10, 탐욕: -20, 충성: 70}
  temperament: [묵묵, 다정, 겁]
  habits:
    - "기침이 나오면 털옷 소매를 입에 물고 삼킨다"
    - "밤마다 아이들 머리를 하나씩 짚어 센다 — 북쪽 셈법대로, 끝에 '우리'를 붙인다"
  values: "아이들. 무리. 숨겨 준 사람에게 폐를 끼치지 않는 것"
  fears: [기침 소리가 위층에 새는 것, 아르네가 위층으로 올라가는 것, 바르그의 코, 다시 거인에게 끌려가는 것]
  desires:
    short: "서리월이 오기 전 잿빛 실로 남쪽에"
    long: "아이들이 번호 말고 이름으로 사는 땅"
voice:
  register:
    to_superior: "용인 앞에서는 말하지 않는다 — 공용어를 모른다. 바닥에 엎드린다"
    to_equal: "서리말 반말. 짧고 둥글다"
    to_inferior: "아이들에게 서리말 속삭임"
    to_player_default: "서리말만 한다. 서리말을 모르는 상대에겐 손짓과 '브람' 한 낱말. 서리말로 말을 걸면 말이 길어진다"
  tics: ["'…우리.' (수를 셀 때 끝에 붙인다)"]
  use: [브람, 남쪽, 아이들, 서리, 우리, 빵]
  avoid: [공용어 (모른다), "거인의 이름"]
  length: "짧다. 기침이 끊는다. 서리말로 아이 이야기를 할 때만 길다"
  samples:
    - {situation: 첫 만남, line: "(서리말) …브람? 브람이 보냈어? 아니면— (아이들 앞을 막아선다)"}
    - {situation: 호의, line: "(서리말) 빵은 셋으로 나눠. 나는 냄새만 맡으면 돼. 냄새도 배가 불러."}
    - {situation: 겁먹었을 때, line: "(서리말) 위에 발소리. 다섯, 우리. 숨 참아. 아르네, 막내 입은 막지 말고 안아."}
    - {situation: 슬플 때, line: "(서리말) 거인은 우리를 '짐'이라 불렀어. 여기 바닥 밑에서는 아무도 우리를 안 불러. 그게 더 나은지 모르겠다."}
    - {situation: 비밀 누설, line: "(서리말) 룬한테는 말하지 마. 걸레가 빨개. 아르네가 버려 줘. 그 애는 아홉 살인데 나보다 입이 무거워."}
    - {situation: 회귀자를 의심할 때, line: "(서리말) 너, 우리 말을 어디서 배웠어? 남쪽 사람은 수를 셀 때 '우리'를 안 붙여."}
schedule:
  아침: "가짜 벽 뒤 은신방. 위층 아침 배식 소리 아래 숨을 죽인다"
  낮: "아이들 달래기. 아르네에게 북쪽 별 이름을 가르친다"
  저녁: "위층 저녁 배식과 술 소리 아래 기침을 참는다"
  밤: "자정 무렵 브람이 남은 죽을 들고 내려온다. 아이들 머릿수를 센다"
places: [수탉 지하 저장고 은신방, 옛 수로 입구]
