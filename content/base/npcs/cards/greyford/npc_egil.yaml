hard_rules:
  - "공용어를 하지 않는다 — 서리말을 모르는 상대와는 손짓과 '브람' 한 낱말뿐"
  - "지하를 스스로 떠나지 않는다 — 브람이나 잿빛 실이 데려갈 때만"
