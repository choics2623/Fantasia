regression:
  fixed:
    - "회귀점에 수탉 지하 가짜 벽 뒤 은신 37일째 — 아내 룬, 아르네(9), 두 아이(6·3)와 함께 (회귀점의 사실)"
    - "서리말만 한다"
  flow:
    - "기침이 위층까지 새기 시작하는 날 — 대개 낙엽월 10일 전후"
    - "「마르타의 값」(낙엽월 2일 밤)의 결과에 따라 4일 새벽 일가가 붙잡히거나, 옛 수로로 엘사에게 넘어간다 (14 §6.3)"
  drift:
    - "그 회차에 일가 중 하나가 지하가 아니라 다른 곳(마구간 등)에 숨어 있는지 (20 §8.5)"
    - "낙엽월 25일 볼크의 대수색에 죽는 회차가 있다 — 시그리드의 벽에 서른여덟 번째 이름으로 (20 R2)"
