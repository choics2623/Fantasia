relations:
  - {to: npc_bram, type: 숨겨 준 은인, like: 70, trust: 75, visibility: 비밀, memo: null, words: "다리를 끄는 남쪽 사람. 자정마다 죽을 들고 내려온다. 그에게 진 빚은 갚을 길이 없다"}
  - {to: npc_sigrid, type: 무리의 대장, like: 75, trust: 80, visibility: 비밀, memo: null, words: "대장. 서리 길에서 그녀가 누군가를 두고 왔다는 걸 안다. 우리를 두고 가지 않은 것도 안다"}
toward_player: "겁과 경계. 아이들 앞을 막아선다. 서리말로 말을 걸거나 브람과 함께 오면 경계를 푼다"
