- 늘 소매 안에 계산용 매듭 끈을 감아 쥐고 있다
- 곡식 먼지가 눈썹에 하얗게 앉았다
smell: 곡식 먼지와 마른 가죽 장부, 소매 안 매듭 끈의 기름 냄새
voice_sound: 낮고 건조한 목소리. 숫자를 말할 때만 또렷해지고, 사람 이야기를 하면 문장이 짧게 끊긴다
personality:
