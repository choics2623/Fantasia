- year: 262
  age: 16
  event: 곡창 서기 견습으로 들어감. 첫 달에 장부 틀린 칸 하나를 찾아 쫓겨날 뻔했다
- year: 275
  age: 29
  event: 국경군 보급 서기로 까마귀 문에 옴. 그때부터 겨울마다 솥 수를 센다
- year: 290
  age: 44
  event: 보급관에 오름. 전임 보급관은 장부 구멍 때문에 서리 길 쪽 성벽에 매달렸다
- year: 302
  age: 56
  event: 카스파르가 사령관에 오름. 첫 장부 검토에서 '병사가 먹는 만큼만 적어라'는 말을 들음 — 그 말대로 하려고 애쓴 십 년
- year: 309
  age: 63
  event: 짐꾼 막사 화재 뒤 불탄 곡식 장부를 정리하며 '등잔 사고'의 숫자를 맞춤. 숫자는 맞았고 마음은 맞지 않았다
- year: 311
  age: 65
  event: 남작령 귀리 입고가 장부와 어긋나기 시작함. 헨릭의 인장이 찍힌 수송 영수 한 장을 따로 챙김
- year: 312
  age: 66
  event: 병사 급료가 석 달 밀림. 카스파르가 사비로 귀리를 되사는 영수를 대신 쓰기 시작함
appearance:
