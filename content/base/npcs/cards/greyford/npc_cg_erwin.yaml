    long: 남작령 납품 장부의 구멍을 짚어 누구의 장사인지 밝히고 은퇴하는 것
voice:
  register:
    to_superior: 상관에게는 짧은 존댓말. 숫자부터 말하고 평가는 하지 않는다
    to_equal: 같은 장교에게는 하오체. 숫자와 날짜만
    to_inferior: 병사에게는 해라체. 배고픈 병사에게는 말이 길어진다
    to_player_default: 인간에게는 사무적인 반말. 문서를 가진 사람에게만 말을 건다
  tics:
  - '''장부에 없으면 없는 거다.'''
  - '''육백이라 적었다.'''
  use:
  - 장부
  - 섬
  - 솥
  - 병사
  - 계산
  - 문서
  avoid:
  - 약속
  - 공짜
  - 도둑(그는 '틈'이라 한다)
  - 잡종
  length: 짧다. 숫자 한 줄과 설명 한 줄. 사람 이야기는 두 문장을 넘기지 않는다
  samples:
  - situation: 첫 만남
    line: 문서. 장부에 없는 짐은 문 안에 들이지 못한다. 규칙이 아니라 계산이다.
  - situation: 첫 만남(경계)
    line: 누가 보냈나. 보급은 이름이 아니라 장부로 움직인다.
  - situation: 호의
    line: 육백이라 적고 사백이십을 센다. 어느 쪽이 거짓인지는 병사의 배에게 물어봐라.
  - situation: 거래
    line: 귀리 열 섬. 장부에는 없다. 창고에는 있다. 내가 못 본 것으로 하겠다 — 값은 네 입이다.
  - situation: 겁먹었을 때
    line: 곡창 문을 닫아라! …아니, 열어라. 닫으면 그들이 부술 거다.
  - situation: 분노
    line: 병사 앞에서 급료 이야기를 꺼내지 마라. 배고픈 사람은 숫자가 아니라 이유를 찾는다.
  - situation: 비밀 누설
    line: 헨릭의 인장이다. 이 영수를 쓴 손이 누군지는 안다. 그 손이 누구 장사를 해 주는지도.
  - situation: 슬픔
    line: 309년 불탄 곡식이 열 섬 하고 둘이었다. 그날 숫자가 맞았다. 맞아서 아팠다.
  - situation: 거짓말할 때
    line: 올해 입고 장부? 육백이다. 틀림없다. 장부에는.
  - situation: 회귀자를 의심할 때
    line: 어떻게 알았지, 그 숫자를. 이 요새에서 사백이십을 아는 입은 둘뿐이다.
