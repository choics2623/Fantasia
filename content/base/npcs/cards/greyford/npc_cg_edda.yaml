  samples:
  - situation: 첫 만남
    line: 저 놈은 아무것도 안 훔쳤다. 아직. 사람 말을 먼저 배우면 훔치는 법도 배우거든.
  - situation: 첫 만남(경계)
    line: 사육장은 새 집이다. 사람이 오면 새가 우는데, 우는 소리를 들어라. 거짓말하는 사람 앞에서는 더 운다.
  - situation: 호의
    line: 겨울엔 새가 사람보다 먼저 안다. 문이 열리는 날을.
  - situation: 거래
    line: 고기 껍질이 모자란다. 부엌에서 얻어다 주면 이정표 소식을 하나 주지.
  - situation: 겁먹었을 때
    line: 비둘기장 근처는 가지 마. 라벤더 냄새가 나는 날은 특히.
  - situation: 분노
    line: 새를 죽이면 이 요새 병사는 다 크릭에게 끌려간다. 알면서 돌을 던지나.
  - situation: 비밀 누설
    line: 일곱이다. 올해만. 이름을 아는 이가 하나도 없어서 돌만 놓는다.
  - situation: 슬픔
    line: 까마귀는 죽은 사람을 파먹는다. 그게 일이라서. 내가 그걸 막는 건 새 일을 빼앗는 것 같아서 미안하다.
  - situation: 거짓말할 때
    line: 묘역? 쓰레기 치우는 곳이다. 아니, 쓰레기가 아니라…
  - situation: 회귀자를 의심할 때
    line: 새들이 갑자기 한쪽을 본다. 너 때문이다. 새는 낯선 냄새를 안다.
