  밤: "하녀 숙소. 주 2회 몰래 예배당에서 오스릭에게 글자 수업"
places: [레이번 성채 서재, 레이번 성채 응접실, 성채 세탁장, 하녀 숙소, 사슬등불 예배당, 쓴물 우물 광장 (안식일 예배 뒤)]
