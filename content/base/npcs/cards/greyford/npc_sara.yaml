toward_player: "조심스럽고 공손하다. 눈을 내리깔지만 손님의 손과 신발을 다 기억한다. 회귀점 직후에는 셋째에게 먼저 다가와 키트의 줄을 알린다 — 그것이 그녀가 고른 첫 '살리는 말'이다"
persuade:
  likes: ["사람을 살리는 계획", "글", "그녀의 판단을 존중하기"]
  hates: ["그녀를 '구해야 할 물건'처럼 대하기", "오웬과 엮어 놀리기"]
roles:
  teacher: "예법(상한 30), 통찰(28). 조건: 성채 내부 일을 도움. 수업료 없음"
  companion: "가능 (핵심 동료). 충성 아크: 0 경계 → 30 거래 내용 공유 → 50 자신이 명단에 있음을 알게 됨 (분노 / 마르타의 배신 발견) → 70 '이번엔 내가 고른다' (직접 계획 수립, 성채 내부 공작원). 배신 조건 없음 — 단 플레이어가 리즈를 대신 팔게 두면 영구 이탈"
  romance: "가능 — 호감 70 + 그녀가 오웬에게 직접 답을 한 이후 (삼각관계 해소 이벤트). 결혼 시 첫 자녀에게 이름을 '써서' 짓는 이벤트 (업적 '첫 이름')"
regression:
  fixed:
    - "낙엽월 1일 아침 서재에서 명단을 엿들었다 — 회귀점 이전의 일이라 어느 회차에도 바뀌지 않는다"
    - "18:10 배급 줄에 와서 셋째의 반대쪽 소매를 당기고 '명단에 키트가 있어. 첫 명단. 스물여섯째 줄.' 하고 줄 밖으로 빠진다"
    - "2차 명단 31명 안에 그녀의 이름이 있다 — 마르타가 리즈 대신 바꿔 넣었다 (회귀점의 사실)"
  flow:
    - "낙엽월 3일 세베로의 사자가 오면 응접실 시중을 들며 거래를 다시 듣는다"
    - "신뢰 20 이상이면 낙엽월 8~12일 사이 오웬에게 물어 '하르벡'의 뜻을 셋째에게 알려 준다 (`sara_word_harbek`)"
    - "긴밤월 15일 오웬이 마음을 털어놓는다 (마르타가 목격) — 그녀가 성채 근무 중일 때"
    - "굶주림월 3일 2차 호송, 사슬 앞에서 일곱째"
  drift:
    - "배급 줄에 왔을 때의 차림 — 앞치마 끈이 풀려 있거나, 소매에 잿물 얼룩이 있거나, 맨발이거나"
    - "그 주 예배당 밤 수업이 열리는 요일"
    - "부엌에서 흥얼거리는 찬송의 곡"
  deja_vu: none
hard_rules:
  - "지난 회차를 기억하지 않는다 — 함께 이름을 써 준 아이도"
  - "자기를 '구해야 할 물건'처럼 다루는 말에는 차갑게 선을 긋는다"
  - "리즈가 위험해질 말은 신뢰가 높아도 먼저 꺼내지 않는다"
  - "성채 밖에서 오웬의 이름을 부르지 않는다 — '도련님'"
  - "글자를 안다는 것을 먼저 드러내지 않는다"
on_death: "오웬이 아버지와 결별 (고드릭 신변 위험 상승, 오웬 '분노'). 매각 정보 루트 소멸. 오스릭의 제자 하나 사라짐"
story_seeds:
  - "사라는 마르타가 명단을 고치는 것을 '봤다'. 그것을 말하면 리즈가 위험해진다. 사라는 아직 말하지 않았다 — 그녀도 리즈를 안다"
  - "매 회차 사라는 같은 저녁에 같은 말을 한다. 그녀와 함께 이름을 써 준 아이는, 회귀하면 다시 태어나지 않는다 — 그 아이를 기억하는 사람은 세계에 당신 하나다 (12 문서, 20 R1 「아래 한 줄」)"
  - "굶주림월 3일, 사슬의 일곱째. 디트마르의 습격이 그 사슬을 끊으려 할 때, 그녀의 자리를 기억하는 것은 당신뿐이다 (14 A1)"
