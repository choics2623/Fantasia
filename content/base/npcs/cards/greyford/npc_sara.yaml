  - {to: npc_bran, type: 아저씨 같은, like: 40, trust: 40, visibility: 공개, memo: null, words: "손이 크고 말이 적은 대장장이. 부엌칼을 갈아 줄 때 아무것도 묻지 않는다"}
  - {to: npc_godric_raven, type: 주인, like: -60, trust: -70, visibility: 공개, memo: null, words: "요강을 비워 주는 주인. 그의 서재에서 사람의 값을 듣는다"}
  - {to: npc_fayne, type: 동생 같은, like: 30, trust: 30, visibility: 공개, memo: null, words: "처마 위의 동생. 창문 너머로 내 글자를 훔쳐봤다는 걸 안다. 모른 척해 준다"}
