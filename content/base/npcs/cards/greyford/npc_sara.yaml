relations:
  - {to: npc_owen_raven, type: 두려운 관심, like: 20, trust: 10, visibility: 일방, memo: null, words: "북탑 창가에서 나를 보는 도련님. 다정한 눈인데, 용인의 다정은 노예에게 대개 재앙이었다"}
  - {to: npc_martha, type: 믿었던 이, like: 10, trust: 30, visibility: 비밀, memo: 명단 교체 목격, words: "나를 세탁장에서 올려 준 아주머니. 그 밤 등잔 아래서 리즈의 이름을 긁어냈다. 그 자리에 무엇을 썼는지는 못 봤다"}
  - {to: npc_osric, type: 스승, like: 70, trust: 75, visibility: 비밀, memo: null, words: "글자를 준 사람. 둘 다 목숨을 걸고 있다는 걸 둘 다 안다"}
