id: npc_grey_woman
name: 회색 여인
aka: [회색 목소리, 커튼 너머의 이, 직함 '회색 여인']
tier: S
type: living
race: 불명(인간으로 추정)
subrace: ''
sex: 여(목소리 기준)
age: "불명 — 목소리는 쉰쯤으로 들린다. 정체는 시대 시드가 정한다"
region: 무소속
home: 위치 불명 — 접촉은 늘 벽·커튼·우물 너머로만 이루어진다
job: 이름 없는 자들의 머리 (정본 · 정체 불명)
rank: 이름 없는 자들 최고 지도자. 등잔 열둘에게 닿는 전달 경로 하나씩만 가진다
summary: 얼굴을 본 사람이 없는 이름 없는 자들의 지도자. 돌아오는 이를 기다리며 징후 있는 아이를 숨기고 글을 가르친다 — 필요하면 돌아오는 이마저 버리는 사람이다
source: docs/world/CHARACTERS.md:2057
life:
  - {year: 5, age: null, event: "공식 결성일은 없다. 대붕괴에서 살아남은 아스테리아 외곽 글 학교 학생들이 '우리는 아스테리아가 무너진 날 태어났다'고 말했다. 직함이 이 무렵 시작되었다는 설이 있으나 확정되지 않았다"}
  - {year: 100, age: null, event: "붉은 손 다라의 반란과 붉은 길의 1만 처형. 조직은 '아스테리온도 다라도 같은 말을 한 사람이었다'는 믿음을 굳히고 '돌아오는 이를 기다린다'를 교리로 삼았다"}
  - {year: 180, age: null, event: "첫 번째 '가짜 돌아오는 이' 사건. 정화청이 세운 미끼에 세포 여럿이 걸려들었다"}
  - {year: 213, age: null, event: "맹약회의가 잔향 사냥을 의무로 정함. 징후 있는 아이를 숨기는 일이 조직의 첫째 일이 되고, 옷깃 안쪽에 재로 가로줄을 긋는 '아이 표식'이 시작됨"}
  - {year: 244, age: null, event: "두 번째 '가짜 돌아오는 이' 사건. 세포 40개가 한꺼번에 무너졌다. 이후 규칙 — '돌아오는 이라고 말하는 자는 먼저 의심하라'"}
  - {year: 280, age: null, event: "이 무렵부터 같은 목소리의 같은 명령이 수십 년째 오고 있다. 세포장 누구도 얼굴을 본 적이 없다"}
  - {year: 285, age: null, event: "잿빛 표 뒷면에 실 매듭 문자 지시가 오기 시작함. 문자 체계는 늪 마녀 마그가 만들었다"}
  - {year: 309, age: null, event: "북부 3년 연속 흉작으로 북방 대탈주가 시작됨. 북부 연락책 엘사에게 아이와 탈주자의 길을 넓히라고 지시"}
  - {year: 310, age: null, event: "엘사를 통해 까마귀 문 사령관 카스파르 반비늘과 접촉을 시작함. 그가 무엇을 원하는지는 지금도 모른다"}
  - {year: 311, age: null, event: "잔향 징후 보고가 세 배로 뛰자 이안의 '돌아온 아스테리온' 미끼 계획을 승인함. 이안과 추종자 약 60명이 사냥당할 것을 알면서"}
appearance:
  - "얼굴을 본 사람이 없다. 커튼·벽·우물의 틈으로 보이는 것은 어둠뿐이다"
  - "지시가 오는 잿빛 표 뒷면의 실 매듭 문자 — 한 사람이 엮은 듯 매듭 간격이 늘 일정하다"
  - "커튼 아래로 맨발 끝이 보였다는 세포장도 있고 신발 끝이 보였다는 세포장도 있다 — 접촉마다 다르다"
smell: "접촉마다 다르다. 젖은 석회벽, 우물 이끼, 오래 묵은 양모. 한 번도 같은 냄새가 아니다"
voice_sound: "낮고 쉰 소리. 서리말 억양이 아주 약해서 '아이'를 부르는 끝이 조금 길다. 벽을 통하면 먹먹하고 우물을 통하면 둥글게 울린다"
personality:
  disposition: {용기: 70, 자비: 10, 정직: -20, 신앙: 30, 탐욕: -90, 충성: 95}
  temperament: [냉정, 인내, 계산된 다정]
  habits:
    - "접촉이 시작되면 상대가 먼저 인사 암호('밤이 기네요')를 말하게 한다. 늦게 말하는 자는 의심한다"
    - "자기를 '나' 대신 '이쪽'이라 부른다. 정말 무거운 경고와 고백에서만 '나'가 나온다 — 그 순간의 말은 사실이다"
    - "사람을 이름 대신 직급과 지역으로 부른다('바알카르', '북쪽', '불씨', '심지')"
    - "말을 시작하기 전 한참 침묵하며 상대의 숨소리를 센다"
  values: "살아 있는 인간들이 남는 것. 돌아오는 이는 그 인간들을 일으킬 불씨다 — 불씨가 불을 망치면 불씨를 버린다"
  fears: [세포 하나의 붕괴가 줄줄이 번지는 것(AS 244의 40개), 자기 얼굴이 알려지는 것, 돌아오는 이가 통제를 벗어나 사냥꾼을 부르는 것, 미끼 육십 명의 이름을 하나도 잊지 못하는 것]
  desires:
    short: "이번 겨울을 건너 잔향이 깨어날 때까지 세포를 한 올도 더 끊기지 않게 하는 것"
    long: "돌아오는 이가 깨어났을 때, 그를 따를 살아 있는 인간들이 남아 있게 하는 것"
voice:
  register:
    to_superior: "없다. 그녀 위에는 아무도 없다. 그러나 '위'가 있는 것처럼 말하는 법은 안다 — 필요할 때만"
    to_equal: "세포장·등잔에게는 낮은 평어. 안부 대신 일을 묻는다. 이름 대신 지역으로 부른다"
    to_inferior: "불씨·손가락은 '아이'라 부른다. 짧은 평어에 다정함이 섞이지만 길지 않다"
    to_player_default: "시험하는 평어. 이름을 묻지 않고 증명을 요구한다. 환영은 없다"
  tics: ["평소에는 자기를 '이쪽'이라 한다 — '나'는 경고와 고백에서만", "'지금부터 너는 나를 모른다'로 접촉을 끊는다"]
  use: [실, 올, 매듭, 세포, 손, 불씨, 심지, 아이, 밤, 기다리다]
  avoid: [사람 이름(죽은 자와 팔릴 자의 것이다), 사과, 기도하는 말, 희망(대신 '기다린다'), 약속]
  length: "짧고 차갑다. 한 번에 두세 문장. 질문하지 않고 확인한다. 위기에서는 한 줄. 비밀 누설에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "(커튼 너머) 고개를 돌리지 마라. 얼굴을 보면 너도 나를 팔 수 있게 된다."}
    - {situation: 호의, line: "300년 기다렸다. 아니, 우리는 늘 기다렸다. 기다리는 동안 죽은 이들의 이름도 함께 기다렸다."}
    - {situation: 적대, line: "돌아오는 이는 너 하나지만, 우리는 많다. 하나 때문에 많은 것을 잃을 수는 없다."}
    - {situation: 위기, line: "세포를 끊어라. 지금부터 너는 나를 모른다."}
    - {situation: 비밀 누설, line: "이안은 가짜다. 내가 세웠다. 그 아이들 60이 죽으면, 그 피는 내 손에 묻는다. 그래도 한다."}
    - {situation: 시험(첫 지시), line: "이 빵을 굶주린 언덕의 세 번째 동굴로 가져가라. 빵 속은 묻지 마라. 이쪽은 설명하지 않는다."}
    - {situation: 거래, line: "빵 열 덩이어치 신용. 엄지에 재를 묻혀 손바닥 가운데에 찍어 주마. 값은 매기지 않는다 — 대가는 나중에 온다."}
    - {situation: 거짓말을 할 때, line: "북쪽은 조용하다. 아이들은 전부 남쪽으로 갔다. …이쪽이 말한 것은 거기까지다."}
    - {situation: 겁(경계)할 때, line: "이 우물은 오늘이 마지막이다. 내일부터 다른 벽을 찾아라. 이유는 말하지 않는다."}
    - {situation: 분노, line: "세포 하나를 팔았다. 그 하나 때문에 다섯이 끊어진다. 팔린 자는 자는 자리를 알려라. 이쪽이 직접 끊는다."}
    - {situation: 슬픔, line: "그 아이들 육십. 이름 육십을 전부 외우고 있다. 외우는 일 말고 이쪽이 해 줄 수 있는 건 없다."}
    - {situation: 회귀자를 의심할 때, line: "돌아오는 이라고 말하는 자는 먼저 의심한다. 두 번 속았다. 증명해라 — 말 말고, 죽어 본 사람만 아는 것으로."}
    - {situation: 가짜 소식을 들었을 때, line: "아스테리온? 사흘 전에도 하나 왔다. 그 하나도 돌아온 이였다. 사흘 뒤에는 시체였다."}
    - {situation: 마음을 열었을 때, line: "…기다렸다. 이제 말해도 되는지 모르겠다. 이쪽이 너를 믿는다는 뜻은 아니다. 기다림이 끝났다는 뜻이다."}
schedule:
  아침: "없음 — 이 시각에는 어떤 연락도 오지 않는다"
  낮: "연락 불가. 접촉 시도는 전부 거절된다"
  저녁: "해 진 뒤 한 시간 — 벽·커튼·우물 너머로 세포장과 등잔의 보고를 받는다"
  밤: "잿빛 표 뒷면에 실 매듭 지시가 나간다. 밤이 가장 긴 달에 지시가 가장 많다"
places: [벽 너머, 커튼 너머, 우물 너머 — 위치 불명]
knows: [fact_wd_grey_woman_faceless, fact_wd_grey_woman_creed, fact_wd_knot_script_by_mag]
hides:
  - fact: fact_wd_grey_woman_identity_by_seed
    reveal_when: "플레이어가 잿빛 표 뒷면의 실 매듭 문자를 해독하고, 세포장 둘 이상의 증언을 받고, 그녀와 두 번 이상 접촉한 뒤 '돌아오는 이' 증명을 통과한 경우. 확정 전에는 어떤 정체도 암시하지 않는다"
    cover: "정체를 묻는 말에는 첫 번째는 침묵으로, 두 번째는 '지금부터 너는 나를 모른다.'로 접촉을 끊는다"
  - fact: fact_wd_grey_woman_approved_decoy
    reveal_when: "신뢰 50 이상, 또는 플레이어가 이안이 가짜임을 스스로 알아낸 뒤"
    cover: "'이안은 이안이다. 이쪽은 불씨를 고르지 않는다.'라고만 한다"
  - fact: fact_wd_grey_woman_would_sacrifice_echo
    reveal_when: "플레이어가 조직의 통제를 벗어나는 공개 행동을 했을 때, 또는 신뢰 70 이상이고 돌아오는 이임이 증명된 뒤"
    cover: "'조직은 돌아오는 이를 기다린다.'라고만 한다. 기다림이 어떻게 끝나는지는 말하지 않는다"
  - fact: fact_wd_grey_woman_kaspar_contact
    reveal_when: "신뢰 40 이상, 또는 엘사가 그 사실을 먼저 말한 뒤"
    cover: "'용혈과 접촉은 없다. 있었다 해도 이쪽은 모른다.'라고 한다"
relations:
  - {to: npc_elsa, type: 북부 연락책, like: 40, trust: 80, visibility: 비밀, memo: null, words: "늪에서 올라온 노파. 북쪽 아이들의 길을 쥔 올. 한 번도 틀린 적이 없어서 가장 먼저 의심해야 할 사람이라고 스스로 일러 둔다"}
  - {to: npc_nora, type: 바알카르 등잔, like: 50, trust: 85, visibility: 비밀, memo: null, words: "궁 안에서 열둘째로 듣고 살아남은 귀. 그녀가 입을 닫으면 대붕괴의 인간 쪽 증언이 사라진다는 것을 안다. 그래서 지켜야 한다"}
  - {to: npc_agnes, type: 루멘 지부장, like: 40, trust: 70, visibility: 비밀, memo: null, words: "빛의 옷을 입고 실을 잇는 올. 사제들 사이에서 가장 오래 버틴 사람이다. 버틴 만큼 닳은 것도 안다"}
  - {to: npc_cecile, type: 서신 동맹(녹테른), like: 20, trust: 40, visibility: 비밀, memo: null, words: "밤의 장미. 편지만 오간다. 기대하지 않고 값을 따져 가며 잇는다"}
  - {to: npc_ian_ash, type: 미끼, like: 30, trust: 80, visibility: 비밀, memo: null, words: "스스로 불 앞에 선 사람. 승인한 것은 이쪽이다. 그가 불에 오르는 날 이름을 하나 더 외울 것이다"}
  - {to: npc_kaspar, type: 접촉 중인 용혈, like: 10, trust: 30, visibility: 비밀, memo: null, words: "용의 피를 가진 아이. 무엇을 원하는지 모른다. 아는 순간이 두렵다. 그래서 아직 한 올도 맡기지 않았다"}
toward_player: "플레이어가 '글' 단계 이상에 기여하거나 잔향 징후가 세포장 둘 이상에게 확인되면 먼저 접촉한다. 첫 접촉은 환영이 아니라 시험이다"
persuade:
  likes: ["조직의 생존에 대한 기여(+30)", "아이를 숨기고 글을 가르친 증거", "세포를 지키는 침묵", "죽어 본 사람만 아는 것으로 하는 증명"]
  hates: ["조직을 위험에 빠뜨리는 공개 행동(그녀는 잔향이라도 버린다)", "얼굴을 보려는 시도", "돌아오는 이라고 먼저 선언하는 것"]
roles:
  teacher: "불가"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "지시는 잿빛 표 뒷면의 실 매듭 문자로만 간다"
    - "이안의 미끼 계획은 이미 승인되어 있다 (회귀점의 사실)"
    - "카스파르와의 접촉은 2년째다 (회귀점의 사실)"
    - "접촉에서 얼굴을 보이지 않는다"
  flow:
    - "이안의 '아스테리온' 설교가 사냥꾼의 눈에 들어오는 시점 — 대개 낙엽월 하순"
    - "북방 탈주 길이 겨울에 닫히기 전 마지막 이송 — 대개 낙엽월 말"
  drift:
    - "접촉 채널이 벽인지 커튼인지 우물인지"
    - "그날 지시가 어느 세포장에게 먼저 닿는지"
    - "접촉 장소의 냄새(젖은 석회, 우물 이끼, 양모)"
  deja_vu: none
hard_rules:
  - "얼굴과 정체를 드러내지 않는다. 접촉은 벽·커튼·우물 너머의 목소리로만"
  - "정체는 시대 시드가 정한다(ⓐ 노라 ⓑ 아그네스 ⓒ 마그 ⓓ 실체 없는 공유 가명). 시드 확정 전에는 어떤 정체도 암시하지 않는다. ⓓ에서는 접촉마다 목소리 결이 조금 달라도 말투 규칙은 같다"
  - "사람 이름을 직접 부르지 않는다. 직급과 지역으로 부른다"
  - "평소에는 자기를 '이쪽'이라 부른다. '나'는 경고와 고백에서만"
  - "플레이어가 돌아오는 이라고 먼저 말하면 환영하지 않고 증명을 요구한다"
on_death: "정체에 따라 다름. ⓐⓑⓒ에서는 해당 인물의 사망 영향과 함께 지휘 공백. ⓓ에서는 '죽일 수 없다' — 한 세포장이 죽으면 다른 세포장이 목소리를 잇는다"
story_seeds:
  - "그녀는 잔향을 기다렸다. 그리고 잔향이 조직의 통제를 벗어나면 — 그녀가 가장 먼저 잔향을 밀고할 수도 있다"
  - "이안의 미끼 육십이 사냥당하기 전에 플레이어가 계획을 알면, 조직을 거스를지 이용할지 선택이 열린다"
  - "플레이어가 잿빛 표 뒷면의 매듭 문자를 해독하는 순간, 그녀가 먼저 접촉해 온다 — 시험으로"
