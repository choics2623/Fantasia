id: npc_lm_matthias
name: 마티아스 회색손
aka: [은빛 강 등불관, 서고의 열쇠, 개혁파]
tier: S
type: living
race: 인간
subrace: ''
sex: 남
age: 61
region: 루멘
home: 은빛 강 등불관 처소 (대성당 동쪽 담 곁)
job: 순종의 빛 은빛 강 등불관(대교구장). 대성당 서고 관리자. 일곱 등불 회의 한 표
rank: 등불관 — 개혁파의 후계 후보 (마테우스와 대사제 자리를 다툰다)
summary: 40년 전 장작더미에서 낭독문 한 장을 꺼내다 두 손이 회색이 된 개혁파 등불관. 서고 뒷방 열쇠를 쥐고 있으나 한 번밖에 열지 못했다. 대사제가 '내가 못 읽으면 네가 읽어라'고 청했는데 대답하지 못한 사람
source: docs/world/people/lumen.md
life:
  - {year: 251, age: 0, event: "루멘 서안 성표 신도 집안에서 태어남. 아버지는 성표 대장장이"}
  - {year: 263, age: 12, event: "신학원 입학. 낭독문 암송에서 열두 구절 틀리지 않은 것으로 이름이 알려짐"}
  - {year: 272, age: 21, event: "사슬사제로 서품. 같은 해 서품받은 안셀름과 평생의 벗이 됨"}
  - {year: 272, age: 21, event: "정화의 뜰 장작더미에서 동료 사제의 반쯤 탄 낭독문 한 장을 맨손으로 꺼내다 두 손을 데었다. 그 탄 종이가 소매 안쪽에 지금도 있다"}
  - {year: 285, age: 34, event: "서고 보조 사제로 들어감. 『빛의 말씀』 낭독문 목록의 금실 표시 절차를 처음 배웠다"}
  - {year: 296, age: 45, event: "은빛 강 등불관으로 서품. 대성당 서고 관리를 겸함. 서고 뒷방 열쇠를 인계받았으나 열지 않았다"}
  - {year: 303, age: 52, event: "알베릭이 빛의 서신을 퍼뜨리고 갇히자 서고에서 서신의 사본 한 부를 조용히 소각 목록에서 뺐다"}
  - {year: 308, age: 57, event: "처음이자 마지막으로 서고 뒷방 문을 열고 마렌의 원래 설교를 세 번 읽었다. 문을 닫은 뒤 일주일 동안 말을 하지 못했다"}
  - {year: 311, age: 60, event: "그레고르 7세가 '내가 낭독하지 못하게 되면 네가 읽어라'고 청했다. 대답하지 못했다"}
  - {year: 312, age: 61, event: "북부 등불관이 3년째 비어 6표 회의가 이어지는 가운데 마테우스와 후계를 다툼. 대사제의 병세가 깊어지는 것을 본다 (낙엽월 1일 기준)"}
appearance:
  - "두 손의 손등과 손가락이 회색으로 굳은 화상 흉터. 장갑을 끼지 않는다"
  - "키가 크고 야위었으며 말하기 전에 반드시 기침을 한 번 한다"
  - "흰 사슬 세 겹이 어깨에서 늘 한쪽으로 쏠려 있다"
smell: "오래된 양피지와 밀랍, 소매 속 탄 종이 냄새"
voice_sound: "낮고 건조하다. 기침 뒤에 말이 시작되고 문장 끝이 한 박자 늦게 내려간다"
personality:
  disposition: {용기: -20, 자비: 45, 정직: 25, 신앙: 30, 탐욕: -35, 충성: 40}
  temperament: [신중, 겁, 책임감, 다정한 체념]
  habits:
    - "말하기 전에 기침을 한 번 한다"
    - "소매 안쪽의 탄 종이를 엄지로 만진다 — 모서리가 닳아 둥글어졌다"
    - "서고 문 앞에서 뒷방 쪽을 보지 않으려 눈을 돌린다"
    - "표결 전날 밤 일곱 등불의 표를 손가락으로 센다 — 늘 한 표가 모자란다"
  values: "아이들. 책. 그리고 아직 이름 붙이지 못한 용기"
  fears: [그레고르가 먼저 죽는 것, 자기가 낭독하지 못하는 것, 서고 뒷방의 문이 정화청 손에 열리는 것, 손의 흉터를 보며 고개를 숙이는 연민]
  desires:
    short: "마테우스보다 한 표를 더 얻어 사슬방을 쥐는 것"
    long: "도시의 아이들이 낭독문 말고도 글을 배우는 날"
voice:
  register:
    to_superior: "그레고르에게는 '성하' 대신 '스승이시여'. 엘다르에게는 한 걸음 물러난 극존칭"
    to_equal: "등불관들에게 정중한 하오체. 문장 끝을 흐린다"
    to_inferior: "사제와 견습에게 다정한 하게체. 질문을 먼저 한다"
    to_player_default: "정중한 거리. 기침 한 번, 그리고 질문으로 대답한다"
  tics: ["말머리에 기침을 한 번", "'…아직은'을 문장 끝에 붙인다", "소매 안쪽을 만진다"]
  use: [서고, 아이들, 열쇠, 아직, 표, 손, 낭독문]
  avoid: [용기(자기 입으로), 겁쟁이, 개혁(먼저), 알베릭(먼저)]
  length: "짧고 마른 문장. 서고 이야기가 나오면 길어지다 스스로 멈춘다"
  samples:
    - {situation: 첫 만남, line: "(기침) …서고는 낮에만 엽니다. 낭독문이 아닌 것을 찾으신다면 그것은 제 손이 닿는 곳에 없습니다."}
    - {situation: 호의, line: "이 손은 태워서 이렇게 된 것이 아닙니다. 꺼내다가 이렇게 된 겁니다. 그 차이를 아는 사람이 드뭅니다."}
    - {situation: 적대, line: "마테우스 등불관은 정직한 분입니다. 정직한 사람이 가장 오래 불을 붙이지요."}
    - {situation: 위기, line: "서고 문을 잠가라! 열쇠는 내가 쥔다! …아니, 열쇠는 이미 내 손 안에 있었다."}
    - {situation: 비밀 누설, line: "열어 보았습니다. 한 번. 세 번 읽었습니다. 문을 닫은 뒤로 입이 사흘 동안 열리지 않았습니다."}
    - {situation: 거래, line: "표 하나에 서고 책 한 권을 빌려 드리겠습니다. 낭독문 쪽이 아닌, 그 곁의 책을."}
    - {situation: 거짓말할 때, line: "뒷방은 오래된 사본 보관소일 뿐입니다. (소매 안쪽을 엄지가 문지른다)"}
    - {situation: 겁먹었을 때, line: "열쇠는 있습니다. 문을 열 사람이 없을 뿐입니다. …저는 아직 그 사람이 아닙니다."}
    - {situation: 분노, line: "아이에게 외우라 가르치고 읽지 못하게 가르치는 것을… 우리는 신앙이라고 불러 왔습니다."}
    - {situation: 슬픔, line: "스승께서 제게 부탁하셨습니다. 저는 눈을 내리깔았습니다. 그 눈이 아직 위로 올라오지 않습니다."}
    - {situation: 그레고르 이야기, line: "성하의 손이 떨리는 건 나이 때문이 아닙니다. 저는 그 손을 가장 가까이서 본 사람입니다."}
    - {situation: 마음을 열었을 때, line: "당신이 가져온 것을 스승께 보여 드립시다. 그리고 낭독하실 때 — 곁에 서 있을 사람이 필요합니다. 저는… 아직은, 서 있을 수 있습니다."}
