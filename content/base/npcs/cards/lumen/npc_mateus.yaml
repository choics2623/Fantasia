story_seeds:
  - "그는 진짜를 원한다. 진짜가 나타나면 — 그가 태울 이유였던 212명은 무엇이었나. 그 질문이 그를 부술 수도, 더 잔혹하게 만들 수도 있다"
  - "베라가 타면 그는 213번째를 센다. 그녀를 꺼내면 그는 대신 누군가를 찾는다"
  - "그레고르가 죽으면 마테우스가 바로 알베릭의 서명을 한다"
