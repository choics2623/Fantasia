  - {to: npc_alberic, type: 이단, like: -80, trust: -90, visibility: 공개, memo: null, words: "글로 사람을 흔드는 이단. 그를 태우지 못하는 것은 서명이 없어서이고, 서명이 없는 것은 대사제가 떨기 때문이다"}
