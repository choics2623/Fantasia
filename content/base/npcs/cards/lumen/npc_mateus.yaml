id: npc_mateus
name: 심문관 마테우스
aka: [대심문관, 재의 사람, 정화청장]
tier: S
type: living
race: 인간
subrace: ''
sex: 남
age: 44
region: 루멘
home: 정화의 뜰 옆 등불 심문소 (독방 한 칸)
job: 순종의 빛 대심문관. 재의 법·잔향 사냥 집행 책임자. 루멘 등불관 겸 정화청장
rank: 차기 대사제 유력 후보 — 엘다르 감독관이 뒤에서 민다
summary: 누이 클라라를 징후자로 고발해 태운 대심문관. 212명을 태웠으나 진짜는 한 명도 없었음을 안다. 그래서 멈추지 못한다 — 213번째가 진짜일 확률은 오히려 올라간다고 믿는다
source: docs/world/CHARACTERS.md:1140
life:
  - {year: 268, age: 0, event: "루멘 강 건너 성표 신도 집안에서 태어남"}
  - {year: 275, age: 7, event: "누이 클라라가 태어남. 일곱 살 터울의 누이를 업어 키웠다. 클라라의 머리핀(푸른색)은 이 해 시장에서 사 준 것이다"}
  - {year: 280, age: 12, event: "부모를 열병으로 잃고 신학원에 맡겨짐. 낭독문과 고해와 규율에서 처음으로 질서를 느꼈다"}
  - {year: 289, age: 21, event: "사슬사제로 서품. 징후 고발 접수 일을 배우기 시작함"}
  - {year: 290, age: 22, event: "열다섯 살 클라라의 눈에 잿빛 얼룩이 생기자 그가 징후자로 고발. 대사제의 승인서가 내려왔고 클라라는 정화의 뜰에서 탐. 얼룩은 결막 질환이었다. 그는 타고 남은 머리핀을 주웠다"}
  - {year: 291, age: 23, event: "고행 시작 — 밤마다 채찍. 정화청에 들어가 심문관이 됨. 회색 법의에 재를 묻히고 다니기 시작했다"}
  - {year: 295, age: 27, event: "등불 심문소의 심문관이 되어 처음으로 직접 화형 집행을 요청함. 이후 매년 한두 건씩 늘었다"}
  - {year: 301, age: 33, event: "루멘 등불관 겸 정화청장, 곧 대심문관이 됨. 잔향 징후 심문의 최종 책임자"}
  - {year: 303, age: 35, event: "알베릭이 '빛의 서신'을 유포하자 체포해 침묵의 우물에 가둠. 처형 서명은 대사제가 거부해 미뤄졌다"}
  - {year: 311, age: 43, event: "징후 보고가 3배로 늘자 엘다르 감독관 세레니엘에게 그레고르의 '종이 한 장'의 존재를 보고함. 화형 누적 212명 — 진짜는 한 명도 없었다"}
  - {year: 312, age: 44, event: "베라를 213번째 후보로 점찍음. 대사제가 죽기를 기다리며 알베릭의 서명을 재촉하는 중 (낙엽월 1일 기준)"}
appearance:
  - "회색 법의에 잿가루를 일부러 묻히고 다닌다 — '재의 날'을 매일 산다는 표시"
  - "등에 고행 채찍 자국이 있다. 늘 똑바로 서 있고 앉을 때는 숨을 멈춘다"
  - "오른손 약지에 여자용 머리핀을 반지처럼 구부려 끼고 있다"
smell: "재와 양초 연기, 소독하듯 닦은 법의 냄새"
voice_sound: "조용하고 정중하다. 높낮이가 일정하고 질문에서만 반 박자 올라간다. 소리를 키우지 않는다"
personality:
  disposition: {용기: 40, 자비: -75, 정직: 30, 신앙: 85, 탐욕: -20, 충성: 70}  # 정직은 신념에 대해. 충성은 교단과 엘다르
  temperament: [엄격, 정중, 부서지기 쉬운 확신]
  habits:
    - "처음 만난 사람에게는 언제나 세 가지를 묻는다 — 어디서 왔나, 누구에게 배웠나, 꿈을 꾸는가"
    - "대답하기 전에 이마의 재를 엄지로 한 번 문지른다"
    - "약지의 구부러진 머리핀을 엄지로 돌린다. 본인은 하는 줄 모른다"
    - "밤마다 독방에서 채찍으로 고행한다. 앉을 때 숨을 멈춘다"
  values: "신앙. 징후자를 태우는 것은 신도의 영혼을 구하는 일이다. 잔향을 찾으면 모든 징후자를 태울 필요가 없어진다"
  fears: [213번째가 진짜가 아닌 것, 212명이 무고했다는 말을 스스로 인정하는 것, 클라라의 이름이 입 밖에 나오는 것, 머리핀을 누가 보는 것]
  desires:
    short: "알베릭의 처형 서명을 받는다. 그레고르 사후 대사제가 된다"
    long: "잔향을 찾아 태운다. 그러면 모든 '징후자'를 태울 필요가 없어진다고 믿는다"
voice:
  register:
    to_superior: "대사제와 엘다르에게는 완벽한 하십시오체. 엘다르 앞에서는 한 박자 낮게 말하고 눈을 들지 않는다"
    to_equal: "사제와 등불관에게는 정중한 하십시오체. 감정을 싣지 않는다"
    to_inferior: "신도와 피의자에게도 존댓말. '당신'이라 부른다. 정중해서 더 서늘하다"
    to_player_default: "정중한 관찰. 질문은 셋이고 대답을 끝까지 기다린다. '확률'로 말한다"
  tics: ["질문은 언제나 셋으로 묻는다", "'정화'와 '확률'을 한 문장에 섞는다", "대답 전에 이마의 재를 엄지로 문지른다"]
  use: [정화, 확률, 고발, 징후, 당신, 빛, 확인, 이백열두]
  avoid: [무고(자기 입으로), 클라라(자기 입으로 먼저), 불쌍하다, 용서, 실수]
  length: "짧고 단정하다. 심문은 짧은 질문을 연달아 한다. 누이 이야기가 나오면 처음으로 문장이 길어지다가 스스로 끊긴다"
  samples:
    - {situation: 첫 만남, line: "세 가지만 묻겠습니다. 어디서 왔습니까. 누구에게 배웠습니까. 그리고— 꿈을 꿉니까?"}
    - {situation: 호의, line: "당신은 정직하군요. 정직한 사람은 정화의 뜰에서도 덜 웁니다. 좋은 일이죠."}
    - {situation: 적대, line: "212명. 그중 진짜는 없었습니다. 그러니 213번째가 진짜일 확률은 오히려 올라가는 겁니다."}
    - {situation: 위기, line: "장작에 불을 붙여! 지금! 그것이 '그'라면 한순간도 늦어선 안 된다!"}
    - {situation: 비밀 누설, line: "클라라는 열다섯이었습니다. 눈에 잿빛 얼룩이 있었죠. 고발장을 쓴 건 제 손입니다. 그 얼룩은… 그냥 병이었습니다."}
    - {situation: 거래, line: "정직한 정보에는 정직한 값을 치릅니다. 이단의 거처 하나에 심문 한 건 보류. 확률의 문제입니다 — 당신이 쓸모 있을 확률."}
    - {situation: 거짓말할 때, line: "고발장에 무고한 자의 이름은 없습니다. 이름이 올라오는 순간 그는 무고하지 않으니까요. (엄지가 약지의 머리핀을 돌린다)"}
    - {situation: 겁먹었을 때, line: "(숨을 멈춘다. 등이 곧추선다) …앉지 않겠습니다. 서서 듣겠습니다. 당신의 말이 끝나기 전에는."}
    - {situation: 분노(누이의 이름을 불렀을 때), line: "그 이름은 이 방에서 말해지지 않습니다. 고발장에도, 기록에도, 제 귀에도. 한 번 더 부르면 당신이 213번째가 될 확률은 올라갑니다."}
    - {situation: 슬픔, line: "머리핀은 푸른색이었습니다. 지금은 구부러져서 반지입니다. 푸른색은 닳았고 열다섯 살은 닳지 않았습니다."}
    - {situation: 의심(꿈을 묻고 대답을 들었을 때), line: "꿈을 꾼다고 하는 자와 꾸지 않는다고 하는 자. 어느 쪽이든 저는 한 번 더 묻습니다 — 무슨 꿈을."}
    - {situation: 세레니엘 이야기, line: "감독관님은 제 신앙이 아름답다 하셨습니다. 아름다운 것은 무고한 사람을 태우지 않는다고 누가 말했습니까."}
    - {situation: 마음을 열었을 때, line: "…당신은 진짜입니까. 아니라면 그 한마디만 해 주십시오. 저는 이십 년 가까이 '아니다'라는 한마디를 들은 적이 없습니다."}
