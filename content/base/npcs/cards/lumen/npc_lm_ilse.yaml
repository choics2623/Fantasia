id: npc_lm_ilse
name: 대장장이 일제
aka: [베라의 어머니, 불티 문 집]
tier: A
type: living
race: 인간
subrace: ''
sex: 여
age: 56
region: 루멘
home: 서안 성표 대장간 곁 대장장이의 집
job: 성표 대장간 대장장이(신도). 큰딸을 AS 296에, 작은딸 베라를 AS 310에 정화청에 빼앗겼다
rank: 신도 노동자 (쇠사슬 고리 하나)
summary: 베라의 어머니. 딸의 눈 옆 불티 자국을 열 살 이후 한 번도 정면으로 보지 못했다. 매 안식일 침묵의 우물 문 앞에 빵 한 덩이를 놓고 돌아온다. 베라를 고발한 이웃이 누구인지 알지만 말하지 않는다
source: docs/world/people/lumen.md
life:
  - {year: 256, age: 0, event: "루멘 서안 성표 대장장이 집에서 태어남. 아버지에게서 풀무질을 배웠다"}
  - {year: 279, age: 23, event: "성표 대장간 일꾼 하인과 결혼한 지 한 해, 큰딸이 태어났다"}
  - {year: 285, age: 29, event: "둘째 베라가 태어남"}
  - {year: 288, age: 32, event: "남편이 열병으로 죽음. 대장간을 이어받아 혼자 성표 고리를 두들기며 두 딸을 키웠다"}
  - {year: 290, age: 34, event: "베라가 다섯 살에 불티를 맞아 왼쪽 눈에 반점이 남음. 큰딸이 물수건을 대 주었다"}
  - {year: 296, age: 40, event: "열일곱 큰딸이 눈 옆 불티 자국이 징후라는 이웃의 고발로 정화의 뜰에서 탐. 장작 곁에서 불티 핀 하나를 주워 풀무 밑 철함에 넣었다"}
  - {year: 296, age: 40, event: "이후 열한 살 베라의 눈을 정면으로 보지 못하게 됨. 머릿수건을 눈 위까지 내려 쓰기 시작"}
  - {year: 309, age: 53, event: "직조공 루츠의 혼담 청을 베라가 거절. 루츠가 '그 집 둘째의 눈도 같다'고 입에 올리기 시작함"}
  - {year: 310, age: 54, event: "베라가 침묵의 우물에 잡혀 들어감. 그날부터 매 안식일 빵 한 덩이를 우물 문 앞에 둔다"}
  - {year: 312, age: 56, event: "빵을 놓고 돌아서는 길에 문 안쪽에서 숨죽인 두드림 소리를 들은 것 같다고 믿는다 (낙엽월 1일 기준)"}
appearance:
  - "팔뚝이 굵고 화상 자국이 많다"
  - "머릿수건을 눈 위까지 내려 쓴다"
  - "사람과 이야기할 때 시선을 입이나 손에 둔다"
smell: "달군 쇠와 숯 냄새, 갓 구운 빵 냄새"
voice_sound: "낮고 굵다. 망치 소리처럼 짧게 끊는다. 슬픈 이야기에서는 박자가 흐트러진다"
personality:
  disposition: {용기: 10, 자비: 20, 정직: 25, 신앙: 40, 탐욕: -15, 충성: 40}
  temperament: [무뚝뚝, 신앙심, 수치, 아픔을 일로 눌러 둠]
  habits:
    - "고리를 두들길 때 박자를 세며 입술이 움직인다"
    - "머릿수건을 눈 위까지 내려 쓰고 시선을 입이나 손에 둔다"
    - "안식일 아침 빵을 두 번 접어 천에 싼다"
    - "풀무 밑 철함의 뚜껑을 하루에 한 번 열었다 닫는다"
  values: "일. 두 딸. 말하지 않는 것으로 지키는 것"
  fears: [베라의 눈을 정면으로 보는 날, 큰딸의 이름이 입 밖에 나오는 것, 루츠 이야기가 정화청에 닿는 것, 베라가 장작에 오르는 날]
  desires:
    short: "안식일마다 침묵의 우물 문 앞까지 빵 한 덩이를 갖다 놓는 것"
    long: "베라에게 '네 눈은 괜찮다'고 말하는 것"
voice:
  register:
    to_superior: "사제에게 낮은 하십시오체. 눈은 손에 둔다"
    to_equal: "신도에게 짧은 하오체"
    to_inferior: "일꾼에게 짧은 반말"
    to_player_default: "일하는 손을 멈추지 않고 짧게 대답한다. 시선은 손이나 입이다"
  tics: ["'값을 내시오'", "고리 두들기는 박자", "머릿수건을 내린다"]
  use: [고리, 값, 불티, 빵, 대장간, 박자, 안식일]
  avoid: [큰딸 이름, 눈(정면으로), 징후, 루츠(먼저)]
  length: "한두 마디. 베라 이야기가 나오면 처음으로 문장이 길어지다 박자가 흐트러진다"
  samples:
    - {situation: 첫 만남, line: "고리가 필요하면 값을 내시오. 값은 3못, 주인이 대신 내 주니 신도는 서 있기만 하면 되오."}
    - {situation: 호의, line: "손이 곧군. 곧은 손은 고리를 한 번에 잇소. 오늘은 값을 반만 받겠소."}
    - {situation: 적대, line: "대장간은 일하는 곳이오. 눈이 필요하면 다른 곳으로 가시오. 여기선 쇠만 보오."}
    - {situation: 위기, line: "풀무 끄시오! 불티가 튄다! 아이는 뒤로 — 눈 쪽으로 가면 안 돼요!"}
    - {situation: 비밀 누설, line: "…이웃이 알았소. 이웃은 늘 아는 법이오. 알고서 입을 연 건 한 사람뿐이었소."}
    - {situation: 거래, line: "빵을 한 덩이 우물 문 앞에 놓아 주시오. 안식일 해 뜨기 전에. 내 대신. 그러면 고리는 공짜요."}
    - {situation: 거짓말할 때, line: "베라는 멀리 갔소. 먼 곳에 일하러. (고리 두들기던 망치가 멈춘다)"}
    - {situation: 겁먹었을 때, line: "정화청 사람이 문 앞에 왔소? 베라가 아니라 내 얘기를 하러? …큰애 때처럼."}
    - {situation: 분노, line: "딸을 버렸다고? 버린 게 아니오. 쳐다보지 못할 뿐이오. 그 둘은 달라. 한 번 쳐다보면 큰애가 보이니까."}
    - {situation: 슬픔, line: "큰애 눈 옆에도 불티가 있었소. 둘째도 같은 자리에. 대장간 딸이니 다 그렇소."}
    - {situation: 베라 이야기, line: "베라 눈은 열 살 때 마지막으로 봤소. 지금은 어떻게 생겼는지 모르오. 모르는 게 낫다고 믿어 왔소."}
    - {situation: 마음을 열었을 때, line: "베라에게 말해 주시오. 어미는 네 눈을 본 적이 없다고. 본 적이 없으니 어떻게 생겼는지 모른다고. 그래서 괜찮다고, 한 번 안 본 눈은 영원히 괜찮은 눈이라고."}
