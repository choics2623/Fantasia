rank: 수녀 (순종의 빛 고리지기 서열) — 끊어진 고리의 루멘 지부장
summary: 순례자 숙소 지하의 '물 없는 우물'로 탈주자를 잿빛 실에 인도하는 수녀. 지금까지 214명이 그 우물을 지났다. 알베릭 구출을 준비 중이며 간수 한 명이 남았다
