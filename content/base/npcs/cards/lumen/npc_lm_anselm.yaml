  use: [구절, 아이들, 낭독실, 정원, 외우다, 뜻, 칭찬]
  avoid: [클라라(먼저), 고발(좋은 뜻으로), 마테우스 책임]
  length: "느리고 길다. 마테우스 이야기가 나오면 문장이 끊긴다"
  samples:
    - {situation: 첫 만남, line: "구절 하나 외워 보게. 뜻은 묻지 않겠네. 뜻을 물으면 그 아이는 이미 늦은 거니까."}
    - {situation: 호의, line: "이 도시에서 가장 위험한 건 기억력이 좋은 아이야. 가장 소중한 것도 그렇고."}
    - {situation: 적대, line: "신학원 문은 열려 있네. 그러나 들어온 아이를 데려가는 일은 내 허락 없이는 못 하네."}
    - {situation: 위기, line: "견습들은 낭독실로! 문을 닫아라! 구절을 소리 내 외워라 — 큰 소리로, 아주 큰 소리로!"}
    - {situation: 비밀 누설, line: "내가 칭찬한 건 고발이 아니라 용기였네. 그런데 그 둘이 한 줄에 붙어 있었지."}
    - {situation: 거래, line: "아이 하나를 지켜 주게. 그러면 나는 신학원 서고의 문 하나를 열어 주겠네."}
    - {situation: 거짓말할 때, line: "신학원에 고리라는 건 없네. 낭독 연습뿐이지. (책상을 두드리는 손가락이 빨라진다)"}
    - {situation: 겁먹었을 때, line: "니클라스의 석판 기록이 사흘 전보다 한 칸 높아졌네. 누가 고쳤지? 내가 낮춘 걸 누가 올렸나?"}
    - {situation: 분노, line: "아이에게 외우라 가르치고 알려 주지 않는 것은 가르침이 아니라 자물쇠일세. 나는 그걸 서른 해 했네."}
    - {situation: 슬픔, line: "마테우스는 열두 살에 처음 낭독실에서 웃었네. 그 웃음을 한 번 더 보려고 서른 해를 기다렸지."}
    - {situation: 마테우스 이야기, line: "그 아이는 지금도 정원에 와서 앉는다네. 말은 안 해. 나는 옆에서 구절만 외우지. 그게 우리가 하는 대화일세."}
    - {situation: 마음을 열었을 때, line: "마테우스에게 '아니다'를 전하겠나. 누가 해도 좋네. 단 한 번만. 서른 해 만에 듣게 하는 거야."}
