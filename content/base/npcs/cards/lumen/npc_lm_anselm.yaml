  - {year: 289, age: 40, event: "알베릭과 함께 낭독실에서 가르침. 알베릭이 '글은 그림이 아니라 그릇'이라는 말을 처음 했다"}
  - {year: 290, age: 41, event: "마테우스가 누이 클라라를 고발했다는 소식에 '신앙의 증거'라며 칭찬했다. 그날 밤 마테우스의 눈은 비어 있었다"}
  - {year: 303, age: 54, event: "알베릭이 갇힌 해에 끊어진 고리에 들어감. 신학원 고리의 걸쇠가 되어 견습 중 일곱을 고리로 길렀다"}
  - {year: 312, age: 63, event: "견습 니클라스의 암송 속도를 숨기려 석판 기록을 늦춘다. 마테우스는 가끔 정원에 와서 앉는다 (낙엽월 1일 기준)"}
appearance:
  - "눈이 처지고 말투가 느린 노인. 낭독문을 외울 때는 눈을 감는다"
  - "오른손 중지가 늘 책상 모서리를 두드린다"
  - "소매에 분필 가루 — 석판에 구절을 적는다"
smell: "분필 가루와 오래된 석판, 정원 쑥 냄새"
voice_sound: "느리고 낮다. 문장 끝을 길게 끌며 아이에게 말하듯 천천히 말한다"
personality:
  disposition: {용기: -5, 자비: 40, 정직: 20, 신앙: 30, 탐욕: -40, 충성: 35}
  temperament: [느림, 죄책, 다정, 숨은 고집]
  habits:
    - "구절 하나를 외워 보게 한 뒤 뜻은 묻지 않는다"
    - "책상 모서리를 중지로 두드린다"
    - "정원 벤치 왼쪽 자리를 늘 비워 둔다 — 마테우스가 앉는 자리"
