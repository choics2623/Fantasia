source: docs/world/people/lumen.md
life:
  - {year: 249, age: 0, event: "루멘 동안 배급소 서기 집에서 태어남"}
  - {year: 261, age: 12, event: "신학원 입학. 낭독문 암송에서 마티아스와 같은 줄에 앉아 평생의 벗이 됨"}
  - {year: 272, age: 23, event: "사슬사제로 서품. 마티아스와 같은 해. 신학원 교사로 남았다"}
