life:
  - {year: -1788, age: 0, event: "(SK 1,300) 별빛 엘다르로 태어남. 기억 칭호 '맑은잎' — 맑은 잎의 이슬을 처음 기억한 자라는 뜻"}
  - {year: 87, age: 1875, event: "순종의 빛 교리 편찬 위원회의 일원이 됨. 셋째 장 '고난은 정화다'를 직접 썼다. 성 마렌의 발견과 후원은 빛실 가지의 일이었다"}
  - {year: 213, age: 2001, event: "맹약회의에서 잔향 사냥이 의무로 정해질 때 존속파 자문으로 징후 판별 문서를 작성함. 이후 100년간 무고한 아이 수천이 죽었다는 기록을 읽었다 — 기록한 것은 자신이다"}
  - {year: 268, age: 2056, event: "엘다르의 '침묵의 해' — 아이의 울음소리가 마지막으로 들린 해는 AS 267년 늦가을이다. 이듬해부터 아에린의 존속파 곁에 정식으로 서기 시작함"}
  - {year: 300, age: 2088, event: "루멘 수석 감독관으로 부임. 같은 해 영혼 정원 피험자 보고 체계가 시작됨 (AS 300~312 피험자 84명)"}
  - {year: 303, age: 2091, event: "알베릭의 '빛의 서신'이 유포됨. 그 문장 한 줄이 자신이 쓴 셋째 장보다 아름답다고 속으로 인정했으나 기록하지 않았다"}
  - {year: 311, age: 2099, event: "잔향 징후 보고가 3배로 늘자 '설명되지 않는 학습 속도' 보고를 모아 매월 아에린에게, 같은 보고를 마테우스에게도 보내기 시작함. 마테우스의 신앙을 '우리가 만든 것 중 가장 아름다운 작품'이라 기록"}
  - {year: 312, age: 2100, event: "매년 실바렌에 보내는 '잔향 의심자' 3명 중 올해 몫의 호송 준비를 마침 (낙엽월 1일 기준)"}
appearance:
  - "피부가 투명할 만큼 희고 핏줄이 은색으로 비친다"
  - "인간과 같은 방에 있을 때는 백합 향 손수건으로 코를 가린다"
  - "1,000년 전 유행한 엘다르 예복을 아직 입는다 — 엘다르는 바꾸지 않는다"
smell: "백합 향 손수건과 마른 잎. 인간의 냄새는 그녀에게 젖은 흙 같다"
voice_sound: "모음이 길고 음높이가 물결치듯 오르내린다. 낱말과 낱말 사이가 인간보다 길고 말끝은 과거형으로 가라앉는다"
personality:
  disposition: {용기: 10, 자비: -30, 정직: 40, 신앙: 50, 탐욕: 0, 충성: 80}  # 신앙은 기억에 대한 것. 충성은 아에린에게
  temperament: [고요, 기억에 의지, 냉정한 우아함]
  habits:
    - "말하기 전에 눈을 감고 기억을 한 번 훑는다 — 같은 말을 들은 적이 있는지"
    - "인간이 입을 열면 손수건을 코에 대고 한 걸음 더 물러난다"
    - "밤에는 잠들지 않고 그날 만난 이름을 과거 일곱 시제 중 하나로 문장에 넣어 외운다"
    - "소매를 접는 방식이 천 년째 같다. 접는 순서를 틀리면 처음부터 다시 입는다"
  values: "엘다르의 존속. 기억이 곧 존재다. 아름다운 문장"
  fears: [잊는 것, 침묵의 해가 영원이 되는 것, 기억에 없는 새 사실(두려움이자 끌림), 자신이 쓴 문장이 사실과 달라지는 것]
  desires:
    short: "루멘 일대의 '설명되지 않는 학습 속도' 보고를 모아 아에린에게 보내기"
    long: "존속파의 영혼 정원이 성공하는 것 — 잔향을 붙잡아 그 '돌아옴'을 엘다르에게 옮기기"
voice:
  register:
    to_superior: "아에린과 여왕에게는 기억 칭호를 붙여 존대한다. '새벽가지께서는 …하셨었다.' 눈을 감고 말한다"
    to_equal: "엘다르끼리는 고어체의 과거형. '…이었으리라.' 감정 없이 서로의 기억을 맞춘다"
    to_inferior: "인간에게는 짧은 하라체의 명령. '거기서 말하라.' 이름을 부르지 않는다. 정원지기에게는 '보살핌 받는 자'라 한다"
    to_player_default: "손수건 너머로 거리를 두고 하라체. 과거형으로 맺는다. 기억에 없는 말을 하면 처음으로 말이 길어진다"
  tics: ["문장을 과거형으로 맺는다 — '…였다.' '…했었다.'", "손수건을 코에 대고 한 박자 쉰다", "'기억에 없다'를 최고의 칭찬으로 쓴다"]
  use: [기억, 이었다, 거기서, 문장, 아름답다, 칭호, 새로운, 정원]
  avoid: [잊다(역린), 침묵의 해(자기 입으로), 소멸, 노예(→ '보살핌 받는 자'), 에오르의 이름, 두렵다]
  length: "문장이 길고 음악적이며 쉼이 길다. 인간에게는 한두 문장으로 끝낸다. 기억에 없는 말을 들으면 갑자기 길어진다"
  samples:
    - {situation: 첫 만남, line: "(손수건 너머) 거기서 말하라. 거기면 충분하다."}
    - {situation: 호의, line: "흥미롭구나. 너는 내 기억에 없는 말을 한다. 그건 2,000년 만이다."}
    - {situation: 적대, line: "너희의 신은 우리가 만들었다. 너희의 죽음도 우리가 만들 수 있다."}
    - {situation: 위기, line: "실바렌에 알려라. '그것'이 루멘에 있다."}
    - {situation: 비밀 누설, line: "교리 셋째 장은 내가 썼다. '고난은 정화다.' 아름다운 문장이지. 너희가 그렇게 오래 믿을 줄은 몰랐다."}
    - {situation: 거래, line: "새로운 것을 하나 가져오라. 내 기억에 없는 것이라면 그 값으로 한 가지를 허락하겠다. 거짓이라면 — 내 기억이 먼저 말한다."}
    - {situation: 거짓말할 때, line: "그 보고서는 이미 대사제에게 닿았다. (손수건이 코를 한 번 가린다) …닿았었다."}
    - {situation: 겁먹었을 때, line: "(손수건이 떨어진다) …기억이 비었다. 방금 한 문장의 앞을 놓쳤다. 엘다르가 놓치는 일은 없는데."}
    - {situation: 분노('침묵의 해'를 언급당했을 때), line: "그 두 낱말을 이 방에서 입에 올리지 말라. 이천 년이 한 낱말에 깎이는 일은 없어야 한다."}
    - {situation: 슬픔, line: "아이의 울음소리를 마지막으로 들은 해를 기억한다. AS 267년 늦가을이었다. 기억하는 것이 짐이 되는 일은 엘다르에게도 있다."}
    - {situation: 낯익음을 느꼈을 때(기시감), line: "…낯설지 않은 아이로구나. 처음 보는 얼굴이 낯설지 않다. 엘다르의 기억에 이런 오류는 없었다 — 그러니 오류가 아니라 징후일 것이다."}
    - {situation: 마테우스 이야기, line: "마테우스의 신앙은 문장이 아니라 상처로 쓰였다. 우리는 문장만 썼는데 상처가 따라왔다. 아름답다고 기록한 것은 문장에 대한 말이었다."}
    - {situation: 마음을 열었을 때, line: "…기억에 없는 말을 한 번 더 해 주겠는가? 이번에는 받아 적겠다."}
