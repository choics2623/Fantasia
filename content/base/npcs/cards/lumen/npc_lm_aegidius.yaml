id: npc_lm_aegidius
name: 심문 사제 에기디우스
aka: [정화청의 오른손, 꿈을 받아 적는 자, 세 질문의 제자]
tier: A
type: living
race: 인간
subrace: ''
sex: 남
age: 38
region: 루멘
home: 등불 심문소 숙사
job: 심문 사제 — 정화청 약 40 중 마테우스의 오른손. 세 질문의 집행자. 313년 해빙월 북부 순회 심문을 맡는다
rank: 사슬사제 (정화청 — 검은 끈)
summary: 마테우스를 닮으려는 젊은 심문 사제. 심문에서 들은 꿈을 한 글자도 빼지 않고 적은 책을 갖고 있고, 그 가운데 오지 않은 일을 꿈꾼 일곱 건을 마테우스에게도 보고하지 않았다. 자기 손으로 '진짜'를 찾으려 한다
source: docs/world/people/lumen.md
life:
  - {year: 274, age: 0, event: "루멘 동안 성표 신도 집안에서 태어남. 열한 살에 신학원에 들어갔다"}
  - {year: 289, age: 15, event: "신학원 낭독 시험에서 안셀름의 칭찬을 받음. 같은 해 마테우스의 첫 심문 참관 기록을 필사하며 처음 '확률'이라는 말을 보았다"}
  - {year: 296, age: 22, event: "사슬사제로 서품. 같은 해 정화청에서 마테우스 밑에 들어가기를 자청했다"}
  - {year: 300, age: 26, event: "첫 단독 심문. 열한 살 소녀가 '하늘에 사슬이 없는 꿈'을 말하자 한 글자도 빼지 않고 적었다. 그 아이는 정화되었다"}
  - {year: 305, age: 31, event: "꿈의 책을 만들기 시작. 심문에서 들은 모든 꿈을 한 글자도 바꾸지 않고 적는다"}
  - {year: 309, age: 35, event: "서른 건의 꿈 가운데 '오지 않은 일'을 말하는 첫 기록을 발견. 마테우스에게 보고하지 않았다"}
  - {year: 311, age: 37, event: "일곱 번째 '오지 않은 꿈'을 적음. 기록의 이름은 책에만 있다. 가을 밀고가 3배 늘자 화형이 밀고를 늘린다는 계산을 처음 했다"}
  - {year: 312, age: 38, event: "토비아스와 사슬사제 서품 경쟁 중. 해빙월 북부 순회 심문관으로 지명될 예정 (낙엽월 1일 기준)"}
appearance:
  - "이마의 재가 늘 마테우스보다 엷다 — 일부러다"
  - "목의 검은 끈이 새것이다"
  - "눈이 맑고 속눈썹이 길다. 어린 사제 같다"
smell: "비누와 새 양피지, 어린 사제 같은 마른 비누 냄새"
voice_sound: "맑고 높낮이가 일정하다. 질문에서만 힘이 들어간다"
personality:
  disposition: {용기: 30, 자비: -35, 정직: 15, 신앙: 45, 탐욕: -15, 충성: 50}
  temperament: [열심, 맑음, 야망, 계산]
  habits:
    - "질문을 셋으로 묶고 세 번째 질문에서 상대의 손을 본다"
    - "대답을 한 글자도 바꾸지 않고 손바닥만 한 책에 받아 적는다"
    - "마테우스가 걷는 속도에 맞춰 반 보 뒤를 걷는다"
    - "밤마다 확률표를 새로 만든다 — 숫자 옆에 이름 대신 번호를 쓴다"
  values: "정확한 기록. 정화청장에 대한 충성. 자기 손으로 진짜를 찾는 것"
  fears: [마테우스가 대사제가 되기 전에 쓰러지는 것, 꿈의 책이 정화청 서랍에서 다른 손에 넘어가는 것, 자기의 확률이 틀리는 것]
  desires:
    short: "마테우스가 대사제가 되는 날 정화청장 자리를 이어받는 것"
    long: "자기 손으로 '진짜'를 찾아내는 것 — 마테우스가 못 한 일"
voice:
  register:
    to_superior: "마테우스에게 정중한 하십시오체. 존경이 문장마다 스며든다"
    to_equal: "심문 사제들에게 사무적 하오체. 토비아스에게는 한 박자 느린 정중함"
    to_inferior: "피의자와 견습에게도 존댓말. 맑은 눈으로 묻는다"
    to_player_default: "맑은 눈으로 존댓말. 질문을 셋으로 묶는다"
  tics: ["'세 가지만 여쭙겠습니다'", "받아 적는 시늉", "'한 글자도 바꾸지 않겠습니다'"]
  use: [꿈, 확인, 기록, 확률, 세 번째, 징후, 정화]
  avoid: [무고, 불쌍, 마테우스 의심, 꿈의 책(먼저)]
  length: "질문은 짧고, 대답을 기다리는 침묵이 길다"
  samples:
    - {situation: 첫 만남, line: "세 가지만 여쭙겠습니다. 어디서 오셨습니까. 누구에게 배우셨습니까. 그리고 — 어젯밤 무슨 꿈을 꾸셨습니까."}
    - {situation: 호의, line: "정직하게 대답하셨군요. 한 글자도 바꾸지 않겠습니다. 바꾸는 건 제 일이 아닙니다."}
    - {situation: 적대, line: "대답을 피하시는 것 자체가 기록입니다. 기록은 좋은 쪽으로도 나쁜 쪽으로도 쓰입니다."}
    - {situation: 위기, line: "문을 닫아라! 이 사람의 꿈은 기록이 끝나기 전에는 한 줄도 사라져서는 안 된다!"}
    - {situation: 비밀 누설, line: "꿈의 책은 일곱 줄을 따로 적어 두었습니다. 오지 않은 일을 말한 일곱 사람. 이름은 책에만 있습니다."}
    - {situation: 거래, line: "꿈을 말씀하시면 한 문장도 바꾸지 않고 적겠습니다. 이름은 적지 않겠습니다 — 번호만."}
    - {situation: 거짓말할 때, line: "제 책에 징후는 없습니다. 평범한 꿈들뿐입니다. (손바닥만 한 책을 소매에 밀어 넣는다)"}
    - {situation: 겁먹었을 때, line: "…일곱 번째 꿈은 정화청장님께 아직 올리지 않았습니다. 확인이 끝나기 전에는 올릴 수 없습니다."}
    - {situation: 분노, line: "정화청장님을 의심하는 말은 제 책에 쓰지 않습니다. 쓰는 순간 그 말을 한 사람이 책의 첫 줄이 됩니다."}
    - {situation: 슬픔, line: "열한 살 소녀는 하늘에 사슬이 없는 꿈을 말했습니다. 저는 그 말을 한 글자도 바꾸지 않았습니다. 그것이 제가 한 일입니다."}
    - {situation: 마테우스 이야기, line: "정화청장님은 누이를 고발하신 분입니다. 그것은 비밀이 아닙니다. 그분이 그 일을 어떻게 지니고 계신지가 비밀입니다."}
    - {situation: 마음을 열었을 때, line: "당신의 꿈을 아직 묻지 않았습니다. 묻지 않을 방법이 있다면 — 제가 먼저 확인해야 할 일이 하나 있습니다."}
schedule:
  아침: "고발장 정리, 마테우스 보고"
  낮: "심문(세 질문), 징후 판정 입회"
  저녁: "꿈의 책을 쓴다"
  밤: "22시 기도 뒤 독방에서 확률표를 만든다"
places: [등불 심문소, 심문실, 잿빛 저울실, 대성당]
