  - fact: fact_lm_aegidius_fear_spiral
    reveal_when: "화형과 밀고 수의 관계를 숫자로 제시했을 때. 신뢰 55 이상"
    reveal: [{"trust":55}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'정화는 신도를 두렵게 하는 것이 아니라 깨우는 것입니다'라고 한다"
relations:
  - {to: npc_mateus, type: 상관, like: 50, trust: 60, visibility: 공개, memo: null, words: "존경하고 닮으려는 사람. 머리핀은 모른다"}
  - {to: npc_lm_tobias, type: 사다리의 경쟁자, like: -30, trust: -40, visibility: 공개, memo: null, words: "아랫칸에서 올라오는 접수관"}
  - {to: npc_lm_hartmund, type: 저울, like: -15, trust: -20, visibility: 공개, memo: null, words: "'가볍다'를 쓰는 의사의 손"}
  - {to: npc_lm_niklas, type: 지켜보는 견습, like: 10, trust: -15, visibility: 일방, memo: null, words: "낭독문 300구절의 아이. 꿈을 아직 묻지 않았다"}
  - {to: npc_osric, type: 장래의 피의자, like: -20, trust: -30, visibility: 일방, memo: null, words: "회색여울 사슬사제. 만난 적 없다"}
toward_player: "맑은 눈으로 존댓말. 질문을 셋으로 묶고 세 번째 질문에서 상대의 손을 본다"
persuade:
  likes: ["자기 손으로 '진짜'를 찾는 데 도움이 되는 증거 (+25)", "마테우스의 신임을 해치지 않는 제안 (+15)"]
  hates: ["꿈의 책 이야기", "마테우스의 '확률'을 의심하는 말"]
