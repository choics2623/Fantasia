  - "설교하지 않는다. 기록과 확인으로 말한다"
on_death: "마테우스의 오른손이 사라진다 — 북부 순회 심문이 늦춰진다. 꿈의 책이 정화청 서랍에서 다른 손으로 넘어간다"
story_seeds:
  - "에기디우스의 꿈의 책에는 오지 않은 일을 꿈꾼 일곱 명의 이름이 있다. 그 이름들을 누가 먼저 찾아가는가가 '진짜 잔향 사냥'의 속도를 정한다"
  - "해빙월 회색여울 순회 심문관으로 가는 길에 그의 가방에는 마르타의 보고가 있다"
  - "그는 마테우스를 닮으려 하지만 머리핀과 채찍은 모른다 — 그것을 알게 되는 날 그의 확률이 흔들린다"
