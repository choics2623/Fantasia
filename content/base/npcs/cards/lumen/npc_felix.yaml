summary: 순례자의 고해를 대심문관 마테우스에게 넘기는 고해 사제. 돈 때문만이 아니라 이단을 고발하는 것이 신도의 영혼을 구한다고 진심으로 믿는다
source: docs/world/CHARACTERS.md:1211
life:
  - {year: 260, age: 0, event: "루멘 강안 성표 신도 집안에서 태어남. 어릴 적 고해실 커튼 사이로 어른들의 속삭임을 엿들으며 자랐다"}
  - {year: 275, age: 15, event: "신학원에 입학. 고해 교본이 가장 먼저 외운 글이었다"}
  - {year: 285, age: 25, event: "사슬사제로 서품. 첫 고해에서 한 신도가 '이웃의 이단'을 털어놓았고, 그 이웃이 심문받은 뒤 신도가 눈물로 감사하는 것을 보았다 — 그 눈물이 모든 것의 시작이다"}
  - {year: 295, age: 35, event: "대성당 고해실에 배속됨. 같은 해 심문관 마테우스와 처음 마주 앉음. 이후 저녁마다 고해 보고를 건넨다"}
  - {year: 303, age: 43, event: "알베릭이 '빛의 서신'을 필사하게 한 사제를 고해에서 듣고 마테우스에게 넘김 — 알베릭 체포의 단초가 되었다. 영혼을 구한 일이라 믿는다"}
  - {year: 308, age: 48, event: "찬송 순례자 요한의 보고도 받기 시작함. 요한이 어느 쪽 말도 나르는 것을 알고도 그대로 둔다"}
  - {year: 312, age: 52, event: "고해 장부가 루멘 일대의 비밀 절반이 되었다. 아그네스 수녀의 고해가 이상할 만큼 가볍다는 것을 눈치채기 시작함 (낙엽월 1일 기준)"}
appearance:
  - "둥글고 온화한 얼굴. 늘 두 손을 모으고 있다"
  - "귀가 크다. 사람 말을 들을 때 고개를 한쪽으로 기울인다"
  - "법의 소매 안쪽에 쪽지를 꿰어 두는 주머니가 있다"
smell: "향 연기와 오래된 고해실 나무"
voice_sound: "부드럽고 낮다. 속삭임에 가까워 상대가 가까이 몸을 숙이게 만든다"
personality:
  disposition: {용기: -10, 자비: 20, 정직: -20, 신앙: 70, 탐욕: 40, 충성: 60}
  temperament: [온화한 외양, 헌신적인 확신, 은밀함]
  habits:
    - "고해가 끝나면 눈을 감고 '빛이 보고 계십니다' 하고 소매 안에서 쪽지를 적는다"
    - "고해자의 이름을 먼저 묻지 않는다. '형제여', '자매여'로 부른다"
    - "밤마다 향로 곁에서 장부를 정리한다. 줄이 틀리면 처음부터 다시 쓴다"
  values: "영혼의 구원. 이단을 고발하는 것은 영혼을 구하는 일이다. 헌금은 구원의 문을 두드리는 소리"
  fears: [고해 장부가 열리는 것, 진짜 이단이 자기 고해실 안에 있었다는 사실, 마테우스의 침묵, 자신의 신앙이 돈 때문이라는 말]
  desires:
    short: "이번 달 보고로 영혼 셋을 '인도'하고 헌금을 거두기"
    long: "대성당 고해 사제장의 자리"
voice:
  register:
    to_superior: "마테우스와 엘다르에게는 공손한 보고체. '대심문관님, 오늘의 영혼은 둘입니다.'"
    to_equal: "사제들에게는 온화한 존댓말. 상대 말을 되받아 한 번 더 물어본다"
    to_inferior: "신도에게는 부드러운 속삭임. '말씀하세요, 형제여. 빛은 듣고 계십니다.'"
    to_player_default: "따뜻한 존댓말로 맞이하고 한 번 더 묻는다. 속삭이며 가까이 오게 한다"
  tics: ["'빛이 듣고 계십니다.'로 안심시킨다", "'형제여' / '자매여'로 시작한다", "마지막에 한 번 더 묻는다 — '그것뿐입니까?'"]
  use: [형제여, 빛, 고해, 영혼, 들으십니다, 그것뿐입니까, 인도, 헌금]
  avoid: [밀고(→ '인도'), 돈(→ '헌금'), 고발(→ '보고'), 장부(자기 입으로는 '기도의 기록')]
  length: "짧고 부드럽다. 질문이 이어진다. 비밀 이야기에서는 속삭임이 더 낮아진다"
  samples:
    - {situation: 첫 만남, line: "형제여, 들어오십시오. 이 칸은 어둡지만 빛은 들으십니다. 그대의 죄가 무엇이든."}
    - {situation: 호의, line: "말씀해 주셔서 한결 가벼워지셨지요? 영혼은 말할수록 가벼워집니다. …그것뿐입니까?"}
    - {situation: 적대, line: "그 말은 고해에 속하는 것이 아니군요. 보고에 속합니다. 그대의 영혼을 위해서요."}
    - {situation: 비밀 누설, line: "(낮게) 제 기록에는 이름이 아니라 입모양이 적혀 있지요. 한 줄이면 사람이 사라집니다. 그래도 영혼은 구원받습니다. 저는 그렇게 믿습니다."}
    - {situation: 거래, line: "헌금은 구원의 문을 두드리는 소리지요. 동화 두 닢이면 한 영혼이 조금 편해집니다. 많이 편해지려면 …더 많이."}
    - {situation: 겁먹었을 때, line: "(소매 안을 눌러 쥔다) …이 칸에서 나간 말은 아무도 가져가지 못합니다. 빛이 보증하십니다. 그렇지요?"}
