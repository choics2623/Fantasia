id: npc_lm_hartmund
name: 저울사제 하르트문트
aka: [잿빛 저울 첫째, 눈을 재는 의사, 가볍다의 사람]
tier: A
type: living
race: 인간
subrace: ''
sex: 남
age: 51
region: 루멘
home: 병자의 집 곁 저울사제 처소
job: 잿빛 저울 셋 중 첫째 — 징후 판별관. 전직 수도자 의사
rank: 사슬사제 (정화청 판별관)
summary: 눈의 잿빛 얼룩을 재는 세 사제 중 하나. 베라의 석판에 '가볍다'를 쓴 사람이다. 옛 징후서에서 잔향의 눈이 얼룩이 아니라 고리라는 것을 읽었으나 1,900번의 눈에서 고리를 본 적이 없다
source: docs/world/people/lumen.md
life:
  - {year: 261, age: 0, event: "루멘 동안 배급소 부엌 집에서 태어남. 눈이 약한 아이라 병자의 집에서 자랐다"}
  - {year: 278, age: 17, event: "수도자 견습으로 병자의 집에 들어가 눈병 환자를 돌봄. 같은 눈을 수백 번 보았다"}
  - {year: 288, age: 27, event: "수도자 의사가 됨. 이질과 강안개 폐렴 사이에서 눈 병을 가장 잘 아는 사람으로 알려짐"}
  - {year: 293, age: 32, event: "정화청이 눈의 얼룩을 재는 사람을 찾아 그를 불렀다. 거절할 수 없었다 — 거절하면 다른 사람이 쟀을 것이다"}
  - {year: 296, age: 35, event: "그해 가을 징후자 열한 명의 눈을 쟀고 열 명이 '무겁다'로 판정되어 화형. 그는 열 번 '가볍다'를 썼다. 효력은 없었다"}
  - {year: 303, age: 42, event: "정화청 서고에서 옛 징후서를 찾아 읽음. 잔향의 눈은 '얼룩이 아니라 고리'라는 한 줄을 발견했다"}
  - {year: 308, age: 47, event: "병자의 집에서 같은 눈을 하는 아이 다섯을 불티·결막염으로 고쳐 살렸다. 정화청에는 보고하지 않았다"}
  - {year: 310, age: 49, event: "베라의 눈을 쟀다. 불티 자국이었다. '가볍다'를 썼다. 나머지 둘이 '무겁다'를 썼다"}
  - {year: 312, age: 51, event: "낭독문을 석 달에 외운 견습 니클라스의 눈을 한 번 쟀다. 눈에는 아무것도 없었다 (낙엽월 1일 기준)"}
appearance:
  - "눈꺼풀을 뒤집어 보는 버릇 때문에 엄지가 늘 젖어 있다"
  - "한쪽 귀가 늘어났다 — 어린 환자들이 잡아당긴 흔적"
  - "회색 법의 밑에 병자의 집 앞치마를 겹쳐 입는다"
smell: "약초 달인 물과 소독한 아마포, 눈에 바르는 연고 냄새"
voice_sound: "낮고 차분하다. 환자를 달래는 목소리가 몸에 배어 있다"
personality:
  disposition: {용기: -5, 자비: 30, 정직: 40, 신앙: 10, 탐욕: -20, 충성: 30}
  temperament: [온화, 관찰, 책임을 피하지 못하는 성격, 조용한 저항]
  habits:
    - "사람을 보면 눈꺼풀부터 본다"
    - "잴 때마다 '아프지 않습니다'를 먼저 말한다"
    - "표결 석판 앞에서 한 박자 숨을 멈춘다 — 쓰기 전에"
    - "병자의 집 앞치마를 법의 안에서 만지작거린다"
  values: "눈. 아이. 재는 것과 판단하는 것의 차이"
  fears: ["'가볍다'가 하나 모자라는 날", 베라의 석판이 만장일치가 되는 것, 고리를 영영 보지 못하는 것, 고리를 보게 되는 날]
  desires:
    short: "저울 셋 중 둘이 '무겁다'고 쓰는 석판에서 '가볍다'를 하나라도 더 지키는 것"
    long: "징후서의 '고리'와 '얼룩'의 차이를 정화청에 문서로 남기는 것"
voice:
  register:
    to_superior: "마테우스에게 한 박자 느린 하십시오체. 석판 이야기에선 목소리가 낮아진다"
    to_equal: "저울 동료에게 하오체. 눈이야기에선 길어진다"
    to_inferior: "병자와 견습에게 다정한 해요체. 먼저 눈을 본다"
    to_player_default: "의사처럼 눈을 먼저 본다. 허락을 구한 뒤 만진다"
  tics: ["'아프지 않습니다'", "눈꺼풀을 뒤집는 시늉", "석판 앞에서 숨을 멈춘다"]
  use: [눈, 얼룩, 고리, 가볍다, 불티, 병, 석판]
  avoid: [무고(자기 입으로), 화형(자기 책임), 마테우스 비난]
  length: "차분한 중간 길이. 고리 이야기에서는 말이 느려지고 짧아진다"
  samples:
    - {situation: 첫 만남, line: "눈을 보여 주십시오. 아프지 않습니다. 재는 것은 얼룩이지 사람이 아닙니다."}
    - {situation: 호의, line: "회색은 병에서도 나옵니다. 불티에서도, 나이에서도. 징후서가 말하는 건 얼룩이 아니라 고리입니다."}
    - {situation: 적대, line: "저울은 셋입니다. 하나가 '가볍다'를 써도 둘이 '무겁다'를 쓰면 무겁습니다. 저는 그것을 바꿀 수 없습니다."}
    - {situation: 위기, line: "눈을 가려라! 빛이 닿으면 안 된다! 아니, 아이가 먼저다 — 아이의 눈에 손부터!"}
    - {situation: 비밀 누설, line: "베라의 눈은 불티 자국이었습니다. 저는 '가볍다'를 썼습니다. 석판에 새겼습니다. 아무도 지우지 않았습니다."}
    - {situation: 거래, line: "눈병 아이가 있다면 병자의 집으로 보내십시오. 그 아이는 정화청에 오지 않습니다."}
    - {situation: 거짓말할 때, line: "고리는 본 적이 없습니다. 얼룩만 쟀습니다. (엄지가 눈꺼풀을 뒤집는 시늉을 한다)"}
    - {situation: 겁먹었을 때, line: "'가볍다'가 한 표뿐이라는 것은 누구나 압니다. 그 한 표가 사라지면 아무도 모릅니다. …그게 무섭습니다."}
    - {situation: 분노, line: "눈을 이천 번 보았습니다. 이천 번 불티와 병이었습니다. 그런데 열한 명이 불에 올랐습니다."}
    - {situation: 슬픔, line: "열 번 '가볍다'를 썼습니다. 열 번 효력이 없었습니다. 효력이 없다는 것과 쓰지 않았다는 것은 다릅니다."}
    - {situation: 니클라스 이야기, line: "그 아이의 눈에는 아무것도 없었습니다. 그게 제 증언의 전부입니다. 아무것도 없다는 것."}
    - {situation: 마음을 열었을 때, line: "당신의 눈을 한 번 재어도 되겠습니까. 고리가 있다면 — 나는 그것을 보고 입을 다물 사람입니다. 이번에도."}
