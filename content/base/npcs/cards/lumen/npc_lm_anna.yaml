id: npc_lm_anna
name: 양초 안나 밀랍손
aka: [밀랍손, 동굴의 문지기, 잿빛 실 루멘 매듭]
tier: A
type: living
race: 인간
subrace: ''
sex: 여
age: 44
region: 루멘
home: 양초 공방 '등불지기' 공방장실
job: 양초 공방장(신도 노동자 40의 반장). 잿빛 실 루멘 매듭 — 탈주자를 모르바 늪길로 이어 주는 거점 지기
rank: 신도 노동자 — 잿빛 실의 루멘 매듭
summary: 루멘 양초의 3할을 만드는 공방장이며 공방 지하 강가 동굴에 탈주자 스무 명을 숨기는 사람. 밀물 판단을 한 번 잘못해 올해 둘을 잃었다. 안내인의 이름은 모르고 번호만 안다
source: docs/world/people/lumen.md
life:
  - {year: 268, age: 0, event: "루멘 서안 양초 공방 집안에서 태어남. 어머니가 공방 노동자였다"}
  - {year: 280, age: 12, event: "공방 견습. 밀랍을 달이다 팔에 화상을 입음 — 줄무늬 자국의 첫 번째"}
  - {year: 290, age: 22, event: "심지 매듭 반장이 됨. 매듭에 쪽지를 넣는 법을 처음 알았다"}
  - {year: 296, age: 28, event: "공방 지하에서 강가 동굴로 내려가는 판자를 우연히 발견. 전임 공방장이 그것을 알려 주고 죽었다"}
  - {year: 301, age: 33, event: "공방장이 됨. 첫 탈주자 셋을 늪길에 안내인에게 넘김"}
  - {year: 308, age: 40, event: "아그네스 수녀와 처음 연락이 닿음. 두 길이 만나 숫자가 늘어났다"}
  - {year: 311, age: 43, event: "여름 밀물에 입구가 잠기는 시각을 잘못 계산해 대기자 둘이 숨졌다. 이후 밀물표를 벽에 새겼다"}
  - {year: 312, age: 44, event: "공방에 소금을 대는 유타가 귀가 너무 크다는 의심이 생김. 확신하지 못한다 (낙엽월 1일 기준)"}
appearance:
  - "팔뚝에 밀랍 화상 자국이 줄무늬처럼 있다"
  - "목소리가 낮고 거칠다"
  - "심지 매듭을 손가락으로 세는 습관"
smell: "달군 밀랍과 면 심지, 강가 동굴의 젖은 흙 냄새"
voice_sound: "낮고 거칠다. 말을 짧게 끊고 숫자를 세는 것처럼 박자를 둔다"
personality:
  disposition: {용기: 45, 자비: 20, 정직: -5, 신앙: -15, 탐욕: -20, 충성: 50}
  temperament: [실무, 과묵, 용감, 의심]
  habits:
    - "심지 매듭을 손가락으로 센다 — 말하는 동안에도"
    - "밀물표를 벽에 새긴 자리에 손바닥을 한 번 댄다"
    - "하루 두 번 동굴 사다리 아래 숫자를 확인한다"
    - "새 얼굴을 보면 신발 밑창부터 본다 — 길을 걸은 흙을 읽는다"
  values: "숫자. 시간표. 이름보다 번호가 사람을 지킨다는 믿음"
  fears: [밀물을 다시 잘못 계산하는 것, 공방 노동자 중의 혀, 대기자가 한꺼번에 열 명을 넘는 것, 안내인이 돌아오지 않는 것]
  desires:
    short: "밀물에 입구가 잠기기 전에 대기처 스무 명을 다 보내는 것"
    long: "늪길에서 돌아오는 첫 사람을 만나는 것"
voice:
  register:
    to_superior: "사제에게 짧은 존댓말. 공방 일 이야기만 한다"
    to_equal: "아그네스에게 낮은 반말. 숫자로 말한다"
    to_inferior: "노동자에게 거친 반말. 명령은 숫자로"
    to_player_default: "일하는 손을 멈추지 않고 낮게 말한다. 양초 값을 먼저 묻는다"
  tics: ["숫자를 센다", "'밀물이다'", "새 얼굴 신발 밑창 보기"]
  use: [초, 심지, 밀물, 숫자, 번호, 사다리, 동굴]
  avoid: [은신처, 탈주자(큰 소리로), 이름, 서신]
  length: "짧고 거칠다. 밀물 이야기에서만 문장이 이어진다"
  samples:
    - {situation: 첫 만남, line: "초는 길수록 값이 비싸. 심지가 굵을수록 오래 타고 오래 탈수록 눈에 띄지."}
    - {situation: 호의, line: "숫자를 아는 사람이군. 번호가 이름보다 사람을 오래 지킨다는 걸 아는 얼굴이야."}
    - {situation: 적대, line: "공방은 일하는 곳이야. 구경하려면 초를 사고 가. 안 사면 문 앞에서 끝이야."}
    - {situation: 위기, line: "밀물이다! 뒷문 닫고 사다리 올려! 숫자부터 세 — 둘이 모자라면 문을 열지 마!"}
    - {situation: 비밀 누설, line: "동굴은 밀물에 잠겨. 하루 두 번 한 시간만 안전해. 작년에 둘을 잃었어. 밀물표는 벽에 새겨 놨고."}
    - {situation: 거래, line: "식량이 모자라. 귀리 한 자루면 대기자 스무 명이 사흘 먹어. 밀물 시각은 내가 알려 줄게."}
    - {situation: 거짓말할 때, line: "공방 지하는 밀랍 저장고뿐이야. 사다리? 그건 물통용이지. (심지 매듭을 세는 손가락이 빨라진다)"}
    - {situation: 겁먹었을 때, line: "열이 아니라 열하나가 내려가 있어. 하나가 더 내려갔다는 건 누가 알려 줬다는 뜻이야."}
    - {situation: 분노, line: "대기처를 은신처라고 부르지 마. 은신처는 숨는 곳이고 여기는 기다리는 곳이야. 기다리는 사람은 물때를 알아."}
    - {situation: 슬픔, line: "둘이 잠겼어. 번호만 알고 이름은 몰랐어. 그래서 장례도 번호로 치렀지."}
    - {situation: 유타 이야기, line: "소금장수는 귀가 커. 소금 한 자루에 소문 두 개를 가져가. 나는 그 둘을 다 세어 둬."}
    - {situation: 마음을 열었을 때, line: "내려와. 사다리는 서른 칸이야. 밀물표는 벽에 있어. 한 시간 안에 스무 명을 다 보내야 하니까 — 도와줄 손이 하나 더 필요해."}
