life:
  - {year: 262, age: 0, event: "바알카르–루멘 순례길 곁 교단 소유 마을에서 태어남. 아버지는 빵 굽는 사람"}
  - {year: 274, age: 12, event: "수도자 견습으로 루멘에 들어옴. 곡식 창고와 화덕에서 일을 배움"}
  - {year: 285, age: 23, event: "수도자 서원. 세 번째 고리 쉼터 화덕 보조로 파견됨"}
  - {year: 295, age: 33, event: "쉼터지기가 됨. 이름 장부에 점을 찍는 방식을 만들었다 — 점 하나·둘"}
  - {year: 303, age: 41, event: "쉼터에 묵던 낯선 순례자 하나가 화덕 곁에서 졸다 갔다. 다음 날 아침 재 속에 무언가가 있을 것이라고는 생각하지 못했다"}
  - {year: 307, age: 45, event: "열여덟 살 요한이 처음으로 쉼터에서 찬송을 불렀다. 이후 요한이 지날 때마다 빵을 한 덩이 더 얹었다"}
  - {year: 310, age: 48, event: "점 둘 허가증이 열 명을 넘는 날이 있었으나 열 명을 넘게 센 적이 없다고 보고했다"}
  - {year: 312, age: 50, event: "꽃월 축일 순례 때 300명이 몰려도 굶기지 않기 위해 곡식 창고 돌집을 한 동 더 지을 곡식을 모으는 중 (낙엽월 1일 기준)"}
appearance:
  - "손바닥이 늘 밀가루로 허옇다"
  - "눈 밑에 화덕 불똥 흉터"
  - "말하며 손가락으로 장부 줄을 짚는다"
smell: "갓 구운 빵과 재, 우물가 이끼 냄새"
voice_sound: "따뜻하고 바쁘다. 말 사이에 반죽 두드리는 소리가 섞이는 듯하다"
personality:
  disposition: {용기: 10, 자비: 45, 정직: 40, 신앙: 35, 탐욕: -40, 충성: 30}
  temperament: [다정, 정직, 바쁨, 눈감아 주는 사람]
  habits:
    - "새 순례자가 오면 이름과 마을을 먼저 묻고 장부에 적는다"
    - "점을 찍기 전에 허가증 인장 가장자리를 손톱으로 한 번 긋는다 — 아델을 흉내냈다"
    - "빵 굽는 날 화덕 앞에서 낮게 노래를 흥얼거린다 — 찬송 곡이다"
    - "해 지기 전에 우물 두레박 줄을 확인한다"
  values: "굶기지 않는 것. 빵. 순례자의 안전"
  fears: [순례자가 굶는 것, 점 둘이 열 명을 넘는 날, 화덕 밑에서 무언가 나오는 것, 정화청이 명부를 가져가는 것]
