summary: 바알카르–루멘 순례길 세 번째 쉼터의 빵 굽는 수도자. 화덕 밑 재 속의 잿빛 표 두 개를 모른다. 순례자 명부 이름 옆에 점 하나·둘로 허가증 확인 여부를 적는다
