    to_superior: "사제에게 공손한 하십시오체. 빵 이야기에서 풀린다"
    to_equal: "수도자에게 다정한 하오체"
    to_inferior: "순례자에게 바쁘고 따뜻한 해요체"
    to_player_default: "상냥하고 바쁜 목소리. 이름과 마을을 장부에 적으며 손을 본다"
  tics: ["'이름과 마을'", "장부 줄을 손가락으로 짚는다", "'식으면 값이 없소'"]
  use: [빵, 명부, 점, 화덕, 우물, 순례자, 침상]
  avoid: [잿빛 표, 정화청 보고, 확인 못 한 것(거짓이라고)]
  length: "짧고 바쁘다. 노래 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "이름과 마을. 침상은 짚 한 단. 빵은 해 지기 전에 오시오 — 식으면 값이 없소."}
    - {situation: 호의, line: "노래를 들으면 반죽이 더 부풀어. 거짓말 같지? 이십 년 구운 손이 하는 말이오."}
    - {situation: 적대, line: "허가증이 맞는지는 루멘에서 확인하오. 여기서는 점만 찍소. 점이 많은 사람은 오래 묵을 수 없소."}
    - {situation: 위기, line: "화덕에 물을 붓지 마시오! 재가 날리면 안 되오 — 아니, 그냥 불이나 끄시오!"}
    - {situation: 비밀 누설, line: "점이 둘이면 확인 못 한 거요. 확인 못 한 걸 거짓이라 쓰지는 않소."}
    - {situation: 거래, line: "곡식 한 자루면 순례자 서른이 사흘 먹소. 대신 명부 점 하나는 바꿔 줄 수 있소 — 하나만."}
    - {situation: 거짓말할 때, line: "점 둘 허가증은 올해 한 번도 열을 넘은 적이 없소. (손가락이 장부 줄을 한 줄 건너뛴다)"}
    - {situation: 겁먹었을 때, line: "화덕 밑을 파냈다고? 거긴 재뿐이오. 재뿐이라고 말하는 게 내 일이오."}
    - {situation: 분노, line: "순례자를 짐이라 부르지 마시오. 짐은 내려놓으면 되지만 사람은 먹이는 일이오."}
    - {situation: 슬픔, line: "축일 직후엔 이질로 서른이 누워. 그 서른을 위해 우물물을 끓이는 게 내 일이야. 끓여도 모자라지."}
    - {situation: 요한 이야기, line: "요한이 지나가면 빵 한 덩이를 더 얹소. 노래 한 곡값이오. 그 곡에 무슨 비밀이 있는지는 내가 몰라도 되오."}
    - {situation: 마음을 열었을 때, line: "화덕 밑 재 속에 뭔가 있다는 말을 들었소. 내 손으로 열어 보겠소 — 먼저 불을 끄고. 이십 년 동안 내가 한 번도 안 긁은 자리요."}
