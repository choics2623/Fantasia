id: npc_lm_otilie
name: 필사 수사 오틸리에
aka: [읽지 못하는 손, 모양을 베끼는 여자]
tier: A
type: living
race: 인간
subrace: ''
sex: 여
age: 31
region: 루멘
home: 필사실 곁 수녀원 기숙 방
job: 필사 수사 — 필사 수사 서른 중 가장 오래된 손. 글을 읽지 못한다 (승인된 낭독문을 '모양'으로만 베낀다)
rank: 수도자 (여자 필사 수사)
summary: 글을 읽지 못하도록 길러진 필사 수사. 끊어진 고리가 일부러 읽지 못하는 손을 골라 '빛의 서신' 모사 네 부를 만들게 했다. 어느 날부터 모양이 소리가 되는 것을 알게 됐고 아무에게도 말하지 않았다
source: docs/world/people/lumen.md
life:
  - {year: 281, age: 0, event: "루멘 서안 성표 신도 집안에서 태어남. 어머니가 양초 공방 노동자였다"}
  - {year: 288, age: 7, event: "성표 서약. 같은 해 수녀원 필사 견습으로 들어감 — '읽지 못하는 손'이 필사에 낫다는 원칙에 따라 글자를 배우지 않도록 길러졌다"}
  - {year: 296, age: 15, event: "필사 수사 서원. 낭독문 모양을 획순대로 베끼는 것을 처음 허락받음"}
  - {year: 303, age: 22, event: "알베릭이 갇히던 해에 필사실 곁으로 양초 공방에서 노수녀가 먹과 밀랍을 가져오기 시작했다"}
  - {year: 308, age: 27, event: "촛불지기 한나가 가져온 낯선 모양들을 베끼기 시작. 뜻은 몰랐다"}
  - {year: 310, age: 29, event: "'빛의 서신' 모사 일곱 부를 베낌. 그중 첫 문장의 모양 하나를 다른 모양과 혼동했다"}
  - {year: 311, age: 30, event: "여름 어느 날 필사 중 모양들이 소리로 들리는 것을 알았다. 그날 하루 종일 먹을 입에 넣지 못했다"}
  - {year: 312, age: 31, event: "읽을 줄 안다는 것을 아무에게도 말하지 않은 채 필사를 계속한다. 첫 문장 오류를 바로잡고 싶다 (낙엽월 1일 기준)"}
appearance:
  - "오른쪽 손등에 먹물이 문신처럼 스며들었다"
  - "눈을 가늘게 뜨고 글자를 볼 때 입술을 다문다"
  - "앞치마 속에 마른 갈대 펜 여섯 개"
smell: "먹과 갈대 펜, 밀랍 얼룩이 밴 앞치마"
voice_sound: "작고 건조한 목소리. 말하다가 가끔 허공에 모양을 그리려다 멈춘다"
personality:
  disposition: {용기: 15, 자비: 20, 정직: 40, 신앙: 10, 탐욕: -30, 충성: 35}
  temperament: [과묵, 정직, 겁, 호기심]
  habits:
    - "말할 때 손가락으로 허공에 모양을 그리려다 멈춘다"
    - "새 모양을 베끼기 전 눈을 감고 입술을 움직이지 않으려 한다"
    - "먹물 그릇을 손등에 한 번 대어 온도를 확인한다"
    - "필사 홀의 말소리 금지 규칙에 맞춰 숨을 길게 쉰다"
  values: "정확한 모양. 한 획도 틀리지 않는 손. 그리고 뜻을 안다는 것의 위험"
  fears: [읽을 수 있다는 것이 들키는 것, 첫 문장 오류가 영영 남는 것, 한나의 쪽지가 자기 때문에 발각되는 것, 아는 것이 늘어나는 것]
  desires:
    short: "모양들이 소리가 되기 시작했다는 사실을 아무에게도 들키지 않는 것"
    long: "한 번이라도 뜻을 이해하고 베끼는 것"
voice:
  register:
    to_superior: "필사장과 사제에게 '예'. 눈은 먹물 그릇에 둔다"
    to_equal: "수도자에게 작은 해요체. 모양 이야기에서만 풀린다"
    to_inferior: "견습에게 다정한 반말. 획순을 손으로 먼저 보여 준다"
    to_player_default: "말수가 적다. 상대의 목소리가 아니라 손을 본다. 질문에는 모양으로 대답한다"
  tics: ["'이 모양은…'", "허공에 모양을 그리다 멈춘다", "'뜻은 몰라요'"]
  use: [모양, 획, 먹, 줄, 그림, 소리, 첫 줄]
  avoid: [읽다, 뜻, 글자(공개적으로), 서신]
  length: "짧고 건조하다. 모양 이야기에서는 처음으로 말이 이어진다"
  samples:
    - {situation: 첫 만남, line: "이 모양은 갈고리가 둘, 아래에 점. 뜻은 몰라요. 모양만 같으면 돼요."}
    - {situation: 호의, line: "뜻을 아는 사람이 있으면 알려 줘요. 틀린 모양이 어느 쪽인지. 첫 줄이에요."}
    - {situation: 적대, line: "저는 읽지 못해요. 그게 이 방의 규칙이고 제 일이에요. 읽지 못하는 사람에게 읽으라고 하지 마세요."}
    - {situation: 위기, line: "먹물을 엎어! 그 종이를 덮어요! 모양이 보이면 안 돼요 — 아니, 모양만 보여도 안 돼요!"}
    - {situation: 비밀 누설, line: "…읽은 게 아니에요. 보고 있었을 뿐이에요. 보면 소리가 나요. 그건 제가 한 게 아니에요."}
    - {situation: 거래, line: "모양 하나를 가르쳐 주세요. 소리 내지 말고, 손가락으로만요. 대신 저는 틀린 모양 하나를 알려 드릴게요."}
    - {situation: 거짓말할 때, line: "저는 한 번도 뜻을 몰랐어요. 정말이에요. (손가락이 허공에 모양을 그리다 멈춘다)"}
    - {situation: 겁먹었을 때, line: "누가 제 입술을 봤어요. 모양을 볼 때 입술이 움직였나 봐요. …움직이지 않으려고 했는데."}
    - {situation: 분노, line: "읽지 못하게 키워 놓고 읽는다고 벌을 주는 거예요? 그럼 처음부터 눈을 가렸어야죠."}
    - {situation: 슬픔, line: "열일곱 부 가운데 네 부를 제 손으로 베꼈어요. 틀린 모양이 하나 있어요. 그 한 모양이 서신의 첫 줄을 바꿔요."}
    - {situation: 한나 이야기, line: "촛불지기 할머니는 늘 밀랍과 먹을 가져오세요. 그 속에 뭐가 들었는지는 몰라요. 모르는 게 서로를 지켜 주죠."}
    - {situation: 마음을 열었을 때, line: "저에게 글자를 하나만 가르쳐 주세요. 이 모양이 소리로 뭔지, 뜻으로 뭔지. 그러면 첫 줄을 바로잡을게요 — 한 번만."}
