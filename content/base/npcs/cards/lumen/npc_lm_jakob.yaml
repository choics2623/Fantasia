    long: "간수 일에서 풀려나 수도자 방으로 돌아가는 것"
voice:
  register:
    to_superior: "간수장에게 '예' 한 음절. 눈을 열쇠 꾸러미에 둔다"
    to_equal: "시몬에게 낮은 하게체. 쪽지 이야기에선 속삭인다"
    to_inferior: "수감자에게 존댓말. 이름은 부르지 않는다"
