    - "물그릇을 놓을 때 손바닥으로 바닥을 감싼다 — 소리를 줄이려고"
    - "지하 수로 쪽 쇠창살을 지날 때 손가락 하나를 대고 지난다"
    - "밤 순회 때 감방 앞에서 세 호흡 서 있다 — 오토를 배웠다"
  values: "고리. 물그릇을 놓는 소리. 실패한 시험 뒤에도 쓸모 있는 손"
  fears: [오토가 소매를 두 번 보는 것, 쇠창살이 녹슬어 열리지 않는 것, 알베릭이 먼저 죽는 것, 자기가 사제가 되지 못한 것이 이 자리의 이유라는 것]
  desires:
