  tics: ["소매 안의 열쇠 꾸러미를 쥔다", "주위를 한 번 본다", "'다섯째 물그릇'"]
  use: [물그릇, 열쇠, 기름, 층, 소리, 수로, 교대]
  avoid: [탈옥, 알베릭(먼저), 기름칠(먼저), 오토 비난]
