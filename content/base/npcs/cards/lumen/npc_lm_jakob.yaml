smell: "기름과 젖은 돌, 소매 안쪽의 쇠 냄새"
voice_sound: "작고 숨죽인 목소리. 문장이 끝나기 전에 주위를 한 번 본다"
personality:
  disposition: {용기: 20, 자비: 40, 정직: -5, 신앙: 25, 탐욕: -35, 충성: 50}
  temperament: [숨죽임, 성실, 겁, 다정]
  habits:
