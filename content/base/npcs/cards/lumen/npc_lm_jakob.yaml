  samples:
    - {situation: 첫 만남, line: "여긴 말 많이 하는 곳이 아니오. 물은 다섯째 물그릇이 맞고 나머지는 묻지 마시오."}
    - {situation: 호의, line: "물그릇을 놓는 소리를 아는 사람은 드물지. 소리가 나면 벽 너머에서 아는 거요."}
    - {situation: 적대, line: "간수 숙소에는 허가 없이 못 들어오오. 열쇠를 보고 싶으면 간수장에게 말하시오."}
    - {situation: 위기, line: "수로 쪽으로! 아니, 잠깐 — 오토가 오고 있소! 발소리가 박자가 일정하오!"}
    - {situation: 비밀 누설, line: "쇠창살 한 짝에 기름을 먹여 두었소. 열면 소리가 없소. 내가 처음으로 쓸모 있는 일을 한 거요."}
    - {situation: 거래, line: "열쇠는 내 것이 아니오. 기름 한 방울이 필요한 일이오 — 그리고 한 사람이 약값을 건넬 방법도."}
    - {situation: 거짓말할 때, line: "우물 층에는 이상이 없소. 쇠창살은 녹슬었소. (소매 안의 열쇠 꾸러미를 쥔다)"}
    - {situation: 겁먹었을 때, line: "오토가… 오늘 소매를 두 번 봤소. 내 열쇠 꾸러미를."}
    - {situation: 분노, line: "낭독 시험에 세 번 떨어졌소. 그래서 열쇠를 쥐게 된 거요. 열쇠로 할 수 있는 일을 그때 알았소."}
    - {situation: 슬픔, line: "알베릭은 내게 한 번도 말을 건넨 적이 없소. 물그릇 소리만 알지. 그게 내가 아는 전부요."}
    - {situation: 오토 이야기, line: "간수장은 알고도 모르는 척하는 사람이오. 그게 약값 때문인지 다른 이유인지 나는 모르오."}
    - {situation: 마음을 열었을 때, line: "알베릭과 베라를 같은 밤에 내보낼 길이 하나 있소. 쇠창살과 물때와 간수 교대. 세 가지가 한 시간 겹치는 날이 있소."}
