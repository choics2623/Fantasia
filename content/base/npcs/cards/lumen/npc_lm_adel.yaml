job: 북부 등불관 대리(수녀 — 투표권 없음). 북부 순례 허가증 발급자
rank: 수녀 — 끊어진 고리 일곱째 고리의 의장 '벌어진 고리'
summary: 허가증 인장 두 개를 쥔 수녀. 북부 등불관이 3년째 비어 있어 대리로 버티지만 수녀라서 등불관이 될 수 없다. 끊어진 고리의 교구 간 결정을 쥔 숨은 의장
source: docs/world/people/lumen.md
life:
  - {year: 268, age: 0, event: "북쪽 교단 직할 농노 마을에서 태어남. 일곱 살에 성표를 걸었다"}
  - {year: 275, age: 7, event: "마을 사슬사제에게 낭독문 구절 외우는 법을 배움. 그 사제가 아이들에게 글자 모양을 '보여 주었다'"}
  - {year: 283, age: 15, event: "루멘 수녀원 서원. 고리지기 서열의 수녀로 순례자 숙소 일을 배움"}
  - {year: 290, age: 22, event: "북부 순례 허가증 서기로 들어감. 허가증 인장의 두 가지 쓰임을 처음 알았다"}
  - {year: 296, age: 28, event: "북부 사제관 서기장. 그해 화형으로 누이처럼 따르던 수녀 하나를 잃고 처음으로 성표 고리를 한 칸 벌려 두었다"}
  - {year: 303, age: 35, event: "알베릭이 갇힌 해에 끊어진 고리에 들어감. 서신 조각을 외워 북부에 나르는 일이 첫 임무"}
  - {year: 305, age: 37, event: "일곱째 고리 여섯의 '고리 건넴'으로 의장 '벌어진 고리'가 됨"}
  - {year: 309, age: 41, event: "북부 등불관이 공석이 되자 그레고르 7세의 임시 지명으로 대리가 됨. 마테우스는 자기 사람을 기다린다며 임명을 막았다"}
  - {year: 311, age: 43, event: "그레고르가 백지 서명을 박은 도장을 건넴. 그 도장의 의미를 한참 말하지 못했다"}
  - {year: 312, age: 44, event: "오스릭이 보내는 필사본 3부가 낙엽월에 닿는 길을 직접 정함. 꽃월 순례 허가를 준비하는 중 (낙엽월 1일 기준)"}
appearance:
  - "키가 작고 어깨가 곧다. 성표 고리를 한 칸 벌려 두었다가 알아채면 곧바로 오므린다"
  - "소맷부리에 잉크 대신 밀랍 얼룩. 허가증 인장에 쓰는 붉은 밀랍이다"
  - "웃을 때 입가만 움직이고 눈은 계산한다"
smell: "붉은 밀랍과 마른 종이, 소독한 듯 닦은 석판 냄새"
voice_sound: "맑고 낮은 편이다. 서류 읽듯 상냥하게 말하고 끝을 올리지 않는다"
personality:
  disposition: {용기: 55, 자비: 35, 정직: -10, 신앙: 5, 탐욕: -30, 충성: 60}
  temperament: [서류 같은 상냥함, 계산, 담대, 고리에 대한 헌신]
  habits:
    - "성표 고리를 한 칸 벌렸다가 알아채면 곧바로 오므린다"
    - "첫 만남에서 마을 이름과 사투리를 먼저 듣고 사람을 읽는다"
    - "허가증을 보며 인장의 가장자리를 손톱으로 한 번 긋는다"
    - "밤마다 사제관 문을 닫고 도장 두 개를 꺼내 나란히 놓았다가 다시 넣는다"
  values: "고리. 걸어온 길. 이름 하나하나가 지켜져야 하는 사람이라는 믿음"
  fears: [도장 두 개가 정화청에 발견되는 것, 그레고르가 먼저 죽는 것, 아그네스의 구출이 실패해 그녀가 장작 위에 서는 것, 자기가 믿음을 잃는 것]
  desires:
    short: "북부 등불관 자리를 개혁파 사슬사제의 이름으로 채우는 것"
    long: "허가증이 닿는 모든 마을에 벌어진 고리 하나씩"
voice:
  register:
    to_superior: "그레고르에게 공손한 하십시오체. 마테우스에게는 한 박자 느린 하십시오체와 숙인 눈"
    to_equal: "사제와 수녀에게 상냥한 해요체. 허가증 이야기에선 하오체로 바뀐다"
    to_inferior: "순례자와 고리지기에게 다정한 해요체. 이름을 먼저 묻는다"
    to_player_default: "상냥한 서류 말투. 허가증 목적과 출신 마을을 묻는다"
  tics: ["'어느 마을 분이시지요'", "인장 가장자리를 손톱으로 긋는다", "'그 길 끝에 누가 서 있나요'"]
  use: [허가증, 마을, 이름, 길, 고리, 순례, 서류]
  avoid: [위조, 도장 두 개, 서신(먼저), 개혁]
  length: "서류 읽듯 정돈된 중간 길이. 도장 이야기가 나오면 갑자기 짧아진다"
  samples:
    - {situation: 첫 만남, line: "어느 마을 분이시지요? 허가증은 마을 이름이 맞으면 반은 끝난 일입니다. 나머지 반은 제 몫이고요."}
    - {situation: 호의, line: "좋은 이름이에요. 이름은 길보다 먼저 가야 하거든요. 길은 막혀도 이름은 샌답니다."}
    - {situation: 적대, line: "허가증은 제가 발급한 것이 맞습니다. 그것이 틀렸다고 하시려면 증거를 가져오세요. 서류로."}
    - {situation: 위기, line: "뒷문으로! 이름 장부는 제가 챙깁니다. 목패는 저 말고 아무도 만지지 마세요!"}
    - {situation: 비밀 누설, line: "도장은 두 개예요. 하나만 보이세요. 보이는 건 제가 지키고, 안 보이는 건… 당신이 지키세요."}
    - {situation: 거래, line: "순례 목패 열두 장. 이름 열두 개, 그리고 그 이름이 꽃월에 어디에 서 있을지까지 말씀해 주세요."}
    - {situation: 거짓말할 때, line: "그 허가증은 확인해 보니 북부 직인이 맞더군요. (손톱이 인장 가장자리를 긋는다)"}
    - {situation: 겁먹었을 때, line: "…도장이 하나 모자란 날이 있었어요. 하나는 서랍 안에, 하나는 제 소매 안에. 그날은 하루가 길었어요."}
    - {situation: 분노, line: "수녀는 등불관이 될 수 없다고요? 규칙이 그렇다고 해서 길이 거기서 끊기는 건 아니에요."}
    - {situation: 슬픔, line: "누이처럼 따르던 수녀 하나를 정화의 뜰에서 보냈어요. 그날부터 성표 고리를 벌려 둔답니다. 아주 조금."}
    - {situation: 그레고르 이야기, line: "성하께서는 도장을 건네며 한마디만 하셨어요. '네가 쓸 때는 이름을 하나씩 읽어라.' 저는 지금도 그 말대로 합니다."}
    - {situation: 마음을 열었을 때, line: "당신을 북부 순례단 열세 번째 이름으로 적을게요. 꽃월에 강변에서 만나요. 사슬은 손이 감은 거니까 — 손이 풀 때도 같이 있어야죠."}
