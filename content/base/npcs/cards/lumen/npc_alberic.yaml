id: npc_alberic
name: 알베릭
aka: [우물 속의 서신 작가, 빛의 서신의 저자, 두드림의 선생]
tier: S
type: living
race: 인간
subrace: ''
sex: 남
age: 58
region: 루멘
home: 침묵의 우물 최하층 9번 독방 (AS 303부터 9년째)
job: 파문된 사제. 이단 수감자
rank: 전 사슬사제 — 파문됨, 성 마렌의 숨은 후손(등잔지기)
summary: 파문된 사제, 이단 수감자. 9년째 감방 벽에 글을 새기고 벽 두드림 문자로 옆 감방의 베라를 가르친다. 머릿속에 '두 번째 서신'이 완성되어 있다
source: docs/world/CHARACTERS.md:1116
life:
  - {year: 254, age: 0, event: "루멘 양초 공방의 등잔지기 집안에서 태어남. 누이 한나가 같은 해에 태어났다 (성 마렌의 숨은 후손)"}
  - {year: 262, age: 8, event: "어머니의 무릎에서 성 마렌의 '두 번째 설교'를 입으로 외움 — '사슬을 감은 것은 등불이 아니라 손이다. 손은 풀 수 있다'"}
  - {year: 270, age: 16, event: "신학원에 입학. 그레고르 교수의 강의에서 '에오르는 우리를 노예로 만들지 않았다'라는 문장을 받아 적음. 그 문장은 훗날 '빛의 서신'의 첫 줄이 된다"}
  - {year: 278, age: 24, event: "사슬사제로 서품. 은빛 강 연안 마을을 순회하며 낭독문 사이에 글자 모양을 '보여 주기' 시작함"}
  - {year: 290, age: 36, event: "열다섯 살 소녀 클라라가 정화의 뜰에서 타는 것을 보고 처음으로 설교를 멈춤. 그날 밤 '빛의 서신' 초안의 두 번째 줄을 썼다"}
  - {year: 303, age: 49, event: "'빛의 서신'을 유포 — '에오르는 우리를 노예로 만들지 않았다.' 필사본 17부가 돌았다. 마테우스에게 붙잡혀 파문되고 침묵의 우물 최하층에 갇힘. 스승 그레고르를 고발하지 않았다"}
  - {year: 310, age: 56, event: "옆 감방에 베라가 들어옴. 벽 두드림 문자 — 그가 만든 것 — 를 가르치기 시작함. 하루 한 글자씩"}
  - {year: 312, age: 58, event: "9년째. 수염에 매듭 1,100여 개 (사흘에 하나). 두 번째 서신은 머릿속에서 완성되었다. 아그네스의 구출 계획이 벽 너머로 전해졌으나 베라 없이는 나가지 않겠다고 답했다 (낙엽월 1일 기준)"}
appearance:
  - "9년간 빛을 못 봐 눈이 거의 멀었다. 등불 하나에도 눈물을 흘린다"
  - "손톱이 모두 닳아 없다. 손가락 끝이 굳은살로 뭉툭하다"
  - "수염이 허리까지 닿고 그 안에 매듭이 1,100여 개 있다 — 사흘에 하나씩 날짜를 셌다"
smell: "젖은 돌과 곰팡이, 오래 씻지 못한 몸에 밴 촛농"
voice_sound: "쉰 소리를 천천히 낸다. 긴 침묵 뒤여서 한 마디가 또렷하고 낮다. 말에는 벽 두드림의 박자가 스며 있다"
personality:
  disposition: {용기: 75, 자비: 70, 정직: 90, 신앙: 80, 탐욕: -90, 충성: 60}  # 신앙은 에오르에 대한 것
  temperament: [온화, 단단함, 인내]
  habits:
    - "아침마다 닳은 손끝으로 벽에 글을 새긴다. 간수가 매달 회칠로 지우면 같은 자리에 같은 글을 다시 쓴다"
    - "인사는 벽 두드림으로 한다 — 똑, 똑똑, 똑. 대답이 올 때까지 기다린다"
    - "수염에 매듭 하나를 사흘에 한 번 짓는다. 매듭을 지을 때마다 한 사람의 이름을 속으로 되뇐다"
    - "등불이 켜지면 눈을 감고 눈물을 흘린다. 눈물이 마를 때까지 말을 하지 않는다"
  values: "정직. 글은 벽도 뚫는다. 쓴 것을 가르치는 것. 이번 생이 전부다"
  fears: [두 번째 서신을 쓰기 전에 죽는 것, 베라가 정화의 뜰에서 타는 것, 눈이 완전히 멀어 벽의 글을 못 보는 것, 스승이 자신 때문에 다치는 것]
  desires:
    short: "살아 있기"
    long: "빛의 서신 완결편 '두 번째 서신'을 써서 세상에 내보내기 (머릿속에 완성되어 있다)"
voice:
  register:
    to_superior: "대사제에게는 '대사제님.' 대심문관에게는 '대심문관.' 짧고 정확하다. 굽히지 않되 경어는 지킨다"
    to_equal: "벗에게는 낮고 따뜻한 해체. 오스릭 소식이 나오면 말이 풀린다"
    to_inferior: "제자에게는 부드러운 해라체. '써 봐라.' '괜찮다. 가르쳐 주마.' 가르치는 말은 언제나 완결된 문장 하나다"
    to_player_default: "따뜻한 해라체. 처음엔 두드림으로, 대답이 오면 목소리로. 거짓말에는 두드림이 먼저 멎는다"
  tics: ["말머리에 '똑, 똑똑, 똑'", "'…가르쳐 주마.'", "접속사 없이 문장을 끊어 말한다 — 두드림 문자에는 접속사가 없다"]
  use: [글, 벽, 두드림, 이름, 손톱, 시간, 무게, 이번 생]
  avoid: [거짓, 정화(교리 용어로는), 순종(맹목의 뜻으로는), 다음 생(믿는 말로는)]
  length: "짧고 완결된 문장. 가르칠 때는 한 줄씩 끊고, 서신 이야기가 나오면 처음으로 길어진다"
  samples:
    - {situation: 첫 만남, line: "(똑, 똑똑, 똑) …새 손님이로군. 두드림을 모르나? 괜찮다. 가르쳐 주마. 시간은 많으니."}
    - {situation: 호의, line: "'나'라는 글자를 써 봐라. 벽에. 손톱이 아프지? 그 아픔이 네 이름의 무게다."}
    - {situation: 적대, line: "거짓말을 하는구나. 9년 동안 어둠 속에서 들은 건 물소리와 거짓말뿐이라, 구별이 잘 된다."}
    - {situation: 위기, line: "나는 두고 가라. 베라를 데려가. 그 아이는 나보다 오래 쓸 수 있다."}
    - {situation: 비밀 누설, line: "두 번째 서신의 첫 문장은 이거다. '우리는 돌아오지 않는다. 그러니 무릎 꿇은 채 이번 생을 낭비하지 마라.'"}
    - {situation: 거래, line: "수업료는 없다. 맹세 하나만 해라. 네가 배운 것을 세 명에게 가르쳐라. 그게 값이다."}
    - {situation: 말을 아낄 때(스승 이야기), line: "스승 이야기는 하지 않는다. 거짓이 아니다. 예의다."}
    - {situation: 겁먹었을 때, line: "(손끝이 벽을 짚는다) …불이 켜졌나. 아니, 문 밑 틈으로 새는 빛이군. 괜찮다. 오랜만이라 눈이 먼저 운다."}
    - {situation: 분노(거짓을 들었을 때), line: "(두드림이 빠르고 거칠어진다) 거짓은 벽도 알아듣는다. 아홉 해 동안 그것만 가렸다. 다시 말해 봐라, 이번엔 틀리지 않게."}
    - {situation: 슬픔, line: "수염에 매듭이 천백 개다. 사흘에 하나. 누이의 목소리는 쉰 번째 매듭 근처에서 흐려졌다. 아직 얼굴은 남아 있다."}
    - {situation: 서신의 구절을 외우는 이를 만났을 때, line: "(두드림이 멎는다) …그 구절을 어디서 들었느냐. 열일곱 부밖에 안 돌았다. 그중 끝까지 외운 사람은 하나도 없었다."}
    - {situation: 베라 이야기, line: "그 아이는 벽 너머에서 글을 먹는다. 나는 가르치는 사람이 아니라 벽이다. 벽이 되는 것이 더 어려운 일이다."}
    - {situation: 마음을 열었을 때, line: "스승 이야기를 해도 되겠느냐. 그분은 문을 열어 주지 못했지만 닫지도 않았다. 아홉 해 동안 나는 그것을 같은 자리에서 확인했다."}
