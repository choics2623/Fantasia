id: npc_lm_jonas
name: 공물 서기 요나스
aka: [지우지 못하는 서기, 명단의 손]
tier: A
type: living
race: 인간
subrace: ''
sex: 남
age: 40
region: 루멘
home: 대성당 서고 곁 서기실
job: 사슬사제 — 루멘 대교구 서기. 긴밤월 녹테른 공물 40명 명단을 쓴다
rank: 사슬사제 (루멘 등불관 직무 대행 문서 담당)
summary: 긴밤월 녹테른 공물 40명 명단을 쓰는 서기. 2년 전 이름 하나를 지웠더니 그 자리에 다른 이름이 들어갔고, 그 뒤로 지우지 못한다. 명단 사본을 해마다 한 부 몰래 만든다
source: docs/world/people/lumen.md
life:
  - {year: 272, age: 0, event: "루멘 서안 성표 신도 집안에서 태어남. 아버지는 성표 대장장이"}
  - {year: 284, age: 12, event: "신학원에서 낭독문 필사 기록 보조를 시작. 글씨가 곧고 빨랐다"}
  - {year: 296, age: 24, event: "사슬사제로 서품. 루멘 등불관 서기실 배치"}
  - {year: 303, age: 31, event: "처음 공물 명단을 맡음. 마테우스가 건넨 '불순한 자' 목록을 받아 40명으로 채웠다"}
  - {year: 307, age: 35, event: "명단에서 열두 살 소녀의 이름을 지우려다 발각되어 마테우스에게 한 시간 서 있었다. 이름은 그대로 남았다"}
  - {year: 310, age: 38, event: "명단에서 한 이름을 지웠는데 그 자리에 다른 이름이 들어갔다. 두 이름 다 모르는 사람이었다"}
  - {year: 311, age: 39, event: "명단 사본을 처음으로 한 부 몰래 만듦. 호송 전날 레이디 세실의 사람에게만 보일 수 있었다"}
  - {year: 312, age: 40, event: "올해 명단에서 가능한 한 많은 이름을 지우고 싶으나 지울 수 없다는 것을 안다 (낙엽월 1일 기준)"}
appearance:
  - "글씨 쓰는 오른손 손목에 늘 헝겊을 감았다"
  - "눈 밑이 검다"
  - "이름을 쓸 때 입술이 움직인다"
smell: "먹물과 마른 풀 먹은 종이, 오래된 서기실 먼지"
voice_sound: "낮고 건조하다. 말이 느리고 한 낱말씩 끊어 말한다"
personality:
  disposition: {용기: -25, 자비: 30, 정직: 15, 신앙: 20, 탐욕: -15, 충성: 20}
  temperament: [소심, 성실, 죄책, 침잠]
  habits:
    - "이름을 쓸 때 입술을 움직이며 한 글자씩 소리 없이 말한다"
    - "깃펜 끝을 손톱으로 다듬는 횟수를 센다 — 마흔 번"
    - "서기실 창을 열었다 닫았다 한다 — 숨이 막혀서"
    - "명단 초안은 연습이라고 말하며 지워진 자국을 일부러 남긴다"
  values: "정확한 기록. 지우는 것의 무게. 사본 한 부"
  fears: [호송 전날 사본이 발각되는 것, 지운 이름 자리에 또 다른 이름이 들어가는 것, 아는 얼굴이 명단에 오르는 것]
  desires:
    short: "올해 긴밤월 명단에서 가능한 한 많은 아이의 이름을 지우는 것"
    long: "명단을 쓰는 일에서 풀려나는 것"
voice:
  register:
    to_superior: "마테우스에게 낮은 하십시오체. 질문 전에 숫자를 말한다"
    to_equal: "서기와 사제에게 정중한 하오체. 낮은 목소리"
    to_inferior: "고리지기에게 조심스러운 하게체"
    to_player_default: "깃펜을 쥔 채 일어나지 않는다. 서두르지 않고 한 문장씩 말한다"
  tics: ["깃펜 끝을 손톱으로 다듬는다", "'…연습입니다'", "입술이 이름을 따라 움직인다"]
  use: [명단, 이름, 연습, 지우다, 사본, 숫자, 서기실]
  avoid: [제비뽑기(믿는 척), 지우다(먼저), 세실 그림자장미]
  length: "짧고 끊긴다. 지운 이름 이야기에서는 문장이 이어진다"
  samples:
    - {situation: 첫 만남, line: "명단은 긴밤월 초에 씁니다. 지금은 연습입니다. 연습으로 쓴 이름은 지웁니다 — 올해는 아직."}
    - {situation: 호의, line: "당신의 글씨는 곧군요. 곧은 글씨는 이름을 덜 아프게 쓰게 합니다."}
    - {situation: 적대, line: "제가 보낸 게 아닙니다. 저는 받은 이름을 썼을 뿐입니다. 받은 이름은 쓰는 것이 제 일입니다."}
    - {situation: 위기, line: "서기실 문을 닫아라! 사본이 있다 — 아니, 없다! 사본은 없다고 말해라!"}
    - {situation: 비밀 누설, line: "한 이름을 지웠더니 다른 이름이 들어갔습니다. 둘 다 제가 모르는 사람이었습니다. 그게 제일 힘듭니다."}
    - {situation: 거래, line: "지울 이름 하나가 있다면 대신 채울 이름이 없다는 걸 먼저 보여 주십시오. 그것 없이는 한 글자도 못 고칩니다."}
    - {situation: 거짓말할 때, line: "사본은 없습니다. …없다고 말해야 합니다. (깃펜 끝을 손톱으로 다듬는다)"}
    - {situation: 겁먹었을 때, line: "마흔이 아닙니다. 마흔한 번째 이름이 있었습니다. 제가 쓴 게 아닙니다. 누군가 덧붙였습니다."}
    - {situation: 분노, line: "제비뽑기라고요? 제비는 우연입니다. 이건 순서입니다. 순서에는 이유가 있고 이유가 있는 순서가 더 무섭습니다."}
    - {situation: 슬픔, line: "열두 살 소녀의 이름은 지우지 못했습니다. 그 아이는 아직 살아 있는데, 저는 그 이름을 매년 다시 씁니다."}
    - {situation: 마테우스 이야기, line: "정화청장님은 목록을 건네며 한 번도 이름을 읽지 않으십니다. 읽지 않는 분께 이름을 건네는 건 이상한 일입니다."}
    - {situation: 마음을 열었을 때, line: "이번에는 지울 수 있습니다. 대신 채울 이름을 당신이 가져오십시오 — 이 도시에서 가장 쓸모없는 이름을. 제가 그걸 쓰겠습니다."}
