id: npc_lm_niklas
name: 견습 니클라스
aka: [석 달의 아이, 모양으로 외우는 소년]
tier: A
type: living
race: 인간
subrace: ''
sex: 남
age: 16
region: 루멘
home: 신학원 견습 기숙사 (마지막 침상)
job: 서원 견습 — 낭독문 300구절을 석 달에 외워 신학원 기록을 깼다
rank: 서원 견습 (성표 고리 하나 — 서원 서른 번째)
summary: 구절을 소리가 아니라 모양으로 외우는 열여섯 살 견습. 잔향이 아니라 평범한 기억력이지만 세레니엘의 보고서에 이름이 올랐고, 이졸·세레니엘·에기디우스가 서로 모르게 지켜본다
source: docs/world/people/lumen.md
life:
  - {year: 296, age: 0, event: "루멘 동안 배급소 부엌 집에서 태어남. 어머니는 빵 굽는 사람"}
  - {year: 303, age: 7, event: "성표 서약. 목에 건 쇠고리의 무게를 처음 알았다. 같은 해 어머니가 가르쳐 준 첫 기도문을 소리가 아니라 모양으로 외웠다"}
  - {year: 308, age: 12, event: "신학원 견습으로 입학. 안셀름이 낭독문 첫 구절을 가르칠 때 구절의 '그림'이 눈앞에 떠오르는 것을 알았다"}
  - {year: 310, age: 14, event: "열 구절을 석 주에 외움. 안셀름이 그에게 '조금 천천히 외워라'고 말했다"}
  - {year: 311, age: 15, event: "낭독문 300구절을 석 달에 외워 기록을 깸. 같은 해 저울사제 하르트문트에게 눈을 한 번 재어졌다"}
  - {year: 312, age: 16, event: "여름, 성가 막사 담벼락에서 낯선 순례자 이졸을 두 번 만남. 그녀는 '무슨 꿈을 꾸니'를 묻지 않고 '무엇을 외우니'를 물었다 (낙엽월 1일 기준)"}
appearance:
  - "마른 몸에 눈이 크다. 구절을 외울 때 눈동자가 위로 올라간다"
  - "손가락으로 허공에 모양을 그린다"
  - "목의 성표 고리가 반짝일 만큼 닳았다"
smell: "새 양피지와 비누, 소년의 땀"
voice_sound: "맑고 조금 높다. 구절을 낭독할 때는 기계처럼 일정하고 대답할 때는 말을 고른다"
personality:
  disposition: {용기: 10, 자비: 35, 정직: 45, 신앙: 25, 탐욕: -10, 충성: 30}
  temperament: [순함, 겁, 영리, 감각적]
  habits:
    - "구절을 외울 때 눈을 감고 손가락으로 허공에 모양을 그린다"
    - "시험에서 일부러 한두 구절을 틀린다 — 너무 잘하면 안 된다는 걸 안다"
    - "담벼락 그늘에서 모양들을 복습한다"
    - "누가 쳐다보면 시선을 피하고 성표를 만진다"
  values: "아무도 자기를 보지 않는 곳에서 외우는 것. 안셀름의 말"
  fears: [들키는 것, "'진짜 아니야?'라는 질문", 꿈을 묻는 것, 아무도 자기를 보지 않는 날이 오지 않는 것]
  desires:
    short: "사슬사제 시험에서 조용히 떨어지는 것"
    long: "아무도 자기를 보지 않는 곳에서 모양들을 마음껏 외우는 것"
voice:
  register:
    to_superior: "사제에게 모범적 존댓말. 눈을 낮추고 짧은 구절로 대답한다"
    to_equal: "견습에게 해요체. 수줍다"
    to_inferior: "해당 없음. 어린 견습에게는 천천히 풀어서 알려 준다"
    to_player_default: "눈을 낮춘 모범적 견습. 질문에는 가장 짧은 구절로 대답한다"
  tics: ["허공에 모양을 그린다", "'…구절로 하면'", "시선을 피한다"]
  use: [모양, 구절, 그림, 틀리다, 안셀름, 담벼락]
  avoid: [진짜, 꿈, 잔향, 글자(먼저)]
  length: "짧고 조심스럽다. 모양 이야기에서만 처음으로 말이 이어진다"
  samples:
    - {situation: 첫 만남, line: "(눈을 감고) 사슬은 등불을 지킬지니 …이 구절은 모양이 둘입니다. 하나는 사슬이고 하나는 등불이에요."}
    - {situation: 호의, line: "모양으로 외우면요, 틀려도 어디가 틀렸는지 보여요. 소리는 틀린 곳이 안 보이는데."}
    - {situation: 적대, line: "저는 아무것도 못 외웠어요. 정말이에요. 구절이 하나도 안 보여요."}
    - {situation: 위기, line: "원장님께 말씀드려야 해요! 안셀름 원장님께! 저는 아무것도 안 했어요!"}
    - {situation: 비밀 누설, line: "구절을 글자로 외운 적은 없어요. 그림으로요. …이게 들키면 글자 소지라고 하죠?"}
    - {situation: 거래, line: "모양 하나를 가르쳐 주시면 저도 구절 하나를 알려 드릴게요. 소리로, 아주 작게."}
    - {situation: 거짓말할 때, line: "저는 평범하게 외워요. 남들처럼요. (시선이 담벼락 그늘로 흘러간다)"}
    - {situation: 겁먹었을 때, line: "눈이 세 개예요. 저를 보는 눈이 세 개예요. 정자, 심문소, 그리고 순례자 아주머니."}
    - {situation: 분노, line: "외우는 건 죄가 아니에요. 외운 걸 쓰는 게 죄라고 하셨잖아요. 그런데 외우는 것 자체를 보는 눈이 있어요."}
    - {situation: 슬픔, line: "어머니는 제 기도를 한 번도 듣지 못하셨어요. 제가 모양으로 외우니까 입술이 안 움직이거든요."}
    - {situation: 안셀름 이야기, line: "원장님은 제 석판 기록을 낮춰 쓰세요. 저는 그걸 알아요. 알아도 모르는 척하고요."}
    - {situation: 마음을 열었을 때, line: "저, 도망가고 싶어요. 어디로 가야 아무도 안 보는지 알려 주실 수 있어요? 외울 모양은 가져갈게요 — 어디서든 외울 수 있으니까."}
