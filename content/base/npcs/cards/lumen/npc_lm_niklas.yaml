  - "그의 모양 기억은 쓸 수 있다 — 글자를 읽지 못하는 필사 수사들 곁에서 모양을 읽는 눈이 된다"
  - "안셀름이 숨기는 석판 기록을 누가 고쳐 올렸는지 알아내면 정화청 안쪽의 눈이 보인다"
