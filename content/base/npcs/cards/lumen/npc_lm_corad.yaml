id: npc_lm_corad
name: 장작지기 코라드
aka: [항아리의 주인, 재 쓸기]
tier: A
type: living
race: 인간
subrace: ''
sex: 남
age: 52
region: 루멘
home: 정화의 뜰 장작 창고 곁 방
job: 정화의 뜰 장작지기 — 크릭 잡역 넷을 부리며 화형대를 준비하고 재를 거둔다. 이번 가을 장작 네 번
rank: 고리지기 (고리 둘)
summary: 정화의 뜰에서 장작을 쌓는 사람. 재 속에서 타다 남은 단추·치아·핀을 집게로 한 개씩 집어 항아리에 모아 왔다. 마테우스가 센 212와 같은 숫자다. 이름은 한 번도 부르지 않았다
source: docs/world/people/lumen.md
life:
  - {year: 260, age: 0, event: "루멘 서안 성표 신도 집안에서 태어남. 열두 살에 정화의 뜰 잡역으로 시작"}
  - {year: 275, age: 15, event: "정화의 뜰에서 첫 장작을 쌓음. 그날 처음으로 재가 손바닥에 남는 느낌을 알았다"}
  - {year: 285, age: 25, event: "고리지기가 되고 장작지기 보조가 됨. 처음 재 속에서 단추 하나를 집게로 집었다"}
  - {year: 290, age: 30, event: "그해 가을 열다섯 소녀의 재 속에서 푸른 머리핀 대신 놋쇠 단추 하나를 집음. 소녀의 이름은 듣지 않기로 했다"}
  - {year: 296, age: 36, event: "장작지기가 됨. 이후 화형일마다 작은 쇠 집게를 허리에 찼다"}
  - {year: 304, age: 44, event: "순례 노파 마를렌의 아들이 정화됨. 그날부터 벤치에 앉은 노파와 눈을 마주치지 않는다"}
  - {year: 309, age: 49, event: "크릭 뷕이 재를 자루째 회색 순례자에게 넘기는 것을 알게 됨. 말리지 않았다"}
  - {year: 312, age: 52, event: "항아리 하나가 212개로 차올랐다. 이번 가을 장작을 이미 네 번 쌓았다 (낙엽월 1일 기준)"}
appearance:
  - "손톱 밑이 늘 회색이고 눈썹 끝이 그을렸다"
  - "나무 냄새와 탄내가 몸에 배어 개가 따라 짖지 않는다"
  - "허리춤에 작은 쇠 집게를 찬다 — 재 속에서 남은 것을 집는 용도"
smell: "젖은 장작과 탄내, 항아리 뚜껑의 밀랍 냄새"
voice_sound: "낮고 쉰 목소리. 짧게 끊어 말하고 말끝을 집게 소리처럼 딱 끊는다"
personality:
  disposition: {용기: 5, 자비: 35, 정직: 20, 신앙: 15, 탐욕: -25, 충성: 25}
  temperament: [과묵, 성실, 속으로 우는 사람, 고집]
  habits:
    - "재를 쓸어 모을 때 같은 방향으로만 쓴다 — 시계 반대"
    - "장작을 쌓기 전 마지막 한 개를 손바닥에 올렸다가 내린다"
    - "허리춤의 집게를 일하는 중에도 손가락으로 만진다"
    - "항아리 뚜껑을 닫을 때마다 숫자를 입술로 센다"
  values: "일. 남은 것을 집는 것. 이름을 부르지 않는 것"
  fears: [이름을 부르는 날, 항아리가 정화청에 발견되는 것, 213번째 물건이 들어오는 것, 마를렌과 눈을 마주치는 것]
  desires:
    short: "올해 정화가 네 번에서 더 늘지 않는 것"
    long: "항아리 하나하나에 이름을 붙이는 것"
voice:
  register:
    to_superior: "정화청에 '예' 한 음절. 장작 수만 보고한다"
    to_equal: "고리지기에게 짧은 하오체"
    to_inferior: "크릭에게 짧은 명령형. 인간 신도에게는 낮은 하게체"
    to_player_default: "일손을 멈추지 않고 짧게 답한다"
  tics: ["집게를 만지작거린다", "'해 지기 전에'", "말끝을 딱 끊는다"]
  use: [장작, 재, 단추, 집게, 해, 항아리]
  avoid: [이름, 불쌍, 무고, 구경]
  length: "한두 마디. 항아리 이야기에서는 처음으로 문장이 이어진다"
  samples:
    - {situation: 첫 만남, line: "비켜라, 장작이 지나간다. 구경하려면 해 지기 전에 오시오 — 해 진 뒤엔 치워야 하니까."}
    - {situation: 호의, line: "당신은 재를 밟지 않았군. 그것만으로 오늘은 말을 걸겠소."}
    - {situation: 적대, line: "이 뜰은 구경하는 곳이 아니오. 한 번 더 구경하면 장작이 당신 쪽으로 쌓일 거요."}
    - {situation: 위기, line: "불이 번진다! 물! 재를 쓸지 마라, 재가 날아가면 항아리가 비는 거나 같다!"}
    - {situation: 비밀 누설, line: "항아리 하나요. 단추, 치아, 핀. 이백열두 개. 이름은 없소. …이름을 붙이면 다음 장작을 못 쌓으니까."}
    - {situation: 거래, line: "재 속에서 집은 것이 있으면 가져오시오. 누구 것인지 몰라도 되오. 항아리에 넣겠소."}
    - {situation: 거짓말할 때, line: "항아리? 장작 창고에는 물통뿐이오. (집게를 쥔 손이 허리춤으로 내려간다)"}
    - {situation: 겁먹었을 때, line: "정화청에서 사람이 왔소? …항아리를 옮겨야 하나. 하지만 옮기면 숫자가 틀어지는데."}
    - {situation: 분노, line: "재를 '쓰레기'라 부르지 마시오. 쓰레기는 그냥 버리는 거고, 재는 누가 하나씩 집은 거요."}
    - {situation: 슬픔, line: "단추 하나가 한 사람이오. 그걸 다 집어낼 수는 없소. 그래서 집게가 작소."}
    - {situation: 마를렌 이야기, line: "벤치의 노파는 내 눈을 안 보오. 나도 안 보오. 서로 눈을 보면 아들 얘기를 해야 하니까."}
    - {situation: 마음을 열었을 때, line: "이름을 한 개만 불러 보고 싶소. 불러서 장작이 무너져도 좋소. 누구든, 한 사람이라도 — 당신이 이름을 안다면."}
