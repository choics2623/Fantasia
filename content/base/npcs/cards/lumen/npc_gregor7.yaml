  - {to: npc_mateus, type: 후계 후보, like: -30, trust: 40, visibility: 공개, memo: null, words: "내가 죽으면 곧바로 서명할 사람. 누이의 이름을 가장 작은 글씨로 적게 만든 사람이기도 하다. 돌이킬 수 있기를 바라면서도 돌이킬 수 없다는 것을 안다"}
  - {to: npc_serenielle, type: 감시자, like: -20, trust: 30, visibility: 공개, memo: null, words: "교리를 쓴 손. 고요한 눈으로 내 서명이 얼마나 떨리는지까지 적어 두는 이"}
  - {to: npc_elastriel, type: 주인, like: -10, trust: 20, visibility: 공개, memo: null, words: "한 번도 본 적 없는 이. 이름만으로 나를 앉히고 일으켰다"}
  - {to: npc_osric, type: 옛 학생, like: 30, trust: 40, visibility: 공개, memo: null, words: "회색여울의 사슬사제. 글자를 '보여 주는' 소문을 알고도 모른 척한다. 내 죄를 대신 갚는 사람일지도 모른다"}
  - {to: npc_agnes, type: 수녀, like: 10, trust: -10, visibility: 일방, memo: 정체 모름, words: "순례자 숙소를 맡은 큰 웃음의 수녀. 그녀가 우물에 무엇을 빠뜨리는지 모른다. 알면 서명하지 않을 수 있을지도 모른다"}
  - {to: npc_vera, type: 서명을 기다리는 화형 대기수, like: 10, trust: 0, visibility: 일방, memo: 종이에는 아직 이름이 없음, words: "아직 종이에 쓰이지 않은 이름. 서명이 오면 쓰일 이름이다. 쓰이기 전에 알베릭과 같은 우물에서 꺼내고 싶다"}
toward_player: "순례자 알현에서만. 형식적인 축복이다. 그러나 플레이어가 '돌아오는 이'라는 낌새를 주면 성배를 든 손이 멈춘다"
