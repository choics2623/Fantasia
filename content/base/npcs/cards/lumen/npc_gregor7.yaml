id: npc_gregor7
name: 빛의 대사제 그레고르 7세
aka: [그레고르, 후회하는 꼭두각시, 떠는 손의 대사제]
tier: S
type: living
race: 인간
subrace: ''
sex: 남
age: 82
region: 루멘
home: 사슬 등불 대성당 — 종탑 밑 기도실에서 밤을 보낸다
job: 순종의 빛 최고 지도자 (신도 추산 30만, 사제 1,200)
rank: 빛의 대사제 — 엘다르 빛의 후견인의 승인을 받은 인간 대표
summary: 82세의 대사제. 교리가 거짓임을 서품 때 들었고 41년간 화형 승인서 1,107장에 서명했다. 종이 한 장에 그 이름들을 작게 적어 왔고, 제자 알베릭의 처형 서명을 1년째 미룬다
source: docs/world/CHARACTERS.md:1092
life:
  - {year: 230, age: 0, event: "루멘 강안 성표 신도 집안에서 태어남. 성표 고리 하나가 첫 장난감이었다"}
  - {year: 245, age: 15, event: "신학원에 입학. 낭독문을 외우는 것으로는 만족하지 못하고 몰래 글자를 익힘 — 사제 지망생에게는 허락된 것이었다"}
  - {year: 258, age: 28, event: "사슬사제로 서품. 첫 미사에서 설교 도중 '고난이 정말 정화라면 왜 정화된 이가 돌아오지 않는가'를 속으로 물었다 — 입 밖에는 내지 않았다"}
  - {year: 270, age: 40, event: "신학원 교수 시절 학생들 앞에서 '에오르는 우리를 노예로 만들지 않았다'고 입에 담음. 열여섯 살 학생 알베릭이 그 문장을 받아 적었다"}
  - {year: 271, age: 41, event: "빛의 대사제로 추대됨. 서품 날 엘다르 빛의 후견인이 교리의 진실을 알림 — '다음 생에 빛의 종족'은 거짓이고, 돌아오는 것은 단 하나의 영혼뿐이다. 그날 처음 서명한 화형 승인서가 이름 하나였다"}
  - {year: 290, age: 60, event: "열다섯 살 클라라의 화형 승인서에 서명. 고발자가 누이를 팔았다는 것을 알았다. 종이 한 장의 열여섯 번째 줄에 가장 작게 적었다 — 가장 오래 걸렸기 때문이다"}
  - {year: 303, age: 73, event: "제자 알베릭이 '빛의 서신'을 유포해 붙잡힘. 투옥에는 서명했고 처형에는 서명하지 않았다. 알베릭이 마렌의 숨은 후손이라는 것을 알고 있었다"}
  - {year: 311, age: 81, event: "마테우스가 알베릭의 처형 서명을 요구하기 시작함. 서명을 미루는 것이 1년째가 되어 간다. 매일 밤 종이 한 장을 펼친다"}
  - {year: 312, age: 82, event: "AS 313 꽃월 성 마렌 축일에 마렌의 '두 번째 설교'를 낭독할지 마음속으로 고민 중. 재임 41년간 서명한 화형 승인서 1,107장 (낙엽월 1일 기준)"}
appearance:
  - "손이 심하게 떨려 성배를 두 손으로도 겨우 든다"
  - "목에 성표 고리 일곱 겹 — 무게 때문에 목이 앞으로 굽었다"
  - "눈썹이 하얗고 길어 눈을 반쯤 가린다. 그 아래 눈이 늘 젖어 있다"
smell: "오래된 양피지와 향유, 약초 탕약"
voice_sound: "갈라지고 얇다. 공적인 낭독에서는 놀랍게 또렷하고, 사적인 자리에서는 속삭임이 되어 말끝이 무너진다"
personality:
  disposition: {용기: -20, 자비: 30, 정직: 10, 신앙: 10, 탐욕: -30, 충성: 20}  # 정직은 공적 −40 / 사적 +60. 충성은 엘다르에게
  temperament: [후회, 노회한 예의, 겁]
  habits:
    - "서명 직전 펜을 한 번 내려놓고 떨리는 손바닥을 편다. 펜을 다시 드는 데 한 호흡이 걸린다"
    - "밤마다 종탑 밑 기도실에서 종이 한 장을 펼치고, 오늘 서명한 이름이 있으면 가장 작은 글씨로 보탠다"
    - "저녁 식사에서 접시를 앞에 놓고 빵 한 조각만 쥔다. 먹지는 않는다"
    - "말하기 전에 성표 고리 하나를 만지작거린다"
  values: "신도를 학살에서 구하는 것. 이름을 적어 두는 것. 제자를 지키는 것 — 그러나 거짓은 남겨야 한다고 믿는다"
  fears: [30만 신도의 학살, 마테우스의 서명, 알베릭을 죽기 전에 구하지 못하는 것, 다음 이름을 쓰게 될 자신의 손]
  desires:
    short: "죽기 전에 알베릭을 살리기 — 처형 서명을 1년째 미루는 중"
    long: "교리의 거짓을 '어떻게든' 남기기. 공개하면 신도들이 학살당한다는 것을 안다"
voice:
  register:
    to_superior: "엘다르 후견인과 감독관에게는 한 박자 늦은 공손한 대답. '후견인이시여.' 눈은 바닥. 반문하지 않는다"
    to_equal: "등불관과 사제들에게는 격식 있는 하오체. '그리하시오.' 가벼운 농담은 하지 않는다"
    to_inferior: "신도와 순례자에게는 낭독체 문어. '그대여, 고난은 정화이니 견디라.' 이름을 묻지 않는다"
    to_player_default: "공적 자리에서는 축복의 문구. 사적이거나 신뢰가 쌓이면 속삭이는 하오체. 마지막에는 반말이 섞인다"
  tics: ["'고난은 정화이니, 견디라.'를 입버릇처럼 앞세운다", "말끝을 흐리고 '…아니다.'로 정정한다", "성표 고리 하나를 만지작거린다"]
  use: [그대, 빛, 정화, 서명, 이름, 종이, 고난, 그들(화형된 이)]
  avoid: [에오르의 이름(공적으로는), 거짓(→ '가르침'), 돌아온다(자기 입으로 먼저), 학살, 두렵다]
  length: "공적 낭독은 길고 일정하다. 사적일 때는 짧고 끊기며, 서명 이야기에서는 말이 갑자기 느려진다"
  samples:
    - {situation: 첫 만남, line: "아우렐의 빛이… 그대에게… (손이 떨린다) 고난은 정화이니, 견디라."}
    - {situation: 호의, line: "내 손이 왜 떠는지 아느냐? 나이 때문이 아니다. 서명 때문이다."}
    - {situation: 적대, line: "나는 늙었지만 아직 대사제다. 내가 한 줄만 쓰면 그대는 정화의 뜰에 선다."}
    - {situation: 위기, line: "알베릭을 우물에서 꺼내라. 지금. 내가 서명한 마지막 문서가 되게 해 다오."}
    - {situation: 비밀 누설, line: "그들은 말했다. 너희는 돌아오지 않는다고. 돌아오는 것은 단 하나라고. 나는 30만 명에게 '모두 돌아온다'고 41년간 말했다."}
    - {situation: 거래, line: "그대가 가져온 것이 알베릭의 목숨이라면 값을 말하라. 나는 내줄 수 있는 것이 거의 없다. 서명을 미루는 것 말고는."}
    - {situation: 거짓말할 때, line: "알베릭의 서신? 이단의 문서다. 읽은 적 없다. (성배가 손 안에서 잔잔히 부딪힌다)"}
    - {situation: 겁먹었을 때, line: "(성표 고리를 움켜쥔다) 마테우스가 오는가. 문을 잠가라. …아니, 문은 이미 열려 있었지. 그가 열쇠를 가진 지 오래다."}
    - {situation: 분노(공개석상에서 교리를 반박당했을 때), line: "이곳은 빛의 집이다. 그대의 말은 기록되었고, 정화의 뜰에서 값을 치를 것이다. 내 손이 떨리는 것은 분노 때문이 아니다 — 서명 때문이다. 알겠는가."}
    - {situation: 슬픔(종이 한 장), line: "종이에 이름이 천백칠. 열여섯 번째 줄에 열다섯 살짜리가 있다. 그 아이의 오빠가 지금 대심문관이다. 그 줄은 가장 작게 썼다. 가장 오래 걸렸으니까."}
    - {situation: 잔향의 낌새를 느꼈을 때, line: "(성배를 든 손이 멈춘다) …그대의 눈. 어디서 보았더라. 서품 날 엘다르가 말한 '단 하나'의 눈. …아니다. 늙으면 모든 눈이 낯익다."}
    - {situation: 알베릭 이야기, line: "(낮게) 알베릭은 내 제자였다. 그가 쓴 첫 문장은 내가 한 말이고. 나는 그를 가르친 게 아니라 그의 입에 말을 넣었던 거야."}
    - {situation: 마음을 열었을 때, line: "그 종이를… 내가 죽은 뒤에 읽어 다오. 그리고 한 줄만 보태라. '그들은 돌아오지 않는다. 그러나 이름은 돌아온다.'"}
    - {situation: 성 마렌 축일 이야기, line: "마렌의 두 번째 설교. 사슬을 감은 것은 등불이 아니라 손이라는 — 그걸 내 입으로 읽는 날, 이 대성당 지하부터 불이 오겠지. 그래도 읽을 힘이 남아 있을까."}
schedule:
  아침: "새벽 미사 (앉아서 집전)"
  낮: "엘다르 감독관 세레니엘 접견, 서명 (화형 승인서 포함)"
  저녁: "신학원 원로들과 식사 — 거의 먹지 않는다"
  밤: "대성당 종탑 밑 기도실에서 홀로, 종이 한 장을 펼쳐 놓고"
places: [사슬 등불 대성당, 종탑 밑 기도실, 신학원, 맑은물 정자]
