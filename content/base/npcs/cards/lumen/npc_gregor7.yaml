  - fact: fact_lu_gregor_teacher
    reveal_when: "신뢰 55 이상에서 알베릭 이야기가 길어질 때. '빛의 서신'의 첫 문장을 알고 있음을 증명하면 곧바로"
    reveal: [{"trust":55}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'알베릭은 신학원의 한 학생이었다. 많은 학생이 있었다'"
  - fact: fact_lu_gregor_maren_descendant
    reveal_when: "매듭집의 매듭줄이나 마렌의 첫 성표를 보여 주었거나 신뢰 65 이상일 때"
    reveal: [{"trust":65}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'그 이름 때문이 아니다. 나는 제자를 죽이지 못할 뿐이다'"
  - fact: fact_lu_gregor_maren_day
    reveal_when: "매듭집의 매듭줄이나 볼드 사본을 보여 주었을 때 — 그는 낭독을 결심한다. 신뢰 75 이상에서 먼저 털어놓는 일도 있다"
    reveal: [{"trust":75}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "마렌 축일 이야기가 나오면 '축일은 낭독문이 정한다'며 입을 닫는다"
  - fact: fact_lu_doctrine_false
    reveal_when: "플레이어가 잔향이라는 확신을 줬거나 알베릭 구출이 가시화되어 신뢰 60 이상일 때. 공적 자리에서는 어떤 경우에도 말하지 않는다"
    reveal: [{"trust":60}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'고난은 정화이니 견디라'를 되풀이한다. 손이 더 떨린다"
  - fact: fact_lu_gregor_fears_massacre
