  - fact: fact_lu_gregor_paper
    reveal_when: "1,107명의 이름을 '기록으로 남기겠다'는 약속(+35)을 받거나 신뢰 70 이상일 때. 종탑 기도실로 직접 데려간다"
    reveal: [{"trust":70}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
