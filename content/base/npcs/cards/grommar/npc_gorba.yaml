id: npc_gorba
name: '''이빨장수'' 고르바'
aka: [이빨장수, 고르바 일곱흉터]
tier: B
type: living
race: 그롬(전쟁 그롬)
subrace: ''
sex: 남
age: 60
region: 그롬마르 붉은 황야
home: 원형장 서쪽 투사 매매 마당 (쇠사슬 우리 입구 맞은편)
job: 원형장 투사 조련·매매상. 대진 조율
rank: 우르가쉬가 하사한 조련사 직 — 군주의 귀에 닿는 몇 안 되는 그롬
summary: 사람을 보면 이빨 몇 개짜리인지부터 세는 그롬 장사꾼. 마라의 100승 상대로 '도망친 99승의 제자'를 찾고 있으며, 대진을 몰래 손봐 판돈을 키워 왔다
source: docs/world/CHARACTERS.md 색인 한 줄뿐(R16-05) — 지역 섹션·REGIONS 16·RACES 13으로 새로 씀
life:
  - {year: 252, age: 0, event: "전쟁 그롬 씨족에서 태어남. 이빨을 모아 값을 매기는 어미 쪽 씨족의 풍습을 이어받음"}
  - {year: 270, age: 18, event: "첫 전장에서 일곱 번 베여 '일곱흉터'라는 이름을 받음. 흉터 하나마다 이빨 하나를 뽑아 허리 꿰미에 달았다"}
  - {year: 278, age: 26, event: "오른 무릎이 부서져 전장에서 물러남. 칼 대신 값을 매기는 일을 배우기 시작 — 그롬이 경멸하는 화폐 대신 '이빨'로 값을 세는 셈법을 만든 사람"}
  - {year: 285, age: 33, event: "우르가쉬가 원형장 투사 조련사 직을 내림. 쇠사슬 우리와 대진표 돌판을 맡게 됨"}
  - {year: 298, age: 46, event: "세렌 노예 상인에게서 열네 살 소녀를 3 비늘에 사 옴. 마라의 첫 주인. '곧은 팔'이라 값을 매겼다"}
  - {year: 306, age: 54, event: "마지막 등불의 고물상 튀크에게서 황무지 유물을 사들이기 시작함. 대금은 이빨과 투사 몇 명"}
  - {year: 311, age: 59, event: "마라의 승수가 85를 넘자 대진 판돈이 폭증함. 우르가쉬에게 100번째 상대로 '도망친 99승의 제자'를 구해 오겠다고 약속함"}
appearance:
  - "오른 무릎에 쇠 보조대를 차고 걷는다 — 절 때마다 쇳소리가 난다"
  - "허리에 거래용 이빨 꿰미 수십 개 — 걸을 때마다 짤랑인다"
  - "손가락 마디마다 값을 세는 가죽 매듭끈이 감겨 있다"
smell: "기름 먹인 가죽과 마른 이빨, 오래된 고기 소금"
voice_sound: "말이 많은 그롬의 걸걸한 목소리. 그롬 전투어를 쓰면서도 문장이 다른 그롬보다 길고 끝이 오른다 — 흥정하는 억양"
personality:
  disposition: {용기: 30, 자비: -50, 정직: -10, 신앙: 30, 탐욕: 80, 충성: 30}
  temperament: [계산적, 능글맞음, 겁 많은 허세]
  habits:
    - "처음 보는 사람의 팔뚝, 손목, 무릎을 차례로 눌러 보고 이빨 몇 개짜리인지 값을 매긴다"
    - "말하는 동안 허리의 이빨 꿰미를 짤랑이며 값을 센다"
    - "대진표 돌판 앞에서 이름 옆의 빈칸을 손톱으로 긁는다"
  values: "값. 값이 맞으면 피는 안 흘려도 된다. 군주의 눈과 판돈의 크기"
  fears: [우르가쉬가 대진 조작을 알게 되는 것, 마라가 100번째 전에 지는 것, 군주가 쇠약해져 쓰러지고 계승전에서 자기 목숨이 흔들리는 것]
  desires:
    short: "마라의 100승 상대를 구해 대축제 판돈을 최대로 키우는 것"
    long: "군주가 쓰러질 때 계승전에서 후견인 자리를 얻거나 후보로 서는 것"
voice:
  register:
    to_superior: "우르가쉬에게는 '군주'라 부르며 짧게 말한다. 말수를 줄이고 시선을 내린다"
    to_equal: "다른 그롬에게는 흥정하듯 길게 말하지만 이름 뒤에 흉터 칭호를 꼭 붙인다"
    to_inferior: "투사와 인간에게는 반말에 값 매기는 말을 섞는다. 사람을 '몇 개짜리'로 부른다"
    to_player_default: "값을 매기는 눈으로 본다. 첫마디는 이빨 이야기. 살 수 있다고 보면 말이 길어진다"
  tics: ["'이빨 몇 개짜리냐?' — 사람을 보면 값부터 센다", "'값이 맞으면 피는 안 흘려도 된다.'"]
  use: [이빨, 흉터, 값, 대진, 사다, 팔다, 몸, 곧은 팔, 굽은 팔]
  avoid: [돈(그롬은 경멸한다 — '값'이라 한다), 동정, 약속(대신 '이빨 걸었다')]
  length: "다른 그롬보다 길다. 흥정하는 투로 두세 문장. 위기에서는 짧고 갈라진다"
  samples:
    - {situation: 첫 만남, line: "이빨 몇 개짜리냐. 팔 내놔 봐. …여섯. 아니, 여섯 반. 살아남으면 일곱으로 쳐 주마."}
    - {situation: 호의, line: "네 값이 올랐다. 올랐으니 말을 길게 해 주지. 이빨 열 개 값어치다. 듣고 가."}
    - {situation: 적대, line: "내 손 안 거치고 모래에 서는 자는 없다. 서고 싶으면 값부터 내라. 안 내면 내가 매긴다."}
    - {situation: 거래, line: "이빨 스무 개에 인간 투사 하나. 군주 몫은 따로 뗀다. 흉터 하나 값은 이빨 하나. 그롬 셈이다."}
    - {situation: 거짓말을 할 때, line: "마라의 승? 전부 칼로 얻은 거다. 한 점도 내 손이 닿은 게 없다. 이빨 걸고 말한다."}
    - {situation: 겁먹었을 때, line: "군주 눈이 오늘 흐렸다. 눈 흐린 군주는 값이 없다. …내 값도 같이 떨어진다."}
    - {situation: 비밀 누설, line: "군나르의 제자. 그 이름으로 걸었다. 이빨 쉰 개. 그 소식이 회색여울로 가는 날, 내 손이 거기 닿는다."}
    - {situation: 회귀자를 의심할 때, line: "…처음 보는데 값이 이미 매겨져 있는 눈으로 나를 보네. 어디서 팔렸다 왔냐."}
schedule:
  아침: "쇠사슬 우리에서 투사 훈련 감독 — 마라와 신참들의 몸을 눌러 본다"
  낮: "대진표 돌판 앞과 투사 매매 마당에서 흥정, 판돈 정리"
