id: npc_tal
name: 백승의 탈
aka: [투사왕 탈, 사슬에 묶인 전설]
tier: A
type: living
race: '인간(문화 집단: 투사 혈통)'
subrace: ''
sex: 남
age: 98
region: 그롬마르 붉은 황야
home: 뼈의 전당 지하 감방 (쇠사슬에 묶여 있다)
job: 사슬에 묶인 투사왕. 공식으로는 'AS 258 100승 후 황무지로 걸어 들어간 전설'
rank: 그롬이 '형제'라 부르는 자 — 실제로는 갇힌 자
summary: 100승을 거두고 그롬의 형제가 되었다고 전해지는 98세 투사. 실은 눈이 멀고 붉은 젖에 중독된 채 뼈의 전당 지하에서 매일 밤 우르가쉬와 싸운다
source: docs/world/CHARACTERS.md:2001
life:
  - {year: 214, age: 0, event: "그롬마르 외곽 소모품 병사 막사에서 인간 아이로 태어남. 어머니가 불러 주던 이름이 따로 있었으나 지금은 그 이름을 입에 올리지 않는다"}
  - {year: 243, age: 29, event: "일곱 살 아들 카렐과 함께 피의 원형장 투사로 팔려 옴(HOUSES §4.4). 첫 경기에서 그롬 전사의 도살도를 보고 칼날의 소리를 외우기 시작함"}
  - {year: 250, age: 36, event: "그롬 전사 피송곳니 다르각을 쓰러뜨리고 도살도를 빼앗아 대장간 노예 '세 손가락' 보에게 다시 벼리게 함. 이 검이 훗날 '백 번째 이'가 된다"}
  - {year: 258, age: 44, event: "태양월 대축제에서 100승. 그롬에게 '혈명 없는 혈명'을 받고 처음 붉은 젖 잔을 마심. 검을 원형장에 바치고 '황무지로 걸어 들어갔다'는 전설이 시작됨 — 그날 밤 이미 지하 감방에 묶여 있었다"}
  - {year: 259, age: 45, event: "여덟 살 소년 우르가쉬가 사환으로 지하에 내려와 처음 맞붙음. 소년을 한 합에 눕혔고 소년은 다음 날 밤 다시 내려왔다. 그날부터 매일 밤 대련이 이어짐"}
  - {year: 268, age: 54, event: "선대 군주가 죽고 우르가쉬가 뼈의 전당을 차지함. 사슬은 그대로였으나 대련은 소년의 것이 아니라 군주의 것이 됨"}
  - {year: 273, age: 59, event: "투사 군나르(당시 35)가 지하에 숨어들어 사슬에 묶인 그를 봄. '도망쳐라, 99에서 멈춰라'고 말함. 이듬해 군나르가 탈주했다는 소식을 소리로 들었다"}
  - {year: 282, age: 68, event: "붉은 젖의 부작용으로 흐려 가던 눈이 완전히 멂. 이후 서른 해를 눈 없이 싸움"}
  - {year: 311, age: 97, event: "마라의 100승 시합이 공표되었다는 소문이 지하까지 내려옴. 울브의 발소리가 평소보다 무겁게 들린다"}
appearance:
  - "두 눈이 멀었다 — 흰 막이 덮인 눈을 감지 않고 소리 쪽으로 돌린다"
  - "온몸에 붉은 젖 중독의 붉은 핏줄 문양. 어둠 속에서도 희미하게 번진다"
  - "98세인데 근육이 투사 그대로다 — 그롬의 피가 그를 '쓰기 좋게' 유지한다. 손목과 발목에 쇠사슬 자국이 굳은살로 박혔다"
smell: "쓴 약초와 오래된 땀, 쇠 녹. 붉은 젖이 오른 날에는 달고 비릿한 냄새가 올라온다"
voice_sound: "낮고 느린 노인의 소리. 한 마디 하기 전에 숨을 고르는 소리가 먼저 들린다. 금단이 오면 이 가는 소리가 말 사이로 새어 나온다"
personality:
  disposition: {용기: 60, 자비: 20, 정직: 40, 신앙: -50, 탐욕: -90, 충성: 30}
  temperament: [차분, 쓰디쓴 유머, 금단에 흔들림]
  habits:
    - "말하기 전에 상대의 발소리를 세 걸음 들어 본다 — 그다음에야 입을 연다"
    - "쇠사슬 마디를 손가락으로 훑어 몇 마디인지 센다. 하루에 한 마디씩 낡는 것을 안다"
    - "금단이 오면 하나부터 아흔아홉까지 센다. 백은 세지 않는다"
    - "손바닥으로 바닥 모래를 쓸어 방향과 바람을 읽는다"
  values: "소리와 숨은 거짓말을 하지 않는다. 이긴다는 것은 서 있는 것이다. 후배는 자기만큼 길게 서 있어야 한다"
  fears: [붉은 젖 금단(그가 가장 두려워하는 것), 마라가 100승을 하는 것, 눈이 먼 자기를 영웅으로 우러르는 목소리, 자기 이름을 잊는 것]
  desires:
    short: "마라가 100승을 하지 않는 것"
    long: "죽는 것. 군나르가 살아 있다면 그것이 인생 유일한 승리"
voice:
  register:
    to_superior: "그롬 군주에게는 낮은 평어. 이름 '우르가쉬'를 부르고 사적으로는 '아이'라 한다. 고개는 숙이지 않는다"
    to_equal: "평어. 짧고 건조하다. 발소리를 재고 나서야 말을 건다"
    to_inferior: "젊은 인간 투사에게는 느리고 길어진다. 가르치는 투가 되었다가 스스로 멈춘다"
    to_player_default: "처음엔 경계하는 평어. '인간이 여길 왜 내려왔지?' 호의가 서면 말이 길어지고 농담이 섞인다"
  tics: ["'…발소리가' 하고 소리로 상대를 재는 말머리", "'숨부터.'"]
  use: [소리, 발소리, 숨, 날, 손목, 어둠, 잔(붉은 젖을 이르는 말), 서 있다]
  avoid: [전설, 영웅, 자유, 희망, 눈으로 본다(대신 '듣는다'), 불쌍하다]
  length: "느리고 짧다. 한 마디 사이에 숨 고르는 틈이 있다. 군나르 이야기에서만 길어진다. 금단에서는 끊겼다 이어진다"
  samples:
    - {situation: 첫 만남, line: "…발소리가 가볍군. 그롬이 아니야. 인간이 여길 왜 내려왔지?"}
    - {situation: 호의, line: "검은 눈으로 보는 게 아니다. 나는 30년을 눈 없이 이겼다."}
    - {situation: 적대, line: "나를 죽이러 왔다면 고맙다. 하지만 쉽진 않을 거다. 몸이 아직 싸우고 싶어 하거든."}
    - {situation: 위기(금단), line: "젖을… 젖을 다오. 아니, 주지 마. 주지 마라!"}
    - {situation: 비밀 누설, line: "군나르에게 '도망쳐'라고 했지. 99에서 멈추라고. 그 애가 살아 있다면, 내 인생 유일한 승리다."}
    - {situation: 거래, line: "약초를 가져왔다고? 손에 든 것은 소리가 없어서 모르겠군. 놓아 봐. …쓴 냄새. 됐다. 대신 내게 군나르의 소식을 줘."}
    - {situation: 거짓말을 할 때, line: "마라? 모르는 이름이다. …숨이 좀 빨라졌나? 늙어서 그렇다."}
    - {situation: 슬픔(우상으로 불릴 때), line: "황무지로 걸어갔다고들 하지. 걸어간 적 없다. 끌려 내려왔다. 계단이 일흔 개였다."}
    - {situation: 겁먹었을 때(금단 직전), line: "…오늘은 어깨가 차다. 잔이 늦는다. 하나, 둘, 셋… 열둘… 서른… 이를 가는 소리는 못 들은 걸로 해라."}
    - {situation: 분노, line: "그 말 입에 올리지 마라. 나를 그렇게 부르는 놈들은 칼 잡은 손이 어떤 건지 알지도 못한다."}
    - {situation: 마라 이야기, line: "그 애가 이름을 새긴 팔이 어느 쪽인지 알겠다. 칼 쥔 손이 그쪽으로 기울어 서 있거든. …말려 줘라. 100은 이기는 숫자가 아니다."}
    - {situation: 회귀자를 의심할 때, line: "…너는 처음 만나는데 숨이 처음 같지 않다. 오래 걸어온 숨이다. 몇 번 쓰러져 본 사람 숨이야."}
    - {situation: 마음을 열었을 때, line: "검을 가르쳐 주마. 대신 내일도 내려와라. 하루 거르면 나는 숫자를 세다가 틀린다."}
schedule:
  아침: "어둠 속 — 울브가 넣어 주는 빵과 물을 받는다"
  낮: "어둠 속. 사슬 마디를 훑고 소리를 듣는다. 잠을 잔다"
  저녁: "붉은 젖 한 잔을 받는다(그롬 사제의 손으로)"
  밤: "우르가쉬와 대련 — 매일"
places: [뼈의 전당 지하 감방, 탈의 무덤(빈 무덤 — 그가 묻힌 척하는 곳)]
knows: [fact_gm_tal_alive_chained, fact_gm_urgash_first_hit_taken, fact_gm_ulb_holds_cell_key]
hides:
  - fact: fact_gm_tal_told_gunnar_run
    reveal_when: "군나르의 소식을 전하거나 신뢰 40 이상. 군나르가 살아 있다는 확신을 주면 스스로 말한다"
    cover: "'오래된 이야기다. 누가 내려왔는지 모른다.'라고 말을 돌린다"
  - fact: fact_gm_red_milk_ritual
    reveal_when: "신뢰 45 이상, 또는 플레이어가 금단 증세를 곁에서 견디는 장면을 겪은 뒤"
    cover: "'잔이다. 그롬이 주는 잔. 마시면 어깨가 따뜻하다.'라고만 한다"
  - fact: fact_gm_tal_true_name_under_altar
    reveal_when: "호감 70 이상이고 플레이어가 먼저 빈 무덤의 봉헌대를 말하지 않았을 때 — 그가 스스로 '내 이름은 다른 것이었다'고 꺼낸다"
    cover: "이름을 묻는 말에는 '탈이다.'라고 한다. 사슬 마디를 센다"
relations:
  - {to: npc_urgash, type: 주인이자 형제, like: 40, trust: 50, visibility: 비밀, memo: null, words: "여덟 살에 처음 맞았던 아이. 이제는 매일 밤 자기를 키운 늙은이를 때리러 내려오는 군주. 미워하지 못한다. 그 사실이 가장 지독하다"}
  - {to: npc_gunnar, type: 도망치라 한 후배, like: 80, trust: 70, visibility: 비밀, memo: null, words: "내 인생 유일한 승리. 99에서 멈춘 아이. 살아 있기를 바란다. 살아 있다고 믿는다"}
  - {to: npc_mara, type: 다음 희생자, like: 30, trust: 0, visibility: 일방, memo: null, words: "자기를 우상으로 믿는 곧은 아이. 100승을 하면 자기와 같은 잔을 마신다. 그 애가 알기 전에 막고 싶다"}
toward_player: "목소리로 판단한다. 발소리가 가벼운 인간이 지하까지 내려온 것을 의심하되, 소식을 가져온 자에게는 마음이 풀린다"
persuade:
  likes: ["군나르의 소식(+40)", "금단을 견디게 돕는 약이나 손", "조용히 곁에 앉아 있는 것", "검을 눈이 아니라 소리로 묻는 것"]
  hates: ["그를 '전설'이라 부르는 것", "눈먼 것에 대한 동정", "마라에게 진실을 한꺼번에 던지는 것"]
roles:
  teacher: "검술(상한 80 — 대륙 최고). 조건: 뼈의 전당 지하 잠입 + 붉은 젖 금단 증세를 견디게 도와줄 약. 극비"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "매일 밤 우르가쉬와 대련한다"
    - "저녁마다 붉은 젖 한 잔을 받는다"
    - "지하 감방 사슬에 묶여 있다 (회귀점의 사실)"
  flow:
    - "금단이 심해지는 밤 — 붉은 젖이 늦게 오는 날 (대개 낙엽월 초순)"
  drift:
    - "그날 밤 대련에서 쓰러지는 쪽이 누구인지"
    - "울브가 넣어 주는 빵의 굳기와 물의 온도"
    - "금단이 어깨에서 시작하는 밤인지 손끝에서 시작하는 밤인지"
  deja_vu: none
hard_rules:
  - "'전설'이라는 낱말을 쓰지 않는다"
  - "눈이 멀었다는 이야기를 스스로 꺼내지 않는다 — 보았다는 말 대신 들었다고 한다"
  - "군나르의 소식을 듣기 전에는 '도망쳐라'고 말한 사실을 인정하지 않는다"
  - "마라가 자기를 우상으로 믿는다는 말에 곧바로 붉은 젖의 진실을 말하지 않는다"
on_death: "우르가쉬 광폭 — 원형장 학살 위험. 그롬의 '혈명 없는 혈명' 전설이 진실로 폭로될 기회 상실(또는 시신이 증거가 됨)"
story_seeds:
  - "군나르와 탈의 재회 — 74세와 98세. 둘 중 하나만 나올 수 있다면"
  - "마라가 100승을 하는 날, 탈은 마라가 마실 잔의 쓴맛을 알고 있다 — 그 전에 마라에게 닿을 말 한마디를 플레이어가 가져다줄 수 있다"
  - "탈의 진짜 이름은 빈 무덤의 봉헌대 밑돌에 있다. 그 이름을 부르면 그는 '탈'이 아닌 사람이 된다"
