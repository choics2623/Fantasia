    line: 몇 승. 없으면 이름. 이름도 없으면 아직이다 — 아직 모래 위에 서지 않았으니.
  - situation: 호의
    line: 이름을 외우는 손은 칼을 오래 쥔다. 7번 숙소에 자리 하나 있다.
  - situation: 거절
    line: 그건 1번 숙소 바닥에서 하는 말이다. 안식일 밤에 오라.
  - situation: 분노
    line: 규칙 제1조를 어기면 무기 없이 모래에 선다. 이름을 부른 뒤에.
  - situation: 슬픔
    line: 카렐의 이름은 칼 형제가 한 번씩 부른다. 나는 부를 때마다 칼날을 닦는다.
  - situation: 위기
    line: 9번 숙소! 바닥을 열어라! 이름은 나중에 부른다!
  - situation: 비밀 누설
    line: 금을 하나 더 넣어라. 그래야 칼이 첫 합에 부서진다. 그래야 3만이 본다. 그래야 신호가 선다.
  - situation: 거래
    line: 하르트의 칼날을 점검할 손이 필요하다. 해 주면 7번 숙소의 이름 하나를 알려 주마.
  - situation: 거짓말
    line: 봉기라는 말은 조합 규칙에 없다. 흉터 회의는 훈련과 장례만 정한다.
