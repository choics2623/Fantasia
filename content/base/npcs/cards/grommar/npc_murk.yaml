    - "쇠약이 낮에도 눈에 띄게 심해지는 날 — 대개 낙엽월 하순"
  drift:
    - "그날 낙법을 배우러 오는 신참이 누구인지"
    - "배수로에 고이는 물의 높이와 냄새"
    - "벽 너머 사슬 소리가 들리는 밤이 어느 밤인지"
  deja_vu: none
hard_rules:
  - "싸움을 강요당해도 먼저 치지 않는다 — 막고 붙잡을 뿐이다"
  - "우르가쉬가 형이라고 먼저 말하지 않는다. 다른 그롬이 듣는 곳에서는 절대"
