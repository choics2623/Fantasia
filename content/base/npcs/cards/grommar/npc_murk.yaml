  hates: ["그에게 싸움을 강요하는 것(그는 싸우지 않는다 — 다만 막는다)", "장난감 말을 허락 없이 만지는 것", "그를 '겁쟁이'라 부르는 것"]
roles:
  teacher: "맨손격투 최고 스승 — 맨손격투(상한 70: '죽이지 않는 맨손' — 제압·낙법 위주), 응급처치(35). 조건: 배수로 일 15일. 수업료 없음"
  companion: "가능. 충성 아크: 0 침묵 → 30 장난감 말 이야기 → 50 쇠약 위기 — 싸우지 않으면 죽는다(플레이어가 '대신 싸울 이유'를 줄지, 피 없는 죽음을 지켜볼지 선택) → 70 '지키는 싸움'(그롬 최초로 '방어만 하는' 전사 — 그롬 내부에 균열). 배신 조건: 없음"
  romance: null
