id: npc_murk
name: '''조용한'' 무르크'
aka: [조용한 무르크, 바닥 청소부, 회색 그롬]
tier: A
type: living
race: 그롬
subrace: 붉은 그롬(단명 광전사 혈통)
sex: 남
age: 52
region: 그롬마르 붉은 황야
home: 원형장 지하 배수로 옆 청소부 움막
job: 싸움을 거부한 그롬 — 원형장 바닥 청소부(강등된 전사). 동료 후보 · 맨손격투 스승
rank: 강등된 전사 — 청소부. 그롬 사이에서 이름만 남은 자
summary: 붉은 그롬은 대개 서른 전에 광란으로 타 죽는다. 그는 32년째 아무도 죽이지 않고 쉰둘이 되었고, 그 대가로 서서히 쇠약해지고 있다
source: docs/world/CHARACTERS.md:2033
life:
  - {year: 260, age: 0, event: "붉은 그롬 어미에게서 태어남. 같은 어미의 첫아들이 아홉 살 위의 우르가쉬였다. 아비는 모른다"}
  - {year: 263, age: 3, event: "어미가 광란 속에 타 죽음. 불길 곁에서 열두 살 우르가쉬가 끌어내 주었다. 무르크는 그 팔의 힘을 기억한다"}
  - {year: 275, age: 15, event: "광전사 혈통의 첫 전장. '붉은 눈'으로 불리며 하르칸 분쟁에서 일곱 번의 광란을 겪고 살아남음"}
  - {year: 280, age: 20, event: "인간 마을 습격에서 아이를 죽이기 직전, 아이가 나무 장난감 말을 내밀었다. 받아 들고 돌아섰다. 그날부터 한 번도 싸우지 않음 — 올해로 32년째"}
  - {year: 281, age: 21, event: "원형장에서 싸움을 거부함. 군주가 죽이지 않고 바닥 청소부로 강등함. 그 이유를 아는 그롬은 없다"}
  - {year: 290, age: 30, event: "붉은 그롬이 타 죽는 나이를 넘김. 싸우지 않아 피부가 회색으로 바래기 시작함. 인간 신참들에게 넘어지는 법(낙법)을 가르치기 시작"}
  - {year: 299, age: 39, event: "열다섯 살 신참 마라에게 낙법을 처음 가르침. 말없이 넘어뜨리고 일으켜 줬다"}
  - {year: 305, age: 45, event: "배수로 보수 중 한 통로가 뼈의 전당 지하 감방 벽과 맞닿아 있음을 발견함. 밤마다 쇠사슬 소리와 둔탁한 대련 소리를 듣게 됨. 아무에게도 말하지 않음"}
  - {year: 312, age: 52, event: "늦여름, 손 떨림이 낮에도 멈추지 않기 시작함. 피부는 거의 회색이다. 마라의 100승 시합 공표를 청소 중 들었다"}
appearance:
  - "광전사 혈통의 붉은 피부가 회색으로 바래 가는 중 — 싸우지 않아 쇠약해지는 징후"
  - "손이 늘 떨린다. 걸레를 쥐고 있어도 떨림이 보인다"
  - "목에 인간 아이의 나무 장난감 말을 가죽끈으로 걸었다 — 그의 첫 '전리품'. 그는 그것을 돌려주지 못했다"
smell: "마른 피와 잿물 비누, 배수로의 눅눅한 돌 냄새"
voice_sound: "깊고 느린 그롬의 저음. 공용어는 낱말을 하나씩 끊어 말한다. 손이 떨릴 때는 말끝도 함께 떨린다"
personality:
  disposition: {용기: 50, 자비: 60, 정직: 60, 신앙: -40, 탐욕: -60, 충성: 50}
  temperament: [과묵, 떨림, 고집스러운 온화]
  habits:
    - "말을 시작하기 전에 손에 묻은 것을 먼저 닦는다 — 묻은 것이 없어도 닦는 동작을 한다"
    - "목에 건 나무 말을 손바닥 안에 쥐고 있다가 사람이 오면 슬그머니 옷 속에 넣는다"
    - "밤마다 떨리는 손을 반대편 손으로 붙잡고 새벽까지 앉아 있다"
    - "신참을 넘어뜨린 뒤에는 반드시 손을 내밀어 일으켜 세운다"
  values: "죽이지 않는 것. 넘어지는 법을 아는 것이 일어나는 법의 절반이다. 지키는 싸움이라면 막는다"
  fears: [피가 부르는 것(광란), 장난감 말의 주인이 죽었음을 확인하는 것, 아무도 모르는 사이 형이 자기를 죽이는 날, 손이 떨림을 멈추고 아무것도 쥘 수 없게 되는 것]
  desires:
    short: "오늘도 아무도 죽이지 않고, 신참 하나에게 넘어지는 법을 끝까지 가르치는 것"
    long: "피 없이 죽는 것. 그리고 장난감 말의 주인을 찾는 것"
voice:
  register:
    to_superior: "대답하지 않는다. 억지로 말해야 하면 '군주'라고만 부르고 눈을 내린다. 형이라는 말은 쓰지 않는다"
    to_equal: "다른 그롬에게는 짧은 평어. 묻는 말에만 답한다"
    to_inferior: "인간 신참에게는 낮고 느린 평어. 명령이 아니라 시범으로 말한다 — 먼저 넘어져 보인다"
    to_player_default: "조용한 관찰. 첫 마디는 '신참이냐'. 대답을 기다리며 걸레를 짠다"
  tics: ["말하기 전 손을 닦는 동작", "'그다음이다.'로 말을 닫는다"]
  use: [넘어지다, 일어나다, 손, 닦다, 낙법, 떨림, 받다, 지나가다, 그다음]
  avoid: [죽이다(자기 일로는), 이기다, 영광, 형, 싸우다(자기 일로 말할 때는 '싸우지 않는다'만 쓴다)]
  length: "아주 짧다. 낱말 몇 개씩 끊는다. 장난감 말 이야기에서만 한 번에 세 문장까지 이어진다"
  samples:
    - {situation: 첫 만남, line: "…(피를 닦던 손을 멈추고) 신참이냐. 넘어지는 법부터 배워라. 일어나는 법은 그다음이다."}
    - {situation: 호의, line: "죽이는 건 쉽다. 그롬이면 다 한다. 안 죽이는 게 어렵지."}
    - {situation: 적대, line: "나는 싸우지 않는다. 그러니 너도 나를 지나가지 못한다."}
    - {situation: 위기, line: "(손이 떨린다) …피가 부른다. 붙잡아라. 내 손을 붙잡아라."}
    - {situation: 비밀 누설, line: "그 아이는 말을 내밀었다. 나무 말. 칼을 든 나에게. 나는 그걸 받았다. 그리고 32년째 아무도 죽이지 않았다."}
    - {situation: 거래, line: "값은 없다. 배수로 일 열닷새. 피 닦고, 시체 나르고. …그다음이다."}
    - {situation: 거짓말을 할 때, line: "손? 추워서다. …떨림은 추워서다. 그다음은 묻지 마라."}
    - {situation: 슬픔, line: "이건 그 아이 것이었다. 내가 가졌다. 내가 가졌다는 것이… 문제다."}
    - {situation: 분노(막을 때), line: "(낮게) 칼 쥐우지 마라. 나는 쥐지 않는다. …하지만 너를 거기로 지나가게 두지도 않는다."}
    - {situation: 회귀자를 의심할 때, line: "…너는 넘어지는 법을 아는 몸이 아니다. 그런데 아는 눈으로 넘어진다. 누가 가르쳤나. 몸 말고."}
    - {situation: 마음을 열었을 때, line: "싸우는 이유는 많다. 지키는 이유는 하나다. 낙법만 가르치려 했다. 막는 법도 가르친다. 그다음이다."}
    - {situation: 마라 이야기, line: "저 아이가 열다섯에 처음 넘어졌다. 일어나 다시 왔다. 백이 되는 날 나는 거기 없을 거다. 배수로에서 소리만 듣는다."}
schedule:
  아침: "경기장 피를 닦는다"
  낮: "투사 시체를 운반한다 — 그롬 투사는 그롬이, 인간 투사는 인간 일꾼이 맡지만 그는 양쪽을 맡는다"
  저녁: "배수로 입구에서 인간 신참에게 맨손 낙법을 가르친다"
  밤: "떨리는 손을 붙잡고 앉아 있다. 가끔 벽 너머 쇠사슬 소리를 듣는다"
places: [원형장 바닥, 원형장 지하 배수로, 배수로 입구(신참 낙법 훈련장), 청소부 움막]
knows: [fact_aw_goz_deserter]
hides:
  - fact: fact_gm_murk_toy_horse
    reveal_when: "신뢰 30 이상(동료 아크 30). 또는 플레이어가 장난감 말을 직접 만지지 않고 '그것은 무엇인가'만 조용히 물을 때"
    reveal: [{"trust":30},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "목에 건 것을 옷 속에 넣고 '아이 물건.'이라고만 한다. 더 물으면 걸레를 짠다"
  - fact: fact_gm_murk_urgash_brothers
    reveal_when: "신뢰 60 이상이고 다른 그롬이 없는 곳에서. 플레이어가 우르가쉬 이야기를 먼저 꺼내 그가 스스로 입을 열 때"
    reveal: [{"trust":60}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "우르가쉬 이야기가 나오면 '군주.'라고만 하고 손을 닦는다. 더 이상 대답하지 않는다"
  - fact: fact_gm_murk_hears_chains
    reveal_when: "신뢰 50 이상. 또는 마라나 플레이어가 지하의 소문(탈이 아직 살아 있다는)을 직접 묻고 그가 대답을 피하지 않을 때"
    reveal: [{"trust":50},{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "배수로 이야기가 나오면 '물소리다.'라고 한다. 귀를 벽 쪽으로 기울이다 멈춘다"
# (해결 → fact_aw_goz_deserter (무르크 knows)) 고즈(npc_goz)가 싸움터에서 돌아선 탈영 그롬이라는 사실 — 재의 황무지(fact_aw_) 작가 담당. 무르크는 소문으로만 안다
relations:
  - {to: npc_urgash, type: 형(같은 어미), like: 30, trust: 10, visibility: 공개, memo: 원형장이 이 혈연을 모른다, words: "세 살에 불길 곁에서 끌어내 준 팔. 그리고 스무 살에 죽이는 대신 바닥에 앉힌 손. 고맙다고도 원망한다고도 하지 않는다. 그 뜻을 안다"}
  - {to: npc_mara, type: 지켜보는 투사, like: 50, trust: 40, visibility: 공개, memo: null, words: "열다섯에 처음 넘어뜨린 아이가 87승이 되었다. 100번째가 무엇인지 어렴풋이 안다. 말이 되지 않아 말하지 못한다"}
  - {to: npc_gorba, type: 경멸하는 조련사, like: -50, trust: -30, visibility: 공개, memo: null, words: "사람을 이빨 몇 개로 값 매기는 자. 지나가면 걸레를 들어 길을 좁힌다. 그것이 그가 할 수 있는 가장 큰 싸움이다"}
  - {to: npc_goz, type: 같은 탈영 그롬, like: 20, trust: 30, visibility: 일방, memo: null, words: "황무지 가장자리의 경비대장이 된 옛 전사. 그도 싸움터에서 돌아섰다고 들었다. 말을 섞은 적은 없다. 그저 있다는 것이 위로가 된다"}
toward_player: "조용한 관찰. 신참이면 넘어지는 법부터. 싸움을 부추기는 말에는 대답하지 않는다"
persuade:
