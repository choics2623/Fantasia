  - situation: 호의
    line: 이름을 외우는 투사는 대진표에서 오래 산다. 승수 하나 더 얹어 주마.
  - situation: 거절
    line: 대진표는 내 것이 아니다. 군주의 것이다. 군주에게 물어라.
  - situation: 분노
    line: 도전을 거절한 자는 모래에 서지 못한다. 거절하지 않았다면 내 앞에서 서류를 구기지 마라.
  - situation: 슬픔
    line: 쓰러진 투사의 이름은 돌판에서 지운다. 숫자는 남긴다. 그게 규칙이다.
  - situation: 위기
    line: 문을 닫아라! 대진표를 내려라! 오늘 경기는 없다!
  - situation: 비밀 누설
    line: 금을 넣었다. 100번째 칼에. 인간이 이겨야 의식이 선다. 이겨야 선다 — 내가 그렇게 만들었다.
  - situation: 거래
    line: 승수 하나를 앞당겨 주마. 대신 이 도전서에 서명하지 마라.
  - situation: 거짓말
    line: 점검 대장에 이상은 없다. 칼은 정직하다.
