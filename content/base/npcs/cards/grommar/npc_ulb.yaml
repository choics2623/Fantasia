relations:
  - {to: npc_mara, type: 좋아하는 투사, like: 70, trust: 60, visibility: 공개, memo: null, words: "붉은 머리. 칼 쥔 팔이 곧다. 문 앞에서 이름을 중얼거려 주는 것이 그가 할 수 있는 응원이다. 열쇠를 줄 수 있는 유일한 사람"}
  - {to: npc_tal, type: 아래 있는 사람, like: 20, trust: 20, visibility: 비밀, memo: null, words: "눈 없는 사람. 매일 빵을 넣어 준다. 노래를 듣는다. 이름은 모른다. 열쇠가 무거운 이유 중 하나다"}
  - {to: npc_urgash, type: 군주, like: 10, trust: 40, visibility: 공개, memo: null, words: "무서운 사람. 밤마다 내려가서 아침에 올라온다. 말 걸면 안 된다는 것만 안다"}
  - {to: npc_murk, type: 청소하는 영감, like: 20, trust: 20, visibility: 공개, memo: null, words: "문 앞에서 피를 닦는 영감. 가끔 물을 준다. 손이 떨리는 것을 본다. 이유는 모른다"}
toward_player: "느린 평어로 막는다. 마라 이야기에는 귀를 연다. 열쇠 이야기가 나오면 목을 덮는다"
persuade:
  likes: ["마라의 경기를 이야기해 주는 것", "마라가 이기는 것", "고기 한 점(그러나 그것으로 열쇠를 내주지는 않는다)", "문 앞에서 같이 서 있는 것"]
  hates: ["우둔하다고 놀리는 것", "열쇠를 억지로 만지려 하는 것", "마라를 해치겠다는 말"]
