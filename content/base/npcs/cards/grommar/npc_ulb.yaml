    reveal_when: "마라가 직접 부탁하거나 신뢰 60 이상. 마라의 경기가 이긴 날 밤에 가장 쉽다"
    cover: "목을 손으로 덮고 '목 아프다.'라고 한다. 그 손이 열쇠 위에 있다"
  - fact: fact_gm_tal_alive_chained
