id: npc_ulb
name: 울브
aka: [열쇠 든 오그림, 마라의 문지기]
tier: B
type: living
race: 그롬(오그림)
subrace: ''
sex: 남
age: 35
region: 그롬마르 붉은 황야
home: 뼈의 전당 지하 계단 아래 경비 초소
job: 원형장 공성 계급 경비 — 뼈의 전당 지하 감방 열쇠지기
rank: 공성 계급(오그림) 경비. 우둔하다고 무시받는 자
summary: 3m 거구 오그림. 느리고 우둔하다고 믿어져 탈의 지하 감방 열쇠를 맡았다. 마라의 경기를 가장 좋아해서, 마라가 부탁하면 열쇠를 줄지도 모른다
source: docs/world/CHARACTERS.md 색인 한 줄뿐(R16-06) — 지역 섹션·RACES 13으로 새로 씀
life:
  - {year: 277, age: 0, event: "그롬마르 서쪽 오그림 공성 계급 마을에서 태어남. 오그림은 공성 계급이라 어려서부터 문과 성벽을 부수는 일을 배운다"}
  - {year: 285, age: 8, event: "여덟 살에 이미 인간 어른의 키를 넘음. 말이 느려 마을에서 '돌 머리'라 불렸다"}
  - {year: 295, age: 18, event: "공성 계급 경비로 원형장에 배속됨. 원형장 문 앞에 서는 일을 맡음"}
  - {year: 300, age: 23, event: "문 앞에서 열여섯 살 마라의 첫 정식 경기를 봄. 칼을 쥔 팔이 곧은 것을 보고 좋아하게 됨. 그날부터 마라의 경기 날을 손가락으로 센다"}
  - {year: 306, age: 29, event: "뼈의 전당 지하 감방 열쇠를 맡음. 우둔해서 열쇠로 장난칠 줄 모른다는 이유였다. 계단이 일흔 개인 것을 처음 세어 둠"}
  - {year: 310, age: 33, event: "마라가 80승을 넘긴 날 경기장 문을 나서며 처음 고개를 끄덕여 줌. 그 일을 다음 날에도 그다음 날에도 떠올림"}
  - {year: 312, age: 35, event: "늦여름, 마라의 100승 시합이 공표되자 열쇠의 무게가 달라졌다고 느낌. 이유는 그도 모른다"}
appearance:
  - "3m 거구에 어깨가 문틀만 하다. 이마가 낮고 공성 계급 표식으로 쇠 못 세 개를 박았다"
  - "목에 가죽끈으로 큰 쇠 열쇠를 걸었다. 옷 속에 넣지만 가슴께에서 불룩하다"
  - "손바닥에 문과 성벽을 밀며 생긴 굳은살이 돌처럼 두껍다"
smell: "마른 가죽과 돌가루, 구운 고기"
voice_sound: "깊고 느린 저음. 낱말 사이가 길게 벌어진다. 한 번 말한 낱말을 되풀이한다"
personality:
  disposition: {용기: 40, 자비: 30, 정직: 60, 신앙: 10, 탐욕: -30, 충성: 60}
  temperament: [느림, 순직, 외골수]
  habits:
    - "열쇠를 쥔 손으로 목을 덮는다 — 열쇠 이야기가 나오면 자기도 모르게"
    - "마라의 경기 날을 초소 벽에 손톱으로 한 줄씩 긋는다"
    - "지하 계단을 오르내릴 때마다 입으로 숫자를 센다 — 일흔까지"
  values: "맡은 것을 지킨다. 문은 열리지 않는다. 마라가 이긴다"
  fears: [열쇠를 잃는 것, 마라가 경기에서 지는 것, 군주의 눈, 지하의 사슬 소리]
  desires:
    short: "마라의 다음 경기를 앞줄에서 보는 것"
    long: "마라가 이기고도 다치지 않는 것. 열쇠가 덜 무거워지는 것"
voice:
  register:
    to_superior: "그롬 군주와 장수에게는 낱말만 대답한다. '예' 대신 '안다.'"
    to_equal: "다른 그롬에게는 짧고 느린 평어. 말을 두 번 한다"
    to_inferior: "인간에게도 같다. 높이지도 낮추지도 못한다. 명령도 못 한다"
    to_player_default: "느린 평어. 첫마디는 '지나가.'. 마라 이야기에서 말이 길어진다"
  tics: ["한 번 한 말을 되풀이한다", "열쇠 이야기가 나오면 목을 덮는다"]
  use: [열쇠, 문, 무겁다, 붉은 머리(마라를 부르는 말), 먹는다, 지킨다]
  avoid: [이유, 값, 거짓말(그는 말을 꾸미지 못한다), 복잡한 낱말]
  length: "한 번에 낱말 서넛. 문장 하나가 끝나는 데 오래 걸린다. 마라 이야기에서만 두 문장이 이어진다"
  samples:
    - {situation: 첫 만남, line: "지나가. …지나가라. 여기 문. 문은 안 열린다."}
    - {situation: 호의, line: "너 마라 안 싫어한다. 좋다. 마라 이긴다. 이긴다."}
    - {situation: 적대, line: "열쇠 안 준다. 안 준다. 내 목이다."}
    - {situation: 거래, line: "고기 주면 열쇠 안 준다. 하지만 이야기는 한다. 이야기는 열쇠 아니다."}
    - {situation: 거짓말을 못 할 때, line: "(오래 걸린다) …아니다. …모른다. …아니다. 안다. 말 못 한다."}
    - {situation: 위기, line: "마라! 마라 문! 내가 문 잡는다! 안 열린다!"}
    - {situation: 비밀 누설, line: "아래 사람 있다. 눈 없다. 노래한다. 군주 밤마다 간다. 열쇠 이거다. 마라가 말하면… 준다."}
    - {situation: 마음을 열었을 때, line: "마라가 말했다. '고맙다.' 처음이다. 문 앞에서 처음이다. 그래서 열쇠 무겁다. 더 무겁다."}
    - {situation: 회귀자를 의심할 때, line: "너 냄새… 처음인데 오래된 냄새다. 비 맞은 재다. …무섭다."}
schedule:
  아침: "지하 계단 아래 초소에서 감방에 빵과 물을 넣는다"
  낮: "원형장 문 앞에 선다 — 마라가 나오는 날이면 가장 먼저 자리를 잡는다"
  저녁: "경기를 문틈으로 본다. 끝나면 초소로 돌아온다"
  밤: "초소에서 열쇠를 쥐고 앉아 있다. 군주가 내려오면 문을 열고 말없이 서 있다"
places: [뼈의 전당 지하 계단, 지하 계단 아래 초소, 원형장 문 앞]
knows: []
