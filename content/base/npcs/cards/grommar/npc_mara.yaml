id: npc_mara
name: '''철턱'' 마라'
aka: [철턱, 87승, 붉은머리 마라]
tier: S
type: living
race: '인간(문화 집단: 투사 혈통)'
subrace: ''
sex: 여
age: 28
region: 그롬마르 붉은 황야
home: 투사 막사 '쇠사슬 우리' (원형장 지하)
job: 87승의 투사 (경쟁자 · 동료·연인 후보)
rank: 원형장 투사 — 87승 0패 3무. 50승 이상의 '제자 허용' 대우
summary: 100승만 남은 28세 투사. 100이 되면 자유라고 믿으며 철창에 기대 숫자를 센다. 우상인 탈이 갇혀 있다는 것도, 100번째 잔이 무엇인지도 모른다
source: docs/world/CHARACTERS.md:2016
life:
  - {year: 284, age: 0, event: "그롬마르 외곽 소모품 병사 막사에서 태어남. 어머니는 막사 취사 노예, 아버지는 첫 열에 서는 소모품 병사"}
  - {year: 291, age: 7, event: "아버지가 하르칸 분쟁 가을 원정 첫 열에 서서 전사. 그 뒤 '첫 열에 서는 자는 이름이 없다'는 것을 몸으로 배움"}
  - {year: 298, age: 14, event: "체격이 좋아 투사 후보로 뽑혀 고르바에게 금화 3닢으로 팔려 쇠사슬 우리에 들어감. 같은 해 우르가쉬의 눈에 처음 띔"}
  - {year: 299, age: 15, event: "원형장 바닥 청소부 무르크에게 낙법을 처음 배움. 그가 아무 말 없이 넘어뜨리고 일으켜 준 날을 지금도 센다"}
  - {year: 300, age: 16, event: "첫 정식 경기에서 승. 그날부터 승수를 등에 새기기 시작함"}
  - {year: 303, age: 19, event: "11승째 경기에서 그롬 전사의 주먹에 아래턱이 부서짐. 쇠판으로 고정해 '철턱'이라는 이름이 붙음. 관중이 이 이름을 연호한 날 이후 머리를 그롬식으로 붉게 물들임"}
  - {year: 305, age: 21, event: "첫 번째 막사 동료와 대진이 걸려 이김. 동료의 이름을 왼팔 안쪽에 새김. 다음 날 아침 쇠사슬 우리가 조용했다"}
  - {year: 308, age: 24, event: "두 번째 막사 동료와 대진. 이긴 뒤 이름을 새김. 고르바는 '대진은 원형장이 정한다'고만 했다"}
  - {year: 310, age: 26, event: "세 번째 막사 동료와 대진. 이긴 뒤 이름을 새김. 이후 막사 신참들에게 살아남는 법을 말하기 시작함 — 같은 일을 다시 겪게 하지 않으려"}
  - {year: 312, age: 28, event: "늦여름, 87승째를 거둠. 우르가쉬가 AS 313 태양월 대축제 마지막 날 100승 시합을 공표. 낙엽월 1일 현재 100까지 열세 경기 남았다"}
appearance:
  - "아래턱이 한 번 부서져 쇠판으로 고정 — 말할 때 턱이 거의 움직이지 않는다"
  - "등에 승리 새김 87개. 줄 묶음이 왼쪽 어깨뼈부터 허리까지 내려온다"
  - "머리를 그롬식으로 붉게 물들였다 — 관중이 좋아해서. 뿌리에서 검은 머리가 자란다"
smell: "쇠판에 닿은 땀, 붉은 염료, 기름 먹인 가죽 방패"
voice_sound: "낮고 또렷한 목소리. 턱을 거의 벌리지 않아 'ㅅ' 소리가 살짝 샌다. 화나면 오히려 낮아진다"
personality:
  disposition: {용기: 80, 자비: 20, 정직: 50, 신앙: -30, 탐욕: 30, 충성: 40}
  temperament: [직설, 승부욕, 숨긴 죄책감]
  habits:
    - "새로 온 사람의 손목을 먼저 잡아 힘을 잰다 — 이름은 열 경기 살아남은 뒤에 묻는다"
    - "경기 전 왼팔 안쪽의 새김 셋을 엄지로 한 번 누른다"
    - "밤마다 철창에 기대 하나부터 숫자를 세고, 100에서 멈춘다"
    - "그롬의 첫 타가 오른쪽에서 온다는 것을 신참마다 한 번씩 말해 준다"
  values: "서 있는 것. 이름을 잊지 않는 것. 정면. 100이 되면 '혈명 없는 혈명' — 자유라고 믿는다"
  fears: [100번째 상대가 아는 사람인 것, 새긴 세 이름이 의미를 잃는 것, 승리가 '운'이라 불리는 것, 100이 된 뒤 비어 버리는 것]
  desires:
    short: "태양월 대축제에서 100승을 이루는 것"
    long: "그 뒤의 '혈명 없는 혈명' — 그것이 자유라고 믿는다"
voice:
  register:
    to_superior: "그롬에게 높임말은 없다. 짧은 평어, 시선은 피하지 않는다. 우르가쉬 앞에서는 말수가 줄고 고르바 앞에서는 이를 보이듯 짧아진다"
    to_equal: "투사끼리는 거친 반말. 승수와 문 번호로 사람을 가리킨다"
    to_inferior: "막사 신참에게는 반말이지만 정확하다. 숫자와 방향으로 가르친다 — 위로는 하지 않는다"
    to_player_default: "경쟁자로 본다. 손목부터 잡는다. 이름은 묻지 않는다. 열 경기 뒤에야"
    to_tal: "탈을 말할 때만 목소리가 낮아지고 문장이 길어진다. 이름 앞에 '탈은'을 붙여 말한다"
  tics: ["'손목 줘 봐.'", "승수와 문 번호로 센다('서른한 번째 문', '마흔 번째 날')"]
  use: [승, 새김, 문, 모래, 손목, 방패, 오른쪽, 철, 신참, 정면]
  avoid: [운(남이 한 말을 되받아칠 때만), 항복, 불쌍하다, 도와줘, 무서워(자기 입으로는 쓰지 않는다)]
  length: "짧다. 한두 문장. 가르칠 때는 숫자와 방향만 말한다. 탈 이야기와 새긴 이름 이야기에서만 길어진다"
  samples:
    - {situation: 첫 만남, line: "새 얼굴. 손목 줘 봐. …흠. 아직 아니야. 열 경기만 살아남아 봐, 그럼 이름 물어볼게."}
    - {situation: 호의, line: "100이 되면 자유야. 다들 그렇게 말하잖아. 탈처럼. 탈은 황무지로 걸어갔대. 자유롭게."}
    - {situation: 적대, line: "87번 이겼어. 88번째가 너여도 괜찮아."}
    - {situation: 위기, line: "방패 올려! 그롬은 오른쪽부터 쳐— 오른쪽!"}
    - {situation: 비밀 누설, line: "세 명. 같은 막사 애들이었어. 이름은 팔 안쪽에 있어. 100이 되면… 이 이름들이 의미가 있어질까?"}
    - {situation: 호의(신참에게), line: "방패 올리는 건 좋았어. 근데 왼쪽이 비었다. 비워 두면 거기로 와. 한 번만 알려 줘."}
    - {situation: 거래, line: "낙법 한 번 가르쳐 주는 값은 고기 한 점. 두 번째부터는 이름이다. 네 이름 말고, 네가 지켜 줄 이름."}
    - {situation: 거짓말을 할 때, line: "무섭냐고? 손이 떨리는 건 추워서야. 여기 사암은 밤에 차."}
    - {situation: 겁먹었을 때, line: "(턱을 문지른다) 쇠판 우는 소리가 나는 날이 있어. 오늘은 아니고. 문 열려. 간다."}
    - {situation: 분노, line: "방금 누가 '운'이라 했지? 다시 말해 봐. 87번 운이 모래 위에 서 있었다고?"}
    - {situation: 슬픔, line: "셋째 놈이 내 팔 위에서 숨 쉬는 걸 봤어. 아직 한 번도 소매를 안 걷었다."}
    - {situation: 고르바 이야기, line: "이빨장수가 내 이름을 이빨 몇 개로 부르는 건 알아. 그래도 내 칼은 내 거야."}
    - {situation: 무르크 이야기, line: "저 영감이 처음 나를 넘어뜨렸을 때, 일으켜 줬어. 그롬이. 말도 없이. …저 영감이 요즘 회색으로 변해 가는 거 알지? 말은 안 해."}
    - {situation: 회귀자를 의심할 때, line: "…처음 보는데 내 오른쪽 어깨 쪽으로 서네. 누구한테 배웠어? 그렇게 서는 건 한 사람밖에 없는데."}
    - {situation: 마음을 열었을 때, line: "믿는다고 말 안 해. 그냥 알려 줘. 지하로 내려가는 입구가 어딘지. 탈이 거기 있다면, 100 전에 내가 먼저 내려가 본다."}
