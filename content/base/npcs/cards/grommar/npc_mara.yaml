  - {to: npc_murk, type: 막사 근처의 그롬, like: 30, trust: 30, visibility: 공개, memo: null, words: "처음 넘어뜨려 일으켜 준 그롬. 요즘 몸이 회색으로 바래는 게 눈에 보인다. 말은 못 하고 곁을 지나칠 때 일부러 천천히 걷는다"}
