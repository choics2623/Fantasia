  - {to: npc_gorba, type: 조련사, like: -20, trust: 20, visibility: 공개, memo: null, words: "자기를 이빨 몇 개로 값 매긴 자. 믿지 않는다. 그런데 그가 100번째 상대를 구한다는 말이 귀에서 떠나지 않는다"}
