  - situation: 호의
    line: 이름을 부르는 입은 죽은 자도 듣는다. 이마에 재 한 줌 바르고 가라.
  - situation: 거절
    line: 그 말은 항아리가 듣는다. 항아리는 입이 없다.
  - situation: 분노
    line: 붉은 젖을 목줄이라 부르는 입이 있으면 그 입에 붉은 젖을 쏟겠다. 한 잔이면 족하다.
  - situation: 슬픔
    line: 잔이 셋 다 쓰였다. 새 잔이 오기 전에 누군가 이긴다면 그는 의식 없이 이긴 것이다.
  - situation: 위기
    line: 항아리를 덮어라! 모래 위에 쏟지 마라 — 그건 이름이다!
  - situation: 비밀 누설
    line: 9번 숙소의 바닥을 안다. 내가 말하면 그롬이 먼저 모래를 판다. 그래서 말하지 않는다 — 이유는 묻지 마라.
  - situation: 거래
    line: 새 잔 하나를 쇠 시장에서 가져오면 탈에게 젖을 한 번 건너뛰게 해 주겠다.
  - situation: 거짓말
    line: 봉기라는 말은 처음 듣는다.
