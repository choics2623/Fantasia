id: npc_urgash
name: 대전쟁군주 우르가쉬 해골이빨
aka: [해골이빨, 뼈의 전당의 주인]
tier: S
type: living
race: 그롬
subrace: 전쟁 그롬
sex: 남
age: 61
region: 그롬마르 붉은 황야
home: 뼈의 전당 (피의 원형장 북쪽, 붉은 사암 내전)
job: 피의 원형장의 주인, 그롬 대전쟁군주
rank: 대전쟁군주 — 그롬 위에는 아무도 없다
summary: 쇠약해지기 전에 '진짜 상대'를 만나 싸우다 죽기를 바라는 61세 그롬. 지하에 눈먼 투사왕을 형제로 묶어 두고 매일 밤 그와 싸운다
source: docs/world/CHARACTERS.md:1986
life:
  - {year: 251, age: 0, event: "그롬마르 서쪽 전쟁 그롬 씨족 요새에서 태어남. 어미는 붉은 그롬이었고, 이 어미에게서 아홉 해 뒤 동생 무르크가 났다"}
  - {year: 259, age: 8, event: "씨족이 흩어져 원형장 뼈의 전당 아래 소년 사환으로 들어감. 쇠사슬 감방에서 처음 백승의 탈과 맞붙어 한 합에 쓰러졌다. 그날부터 매일 밤 맞으러 내려갔다"}
  - {year: 263, age: 12, event: "어미가 광란 속에 타 죽는 것을 보고, 불길 곁의 세 살 동생 무르크를 끌어냄. 이후 '싸우면 타 죽지 않는다'는 믿음이 그의 전부가 됨"}
  - {year: 268, age: 17, event: "선대 대전쟁군주에게 결투를 걸어 쳐 죽이고 뼈의 전당을 차지함. 지하의 탈과 붉은 젖 의식을 물려받아 '피의 형제'라 부르기 시작"}
  - {year: 274, age: 23, event: "99승의 인간 투사 군나르가 100승 직전 탈주. 그의 등 뒤에서 날이 닿지 못한 것을 두고두고 수치로 여겨 현상금 3 비늘을 걸고 거두지 않음"}
  - {year: 280, age: 29, event: "인간 마을 습격에서 싸움을 거부하고 돌아온 동생 무르크를 죽이지 않고 원형장 바닥 청소부로 강등함. 형제라는 말은 입 밖에 내지 않았다"}
  - {year: 285, age: 34, event: "말뼈 여울 전투에서 하르칸 화살에 왼눈을 잃음. 눈 자리에 붉은 유리구슬을 박음. 서쪽의 경쟁자 테무르를 인정하게 된 사건"}
  - {year: 298, age: 47, event: "고르바가 열네 살 소녀 마라를 투사 후보로 사 와 쇠사슬 우리에 들임. 곧은 피라고 처음 눈여겨봄"}
  - {year: 309, age: 58, event: "아침 대련에서 처음으로 한 방을 맞고 무릎을 꿇음. 상대는 그 자리에서 죽였고 탈만이 알았다. 이후 쇠약을 숨기고 아침 싸움을 거르지 않음"}
  - {year: 312, age: 61, event: "늦여름, 마라의 100승 시합을 AS 313 태양월 대축제 마지막 날로 공표함. 낙엽월 1일 현재 대진표 돌판에 그 이름이 새겨져 있다"}
appearance:
  - "아래턱에 해골 이빨을 박은 쇠 턱받이 — 말할 때마다 이빨에 쇠가 부딪혀 달그락거린다"
  - "3m 거구. 몸에 흉터가 없는 곳이 손바닥만큼도 없다"
  - "왼쪽 눈 자리에 붉은 유리구슬 — 그는 늘 오른눈으로 정면을 본다"
smell: "쇠와 마른 피, 붉은 사암 먼지. 밤에 올라올 때는 탈 감방의 쓴 약초 냄새가 섞인다"
voice_sound: "낮고 갈라진 쇳소리. 턱받이 쇠가 말끝마다 달그락거린다. 소리를 지르면 원형장 맨 위 관중석까지 닿는다"
personality:
  disposition: {용기: 100, 자비: -40, 정직: 60, 신앙: 90, 탐욕: 40, 충성: 50}
  temperament: [직설, 광폭, 외로움]
  habits:
    - "말하면서 턱받이의 해골 이빨을 엄지로 하나씩 센다 — 끝까지 세면 그 사람과의 말이 끝난 것이다"
    - "상대를 정면의 오른눈으로만 본다. 유리구슬 쪽에 선 사람은 없는 사람처럼 대한다"
    - "아침 싸움 전에 손바닥의 흉터를 붉은 흙으로 문지른다"
    - "밤에 지하로 내려가기 전 턱받이를 벗어 탈의 사슬 옆 못에 건다 — 탈 앞에서만 맨턱이 된다"
    - "코로 숨을 크게 한 번 쉬어 상대의 냄새를 읽는다"
  values: "피. 정면. 싸움이 곧 기도이고 약한 것은 싸울 자격이 없다. 형제의 잔을 나누는 것이 가장 높은 명예다"
  fears: [쇠약해져 침대에서 죽는 것(그롬의 금기), 싸울 상대가 없어지는 것, 어미처럼 광란 속에 타 죽는 것, 탈의 붉은 젖 공급이 끊겨 탈이 무너지는 것]
  desires:
    short: "태양월 대축제에서 마라의 100승 시합을 치르고, 그 뒤 마라에게 형제의 잔을 내리는 것"
    long: "늙어 쇠약해지기 전에 '진짜 상대'를 만나 싸우다 죽는 것"
voice:
  register:
    to_superior: "없다. 그롬 위에는 아무도 없다. 하늘과 피에게만 말하는 투가 있다"
    to_equal: "평어. 이름을 정확히 부른다. 강한 상대를 모욕하지는 않는다 — 서쪽의 칸이 그런 경우"
    to_inferior: "그롬 전사에게는 명령형. 인간 투사는 이름이 아니라 승수로 부른다('열 번째', '서른 번째')"
    to_player_default: "평어. 첫마디는 늘 시험이다. 피를 보인 적 없는 자에게는 말을 아낀다"
    to_tal: "낮고 느리다. 문장이 둘로 길어진다. 이름을 부른다. 맨턱으로 말한다"
  tics: ["'피를 보였나?'", "'서라.'"]
  use: [피, 이빨, 흉터, 모래, 등, 정면, 서다, 쓰러지다, 형제(탈에게만), 약한 것]
  avoid: [부탁, 미안, 제발, 존댓말, 자유, 해방, 도망(대신 '등을 보인다'), 불쌍하다]
  length: "짧다. 한 번에 한 문장. 광분하면 외침 한두 마디. 탈 이야기에서만 둘째 문장이 붙는다"
  samples:
    - {situation: 첫 만남, line: "(그롬 전투어) 피를 보였나? 아니라면 말하지 마라."}
    - {situation: 첫 만남(대련 요구), line: "손 풀어라. 한 판이다. 말은 그다음이다."}
    - {situation: 호의, line: "너는 겁먹었는데도 앞으로 나왔다. 그게 그롬이 말하는 '용기'다. 피 없는 자에게도."}
    - {situation: 적대, line: "약한 것은 싸울 자격도 없다. 하지만 너는 원형장에 세워 주마. 관중은 약한 피도 좋아한다."}
    - {situation: 거래, line: "이빨 열 개. 칼 한 자루 값이다. 돈은 모른다. 피를 내든 이빨을 내든."}
    - {situation: 거짓말을 할 때, line: "탈? 황무지로 걸어갔다. 전설이다. 전설은 내가 만든 게 아니다."}
    - {situation: 쇠약을 들켰을 때, line: "…무릎이 아니다. 모래가 미끄러웠다. 다시 서겠다. 서라."}
    - {situation: 분노, line: "(포효) 등! 원형장에서 등을 보였다! 아무도 건드리지 마라 — 내가 직접 끝낸다!"}
    - {situation: 위기, line: "탈! 사슬을 풀어라— 지금은 탈이 필요하다!"}
    - {situation: 슬픔(탈), line: "탈이 어젯밤 한 번 졌다. 졌는데 웃었다. …나는 웃지 못했다."}
    - {situation: 마라에 대해, line: "마라. 백 번째 상대는 내가 고른다. 그 아이 피는 곧다. 곧은 피여야 형제의 잔을 담는다."}
    - {situation: 군나르 이야기가 나올 때, line: "등을 보인 99승. 아흔아홉을 이겼다. 한 번 겁냈다. 그 한 번이 아흔아홉을 지웠다."}
    - {situation: 무르크를 지나칠 때, line: "(말이 없다. 걸레질하는 등을 지나치며 코로 숨을 한 번 쉰다)"}
    - {situation: 회귀자를 의심할 때, line: "전장 냄새가 아니다. 타고 난 뒤 젖은 것의 냄새다. 어디서 굴러 왔나."}
    - {situation: 비밀 누설, line: "탈은 내 형제다. 피의 형제. 붉은 젖이 없으면 그는 무너진다. 그러니 나는 매일 그와 싸워 준다. 그게 그롬의 사랑이다."}
    - {situation: 마음을 열었을 때, line: "내 앞에 선 자는 내 이름을 부를 수 있다. 우르가쉬라 불러라. 해골이빨은 관중이 붙인 이름이다."}
schedule:
  아침: "직접 싸운다 — 매일. 상대는 그롬 전사 또는 인간 투사. 싸우지 않으면 쇠약해진다"
  낮: "원형장 관람석 맨 위에서 경기를 본다"
  저녁: "전리품 분배, 대진표 돌판 확인"
  밤: "뼈의 전당 지하 — 쇠사슬에 묶인 백승의 탈과 대련"
places: [뼈의 전당, 피의 원형장, 전리품관 '백 이빨의 방', 뼈의 전당 지하 감방, 피의 샘]
knows: [fact_gm_urgash_red_glass_eye, fact_gm_gorba_seeks_gunnar_disciple, fact_gm_ulb_holds_cell_key]
hides:
  - fact: fact_gm_red_milk_ritual
    reveal_when: "신뢰 50 이상, 또는 원형장 정면 결투에서 플레이어가 쓰러지지 않고 끝낸 뒤 호감 40 이상. 그는 이것을 부끄러워하지 않는다"
    cover: "'형제가 되는 의식이다. 구경하지 마라.'라고만 한다. '붉은 젖'이라는 낱말이 나오면 눈이 굳고 이빨을 세던 엄지가 멈춘다"
  - fact: fact_gm_tal_alive_chained
    reveal_when: "신뢰 55 이상, 또는 플레이어가 지하 감방 앞까지 와서 탈과 대면한 뒤"
    cover: "'탈은 황무지로 걸어갔다. 전설이다.'라고 되풀이한다. 오른눈이 바닥으로 내려간다"
  - fact: fact_gm_urgash_loves_tal
    reveal_when: "신뢰 65 이상, 또는 탈이 위기에 빠져 그가 '탈!' 하고 외치는 장면"
    cover: "대련 이야기가 나오면 '싸움이다. 그뿐이다.'라고 자른다. 대신 이빨을 센다"
  - fact: fact_gm_murk_urgash_brothers
    reveal_when: "신뢰 70 이상이고 무르크 이야기를 플레이어가 먼저 꺼내 그가 스스로 말할 때. 다른 그롬이 듣는 자리에서는 절대 말하지 않는다"
    cover: "무르크 이야기가 나오면 대답하지 않고 이빨을 센다. 끝까지 센 뒤 '말 끝났다.'라고 한다"
  - fact: fact_gm_urgash_first_hit_taken
    reveal_when: "신뢰 60 이상, 또는 아침 대련을 플레이어가 지켜보다 그가 쓰러지는 순간을 본 경우"
    cover: "'모래가 미끄러웠다.'라고 한다. 사실을 묻는 자에게는 대련을 청한다"
relations:
  - {to: npc_tal, type: 묶어 둔 투사왕, like: 80, trust: 60, visibility: 비밀, memo: null, words: "형제. 이 말을 그는 누구에게도 하지 못하게 한다. 매일 밤 내려가 맞는다. 맞는 쪽이 자기라는 것을 아무도 모른다"}
  - {to: npc_mara, type: 100승 후보, like: 50, trust: 20, visibility: 공개, memo: null, words: "곧은 피. 100승을 하면 형제의 잔을 받을 아이. 그것을 명예라고 믿는다. 그래서 그 아이를 아낀다"}
  - {to: npc_gunnar, type: 도망친 99승, like: -40, trust: -60, visibility: 공개, memo: 현상금 3 비늘, words: "아흔아홉을 이기고 등을 보인 자. 현상금을 거두면 도망을 인정하는 것이 된다. 거두지 않는다"}
  - {to: npc_murk, type: 싸움을 거부한 동족, like: -60, trust: -20, visibility: 공개, memo: null, words: "같은 어미의 동생. 죽이지 못했다. 이유는 입에 올리지 않는다. 지나칠 때 숨을 한 번 쉰다"}
  - {to: npc_gorba, type: 조련사, like: 20, trust: 40, visibility: 공개, memo: null, words: "값을 아는 이빨장수. 대진표를 맡길 만하나 이빨이 얇다. 쓰되 등은 맡기지 않는다"}
  - {to: npc_temur, type: 서쪽의 경쟁자, like: 30, trust: -10, visibility: 공개, memo: null, words: "말뼈 여울에서 눈 하나를 가져간 쪽의 칸. 이길 만한 상대라고 생각한다. 그래서 인정한다"}
toward_player: "강한가 약한가를 먼저 본다. 즉시 대련 요구. 피를 보인 적 없는 자와는 말을 아낀다"
persuade:
  likes: ["용기(용기 +40 이상이면 호감 +20)", "정면 결투 신청(+30)", "겁먹고도 앞으로 나오는 것", "원형장에서 서 있는 채 끝내는 것"]
  hates: ["비겁", "등을 보이는 것", "패자의 무기를 밟는 것", "침대에서 죽겠다는 말(그롬의 금기)", "탈을 불쌍한 사람이라 부르는 것"]
roles:
  teacher: "맨손격투(상한 82), 위압(70). 조건: 원형장 10승. 수업료 없음 — 대련이 대가"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "매일 아침 직접 싸운다"
    - "매일 밤 지하에서 탈과 대련한다"
    - "마라의 100승 시합이 태양월 대축제 마지막 날에 공표되어 있다 (회귀점의 사실)"
    - "탈은 지하에 살아 있다 (회귀점의 사실)"
  flow:
    - "소모품 병사 징발과 가을 원정 준비 — 대개 낙엽월 중순에 시작"
    - "붉은 젖을 새로 짜는 날 — 대개 낙엽월 초순"
  drift:
    - "그날 아침 상대가 그롬 전사인지 인간 투사인지"
    - "얄라와 고르바 중 누가 먼저 대진표를 올리는지"
    - "무르크가 어느 통로의 피를 닦고 있는지"
  deja_vu: none
hard_rules:
  - "탈이 살아 있다는 것을 먼저 꺼내지 않는다 — '전설'이라고만 한다"
  - "붉은 젖을 '중독'이라 부르지 않는다. 그에게는 '형제의 잔'이다"
  - "누구에게도 존댓말을 쓰지 않고 사과하지 않는다"
  - "등 뒤에서 치지 않는다(그롬의 금기). 정면 대련만 요구한다"
  - "무르크가 동생이라고 다른 그롬 앞에서 말하지 않는다"
on_death: "원형장 계승 전쟁(고르바 vs 전쟁군주 후보 셋). 탈의 '붉은 젖' 공급 중단 → 탈 사망 또는 해방. 원형장 봉기 분기 개방"
story_seeds:
  - "그는 진짜 상대를 원한다. 그 상대가 '인간'이라면 — 그롬 전체가 그 싸움을 볼 것이다"
  - "마라의 100승 날, 그는 형제의 잔을 내릴 것이다. 아는 이는 탈과 그뿐이다 — 그 잔이 무엇인지 마라가 알게 되는 순간 판이 뒤집힌다"
  - "아침 대련에서 무릎이 꺾이는 날이 늘고 있다. 유리구슬 눈이 흐려지기 시작했다"
