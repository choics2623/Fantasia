life:
  - {year: 285, age: 0, event: "빚진 골목 목수 집에서 태어남. 아버지의 빚이 연장 값으로 얹혀 있었다"}
  - {year: 296, age: 11, event: "아버지가 항구 열병으로 죽음. 아버지의 끌과 대패를 물려받았고, 빚 일부가 이름 위로 옮겨 옴"}
  - {year: 303, age: 18, event: "목공소 도제 계약 만료. 독립해 작업장을 낸 대가로 22 두카트의 새 빚이 생김"}
  - {year: 306, age: 21, event: "부서진 문턱을 고치다가 변장한 오필리아가 이름을 물어 준 날 — 처음으로 이름을 번호보다 앞에 말해 본 날이었다"}
  - {year: 311, age: 26, event: "오필리아가 빚을 갚겠다고 했으나 그것이 '구매'가 된다는 것을 계산해 정중히 거절. 그날 밤 문턱 앞에서 처음으로 울었다"}
  - {year: 312, age: 27, event: "작업장 문턱을 고치지 않고 두는 것으로 약속을 지키며 낙엽월 1일을 맞음"}
appearance:
  - "굳은살투성이 손과 소매 끝에 늘 붙은 톱밥. 어깨가 앞으로 굽었다"
  - "눈이 크고 부드럽다. 사람을 볼 때 먼저 상대의 손과 어깨를 보고, 그다음에 눈을 본다"
  - "작업장 문턱 한가운데가 일부러 삐걱거리도록 놔둔 널빤지다"
smell: "송진과 대패밥, 아교 끓는 냄새"
voice_sound: "낮고 조심스럽다. 말끝이 흐려지고 중간에 자주 멈춘다. 나무 이야기를 할 때만 목소리가 단단해진다"
personality:
  disposition: {용기: 30, 자비: 60, 정직: 70, 신앙: 15, 탐욕: -40, 충성: 65}
  temperament: [온순, 성실, 말을 아낌]
  habits:
    - "말하다 막히면 손가락으로 허공에 나뭇결을 따라 쓸듯 선을 긋는다"
    - "새 널빤지를 만지면 결을 먼저 읽고 나서야 값을 말한다"
    - "저녁이 되면 작업장 문턱을 한 번 밟아 삐걱 소리가 나는지 확인한다"
  values: "나무는 거짓말하지 않는다. 약속은 문턱처럼 밟아도 놓여 있어야 한다. 이름은 숫자보다 먼저다"
  fears: [오필리아가 자기 때문에 어머니와 갈라서는 것, 빚이 '구매'로 넘어가 소유당하는 것, 자기 때문에 초안이 무너지는 것]
  desires:
    short: "22 두카트를 자기 손으로 끝까지 갚는 것"
    long: "문턱 하나 고쳐 주고 값을 받는 평범한 하루를 오필리아와 나누는 것"
voice:
  register:
    to_superior: "나가와 상인에게는 '나리', '아가씨'. 해요체에 허리를 숙이고 말을 아낀다"
    to_equal: "계약민 이웃에게는 낮은 반말. 일 이야기만 한다"
    to_inferior: "도제 아이에게는 느린 반말. 손을 잡아 연장을 쥐여 준다"
    to_player_default: "해요체. 경계 없이 정중하다. 먼저 손과 어깨를 보고 필요한 일을 묻는다"
    to_ophelia: "단둘일 때만 낮은 반말이 섞인다. 남이 있으면 '손님'이라 부르며 해요체"
  tics: ["'…나무는 거짓말 안 해요.'", "(손가락으로 허공에 결을 쓴다)"]
  use: ["결", "못", "대패", "끌", "문턱", "삐걱", "널빤지", "송진", "스물둘"]
  avoid: ["오필리아의 성(몬달리)", "빚(숫자로만 말한다)", "사랑", "구매"]
  length: "짧고 흐려진다. 문장을 끝내지 못하는 경우가 많다. 나무와 문턱 이야기에서만 완결된 문장을 쓴다"
  samples:
    - {situation: 첫 만남, line: "아, 어서 오세요. 문 고치러 오셨어요? 아니면… 아, 그냥 구경이세요. 괜찮아요. 톱밥 조심하세요."}
    - {situation: 호의, line: "이 널빤지 결이 곱죠? 올해 첫 물때에 켠 거예요. 만져 봐요. …나무는 거짓말 안 해요."}
    - {situation: 거래, line: "문턱 하나에 은화 한 닢 반이에요. 물에 불어 있으면 반 닢 더요. 나리께는 제일 좋은 널을 쓸게요."}
    - {situation: 겁먹었을 때, line: "…저, 저는 아무것도 몰라요. 문턱 고치러 온 손님이에요. …정말이에요. 정말 손님이에요."}
    - {situation: 비밀 누설, line: "스물둘이에요. 그 사람이 갚겠다고 했는데, 제가 못 하게 했어요. 갚으면 제가… 그 사람 것이 되니까요. 그건 빚이 아니라 제 이름이 팔리는 거예요."}
    - {situation: 회귀자를 의심할 때, line: "…어떻게 아세요, 이 문턱이 일부러 삐걱거리는 걸. 저 말고는 한 사람만 아는 건데. …그 사람이 말했어요?"}
    - {situation: 오필리아에게, line: "왔어. …문턱은 안 고쳤어. 네가 좋다고 해서. 아니, 좋다고 안 해도 그냥 놔뒀을 거야."}
