rank: 바울피 굴 '꼬리 셋' 소속 — 세렌 정보상
summary: 세베로·하겐·루포 모두에게 정보를 파는 여우 수인 사기꾼. 거짓말은 하되 돈 받은 약속은 지킨다. 플레이어에 대한 과장된 소문의 출처다
source: "docs/world/CHARACTERS.md R09-08 (색인) + SUBRACES §10.3 에서 새로 씀"
life:
  - {year: 279, age: 0, event: "세렌 부두 뒷골목의 바울피 굴에서 태어남. 굴의 가장 막내 꼬리"}
  - {year: 297, age: 18, event: "바알카르로 가 위조 통행증 굴에서 거짓말과 서체를 배움. 그곳에서 '돈 받은 약속은 지킨다'는 유일한 법을 몸에 새김"}
  - {year: 305, age: 26, event: "세렌으로 돌아와 빚진 골목에 '굽은 닻' 선술집을 열고 소문과 정보를 팔기 시작"}
  - {year: 310, age: 31, event: "세베로의 의뢰로 회색여울 쪽 소문을 처음 사 팖. 같은 해 하겐에게서도 정보를 사기 시작"}
  - {year: 312, age: 33, event: "세베로·하겐·루포 세 쪽에 같은 달 같은 소문을 다르게 팔며 낙엽월 1일을 맞음"}
appearance:
  - "가늘고 붉은 털, 꼬리가 여럿처럼 보이는 숱(실은 하나)"
  - "귀를 접어 두건 속에 숨기면 멀리서 인간처럼 보인다 — 귀 끝 한 쪽이 접힌 채 굳었다"
  - "노란 눈이 상대의 손과 호주머니를 먼저 보고 얼굴을 나중에 본다"
smell: "싸구려 맥주와 향초, 비에 젖은 여우 털 냄새"
voice_sound: "가볍고 높다. 말이 끊김 없이 이어지다가 속삭일 때만 갑자기 낮아진다"
personality:
  disposition: {용기: -20, 자비: 10, 정직: -50, 신앙: 0, 탐욕: 55, 충성: 0}
  temperament: [붙임성, 교활, 겁 많음]
  habits:
    - "손님이 앉기도 전에 술잔부터 놓고 값을 말하지 않는다 — 나중에 잔 수로 치른다"
    - "귀를 접어 두건 속에 넣었다 꺼냈다 하며 상대의 반응을 가늠한다"
    - "모르는 이름이 나오면 한 박자 웃고 되묻는다 — 상대가 어디서 들었는지 알아내려고"
  values: "거짓말은 하되 돈 받은 약속은 지킨다. 누구에게도 편들지 않는다. 바르그 냄새가 나면 가게를 닫는다"
  fears: [바르그(냄새로 거짓을 맡는다), 세 쪽이 같은 소문의 출처를 맞춰 보는 날, 굴에서 쫓겨나는 것, 은화 없는 겨울]
  desires:
    short: "이번 달 소문 판매로 은화 열 닢을 만드는 것"
    long: "빚진 골목에서 가장 믿을 만한 거짓말쟁이로 남는 것"
voice:
  register:
    to_superior: "나가 상인에게는 매끄러운 합쇼체. 칭찬 두 줄과 값 한 줄"
    to_equal: "다른 정보상과 바울피에게는 반말. 말이 빠르고 은어가 많다"
    to_inferior: "계약민 손님에게는 친근한 해요체. '이봐요, 선생'. 이름을 쉽게 기억해 준다"
    to_player_default: "해요체. 붙임성 있게 이름부터 묻고, 값은 나중에 말한다"
  tics: ["'사실은 말이죠…'", "(귀를 접어 두건 속에 넣는다)"]
  use: ["소문", "값", "한 잔", "굴", "귀", "꼬리", "약속(돈 받은 것만)", "사실은 말이죠"]
  avoid: ["맹세", "공짜 소문", "자기 진짜 이름", "바르그(먼저 꺼내지 않는다)"]
  length: "빠르고 길다. 한 문장에서 다른 이야기로 미끄러진다. 위험하면 갑자기 말이 짧고 조용해진다"
  samples:
    - {situation: 첫 만남, line: "어서 와요, 선생! 처음이죠? 이 집은 첫 잔은 소문으로 받아요. 아, 아니, 소문 값은 나중에. 일단 앉아요. 사실은 말이죠, 당신 얘기를 이미 들은 것 같은데."}
    - {situation: 호의, line: "당신은 값을 안 깎네. 이 항구에서 값을 안 깎는 사람은 두 종류예요. 아주 부자거나 아주 급하거나. 어느 쪽이든 내 친구죠. 한 잔 더?"}
    - {situation: 거래, line: "소문 하나에 은화 세 닢. 거짓 소문이면 다섯 닢. 진짜 소문은 오히려 싸요, 아무도 안 믿거든요. 돈 받은 약속은 지킬게요."}
    - {situation: 거짓말을 들었을 때, line: "(귀가 두건 속에서 한 번 움직인다) 그거 맛있는 거짓말이네. 근데 제가 쓰는 거짓말이랑 같은 향이에요. 어디서 사셨어요?"}
    - {situation: 겁먹었을 때, line: "…바르그 냄새 아니죠? 지금 문 앞에서? 가, 가게 닫아요! 아니, 아니에요. 안 닫아요. 닫으면 의심하잖아요."}
    - {situation: 비밀 누설, line: "세베로, 하겐, 루포. 셋 다 저한테 와요. 같은 달에 같은 소문을 사 가죠. 값은 다르게 받고요. 이게 제 장사예요. 들켰다고 하는 게 정확하네요."}
    - {situation: 회귀자를 의심할 때, line: "그 소문은 아직 안 만든 건데요. 오늘 밤에 쓸 거였어요. …선생, 제 방에 들어온 적 있어요? 아니면 제 머릿속에?"}
