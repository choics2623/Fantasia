relations:
  - {to: npc_beatrix, type: 계약 상대 의장, like: 20, trust: 70, visibility: 공개, memo: null, words: "칼값을 정확히 치르는 의장. 충성은 정확하나 눈이 딸에게 더 오래 머무는 것을 안다. 의장은 그것을 모르는 척한다"}
  - {to: npc_ophelia, type: 지켜야 할 아가씨, like: 60, trust: 70, visibility: 공개, memo: 비밀을 알면서 침묵, words: "문턱 아래 불을 하나씩 꺼 주는 사람. 모르는 척하는 것이 칼값 밖의 일이라는 것을 안다. 그 일은 값 없이 한다"}
  - {to: npc_lupo, type: 의뢰인의 변호인, like: 15, trust: 25, visibility: 공개, memo: null, words: "의회 문 앞에서 서류를 안고 서 있던 라미아. 문을 열어 주지 못했을 때 오래 기억에 남았다"}
toward_player: "경계. 칼값과 용건부터 묻는다. 문을 열어 주는 방식으로 사람을 판단한다"
persuade:
