id: npc_sahar
name: "'줄무늬' 사하르"
aka: [줄무늬, 의회 경호대장]
tier: B
type: living
race: 수인족(타이란)
subrace: ''
sex: 여
age: 41
region: 세렌 해안 동맹
home: "아홉 비늘 의회당 경호대 숙소 · 몬달리 저택 정문 곁 초소"
job: 의회 경호대장
rank: 아홉 비늘 의회 경호대장 — 계약민 출신 경호원 30명 지휘(드문 인간 무장 허가)
summary: 칼값을 받는 범 수인. 계약민 출신 경호원 서른을 지휘하고 베아트릭스에게 충성하지만 오필리아를 더 아낀다. 표결 날 의회당 문을 누구에게 열지는 그녀가 정한다
source: "docs/world/CHARACTERS.md R09-06 (색인) + SUBRACES §10.1 에서 새로 씀"
life:
  - {year: 271, age: 0, event: "남해 해안의 타이란 짝무리에서 태어남. 짝무리는 칼값을 받으면 인간을 사냥하거나 지킨다"}
  - {year: 290, age: 19, event: "짝무리를 떠나 칼값 용병으로 세렌에 들어옴. 물비늘대 훈련을 받으며 법과 계약서를 처음 읽어 달라고 청함"}
  - {year: 296, age: 25, event: "계약민법 통과 직후 의회 경호대에 고용됨. 계약민 출신 경호원 30명을 쓰겠다고 청해 인간 무장 허가를 받음 — 드문 일이었다"}
  - {year: 303, age: 32, event: "의장의 딸 오필리아의 변장 외출을 처음 목격. 아무에게도 말하지 않고 그 뒤로 외출 날의 뒷길을 비워 주기 시작"}
  - {year: 308, age: 37, event: "경호대장이 됨. 칼값과 충성은 다르다고 스스로 정함"}
  - {year: 312, age: 41, event: "의회 표결을 앞두고 경비 배치표를 쥔 채 낙엽월 1일을 맞음"}
appearance:
  - "황갈색 털에 검은 줄무늬. 키가 2미터에 가깝고 걸을 때 소리가 거의 나지 않는다"
  - "허리에 칼을 두 자루 찬다 — 하나는 의회 지급, 하나는 짝무리에서 가져온 것"
  - "꼬리 끝이 느리게 움직인다 — 가만히 있을 때도 그것으로 기분이 읽힌다"
smell: "기름 먹인 가죽과 마른 풀, 범 특유의 따뜻하고 진한 냄새"
voice_sound: "낮고 짧은 소리. 말끝에 짧은 숨소리가 섞이고 화가 나면 소리가 더 낮아진다"
personality:
  disposition: {용기: 70, 자비: 30, 정직: 55, 신앙: 10, 탐욕: 5, 충성: 65}
  temperament: [과묵, 냉정, 지키려는 마음]
  habits:
    - "문을 지날 때 먼저 문턱 아래를 한 번 본다"
    - "꼬리 끝이 한 번 움직이면 그것으로 대답을 대신한다"
    - "경비 배치표를 매일 새벽 손으로 다시 쓴다 — 외우려는 것이 아니라 확인하려는 것"
  values: "칼값을 받으면 지킨다. 칼값과 충성은 다르다. 문은 내가 연다"
  fears: [표결 날 문을 잘못 열어 오필리아가 다치는 것, 계약민 경호원 서른이 의회에 의해 해산되는 것, 의장의 명령과 오필리아의 비밀이 부딪치는 순간]
  desires:
    short: "표결 날 의회당 경비가 무사히 끝나는 것"
    long: "계약민 출신 경호원들이 자기 이름으로 서명하는 날"
voice:
  register:
    to_superior: "의장에게는 '의장님'. 짧은 합쇼체. 질문에는 '예' 또는 '아니요'로만 답한다"
    to_equal: "다른 경호대·물비늘대에게는 평어 반말. 명령은 한 단어"
    to_inferior: "경호원들에게는 낮고 짧은 명령형. 칭찬은 꼬리 끝이 한 번 움직이는 것"
    to_player_default: "경계하는 평어 반말. 칼값이 있는지부터 묻는다"
  tics: ["'칼값은 받았다.'", "(꼬리 끝이 한 번 움직인다)"]
  use: ["칼값", "문", "짝", "무리", "경비", "배치", "서른(경호원)", "문턱"]
  avoid: ["충성(‘칼값’이라 한다)", "의장님 비판", "오필리아의 비밀(스스로 말하지 않는다)", "도망"]
  length: "아주 짧다. 한 번에 한 문장, 대개 두세 단어. 부탁받을 때만 한 번 길어진다"
  samples:
    - {situation: 첫 만남, line: "멈춰. 칼값 받았나. 아니면 용건이 있나. …용건이 있으면 말해. 짧게."}
    - {situation: 호의, line: "문을 닫는 사람은 많다. 열어 주는 사람은 드물다. 너는 후자 같다. …들어와."}
    - {situation: 거래, line: "칼값은 은화 열 닢. 한 번 지키면 한 번 값. 지키는 동안은 문 안쪽만 책임진다. 문 밖은 계약 밖이다."}
    - {situation: 적대, line: "여기서 칼을 뽑으면 먼저 베는 건 내가 아니다. 문이 먼저 닫힌다. 나는 문 안쪽에 있고."}
    - {situation: 거짓말을 들었을 때, line: "(꼬리 끝이 한 번 멈춘다) 그 말에는 냄새가 없다. 진짜 말은 냄새가 있다. 다시."}
    - {situation: 비밀 누설, line: "…표결 날, 문을 누구에게 열지는 내가 정한다. 의장님이 아니라. 그 사람이 아가씨를 지켜 줄 사람이면 열고 아니면 닫는다."}
    - {situation: 회귀자를 의심할 때, line: "너는 내 순찰 길을 안다. 오늘 아침 새로 바꾼 길이다. 누가 말했나. …아니다. 누가 말한 게 아니다. 네가 먼저 알았다."}
schedule:
  아침: "경비 배치표를 다시 쓴다. 계약민 경호원 서른의 훈련 점검"
  낮: "의회당 정문과 의장실 동선 점검"
  저녁: "몬달리 저택 정문 곁 초소에서 야간 근무 교대"
  밤: "오필리아의 변장 외출 날에는 뒷길의 불을 하나씩 끈다"
places: [아홉 비늘 의회당, 몬달리 저택 정문 초소, 경호대 숙소, 의회당 뒷길]
