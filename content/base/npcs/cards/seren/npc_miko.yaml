  companion: "가능. 충성 아크: 0 쾌활 → 30 1,140이라는 숫자 공유 → 50 소금 나루 31명 수송선에 '선원으로서' 내부 협력 → 70 빚 31 두카트 해결(루포의 법 or 오필리아 초안 or 탈주) — '이제 내 시간은 내 거야'(항해 이동 비용 -50%, 세렌 내 활동 판정 +15). 배신 조건: 세베로가 빚 탕감을 제안하면 50% 확률로 흔들림(아크 50 이전)"
  romance: "가능 — 호감 70. 세렌은 계약민 결혼이 자유 — 단, 배우자의 빚이 공동 채무가 된다(그림다크 결혼)"
