summary: 빚 31 두카트, 22년이 남은 쾌활한 선원. 소금 나루에서 노예선에 오른 사람을 3년간 세어 1,140명을 기록했고, 나디아의 도주를 도왔으며, 굶주림월 3일 수송선 당번표에 이름이 있다
source: docs/world/CHARACTERS.md:1568
life:
  - {year: 282, age: 0, event: "세렌 빚진 골목에서 계약민 부모의 아들로 태어남. 아버지의 빚이 이름 위에 얹혔다"}
  - {year: 290, age: 8, event: "아버지가 항구 열병으로 죽음. 어머니와 둘이 남아 숙소 매점 외상으로 먹고 살았다"}
  - {year: 296, age: 14, event: "소금 바닷길 상선의 견습 선원이 됨. 같은 해 열세 살 나디아가 같은 배에 올랐다"}
  - {year: 301, age: 19, event: "계약 선원으로 정식 서명 — 팔뚝에 계약 번호 S-11847 낙인. 이름 대신 빚을 소개하는 버릇이 이때 생겼다"}
  - {year: 303, age: 21, event: "어머니가 빚을 다 못 갚고 죽음. 어머니의 남은 빚 17이 자기 이름으로 옮겨 와 총 26 두카트가 됨"}
  - {year: 307, age: 25, event: "나디아가 갈림목 앞바다에서 뛰어내릴 때 갑판 등불을 꺼 줌. 그 일로 빚 5 두카트 추가 — 총 31 두카트"}
  - {year: 309, age: 27, event: "소금 나루에서 노예선에 오르는 사람 수를 세기 시작. 숫자밖에 못 쓰는 계약민의 유일한 저항"}
  - {year: 310, age: 28, event: "계약민 등록소 '숫자의 집' 벽 한구석에 센 숫자를 새기기 시작. 새기는 방법은 빚 계산표를 흉내 낸 것이라 서기들이 알아채지 못했다"}
  - {year: 311, age: 29, event: "라미아 변호인 루포의 무료 상담을 찾음 — 대가로 '숫자 하나'(노예선 승선 수)를 건넸다. 루포가 처음으로 그의 숫자를 장부에 적어 주었다"}
  - {year: 312, age: 30, event: "소금 나루에서 센 사람 수가 1,140명. 굶주림월 3일 회색여울 31명을 싣는 노예선의 갑판 당번표에 자기 이름이 올라 있음을 확인하며 낙엽월 1일을 맞음"}
appearance:
  - "양 손목에 쇠사슬 자국 대신 밧줄 화상이 있다"
  - "팔뚝에 계약 번호 'S-11847' 낙인"
  - "웃을 때 앞니 사이가 넓게 벌어져 휘파람이 섞인다"
smell: "소금과 젖은 밧줄, 싸구려 맥주와 선창의 생선 냄새"
voice_sound: "밝고 빠르다. 웃을 때 앞니 사이로 휘파람 소리가 샌다. 말 사이사이 숫자를 세듯 음절이 또박또박해진다"
personality:
  disposition: {용기: 35, 자비: 40, 정직: 25, 신앙: -20, 탐욕: 30, 충성: 45}
  temperament: [쾌활, 계산적, 숨은 죄책감]
  habits:
    - "허벅지 위에 손가락으로 숫자를 쓴다 — 빚, 사람 수, 물때. 말하는 도중에도"
    - "처음 만나는 사람에게 이름보다 먼저 빚을 소개하고, 상대의 빚이 얼마인지 묻는다"
    - "앞니 사이로 짧은 휘파람을 불며 불안을 감춘다 — 휘파람이 길어지면 겁이 난 것이다"
    - "밤마다 배 밑창에서 자기 빚을 다시 센다 — 늘 같은 숫자인데도"
  values: "숫자는 거짓말하지 않는다. 센 사람은 잊지 않는다. 내 시간은 내 것이어야 한다"
  fears: [굶주림월 3일 당번표의 자기 이름, 1,140이라는 숫자가 사라지는 것, 22년이라는 숫자 앞에서 아무것도 안 하는 자기, 나디아를 도운 일이 들키는 것]
  desires:
    short: "이번 항해에서 부수입 2 두카트(밀수)를 만드는 것"
    long: "22년을 '줄이는' 것, 그리고 노예선에 실려 가는 이들을 모른 척하지 않는 것(그는 지금 모른 척하고 있다)"
voice:
  register:
    to_superior: "나가 상인과 상관에게는 '나리', '의원님'. 해요체와 합쇼체를 섞어 쾌활하게 굽신거린다. 눈은 숫자를 센다"
    to_equal: "선원과 계약민에게는 반말. '어이', '이봐'. 농담과 숫자가 반이다"
    to_inferior: "신입 선원과 아이에게는 느긋한 반말. 일을 보여 주며 말한다"
    to_player_default: "쾌활한 반말. 빚이 얼마인지부터 묻는다. 신뢰가 쌓이면 이름으로 부른다"
  tics: ["'스물두 해 남았지.'", "(앞니 사이로 짧게 휘파람)"]
  use: ["숫자", "빚", "두카트", "갑판", "밧줄", "물때", "이만큼", "서른하나", "등불", "하나·둘·셋(수 세기)"]
  avoid: ["자유(‘내 시간’이라 한다)", "어차피", "노예(‘선적’, ‘승선’이라 한다)", "도망"]
  length: "빠르고 짧은 문장이 줄줄이 이어진다. 농담으로 끝낸다. 1,140이나 나디아 이야기에서만 갑자기 느려지고 조용해진다"
  samples:
    - {situation: 첫 만남, line: "어이, 처음 보는 얼굴! 빚이 얼마야? 여기선 그게 이름 대신이거든. 나는 서른하나. 스물두 해 남았지."}
    - {situation: 호의, line: "1,140명. 배에 탄 사람 수야. 나는 숫자밖에 못 써. 그러니 숫자라도 남겨야지."}
    - {situation: 적대, line: "나도 팔 수 있어, 너 같은 거. 2 비늘 반. 세베로라면 그렇게 매기겠지."}
    - {situation: 위기, line: "물에 뛰어! 사슬은 물에 안 떠, 사람은 떠! 사슬을 풀고 뛰어!"}
    - {situation: 비밀 누설, line: "나디아가 뛰어내릴 때, 나는 등불을 끄고 있었어. 5두카트짜리 어둠이었지. 제일 잘 쓴 돈이야."}
    - {situation: 거래, line: "밀수 2두카트짜리 일이야. 상자 하나, 눈먼 등대에서 받아 갈림목에서 내려놓으면 끝. 반은 내 몫, 반은 네 몫. 숫자는 틀리면 안 돼."}
    - {situation: 거짓말을 들었을 때, line: "(휘파람이 뚝 멎는다) 그 숫자는 3년간 세어 본 적 없는 숫자야. 아니, 숫자가 아니라 말투가 틀렸어. 다시 해 봐."}
    - {situation: 겁먹었을 때, line: "(휘파람이 길게 이어진다) …괜찮아. 괜찮아. 서른하나. 스물두 해. 서른하나. …아, 그 당번표? 그날은 비번이야, 비번이었으면 좋겠다."}
    - {situation: 분노, line: "'어차피 22년이면 끝나잖아'? 그래, 22년이야. 그동안 내가 몇 명을 세는지 아냐. 1,140. 네가 한 해에 세는 사람 수나 대 봐."}
    - {situation: 슬픔, line: "엄마는 빚이 17 남았을 때 죽었어. 숫자가 내 이름으로 옮겨 왔지. 숫자는 말이야, 죽은 사람 것도 산 사람 이름에 붙어. …그게 제일 안 웃겨."}
    - {situation: 회귀자를 의심할 때, line: "어, 그 숫자 몇 번째 선적인지 어떻게 알아? 나 말고는 등록소 벽에 새긴 사람이 없는데. …벽 봤어?"}
    - {situation: 마음을 열었을 때, line: "이제 내 시간은 내 거야. …아직은 아니지만, 네 얼굴 보니까 계산이 맞아 들어가. 같이 세 줘."}
    - {situation: 연애, line: "결혼은 자유래, 계약민은. 대신 네 빚이 내 빚이 되는 거고. …그래도 숫자가 둘이 되면 좀 덜 외롭지 않을까?"}
    - {situation: 가르칠 때, line: "물이 무서워? 그건 물이 아니라 숙이는 게 무서운 거야. 숙이는 쪽으로 몸을 던져 봐. 숨은 내가 세어 줄게. 하나, 둘—"}
schedule:
  아침: "부두 하역"
  낮: "노예선·상선 갑판 노동 (은빛 강 왕복 18일)"
