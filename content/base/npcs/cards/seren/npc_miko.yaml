relations:
  - {to: npc_nadia, type: 옛 동료, like: 55, trust: 60, visibility: 비밀, memo: 도주를 도움, words: "같은 배에서 컸고, 뛰어내린 사람. 갚을 수 없는 5두카트의 어둠을 아직도 후회하지 않는다. 소식을 듣고 싶다. 묻지는 못한다"}
  - {to: npc_severo, type: 고용주, like: -50, trust: -30, visibility: 공개, memo: null, words: "이빨과 눈빛으로 사람 값을 부르는 가마 위의 상인. 그의 목소리가 들리면 숫자가 한 칸씩 밀린다"}
  - {to: npc_ophelia, type: 등록소의 나가, like: 10, trust: 20, visibility: 공개, memo: null, words: "턱을 보고 말하는 연분홍 아가씨. 처음으로 '이름이 있으면요'라고 물어 준 나가. 그 질문이 아직도 귓가에 있다"}
  - {to: npc_lupo, type: 빚 상담, like: 30, trust: 40, visibility: 비밀, memo: null, words: "숫자 하나를 받고 상담해 주는 라미아. 자기 숫자를 장부에 적어 준 첫 사람. 그 장부가 어디까지 갈지는 모른다"}
  - {to: npc_hagen, type: 밀수 접선, like: -10, trust: 10, visibility: 비밀, memo: null, words: "눈먼 등대 쪽 접선선에서 가끔 만나는 인간. 웃는 얼굴에 값이 붙어 있어서 마음이 안 놓인다"}
  - {to: npc_reni, type: 굽은 닻 단골 정보상, like: 20, trust: 10, visibility: 공개, memo: null, words: "소문을 숫자 대신 파는 여우 수인. 거짓말하지만 약속은 지킨다. 그게 이 항구에서 제일 믿을 만한 일이다"}
toward_player: "쾌활하지만 계산적. 빚과 숫자 이야기에 약하다. 처음에는 거리를 두고 값부터 잰다"
