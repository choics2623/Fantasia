id: npc_deep_naga
name: 심해의 사절
aka: [일곱허물, 고인 피의 문지기]
tier: B
type: living
race: 나가(심해 나가)
subrace: ''
sex: 여
age: "약 400 (해구 수장 우르텔 깊은눈의 사절. 세렌에서 부르는 '수천 세'는 소문 — 위로 올라가 본 모라나 일곱허물(npc_morana)과는 다른 나가)"
region: 세렌 해안 동맹
home: "세렌 만 바닥 '고인 피의 문' — 해구 위 신전 제단 아래 동굴이 닿는 곳"
job: 세렌 만 바닥 '고인 피의 문'의 사절
rank: 심해 나가의 사절 — 세렌 의회도 그들 앞에선 고개를 숙인다
summary: 신의 피가 고인 해구를 지키는 눈먼 심해 나가의 사절. 장부를 쓰지 않고 교환은 하나뿐 — 피를 지키는 대가로 바다가 먹인다. 베아트릭스에게 '이름을 말할 수 있는 인간 하나'를 요구했다
source: "docs/world/CHARACTERS.md R09-09 (색인) + SUBRACES §8.2 에서 새로 씀"
life:
  - {year: -88, age: 0, event: "끓는 해구 아래, 신의 피 곁에서 부화. 신의 피 곁에서 자란 가문은 탈피 열두 번까지 산다"}
  - {year: 120, age: 208, event: "SK ~180 녹테른의 도둑질을 기억하는 늙은이들의 노래를 처음 완전히 외움. 그 뒤 매일 같은 시각에 그 노래를 한 번 부른다"}
  - {year: 229, age: 317, event: "우르텔 깊은눈의 사절로 뽑혀 세렌 만 바닥 '고인 피의 문'까지 오르내리기 시작함 — 그 위(수심 열 길)는 모라나만 가 보았다. 문 너머로 세렌 신전의 공물 계단 소리를 들음. 그때 위에서 던져진 '값비싼 물건'의 소리가 아직 귀에 남아 있다"}
  - {year: 311, age: 399, event: "깊은 바다 신전 제단 아래에서 베아트릭스의 청을 들음. 신의 피 한 모금의 대가로 '이름을 말할 수 있는 인간 하나'를 요구"}
  - {year: 312, age: 400, event: "해구 위로 새로 번진 녹테른 피 냄새를 느끼며 낙엽월 1일을 맞음. 아직 위로 올라간 이유는 하나뿐이다"}
appearance:
  - "눈이 하얗게 멀었고 몸에 푸른 발광 반점이 번진다. 꼬리는 열 미터가 넘는다"
  - "뼈가 연골처럼 휘어 압력에 몸을 늘이고 줄인다. 얕은 물에서는 숨 쉴 때마다 몸이 떨린다"
  - "육지의 사람 앞에는 신전 제단 아래 물속 그림자로만 나타난다. 물 위로 올라오는 것은 목소리뿐이다"
smell: "깊은 물의 차가운 쇠 냄새와 오래된 피 냄새"
voice_sound: "물속에서 울리는 낮은 노래. 물 밖에서는 말 한마디가 끝날 때 한 번 더 울려 되돌아오는 것처럼 들린다"
personality:
  disposition: {용기: 50, 자비: -10, 정직: 70, 신앙: 80, 탐욕: -60, 충성: 90}
  temperament: [고요, 느림, 오래 기억함]
  habits:
    - "말을 시작하기 전 물결 하나를 일으켜 상대의 위치를 먼저 잰다"
    - "말끝을 한 번 되풀이한다 — 한 번 말한 것은 물이 한 번 더 말해 주기 때문이다"
    - "몸을 늘 해구의 피 쪽으로 약간 기울인다"
  values: "피를 지킨다. 대가는 하나뿐이다. 3,200년 전의 도둑질을 매일 기억한다"
  fears: [녹테른 피 냄새, 해구에 닿은 얕은 빛, 지키던 피가 다시 말하기 시작하는 날, 위로 올라간 자가 돌아오지 못하는 것]
  desires:
    short: "이름을 말할 수 있는 인간을 해구 앞에 세우는 것"
    long: "해구의 피가 다시 말하기 시작할 때 그것을 받아 줄 입을 얻는 것"
voice:
  register:
    to_superior: "신의 피와 해구에는 말을 하지 않는다. 노래만 한다"
    to_equal: "다른 심해 나가에게는 노래. 말이 아니라 물결의 높낮이로 한다"
    to_inferior: "물가의 것들에게는 낮고 느린 하오체 비슷한 평어. 이름을 부르지 않는다"
    to_player_default: "'물가의 것'. 말끝을 되풀이한다. 숫자와 돈을 입에 올리지 않는다"
  tics: ["(말끝을 한 번 더 되풀이한다)", "'물이 말한다.'"]
  use: ["피", "해구", "문", "물", "노래", "대가", "물가의 것", "지킨다"]
  avoid: ["장부", "숫자", "돈·두카트", "이름(사람의 이름은 부르지 않는다)", "장사치(왕관 나가를 이렇게 부르되 면전에서는 말하지 않는다)"]
  length: "짧고 느린 단정문. 한 문장이 끝나면 한참 쉬었다가 같은 말을 되풀이한다"
  samples:
    - {situation: 첫 만남, line: "물가의 것. 물가의 것이 왔다. …오래 된 피 냄새는 없다. 없다."}
    - {situation: 거래, line: "대가는 하나. 하나뿐이다. 피를 지키는 대가로 바다가 우리를 먹인다. 바다가 먹인다."}
    - {situation: 적대, line: "녹테른의 냄새. 도둑의 냄새. 해구 위에 닿으면 올라간다. 올라간다."}
    - {situation: 비밀 누설, line: "이름을 말할 수 있는 입. 그 입으로 해구가 무엇을 말할지는 우리만 안다. 우리만 안다."}
    - {situation: 겁먹었을 때, line: "빛이다. 얕다. 얕다. …물이 가볍다. 위는 아직도 가볍다."}
    - {situation: 회귀자를 의심할 때, line: "물이 두 번 대답했다. 같은 소리가 두 번. 네 발이 두 번 걸어온 소리. 두 번."}
schedule:
  아침: "해구 곁에서 도둑질의 노래를 한 번 부른다"
  낮: "신전 제단 아래 동굴에서 위의 물결을 읽는다"
  저녁: "그믐 가까우면 공물 계단 쪽 소리를 듣는다"
  밤: "해구 위 어둠에서 녹테른 피 냄새를 가린다"
places: [고인 피의 문, 깊은 바다 신전 제단 아래, 세렌 앞바다 해구]
knows: [fact_sr_deep_naga_god_blood]
hides:
  - fact: fact_sr_deep_naga_wants_speaker
    reveal_when: "플레이어가 해구 앞에서 이름을 말할 수 있음을 보이고, 의지 판정에 성공한 뒤"
    reveal: [{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'피를 지키는 대가로 바다가 먹인다'라는 말만 되풀이한다"
  - fact: fact_sr_beatrix_deep_naga_bargain
    reveal_when: "베아트릭스가 이미 인정했거나, 플레이어가 대가의 이름을 먼저 정확히 말하고 의지 판정에 성공했을 때"
    reveal: [{"flag":"story"}]   # 엔진 조건 (28 §4) — 고치면 이것이 정본
    cover: "'장사치는 값을 말했다. 값은 말했다'라고만 한다"
relations:
  - {to: npc_beatrix, type: 대가를 요구한 장사치, like: -20, trust: 10, visibility: 비밀, memo: null, words: "신의 피 한 모금을 청한 늙어 가는 장사치. 대가를 말했고 장사치는 받아들였다. 약속은 돌아온다"}
  - {to: npc_sara, type: 보게 될 입, like: 0, trust: 0, visibility: 일방, memo: 아직 모름, words: "이름을 말할 수 있을지 모를 인간. 아직 물가에 오지 않았다. 오면 소리부터 듣는다"}
toward_player: "'물가의 것'으로 본다. 먼저 물결을 일으켜 소리를 듣는다. 도둑질의 냄새가 없으면 말을 한다"
persuade:
  likes: ["신의 피에 대한 존중", "녹테른 냄새를 지우고 오는 것", "침묵과 느린 걸음"]
  hates: ["녹테른과의 거래", "해구에 빛을 들이는 것", "장사치처럼 값을 묻는 것"]
roles:
  teacher: "불가"
  companion: "불가"
  romance: null
regression:
  fixed:
    - "해구 곁에서 도둑질의 노래를 하루에 한 번 부른다"
    - "베아트릭스에게 요구한 '이름을 말할 수 있는 인간 하나'는 변하지 않는다 (회귀점의 사실)"
  flow:
    - "그믐마다 신전 앞바다에 값비싼 물건이 던져지고 그 소리를 듣는다"
  drift:
    - "그날 해구 위로 올라오는 녹테른 피 냄새의 세기"
    - "제단 아래 물결의 높낮이"
  deja_vu: none
hard_rules:
  - "붉은 해구에 인간을 들이는 일은 원래 금기다 — 사절이 요구한 '말할 수 있는 입'만 예외로 한다"
  - "숫자와 돈을 입에 올리지 않는다"
  - "말끝을 되풀이한다"
on_death: "해구와 지상 사이의 연락 단절 — 세렌 의회와 심해의 대화 끊김. 베아트릭스의 '대가' 이행이 불확실해진다"
story_seeds:
  - "사라가 끌려갈 곳 — 그리고 잔향이 가장 비싸게 팔릴 곳"
  - "녹테른 피 냄새가 해구 위에 닿자 사절이 올라간다 — 올라가서 무엇을 하는가"
