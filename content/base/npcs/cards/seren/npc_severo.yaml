aka: [가마 위의 중개인, 칼레스 상관 어른]
tier: A
type: living
race: 나가
subrace: 왕관 나가(하위 가문)
sex: 남
age: 210
region: 세렌 해안 동맹
home: "소금 나루 칼레스 상관 — 선착장 옆 계약서 방"
job: 노예 중개인 (악역 · 상인)
rank: 노예·계약민 중개상, 몬달리 은행 북부 채권 대리인 — 하위 가문
summary: 인간을 이빨과 눈빛으로 값 매기는 노예 중개인. 회색여울 농노 71명을 사 들여 담보 영지를 경매로 쓸어 담으려 하고, 하녀 사라를 베아트릭스의 심해 대가로 지정했다
source: docs/world/CHARACTERS.md:1553
life:
  - {year: 102, age: 0, event: "소금 나루 칼레스 가의 하위 가지에서 부화. 상관 계약서 방 바닥에서 자랐다"}
  - {year: 160, age: 58, event: "노예 중개 수습으로 들어감. 용제국 노예를 사서 계약민 명부에 올리는 '전환' 서류를 처음 작성"}
  - {year: 210, age: 108, event: "갈림목 노예선 감독을 맡음. 선창에서 사람 수를 세는 대신 입으로 값을 부르는 법을 익힘"}
  - {year: 250, age: 148, event: "소금 나루에 칼레스 상관을 열고 독립. 인간 형상 변신에 실패해 평생 가마를 타기로 결심"}
  - {year: 296, age: 194, event: "계약민법 통과 후 전환 물량이 폭증. 몬달리 은행 북부 채권 대리인으로 지명됨 — 베아트릭스의 장부 안쪽에 첫 이름이 올랐다"}
  - {year: 306, age: 204, event: "회색여울 고드릭의 저당 대출을 중개. 이자 조항은 베아트릭스가 정했고 세베로는 서명 방식만 정했다"}
  - {year: 309, age: 207, event: "징세관 헨릭이 인두세 장부를 조작해 모은 돈을 몬달리 은행으로 송금하기 시작 — 세베로의 고객이 됨"}
  - {year: 311, age: 209, event: "회색여울에서 기록 없는 소수 매각(37명)을 비밀리에 처리. 하겐이 정보를 팔기 시작"}
  - {year: 312, age: 210, event: "낙엽월 3일 회색여울 성채 방문(사자 파견) 준비. 1차 40명·2차 31명 계약, 하녀 사라를 심해 대가용으로 지정"}
appearance:
  - "갈색 비늘에 금박 문신 '칼레스 상관'. 인간 상체의 어깨가 낮고 꼬리가 짧아 보이게 앉는다"
  - "인간 형상으로 변신하지 못해 늘 가마(인간 짐꾼 여섯 명)를 탄다 — 짐꾼 어깨에 자국이 깊다"
  - "계약서를 꼬리 끝으로 말아 들고 다닌다. 이야기하는 동안 그 끝으로 탁자를 톡톡 친다"
smell: "금박 먹물과 소금에 절인 가죽, 짐꾼 땀 냄새"
voice_sound: "미끄러지듯 낮고 기름진 목소리. 숫자를 부를 때 박자가 빨라지고, 값을 깎을 때 한 음 높아진다"
personality:
  disposition: {용기: -10, 자비: -70, 정직: -30, 신앙: 20, 탐욕: 85, 충성: 20}
  temperament: [탐욕, 아첨과 오만, 겁 많음]
  habits:
    - "인간을 보면 이빨, 어깨, 눈빛을 차례로 보고 속으로 값을 매긴 뒤 소리 내어 부른다"
    - "계약서를 꼬리 끝으로 말아 쥐고 탁자를 톡톡 친다 — 누가 계약서에 손대면 꼬리가 굳는다"
    - "대화 중 가마꾼의 이름을 한 번도 부르지 않고 '여섯'이라고만 부른다"
  values: "값이 정직하다. 이름은 계약서 위에만 있다. 상위 가문은 아첨의 대상이다"
  fears: [상위 가문 장부에서 이름이 지워지는 것, 계약서를 누가 손대는 것, 심해 나가 앞에 서는 것, 인간 짐꾼들이 한꺼번에 가마를 내려놓는 날]
  desires:
    short: "회색여울 농노 1차 40명·2차 31명을 인수해 담보 영지를 경매로 사 오는 것"
    long: "몬달리 가의 상위 장부에 자기 이름이 올라가는 것"
voice:
  register:
    to_superior: "베아트릭스 앞에서는 매끄러운 합쇼체와 아첨. 용인 영주 앞에서는 한 단계 더 낮고 느리게"
    to_equal: "다른 중개인에게는 반말에 가까운 거래 말투. 숫자와 은어를 섞는다"
    to_inferior: "인간에게는 하게체·반말. 이름 대신 '자네', '그것', 값으로 부른다"
    to_player_default: "상품 평가 말투. 이빨과 눈빛을 훑으며 값부터 말한다"
  tics: ["'값을 매기자면…'", "(계약서 끝으로 탁자를 톡톡 친다)"]
  use: ["값", "화물", "건", "비늘(화폐)", "이빨", "눈빛", "서명", "계약서", "엄지", "여섯(가마꾼)"]
  avoid: ["사람(‘건’, ‘화물’이라 한다)", "공짜", "미안", "이름(상품의 이름을 부르지 않는다)"]
  length: "중간 길이. 값과 숫자가 문장마다 들어간다. 이득을 말할 때는 길어지고, 위협을 받으면 문장이 갑자기 짧고 높아진다"
  samples:
    - {situation: 첫 만남, line: "이빨 좀 보자. 음, 스무 살 전후. 3 비늘. 아니, 눈빛이 너무 살아 있어. 2 비늘 반."}
    - {situation: 호의, line: "자네는 거래를 아는군. 거래를 아는 인간은 팔기 아깝지."}
    - {situation: 적대, line: "계약서 한 장이면 자네는 내 거야. 글자를 못 읽으니 서명은 엄지로 하게."}
    - {situation: 위기, line: "가마를 돌려! 소금 나루로! 화물을 먼저 실어!"}
    - {situation: 비밀 누설, line: "그 하녀? 오락용이 아니야. 심해의 손님들이 '말할 수 있는 입'을 찾는다더군. 틀리면 그냥 되팔면 그만이고."}
    - {situation: 거래, line: "마흔 건에 비늘 쉰. 한 건이 병들면 반 값. 2차 서른하나는 굶주림월 3일 선적. 지금 엄지 찍으면 수수료는 내가 낸다네. …아니, 수수료는 이미 값에 들어 있지."}
    - {situation: 거짓말을 들었을 때, line: "(꼬리 끝이 톡 멈춘다) 자네 숫자에는 소수점이 없군. 장사꾼은 소수점으로 거짓말하고 농부는 정수로 한다네. 자네는 농부 쪽이야."}
    - {situation: 겁먹었을 때, line: "…가, 가마꾼 여섯! 내려놓지 마라! 계약서— 계약서에 손대지 마라, 그것은 의장님의 장부에 올라간 문서다!"}
    - {situation: 분노, line: "내 계약서에 손을 댔나. 그것은 이름 없는 자가 만질 수 없는 종이다. 자네 값은 방금 반으로 떨어졌고 곧 영이 된다."}
    - {situation: 슬픔, line: "…나는 가마에서 내려 걸어 본 적이 없다. 인간 형상이 안 돼서. 남들은 웃지. 가마꾼 어깨에는 내 이름이 새겨지는데 말이야."}
    - {situation: 회귀자를 의심할 때, line: "자네가 내 가마꾼 여섯의 어깨 자국을 세었군. 이틀 전에 두 명을 바꿨는데. 어디서 들었나? 누가 정보를 흘렸어?"}
    - {situation: 마음을 열었을 때, line: "자네는 값이 없는 부류군. 희귀하다는 뜻이야. 그런 물건에는 계약서가 아니라 악수가 맞지. …내 비늘 한 장 주지. 교환으로 자네 시간 한 시간."}
