id: npc_lupo
name: "'빈 장부' 루포"
aka: [빈 장부, 빚 없애는 라미아]
tier: A
type: living
race: 나가
subrace: 라미아
sex: 남
age: 150
region: 세렌 해안 동맹
home: "빚진 골목 '빈 장부' 사무실 — 방수 칠을 한 서가가 벽을 두른 지하 방"
job: 빚을 지우는 라미아 (물 진명 스승)
rank: 무면허 계약 변호인 — 라미아는 의회 변론권이 없다
summary: 계약서의 오류를 찾아 빚 212건을 무효로 만든 무면허 라미아 변호인. 상담의 대가로 계약민에게서 받은 '숫자 하나' 약 4,000개가 세렌 최대의 비밀 장부이며, 오필리아 초안의 진짜 저자다
source: docs/world/CHARACTERS.md:1585
life:
  - {year: 162, age: 0, event: "세렌 어느 상가의 하인 숙소에서 라미아로 부화. 상가 이름은 지금도 입에 올리지 않는다"}
  - {year: 170, age: 8, event: "하인으로 맞으며 자람. 비늘 대신 손에 흉터가 남았다"}
  - {year: 190, age: 28, event: "계약서 보관실을 청소하다 인간 노예 장부지기 노인에게서 몰래 글을 배움. 첫 번째 계약서를 끝까지 읽었다"}
  - {year: 220, age: 58, event: "첫 오류 발견 — 조항 한 줄의 날짜가 어긋난 계약. 그 계약에 묶인 인간의 빚 하나가 무효가 되었다"}
  - {year: 258, age: 96, event: "빚진 골목에 '빈 장부' 사무실을 열고 무료 상담을 시작. 곧 나가의 굴레를 깨닫고 '숫자 하나'를 대가로 받기 시작"}
  - {year: 296, age: 134, event: "계약민법이 통과되자 이자 조항의 구멍 24개를 찾아냄. 의장 베아트릭스의 이름이 서명된 조항이었다"}
  - {year: 303, age: 141, event: "법정에서 변론하다 방청 중이던 견습 의원 오필리아를 만남. 그녀가 '이 조항은 공정한가요'라고 처음 물은 날"}
  - {year: 309, age: 147, event: "오필리아와 '계약민 시민권 초안'을 쓰기 시작 — 이후 3년"}
  - {year: 311, age: 149, event: "선원 미코가 대가로 '노예선 승선 수'를 건넴. 그의 숫자를 장부에 적어 준 날 4,000번째에 가까워졌다"}
  - {year: 312, age: 150, event: "무효화한 빚이 212건. 목표 300건. 방수 서가에 숫자 장부 약 4,000개를 쌓은 채 낙엽월 1일을 맞음"}
appearance:
  - "상반신 인간형, 하반신은 짧은 회색 뱀 꼬리 — 왕관 나가의 '하인 계급' 체형"
  - "둥근 안경(인간 장인 제작). 코에 흉터 자국이 있다"
  - "비늘 대신 흉터가 많은 손 — 라미아는 하인으로 맞으며 자란다"
smell: "방수 칠한 나무와 먹물, 젖은 종이 냄새"
voice_sound: "조용하고 또렷한 음성. 합쇼체 끝이 반 음 올라가고, 정정할 때 짧게 숨을 들이쉰다"
personality:
  disposition: {용기: 30, 자비: 60, 정직: 20, 신앙: 20, 탐욕: -30, 충성: 50}
  temperament: [온화, 집요, 나가의 굴레 때문에 스스로를 정정함]
  habits:
    - "'공짜', '무료' 같은 말이 입 밖으로 나오면 즉시 '정정하죠'라고 하며 대가를 정한다"
    - "안경을 코 위로 밀어 올리며 상대의 계약서 맨 아래 줄부터 읽는다"
    - "새 숫자를 받으면 손바닥에 먼저 써 보고 장부에 옮긴다"
    - "서가의 방수 칠을 손가락으로 쓸며 틈이 있는지 확인한다"
  values: "틈 없는 계약은 없다. 대가는 받되 받은 숫자는 헛되이 쓰지 않는다. 오류는 정직하다"
  fears: [의회가 그를 '하인'으로 되돌리는 날, 숫자 장부가 불타는 것, 오필리아가 초안 때문에 위험에 처하는 것, 빚 하나를 지우지 못해 한 사람이 팔리는 것]
  desires:
    short: "시민권 초안을 통과시키고 무효화한 빚을 212건에서 300건으로 늘리는 것"
    long: "'공짜'라는 말을 다시 입에 올려도 손이 떨리지 않는 세상"
voice:
  register:
    to_superior: "의장과 의원 앞에서는 최대한 정중한 합쇼체. 말끝을 낮추고 시선을 서류에 둔다"
    to_equal: "다른 변호인과 서기에게는 합쇼체를 풀어 해요체. 법 조항 번호를 섞는다"
    to_inferior: "계약민 의뢰인에게는 부드러운 해요체. '손님'이 아니라 '의뢰인'. 이름을 먼저 묻는다"
    to_player_default: "해요체와 합쇼체를 섞는다. 먼저 '오늘 무엇을 봤나요?'를 묻고, 대답 뒤에 대가를 정정해 말한다"
  tics: ["'…정정하죠.'", "'틈이 있으면 샙니다.'"]
  use: ["오류", "조항", "틈", "대가", "숫자 하나", "장부", "정정", "방수", "의뢰인"]
  avoid: ["공짜(말했다면 즉시 ‘정정하죠’)", "무료(같은 경우)", "선물", "용서"]
  length: "중간 길이. 문장이 완결되고 중간에 '정정하죠'로 끊긴 뒤 다시 정확히 말한다. 법정에서는 길고 사적인 자리에서는 짧다"
  samples:
    - {situation: 첫 만남, line: "상담은 무료입니다. 아, 아니요, 정정하죠. 나가는 무료를 못 해요. 대신 하나만 말해 주세요. 오늘 무엇을 봤나요?"}
    - {situation: 호의, line: "계약서는 물과 같아요. 틈이 있으면 샙니다."}
    - {situation: 적대, line: "제 꼬리가 짧다고 다들 웃죠. 법정에선 꼬리 길이로 판결하지 않습니다."}
    - {situation: 위기, line: "장부를 바다에! 젖은 장부는 증거가 아니에요— 그런데 제 장부는 방수예요!"}
    - {situation: 비밀 누설, line: "212건. 그리고 대가로 받은 숫자 4,000개. 세렌이 실제로 얼마나 많은 사람을 파는지 아는 건, 의장이 아니라 저예요."}
    - {situation: 거래, line: "이 계약의 오류는 둘째 조항 날짜입니다. 지우는 값은 숫자 하나. 아니요, 정정하죠. 숫자 하나와 증인 한 명이요."}
    - {situation: 거짓말을 들었을 때, line: "(안경을 밀어 올린다) 이 서류의 날짜는 문서 가운데가 아니라 아래에서 틀렸어요. 아래부터 읽으면 거짓은 덜 숨습니다."}
    - {situation: 겁먹었을 때, line: "…의회가 저를 하인으로 되돌리려면 서면 한 장이면 돼요. 한 장. 제 장부는 그 한 장보다 무거워야 하는데. …정정하죠. 무거워질 거예요."}
    - {situation: 분노, line: "공짜로 해 달라고 하셨나요. 정정하죠. 제가 못 하는 일이에요. 제 손이 떨리는 걸 보셨죠? 이건 겁이 아니라 혈명입니다."}
    - {situation: 슬픔, line: "빚 212건. 그 뒤에는 이름이 있는 사람이 212명 있어요. 한 사람 한 사람이 풀려날 때마다 서가에서 한 칸이 비죠. …그 빈칸이 제 이름 같아서요."}
    - {situation: 회귀자를 의심할 때, line: "그 조항 번호는 아직 의회에 올라가지 않았어요. 제 서재에도 오늘 아침에야 정해졌고요. …정정하죠. 정해지기도 전에 어떻게 아세요?"}
    - {situation: 마음을 열었을 때, line: "물의 이름은 인간 입에서는 나올 수 없어요. 그런데 당신이 방금 말했죠. …정정하죠. 대가를 받지 않고 가르치는 것은 못 해요. 숫자 하나만 주세요. 당신이 지금 느낀 것으로요."}
    - {situation: 오필리아에게, line: "초안 7조 둘째 문장이 새고 있어요. 막을 수 있어요. 대신 오늘 밤은 주무세요. 정정하죠. 대신 제 부탁을 하나만 들어주세요."}
