summary: 연분홍 비늘의 의장 딸. 계약민 시민권 초안을 의회에 올리려 하지만 표는 7표뿐이고, 초안의 실무 작성자는 라미아 루포이며, 그녀는 빚진 골목의 목수 얀과 만난다
source: docs/world/CHARACTERS.md:1538
life:
  - {year: 216, age: 0, event: "몬달리 저택에서 부화. 어머니와 다른 연분홍 비늘의 알이었다"}
  - {year: 250, age: 34, event: "첫 탈피. 어머니가 해 주는 대로 계약서 읽는 법을 배움. 처음으로 어머니의 장부에서 숫자 하나가 틀렸다는 것을 알아챔"}
  - {year: 270, age: 54, event: "아홉 비늘 의회 견습 의원으로 이름을 올림. 의사록을 정리하며 계약민 상환 기록의 이상한 평탄함을 눈여겨봄"}
  - {year: 296, age: 80, event: "계약민법이 통과되는 날 방청석에 앉았다. 어머니가 낭독하는 6%라는 숫자가 이상하게 느리게 들렸다"}
  - {year: 301, age: 85, event: "계약민 등록소 '숫자의 집'을 처음 시찰. 선원 미코를 만나 자기가 모르던 숫자 하나(그의 빚 31)의 무게를 처음 들음"}
  - {year: 303, age: 87, event: "법정 방청에서 무면허 라미아 변호인 루포를 봄. 그가 계약서 오류로 빚 하나를 지우는 것을 보고 몇 날 밤을 잠 못 잤다"}
  - {year: 306, age: 90, event: "변장하고 빚진 골목에 나갔다가 계약민 목수 얀을 만남. 부서진 문턱을 고쳐 주던 사람이었다. 이후 저녁마다 나가기 시작함"}
  - {year: 309, age: 93, event: "루포와 '계약민 시민권 초안' 작업을 시작 — 상환자에게 세렌 시민권, 이자 상한 연 4%"}
  - {year: 312, age: 96, event: "초안 표결에 필요한 11표 중 7표를 확보한 채 낙엽월 1일을 맞음"}
appearance:
  - "연분홍 비늘 — 어머니와 다른 색, 아버지 쪽 혈통. 꼬리 길이는 5미터"
  - "인간 계약민 여인이 짜 준 투박한 털목도리를 비단옷 위에 두른다"
  - "매혹의 눈을 일부러 피한다 — 상대의 턱이나 입 쪽을 보고 말한다. '공정한 거래를 위해서'"
smell: "바다 소금과 양모, 서재의 먹물 냄새"
voice_sound: "맑고 약간 빠르다. 숨이 차오르면 문장이 숫자로 끊긴다. 웃음이 짧고 갑작스럽다"
personality:
  disposition: {용기: 30, 자비: 55, 정직: 60, 신앙: 0, 탐욕: 20, 충성: 30}
  temperament: [성실, 공정에 집착, 겁을 숨김]
  habits:
    - "상대의 눈 대신 턱 쪽을 보고 말한다 — 매혹의 눈이 새어 나가지 않도록"
    - "털목도리 끝을 손가락으로 감았다 풀었다 한다"
    - "처음 만난 사람에게 반드시 '이름이 있으면요'라고 묻고, 번호를 말하면 한 번 더 묻는다"
    - "밤마다 초안의 한 조항을 소리 내어 읽고 고친다"
  values: "공정. 받은 만큼의 대가. 이름은 번호보다 앞선다"
  fears: [어머니가 초안을 장부로 되돌려 버리는 것, 얀이 '구매'될 위험, 루포의 3년이 한 표 차로 무너지는 것, 자기가 어머니를 가장 닮은 방식으로 이기는 것]
  desires:
    short: "계약민 시민권 초안을 의회에 올려 11표를 얻는 것"
    long: "계약민이 빚이 아니라 이름으로 불리는 세렌"
voice:
  register:
    to_superior: "어머니와 의장에게는 정중한 합쇼체. 눈을 맞추지 않는다. 반박은 조항 번호로 한다"
    to_equal: "의원에게는 정확한 합쇼체. 숫자를 먼저 말한다"
    to_inferior: "계약민에게는 해요체. 이름을 먼저 묻고 빚은 나중에 묻는다. 번호를 말하면 한 박자 쉰다"
    to_player_default: "해요체. '등록 번호는요?'라고 반사적으로 묻고는 곧 '아니, 이름을 말해 줘요'라고 고친다"
    to_jan: "낮고 느리다. 해요체가 반말로 풀린다 — 얀 앞에서만"
  tics: ["'이름이 있으면요.'", "'그건 공정한가요?'"]
  use: ["공정", "초안", "조항", "표", "표결", "이름", "숫자", "증거", "턱(시선)"]
  avoid: ["어머니 몬달리(자기소개로 성을 먼저 말하지 않는다)", "공짜", "구매(얀에게 쓰지 않는다)", "불쌍하다"]
  length: "또박또박한 중간 길이. 조항과 숫자를 곁들인다. 얀과 어머니 이야기에서만 문장이 흩어진다"
  samples:
    - {situation: 첫 만남, line: "등록 번호는? 아니, 이름을 말해 줘요. 이름이 있으면."}
    - {situation: 호의, line: "1.8퍼센트. 어머니는 그 숫자를 자랑스러워해요. 저는 그 숫자 때문에 잠을 못 자요."}
    - {situation: 적대, line: "나도 나가예요. 대가 없이 주지 않아요. 단지 대가를 공정하게 받을 뿐."}
    - {situation: 위기, line: "초안을 태우지 마요! 루포가 3년을 썼어요!"}
    - {situation: 비밀 누설, line: "얀은 목수예요. 빚이 22두카트. 제가 대신 갚으면 그건 '구매'가 되죠. 그래서 못 갚아요."}
    - {situation: 거래, line: "증거를 가져오면 표 하나를 도울게요. 숫자로 된 증거여야 해요. 숫자는 합법이니까요. 서면으로 하고, 사본은 두 장."}
    - {situation: 거짓말을 들었을 때, line: "(턱 쪽을 보다가 눈을 한 번 올린다) 그 숫자는 제가 본 장부의 숫자와 달라요. 두 번째 줄을 다시 읽어 줄래요?"}
    - {situation: 겁먹었을 때, line: "…일곱 표. 열한 표가 필요한데. 어머니가 물결 계단에서 한 번만 고개를 저으면 그 일곱도 줄어요. 알아요. 계산은 제가 제일 잘해요."}
    - {situation: 분노, line: "어머니와 비교하지 마요. 한 번만 더요. 저는 어머니의 장부에 이름이 올라 있지 않아요. 올라가고 싶지도 않고요."}
    - {situation: 슬픔, line: "얀의 빚 22. 제 한 달 용돈이에요. 22를 내면 그 사람이 팔리는 거예요. …세상에서 가장 공정한 계산이 이렇게 불공정할 수가 있나요."}
    - {situation: 회귀자를 의심할 때, line: "그 조항은 초안에도 아직 없는 문장이에요. 루포와 저 둘만 아는. …어디서 들었어요? 제 서재에 들어온 적 있어요?"}
    - {situation: 마음을 열었을 때, line: "이름을 알려 줘서 고마워요. 아니, 고맙다는 말은 대가가 필요하죠. …제 이름을 알려 줄게요. 오필리아. 몬달리는 없이."}
    - {situation: 얀 앞에서, line: "…왔어. 문턱은 아직 삐걱거려? 아니, 고치지 마. 나는 그 소리가 좋아."}
