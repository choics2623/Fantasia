    cover: "'탈피는 때가 있어요. 늦는 게 아니라 아끼는 거죠'라고 하며 옷깃을 올린다"
  - fact: fact_sr_repay_rate_true
    reveal_when: "호감 40 이상이고 플레이어가 장부 증거나 정확한 계산을 내밀 때(정직은 계약에 대해서만)"
    cover: "'공식 6퍼센트예요. 그게 법이 말하는 숫자죠'라고 정확히 말한다"
  - fact: fact_sr_godric_debt_designed
    reveal_when: "신뢰 55 이상이고 거래(이득 보정)가 오간 뒤, 또는 푸른 장부관의 원본 계약서를 플레이어가 쥐고 있을 때"
    cover: "'1,840두카트는 정확히 계산된 숫자죠. 갚는 건 그분의 몫이에요'라고만 한다"
  - fact: fact_sr_beatrix_both_sides
    reveal_when: "신뢰 40 이상이거나, 플레이어가 채권 문서를 카스파르·아우락스 쪽에서 가져온 뒤"
    cover: "'은행은 누구에게나 빌려줘요. 그게 은행이에요'라고 한다"
  - fact: fact_sr_beatrix_regent_funds
    reveal_when: "신뢰 55 이상이고 카이도르 이야기가 플레이어 쪽에서 나왔을 때"
    cover: "'섭정이라는 말은 아직 계약서에 없어요'라고만 한다"
  - fact: fact_sr_severo_sara_deep_sea
    reveal_when: "신뢰 65 이상이고 사라의 이름을 플레이어가 먼저 꺼냈을 때"
    cover: "'세베로 칼레스의 일은 세베로의 장부예요. 저는 상위 가문일 뿐이에요'라고 선을 긋는다"
relations:
  - {to: npc_ophelia, type: 딸·후계자, like: 50, trust: 20, visibility: 공개, memo: null, words: "연분홍 비늘의 딸. 사랑하고, 계산이 가장 안 맞는 숫자다. 초안이 장부를 뒤집을 것이라는 것을 안다. 그래서 믿지 못한다"}
  - {to: npc_severo, type: 하위 가문 중개인, like: 0, trust: 40, visibility: 공개, memo: null, words: "필요한 손. 장부에 이름이 오르지 않을 일을 맡기는 자. 이름이 올라야 할 날이 오면 가장 먼저 지울 이름"}
  - {to: npc_aurax, type: 채무자, like: -10, trust: 30, visibility: 비밀, memo: null, words: "분노를 이자로 받는 붉은 턱. 갚기 전에 죽으면 곤란한 상대"}
  - {to: npc_melisande, type: 채무자, like: 10, trust: 40, visibility: 비밀, memo: null, words: "숫자를 아는 은비늘. 같은 쪽 계산을 하는 사람이라 편하다. 그래서 더 조심한다"}
  - {to: npc_kaidor, type: 섭정 자금 협상, like: 10, trust: 20, visibility: 비밀, memo: null, words: "와이번의 귀족. 계약서에 아직 적히지 않은 말을 먼저 꺼내는 이. 그 말이 적히는 날 값이 달라진다"}
  - {to: npc_lupo, type: 거슬리는 변호인, like: -20, trust: 10, visibility: 공개, memo: null, words: "꼬리 짧은 하인이 법정에서 수백 건의 빚을 지웠다. 그 숫자를 알고 있지만 지우지 않았다 — 지우면 이유를 설명할 일이 생긴다"}
  - {to: npc_sahar, type: 경호대장, like: 20, trust: 70, visibility: 공개, memo: null, words: "문을 지키는 줄무늬. 충성은 정확하나 눈이 딸에게 더 오래 머무는 것을 안다"}
