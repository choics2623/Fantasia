  - fact: fact_sr_beatrix_deep_naga_bargain
    reveal_when: "신뢰 60 이상이고 플레이어가 '이름을 말할 수 있음'을 보이거나 탈피 실패 장면에 함께 있을 때"
    cover: "'깊은 바다와는 매달 그믐에 대가를 던지는 사이일 뿐이에요'라고 하며 반지를 돌린다"
  - fact: fact_sr_beatrix_molting_decay
