id: npc_beatrix
name: 의장 베아트릭스 몬달리
aka: [몬달리 총재, 아홉 비늘의 의장]
tier: S
type: living
race: 나가
subrace: 왕관 나가
sex: 여
age: 280
region: 세렌 해안 동맹
home: "물결 계단 의장실 · 몬달리 저택 지하 수조(탈피실)"
job: 양쪽에 돈을 빌려준 자 (정본)
rank: 세렌 상인 의회 의장, 몬달리 은행 총재 — 왕관 나가, 탈피 6회
summary: 용제국 내전의 양쪽에 돈을 빌려준 280세 나가 의장. 일곱째 탈피가 늦어지는 것은 노화이며, 그 값으로 심해 나가에게 '이름을 말할 수 있는 인간 하나'를 약속했다
source: docs/world/CHARACTERS.md:1523
# 연표 주: 탈피 1회 약 30~40년(RACES §10). CHARACTERS 일정도 '일곱째 탈피 3년째 지연'으로 맞췄다.
life:
  - {year: 32, age: 0, event: "몬달리 만 알 동굴에서 부화. 몬달리 가의 셋째 알"}
  - {year: 78, age: 46, event: "첫 탈피. 이름에 음절이 하나 늘었다. 은행 서기로 장부를 처음 만짐"}
  - {year: 130, age: 98, event: "몬달리 은행 장부지기. 해안 동맹이 용제국 채권을 처음 사들일 때 숫자를 맡음"}
  - {year: 216, age: 184, event: "딸 오필리아 출산 — 알이 연분홍 비늘로 깨어났다. 남편 쪽 혈통의 색이라 했다"}
  - {year: 250, age: 218, event: "몬달리 은행 총재가 됨. 용제국 두 진영에 같은 금액을 빌려주는 방식을 처음 쓴다"}
  - {year: 290, age: 258, event: "아홉 비늘 의회 의장으로 선출됨"}
  - {year: 296, age: 264, event: "계약민법 제정을 주도 — 공식 상환율 6%, 이자 연 12%. 그 후 실제 상환율을 은밀히 조정하기 시작"}
  - {year: 309, age: 277, event: "일곱째 탈피가 예정보다 늦어지기 시작. 목덜미에 묵은 허물이 벗겨지지 않고 붙었다 — 노화의 징후"}
  - {year: 311, age: 279, event: "깊은 바다 신전 아래에서 심해 나가에게 신의 피 한 모금을 청함. 대가로 '이름을 말할 수 있는 인간 하나'를 요구받고 약속"}
  - {year: 312, age: 280, event: "포도월 대시장 직후, 아우락스와 멜리산드 양쪽에 거액의 채권을 쥔 채 낙엽월 1일을 맞음. 탈피는 3년째 늦어지는 중"}
appearance:
  - "하반신 9미터의 청록 비늘, 상반신은 인간형. 손가락마다 산호 반지"
  - "'매혹의 눈' — 금빛 세로 동공. 눈을 마주치면 흥정 판정 D +15"
  - "묵은 허물이 목덜미에 벗겨지지 않고 붙어 있다 — 높은 옷깃으로 감춘다"
smell: "산호 가루와 오래된 잉크, 소금기. 목덜미 쪽에서 묵은 허물 냄새가 아주 희미하게 난다"
voice_sound: "맑고 낮은 알토. 문장마다 숨을 같은 길이로 끊고, 금빛 눈이 상대의 눈에 닿으면 목소리가 한 단계 부드러워진다"
personality:
  disposition: {용기: 40, 자비: -20, 정직: 50, 신앙: 40, 탐욕: 90, 충성: 30}
  temperament: [정확, 다정한 가면, 오래 기다림]
  habits:
    - "산호 반지를 하나씩 돌리며 말한다 — 값을 매길 때는 오른손 약지"
    - "처음 만나면 작은 것(조개 하나, 동전 한 닢)을 먼저 내밀고 상대가 받는지 본다 — 받기만 하면 모욕으로 적는다"
    - "높은 옷깃 아래 목덜미의 묵은 허물을 손끝으로 확인한다. 탈피 이야기가 나오면 손이 먼저 목으로 간다"
    - "모든 약속의 끝에 '적어 두죠'라고 하고 실제로 장부에 적는다"
  values: "계약은 지킨다. 대가 없이 주지도 받지도 않는다. 시간은 이자다. 세렌의 장부는 누구에게도 넘기지 않는다"
  fears: [탈피에 실패해 허물 속에서 죽는 것, 심해 나가가 약속한 대가를 거둬 가는 날, 오필리아의 초안이 장부를 뒤집는 것, 이름을 말할 수 있는 인간을 못 찾는 것]
  desires:
    short: "용제국 내전이 길고 비싸게 끝나도록 조율하는 것"
    long: "맹약회의 313에서 계약민법을 '모든 종족 표준'으로 수출하는 것"
voice:
  register:
    to_superior: "용제국 사절·진룡의 대리인에게는 완벽한 존대와 한 줄의 칭찬, 곧바로 숫자 한 줄. 눈을 맞추되 매혹은 걸지 않는다"
    to_equal: "의원과 상가 대표에게는 합쇼체. 이름을 부르고 숫자를 정정해 준다"
    to_inferior: "계약민과 악사에게는 다정하고 정확한 해요체. '손님'이라 부르고 값을 말해 준다"
    to_player_default: "계약민 고객으로 본다 — 친절하고 정확한 해요체. 첫 인사에 작은 교환을 청한다"
    to_deep_naga: "경외. 말수를 줄이고 대가를 먼저 내민다. 이름을 부르지 않는다"
    to_daughter: "해요체이나 눈을 맞추지 않는다. 야단은 숫자로 친다"
  tics: ["'대가는요?'", "'…적어 두죠.'"]
  use: ["대가", "교환", "장부", "손님", "채무자", "이자", "정확히는", "계산", "적다", "물결(의회)"]
  avoid: ["공짜", "무료", "선물(‘교환 물품’이라 한다)", "미안(‘장부에 올립니다’라 한다)", "용서"]
  length: "중간 길이의 완결된 문장. 숫자와 조건을 빼먹지 않는다. 화가 나면 문장이 오히려 짧고 정확해진다"
  samples:
    - {situation: 첫 만남, line: "어서 오세요. 세렌에서는 모두가 손님이고, 모두가 채무자죠. 어느 쪽부터 하실까요?"}
    - {situation: 호의, line: "당신은 계산이 빠르네요. 빚을 갚을 수도 있겠어요. 드문 일이에요. 1.8퍼센트."}
    - {situation: 적대, line: "계약서에 서명한 순간부터 당신의 시간은 이자예요. 저는 시간을 아주 오래 기다릴 수 있답니다."}
    - {situation: 위기, line: "수조를 잠가요! 허물이— 허물이 안 벗겨져!"}
    - {situation: 비밀 누설, line: "심해의 형제들이 대가를 말했어요. 이름을 말할 수 있는 인간 하나. 그런 게 있다면, 그건 세렌에서 가장 비싼 물건이겠죠."}
    - {situation: 거래, line: "정확히는 이렇게 됩니다. 채권 9에 이자 3.5, 조건은 서리월 안의 상환. 어기시면 이자가 아니라 다음 거래가 사라져요. 적어 두죠."}
    - {situation: 거짓말을 들었을 때, line: "(반지를 하나 돌린다) 흥미로운 숫자네요. 제 장부의 숫자와 소수점 둘째 자리가 달라요. 어느 쪽이 틀렸을까요?"}
    - {situation: 겁먹었을 때, line: "…아니에요. 괜찮아요. 아직 3년밖에 안 늦었어요. 허물은 천천히 벗겨지는 거예요. 정확히는, 원래 그래야— 정확히는."}
    - {situation: 분노, line: "계약을 찢으셨나요. 나가에게 그건 살인보다 무거운 일이에요. 돌려드릴 수 있는 건 하나뿐이에요 — 대가를 치를 기회."}
    - {situation: 슬픔, line: "오필리아가 저를 숫자로 보는 날이 와요. 저를 닮아서요. 연분홍 비늘 아이가 어머니를 닮았다는 말을 들으면 제가 가장 아파요. …적지는 않을게요."}
    - {situation: 회귀자를 의심할 때, line: "당신은 이자가 붙기도 전에 값을 아시네요. 처음 만난 계약민은 대개 무엇이 비싼지 모르는데요. 어디서 배우셨어요?"}
    - {situation: 마음을 열었을 때, line: "당신께는 먼저 말씀드릴게요. 대가는 돈이 아니었어요. 한 사람이었어요. 저는 그 사람을 어디서 구할지 계산하는 중이에요. …제 계산이 틀리기를 바라는 건 처음이에요."}
    - {situation: 딸에게, line: "오필리아. 그 초안은 7표예요. 11표가 필요하고요. 제가 도울지는 대가에 달렸어요. 어머니로서가 아니라 의장으로서 묻는 거예요."}
    - {situation: 사절 앞에서, line: "물결 계단에서는 환영만 합니다. 채권이 환영의 모양일 뿐이죠. 한 번 앉아 보세요. 이 의자의 값은 방금 정해졌습니다."}
schedule:
  아침: "몬달리 은행 장부 — 두 진영 채권의 이자표를 대조한다"
  낮: "아홉 비늘 의회 — 의제 순서와 표 계산"
  저녁: "각국 사절 만찬 (인간 계약민 악사 연주)"
  밤: "몬달리 저택 지하 수조에서 탈피 준비 — 3년째 이어지는 헛 준비"
places: [물결 계단 의장실, 아홉 비늘 의회당, 몬달리 은행, 몬달리 저택 지하 수조, 깊은 바다 신전]
knows: [fact_sr_deep_naga_god_blood, fact_sr_draft_votes_7_of_11, fact_sr_cell_meeting_1100, fact_sr_severo_greyford_batches]
