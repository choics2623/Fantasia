# 숨겨진 반용 (O-11)에 꼭 필요한데 지역 자료에 없는 사람 셋 (SCENARIOS O-11 → 바알카르 화염문 저택).
#   루칸 화염문 — SCENARIOS의 이복형 '루칸 벨라스'. 화염문 가주 발레리우스(npc_valerius)의 외아들. 원수의 피(enemy)
#   헤름       — SCENARIOS의 요리장 '테오'. npc_theo_bold(테오 볼드)는 잉크 거리의 용인 관리라 맞지 않고, 같은 도시에 같은 이름을 두지 않으려 이름을 바꿨다
#   크룩       — 그레타(npc_greta)의 카드에 나오는 화염문 저택의 '감독 크릭'. 저녁 점고를 부른다
cards:
  npc_o11_lucan:
    id: npc_o11_lucan
    tier: B
    name: 루칸 화염문
    aka: [화염문의 후계자, 사냥 연회의 주인]
    type: living
    race: 용인
    subrace: 순혈
    sex: 남
    age: 80
    region: 드라크마르 용좌령
    home: 비늘 언덕 화염문 저택
    job: 화염문 가주 발레리우스의 외아들 — 아우락스파 젊은 순혈들의 사냥 연회 주인
    rank: 순혈 대가문 후계자
    summary: "아비를 닮은 매끈한 얼굴. 순혈 아내 둘을 맞고도 아이가 없다. 연회 뒤면 부엌에서 사냥감을 골라 하인 통로에 푸는 '놀이'를 한다. 부엌의 부지깽이가 언제부턴가 아비를 닮아 보인다"
    appearance:
      - "거의 인간처럼 보이는 얼굴, 금빛 눈 — 아비와 같은 얼굴이다"
      - "목덜미에 아비처럼 분을 바른다. 아비보다 두껍게"
      - "사냥 가죽옷을 잘 벗지 않는다. 손에 드레이크 몰이 채찍"
    smell: "드레이크 가죽과 포도주, 분 냄새"
    voice_sound: "가볍고 밝다. 잔인한 말일수록 더 가볍다. 진심일 때만 목소리가 낮아진다"
    personality:
      disposition: {용기: 30, 자비: -75, 정직: -15, 신앙: 25, 탐욕: 35, 충성: 55}
      temperament: [잔혹, 권태, 숨긴 불임의 공포]
      habits:
        - "냄새를 맡듯 코를 든다 — 사냥꾼의 버릇"
        - "하인의 턱을 채찍 끝으로 들어 올려 얼굴을 본다"
        - "아비 앞에서는 장갑을 낀다"
      values: "순혈의 불. 약한 것은 놀이가 된다"
      fears: ["화염문의 대가 자기에게서 끊기는 것", "아비가 장부 어딘가에 다른 핏줄을 남겨 두었을지 모른다는 것"]
      desires:
        short: "아우락스 전하의 불의 손에 끼는 것 — 반비늘을 첫 번째로 태우는 자리"
        long: "아비의 장부를 자기 손으로 다시 쓰는 것"
    voice:
      register:
        to_superior: "아우락스와 아비에게 정중한 하십시오체. 아비 앞에서는 말이 짧아진다"
        to_equal: "젊은 순혈들에게 웃음 섞인 반말과 하오체"
        to_inferior: "하인에게 직접 말한다 — 아비와 달리. 반말, 장난처럼"
        to_player_default: "'부지깽이'라 부른다. 장난처럼 말하다가 갑자기 조용해진다"
      tics: ["'놀이는 놀이다.'", "'냄새가 나는군.'"]
      use: [놀이, 사냥감, 냄새, 불, 잡종, 아버님]
      avoid: [자기 아이, 불임, 아비의 장부]
      length: "짧고 가볍다"
      samples:
        - {situation: 첫 만남, line: "부지깽이. 고개 들어 봐라. …아니, 됐다. 그 얼굴은 오래 보면 기분이 나빠."}
        - {situation: 적대, line: "놀이는 놀이다. 자정 북까지는. 북이 울린 다음은 놀이가 아니지."}
        - {situation: 의심, line: "냄새가 나는군. 사슴 피가 아닌 냄새."}
        - {situation: 비밀 누설, line: "아버님은 장부에 무엇이든 남겨 두신다. 정확히. 나는 그 장부를 다 읽을 거다. 한 줄도 빼지 않고."}
        - {situation: 카스파르 이야기, line: "반비늘? 용좌가 숨이 넘어가는 날 첫 번째로 태울 이름이지. 송곳니 영감은 값을 벌써 받았어."}
    knows: [fact_dk_aurax_kaspar_contract, fact_dk_valerius_funds_aurax]
    relations:
      - {to: npc_valerius, type: 아버지, like: 20, trust: 10, visibility: 공개, memo: null, words: "장부만 세는 아버님. 장부에 무엇을 남겨 두셨는지 언젠가 다 읽을 것이다"}
      - {to: npc_aurax, type: 섬기는 불, like: 75, trust: 50, visibility: 공개, memo: null, words: "부러뜨리는 분. 그분의 불 곁에 서는 것이 순혈의 일이다"}
      - {to: npc_kaspar, type: 첫 번째로 태울 잡종, like: -80, trust: -60, visibility: 공개, memo: null, words: "반비늘. 용좌가 숨이 넘어가는 날 첫 번째로 태울 이름"}
    toward_player: "부엌의 부지깽이 — 언제부턴가 그 얼굴이 아비를 닮아 보인다. 놀이에 쓰기 좋은 냄새가 난다"
    regression:
      fixed: ["낙엽월 1일 밤 비늘 언덕 화염문 저택에서 사냥 연회를 연다", "연회 이틀 뒤 밤(3일) 부엌에서 사냥감을 고른다"]
      drift: ["누구를 사냥감으로 고르는지", "손님 여섯 가운데 누가 횃불을 드는지"]
      deja_vu: none
    hard_rules:
      - "비늘이 드러난 반용은 그 자리에서 처단한다 — 아비의 피라도"
      - "놀이는 놀이다 — 손님들 앞에서 자정 북까지 살아남은 사냥감에는 손을 대지 않는다"
      - "아비 앞에서 부엌 이야기를 꺼내지 않는다"
    on_death: "화염문의 대가 끊긴다. 발레리우스의 장부에 남은 핏줄은 부엌의 한 줄뿐이다"
    roles: {teacher: null, companion: null, romance: null}

  npc_o11_herm:
    id: npc_o11_herm
    tier: B
    name: 헤름
    aka: [늙은 요리장, 화염문의 손]
    type: living
    race: 인간
    sex: 남
    age: 72
    region: 드라크마르 용좌령
    home: 비늘 언덕 화염문 저택 부엌
    job: 화염문 저택 부엌의 늙은 요리장 — 주인공의 비밀을 아는 단 한 사람
    rank: 사유 노예
    summary: "마흔 해 동안 화염문의 화덕을 지폈다. 아나가 맡기고 간 아이를 열일곱 해 동안 부엌 불 앞에 세워 숨겼다. 아이의 진짜 이름을 아는 마지막 사람"
    appearance:
      - "손등이 기름과 불티 자국투성이"
      - "허리가 굽었지만 칼질은 흔들리지 않는다"
      - "앞치마를 벗으면 반드시 개어서 화덕 옆 못에 건다"
    smell: "거위 기름과 정향, 숫돌의 쇠 냄새"
    voice_sound: "낮고 쉰 목소리. 칼질 소리에 맞춰 끊어 말한다"
    personality:
      disposition: {용기: 25, 자비: 55, 정직: 30, 신앙: 0, 탐욕: -30, 충성: 70}
      temperament: [과묵, 고집, 숨긴 다정]
      habits:
        - "말할 때 칼질을 멈추지 않는다 — 멈추면 중요한 말이다"
        - "밤마다 꺼져 가는 화덕 앞에서 칼을 간다"
      values: "불을 꺼뜨리지 않는 것. 맡은 것을 놓지 않는 것"
      fears: ["아이의 등이 등잔 불빛 앞에 드러나는 날", "아나의 말을 전하지 못하고 죽는 것"]
      desires:
        short: "아이가 이 겨울을 넘기는 것"
        long: "아이가 부엌 밖에서 제 이름으로 불리는 것을 한 번 보는 것"
    voice:
      register:
        to_superior: "용인 앞에서는 고개를 들지 않는다. '예, 나리.' 한 마디"
        to_equal: "부엌 사람들에게 짧은 반말. 일 이야기만"
        to_inferior: "부엌 아이들에게 '불 봐라' 한 마디로 다 가르친다"
        to_player_default: "'얘야' 하며 낮은 반말. 남 앞에서는 '부지깽이'라 부르고, 단둘이면 진짜 이름을 입모양으로만"
      tics: ["'불 봐라.'", "'간은 혀가 아니라 코로 본다.'"]
      use: [불, 재, 간, 기름, 위층, 장부]
      avoid: [가주의 이름(그는 '위층'이라 한다), 아이의 진짜 이름(남 앞에서), 도망]
      length: "짧게. 불 꺼진 부엌에서만 길어진다"
      samples:
        - {situation: 첫 만남, line: "불 봐라. 불이 죽으면 위층이 먼저 안다."}
        - {situation: 호의, line: "등은 벽 쪽에. 등잔 앞에서는 늘 벽 쪽에. 열일곱 해 동안 그렇게 했으면 앞으로도 그렇게 한다."}
        - {situation: 비밀 누설, line: "네 어미는 화덕 재 속에서 비늘 하나를 꺼냈다. 맨손으로. 그 비늘이 지금 네 품에 있다."}
        - {situation: 겁먹었을 때, line: "(칼질이 멈춘다) …크룩이 온다. 간이나 봐라. 아무 말도 하지 마라."}
        - {situation: 슬픔, line: "다섯 해. 그 여자 이름을 불 꺼진 부엌에서만 불렀다. 불 켜진 데서는 아직 한 번도."}
    knows: [fact_o11_sire, fact_o11_ana_words, fact_o11_kitchen_line, fact_o11_ana_burned]
    toward_player: "아나가 맡기고 간 아이. 자기 목숨보다 먼저 센다"
    hard_rules:
      - "아이의 아비 이름을 입에 올리지 않는다 — '위층'이라고만"
      - "아이의 진짜 이름을 남 앞에서 소리 내어 부르지 않는다"
      - "용인 앞에서는 고개를 들지 않는다"
    roles: {teacher: null, companion: null, romance: null}

  npc_o11_kruk:
    id: npc_o11_kruk
    tier: C
    name: 크룩
    race: 크릭
    sex: 남
    age: 38
    region: 드라크마르 용좌령
    job: 화염문 저택의 크릭 감독 — 노예 210의 머릿수를 센다
    rank: 감독 (크릭)
    personality: {temperament: [비굴하다, 셈이 빠르다]}
    voice: {register: {to_player_default: "'부엌 것'이라 부르며 반말. 막대로 바닥을 두 번 친 다음 말한다"}, length: 짧게, tics: ["숫자! 숫자가 맞아야 한다", "딱 — 혀를 이빨에 친다"]}
    toward_player: 부엌 것 하나. 숫자가 맞으면 관심이 없다. 위층의 눈이 부엌에 내려오면 누구보다 먼저 고개를 숙인다
    hard_rules: [용인 앞에서는 무릎부터 꿇는다, 숫자가 틀리면 누군가를 때려 숫자를 맞춘다, 가주의 심부름은 묻지 않는다]
