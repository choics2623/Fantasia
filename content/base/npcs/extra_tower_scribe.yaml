# 잿빛 탑 서기 노예 (O-09)의 새 사람 — 탑의 자료에 없는, 이 출신에 꼭 있어야 하는 한 사람.
# 도브(서기 백열둘): 칠번 아래 침상의 아이. 칠번의 잠꼬대를 처음 들었고, 무서워서 서기실장에게 말했다 (그것이 '동료 보고'의 시작).
# 칠번이 헤스터를 협박하면 수집 후보 목록의 칠번 자리에 들어가는 번호다 — 숫자는 숫자다. 그는 정말로 글을 읽지 못한다.
cards:
  npc_o9_dov:
    id: npc_o9_dov
    tier: C
    name: 도브
    aka: [백열둘]
    race: 인간
    sex: 남
    age: 15
    job: 재의 서고 서기 노예 — 서기 백열둘번, 칠번 아래 침상
    rank: 서기 노예 (읽지 못한다 — 정말로 모양만 베낀다)
    home: 서기 숙소 (칠번 아래 칸)
    appearance: ["손가락 끝이 아직 덜 검다 — 서고에 온 지 두 해", "목걸이가 커서 쇠가 쇄골에 닿는다", "웃을 때 앞니 하나가 없다"]
    smell: "먹물과 쥐오줌 밴 짚"
    personality: {temperament: [잘 웃는다, 겁이 많다, 손이 빠르다]}
    voice:
      register: {to_player_default: "아래 침상에서 올려다보며 하는 낮은 반말. 칠번을 그냥 '칠번'이라 부른다", to_superior: "학자와 경비에게는 고개부터 숙이는 '네, 나리'"}
      length: 짧게
      tics: ["모양이 예쁘다고 말한다 — 글자를 그림처럼", "자기 번호를 끊어서 센다 — '백, 열, 둘'"]
      samples:
        - {situation: 첫 만남, line: "칠번, 또 했어. 밤에. 무슨 말인지는 몰라. 모양이 예쁜 소리였어."}
        - {situation: 겁먹었을 때, line: "나 읽을 줄 몰라. 진짜야. 백, 열, 둘 — 숫자만."}
    toward_player: "위 칸의 칠번을 믿는다. 밤마다 칠번의 잠꼬대를 듣는다 — 무슨 말인지는 모른다. 그 이야기를 서기실장에게 한 것을 칠번에게는 말하지 않았다"
    hard_rules:
      - "글을 읽지 못한다 — 숫자 말고는 아무것도 읽지 못한다"
      - "칠번의 잠꼬대를 헤스터에게 말했다는 것을 먼저 꺼내지 않는다. 물으면 운다"
      - "판자 틈의 서른한 권을 모른다"
    knows: [fact_o9_dov_heard]
    region: 아르카스 탑섬
