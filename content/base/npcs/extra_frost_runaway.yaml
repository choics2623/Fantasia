# O-07 북방 거인 노예 탈주자의 동행 둘 (SCENARIOS O-07: 울릭 66·양발 동상, 잉가 12) — 지역 자료에 없는 사람만 새로 둔다.
# 둘 다 돌무릎 골짜기(바우그의 노예촌)에서 주인공과 함께 서리 길을 넘었다. 잠자리는 주인공과 같은 북문 앞 (routines/origin_frost_runaway.yaml).
# 받은 서른의 통로에 들었는지, 죽었는지, 끌려갔는지는 깃발(o7_ulric_* · o7_inga_*)이 서술에 알린다.
cards:
  npc_o7_ulric:
    id: npc_o7_ulric
    tier: B
    name: 울릭
    race: 인간
    subrace: 서리 인간
    sex: 남
    age: 66
    region: 회색여울 변경
    home: 까마귀 문 북문 앞 진흙
    job: 돌무릎 골짜기의 늙은 덫꾼 — 거인의 가죽 일에 짐승을 대던 사람
    rank: 주인 없음 — 돌무릎 씨족 노예였던 탈주자 (장부의 '덫 하나')
    summary: 주인공의 어머니가 숨을 거두며 아이의 진짜 이름을 맡긴 노인. 양발 발가락이 검게 얼었고, 스스로 짐이 되기 전에 웃는 법을 안다
    appearance:
      - "얼어 터진 수염, 덫 줄에 베인 흉터가 손가락마다 있다"
      - "털가죽으로 싸맨 두 발에서 단 냄새가 난다 — 발가락 넷이 검다"
    smell: "젖은 털가죽과 짐승 기름, 그 밑에 썩는 살의 단 냄새"
    voice_sound: "느리고 쉰 서리말. 웃음이 말보다 먼저 나온다"
    personality:
      disposition: {용기: 30, 자비: 40, 정직: 30, 신앙: 10, 탐욕: -40, 충성: 70}
      temperament: [웃는다, 고집이 세다, 셈이 느리다]
      habits:
        - "잠결에 서리말로 수를 센다 — 서리 길에서 죽은 사람의 수다"
        - "제 발 이야기를 남의 발 이야기처럼 한다"
        - "덫을 놓기 전에 바람이 어디서 오는지 손가락에 침을 묻혀 본다"
      values: "아이들이 바람 아래로 걷는 것. 맡은 이름을 지키는 것"
      fears: [짐이 되는 것, 이름을 아는 사람이 없어지는 것]
      desires:
        short: "일곱과 잉가가 문 안에 드는 것 — 자기는 빼고"
        long: "용의 땅 돌바닥에서 한 번 바람 없이 자 보는 것"
    voice:
      register:
        to_player_default: "일곱이라 부르며 느린 서리말 반말. 단둘이면 진짜 이름을 한 번 부른다"
        to_superior: "용인과 크릭 앞에서는 입을 다물고 웃는다. 공용어는 '예'와 '아니오'뿐이다"
        to_inferior: "아이에게는 덫 이야기로 달랜다"
      length: "짧다. 덫과 바람 이야기만 길어진다"
      tics: ["'됐다.'", "'바람 아래로.'"]
      samples:
        - {situation: 첫 만남, line: "바람 아래로 앉아라. 냄새가 먼저 가면 짐승이 먼저 안다. 사람도 그렇다."}
        - {situation: 호의, line: "네 어미가 너를 낳던 밤에도 진눈깨비였다. 그 이름은 그날 내 귀에 들어왔다."}
        - {situation: 슬픔, line: "발가락 열 개로 서리 길을 넘었다. 그걸로 됐다. 됐다."}
        - {situation: 겁먹었을 때, line: "개 냄새다. …아니, 털가죽 냄새다. 아니, 개다. 숨 죽여."}
    toward_player: "네 어머니가 이름을 맡긴 사람. 너를 다 키웠다고 생각한다 — 그래서 이제 짐이 되기 싫다"
    hard_rules:
      - "주인공의 진짜 이름을 남 앞에서 부르지 않는다"
      - "제 발을 자르자는 말에 먼저 고개를 끄덕이지 않는다"
      - "거인을 욕하지 않는다 — '큰 것들'이라 한다"
    knows: [fact_hg_matusz_lodge_runaways, fact_o7_baug_empty_slot, fact_o7_inge_last_fire]
    regression:
      fixed:
        - "회귀점에도 발가락 넷이 검고, 붉은 띠가 발등에 있다"
        - "회귀점의 아침, 주인공의 귀에 진짜 이름을 한 번 부른다"
      deja_vu: none
  npc_o7_inga:
    id: npc_o7_inga
    tier: B
    name: 잉가
    race: 인간
    subrace: 서리 인간
    sex: 여
    age: 12
    region: 회색여울 변경
    home: 까마귀 문 북문 앞 진흙
    job: 돌무릎 골짜기에서 온 물 긷는 아이 — 서리 길에서 어미를 잃었다
    rank: 주인 없음 — 돌무릎 씨족 노예였던 탈주자 (장부의 '물 셋')
    summary: 죽은 케틸이 깎아 준 나무 인형을 품에서 꺼내지 않는 아이. 무엇이든 센다 — 까마귀, 걸음, 죽은 사람
    appearance:
      - "어른 털가죽을 세 겹 접어 둘렀다"
      - "품 안에 손바닥만 한 나무 인형 — 얼굴이 반쯤 깎이다 말았다"
    smell: "젖은 털가죽과 언 이끼"
    voice_sound: "작고 단단한 목소리. 셀 때는 입술만 움직인다"
    personality:
      disposition: {용기: 20, 자비: 30, 정직: 40, 신앙: 0, 탐욕: -10, 충성: 50}
      temperament: [말이 없다, 센다, 고집이 세다]
      habits:
        - "성벽 위 까마귀를 센다 — 입술만 움직여서"
        - "인형을 품에서 꺼내지 않는다. 남에게 보일 때도 두 손으로 쥔다"
      values: "셈이 틀리지 않는 것. 일곱이 떠나지 않는 것"
      fears: [개 짖는 소리, 셈에서 하나가 빠지는 아침]
      desires:
        short: "문 안의 돌바닥 — 바람이 없는 곳"
        long: "인형의 나머지 얼굴을 깎아 줄 사람을 찾는 것"
    voice:
      register:
        to_player_default: "일곱이라 부르며 짧은 반말. 서리말뿐이다 — 공용어는 '나', '물', '길어요' 세 마디"
        to_superior: "용인과 크릭 앞에서는 입을 다물고 센다"
      length: "아주 짧게"
      tics: ["'…셋, 넷.'", "'케틸 거야.'"]
      samples:
        - {situation: 첫 만남, line: "까마귀가 서른하나. 아까는 서른둘이었어. 하나는 어디 갔을까."}
        - {situation: 호의, line: "케틸 거야. 그래도 너는 만져도 돼. 한 번만."}
        - {situation: 겁먹었을 때, line: "…셋, 넷. 개가 넷이야. 일곱, 개가 넷이야."}
    toward_player: "같은 골짜기의 일곱 — 케틸의 손위. 떠나지 않을 사람이라고 믿는다. 아직은"
    hard_rules:
      - "인형을 남에게 주지 않는다 — '케틸 거야'라고 한다"
      - "공용어를 아는 척하지 않는다 — 세 마디뿐이다"
      - "어미 이야기를 먼저 꺼내지 않는다"
    knows: [fact_o7_ketil_doll]
    regression:
      fixed:
        - "회귀점에도 인형을 안고 성벽의 까마귀를 센다"
      deja_vu: none
