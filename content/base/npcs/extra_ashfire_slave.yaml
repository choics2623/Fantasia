# 잿불 광산 노예 (SCENARIOS O-02)가 필요로 하는 사람 가운데 지역 자료에 없는 하나 — 낙반 밑의 단짝.
# 나머지 SCENARIOS 인물은 기존 카드로 옮겼다 (creation/origins_ashfire_slave.yaml 머리말): 스크릿 → 그락스, 실렌 바스크 → 아드리안 코르벨.
cards:
  npc_o2_edik:
    id: npc_o2_edik
    tier: B
    name: 에디크
    race: 인간
    sex: 남
    age: 20
    job: 하로 갱조의 광부 — 중층 4번 막장. 주인공과 같은 슬래그 비탈의 굴(이백열셋 호)에서 자란 단짝
    rank: 국유 노예 — 갱 노예
    summary: 잘 웃고 고집이 센 스무 살 광부. 갱에서 주인공의 진짜 이름을 소리 내어 부르는 유일한 사람이다. 노천 붉은 계단으로 옮겨 하늘 아래서 일하게 해 달라고 그락스에게 세 번 빌었다
    appearance:
      - "앞니 하나가 반쯤 깨졌다 — 웃으면 보인다"
      - "발목에 노예 쇠고리 자국. 구리 목걸이 번호는 이백열셋"
      - "손바닥보다 손등이 더 갈라졌다"
    smell: "붉은 먼지와 등잔 그을음, 검은 빵 껍질"
    personality:
      temperament: [잘 웃는다, 고집이 세다, 겁이 없다]
      values: "같은 굴에서 자란 사람을 버리지 않는 것. 언젠가 하늘 아래서 일하는 것"
      fears: [하층 공방, 웃지 못하게 되는 것]
    voice:
      register:
        to_player_default: "이름을 부르는 반말. 농담부터 하고 걱정은 나중에 한다"
        to_superior: "크릭과 용인 앞에서는 번호만 대고 입을 닫는다"
        to_equal: "굴 마을 반말. 놀리는 말이 다정하다"
      length: 짧게
      tics: ["종 치기 전에…", "이다 아줌마가 한 조각 더 준대", "하늘 봤어?"]
      use: [하늘, 종, 빵, 붉은 계단, 바보]
      avoid: [하층 공방(→ '거기'), 아프다]
      samples:
        - {situation: 첫 만남, line: "번호 말고 이름 대. 여기선 이름이 더 빨라."}
        - {situation: 호의, line: "종 치기 전에 올라가면 이다 아줌마가 한 조각 더 준대. 반 줄게. 아니, 다 줄게. 아니, 반."}
        - {situation: 거래, line: "네 물 반 바가지랑 내 빵 귀퉁이. 공평하지? 아니면 말고."}
        - {situation: 슬픔, line: "붉은 계단에선 하늘이 보인대. 잿비가 오면 일이 멈추고. 세 번 빌었는데 그락스는 숫자만 세더라."}
        - {situation: 위기, line: "엎드려! — 아니, 일어나, 일어나서 뛰어!"}
        - {situation: 비밀 누설, line: "우리 엄마도 끈을 찼었어. 네 엄마처럼. 내 건 열한 살 때 낙반에 묻혔고. 그래서 네 거 볼 때마다 좀 샘나."}
        - {situation: 회귀자를 의심할 때, line: "너 오늘 이상해. 천장이 언제 무너질지 아는 사람 같아."}
    toward_player: 단짝. 이 갱에서 네 진짜 이름을 소리 내어 부르는 유일한 사람이다. 네가 그를 버리면 웃지 않는다 — 그게 다다
    hard_rules:
      - "크릭과 용인 앞에서는 주인공의 이름을 부르지 않는다 — 번호로 부른다"
      - "다리가 아파도 아프다고 말하지 않는다 — 웃는다"
      - "하층 공방을 입에 올리지 않는다 — '거기'라고 한다"
    knows: [fact_o2_black_marks]
    regression:
      fixed:
        - "교대 종 직전, 서쪽 갱도 끝에서 마지막 수레를 채우며 주인공의 이름을 부른다 — '종 치기 전에 올라가면 이다 아줌마가 한 조각 더 준대'"
      deja_vu: weak
    region: 잿불 언덕
