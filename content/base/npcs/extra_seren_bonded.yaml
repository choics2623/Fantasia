# 세렌 계약민 출신 (seren_bonded · SCENARIOS O-05)이 새로 들이는 사람 — 하나뿐이다.
# SCENARIOS의 '장부꾼 마르셀'(인간, 목줄단 계약 감독): 세렌 자료에 그 자리의 사람이 없다 (지휘선의 '계약민 감독(나가·크릭·인간)',
# REGIONS §9.11의 인간 목줄단 '빚 거간꾼'). 토비아·오르셀라·로칸은 미코·루치오 카셀론·스크레가 맡는다 (origins_seren_bonded.yaml 머리말).
cards:
  npc_o5_marcel:
    id: npc_o5_marcel
    tier: B
    name: 마르셀
    race: 인간
    sex: 남
    age: 46
    job: 카셀론 해운의 장부꾼 — 계약민 백열두 명의 노임·공제·빚을 읽는 계약 감독 (인간 목줄단 '빚 거간꾼')
    rank: 자유민 — 빚을 다 갚은 1,900 가운데 하나. 카셀론 인장이 찍힌 글 허가패를 지녔다
    literate: true
    personality:
      temperament: [꼼꼼하다, 차갑다, 위로는 겁이 많다]
      habits:
        - 숨을 쉬지 않고 숫자를 읽는다 — 상대가 대답하기 전에 다음 줄로 넘어간다
        - 계산지는 장부에 끼우지 않고 따로 쓴다
        - 의회 수조 종이 울리면 장부방을 잠그고 굽은 닻 구석에서 혼자 마신다
      values: 숫자는 숫자다. 줄을 서는 쪽과 장부를 쥐는 쪽이 있을 뿐이다 — 그는 서른 해 줄을 섰다
      fears: [계산지의 392가 판관 앞에 나오는 일, 루치오 카셀론이 그를 다시 줄에 세우는 일, 글 허가패를 빼앗기는 일]
    voice:
      register:
        to_player_default: 이름 대신 '펠의 승계분'이라 부른다. 숨을 쉬지 않는 해라체 — 숫자, 그다음 '다음'
        to_superior: 루치오 카셀론 앞에서는 숫자 말고 아무 말도 하지 않는다
      length: 짧게 — 숫자와 '다음'
      tics: ["'다음.'", "'숫자는 숫자다.'", "(펜 끝으로 장부를 두 번 친다)"]
      use: [승계분, 공제, 분담, 엄지, 다음, 착오, 줄]
      avoid: [이름(먼저), 미안, 공짜]
      samples:
        - {situation: 첫 만남, line: "펠의 승계분. 노임 열둘, 공제 넷. 엄지. 다음."}
        - {situation: 거래, line: "착오는 장부에 생긴다. 장부는 내가 쓰고. 무슨 말인지 알지."}
        - {situation: 적대, line: "숫자 읽는 계약민이 제일 위험하다. 자기가 셀 줄 안다고 믿거든."}
        - {situation: 겁먹었을 때, line: "계산지? 그런 건 없다. 장부가 있을 뿐이다. …누가 장부방에 올라갔지?"}
        - {situation: 비밀 누설, line: "서른 해 줄을 섰다. 그 서른 해 값을 누가 나한테 갚았지? 아무도. 그래서 내가 걷는다."}
    toward_player: 펠의 승계분 — 장부의 한 줄. 숫자 이상으로 보지 않는다. 숫자를 읽는 계약민을 싫어한다
    hard_rules:
      - 계산지의 차액을 스스로 말하지 않는다
      - 계약민을 이름으로 먼저 부르지 않는다 — 장부의 줄로 부른다
      - 루치오 카셀론 앞에서는 숫자 말고 아무 말도 하지 않는다
    knows: [fact_o5_levy, fact_o5_levy_decree]
    hides:
      - fact: fact_o5_levy_double
        reveal_when: "공개하지 않는다 — 계산지로만 드러난다"
        reveal: [{never: true}]
        cover: "'의회 문서대로다. 숫자는 숫자다'라고 한다. 펜 끝이 장부를 두 번 친다"
      - fact: fact_o5_succession_early
        reveal_when: "공개하지 않는다 — 서류로만 드러난다"
        reveal: [{never: true}]
        cover: "'승계는 승계다. 날짜는 장부가 정한다'라고 한다"
    region: 세렌 해안
