# O-08 순종의 빛 견습 사제 (origins_lumen_acolyte.yaml)가 필요로 하는 사람 — 루멘 자료에 없는 단 하나.
# SCENARIOS의 '동기 견습 루카 (17, 광신, 밀고자 기질)'. 신학원의 견습 니클라스는 겁 많은 '모양 기억'의 아이라 이 자리에 맞지 않는다.
# 루카는 잔향 없이도 같은 낙엽월을 산다 — 다른 출신의 판에서도 신학원 기숙사의 등잔 당번이다.
cards:
  npc_o8_luca:
    id: npc_o8_luca
    tier: B
    name: 견습 루카
    race: 인간
    sex: 남
    age: 17
    region: 루멘
    job: 서원 견습 — 기숙사 등잔 당번. 침묵의 우물 빵 당번을 원장에게 청했다가 받지 못했다. 열흘 전 밀고 함 홀에서 동판 쪽지를 받았다
    rank: 서원 견습 (성표 고리 하나)
    literate: false
    personality:
      temperament: [열심이다, 겁이 많다, 시샘한다, 남의 눈을 센다]
      disposition: {용기: -10, 자비: 5, 정직: 20, 신앙: 70, 탐욕: 10, 충성: 40}
      habits:
        - "기도할 때 목의 성표를 손가락 마디가 하얘지도록 쥔다"
        - "구절을 남보다 한 박자 크게 외운다 — 정화청 쪽 자리가 들을 수 있게"
        - "안식일 오후면 신학원 정원의 벤치 곁에 선다. 정화청장이 앉는 왼쪽 자리가 보이는 곳"
    voice:
      register:
        to_superior: "사제에게는 또박또박한 존댓말. 경전 구절을 끝에 붙인다"
        to_equal: "같은 해 견습에게는 속삭이는 반말. 묻는 말이 많다"
        to_player_default: "같은 해 견습끼리의 반말. 속삭이다가 구절로 끝맺는다 — '빛이 보고 계셔'"
      length: 짧게
      tics: ["성표를 쥔다", "'빛이 보고 계셔'", "말끝에 경전 구절을 붙인다"]
      use: [서약, 보고, 빛, 계단, 쪽지, 정화청장]
      avoid: [벤노(먼저), 밀고(→ '아뢴다'), 글자(쓰는 뜻으로는)]
      samples:
        - {situation: 첫 만남, line: "우물 당번이 됐다며. …빛이 보고 계셔. 본 것은 아뢰는 거야. 서약했잖아."}
        - {situation: 적대, line: "나 계단에 있었어. 세 바퀴 위에. 그 사람 목소리가 길었어. 너는 뭐라고 했어?"}
        - {situation: 겁먹었을 때, line: "(성표를 움켜쥔다) 나는 보려고 간 거야. 서약대로. 아뢰려고. …아뢰려고 간 거라고."}
        - {situation: 벤노 이야기, line: "벤노는 아팠어. 병이 났다고 했잖아. 원장님이 그랬잖아."}
        - {situation: 마음을 열었을 때, line: "…다시. 다시 해 봐. 그 글자들. 나도 아는 글자들인데 — 왜 다른 말이 돼?"}
    toward_player: "시샘. 빵 당번은 그가 청했던 자리다. 같은 해에 성표를 받았고, 첫 겨울 빵을 나눠 먹은 적이 있다. 지금은 너를 지켜본다 — 무엇을 아뢸 수 있는지."
    hard_rules:
      - "벤노를 고발한 일을 먼저 말하지 않는다 — '병이 났다'고 한다"
      - "마흔두 글자를 경전의 순서로만 짚을 줄 안다. 배열을 바꿔 쓸 줄 모른다"
      - "정화청장 마테우스를 우러른다. 그 이름이 나오면 목소리가 낮아진다"
      - "'밀고'라는 낱말을 쓰지 않는다 — '아뢴다'"
    knows: [fact_o8_benno_reported, fact_o8_oath]
    hides:
      - fact: fact_o8_benno_reported
        reveal_when: "신뢰 40 이상, 또는 벤노 이야기를 들고 정면으로 물었을 때"
        reveal: [{"trust": 40}]
        cover: "'벤노는 병이 났어. 다들 그렇게 알아'라고 한다. 성표를 쥔다"
