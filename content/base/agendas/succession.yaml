# 계승 전쟁의 가장 작은 판 (SCENARIOS 용황 클락, 09 §3 '하사받는다').
# 용황의 몸이 다하면(또는 313 푸른월 1일) 계승이 시작된다. 카스파르가 살아 있고 세력이 50을 넘으면 즉위한다.
# 플레이어가 움직일 수 있는 것: 아우락스의 암살 의뢰를 알린다(+15), 인간 의용군(영역)을 보탠다(+20), 카이도르의 접촉을 잇는다(+10).
vars:
  varskar_dead: false
  faction_kaspar: 15
  kaspar_warned: false
  kaspar_throne: false
  kaspar_charter: false
agendas:
  - id: ag_varskar_death
    npc: npc_severian_kaldaran
    goal: 용황이 숨을 거둔다 — 병상 문이 마지막으로 닫힌다 (기본 궤적 313 봄)
    every: once
    when: ["date >= 313-04-01"]
    at: {place: dragon_throne_peak__ash_nest, from: "05:00", to: "06:00", doing: 병상 문을 마지막으로 닫는다}
    effects: ["var varskar_dead = true", "log 용황이 죽었다 — 바알카르의 종이 일곱 번 울린다. 계승이 시작된다"]
  - id: ag_aurax_hit
    npc: npc_volk
    goal: 아우락스의 의뢰 — 용황이 죽으면 까마귀 문의 반비늘을 친다
    every: once
    when: ["alive npc_kaspar", "var varskar_dead == true", "var kaspar_warned != true"]
    at: {place: cg_commander_office, from: "02:00", to: "03:00", doing: 사령관실 창 밖의 그림자}
    effects: ["kill npc_kaspar", "log 까마귀 문의 반비늘이 죽었다 — 쇠 송곳니 자국이 남았다"]
  - id: ag_kaspar_rise
    npc: npc_kaspar
    goal: 반비늘의 틈 — 세력이 모이면 즉위한다
    every: once
    when: ["alive npc_kaspar", "var varskar_dead == true", "var faction_kaspar >= 50"]
    at: {place: cg_commander_office, from: "08:00", to: "12:00", doing: 즉위 선언문에 반쪽 비늘 인장을 찍는다}
    effects: ["var kaspar_throne = true", "log 카스파르 반비늘이 즉위를 선언했다 — 전통파가 산으로 들어간다"]
