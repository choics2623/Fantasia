- {id: ev_rp_alaric_silas, npcs: [npc_alaric, npc_silas_bell], date: "312-12-08", from: "21:00", to: "24:00", at: nocturne__silentbell_pen, doing: "알라리크가 세실 암살 의뢰를 다시 재촉한다. 사일라스는 '증거 없이는 집을 짓지 않는다'고 답한다 — 증거를 만들 시간이 열흘 남았다"}
