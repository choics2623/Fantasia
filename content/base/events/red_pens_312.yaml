- {id: ev_rp_clear_day_adriel, npcs: [npc_adriel], date: "312-10-14", from: "07:00", to: "17:00", at: rp_coffin_room, doing: "맑은 날 — 영주는 낮의 방 문을 잠그고 나오지 않는다"}
