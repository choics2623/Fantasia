- {id: ev_rp_thirst_night_tribute, npcs: [npc_rosalie], date: "312-11-15", from: "18:00", to: "24:00", at: first_thirst_castle__great_hall, doing: "공물 대열 — 번호 열일곱이 호명되기를 기다린다. 입에 문 장미 꽃잎이 말라 있다", travel_from: red_pens__tribute_gate}
- {id: ev_rp_thirst_night_roses, npcs: [npc_orphe, npc_pips], date: "312-11-16", from: "01:00", to: "05:00", at: rose_manor__garden, doing: "갈증의 밤이 끝난 새벽 — 결번 하나가 장미 하나가 되었는지 홈으로 센다. 핍스가 꽃잎을 수로 입구에 놓는다"}
