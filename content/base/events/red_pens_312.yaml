- {id: ev_rp_tribute_arrive, npcs: [npc_rosalie, npc_kasimir, npc_zrag], date: "312-11-15", from: "03:00", to: "05:00", at: red_pens__tribute_gate, doing: "공물 도착 — 루멘 40명이 검은 문을 지난다. 카시미르가 명단과 인원을 센다. 올해도 둘이 다르다", travel_from: lumen}
