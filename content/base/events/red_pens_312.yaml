- {id: ev_rp_thirst_night_pens, npcs: [npc_hedwig, npc_zrag, npc_chik_tally], date: "312-11-15", from: "18:00", to: "24:00", at: rp_pen_barracks, doing: "갈증의 밤 — 우리 안에서 촛불을 끄고 숨을 죽인다. 노파는 맥을 잡고 목동은 문 앞에 서고 서기는 홈을 세지 않는다"}
