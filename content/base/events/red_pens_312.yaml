# 녹테른 밤의 영지 사건 달력 — AS 312 낙엽월 1일 ~ AS 313 수확월 (24 §3.2). 원천: REGIONS §7.5·§7.8·§7.13, fac_nocturne(갈증의 밤·우물 순례·집전관), 월드 클락(클락 2 맹약회의 313, 클락 5 영혼 정원).
# 날짜 일정이 일과보다 우선한다. 날짜 표기 "년-월-일" (월: 9 낙엽월, 10 서리월, 11 긴밤월, 12 굶주림월, 13 재의 날, 1 해빙월, 2 파종월, 3 꽃월, 4 푸른월, 5 태양월, 6 건초월, 7 수확월).
