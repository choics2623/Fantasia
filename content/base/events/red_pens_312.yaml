- {id: ev_rp_rose_escape, npcs: [npc_cecile, npc_orphe, npc_pips, npc_tessa], repeat: monthly, day: 20, from: "23:00", to: "24:00", at: rose_manor__garden, doing: "한 달에 한 번 — 장미원 셋째 덤불 아래 지하 통로와 온실 수로로 6~12명이 붉은 갈대 선으로 나간다. 세실이 직접 문을 연다", travel_from: rose_manor}
