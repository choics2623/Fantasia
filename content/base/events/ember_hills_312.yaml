# 잿불 언덕 날짜 일정 (AS 312 낙엽월 1일 ~ AS 313 수확월). 일과보다 우선한다 (24 §3.2). 원천: REGIONS §3.8·3.13, WORLD_BIBLE §8·§10, fac_darason·fac_vermion·fac_nameless, 회색여울 사건 달력.
# 날짜 표기 "년-월-일" (월 9=낙엽월 … 12=굶주림월, 13=재의 날, 1=해빙월 … 7=수확월). 쉼표가 든 값은 따옴표로.
# 회색여울 연결: 매달 25일 레아의 우편(레아→멜리산드) → 28일 요람 대조 / 10.9 · 12.3 매각 호송 → 바알카르 비늘 시장 점검 / 9.15 카스파르의 보급 회의 → 13일 철괴 호송대.
# 월드 클락: #1 용황의 죽음(멜리산드는 계승 국면 때문에 바알카르에 머문다 — 일과의 presence), #2 맹약회의 313(태양월), #4 황무지 확장(말뚝 가속).

