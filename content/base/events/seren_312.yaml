# 세렌 해안 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §9(포도월 대시장·회색여울 저당 기한 313.8.30·계약 시장 10.30경), §2.14(10.9·12.3 매각 호송), WORLD_BIBLE §8·§10(클락 2 맹약회의 313: 서약섬 태양월 1~11일 — SCENARIOS 「서약섬의 열하루」), HOUSES §3.4·§5.10, docs/world/people/seren.md, facts/phase2_seren.yaml.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림 13 재의 날(5일). 서리월 이후 소금 바닷길은 굶주림월 폭풍철에 운항 중지(은빛 강 수운은 계속).
# 회색여울 매각 호송 경로: 1차 40명 — 바알카르 10.15 선매 인도 → 루멘 부두 10.17(하룻밤) → 갈림목 검역 10.19 → 세렌 소금 나루 10.20 → 검역·전환 등록 보류 → 계약 시장 경매 10.30.
#                          2차 31명(사라 포함) — 바알카르 12.9 선적·12.10 '소금 바늘'호 출항 → 루멘 12.11 → 갈림목 12.13 밤 → 소금 나루 12.14 → 12.30 그믐 밤 사라와 심해 사절.
# 다른 지역과의 연결: 312-10-20·12-14 소금 나루(회색여울 마흔·서른하나) / 312-12-11 미코가 '소금 바늘'호 갑판에서 루멘 부두를 지난다(lumen_312 ev_lm_convoy2_dock) / 313-03-15 흰 알 부화 — 시렌나의 알이 따뜻해진다 / 313-04-29~05-12 노르발과 사절단이 서약섬으로(맹약회의 5/1~11) / 313-05-12 이후 귀로·소식 전파 / 313-07 포도월 대시장 준비와 저당 기한 313.8.30.
# 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에 적었다. 쉼표가 든 값은 큰따옴표로.

