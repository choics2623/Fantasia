# 가시안개 숲 사건 달력 — AS 312 낙엽월 1일 ~ AS 313 수확월 (24 §3.2). 원천: REGIONS §6.8·§6.13, fac_fae·fac_laugh_shards(울지 않는 나무 만남·가시 무도회·칭호 교체), 월드 클락(클락 1 흰 알, 클락 2 맹약회의 313, 클락 3 북방 대탈주).
# 날짜 일정이 일과보다 우선한다. 날짜 표기 "년-월-일" (월: 9 낙엽월, 10 서리월, 11 긴밤월, 12 굶주림월, 13 재의 날, 1 해빙월, 2 파종월, 3 꽃월, 4 푸른월, 5 태양월, 6 건초월, 7 수확월).
# 다른 지역과 이어지는 것: 9.20 회색여울 옛 돌 고리(이졸 도착 뒤) / 10.3 까마귀 문 물빼기 굴(숲 남쪽 경계로 번지는 탈주자) / 11.12 루멘 공물 호송, 11.15 녹테른 갈증의 밤 / 313-01-10 실바렌 빈 요람의 밤 / 313-01 서리 길 재개·북방 대탈주 / 313-03-15 흰 알 부화(바알카르) / 313-05-20 맹약회의(바알카르).
# 쉼표가 든 값은 큰따옴표로.

