- {id: ev_tc_grik_thaw, npcs: [npc_grik, npc_dawn_hunter_dew, npc_three_laugh_knight], date: "313-01-18", from: "03:00", to: "12:00", at: thornmist__south_tower, doing: "서리 길 재개 뒤 북방 탈주 시즌 — 숲 남쪽 경계로 번지는 탈주자들. 그릭의 모자가 마르기 전에 이슬이 개를 서쪽으로 푼다. 기사는 세 번째 웃음에서 멈춘다"}
