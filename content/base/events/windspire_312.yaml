- {id: ev_ws_feb6_letter_kyrie, date: "313-02-06", npcs: [npc_kyrie], from: "19:00", to: "21:00", at: ws_queen_perch, doing: "테무르 칸의 서신을 혼자 읽는다 — 서진 때 하늘길을 지나가게 해 달라는 청이다. 아래의 불빛 대신 동쪽 초원 쪽을 바라본다"}
- {id: ev_ws_feb14_rope, date: "313-02-14", npcs: [npc_ws_torin, npc_ws_ulla, npc_ws_tur], from: "16:00", to: "19:00", at: sky_market__basket_lift, doing: "바구니에 밧줄 한 타래가 올라간다 — 토린의 서명이 든 쇠판이 줄지기 눈을 지나간다. 투르가 사육장 쪽에서 받을 자리를 비워 둔다, if: torin_rope_deal", travel_from: ws_ground_village}
# ── 313 꽃월 (3) — 흰 알과 역행하는 별 ──
- {id: ev_ws_mar5_vote, date: "313-03-05", npcs: [npc_kyrie, npc_eiros, npc_ws_celes, npc_ws_kair, npc_ws_aela, npc_ws_rei], from: "09:00", to: "17:00", at: ws_feather_council, doing: "깃털 의회 — 맹약회의 313 대표 표결. 표가 셋 대 셋으로 갈리고 키리에가 마지막 한 표를 쥐고 오래 말하지 않는다. 폭풍깃의 침묵이 표를 하나 지운다", fixed: true}
- {id: ev_ws_mar5_celes, date: "313-03-05", npcs: [npc_ws_celes], from: "17:00", to: "22:00", at: ws_looking_up_nest, doing: "표결 뒤 둥지에서 균열이 보이는 쪽으로 처음 고개를 돌린다 — 아무에게도 말하지 않는다", if: celes_loses}
- {id: ev_ws_mar14_star, date: "313-03-14", npcs: [npc_korak, npc_ws_launa], from: "21:00", to: "24:00", at: ws_wind_bell, doing: "역행하는 별이 가장 낮게 내려온다 — 코라크가 흰 알 부화 소식이 오는 밤과 같은 밤으로 종 틀 나무에 새긴다. 라우나가 서고에서 그 줄을 따로 묶는다", travel_from: ws_feather_library, return_to: ws_feather_library}
# ── 313 푸른월 (4) — 대표 출발 ──
- {id: ev_ws_apr12_rei_march, date: "313-04-12", npcs: [npc_ws_rei, npc_ws_ask], from: "05:00", to: "17:00", at: ws_hawkeye_ledge, doing: "서리 이빨 쪽에서 거인 행렬이 서리 길로 내려오는 것을 본다 — 정찰 고리가 보고서에 올릴지 한 번 더 망설인다, if: jotun_march"}
- {id: ev_ws_apr20_depart, date: "313-04-20", npcs: [npc_kyrie, npc_eiros], from: "05:00", to: "09:00", at: ws_high_nest, doing: "여왕이 아들을 맹약회의 313 아에리 대표로 보낸다 — 은빛 깃털 한 장을 목에 걸어 준다. 아에리가 처음으로 대표를 보낸다", fixed: true}
- {id: ev_ws_apr20_celes_oppose, date: "313-04-20", npcs: [npc_ws_celes, npc_ws_aela], from: "05:00", to: "09:00", at: ws_looking_up_nest, doing: "출발을 지켜보지 않고 높은 둥지에서 등을 돌린다 — 아엘라가 줄 거둠 표를 한 번 더 센다"}
# ── 313 태양월 (5) — 맹약회의 ──
- {id: ev_ws_may12_wait, date: "313-05-02", npcs: [npc_kyrie], from: "19:00", to: "23:00", at: ws_queen_perch, doing: "아들이 서약섬에서 첫 발언을 하는 날 — 아래의 불빛 대신 남쪽 바다를 오래 바라본다"}
- {id: ev_ws_may_rope_done, date: "313-05-20", npcs: [npc_ws_marco, npc_ws_ulla, npc_ws_anskar], from: "20:00", to: "23:00", at: ws_water_jars, doing: "줄이 삼백사십 미터가 된다 — 안스가르가 확인한 숫자와 맞는다. 한 번에 열 명만 버틴다는 것도 확인된다, if: rope_340"}
# ── 313 수확월 (7) ──
- {id: ev_ws_jun_return, date: "313-06-25", npcs: [npc_kyrie, npc_eiros], from: "05:00", to: "09:00", at: ws_high_nest, doing: "대표가 맹약회의에서 돌아온다 — 키리에는 아들에게 무엇을 말했는지 묻지 않는다"}
