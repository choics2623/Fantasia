- {id: ev_ws_monthly_torin_feathers, npcs: [npc_ws_torin, npc_ws_sera], repeat: monthly, day: 1, from: "08:00", to: "12:00", at: sky_market__durgan_depot, doing: "깃털 근수를 맞교환한다 — 서명 쇠판 한 장이 오고 가며 줄지기의 금속 고리 빚이 한 줄 줄어든다"}
