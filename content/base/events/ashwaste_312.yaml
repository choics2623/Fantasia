# 재의 황무지 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §11(등불 규칙·재의 날·시간 잔상·두 번째 등불·시간의 상처), WORLD_BIBLE §8(달력)·§10(클락 2 맹약회의 313, 클락 3 북방 대탈주, 클락 4 황무지 확장), fac_last_lantern, fac_grey_pilgrims(잿불석 매장), docs/world/people/ashwaste.md, facts/phase2_ashwaste.yaml.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림 13 재의 날(5일). 황무지에는 눈이 오지 않고 재가 온다 — 겨울에는 재 폭풍이 연다.
# 다른 지역과의 연결: 312-09-01 18:00 회귀점의 측정 바늘이 탑(귀 기울이는 방)에서만이 아니라 재눈 초소에서도 튄다 / 312-11-03·12-20 회색여울 매각 40·31 소식(세렌 소금 나루 10/20·12/14 도착)이 그롬마르행 상인을 통해 튀크에게 닿는다 / 312-09-18·12-18·313-03-18·06-18 해골이빨 전쟁 숙영지의 전언 / 313-03-15 흰 알이 깬 날 재눈 초소의 곡선이 먼저 튀고 열흘 뒤 소문이 닿는다 / 313-05-01 맹약회의 313(서약섬 5/1~11) 개막일 경계 말뚝이 한 번 더 뛴다 — 5/12 이후 소식이 전파된다 / 북방 대탈주 탈주자는 겨울마다 마지막 등불의 판잣집 골목으로 흘러든다.
# 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에 적었다. 쉼표가 든 값은 큰따옴표로. 시간 잔상은 하루 한두 번 — 재의 날에는 시간당 서너 번.

