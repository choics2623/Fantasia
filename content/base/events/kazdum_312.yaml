# 카즈둠 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §12(계절·서명 회기·만료일), WORLD_BIBLE §10(클락 2 맹약회의 313, 클락 3 북방 대탈주, 클락 6 깊은 문, 클락 1 흰 알 부화), facts/kazdum.yaml·phase2_kazdum.yaml, docs/world/people/kazdum.md.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림. 서명 회기는 계절 첫날(해빙월·푸른월·수확월·서리월 1일)에 계약의 돌 전당에서 열린다.
# 다른 지역과의 연결: 313-04-15 왕의 서명 대행 발동(맹약회의 313 → 하그린의 대행 조항 → 깊은 문 안건), 313-02-20 북방 탈주자 첫 무리(마그나의 서른 자리 ← 북방 대탈주), 313-03 흰 알 부화 → 용좌 계약 갱신 대비, 매달 14일 멜리산드 대리인의 잿불석(잿불 언덕).
# 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에 적었다.

