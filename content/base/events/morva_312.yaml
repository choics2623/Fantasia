# 모르바 늪 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §8(늪 마녀·공물 여섯·첫 이름 날·재의 날 반딧불), WORLD_BIBLE §8(달력)·§10(클락 2 맹약회의 313, 클락 3 북방 대탈주), fac_swamp_hags(보름 회합 — 피 병을 그릇 쪽으로 밀고 당긴다), docs/world/people/morva.md, facts/phase2_morva.yaml.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림 13 재의 날(5일). 늪은 얼지 않는다 — 겨울에는 안개가 오고 굶주림이 온다.
# 다른 지역과의 연결: 312-09-25 볼크의 굶주린 언덕 대수색(회색여울) 소식 → 가르 / 312-10-20·12-14 회색여울 매각 40·31이 세렌 소금 나루에 닿는 날 헤드비가가 마르디 상가에 가 있다(매달 20일) / 312-12-12 마레크가 노예선 소식을 듣는다 / 313-03 흰 알 부화 소식(루멘 장어 장수) / 313-05-16·20 맹약회의 313(서약섬 5/1~11) 소식('인간 증언' 의제, 12일 이후 전파) / 313-07 바르그 원정대 탐문.
# 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에 적었다. 쉼표가 든 값은 큰따옴표로.

