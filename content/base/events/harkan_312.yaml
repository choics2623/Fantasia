# 하르칸 초원 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §15(오르두 이동·사냥 축제·말뼈 여울 범람·통일 전쟁), WORLD_BIBLE §10(클락 7 초원 통일, 클락 2 맹약회의 313, 클락 3 북방 대탈주, 클락 1 흰 알), fac_harkan, facts/harkan.yaml·phase2_harkan.yaml, docs/world/people/harkan.md.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림. 오르두 이동일은 아흐레마다(9·18·27일 — 일과의 monthday 블록). 겨울(서리월 2일~해빙월 11일)은 바람 우물 겨울 진영.
# 다른 지역과의 연결: 313-02 테무르의 서신(→ 바람첨탑 줄내림 장터 하르칸 전령 에르덴, 키리에), 313-03-14 흰 알 부화 소식(바알카르 → 오르두), 313-04-09 서풍의 날 서진(검은바람의 이탈 — 클락 7),
#   313-05-01~11 맹약회의 313 서약섬(oath_isle): 바투·에젤의 사절단이 313-04-27 출발 의식 → 05-01 도착 → 05-12 귀로 (지도 최단 경로 154h, 말을 타면 ×0.35 = 약 54h. 길이 그롬 영역을 지난다 — 휴전 깃발),
#   313-05-30 그롬마르 피의 원형장 대축제 마지막 날(말뼈 여울 건너편 연기), 313-04 말뼈 여울 우기 범람(그롬 정찰대와 마주침).
# 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에 적었다.

# ── 낙엽월 (9) — 사냥 축제 ──
- {id: ev_hk_sep_hunt_nominate, date: "312-09-12", npcs: [npc_hk_kasar, npc_hk_hulun, npc_dua, npc_hk_batu, npc_soran], from: "18:00", to: "22:00", at: hk_feast_tent, doing: "사냥 축제 사냥감 지명 — 카사르가 짐꾼 열둘의 명단을 읽는다. 두아가 이름을 하나씩 되묻고 바투가 장부의 채찍 수를 말없이 센다"}
