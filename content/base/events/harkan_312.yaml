- {id: ev_hk_nov_turga_double, date: "312-11-12", npcs: [npc_hk_turga, npc_hk_orduk], from: "20:00", to: "23:00", at: khan_ordu__winter_camp, doing: "같은 수레에서 철 창날 이백이 반으로 갈라진다 — 반은 칸의 천막으로, 반은 검은바람 천막 구석으로"}
