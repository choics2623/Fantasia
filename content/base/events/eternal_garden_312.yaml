- {id: ev_eg_ash_days, npcs: [npc_elastriel, npc_loren], date: "312-13-01", from: "05:00", to: "06:00", at: eg_first_tree, doing: "재의 날 첫날 — 정원은 불을 쓰지 않으니 바깥만 어둡다. 정원지기들은 노래를 한 음 낮춘다. 렌은 하늘을 본다"}
