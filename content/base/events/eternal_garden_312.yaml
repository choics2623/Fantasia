- {id: ev_eg_council_round, npcs: [npc_isilea, npc_isalion, npc_silvanus], repeat: monthly, day: 6, from: "13:00", to: "18:00", at: eg_ring_hall, doing: "노래 한 바퀴(9일) 가운데 6일째 — 고리의 의회가 안건을 낭송한다. 인간·외부의 일은 올라오지 않는다"}
- {id: ev_eg_ledger_close, npcs: [npc_miriel, npc_erlan], repeat: monthly, day: 30, from: "17:00", to: "19:00", at: eg_steward_office, doing: "달 마지막 날 — 정지 기록과 이송 장부를 닫는다. 서명 칸은 비워 둔다"}
