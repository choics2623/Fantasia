- {id: ev_eg_carven_courier_2, npcs: [npc_carven], date: "312-12-20", from: "20:00", to: "21:00", at: silver_leaf_gate__guest_pavilion, doing: "두 번째 급사 — 겨울 길이 닫히기 전에 도면 사본을 보낸다"}
