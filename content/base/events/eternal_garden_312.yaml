- {id: ev_eg_ritual_boriwheat, npcs: [npc_erlan, npc_miriel], date: "312-10-09", from: "08:00", to: "16:00", at: eg_steward_office, doing: "'보리'의 정지 — 3년째 같은 날. 에를란이 직접 걸고 미리엘이 장부에 같은 칸을 쓴다"}
