- {id: ev_eg_naelis_leaves, npcs: [npc_naelis, npc_caelon], date: "312-10-30", from: "08:00", to: "10:00", at: silver_leaf_gate, doing: "나엘리스가 은잎문을 나선다 — 긴밤월 전 잿빛 탑으로. 소매 속 수정은 이번에 두고 간다고 한다"}
