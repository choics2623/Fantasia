- {id: ev_eg_carven_courier_1, npcs: [npc_carven], date: "312-09-20", from: "20:00", to: "21:00", at: silver_leaf_gate__guest_pavilion, doing: "급사에게 봉인한 서류 상자를 맡긴다 — 바알카르 경유 잿불 언덕행. 접목 침대 도면의 사본이 들어 있다"}
# ── 서리월: 미라의 다섯 번째 의식, 서리월 경매 (회색여울 9.15 보급 회의, 10.9 매각 호송과 같은 가을) ──
