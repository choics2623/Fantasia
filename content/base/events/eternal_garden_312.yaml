# 실바렌 영원 정원 사건 달력 — AS 312 낙엽월 1일 ~ AS 313 수확월 (24 §3.2). 원천: REGIONS §5.8·§5.13, fac_eldar(빈 요람의 밤·의회 한 바퀴 9일), 월드 클락(WORLD_BIBLE §10 클락 2 맹약회의 313, 클락 5 영혼 정원).
# 날짜 일정이 일과보다 우선한다. 날짜 표기 "년-월-일" (월: 9 낙엽월, 10 서리월, 11 긴밤월, 12 굶주림월, 13 재의 날, 1 해빙월, 2 파종월, 3 꽃월, 4 푸른월, 5 태양월, 6 건초월, 7 수확월).
# 다른 지역과 이어지는 것: 10.9 미라의 의식 = 회색여울 매각 호송 날 / 10.24 경매에 회색여울 농노 / 11.14 루멘 공물 명단 / 313-03-15 흰 알 부화(바알카르) / 313-05-20 맹약회의(바알카르).
# 쉼표가 든 값은 큰따옴표로.

