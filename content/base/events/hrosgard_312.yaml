- {id: ev_hg_apr_lodge_shut, date: "313-04-14", npcs: [npc_matusz], from: "06:00", to: "18:00", at: weeping_pass__lodge, doing: "행군이 오는 날 — 곰이 산장 문을 닫고 꿀 단지를 뒷벽 구멍에 넣는다, if: jotun_march"}
- {id: ev_hg_apr_last_fire_dark, date: "313-04-16", npcs: [npc_hg_inge], from: "05:00", to: "20:00", at: weeping_pass__shelter_cave, doing: "마지막 불을 끄고 대피 동굴로 숨는다 — 행군이 지나간 뒤 다시 불을 피우려고, if: jotun_march"}
- {id: ev_hg_apr22_key, date: "313-04-22", npcs: [npc_hrimnir, npc_hg_skala, npc_hg_bragi], from: "05:00", to: "07:00", at: hh_granary, doing: "왕이 맹약회의 313 길에 오르며 곡창 열쇠를 왕비에게 맡긴다 — 곡창지기는 288섬을 말하지 못한 채 선다", fixed: true}
- {id: ev_hg_apr23_empty_chair, date: "313-04-23", npcs: [npc_skadir, npc_hg_skala], from: "08:00", to: "20:00", at: hh_throne_hall, doing: "왕이 떠난 전당 — 스카디르가 얼음 탁자의 빈 의자를 본다. 왕비는 한 칸 비켜 앉는다"}
# ── 313 태양월·건초월 ──
- {id: ev_hg_may_skala_regent, date: "313-05-12", npcs: [npc_hg_skala, npc_hg_bragi, npc_hg_hordis], from: "22:00", to: "24:00", at: hh_queen_hall, doing: "왕이 맹약회의에 가 있는 동안 곡창 열쇠를 쥔 왕비가 쪽문을 두 번째로 연다 — 불 오두막에 보리 스무 섬이 간다, if: skala_second_sack"}
# ── 313 수확월 (7) ──
- {id: ev_hg_jul_return, date: "313-06-19", npcs: [npc_hrimnir, npc_hg_skala], from: "05:00", to: "09:00", at: hh_gate, doing: "왕이 맹약회의에서 돌아온다 — 왕비가 곡창 열쇠를 돌려주며 수를 말하지 않는다"}
# ── 매달 반복 ──
- {id: ev_hg_monthly_ice_field, npcs: [npc_hg_hordis, npc_hg_halr], repeat: monthly, day: 15, from: "22:00", to: "24:00", at: hh_fire_hut, doing: "보름 — 서리 길로 떠나는 사람이 있는 밤. 호르디스가 언 손을 녹여 주고 하랄은 문밖에서 머릿수를 한 번 더 센다"}
