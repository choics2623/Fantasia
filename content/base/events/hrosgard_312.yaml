# 흐로스가르드 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §13(서리 길 폐쇄·돌팔 남침 313 푸른월), WORLD_BIBLE §10(클락 3 북방 대탈주, 클락 2 맹약회의 313), fac_jotun(얼음 탁자 3일 — 첫날 제안·둘째 날 먹기·셋째 날 답), facts/hrosgard.yaml·phase2_hrosgard.yaml, docs/world/people/hrosgard.md.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림. 서리 길은 서리월 1일~해빙월 10일 닫힌다 (까마귀 문 북문 봉쇄와 같은 날).
# 다른 지역과의 연결: 312-09-29·30 마지막 무리 → 까마귀 문 서리월 3일 물빼기 굴의 열둘 (crow_gate_312), 313-01-10 서리 길 재개(까마귀 문 북문 재개방과 같은 날), 313-04 돌팔 남침(까마귀 문 전투 313-04-20, if: jotun_march), 맹약회의 313 요툰 대표 서리왕의 출발, 313-03 흰 알 부화 소식.
# 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에 적었다.

# ── 낙엽월 (9) — 마지막 송출 ──
- {id: ev_hg_harvest_judgement, date: "312-09-20", npcs: [npc_hg_sven], from: "06:00", to: "18:00", at: bone_pens__hungry_field, doing: "흉작 4년째 판정 — 얼어붙은 이삭을 한 줌씩 센다. 흙 속에 회색 재가 섞여 있다는 것을 노예 맏이는 보고하지 않는다"}
- {id: ev_hg_asta_send_first, date: "312-09-23", npcs: [npc_asta, npc_hg_torvald], from: "22:00", to: "04:00", at: hh__stoneknee_huts, doing: "마지막 200명 송출 시작 — 첫 열 명이 움막에서 나간다. 토르발트가 매듭 끈 한 가닥을 장부에서 지운다"}
- {id: ev_hg_asta_send_last, date: "312-09-26", npcs: [npc_asta, npc_hg_torvald, npc_einar], from: "22:00", to: "04:00", at: hh__stoneknee_huts, doing: "서리월 전 마지막 열 명을 보낸다 — 가장 안쪽 움막의 소년은 보내지 않는다. 아스타가 매듭을 하나 풀지 않고 쥔다"}
- {id: ev_hg_last_convoy_lodge, date: "312-09-29", npcs: [npc_matusz, npc_hg_inge], from: "20:00", to: "24:00", at: weeping_pass__lodge, doing: "서리월 전 마지막 호송 — 산장에서 첫 밤. 곰이 꿀을 아이들 입에 나눠 주고 잉에가 바깥 바람을 본다"}
- {id: ev_hg_inge_last_twelve, date: "312-09-30", npcs: [npc_hg_inge], from: "05:00", to: "07:00", at: weeping_pass__last_fire, doing: "서리월 1일 전에 닿지 못할 무리 열둘을 보낸다 — '물빼기 굴로 가라'고 이른다. 열둘의 이름은 룬 명단에 적지 않는다"}
# ── 서리월 (10) — 서리 길 폐쇄 ──
- {id: ev_hg_road_closed, date: "312-10-01", npcs: [npc_hg_inge], from: "06:00", to: "08:00", at: weeping_pass__rune_rock, doing: "서리 길 폐쇄 첫날 — 바위 밑 룬을 지우고 불씨를 한 겹 덮는다. 사망자 룬 명단 서른일곱은 그대로 둔다"}
- {id: ev_hg_granary_oct3, date: "312-10-03", npcs: [npc_hrimnir, npc_hg_bragi], from: "10:00", to: "12:00", at: hh_granary_floor, doing: "왕이 곡창 바닥판을 열어 손을 얹는다 — 자루를 세지 않는다. 곡창지기는 '삼백'이라 말한다 (바닥에는 288)", fixed: true}
- {id: ev_hg_oct_utga_pens, date: "312-10-12", npcs: [npc_hg_sven, npc_hg_utga], from: "10:00", to: "12:00", at: hh__stonefist_hold, doing: "서리월 머릿수 보고 — 뼈울타리 인간 6,000에서 사백 일흔이 줄었다고 보고한다. 탈주자 판매 값이 장부에 오른다", travel_from: bone_pens__chief_hut, return_to: bone_pens__chief_hut}
- {id: ev_hg_oct_pik_ledger, date: "312-10-20", npcs: [npc_hg_pik], from: "08:00", to: "17:00", at: hh_krik_stall, doing: "곡물값이 한 뼘 또 오른다 — 재개 조건 줄 옆에 어제의 값과 오늘의 값을 나란히 적는다"}
# ── 긴밤월 (11) ──
- {id: ev_hg_nov_granary, date: "312-11-03", npcs: [npc_hrimnir, npc_hg_bragi], from: "10:00", to: "12:00", at: hh_granary_floor, doing: "왕이 바닥판 위에 손을 얹는다 — 이번에는 손을 오래 얹는다. 곡창지기는 '삼백'을 한 번 더 말한다", fixed: true}
- {id: ev_hg_nov_asta_brimir, date: "312-11-14", npcs: [npc_asta, npc_hg_brimir], from: "10:00", to: "16:00", at: hh__deepwell_springs, doing: "브리미르가 아스타를 통역으로 불러 앉힌다 — 보리와 계약 노예 맞교환의 첫 말. 노파가 보리알 하나를 아스타의 손에 쥐여 준다", travel_from: hh__stoneknee_huts, return_to: hh__stoneknee_huts}
- {id: ev_hg_nov_halr_two, date: "312-11-22", npcs: [npc_hg_halr, npc_hg_hordis], from: "21:00", to: "24:00", at: hh_fire_hut, doing: "머릿수에서 빠진 두 사람이 불 오두막을 지나간다 — 호르디스가 손을 녹여 주고 하랄은 문밖에서 눈을 감는다"}
# ── 굶주림월 (12) — 배급 중단 ──
- {id: ev_hg_dec1_pots_cold, date: "312-12-01", npcs: [npc_hg_skala, npc_hg_hordis, npc_hg_ragna], from: "05:00", to: "12:00", at: hh_kitchen, doing: "굶주림월 1일 — 솥 열둘이 식는다. 배급이 끊긴다. 왕비는 자기 몫을 덜고 호르디스가 불 오두막 문을 연다"}
- {id: ev_hg_dec3_king_counts, date: "312-12-03", npcs: [npc_hrimnir, npc_hg_bragi], from: "10:00", to: "12:00", at: hh_granary_floor, doing: "왕이 처음으로 바닥판을 열어 자루를 하나하나 센다 — 곡창지기는 '삼백'이라 말한다, if: king_counts_barley"}
- {id: ev_hg_dec_empty_stove, date: "312-12-12", npcs: [npc_hg_skala, npc_hg_bragi], from: "22:00", to: "24:00", at: hh_queen_hall, doing: "쪽문을 연다 — 곡창지기가 마지막 자루를 내린다. 남은 보리는 이백칠십 섬이다", if: skala_second_sack}
- {id: ev_hg_dec20_ice_field, date: "312-12-20", npcs: [npc_hrimnir, npc_hg_hallgrid], from: "17:00", to: "19:00", at: hh_ice_field, doing: "덜어냄 — 늙은 거인 하나가 스스로 얼음 들판으로 걸어 나간다. 왕과 사제가 말없이 서서 본다"}
- {id: ev_hg_dec28_hordis_wind, date: "312-12-28", npcs: [npc_hg_hordis], from: "14:00", to: "17:00", at: hh_fire_hut, doing: "북풍이 곡창 쪽으로 바뀌는 날 — 호르디스가 불 오두막 문을 반쯤 닫고 손바닥으로 바람 방향을 한 번 잰다, if: hordis_burns_granary"}
# ── 313 해빙월 (1) — 얼음 탁자와 서리 길 재개 ──
- {id: ev_hg_table_day1, date: "313-01-07", npcs: [npc_hrimnir, npc_skadir, npc_hg_utga, npc_hg_ugra, npc_hg_helda, npc_baug, npc_hg_brimir, npc_yorun, npc_hg_orr], from: "08:00", to: "20:00", at: hh_ice_table, doing: "얼음 탁자 첫날 — 스카디르가 313 푸른월 남침을 제안한다. 한 문장을 말하고 숨을 고른다. 돌팔 우트가가 고기를 내놓는다", fixed: true, travel_from: hh__stonefist_hold}
- {id: ev_hg_table_day2, date: "313-01-08", npcs: [npc_hrimnir, npc_skadir, npc_hg_utga, npc_hg_ugra, npc_hg_helda, npc_baug, npc_hg_brimir, npc_yorun, npc_hg_orr, npc_hg_heimla], from: "08:00", to: "20:00", at: hh_ice_table, doing: "얼음 탁자 둘째 날 — 아무도 말하지 않고 먹기만 한다. 고기가 한 점씩 돌고 왕은 가장 작은 한 점을 받는다. 노래 거인이 구절 사이에 입을 열지 않는다", fixed: true}
- {id: ev_hg_table_day3, date: "313-01-09", npcs: [npc_hrimnir, npc_skadir, npc_hg_utga, npc_hg_ugra, npc_hg_helda, npc_baug, npc_hg_brimir, npc_yorun, npc_hg_orr], from: "08:00", to: "20:00", at: hh_ice_table, doing: "얼음 탁자 셋째 날 — 답. 돌팔·바위배·눈늑대가죽·돌무릎은 고기를 받고 깊은우물은 거절한다. 왕은 고기를 내놓지 않아 안건이 푸른월로 넘어간다 (클락 3: 결정 미정)", fixed: true}
- {id: ev_hg_jan10_rune, date: "313-01-10", npcs: [npc_hg_inge], from: "06:00", to: "10:00", at: weeping_pass__rune_rock, doing: "서리 길이 열리는 날 — 바위 밑에 서리말 룬으로 첫 무리가 고개를 넘는 날짜를 새긴다. 룬을 읽을 사람은 까마귀 문 이정표에 서 있을 것이다", fixed: true}
- {id: ev_hg_jan10_lodge, date: "313-01-10", npcs: [npc_matusz], from: "10:00", to: "18:00", at: weeping_pass__lodge, doing: "서리 길 개방 첫날 — 산장 문을 활짝 열고 꿀 단지 열 개를 앞에 놓는다"}
- {id: ev_hg_jan12_open_gate, date: "313-01-12", npcs: [npc_hg_sven], from: "03:00", to: "05:00", at: bone_pens__fence, doing: "해빙월 첫 사흘 가운데 하루 — 울타리 바깥문의 빗장을 올려 두고 돌아선다. 올해의 한 무리 마흔이 나간다", fixed: true}
- {id: ev_hg_jan20_sven_ledger, date: "313-01-20", npcs: [npc_hg_sven, npc_hg_utga], from: "10:00", to: "12:00", at: hh__stonefist_hold, doing: "해빙월 머릿수 보고 — 마흔이 '실종'으로 적힌다. 우트가 장부를 한 번 더 넘긴다", travel_from: bone_pens__chief_hut, return_to: bone_pens__chief_hut}
# ── 313 파종월 (2) ──
- {id: ev_hg_feb_harva_scout, date: "313-02-12", npcs: [npc_harva], from: "10:00", to: "14:00", at: crow_gate__frost_road_head, doing: "서리 길 초입 상공을 정찰한다 — 스카디르에게 팔 지도를 눈에 담고 서리비늘이라 말하지 않는다", travel_from: weeping_pass__harva_nest, return_to: weeping_pass__harva_nest, mounted: true}
- {id: ev_hg_feb17_chant, date: "313-02-17", npcs: [npc_hg_heimla, npc_hg_ragna], from: "07:00", to: "12:00", at: hh_song_hall, doing: "노래 한 달 열이레째 — 군데의 구절과 '용이 다시 칼을 쥐면 거인은 먼저 일어선다'가 불린다. 소녀가 입 모양으로만 따라 한다", fixed: true}
- {id: ev_hg_feb20_hammers, date: "313-02-20", npcs: [npc_hg_utga], from: "10:00", to: "18:00", at: hh__stonefist_hold, doing: "돌 망치 이백이 장원 마당에 늘어선다 — 우트가가 수를 센다. 하나가 모자라다고 다시 센다"}
# ── 313 꽃월 (3) — 흰 알 ──
- {id: ev_hg_mar_eye_turns, date: "313-03-05", npcs: [npc_hg_hallgrid, npc_herja], from: "10:00", to: "16:00", at: hh__ice_cave, doing: "얼어 있는 거인의 눈이 한 번 더 남쪽으로 돌아간다 — 두 사람만 그것을 안다"}
- {id: ev_hg_mar_egg_news_pik, date: "313-03-18", npcs: [npc_hg_pik], from: "08:00", to: "17:00", at: hh_krik_stall, doing: "용제국 곡물 상인의 전갈 — 흰 알이 깨졌다는 소문이 서리땅에 닿는다. 재개 조건 줄 옆에 날짜를 적는다"}
- {id: ev_hg_mar_egg_news_hall, date: "313-03-20", npcs: [npc_hrimnir, npc_skadir, npc_hg_skala], from: "08:00", to: "14:00", at: hh_throne_hall, doing: "흰 알 소식 — 용황의 뒤가 이어지면 남침은 용 앞에서 굶는 길이 된다는 왕과, 이어지기 전에 쳐야 한다는 왕자가 같은 식탁에서 말을 아낀다"}
# ── 313 푸른월 (4) — 돌팔의 남침 ──
