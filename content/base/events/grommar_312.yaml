# 그롬마르 붉은 황야 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §16(태양월 대축제·가을 원정·항구 폭풍철), WORLD_BIBLE §8·§10(클락 2 맹약회의 313, 클락 7 초원 통일, 클락 1 흰 알), fac_grom(피의 소집·도전제·태양월 도전), fac_arena_guild(흉터 회의·봉기), fac_hundred_wins(99의 밤), facts/grommar.yaml·phase2_grommar.yaml, docs/world/people/grommar.md.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림. 안식일은 6일째(경기 없음, 밤에 흉터 회의 — 일과의 sabbath 블록).
# 다른 지역과의 연결: 313-03-14 흰 알 부화 소식(바알카르 → 원형장, 아우락스 후원의 그라샤), 313-04-09 서풍의 날 하르칸 서진(말뼈 여울 건너편의 소식),
#   313-05-01~11 맹약회의 313 서약섬(oath_isle): 쇠턱의 보르그와 세이라가 313-04-29 출발 의식 → 05-01 서약섬 도착(그롬마르 항 → 서약섬 40h, '그롬 약탈선 — 맹약회의 휴전 깃발') → 05-12 귀로.
#   우르가쉬는 군주라 모래를 비울 수 없어 가지 않는다 (fac_grom off_great_warlord '맹약회의 313 그롬 대표' 위임 — 보고 참조),
#   313-05-30 태양월 대축제 마지막 날: 하르트의 100승 도전 → 우르크의 의식 → 마라의 공표된 시합 → 해 질 녘 그라샤의 도전 → (조건부) 투사 조합 봉기.
# 100승 경기와 도전의 승수는 이 달력에 숫자로 적지 않는다 — 대진표가 정한다. 목록에서 먼저 맞는 일정이 이긴다.

