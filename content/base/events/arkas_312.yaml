- {id: ev_ar_sep1_needle, date: "312-09-01", npcs: [npc_irene_bold, npc_ar_rail, npc_ar_mathis, npc_corvina], from: "17:30", to: "19:00", at: gt_listening_room, doing: "회귀점의 저녁 6시 — 측정 바늘이 같은 자리에서 튄다. 라일의 손바닥 위에서 둘째 칼이 한 번 차가워지고 이레네가 장부에 '설명되지 않는 기시감. 북쪽.'을 쓴다", fixed: true}
