# 아르카스 탑섬 날짜 일정 — 일과보다 우선한다 (24 §3.2). AS 312 낙엽월 1일 ~ AS 313 수확월.
# 원천: REGIONS §10(관측의 밤·폭풍철·조수 동굴), WORLD_BIBLE §8·§10(클락 2 맹약회의 313: 서약섬 태양월 1~11일, 클락 4 황무지 확장), fac_ashen_tower(계절 첫날 낭독 논문·그믐 일곱 의자), facts/arkas.yaml·phase2_arkas.yaml, docs/world/people/arkas.md.
# 달: 1 해빙 2 파종 3 꽃 4 푸른 5 태양 6 건초 7 수확 8 포도 9 낙엽 10 서리 11 긴밤 12 굶주림 13 재의 날(5일). 굶주림월 폭풍철에는 소금 바닷길 운항이 중지되어 섬이 고립된다.
# 다른 지역과의 연결: 312-09-01 저녁 6시(회귀점) 귀 기울이는 방 바늘 / 312-11-09 피험자 하선(그롬마르 봉화) / 312-13-05 관측의 밤 / 313-03-15 흰 알 부화 — 코르비나의 하늘 기록과 세렌 시렌나의 알 / 313-04-29 탑의 배(이레네·오필)가 서약섬으로(맹약회의 5/1~11), 5/14 귀환, 5/20 '인간 증언' 소식이 서기실에 닿는다 / 매달 1일 오필이 세렌 의회 정기 회기에 오르내린다.
# 시간 민감: 이레네·라일의 기시감 단계는 카드의 deja_vu_steps. 목록에서 먼저 맞는 일정이 이긴다 — 날짜가 정해진 것을 위에, 매달 반복을 아래에. 쉼표가 든 값은 큰따옴표로.

