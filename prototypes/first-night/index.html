<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무혈자의 찬가: 첫 밤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&family=Hahmlet:wght@400;600&family=Nanum+Brush+Script&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: 한 손으로 읽는 세로 한 단. 위 — 시간·장소 띠, 가운데 — 박자 단위 본문, 아래 — 선택지와 몸 상태 띠.
   Palette: 이 화면은 일부러 어두운 한 가지 세계로 고정한다 (그을린 종이 위의 뼈색 잉크, 녹슨 피 하나). */
:root {
  --bg: #121211;
  --bg-2: #1a1a18;
  --panel: #1f1f1c;
  --ink: #d9d1c3;
  --ink-soft: #9a9284;
  --ink-faint: #5f594f;
  --line: #34322d;
  --rust: #c3573f;
  --ash: #7f7a72;
  --gold: #c9b27a;
  --frost: #8fa7b3;
  --pain: #d06a55;
  --ok: #8fae84;
  --font-body: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --font-display: "Song Myung", "Nanum Myeongjo", serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-v-first: "Song Myung", serif;
  --font-v-dara: "Nanum Brush Script", "Gowun Batang", cursive;
  --font-v-self: "Hahmlet", "Gowun Batang", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.75; -webkit-tap-highlight-color: transparent; }
.app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.when { font-family: var(--font-ui); font-size: 0.78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 0; }
.when b { color: var(--ink); font-weight: 600; }
.top .btns { display: flex; gap: 6px; flex: none; }
button { font-family: var(--font-ui); font-size: 0.82rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; cursor: pointer; }
button:hover { border-color: var(--ink-faint); }
button:focus-visible, input:focus-visible, .choice:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
main { flex: 1; display: flex; flex-direction: column; padding-block: 18px 12px; gap: 14px; }
.story { display: flex; flex-direction: column; gap: 16px; }
.beat { display: flex; flex-direction: column; gap: 10px; animation: fadein 220ms ease-out; }
.beat.old { opacity: 0.45; }
.beat p { margin: 0; white-space: pre-line; text-wrap: pretty; }
.beat p em { color: var(--ink-soft); }
.beat .food { font-weight: 700; color: var(--gold); }
.beat .intr { font-size: 0.92rem; color: var(--ink-soft); }
.beat .intr.pain { color: var(--pain); }
.tremor { animation: tremor 160ms infinite; }
.tremor.strong { animation-duration: 90ms; }
@keyframes tremor { 0% { transform: translate(0,0); } 25% { transform: translate(0.4px,-0.3px); } 50% { transform: translate(-0.4px,0.3px); } 75% { transform: translate(0.3px,0.4px); } 100% { transform: translate(0,0); } }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.voice { margin: 0; padding-left: 12px; border-left: 2px solid var(--line); font-size: 1.02rem; }
.voice .who { display: block; font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 2px; }
.voice.first { font-family: var(--font-v-first); color: var(--gold); border-color: #6b5c39; }
.voice.dara { font-family: var(--font-v-dara); color: var(--rust); font-size: 1.35rem; line-height: 1.4; border-color: #6e2f24; }
.voice.self { font-family: var(--font-v-self); color: var(--frost); border-color: #3f525b; }
.lang { font-family: var(--font-body); }
.lang .mask { letter-spacing: 0.05em; color: var(--ink-faint); }
.lang .known { color: var(--ink); text-decoration: underline dotted var(--ink-faint); }
.note { font-family: var(--font-ui); font-size: 0.78rem; color: var(--ink-soft); }
.lexnew { font-family: var(--font-ui); font-size: 0.78rem; color: var(--ok); border: 1px dashed #4a5c45; border-radius: 3px; padding: 4px 8px; align-self: flex-start; }
.paper { background: #2a2620; color: #cbbf9e; border-radius: 2px; padding: 12px 14px; font-family: var(--font-body); font-size: 0.95rem; line-height: 1.8; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); overflow-x: auto; }
.paper .row { white-space: pre; }
.paper .rev { color: var(--gold); font-weight: 700; }
details.echo { border: 1px solid #4b3f2a; background: #1d1912; border-radius: 3px; padding: 8px 10px; font-family: var(--font-ui); font-size: 0.86rem; color: var(--gold); }
details.echo summary { cursor: pointer; list-style: none; }
details.echo summary::before { content: "메아리 — "; color: var(--ink-faint); }
details.echo ol { margin: 8px 0 2px; padding-left: 18px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; }
.result { font-family: var(--font-ui); font-size: 0.8rem; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: 6px; }
.result b { color: var(--ink); }
.result.good b { color: var(--ok); }
.result.bad b { color: var(--rust); }
.continue { align-self: center; font-family: var(--font-ui); font-size: 0.78rem; color: var(--ink-faint); background: none; border: none; padding: 10px 20px; }
.choices { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.choice { text-align: left; font-family: var(--font-body); font-size: 1rem; line-height: 1.5; padding: 11px 13px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.choice:hover { border-color: var(--ink-faint); }
.choice .meta { font-family: var(--font-ui); font-size: 0.74rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
.chip.odds-1 { color: var(--rust); border-color: #5a2a22; }
.chip.odds-2 { color: #d29a5c; }
.chip.odds-3 { color: var(--ink); }
.chip.odds-4 { color: var(--ok); }
.choice.locked { color: var(--ink-faint); border-style: dashed; cursor: not-allowed; }
.choice.locked .why { font-family: var(--font-ui); font-size: 0.74rem; color: var(--ink-soft); }
.oath { border: 1px solid #6b5c39; background: #1c1810; border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.oath h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; color: var(--gold); }
footer.body { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-ui); font-size: 0.74rem; color: var(--ink-soft); }
.meter { display: flex; align-items: center; gap: 6px; }
.bar { display: inline-flex; gap: 2px; }
.bar i { width: 9px; height: 7px; background: var(--line); border-radius: 1px; }
.bar i.on { background: var(--ink-soft); }
.bar.pain i.on { background: var(--pain); }
.bar.fear i.on { background: var(--frost); }
.bar.hunger i.on { background: var(--gold); }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8,8,7,0.92); overflow-y: auto; padding-inline: 16px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 24px; }
.sheet .inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: 1.5rem; }
.person { border-bottom: 1px solid var(--line); padding-bottom: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.person .nm { font-weight: 700; }
.person .ds { font-size: 0.92rem; color: var(--ink-soft); }
.person ul { margin: 2px 0 0; padding-left: 18px; font-size: 0.88rem; }
.person .bond { font-family: var(--font-ui); font-size: 0.74rem; color: var(--gold); }
.row-set { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--font-ui); font-size: 0.86rem; }
.title-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 40px; }
.title-screen h1 { font-family: var(--font-display); font-weight: 400; font-size: 2.4rem; line-height: 1.2; margin: 0; letter-spacing: 0.06em; text-wrap: balance; }
.title-screen .sub { color: var(--ink-soft); max-width: 34em; }
.title-screen .epi { font-family: var(--font-v-first); color: var(--gold); font-size: 1.1rem; }
.name-input { font-family: var(--font-body); font-size: 1.2rem; background: var(--bg-2); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; width: 100%; max-width: 280px; }
.death { position: fixed; inset: 0; z-index: 30; background: #050505; display: flex; align-items: center; justify-content: center; padding: 24px; }
.death canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.death .txt { position: relative; max-width: 30em; text-align: center; font-size: 1.15rem; color: #bdb5a7; }
.chron { border: 1px solid var(--line); background: var(--bg-2); padding: 16px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
.chron h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; }
.chron .life { font-family: var(--font-ui); font-size: 0.78rem; color: var(--ink-soft); }
.chron p { margin: 0; font-size: 0.98rem; }
.wake-first { font-family: var(--font-v-self); color: var(--frost); }
@media (prefers-reduced-motion: reduce) { .tremor { animation: none; } .beat { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top" hidden>
    <div class="when" id="when"></div>
    <div class="btns">
      <button type="button" id="btn-book">인물 수첩</button>
      <button type="button" id="btn-set">설정</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="body" id="bodybar" hidden></footer>
</div>

<section class="sheet" id="sheet-book" hidden aria-label="인물 수첩"><div class="inner" id="book"></div></section>
<section class="sheet" id="sheet-set" hidden aria-label="설정"><div class="inner">
  <h2>설정</h2>
  <div class="row-set"><span>글 연출</span>
    <label><input type="radio" name="fx" value="0" id="fx0"> 끔</label>
    <label><input type="radio" name="fx" value="1" id="fx1" checked> 기본</label>
    <label><input type="radio" name="fx" value="2" id="fx2"> 강하게</label>
  </div>
  <div class="row-set"><label for="snd"><input type="checkbox" id="snd"> 소리 (빗소리·심장 박동)</label></div>
  <div class="row-set"><label for="hap"><input type="checkbox" id="hap" checked> 진동 (지원하는 기기에서)</label></div>
  <div class="row-set"><label for="odds"><input type="checkbox" id="odds"> 체감 대신 실제 확률(%) 보기</label></div>
  <div class="row-set"><button type="button" id="btn-restart">처음부터 다시</button><button type="button" id="btn-close-set">닫기</button></div>
  <p class="note">이 프로토타입은 기획 문서 14~20의 몰입 장치를 실제로 체험하기 위한 것이다: 박자 단위 서술, 몸 상태에 따라 변하는 글, 읽을 수 없는 글과 배우는 말, 전생의 목소리, 맹세, 메아리, 첫 죽음과 다른 몸에서의 각성.</p>
</div></section>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SAVE_KEY = "fantasia_first_night_v1";
const MONTH = "낙엽월";
const HOURS = ["자정", "새벽 1시", "새벽 2시", "새벽 3시", "새벽 4시", "새벽 5시", "새벽 6시", "아침 7시", "아침 8시", "아침 9시", "오전 10시", "오전 11시", "정오", "오후 1시", "오후 2시", "오후 3시", "오후 4시", "오후 5시", "저녁 6시", "저녁 7시", "저녁 8시", "밤 9시", "밤 10시", "밤 11시"];

// ─────────────────────────── 상태 ───────────────────────────
function fresh() {
  return {
    name: "", scene: "name", beat: 0, day: 1, hour: 19, place: "", body: "셋째",
    hunger: 2, pain: 30, painPart: "등", fear: 0,
    skills: { 은신: 15, 기만: 10, 화술: 15, 운동: 20, 맨손: 10, 읽고쓰기: 0 },
    coins: 2, items: ["부츠 속 은화 두 닢"],
    bond: { paine: 0, sara: 1, bram: 1, elsa: 0, egil: 0, osric: 0, hagen: 0 },
    f: {}, lex: [], reveal: [], oath: null, events: [], met: ["paine", "sara", "bram", "znik"],
    awaken: 0, voiceCount: {}, life: 1, alive: true, seed: Math.floor(Math.random() * 1e9),
  };
}
let S = fresh();
const settings = { fx: 1, snd: false, hap: true, odds: false };
try { const raw = localStorage.getItem(SAVE_KEY + "_set"); if (raw) Object.assign(settings, JSON.parse(raw)); } catch (e) {}
function saveSettings() { try { localStorage.setItem(SAVE_KEY + "_set", JSON.stringify(settings)); } catch (e) {} }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function note(text) { S.events.push({ day: S.day, hour: S.hour, text }); }
const stamp = (d, h) => `${MONTH} ${d}일 ${HOURS[h]}`;

// ───────────────────────── 콘텐츠 도우미 ─────────────────────────
const V = (who, t, minAwaken = 0) => ({ k: "voice", who, t, minAwaken });
const L = (lang, words, note) => ({ k: "lang", lang, words, note });
const R = (rows) => ({ k: "read", rows });
const E = (title, thread) => ({ k: "echo", title, thread });
const N = (t) => ({ k: "note", t });
const LEX = (word, how) => ({ k: "lex", word, how });
const VOICE_NAME = { first: "누군가", dara: "낮고 거친 목소리", self: "" };
const VOICE_CLASS = { first: "first", dara: "dara", self: "self" };
const FOOD = ["빵", "귀리죽", "죽", "국자", "냄새", "고기", "수프"];
const LIST_ROWS = ["세렌 상관 세베로 인수 명단", "회색여울 농노 서른한 명", " 1. 사라 — 스물, 하녀, 흠 없음", " 2. 토비 — 서른넷, 방앗간, 손가락 둘 없음", "   …", "17. 셋째 — 열일곱, 건강함, 등에 채찍 자국", "   …", "인도: 낙엽월 4일 새벽, 여울강 나루"];

// ─────────────────────────── 장면 ───────────────────────────
const SC = {};

SC.ration = {
  time: [1, 19], place: "배급 막사 앞 · 비",
  enter() { S.hunger = 2; S.pain = 30; S.painPart = "등"; },
  beats: [
    ["비가 사흘째 그치지 않는다. 배급 막사 '절름발이 수탉' 앞으로 젖은 줄이 마을 끝까지 늘어서 있다.", "오늘 배급은 귀리죽 한 국자와 검은 빵 반 덩이. 빵 냄새가 빗속에서도 난다."],
    ["감독관 즈닉이 줄을 따라 걷는다. 회색 피부의 크릭, 키는 당신 허리께. 손에 든 채찍만은 당신 키만 하다.", "오후에 그 채찍이 당신 등을 세 번 갈랐다. 이유는 기억나지 않는다. 즈닉도 기억하지 못할 것이다."],
    [L("용언", ["짐승들,", "줄", "똑바로", "서!"], "즈닉은 용언으로 소리친다. 주인들의 말을 쓰면 자기가 조금 높아진다고 믿는다.")],
    ["빵을 받아 든 순간, 작은 손이 소매를 잡는다. 페인이다. 열여섯, 마을에서 제일 마른 고아.", "오늘 배급을 놓쳤다고 했다. 밀수꾼 하겐의 심부름을 하느라 줄에 서지 못했다고.", "페인은 아무 말도 하지 않는다. 빵만 본다."],
    [V("first", "나눠라. 굶주린 아이는 오래 기억한다.")],
  ],
  choices: [
    { t: "빵 반쪽을 떼어 페인에게 준다", fx() { S.bond.paine += 3; S.f.bread = "shared"; note("배급 줄에서 페인에게 빵 반쪽을 나눠주었다"); }, go: "tavern" },
    { t: "못 본 척하고 빵을 먹는다", fx() { S.hunger = 1; S.bond.paine -= 1; S.f.bread = "ignored"; note("배급 줄에서 굶은 페인을 못 본 척했다"); }, go: "tavern" },
    { t: "페인의 손을 뿌리치고, 그 애가 주운 부스러기까지 빼앗는다", fx() { S.hunger = 1; S.bond.paine -= 4; S.f.bread = "stole"; note("배급 줄에서 페인의 빵 부스러기를 빼앗았다"); }, go: "tavern", voice: V("dara", "잘했다. 약한 것부터 먹는 거다.") },
  ],
};

SC.tavern = {
  time: [1, 20], place: "배급 막사 '절름발이 수탉' · 비",
  beats: [
    [() => ({ shared: "페인은 빵을 품에 넣고 사라졌다. 고맙다는 말은 없었다. 이 마을에서 고맙다는 말은 사치다.", ignored: "페인은 잠시 당신을 보다가 빗속으로 사라졌다.", stole: "페인의 눈이 당신을 오래 보았다. 울지도 않았다. 그리고 사라졌다." }[S.f.bread])],

// ─────────────────────────── 오디오·진동 ───────────────────────────
let ac = null, rainGain = null, heartTimer = null, hapTimer = null;
function audioOn() {
  if (!settings.snd) return;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 3.2 + w * 0.08; }
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
      rainGain = ac.createGain(); rainGain.gain.value = 0.0;
      src.connect(lp).connect(rainGain).connect(ac.destination); src.start();
    }
    ac.resume();
    rainGain.gain.setTargetAtTime(0.18, ac.currentTime, 1.2);
  } catch (e) {}
}
function audioOff() { try { if (rainGain) rainGain.gain.setTargetAtTime(0, ac.currentTime, 0.4); } catch (e) {} stopHeart(); }
function thump(t, vol) {
  if (!ac || !settings.snd) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.25);
}
function startHeart(period) {
  stopHeart();
  const beat = () => { if (ac && settings.snd) { const t = ac.currentTime + 0.02; thump(t, 0.5); thump(t + 0.16, 0.35); } if (settings.hap && navigator.vibrate) navigator.vibrate([40, 120, 40]); };
  beat(); heartTimer = setInterval(beat, period);
}
function stopHeart() { if (heartTimer) clearInterval(heartTimer); heartTimer = null; }
function haptic(kind) {
  const can = settings.hap && navigator.vibrate;
  if (kind === "whip") { if (can) navigator.vibrate(30); if (ac && settings.snd) { const t = ac.currentTime; const n = ac.createBufferSource(); const b = ac.createBuffer(1, ac.sampleRate * 0.12, ac.sampleRate); const dd = b.getChannelData(0); for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 3); n.buffer = b; const g = ac.createGain(); g.gain.value = 0.5; n.connect(g).connect(ac.destination); n.start(t); } }
  if (kind === "heartStart") startHeart(S.fear >= 3 ? 520 : 900);
  if (kind === "stop") stopHeart();
}

const PAIN_LINES = { 등: ["(등이 욱신거린다)", "(갈라진 등 위로 옷이 달라붙는다)"], 손목: ["(손목의 밧줄 자국이 쓰라리다)"], 발바닥: ["(갈라진 발바닥이 욱신거린다)"] };

function band(p) {

function perceived(p, skill) {

    ${S.f.volk_suspects ? "<p>볼크 회색송곳니는 냄새를 기억했다. 그는 이제 당신을 사냥한다 — 몸이 바뀌어도.</p>" : ""}
    ${S.f.vengeance_seed ? "<p>하겐은 아직 웃고 있다. 오래 웃지는 못할 것이다.</p>" : ""}
    <p class="note">이 짧은 밤에 들어 있던 장치: 박자 단위 서술 · 몸 상태(허기·통증·공포)가 바꾸는 글 · 읽을 수 없는 명단 · 배우는 말(용언) · 전생의 목소리 · 맹세 · 메아리 · 체감 확률과 잠긴 선택지 · 첫 죽음 · 연대기 · 인연을 따라 다른 몸에서의 각성.</p>`;
  main.appendChild(box);
  renderEndButtons();
  save();
}

// ─────────────────────────── 인물 수첩 ───────────────────────────
const PEOPLE = {
  paine: ["페인", "열여섯, 고아. 밀수꾼 하겐의 심부름꾼.", () => [S.f.bread === "shared" ? "배급 줄에서 빵 반쪽을 나눠주었다." : null, S.f.bread === "stole" ? "배급 줄에서 그의 빵 부스러기를 빼앗았다." : null, S.f.warned ? "하겐이 볼크와 만나는 것을 보았다고 알려주었다. (목격)" : null]],
  sara: ["사라", "스물, 레이번 성채 하녀.", () => ["매각 명단을 가져왔다. 명단 첫 줄에 그녀의 이름이 있다.", S.oath === "sara" || S.oath === "all" ? "그녀를 지키겠다고 맹세했다. 그녀가 증인이다." : null]],
  bram: ["브람", "쉰둘, 배급 막사 관리인.", () => [S.f.burned ? "불타는 명단을 맨손으로 꺼냈다." : null, S.met.includes("egil") ? "지하실에 북방 아이 에길을 숨기고 있다. (목격)" : "지하에 무언가를 숨긴다는 소문. (소문)"]],
  znik: ["즈닉", "크릭 감독관. 채찍.", () => [S.f.bribed_znik ? "은화 한 닢을 받았다. 그는 이 은화를 기억할 것이다." : null, "용언으로 소리친다."]],
  osric: ["오스릭", "예순일곱, 순종의 빛 사제. 마을에서 유일하게 글을 아는 인간.", () => ["명단을 읽어주었다. 늪길을 아는 엘사를 알려주었다."]],
  elsa: ["엘사", "일흔, 약초 노파. 늪에서 왔다.", () => ["늪길과 암호를 알려주었다. '여울은 얕은가? — 얕아도 차갑다.'", S.f.asked_isol ? "탑의 순례자 이졸이 '돌아오는 이'를 찾는다고 했다." : "탑의 순례자 이졸을 조심하라고 했다."]],
  hagen: ["하겐", "스물아홉, 밀수꾼. 웃는다.", () => [S.f.paid_hagen ? "은화를 받고 배를 약속했다." : null, S.f.warned ? "볼크와 술을 마셨다. (페인의 말)" : null]],
  egil: ["에길", "아홉 살, 북방 탈주자의 아이. 브람의 지하실.", () => [S.f.egil ? "데려가기로 했다." : "데려가지 않았다."]],
  volk: ["볼크 회색송곳니", "바르그. 노예사냥 조합장.", () => [S.f.volk_suspects ? "새 몸의 냄새를 맡고 고개를 갸웃했다." : null, "냄새를 잊지 않는다고들 한다. (소문)"]],
};
function renderBook() {
  const met = [...new Set(S.met)];
  $("book").innerHTML = `<h2>인물 수첩</h2><p class="note">당신이 아는 것만 적혀 있다. (목격)은 직접 본 것, (소문)은 들은 것.</p>` + met.map((id) => {
    const p = PEOPLE[id]; if (!p) return "";
    const facts = p[2]().filter(Boolean);
    const bond = S.bond[id];
    return `<div class="person"><span class="nm">${esc(p[0])}</span><span class="ds">${esc(p[1])}</span>${bond != null ? `<span class="bond">인연 ${"●".repeat(Math.max(0, Math.min(5, bond)))}${"○".repeat(Math.max(0, 5 - Math.max(0, Math.min(5, bond))))}${bond < 0 ? " · 원한" : ""}</span>` : ""}<ul>${facts.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  }).join("") + `<div class="row-set"><button type="button" id="btn-close-book">닫기</button></div>`;
  $("btn-close-book").addEventListener("click", () => { $("sheet-book").hidden = true; });
}

// ─────────────────────────── 시작 화면 ───────────────────────────
function renderTitle() {
  $("top").hidden = true; $("bodybar").hidden = true;
  const saved = load();
  main.innerHTML = `<div class="title-screen">
    <div class="epi">"너희는 끝나지 않을 것이다."</div>
    <h1>무혈자의 찬가<br>첫 밤</h1>
    <p class="sub">붕괴력 312년 낙엽월. 용제국 북쪽 끝, 회색여울. 당신은 용인 남작의 농노다. 글을 모르고, 이름을 가질 수 없고, 사흘 뒤 팔려간다.</p>
    <p class="note">15~25분 분량의 프로토타입. 소리는 설정에서 켤 수 있다. 진행은 자동으로 기록된다.</p>
    <div class="row-set">
      ${saved && saved.scene && saved.scene !== "name" ? '<button type="button" id="btn-continue">이어하기</button>' : ""}
      <button type="button" id="btn-new">새로 시작</button>
      <label for="snd0"><input type="checkbox" id="snd0" ${settings.snd ? "checked" : ""}> 소리 켜기</label>
    </div>
  </div>`;
  $("snd0").addEventListener("change", (e) => { settings.snd = e.target.checked; $("snd").checked = settings.snd; saveSettings(); });
  $("btn-new").addEventListener("click", () => { S = fresh(); if (settings.snd) audioOn(); renderName(); });
  if ($("btn-continue")) $("btn-continue").addEventListener("click", () => { S = saved; if (settings.snd) audioOn(); if (["chronicle", "soul", "demo_end"].includes(S.scene) || SC[S.scene].death) { enterScene(S.scene === "demo_end" ? "demo_end" : SC[S.scene].death ? "chronicle" : S.scene); } else enterScene(S.scene); });
}
function renderName() {
  main.innerHTML = `<div class="title-screen">
    <p>어머니는 죽기 전, 아무도 듣지 못하게 당신의 귀에 이름 하나를 불어넣었다.</p>
    <p>주인은 당신을 <b>셋째</b>라 부른다. 그 이름은 아무에게도 말한 적이 없다.</p>
    <label for="nm" class="note">어머니가 지어준 진짜 이름</label>
    <input class="name-input" id="nm" maxlength="8" autocomplete="off" placeholder="예: 리안">
    <div class="row-set"><button type="button" id="btn-go">눈을 뜬다</button></div>
  </div>`;
  $("nm").focus();
  const go = () => { S.name = ($("nm").value || "").trim() || "리안"; enterScene("ration"); };
  $("btn-go").addEventListener("click", go);
  $("nm").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}
function restart() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} stopHeart(); S = fresh(); $("sheet-set").hidden = true; renderName(); }

// ─────────────────────────── 설정·버튼 ───────────────────────────
$("btn-book").addEventListener("click", () => { renderBook(); $("sheet-book").hidden = false; });
$("btn-set").addEventListener("click", () => { $("sheet-set").hidden = false; });
$("btn-close-set").addEventListener("click", () => { $("sheet-set").hidden = true; });
$("btn-restart").addEventListener("click", restart);
[0, 1, 2].forEach((v) => { const r = $("fx" + v); r.checked = settings.fx === v; r.addEventListener("change", () => { settings.fx = v; saveSettings(); }); });
$("snd").checked = settings.snd; $("hap").checked = settings.hap; $("odds").checked = settings.odds;
$("snd").addEventListener("change", (e) => { settings.snd = e.target.checked; saveSettings(); settings.snd ? (audioOn(), syncHeart()) : audioOff(); });
$("hap").addEventListener("change", (e) => { settings.hap = e.target.checked; saveSettings(); });
$("odds").addEventListener("change", (e) => { settings.odds = e.target.checked; saveSettings(); });

main.addEventListener("click", (e) => {
  if (e.target.closest("button, details, input, label, a")) return;
  const c = main.querySelector(".continue");
  if (c) c.click();
});
renderTitle();
})();
</script>
</body>
</html>
